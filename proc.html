<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RAAS 升压链条</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:#eef2f7;
    font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;
    color:#1e293b}
  .wrap{max-width:520px;margin:0 auto;padding:10px 12px 20px}
  .top{display:flex;align-items:center;gap:8px;margin:2px 0 10px}
  .back{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:#475569;
    text-decoration:none;background:#fff;border:1px solid #dbe4ee;border-radius:999px;
    padding:6px 13px}
  .back:active{background:#f1f5f9}
  .spacer{flex:1}

  .stage{background:#fff;border-radius:16px;padding:6px 6px 2px;
    box-shadow:0 1px 3px rgba(15,23,42,.06),0 8px 24px rgba(15,23,42,.05);
    overflow:hidden}
  .stage svg{display:block;width:100%;height:auto}

  /* ---------------- 控制条 */
  .ctrl{margin-top:10px;background:#fff;border-radius:16px;padding:12px 14px 11px;
    box-shadow:0 1px 3px rgba(15,23,42,.06),0 8px 24px rgba(15,23,42,.05)}
  .rowline{display:flex;justify-content:space-between;align-items:baseline;
    gap:10px;margin-bottom:10px;min-height:20px}
  .rowline #phaseName{font-size:13.5px;font-weight:700;color:#0f766e;
    letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rowline .tt{font-size:11px;color:#a8b6c4;font-variant-numeric:tabular-nums;
    white-space:nowrap;flex:0 0 auto}
  .rowline .tt b{color:#64748b;font-weight:700}

  /* 进度条：加粗到 8px，触控更友好 */
  .bar{position:relative;height:24px;margin:0 0 12px;clear:both}
  .bar .track{position:absolute;left:0;right:0;top:10px;height:5px;border-radius:3px;
    background:#e8eff6}
  .bar .fill{position:absolute;left:0;top:10px;height:5px;border-radius:3px;
    background:#0f766e;width:0%}
  .bar .marks{position:absolute;left:0;right:0;top:0;height:24px}
  .bar .mk{position:absolute;top:8px;width:1.5px;height:9px;background:#c3d2e0;
    border-radius:1px;transform:translateX(-.75px)}
  .bar .knob{position:absolute;top:6px;width:13px;height:13px;border-radius:50%;
    background:#0f766e;transform:translateX(-6.5px);
    box-shadow:0 0 0 3px rgba(15,118,110,.12)}
  .bar input[type=range]{position:absolute;inset:0;width:100%;height:24px;
    margin:0;opacity:0;cursor:pointer}

  /* 主控行：上一步 / 播放 / 下一步 ｜ 倍速 */
  .btns{display:flex;align-items:center;gap:7px}
  button{font-family:inherit;border:none;background:#f1f5f9;color:#334155;
    border-radius:11px;font-weight:600;cursor:pointer;
    transition:background .15s,transform .1s}
  button:active{transform:scale(.96)}
  button.step{flex:0 0 46px;padding:10px 0;font-size:13px;color:#7c8b9c}
  button.play{flex:1;padding:10px 0;font-size:15px;background:#0f766e;color:#fff;
    box-shadow:0 2px 8px rgba(15,118,110,.26)}
  button.play:active{background:#115e59}


  .hint{margin-top:9px;font-size:10.5px;color:#c3ccd6;text-align:center;letter-spacing:.2px}
  .kbd{display:inline-block;padding:0 4px;margin:0 1px;border:1px solid #e3ebf3;
    border-radius:3px;background:#f8fafc;color:#a8b6c4;font-size:10px}
</style>
</head>

ze="11" fill="#a8b6c4" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">因为</text><text x="78" y="326" font-size="12.5" fill="#6b7c8d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">肺毛细血管内皮的 ACE 切掉末端二肽</text><text x="40" y="362" font-size="11" fill="#c1440e" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">所以</text><text x="78" y="362" font-size="14.5" fill="#c1440e" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">八肽血管紧张素 Ⅱ —— 唯一有活性者</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.655;0.6556;0.85;0.8506;1" dur="10.8s" repeatCount="indefinite"/><rect x="22" y="301" width="3" height="90" fill="#c0392b" opacity="0.85"/><text x="40" y="326" font-size="11" fill="#a8b6c4" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">因为</text><text x="78" y="326" font-size="12.5" fill="#6b7c8d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">血管平滑肌收缩 ＋ 醛固酮促 Na⁺ 重吸收</text><text x="40" y="362" font-size="11" fill="#c0392b" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">所以</text><text x="78" y="362" font-size="14.5" fill="#c0392b" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">外周阻力↑ 且 血容量↑，两者相乘</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.85;0.8506;1" dur="10.8s" repeatCount="indefinite"/><rect x="22" y="301" width="3" height="90" fill="#2f8f57" opacity="0.85"/><text x="40" y="326" font-size="11" fill="#a8b6c4" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">因为</text><text x="78" y="326" font-size="12.5" fill="#6b7c8d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">阻力 × 容量双升，肾灌注压回到正常</text><text x="40" y="362" font-size="11" fill="#2f8f57" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">所以</text><text x="78" y="362" font-size="14.5" fill="#2f8f57" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">肾素释放被抑制，系统自动停机</text></g><text x="22" y="424" font-size="11" fill="#a8b6c4" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">收缩压 mmHg</text><rect x="22" y="430" width="344" height="7" rx="3.5" fill="#eef4f9"/><path d="M215.5,424 V444" stroke="#2f8f57" stroke-width="1.6" stroke-dasharray="3 3" opacity="0.9"/><text x="215.5" y="458" text-anchor="middle" font-size="11" fill="#2f8f57" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">120</text><path d="M86.5,426 V442" stroke="#2c5f9e" stroke-width="1.4" opacity="0.4"/><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.15;0.1506;1" dur="10.8s" repeatCount="indefinite"/><rect x="86.5" y="430" width="1.0" height="7" rx="3.5" fill="#2c5f9e" opacity="0.85"/><circle cx="86.5" cy="433.5" r="6" fill="#ffffff" stroke="#2c5f9e" stroke-width="2.4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.15;0.1506;0.295;0.2956;1" dur="10.8s" repeatCount="indefinite"/><rect x="86.5" y="430" width="1.0" height="7" rx="3.5" fill="#0f766e" opacity="0.85"/><circle cx="86.5" cy="433.5" r="6" fill="#ffffff" stroke="#0f766e" stroke-width="2.4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.295;0.2956;0.475;0.4756;1" dur="10.8s" repeatCount="indefinite"/><rect x="86.5" y="430" width="1.0" height="7" rx="3.5" fill="#a8791a" opacity="0.85"/><circle cx="86.5" cy="433.5" r="6" fill="#ffffff" stroke="#a8791a" stroke-width="2.4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.475;0.4756;0.655;0.6556;1" dur="10.8s" repeatCount="indefinite"/><rect x="86.5" y="430" width="21.5" height="7" rx="3.5" fill="#c1440e" opacity="0.85"/><circle cx="108.0" cy="433.5" r="6" fill="#ffffff" stroke="#c1440e" stroke-width="2.4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.655;0.6556;0.85;0.8506;1" dur="10.8s" repeatCount="indefinite"/><rect x="86.5" y="430" width="225.8" height="7" rx="3.5" fill="#c0392b" opacity="0.85"/><circle cx="312.2" cy="433.5" r="6" fill="#ffffff" stroke="#c0392b" stroke-width="2.4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.85;0.8506;1" dur="10.8s" repeatCount="indefinite"/><rect x="86.5" y="430" width="172.0" height="7" rx="3.5" fill="#2f8f57" opacity="0.85"/><circle cx="258.5" cy="433.5" r="6" fill="#ffffff" stroke="#2f8f57" stroke-width="2.4"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.15;0.1506;1" dur="10.8s" repeatCount="indefinite"/><text x="458" y="446" text-anchor="end" font-size="30" font-weight="700" fill="#2c5f9e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">96</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.15;0.1506;0.295;0.2956;1" dur="10.8s" repeatCount="indefinite"/><text x="458" y="446" text-anchor="end" font-size="30" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">96</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.295;0.2956;0.475;0.4756;1" dur="10.8s" repeatCount="indefinite"/><text x="458" y="446" text-anchor="end" font-size="30" font-weight="700" fill="#a8791a" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">96</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.475;0.4756;0.655;0.6556;1" dur="10.8s" repeatCount="indefinite"/><text x="458" y="446" text-anchor="end" font-size="30" font-weight="700" fill="#c1440e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">100</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.655;0.6556;0.85;0.8506;1" dur="10.8s" repeatCount="indefinite"/><text x="458" y="446" text-anchor="end" font-size="30" font-weight="700" fill="#c0392b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">138</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.85;0.8506;1" dur="10.8s" repeatCount="indefinite"/><text x="458" y="446" text-anchor="end" font-size="30" font-weight="700" fill="#2f8f57" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">128</text></g></svg></div>

  <div class="ctrl">
    <div class="rowline">
      <span id="phaseName">—</span>
      <span class="tt"><b id="tcur">0.0</b> / 10.8s</span>
    </div>

    <div class="bar">
      <div class="track"><div class="fill" id="fill"></div></div>
      <div class="marks" id="marks"></div>
      <div class="knob" id="knob"></div>
      <input type="range" id="seek" min="0" max="1000" value="0" aria-label="进度">
    </div>

    <div class="btns">
      <button id="prev" class="step">◀</button>
      <button class="play" id="play">▶</button>
      <button id="next" class="step">▶</button>

    </div>
    <div class="hint">空格 播放/暂停　<span class="kbd">←</span><span class="kbd">→</span> 切换步骤</div>
  </div>
</div>
</div>

<script>
(function(){
  const CYC = 10.8;
  const STEPS = [0.0, 1.62, 3.186, 5.13, 7.074, 9.18];          // 每步起始秒
  const NAMES = ["血压下降", "肾素释放", "剪掉四肽", "ACE 再剪", "双通路起效", "负反馈"];
  const svg = document.querySelector('#stage svg');
  const fill = document.getElementById('fill');
  const knob = document.getElementById('knob');
  const seek = document.getElementById('seek');
  const tcur = document.getElementById('tcur');
  const phaseName = document.getElementById('phaseName');
  const marks = document.getElementById('marks');

  // 进度条上的分步刻度
  STEPS.slice(1).forEach(t=>{
    const d=document.createElement('i');
    d.className='mk';
    d.style.left=(t/CYC*100)+'%';
    marks.appendChild(d);
  });

  let t = 0, playing = false, last = 0, raf = null;

  svg.pauseAnimations();
  svg.setCurrentTime(0);

  function stepIndex(tt){
    let k = 0;
    for (let i=0;i<STEPS.length;i++) if (tt + 1e-3 >= STEPS[i]) k = i;
    return k;
  }

  function paint(){
    const pct = (t / CYC) * 100;
    fill.style.width = pct + '%';
    knob.style.left = pct + '%';
    seek.value = Math.round((t / CYC) * 1000);
    tcur.textContent = t.toFixed(1);
    const k = stepIndex(t);
    phaseName.textContent = (k+1) + '. ' + NAMES[k];
  }

  function apply(){                       // 把 t 写进 SVG
    // 用 setCurrentTime 必须处于暂停态，否则会被内部时钟覆盖
    svg.setCurrentTime(t % CYC);
  }

  function loop(now){
    if (!playing) return;
    if (!last) last = now;
    const dt = (now - last) / 1000;
    last = now;
    t += dt;
    if (t >= CYC) t = 0;                  // 整段循环
    apply(); paint();
    raf = requestAnimationFrame(loop);
  }

  function play(){
    playing = true;
    document.getElementById('play').textContent = '❚❚';
    last = 0;
    raf = requestAnimationFrame(loop);
  }
  function pause(){
    playing = false;
    document.getElementById('play').textContent = '▶';
    if (raf) cancelAnimationFrame(raf);
    raf = null;
  }

  document.getElementById('play').onclick = ()=> playing ? pause() : play();

  const EPS = 0.01;                        // 跨过 SMIL 硬切换边界

  document.getElementById('prev').onclick = ()=>{
    const k = stepIndex(t);
    const nt = (t - STEPS[k] < 0.35 && k > 0) ? STEPS[k-1] : STEPS[k];
    t = Math.min(nt + EPS, CYC - 0.02);
    apply(); paint();
  };
  document.getElementById('next').onclick = ()=>{
    const k = stepIndex(t);
    if (k >= STEPS.length - 1){
      t = 0;                               // 最后一步 → 回到开头
    } else {
      t = Math.min(STEPS[k+1] + EPS, CYC - 0.02);
    }
    apply(); paint();
  };

  seek.oninput = ()=>{
    t = (seek.value / 1000) * CYC;
    apply(); paint();
  };



  document.addEventListener('keydown', e=>{
    if (e.code === 'Space'){ e.preventDefault(); playing ? pause() : play(); }
    if (e.code === 'ArrowRight'){ e.preventDefault(); document.getElementById('next').click(); }
    if (e.code === 'ArrowLeft'){ e.preventDefault(); document.getElementById('prev').click(); }
  });

  apply(); paint();
})();
</script>
