<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>交互式过程演示</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:#eef2f7;color:#1e293b;
    font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}
  .wrap{max-width:520px;margin:0 auto;padding:10px 12px 28px}
  .top{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:2px 0 12px}
  .back{display:inline-flex;align-items:center;min-height:34px;padding:0 13px;
    font-size:12.5px;color:#475569;text-decoration:none;background:#fff;
    border:1px solid #dbe4ee;border-radius:999px}
  .back:active{background:#f1f5f9}
  h1{font-size:19px;margin:2px 0 4px}
  .sub{font-size:12.5px;color:#8095a8;margin-bottom:12px}
  /* 主题切换 */
  .chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;min-height:36px;padding:0 14px;border-radius:11px;
    background:#fff;border:1px solid #dbe4ee;color:#4a5a6b;font-size:13px;
    font-weight:600;cursor:pointer}
  .chip.on{background:#0f766e;color:#fff;border-color:#0f766e}
  .chip small{font-weight:400;opacity:.7;margin-left:4px}
  /* 卡片 */
  .stage{display:none;background:#fff;border-radius:16px;padding:8px 8px 4px;
    box-shadow:0 1px 3px rgba(15,23,42,.06),0 10px 28px rgba(15,23,42,.06)}
  .stage.on{display:block}
  .stage svg{display:block;width:100%;height:auto}
  .desc{font-size:12.5px;color:#8095a8;text-align:center;margin:6px 4px 8px}
  .tip{margin-top:10px;padding:8px 10px;background:#fff;border-radius:10px;
    font-size:11.5px;color:#a8b6c4;text-align:center;line-height:1.5}
  
.smctl{display:flex;align-items:center;gap:6px;margin:8px 2px 2px;
  padding:6px 8px;background:#f6fafc;border:1px solid #e3ebf3;border-radius:9px}
.smbtn{flex:0 0 auto;min-width:34px;height:30px;padding:0 9px;
  font:600 13px/30px -apple-system,'PingFang SC',sans-serif;
  color:#3f5468;background:#fff;border:1px solid #dbe6f0;border-radius:8px;
  cursor:pointer;-webkit-tap-highlight-color:transparent;transition:all .15s}
.smbtn:active{transform:scale(.95)}
.smbtn.on{background:#0f766e;color:#fff;border-color:#0f766e}
.smctl .smlab{flex:1 1 auto;text-align:right;font-size:11px;color:#a8b6c4}

</style>
</head>

<script>
/* ===== SMIL 播放控件（暂停 / 变速 / 步进 / 重置） ===== */
(function (global) {
  var SPEEDS = [0.5, 1, 1.5];

  function makeBar(svg) {
    var wrap = document.createElement('div');
    wrap.className = 'smctl';

    function btn(txt, title) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'smbtn';
      b.textContent = txt;
      if (title) b.title = title;
      return b;
    }

    var bPrev = btn('‹', '上一相位');
    var bPlay = btn('⏸', '暂停 / 继续');
    var bNext = btn('›', '下一相位');
    var bSpeed = btn('1×', '点击切换 0.5× / 1× / 1.5×');
    var bReset = btn('↺', '回到开头');

    // 相位切分：从 SVG 里的 <animate> 收集 keyTimes 边界
    // 主周期 = 所有 dur 里最大的那个（标题淡入 0.55s 不是周期）
    var dur = parseFloat(svg.getAttribute('data-dur') || '0');
    if (!dur) {
      var mx = 0;
      svg.querySelectorAll('animate[dur]').forEach(function (a) {
        var v = parseFloat(a.getAttribute('dur')) || 0;
        if (v > mx) mx = v;
      });
      dur = mx || 10;
    }

    // 相位点：只取「dur 等于主周期」的 animate，且剔除两端
    var marks = [0];
    try {
      svg.querySelectorAll('animate[dur]').forEach(function (a) {
        var v = parseFloat(a.getAttribute('dur')) || 0;
        if (Math.abs(v - dur) > 0.01) return;          // 跳过短动画
        var kt = (a.getAttribute('keyTimes') || '').trim();
        if (!kt) return;
        kt.split(';').forEach(function (x) {
          var q = parseFloat(x);
          if (!isNaN(q) && q > 0.02 && q < 0.98) marks.push(q);
        });
      });
    } catch (e) { }
    // 去重：把「硬切换对」（相差 <0.01）合成一个点，保留真实相位
    marks.sort(function (a, b) { return a - b; });
    var uniq = [0];
    marks.forEach(function (m) {
      var last = uniq[uniq.length - 1];
      if (m - last > 0.01) uniq.push(m);       // 只合并硬切换对
    });
    if (uniq.length < 2) uniq = [0, 0.5, 1];
    if (uniq[uniq.length - 1] < 0.98) uniq.push(1);

    var t = 0, playing = true, speed = 1, last = 0, raf = null;

    function paint() {
      bPlay.textContent = playing ? '⏸' : '▶';
      bPlay.classList.toggle('on', playing);
      bSpeed.textContent = speed + '×';
    }

    // 关键：让 SVG 永久处于「手动模式」——先 pause，之后只靠 setCurrentTime
    function manualMode() {
      try {
        if (!svg.animationsPaused()) svg.pauseAnimations();
      } catch (e) { }
    }

    function apply() {
      manualMode();
      try { svg.setCurrentTime(t % dur); } catch (e) { }
    }

    function loop(now) {
      if (!playing) return;
      if (!last) last = now;
      var dt = (now - last) / 1000;
      last = now;
      t += dt * speed;
      if (t >= dur) t -= dur;
      apply();
      if (paintLab) paintLab();
      raf = requestAnimationFrame(loop);
    }

    function play() {
      playing = true;
      last = 0;
      raf = requestAnimationFrame(loop);
      paint();
    }

    function pause() {
      playing = false;
      if (raf) cancelAnimationFrame(raf);
      raf = null;
      apply();          // 停在当前 t
      paint();
    }

    bPlay.onclick = function () { playing ? pause() : play(); };

    function step(dir) {
      pause();
      // 用最近相位点作基准（避免因 t 落在两相位之间而一次跳两格）
      var best = 0, bestd = 1e9;
      for (var i = 0; i < uniq.length; i++) {
        var d = Math.abs(t / dur - uniq[i]);
        if (d < bestd) { bestd = d; best = i; }
      }
      var ni = Math.max(0, Math.min(best + dir, uniq.length - 1));
      // 加 12ms 跨过硬切换边界（1ms 级）
      t = Math.min(uniq[ni] * dur + 0.012, dur - 0.002);
      apply();
      paint();
    }

    bPrev.onclick = function () { step(-1); };
    bNext.onclick = function () { step(1); };

    bSpeed.onclick = function () {
      var i = SPEEDS.indexOf(speed);
      speed = SPEEDS[(i + 1) % SPEEDS.length];
      last = 0;
      paint();
    };

    bReset.onclick = function () {
      pause();          // 先停，避免 rAF 又把 t 推走
      t = 0;
      apply();
      paint();
    };

    // 初始化：手动模式 + 停在 0，然后自动开始播放
    manualMode();
    t = 0;
    apply();
    playing = false;
    paint();
    play();

    var lab = document.createElement('span');
    lab.className = 'smlab';

    function paintLab() {
      var now = t / dur;
      // uniq 是相位边界（含末尾 1）；步数 = 边界数 - 1
      var nStep = Math.max(uniq.length - 1, 1);
      var i = 0;
      for (var k = 0; k < uniq.length - 1; k++) {
        if (now >= uniq[k] - 1e-6) i = k;
      }
      lab.textContent = '第 ' + (i + 1) + ' / ' + nStep + ' 步';
    }
    var _paint = paint;
    paint = function () { _paint(); paintLab(); };

    [bPrev, bPlay, bNext, bSpeed, bReset].forEach(function (b) {
      wrap.appendChild(b);
    });
    wrap.appendChild(lab);
    return wrap;
  }

  function initAll(root) {
    (root || document).querySelectorAll('.motion').forEach(function (box) {
      if (box.dataset.smctl) return;
      var svg = box.querySelector('svg');
      if (!svg || !svg.pauseAnimations) return;
      box.dataset.smctl = '1';
      var bar = makeBar(svg);
      box.appendChild(bar);
    });
  }

  global.initSmilCtl = initAll;
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () { initAll(); });
  } else {
    initAll();
  }
})(window);
</script>
</body>
</html>
