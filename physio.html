\"13.5\" font-weight=\"700\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">慢</text><text x=\"27.0\" y=\"145.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">进细胞 → 核受体 → 调控基因转录</text><rect x=\"15.0\" y=\"156.0\" width=\"300.0\" height=\"42.0\" rx=\"6\" fill=\"#fee2e2\" stroke=\"#b91c1c\" stroke-width=\"1.5\"/><text x=\"27.0\" y=\"176.0\" text-anchor=\"start\" font-size=\"14\" font-weight=\"700\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">甲状腺激素</text><text x=\"305.0\" y=\"176.0\" text-anchor=\"end\" font-size=\"13.5\" font-weight=\"700\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">慢</text><text x=\"27.0\" y=\"193.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">同核受体，但需转运体进入细胞</text><rect x=\"15.0\" y=\"208.0\" width=\"300.0\" height=\"150.0\" rx=\"7\" fill=\"#f8fafc\" stroke=\"#cbd5e1\" stroke-width=\"1.4\"/><text x=\"25.0\" y=\"227.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"700\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">激素作用的四个一般特征</text><text x=\"25.0\" y=\"245.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">· 特异性：只与有受体的靶细胞结合</text><text x=\"25.0\" y=\"261.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">· 信使性：传递信息，不直接参与代谢（</text><text x=\"25.0\" y=\"277.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">不提供能量）</text><text x=\"25.0\" y=\"293.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">· 高效能放大：极微量就能产生显著效应（</text><text x=\"25.0\" y=\"309.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">级联放大）</text><text x=\"25.0\" y=\"325.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">· 相互作用：协同、拮抗、允许作用（</text><text x=\"25.0\" y=\"341.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">如糖皮质激素对儿茶酚胺的允许作用）</text><rect x=\"15.0\" y=\"366.0\" width=\"300.0\" height=\"108.0\" rx=\"7\" fill=\"#fee2e2\" stroke=\"#b91c1c\" stroke-width=\"1.2\"/><text x=\"25.0\" y=\"382.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"700\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">允许作用：某激素本身无直接效应，但缺它另</text><text x=\"25.0\" y=\"398.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">一激素就失效（皮质醇 vs 肾上腺素）</text><text x=\"25.0\" y=\"414.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">激素不提供能量、不参与代谢反应本身——只调</text><text x=\"25.0\" y=\"430.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">节速率</text><text x=\"25.0\" y=\"446.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">「快慢」看受体位置：膜上快（秒~分）、</text><text x=\"25.0\" y=\"462.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">胞内慢（小时~天）</text><rect x=\"11.0\" y=\"477.0\" width=\"308.0\" height=\"51.0\" rx=\"7\" fill=\"#ccfbf1\" stroke=\"#0f766e\" stroke-width=\"1.2\"/><text x=\"165.0\" y=\"492.0\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"700\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">膜受体靠第二信使（快）；核受体改基因转录（</text><text x=\"165.0\" y=\"507.5\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"700\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">慢）；激素只调速不给能</text></svg>","fig_ph11_hpa":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 330 649\" width=\"100%\" style=\"max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px\" role=\"img\"><text x=\"165.0\" y=\"22.6\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"700\" fill=\"#1e293b\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">下丘脑-垂体-靶腺轴</text><text x=\"165.0\" y=\"43.0\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"400\" fill=\"#64748b\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">三级结构，每级都有负反馈</text><rect x=\"15.0\" y=\"60.0\" width=\"300.0\" height=\"54.0\" rx=\"6\" fill=\"#ccfbf1\" stroke=\"#0f766e\" stroke-width=\"1.4\"/><text x=\"27.0\" y=\"80.0\" text-anchor=\"start\" font-size=\"14\" font-weight=\"700\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">下丘脑</text><text x=\"27.0\" y=\"98.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">释放释放激素（TRH、CRH、GnRH、GHRH、</text><text x=\"27.0\" y=\"114.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">多巴胺）</text><line x1=\"165.0\" y1=\" ont-weight=\"700\" fill=\"#15803d\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">靶腺激素</text><text x=\"27.0\" y=\"265.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">T₃/T₄、皮质醇、性激素 → 产生效应</text><rect x=\"15.0\" y=\"267.0\" width=\"300.0\" height=\"44.0\" rx=\"6\" fill=\"#f8fafc\" stroke=\"#cbd5e1\" stroke-width=\"1.5\"/><text x=\"27.0\" y=\"287.0\" text-anchor=\"start\" font-size=\"14\" font-weight=\"700\" fill=\"#1e293b\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">负反馈</text><text x=\"27.0\" y=\"304.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">靶腺激素回升 → 抑制下丘脑与垂体（</text><text x=\"27.0\" y=\"320.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">长环反馈）</text><rect x=\"15.0\" y=\"317.0\" width=\"300.0\" height=\"42.0\" rx=\"6\" fill=\"#f8fafc\" stroke=\"#cbd5e1\" stroke-width=\"1.5\"/><text x=\"27.0\" y=\"337.0\" text-anchor=\"start\" font-size=\"14\" font-weight=\"700\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">短环反馈</text><text x=\"27.0\" y=\"354.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">垂体促激素抑制下丘脑</text><rect x=\"15.0\" y=\"369.0\" width=\"300.0\" height=\"134.0\" rx=\"7\" fill=\"#f8fafc\" stroke=\"#cbd5e1\" stroke-width=\"1.4\"/><text x=\"25.0\" y=\"388.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"700\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">两个特殊点</text><text x=\"25.0\" y=\"406.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">· 神经垂体（后叶）只储存、不合成：ADH 与</text><text x=\"25.0\" y=\"422.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">催产素由下丘脑合成</text><text x=\"25.0\" y=\"438.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">· 催乳素（PRL）受下丘脑「抑制」为主（</text><text x=\"25.0\" y=\"454.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">多巴胺），不是促进</text><text x=\"25.0\" y=\"470.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">· 垂体门脉系统：下丘脑激素经血液直达腺垂</text><text x=\"25.0\" y=\"486.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">体，不被稀释</text><rect x=\"15.0\" y=\"511.0\" width=\"300.0\" height=\"76.0\" rx=\"7\" fill=\"#fee2e2\" stroke=\"#b91c1c\" stroke-width=\"1.2\"/><text x=\"25.0\" y=\"527.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"700\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">原发 vs 继发：原发靶腺病变 → 靶腺激素↓、</text><text x=\"25.0\" y=\"543.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">促激素↑；继发垂体病变 → 两者都↓</text><text x=\"25.0\" y=\"559.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">长期用糖皮质激素后突然停药 → 肾上腺皮质萎</text><text x=\"25.0\" y=\"575.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">缩 → 肾上腺危象，必须逐渐减量</text><rect x=\"11.0\" y=\"590.0\" width=\"308.0\" height=\"51.0\" rx=\"7\" fill=\"#ccfbf1\" stroke=\"#0f766e\" stroke-width=\"1.2\"/><text x=\"165.0\" y=\"605.0\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"700\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">下丘脑→垂体→靶腺三级，靠负反馈闭环；</text><text x=\"165.0\" y=\"620.5\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"700\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">原发病变时促激素升高、继发时降低</text></svg>","fig_ph11_thyroid":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 330 547\" width=\"100%\" style=\"max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px\" role=\"img\"><text x=\"165.0\" y=\"22.6\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"700\" fill=\"#1e293b\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">甲状腺激素：合成、作用与调节</text><text x=\"165.0\" y=\"43.0\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"400\" fill=\"#64748b\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">碘是原料，过氧化物酶是关键酶</text><rect x=\"15.0\" y=\"60.0\" width=\"300.0\" height=\"38.0\" rx=\"6\" fill=\"#ccfbf1\" stroke=\"#0f766e\" stroke-width=\"1.4\"/><text x=\"27.0\" y=\"80.0\" text-anchor=\"start\" font-size=\"14\" font-weight=\"700\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">① 摄碘</text><text x=\"27.0\" y=\"98.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">甲状腺滤泡细胞主动摄碘（碘泵，逆浓度）</text><line x1=\"165.0\" y1=\"99.0\" x2=\"165.0\" y2=\"99.5\" stroke=\"#64748b\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><polygon points=\"165.0,104.0 163.0,99.4 167.0,99.4\" fill=\"#64748b\"/><rect x=\"15.0\" y=\"105.0\" width=\"300.0\" height=\"38.0\" rx=\"6\" fill=\"#fef3c7\" stroke=\"#b45309\" stroke-width=\"1.4\"/><text x=\"27.0\" y=\"125.0\" text-anchor=\"start\" font-size=\"14\" font-weight=\"700\" fill=\"#b45309\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">② 氧化与碘化</text><text x=\"27.0\" y=\"143.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">过氧化物酶（TPO）使碘活化，与酪氨酸结合</text><line x1=\"165.0\" y1=\"144.0\" x2=\"165.0\" y2=\"144.5\" stroke=\"#64748b\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><polygon points=\"165.0,149.0 163.0,144.4 167.0,144.4\" fill=\"#64748b\"/><rect x=\"15.0\" y=\"150.0\" width=\"300.0\" height=\"38.0\" rx=\"6\" fill=\"#fef3c7\" stroke=\"#b45309\" stroke-width=\"1.4\"/><text x=\"27.0\" y=\"170.0\" text-anchor=\"start\" font-size=\"14\" font-weight=\"700\" fill=\"#b45309\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">③ 偶联</text><text x=\"27.0\" y=\"188.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">形成 T₃、T₄，储存于胶质（储量可用数周）</text><line x1=\"165.0\" y1=\"189.0\" x2=\"165.0\" y2=\"189.5\" stroke=\"#64748b\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><polygon points=\"165.0,194.0 163.0,189.4 167.0,189.4\" fill=\"#64748b\"/><rect x=\"15.0\" y=\"195.0\" width=\"300.0\" height=\"38.0\" rx=\"6\" fill=\"#fee2e2\" stroke=\"#b91c1c\" stroke-width=\"1.4\"/><text x=\"27.0\" y=\"215.0\" text-anchor=\"start\" font-size=\"14\" font-weight=\"700\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">④ 释放</text><text x=\"27.0\" y=\"233.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">TSH 促释放；血中以 TBG 结合运输</text><rect x=\"15.0\" y=\"235.0\" width=\"300.0\" height=\"102.0\" rx=\"7\" fill=\"#f8fafc\" stroke=\"#cbd5e1\" stroke-width=\"1.4\"/><text x=\"25.0\" y=\"254.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"700\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">生理作用（几乎全身）</text><text x=\"25.0\" y=\"272.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">· 提高基础代谢率、产热（甲亢怕热多汗）</text><text x=\"25.0\" y=\"288.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">· 促生长发育（尤其脑与骨骼，缺则呆小症）</text><text x=\"25.0\" y=\"304.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">· 提高神经系统兴奋性（甲亢易激动）</text><text x=\"25.0\" y=\"320.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">· 加快心率、增加心输出量</text><rect x=\"15.0\" y=\"345.0\" width=\"300.0\" height=\"140.0\" rx=\"7\" fill=\"#fee2e2\" stroke=\"#b91c1c\" stroke-width=\"1.2\"/><text x=\"25.0\" y=\"361.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"700\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">甲亢：T₃T₄↑、TSH↓（原发）；甲减：T₃T₄↓、</text><text x=\"25.0\" y=\"377.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">TSH↑（原发）</text><text x=\"25.0\" y=\"393.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">抗甲状腺药（甲巯咪唑/丙硫氧嘧啶）抑制 TP</text><text x=\"25.0\" y=\"409.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">O</text><text x=\"25.0\" y=\"425.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">10版删去了「甲状腺激素对消化系统的影响」</text><text x=\"25.0\" y=\"441.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">一段</text><text x=\"25.0\" y=\"457.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">胎儿期缺碘 → 呆小症（智力+身材都受损）；</text><text x=\"25.0\" y=\"473.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">成人缺碘 → 单纯性甲状腺肿</text><rect x=\"11.0\" y=\"488.0\" width=\"308.0\" height=\"51.0\" rx=\"7\" fill=\"#ccfbf1\" stroke=\"#0f766e\" stroke-width=\"1.2\"/><text x=\"165.0\" y=\"503.0\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"700\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">摄碘→TPO碘化→偶联→TSH促释放；缺碘胎儿期致</text><text x=\"165.0\" y=\"518.5\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"700\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">呆小症、成人致甲状腺肿</text></svg>","fig_ph11_adrenal":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 330 554\" width=\"100%\" style=\"max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px\" role=\"img\"><text x=\"165.0\" y=\"22.6\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"700\" fill=\"#1e293b\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">肾上腺：皮质三层 + 髓质</text><text x=\"165.0\" y=\"43.0\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"400\" fill=\"#64748b\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">三层各管一类激素，口诀：球盐、束糖、网性</text><rect x=\"15.0\" y=\"60.0\" width=\"300.0\" height=\"42.0\" rx=\"6 " font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">激素基础</text><text x=\"25.0\" y=\"473.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">催产素对子宫的作用在妊娠末期才明显（</text><text x=\"25.0\" y=\"489.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">受体增多），故可用于引产</text><rect x=\"11.0\" y=\"504.0\" width=\"308.0\" height=\"51.0\" rx=\"7\" fill=\"#ccfbf1\" stroke=\"#0f766e\" stroke-width=\"1.2\"/><text x=\"165.0\" y=\"519.0\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"700\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">HCG 救黄体→胎盘接替；分娩靠催产素正反馈直</text><text x=\"165.0\" y=\"534.5\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"700\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">到胎儿娩出</text></svg>","fig_ph13_growth":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 330 505.0\" width=\"100%\" style=\"max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px\" role=\"img\"><text x=\"165.0\" y=\"20.5\" text-anchor=\"middle\" font-size=\"14.5\" font-weight=\"700\" fill=\"#1e293b\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">生长发育的规律与激素调控（第10版新增整章</text><text x=\"165.0\" y=\"38.0\" text-anchor=\"middle\" font-size=\"14.5\" font-weight=\"700\" fill=\"#1e293b\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">）</text><text x=\"165.0\" y=\"58.0\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"400\" fill=\"#64748b\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">两个生长突增期；两种激素分工</text><rect x=\"15.0\" y=\"75.0\" width=\"300.0\" height=\"42.0\" rx=\"6\" fill=\"#ccfbf1\" stroke=\"#0f766e\" stroke-width=\"1.5\"/><text x=\"27.0\" y=\"95.0\" text-anc ngFang SC','Microsoft YaHei',sans-serif\">老年人对缺氧与低血压的代偿能力下降，</text><text x=\"25.0\" y=\"456.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">故症状常不典型</text><text x=\"25.0\" y=\"472.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">「生理性衰老」与「病理性改变」要区分：</text><text x=\"25.0\" y=\"488.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">前者不可逆，后者可干预</text><rect x=\"11.0\" y=\"503.0\" width=\"308.0\" height=\"51.0\" rx=\"7\" fill=\"#ccfbf1\" stroke=\"#0f766e\" stroke-width=\"1.2\"/><text x=\"165.0\" y=\"518.0\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"700\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">衰老是多机制累积（自由基+端粒+程序+免疫）；</text><text x=\"165.0\" y=\"533.5\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"700\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">老年用药需按肾功能减量</text></svg>"};

let curCh = 'all', kw = '';

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;')
  .replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function renderChips(){
  const el = document.getElementById('chips');
  let h = `<div class="chip ${curCh==='all'?'on':''}" data-ch="all">全部 ${CARDS.length}</div>`;
  for (const [k, name] of Object.entries(CHAPTERS)) {
    const n = CARDS.filter(c => c[0].slice(3,5) === k).length;
    h += `<div class="chip ${curCh===k?'on':''}" data-ch="${k}">${k} ${name} ${n}</div>`;
  }
  el.innerHTML = h;
  el.querySelectorAll('.chip').forEach(c => {
    c.onclick = () => { curCh = c.dataset.ch; renderChips(); renderList(); };
  });
}

function cardText(c){
  let t = c[1] + ' ';
  for (const b of c[3]) {
    if (b[0] === 'q' || b[0] === 'q2') t += b[1] + ' ';
    else if (b[0] === 'l') t += b[2].join(' ') + ' ';
    else if (b[0] === 't') t += b[1] + ' ' + b[3].flat().join(' ') + ' ';
    else if (b[0] === 'i') {
      t += (b[2]||'') + ' ';
      // 图里的文字也要能被搜到（去掉标签只留文本）
      const raw = (FIGS[b[1]]||'').replace(/<[^>]+>/g,' ');
      t += raw + ' ';
    }
  }
  return t;
}

function renderList(){
  const list = document.getElementById('list');
  let sel = CARDS.filter(c => curCh === 'all' || c[0].slice(3,5) === curCh);
  if (kw) {
    const k = kw.toLowerCase().replace(/\s+/g,'');
    sel = sel.filter(c => cardText(c).toLowerCase().replace(/\s+/g,'').includes(k));
  }
  document.getElementById('stat').textContent =
    `共 ${sel.length} 张卡` + (kw ? `（搜索「${kw}」）` : '');
  let html = '';
  for (const [id, title, lv, blocks] of sel) {
    const ch = id.slice(3,5);
    html += `<div class="card" id="card-${id}">
      <h2>${esc(title)}<span class="lv">第${Number(ch)}章</span></h2>`;
    for (const b of blocks) {
      if (b[0] === 'q') {
        html += `<div class="q">★ ${esc(b[1])}</div>`;
      } else if (b[0] === 'q2') {
        html += `<div class="q" style="background:#fffbeb;border-color:#b45309">`
             +  `💡 ${esc(b[1])}</div>`;
      } else if (b[0] === 'i') {
        const svg = FIGS[b[1]] || '';
        html += `<div class="fig" onclick="zoomFig('${b[1]}')">${svg}
          <div class="fig-cap">${esc(b[2]||'')}</div>
          <div class="fig-tip">🔍 点击全屏</div></div>`;
      } else if (b[0] === 't') {
        html += `<div class="tw"><table><tr>${b[2].map(h=>`<th>${esc(h)}</th>`).join('')}</tr>`;
        for (const r of b[3]) html += `<tr>${r.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`;
        html += `</table></div>`;
      } else if (b[0] === 'l') {
        html += `<ul>${b[2].map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
      }
    }
    html += `</div>`;
  }
  list.innerHTML = html || '<p style="color:#64748b;padding:20px;text-align:center">没有匹配的卡片</p>';
}

let zEl = null;
function zoomFig(id){
  const svg = FIGS[id];
  if (!svg) return;
  if (!zEl) {
    zEl = document.createElement('div');
    zEl.className = 'zoom';
    zEl.onclick = () => zEl.classList.remove('on');
    document.body.appendChild(zEl);
  }
  zEl.innerHTML = `<div class="in">${svg}<div class="tip">点击任意处关闭</div></div>`;
  zEl.classList.add('on');
}

document.getElementById('q').addEventListener('input', e => {
  kw = e.target.value.trim();
  renderList();
});

renderChips();
renderList();
</script>
