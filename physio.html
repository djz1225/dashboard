靠 CO₂/H⁺（中枢），应急靠低氧（外周） 中枢化学感受器 延髓，感受脑脊液 H⁺ CO₂ 的主要通路（占 80%） 外周化学感受器 颈动脉体、主动脉体 主要感受低氧（PO₂&lt;60 才明显） 肺牵张反射 肺扩张 → 抑制吸气 防止肺过度扩张 防御性反射 咳嗽、喷嚏 清除刺激物 关键：CO₂ 不是直接刺激中枢感受器， 而是透过血脑屏障生成 H⁺ 再起作用 CO₂ 对呼吸的刺激作用最强（比低氧强得多） ——所以给高浓度氧可能抑制呼吸 慢性 CO₂ 潴留（Ⅱ型呼衰）时呼吸驱动转为依 赖低氧，此时高浓度吸氧危险 CO₂经H⁺刺激中枢（主要通路）；低氧只在外周、 且是Ⅱ型呼衰的关键驱动","fig_ph06_gastric":"胃液分泌的三个时相 头期最「好吃」，胃期量最大，肠期最少 头期 30% 量大、酸度高、消化力强 视觉/嗅觉/咀嚼 → 迷走神经 → 胃腺 胃期 60% 量最大，酸度最高 食物扩张胃 + 蛋白分解产物 → 胃泌素 肠期 10% 量最少 食物进入十二指肠 → 少量胃泌素 胃液成分与分泌细胞 · 壁细胞：盐酸（内因子）—— 胃酸由 H⁺-K⁺ -ATP 酶泵出 · 主细胞：胃蛋白酶原（需盐酸激活） · 黏液细胞：黏液-碳酸氢盐屏障 · G 细胞：胃泌素（促胃酸分泌） 刺激胃酸的三条途径最终都汇到壁细胞：组胺（ H₂）&gt; 胃泌素 &gt; 乙酰胆碱 抑酸药：PPI 抑制 H⁺-K⁺-ATP 酶（最后一关 ），H₂ 受体拮抗剂抑制组胺途径 内因子缺乏 → 维生素 B₁₂ 吸收障碍 → 巨幼 细胞性贫血（萎缩性胃炎） 胃期量最大、头期消化力最强；胃酸由壁细胞 H ⁺-K⁺-ATP 酶分泌","fig_ph06_hormones":"胃肠激素三家：胃泌素、促胰液素、缩胆囊素 按「谁分泌、被什么刺激、管什么」记 胃泌素 来源 G 细胞（胃窦） 刺激 蛋白产物、胃扩张、迷走 作用 促胃酸分泌、促黏膜生长 促胰液素 来源 S 细胞（十二指肠） 刺激 盐酸（最强）、脂肪酸 作用 促胰液大量分泌 HCO₃⁻ 缩胆囊素 CCK 来源 I 细胞（十二指肠） 刺激 蛋白产物、脂肪酸 作用 促胆囊收缩、促胰酶分泌 促胰液素＝「酸来了，快送碱」；CCK＝「脂肪 蛋白来了，快送酶、快挤胆囊」 胃泌素与 CCK 结构相近（同属缩胆囊素族）， 但作用完全不同 胃泌素管酸、促胰液素管碱、CCK 管酶和胆囊—— 按「送什么」记","fig_ph06_pancreas_bile":"胰液与胆汁：消化两大主力 胰液最全面，胆汁只管乳化脂肪 胰液（消化力最强） · 碳酸氢盐：中和胃酸，为胰酶提供适宜 pH · 蛋白水解酶：胰蛋白酶原、糜蛋白酶原（ 需肠激酶激活） · 脂肪酶：胰脂肪酶（需胆盐协同） · 淀粉酶：分解淀粉为麦芽糖 · 核酸酶：分解 DNA/RNA 胆汁（不含消化酶） · 胆盐：乳化脂肪，形成微胶粒 → 促进脂肪 吸收 · 胆色素：血红蛋白分解产物，不是消化成分 · 胆固醇、卵磷脂、无机盐 · 胆囊收缩靠 CCK；胆汁分泌靠促胰液素与胆 盐的肠肝循环 胆汁没有消化酶——它靠「物理乳化」， 不是化学分解 胰蛋白酶原在肠内被肠激酶激活，这是「级联 放大」的起点，也是急性胰腺炎自我消化的关 键 胆囊切除后脂肪消化受影响，但胆盐仍可由肝 直接分泌入肠 胰液含全套酶（最全面）；胆汁无酶、只乳化脂 肪；胰蛋白酶原靠肠激酶激活","fig_ph06_absorption":"小肠吸收：部位与方式 小肠是主场所，因为面积大、酶多、停留久 铁 十二指肠、空肠上段（主动转运） 钙 十二指肠（受维生素 D 促进） 糖与蛋白 全小肠，经载体继发性主动转运 脂肪 需胆盐乳化（十二指肠、空肠） 维生素 B₁₂ 回肠末端（需内因子） 胆盐 回肠末端（肠肝循环，95% 被重吸收） 为什么小肠是主场所 · 面积巨大：环状皱襞 + 绒毛 + 微绒毛 → 约 200 m² · 酶丰富：刷状缘有双糖酶、肽酶 · 停留时间长：有利于充分吸收 · 绒毛内有中央乳糜管（吸收脂肪）与毛细血 管（吸收水溶性物质） 回肠末端是「关键 1 米」：B₁₂ 与胆盐都在 这里吸收，切除后后果严重 脂肪吸收走淋巴（乳糜管）→ 淋巴管阻塞时可 致脂肪泻 回肠末端管 B₁₂ 与胆盐；脂肪走淋巴， 水溶性物质走门静脉","fig_ph06_microbiome":"肠道微生态与肠屏障（第10版新增整节） 菌群 + 屏障 = 一道会主动工作的防线 肠屏障的四层 · 化学屏障：胃酸、胆汁、黏液中的抗菌肽 · 机械屏障：肠上皮细胞间的紧密连接 · 生物屏障：常驻菌群占位竞争，阻止致病菌 定植 · 免疫屏障：肠相关淋巴组织（GALT）、 sIgA 菌群的生理意义 · 发酵未消化碳水 → 短链脂肪酸（SCFA）， 为结肠上皮供能 · 合成维生素 K 与部分 B 族维生素 · 训练免疫系统，维持免疫耐受 · 参与胆汁酸与药物代谢（影响药效） 长期广谱抗生素 → 菌群失调 → 艰难梭菌过度 繁殖 → 抗生素相关性腹泻 「肠漏」：紧密连接受损，内毒素入血， 与慢性炎症相关 第10版把本节从「肝脏功能」中独立出来， 说明其重要性上升 肠屏障四层：化学、机械、生物、免疫； 菌群既帮忙消化也训练免疫","fig_ph07_energy":"能量代谢的测定与基础代谢 间接测热法靠呼吸商；BMR 是最低代谢水平 呼吸商 糖 CO₂/O₂=1 RQ = 1.0 呼吸商 脂肪 最低 RQ ≈ 0.71 呼吸商 蛋白质 RQ ≈ 0.80 呼吸商 混合膳食 RQ ≈ 0.85 基础代谢率 BMR 的四个条件 · 清醒、静卧（不是睡眠） · 空腹 12 小时以上 · 室温 20~25℃ · 无精神紧张 甲亢时 BMR 升高（可达 +60%以上）， 甲减时降低——这是重要辅助指标 10版新增「双标记水法」：用 ²H₂¹⁸O 测自由 活动状态下的能量消耗 10版更新食物特殊动力效应机制：含褐色脂肪 组织 UCP1 产热 呼吸商：糖1.0 &gt; 混合0.85 &gt; 蛋白0.80 &gt; 脂 肪0.71；BMR 甲亢↑甲减↓","fig_ph07_temp":"体温调节：产热与散热的平衡 调定点在下丘脑，效应是「增减产热/散热」 产热 安静时 内脏 主要靠内脏（肝、心、肾） 运动时 骨骼肌 主要靠骨骼肌（可增 10~20 倍） 寒战 寒战 骨骼肌不随意节律收缩，产热最高效 散热（主要靠皮肤） 辐射 占 60%，与环境温差相关 传导对流 占 15%，靠空气/物体接触 蒸发 占 25%，出汗；湿度大时失效 体温调定点上移 → 先感到「冷」（寒战产热） 再发热：这是发热的本质，不是散热障碍 阿司匹林退热：抑制前列腺素合成 → 调定点下 移 → 散热增加（出汗） 中暑是散热失效，不是调定点问题——两者机制 完全不同 产热：安静靠内脏、运动靠骨骼肌、寒战最高效； 散热主要靠辐射","fig_ph08_filtration":"肾小球滤过：三个因素决定滤过量 有效滤过压＝毛细血管压−（胶渗压＋囊内压） 有效滤过压 = 毛细血管压 −（胶体渗透压＋囊内压） 肾小球毛细血管压 约 45 mmHg 主要动力；受入球/出球小动脉舒缩调节 血浆胶体渗透压 约 25 mmHg 阻力；大量输血浆/低蛋白时下降→滤过↑ 囊内压 约 10 mmHg 阻力；尿路梗阻时升高→滤过↓ 滤过膜三层与两个屏障 · 三层：内皮细胞窗孔 → 基膜 → 足细胞裂孔 · 机械屏障：按分子大小筛选（&gt;69 kDa 不 能过） · 电学屏障：基膜带负电，排斥带负电的白蛋 白 · 故肾炎时白蛋白漏出（蛋白尿），因为负电 荷丢失 三个因素的增减方向要能立刻判断：入球收缩→ 滤过↓；出球收缩→滤过↑ 肾血流量自身调节：动脉压 80~180 mmHg 时 肾血流基本恒定（肌源学说） 滤过分数 = 肾小球滤过率/肾血浆流量 ≈ 19% 有效滤过压=毛细血管压−(胶渗压+囊内压)； 出球收缩使滤过↑，入球收缩使滤过↓","fig_ph08_reabsorb":"肾小管各段重吸收什么 近端小管是「主力」，髓袢管浓缩，远曲管管精细调节 近端小管 67% 的水、Na⁺；全部葡萄糖、氨基酸 等渗重吸收，量大 髓袢降支细段 只透水，不透溶质 水出、盐留 → 小管液变浓 髓袢升支粗段 主动重吸收 Na⁺-Cl⁻（Na⁺-K⁺-2Cl⁻ 同向转运 ），不透水 盐出、水留 → 小管液变稀（稀释段） 远曲小管 Na⁺ 重吸收（受醛固酮调节），水不易通过 精细调节 集合管 水（受 ADH 调节）、尿素 决定最终尿量浓度 葡萄糖重吸收上限（肾糖阈）约 180 mg/dl， 超过则出现尿糖 髓袢升支粗段是「稀释段」：只出盐不出水， 小管液渗透压降到最低 袢利尿剂（呋塞米）作用在这里：抑制 Na⁺-K ⁺-2Cl⁻ 转运 → 强效利尿 近端小管重吸收 67% 水钠；髓袢升支粗段只出 盐不出水＝稀释段","fig_ph08_loop":"尿液浓缩：逆流倍增 + ADH 髓袢越长，能浓缩的程度越高 ① 髓袢降支细段 只透水 → 水被抽出，管内 NaCl 浓度↑ ② 髓袢升支粗段 只出盐不出水 → 管外髓质渗透压↑（造梯度） ③ 逆流倍增 两个相反流向互相加强 → 髓质由外向内渗透 压层层升高 ④ 集合管 ADH 使水通道（AQP2）上膜 → 水按梯度被重 吸收 髓质渗透压 梯度 外层约 300 → 内层可达 1200 mOsm/L 直小血管 逆流交换，维持梯度不被冲走 两个「为什么」 · 为什么缺水时尿少而浓：ADH↑ → 集合管透 水↑ → 水回吸收↑ · 为什么大量饮清水后尿多而稀：ADH↓ → 集 合管不透水 → 水排出 尿崩症：ADH 缺乏或受体不敏感 → 大量低渗 尿（每天可达 10 L 以上） 髓袢利尿剂破坏髓质梯度 → 浓缩能力下降， 这是其副作用之一 髓袢造梯度（逆流倍增）、集合管用梯度（ADH 控水通道）","fig_ph08_regulation":"尿生成的调节：三条主线 神经、体液、自身调节各管一段 交感神经 入球小动脉收缩（α₁）→ 肾血流↓、滤过↓； 促肾素释放 血容量不足时保钠保水 抗利尿激素 ADH 集合管 AQP2↑ → 水重吸收↑ → 尿少而浓 血浆晶体渗透压↑ 时释放（最重要刺激） 醛固酮 远曲小管/集合管保 Na⁺ 排 K⁺ → 水随钠保留 受 RAAS 与血 K⁺ 调节 心房钠尿肽 ANP 入球舒张、出球收缩 → 滤过↑；抑制肾素与醛固 酮 血容量↑ 时释放，促排钠排水 ADH 释放的最重要刺激是「血浆晶体渗透压升 高」，不是血压下降（后者次要） 大量出汗 → 血浆晶体渗透压↑ → ADH↑ → 尿 少；大量失血 → 血压↓ → ADH 也↑ ANP 与 RAAS 方向相反，共同维持血容量稳定 ADH 管水（晶体渗透压驱动）、醛固酮管钠（ RAAS驱动）、ANP 反向排钠","fig_ph08_raas":"肾素-血管紧张素-醛固酮系统 从「肾灌注不足」一路到「保钠升压」 ① 触发 肾灌注压↓、远曲小管 Na⁺↓、交感兴奋 → 球 旁细胞释放肾素 ② 血管紧张素原 肝产生，被肾素切成 Ang Ⅰ（十肽） ③ Ang Ⅰ → Ang Ⅱ 经肺 ACE（血管紧张素转换酶）切除两肽 ④ Ang Ⅱ 的双作用 ① 强力缩血管 ② 促醛固酮分泌 ⑤ 醛固酮 远曲小管保 Na⁺ 排 K⁺ → 水钠潴留、血压↑ 临床对应药物 · ACEI（普利类）：抑制 ACE，减少 Ang Ⅱ， 但会咳嗽（缓激肽堆积） · ARB（沙坦类）：阻断 Ang Ⅱ 的 AT₁ 受体， 不咳嗽 · 醛固酮拮抗剂（螺内酯）：保钾利尿 · 肾素抑制剂（阿利吉仑） Ang Ⅱ 比去甲肾上腺素缩血管还强（约 40 倍 ） ACEI/ARB 会升高血钾，与保钾利尿剂合用要 警惕高钾 双侧肾动脉狭窄时禁用 ACEI/ARB——会急性肾 衰 肾素→AngⅠ→(ACE)→AngⅡ→缩血管＋促醛固酮； 普利类抑制ACE、沙坦类阻断受体","fig_ph08_clearance":"清除率：判断物质「被肾怎么处理」 与菊粉比较，就知道是滤过、重吸收还是分泌 菊粉清除率 基准 ＝GFR（125 ml/min），只滤过不重吸收不分 泌 肌酐清除率 略高于 GFR（少量由小管分泌），临床估 GFR 葡萄糖清除率 ＝0，滤过后全部重吸收 PAH 清除率 ≈ 肾血浆流量（RPF），滤过+分泌几乎全清 判断规则（与菊粉比） · 等于菊粉 → 只滤过（如菊粉） · 小于菊粉 → 有重吸收（如葡萄糖、尿素） · 大于菊粉 → 有分泌（如 PAH、肌酐略高） · 等于 0 → 完全重吸收（葡萄糖在正常血糖 下） 10版把「清除率」一节改名为「肾功能的评定 」，内容有调整 滤过分数 = GFR / RPF = 125/660 ≈ 19% GFR 是评价肾功能最重要的指标，临床常用 e GFR 估算 与菊粉比：相等＝只滤过、偏小＝有重吸收、 偏大＝有分泌","fig_ph09_receptor":"感受器的四个一般生理特性 换能、编码、适应、敏感——四件事都考 感受器的适宜刺激 每种感受器只对一种能量形式最敏感 眼对光、耳对声——特异性由结构决定 换能作用 刺激能量 → 感受器电位（局部电位） 感受器电位达阈值才产生动作电位 编码作用 刺激的「性质、强度、部位」编成神经冲动序列 强度编码为频率，性质靠专用通路与中枢部位 适应现象 恒定刺激持续作用，传入冲动逐渐减少 有快适应（触觉）与慢适应（痛觉、颈动脉窦） 快适应＝触觉、嗅觉（告诉你「变了」， 不告诉你「一直有」） 慢适应＝痛觉、本体感觉、颈动脉窦压力感受 器（必须一直报告） 痛觉几乎不适应——这是保护性设计，所以能持 续报警 换能把刺激变成感受器电位；强度靠频率编码； 痛觉慢适应、触觉快适应","fig_ph09_vision":"视觉：折光系统与感光换能 角膜管大折光、晶状体管调节、视网膜管换能 折光系统四个结构（屈光间质） · 角膜：折光力最强（约 43 D），但不可调 · 房水：维持眼压、提供营养 · 晶状体：可调节（约 19 D），看近时变凸 · 玻璃体：占容积 4/5，参与折光 · 注意：视网膜不是屈光间质，它是感光层 看近物时的三联动（近反射） · 晶状体变凸（睫状肌收缩，悬韧带松弛） · 瞳孔缩小（减少球面像差、增加景深） · 双眼会聚（内直肌收缩） 视网膜两种感光细胞 · 视杆细胞：暗光视觉，含视紫红质，无色觉， 周边多 · 视锥细胞：明视觉与色觉，中央凹密集， 三种视色素 · 中央凹只有视锥细胞 → 视力最敏锐， 但暗处看不清 近视：眼轴过长或折光过强 → 像成在视网膜前 → 凹透镜矫正 远视：眼轴过短 → 像成在视网膜后 → 凸透镜 矫正 青光眼：房水排出受阻 → 眼压升高 → 压迫视 神经 维生素 A 缺乏 → 视紫红质合成不足 → 夜盲 角膜折光最强、晶状体可调；视杆管暗光、 视锥管色觉与锐度","fig_ph09_hearing":"听觉：从声波到神经冲动 中耳传音、内耳换能；感音与传音是两条路径 ① 外耳 集音、共鸣；耳道共振约 2000~3000 Hz ② 中耳 鼓膜→听骨链（锤砧镫）→卵圆窗；增压约 22 倍 ③ 内耳 耳蜗内淋巴振动 → 基底膜行波 → 毛细胞纤毛 弯曲 ④ 换能 毛细胞 K⁺ 内流 → 去极化 → 释放递质 → 听 神经 基底膜的行波理论（部位编码频率） · 高频 → 靠近卵圆窗（蜗底） · 低频 → 远离卵圆窗（蜗顶） · 故蜗底病变先影响高频听力 传音性聋：外耳/中耳病变 → 气导↓、 骨导正常 → 有气骨导差 感音性聋：耳蜗/听神经病变 → 气导骨导同时 ↓ → 无气骨导差 Rinne 试验：正常气导&gt;骨导；传音性聋骨导&gt; 气导（Rinne 阴性） 咽鼓管连通中耳与鼻咽，感冒时可致中耳炎 中耳增压 22 倍；基底膜部位编码频率； 传音性聋有气骨导差、感音性聋没有","fig_ph09_balance_itch":"前庭平衡与痒觉 前庭管头的位置与运动；痒觉是第10版新增内容 前庭器官（两部分） 半规管 感受「旋转」加速度（角加速度） 椭圆囊+球囊 感受「直线」加速度与头位（重力） 前庭反应三联 · 姿势调节（维持平衡） · 眼球震颤（旋转后出现，慢相-快相） · 自主神经反应（晕船、恶心、呕吐） 半规管＝旋转（角加速度）；耳石器＝直线加 速度与重力——最常混的一对 晕动病就是前庭刺激与视觉信息不一致导致的 自主神经反应 痒觉（第10版新增） · 由特异的痒觉感受器与专用传导通路介导， 不是「弱的痛觉」 · 主要递质：组胺（急性痒）与蛋白酶激活受 体（慢性痒） · 脊髓有专用的痒觉传导神经元 半规管管旋转、耳石器管直线与重力；痒觉是独 立通路，不等于弱痛觉","fig_ph10_synapse":"化学性突触传递 电信号→化学信号→电信号，这是单向的原因 ① 动作电位到末梢 电压门控 Ca²⁺ 通道开放，Ca²⁺ 内流 ② 囊泡释放 突触小泡与前膜融合，递质释放到间隙（胞吐， 耗能） ③ 递质结合受体 后膜受体 → 离子通道开放 → 突触后电位 ④ 递质清除 酶解（AChE）或重摄取，保证信号能「停」 两种突触后电位 · EPSP（兴奋性）：Na⁺ 内流为主 → 去极化 · IPSP（抑制性）：Cl⁻ 内流或 K⁺ 外流 → 超极化 · 两者都是局部电位，可总和 单向传递的原因：递质只从突触前膜释放， 受体只在后膜 突触延搁：每过一个突触约 0.3~0.5 ms， 反射弧中突触越多反应越慢 易受内环境影响：缺氧、pH 变化、药物都易干 扰化学传递 重症肌无力：ACh 受体被抗体破坏 → 递质结 合不上 → 肌无力 Ca²⁺内流触发胞吐→递质结合受体→EPSP/IPSP； 单向往前传是受体分布决定的","fig_ph10_sensory":"感觉传导通路：为什么要交叉 浅感觉与深感觉走不同路径，交叉位置也不同 浅感觉（痛温触） 脊神经节 → 后角换元 → 立即交叉 → 脊髓丘脑 侧束 在「脊髓」内交叉 深感觉（本体+精细触觉） 脊神经节 → 后索（薄束/楔束）→ 延髓换元 → 交叉 在「延髓」交叉（内侧丘系交叉） 头面部感觉 三叉神经节 → 三叉神经脊束核 → 交叉 脑干内交叉 关键判断：浅感觉在脊髓交叉，深感觉在延髓 交叉——这解释了「脊髓半切综合征」的表现 脊髓半切：同侧深感觉障碍（因未交叉）+ 对 侧痛温觉障碍（因已交叉） 内侧丘系交叉在延髓，所以延髓病变可致对侧 深感觉丧失 浅感觉在脊髓交叉、深感觉在延髓交叉； 这是判断病变平面的关键","fig_ph10_motor":"运动控制的三级结构 脊髓管反射、脑干管姿势、大脑皮质管随意运动 脊髓 牵张反射（肌梭→α运动神经元）、屈肌反射 最基本、最原始 脑干 姿势反射、去大脑僵直（易化区&gt;抑制区） 维持抗重力姿势 基底神经节 调节肌张力、协调运动、启动运动 帕金森病、舞蹈病 小脑 协调运动、维持平衡、参与运动学习 损伤致共济失调 大脑皮质 随意运动的发起与精细控制（锥体束） 最高级 两个必考的病理状态 · 去大脑僵直：切断中脑 → 易化区相对占优 → 伸肌紧张亢进（抗重力肌） · 脊休克：脊髓突然断离 → 断面以下暂时无 反射（数周后恢复，但无意识控制） 牵张反射的两个成分：肌梭（感受牵拉， 兴奋）+ 腱器官（感受张力，抑制） 帕金森病：黑质多巴胺↓ → 纹状体 ACh 相对 亢进 → 肌强直、静止性震颤 脊髓管反射、脑干管姿势、基底节调张力、 小脑管协调、皮质管随意","fig_ph10_autonomic":"自主神经系统：交感与副交感 看「递质、受体、效应」三件事 器官 交感 副交感 瞳孔 扩大（α₁） 缩小（M） 心脏 心率↑收缩力↑（β₁） 心率↓（M） 支气管 舒张（β₂） 收缩（M） 胃肠 蠕动↓（α/β） 蠕动↑（M） 膀胱 舒张（β） 收缩（M） 唾液 少量黏稠（α） 大量稀薄（M） 汗腺 分泌↑（M，例外） — 递质与受体 · 交感节后：去甲肾上腺素（多数）＋ 肾上 腺素；汗腺例外用 ACh · 副交感节后：乙酰胆碱（全部） · 交感受体：α₁ 缩血管、β₁ 心脏、β₂ 支气 管与骨骼肌血管 · 副交感受体：M 受体（阿托品阻断） 例外：交感支配汗腺用 ACh + M 受体——所以 阿托品能抑制出汗 交感「一体两面」：β₂ 舒张支气管（哮喘用激 动剂）、β₁ 加快心率 双重支配的器官可被两侧调节，但血管、汗腺、 肾上腺髓质只有交感支配 交感多用去甲肾上腺素（汗腺例外用ACh）； 副交感全用ACh作用于M受体","fig_ph10_higher":"脑的高级功能：学习记忆与睡眠 记忆有分工、睡眠有两个时相 记忆的四个阶段（10版改为「人类的记忆巩固」） 感觉记忆 极短（&lt;1 秒），量大 短时记忆 数十秒~数分钟，容量有限（约 7±2） 长时记忆 容量近乎无限，需巩固 巩固 海马参与；反复强化形成突触可塑性（LTP） 慢波睡眠 SWS 深睡、生长激素分泌↑ 促体力恢复 快动眼睡眠 REM 眼球快速运动、 做梦 促记忆巩固 长时程增强（LTP）是学习记忆的细胞基础： 突触持续增强 REM 期肌张力最低（生理性「瘫痪」）， 故做梦时不会真的动作 海马损伤 → 无法形成新的长期记忆（但远期记 忆保留） 记忆靠海马巩固为长时记忆（LTP 是细胞基础）； REM 期做梦且肌张力最低","fig_ph11_mechanism":"激素作用机制：受体在哪，决定快慢 膜受体靠第二信使（快），核受体改基因（慢） 肽类/儿茶酚胺 快 膜受体 → 第二信使（cAMP、IP₃/DG、Ca²⁺） 类固醇激素 慢 进细胞 → 核受体 → 调控基因转录 甲状腺激素 慢 同核受体，但需转运体进入细胞 激素作用的四个一般特征 · 特异性：只与有受体的靶细胞结合 · 信使性：传递信息，不直接参与代谢（ 不提供能量） · 高效能放大：极微量就能产生显著效应（ 级联放大） · 相互作用：协同、拮抗、允许作用（ 如糖皮质激素对儿茶酚胺的允许作用） 允许作用：某激素本身无直接效应，但缺它另 一激素就失效（皮质醇 vs 肾上腺素） 激素不提供能量、不参与代谢反应本身——只调 节速率 「快慢」看受体位置：膜上快（秒~分）、 胞内慢（小时~天） 膜受体靠第二信使（快）；核受体改基因转录（ 慢）；激素只调速不给能","fig_ph11_hpa":"下丘脑-垂体-靶腺轴 三级结构，每级都有负反馈 下丘脑 释放释放激素（TRH、CRH、GnRH、GHRH、 多巴胺） 腺垂体 分泌促激素（TSH、ACTH、FSH/LH、GH、 PRL） 靶腺 甲状腺、肾上腺皮质、性腺 靶腺激素 T₃/T₄、皮质醇、性激素 → 产生效应 负反馈 靶腺激素回升 → 抑制下丘脑与垂体（ 长环反馈） 短环反馈 垂体促激素抑制下丘脑 两个特殊点 · 神经垂体（后叶）只储存、不合成：ADH 与 催产素由下丘脑合成 · 催乳素（PRL）受下丘脑「抑制」为主（ 多巴胺），不是促进 · 垂体门脉系统：下丘脑激素经血液直达腺垂 体，不被稀释 原发 vs 继发：原发靶腺病变 → 靶腺激素↓、 促激素↑；继发垂体病变 → 两者都↓ 长期用糖皮质激素后突然停药 → 肾上腺皮质萎 缩 → 肾上腺危象，必须逐渐减量 下丘脑→垂体→靶腺三级，靠负反馈闭环； 原发病变时促激素升高、继发时降低","fig_ph11_thyroid":"甲状腺激素：合成、作用与调节 碘是原料，过氧化物酶是关键酶 ① 摄碘 甲状腺滤泡细胞主动摄碘（碘泵，逆浓度） ② 氧化与碘化 过氧化物酶（TPO）使碘活化，与酪氨酸结合 ③ 偶联 形成 T₃、T₄，储存于胶质（储量可用数周） ④ 释放 TSH 促释放；血中以 TBG 结合运输 生理作用（几乎全身） · 提高基础代谢率、产热（甲亢怕热多汗） · 促生长发育（尤其脑与骨骼，缺则呆小症） · 提高神经系统兴奋性（甲亢易激动） · 加快心率、增加心输出量 甲亢：T₃T₄↑、TSH↓（原发）；甲减：T₃T₄↓、 TSH↑（原发） 抗甲状腺药（甲巯咪唑/丙硫氧嘧啶）抑制 TP O 10版删去了「甲状腺激素对消化系统的影响」 一段 胎儿期缺碘 → 呆小症（智力+身材都受损）； 成人缺碘 → 单纯性甲状腺肿 摄碘→TPO碘化→偶联→TSH促释放；缺碘胎儿期致 呆小症、成人致甲状腺肿","fig_ph11_adrenal":"肾上腺：皮质三层 + 髓质 三层各管一类激素，口诀：球盐、束糖、网性 球状带 球盐 盐皮质激素（醛固酮）——保钠排钾 束状带 束糖 糖皮质激素（皮质醇）——升糖抗炎 网状带 网性 性激素（雄激素为主） 髓质 髓质 肾上腺素 + 去甲肾上腺素（交感节后神经元 ） 糖皮质激素的「抗炎」双刃 · 治疗量：抗炎、抗过敏、抗休克、抑制免疫 · 但同时：升血糖、升血压、抑骨形成、 抑免疫 · 长期用：库欣样表现（满月脸、水牛背、 骨质疏松、易感染） 调节差别：醛固酮主要受 RAAS 与血钾调节； 皮质醇受 ACTH 调节 应激时 CRH→ACTH→皮质醇急剧升高，是「允许 作用」的基础 嗜铬细胞瘤：髓质分泌大量儿茶酚胺 → 阵发性 高血压 球盐、束糖、网性；醛固酮看 RAAS 与血钾， 皮质醇看 ACTH","fig_ph11_insulin":"血糖稳态：胰岛素与升糖激素的对抗 胰岛素是唯一降糖激素，升糖的有好几个 胰岛素（β细胞） 唯一降糖 促糖摄取、促糖原合成、抑糖异生 → 血糖↓ 胰高血糖素（α） 促糖原分解与糖异生 → 血糖↑ 肾上腺素 促糖原分解 → 血糖↑（应激） 糖皮质激素 促糖异生、抗胰岛素 → 血糖↑ 生长激素 抗胰岛素作用 → 血糖↑ 胰岛素分泌的调节 · 血糖升高：最强刺激（尤其口服葡萄糖， 因肠促胰岛素效应） · 氨基酸、脂肪酸、酮体也可刺激 · 迷走神经兴奋 → 促分泌；交感（α₂）→ 抑 制 · GLP-1、GIP（肠促胰岛素）在进食后提前 放大分泌 10版新增「血糖稳态的激素调节」一节， 把上述内容整合 胰岛素促进 K⁺ 进入细胞 → 低钾时补钾同时 给糖可加速纠正 糖尿病酮症酸中毒：胰岛素绝对不足 → 脂肪分 解 → 酮体堆积 → 代谢性酸中毒 胰岛素唯一降糖（促摄取、促合成、抑异生）； 升糖激素有五个","fig_ph12_menstrual":"月经周期：四个激素的时序 以排卵为界，前半卵泡期、后半黄体期 ① 月经期（1~5 天） 雌孕激素均低 → 内膜脱落 ② 卵泡期（6~14 天） FSH 促卵泡发育 → 雌激素↑ → 内膜增生 ③ 排卵（约 14 天） 雌激素高峰正反馈 → LH 峰 → 排卵 ④ 黄体期（15~28 天） 黄体分泌孕激素 → 内膜转为分泌期 必须记住的两个「峰」与两个「反馈」 · 雌激素有两个峰：排卵前高峰（最高）、 黄体期次峰 · 孕激素只有一个峰：黄体期（排卵后 7~8 天） · 排卵前：雌激素对 LH 是「正反馈」——这是 全身唯一重要的正反馈 · 黄体期：孕激素对 FSH/LH 是「负反馈」 基础体温：排卵后孕激素使体温升高 0.3~0.5 ℃，持续到下次月经前 黄体寿命约 14 天，若未受孕则萎缩 → 雌孕 激素下降 → 月经来潮 HCG 结构类似 LH，可维持黄体——这是早孕试 纸的原理 雌激素双峰、孕激素单峰；排卵前雌激素对LH是 正反馈（全身唯一）","fig_ph12_pregnancy":"妊娠的维持与分娩启动 HCG 救黄体，催产素发动分娩 ① 着床 受精后 6~7 天，滋养层侵入内膜 ② HCG 滋养层分泌，维持黄体不萎缩 → 继续分泌孕 激素 ③ 胎盘接替 约 8~10 周后胎盘自己分泌孕激素，黄体可退 化 ④ 分娩启动 催产素 + 前列腺素 → 子宫收缩 → 正反馈加 强 分娩为什么是正反馈 · 宫缩 → 压迫宫颈 → 催产素释放↑ → 宫缩 更强 · 直到胎儿娩出，刺激消失，循环终止 · 这是正反馈「必须完成任务」的典型 HCG 在妊娠 8~10 周达高峰，之后下降——早孕 反应与高峰相关 孕激素使子宫安静（抑制收缩），这是保胎的 激素基础 催产素对子宫的作用在妊娠末期才明显（ 受体增多），故可用于引产 HCG 救黄体→胎盘接替；分娩靠催产素正反馈直 到胎儿娩出","fig_ph13_growth":"生长发育的规律与激素调控（第10版新增整章 ） 两个生长突增期；两种激素分工 第一突增期 婴儿期 婴儿期（0~1 岁），身高增长最快 第二突增期 青春期 青春期（女孩约 10~12 岁，男孩约 12~14 岁） 两种激素的分工 · 生长激素 GH：促长骨生长（经 IGF-1 介 导），几乎全程起作用 · 甲状腺激素：胎儿期与婴幼儿期对脑发育最 关键，缺则呆小症 · 性激素：青春期促突增并促骨骺闭合（ 闭合后不再长高） · 胰岛素、皮质醇也参与，但非主导 幼年 GH 缺乏 → 侏儒症（身材矮小但智力正 常） 幼年 GH 过多 → 巨人症；成年后过多 → 肢端 肥大症 甲状腺激素缺乏 → 呆小症（智力与身材都受影 响）——两者区别就在智力 GH 管长骨（侏儒但智力正常）、甲状腺激素管 脑发育（呆小症智力受损）","fig_ph13_aging":"衰老的主要机制与生理变化 多因素累积，不是单一原因 主要学说（并存，非互斥） · 自由基学说：氧自由基损伤 DNA、蛋白、 脂质 · 端粒学说：体细胞端粒逐代缩短，达极限则 停止分裂 · 基因程序学说：衰老由遗传程序调控 · 免疫功能衰退：识别与清除异常细胞能力下 降 主要系统的生理变化 · 心血管：动脉弹性↓、收缩压↑、心输出量储 备↓ · 呼吸：肺弹性回缩↓、残气量↑、动脉血氧略 降 · 肾：肾单位减少、GFR↓、浓缩能力↓ · 神经：反应变慢、记忆减退（尤其近期记忆 ） · 内分泌：多种激素水平与受体敏感性下降 老年用药注意：GFR 下降使经肾排泄药物蓄积， 需减量 老年人对缺氧与低血压的代偿能力下降， 故症状常不典型 「生理性衰老」与「病理性改变」要区分： 前者不可逆，后者可干预 衰老是多机制累积（自由基+端粒+程序+免疫）； 老年用药需按肾功能减量"};

let curCh = 'all', kw = '';

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;')
  .replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function renderChips(){
  const el = document.getElementById('chips');
  let h = `<div class="chip ${curCh==='all'?'on':''}" data-ch="all">全部 ${CARDS.length}</div>`;
  for (const [k, name] of CHAPTERS) {
    const n = CARDS.filter(c => c[0].slice(3,5) === k).length;
    h += `<div class="chip ${curCh===k?'on':''}" data-ch="${k}">${k} ${name}<b style="opacity:.65;margin-left:3px">${n}</b></div>`;
  }
  el.innerHTML = h;
  el.querySelectorAll('.chip').forEach(c => {
    c.onclick = () => { curCh = c.dataset.ch; renderChips(); renderList(); };
  });
}

function cardText(c){
  let t = c[1] + ' ';
  for (const b of c[3]) {
    if (b[0] === 'q' || b[0] === 'q2') t += b[1] + ' ';
    else if (b[0] === 'l') t += b[2].join(' ') + ' ';
    else if (b[0] === 't') t += b[1] + ' ' + b[3].flat().join(' ') + ' ';
    else if (b[0] === 'i') {
      t += (b[2]||'') + ' ';
      // 图里的文字也要能被搜到（去掉标签只留文本）
      t += (FIGS[b[1]] || '') + ' ';
    }
  }
  return t;
}

function renderList(){
  const list = document.getElementById('list');
  let sel = CARDS.filter(c => curCh === 'all' || c[0].slice(3,5) === curCh);
  if (kw) {
    const k = kw.toLowerCase().replace(/\s+/g,'');
    sel = sel.filter(c => cardText(c).toLowerCase().replace(/\s+/g,'').includes(k));
  }
  document.getElementById('stat').textContent =
    `共 ${sel.length} 张卡` + (kw ? `（搜索「${kw}」）` : '');
  let html = '';
  for (const [id, title, lv, blocks] of sel) {
    const ch = id.slice(3,5);
    html += `<div class="card" id="card-${id}" data-fig="${(blocks.find(b=>b[0]==='i')||[])[1]||''}">
      <h2>${esc(title)}<span class="lv">第${Number(ch)}章</span></h2>`;
    for (const b of blocks) {
      if (b[0] === 'q') {
        html += `<div class="q">★ ${esc(b[1])}</div>`;
      } else if (b[0] === 'q2') {
        html += `<div class="q" style="background:#fffbeb;border-color:#b45309">`
             +  `💡 ${esc(b[1])}</div>`;
      } else if (b[0] === 'i') {
        html += `<div class="fig" onclick="zoomFig('${b[1]}')">
          <img loading="lazy" decoding="async" src="figs/${b[1]}.svg" alt="${esc(b[2]||'')}"
               style="display:block;width:100%;max-width:330px;height:auto;margin:0 auto">
          <div class="fig-cap">${esc(b[2]||'')}</div>
          <div class="fig-tip">🔍 点击全屏</div></div>`;
      } else if (b[0] === 't') {
        html += `<div class="tw"><table><tr>${b[2].map(h=>`<th>${esc(h)}</th>`).join('')}</tr>`;
        for (const r of b[3]) html += `<tr>${r.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`;
        html += `</table></div>`;
      } else if (b[0] === 'l') {
        html += `<ul>${b[2].map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
      }
    }
    html += `</div>`;
  }
  list.innerHTML = html || '<p style="color:#64748b;padding:20px;text-align:center">没有匹配的卡片</p>';
}

let zEl = null;
function zoomFig(id){
  const src = 'figs/' + id + '.svg';
  if (!zEl) {
    zEl = document.createElement('div');
    zEl.className = 'zoom';
    zEl.onclick = () => zEl.classList.remove('on');
    document.body.appendChild(zEl);
  }
  zEl.innerHTML = `<div class="in"><img src="${src}" alt="" style="display:block;width:100%;height:auto"><div class="tip">点击任意处关闭</div></div>`;
  zEl.classList.add('on');
}

document.getElementById('q').addEventListener('input', e => {
  kw = e.target.value.trim();
  renderList();
});

renderChips();
renderList();

/* 深链定位：physio.html#PH-04-01 → 切到该章并滚动高亮 */
(function(){
  function gotoHash(){
    var h = (location.hash || '').replace('#','').trim();
    if (!h) return;
    if (h.indexOf('fig_') === 0) {
      var cf = document.querySelector('[data-fig="' + h + '"]');
      if (cf) {
        var mm = /card-PH-(\d{2})-/.exec(cf.id);
        if (mm) { curCh = mm[1]; renderChips(); renderList(); }
        setTimeout(function(){
          var e2 = document.querySelector('[data-fig="' + h + '"]');
          if (e2) {
            e2.scrollIntoView({behavior:'smooth', block:'start'});
            e2.style.transition = 'box-shadow .4s';
            e2.style.boxShadow = '0 0 0 3px #0f766e';
            setTimeout(function(){ e2.style.boxShadow = ''; }, 2400);
          }
        }, 80);
        return;
      }
    }
    var m = /^PH-(\d{2})-/.exec(h) || /^card-PH-(\d{2})-/.exec(h);
    if (m) { curCh = m[1]; renderChips(); renderList(); }
    var el = document.getElementById('card-' + h.replace(/^card-/, ''))
          || document.getElementById(h);
    if (el) {
      el.scrollIntoView({behavior:'smooth', block:'start'});
      el.style.transition = 'box-shadow .4s';
      el.style.boxShadow = '0 0 0 3px #0f766e';
      setTimeout(function(){ el.style.boxShadow = ''; }, 2200);
    }
  }
  window.addEventListener('load', function(){ setTimeout(gotoHash, 60); });
  window.addEventListener('hashchange', gotoHash);
})();
