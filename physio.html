width=\"308.0\" height=\"51.0\" rx=\"7\" fill=\"#ccfbf1\" stroke=\"#0f766e\" stroke-width=\"1.2\"/><text x=\"165.0\" y=\"539.5\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"700\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">抗体总是针对自己没有的抗原；O 型红细胞可急</text><text x=\"165.0\" y=\"555.0\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"700\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">用，但血浆不能乱给</text></svg>","fig_ph04_cardiac_cycle":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 330 621\" width=\"100%\" style=\"max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px\" role=\"img\"><text x=\"165.0\" y=\"22.6\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"700\" fill=\"#1e293b\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">心动周期：压力决定瓣膜开关</text><text x=\"165.0\" y=\"43.0\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"400\" fill=\"#64748b\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">瓣膜只听压力差的话——这是理解全章的总钥匙</text><rect x=\"15.0\" y=\"60.0\" width=\"300.0\" height=\"38.0\" rx=\"6\" fill=\"#fef3c7\" stroke=\"#b45309\" stroke-width=\"1.4\"/><text x=\"27.0\" y=\"80.0\" text-anchor=\"start\" font-size=\"14\" font-weight=\"700\" fill=\"#b45309\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">① 等容收缩期</text><text x=\"27.0\" y=\"98.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">房室瓣、半月瓣均关；室内压急升，容积不变</text><line x1=\"165.0\" y1=\"99.0\" x2=\"165.0\" y2=\"99.5\" stroke=\"#64748b\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><polygon points=\"165.0,104.0 163.0,99.4 167.0,99.4\" fill=\"#64748b\"/><rect x=\"15.0\" y=\"105.0\" width=\"300.0\" height=\"38.0\" rx=\"6\" fill=\"#fee2e2\" stroke=\"#b91c1c\" stroke-width=\"1.4\"/><text x=\"27.0\" y=\"125.0\" text-anchor=\"start\" font-size=\"14\" font-weight=\"700\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">② 快速射血期</text><text x=\"27.0\" y=\"143.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">室内压 &gt; 主动脉压 → 半月瓣开，血射出</text><line x1=\"165.0\" y1=\"144.0\" x2=\"165.0\" y2=\"144.5\" stroke=\"#64748b\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><polygon points=\"165.0,149.0 163.0,144.4 167.0,144.4\" fill=\"#64748b\"/><rect x=\"15.0\" y=\"150.0\" width=\"300.0\" height=\"38.0\" rx=\"6\" fill=\"#fee2e2\" stroke=\"#b91c1c\" stroke-width=\"1.4\"/><text x=\"27.0\" y=\"170.0\" text-anchor=\"start\" font-size=\"14\" font-weight=\"700\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">③ 减慢射血期</text><text x=\"27.0\" y=\"188.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">室内压略降，靠惯性继续射血</text><line x1=\"165.0\" y1=\"189.0\" x2=\"165.0\" y2=\"189.5\" stroke=\"#64748b\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><polygon points=\"165.0,194.0 163.0,189.4 167.0,189.4\" fill=\"#64748b\"/><rect x=\"15.0\" y=\"195.0\" width=\"300.0\" height=\"54.0\" rx=\"6\" fill=\"#ccfbf1\" stroke=\"#0f766e\" stroke-width=\"1.4\"/><text x=\"27.0\" y=\"215.0\" text-anchor=\"start\" font-size=\"14\" font-weight=\"700\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">④ 等容舒张期</text><text x=\"27.0\" y=\"233.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">半月瓣关闭、房室瓣未开；室内压急降，</text><text x=\"27.0\" y=\"249.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">容积不变</text><line x1=\"165.0\" y1=\"250.0\" x2=\"165.0\" y2=\"250.5\" stroke=\"#64748b\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><polygon points=\"165.0,255.0 163.0,250.4 167.0,250.4\" fill=\"#64748b\"/><rect x=\"15.0\" y=\"256.0\" width=\"300.0\" height=\"38.0\" rx=\"6\" fill=\"#ccfbf1\" stroke=\"#0f766e\" stroke-width=\"1.4\"/><text x=\"27.0\" y=\"276.0\" text-anchor=\"start\" font-size=\"14\" font-weight=\"700\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">⑤ 快速充盈期</text><text x=\"27.0\" y=\"294.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">室内压 &lt; 房内压 → 房室瓣开，血快速流入</text><line x1=\"165.0\" y1=\"295.0\" x2=\"165.0\" y2=\"295.5\" stroke=\"#64748b\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><polygon points=\"165.0,300.0 163.0,295.4 167.0,295.4\" fill=\"#64748b\"/><rect x=\"15.0\" y=\"301.0\" width=\"300.0\" height=\"38.0\" rx=\"6\" fill=\"#dcfce7\" stroke=\"#15803d\" stroke-width=\"1.4\"/><text x=\"27.0\" y=\"321.0\" text-anchor=\"start\" font-size=\"14\" font-weight=\"700\" fill=\"#15803d\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">⑥ 减慢充盈 + 心房收缩</text><text x=\"27.0\" y=\"339.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">最后 25% 由心房收缩挤入</text><rect x=\"15.0\" y=\"341.0\" width=\"300.0\" height=\"134.0\" rx=\"7\" fill=\"#f8fafc\" stroke=\"#cbd5e1\" stroke-width=\"1.4\"/><text x=\"25.0\" y=\"360.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"700\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">必记的三个「不变」与两个「最高」</text><text x=\"25.0\" y=\"378.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">· 等容收缩期：容积不变、瓣膜全关、</text><text x=\"25.0\" y=\"394.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">室内压上升最快</text><text x=\"25.0\" y=\"410.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">· 等容舒张期：容积不变、瓣膜全关、</text><text x=\"25.0\" y=\"426.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">室内压下降最快</text><text x=\"25.0\" y=\"442.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">· 室内压最高：快速射血期末；室内压最低：</text><text x=\"25.0\" y=\"458.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">快速充盈期末</text><rect x=\"15.0\" y=\"483.0\" width=\"300.0\" height=\"76.0\" rx=\"7\" fill=\"#fee2e2\" stroke=\"#b91c1c\" stroke-width=\"1.2\"/><text x=\"25.0\" y=\"499.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"700\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">第一心音＝房室瓣关闭（心室收缩开始）；</text><text x=\"25.0\" y=\"515.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">第二心音＝半月瓣关闭（舒张开始）</text><text x=\"25.0\" y=\"531.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">心率过快时舒张期缩短更明显 → 充盈不足 → </text><text x=\"25.0\" y=\"547.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">每搏输出量下降</text><rect x=\"11.0\" y=\"562.0\" width=\"308.0\" height=\"51.0\" rx=\"7\" fill=\"#ccfbf1\" stroke=\"#0f766e\" stroke-width=\"1.2\"/><text x=\"165.0\" y=\"577.0\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"700\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">瓣膜开关只看压力差；等容期双瓣全关、</text><text x=\"165.0\" y=\"592.5\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"700\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">容积不变，是判断周期的锚点</text></svg>","fig_ph04_cardiac_output":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 330 503.5\" width=\"100%\" style=\"max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px\" role=\"img\"><text x=\"165.0\" y=\"22.6\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"700\" fill=\"#1e293b\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">心输出量：四个影响因素</text><text x=\"165.0\" y=\"42.6\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"400\" fill=\"#64748b\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">CO = HR × SV；影响 SV 的又分前后负荷与收缩力</text><rect x=\"15.0\" y=\"59.5\" width=\"300.0\" height=\"34.0\" rx=\"6\" fill=\"#ccfbf1\" stroke=\"#0f766e\" stroke-width=\"1.4\"/><text x=\"165.0\" y=\"82.5\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"700\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">心输出量 CO = 心率 HR × 搏出量 SV</text><rect x=\"15.0\" y=\"99.5\" width=\"300.0\" height=\"60.0\" rx=\"6\" fill=\"#dcfce7\" stroke=\"#15803d\" stroke-width=\"1.4\"/><text x=\"24.0\" y=\"118.5\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"700\" fill=\"#15803d\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">前负荷（异长调节）</text><text x=\"24.0\" y=\"135.5\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">心室舒张末期容积↑ → 初长度↑ → 收缩力↑</text><text x=\"24.0\" y=\"153.5\" text-anchor=\"start\" font-size=\"13\" font-weight=\"400\" fill=\"#15803d\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">一定范围内正相关；超出则过度牵拉反而下降</text><rect x=\"15.0\" y=\"165.5\" width=\"300.0\" height=\"60.0\" rx=\"6\" fill=\"#fef3c7\" stroke=\"#b45309\" stroke-width=\"1.4\"/><text x=\"24.0\" y=\"184.5\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"700\" fill=\"#b45309\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">后负荷（动脉压）</text><text x=\"24.0\" y=\"201.5\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">动脉压↑ → 射血阻力↑ → 搏出量↓</text><text x=\"24.0\" y=\"219.5\" text-anchor=\"start\" font-size=\"13\" font-weight=\"400\" fill=\"#b45309\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">但通过异长自身调节可部分代偿</text><rect x=\"15.0\" y=\"231.5\" width=\"300.0\" height=\"60.0\" rx=\"6\" fill=\"#fee2e2\" stroke=\"#b91c1c\" stroke-width=\"1.4\"/><text x=\"24.0\" y=\"250.5\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"700\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">心肌收缩力（等长调节）</text><text x=\"24.0\" y=\"267.5\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">交感兴奋 → Ca²⁺↑ → 收缩力↑</text><text x=\"24.0\" y=\"285.5\" text-anchor=\"start\" font-size=\"13\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">不依赖初长度，与前后负荷无关</text><rect x=\"15.0\" y=\"297.5\" width=\"300.0\" height=\"60.0\" rx=\"6\" fill=\"#ccfbf1\" stroke=\"#0f766e\" stroke-width=\"1.4\"/><text x=\"24.0\" y=\"316.5\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"700\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">心率</text><text x=\"24.0\" y=\"333.5\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">过快 → 舒张期缩短 → 充盈不足 → SV↓</text><text x=\"24.0\" y=\"351.5\" text-anchor=\"start\" font-size=\"13\" font-weight=\"400\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">过慢 → 虽然充盈足但次数少 → CO 也下降</text><rect x=\"15.0\" y=\"365.5\" width=\"300.0\" height=\"76.0\" rx=\"7\" fill=\"#fee2e2\" stroke=\"#b91c1c\" stroke-width=\"1.2\"/><text x=\"25.0\" y=\"381.5\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"700\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">Frank-Starling 定律＝异长自身调节：</text><text x=\"25.0\" y=\"397.5\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">回心血量越多，收缩越强（有一定限度）</text><text x=\"25.0\" y=\"413.5\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">等长调节＝心肌收缩能力改变，不改变初长度—</text><text x=\"25.0\" y=\"429.5\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">—交感兴奋属此类</text><rect x=\"11.0\" y=\"444.5\" width=\"308.0\" height=\"51.0\" rx=\"7\" fill=\"#ccfbf1\" stroke=\"#0f766e\" stroke-width=\"1.2\"/><text x=\"165.0\" y=\"459.5\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"700\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">CO=HR×SV；前负荷增收缩力、后负荷减搏出量、</text><text x=\"165.0\" y=\"475.0\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"700\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">交感增强收缩力</text></svg>","fig_ph04_myocyte_ap":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 330 553.5\" width=\"100%\" style=\"max- 4\" fill=\"#64748b\"/><rect x=\"15.0\" y=\"105.0\" width=\"300.0\" height=\"54.0\" rx=\"6\" fill=\"#ccfbf1\" stroke=\"#0f766e\" stroke-width=\"1.4\"/><text x=\"27.0\" y=\"125.0\" text-anchor=\"start\" font-size=\"14\" font-weight=\"700\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">压力感受器兴奋</text><text x=\"27.0\" y=\"143.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">颈动脉窦（窦神经→舌咽神经）、主动脉弓（</text><text x=\"27.0\" y=\"159.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">减压神经→迷走）</text><line x1=\"165.0\" y1=\"160.0\" x2=\"165.0\" y2=\"160.5\" stroke=\"#64748b\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><polygon points=\"165.0,165.0 163.0,160.4 167.0,160.4\" fill=\"#64748b\"/><rect x=\"15.0\" y=\"166.0\" width=\"300.0\" height=\"38.0\" rx=\"6\" fill=\"#ccfbf1\" stroke=\"#0f766e\" stroke-width=\"1.4\"/><text x=\"27.0\" y=\"186.0\" text-anchor=\"start\" font-size=\"14\" font-weight=\"700\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">延髓心血管中枢</text><text x=\"27.0\" y=\"204.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">心迷走中枢↑、心交感中枢↓、缩血管中枢↓</text><line x1=\"165.0\" y1=\"205.0\" x2=\"165.0\" y2=\"205.5\" stroke=\"#64748b\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><polygon points=\"165.0,210.0 163.0,205.4 167.0,205.4\" fill=\"#64748b\"/><rect x=\"15.0\" y=\"211.0\" width=\"300.0\" height=\"38.0\" rx=\"6\" fill=\"#dcfce7\" stroke=\"#15803d\" stroke-width=\"1.4\"/><text x=\"27.0\" y=\"231.0\" text-anchor=\"start\" font-size=\"14\" font-weight=\"700\" fill=\"#15803d\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">效应</text><text x=\"27.0\" y=\"249.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">心率↓、心肌收缩力↓、血管舒张</text><line x1=\"165.0\" y1=\"250.0\" x2=\"165.0\" y2=\"250.5\" stroke=\"#64748b\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><polygon points=\"165.0,255.0 163.0,250.4 167.0,250.4\" fill=\"#64748b\"/><rect x=\"15.0\" y=\"256.0\" width=\"300.0\" height=\"38.0\" rx=\"6\" fill=\"#dcfce7\" stroke=\"#15803d\" stroke-width=\"1.4\"/><text x=\"27.0\" y=\"276.0\" text-anchor=\"start\" font-size=\"14\" font-weight=\"700\" fill=\"#15803d\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">血压 ↓</text><text x=\"27.0\" y=\"294.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">回到调定点（负反馈完成）</text><rect x=\"15.0\" y=\"296.0\" width=\"300.0\" height=\"118.0\" rx=\"7\" fill=\"#f8fafc\" stroke=\"#cbd5e1\" stroke-width=\"1.4\"/><text x=\"25.0\" y=\"315.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"700\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">必须掌握的两个「反」</text><text x=\"25.0\" y=\"333.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">· 血压↑ → 反射使血压↓（这就是负反馈）</text><text x=\"25.0\" y=\"349.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">· 血压↓ → 反射使血压↑（同一反射的另一方</text><text x=\"25.0\" y=\"365.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">向）</text><text x=\"25.0\" y=\"381.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">· 切断减压神经 → 血压升高且波动大（</text><text x=\"25.0\" y=\"397.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">失去缓冲）</text><rect x=\"15.0\" y=\"422.0\" width=\"300.0\" height=\"108.0\" rx=\"7\" fill=\"#fee2e2\" stroke=\"#b91c1c\" stroke-width=\"1.2\"/><text x=\"25.0\" y=\"438.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"700\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">颈动脉窦主要感受「搏动性」压力变化，</text><text x=\"25.0\" y=\"454.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">对快速变化更敏感</text><text x=\"25.0\" y=\"470.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">压力感受器在「正常血压范围内」最敏感；</text><text x=\"25.0\" y=\"486.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">长期高血压会重设调定点</text><text x=\"25.0\" y=\"502.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">颈动脉体化学感受器管呼吸，别与颈动脉窦压</text><text x=\"25.0\" y=\"518.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">力感受器搞混</text><rect x=\"11.0\" y=\"533.0\" width=\"308.0\" height=\"51.0\" rx=\"7\" fill=\"#ccfbf1\" stroke=\"#0f766e\" stroke-width=\"1.2\"/><text x=\"165.0\" y=\"548.0\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"700\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">血压↑→压力感受器→延髓→心率↓血管舒张→血压↓；</text><text x=\"165.0\" y=\"563.5\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"700\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">这属负反馈</text></svg>","fig_ph04_coronary":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 330 518.5\" width=\"100%\" style=\"max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px\" role=\"img\"><text x=\"165.0\" y=\"21.3\" text-anchor=\"middle\" font-size=\"15.5\" font-weight=\"700\" fill=\"#1e293b\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">冠脉循环：为什么心肌收缩时血流反而减少</text><text x=\"165.0\" y=\"41.5\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"400\" fill=\"#64748b\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">左冠血流主要发生在舒张期</text><rect x=\"15.0\" y=\"58.5\" width=\"300.0\" height=\"54.0\" rx=\"6\" fill=\"#fee2e2\" stroke=\"#b91c1c\" stroke-width=\"1.4\"/><text x=\"27.0\" y=\"78.5\" text-anchor=\"start\" font-size=\"14\" font-weight=\"700\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">收缩期</text><text x=\"27.0\" y=\"96.5\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">心室壁挤压壁内血管 → 左冠血流↓（可近乎中</text><text x=\"27.0\" y=\"112.5\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">断）</text><line x1=\"165.0\" y1=\"113.5\" x2=\"165.0\" y2=\"115.0\" stroke=\"#64748b\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><polygon points=\"165.0,119.5 163.0,114.9 167.0,114.9\" fill=\"#64748b\"/><rect x=\"15.0\" y=\"120.5\" width=\"300.0\" height=\"54.0\" rx=\"6\" fill=\"#dcfce7\" stroke=\"#15803d\" stroke-width=\"1.4\"/><text x=\"27.0\" y=\"140.5\" text-anchor=\"start\" font-size=\"14\" font-weight=\"700\" fill=\"#15803d\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">舒张早期</text><text x=\"27.0\" y=\"158.5\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">心肌松弛，挤压解除 → 左冠血流骤增（</text><text x=\"27.0\" y=\"174.5\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">主要灌注期）</text><line x1=\"165.0\" y1=\"175.5\" x2=\"165.0\" y2=\"177.0\" stroke=\"#64748b\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><polygon points=\"165.0,181.5 163.0,176.9 167.0,176.9\" fill=\"#64748b\"/><rect x=\"15.0\" y=\"182.5\" width=\"300.0\" height=\"38.0\" rx=\"6\" fill=\"#ccfbf1\" stroke=\"#0f766e\" stroke-width=\"1.4\"/><text x=\"27.0\" y=\"202.5\" text-anchor=\"start\" font-size=\"14\" font-weight=\"700\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">舒张期</text><text x=\"27.0\" y=\"220.5\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">主动脉压仍高，冠脉持续灌注</text><rect x=\"15.0\" y=\"222.5\" width=\"300.0\" height=\"118.0\" rx=\"7\" fill=\"#f8fafc\" stroke=\"#cbd5e1\" stroke-width=\"1.4\"/><text x=\"25.0\" y=\"241.5\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"700\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">冠脉循环的四个特点</text><text x=\"25.0\" y=\"259.5\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">· 血流丰富：占心输出量 4~5%，但心脏只占</text><text x=\"25.0\" y=\"275.5\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">体重 0.5%</text><text x=\"25.0\" y=\"291.5\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">· 摄氧率高：静息已摄取 70~75%，储备很少</text><text x=\"25.0\" y=\"307.5\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">· 血流有周期性：左冠主要靠舒张期灌注</text><text x=\"25.0\" y=\"323.5\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">· 代谢调节为主：腺苷是最重要的舒血管物质</text><rect x=\"15.0\" y=\"348.5\" width=\"300.0\" height=\"108.0\" rx=\"7\" fill=\"#fee2e2\" stroke=\"#b91c1c\" stroke-width=\"1.2\"/><text x=\"25.0\" y=\"364.5\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"700\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">心率过快时舒张期缩短最明显 → 冠脉灌注不足</text><text x=\"25.0\" y=\"380.5\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\"> → 心肌缺血</text><text x=\"25.0\" y=\"396.5\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">10版新增「冠脉有效灌注压」概念：主动脉压 </text><text x=\"25.0\" y=\"412.5\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">− 心室舒张末压</text><text x=\"25.0\" y=\"428.5\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">因此主动脉舒张压降低（如主动脉瓣关闭不全</text><text x=\"25.0\" y=\"444.5\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">）会造成冠脉缺血</text><rect x=\"11.0\" y=\"459.5\" width=\"308.0\" height=\"51.0\" rx=\"7\" fill=\"#ccfbf1\" stroke=\"#0f766e\" stroke-width=\"1.2\"/><text x=\"165.0\" y=\"474.5\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"700\" fill=\"#0f766e\" font-famil i',sans-serif\">CO₂ 溶解度约是 O₂ 的 24 倍</text><text x=\"24.0\" y=\"378.0\" text-anchor=\"start\" font-size=\"13\" font-weight=\"600\" fill=\"#64748b\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">故 CO₂ 更易扩散</text><rect x=\"15.0\" y=\"392.0\" width=\"300.0\" height=\"118.0\" rx=\"7\" fill=\"#f8fafc\" stroke=\"#cbd5e1\" stroke-width=\"1.4\"/><text x=\"25.0\" y=\"411.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"700\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">V/Q 比值失调的两种极端</text><text x=\"25.0\" y=\"429.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">· V/Q ↑（比值增大）：肺泡有通气无血流 →</text><text x=\"25.0\" y=\"445.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\"> 死腔样通气（肺栓塞）</text><text x=\"25.0\" y=\"461.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">· V/Q ↓（比值减小）：有血流无通气 → 功</text><text x=\"25.0\" y=\"477.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">能性分流（气道阻塞、肺不张）</text><text x=\"25.0\" y=\"493.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">· 正常人也有少量生理性分流与死腔</text><rect x=\"15.0\" y=\"518.0\" width=\"300.0\" height=\"44.0\" rx=\"7\" fill=\"#fee2e2\" stroke=\"#b91c1c\" stroke-width=\"1.2\"/><text x=\"25.0\" y=\"534.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"700\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">CO₂ 扩散能力远强于 O₂，所以早期缺氧往往</text><text x=\"25.0\" y=\"550.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">比 CO₂ 潴留更早出现</text><rect x=\"11.0\" y=\"565.0\" width=\"308.0\" height=\"51.0\" rx=\"7\" fill=\"#ccfbf1\" stroke=\"#0f766e\" stroke-width=\"1.2\"/><text x=\"165.0\" y=\"580.0\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"700\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">换气看分压差、面积、厚度、V/Q；V/Q失调是最</text><text x=\"165.0\" y=\"595.5\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"700\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">常见的换气障碍</text></svg>","fig_ph05_odc":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 330 496\" width=\"100%\" style=\"max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px\" role=\"img\"><text x=\"165.0\" y=\"22.6\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"700\" fill=\"#1e293b\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">氧解离曲线：为什么是 S 形</text><text x=\"165.0\" y=\"43.0\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"400\" fill=\"#64748b\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">上段平坦运输、中段陡释放、下段更陡</text><rect x=\"15.0\" y=\"60.0\" width=\"300.0\" height=\"150.0\" rx=\"5\" fill=\"#ffffff\" stroke=\"#cbd5e1\" stroke-width=\"1.2\"/><polyline points=\"49.0,184.0 55.4,183.8 61.7,183.0 68.0,181.2 74.4,178.2 80.8,174.1 87.1,169.0 93.4,163.1 99.8,156.6 106.2,149.9 112.5,143.3 118.9,137.0 125.2,131.0 131.6,125.5 137.9,120.5 144.2,116.0 150.6,112.1 156.9,108.5 163.3,105.4 169.6,102.6 176.0,100.2 182.3,98.1 188.7,96.2 195.0,94.5 201.4,93.0 207.8,91.7 214.1,90.5 220.5,89.5 226.8,88.5 233.2,87.7 239.5,87.0 245.8,86.3 252.2,85.7 258.5,85.1 264.9,84.6 271.2,84.2 277.6,83.8 284.0,83.4 290.3,83.0 296.6,82.7 303.0,82.4\" fill=\"none\" stroke=\"#0f766e\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/><line x1=\"49\" y1=\"184\" x2=\"303\" y2=\"184\" stroke=\"#94a3b8\" stroke-width=\"1.4\"/><line x1=\"49\" y1=\"184\" x2=\"49\" y2=\"78\" stroke=\"#94a3b8\" stroke-width=\"1.4\"/><text x=\"176.0\" y=\"202.0\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"400\" fill=\"#64748b\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">PO₂ (mmHg)</text><text x=\"43.0\" y=\"80.0\" text-anchor=\"start\" font-size=\"13\" font-weight=\"400\" fill=\"#64748b\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">SaO₂</text><text x=\"239.5\" y=\"86.0\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"#15803d\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">上段：平坦（运输）</text><text x=\"140.4\" y=\"138.0\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"#b45309\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">中段：陡</text><text x=\"55.0\" y=\"168.0\" text-anchor=\"start\" font-size=\"13\" font-weight=\"700\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">下段：更陡（组织释放）</text><rect x=\"15.0\" y=\"216.0\" width=\"300.0\" height=\"134.0\" rx=\"7\" fill=\"#f8fafc\" stroke=\"#cbd5e1\" stroke-width=\"1.4\"/><text x=\"25.0\" y=\"235.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"700\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">三条曲线的影响</text><text x=\"25.0\" y=\"253.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">· 左移（亲和力↑，释氧难）：pH↑、PCO₂↓、</text><text x=\"25.0\" y=\"269.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">温度↓、2,3-DPG↓、CO 中毒</text><text x=\"25.0\" y=\"285.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">· 右移（亲和力↓，释氧易）：pH↓（酸中毒）、</text><text x=\"25.0\" y=\"301.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">PCO₂↑、温度↑、2,3-DPG↑</text><text x=\"25.0\" y=\"317.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">· 记忆：酸、热、高二氧化碳 → 右移（</text><text x=\"25.0\" y=\"333.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">运动肌肉正好如此，多释氧）</text><rect x=\"15.0\" y=\"358.0\" width=\"300.0\" height=\"76.0\" rx=\"7\" fill=\"#fee2e2\" stroke=\"#b91c1c\" stroke-width=\"1.2\"/><text x=\"25.0\" y=\"374.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"700\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">P50 正常约 26~27 mmHg：Hb 氧饱和度 50%</text><text x=\"25.0\" y=\"390.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\"> 时的 PO₂</text><text x=\"25.0\" y=\"406.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">CO 中毒：不仅占据结合位点，还把曲线左移，</text><text x=\"25.0\" y=\"422.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">双重打击，故极度缺氧</text><rect x=\"11.0\" y=\"437.0\" width=\"308.0\" height=\"51.0\" rx=\"7\" fill=\"#ccfbf1\" stroke=\"#0f766e\" stroke-width=\"1.2\"/><text x=\"165.0\" y=\"452.0\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"700\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">曲线右移＝易释氧（酸热高CO₂）；左移＝难释</text><text x=\"165.0\" y=\"467.5\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"700\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">氧（碱冷低CO₂、CO中毒）</text></svg>","fig_ph05_control":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 330 496\" width=\"100%\" style=\"max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px\" role=\"img\"><text x=\"165.0\" y=\"22.6\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"700\" fill=\"#1e293b\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">呼吸运动的调节</text><text x=\"165.0\" y=\"43.0\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"400\" fill=\"#64748b\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">平时靠 CO₂/H⁺（中枢），应急靠低氧（外周）</text><rect x=\"15.0\" y=\"60.0\" width=\"300.0\" height=\"60.0\" rx=\"6\" fill=\"#fee2e2\" stroke=\"#b91c1c\" stroke-width=\"1.4\"/><text x=\"24.0\" y=\"79.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"700\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">中枢化学感受器</text><text x=\"24.0\" y=\"96.0\" text-anchor=\"start\" font-size=\"13\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">延髓，感受脑脊液 H⁺</text><text x=\"24.0\" y=\"114.0\" text-anchor=\"start\" font-size=\"13\" font-weight=\"600\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">CO₂ 的主要通路（占 80%）</text><rect x=\"15.0\" y=\"126.0\" width=\"300.0\" height=\"60.0\" rx=\"6\" fill=\"#fef3c7\" stroke=\"#b45309\" stroke-width=\"1.4\"/><text x=\"24.0\" y=\"145.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"700\" fill=\"#b45309\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">外周化学感受器</text><text x=\"24.0\" y=\"162.0\" text-anchor=\"start\" font-size=\"13\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">颈动脉体、主动脉体</text><text x=\"24.0\" y=\"180.0\" text-anchor=\"start\" font-size=\"13\" font-weight=\"600\" fill=\"#b45309\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">主要感受低氧（PO₂&lt;60 才明显）</text><rect x=\"15.0\" y=\"192.0\" width=\"300.0\" height=\"60.0\" rx=\"6\" fill=\"#ccfbf1\" stroke=\"#0f766e\" stroke-width=\"1.4\"/><text x=\"24.0\" y=\"211.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"700\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">肺牵张反射</text><text x=\"24.0\" y=\"228.0\" text-anchor=\"start\" font-size=\"13\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">肺扩张 → 抑制吸气</text><text x=\"24.0\" y=\"246.0\" text-anchor=\"start\" font-size=\"13\" font-weight=\"600\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">防止肺过度扩张</text><rect x=\"15.0\" y=\"258.0\" width=\"300.0\" height=\"60.0\" rx=\"6\" fill=\"#f8fafc\" stroke=\"#64748b\" stroke-width=\"1.4\"/><text x=\"24.0\" y=\"277.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"700\" fill=\"#64748b\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">防御性反射</text><text x=\"24.0\" y=\"294.0\" text-anchor=\"start\" font-size=\"13\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">咳嗽、喷嚏</text><text x=\"24.0\" y=\"312.0\" text-anchor=\"start\" font-size=\"13\" font-weight=\"600\" fill=\"#64748b\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">清除刺激物</text><rect x=\"15.0\" y=\"326.0\" width=\"300.0\" height=\"108.0\" rx=\"7\" fill=\"#fee2e2\" stroke=\"#b91c1c\" stroke-width=\"1.2\"/><text x=\"25.0\" y=\"342.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"700\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">关键：CO₂ 不是直接刺激中枢感受器，</text><text x=\"25.0\" y=\"358.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">而是透过血脑屏障生成 H⁺ 再起作用</text><text x=\"25.0\" y=\"374.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">CO₂ 对呼吸的刺激作用最强（比低氧强得多）</text><text x=\"25.0\" y=\"390.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">——所以给高浓度氧可能抑制呼吸</text><text x=\"25.0\" y=\"406.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">慢性 CO₂ 潴留（Ⅱ型呼衰）时呼吸驱动转为依</text><text x=\"25.0\" y=\"422.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">赖低氧，此时高浓度吸氧危险</text><rect x=\"11.0\" y=\"437.0\" width=\"308.0\" height=\"51.0\" rx=\"7\" fill=\"#ccfbf1\" stroke=\"#0f766e\" stroke-width=\"1.2\"/><text x=\"165.0\" y=\"452.0\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"700\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">CO₂经H⁺刺激中枢（主要通路）；低氧只在外周、</text><text x=\"165.0\" y=\"467.5\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"700\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">且是Ⅱ型呼衰的关键驱动</text></svg>","fig_ph06_gastric":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 330 556\" width=\"100%\" style=\"max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px\" role=\"img\"><text x=\"165.0\" y=\"22.6\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"700\" fill=\"#1e293b\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">胃液分泌的三个时相</text><text x=\"165.0\" y=\"43.0\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"400\" fill=\"#64748b\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">头期最「好吃」，胃期量最大，肠期最少</text><rect x=\"15.0\" y=\"60.0\" width=\"300.0\" height=\"60.0\" rx=\"6\" fill=\"#ccfbf1\" stroke=\"#0f766e\" stroke-width=\"1.4\"/><text x=\"24.0\" y=\"79.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"700\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">头期</text><text x=\"306.0\" y=\"79.0\" text-anchor=\"end\" font-size=\"13.5\" font-weight=\"700\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">30%</text><text x=\"24.0\" y=\"96.0\" text-anchor=\"start\" font-size=\"13\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">量大、酸度高、消化力强</text><text x=\"24.0\" y=\"114.0\" text-anchor=\"start\" font-size=\"13\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">视觉/嗅觉/咀嚼 → 迷走神经 → 胃腺</text><rect x=\"15.0\" y=\"126.0\" width=\"300.0\" height=\"60.0\" rx=\"6\" fill=\"#fee2e2\" stroke=\"#b91c1c\" stroke-width=\"1.4\"/><text x=\"24.0\" y=\"145.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"700\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">胃期</text><text x=\"306.0\" y=\"145.0\" text-anchor=\"end\" font-size=\"13.5\" font-weight=\"700\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">60%</text><text x=\"24.0\" y=\"162.0\" text-anchor=\"start\" font-size=\"13\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">量最大，酸度最高</text><text x=\"24.0\" y=\"180.0\" text-anchor=\"start\" font-size=\"13\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">食物扩张胃 + 蛋白分解产物 → 胃泌素</text><rect x=\"15.0\" y=\"192.0\" width=\"300.0\" heigh /><text x=\"25.0\" y=\"289.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"700\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">滤过膜三层与两个屏障</text><text x=\"25.0\" y=\"307.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">· 三层：内皮细胞窗孔 → 基膜 → 足细胞裂孔</text><text x=\"25.0\" y=\"323.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">· 机械屏障：按分子大小筛选（&gt;69 kDa 不</text><text x=\"25.0\" y=\"339.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">能过）</text><text x=\"25.0\" y=\"355.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">· 电学屏障：基膜带负电，排斥带负电的白蛋</text><text x=\"25.0\" y=\"371.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">白</text><text x=\"25.0\" y=\"387.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">· 故肾炎时白蛋白漏出（蛋白尿），因为负电</text><text x=\"25.0\" y=\"403.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">荷丢失</text><rect x=\"15.0\" y=\"428.0\" width=\"300.0\" height=\"92.0\" rx=\"7\" fill=\"#fee2e2\" stroke=\"#b91c1c\" stroke-width=\"1.2\"/><text x=\"25.0\" y=\"444.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"700\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">三个因素的增减方向要能立刻判断：入球收缩→</text><text x=\"25.0\" y=\"460.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">滤过↓；出球收缩→滤过↑</text><text x=\"25.0\" y=\"476.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">肾血流量自身调节：动脉压 80~180 mmHg 时</text><text x=\"25.0\" y=\"492.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">肾血流基本恒定（肌源学说）</text><text x=\"25.0\" y=\"508.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">滤过分数 = 肾小球滤过率/肾血浆流量 ≈ 19%</text><rect x=\"11.0\" y=\"523.0\" width=\"308.0\" height=\"51.0\" rx=\"7\" fill=\"#ccfbf1\" stroke=\"#0f766e\" stroke-width=\"1.2\"/><text x=\"165.0\" y=\"538.0\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"700\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">有效滤过压=毛细血管压−(胶渗压+囊内压)；</text><text x=\"165.0\" y=\"553.5\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"700\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">出球收缩使滤过↑，入球收缩使滤过↓</text></svg>","fig_ph08_reabsorb":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 330 557.5\" width=\"100%\" style=\"max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px\" role=\"img\"><text x=\"165.0\" y=\"22.6\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"700\" fill=\"#1e293b\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">肾小管各段重吸收什么</text><text x=\"165.0\" y=\"42.6\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"400\" fill=\"#64748b\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">近端小管是「主力」，髓袢管浓缩，远曲管管精细调节</text><rect x=\"15.0\" y=\"59.5\" width=\"300.0\" height=\"56.0\" rx=\"6\" fill=\"#ccfbf1\" stroke=\"#0f766e\" stroke-width=\"1.4\"/><text x=\"24.0\" y=\"78.5\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"700\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">近端小管</text><text x=\"24.0\" y=\"95.5\" text-anchor=\"start\" font-size=\"13\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">67% 的水、Na⁺；全部葡萄糖、氨基酸</text><text x=\"24.0\" y=\"111.5\" text-anchor=\"start\" font-size=\"13\" font-weight=\"600\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">等渗重吸收，量大</text><rect x=\"15.0\" y=\"121.5\" width=\"300.0\" height=\"56.0\" rx=\"6\" fill=\"#fef3c7\" stroke=\"#b45309\" stroke-width=\"1.4\"/><text x=\"24.0\" y=\"140.5\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"700\" fill=\"#b45309\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">髓袢降支细段</text><text x=\"24.0\" y=\"157.5\" text-anchor=\"start\" font-size=\"13\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">只透水，不透溶质</text><text x=\"24.0\" y=\"173.5\" text-anchor=\"start\" font-size=\"13\" font-weight=\"600\" fill=\"#b45309\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">水出、盐留 → 小管液变浓</text><rect x=\"15.0\" y=\"183.5\" width=\"300.0\" height=\"72.0\" rx=\"6\" fill=\"#fee2e2\" stroke=\"#b91c1c\" stroke-width=\"1.4\"/><text x=\"24.0\" y=\"202.5\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"700\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">髓袢升支粗段</text><text x=\"24.0\" y=\"219.5\" text-anchor=\"start\" font-size=\"13\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">主动重吸收 Na⁺-Cl⁻（Na⁺-K⁺-2Cl⁻ 同向转运</text><text x=\"24.0\" y=\"235.5\" text-anchor=\"start\" font-size=\"13\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">），不透水</text><text x=\"24.0\" y=\"251.5\" text-anchor=\"start\" font-size=\"13\" font-weight=\"600\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">盐出、水留 → 小管液变稀（稀释段）</text><rect x=\"15.0\" y=\"261.5\" width=\"300.0\" height=\"56.0\" rx=\"6\" fill=\"#ccfbf1\" stroke=\"#0f766e\" stroke-width=\"1.4\"/><text x=\"24.0\" y=\"280.5\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"700\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">远曲小管</text><text x=\"24.0\" y=\"297.5\" text-anchor=\"start\" font-size=\"13\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">Na⁺ 重吸收（受醛固酮调节），水不易通过</text><text x=\"24.0\" y=\"313.5\" text-anchor=\"start\" font-size=\"13\" font-weight=\"600\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">精细调节</text><rect x=\"15.0\" y=\"323.5\" width=\"300.0\" height=\"56.0\" rx=\"6\" fill=\"#dcfce7\" stroke=\"#15803d\" stroke-width=\"1.4\"/><text x=\"24.0\" y=\"342.5\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"700\" fill=\"#15803d\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">集合管</text><text x=\"24.0\" y=\"359.5\" text-anchor=\"start\" font-size=\"13\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">水（受 ADH 调节）、尿素</text><text x=\"24.0\" y=\"375.5\" text-anchor=\"start\" font-size=\"13\" font-weight=\"600\" fill=\"#15803d\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">决定最终尿量浓度</text><rect x=\"15.0\" y=\"387.5\" width=\"300.0\" height=\"108.0\" rx=\"7\" fill=\"#fee2e2\" stroke=\"#b91c1c\" stroke-width=\"1.2\"/><text x=\"25.0\" y=\"403.5\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"700\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">葡萄糖重吸收上限（肾糖阈）约 180 mg/dl，</text><text x=\"25.0\" y=\"419.5\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">超过则出现尿糖</text><text x=\"25.0\" y=\"435.5\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">髓袢升支粗段是「稀释段」：只出盐不出水，</text><text x=\"25.0\" y=\"451.5\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">小管液渗透压降到最低</text><text x=\"25.0\" y=\"467.5\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">袢利尿剂（呋塞米）作用在这里：抑制 Na⁺-K</text><text x=\"25.0\" y=\"483.5\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">⁺-2Cl⁻ 转运 → 强效利尿</text><rect x=\"11.0\" y=\"498.5\" width=\"308.0\" height=\"51.0\" rx=\"7\" fill=\"#ccfbf1\" stroke=\"#0f766e\" stroke-width=\"1.2\"/><text x=\"165.0\" y=\"513.5\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"700\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">近端小管重吸收 67% 水钠；髓袢升支粗段只出</text><text x=\"165.0\" y=\"529.0\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"700\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">盐不出水＝稀释段</text></svg>","fig_ph08_loop":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 330 615\" width=\"100%\" style=\"max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px\" role=\"img\"><text x=\"165.0\" y=\"22.6\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"700\" fill=\"#1e293b\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">尿液浓缩 00\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">旁细胞释放肾素</text><line x1=\"165.0\" y1=\"115.0\" x2=\"165.0\" y2=\"115.5\" stroke=\"#64748b\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><polygon points=\"165.0,120.0 163.0,115.4 167.0,115.4\" fill=\"#64748b\"/><rect x=\"15.0\" y=\"121.0\" width=\"300.0\" height=\"38.0\" rx=\"6\" fill=\"#ccfbf1\" stroke=\"#0f766e\" stroke-width=\"1.4\"/><text x=\"27.0\" y=\"141.0\" text-anchor=\"start\" font-size=\"14\" font-weight=\"700\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">② 血管紧张素原</text><text x=\"27.0\" y=\"159.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">肝产生，被肾素切成 Ang Ⅰ（十肽）</text><line x1=\"165.0\" y1=\"160.0\" x2=\"165.0\" y2=\"160.5\" stroke=\"#64748b\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><polygon points=\"165.0,165.0 163.0,160.4 167.0,160.4\" fill=\"#64748b\"/><rect x=\"15.0\" y=\"166.0\" width=\"300.0\" height=\"38.0\" rx=\"6\" fill=\"#ccfbf1\" stroke=\"#0f766e\" stroke-width=\"1.4\"/><text x=\"27.0\" y=\"186.0\" text-anchor=\"start\" font-size=\"14\" font-weight=\"700\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">③ Ang Ⅰ → Ang Ⅱ</text><text x=\"27.0\" y=\"204.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">经肺 ACE（血管紧张素转换酶）切除两肽</text><line x1=\"165.0\" y1=\"205.0\" x2=\"165.0\" y2=\"205.5\" stroke=\"#64748b\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><polygon points=\"165.0,210.0 163.0,205.4 167.0,205.4\" fill=\"#64748b\"/><rect x=\"15.0\" y=\"211.0\" width=\"300.0\" height=\"38.0\" rx=\"6\" fill=\"#fee2e2\" stroke=\"#b91c1c\" stroke-width=\"1.4\"/><text x=\"27.0\" y=\"231.0\" text-anchor=\"start\" font-size=\"14\" font-weight=\"700\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">④ Ang Ⅱ 的双作用</text><text x=\"27.0\" y=\"249.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">① 强力缩血管 ② 促醛固酮分泌</text><line x1=\"165.0\" y1=\"250.0\" x2=\"165.0\" y2=\"250.5\" stroke=\"#64748b\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><polygon points=\"165.0,255.0 163.0,250.4 167.0,250.4\" fill=\"#64748b\"/><rect x=\"15.0\" y=\"256.0\" width=\"300.0\" height=\"38.0\" rx=\"6\" fill=\"#fee2e2\" stroke=\"#b91c1c\" stroke-width=\"1.4\"/><text x=\"27.0\" y=\"276.0\" text-anchor=\"start\" font-size=\"14\" font-weight=\"700\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">⑤ 醛固酮</text><text x=\"27.0\" y=\"294.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">远曲小管保 Na⁺ 排 K⁺ → 水钠潴留、血压↑</text><rect x=\"15.0\" y=\"296.0\" width=\"300.0\" height=\"134.0\" rx=\"7\" fill=\"#f8fafc\" stroke=\"#cbd5e1\" stroke-width=\"1.4\"/><text x=\"25.0\" y=\"315.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"700\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">临床对应药物</text><text x=\"25.0\" y=\"333.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">· ACEI（普利类）：抑制 ACE，减少 Ang Ⅱ，</text><text x=\"25.0\" y=\"349.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">但会咳嗽（缓激肽堆积）</text><text x=\"25.0\" y=\"365.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">· ARB（沙坦类）：阻断 Ang Ⅱ 的 AT₁ 受体，</text><text x=\"25.0\" y=\"381.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">不咳嗽</text><text x=\"25.0\" y=\"397.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">· 醛固酮拮抗剂（螺内酯）：保钾利尿</text><text x=\"25.0\" y=\"413.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">· 肾素抑制剂（阿利吉仑）</text><rect x=\"15.0\" y=\"438.0\" width=\"300.0\" height=\"108.0\" rx=\"7\" fill=\"#fee2e2\" stroke=\"#b91c1c\" stroke-width=\"1.2\"/><text x=\"25.0\" y=\"454.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"700\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">Ang Ⅱ 比去甲肾上腺素缩血管还强（约 40 倍</text><text x=\"25.0\" y=\"470.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">）</text><text x=\"25.0\" y=\"486.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">ACEI/ARB 会升高血钾，与保钾利尿剂合用要</text><text x=\"25.0\" y=\"502.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">警惕高钾</text><text x=\"25.0\" y=\"518.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">双侧肾动脉狭窄时禁用 ACEI/ARB——会急性肾</text><text x=\"25.0\" y=\"534.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">衰</text><rect x=\"11.0\" y=\"549.0\" width=\"308.0\" height=\"51.0\" rx=\"7\" fill=\"#ccfbf1\" stroke=\"#0f766e\" stroke-width=\"1.2\"/><text x=\"165.0\" y=\"564.0\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"700\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">肾素→AngⅠ→(ACE)→AngⅡ→缩血管＋促醛固酮；</text><text x=\"165.0\" y=\"579.5\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"700\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">普利类抑制ACE、沙坦类阻断受体</text></svg>","fig_ph08_clearance":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 330 538\" width=\"100%\" style=\"max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px\" role=\"img\"><text x=\"165.0\" y=\"22.6\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"700\" fill=\"#1e293b\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">清除率：判断物质「被肾怎么处理」</text><text x=\"165.0\" y=\"43.0\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"400\" fill=\"#64748b\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">与菊粉比较，就知道是滤过、重吸收还是分泌</text><rect x=\"15.0\" y=\"60.0\" width=\"300.0\" height=\"44.0\" rx=\"6\" fill=\"#ccfbf1\" stroke=\"#0f766e\" stroke-width=\"1.5\"/><text x=\"27.0\" y=\"80.0\" text-anchor=\"start\" font-size=\"14\" font-weight=\"700\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">菊粉清除率</text><text x=\"305.0\" y=\"80.0\" text-anchor=\"end\" font-size=\"13.5\" font-weight=\"700\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">基准</text><text x=\"27.0\" y=\"97.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">＝GFR（125 ml/min），只滤过不重吸收不分</text><text x=\"27.0\" y=\"113.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">泌</text><rect x=\"15.0\" y=\"110.0\" width=\"300.0\" height=\"42.0\" rx=\"6\" fill=\"#f8fafc\" stroke=\"#cbd5e1\" stroke-width=\"1.5\"/><text x=\"27.0\" y=\"130.0\" text-anchor=\"start\" font-size=\"14\" font-weight=\"700\" fill=\"#1e293b\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">肌酐清除率</text><text x=\"27.0\" y=\"147.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">略高于 GFR（少量由小管分泌），临床估 GFR</text><rect x=\"15.0\" y=\"158.0\" width=\"300.0\" height=\"42.0\" rx=\"6\" fill=\"#dcfce7\" stroke=\"#15803d\" stroke-width=\"1.5\"/><text x=\"27.0\" y=\"178.0\" text-anchor=\"start\" font-size=\"14\" font-weight=\"700\" fill=\"#15803d\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">葡萄糖清除率</text><text x=\"27.0\" y=\"195.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">＝0，滤过后全部重吸收</text><rect x=\"15.0\" y=\"206.0\" width=\"300.0\" height=\"42.0\" rx=\"6\" fill=\"#fef3c7\" stroke=\"#b45309\" stroke-width=\"1.5\"/><text x=\"27.0\" y=\"226.0\" text-anchor=\"start\" font-size=\"14\" font-weight=\"700\" fill=\"#b45309\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">PAH 清除率</text><text x=\"27.0\" y=\"243.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">≈ 肾血浆流量（RPF），滤过+分泌几乎全清</text><rect x=\"15.0\" y=\"258.0\" width=\"300.0\" height=\"118.0\" rx=\"7\" fill=\"#f8fafc\" stroke=\"#cbd5e1\" stroke-width=\"1.4\"/><text x=\"25.0\" y=\"277.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"700\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">判断规则（与菊粉比）</text><text x=\"25.0\" y=\"295.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">· 等于菊粉 → 只滤过（如菊粉）</text><text x=\"25.0\" y=\"311.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">· 小于菊粉 → 有重吸收（如葡萄糖、尿素）</text><text x=\"25.0\" y=\"327.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">· 大于菊粉 → 有分泌（如 PAH、肌酐略高）</text><text x=\"25.0\" y=\"343.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">· 等于 0 → 完全重吸收（葡萄糖在正常血糖</text><text x=\"25.0\" y=\"359.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">下）</text><rect x=\"15.0\" y=\"384.0\" width=\"300.0\" height=\"92.0\" rx=\"7\" fill=\"#fee2e2\" stroke=\"#b91c1c\" stroke-width=\"1.2\"/><text x=\"25.0\" y=\"400.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"700\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">10版把「清除率」一节改名为「肾功能的评定</text><text x=\"25.0\" y=\"416.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">」，内容有调整</text><text x=\"25.0\" y=\"432.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">滤过分数 = GFR / RPF = 125/660 ≈ 19%</text><text x=\"25.0\" y=\"448.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">GFR 是评价肾功能最重要的指标，临床常用 e</text><text x=\"25.0\" y=\"464.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">GFR 估算</text><rect x=\"11.0\" y=\"479.0\" width=\"308.0\" height=\"51.0\" rx=\"7\" fill=\"#ccfbf1\" stroke=\"#0f766e\" stroke-width=\"1.2\"/><text x=\"165.0\" y=\"494.0\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"700\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">与菊粉比：相等＝只滤过、偏小＝有重吸收、</text><text x=\"165.0\" y=\"509.5\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"700\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">偏大＝有分泌</text></svg>","fig_ph09_receptor":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 330 480\" width=\"100%\" style=\"max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px\" role=\"img\"><text x=\"165.0\" y=\"22.6\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"700\" fill=\"#1e293b\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">感受器的四个一般生理特性</text><text x=\"165.0\" y=\"43.0\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"400\" fill=\"#64748b\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">换能、编码、适应、敏感——四件事都考</text><rect x=\"15.0\" y=\"60.0\" width=\"300.0\" height=\"56.0\" rx=\"6\" fill=\"#ccfbf1\" stroke=\"#0f766e\" stroke-width=\"1.4\"/><text x=\"24.0\" y=\"79.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"700\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">感受器的适宜刺激</text><text x=\"24.0\" y=\"96.0\" text-anchor=\"start\" font-size=\"13\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">每种感受器只对一种能量形式最敏感</text><text x=\"24.0\" y=\"112.0\" text-anchor=\"start\" font-size=\"13\" font-weight=\"600\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">眼对光、耳对声——特异性由结构决定</text><rect x=\"15.0\" y=\"122.0\" width=\"300.0\" height=\"56.0\" rx=\"6\" fill=\"#fef3c7\" stroke=\"#b45309\" stroke-width=\"1.4\"/><text x=\"24.0\" y=\"141.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"700\" fill=\"#b45309\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">换能作用</text><text x=\"24.0\" y=\"158.0\" text-anchor=\"start\" font-size=\"13\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">刺激能量 → 感受器电位（局部电位）</text><text x=\"24.0\" y=\"174.0\" text-anchor=\"start\" font-size=\"13\" font-weight=\"600\" fill=\"#b45309\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">感受器电位达阈值才产生动作电位</text><rect x=\"15.0\" y=\"184.0\" width=\"300.0\" height=\"56.0\" rx=\"6\" fill=\"#fee2e2\" stroke=\"#b91c1c\" stroke-width=\"1.4\"/><text x=\"24.0\" y=\"203.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"700\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">编码作用</text><text x=\"24.0\" y=\"220.0\" text-anchor=\"start\" font-size=\"13\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">刺激的「性质、强度、部位」编成神经冲动序列</text><text x=\"24.0\" y=\"236.0\" text-anchor=\"start\" font-size=\"13\" font-weight=\"600\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">强度编码为频率，性质靠专用通路与中枢部位</text><rect x=\"15.0\" y=\"246.0\" width=\"300.0\" height=\"56.0\" rx=\"6\" fill=\"#f8fafc\" stroke=\"#64748b\" stroke-width=\"1.4\"/><text x=\"24.0\" y=\"265.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"700\" fill=\"#64748b\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">适应现象</text><text x=\"24.0\" y=\"282.0\" text-anchor=\"start\" font-size=\"13\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">恒定刺激持续作用，传入冲动逐渐减少</text><text x=\"24.0\" y=\"298.0\" text-anchor=\"start\" font-size=\"13\" font-weight=\"600\" fill=\"#64748b\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">有快适应（触觉）与慢适应（痛觉、颈动脉窦）</text><rect x=\"15.0\" y=\"310.0\" width=\"300.0\" height=\"108.0\" rx=\"7\" fill=\"#fee2e2\" stroke=\"#b91c1c\" stroke-width=\"1.2\"/><text x=\"25.0\" y=\"326.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"700\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">快适应＝触觉、嗅觉（告诉你「变了」，</text><text x=\"25.0\" y=\"342.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">不告诉你「一直有」）</text><text x=\"25.0\" y=\"358.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">慢适应＝痛觉、本体感觉、颈动脉窦压力感受</text><text x=\"25.0\" y=\"374.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">器（必须一直报告）</text><text x=\"25.0\" y=\"390.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">痛觉几乎不适应——这是保护性设计，所以能持</text><text x=\"25.0\" y=\"406.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">续报警</text><rect x=\"11.0\" y=\"421.0\" width=\"308.0\" height=\"51.0\" rx=\"7\" fill=\"#ccfbf1\" stroke=\"#0f766e\" stroke-width=\"1.2\"/><text x=\"165.0\" y=\"436.0\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"700\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">换能把刺激变成感受器电位；强度靠频率编码；</text><text x=\"165.0\" y=\"451.5\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"700\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">痛觉慢适应、触觉快适应</text></svg>","fig_ph09_vision":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 330 608\" width=\"100%\" style=\"max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px\" role=\"img\"><text x=\"165.0\" y=\"22.6\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"700\" fill=\"#1e293b\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">视觉：折光系统与感光换能</text><text x=\"165.0\" y=\"43.0\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"400\" fill=\"#64748b\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">角膜管大折光、晶状体管调节、视网膜管换能</text><rect x=\"15.0\" y=\"60.0\" width=\"300.0\" height=\"118.0\" rx=\"7\" fill=\"#ccfbf1\" stroke=\"#cbd5e1\" stroke-width=\"1.4\"/><text x=\"25.0\" y=\"79.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"700\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">折光系统四个结构（屈光间质）</text><text x=\"25.0\" y=\"97.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">· 角膜：折光力最强（约 43 D），但不可调</text><text x=\"25.0\" y=\"113.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">· 房水：维持眼压、提供营养</text><text x=\"25.0\" y=\"129.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">· 晶状体：可调节（约 19 D），看近时变凸</text><text x=\"25.0\" y=\"145.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">· 玻璃体：占容积 4/5，参与折光</text><text x=\"25.0\" y=\"161.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">· 注意：视网膜不是屈光间质，它是感光层</text><rect x=\"15.0\" y=\"186.0\" width=\"300.0\" height=\"86.0\" rx=\"7\" fill=\"#fef3c7\" stroke=\"#cbd5e1\" stroke-width=\"1.4\"/><text x=\"25.0\" y=\"205.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"700\" fill=\"#b45309\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">看近物时的三联动（近反射）</text><text x=\"25.0\" y=\"223.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b45309\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">· 晶状体变凸（睫状肌收缩，悬韧带松弛）</text><text x=\"25.0\" y=\"239.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b45309\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">· 瞳孔缩小（减少球面像差、增加景深）</text><text x=\"25.0\" y=\"255.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b45309\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">· 双眼会聚（内直肌收缩）</text><rect x=\"15.0\" y=\"280.0\" width=\"300.0\" height=\"134.0\" rx=\"7\" fill=\"#f8fafc\" stroke=\"#cbd5e1\" stroke-width=\"1.4\"/><text x=\"25.0\" y=\"299.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"700\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">视网膜两种感光细胞</text><text x=\"25.0\" y=\"317.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">· 视杆细胞：暗光视觉，含视紫红质，无色觉，</text><text x=\"25.0\" y=\"333.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">周边多</text><text x=\"25.0\" y=\"349.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">· 视锥细胞：明视觉与色觉，中央凹密集，</text><text x=\"25.0\" y=\"365.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\" \" font-size=\"14\" font-weight=\"700\" fill=\"#b45309\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">② 中耳</text><text x=\"27.0\" y=\"143.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">鼓膜→听骨链（锤砧镫）→卵圆窗；增压约 22 </text><text x=\"27.0\" y=\"159.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">倍</text><line x1=\"165.0\" y1=\"160.0\" x2=\"165.0\" y2=\"160.5\" stroke=\"#64748b\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><polygon points=\"165.0,165.0 163.0,160.4 167.0,160.4\" fill=\"#64748b\"/><rect x=\"15.0\" y=\"166.0\" width=\"300.0\" height=\"54.0\" rx=\"6\" fill=\"#fee2e2\" stroke=\"#b91c1c\" stroke-width=\"1.4\"/><text x=\"27.0\" y=\"186.0\" text-anchor=\"start\" font-size=\"14\" font-weight=\"700\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">③ 内耳</text><text x=\"27.0\" y=\"204.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">耳蜗内淋巴振动 → 基底膜行波 → 毛细胞纤毛</text><text x=\"27.0\" y=\"220.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">弯曲</text><line x1=\"165.0\" y1=\"221.0\" x2=\"165.0\" y2=\"221.5\" stroke=\"#64748b\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><polygon points=\"165.0,226.0 163.0,221.4 167.0,221.4\" fill=\"#64748b\"/><rect x=\"15.0\" y=\"227.0\" width=\"300.0\" height=\"54.0\" rx=\"6\" fill=\"#dcfce7\" stroke=\"#15803d\" stroke-width=\"1.4\"/><text x=\"27.0\" y=\"247.0\" text-anchor=\"start\" font-size=\"14\" font-weight=\"700\" fill=\"#15803d\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">④ 换能</text><text x=\"27.0\" y=\"265.0\" tex
