<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>考研西医综合（306）成套教学视频 · 动态更新</title>
<style>
:root{--bg:#eef3e8;--card:#fff;--ink:#20301f;--mut:#5a6b56;--line:#d3ddc7;--acc:#3f6b4f;--acc2:#3b6ea5}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.7;padding:24px 14px 60px;margin:0}
.wrap{max-width:1080px;margin:0 auto}
header{background:linear-gradient(135deg,#4a7a58,#2f5540);color:#fff;border-radius:16px;padding:22px 24px;box-shadow:0 14px 30px -18px rgba(47,94,60,.7)}
header h1{margin:0 0 6px;font-size:23px;letter-spacing:.5px}
header .sub{font-size:14px;opacity:.9}
header .upd{margin-top:12px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px}
header .upd .dot{width:8px;height:8px;border-radius:50%;background:#8ff0a8;box-shadow:0 0 0 0 rgba(143,240,168,.7);animation:pulse 2.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(143,240,168,.65)}70%{box-shadow:0 0 0 9px rgba(143,240,168,0)}100%{box-shadow:0 0 0 0 rgba(143,240,168,0)}}
.toolbar{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:16px 0;display:flex;flex-direction:column;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--line);background:#f7faf3;color:#3d4f3a;border-radius:999px;padding:6px 14px;font-size:13.5px;cursor:pointer;user-select:none;transition:.15s}
.chip:hover{border-color:#9dbf8d;background:#f0f7e8}
.chip.on{background:linear-gradient(135deg,#54895f,#3f6b4f);color:#fff;border-color:#3f6b4f;font-weight:600}
.chip .cnt{opacity:.72;font-size:12px;margin-left:4px}
#subRow{overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}
#subRow::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;white-space:nowrap}
input[type=search]{flex:1 1 220px;min-height:40px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font-size:14.5px;background:#fbfdf8;color:var(--ink);outline:none}
input[type=search]:focus{border-color:#9dbf8d;background:#fff}
.sortsel{min-height:40px;border:1px solid var(--line);border-radius:10px;background:#fbfdf8;color:var(--ink);padding:0 10px;font-size:14px}
.stat{font-size:13px;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;transition:.18s;position:relative}
.card:hover{transform:translateY(-2px);box-shadow:0 16px 30px -20px rgba(47,94,60,.75);border-color:#b6cfa6}
.cover{position:relative;aspect-ratio:16/9;background:#dfe8d6 center/cover no-repeat;overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover .dur{position:absolute;right:8px;bottom:8px;background:rgba(20,32,22,.82);color:#fff;font-size:12px;border-radius:6px;padding:2px 7px;font-variant-numeric:tabular-nums}
.cover .pg{position:absolute;left:8px;bottom:8px;background:rgba(63,107,79,.92);color:#fff;font-size:12px;border-radius:6px;padding:2px 7px}
.body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.ttl{font-size:15px;font-weight:700;line-height:1.45;color:#1d3a28;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;flex-wrap:wrap;gap:6px;font-size:12.5px;color:var(--mut)}
.tag{background:#eef4e7;border:1px solid #e2ead8;border-radius:6px;padding:1px 7px;color:#40603f}
.tag.sub{background:#e8f0f8;border-color:#d6e4f2;color:#2f5d8a;font-weight:600}
.tag.tc{background:#fdf1e3;border-color:#f4e0c7;color:#8a5a20}
.parts{font-size:12.5px;color:#6b7d66;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.foot{margin-top:auto;display:flex;align-items:center;gap:10px;padding-top:4px}
.go{margin-left:auto;display:inline-flex;align-items:center;gap:5px;min-height:38px;padding:0 14px;border-radius:10px;background:#eff6e9;border:1px solid #d9e6cb;color:#345b42;font-weight:700;font-size:13.5px;text-decoration:none}
.go:hover{background:#e6f1dc;border-color:#b9d3a6}
.plays{font-size:12.5px;color:var(--mut);font-variant-numeric:tabular-nums}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:34px;text-align:center;color:var(--mut);font-size:14.5px}
footer{margin-top:26px;font-size:12.5px;color:var(--mut);line-height:1.8}
footer a{color:#3b6ea5;text-decoration:none}
@media(max-width:640px){
 body{padding:14px 10px 44px}
 header{padding:18px 16px;border-radius:12px}
 header h1{font-size:19px}
 .grid{grid-template-columns:1fr;gap:12px}
 .chip{padding:5px 11px;font-size:13px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>考研西医综合（306）成套教学视频</h1>
    <div class="sub">自动收录 B 站公开的「多分 P / 长系列」精讲课程，剔除散课与失效视频，按成套度 · 时长 · 播放 · 新鲜度排序</div>
    <div class="upd"><span class="dot"></span><span id="updTxt">数据加载中…</span></div>
  </header>

  <div class="toolbar">
    <div class="row" id="subRow"></div>
    <div class="row">
      <input type="search" id="q" placeholder="搜标题/UP主/老师，如 贺银成">
      <select class="sortsel" id="sort">
        <option value="score">按推荐度（成套+时长+热度+新鲜）</option>
        <option value="new">按发布时间（最新优先）</option>
        <option value="play">按播放量</option>
        <option value="dur">按总时长</option>
        <option value="pages">按分 P 数（最全优先）</option>
      </select>
    </div>
    <div class="row"><span class="stat" id="stat">—</span></div>
  </div>

  <div class="grid" id="grid"></div>

  <footer>
    收录口径：仅保留多分 P（≥10 集）或总时长 ≥4 小时的成套课程；<span id="srcTxt">来源：哔哩哔哩公开搜索</span>。<br>
    数据文件 <a href="videos.json" target="_blank">videos.json</a> · <a href="quiz.html">西综 306 刷题</a> · <a href="../index.html">返回看板首页</a><br>
    版权归各 UP 主与机构所有，本站仅做导航索引，不存储视频文件。页面每 90 秒自动拉取最新数据。
  </footer>
</div>

<script>
(function(){
  var ALL=[], SUBJECTS=[], curSub="全部", data=null;
  var $=function(id){return document.getElementById(id);};
  function fmt(n){return n>=10000?(n/10000).toFixed(1)+'万':String(n);}
  function esc(s){return String(s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

  function buildSubs(){
    var cnt={};
    ALL.forEach(function(it){cnt[it.subject]=(cnt[it.subject]||0)+1;});
    var order=(SUBJECTS.length?SUBJECTS:Object.keys(cnt));
    var html='<span class="chip'+(curSub==='全部'?' on':'')+'" data-s="全部">全部<span class="cnt">'+ALL.length+'</span></span>';
    order.forEach(function(s){
      if(!cnt[s])return;
      html+='<span class="chip'+(curSub===s?' on':'')+'" data-s="'+esc(s)+'">'+esc(s)+'<span class="cnt">'+cnt[s]+'</span></span>';
    });
    $('subRow').innerHTML=html;
  }

  function render(){
    var q=($('q').value||'').trim().toLowerCase();
    var sort=$('sort').value;
    var list=ALL.filter(function(it){
      if(curSub!=='全部'&&it.subject!==curSub)return false;
      if(!q)return true;
      var hay=(it.title+' '+it.up+' '+(it.teachers||[]).join(' ')+' '+(it.parts||[]).join(' ')).toLowerCase();
      return hay.indexOf(q)>=0;
    });
    var cmp={
      score:function(a,b){return b.score-a.score;},
      new:function(a,b){return b.pubdate-a.pubdate;},
      play:function(a,b){return b.play-a.play;},
      dur:function(a,b){return b.dur-a.dur;},
      pages:function(a,b){return b.pages-a.pages||b.score-a.score;}
    }[sort];
    list.sort(cmp);
    $('stat').textContent='共 '+list.length+' 套课程'+(curSub!=='全部'?'（'+curSub+'）':'')+(q?'，关键词「'+q+'」':'');
    if(!list.length){$('grid').innerHTML='<div class="empty">没有匹配的课程，换个关键词或点「全部」看看</div>';return;}
    $('grid').innerHTML=list.map(function(it){
      var tags='<span class="tag sub">'+esc(it.subject)+'</span>';
      (it.teachers||[]).slice(0,3).forEach(function(t){tags+='<span class="tag tc">'+esc(t)+'</span>';});
      tags+='<span class="tag">'+esc(it.date)+'</span>';
      var cov=it.cover?'<img loading="lazy" referrerpolicy="no-referrer" src="'+esc(it.cover)+'" alt="" onerror="this.style.visibility=\'hidden\'">':'';
      return '<div class="card">'+
        '<a class="cover" href="'+esc(it.url)+'" target="_blank" rel="noopener">'+cov+
          '<span class="pg">'+it.pages+' P</span><span class="dur">'+esc(it.dur_txt)+'</span></a>'+
        '<div class="body">'+
          '<div class="ttl">'+esc(it.title)+'</div>'+
          '<div class="meta">'+tags+'</div>'+
          (it.parts&&it.parts.length?'<div class="parts">分P：'+esc(it.parts.slice(0,4).join(' / '))+' …</div>':'')+
          '<div class="foot"><span class="plays">▶ '+fmt(it.play)+' 播放</span>'+
            '<a class="go" href="'+esc(it.url)+'" target="_blank" rel="noopener">去学习 ↗</a></div>'+
        '</div></div>';
    }).join('');
  }

  function apply(d){
    if(!d||!d.items||!d.items.length)return;
    data=d; ALL=d.items; SUBJECTS=d.subjects||[];
    if(curSub!=='全部'&&!ALL.some(function(i){return i.subject===curSub;}))curSub='全部';
    $('updTxt').textContent='数据更新：'+(d.updated||'—')+'　收录 '+d.total+' 套 · 每 90 秒自动刷新';
    $('srcTxt').textContent='来源：'+(d.source||'哔哩哔哩');
    buildSubs(); render();
  }

  function load(){
    fetch('videos.json?_='+Date.now(),{cache:'no-store'})
      .then(function(r){return r.json();})
      .then(apply)
      .catch(function(){$('updTxt').textContent='数据加载失败，稍后自动重试';});
  }

  $('subRow').addEventListener('click',function(e){
    var c=e.target.closest('.chip'); if(!c)return;
    curSub=c.getAttribute('data-s'); buildSubs(); render();
  });
  $('q').addEventListener('input',render);
  $('sort').addEventListener('change',render);

  load();
  setInterval(load,90000);
  document.addEventListener('visibilitychange',function(){if(!document.hidden)load();});
})();
</script>
</body>
</html>
