疝的病理类型","右阴囊可复性肿物14年，不能还纳1天并伴呕吐、停止排气排便、肠鸣音亢进，说明疝已嵌顿并发展为绞窄性肠梗阻（心率108次/分、白细胞14×10⁹/L、压痛明显提示肠管缺血坏死），须急诊手术，行腹股沟疝探查，并做好肠切除吻合的准备，故选D。立即剖腹探查非必要且增加创伤，经腹股沟切口即可处理（A不妥）；留观、止痛抗炎均延误手术时机，止痛还可能掩盖病情（B、C不妥）。","《外科学》第9版·腹外疝·嵌顿疝与绞窄疝","green"],["YC25N062A","关于原发性腹膜炎下列哪项说法\n正确",["致病菌多为大肠杆菌、金葡菌","血行播散途径多为青少年感染途径","上行感染来自于女性泌尿系统细菌","原发性腹膜炎又称自发性腹膜炎，即腹\n腔内没原发病灶"],"D","A","病理学",2025,"mock","病理学|其他","腹膜炎的类型","原发性（自发性）腹膜炎指腹腔内无原发感染灶、病原体经血行、淋巴、上行或透壁途径感染的弥漫性腹膜炎，故D正确。A错：致病菌以肺炎链球菌、溶血性链球菌（儿童）及大肠埃希菌（肝硬化腹水者）为主，笼统说“多为大肠杆菌、金葡菌”不符合；B错：血行播散主要见于婴幼儿及儿童，青少年并非主要人群，成人血行播散少见；C错：女性的上行感染实际来自生殖道上行（输卵管途径），而非泌尿系统。","《外科学》第9版·腹腔感染·原发性腹膜炎","green"],["YC25N063A","胃大部切除手术毕II术式中，输\n入襻连接胃大弯，输出襻连接胃小弯的是",["霍氏","波式","莫式","艾式"],"C","A","外科学",2025,"mock","外科学|其他","毕Ⅱ式吻合的输入输出襻","毕Ⅱ式胃空肠吻合按输入襻与胃大、小弯的对应关系命名：输入襻对小弯、输出襻对大弯为霍夫迈斯特（Hoffmeister）法；输入襻对大弯、输出襻对小弯为莫伊尼汉（Moynihan，莫氏）法；波氏（Polya）法为结肠前全口吻合，不强调襻的对应。故输入襻接胃大弯、输出襻接胃小弯者为莫氏法。艾氏法（Eiselberg）为另一种改良术式。","《外科学》第9版·普通外科·胃十二指肠疾病·胃大部切除术式","green"],["YC25N064A","乙状结肠扭转时钡剂X线检查呈\n现",["“鱼骨刺”","“杯口”","“鸟嘴”","“马蹄”"],"C","A","病理学",2025,"mock","病理学|其他","肠梗阻的影像学表现","乙状结肠扭转时钡剂灌肠，钡柱在扭转处受阻并逐渐变尖，形如鸟嘴（鸟嘴征），故选C。鱼骨刺征为小肠吸收不良或小肠克罗恩病的钡餐表现（A不符）；杯口征（苹果核征）为结肠癌浸润肠壁致局限性狭窄、两端呈肩样突出的表现（B不符）；马蹄征多见于先天性马蹄肾或某些肠套叠描述，非乙状结肠扭转的典型征象（D不符）。要点：乙状结肠扭转还可见巨大扩张肠袢（咖啡豆征）。","《外科学》第9版·肠疾病·肠扭转","green"],["YC25N065A","女性，60岁，因突发性右上腹痛8小时入院。查体：体温38.5℃，心率90\n次/分，血压110/80mmHg，右上腹压痛，\n肌紧张、反跳痛，WBC16×10^9/L。B超提\n示胆囊切除术后，胆总管直径1.2cm。此患\n者最适宜的治疗方式是",["胆管切开取石","胆囊切除加总胆管探查术","药物溶石","内镜胆管取石"],"D","A","外科学",2025,"mock","外科学|普通外科","胆总管结石的微创处理","胆囊切除术后突发右上腹痛、发热、右上腹压痛及反跳痛、白细胞升高，B超示胆总管直径1.2cm（增宽），提示胆总管残留或复发结石合并急性胆管炎。患者已无胆囊，且胆管扩张、感染明确，首选内镜下十二指肠乳头切开取石（EST/ERCP），创伤小、可同时解除梗阻并引流。再次开腹胆管切开取石创伤大，宜作为内镜失败或合并复杂病变时的选择；药物溶石对胆色素结石与已梗阻者无效。","《外科学》第9版·普通外科·胆道疾病·胆总管结石","green"],["YC25N066A","下列选项中，提示骨肿瘤为恶性\n的X线表现是",["界限清楚","三角形骨膜反应","骨皮质膨胀变薄","病灶周围硬化反应骨"],"B","A","病理学",2025,"mock","病理学|肿瘤","骨肿瘤的良恶性鉴别","提示骨肿瘤为恶性的X线征象包括：病变界限不清、边缘模糊；骨皮质破坏中断（而非膨胀变薄）；虫蚀样或斑片状骨破坏；骨膜反应明显，Codman三角（三角形骨膜反应，即掀起骨膜形成的新骨三角）、放射状（日光放射状）骨膜反应；软组织肿块影。故B正确。界限清楚、骨皮质膨胀变薄、病灶周围硬化反应骨均提示良性（如骨囊肿、骨巨细胞瘤、骨样骨瘤的瘤巢周围硬化），A、C、D排除。","《外科学》第9版·骨肿瘤·骨肿瘤的诊断","green"],["YC25N067A","下列关于脊椎结核的叙述，错误\n的是",["多有局部红、肿、热、痛及高热","中心型椎体结核多见于儿童，好发于胸\n椎","边缘型椎体结核多见于成人，好发于腰\n椎","X线平片表现为骨质破坏\n（\n前赴美工作回国，在机场取行李时突感胸\n闷，呼吸困难来诊。查体：R24/分，口唇\n发绀，双肺呼吸音轻，双下肢轻微肿胀，\nP2>A2。"],"A","A","病理学",2025,"mock","病理学|传染病与寄生虫病","骨关节结核的病理与处理","脊柱结核为慢性特异性感染，典型表现为低热、盗汗、消瘦等结核中毒症状，局部以疼痛、肌肉痉挛、姿势异常、脊柱畸形、寒性脓肿及神经功能障碍为主，缺少急性化脓性炎的局部红、肿、热、痛与高热（后者见于化脓性脊柱炎），故A叙述错误，为本题答案。B、C正确：中心型椎体结核多见于儿童，好发于胸椎，易致椎体压缩塌陷；边缘型多见于成人，好发于腰椎，易侵入椎间盘致间隙变窄。D正确：X线示骨质破坏、椎间隙变窄、椎旁脓肿阴影。⚠️原始排版错乱（本段题与后续题干粘连，末尾出现“（前赴美工作回国…”等串行文字），请核对。","《外科学》第9版·骨与关节结核·脊柱结核","yellow"],["YC25N068A","【病例】女性，45岁，1天\n前赴美工作回国，在机场取行李时突感胸\n闷，呼吸困难来诊。查体：R24/分，口唇\n发绀，双肺呼吸音轻，双下肢轻微肿胀，\nP2>A2。 【设问】该患者目前最可能的诊断是",["右心衰","缺血性心肌病","肺血栓栓塞症","肺结核"],"C","A","病理学",2025,"mock","病理学|局部血液循环障碍","血栓栓塞与肺栓塞","长途飞行后突发胸闷、呼吸困难，口唇发绀、呼吸24次/分、双肺呼吸音低、下肢轻微肿胀（深静脉血栓形成的线索），P2＞A2（肺动脉压增高），为肺血栓栓塞症的典型临床综合征，故选C。右心衰多有心界扩大、颈静脉怒张、肝大与下肢水肿，以体循环淤血为主（A不符）；缺血性心肌病以心绞痛、心衰、心脏扩大为主，无低氧与P2亢进（B不符）；肺结核为慢性病程伴低热、咳嗽、痰中带血（D不符）。⚠️原始排版错乱：本组题题干缺失且与前题粘连，请核对。","《病理学》第9版·局部血液循环障碍·栓塞","yellow"],["YC25N069A","【病例】女性，45岁，1天\n前赴美工作回国，在机场取行李时突感胸\n闷，呼吸困难来诊。查体：R24/分，口唇\n发绀，双肺呼吸音轻，双下肢轻微肿胀，\nP2>A2。 【设问】为明确诊断，首选的检查是",["CTPA","超声心动图","冠脉造影","D-二聚体\n（\n胸闷，低热、咳嗽、少量痰中带血1个月\n余。长期吸烟20余年。胸片检查示左上肺\n斑点状浸润影。"],"A","A","病理学",2025,"mock","病理学|肿瘤","血栓栓塞与肺栓塞","怀疑肺血栓栓塞症时，明确诊断首选CT肺动脉造影（CTPA），可直接显示肺动脉内的充盈缺损，敏感性与特异性均高，是PTE诊断的“金标准”影像学检查，故选A。超声心动图用于评估右心功能与除外心源性病因，不能确诊（B不符）；冠脉造影用于冠心病（C不符）；D-二聚体敏感性高但特异性低，阴性可帮助排除，不能确诊（D不符）。⚠️原始排版错乱（题干缺失），请核对，本解析按答案A推断。","《内科学》第9版·肺血栓栓塞症·诊断","yellow"],["YC25N070A","【病例】男性，53岁。自觉\n胸闷，低热、咳嗽、少量痰中带血1个月\n余。长期吸烟20余年。胸片检查示左上肺\n斑点状浸润影。 【设问】该患者目前最可能的诊断是",["金葡菌肺炎","肺结核","COPD","肺癌"],"B","A","病理学",2025,"mock","病理学|呼吸系统疾病","肺结核病理类型","青年起长期吸烟、胸闷伴低热、咳嗽、少量痰中带血1个月余，胸片示左上肺斑点状浸润影，符合继发性肺结核（好发于上叶尖后段，呈斑片、结节、浸润，可有空洞，伴低热盗汗），故选B。金葡菌肺炎起病急、高热、脓痰，X线示多发肺脓肿与肺气囊（A不符）；COPD以慢性咳痰、气促、肺气肿为主，无低热咯血（C不符）；肺癌多见于长期吸烟的老年男性，多为结节或肿块影，伴消瘦、刺激性干咳（D虽需警惕，但低热与斑点状浸润影更支持结核）。⚠️原始排版错乱（题干与相邻题目粘连），请核对。","《病理学》第9版·传染病与寄生虫病·肺结核","yellow"],["YC25N071A","【病例】男性，53岁。自觉\n胸闷，低热、咳嗽、少量痰中带血1个月\n余。长期吸烟20余年。胸片检查示左上肺\n斑点状浸润影。 【设问】为明确诊断，下一步应行的检查\n是",["痰涂片","痰培养","CT","穿刺活检"],"A","A","病理学",2025,"mock","病理学|其他","肺结核的诊断","胸片提示上肺浸润影而临床疑诊肺结核时，为明确诊断、取得病原学依据，最简便直接、成本低且阳性率可观的检查是痰涂片找抗酸杆菌（涂片抗酸染色），并可进一步行痰培养、分子检测，故选A。痰培养需4~8周、耗时较长，一般作为药敏与确诊补充（B逊于涂片的即时性）；CT只能描述部位与范围，不能定性（C不符）；穿刺活检有创、主要用于痰检阴性而需病理诊断的疑难病例（D不作为首选）。⚠️原始排版错乱（题干缺失），请核对。","《内科学》第9版·肺结核·实验室检查","yellow"],["YC25N072A","根据患者检查结果，左侧胸腔有\n部分积液，如行穿刺抽液，其最可能的结\n果是",["ADA103","LDH180","pH8.0","胸腔积液/血清CEA>1\n（\n查体：心律120次/分，心律不齐，血压\n145/85mmHg，脉率102次/分，甲状腺弥\n漫性肿大，血K+2.7mmol/L"],"A","A","病理学",2025,"mock","病理学|其他","胸腔积液性质的鉴别","结核性胸膜炎的胸腔积液为渗出液：以淋巴细胞为主，腺苷脱氨酶（ADA）显著升高（常＞45U/L，本例103U/L高度提示结核），故A正确。B的LDH 180U/L偏低（结核性积液LDH多＞200U/L）；C的pH 8.0不符合实际（积液pH多在7.0~7.4，结核性常偏酸＜7.30）；D的积液/血清CEA＞1提示恶性胸腔积液，与结核不符。要点：ADA升高、CEA不高、淋巴细胞为主是结核性与恶性积液鉴别的三联线索。⚠️原始排版错乱（题干与前段文字粘连），请核对。","《内科学》第9版·胸腔积液·结核性胸膜炎","yellow"],["YC25N073A","【病例】男性，28岁，3个月来感全身乏力、手颤、心慌、体重下降。\n查体：心律120次/分，心律不齐，血压\n145/85mmHg，脉率102次/分，甲状腺弥\n漫性肿大，血K+2.7mmol/L 【设问】导致该患者目前心律不齐最可能\n的原因是",["高血压","低钾血症","甲亢","风湿性心脏病"],"C","A","病理学",2025,"mock","病理学|心血管系统疾病","甲亢的心血管并发症","甲状腺弥漫性肿大、心率120次/分、脉率102次/分（脉率少于心率，提示脉短绌，即房颤），伴血钾2.7mmol/L，最符合Graves病合并心房颤动。导致心律不齐的根本原因是甲状腺激素过多：甲状腺素使心肌β受体上调、心肌兴奋性及自律性升高、房室传导加快，从而使房颤发生率明显增加，故C正确。高血压在此为伴随表现而非直接原因（A不符）；低钾血症可致心律失常，但本例低钾多为甲亢继发（甲状腺毒性周期性麻痹或出汗、呕吐、利尿剂）而非原发病因（B不作首选）；无风湿性心脏病杂音与病史（D不符）。","《内科学》第9版·甲状腺功能亢进症·心血管系统表现","green"],["YC25N074A","【病例】男性，28岁，3个月来感全身乏力、手颤、心慌、体重下降。\n查体：心律120次/分，心律不齐，血压\n145/85mmHg，脉率102次/分，甲状腺弥\n漫性肿大，血K+2.7mmol/L 【设问】该患者心电图最可能的表现为",["多源性P波","ST段压低","等电线消失","电轴右偏"],"C","A","内科学",2025,"mock","内科学|其他","心房扑动的心电图（F波、等电位线消失）","锯齿状扑动波（F波）连续出现、形态间距一致，使正常等电位线消失，是心房扑动的特征性心电图表现，故答C。多源性P波见于多源性房性心动过速；ST段压低提示心肌缺血；电轴右偏见于右心室肥厚或左后分支阻滞，均非房扑的标志。（本题题干信息缺损，按答案与选项推断为心房扑动的心电图表现。）","《内科学》第9版·循环系统疾病·心律失常","green"],["YC25N075A","【病例】男性，28岁，3个月来感全身乏力、手颤、心慌、体重下降。\n查体：心律120次/分，心律不齐，血压\n145/85mmHg，脉率102次/分，甲状腺弥\n漫性肿大，血K+2.7mmol/L 【设问】该患者目前首选的治疗方案是",["直流电复律","胺碘酮","手术治疗","ATD\n（\n来发热、乏力、咳嗽，1天前视力明显下降\n来诊。既往心脏杂音病史。查体：体温\n37.9℃，脉率96次/分，血压126/80mmHg。\n双肺（-），心界不大，心尖部3/6级吹风\n样杂音，脾肋下可及。化验：Hb98g/L，\n尿蛋白（+），镜检RBC1~3个/HP"],"D","A","内科学",2025,"mock","内科学|其他","甲亢性心脏病的治疗原则","按选项与答案推断本例为甲状腺功能亢进症，其心脏表现（心动过速、房颤、心衰）的根本治疗是控制甲亢本身，故首选抗甲状腺药物（ATD）治疗；随甲亢控制，心率与心律多可自行改善，必要时加用β受体阻滞剂。直流电复律与胺碘酮针对心律失常，不能去除甲亢这一病因；手术仅在药物无效或甲状腺巨大压迫时考虑。（本题题干信息缺损。）","《内科学》第9版·内分泌与代谢疾病·甲状腺功能亢进症","green"],["YC25N076A","【病例】女，38岁。一个月\n来发热、乏力、咳嗽，1天前视力明显下降\n来诊。既往心脏杂音病史。查体：体温\n37.9℃，脉率96次/分，血压126/80mmHg。\n双肺（-），心界不大，心尖部3/6级吹风\n样杂音，脾肋下可及。化验：Hb98g/L，\n尿蛋白（+），镜检RBC1~3个/HP 【设问】该患者最可能的诊断是",["急性肾小球肾炎","肾病综合征","感染性心内膜炎","风湿性瓣膜病"],"C","A","内科学",2025,"mock","内科学|循环系统疾病","感染性心内膜炎的周围表现与栓塞","有心脏杂音病史，出现发热、乏力、脾大、贫血、尿蛋白与镜下血尿，并突然视力下降（视网膜动脉栓塞/眼动脉栓塞），符合亚急性感染性心内膜炎合并免疫复合物性肾炎与系统性栓塞。急性肾小球肾炎有前驱链球菌感染、无脾大与栓塞；肾病综合征以大量蛋白尿、低白蛋白血症为特点而无发热栓塞；风湿性瓣膜病不能解释发热、贫血与栓塞。","《内科学》第9版·循环系统疾病·感染性心内膜炎","green"],["YC25N078A","【病例】女，38岁。一个月\n来发热、乏力、咳嗽，1天前视力明显下降\n来诊。既往心脏杂音病史。查体：体温\n37.9℃，脉率96次/分，血压126/80mmHg。\n双肺（-），心界不大，心尖部3/6级吹风\n样杂音，脾肋下可及。化验：Hb98g/L，\n尿蛋白（+），镜检RBC1~3个/HP 【设问】该患者肾脏病变最可能的机制是",["循环免疫复合物致病","原位免疫复合物致病","肾盂感染致病","ANCA抗体致病\n（\n月来乏力、食欲下降。1个月来腹胀明显加\n重来诊。既往肝炎病史，查体：体温37.5℃，\nP88次/分，血压110/70mmHg。巩膜轻度\n黄染，心肺（-）腹部柔软，肝肋下未及，\n双下肢凹陷性水肿。尿胆红素（+），尿蛋\n白（+-）"],"A","A","内科学",2025,"mock","内科学|风湿免疫","感染性心内膜炎肾损害的免疫机制","亚急性感染性心内膜炎时，细菌抗原与相应抗体形成循环免疫复合物，沉积于肾小球基底膜引起局灶节段性或弥漫性肾小球肾炎（免疫复合物型），故机制为循环免疫复合物致病。原位免疫复合物（抗GBM型）见于Goodpasture综合征；肾盂感染属上行性化脓性感染；ANCA抗体致病见于ANCA相关性小血管炎。","《内科学》第9版·循环系统疾病·感染性心内膜炎","green"],["YC25N079A","【病例】男性，45岁。6个\n月来乏力、食欲下降。1个月来腹胀明显加\n重来诊。既往肝炎病史，查体：体温37.5℃，\nP88次/分，血压110/70mmHg。巩膜轻度\n黄染，心肺（-）腹部柔软，肝肋下未及，\n双下肢凹陷性水肿。尿胆红素（+），尿蛋\n白（+-） 【设问】患者目前最可能的诊断是",["肝硬化","胆道梗阻","克罗恩病","尿毒症"],"A","A","内科学",2025,"mock","内科学|消化系统疾病","肝硬化失代偿期的临床表现","有肝炎病史，出现乏力、食欲下降、腹胀、巩膜黄染、肝缩小（肋下未及提示肝硬变缩小）、下肢凹陷性水肿及尿胆红素阳性，符合肝硬化失代偿期。胆道梗阻以黄疸、皮肤瘙痒、大便陶土色及胆囊肿大为特点，无肝缩小与腹水；克罗恩病以腹痛腹泻、瘘管为主；尿毒症有肾功能显著异常及肾性水肿，黄疸不突出。","《内科学》第9版·消化系统疾病·肝硬化","green"],["YC25N080A","【病例】男性，45岁。6个\n月来乏力、食欲下降。1个月来腹胀明显加\n重来诊。既往肝炎病史，查体：体温37.5℃，\nP88次/分，血压110/70mmHg。巩膜轻度\n黄染，心肺（-）腹部柔软，肝肋下未及，\n双下肢凹陷性水肿。尿胆红素（+），尿蛋\n白（+-） 【设问】该患者最不可能见到的临床表现\n是",["腹壁静脉曲张","面色黑黄晦暗","乳房发育","尿量增加"],"D","A","内科学",2025,"mock","内科学|其他","肝硬化雌激素增多与门脉高压表现","肝硬化失代偿期因抗利尿激素灭活减少、有效循环血量不足及稀释性低钠，尿量多减少（伴腹水、水肿），故\"尿量增加\"最不可能出现。腹壁静脉曲张源于门静脉高压侧支循环开放；面色黑黄晦暗为肝病面容（色素沉着）；乳房发育源于雌激素灭活减少，均为本病常见表现。","《内科学》第9版·消化系统疾病·肝硬化","green"],["YC25N081A","治疗过程中，患者自觉烦躁，情\n绪难以控制，对患者病情改善无积极意义\n的方案是",["口服抗生素","异丙嗪","苯二氮卓类镇静药","选用保K型利尿剂\n（\n白尿1个月，病前无上呼吸道感染史。查\n体：血压：120/80mmHg，双下肢凹陷性\n水肿。尿蛋白（++++），肉眼血尿为明确病\n因行穿刺活检示：系膜细胞和系膜基质弥\n漫重度增生"],"C","A","内科学",2025,"mock","内科学|其他","肝性脑病的诱因与用药禁忌","肝硬化患者出现烦躁、情绪难以控制常为肝性脑病的前驱表现，此时苯二氮䓬类镇静药会抑制中枢神经系统、掩盖病情并直接诱发或加重肝性脑病，对病情改善无积极意义。口服抗生素（利福昔明、新霉素）可减少肠道产氨；异丙嗪抗组胺可缓解症状且对肝影响小；保钾利尿剂可纠正低钾性碱中毒、减少氨的生成与吸收。","《内科学》第9版·消化系统疾病·肝性脑病","green"],["YC25N082A","【病例】男，18岁，大量蛋\n白尿1个月，病前无上呼吸道感染史。查\n体：血压：120/80mmHg，双下肢凹陷性\n水肿。尿蛋白（++++），肉眼血尿为明确病\n因行穿刺活检示：系膜细胞和系膜基质弥\n漫重度增生 【设问】该患者最可能的诊断是",["急性肾小球肾炎","系膜毛细血管性肾小球肾炎","膜性肾病","微小病变型肾病"],"B","A","内科学",2025,"mock","内科学|泌尿系统疾病","系膜毛细血管性肾炎的病理特点","活检见系膜细胞与系膜基质弥漫重度增生，并向毛细血管内插入形成双轨，符合系膜毛细血管性肾小球肾炎（膜增生性肾炎）。急性肾小球肾炎为弥漫性毛细血管内增生伴内皮与中性粒细胞浸润；膜性肾病为上皮下免疫复合物沉积、基底膜钉突形成，光镜下系膜增生不明显；微小病变型光镜下基本正常、电镜下足突融合。","《内科学》第9版·泌尿系统疾病·系膜毛细血管性肾小球肾炎","green"],["YC25N083A","【病例】男，18岁，大量蛋\n白尿1个月，病前无上呼吸道感染史。查\n体：血压：120/80mmHg，双下肢凹陷性\n水肿。尿蛋白（++++），肉眼血尿为明确病\n因行穿刺活检示：系膜细胞和系膜基质弥\n漫重度增生 【设问】该患者病理检查常可见到的表现\n是",["双轨征","钉突形成","毛细血管内皮增生","新月体形成"],"A","A","内科学",2025,"mock","内科学|其他","双轨征的病理意义","系膜毛细血管性肾小球肾炎因系膜细胞与基质重度增生并插入毛细血管壁，使基底膜呈双层，银染色见特征性双轨征（轨道征）。钉突形成是膜性肾病上皮下沉积物的表现；毛细血管内皮增生见于急性感染后肾炎；新月体形成见于急进性肾小球肾炎。","《内科学》第9版·泌尿系统疾病·系膜毛细血管性肾小球肾炎","green"],["YC25N084A","患者若出现尿量减少，最可能见\n到的检查结果是",["尿比重<1.102","尿钠>20","尿肌酐/血清肌酐<20","尿沉渣呈透明管型\n（\n累后酱油色尿3年”来诊：查体：贫血貌，\n巩膜轻度黄染。血红蛋白80g/L，酸溶血\n试验阳性"],"D","A","内科学",2025,"mock","内科学|血液系统疾病","肾前性与肾性急性肾损伤的尿液鉴别","该病出现尿量减少时需鉴别肾前性氮质血症与急性肾小管坏死。尿沉渣仅见透明管型提示肾小管结构尚完整，符合肾前性因素，故D可选。尿比重应>1.020（题干\"<1.102\"应为笔误）；尿钠>20mmol/L、尿肌酐/血肌酐<20均为急性肾小管坏死（肾性）的指标，与肾前性相反。","《内科学》第9版·泌尿系统疾病·急性肾损伤","green"],["YC25N085A","患者最可能的诊断是\n二十余年教学积淀·助力学员考研上岸！",["肝硬化","白血病","MDS","PNH"],"D","A","内科学",2025,"mock","内科学|消化系统疾病","PNH的诊断（酸溶血试验）","反复发作的酱油色（血红蛋白）尿、贫血伴巩膜黄染、酸溶血（Ham）试验阳性，是阵发性睡眠性血红蛋白尿症的特征性组合。肝硬化无血红蛋白尿与酸溶血试验阳性；白血病多有原始细胞增多、肝脾淋巴结肿大；MDS以病态造血、难治性血细胞减少为主，酸溶血试验阴性。","《内科学》第9版·血液系统疾病·溶血性贫血","green"],["YC25N086A","【病例】男性，35岁，因“劳\n累后酱油色尿3年”来诊：查体：贫血貌，\n巩膜轻度黄染。血红蛋白80g/L，酸溶血\n试验阳性 【设问】对患者诊断特异性较强的结果是",["血浆结合珠蛋白水平下降","静脉血栓形成","骨髓造血衰竭","红细胞膜CD55和CD59表达下降"],"D","A","内科学",2025,"mock","内科学|其他","PNH的CD55/CD59检测","PNH是获得性红细胞膜糖基磷脂酰肌醇（GPI）锚合成障碍性疾病，红细胞、粒细胞、单核细胞膜上CD55与CD59表达显著下降，导致补体调节缺陷、血管内溶血，流式细胞术检测其阴性细胞群是最敏感、最特异的诊断指标。结合珠蛋白下降仅提示溶血；静脉血栓形成与骨髓衰竭是本病的表现而非特异诊断依据。","《内科学》第9版·血液系统疾病·溶血性贫血","green"],["YC25N087A","【病例】男性，35岁，因“劳\n累后酱油色尿3年”来诊：查体：贫血貌，\n巩膜轻度黄染。血红蛋白80g/L，酸溶血\n试验阳性 【设问】该患者最不可能出现的检查结果\n是",["骨髓含铁血黄素水平升高","网织红水平升高","全血细胞减少","血红蛋白尿\n（\n病、高血压病史20余年。近期感觉视物模\n糊，眼底检查发现新生血管形成。来院检\n查血压165/105mmHg。尿糖阳性，尿酮体\n（-），空腹血糖9.6mmol/L，血Cr178\numol/L。"],"A","A","内科学",2025,"mock","内科学|循环系统疾病","PNH的铁代谢与实验室特点","PNH长期血管内溶血使血红蛋白随尿持续丢失，多数患者呈缺铁状态，骨髓细胞外铁与含铁血黄素降低而非升高，故A最不可能出现。网织红细胞因骨髓代偿而升高；长期溶血与骨髓衰竭可致全血细胞减少（PNH-AA综合征）；血红蛋白尿是本病的标志性表现。","《内科学》第9版·血液系统疾病·溶血性贫血","green"],["YC25N088A","【病例】女性，56岁，糖尿\n病、高血压病史20余年。近期感觉视物模\n糊，眼底检查发现新生血管形成。来院检\n查血压165/105mmHg。尿糖阳性，尿酮体\n（-），空腹血糖9.6mmol/L，血Cr178\numol/L。 【设问】该患者降压首选药物是",["ACEI","β受体阻滞剂","CCB","呋塞米"],"A","A","内科学",2025,"mock","内科学|其他","糖尿病肾病降压首选ACEI/ARB","糖尿病患者出现蛋白尿与血肌酐升高（178μmol/L），提示糖尿病肾病合并肾功能不全。ACEI（或ARB）能扩张出球小动脉、降低肾小球内高压、减少蛋白尿并延缓肾病进展，且不增高血糖，是首选降压药，需监测血钾与血肌酐。β受体阻滞剂可掩盖低血糖症状；CCB降蛋白尿作用弱；呋塞米仅用于水肿与容量负荷过重。","《内科学》第9版·泌尿系统疾病·糖尿病肾病","green"],["YC25N089A","【病例】女性，56岁，糖尿\n病、高血压病史20余年。近期感觉视物模\n糊，眼底检查发现新生血管形成。来院检\n查血压165/105mmHg。尿糖阳性，尿酮体\n（-），空腹血糖9.6mmol/L，血Cr178\numol/L。 【设问】该患者糖尿病视网膜病变属于",["1期","2期","3期","4期"],"D","A","内科学",2025,"mock","内科学|内分泌与代谢","糖尿病视网膜病变分期","我国糖尿病视网膜病变分期中，Ⅰ~Ⅲ期为单纯型（非增殖型）：Ⅰ期微血管瘤或合并小出血点，Ⅱ期硬性渗出，Ⅲ期棉絮状斑（软性渗出）；Ⅳ期出现新生血管或玻璃体积血，Ⅴ期纤维血管增殖，Ⅵ期视网膜脱离或新生血管性青光眼。本例眼底见新生血管形成，属Ⅳ期（增殖期起点）。","《内科学》第9版·内分泌与代谢疾病·糖尿病","green"],["YC25N090A","患者使用胰岛素治疗后晨起空腹血糖仍然偏高，此时应予以的处理是",["增加胰岛素使用量","联合使用改善胰岛素抵抗的药物","严格控制饮食摄入","检查夜间血糖明确病因\n（\n来无明显诱因发热、双膝关节疼痛入院。\n查体：体温38.1℃，四肢皮肤可见出血点，\n口腔黏膜溃疡，心、肺、腹部检查未见异\n常。化验血Hb100g/L，WBC5.3*10^9，Plt\n21*10^9，网织红0.045。尿蛋白（++），确\n诊为系统性红斑狼疮"],"D","A","生理学",2025,"mock","生理学|能量代谢和体温","胰岛素治疗与清晨高血糖的鉴别","胰岛素治疗后晨起空腹血糖仍高，存在两种截然不同的原因：一是苏木杰效应（夜间低血糖后反跳性高血糖，需减少胰岛素），二是黎明现象（夜间血糖正常或偏高、清晨升糖激素分泌增多，需增加或调整胰岛素）。二者处理相反，故不可盲目加量，必须先监测夜间血糖（必要时加测凌晨 2～3 点）明确病因，D 正确。A 增加胰岛素量若为苏木杰效应将使低血糖更严重。B 改善胰岛素抵抗药物不能解决剂量不当或黎明现象。C 单纯严格控制饮食不能纠正夜间低血糖反跳，且可能加重低血糖。故先查明病因再调整方案。","《内科学》第9版·内分泌与代谢疾病·糖尿病","green"],["YC25N091A","【病例】女性，32岁。2周\n来无明显诱因发热、双膝关节疼痛入院。\n查体：体温38.1℃，四肢皮肤可见出血点，\n口腔黏膜溃疡，心、肺、腹部检查未见异\n常。化验血Hb100g/L，WBC5.3*10^9，Plt\n21*10^9，网织红0.045。尿蛋白（++），确\n诊为系统性红斑狼疮 【设问】最支持该项诊断的检查结果是",["抗dsDNA抗体阳性","抗sm抗体阳性","SSA抗体阳性","CCP抗体阳性"],"B","A","内科学",2025,"mock","内科学|其他","SLE标记性抗体（抗Sm）","抗Sm抗体是SLE的标记性抗体，特异性极高（约99%），一旦阳性对SLE诊断具有决定性意义，故最支持该诊断。抗dsDNA抗体特异性也较高但敏感度低，且与疾病活动、狼疮肾炎相关；抗SSA抗体多见于干燥综合征与SLE；抗CCP抗体是类风湿关节炎的特异性抗体。","《内科学》第9版·风湿性疾病·系统性红斑狼疮","green"],["YC25N092A","【病例】女性，32岁。2周\n来无明显诱因发热、双膝关节疼痛入院。\n查体：体温38.1℃，四肢皮肤可见出血点，\n口腔黏膜溃疡，心、肺、腹部检查未见异\n常。化验血Hb100g/L，WBC5.3*10^9，Plt\n21*10^9，网织红0.045。尿蛋白（++），确\n诊为系统性红斑狼疮 【设问】该患者基础背景治疗应选用",["糖皮质激素","环孢素","羟氯喹","吗替麦考酚酯\n（\n因转移性右下腹痛12小时入院，诊断为“急\n性阑尾炎”，当晚行阑尾切除术，病理为坏\n疽性阑尾炎。自术后次日晨起，患者表现\n为腹痛，烦躁不安，未解小便，查体：面\n色苍白，皮肤湿冷，心率110次／分，较\n弱，血压80／60mmHg，腹稍胀，全腹压痛，\n肌紧张，肠鸣音减弱。"],"C","A","内科学",2025,"mock","内科学|其他","SLE的基础治疗（羟氯喹）","羟氯喹是SLE的基础背景治疗，可减少复发、降低血栓与器官损伤、改善长期预后，所有无禁忌的SLE患者均推荐长期服用，并需定期眼底检查。糖皮质激素用于活动期诱导缓解，不作为基础维持；环孢素、吗替麦考酚酯属免疫抑制剂，用于重要脏器受累或激素减量困难者。","《内科学》第9版·风湿性疾病·系统性红斑狼疮","green"],["YC25N093A","该患者目前情况，应考虑的诊断\n二十余年教学积淀·助力学员考研上岸！",["术后肠麻痹","术后疼痛所致","术后尿潴留","术后腹腔内出血"],"D","A","内科学",2025,"mock","内科学|其他","阑尾术后腹腔内出血","阑尾切除术后次日出现腹痛、烦躁、面色苍白、皮肤湿冷、心率增快、血压下降、全腹压痛及肌紧张、肠鸣音减弱、未解小便，是术后腹腔内出血致失血性休克的表现（阑尾系膜血管结扎线脱落最常见）。术后肠麻痹无休克与腹膜刺激征；术后疼痛不会引起血压下降与皮肤湿冷；尿潴留表现为膀胱充盈，不能解释休克与腹膜炎体征。","《外科学》第9版·阑尾疾病·阑尾切除术的并发症","green"],["YC25N094A","【病例】患者，男，18岁。\n因转移性右下腹痛12小时入院，诊断为“急\n性阑尾炎”，当晚行阑尾切除术，病理为坏\n疽性阑尾炎。自术后次日晨起，患者表现\n为腹痛，烦躁不安，未解小便，查体：面\n色苍白，皮肤湿冷，心率110次／分，较\n弱，血压80／60mmHg，腹稍胀，全腹压痛，\n肌紧张，肠鸣音减弱。 【设问】诊断明确后，应采取何种治疗方\n法",["镇静、止痛治疗","留置导尿管","输液输血治疗","剖腹探查术\n（\n既往有胆囊结石，近2个月出现巩膜、皮\n肤黄染，呈进行性加重，无腹痛，消瘦，\n查体：肝肋下可触及，右上腹扪及肿大的\n胆囊，无触痛，无发热。"],"D","A","内科学",2025,"mock","内科学|其他","术后腹腔内出血的处理","确诊腹腔内出血后应在补液输血抗休克的同时立即剖腹探查，找到出血点（多为阑尾系膜或系膜血管结扎线滑脱）予以确切止血并清除腹腔积血。镇静止痛会掩盖病情；留置导尿管仅为辅助措施；单纯输液输血不能止血，只能作为术前准备。","《外科学》第9版·阑尾疾病·阑尾切除术的并发症","green"],["YC25N095A","【病例】患者，女，42岁。\n既往有胆囊结石，近2个月出现巩膜、皮\n肤黄染，呈进行性加重，无腹痛，消瘦，\n查体：肝肋下可触及，右上腹扪及肿大的\n胆囊，无触痛，无发热。 【设问】为明确黄疸性质，最有意义的检\n查是",["B超检查","PTC","MRI检查","肝功能检查"],"B","A","内科学",2025,"mock","内科学|其他","梗阻性黄疸的影像学检查选择","⚠️原答案存疑，理由：明确黄疸性质应首选无创、简便、可重复的腹部B超，可显示肝内外胆管是否扩张、有无结石与占位，是胆道梗阻的初筛金标准；PTC（经皮肝穿刺胆道造影）虽有创但能清晰显示梗阻部位与形态，并可行引流，通常在B超/CT提示肝内胆管扩张、需进一步定位或减黄时才选用，不作首选。若题干强调\"梗阻部位与性质的精确定位\"，PTC可成立。","《外科学》第9版·胆道疾病·黄疸的鉴别诊断","yellow"],["YC25N096A","【病例】患者，女，42岁。\n既往有胆囊结石，近2个月出现巩膜、皮\n肤黄染，呈进行性加重，无腹痛，消瘦，\n查体：肝肋下可触及，右上腹扪及肿大的\n胆囊，无触痛，无发热。 【设问】确诊后最佳治疗：",["手术切除胆囊","胆肠吻合术","Whipple手术","观察\n（\n间歇性便血10余年，近1个月持续便血，\n量多，常呈喷射状：感头晕，肛诊：齿状\n线上黏膜呈较大的串珠形隆起。097--A2.应诊断为"],"C","A","内科学",2025,"mock","内科学|其他","壶腹周围癌的根治性手术","进行性无痛性黄疸伴胆囊无痛性肿大与消瘦，提示壶腹周围癌（胰头癌或壶腹部癌），应行胰十二指肠切除术（Whipple手术），切除胰头、十二指肠、远端胃、胆总管及胆囊，是唯一可能根治的手段。单纯胆囊切除与胆肠吻合仅用于晚期无法切除者的姑息减黄；观察不可取。","《外科学》第9版·胰腺疾病·胰腺癌","green"],["YC25N098A","【病例】患者，男，50岁。\n间歇性便血10余年，近1个月持续便血，\n量多，常呈喷射状：感头晕，肛诊：齿状\n线上黏膜呈较大的串珠形隆起。097--A2.应诊断为\nA.外痔\nB.内痔\nC.结肠癌\nD.直肠癌 【设问】为根治应选择哪种治疗为佳",["注射疗法","胶圈套扎","PPH","B超下动脉结扎\n（\n近1个月来排便次数增加，里急后重，偶\n有便血。"],"C","A","内科学",2025,"mock","内科学|其他","重度内痔的PPH手术","齿状线上黏膜呈较大串珠样隆起、间歇性喷射状便血，为Ⅲ~Ⅳ度内痔，反复脱出并出血需手术治疗。PPH（吻合器痔上黏膜环切术）通过切断直肠下动脉分支、上提固定肛垫，保留肛垫解剖与功能，术后疼痛轻、恢复快，是重度内痔的首选术式。注射疗法与胶圈套扎适用于Ⅰ~Ⅱ度内痔；B超引导下动脉结扎应用有限。","《外科学》第9版·肛管直肠疾病·痔","green"],["YC25N099A","【病例】患者，男，50岁。\n间歇性便血10余年，近1个月持续便血，\n量多，常呈喷射状：感头晕，肛诊：齿状\n线上黏膜呈较大的串珠形隆起。097--A2.应诊断为\nA.外痔\nB.内痔\nC.结肠癌\nD.直肠癌 【设问】此时应考虑何种检查为首选",["直肠乙状结肠镜检查","x线钡剂灌肠","直肠指诊","肛门镜检查"],"C","A","内科学",2025,"mock","内科学|其他","直肠指诊在直肠癌诊断中的价值","排便次数增多、里急后重伴便血是直肠癌的典型报警症状，直肠癌约70%~80%位于指诊可及范围内，直肠指诊简便、无创、经济，可触及肿块并判断位置、大小、活动度及与盆底的关系，故为首选。直肠乙状结肠镜与钡剂灌肠为后续确诊手段；肛门镜仅能观察肛管与直肠下段。","《外科学》第9版·结直肠肛管疾病·直肠癌","green"],["YC25N100A","经检查发现肿瘤上缘距肛门9cm\n有一质硬菜花状肿块，肿瘤1cm×2cm，应\n首先考虑哪种诊断",["直肠息肉","痔","肛裂","直肠癌"],"D","A","内科学",2025,"mock","内科学|其他","直肠癌的指诊特点","直肠指诊触及质硬菜花状肿块，是直肠癌的典型表现，故诊断直肠癌。直肠息肉多质软、表面光滑、活动度好；痔为齿状线附近柔软的静脉团，质软可压缩、伴便血但无菜花状硬块；肛裂以排便时剧痛、便后少量滴血及肛管裂口为特点。","《外科学》第9版·结直肠肛管疾病·直肠癌","green"],["YC25N101A","【病例】患者，女，50岁。\n 、贫血、慢性阻塞性肺疾病）。A pH 增加使 Hb 更易结合 O₂（Bohr 效应），曲线左移，不选。B Hb 由 T 型变构为 R 型即由“紧密型”转为“松弛型”，对 O₂ 亲和力增高，曲线左移，不选。故答案为 CD。","《生理学》第9版·呼吸·气体在血液中的运输","green"],["YC25N138X","壁细胞上存在的受体有",["组胺受体","CCK受体","生长抑素受体","蛙皮素受体"],"ABC","X","外科学",2025,"mock","外科学|其他","壁细胞受体类型","胃壁细胞膜上同时存在多种调节受体：组胺H₂受体（经cAMP促进胃酸分泌）、促胃液素/CCK-B受体（经Ca²⁺促进泌酸）、乙酰胆碱M₃受体及生长抑素受体（抑制泌酸）。故组胺受体、CCK受体、生长抑素受体均存在。蛙皮素（铃蟾肽）受体位于G细胞，介导促胃液素释放，不在壁细胞上。","《生理学》第9版·消化·胃液分泌的调节","green"],["YC25N139X","可以NH4+形式泌氨的部位有",["近端小管","髓袢升支细段","髓袢升支粗段","集合管"],"AC","X","外科学",2025,"mock","外科学|其他","肾脏泌氨与酸碱平衡","肾小管泌氨有两种形式：近端小管上皮细胞摄取谷氨酰胺，经谷氨酰胺酶生成NH₃与NH₄⁺，NH₄⁺经管腔膜主动分泌入小管液并伴HCO₃⁻重吸收；髓袢升支粗段也存在NH₄⁺的主动重吸收与再循环。髓袢升支细段与集合管不以NH₄⁺形式泌氨（集合管主要靠H⁺-ATP酶泌氢与NH₃弥散）。","《生理学》第9版·泌尿·肾小管和集合管的物质转运","green"],["YC25N140X","下列生理功能主要由胆碱能纤维\n释放递质实现的是",["温热性发汗","LES舒张","胃液的分泌","胃的容受性舒张"],"AC","X","生理学",2025,"mock","生理学|消化和吸收","胆碱能纤维与肽能纤维的功能","A 温热性发汗：汗腺的交感神经支配属胆碱能纤维（释放 ACh 作用于 M 受体），选。B 下食管括约肌（LES）舒张：由迷走神经抑制性纤维释放 VIP 和 NO 实现，属肽能/非肾上腺素非胆碱能（NANC）递质，不选。C 胃液分泌：迷走神经释放 ACh 直接兴奋壁细胞，并经 GRP 促 G 细胞释放促胃液素，二者均为胆碱能通路主导的环节，选。D 胃容受性舒张：由迷走神经抑制性纤维释放 VIP/NO 引起，属肽能纤维而非胆碱能，不选。故答案为 AC。判断要点是“抑制性效应多由 VIP/NO 介导，兴奋性腺体分泌与汗腺多由 ACh 介导”。","《生理学》第9版·神经系统·自主神经系统","green"],["YC25N141X","下列关于糖皮激素的生理作用说\n法正确的有",["促进脂肪合成","减少组织对糖的利用","促进骨髓造血功能，使血液中红细胞、\n血小板数量增加","可促进胎儿肺泡发育，防止新生儿呼吸\n窘迫综合征"],"BCD","X","外科学",2025,"mock","外科学|其他","糖皮质激素的生理作用","糖皮质激素抑制外周组织对葡萄糖的摄取与利用（B），促进骨髓造血使红细胞、血小板与中性粒细胞增多（C），并能促进胎儿肺泡Ⅱ型细胞合成肺表面活性物质，常用于促胎肺成熟、预防新生儿呼吸窘迫综合征（D）。糖皮质激素促进脂肪分解并引起脂肪向心性重新分布，而非促进脂肪合成，故A错误。","《生理学》第9版·内分泌·肾上腺皮质激素","green"],["YC25N142X","磷酸化为其活性形式的酶包括",["糖原磷酸化酶","激素敏感性甘油三酯脂肪酶","HMG-还原酶","丙酮酸脱氢酶"],"AB","X","生物化学",2025,"mock","生物化学|糖代谢","磷酸化/去磷酸化对酶活性的双向调节","糖原磷酸化酶经磷酸化酶b激酶磷酸化后由低活性的b型转为高活性的a型；激素敏感性甘油三酯脂肪酶（HSL）被PKA磷酸化后活性升高，促进脂肪动员，故A、B正确。HMG-CoA还原酶磷酸化后活性降低，丙酮酸脱氢酶复合体被PDH激酶磷酸化后失活，二者的活性形式均为去磷酸化状态，故C、D不选。","《生物化学与分子生物学》第9版·酶·酶的共价修饰调节","green"],["YC25N143X","常常参与肝脏生物转化第二相反\n应的基团有",["葡糖醛酸","甘氨酸","乙酰CoA","SAM"],"ABCD","X","外科学",2025,"mock","外科学|其他","第二相结合反应的供体","生物转化第二相为结合反应，常见结合基团及其供体为：葡萄糖醛酸（UDPGA）、硫酸基（PAPS）、乙酰基（乙酰CoA）、甲基（SAM）、甘氨酸、谷胱甘肽。四项所举葡糖醛酸、甘氨酸、乙酰CoA（供乙酰基）、SAM（供甲基）均参与第二相结合反应。","《生物化学与分子生物学》第9版·肝的生物化学·生物转化","green"],["YC25N144X","信号转导通路中，属于丝氨酸/苏\n氨酸蛋白激酶的是",["MAPK","PKC","RTK","Grab2"],"AB","X","生物化学",2025,"mock","生物化学|酶","丝氨酸/苏氨酸蛋白激酶","MAPK家族（ERK、p38、JNK）与PKC均属丝氨酸/苏氨酸蛋白激酶，磷酸化靶蛋白的丝氨酸或苏氨酸残基，故A、B正确。RTK（受体型酪氨酸激酶）磷酸化靶蛋白的酪氨酸残基，属酪氨酸蛋白激酶；Grb2是含SH2与SH3结构域的接头蛋白，本身没有激酶活性，靠募集SOS激活Ras，故C、D不选。","《生物化学与分子生物学》第9版·细胞信号转导·蛋白激酶与接头蛋白","green"],["YC25N145X","下列目的基因与载体的链接方式\n中适用于表达载体的有",["单一相同黏端连接","不同黏端连接","黏-平连接","平端连接"],"BC","X","外科学",2025,"mock","外科学|其他","表达载体的定向克隆","表达载体要求目的基因定向、正确地插入启动子下游并保持开放读框。不同黏端连接（两种不同黏性末端互补）可保证定向克隆，最常用（B）；黏-平连接可借助一端黏性末端定位、另一端平端减少自连，也属可行（C）。单一相同黏端连接可使插入片段以两个方向进入载体、并有载体自连，无法保证表达；平端连接效率低且不定向，均不适用于表达载体构建。","《生物化学与分子生物学》第9版·基因重组与基因工程","green"],["YC25N147X","可对蛋白质空间结构进行分析的\n生物技术包括",["Western-Blotting","生物信息学预测","核磁共振","冷冻电镜"],"BCD","X","外科学",2025,"mock","外科学|其他","蛋白质空间结构分析技术","研究蛋白质空间结构的技术包括：生物信息学同源建模与结构预测（B）、核磁共振（NMR，适用于小分子量蛋白溶液结构，C）、冷冻电镜（解析大分子复合物近原子分辨率结构，D）。Western blotting仅检测特定蛋白的表达量与分子量，不能解析空间结构。","《生物化学与分子生物学》第9版·蛋白质的结构与功能·研究方法","green"],["YC25N148X","属于液化性坏死的疾病是",["肝脓肿","风湿病","甲型肝炎","肝细胞点灶状坏死"],"ACD","X","病理学",2025,"mock","病理学|细胞和组织的适应与损伤","坏死的类型","液化性坏死发生于蛋白质与脂质含量高而凝固酶少的组织，或坏死组织被蛋白水解酶迅速溶解者。肝脓肿由大量中性粒细胞浸润、蛋白水解酶溶解坏死肝组织形成脓液，为液化性坏死，A正确；甲型肝炎时肝细胞点灶状坏死，坏死细胞被溶解吸收，属液化性坏死，C正确；肝细胞点灶状坏死本身即液化性坏死，D正确。B错：风湿病的特征性病变是结缔组织纤维素样坏死（风湿小体中央的纤维素样坏死灶），非液化性坏死。要点：脑梗死与脓肿是最典型的液化性坏死；胰腺炎则为脂肪坏死。","《病理学》第9版·细胞和组织的适应与损伤·坏死","green"],["YC25N149X","下列属于弥漫性非毒性甲状腺肿\n的特征是",["滤泡上皮细胞周围可见大量吸收空泡","胶质储存期上皮细胞呈扁平状","增生期上皮细胞呈高柱状","结节期可见不对称的甲状腺肿大"],"BD","X","外科学",2025,"mock","外科学|普通外科","单纯性甲状腺肿的分期病理","弥漫性非毒性甲状腺肿（单纯性甲状腺肿）分三期：增生期滤泡上皮增生呈立方或高柱状、胶质少；胶质蓄积期滤泡腔显著扩大、充满胶质、上皮受压变扁平，此时甲状腺弥漫性对称肿大；结节期形成大小不等的结节，甲状腺呈不对称性肿大，结节内常见出血、坏死、囊性变、纤维化与钙化。吸收空泡大量出现是甲亢（Graves病）的表现。⚠️原答案存疑：增生期上皮呈高柱状亦为教材所述特征，C项应视为正确，故按教材答案更接近BCD。","《病理学》第9版·内分泌系统·甲状腺疾病·非毒性甲状腺肿","yellow"],["YC25N150X","肉芽肿性炎的说法正确的是",["主要成分是上皮样细胞和多核巨细胞","炎性息肉和炎性假瘤属于肉芽肿性炎","各型肉芽肿表现不一","组织修复时可出现"],"AC","X","病理学",2025,"mock","病理学|炎症","肉芽肿性炎","肉芽肿性炎是以巨噬细胞及其衍生细胞（上皮样细胞、多核巨细胞）局限性增生形成结节为特点的特殊类型慢性炎症，故主要成分为上皮样细胞与多核巨细胞，A正确；不同病因的肉芽肿形态各异（结核为干酪样坏死性肉芽肿、结节病为非干酪性、伤寒为伤寒小结、异物性肉芽肿伴异物及裂隙），C正确。B错：炎性息肉与炎性假瘤属增生性炎（黏膜上皮或纤维组织增生形成），不形成肉芽肿，切勿与“肉芽组织/肉芽肿”混淆；D错：组织修复时出现的是肉芽组织（新生毛细血管、成纤维细胞、炎细胞），而非肉芽肿性炎。","《病理学》第9版·炎症·肉芽肿性炎","green"],["YC25N151X","以下属于浸润性生长的肿瘤是",["葡萄胎","血管瘤","动脉瘤","Bowen病"],"BD","X","外科学",2025,"mock","外科学|神经外科","浸润性生长的肿瘤","血管瘤无包膜、边界不清，向周围组织间隙内生长，属良性肿瘤中的浸润性生长方式（B）；Bowen病为表皮内原位癌，癌细胞异型明显、可累及毛囊与汗腺导管并向深部推进，具有浸润性生长的生物学行为（D）。葡萄胎为滋养层细胞增生伴绒毛水肿，呈膨胀性生长（A）；动脉瘤是血管壁的局限性扩张，并非真性肿瘤（C）。","《病理学》第9版·肿瘤·肿瘤的生长方式","green"],["YC25N152X","关于病毒性肝炎的说法正确的是",["桥接坏死大部分可以完全再生","甲肝病毒引起肝硬化的转化率较高","部分肝细胞可见凋亡小体出现","所有的急性肝炎都可以见到毛玻璃样的\n肝细胞"],"BC","X","外科学",2025,"mock","外科学|其他","病毒性肝炎的病理变化","病毒性肝炎时肝细胞凋亡形成嗜酸性小体（Councillman小体），见于各型急性肝炎（C）。桥接坏死累及汇管区与中央静脉之间或相邻汇管区的肝细胞，网状支架塌陷，多难以完全再生、常进展为肝硬化（A错）；甲型肝炎为自限性、不转慢性，极少发展为肝硬化（B错）；毛玻璃样肝细胞为HBsAg在胞质内蓄积的表现，见于乙型肝炎病毒携带者与慢性乙型肝炎，并非所有急性肝炎都有（D错）。⚠️原答案存疑：B项“甲肝病毒引起肝硬化转化率较高”与教材不符，按教材答案应为C。","《病理学》第9版·传染病·病毒性肝炎","yellow"],["YC25N153X","关于结核病的叙述，正确的是",["慢性纤维空洞型肺结核的传染性最强，\n危害最大","原发性肺结核病变新旧不一，上重下轻","原发性、继发性肺结核均可引起粟粒性\n结核病","睾丸结核是男性不育的常见原因"],"AC","X","外科学",2025,"mock","外科学|其他","肺结核类型与特点","慢性纤维空洞型肺结核为继发性肺结核的晚期类型，空洞长期不愈、反复排菌，传染性最强、对周围人群危害最大（A）；原发性和继发性肺结核的血行播散均可引起急性或慢性粟粒性结核病（C）。“病变新旧不一、上重下轻”是继发性肺结核的特点，原发性肺结核表现为原发综合征（Ghon灶、淋巴管炎、肺门淋巴结肿大），故B错误。男性生殖系结核以附睾结核最常见，可致输精管阻塞而不育，但D并非教材强调的“常见原因”表述。","《病理学》第9版·传染病·结核病","green"],["YC25N154X","气胸常见的体征包括",["气管向健侧移位","语颤减弱","肝浊音界下降","呼吸音降低"],"ACD","X","外科学",2025,"mock","外科学|胸心外科","气胸的体征","气胸的典型体征：患侧胸廓饱满、呼吸动度减弱，气管与纵隔向健侧移位，叩诊呈鼓音，听诊呼吸音减弱或消失，语音传导（语颤）减弱，右侧气胸时肝浊音界下移甚至消失，可伴皮下气肿。⚠️原答案存疑：语颤减弱（B）同样是气胸的公认体征，其机制为胸膜腔积气阻碍声波传导，故按教材B亦应入选，本题更接近ABCD。","《外科学》第9版·胸心外科·气胸·临床表现与体征","yellow"],["YC25N155X","对慢性心衰病人远期改善有积极\n意义的药物是",["洋地黄","ACEI","呋塞米","β受体阻滞剂"],"BD","X","内科学",2025,"mock","内科学|循环系统疾病","改善心衰远期预后的药物","对慢性心衰远期预后有改善作用的是神经内分泌拮抗剂：ACEI（抑制RAAS、逆转心室重构、降低病死率）与β受体阻滞剂（抑制交感激活、减少猝死），故选BD。洋地黄可减轻症状、减少住院，但不降低总病死率；呋塞米缓解淤血症状，无改善远期生存的证据，长期大剂量还可能激活神经内分泌。","《内科学》第9版·循环系统疾病·慢性心力衰竭","green"],["YC25N157X","可表现为急进型肾炎综合征的非\n新月体肾炎为",["SLE","过敏性紫癜性肾炎","重症急性肾炎","重症膜增生性肾炎"],"CD","X","外科学",2025,"mock","外科学|其他","急进型肾炎综合征的病因","急进型肾炎综合征指起病急、肾功能急剧恶化（数周至数月内进展至尿毒症）的肾炎综合征。非新月体性肾炎中，重症急性链球菌感染后肾炎（毛细血管内增生性，C）与重症膜增生性肾炎（D）均可表现为此型。而SLE肾炎与过敏性紫癜性肾炎常伴广泛新月体形成，属新月体性肾炎范畴，故不选。","《内科学》第9版·泌尿系统·急进性肾小球肾炎","green"],["YC25N158X","APL免疫学检查常为阳性的是",["CD13","CD33","CD34","CD117"],"ABD","X","外科学",2025,"mock","外科学|其他","APL免疫表型","急性早幼粒细胞白血病（APL，M₃，t(15;17)/PML-RARα）瘤细胞表达髓系标志CD13、CD33、CD117，常为阳性；而CD34多为阴性，HLA-DR阴性，这是与其它类型AML鉴别的重要免疫表型特点。故阳性者为CD13、CD33、CD117。","《内科学》第9版·血液系统·急性白血病","green"],["YC25N159X","符合原发性甲减检查的是",["TRH下降","TSH下降","TT4降低","FT4降低"],"CD","X","内科学",2025,"mock","内科学|内分泌与代谢","原发性甲减的甲状腺功能特点","原发性甲减是甲状腺本身病变（桥本甲状腺炎、甲状腺术后或¹³¹I治疗后），甲状腺激素合成不足使TT₄、FT₄降低；负反馈减弱使TRH、TSH升高（TSH是诊断原发性甲减最敏感的指标），故选CD。TSH下降与TRH下降见于垂体性或下丘脑性（中枢性）甲减。","《内科学》第9版·内分泌与代谢疾病·甲状腺功能减退症","green"],["YC25N160X","胰腺炎严重程度指标?",["血Ca+","C反应蛋白","血糖浓度","血沉"],"ABC","X","内科学",2025,"mock","内科学|消化系统疾病","急性胰腺炎严重程度的实验室指标","急性胰腺炎严重程度评估的实验室指标包括血钙（<2mmol/L提示脂肪坏死皂化、重症）、C反应蛋白（>150mg/L提示重症）与血糖（应激与胰岛破坏致空腹血糖>11.1mmol/L，Ranson指标之一），故选ABC。血沉特异性差、升高缓慢且与病情严重度相关性弱，不作严重度判断指标。","《内科学》第9版·消化系统疾病·急性胰腺炎","green"],["YC25N161X","脾切除适应症",["多毛细胞白血病","副脾","脾结核","脾囊肿"],"ABCD","X","外科学",2025,"mock","外科学|普通外科","脾切除适应证","脾切除的适应证包括脾本身的病变与脾功能相关的疾病：多毛细胞白血病以显著脾大为特征，脾切除可缓解血细胞减少（A）；脾结核药物难以控制或形成脓肿/脾亢者（C）；脾囊肿尤其是真性囊肿、寄生虫性囊肿或体积大者（D）。副脾本身非疾病，但在遗传性球形红细胞增多症、ITP等行脾切除时应一并切除副脾以防复发，故亦列于本题（B）。外伤性脾破裂、门脉高压脾亢亦为常见指征。","《外科学》第9版·普通外科·脾疾病·脾切除术适应证","green"],["YC25N162X","下列关于血尿的叙述，正确的有",["尿液呈红色即是血尿","一般在1000mL尿中含1mL血液即呈肉眼\n血尿","离心尿每个高倍镜视野中红细胞＞3个\n即有病理意义","血尿程度与疾病严重性成正比"],"BC","X","外科学",2025,"mock","外科学|其他","血尿的定义与意义","血尿的判定：肉眼血尿指每1000ml尿中含1ml以上血液，呈洗肉水样或血色（B）；镜下血尿指离心尿每高倍视野红细胞>3个，有病理意义（C）。尿呈红色不等于血尿，需排除利福平、酚红、甜菜、红心火龙果等药物食物色素及血红蛋白尿、肌红蛋白尿（A错）；血尿程度与病变严重性并不平行，如膀胱癌可表现为间歇无痛肉眼血尿而病变已属晚期（D错）。","《外科学》第9版·泌尿外科·泌尿系统常见症状·血尿","green"],["YC25N163X","下列哪些疾病可出现症征不符的\n临床特点",["肠系膜上静脉血栓形成","肠系膜上动脉血栓形成","胆道蛔虫症","贲门失弛缓症"],"ABC","X","外科学",2025,"mock","外科学|其他","症征不符的急腹症","症征不符指腹痛剧烈而腹部体征轻微，因病变早期为缺血或痉挛性疼痛、尚无腹膜炎症波及壁层腹膜。肠系膜上动脉栓塞（急性缺血，疼痛剧烈而腹软压痛轻）、肠系膜上静脉血栓形成（早期同样以剧痛与体征分离为特点）以及胆道蛔虫症（阵发钻顶样剧痛而剑突下仅轻压痛、间歇期无异常）均属此类。贲门失弛缓症表现为吞咽困难与反流，无此特点。","《外科学》第9版·普通外科·急腹症与肠系膜血管缺血性疾病","green"],["YC25N164X","下列哪些属于稳定性骨折",["裂缝骨折","压缩性骨折","斜形骨折","嵌插骨折"],"ABD","X","外科学",2025,"mock","外科学|骨科","稳定性骨折分类","稳定性骨折指复位后不易再移位者，包括裂缝骨折、青枝骨折、横形骨折、压缩性骨折（椎体）、嵌插骨折、不完全骨折。斜形、螺旋形、粉碎形骨折因断端有剪力与旋转力，复位后易再移位，属不稳定性骨折。故本题选裂缝、压缩、嵌插骨折，斜形骨折不选。","《外科学》第9版·骨科·骨折概论·骨折分类","green"]];

  get: (k, d) => { try { const v = localStorage.getItem('xz_'+k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set: (k, v) => { try { localStorage.setItem('xz_'+k, JSON.stringify(v)); } catch(e){} }

  view: 'home',
  list: [],       // 当前题目 id 数组

};

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function nav(v){
  state.view = v;
  document.querySelectorAll('.nav div').forEach(e=>e.classList.remove('on'));
  const el = document.getElementById('n-'+v);
  if(el) el.classList.add('on');
  render();
  window.scrollTo(0,0);
}

function byId(id){ return DATA.find(x=>x[I.id]===id); }

// ============ 首页 ============
function renderHome(){
  const wrong = LS.get('wrong', {});
  const done = LS.get('done', {});
  const nWrong = Object.keys(wrong).length;
  const nDone = Object.keys(done).length;
  const realN = DATA.filter(x=>x[I.src]==='real').length;

  let h = `
  <div class="card">
    <h3>📚 题库概览</h3>
    <div class="stat">
      <div><b>${DATA.length}</b><span>总题数</span></div>
      <div><b>${realN}</b><span>真题</span></div>
      <div><b>${nDone}</b><span>已做</span></div>
      <div><b>${nWrong}</b><span>错题</span></div>
    </div>
    <div class="prog"><i style="width:${nDone/DATA.length*100}%"></i></div>
  </div>`;

  // 整卷模考
  const realYears = [...new Set(DATA.filter(x=>x[I.src]==='real').map(x=>x[I.year]))].sort((a,b)=>b-a);
  h += `<div class="card"><h3>⏱ 整卷模考（180 分钟）</h3><div class="row">`;
  realYears.forEach(y=>{
    const n = DATA.filter(x=>x[I.src]==='real' && x[I.year]==y).length;
    h += `<button class="btn ghost" onclick="startExam(${y})">${y} 年 · ${n}题</button>`;
  });
  h += `</div></div>`;

  // 分科刷题
  const subs = [...new Set(DATA.map(x=>x[I.subj]))];
  h += `<div class="card"><h3>📖 按学科刷题</h3><div class="chips">`;
  subs.forEach(s=>{
    const n = DATA.filter(x=>x[I.subj]===s).length;
    h += `<div class="chip" onclick="startSubject('${s}')">${s} ${n}</div>`;
  });
  h += `</div></div>`;

  // 题型
  h += `<div class="card"><h3>🔤 按题型专项</h3><div class="chips">
    <div class="chip" onclick="startType('X')">X型多选 ${DATA.filter(x=>x[I.type]==='X').length}</div>
    <div class="chip" onclick="startType('B')">B型共用选项 ${DATA.filter(x=>x[I.type]==='B').length}</div>
    <div class="chip" onclick="startWrong()">只做错题 ${nWrong}</div>
  </div></div>`;

  // 标注提示
  const nYellow = DATA.filter(x=>x[I.flag]==='yellow').length;
  if(nYellow) h += `<div class="card"><h3>⚠️ 标注说明</h3>
    <div style="font-size:14px;color:#64748b">题库含 <b style="color:#b45309">${nYellow}</b> 题标注为「答案存疑」。
    这些题保留原始答案，但在解析中给出存疑理由与教材结论，做题时请以解析为准。</div></div>`;

  h += `<div class="card" style="font-size:12.5px;color:#94a3b8;text-align:center">
    版本 ${VER}｜2024-2026 真题 + 银成模拟卷｜解析覆盖 100%</div>`;

  document.getElementById('main').innerHTML = h;
}

// ============ 刷题 ============
function startExam(year){
  const list = DATA.filter(x=>x[I.src]==='real' && x[I.year]===year).map(x=>x[I.id]);
  state.list = list; state.pos = 0; state.sel = []; state.answered = false;
  state.mode = 'exam'; state.filter = {examYear: year};
  nav('practice');
}
function startSubject(s){
  state.list = DATA.filter(x=>x[I.subj]===s).map(x=>x[I.id]);
  state.pos = 0; state.sel = []; state.answered = false; state.mode='free';
  nav('practice');
}
function startType(t){
  state.list = DATA.filter(x=>x[I.type]===t).map(x=>x[I.id]);
  state.pos = 0; state.sel = []; state.answered = false; state.mode='free';
  nav('practice');
}
function startWrong(){
  const w = Object.keys(LS.get('wrong', {}));
  if(!w.length){ alert('错题本是空的，先去刷题吧'); return; }
  state.list = w; state.pos = 0; state.sel = []; state.answered = false; state.mode='free';
  nav('practice');
}
function startKp(kp){
  state.list = DATA.filter(x=>x[I.kp]===kp).map(x=>x[I.id]);
  state.pos = 0; state.sel = []; state.answered = false; state.mode='free';
  nav('practice');
}

function renderPractice(){
  const box = document.getElementById('main');
  if(!state.list.length){ box.innerHTML = '<div class="empty">没有题目<br>请从首页选择刷题方式</div>'; return; }
  const id = state.list[state.pos];
  const q = byId(id);
  if(!q){ box.innerHTML = '<div class="empty">题目不存在</div>'; return; }
  const typ = q[I.type];
  const multi = typ === 'X';

  let h = `<div class="bar">
    <span>${state.pos+1} / ${state.list.length}</span>
    <span>${esc(q[I.subj])} · ${q[I.year]}${q[I.src]==='mock'?'(模拟)':''} · ${typ}型</span>
  </div>`;

  h += `<div class="card">
    <div class="qn">
      <span class="tag">${q[I.id]}</span>
      ${q[I.kp2] ? `<span class="tag kp">${esc(q[I.kp2])}</span>` : ''}
      ${q[I.flag]==='yellow' ? '<span class="tag warn">答案存疑</span>' : ''}
    </div>
    <div class="stem">${esc(q[I.stem])}</div>
    <div class="opts" id="opts">`;

  q[I.opts].forEach((o,j)=>{
    const L = 'ABCD'[j];
    h += `<div class="opt ${multi?'multi':''}" data-j="${j}" onclick="pick(${j})">
      <span class="l">${L}</span><span>${esc(o)}</span></div>`;
  });
  h += `</div>`;

  if(multi && !state.answered){
    h += `<div style="margin-top:12px;font-size:13.5px;color:#6366f1">多选：至少选 2 项，选好后点「确认」</div>
      <div class="row" style="margin-top:10px"><button class="btn" onclick="submitMulti()">确认答案</button></div>`;
  }

  h += `<div class="ansbox" id="ansbox" style="display:none"></div>`;
  h += `<div id="explbox"></div>`;
  h += `</div>`;

  h += `<div class="row">
    <button class="btn ghost" onclick="prevQ()" ${state.pos===0?'disabled style="opacity:.4"':''}>上一题</button>
    <button class="btn" onclick="nextQ()">${state.pos===state.list.length-1?'完成':'下一题'}</button>
  </div>`;

  box.innerHTML = h;

  // 恢复已答状态
  const done = LS.get('done', {});
  if(done[id]) { state.answered = true; showAnswer(q, done[id].ok); }
}

function pick(j){
  if(state.answered) return;
  const q = byId(state.list[state.pos]);
  const multi = q[I.type] === 'X';
  if(multi){
    const el = document.querySelector(`.opt[data-j="${j}"]`);
    const k = state.sel.indexOf(j);
    if(k>=0){ state.sel.splice(k,1); el.classList.remove('on'); }
    else { state.sel.push(j); el.classList.add('on'); }
  } else {
    state.sel = [j];
    document.querySelectorAll('.opt').forEach(e=>e.classList.remove('on'));
    document.querySelector(`.opt[data-j="${j}"]`).classList.add('on');
    submit();
  }
}

function submitMulti(){
  if(state.sel.length < 2){ alert('多选题至少选 2 项'); return; }
  submit();
}

function submit(){
  const q = byId(state.list[state.pos]);
  const chosen = state.sel.slice().sort().map(j=>'ABCD'[j]).join('');
  const correct = q[I.ans].split('').sort().join('');
  const ok = chosen === correct;
  state.answered = true;

  // 记录
  const done = LS.get('done', {}); done[q[I.id]] = {ok: ok, t: Date.now()}; LS.set('done', done);
  const wrong = LS.get('wrong', {});
  if(ok){ delete wrong[q[I.id]]; } else { wrong[q[I.id]] = {t: Date.now(), my: chosen}; }
  LS.set('wrong', wrong);

  document.querySelectorAll('.opt').forEach(e=>{
    const j = +e.dataset.j; const L = 'ABCD'[j];
    e.classList.remove('on');
    if(correct.includes(L)) e.classList.add('right');
    else if(chosen.includes(L)) e.classList.add('wrong');
  });
  showAnswer(q, ok, chosen);
}

function showAnswer(q, ok, chosen){
  const box = document.getElementById('ansbox');
  if(!box) return;
  box.style.display = 'block';
  box.className = 'ansbox ' + (ok?'ok':'no');
  const correct = q[I.ans].split('').sort().join('');
  box.innerHTML = ok ? `✅ 回答正确　答案 ${correct}`
    : `❌ 回答错误　正确答案 <b>${correct}</b>${chosen?'　你的选择 '+chosen:''}`;

  const eb = document.getElementById('explbox');
  if(eb && q[I.exp]){
    let h = `<div class="expl open"><div class="expl-h" onclick="this.parentNode.classList.toggle('open')">
      <span>💡 解析</span><span>▾</span></div>
      <div class="expl-b">${esc(q[I.exp])}`;
    if(q[I.ref]) h += `<div class="expl-src">📚 ${esc(q[I.ref])}</div>`;
    if(q[I.flag]==='yellow') h += `<div class="flagbar">⚠️ 本题标注「答案存疑」，请以上方解析中的教材结论为准</div>`;
    h += `</div></div>`;
    eb.innerHTML = h;
  }
}

function prevQ(){ if(state.pos>0){ state.pos--; state.sel=[]; state.answered=false; render(); window.scrollTo(0,0);} }
function nextQ(){
  if(state.pos < state.list.length-1){ state.pos++; state.sel=[]; state.answered=false; render(); window.scrollTo(0,0); }
  else {
    const done = LS.get('done', {});
    const okN = state.list.filter(id=>done[id] && done[id].ok).length;
    alert(`本组完成！\n共 ${state.list.length} 题，答对 ${okN} 题，正确率 ${(okN/state.list.length*100).toFixed(1)}%`);
    nav('home');
  }
}

function renderWrong(){
  const wrong = LS.get('wrong', {});
  const ids = Object.keys(wrong);
  if(!ids.length){
    document.getElementById('main').innerHTML = '<div class="empty">错题本是空的 🎉</div>'; return;
  }
  const bySubj = {};
  ids.forEach(id=>{
    const q = byId(id); if(!q) return;
    (bySubj[q[I.subj]] = bySubj[q[I.subj]] || []).push(id);
  });
  let h = `<div class="card"><h3>❌ 错题本（${ids.length} 题）</h3>
    <div class="row"><button class="btn" onclick="startWrong()">开始重做</button></div></div>`;
  Object.keys(bySubj).forEach(s=>{
    h += `<div class="card"><h3>${esc(s)} · ${bySubj[s].length}题</h3>`;
    bySubj[s].slice(0,20).forEach(id=>{
      const q = byId(id); if(!q) return;
      h += `<div style="padding:9px 0;border-bottom:1px solid #f1f5f9;font-size:14px">
        <span class="tag">${id}</span>${esc(q[I.stem].slice(0,48))}…</div>`;
    });
    h += `</div>`;
  });
  document.getElementById('main').innerHTML = h;
}

// ============ 统计 ============
function renderMe(){
  const done = LS.get('done', {});
  const ids = Object.keys(done);
  const nOk = ids.filter(id=>done[id].ok).length;
  const rate = ids.length ? (nOk/ids.length*100).toFixed(1) : 0;

  // 分学科
  const bySubj = {};
  ids.forEach(id=>{
    const q = byId(id); if(!q) return;
    const s = q[I.subj];
    bySubj[s] = bySubj[s] || {n:0, ok:0};
    bySubj[s].n++;
    if(done[id].ok) bySubj[s].ok++;
  });

  let h = `<div class="card"><h3>📊 学习统计</h3>
    <div class="stat">
      <div><b>${ids.length}</b><span>已做</span></div>
      <div><b>${nOk}</b><span>答对</span></div>
      <div><b>${rate}%</b><span>正确率</span></div>
    </div></div>`;

  h += `<div class="card"><h3>分学科正确率</h3>`;
  Object.keys(bySubj).sort((a,b)=>bySubj[b].n-bySubj[a].n).forEach(s=>{
    const v = bySubj[s];
    const r = (v.ok/v.n*100).toFixed(1);
    h += `<div style="margin-bottom:11px">
      <div style="display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px">
        <span>${esc(s)}</span><span style="color:#0f766e;font-weight:600">${r}% (${v.ok}/${v.n})</span></div>
      <div class="prog"><i style="width:${r}%"></i></div></div>`;
  });
  if(!Object.keys(bySubj).length) h += '<div style="color:#94a3b8;font-size:14px">还没有记录</div>';
  h += `</div>`;

  h += `<div class="card"><h3>数据管理</h3>
    <div class="row"><button class="btn ghost" onclick="resetAll()">清空本地记录</button></div>
    <div style="font-size:12px;color:#94a3b8;margin-top:10px">
    数据保存在本机浏览器，换设备不会同步</div></div>`;

  document.getElementById('main').innerHTML = h;
}

function resetAll(){
  if(!confirm('确认清空所有做题记录和错题？此操作不可恢复')) return;
  localStorage.removeItem('xz_done');
  localStorage.removeItem('xz_wrong');
  render();
  alert('已清空');
}

// ============ 路由 ============
function render(){
  const t = document.getElementById('ttl');
  const s = document.getElementById('sub');
  const v = state.view;
  if(v==='home'){ t.textContent='西医综合 306 · 真题库'; s.textContent=`${DATA.length} 题｜2024-2026 真题 + 模拟｜逐题解析`; renderHome(); }
  else if(v==='practice'){ t.textContent='刷题'; s.textContent=''; renderPractice(); }
  else if(v==='kp'){ t.textContent='知识点'; s.textContent='按教材章节聚合'; renderKp(); }
  else if(v==='wrong'){ t.textContent='错题本'; s.textContent=''; renderWrong(); }
  else if(v==='me'){ t.textContent='统计'; s.textContent=''; renderMe(); }
}

// 左右滑动切题
let tx=0, ty=0;
document.addEventListener('touchstart', e=>{ tx=e.touches[0].clientX; ty=e.touches[0].clientY; }, {passive:true});
document.addEventListener('touchend', e=>{
  if(state.view!=='practice') return;
  const dx = e.changedTouches[0].clientX - tx;
  const dy = e.changedTouches[0].clientY - ty;
  if(Math.abs(dx)>70 && Math.abs(dx)>Math.abs(dy)*1.6){
    if(dx<0) nextQ(); else prevQ();
  }
});

render();
</script>
