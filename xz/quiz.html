"《医师宪章：新千年的医学专业精神》三项基本原则之首是“将患者利益放在首位”，另两项为患者自主与社会公正。医生个人利益、医院经济利益置于首位均违背专业精神；医院与患者利益并重仍不及患者利益优先的原则。","《医学伦理学》·医学专业精神·医师宪章","green"],["2022N109A","良好的医患沟通有助于建立融洽的医患关系，其目的不包括",["使医患形成共同的治疗目标","使医患情感共鸣","使医患利益共享","使医患相互监督"],"D","A","人文",2022,"real","人文|医患沟通","医患沟通的目的","良好医患沟通旨在形成共同的治疗目标、增进相互理解与情感共鸣，并在信息共享基础上合作决策，属于以信任为基础的协作关系。医患之间不是相互监督、彼此防范的关系，把沟通当作监督手段会破坏信任、加重对立。A、B、C均是沟通的正当目的。故选D。","《医学伦理学》第9版·医疗人际关系伦理·医患沟通","green"],["2022N110A","在医患关系中，患者的健康信息属于保密范围，普遍认为对遗传信息也应当保密，只在特定 情况下信息透露可以得到伦理学辩护。某女性检测出 BRCA1基因突变;乳腺癌发病风险 增高。医生下列做法恰当的是",["建议该女性将此信息告知直系亲属","将该遗传信息透露给其应聘单位","将该信息透露给保险公司","将该信息直接透露给其全部家属"],"A","A","人文",2022,"real","人文|医学伦理","遗传信息的告知策略","BRCA1突变属遗传信息，既涉及本人也涉及血亲的重大健康利益，但向谁披露、何时披露应由患者决定。恰当做法是说明该突变对直系亲属乳腺癌、卵巢癌风险的提示意义，建议并鼓励患者本人告知亲属，必要时经其同意协助沟通。直接告知全部家属或透露给单位、保险公司则侵犯隐私，并可能引起歧视与保险不利。故选A。","《医学伦理学》第9版·生命医学技术伦理·遗传信息的保密与例外","green"],["2022N111A","女童，5岁。因发热伴腮腺部位肿痛到急诊就诊，父亲急切地对医生说;\"孩子得腮腺炎了， 赶快用点消炎药。\"医生仔细检查后确诊为流行性腮腺炎，开具抗病毒药，并告知护理措施。 但患儿父亲仍坚持自己的要求。此时医生不恰当的做法是",["向家长介绍流行性腮腺炎的临床表现和治疗知识","告知家长不当用药可能对患儿产生的损害","劝说家长要相信医生的专业处置","尊重患儿父亲要求"],"D","A","内科学",2022,"real","内科学|其他","患者不合理要求的处理","流行性腮腺炎为病毒感染，抗生素无效，医生应进行科普解释（A）、说明不当用药的危害（B）、争取家长配合（C）。不恰当的做法是无原则“尊重患儿父亲要求”而使用抗生素（D）——这属于迁就患者不合理要求、违背有利与不伤害原则及合理用药规范。","《医学伦理学》·临床诊疗伦理·合理用药与知情同意","green"],["2022N116B","每搏输出量增加，血压的变化是",["收缩压升高，舒张压升高，脉压增大","收缩压下降，舒张压下降，脉压减小","收缩压下降，舒张压升高，脉压减小","收缩压升高，舒张压下降，脉压增大"],"A","B","外科学",2022,"real","外科学|其他","每搏输出量对血压的影响","每搏输出量增加使心缩期射入主动脉的血量增多、血流加速，收缩压明显升高；因血流加速、舒张期主动脉内残余血量增加不多，舒张压轻度升高，故脉压增大，选A。B、C中收缩压下降与生理不符；D舒张压下降见于大动脉硬化或动静脉瘘，故不选。","《生理学》第9版·血液循环·动脉血压的影响因素","green"],["2022N117B","大动脉硬化时，血压的变化是",["收缩压升高，舒张压升高，脉压增大","收缩压下降，舒张压下降，脉压减小","收缩压下降，舒张压升高，脉压减小","收缩压升高，舒张压下降，脉压增大"],"D","B","外科学",2022,"real","外科学|其他","大动脉硬化与脉压增大","大动脉硬化时血管壁弹性贮器作用减弱，心缩期不能有效扩张缓冲，收缩压明显升高；舒张期弹性回缩差、外周血液继续流出，舒张压下降，故脉压增大，选D。A收缩压与舒张压均升高见于外周阻力增加；B、C与硬化时的血压变化不符，故不选。","《生理学》第9版·血液循环·动脉血压的影响因素","green"],["2022N118B","肾脏重吸收葡萄糖的主要部位是",["近端小管","髓袢","远曲小管","集合管内髓段"],"A","B","外科学",2022,"real","外科学|其他","葡萄糖重吸收部位","肾小球滤过的葡萄糖在近端小管（主要在近曲小管前段）经SGLT2与GLUT2转运体几乎全部重吸收，故A正确。髓袢、远曲小管与集合管无重吸收葡萄糖的能力；当血糖超过肾糖阈（约10mmol/L）时，超出重吸收极限而出现糖尿，B、C、D不选。","《生理学》第9版·尿的生成和排出·肾小管的重吸收","green"],["2022N119B","尿素容易通透的部位是 D。α-酮戊二酸 C.异柠檬酸 A.乙酰辅酶 A B.丙二酰辅酶A",["近端小管","髓袢","远曲小管","集合管内髓段"],"D","B","生物化学",2022,"real","生物化学|酶","尿素在集合管的通透性与尿素再循环","尿素在肾小管各段的通透性不同：近端小管对尿素通透性较高但重吸收有限，髓袢升支细段、远曲小管几乎不通透；内髓集合管在抗利尿激素作用下对尿素通透性显著增高，尿素由此进入内髓间质，是形成髓质渗透梯度的的重要环节。故答案为内髓集合管。⚠️本题题干混入其他题的选项（“D。α-酮戊二酸…”），属OCR错配，已按真实知识点（肾小管尿素通透性）判题。","《生理学》第9版·尿的生成和排出·肾小管和集合管的物质转运","yellow"],["2022N120B","柠檬酸裂解酶催化生成的产物是",["乙酰辅酶 A","丙二酰辅酶A","异柠檬酸","α-酮戊二酸"],"A","B","病理学",2022,"real","病理学|细胞和组织的适应与损伤","柠檬酸裂解酶与脂肪酸合成原料","柠檬酸裂解酶（ATP-柠檬酸裂解酶）存在于胞质，催化柠檬酸裂解为乙酰辅酶A和草酰乙酸，同时消耗ATP，是将线粒体内生成的柠檬酸转运至胞质后重新生成乙酰辅酶A、为脂肪酸合成提供原料的关键酶，故选A乙酰辅酶A。丙二酰辅酶A由乙酰辅酶A羧化酶催化生成；异柠檬酸由顺乌头酸酶催化柠檬酸生成；α-酮戊二酸由异柠檬酸脱氢酶催化生成。","《生物化学与分子生物学》第9版·脂质代谢·脂肪酸合成","green"],["2022N121B","丙酮酸脱氢酶复合体催化生成的产物是",["乙酰辅酶 A","丙二酰辅酶A","异柠檬酸","α-酮戊二酸"],"A","B","病理学",2022,"real","病理学|细胞和组织的适应与损伤","丙酮酸脱氢酶复合体产物","丙酮酸脱氢酶复合体位于线粒体，催化丙酮酸氧化脱羧生成乙酰辅酶A、NADH和CO2，是糖有氧氧化不可逆的限速步骤，需TPP、硫辛酸、CoA、FAD、NAD+五种辅因子，故选A乙酰辅酶A。本题与上一小题同选乙酰辅酶A，但酶不同、部位不同（胞质与线粒体）。丙二酰辅酶A、异柠檬酸、α-酮戊二酸均非该酶产物。","《生物化学与分子生物学》第9版·糖代谢·糖的有氧氧化","green"],["2022N122B","能与内质网Ca库受体结合的第二信使是",["DAG","IP3","cAMP","eGMP"],"B","B","外科学",2022,"real","外科学|其他","IP3与内质网钙释放","IP3（1,4,5-三磷酸肌醇）为水溶性第二信使，生成后进入胞质与内质网膜上的IP3受体（Ca2+通道）结合，促使内质网释放Ca2+，故B正确。DAG留在膜上激活PKC；cAMP激活PKA；cGMP激活PKG，均不作用于内质网Ca2+库，A、C、D不选。","《生物化学与分子生物学》第9版·细胞信号转导·第二信使","green"],["2022N123B","能激活蛋白激酶 A的第二信使是",["DAG","IP3","cAMP","eGMP"],"C","B","生物化学",2022,"real","生物化学|核苷酸代谢","cAMP激活PKA","cAMP是腺苷酸环化酶催化ATP生成的第二信使，与蛋白激酶A（PKA）的调节亚基结合，使催化亚基解离而激活PKA。DAG激活PKC，IP3促Ca2+释放，cGMP激活PKG，均不激活PKA。","《生物化学与分子生物学》第9版·细胞信号转导·cAMP-PKA通路","green"],["2022N124B","肝细胞气球样变性是",["水样变性","脂肪变性","玻璃样变性","淀粉样变性"],"A","B","病理学",2022,"real","病理学|细胞和组织的适应与损伤","气球样变与水样变性","肝细胞气球样变是细胞水肿（水样变性）的严重阶段：缺氧、感染等使ATP减少、钠泵功能下降，细胞内水钠蓄积，肝细胞肿大变圆、胞质清亮淡染如气球，故选A水样变性。脂肪变性时胞质内出现大小不等的脂滴空泡、细胞核被挤向一侧；玻璃样变时胞质内出现均匀红染半透明物质（如Mallory小体）；淀粉样变是细胞间质内淀粉样蛋白沉积，与气球样变无关。","《病理学》第9版·细胞和组织的适应与损伤·细胞水肿","green"],["2022N125B","原发性高血压细动脉发生的病变是",["水样变性","脂肪变性","玻璃样变性","淀粉样变性"],"C","B","内科学",2022,"real","内科学|循环系统疾病","细动脉玻璃样变性","良性高血压时细动脉内皮细胞受损、血浆蛋白渗入管壁并使平滑肌细胞分泌基质增多，形成细动脉玻璃样（透明）变性，管壁增厚、管腔狭窄。水样变性多见于急性缺血缺氧的实质细胞；脂肪变性见于肝；淀粉样变性见于淀粉样变病及多发性骨髓瘤。","《病理学》第9版·心血管系统疾病·高血压病","green"],["2022N126B","急性弥漫性增生性肾小球肾炎的肉眼观可为",["蚤咬肾","大白肾","固缩肾","瘢痕肾"],"A","B","内科学",2022,"real","内科学|泌尿系统疾病","蚤咬肾的大体表现","急性弥漫性增生性肾小球肾炎（链球菌感染后肾炎）时双肾对称性轻中度肿大、表面及切面见散在粟粒大小出血点，状如“蚤咬”，故称蚤咬肾。大白肾见于膜性肾病、脂性肾病；固缩肾见于慢性肾炎或良性高血压；瘢痕肾见于慢性肾盂肾炎。","《病理学》第9版·泌尿系统疾病·急性弥漫性增生性肾小球肾炎","green"],["2022N127B","慢性肾盂肾炎的肉眼观可为",["蚤咬肾","大白肾","固缩肾","瘢痕肾"],"D","B","外科学",2022,"real","外科学|其他","瘢痕肾的肉眼形态","慢性肾盂肾炎因反复感染与瘢痕形成，双肾不对称缩小、表面有不规则凹陷性瘢痕，肾盂肾盏变形、肾乳头萎缩，称瘢痕肾，故选D。A蚤咬肾是急性弥漫性毛细血管内增生性肾小球肾炎的肉眼观；B大白肾见于膜性肾病、脂性肾病；C固缩肾见于高血压肾小动脉硬化或慢性硬化性肾小球肾炎，A、B、C不选。","《病理学》第9版·泌尿系统疾病·慢性肾盂肾炎","green"],["2022N128B","冠心病患者冠脉内药物支架植入后，若存在氯吡格雷抵抗，可选用的药物是",["替格瑞洛","伊伐布雷定","左西孟旦","比伐卢定"],"A","B","内科学",2022,"real","内科学|循环系统疾病","氯吡格雷抵抗的处理","氯吡格雷为前体药，需CYP2C19活化，存在抵抗（CYP2C19慢代谢型）时应换用替格瑞洛——其为直接作用、可逆的P2Y₁₂受体拮抗剂，不受CYP2C19基因型影响，抗血小板作用更强更稳定。伊伐布雷定为窦房结If通道抑制剂（控心率），左西孟旦为钙增敏剂（正性肌力），比伐卢定为直接凝血酶抑制剂（抗凝）。","《内科学》第9版·循环系统疾病·抗血小板药物","green"],["2022N129B","冠心病患者并发急性左心衰竭，血压正常，可选用的药物是",["替格瑞洛","伊伐布雷定","左西孟旦","比伐卢定"],"C","B","内科学",2022,"real","内科学|循环系统疾病","急性左心衰的正性肌力药","冠心病并发急性左心衰、血压正常时，可选用左西孟旦（钙增敏剂）：增强心肌收缩而不增加细胞内钙、不增加耗氧，并有扩血管与改善顿抑心肌作用，优于传统正性肌力药。替格瑞洛为抗血小板药；伊伐布雷定禁用于急性失代偿心衰；比伐卢定为抗凝药。","《内科学》第9版·循环系统疾病·急性心力衰竭","green"],["2022N130B","轻度有机磷中毒不出现的临床表现是",["出汗、流涎","腹痛、腹泻","咳嗽、气促","肌纤维颤动"],"D","B","外科学",2022,"real","外科学|其他","有机磷中毒分度与症状","轻度有机磷中毒以毒蕈碱样（M样）症状为主，表现为出汗流涎、腹痛腹泻、瞳孔缩小、支气管分泌物增多与轻度呼吸困难，而肌纤维颤动属烟碱样（N样）症状，提示ACh在骨骼肌运动终板蓄积，见于中重度中毒，故轻度中毒不出现的是D。","《内科学》第9版·理化因素所致疾病·有机磷中毒分度","green"],["2022N131B","中度有机磷中毒出现的烟碱样症状是",["出汗、流涎","腹痛、腹泻","咳嗽、气促","肌纤维颤动"],"D","B","外科学",2022,"real","外科学|其他","烟碱样症状判定","中度有机磷中毒在M样症状加重的基础上出现N样症状，因乙酰胆碱在神经肌肉接头蓄积，表现为肌纤维颤动、肌束抽动，继而肌力减退甚至呼吸肌麻痹，故选D。出汗流涎、腹痛腹泻属M样症状；咳嗽气促为呼吸道分泌物增多与支气管痉挛的M样表现，A、B、C不选。","《内科学》第9版·理化因素所致疾病·有机磷中毒临床表现","green"],["2022N132B","巴德-吉亚利（Budd-Chiari）综合征导致的门静脉高压症类型是",["肝前型","肝后型","窦前型","窦后型"],"B","B","外科学",2022,"real","外科学|其他","门脉高压的分型","Budd-Chiari综合征为肝静脉或下腔静脉肝段阻塞致肝静脉回流受阻、肝窦压力升高，属肝后型门静脉高压，故选B。肝前型见于门静脉血栓形成或先天性闭锁；窦前型（如血吸虫病性肝纤维化）与窦后型（如肝硬化）病变均在肝内，A、C、D不选。","《外科学》第9版·普通外科·门静脉高压症·分类","green"],["2022N133B","血吸虫性肝硬化导致的门静脉高压症类型是",["肝前型","肝后型","窦前型","窦后型"],"C","B","内科学",2022,"real","内科学|消化系统疾病","血吸虫性肝硬化门脉高压类型","血吸虫病时虫卵沉积于汇管区门静脉小分支，引起肉芽肿与纤维化（干线型纤维化），阻塞窦前静脉，故属窦前型门静脉高压，肝细胞功能受损较轻，腹水与黄疸出现晚。肝前型见于门静脉血栓；肝后型见于Budd-Chiari综合征与缩窄性心包炎；窦后型见于肝硬化（肝炎后、酒精性）。","《病理学》第9版·寄生虫病·血吸虫病","green"],["2022N134B","黄疽进行性加重，一般无腹痛，最可能的诊断是 135.黄疸程度波动，常伴腹痛，最可能的诊断是 三、X型题∶136～165小题，每小题 2分，共60分。在每小题给出的A、B、C、D四个选项中，至少 有两项是符合题目要求的。请选出所有符合题目要求的答案，多选或少选均不得分。",["胰头癌","慢性胰腺炎","硬化性胆管炎","胆总管结石"],"A","B","外科学",2022,"real","外科学|普通外科","梗阻性黄疸的鉴别","黄疸进行性加重、一般无腹痛，伴皮肤瘙痒、体重下降与胆囊无痛性肿大（Courvoisier征），为胰头癌压迫胆总管所致，选A。本题选项兼容第135题：黄疸程度波动、常伴腹痛与发热，为胆总管结石（D），结石移动使梗阻时轻时重并引起胆绞痛。慢性胰腺炎与硬化性胆管炎黄疸多缓慢进展，不呈明显波动。⚠️本题与135题题干OCR合并，一并解析。","《外科学》第9版·普通外科·胰腺癌·临床表现","yellow"],["2022N136X","负反馈的特征包括",["其控制系统是一个闭合的环路","都有一个调定点","没有纠正偏差的功效","数量比正反馈少"],"AB","X","生理学",2022,"real","生理学|能量代谢和体温","负反馈与前馈、正反馈的区别","负反馈控制是闭合环路，输出信息回输至比较器与调定点比较后纠正偏差，故均有调定点，A、B正确。负反馈正是通过纠正偏差维持稳态，C错误；体内负反馈的数量远多于正反馈（正反馈仅见于排尿、分娩、凝血等少数过程），D错误。故选A、B。","《生理学》第9版·绪论·机体生理功能的调节","green"],["2022N137X","局部电位的特征包括",["非\"全或无\"","电紧张性扩布","无不应期","可以总和"],"ABCD","X","外科学",2022,"real","外科学|其他","局部电位的特征","局部电位是阈下刺激引起的局部去极化，特点为：非「全或无」，幅度随刺激强度增大而增大（A）；呈电紧张性扩布，随距离增加而衰减（B）；无不应期，可发生时间总和与空间总和（C、D）。故四项均正确，这也是局部电位与动作电位的根本区别。","《生理学》第9版·细胞的基本功能·局部电位","green"],["2022N138X","胃的运动形式包括",["紧张性收缩1","蠕动","分节运动","容受性舒张"],"ABD","X","外科学",2022,"real","外科学|其他","胃的运动形式","胃的运动形式有三种：进食时胃底与胃体容受性舒张以容纳食物（D）；持续的紧张性收缩维持胃形态与腔内压（A）；蠕动自胃中部起并向幽门推进，研磨并排空食糜（B）。C分节运动是小肠特有的运动形式，用于混合食糜与消化液，故不选。","《生理学》第9版·消化和吸收·胃的运动","green"],["2022N139X","寒战产热的特点包括",["屈肌和伸肌同时收缩","肌肉收缩转化为外功","常见于新生儿","寒战产热前出现肌紧张"],"AD","X","外科学",2022,"real","外科学|其他","寒战产热的特点","寒战是骨骼肌发生不随意的节律性收缩，屈肌与伸肌同时收缩，故不做外功、全部转化为热能，A正确、B错误；寒战出现前先有广泛的肌紧张增强，使产热增加，D正确。C错，新生儿体温调节功能不完善，主要依靠棕色脂肪组织代谢产热，缺乏寒战反应。","《生理学》第9版·能量代谢与体温·寒战产热","green"],["2022N140X","听觉骨传导的结构包括",["颅骨","圆窗膜","听骨链","耳蜗骨壁"],"AD","X","外科学",2022,"real","外科学|其他","骨传导的传导途径","声波经颅骨、耳蜗骨壁振动，使耳蜗内淋巴振动而感音，称骨传导，故A颅骨、D耳蜗骨壁正确。B圆窗膜与C听骨链属气传导路径（外耳道→鼓膜→听骨链→前庭窗→内耳淋巴），不参与骨传导，故不选。","《生理学》第9版·神经系统的功能·听觉","green"],["2022N141X","非联合型学习包括",["习惯化","敏感化","条件反射","长时程增强"],"ABD","X","外科学",2022,"real","外科学|其他","非联合型学习的形式","非联合型学习指单一刺激重复出现引起行为改变，包括习惯化（重复弱刺激使反应逐渐减弱）与敏感化（强刺激后对弱刺激反应增强），长时程增强（LTP）作为突触可塑性的细胞机制也属其范畴，故A、B、D正确。C条件反射需两个刺激（条件刺激与非条件刺激）的关联，属联合型学习，故不选。","《生理学》第9版·神经系统的功能·学习与记忆","green"],["2022N142X","酶学中涉及活化能的含义有",["底物的自由能","底物从初态转变到过渡态所需的能量","底物转变为产物所需的能量","过渡态中间物比基态反应物高出的能量"],"BD","X","生物化学",2022,"real","生物化学|酶","活化能的概念","活化能是底物分子由基态转变为过渡态（活化态）所需获得的额外能量，也等于过渡态中间物能级高出基态反应物的能量，故B、D正确。底物自身的自由能、底物与产物之间的净自由能变化（ΔG）描述的是反应方向与平衡，不是活化能。酶通过降低活化能加速反应而不改变ΔG。","《生物化学与分子生物学》第9版·酶·酶促反应的活化能","green"],["2022N143X","下列关于代谢调节的叙述，正确的有",["活性低的调节酶决定整个代谢的速度","受别构调节的酶决定整个代谢的类型","被化学修饰的酶决定整个代谢的部位","催化单向反应的酶决定整个代谢的方向"],"AD","X","外科学",2022,"real","外科学|其他","关键酶与代谢调节","代谢途径的速度由限速酶决定，即活性最低的调节酶决定整条途径的速度（A）；反应方向由催化单向不可逆反应的酶（关键酶）决定（D）。B错，受别构调节的酶只改变反应速度，不决定代谢类型；C错，化学修饰（如磷酸化）调节酶活性，并不决定代谢发生的部位，故不选。","《生物化学与分子生物学》第9版·物质代谢的整合与调节","green"],["2022N144X","可以作为蛋白质生物合成原料掺入多肽链中的氨基酸有",["羟脯氨酸","半胱氨酸","硒代半胱氨酸","甲硫氨酸"],"BCD","X","生物化学",2022,"real","生物化学|氨基酸代谢","硒代半胱氨酸与羟脯氨酸的区别","可作为原料直接掺入肽链的是20种编码氨基酸，半胱氨酸、甲硫氨酸符合。硒代半胱氨酸虽无自身密码子，但可经UGA密码子、由特殊tRNA及硒代半胱氨酸插入序列掺入多肽链，被视为第21种氨基酸，故C正确。羟脯氨酸无对应密码子，只能在胶原蛋白翻译后由脯氨酸羟化生成，不能直接掺入。","《生物化学与分子生物学》第9版·蛋白质的生物合成·翻译后加工","green"],["2022N145X","体内含有铁卟啉并可以生成胆红素的物质有",["血红蛋白","肌红蛋白","过氧化氢酶","过氧化物酶"],"ABCD","X","生物化学",2022,"real","生物化学|蛋白质的结构与功能","含铁卟啉蛋白与胆红素生成","血红蛋白、肌红蛋白、过氧化氢酶、过氧化物酶、细胞色素等均含铁卟啉（血红素）辅基，血红素在血红素加氧酶作用下卟啉环打开、释放CO与Fe2+生成胆绿素，再还原为胆红素，故四项皆可生成胆红素。血红蛋白来源占胆红素总量的80%以上。","《生物化学与分子生物学》第9版·血液生化·胆红素的生成与来源","green"],["2022N147X","PCR技术的用途有",["基因表达的检测","基因变异的分析","基因片段的获得","基因序列的突变"],"ABCD","X","生物化学",2022,"real","生物化学|DNA复制与修复","PCR的用途","PCR可扩增特异的基因片段（获取目的基因）；以RNA逆转录后再PCR（RT-PCR）可检测基因表达水平；通过序列特异性引物、测序或RFLP可分析基因变异；借助引入错配引物或重叠延伸PCR可进行定点突变、构建突变体，故四项均为PCR的用途。","《生物化学与分子生物学》第9版·基因重组与分子生物学技术·PCR技术","green"],["2022N148X","属于假膜性炎的病变或疾病有",["绒毛心","细菌性痢疾","大叶性肺炎 "呼吸链复合体的偶联部位","氧化磷酸化偶联部位即质子泵出、可带动ATP合成的位置，存在于复合体Ⅰ（NADH-泛醌还原酶）、Ⅲ（泛醌-细胞色素c还原酶）、Ⅳ（细胞色素c氧化酶）。复合体Ⅱ（琥珀酸-泛醌还原酶）不接受质子泵出、与ATP合成不偶联，故FADH2经复合体Ⅱ氧化只生成1.5分子ATP。","《生物化学与分子生物学》第9版·生物氧化·氧化磷酸化","green"],["2023N23A","下列酶中，调节尿素合成的关键酶是",["鸟氨酸氨基甲酰转移酶","精氨酸代琥珀酸合成酶","精氨酸代琥珀酸裂解酶","精氨酸酶"],"B","A","生物化学",2023,"real","生物化学|酶","尿素循环的限速酶","尿素循环的限速酶是精氨酸代琥珀酸合成酶（由瓜氨酸与天冬氨酸缩合），其活性最低、受产物反馈调节。氨基甲酰磷酸合成酶Ⅰ（CPS-Ⅰ）为上游调节酶，鸟氨酸氨基甲酰转移酶、精氨酸代琥珀酸裂解酶、精氨酸酶均非限速酶。","《生物化学与分子生物学》第9版·氨基酸代谢·尿素循环","green"],["2023N24A","不直接参与合成嘌呤核苷酸的物质是",["谷氨酰胺","天冬氨酸","丝氨酸","一碳单位"],"C","A","生物化学",2023,"real","生物化学|核苷酸代谢","嘌呤合成的原料","嘌呤环合成的原料为天冬氨酸（N1）、谷氨酰胺（N3、N9）、甘氨酸（C4、C5、N7）、一碳单位（C2、C8，由N10-甲酰四氢叶酸提供）和CO2（C6），不涉及丝氨酸。丝氨酸为一碳单位来源之一，但并非直接参与嘌呤环的原料。","《生物化学与分子生物学》第9版·核苷酸代谢·嘌呤核苷酸从头合成","green"],["2023N25A","具有修复双链断裂DNA损伤的修复系统是",["错配修复","直接修复","重组修复","碱基切除修复"],"C","A","生理学",2023,"real","生理学|其他","重组修复与双链断裂修复","DNA损伤修复方式中，能修复双链断裂的是重组修复（同源重组与非同源末端连接），通过从完整同源序列获取信息重建断裂片段，C正确。错配修复针对复制错配碱基；直接修复针对光化损伤（如嘧啶二聚体的光复活）与烷基化；碱基切除修复针对单个受损碱基，均不涉及双链断裂。","《生物化学与分子生物学》第9版·DNA损伤与修复","green"],["2023N26A","下列密码子的特点中，与移码突变有关的是",["通用性","方向性","连续性","摆动性"],"C","A","生物化学",2023,"real","生物化学|DNA复制与修复","密码的连续性与移码突变","遗传密码的连续性指mRNA上三个相邻碱基连续不断地编码一个氨基酸、密码子之间无间隔、无重叠。若发生碱基的插入或缺失（且非3的整倍数），则缺失位点之后的所有密码子阅读框全部改变，即移码突变。通用性、方向性、摆动性（第三位碱基的摆动配对）与移码无关。","《生物化学与分子生物学》第9版·蛋白质的生物合成·遗传密码的特点","green"],["2023N27A","真核生物转录因子结构中，属于转录激活结构域的是",["锌指结构","螺旋-环-螺旋","亮氨酸拉链","富含谷氨酰胺结构域"],"D","A","生物化学",2023,"real","生物化学|蛋白质的结构与功能","转录激活结构域","转录因子分DNA结合结构域和转录激活结构域。锌指、螺旋-环-螺旋、亮氨酸拉链均为DNA结合结构域；而富含谷氨酰胺、富含脯氨酸或酸性氨基酸的区域是转录激活结构域，负责招募辅激活因子和RNA聚合酶Ⅱ。","《生物化学与分子生物学》第9版·基因表达调控·反式作用因子","green"],["2023N28A","目前常用于分析体内DNA与蛋白质相互作用的分子生物学技术是",["标签蛋白沉淀","凝胶迁移变动分析","蛋白质印迹技术","酵母双杂交"],"B","A","生物化学",2023,"real","生物化学|其他","EMSA（凝胶迁移变动分析）","凝胶迁移变动分析（EMSA/gel shift）依据DNA-蛋白质复合物电泳迁移率低于游离DNA的原理，可检测某DNA序列是否与特定蛋白（转录因子）结合，是分析DNA与蛋白质相互作用的经典技术。酵母双杂交查蛋白-蛋白互作，蛋白质印迹检测蛋白表达，标签蛋白沉淀多用于分离复合物。","《生物化学与分子生物学》第9版·基因重组与分子生物学技术·EMSA","green"],["2023N29A","在巨噬细胞内形成的色素是",["脂褐素","黑色素","胆红素","含铁血黄素"],"D","A","生物化学",2023,"real","生物化学|血液生化","含铁血黄素的形成","含铁血黄素是血红蛋白被巨噬细胞吞噬后降解产生的铁蛋白聚集物，呈金黄色或棕褐色颗粒，是心衰肺淤血（心衰细胞）和陈旧性出血灶的典型色素。脂褐素为自噬溶酶体残余（心肌、肝细胞），黑色素由黑素细胞形成，胆红素在肝细胞及毛细胆管。","《病理学》第9版·细胞和组织的适应与损伤·细胞内色素","green"],["2023N30A","容易发生机化的病变是",["肺脓肿","脑梗死灶","Barrett食管","宫颈鳞状上皮化生"],"A","A","生物化学",2023,"real","生物化学|其他","机化的概念与常见对象","机化指坏死组织、血栓、渗出物或异物被肉芽组织长入取代、进而转变为纤维瘢痕组织的过程。肺脓肿的脓腔壁肉芽组织增生向腔内填充、最终机化愈合。脑梗死灶由胶质细胞增生形成胶质瘢痕（非机化），Barrett食管、宫颈鳞状上皮化生属上皮替换（化生），不属机化。","《病理学》第9版·细胞和组织的适应与损伤·机化","green"],["2023N31A","左心房形成球状血栓的类型是",["红色血栓","白色血栓","透明血栓","混合血栓"],"D","A","生物化学",2023,"real","生物化学|其他","球状血栓（混合血栓）","左心房内血流缓慢、形成涡流，凝血过程反复进行，血栓由头部的白色血栓、体部的混合血栓和尾部的红色血栓构成，肉眼呈球状，多附着于房壁，可脱落引起栓塞。混合血栓的组成是血小板小梁、纤维素、红细胞与白细胞交替层状排列。","《病理学》第9版·局部血液循环障碍·血栓的类型","green"],["2023N32A","男性，62岁。体检时发现右锁骨上淋巴结肿大，无压痛。淋巴结切除送检，病理诊断：淋巴结内可见 腺癌浸润。肿瘤原发部位最可能是",["食管","胃","肝","肺"],"D","A","生物化学",2023,"real","生物化学|其他","锁骨上淋巴结转移与原发灶判断","右锁骨上淋巴结属胸部（肺、食管、胸腔）的淋巴引流区，其内见腺癌浸润提示原发灶最可能在肺（肺腺癌）。左锁骨上淋巴结（Virchow淋巴结）多提示腹腔器官（胃）癌经胸导管转移；食管上段多引流至颈部/纵隔，肝的远处淋巴转移少见。","《病理学》第9版·肿瘤·肿瘤的转移","green"],["2023N33A","在微小病变性肾小球病中，肾小球在光镜下的主要特点",["局灶节段性玻璃样变","系膜细胞增生，系膜基质增厚","新月体形成","基本正常"],"D","A","病理学",2023,"real","病理学|细胞和组织的适应与损伤","微小病变性肾小球病光镜特点","微小病变性肾小球病（脂性肾病）是儿童肾病综合征最常见的病因，其特点是光镜下肾小球基本正常，近曲小管上皮细胞因大量重吸收脂蛋白而出现脂肪变性（脂滴空泡）；免疫荧光阴性，电镜下仅见脏层上皮细胞（足细胞）足突广泛融合。A局灶节段性玻璃样变见于局灶节段性肾小球硬化；B为系膜增生性肾炎；C为急进性肾炎。故选D。","《病理学》第9版·泌尿系统疾病·微小病变性肾小球病","green"],["2023N34A","与肝功能不全无直接关系的临床表现是",["出血倾向","黄疸","脾大","蜘蛛痣"],"C","A","生物化学",2023,"real","生物化学|血液生化","肝功能不全的临床表现","肝功能不全的直接表现包括凝血因子合成减少所致出血倾向、胆红素代谢障碍所致黄疸、雌激素灭活减少所致蜘蛛痣与肝掌、低白蛋白血症、肝性脑病等。脾大是门静脉高压导致的门脉高压症表现，与肝功能损害程度不平行，二者无直接关系。","《内科学》第9版·肝性脑病·肝功能不全的表现","green"],["2023N35A","下列肿瘤中，不属于恶性肿瘤的是",["神经母细胞瘤","髓母细胞瘤","肾母细胞瘤","骨母细胞瘤"],"D","A","生物化学",2023,"real","生物化学|其他","母细胞瘤的良恶性","骨母细胞瘤为良性（或交界性）骨肿瘤，由骨母细胞和骨样组织构成，不属恶性。神经母细胞瘤、髓母细胞瘤、肾母细胞瘤（Wilms瘤）均为胚胎性恶性肿瘤，多见于儿童，恶性度高。","《病理学》第9版·肿瘤·肿瘤的命名","green"],["2023N36A","胃体黏膜活检可见大量假幽门腺化生，病理诊断为",["慢性浅表性胃炎","慢性萎缩性胃炎","慢性肥厚性胃炎","疣状胃炎"],"B","A","病理学",2023,"real","病理学|细胞和组织的适应与损伤","假幽门腺化生的意义","正常胃体、胃底黏膜为含壁细胞的腺体，不含幽门腺。胃体黏膜活检见大量假幽门腺化生，即腺体呈幽门腺样（黏液分泌细胞增多、壁细胞和主细胞减少乃至消失），是胃体和胃底腺萎缩的标志，只出现于慢性萎缩性胃炎，故选B。A慢性浅表性（非萎缩性）胃炎炎症限于黏膜浅层、腺体无减少；C肥厚性胃炎腺体增生肥厚；D疣状胃炎为糜烂灶周围黏膜隆起。","《病理学》第9版·消化系统疾病·慢性萎缩性胃炎","green"],["2023N37A","可伴有低钙血症表现的甲状腺癌是",["乳头状癌","滤泡状癌","髓样癌","未分化癌"],"C","A","生物化学",2023,"real","生物化学|其他","髓样癌与降钙素","甲状腺髓样癌起源于滤泡旁C细胞，可大量分泌降钙素，降钙素抑制破骨细胞活性、降低血钙，故可伴低钙血症；同时血降钙素升高是其特征性标志物。乳头状癌、滤泡癌、未分化癌不分泌降钙素，一般不引起低钙。","《病理学》第9版·甲状腺疾病·甲状腺髓样癌","green"],["2023N38A","易累及骨旁组织形成“冷脓肿”的是",["骨肉瘤","骨结核","骨髓瘤","骨髓炎"],"B","A","生物化学",2023,"real","生物化学|其他","冷脓肿的形成","骨结核多发生于脊椎（TB spine），干酪样坏死物液化后沿筋膜间隙或软组织流注，在骨旁软组织内形成无红、热、痛的脓肿，称“冷脓肿”（寒性脓肿）。骨肉瘤、骨髓瘤为肿瘤无此表现，化脓性骨髓炎形成的是红肿热痛的急性脓肿。","《病理学》第9版·传染病·骨关节结核","green"],["2023N39A","子宫颈息肉的病变性质是",["良性肿瘤","癌前病变","原位癌","炎性病变"],"D","A","生物化学",2023,"real","生物化学|其他","炎性息肉","子宫颈息肉是慢性子宫颈炎时，宫颈黏膜上皮、腺体及间质局限性增生形成的息肉状突起，属炎症性病变（炎性息肉），并非真性肿瘤。它不属于癌前病变，更不是原位癌，活检见间质炎细胞浸润、腺体扩张，切除后很少复发，故答案为炎性病变。","《病理学》第9版·生殖系统疾病·慢性子宫颈炎","green"],["2023N40A","关于卵巢交界性浆液性囊腺瘤的叙述，正确的是",["由两个胚层组织构成","由两种不同的上皮组织构成","生物学行为介于良性与恶性之间","有上皮组织和间叶组织构成"],"C","A","生物化学",2023,"real","生物化学|其他","交界性肿瘤的概念","交界性肿瘤指组织形态和生物学行为介于良性与恶性之间、可发生局部复发但不发生转移（或极少转移）的肿瘤。卵巢交界性浆液性囊腺瘤即此类，上皮增生呈复层、有轻度异型但无间质浸润。由两个胚层或两种上皮构成者指畸胎瘤，间叶与上皮共同构成者指癌肉瘤。","《病理学》第9版·肿瘤·交界性肿瘤","green"],["2023N41A","下列疾病中，最可能性先出现意识障碍后发热的是",["流行性乙型脑炎","中暑","有机磷农药中毒","中毒性痢疾"],"C","A","生物化学",2023,"real","生物化学|其他","有机磷中毒的临床表现顺序","有机磷农药中毒时乙酰胆碱酯酶失活、乙酰胆碱在突触堆积，先出现毒蕈碱样和烟碱样症状，中枢神经先兴奋后抑制，意识障碍可较早出现，而发热一般不显著（可见瞳孔缩小、大汗、肌纤维颤动）。乙型脑炎、中毒性痢疾、中暑均以高热起病、意识障碍在后。","《内科学》第9版·中毒·有机磷杀虫药中毒","green"],["2023N42A","下列提示支气管哮喘重症急性发作的是",["呼吸频率>30次/分","日间哮喘症状>4次/周","双肺散在呼气相哮鸣音","PEF占预计值65%"],"A","A","内科学",2023,"real","内科学|呼吸系统疾病","哮喘急性发作严重度分级","哮喘重症急性发作的判断指标包括：不能平卧、只能单字讲话、呼吸>30次/分（A）、辅助呼吸肌活动及三凹征、心率>120次/分、哮鸣音减弱甚至消失（沉默肺）、PEF<50%预计值、PaO₂<60mmHg伴PaCO₂>45mmHg、意识改变。B属慢性控制水平评估；C散在哮鸣音为轻中度；D的PEF 65%属中度（50%～75%），故仅A符合。","《内科学》第9版·呼吸系统疾病·支气管哮喘","green"],["2023N43A","女性，40岁。低热、间断咯血2个月，每次3～4口，鲜红色，既往体健。查体：T37.8℃，双肺叩 诊清音，呼吸音清，未闻及干湿啰音。肺CT示：双上肺多发结节，内有空洞。最有助于确诊的检查结果 是",["PPD试验皮肤可见水疱","肺穿刺活检可见肉芽肿病变","痰涂片抗酸染色阳性","r-干扰素释放试验阳性"],"B","A","生物化学",2023,"real","生物化学|其他","肺结核的确诊依据","青年女性长期低热、间断咯血，CT示双上肺多发结节伴空洞，高度提示肺结核。确诊最有价值者为病原学证据：痰涂片抗酸染色（或痰培养、分子检测）阳性即可确诊。肺穿刺活检见肉芽肿虽支持结核，但肉芽肿性病变亦见于结节病、真菌感染等，特异性不及病原学。⚠️原答案给B（病理肉芽肿），与“病原学确诊”原则存在冲突，存疑；若按临床实践首选C（痰抗酸染色阳性）。","《内科学》第9版·肺结核·诊断","yellow"],["2023N44A","不适用于肺炎支原体肺炎治疗的抗生素是",["大环内酯类","喹诺酮类","四环素","β内酰胺类"],"D","A","内科学",2023,"real","内科学|呼吸系统疾病","支原体肺炎的抗菌选择","肺炎支原体无细胞壁，β内酰胺类（青霉素、头孢菌素）作用于细胞壁合成，对其完全无效，故不适用于治疗。大环内酯类（阿奇霉素、红霉素）为首选；喹诺酮类（左氧氟沙星、莫西沙星）与四环素类（多西环素）亦有效，为成人替代方案。","《内科学》第9版·呼吸系统疾病·肺炎支原体肺炎","green"],["2023N45A","男性，72岁，高血压及心动过缓25年，三个月来阵发心悸，当地医院诊断心房颤动。服用华法林治 疗，一周来出现多次黑曚，持续数秒可恢复。查体：P：42次/分，BP：135/80mmHg，心界不大，心律 不齐。动态心电图可见频发RR间期大于2.5秒。在继续使用华法林的基础上，应选择正确的治疗",["服用胺碘酮转复心率","植入DDD型起搏器","射频消融+β受体阻滞剂","射频消融加起搏器"],"B","A","内科学",2023,"real","内科学|循环系统疾病","慢快综合征的起搏治疗","老年患者房颤伴长RR间期（>2.5秒）反复黑矇，提示病态窦房结综合征/慢快综合征致脑供血不足，在继续华法林抗凝基础上应植入双腔（DDD）起搏器，既保证心率又允许房颤发作时安全用药或维持节律。胺碘酮复律可加重窦房结抑制；单用β受体拮抗剂加重心动过缓；射频消融不能解决窦房结功能障碍。","《内科学》第9版·循环系统疾病·病态窦房结综合征","green"],["2023N46A","男性，65岁。4小时前突发胸痛，持续不缓解，外院确诊“急性下壁、右室心肌梗死”，即转入院。查 体：BP82/55mmHg，神清，双肺(-)，心率54次/min，心率齐，心音低顿，四肢末梢皮温正常。此时应 首先采取的治疗措施是",["即刻静点硝酸甘油","静脉快速输液","静点多巴胺升血压","即刻置入临时起搏器"],"B","A","内科学",2023,"real","内科学|循环系统疾病","右室心梗的低血压处理","急性下壁合并右室心肌梗死时右心室充盈依赖前负荷，出现低血压（82/55mmHg）而四肢末梢温暖、双肺清晰，治疗首要措施是静脉快速补液扩容（可加用扩容剂），提高右室充盈压以维持心排血量。硝酸甘油扩张静脉降低前负荷，可致血压进一步骤降，属禁忌；多巴胺仅在扩容后仍低血压时用；心率54次/分且为下壁心梗常见窦性心动过缓，无长间歇不必即刻起搏。","《内科学》第9版·循环系统疾病·急性心肌梗死","green"],["2023N47A","可作为鉴别急性心肌炎与扩张型心肌病的检查是",["胸部X线片","血心肌损伤标志物","血BNP","超声心动图"],"D","A","内科学",2023,"real","内科学|循环系统疾病","急性心肌炎与扩心病鉴别","急性心肌炎的心腔扩大与心功能减低为可逆性，随炎症消退可明显缩小、LVEF恢复；扩张型心肌病的心腔扩大及弥漫室壁运动减弱持续存在且进行性加重，故超声心动图动态观察最有鉴别价值。X线胸片、BNP、心肌损伤标志物在两者均异常，特异性不足（心肌炎标志物升高更显著但敏感性有限）。","《内科学》第9版·循环系统疾病·心肌炎","green"],["2023N48A","24小时动态血压检查诊断高血压的标准值(白天和夜间的平均血压)是",["白天≥140/90mmHg和(或)夜间≥130/90mmHg","白天≥140/80mmHg和(或)夜间≥130/80mmHg","白天≥135/85mmHg和(或)夜间≥120/70mmHg","白天≥130/80mmHg和(或)夜间≥120/80mmHg"],"C","A","内科学",2023,"real","内科学|循环系统疾病","动态血压诊断标准","我国24小时动态血压诊断高血压的标准：白天平均≥135/85mmHg和（或）夜间平均≥120/70mmHg和（或）24小时平均≥130/80mmHg，故C正确。A、B、D的数值均高于现行指南界值，属诊室血压标准或误记。","《内科学》第9版·循环系统疾病·原发性高血压","green"],["2023N49A","女性，38岁。反复反酸烧心5年，平卧位 胸部CT","胸部超声","胸腔穿刺","胸部MRI"],"C","A","内科学",2023,"real","内科学|呼吸系统疾病","创伤性胸腔积液的确诊","胸部钝挫伤后呼吸困难、患侧呼吸音消失、胸片示大量胸腔积液，需鉴别血胸与气胸合并积液，胸腔穿刺抽出液体（血性或不凝）即可确诊并判断出血量，同时可行闭式引流，是最有价值的确诊手段。胸部CT、B超可显示积液量与性质但不能定性；MRI对急症无必要。","《外科学》第9版·胸部损伤·血胸","green"],["2023N62A","女性，40岁。发现颈部肿块伴疼痛3天就诊。查体：左颈前可触及直径3cm肿物，边界清，质韧， 光滑，可随吞咽移动，触痛(+)。最可能的诊断是。",["亚急性甲状腺炎","甲状舌管囊肿","甲状腺腺瘤囊内出血","甲状腺癌"],"C","A","病理学",2023,"real","病理学|内分泌系统疾病","甲状腺腺瘤囊内出血","中年女性，3天来突发颈前肿块并疼痛，肿物直径3cm、边界清、光滑、质韧、可随吞咽移动、有触痛，最符合甲状腺腺瘤囊内出血：原有腺瘤因出血而突然增大并出现胀痛、触痛，肿块影像学为边界清楚的结节。亚急性甲状腺炎多有上感史、发热、ESR增快和甲功异常，甲状腺多为弥漫性不对称肿大且疼痛可放射至耳后；甲状舌管囊肿位于颈前中线、随伸舌上移；甲状腺癌多为质硬、固定的无痛结节。","《外科学》第9版·甲状腺疾病·甲状腺腺瘤","green"],["2023N63A","关于腹股沟直疝，以下说法正确的是",["疝内容物在腹壁下动脉外侧突出","多见于青年男性","堵住深环后站立疝仍可突出","易嵌顿绞窄"],"C","A","外科学",2023,"real","外科学|普通外科","腹股沟直疝的特点","直疝经Hesselbach三角（腹壁下动脉内侧）突出，多见于老年男性，疝囊颈宽大、极少进入阴囊、不易嵌顿；因不经过内环，压迫深环后站立或咳嗽时疝块仍可突出。A描述的腹壁下动脉外侧是斜疝，B年龄特点错误（直疝见于老年），D与直疝不易嵌顿相反。故选C。","《外科学》第9版·普通外科·腹股沟疝","green"],["2023N64A","男性，90岁，右上腹痛5天就诊，既往有心肌梗死、脑出血病史。查体T38°C右上腹压痛明显，腹 部B超提示胆囊10cm×5cm，壁厚0.5cm，腔内可见多发结石，直径最大1.5cm，胆总管直径0.6cm。 化验血：WBC15X109/L最适宜的治疗方案是",["急诊胆囊切除术","急诊胆囊切除加胆总管引流术","急诊经皮经肝胆囊穿刺引流术","急诊开腹胆囊造瘘术"],"C","A","内科学",2023,"real","内科学|循环系统疾病","高危患者胆囊炎的PTGBD","90岁高龄、合并心梗与脑出血病史、手术风险极高，急性结石性胆囊炎（胆囊壁0.5cm、胆囊肿大、白细胞升高）最适宜的是超声引导下经皮经肝胆囊穿刺引流（PTGBD），创伤小、可迅速减压控制感染，待病情稳定后再择期处理。急诊胆囊切除、胆囊造瘘在超高龄高危患者手术死亡率高。","《外科学》第9版·胆道疾病·急性胆囊炎","green"],["2023N65A","骨盆骨折合并尿道损伤和失血性休克患者，正确的处理顺序是",["骨盆骨折-尿道损伤-休克","尿道损伤-休克-骨盆骨折","休克-骨盆骨折-尿道损伤","休克-尿道损伤-骨盆骨折"],"D","A","外科学",2023,"real","外科学|骨科","骨盆骨折合并尿道损伤的处理顺序","多发伤处理遵循先救命后治伤：失血性休克直接威胁生命，应首先快速补液输血抗休克，并优先控制骨盆骨折引起的出血；休克初步稳定后再处理尿道损伤（试插导尿，失败则行耻骨上膀胱造瘘或尿道会师），骨盆骨折的确定性固定放在最后。故正确顺序是休克—尿道损伤—骨盆骨折。故选D。","《外科学》第9版·骨科·骨盆骨折","green"],["2023N66A","肩关节脱位中发生率最高的是",["后脱位","上脱位","前脱位","下脱位"],"C","A","外科学",2023,"real","外科学|骨科","肩关节前脱位","肩关节盂浅而小、关节囊与韧带松弛、活动范围最大，故脱位发生率居各大关节之首，其中绝大多数为前脱位（喙突下型、盂下型），多因外展外旋位跌倒手掌撑地、间接暴力传导所致；后脱位少见，常继发于癫痫发作或电击伤，上脱位、下脱位（直举型）罕见。故选C。","《外科学》第9版·骨科·肩关节脱位","green"],["2023N67A","骨筋膜室综合症最早期的临床表现是",["患肢皮肤发黑","患肢肌力减退","患肢手指或足趾呈屈曲状态","患肢持续性剧烈疼痛"],"D","A","外科学",2023,"real","外科学|其他","骨筋膜室综合征的早期表现","骨筋膜室内压升高使微循环灌注减少、组织缺血，最早和最重要的表现是进行性加剧的剧烈疼痛及被动牵拉痛，常规镇痛常无效。随后出现患区肿胀、张力性水疱、感觉异常；肌力减退、手指或足趾呈屈曲状态、皮肤发绀发黑属较晚的缺血性肌挛缩与坏死表现。故最早出现的是持续性剧烈疼痛，选D。","《外科学》第9版·骨科·骨筋膜室综合征","green"],["2023N68A","患者最可能的诊断是?",["右下肺炎","右侧胸膜肥厚","肺栓塞","右侧胸腔积液"],"D","A","病理学",2023,"real","病理学|局部血液循环障碍","胸腔积液的临床与影像特点","本题为共用题干题，题干缺失，从后一小题（首选胸部超声以尽快缓解症状）可推断患者为大量胸腔积液。胸腔积液查体见患侧胸廓饱满、呼吸动度减弱、气管向健侧移位、叩诊浊音、呼吸音及语音震颤减弱或消失，X线示外高内低弧形影。肺炎有发热及湿啰音、叩诊多为浊音但无液平；胸膜肥厚为肋间隙变窄、胸廓塌陷；肺栓塞需CTPA确诊。","《病理学》第9版·局部血液循环障碍·胸腔积液","yellow"],["2023N69A","为尽快缓解患者症状，制定下一步诊治方案，应首选的检查是",["胸部超声","心电图","胸部CT","CTPA"],"A","A","病理学",2023,"real","病理学|其他","胸腔积液的首选处理检查","共用题干缺失，患者为大量胸腔积液并需尽快缓解呼吸困难症状、同时明确性质。胸部超声能敏感发现少量积液、准确定位液平面并实时引导胸腔穿刺抽液，一次操作既迅速减轻压迫症状又获得胸水标本送检，故为首选。心电图无诊断价值；胸部CT虽信息丰富但耗时且不能即时缓解；CTPA用于排除肺栓塞。故选A。","《外科学》第9版·胸腔积液·超声引导穿刺","yellow"],["2023N70A","该患者应首先考虑的诊断是：",["肝硬化并发自发性细菌性腹膜炎","肝硬化并发门静脉血栓","肝硬化并发结核性腹膜炎","肝硬化并发肝癌"],"A","A","病理学",2023,"real","病理学|消化系统疾病","肝硬化合并SBP的诊断","本题为肝硬化患者的共用题干题，题干缺失，答案为肝硬化并发自发性细菌性腹膜炎（SBP）。其特点是在无腹腔内可手术感染源的情况下出现发热、腹痛、腹水迅速增多并伴全腹压痛及反跳痛，腹水多形核中性粒细胞≥250×10⁶/L即可诊断。门静脉血栓表现为腹水骤增、腹痛但腹水白细胞不高；结核性腹膜炎起病缓、ADA升高；肝癌有AFP升高及肝占位。","《内科学》第9版·消化系统疾病·自发性细菌性腹膜炎","yellow"],["2023N71A","该患者行腹腔穿刺检查腹腔积液的最佳适应症是",["T37.5℃，巩膜黄染，肝功能异常","T37.5℃，全腹压痛及反跳痛，移动性浊音(+)","巩膜黄染，肝脾触诊不满意","肝炎病史，上胸蜘蛛痣，巩膜黄染"],"B","A","病理学",2023,"real","病理学|消化系统疾病","诊断性腹腔穿刺的指征","共用题干缺失，患者在肝硬化基础上需行腹腔穿刺。诊断性腹腔穿刺的指征是新出现或加重的腹水、伴发热、腹痛或腹膜刺激征、不明原因的低血压或肝性脑病等。B项温度37.5℃、全腹压痛及反跳痛、移动性浊音阳性提示腹腔感染，是穿刺引流并送检的最佳适应证，故选B。仅有黄疸、肝功能异常或肝病史而无腹膜刺激征者，穿刺的诊断价值有限。","《内科学》第9版·消化系统疾病·自发性细菌性腹膜炎","yellow"],["2023N72A","下列支持该患者诊断的腹水检查结果是",["外观透明浅黄，比重1.012，蛋白定量15g/L","外观微混，白细胞数600x106/L，单核98%，蛋白定量35g/L","外观混浊，白细胞数900×10⁶/L，多核60%，蛋白定量45g/L","外观浑浊，比重1.015，蛋白定量25g/L，158U/L"],"C","A","病理学",2023,"real","病理学|其他","SBP腹水常规特点","共用题干缺失，患者诊断为肝硬化合并SBP，故腹水应呈感染性渗出液改变：C项外观混浊、白细胞900×10⁶/L（其中多核中性粒细胞60%，即PMN约540×10⁶/L，≥250诊断标准）、蛋白定量45g/L，符合SBP。A为典型漏出液（透明浅黄、蛋白15g/L、比重低），不符合；B白细胞600但单核98%、蛋白35g/L，提示结核性腹膜炎；D蛋白25g/L且未提示中性粒细胞比例，倾向漏出液。","《内科学》第9版·消化系统疾病·腹水检查","yellow"],["2023N73A","导致患者二氧化碳分压升高最不可能的原因是",["肺泡通气量下降","无效腔通气量增加","内源性PEEP","弥散障碍"],"C","A","病理学",2023,"real","病理学|其他","PaCO2升高的机制","PaCO2升高反映肺泡有效通气量下降。A肺泡通气量下降、B无效腔通气量增加、C内源性PEEP（肺过度充气使呼气末肺泡内压升高，进一步减少有效通气）均可致CO2蓄积。D弥散障碍主要引起低氧血症：CO2弥散能力约为O2的20倍，且血气中CO2分压差小，故单纯弥散障碍几乎不引起PaCO2升高，属最不可能的原因。⚠️原答案存疑，本题按教材应选D而非C。","《病理生理学》第9版·呼吸功能不全·血气指标变化","yellow"],["2023N74A","引起该患者病情加重最不可能的病原体是",["流感嗜血杆菌","肺炎链球菌","肺 炎 支 原 体","铜 绿 假 单 胞 菌 答 案 ： D 解 析 ： A B C 为 社 区 获 得 性 常 见 病 原 体 ， D 为 医 院 获 得 性 7"],"D","A","内科学",2023,"real","内科学|呼吸系统疾病","COPD急性加重的病原学","该患者COPD急性加重（社区获得性），引起病情加重最不可能的病原体是铜绿假单胞菌（D）：它主要见于医院获得性肺炎、结构性肺病（支气管扩张）、长期使用激素或反复住院者，属多重耐药高危菌。流感嗜血杆菌、肺炎链球菌、肺炎支原体均为社区获得性感染的常见病原。","《内科学》第9版·呼吸系统疾病·慢性阻塞性肺疾病","green"],["2023N79A","最可能的诊断是?",["右侧结肠癌","肠结核","克罗恩病","肠淋巴瘤"],"B","A","内科学",2023,"real","内科学|消化系统疾病","肠结核的诊断","青年患者长期低热盗汗、右下腹痛、腹泻与便秘交替、右下腹包块，伴血沉增快与PPD阳性，为肠结核。右侧结肠癌多见于中老年、以贫血消瘦、便血为主；克罗恩病有瘘管、裂隙状溃疡与节段性病变；肠淋巴瘤以肿块、消瘦为主而结核中毒症状轻。","《内科学》第9版·消化系统疾病·肠结核","green"],["2023N80A","为明确诊断，最有意义的辅助检查是?",["粪常规+粪隐血","腹部B超","结肠镜","X线钡剂灌肠"],"C","A","内科学",2023,"real","内科学|其他","肠结核的结肠镜诊断","结肠镜加活组织检查是确定肠结核诊断最有意义的检查：可见回盲部溃疡（环形溃疡、边缘鼠咬状）、黏膜充血水肿或增生性肿块，活检见干酪样肉芽肿或抗酸杆菌可确诊。粪常规加隐血、腹部B超非特异；钡剂灌肠已逐步被结肠镜取代。","《内科学》第9版·消化系统疾病·肠结核","green"],["2023N81A","首选治疗应该是",["抗结核治疗","手术治疗","全身肿瘤联合化疗","应用柳氮磺吡啶"],"A","A","内科学",2023,"real","内科学|其他","肠结核的抗结核治疗","确诊肠结核后首选规范抗结核治疗，方案为异烟肼、利福平、吡嗪酰胺、乙胺丁醇联合，疗程6～9个月（重症或并发症者延长），多数可治愈。手术仅用于完全性肠梗阻、急性穿孔、大出血或诊断困难者；化疗、柳氮磺吡啶分别为肿瘤和IBD治疗。","《内科学》第9版·消化系统疾病·肠结核","green"],["2023N82A","下一步首选的辅助检查是",["心电图","血常规","尿本周蛋白","尿相差显微镜检查"],"D","A","内科学",2023,"real","内科学|其他","尿相差显微镜与肾小球性血尿","血尿患者需先区分肾小球源性（变形红细胞、棘形红细胞）与非肾小球源性（均一形态），故下一步首选尿相差显微镜检查红细胞形态，同时观察有无红细胞管型。心电图、血常规无助于定位；尿本周蛋白用于多发性骨髓瘤筛查，非首选。","《内科学》第9版·泌尿系统疾病·血尿的鉴别","green"],["2023N83A","该患者肾脏病理检查最可能的病理类型是",["系膜毛细血管性肾小球肾炎","系膜增生性肾小球肾炎","毛细血管内增生性肾小球肾炎","新月体性肾小球肾炎"],"C","A","内科学",2023,"real","内科学|泌尿系统疾病","急性肾炎的病理类型","链球菌感染后1～3周出现血尿、蛋白尿、水肿、高血压及补体C3一过性降低，最可能的病理类型是毛细血管内增生性肾小球肾炎（弥漫性内皮及系膜细胞增生、中性粒细胞浸润、上皮下驼峰状沉积）。系膜毛细血管性肾炎补体持续降低、病程迁延；新月体性肾炎肾功能急剧恶化；系膜增生性多见于IgA肾病。","《病理学》第9版·泌尿系统疾病·急性弥漫性增生性肾小球肾炎","green"],["2023N84A","该患者血压增高最可能的原因",["原发性高血压","水钠潴留","肾动脉狭窄","血醛固酮升高"],"B","A","内科学",2023,"real","内科学|循环系统疾病","急性肾炎高血压的机制","急性肾小球肾炎时血压升高主要因肾小球滤过率下降致水钠潴留、血容量扩张，而非RAAS或肾动脉狭窄，故降压以利尿、限盐为主。原发性高血压无前驱感染与血尿；肾动脉狭窄有腹部血管杂音、ACEI后肌酐升高；原醛伴低血钾与醛固酮升高。","《内科学》第9版·泌尿系统疾病·急性肾小球肾炎","green"],["2023N85A","最可能的贫血诊断是",["缺铁性贫血","巨幼细胞贫血","再生障碍性贫血","溶血性贫血"],"D","A","内科学",2023,"real","内科学|血液系统疾病","溶血性贫血的诊断","贫血伴黄疸、脾大、网织红细胞明显升高、间接胆红素升高、结合珠蛋白降低及Coombs试验阳性，为溶血性贫血（自身免疫性）。缺铁性贫血为小细胞低色素、网织不高；巨幼细胞贫血为大细胞性；再生障碍性贫血呈全血细胞减少、网织红细胞显著降低、无黄疸脾大。","《内科学》第9版·血液系统疾病·溶血性贫血","green"],["2023N86A","下列选项中最有意义的检查是",["红细胞沉降率","白细胞分类","网织红细胞计数","粪便常规加隐血"],"C","A","内科学",2023,"real","内科学|其他","网织红细胞计数的意义","网织红细胞计数是判断骨髓红系造血功能最简便可靠的指标：溶血时骨髓代偿性增生，网织红细胞显著升高（常>5%），可与其他贫血鉴别并与溶血程度平行。血沉、白细胞分类无特异性；粪常规加隐血用于寻找失血病因。","《内科学》第9版·血液系统疾病·溶血性贫血","green"],["2023N87A","骨髓细胞学检查中，幼红细胞最有可能出现的异常是",["巨幼样变","核老浆幼","显著减少","明显增生"],"D","A","生理学",2023,"real","生理学|血液","骨髓红系增生与粒红比例","骨髓细胞学以红系增生为主、幼红细胞明显增多，常见于溶血性贫血等红系代偿性增生状态，此时粒红比例下降甚至倒置，故D正确。巨幼样变见于叶酸/维生素B12缺乏（巨幼细胞贫血）；核老浆幼提示血红蛋白合成障碍（缺铁性贫血）；显著减少见于纯红细胞再生障碍，均需与题干所给条件相符方能成立。⚠️题干信息不完整，仅就所给答案对应的知识点作答。","《内科学》第9版·血液系统疾病·贫血的骨髓象特点","yellow"],["2023N88A","该患者糖尿病微血管并发症诊断是",["糖尿病视网膜改变3期，糖尿病自主神经病变","糖尿病视网膜改变3期，糖尿病周围神经病变","糖尿病视网膜改变4期，糖尿病自主神经病变","糖尿病视网膜改变4期，糖尿病周围神经病变"],"C","A","内科学",2023,"real","内科学|内分泌与代谢","糖尿病视网膜病变分期","糖尿病视网膜病变分期中，出现新生血管、玻璃体积血或纤维增殖属增殖期（Ⅳ～Ⅵ期），Ⅳ期为新生血管形成，属微血管并发症；同时伴体位性低血压、胃轻瘫、排尿障碍或出汗异常者为自主神经病变。故诊断为视网膜4期加自主神经病变。","《内科学》第9版·内分泌与代谢疾病·糖尿病慢性并发症","green"],["2023N89A","该患者首选的降压药物是",["利尿剂","钙离子通道拮抗剂","β受体拮抗剂","血管紧张素转化酶抑制剂"],"D","A","内科学",2023,"real","内科学|其他","糖尿病肾病降压药选择","糖尿病合并高血压且伴蛋白尿（或肾功能受损）者，首选ACEI（或ARB）：可降低肾小球内压、减少尿蛋白、延缓肾病进展，并对糖脂代谢无不良影响。利尿剂与β受体拮抗剂对糖脂代谢不利；CCB虽可用但降尿蛋白作用弱于ACEI。","《内科学》第9版·内分泌与代谢疾病·糖尿病","green"],["2023N90A","为改善血糖控制，最合适的治疗方案是",["在原胰岛素治疗方案基础上，加用二甲双胍0.5g，每日3次","改用每日一次中长效基础胰岛素联合3次餐时胰岛素","改用每日一次中长效基础胰岛素联合3种口服降糖药","单用基础胰岛素"],"B","A","内科学",2023,"real","内科学|其他","2型糖尿病的胰岛素强化治疗","血糖控制不佳（HbA1c不达标）且已出现并发症者，宜改用强化胰岛素方案：每日一次中长效基础胰岛素联合3次餐时短效胰岛素（基础-餐时方案），最接近生理分泌、降糖效果最好且低血糖风险可控。加口服药难以达标；基础加3种口服药不优于基础-餐时；单用基础胰岛素控制餐后血糖不足。","《内科学》第9版·内分泌与代谢疾病·糖尿病","green"],["2023N91A","最可能的诊断是",["系统性红斑狼疮","赖特(Reiter‘s)综合征","克罗恩病","贝赫切特(Behcet)病"],"D","A","内科学",2023,"real","内科学|消化系统疾病","贝赫切特病的诊断","反复口腔溃疡、外阴溃疡、眼色素膜炎及针刺反应阳性、皮肤结节性红斑样病变为贝赫切特病。系统性红斑狼疮有蝶形红斑与自身抗体；赖特综合征（反应性关节炎）以关节炎、尿道炎、结膜炎三联征及肠道感染前驱史为特点；克罗恩病以腹痛、腹泻、瘘管为主。","《内科学》第9版·风湿性疾病·贝赫切特病","green"],["2023N92A","该病较常见的其他临床表现是",["尿道灼烧感","盘状红斑","结节性红斑","心脏扩大"],"C","A","内科学",2023,"real","内科学|其他","贝赫切特病的皮肤表现","贝赫切特病皮肤损害以结节性红斑（下肢伸侧、触痛、可自愈）和假性毛囊炎、痤疮样皮疹最常见。盘状红斑见于SLE；尿道灼烧感为赖特综合征的表现之一；心脏扩大见于心肌炎、扩心病，非本病常见表现。","《内科学》第9版·风湿性疾病·贝赫切特病","green"],["2023N93A","最可能的诊断的是",["急性胆囊炎","急性胃肠炎","急性胰腺炎","急性胆管炎"],"D","A","内科学",2023,"real","内科学|消化系统疾病","急性胆管炎的诊断","腹痛、寒战高热、黄疸并白细胞升高（Charcot三联征），为急性胆管炎；若合并休克与意识障碍则为Reynolds五联征。急性胆囊炎黄疸少见、Murphy征阳性；急性胰腺炎以向腰背放射痛和淀粉酶升高为主；急性胃肠炎有明显腹泻、无黄疸。","《外科学》第9版·胆道疾病·急性胆管炎","green"],["2023N94A","为明确诊断，首选的检查是",["ERCP","腹部平片","MRCP","PTC"],"C","A","内科学",2023,"real","内科学|其他","MRCP首选诊断胆道梗阻","明确胆管梗阻病因首选MRCP：无创、不接触射线，可显示胆管结石、狭窄与扩张全貌。ERCP与PTC为有创且用于治疗转换；腹部平片对阳性结石显示率仅10%～15%，不能满足诊断需要。","《外科学》第9版·胆道疾病·胆道影像学","green"],["2023N95A","最合适的治疗方法是",["非手术治疗","胆管切除","经内镜鼻胆管引流术","胆总管切开取结石"],"C","A","内科学",2023,"real","内科学|其他","急性胆管炎的ENBD引流","急性重症胆管炎合并多器官功能受累者，最合适的引流方式是经内镜鼻胆管引流（ENBD）或经内镜胆道支架引流，创伤小、可迅速减压并控制感染，为急诊首选。胆管切除创伤大不宜急症；非手术保守无效；胆总管切开取石可在ENBD失败或病情稳定后施行。","《外科学》第9版·胆道疾病·急性重症胆管炎","green"],["2023N96A","最可能的诊断是",["急性胰腺炎","急性胆管炎","急性阑尾炎","急性胃炎"],"A","A","内科学",2023,"real","内科学|消化系统疾病","急性胰腺炎的诊断","上腹持续剧痛向腰背放射、弯腰抱膝可减轻、呕吐不缓解、血淀粉酶与脂肪酶显著升高，为急性胰腺炎。急性胆管炎有Charcot三联征；急性阑尾炎为转移性右下腹痛及麦氏点压痛；急性胃炎多为进食刺激物后中上腹不适。","《内科学》第9版·消化系统疾病·急性胰腺炎","green"],["2023N97A","最可能的诊断是",["急性胰腺炎","急性胆管炎","急性阑尾炎","急性胃炎"],"A","A","内科学",2023,"real","内科学|消化系统疾病","急性胰腺炎的诊断","同一组病例题，按病史与腹部体征（上腹部持续剧痛、腹胀、淀粉酶升高、影像见胰腺弥漫肿大伴渗出）判断仍为急性胰腺炎。⚠️本题所录题干与上一题（2023N96A）完全相同、选项与答案亦重复，疑为OCR合并导致共享病例题干丢失，故按题干真实知识点给出结论并按存疑标注。","《内科学》第9版·消化系统疾病·急性胰腺炎","yellow"],["2023N99A","目前不宜采取的治疗方法",["胃肠减压","灌肠通便","手术治疗","温盐水洗胃"],"B","A","内科学",2023,"real","内科学|其他","幽门梗阻的术前准备","该患者为幽门梗阻（瘢痕性或炎症水肿性）：应予胃肠减压、温盐水洗胃（减轻胃黏膜水肿、利于术后愈合）、纠正低氯低钾性碱中毒与营养不良，若为瘢痕性梗阻需择期手术，故不宜采取的是灌肠通便——梗阻位于幽门，通便不能解除梗阻且低位灌肠无治疗意义。","《外科学》第9版·胃十二指肠疾病·幽门梗阻","green"],["2023N100A","为明确诊断，进一步检查选择",["超声内镜","ERCP","MRCP","PTC"],"C","A","内科学",2023,"real","内科学|其他","胆管囊肿的MRCP诊断","疑胆总管囊样扩张（先天性胆管囊肿）时，进一步检查首选MRCP：可无创显示肝内外胆管扩张的部位、范围与形态，明确Todani分型并排除结石与肿瘤，为手术方案提供依据。ERCP、PTC有创且并发症风险高；超声内镜对胆总管下段观察有限。","《外科学》第9版·胆道疾病·先天性胆管囊肿","green"],["2023N101A","检查显示胆总管全长呈囊样扩张，其分型为：",["Ⅰ型","Ⅱ型","Ⅲ型","Ⅳ型"],"A","A","内科学",2023,"real","内科学|其他","Todani分型","先天性胆管囊肿Todani分型：Ⅰ型为胆总管囊状或梭状扩张（最常见，占80%～90%）；Ⅱ型为胆总管憩室；Ⅲ型为胆总管末端膨出（胆总管囊肿）；Ⅳ型为肝内外胆管多发扩张；Ⅴ型为肝内胆管扩张（Caroli病）。题干“胆总管全长囊样扩张”为Ⅰ型。","《外科学》第9版·胆道疾病·先天性胆管囊肿","green"],["2023N102A","最适宜的治疗方式是",["囊肿-十二指肠吻合术","囊肿切除，胆肠Roux-en-Y吻合术","囊肿-空肠吻合术","囊肿切除，肝管-十二指肠吻合术"],"B","A","内科学",2023,"real","内科学|其他","胆管囊肿的手术原则","先天性胆管囊肿有较高癌变率（随年龄增长可达10%以上），治疗原则是完整切除囊肿加胆肠Roux-en-Y吻合重建胆道，既去除癌变基础又防止反流。内引流（囊肿-十二指肠、囊肿-空肠吻合）保留囊肿壁，癌变风险高，已不推荐；肝管-十二指肠吻合易致反流性胆管炎。","《外科学》第9版·胆道疾病·先天性胆管囊肿","green"],["2023N103A","下列选项中，最有诊断价值的是",["右颈肩部疼痛","颈部活动受限","右手麻木","Eaton试验(+)"],"D","A","内科学",2023,"real","内科学|其他","Eaton试验的意义","颈肩痛伴右手麻木、颈部活动受限及上肢放射痛，需鉴别神经根型颈椎病与胸廓出口综合征，最有诊断价值的是Eaton试验（臂丛牵拉试验）阳性，提示胸廓出口综合征；若Spurling（椎间孔挤压）试验阳性则支持神经根型颈椎病。疼痛部位、活动受限、手麻木为主观非特异症状。","《外科学》第9版·周围神经卡压综合征·胸廓出口综合征","green"],["2023N105A","该患者MRI检查显示椎间盘突出，脊髓与神经根受压。目前不推荐的治疗是",["颈椎牵引","颈部按摩和推拿","手术治疗","应用非甾体抗炎药"],"B","A","内科学",2023,"real","内科学|其他","颈椎病禁用推拿按摩","MRI示椎间盘突出并脊髓、神经根受压者，不宜行颈部按摩和推拿：暴力手法可加重椎间盘突出、致脊髓损伤甚至瘫痪。颈椎牵引、非甾体抗炎药为保守治疗常用方法；出现脊髓受压表现或保守无效时应手术减压。","《外科学》第9版·颈肩腰腿痛·颈椎病","green"],["2023N106A","如伴神经损伤，临床上除骨折体征外，还可出现的体征",["伸腕功能正常，伸指功能丧失","伸腕、伸指功能均丧失","屈腕、屈指功能均丧失","屈指、伸指功能均丧失"],"B","A","外科学",2023,"real","外科学|骨科","桡神经损伤的体征","肱骨干中段骨折易伤及紧贴骨面的桡神经。桡神经支配上肢全部伸肌，损伤后表现为垂腕：伸腕、伸指功能均丧失，第一、二掌骨背侧虎口区感觉减退，而屈腕屈指由正中神经与尺神经支配多保留。故查体可见伸腕、伸指功能同时丧失，选B；A为部分损伤表现，C、D与桡神经支配不符。","《外科学》第9版·骨科·肱骨干骨折合并桡神经损伤","green"],["2023N107A","如出现神经损伤的体征，目前最正确的治疗是",["牵引复位，石膏固定","手法复位，外固定板固定","切开复位，神经探查，接骨板固定","切开复位，髓内钉固定"],"C","A","内科学",2023,"real","内科学|其他","骨折合并神经损伤的手术原则","骨折合并神经损伤（如肱骨中下段骨折伴桡神经损伤、出现腕下垂与虎口区感觉障碍）时，应行切开复位、神经探查并接骨板内固定，既稳定骨折又明确神经损伤性质（压迫、挫伤或断裂）以便处理。手法复位外固定、石膏固定无法处理神经损伤，髓内钉固定不便于神经探查。","《外科学》第9版·上肢骨骨折·骨折合并神经损伤","green"],["2023N108A","医学专业是对公共所期待的责任有公共承诺的医学共同体，下列选项叙述不正确的是",["医学专业不需要经过系统的训练","医学专业要求专业上共同体自律","医学专业通过强制实施行业标准获得社会信任","医学专业通过严格的准入制度以保证专业诚信"],"A","A","内科学",2023,"real","内科学|其他","医学专业的系统训练要求","医学专业必须经过系统的院校教育与规范化培训、要求专业共同体自律、通过强制实施行业标准与严格准入制度获得社会信任，故B、C、D均正确。不正确的表述是“不需要经过系统的训练”——医学知识与技能高度复杂，长期系统训练是其专业性的基础。","《医学伦理学》·医学专业精神·专业的特征","green"],["2023N109A","下列叙述中，不属于医患关系中患者义务的是",["患者负有保证就医诚实性的义务","患者负有同意治疗后遵医的义务","传染病患者有防止疾病进一步扩散的义务","患者负有遵循即使不必要的治疗的义务"],"D","A","人文",2023,"real","人文|医患沟通","患者义务的边界","患者的义务包括如实提供病情与既往史、遵从医嘱配合治疗、遵守医院规章制度、尊重医务人员、按规定支付费用，传染病患者还负有防止疾病扩散的义务。对不必要的检查和治疗，患者有权知情并拒绝，而非必须遵从，故D不属于患者义务。A、B、C均为法定义务或伦理义务。故选D。","《医学伦理学》第9版·医疗人际关系伦理·患者的义务","green"],["2023N110A","由于医患之间存在事实上的医学知识拥有的不平等，使患者处于脆弱并依赖医生的地位，相信医生在 专业上是胜任的，会将患者的健康利益置于首位。这样的医患关系是",["消费关系","信托关系","依附关系","帮扶关系"],"B","A","人文",2023,"real","人文|医患沟通","医患信托关系","医学知识高度专业、信息严重不对称，使患者处于脆弱和依赖地位，相信医生在专业上胜任并会把患者健康利益置于首位，这种基于信任的委托—受托关系即信托关系。消费关系强调等价交换，依附关系、帮扶关系均未表达受托与信赖的内涵，也不符合医患双方人格平等的定位。故选B。","《医学伦理学》第9版·医疗人际关系伦理·医患关系的性质","green"],["2023N111A","男性，35岁。因桡骨骨折行钢板内固定术，术后三个月钢板断裂，患者要求医院赔偿。院方不恰当的 处理是",["倾听患者抱怨，进行解释安抚","详细了解钢板断裂的相关情况","明确责任，给出解决方案","告知属于钢板质量问题，医院不负责处理"],"D","A","外科学",2023,"real","外科学|骨科","医疗器械相关纠纷的应对","内固定钢板断裂可能涉及内固定物质量、术后过早负重、骨不连、患者依从性等多种原因。院方应倾听诉求、安抚解释，封存并送检内固定物、调阅病历、组织病例讨论明确责任，再依鉴定结论协商或依法处理。未查明原因就把责任推给钢板质量并拒绝处理，属推卸责任、激化矛盾的不当做法。故选D。","《医学伦理学》第9版·医疗人际关系伦理·医患沟通与医患纠纷处理","green"],["2023N112A","为患者保守秘密是重要的临床伦理原则，对患者医疗信息加以保护是医生的义务。下列医生的行为可 以得到伦理学辩护的是",["应保险公司要求向其提供可识别患者的任何医疗信息","应公司经理要求向其提供有关患者医疗过程的信息","应媒体要求向其提供有关患者医疗费用支付的信息","应同事要求向其提供已授权的匿名化医学研究信息"],"D","A","人文",2023,"real","人文|医学伦理","匿名化信息的使用","经患者授权、并做匿名化处理而无法识别到个人的医学研究信息，可在授权范围内使用，属保密的合理例外，可获伦理辩护。而应保险公司、公司经理、媒体要求提供可识别患者的病情、诊疗过程或费用信息，既无法律依据也未经同意，超出必要限度，侵犯隐私并可能造成歧视。故选D。","《医学伦理学》第9版·临床诊疗伦理·保密义务及其例外","green"],["2023N113A","关于获取手术知情同意的伦理要求，下列说法不正确的是",["知情同意的伦理要求体现了尊重患者自主性原则","知情同意仅是获得患者对治疗同意的签字文件","知情同意书中应阐明手术预期受益与可能的风险","知情同意应当是一个医患之间坦诚交流的过程"],"B","A","人文",2023,"real","人文|医学伦理","知情同意与签字的关系","知情同意是尊重患者自主权的体现，其核心是医患之间就病情、术式、预期受益、风险与替代方案坦诚交流后由患者自主决定，并签署书面文件。同意书只是同意的书面证明，签字不等于知情，也不能免除医生的说明义务，故B错误。A、C、D表述均正确。","《医学伦理学》第9版·临床诊疗伦理·知情同意","green"],["2023N114A","根据临床实验的伦理学原则，以下叙述正确的是",["实验设计应该使受试者和社会均受益","实验设计应该使受试者直接受益","临床试验设计收益风险比应该合理","受试者提出理由才允许其退出试验"],"C","A","人文",2023,"real","人文|医学伦理","风险收益比的合理性","临床试验的伦理要求是风险最小化与风险收益比合理：研究设计须使受试者承担的风险相对于预期收益（对受试者或社会）是合理的，并具备科学性与知情同意、伦理审查、可随时退出等保障。A、B把受试者或社会受益当作设计必须达到的目标，D限制受试者无理由退出的自由，均错误。故选C。","《医学伦理学》第9版·医学科研伦理·临床试验的伦理原则","green"],["2023N115A","女性，23岁。妊娠7周，到某诊所要求做人工流产手术，诊所聘用人员王某为其进行了手术，术中 患者出现大出血导致死亡。经查，王某为非医师行医。按照我国《医师法》相关规定，对其应适用",["教育","赔礼道歉","警告","依法追究刑事责任"],"D","A","人文",2023,"real","人文|卫生法规","非医师行医的刑事责任","未取得医师资格而行医即非法行医，造成就诊人死亡已超出教育、警告等行政处理的范畴，应依非法行医罪追究刑事责任，同时承担民事赔偿；诊所聘用非卫生技术人员从事诊疗活动亦应依法查处。赔礼道歉、警告与本案后果的严重程度不相称。故选D。","《中华人民共和国医师法》·法律责任","green"],["2023N116B","主要影响舒张压升高的因素是",["外周阻力增加","心输出量增加","主动脉和大动脉硬化","循环血量增加"],"A","B","外科学",2023,"real","外科学|其他","外周阻力与舒张压","舒张压主要反映外周阻力。外周阻力增大时舒张期血液流向外周的速度减慢，心舒期末主动脉内存留血量增多，舒张压升高更明显，脉压减小；心输出量增加主要使收缩压升高；循环血量增加使收缩压与舒张压均升高；主动脉和大动脉硬化使收缩压升高、舒张压降低、脉压增大。故选A。","《生理学》第9版·血液循环·动脉血压的影响因素","green"],["2023N117B","导致脉压增加的因素是",["外周阻力增加","心输出量增加","主动脉和大动脉硬化","循环血量增加"],"C","B","外科学",2023,"real","外科学|其他","大动脉弹性与脉压","脉压等于收缩压减舒张压。主动脉和大动脉硬化后弹性贮器作用减弱，收缩期不能有效扩张缓冲，收缩压升高；舒张期弹性回缩力减弱，舒张压降低，故脉压明显增大，是老年单纯收缩期高血压的主要机制。外周阻力增加主要升高舒张压而使脉压减小，心输出量与血量增加对脉压影响较小。故选C。","《生理学》第9版·血液循环·动脉血压的影响因素","green"],["2023N118B","能使血钙升高，血磷下降的活性物质",["甲状旁腺激素","1，25-(OH)₂D₃","甲状腺激素","生长激素"],"A","B","外科学",2023,"real","外科学|普通外科","甲状旁腺激素对钙磷的调节","甲状旁腺激素作用于骨、肾和小肠：促进破骨细胞活动动员骨钙入血，促进远端小管重吸收钙、抑制近端小管重吸收磷使尿磷排出增多，并激活1α-羟化酶间接促进活性维生素D生成，综合效应为血钙升高、血磷下降。故选A。1,25-二羟维生素D3使钙磷均升高，甲状腺激素与生长激素不以此为主要调节作用。","《生理学》第9版·内分泌·甲状旁腺激素的作用","green"],["2023N119B","能使血钙血磷都升高的活性物质",["甲状旁腺激素","1，25-(OH)₂D₃","甲状腺激素","生长激素"],"B","B","外科学",2023,"real","外科学|普通外科","活性维生素D与钙磷代谢","1,25-二羟维生素D3与小肠黏膜细胞受体结合，促进钙结合蛋白合成，使钙、磷吸收同时增加，并促进肾小管重吸收钙磷及骨钙动员，故血钙、血磷均升高。甲状旁腺激素为升钙降磷，与本问不符；甲状腺激素、生长激素不主要调节钙磷代谢。故选B。","《生理学》第9版·内分泌·1,25-二羟维生素D3的作用","green"],["2023N120B","糖异生的重要中间产物",["磷酸葡萄糖酸","果糖-6-磷酸","磷酸戊糖","尿苷二磷酸葡萄糖"],"B","B","生物化学",2023,"real","生物化学|糖代谢","糖异生的中间产物","糖异生途径中果糖-1,6-二磷酸经果糖二磷酸酶-1水解生成果糖-6-磷酸，果糖-6-磷酸再异构为葡糖-6-磷酸并水解成葡萄糖，故果糖-6-磷酸是糖异生的重要中间产物。磷酸葡萄糖酸、磷酸戊糖属磷酸戊糖途径中间物，UDPG是糖原合成的活性葡萄糖供体。","《生物化学与分子生物学》第9版·糖代谢·糖异生","green"],["2023N121B","糖原合成的重要中间产物",["磷酸葡萄糖酸","果糖-6-磷酸","磷酸戊糖","尿苷二磷酸葡萄糖"],"D","B","生物化学",2023,"real","生物化学|糖代谢","UDPG与糖原合成","糖原合成时，葡糖-1-磷酸与UTP在UDPG焦磷酸化酶催化下生成尿苷二磷酸葡萄糖（UDPG），作为活性葡萄糖基供体，由糖原合酶将其加至糖原非还原端，故UDPG是糖原合成的重要中间产物。果糖-6-磷酸为糖酵解/糖异生中间物。","《生物化学与分子生物学》第9版·糖代谢·糖原的合成","green"],["2023N122B","参与酮体分解的酶",["HMG-CoA合酶","HMG-CoA裂解酶","HMG-CoA还原酶","琥珀酰CoA转硫酶"],"D","B","生物化学",2023,"real","生物化学|脂类代谢","琥珀酰CoA转硫酶与酮体利用","酮体利用时，乙酰乙酸须先经琥珀酰CoA转硫酶（在肝外组织，心、肾、脑、骨骼肌）作用，接受琥珀酰CoA的CoA生成乙酰乙酰CoA，再由硫解酶裂解为2分子乙酰CoA进入三羧酸循环。HMG-CoA合酶、裂解酶参与酮体生成，HMG-CoA还原酶为胆固醇合成关键酶。","《生物化学与分子生物学》第9版·脂类代谢·酮体的利用","green"],["2023N123B","内源性胆固醇合成的关键酶是",["HMG-CoA合酶","HMG-CoA裂解酶","HMG-CoA还原酶","琥珀酰CoA转硫酶"],"C","B","生物化学",2023,"real","生物化学|脂类代谢","HMG-CoA还原酶与胆固醇合成","内源性胆固醇合成的关键（限速）酶是HMG-CoA还原酶，催化HMG-CoA还原为甲羟戊酸，受胆固醇、甲羟戊酸衍生物反馈抑制，并受胰岛素/胰高血糖素及AMPK磷酸化调节；他汀类药物即其抑制剂。HMG-CoA合酶参与酮体生成（限速）。","《生物化学与分子生物学》第9版·脂类代谢·胆固醇的合成","green"],["2023N124B","可出现在动脉粥样硬化的细胞是",["Aschoff细胞","心衰细胞","多核巨细胞","泡沫细胞"],"D","B","病理学",2023,"real","病理学|心血管系统疾病","泡沫细胞与动脉粥样硬化","泡沫细胞是动脉粥样硬化脂纹和斑块的特征性细胞，由巨噬细胞（主要）和血管平滑肌细胞吞噬大量氧化型LDL后胞质内充满脂滴形成，故D正确。A Aschoff细胞是风湿性心肌炎风湿小体内的特征细胞，与A组乙型溶血性链球菌感染相关；B心衰细胞是左心衰肺淤血时吞噬含铁血黄素的肺泡巨噬细胞；C多核巨细胞见于结核结节、异物肉芽肿等。三者与动脉粥样硬化无关，故同组内不选。","《病理学》第9版·局部血液循环障碍·动脉粥样硬化","green"],["2023N125B","可出现在手术缝线周围的细胞是",["Aschoff细胞","心衰细胞","多核巨细胞","泡沫细胞"],"C","B","外科学",2023,"real","外科学|其他","异物多核巨细胞","手术缝线为不可降解异物，机体以异物性肉芽肿方式处理：巨噬细胞附着于缝线表面并相互融合，形成多核巨细胞（异物巨细胞），周围为纤维母细胞及增生的纤维组织，最终将异物包裹。Aschoff细胞见于风湿性肉芽肿，心衰细胞为吞噬含铁血黄素的巨噬细胞，泡沫细胞见于动脉粥样硬化病灶。故选C。","《病理学》第9版·炎症·异物性肉芽肿","green"],["2023N128B","上述疾病中，急性肺源性心脏病最主要的病因是",["慢性阻塞性肺疾病","特发性肺纤维化","急性肺血栓栓塞症","重症肺炎"],"C","B","外科学",2023,"real","外科学|其他","急性肺源性心脏病的病因","急性肺源性心脏病指急性肺动脉高压引起的右心室急性扩张与右心衰竭，最主要病因是大面积肺血栓栓塞：栓子阻塞肺动脉使肺循环阻力骤升、右心室后负荷急剧增加。慢性阻塞性肺疾病、特发性肺纤维化所致的是慢性肺源性心脏病，重症肺炎主要引起呼吸衰竭而非急性肺心病。故选C。","《病理学》第9版·心血管系统疾病·肺源性心脏病","green"],["2023N129B","上述疾病中，慢性肺源性心脏病最常见的原因是",["慢性阻塞性肺疾病","特发性肺纤维化","急性肺血栓栓塞症","重症肺炎"],"A","B","外科学",2023,"real","外科学|其他","慢性肺心病的常见病因","慢性肺源性心脏病最常见的基础疾病是慢性阻塞性肺疾病，占绝大多数：长期气道阻塞与肺气肿使肺血管床减少，缺氧引起肺血管收缩与结构重塑，形成肺动脉高压，进而右心室肥厚扩张。特发性肺纤维化为间质性肺病，重症肺炎与急性肺血栓栓塞均不能解释慢性过程。故选A。","《病理学》第9版·心血管系统疾病·慢性肺源性心脏病","green"],["2023N130B","肝硬化导致性激素代谢失调的临床表现",["黄疸","蜘蛛痣","腹水","牙龈出血"],"B","B","内科学",2023,"real","内科学|消化系统疾病","肝硬化性激素代谢紊乱的表现","肝硬化时肝脏对雌激素灭活减弱，血中雌二醇升高，反馈抑制垂体促性腺激素，致男性乳房发育、睾丸萎缩、女性月经失调，并在皮肤出现蜘蛛痣与肝掌，故性激素代谢失调的皮肤表现为蜘蛛痣。黄疸源于胆红素代谢障碍；腹水源于门脉高压与低白蛋白；牙龈出血源于凝血因子合成减少。","《内科学》第9版·消化系统疾病·肝硬化","green"],["2023N131B","门脉高压的常见临床表现",["黄疸","蜘蛛痣","腹水","牙龈出血"],"C","B","外科学",2023,"real","外科学|普通外科","门脉高压的临床表现","门静脉高压症三大临床表现是脾大伴脾功能亢进、食管胃底静脉曲张破裂出血、腹水（常合并自发性细菌性腹膜炎），此外可见腹壁静脉曲张、痔出血。黄疸、蜘蛛痣、牙龈出血分别反映肝细胞性黄疸、雌激素灭活减少与凝血因子合成障碍，属肝功能减退表现，不是门脉高压本身的表现。故选C。","《外科学》第9版·普通外科·门静脉高压症","green"],["2023N132B","老年人结肠梗阻最常见的病因",["结肠癌","肠套叠","乙状结肠冗长","粘连性肠梗阻"],"A","B","外科学",2023,"real","外科学|普通外科","老年结肠梗阻的病因","老年人结肠梗阻最常见的机械性病因是结肠癌，肿瘤环形生长使肠腔狭窄，出现进行性腹胀、便秘，左侧结肠多见，常伴贫血、消瘦与便血；乙状结肠冗长扭转可致闭袢性梗阻，但发生率低。粘连性肠梗阻多见于小肠，肠套叠多见于婴幼儿。故选A。","《外科学》第9版·普通外科·结肠梗阻","green"],["2023N133B","儿童肠梗阻最常见的病因",["结肠癌","肠套叠","乙状结肠冗长","粘连性肠梗阻"],"B","B","外科学",2023,"real","外科学|普通外科","儿童肠梗阻的病因","儿童肠梗阻最常见的病因是肠套叠，多见于2岁以下婴幼儿，回盲部套入升结肠，表现为阵发性哭闹、呕吐、果酱样黏液血便及腹部腊肠样包块，空气或钡剂灌肠可诊断并复位。结肠癌、乙状结肠冗长为老年人病因，粘连性肠梗阻多见于有腹部手术史的成人。故选B。","《外科学》第9版·普通外科·肠套叠","green"],["2023N134B","甲状腺术后，出现饮水呛咳的原因是",["损伤喉返神经","损伤喉上神经内支","损伤喉上神经外支","损伤颈交感干"],"B","B","外科学",2023,"real","外科学|外科总论","喉上神经内支损伤","喉上神经内支是感觉支，穿甲状舌骨膜入喉，支配声门以上喉黏膜感觉；甲状腺手术中结扎甲状腺上极血管时若过分贴近腺体、大块结扎，易损伤该支，使喉黏膜感觉丧失、吞咽时声门保护性反射消失，出现饮水呛咳与误吸。故为B。喉返神经损伤表现为声音嘶哑，喉上神经外支损伤表现为音调降低。","《外科学》第9版·普通外科·甲状腺手术并发症","green"],["2023N135B","甲状腺术后，出现声音嘶哑的原因是",["损伤喉返神经","损伤喉上神经内支","损伤喉上神经外支","损伤颈交感干"],"A","B","外科学",2023,"real","外科学|外科总论","喉返神经损伤","喉返神经支配除环甲肌以外的全部喉内肌。甲状腺手术处理腺体背侧、结扎甲状腺下动脉或腺体残留过多时可致损伤：单侧损伤出现声音嘶哑、发声费力，双侧损伤可致失音甚至声门狭窄窒息。故为A。喉上神经内支损伤为饮水呛咳，外支损伤为音调降低、声带松弛。","《外科学》第9版·普通外科·甲状腺手术并发症","green"],["2023N136X","影响静息电位因素",["细胞外K⁺浓度","细胞外Ca²⁺浓度","膜对Na⁺K⁺的通透性","Na泵活动水平"],"ACD","X","生理学",2023,"real","生理学|细胞的基本功能","影响静息电位的因素","静息电位由K+平衡电位及膜对其他离子的相对通透性决定：细胞外K+浓度改变直接改变EK（A），膜对Na+、K+的相对通透性改变使静息电位偏离EK（C），钠泵活动水平既维持浓度差又以生电作用影响静息电位（D），三者均正确。细胞外Ca2+浓度主要影响阈电位与兴奋性（膜屏障作用），对静息电位影响很小，B不选。","《生理学》第9版·细胞的基本功能·静息电位","green"],["2023N137X","生理性抗凝物质有哪些",["蛋白C系统","组织因子途径抑制物质","纤溶激活酶抑制物","肝素"],"ABD","X","外科学",2023,"real","外科学|其他","生理性抗凝物质","生理性抗凝物质包括：丝氨酸蛋白酶抑制物（抗凝血酶Ⅲ等）、蛋白C系统（血栓调节蛋白、蛋白C、蛋白S，灭活Ⅴ、Ⅷ因子）、组织因子途径抑制物TFPI，以及由肥大细胞释放、可增强抗凝血酶活性的肝素。C纤溶激活酶抑制物作用于纤溶酶原激活物，属纤溶系统的抑制物，不属抗凝物质。故选ABD。","《生理学》第9版·血液·血液凝固与抗凝","green"],["2023N138X","关于血红蛋白的叙述，正确的是",["R型Hb对氧气的亲和力高于T型Hb","H的浓度不利于氧气与Hb结合","Hb与氧气结合后呈樱桃红","Hb中的Fe为三价铁离子"],"AB","X","外科学",2023,"real","外科学|其他","血红蛋白的构型与氧亲和力","A正确：R型（松弛型）Hb对氧亲和力高，T型（紧张型）亲和力低，氧合时由T型转向R型。B正确：H+浓度升高使Hb对氧亲和力降低（Bohr效应），不利于结合并促进释氧。C错误：Hb与氧结合后呈鲜红色，樱桃红色为一氧化碳血红蛋白的颜色。D错误：Hb中的铁为二价亚铁，氧化为三价即成高铁血红蛋白而失去携氧能力。故选AB。","《生理学》第9版·呼吸·氧的运输","green"],["2023N139X","大肠内细菌可以合成的维生素有",["维生素C","维生素B复合物","维生素E","维生素K"],"BD","X","生物化学",2023,"real","生物化学|酶","肠道菌合成维生素K与B族","大肠内细菌利用简单物质可合成维生素K（维生素K2，甲萘醌类）和维生素B复合物（B1、B2、B6、B12、叶酸、生物素、泛酸等），部分可被吸收，故长期使用广谱抗生素可致维生素K及B族缺乏、凝血酶原时间延长。维生素C、E必须由食物提供，肠道菌不能合成。","《生物化学与分子生物学》第9版·维生素·维生素的来源","green"],["2023N140X","利用肾清除率的原理，可测定的肾功能指标",["肾小球清除率","肾血流量","肾小管重吸收钠量","肾小管泌氢能力"],"AB","X","外科学",2023,"real","外科学|其他","清除率的应用","清除率指单位时间内肾将多少毫升血浆中的某物质完全清除。菊粉可自由滤过、既不分泌也不重吸收，其清除率即肾小球滤过率；对氨基马尿酸在低浓度下经滤过和近端小管分泌几乎被一次清除，其清除率代表有效肾血浆流量，结合红细胞比容可算出肾血流量。故A、B可用清除率原理测定；肾小管重吸收钠量与泌氢能力需通过分段或特殊试验判断，不能由此原理得出。故选AB。","《生理学》第9版·尿的生成与排出·清除率","green"],["2023N141X","库欣综合征循环血液中血细胞计数",["红细胞增多","淋巴细胞减少","中性粒细胞减少","嗜酸性粒细胞减少"],"ABD","X","内科学",2023,"real","内科学|内分泌与代谢","库欣综合征的血象改变","库欣综合征时皮质醇增多刺激骨髓造血：红细胞与血红蛋白增多（A对）、中性粒细胞增多而淋巴细胞减少（B对、C错）、嗜酸性粒细胞减少（D对），并伴血小板增多。这一血象特点有助于与单纯性肥胖鉴别，故正确项为A、B、D。","《内科学》第9版·内分泌与代谢疾病·库欣综合征","green"],["2023N142X","成熟红细胞内的代谢途径有",["糖酵解","磷酸戊糖旁路","脂肪酸β氧化","尿素生成"],"AB","X","生理学",2023,"real","生理学|血液","成熟红细胞的代谢途径","成熟红细胞无细胞核与线粒体，只能进行无氧的糖酵解（产能并生成2,3-DPG）和磷酸戊糖旁路（生成NADPH与磷酸核糖），故A、B正确。脂肪酸β氧化与尿素生成分别在线粒体、肝脏中完成，红细胞缺乏线粒体与相关酶系，不能进行C、D。","《生物化学与分子生物学》第9版·血液生化·红细胞的代谢","green"],["2023N143X","参与肝生物转化I相反应的酶有",["细胞色素P450单加氧酶","醇脱氢酶","单胺氧化酶","UDP-葡萄糖醛酸基转移酶"],"ABC","X","生物化学",2023,"real","生物化学|酶","生物转化的两相反应","肝生物转化分两相：Ⅰ相为氧化、还原、水解，主要由细胞色素P450单加氧酶系催化，还包括醇脱氢酶（乙醇氧化）、单胺氧化酶（胺类氧化脱氨）、环氧化物水解酶等；Ⅱ相为结合反应，如UDP-葡萄糖醛酸基转移酶催化葡萄糖醛酸结合、硫酸基转移酶、谷胱甘肽S-转移酶、乙酰基转移酶。故D属Ⅱ相，不选。","《生物化学与分子生物学》第9版·血液生化·肝的生物转化","green"],["2023N144X","原核生物基因表达调控的方式有",["阻遏蛋白封闭启动子的负性调控","cAMP、CAP介导的正调控","转录衰减子调控","RNA编辑"],"ABC","X","生物化学",2023,"real","生物化学|RNA转录与翻译","原核基因表达的调控方式","原核基因表达调控以转录水平为主：阻遏蛋白结合操纵序列（题述“封闭启动子”指阻碍RNA聚合酶结合启动子）的负性调控；cAMP-CAP复合物结合CAP位点促进转录的正性调控；衰减子介导的转录终止（如色氨酸操纵子）可精细调节。RNA编辑属真核生物转录后水平的加工调控，原核一般不存在，故不选D。","《生物化学与分子生物学》第9版·基因表达调控·原核基因表达调控","green"],["2023N145X","下列属于蛋白质激酶偶联受体介导的信号转导通路有",["MAPK通路","JAK-STAT通路","PI3K通路","经典核受体通路"],"ABC","X","生物化学",2023,"real","生物化学|酶","MAPK/JAK-STAT/PI3K通路","蛋白质激酶偶联受体（催化型受体）包括受体型酪氨酸激酶、丝/苏氨酸激酶受体、鸟苷酸环化酶受体及与JAK结合的细胞因子受体，其介导的通路有MAPK（Ras-MAPK）、JAK-STAT、PI3K-Akt等，故A、B、C正确。经典核受体通路属胞内受体介导的转录调控，不经激酶偶联受体。","《生物化学与分子生物学》第9版·细胞信号转导·激酶偶联受体通路","green"],["2023N146X","下列原癌基因中，编码的蛋白质属于转录因子的有",["MYC","FOS","HER-2","EGF-R"],"AB","X","病理学",2023,"real","病理学|肿瘤","原癌基因产物分类","原癌基因按编码产物功能分类：A MYC编码核内转录因子，促进细胞增殖并参与凋亡调控；B FOS（与JUN形成AP-1复合物）编码核内转录因子，两者均正确。C HER-2（ERBB2）和D EGF-R（EGFR/ERBB1）编码细胞膜上的受体型酪氨酸激酶，属生长因子受体类，不是转录因子。故答案为AB。","《病理学》第9版·肿瘤·癌基因与抑癌基因","green"],["2023N147X","DNA重组技术中常用的工具酶有",["限制性核酸内切酶","DNA聚合酶I","DNA连接酶","逆转录酶"],"ABCD","X","生物化学",2023,"real","生物化学|DNA复制与修复","重组DNA技术的工具酶","重组DNA技术常用工具酶包括：限制性核酸内切酶（切割特异位点）、DNA连接酶（连接黏性或平端）、DNA聚合酶Ⅰ（缺口平移制备探针、标记、合成cDNA第二链）、逆转录酶（mRNA→cDNA）、末端转移酶、碱性磷酸酶，以及Taq酶等。故四项均为常用工具酶。","《生物化学与分子生物学》第9版·基因重组与分子生物学技术·工具酶","green"],["2023N148X","下列可见大量嗜酸性粒细胞浸润的病变有",["过敏性鼻","血吸虫感染","大叶性肺炎","病毒性肝炎"],"AB","X","外科学",2023,"real","外科学|外科总论","嗜酸性粒细胞浸润的病变","嗜酸性粒细胞主要见于变态反应性疾病与寄生虫感染。过敏性鼻炎属Ⅰ型变态反应，黏膜内嗜酸性粒细胞浸润明显；血吸虫感染时虫卵周围形成嗜酸性脓肿与肉芽肿。大叶性肺炎属纤维素性炎，渗出以中性粒细胞为主；病毒性肝炎以淋巴细胞、单核细胞浸润为主。故选AB。","《病理学》第9版·炎症·炎症细胞的种类与意义","green"],["2023N149X","下列属于化脓性炎症的疾病有",["急性肾盂肾炎","伤寒","流行性脑脊髓膜炎","亚急性甲状腺炎"],"AC","X","外科学",2023,"real","外科学|普通外科","化脓性炎症","急性肾盂肾炎为化脓性炎，肾间质大量中性粒细胞浸润并形成微脓肿；流行性脑脊髓膜炎由脑膜炎双球菌引起，蛛网膜下腔充满中性粒细胞及脓性渗出物，均属化脓性炎。伤寒为增生性炎，形成伤寒肉芽肿（巨噬细胞结节）；亚急性甲状腺炎为肉芽肿性炎伴多核巨细胞，均非化脓性炎。故选AC。","《病理学》第9版·炎症·炎症的类型","green"],["2023N150X","属于肝细胞桥接坏死的有",["门管区-门管区连续的肝细胞坏死带","门管区-小叶中央静脉连续的肝细胞坏死带","肝细胞坏死占肝小叶的大部分","小叶中央静脉-小叶中央静脉连续的肝细胞坏死带"],"ABD","X","病理学",2023,"real","病理学|细胞和组织的适应与损伤","桥接坏死的三种形式","桥接坏死指两条以上坏死带互相连接，包括A门管区-门管区、B门管区-小叶中央静脉、D小叶中央静脉-小叶中央静脉三种形式，是中度以上慢性病毒性肝炎的活动性标志，可伴纤维化而发展为肝硬化，故A、B、D正确。C肝细胞坏死占肝小叶的大部分已达亚大块坏死（甚至大块坏死）程度，属大片状坏死，其范围超出“桥接”的带状连接，不属桥接坏死。","《病理学》第9版·消化系统疾病·病毒性肝炎","green"],["2023N152X","可引起心肌坏死的病变有",["病毒性心肌炎","主动脉粥样硬化","肺动脉狭窄","扩张型心肌病"],"ACD","X","病理学",2023,"real","病理学|心血管系统疾病","心肌坏死的病因","A病毒性心肌炎可直接致心肌细胞变性坏死伴淋巴细胞浸润；C肺动脉狭窄使右心室压力负荷过重、心肌代偿性肥厚而相对缺血，可发生心肌损伤坏死；D扩张型心肌病心肌细胞肥大、萎缩变性并被纤维化替代，可出现心肌坏死。B主动脉粥样硬化病变位于主动脉壁，主要引起主动脉瘤、夹层及管壁溃疡，不直接导致心肌坏死（个别累及冠状动脉开口者除外），故不选。答案为ACD。","《病理学》第9版·心血管系统疾病·心肌炎与心肌病","green"],["2023N153X","可引起大肠癌的癌前病变有",["家族性腺瘤性息肉病","溃疡性结肠炎","幼年性息肉病","绒毛膜腺瘤"],"ABCD","X","病理学",2023,"real","病理学|肿瘤","大肠癌癌前病变","大肠癌癌前病变包括：A家族性腺瘤性息肉病（APC基因突变，40岁前后几乎必然癌变）；B慢性溃疡性结肠炎（病程10年以上、全结肠受累者癌变风险明显升高，需定期肠镜监测）；C幼年性息肉病综合征（错构瘤性息肉病，其本人及家属结直肠癌风险显著增加）；D绒毛状腺瘤（D项OCR作“绒毛膜腺瘤”，应为绒毛状腺瘤，癌变率可达30%～40%，高于管状腺瘤）。故ABCD。⚠️D项存在OCR错字，按“绒毛状腺瘤”理解。","《病理学》第9版·消化系统疾病·大肠癌癌前病变","yellow"],["2023N154X","男性，76岁，慢性咳嗽咳痰30年，活动后气短5年，近期活动后加重3天，入院进行抗感染对 症治疗后症状好转，今早左胸突发胸痛，呼吸困难，听诊左肺呼吸音消失，以下治疗措施正确的是",["胸片及心电图","吸氧","镇静药物","机械通气"],"BC","X","外科学",2023,"real","外科学|外科总论","自发性气胸的处理原则","慢阻肺患者突发胸痛、呼吸困难、左肺呼吸音消失，首先考虑自发性气胸。治疗应卧床、吸氧、监测血氧与心电、胸片或CT明确气胸量并穿刺排气，必要时胸腔闭式引流：故B正确，适量镇静可缓解胸痛、呼吸困难所致焦虑与耗氧增加，须在通气保障下使用，C可选。A属诊断检查而非治疗措施；机械通气在未引流前可加重张力性气胸，属禁忌，故D不选。","《外科学》第9版·胸心外科·自发性气胸","green"],["2023N155X","急性左心衰(急性肺水肿)可选用的治疗药物有",["毛花苷c","伊伐布雷定","奈西立肽","左西孟旦"],"ACD","X","内科学",2023,"real","内科学|循环系统疾病","急性左心衰的药物治疗","急性左心衰（急性肺水肿）可选用：毛花苷C（A，适用于伴快速房颤者）、奈西立肽（C，重组人BNP，扩血管利尿）、左西孟旦（D，钙增敏剂，改善顿抑心肌）。伊伐布雷定（B）仅用于慢性稳定性心衰窦性心律心率≥70次/分者，急性失代偿期禁用，故不选。","《内科学》第9版·循环系统疾病·急性心力衰竭","green"],["2023N156X","在有机磷农药口服中毒后，可以用2%NaHCO₃溶液洗胃的有",["对硫磷","敌百虫","敌敌畏","乐果"],"ACD","X","外科学",2023,"real","外科学|其他","有机磷中毒洗胃液的选择","有机磷农药中毒洗胃液的选择取决于其遇碱是否增毒：敌百虫在碱性溶液中可转化为毒性更大的敌敌畏，故禁用2%碳酸氢钠等碱性液，只用清水或生理盐水；对硫磷（1605）、敌敌畏、乐果在碱性环境中水解失效、毒性降低，可用2%碳酸氢钠溶液反复洗胃，随后给活性炭与导泻。故选ACD。","《内科学》第9版·理化因素所致疾病·有机磷杀虫药中毒","green"],["2023N157X","下列属于尿道刺激征的是",["尿潴留","尿急","尿痛","排尿困难"],"BC","X","外科学",2023,"real","外科学|泌尿外科","膀胱刺激征","膀胱刺激征即尿路刺激症状，由膀胱黏膜受炎症、结石或理化因素刺激引起，典型为尿频、尿急、尿痛，三者常同时出现，见于急性膀胱炎、结核等。尿潴留指膀胱充盈而尿液不能排出，排尿困难指排尿启动或尿流排出障碍，两者属排尿异常而非刺激征。故属于尿道刺激征的是B、C。","《外科学》第9版·泌尿外科·下尿路症状","green"],["2023N158X","可导致APTT降低而TT正常的因素",["5因子缺乏","7因子缺乏","9因子缺乏","纤维蛋白原减少"],"AC","X","外科学",2023,"real","外科学|其他","APTT与TT的临床意义","APTT反映内源性及共同途径（Ⅻ、Ⅺ、Ⅸ、Ⅷ、Ⅹ、Ⅴ、凝血酶原、纤维蛋白原），TT只反映纤维蛋白原转变为纤维蛋白的终末环节。因子Ⅴ、Ⅸ缺乏只累及内源/共同途径，表现为APTT延长而TT正常；因子Ⅶ缺乏使PT延长而APTT正常；纤维蛋白原减少则TT延长。⚠️原答案存疑，理由：题干「APTT降低」应为「APTT延长」，按延长理解则A、C成立，若按降低理解则无正确选项。","《诊断学》第9版·实验诊断·止血与凝血功能检查","yellow"],["2023N159X","关于糖尿病酮症酸中毒的治疗，正确的措施有",["前四小时内输入0.9%氯化钠2000ml","血糖降至16.7mmol/L时，补液需改用5%葡萄糖生理盐水","首次胰岛素静注负荷量10-20U，后静脉滴注每小时0.1U/kg","血PH<7.1，HCO₃⁻<5mmol/L时，需要补碱治疗"],"CD","X","内科学",2023,"real","内科学|内分泌与代谢","DKA补液与胰岛素方案","DKA治疗：补液按失水量1/3于前4小时输入（成人约1000～1500ml，需个体化），并非固定输入2000ml，故A不选；血糖降至13.9mmol/L左右时改用5%葡萄糖液（加胰岛素）以防低血糖，B的16.7mmol/L与“葡萄糖生理盐水”表述不准确，不选；首次静注胰岛素负荷10～20U后按0.1U/kg·h持续静滴（C对）；pH<7.1或HCO₃⁻<5mmol/L时适量补碱（D对）。","《内科学》第9版·内分泌与代谢疾病·糖尿病酮症酸中毒","green"],["2023N160X","胆囊结石行胆囊切除术的手术指征，正确的有",["结石直径大于等于3cm，无症状","儿童胆囊结石，无症状","伴有胆囊息肉样病变，直径>1cm","瓷性胆囊"],"ACD","X","外科学",2023,"real","外科学|普通外科","胆囊切除术的指征","胆囊结石的手术指征：结石数量多或直径≥2~3cm、胆囊壁钙化或瓷性胆囊、伴胆囊息肉样病变直径>1cm、胆囊壁增厚>3mm（慢性胆囊炎）、有症状或出现并发症。故A、C、D均属指征。儿童无症状胆囊结石原则上不常规手术，以观察随访为主，故B不选。故选ACD。","《外科学》第9版·普通外科·胆囊结石","green"],["2023N161X","急性阑尾炎可能出现的阳性体征有",["Rovsing征","Cullen征","Psoas征","Obturator征"],"ACD","X","外科学",2023,"real","外科学|普通外科","阑尾炎的腹部体征","急性阑尾炎典型体征为右下腹固定压痛及反跳痛。Rovsing征（结肠充气试验）阳性提示炎症波及盲肠；Psoas征（腰大肌试验）阳性提示阑尾位于盲肠后位；Obturator征（闭孔内肌试验）阳性提示阑尾位于盆位。Cullen征指脐周皮肤瘀斑，见于急性出血坏死性胰腺炎、宫外孕破裂等，与阑尾炎无关。故选ACD。","《外科学》第9版·普通外科·急性阑尾炎","green"],["2023N162X","下列关于肠系膜上动脉栓塞的叙述正确的有",["腹痛症状多较剧烈","腹部体征早期较为轻微","栓塞多发在肠系膜上动脉根部","选择性腹腔动脉造影有助于明确诊断"],"ABD","X","病理学",2023,"real","病理学|局部血液循环障碍","肠系膜上动脉栓塞的临床特点","肠系膜上动脉栓塞多源于心脏附壁血栓脱落，起病急骤，A腹痛剧烈（常为脐周绞痛）而B早期腹部体征轻微，二者分离是该病特征，易被误诊；D选择性腹腔动脉或肠系膜上动脉造影可直接显示血管截断，有助于确诊。C错误：栓塞部位多在结肠中动脉发出部以下的肠系膜上动脉主干，而非根部（根部的锐角虽是栓子易进入该动脉的原因，但栓塞点常在其远端），故答案为ABD。","《外科学》第9版·肠系膜血管缺血性疾病·肠系膜上动脉栓塞","green"]];

function startExam(year){
  const list = DATA.filter(x=>x[I.src]==='real' && x[I.year]===year).map(x=>x[I.id]);
  state.list = list; state.pos = 0; state.sel = []; state.answered = false;
  state.mode = 'exam'; state.filter = {examYear: year};
  nav('practice');
}
function startSubject(s){
  state.list = DATA.filter(x=>x[I.subj]===s).map(x=>x[I.id]);
  state.pos = 0; state.sel = []; state.answered = false; state.mode='free';
  nav('practice');
}
function startType(t){
  state.list = DATA.filter(x=>x[I.type]===t).map(x=>x[I.id]);
  state.pos = 0; state.sel = []; state.answered = false; state.mode='free';
  nav('practice');
}
function startWrong(){
  const w = Object.keys(LS.get('wrong', {}));
  if(!w.length){ alert('错题本是空的，先去刷题吧'); return; }
  state.list = w; state.pos = 0; state.sel = []; state.answered = false; state.mode='free';
  nav('practice');
}
function startKp(kp){
  state.list = DATA.filter(x=>x[I.kp]===kp).map(x=>x[I.id]);
  state.pos = 0; state.sel = []; state.answered = false; state.mode='free';
  nav('practice');
}

function renderPractice(){
  const box = document.getElementById('main');
  if(!state.list.length){ box.innerHTML = '<div class="empty">没有题目<br>请从首页选择刷题方式</div>'; return; }
  const id = state.list[state.pos];
  const q = byId(id);
  if(!q){ box.innerHTML = '<div class="empty">题目不存在</div>'; return; }
  const typ = q[I.type];
  const multi = typ === 'X';

  let h = `<div class="bar">
    <span>${state.pos+1} / ${state.list.length}</span>
    <span>${esc(q[I.subj])} · ${q[I.year]}${q[I.src]==='mock'?'(模拟)':''} · ${typ}型</span>
  </div>`;

  h += `<div class="card">
    <div class="qn">
      <span class="tag">${q[I.id]}</span>
      ${q[I.kp2] ? `<span class="tag kp">${esc(q[I.kp2])}</span>` : ''}
      ${q[I.flag]==='yellow' ? '<span class="tag warn">答案存疑</span>' : ''}
    </div>
    <div class="stem">${esc(q[I.stem])}</div>
    <div class="opts" id="opts">`;

  q[I.opts].forEach((o,j)=>{
    const L = 'ABCD'[j];
    h += `<div class="opt ${multi?'multi':''}" data-j="${j}" onclick="pick(${j})">
      <span class="l">${L}</span><span>${esc(o)}</span></div>`;
  });
  h += `</div>`;

  if(multi && !state.answered){
    h += `<div style="margin-top:12px;font-size:13.5px;color:#6366f1">多选：至少选 2 项，选好后点「确认」</div>
      <div class="row" style="margin-top:10px"><button class="btn" onclick="submitMulti()">确认答案</button></div>`;
  }

  h += `<div class="ansbox" id="ansbox" style="display:none"></div>`;
  h += `<div id="explbox"></div>`;
  h += `</div>`;

  h += `<div class="row">
    <button class="btn ghost" onclick="prevQ()" ${state.pos===0?'disabled style="opacity:.4"':''}>上一题</button>
    <button class="btn" onclick="nextQ()">${state.pos===state.list.length-1?'完成':'下一题'}</button>
  </div>`;

  box.innerHTML = h;

  // 恢复已答状态
  const done = LS.get('done', {});
  if(done[id]) { state.answered = true; showAnswer(q, done[id].ok); }
}

function pick(j){
  if(state.answered) return;
  const q = byId(state.list[state.pos]);
  const multi = q[I.type] === 'X';
  if(multi){
    const el = document.querySelector(`.opt[data-j="${j}"]`);
    const k = state.sel.indexOf(j);
    if(k>=0){ state.sel.splice(k,1); el.classList.remove('on'); }
    else { state.sel.push(j); el.classList.add('on'); }
  } else {
    state.sel = [j];
    document.querySelectorAll('.opt').forEach(e=>e.classList.remove('on'));
    document.querySelector(`.opt[data-j="${j}"]`).classList.add('on');
    submit();
  }
}

function submitMulti(){
  if(state.sel.length < 2){ alert('多选题至少选 2 项'); return; }
  submit();
}

function submit(){
  const q = byId(state.list[state.pos]);
  const chosen = state.sel.slice().sort().map(j=>'ABCD'[j]).join('');
  const correct = q[I.ans].split('').sort().join('');
  const ok = chosen === correct;
  state.answered = true;

  // 记录
  const done = LS.get('done', {}); done[q[I.id]] = {ok: ok, t: Date.now()}; LS.set('done', done);
  const wrong = LS.get('wrong', {});
  if(ok){ delete wrong[q[I.id]]; } else { wrong[q[I.id]] = {t: Date.now(), my: chosen}; }
  LS.set('wrong', wrong);

  document.querySelectorAll('.opt').forEach(e=>{
    const j = +e.dataset.j; const L = 'ABCD'[j];
    e.classList.remove('on');
    if(correct.includes(L)) e.classList.add('right');
    else if(chosen.includes(L)) e.classList.add('wrong');
  });
  showAnswer(q, ok, chosen);
}

function showAnswer(q, ok, chosen){
  const box = document.getElementById('ansbox');
  if(!box) return;
  box.style.display = 'block';
  box.className = 'ansbox ' + (ok?'ok':'no');
  const correct = q[I.ans].split('').sort().join('');
  box.innerHTML = ok ? `✅ 回答正确　答案 ${correct}`
    : `❌ 回答错误　正确答案 <b>${correct}</b>${chosen?'　你的选择 '+chosen:''}`;

  const eb = document.getElementById('explbox');
  if(eb && q[I.exp]){
    let h = `<div class="expl open"><div class="expl-h" onclick="this.parentNode.classList.toggle('open')">
      <span>💡 解析</span><span>▾</span></div>
      <div class="expl-b">${esc(q[I.exp])}`;
    if(q[I.ref]) h += `<div class="expl-src">📚 ${esc(q[I.ref])}</div>`;
    if(q[I.flag]==='yellow') h += `<div class="flagbar">⚠️ 本题标注「答案存疑」，请以上方解析中的教材结论为准</div>`;
    h += `</div></div>`;
    eb.innerHTML = h;
  }
}

function prevQ(){ if(state.pos>0){ state.pos--; state.sel=[]; state.answered=false; render(); window.scrollTo(0,0);} }
function nextQ(){
  if(state.pos < state.list.length-1){ state.pos++; state.sel=[]; state.answered=false; render(); window.scrollTo(0,0); }
  else {
    const done = LS.get('done', {});
    const okN = state.list.filter(id=>done[id] && done[id].ok).length;
    alert(`本组完成！\n共 ${state.list.length} 题，答对 ${okN} 题，正确率 ${(okN/state.list.length*100).toFixed(1)}%`);
    nav('home');
  }
}

      h += `<div style="padding:9px 0;border-bottom:1px solid #f1f5f9;font-size:14px">
        <span class="tag">${id}</span>${esc(q[I.stem].slice(0,48))}…</div>`;

// ============ 统计 ============
function renderMe(){
  const done = LS.get('done', {});
  const ids = Object.keys(done);
  const nOk = ids.filter(id=>done[id].ok).length;
  const rate = ids.length ? (nOk/ids.length*100).toFixed(1) : 0;

  // 分学科
  const bySubj = {};
  ids.forEach(id=>{
    const q = byId(id); if(!q) return;
    const s = q[I.subj];
    bySubj[s] = bySubj[s] || {n:0, ok:0};
    bySubj[s].n++;
    if(done[id].ok) bySubj[s].ok++;
  });

  let h = `<div class="card"><h3>📊 学习统计</h3>
    <div class="stat">
      <div><b>${ids.length}</b><span>已做</span></div>
      <div><b>${nOk}</b><span>答对</span></div>
      <div><b>${rate}%</b><span>正确率</span></div>
    </div></div>`;

  h += `<div class="card"><h3>分学科正确率</h3>`;
  Object.keys(bySubj).sort((a,b)=>bySubj[b].n-bySubj[a].n).forEach(s=>{
    const v = bySubj[s];
    const r = (v.ok/v.n*100).toFixed(1);
    h += `<div style="margin-bottom:11px">
      <div style="display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px">
        <span>${esc(s)}</span><span style="color:#0f766e;font-weight:600">${r}% (${v.ok}/${v.n})</span></div>
      <div class="prog"><i style="width:${r}%"></i></div></div>`;
  });
  if(!Object.keys(bySubj).length) h += '<div style="color:#94a3b8;font-size:14px">还没有记录</div>';
  h += `</div>`;

  h += `<div class="card"><h3>数据管理</h3>
    <div class="row"><button class="btn ghost" onclick="resetAll()">清空本地记录</button></div>
    <div style="font-size:12px;color:#94a3b8;margin-top:10px">
    数据保存在本机浏览器，换设备不会同步</div></div>`;

  document.getElementById('main').innerHTML = h;
}

  if(!confirm('确认清空所有做题记录和错题？此操作不可恢复')) return;
  localStorage.removeItem('xz_done');
  localStorage.removeItem('xz_wrong');

}

function render(){
  const t = document.getElementById('ttl');
  const s = document.getElementById('sub');
  const v = state.view;
  if(v==='home'){ t.textContent='西医综合 306 · 真题库'; s.textContent=`${DATA.length} 题｜2024-2026 真题 + 模拟｜逐题解析`; renderHome(); }
  else if(v==='practice'){ t.textContent='刷题'; s.textContent=''; renderPractice(); }
  else if(v==='kp'){ t.textContent='知识点'; s.textContent='按教材章节聚合'; renderKp(); }
  else if(v==='wrong'){ t.textContent='错题本'; s.textContent=''; renderWrong(); }
  else if(v==='me'){ t.textContent='统计'; s.textContent=''; renderMe(); }
}

// 左右滑动切题
let tx=0, ty=0;
document.addEventListener('touchstart', e=>{ tx=e.touches[0].clientX; ty=e.touches[0].clientY; }, {passive:true});
document.addEventListener('touchend', e=>{
  if(state.view!=='practice') return;
  const dx = e.changedTouches[0].clientX - tx;
  const dy = e.changedTouches[0].clientY - ty;
  if(Math.abs(dx)>70 && Math.abs(dx)>Math.abs(dy)*1.6){
    if(dx<0) nextQ(); else prevQ();
  }
});

render();
</script>
</body>
</html>
