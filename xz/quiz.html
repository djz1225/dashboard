。既往体 健。化验尿蛋白（＋＋），沉渣镜检红细胞 20～25个/HP，抗链\"O\"1∶800，血清 C3降低。治 疗该患者高血压的首选药物是",["利尿剂","β受体拮抗剂","钙通道阻滞剂","血管紧张素转换酶抑制剂"],"D","A","内科学",2020,"real","内科学|循环系统疾病","急性肾炎高血压的降压选择","青年男性，咽痛2周后颜面水肿、血压升高、蛋白尿、镜下血尿、抗链O 1:800、C3降低，为典型的急性链球菌感染后肾小球肾炎。其高血压主要与水钠潴留、血容量扩张有关，故治疗首选利尿剂，限制水钠后血压多可下降；ACEI虽常用，但急性期少尿时可加重高钾与肾功能恶化。⚠️原答案存疑，教材强调利尿为降压首选，ACEI宜慎用。","《内科学》第9版·泌尿系统疾病·急性肾小球肾炎","yellow"],["2020N55A","男性，55岁。患2型糖尿病10年，用二甲双胍0.5g每日三次口服，以及睡前中效胰岛素 20 U皮下注射治疗。血糖监测显示∶凌晨两点血糖 2.9 mmol/L，空腹血糖12.0 mmol/L。该 患者空腹血糖升高的原因是",["黎明现象","Somogyi 效应","睡前胰岛素剂量不足","二甲双胍药物不良反应"],"B","A","内科学",2020,"real","内科学|内分泌与代谢","Somogyi效应与黎明现象","凌晨2点血糖2.9mmol/L（低血糖）而空腹血糖反而升高，为Somogyi效应：夜间低血糖后反调节激素（儿茶酚胺、胰高血糖素、皮质醇）分泌增多，致清晨高血糖。黎明现象为夜间血糖正常、晨起升高；睡前胰岛素剂量不足时夜间血糖不低；二甲双胍不引起此模式。处理为减少睡前中效胰岛素。","《内科学》第9版·内分泌与代谢疾病·糖尿病","green"],["2020N56A","病理和临床特点为退行性变的风湿性疾病是",["银屑病关节炎","强直性脊柱炎","骨关节炎","类风湿关节炎"],"C","A","病理学",2020,"real","病理学|心血管系统疾病","骨关节炎的退行性本质","骨关节炎是以关节软骨退行性变和软骨下骨反应性增生为特征的退行性疾病，多见于老年人，病理上无滑膜明显炎症和骨侵蚀，属退行性变的风湿性疾病。强直性脊柱炎、银屑病关节炎属脊柱关节炎；类风湿关节炎是慢性滑膜炎性、侵蚀性关节炎，与自身免疫相关，均以炎症为本质。故选C。","《内科学》第9版·风湿性疾病·骨关节炎","green"],["2020N57A","上消化道大出血的病因中，肝硬化食管胃底曲张静脉破裂所占的比例是",["20?5%","26?0%","31?5%","36??40%"],"A","A","内科学",2020,"real","内科学|消化系统疾病","上消化道出血的病因构成","国内资料显示上消化道大出血最常见病因为消化性溃疡（约50%），其次为食管胃底静脉曲张破裂（约20%～25%），再次为急性胃黏膜病变和胃癌。故静脉破裂所占比例约20%～25%，B、C、D比例过高。","《内科学》第9版·消化系统疾病·上消化道出血","green"],["2020N58A","下列选项中，不属于乳腺癌促发因素的是",["初潮年龄小","绝经期晚","哺乳","初产年龄大 ”"],"C","A","外科学",2020,"real","外科学|普通外科","乳腺癌促发因素","乳腺癌高危因素包括月经初潮早、绝经晚、初产年龄大或未婚未育、一级亲属乳腺癌史、乳腺不典型增生、绝经后肥胖与长期激素替代治疗。哺乳使乳腺腺体充分分化、减少雌激素的累积暴露，具有保护作用，不属于促发因素，故选C。A、B、D均为公认的促发因素。","《外科学》第9版·普通外科·乳腺癌·病因与高危因素","green"],["2020N59A","下列选项中，诊断急性弥漫性腹膜炎最重要的依据是",["腹痛病史","症状和体征","B超提示腹腔积液","CT见肠管扩张"],"B","A","病理学",2020,"real","病理学|其他","腹膜炎的诊断依据","急性弥漫性腹膜炎的诊断最重要的是症状和体征：持续性腹痛、腹肌紧张、压痛与反跳痛、肠鸣音减弱或消失等腹膜刺激征，结合全身感染中毒表现即可确立诊断。腹痛病史缺乏特异性；B超提示腹腔积液只能说明有液体；CT见肠管扩张提示肠梗阻，均不能直接诊断腹膜炎。故选B。","《外科学》第9版·急性化脓性腹膜炎","green"],["2020N60A","青少年容易发生急性阑尾炎的原因中，最重要的是",["阑尾发育尚不健全","寄生虫造成阑尾梗阻","粪石阻塞阑尾管腔","阑尾淋巴滤泡组织增生致阑尾梗阻"],"D","A","外科学",2020,"real","外科学|普通外科","青少年阑尾炎病因","阑尾腔机械性梗阻是急性阑尾炎最常见的病因。青少年淋巴组织增生旺盛，阑尾壁淋巴滤泡显著增生压迫管腔使腔隙狭窄、分泌物潴留，细菌繁殖而发病，故D为最重要原因。阑尾发育尚不健全不是病因；粪石阻塞多见于成人；寄生虫（蛔虫）所致梗阻已明显减少，A、B、C均非青少年最主要原因。","《外科学》第9版·普通外科·阑尾炎·病因","green"],["2020N62A","女性，45岁。B超发现胆囊多发息肉样病变，最大直径0.6 cm，无症状。对此患者的正确处 理是",["胆囊切除术","保留胆囊，息肉摘除术","观察，定期复查","熊去氧胆酸溶解息肉"],"C","A","外科学",2020,"real","外科学|普通外科","胆囊息肉的手术指征","胆囊息肉样病变直径<1cm、单发、无症状、不合并结石且无生长趋势者恶变风险低，无需手术，应每3~6个月超声随访观察，故选C。A胆囊切除适用于息肉≥1cm、单发宽基底、短期迅速增大、合并结石或胆绞痛者；B保留胆囊息肉摘除易复发且无法排除恶变；D无药物可溶解息肉，故A、B、D均不合理。","《外科学》第9版·普通外科·胆囊息肉样病变","green"],["2020N63A","下列胸部创伤性疾病中，一般采用非手术治疗的是",["创伤性窒息","血胸]","张力性气胸","开放性气胸"],"C","A","外科学",2020,"real","外科学|胸心外科","胸部创伤的处理原则","创伤性窒息因胸腹部突然受压使上腔静脉回流骤停，表现为面颈及上胸部紫蓝色瘀斑、结膜出血，多无肋骨骨折与胸内脏器损伤，以卧床休息、吸氧、镇痛等非手术治疗为主，故教材答案为A。张力性气胸须立即粗针穿刺排气并闭式引流，血胸量大者需引流或手术，开放性气胸需先封闭伤口后引流，三者均需有创处理。⚠️原答案标为C，与教材不符，存疑。","《外科学》第9版·胸心外科·胸部损伤","yellow"],["2020N65A","骨折的临床诊断中，错误的是",["骨折的特有体征包括畸形、反常活动、骨擦音或骨擦感","具有骨折特有体征之一者，即可诊断为骨折","检查可疑骨折病人时，应诱发骨擦音或骨擦感，以明确诊断","临床未见骨折特有体征，不能排除骨折"],"C","A","外科学",2020,"real","外科学|骨科","骨折诊断原则与专有体征","骨折的专有体征为畸形、反常活动、骨擦音或骨擦感，出现其中之一即可诊断为骨折（A、B正确）；但无专有体征不能排除骨折，如嵌插骨折、裂缝骨折需依靠X线确诊（D正确）。C错，检查时严禁故意诱发骨擦音或反常活动，以免加重软组织与血管神经损伤、增加患者痛苦。","《外科学》第9版·骨科·骨折概论·临床诊断","green"],["2020N66A","骨转移癌中，最常见的原发癌是",["甲状腺癌","乳腺癌","前列腺癌","肾癌"],"B","A","病理学",2020,"real","病理学|肿瘤","骨转移癌的原发灶","骨转移癌的原发肿瘤以乳腺癌最常见，其次为前列腺癌、肺癌、肾癌、甲状腺癌，女性以乳腺癌居首、男性以前列腺癌居首。转移途径多为血行，好发于脊柱、骨盆、股骨近端，以溶骨性破坏为主（前列腺癌多为成骨性）。故按教材答案为B乳腺癌。","《外科学》第9版·骨肿瘤·转移性骨肿瘤","green"],["2020N67A","男性，20岁。胫骨中上段慢性骨髓炎，一般情况好，体温正常，局部有流脓窦道，X线片 有3 cm×1 cm 死骨，周围包壳完整。下列选项中不考虑的治疗方式是",["手术摘除死骨，肌瓣填塞消灭死腔","手术摘除死骨，庆大霉素-骨水泥珠链填塞和二期植骨","病灶清除术，伤口一期缝合，负压吸引","患肢管型石膏固定，开窗换药，全身大量应用抗生素"],"D","A","外科学",2020,"real","外科学|骨科","慢性骨髓炎的手术治疗","本例有3cm×1cm死骨、包壳完整并有流脓窦道，为慢性骨髓炎，治疗以手术清除病灶为主：病灶清除后肌瓣填塞消灭死腔（A）、死骨摘除加抗生素骨水泥珠链及二期植骨（B）、病灶清除后一期缝合加负压吸引（C）均为可选术式。D不宜，单纯管型石膏开窗换药不能清除死骨与死腔，全身长期大量用抗生素也无效且有害，故选D。","《外科学》第9版·骨科·骨与关节感染·慢性骨髓炎","green"],["2020N68A","该患者喘息急性发作时的呼吸困难类型是",["吸气性呼吸困难","呼气性呼吸困难","混合性呼吸困难","心源性呼吸困难"],"B","A","病理学",2020,"real","病理学|其他","呼气性呼吸困难与哮喘","本题为共用题干题，题干缺失，选项中考查支气管哮喘急性发作的呼吸困难类型。哮喘因气道平滑肌痉挛、黏膜水肿和黏液栓形成致广泛小气道阻塞，表现为呼气性呼吸困难，呼气延长、呼气费力伴哮鸣音。吸气性呼吸困难见于上气道阻塞（喉水肿、异物）；混合性见于肺广泛病变；心源性伴肺底湿啰音。故选B。","《病理学》第9版·呼吸系统疾病·支气管哮喘","yellow"],["2020N69A","该患者此时的动脉血气分析检查结果最可能的是",["PaO。正常，PaCO2升高","PaO。正常，PaCO∶下降","PaO。下降，PaCO。下降","PaO。下降，PaCO。升高"],"D","A","病理学",2020,"real","病理学|其他","哮喘急性发作的血气变化","本题共用题干缺失，与上一小题同属哮喘急性发作。哮喘重度发作时气道广泛阻塞，肺泡通气不足伴通气/血流比例失调，出现PaO2下降、PaCO2升高，即Ⅱ型呼吸衰竭；若PaCO2正常或下降（过度通气）提示病情尚轻，PaCO2升高说明气道阻塞严重、呼吸肌疲劳，是病情危重的标志。故选D。","《内科学》第9版·呼吸系统疾病·支气管哮喘","yellow"],["2020N70A","该患者心脏存在的器质性病变是",["二尖瓣狭窄 §","肺动脉瓣狭窄","三尖瓣狭窄","主动脉瓣狭窄"],"A","A","病理学",2020,"real","病理学|其他","二尖瓣狭窄的血流动力学","本题为共用题干题，题干缺失，但由后一小题“心尖部第一心音增强”“舒张期杂音”可推定该患者存在二尖瓣狭窄。二尖瓣狭窄时左心房压升高、肺静脉高压，导致肺淤血和呼吸困难，且因舒张期左房到左室血流受阻，左心室充盈减少、心室不大而心房增大。故器质性病变为二尖瓣狭窄，选A。","《病理学》第9版·心血管系统疾病·风湿性心脏病","yellow"],["2020N71A","该患者听诊还可能出现的体征是",["心尖部第一心音减弱","心尖部第一心音增强","心底部第二心音减弱","心底部第二心音逆分裂"],"B","A","病理学",2020,"real","病理学|其他","二尖瓣狭窄的听诊特点","本题共用题干缺失，结合二尖瓣狭窄的诊断，听诊除心尖部舒张中晚期隆隆样杂音外，因瓣叶增厚、粘连但瓣膜活动度尚可、左室充盈减少，第一心音亢进（增强）并常伴开瓣音；当瓣膜钙化僵硬时第一心音才减弱。心底部第二心音（A2）多正常，P2可因肺动脉高压而亢进。故B正确。","《病理学》第9版·心血管系统疾病·风湿性心脏病","yellow"],["2020N72A","患者突发心悸。查体∶P 85次/分，BP110/70 mmHg，双肺（-），心率 102次/分，心律不整。 此时该患者心尖部杂音听诊结果是",["无变化","舒张早期增强","舒张晚期消失","舒张早期消失"],"C","A","病理学",2020,"real","病理学|其他","房颤对二尖瓣狭窄杂音的影响","本题共用题干缺失，从选项看考查心房颤动对二尖瓣狭窄杂音的影响。二尖瓣狭窄的舒张期杂音产生于舒张中晚期心房收缩助推的血流，杂音在舒张晚期（收缩期前）增强。发生房颤后心房失去有效收缩，该助推作用消失，故舒张晚期杂音增强成分消失，而舒张早中期杂音仍存在。故C正确。","《内科学》第9版·循环系统疾病·二尖瓣狭窄","yellow"],["2020N73A","该患者最可能的诊断是",["慢性阻塞性肺疾病","支气管扩张症","支气管哮喘","间质性肺疾病"],"A","A","病理学",2020,"real","病理学|呼吸系统疾病","COPD的临床病理联系","本题为共用题干题，题干缺失，答案为慢性阻塞性肺疾病。COPD以持续气流受限为特征，中老年起病、吸烟史常见，表现为慢性咳嗽、咳痰伴活动后气短，查体桶状胸、双肺过清音、呼吸音减弱，肺功能FEV1/FVC＜70%。支气管扩张为大量脓痰和固定湿啰音；间质性肺疾病为限制性通气障碍、弥散下降及Velcro啰音。","《病理学》第9版·呼吸系统疾病·慢性阻塞性肺疾病","yellow"],["2020N74A","该患者肺功能异常是",["限制性通气功能障碍","阻塞性通气功能障碍，轻度","阻塞性通气功能障碍，中度","阻塞性通气功能障碍，重度"],"C","A","内科学",2020,"real","内科学|其他","COPD气流受限严重程度分级","COPD患者吸入支气管扩张剂后FEV₁/FVC<70%为持续气流受限；按GOLD分级，FEV₁占预计值50%～79%为中度（GOLD 2级），30%～49%为重度，<30%为极重度。本例FEV₁占预计值约50%～60%，属中度阻塞性通气功能障碍。","《内科学》第9版·呼吸系统疾病·慢性阻塞性肺疾病","green"],["2020N75A","该患者首选的治疗是",["应用LAMA","出现感染征象时应用抗生素","应用ICS+LABA","应用 N-乙酰半胱氨酸"],"A","A","内科学",2020,"real","内科学|其他","COPD稳定期起始治疗","COPD稳定期以支气管扩张剂为核心，长效抗胆碱药（LAMA，如噻托溴铵）可改善症状、减少急性加重，是起始治疗首选。ICS+LABA适用于频繁急性加重且有哮喘样特征者；抗生素仅在感染时使用；N-乙酰半胱氨酸为辅助抗氧化。","《内科学》第9版·呼吸系统疾病·慢性阻塞性肺疾病","green"],["2020N76A","该患者最可能的诊断是",["阵发性室上性心动过速","频发房性期前收缩","阵发性心房颤动","阵发性心房扑动"],"C","A","内科学",2020,"real","内科学|循环系统疾病","阵发性房颤的心电图识别","阵发性心悸、突发突止、发作时心律绝对不齐、心电图P波消失代以f波且RR间期不规则，为阵发性心房颤动。阵发性室上速心律规则、无f波；频发房性期前收缩为基础心律中提前出现的P'波；心房扑动为规则锯齿状F波（多见2:1传导）。","《内科学》第9版·循环系统疾病·心房颤动","green"],["2020N77A","该患者最可能的原发病因是",["高血压","冠心病","糖尿病","甲状腺功能亢进症"],"D","A","内科学",2020,"real","内科学|循环系统疾病","甲亢性房颤","年轻患者阵发性房颤、伴怕热多汗消瘦、甲状腺肿大或T₃T₄升高者，最常见的原发病因为甲状腺功能亢进症——甲状腺激素增多增加β受体敏感性、增快心率并促发房颤。高血压、冠心病、糖尿病多见于中老年，本例年龄与伴随症状不符。","《内科学》第9版·循环系统疾病·心房颤动","green"],["2020N78A","该患者正确的治疗措施是",["选用洋地黄类药物减慢心室率","行射频消融术转复心律","治疗原发病","临床观察"],"C","A","内科学",2020,"real","内科学|循环系统疾病","甲亢性房颤的处理原则","甲亢所致的房颤，根本措施是控制甲亢（抗甲状腺药物或¹³¹I、手术），甲功恢复后相当部分患者房颤自行转复，故治疗原发病最关键。洋地黄控制心室率在甲亢时效果差且不解决病因；射频消融可在甲亢控制后仍持续房颤时考虑；单纯观察不可取。","《内科学》第9版·循环系统疾病·心房颤动","green"],["2020N79A","目前最可能的诊断是",["慢性重型肝炎","原发性肝癌","细菌性肝脓肿","肝脏血管瘤l"],"B","A","内科学",2020,"real","内科学|消化系统疾病","肝癌的临床诊断","肝硬化基础上出现肝区疼痛、进行性肝大、AFP持续升高及影像学示肝内占位伴强化，最可能为原发性肝癌。慢性重型肝炎以黄疸、凝血障碍、肝性脑病为主而无占位；细菌性肝脓肿有高热、白细胞升高、液化腔；肝血管瘤无AFP升高、增强呈渐进填充。","《内科学》第9版·消化系统疾病·原发性肝癌","green"],["2020N80A","对上述诊断意义最大的实验室检查结果是",["血 ALT和AST升高","血 AFP持续升高>400 ng/ml","血 ALT、AFP和白细胞计数基本正常","血白细胞计数和中性粒细胞比例升高"],"B","A","内科学",2020,"real","内科学|其他","AFP对肝癌的诊断价值","AFP持续>400ng/ml并排除妊娠、生殖腺胚胎肿瘤及活动性肝病，是肝癌诊断的重要血清学依据；AFP与影像（增强CT/MRI见“快进快出”）结合即可临床诊断。ALT、AST升高仅提示肝细胞损伤；AFP与白细胞正常反而提示非炎症性；白细胞及中性粒升高提示感染。","《内科学》第9版·消化系统疾病·原发性肝癌","green"],["2020N81A","最有确定诊断价值的辅助检查是",["腹部 B超","腹部CT","肝穿刺病理学检查","肝动脉造影"],"C","A","内科学",2020,"real","内科学|其他","肝癌的病理确诊","肝穿刺活组织病理检查可获得组织学确诊，是肝癌最有确定诊断价值（金标准）的方法。腹部B超为筛查首选；增强CT/MRI是临床诊断的主要影像依据，但非病理确定；肝动脉造影主要用于介入治疗前的评估。","《内科学》第9版·消化系统疾病·原发性肝癌","green"],["2020N82A","该患者最可能的临床诊断是",["急性肾小球肾炎","急进性肾小球肾炎","肾病综合征","慢性肾小球肾炎急性发作"],"C","A","内科学",2020,"real","内科学|泌尿系统疾病","肾病综合征的诊断标准","大量蛋白尿（>3.5g/d）、低白蛋白血症（<30g/L）、明显水肿及高脂血症四项具备，符合肾病综合征诊断。急性肾炎以血尿、高血压、C3降低为主且蛋白尿多<3.5g/d；急进性肾炎伴肾功能急剧恶化、少尿；慢性肾炎急性发作有慢性病史及肾功能损害。","《内科学》第9版·泌尿系统疾病·肾病综合征","green"],["2020N83A","该患者最可能的病理诊断是",["毛细血管内肾小球肾炎","新月体性肾小球肾炎","系膜毛细血管性肾小球肾炎","微小病变型肾病"],"D","A","内科学",2020,"real","内科学|泌尿系统疾病","微小病变型肾病","成人肾病综合征最常见的病理类型为微小病变型（儿童占80%以上、成人约10%～15%且多为年轻男性），光镜下肾小球基本正常，电镜下足突广泛融合，对糖皮质激素高度敏感（90%缓解）。毛细血管内增生性见于急性肾炎；新月体性见于急进性肾炎；系膜毛细血管性多见于中青年伴补体持续降低。","《内科学》第9版·泌尿系统疾病·微小病变型肾病","green"],["2020N84A","最主要的治疗药物是",["醋酸泼尼松","环磷酰胺","醋酸泼尼松联合环磷酰胺","辛伐他汀"],"A","A","内科学",2020,"real","内科学|其他","微小病变的激素治疗","微小病变型肾病对糖皮质激素高度敏感，首选单一足量糖皮质激素（泼尼松1mg/kg·d，晨顿服，8～12周后缓慢减量，总疗程6～12个月）。环磷酰胺用于激素依赖或频繁复发者；激素联合环磷酰胺不作初始方案；辛伐他汀仅调脂对症。","《内科学》第9版·泌尿系统疾病·肾病综合征","green"],["2020N85A","该患者最可能的诊断是",["缺铁性贫血","地中海贫血","慢性病性贫血","巨幼细胞贫血"],"A","A","内科学",2020,"real","内科学|血液系统疾病","缺铁性贫血的诊断","小细胞低色素性贫血伴血清铁蛋白降低、血清铁降低、总铁结合力升高是缺铁性贫血的典型表现；若有慢性失血（月经过多、消化道出血）史更支持。地中海贫血有家族史、血红蛋白电泳异常、铁蛋白不低；慢性病性贫血总铁结合力降低；巨幼贫为大细胞性、MCV升高。","《内科学》第9版·血液系统疾病·缺铁性贫血","green"],["2020N86A","确诊的最佳实验室检查是",["外周血网织红细胞计数","血清铁、铁蛋白测定","血红蛋白电泳","血清叶酸、维生素 B，测定"],"C","A","内科学",2020,"real","内科学|其他","缺铁性贫血的确诊检查","缺铁性贫血的确诊应依靠铁代谢指标：血清铁蛋白降低（<12～15μg/L）、血清铁降低、总铁结合力升高、转铁蛋白饱和度<15%，必要时骨髓铁染色示细胞外铁消失，故B最合适；血红蛋白电泳用于诊断地中海贫血。⚠️原答案存疑，所录答案C（血红蛋白电泳）应为地中海贫血的确诊检查，与第85题“缺铁性贫血”不匹配，疑为答案或选项错配。","《内科学》第9版·血液系统疾病·缺铁性贫血","yellow"],["2020N87A","下列各项对明确贫血病因最有意义的是",["询问饮食情况及舌检查","询问既往患病史","询问详细月经情况及妇科检查","询问贫血家族史"],"C","A","内科学",2020,"real","内科学|其他","缺铁性贫血的病因追查","育龄女性缺铁性贫血最常见的病因是慢性失血，尤其月经过多，故详细询问月经量、周期、经期天数并做妇科检查（排除子宫肌瘤、腺肌症、功血）对明确病因最有意义。饮食、既往病史、家族史价值次之。","《内科学》第9版·血液系统疾病·缺铁性贫血","green"],["2020N88A","该患者应首先考虑的疾病诊断是",["甲状腺功能减退症","扩张型心肌病","结核性心包炎","干燥综合征"],"B","A","内科学",2020,"real","内科学|循环系统疾病","继发性心肌损害的病因鉴别","患者有心脏扩大、心功能不全表现，超声示心腔扩大、室壁弥漫性运动减弱，首先考虑扩张型心肌病。甲减可有心包积液但心肌收缩力改变不明显；结核性心包炎以发热、心包增厚为特点；干燥综合征心脏受累少见。⚠️原答案存疑，同组第89题选抗ENA抗体谱、第90题选口服糖皮质激素，提示最终诊断为结缔组织病（如系统性红斑狼疮/干燥综合征）累及心脏，与本题“扩张型心肌病”不一致。","《内科学》第9版·循环系统疾病·扩张型心肌病","yellow"],["2020N89A","为确诊，最有价值的检查项目是",["NT-proBNP]","T-SPOT TB","TPOAb","抗 ENA抗体谱"],"D","A","内科学",2020,"real","内科学|其他","抗ENA抗体谱的诊断价值","多系统损害（关节痛、口干眼干、皮疹、浆膜炎、血细胞减少）伴心肌/心包受累者，查抗ENA抗体谱（抗dsDNA、抗Sm、抗SSA/SSB、抗RNP）最有价值，可确定具体结缔组织病。NT-proBNP仅反映心功能；T-SPOT用于结核；TPOAb用于自身免疫性甲状腺炎。","《内科学》第9版·风湿性疾病·系统性红斑狼疮","green"],["2020N90A","应选择的治疗是",["口服糖皮质激素","口服左甲状腺素","口服利尿剂","抗结核治疗"],"A","A","内科学",2020,"real","内科学|其他","SLE心脏受累的激素治疗","结缔组织病（SLE等）所致心脏受累（心肌炎、心包炎）以免疫抑制为基础治疗，首选口服糖皮质激素，中重度可联合免疫抑制剂。左甲状腺素用于甲减；利尿剂仅缓解淤血症状；抗结核用于结核性心包炎。","《内科学》第9版·风湿性疾病·系统性红斑狼疮","green"],["2020N91A","该患者最可能的诊断是",["干燥综合征 正","系统性红斑狼疮","类风湿关节炎","糖尿病"],"A","A","内科学",2020,"real","内科学|风湿免疫","干燥综合征的诊断","中年女性口干、眼干、猖獗龋齿、腮腺反复肿大伴关节痛、肾小管酸中毒，符合干燥综合征。系统性红斑狼疮有蝶形红斑、抗dsDNA阳性、肾小球受累为主；类风湿关节炎以小关节对称性肿痛、骨侵蚀为主；糖尿病无口眼干燥特征。","《内科学》第9版·风湿性疾病·干燥综合征","green"],["2020N92A","最有诊断价值的实验室检查是",["血清抗 Sm抗体","空腹血糖","血清 RF","血清抗 SSA、抗 SSB抗体"],"D","A","内科学",2020,"real","内科学|其他","抗SSA/SSB抗体","抗SSA（Ro）和抗SSB（La）抗体是干燥综合征的标志性自身抗体，阳性率分别为70%～80%和40%～50%，结合唇腺活检可确诊。抗Sm抗体为SLE特异性；空腹血糖诊断糖尿病；RF在干燥综合征可阳性但特异性差。","《内科学》第9版·风湿性疾病·干燥综合征","green"],["2020N94A","下列进一步治疗措施中，首选的是",["胆道镜取石","Whipple 手术","肝外胆管切除、胆肠吻合术","拔除 T管，继续观察"],"C","A","内科学",2020,"real","内科学|其他","胆管癌的手术方式","胆管癌（或胆总管中上段肿瘤）已明确而无远处转移，首选胆管切除加胆肠Roux-en-Y吻合重建胆道，争取根治。胆道镜取石用于结石；Whipple手术用于壶腹周围及胰头癌；单纯拔T管观察会延误治疗。","《外科学》第9版·胆道疾病·胆管癌","green"],["2020N95A","患者术前处理措施中，正确的是",["血压降至130/90 mmHg 再手术","血糖降至6.1 mmol/L再手术","血糖、血压均正常后再手术","不需特殊处理，可手术"],"D","A","内科学",2020,"real","内科学|其他","急症手术的术前准备","急腹症（如急性胆囊炎、阑尾炎穿孔等）需急诊手术时，轻中度血压、血糖升高不构成手术禁忌，应边控制边手术，不必等待指标完全正常，否则延误手术时机、增加穿孔与感染风险。故不需特殊处理即可手术。","《外科学》第9版·围手术期处理·急症手术准备","green"],["2020N96A","患者行腹腔镜胆囊切除术，手术顺利。术后前3天引流管微黄清亮液体15～20 mL./天，拔除 引流管。术后10天觉右上腹不适来院复查，T37.2℃，血 WBC9.0×10°/L，N75??B超发 现胆囊窝处 4～5 cm 液性暗区，穿刺抽出黄色液体似胆汁。最合理的处理是",["穿刺置管引流","局部理疗","加用抗生素","手术引流]"],"A","A","外科学",2020,"real","外科学|外科总论","术后胆漏的处理","腹腔镜胆囊切除术后胆囊窝出现4~5cm液性暗区、穿刺抽出胆汁样液体，而体温与白细胞基本正常，考虑胆囊床迷走胆管或胆囊管残端漏形成的包裹性积液（局限性胆漏）。此类漏量少、已局限，首选超声引导下穿刺置管引流，多可自行闭合，选A。局部理疗、单纯加用抗生素不能引流积液；无弥漫性腹膜炎时不必手术，B、C、D不选。","《外科学》第9版·普通外科·胆道疾病·胆囊切除术后并发症","green"],["2020N97A","可能的诊断是",["恶性变","囊内出血","亚急性甲状腺炎","桥本甲状腺炎"],"A","A","内科学",2020,"real","内科学|内分泌与代谢","甲状腺结节恶变征象","甲状腺结节短期内迅速增大、质硬固定，伴声音嘶哑或颈淋巴结肿大，需高度警惕恶性变（甲状腺癌）。囊内出血多伴突发疼痛、短期增大后自行缩小；亚急性甲状腺炎有发热、颈前剧痛、ESR增快；桥本甲状腺炎为弥漫质韧、TPOAb强阳性。","《外科学》第9版·甲状腺疾病·甲状腺癌","green"],["2020N98A","此时最适宜的处理是",["对症治疗","甲状腺大部切除术","穿刺抽液","甲状腺结节切除术"],"D","A","内科学",2020,"real","内科学|内分泌与代谢","可疑甲状腺结节的手术决策","对可疑恶变的甲状腺单发结节，宜行包括结节在内的腺叶切除（或腺叶加峡部切除）送冰冻病理，既明确诊断又达到治疗目的。单纯穿刺抽液对实性可疑结节无诊疗价值；甲状腺大部切除范围过大；单纯对症观察延误诊断。","《外科学》第9版·甲状腺疾病·甲状腺结节的处理","green"],["2020N99A","两年后复查 B超发现右叶腺体有沙粒样钙化。拟行的治疗方案是",["继续保守治疗","右叶全切、左叶次全切除术","右叶全切除术","双叶次全切除术"],"B","A","内科学",2020,"real","内科学|其他","甲状腺癌的手术范围","右叶发现沙粒样钙化（微小钙化）为甲状腺乳头状癌的典型超声征象，提示恶性，应行患侧腺叶全切加对侧次全切除（近全切除），并根据淋巴结情况清扫。继续保守会延误；仅右叶全切对侧叶病变处理不足；双叶次全切除保留过多腺体、复发风险高。","《外科学》第9版·甲状腺疾病·甲状腺癌的手术范围","green"],["2020N100A","应采取的手术方式是",["乙状结肠造口术","Miles 术","Dixon术","Hartmann 术"],"C","A","外科学",2020,"real","外科学|其他","Dixon术适应证","本题为病例组续问，原始病例的部位与分期信息未随题干保留。按答案C，该例行Dixon术，即经腹直肠癌切除、结肠直肠端端吻合，适用于距肛缘>5cm、能根治切除并保留肛门的直肠癌，其优点是保留肛门、生活质量好。若为下段癌或合并急性梗阻、全身情况差，则应选Miles术或Hartmann术。⚠️题干信息缺失，按答案推演，存疑。","《外科学》第9版·普通外科·直肠癌·手术方式","yellow"],["2020N101A","术后化疗5个疗程。2年后复查CT，发现左肝2个直径 2～3cm结节，边缘清晰，强化明 显，呈\"牛眼征\"。最可能的诊断是",["直肠癌肝转移","原发性肝癌 1","肝多发血管瘤","多发肝囊肿"],"A","A","内科学",2020,"real","内科学|消化系统疾病","结直肠癌肝转移的影像特点","结直肠癌术后2年出现肝内多发结节，增强扫描呈“牛眼征”（中心低密度、周边环形强化），为典型肝转移瘤表现。原发性肝癌多伴肝硬化、AFP升高，强化呈快进快出；肝血管瘤增强呈周边结节状渐进填充；肝囊肿无强化。","《外科学》第9版·结直肠癌·肝转移","green"],["2020N102A","此时最合理的治疗方法是",["继续化疗1","左半肝切除术","观察","介入治疗"],"B","A","内科学",2020,"real","内科学|其他","肝转移瘤的手术切除指征","结直肠癌肝转移若病灶局限于左半肝（2个、2～3cm）、无肝外转移且余肝代偿良好，最合理的是手术切除（左半肝切除），5年生存率可达30%～50%。继续化疗、观察均放弃根治机会；介入治疗用于不可切除者。","《外科学》第9版·结直肠癌·肝转移的治疗","green"],["2020N103A","应首先考虑的诊断是",["桡骨头脱位","尺骨骨折","桡骨骨折","尺、桡骨骨折"],"D","A","内科学",2020,"real","内科学|其他","尺桡骨双骨折的诊断","前臂外伤后局部肿胀、畸形、反常活动及骨擦音，X线示尺骨与桡骨同时骨折，故为尺、桡骨骨折。单纯桡骨头脱位表现为肘外侧隆起、弹性固定；单一尺骨或桡骨骨折不能解释两处骨皮质中断。","《外科学》第9版·上肢骨骨折·尺桡骨骨折","green"],["2020N104A","该患者治疗方案选择手法复位外固定的依据是",["受伤时间较短的开放性骨折","稳定性骨折","神经血管损伤","合并肌腱损伤"],"B","A","内科学",2020,"real","内科学|其他","骨折保守治疗指征","尺桡骨双骨折选择手法复位外固定的依据是骨折属稳定性骨折（横形或短斜形、无明显移位、复位后位置可维持）。开放性骨折、合并神经血管损伤、合并肌腱损伤均为手术（切开复位内固定）指征，不能靠手法复位。","《外科学》第9版·上肢骨骨折·尺桡骨骨折治疗","green"],["2020N105A","患者经手法复位，小夹板固定4小时后，感觉患肢剧痛，手指麻木，肿胀，活动时疼痛加重，可 能的原因是",["神经损伤","骨筋膜室综合征","急性骨髓炎","缺血性骨坏死"],"B","A","内科学",2020,"real","内科学|其他","骨筋膜室综合征的早期识别","小夹板固定后4小时出现患肢剧痛、手指麻木、肿胀、被动牵拉痛，是骨筋膜室综合征的典型早期表现，因包扎过紧致筋膜室内压升高、肌肉神经缺血，须立即松解固定、必要时切开减压，否则可致Volkmann缺血性挛缩。神经损伤早期以感觉运动障碍为主而无剧痛肿胀；骨髓炎、骨坏死出现较晚。","《外科学》第9版·骨折并发症·骨筋膜室综合征","green"],["2020N106A","最可能的诊断是",["骨样骨瘤","骨肉瘤","骨软骨瘤","骨巨细胞瘤"],"C","A","内科学",2020,"real","内科学|其他","骨软骨瘤的诊断","青少年长骨干骺端背向关节方向生长的骨性突起，表面有软骨帽、与髓腔相通，无症状，为骨软骨瘤（外生骨疣），属良性。骨样骨瘤表现为夜间痛、服水杨酸类可缓解、瘤巢；骨肉瘤见于青少年干骺端，骨破坏伴Codman三角、日光放射状骨膜反应；骨巨细胞瘤位于骨端呈肥皂泡样改变。","《外科学》第9版·骨肿瘤·骨软骨瘤","green"],["2020N107A","目前应该采取的处理是",["根治性瘤段切除、假体植入","放化疗加免疫治疗","肿瘤切除术","不需治疗，观察"],"D","A","内科学",2020,"real","内科学|其他","骨软骨瘤的处理原则","无症状的骨软骨瘤无需治疗，定期随访观察即可；仅在出现疼痛、压迫症状、影响关节活动、生长迅速疑恶变或影响外观时行肿瘤切除。根治性瘤段切除加假体植入、放化疗均属过度治疗。","《外科学》第9版·骨肿瘤·骨软骨瘤","green"],["2020N108A","某青年乘客在高铁上突发心脏病，一位医生听到广播后立刻赶到现场实施急救，并协助联系 下一站医院做好接治准备。由于抢救及时，措施到位，挽回了患者年轻的生命。此事件集中 体现的医学人道主义精神是",["救死扶伤","互助关爱","见义勇为","严谨求实"],"A","A","内科学",2020,"real","内科学|其他","医学人道主义精神","医生在高铁上听到广播立即施救并联系接诊医院，体现了医学人道主义中“救死扶伤”的核心精神——以救治生命为最高职责、不计报酬与场所。互助关爱、见义勇为属社会公德层面，严谨求实属科学作风，均不能涵盖其职业伦理内核。","《医学伦理学》·医学道德原则·救死扶伤","green"],["2020N109A","医生诊治患者时，恰当的沟通语言是",["\"医学上的东西跟你说多了你也不懂!\"","\"回去后请按要求服药，否则达不到治疗效果!\"","\"多长时间能治好，我也不知道!\"","\"你为什么不听医生的话，下次再这样就不要来找我了!\""],"B","A","内科学",2020,"real","内科学|其他","医患沟通用语规范","恰当沟通应体现尊重、清晰与建设性：“请按要求服药，否则达不到疗效”既说明医嘱要求又交代后果，属可接受表达。A、D含贬低与威胁语气，损害医患信任；C推卸责任、缺乏专业性，均不合适。","《医学伦理学》·医患沟通·语言沟通技巧","green"],["2020N110A","女性，35岁。诊断为子宫肌瘤，需手术治疗。术中发现右侧卵巢有一个囊肿，可一并切除。 这种情况下，医生与患者家属正确的沟通方式是 A.等做完手术后再与患者及家属说明",["立即报告疾控中心，并暂时隔离患者家属 B.尊重患者家属行动自由的权利 C.不能隔离患者家属，因其尚未明确诊断为 SARS D.告知患者家属回家自行隔离","手术继续进行，派助手口头通知患者家属需扩大手术范围","先缝合手术切口，待与患者家属沟通好再行囊肿切除手术","立即与患者家属沟通，取得书面同意后行囊肿切除术 11l.2003年 SARS流行期间，某医院急诊室收治一名 SARS重症患者，其家属陪同就诊，未采取 任何防护措施。在对患者积极救治的同时，医生对患者家属的正确做法是"],"D","A","外科学",2020,"real","外科学|外科总论","术中扩大手术范围的知情同意","术中意外发现卵巢囊肿需扩大手术范围，属于原定方案之外的处置，必须再次履行知情同意：立即向家属说明病情、手术必要性、风险与替代方案，取得书面同意后实施，故选D。术后再说明侵犯知情同意权；仅派助手口头通知不符合书面同意要求；先缝合切口再沟通会延误治疗并增加二次手术风险。⚠️本题题干与选项混入了SARS隔离题（第111题）的内容，按本题真实知识点作答。","《医学伦理学》·医患关系·知情同意","yellow"],["2020N112A","医疗中患者的健康信息属于保密范围，医生为患者保密是医生的义务，但不是绝对义务。据 此，下列医生的做法能够得到伦理辩护的是",["将肿瘤患者的病理诊断结果告知前来询问的单位领导","按照保险公司要求医生向保险公司提供患者的病历资料","将麻疹患者的信息上报相关部门","将梅毒患者的感染信息告知前来探视的同事"],"C","A","人文",2020,"real","人文|医学伦理","保密的法定例外","保密义务不是绝对义务，法定传染病报告、保护他人重大利益等属例外。麻疹是法定报告传染病，医生按规定将患者信息上报相关部门，既是履行法定义务，也使公共卫生与他人免受感染，可获伦理辩护。A、B、D分别向单位领导、保险公司、探视同事透露，均无法律依据，超出必要限度，侵犯患者隐私。故选C。","《医学伦理学》第9版·临床诊疗伦理·保密义务及其例外","green"],["2020N113A","临床医疗情境下，知情同意最重要的伦理意义是",["充分尊重患者的自主性和医疗决策权，由患者本人做出有关其个人的医疗决策","对医疗中可能发生的种种风险和不适进行充分描述，因此有重要的医学防御意义","患者有义务询问对自己医疗干预的益处和风险，据此医生向患者提供相关信息","向患者提供帮其做出最佳决策的信息和医疗建议，获得患者许可并授权医生治疗"],"D","A","人文",2020,"real","人文|医学伦理","知情同意的伦理意义","知情同意不是一张签字，而是医生以患者能理解的方式告知病情、拟行方案、预期受益与风险及替代方案，患者理解后作出许可，从而授权医生实施诊疗，使干预获得正当性。A只强调患者自我决定而未含告知与授权环节，B以防御性目的替代伦理意义，C把询问义务推给患者，均偏离本意。故选D。","《医学伦理学》第9版·临床诊疗伦理·知情同意","green"],["2020N114A","《纽伦堡法典》是 1946年审判纳粹战犯的纽伦堡军事法庭决议的一部分，涉及到人体试验的 十个道德要求，其第一条是",["试验应该立足于充分的动物实验已经获得的结果","试验前获得受试者的自愿同意是绝对必要的","试验的危险性不得超过试验目的的人道主义重要性","事先确信会发生死亡或残疾的试验一律不得进行"],"D","A","人文",2020,"real","人文|医学伦理","纽伦堡法典第一条","《纽伦堡法典》十项道德要求的第一条即：受试者的自愿同意是绝对必要的，这是人体试验正当性的前提；B正是该条。D（事先确信会发生死亡或残疾的试验一律不得进行）属法典中对风险限制的要求，不是第一条；A立足于充分的动物实验、C危险性不得超逾人道主义重要性也都是后续条款的内容。⚠️原答案存疑，理由：《纽伦堡法典》第一条为受试者自愿同意绝对必要，应为B，而非D。","《医学伦理学》第9版·医学科研伦理·人体试验的伦理文献","yellow"],["2020N115A","按照《医疗事故处理条例》的规定，下列描述符合二级医疗事故的是 A.造成患者重度残疾",["B、C、D是其下两道小题的备选项，请从 中选择一项最符合题目要求的，每个选项可以被选择一次或两次。 A. 脑血管 C.内脏血管 B.皮肤血管 D.骨骼肌血管","造成患者明显人身损害的其他后果","造成患者轻度残疾、器官组织损伤导致一般功能障碍","造成患者中度残疾，器官组织损伤导致严重功能障碍 二、B型题∶116～135 小题，每小题1.5分，共30分"],"D","A","人文",2020,"real","人文|卫生法规","二级医疗事故的认定","医疗事故按对患者人身造成的损害程度分四级：一级为死亡、重度残疾；二级为中度残疾、器官组织损伤导致严重功能障碍；三级为轻度残疾、器官组织损伤导致一般功能障碍；四级为明显人身损害的其他后果。故二级对应D。A属一级，C属三级，B属四级，注意以「残疾程度加功能障碍程度」双重条件判断。","《医疗事故处理条例》·医疗事故的分级","green"],["2020N116B","交感缩血管神经纤维支配密度最高的血管是",["脑血管","皮肤血管","内脏血管","骨骼肌血管"],"B","B","外科学",2020,"real","外科学|其他","交感缩血管纤维分布密度","交感缩血管神经纤维在皮肤血管分布最密集，其次为骨骼肌与内脏血管，脑血管最少。皮肤血管强烈收缩可减少皮肤血流量与散热，是体温调节的重要效应途径，故密度最高为皮肤血管，选B。内脏血管次之；骨骼肌血管虽然舒缩幅度大但支配密度较低；脑血管以自身调节为主，A、C、D不选。","《生理学》第9版·血液循环·血管的神经支配","green"],["2020N117B","交感缩血管神经纤维支配密度最低的血管是",["脑血管","皮肤血管","内脏血管","骨骼肌血管"],"A","B","外科学",2020,"real","外科学|其他","脑血管的神经支配特点","交感缩血管神经纤维在脑血管分布最少，脑血流量主要依靠肌源性自身调节与局部代谢产物（腺苷、CO2、H+）调节，神经调节居次要地位，故密度最低为脑血管，选A。皮肤、内脏与骨骼肌血管均有较丰富的交感缩血管支配，以皮肤最密，B、C、D不选。","《生理学》第9版·血液循环·器官循环","green"],["2020N118B","患者除听不懂别人说话外，其他语言认知功能均正常，听力无障碍，其皮层损伤部位是",["Broca 区","颞上回后部","Wernicke 区","顶下小叶角回"],"B","B","外科学",2020,"real","外科学|其他","感觉性失语定位","患者听力正常、能发音但听不懂别人说话，其他语言功能完好，为感觉性失语（Wernicke失语），病变位于优势半球颞上回后部，即Wernicke区，故按解剖部位选B（C为同一区的功能命名）。Broca区损伤为运动性失语；角回损伤引起失读症，A、D不选。","《生理学》第9版·神经系统的功能·大脑皮层语言中枢","green"],["2020N119B","患者除自己不会说话外，其他语言认知功能均正常，发音无障碍，其皮层损伤部位是",["Broca 区","颞上回后部","Wernicke 区","顶下小叶角回"],"A","B","外科学",2020,"real","外科学|其他","运动性失语定位","患者发音器官正常、理解能力保留但不能说出有意义的言语，为运动性失语（Broca失语），病变位于优势半球额下回后部Broca区，故选A。颞上回后部（Wernicke区）损伤引起感觉性失语；角回损伤引起失读；构音障碍属发音肌肉或神经病变，与本题不符，B、C、D不选。","《生理学》第9版·神经系统的功能·大脑皮层语言中枢","green"],["2020N120B","参与嘌呤核苷酸从头合成途径的主要关键酶是",["酰胺转移酶","天冬氨酸氨基甲酰基转移酶","次黄嘌呤-鸟嘌呤磷酸核糖转移酶","尿苷/胞苷激酶"],"A","B","生物化学",2020,"real","生物化学|核苷酸代谢","嘌呤合成的关键酶","嘌呤核苷酸从头合成的关键酶是PRPP酰胺转移酶（磷酸核糖酰胺转移酶），催化PRPP生成5-磷酸核糖胺，受AMP、GMP、IMP的反馈抑制。天冬氨酸氨基甲酰基转移酶是嘧啶合成关键酶；HGPRT是嘌呤补救酶；尿苷/胞苷激酶参与嘧啶补救。","《生物化学与分子生物学》第9版·核苷酸代谢·嘌呤核苷酸从头合成","green"],["2020N121B","参与喀啶核苷酸从头合成途径的主要关键酶是",["酰胺转移酶","天冬氨酸氨基甲酰基转移酶","次黄嘌呤-鸟嘌呤磷酸核糖转移酶","尿苷/胞苷激酶"],"B","B","生物化学",2020,"real","生物化学|核苷酸代谢","嘧啶合成的关键酶","嘧啶核苷酸从头合成的关键酶是天冬氨酸氨基甲酰基转移酶（在细菌为ATC酶），催化氨基甲酰磷酸与天冬氨酸缩合，受UTP反馈抑制、PRPP激活；哺乳动物该步骤与氨基甲酰磷酸合成酶Ⅱ、二氢乳清酸酶构成CAD多酶复合体。A为嘌呤合成酶，C、D为补救途径酶。","《生物化学与分子生物学》第9版·核苷酸代谢·嘧啶核苷酸从头合成","green"],["2020N122B","转运肝合成的内源性胆固醇至全身组织的脂蛋白是",["CM","VLDL","LDL","HDL"],"C","B","生物化学",2020,"real","生物化学|脂类代谢","LDL的功能","LDL由VLDL在血中代谢转变而来，富含胆固醇酯，含apoB100，通过肝外组织的LDL受体被摄取，把肝合成的内源性胆固醇转运至全身组织。CM运输外源性甘油三酯，VLDL主要运内源性甘油三酯，HDL参与胆固醇逆转运。","《生物化学与分子生物学》第9版·脂类代谢·血浆脂蛋白","green"],["2020N123B","将肝外组织细胞的胆固醇转运至肝脏的脂蛋白是",["CM","VLDL","LDL","HDL"],"A","B","生物化学",2020,"real","生物化学|脂类代谢","HDL与胆固醇逆转运","将肝外组织（包括血管壁）多余胆固醇转运回肝进行代谢处理的过程称胆固醇逆转运，由HDL承担：新生HDL经apoAⅠ激活LCAT酯化胆固醇、逐步成熟为HDL3/HDL2，最终经SR-B1将胆固醇送入肝。CM负责运输外源性甘油三酯。故应选HDL。⚠️原答案A（CM）与教材不符，CM不参与胆固醇逆转运。","《生物化学与分子生物学》第9版·脂类代谢·血浆脂蛋白","yellow"],["2020N124B","急性细菌性炎症的早期主要渗出细胞是",["中性粒细胞","巨噬细胞","嗜酸性粒细胞","淋巴细胞"],"A","B","外科学",2020,"real","外科学|其他","急性炎症早期的炎细胞","急性细菌性炎症早期（6~24小时）以中性粒细胞渗出为主，其趋化、吞噬与杀菌能力最强，是化脓性炎的主要渗出细胞，故选A。巨噬细胞在24~48小时后成为主要浸润细胞；嗜酸性粒细胞见于寄生虫感染与过敏；淋巴细胞见于病毒感染与慢性炎症，B、C、D不选。","《病理学》第9版·炎症·炎细胞的种类与作用","green"],["2020N125B","寄生虫感染性炎症的早期主要渗出细胞是",["中性粒细胞","巨噬细胞","嗜酸性粒细胞","淋巴细胞"],"C","B","外科学",2020,"real","外科学|外科总论","寄生虫感染与嗜酸性粒细胞","寄生虫感染（尤其蠕虫）与过敏反应时，嗜酸性粒细胞在趋化因子作用下大量渗出，其颗粒含主要碱性蛋白、嗜酸性阳离子蛋白，可杀伤虫体，故选C。中性粒细胞见于急性细菌感染；巨噬细胞见于慢性炎症后期；淋巴细胞见于病毒感染与慢性炎症，A、B、D不选。","《病理学》第9版·炎症·炎细胞的种类与作用","green"],["2020N126B","儿童淋巴细胞肿瘤中，常以白血病形式发病的肿瘤是",["前体B细胞肿瘤","前体T细胞肿瘤","成熟B细胞肿瘤","成熟 T细胞肿瘤"],"A","B","内科学",2020,"real","内科学|血液系统疾病","淋巴母细胞肿瘤的发病形式","前体B细胞淋巴母细胞白血病/淋巴瘤（B-ALL/LBL）在儿童中绝大多数以急性白血病形式发病，骨髓原始细胞≥20%，表现为贫血、出血、骨痛。前体T细胞肿瘤多以纵隔肿块起病；成熟B、T细胞肿瘤多以淋巴瘤形式发病。","《内科学》第9版·血液系统疾病·急性淋巴细胞白血病","green"],["2020N127B","儿童淋巴细胞肿瘤中，常以淋巴瘤形式发病的肿瘤是",["前体B细胞肿瘤","前体T细胞肿瘤","成熟B细胞肿瘤","成熟 T细胞肿瘤"],"C","B","内科学",2020,"real","内科学|血液系统疾病","儿童成熟B细胞肿瘤的表现","成熟B细胞肿瘤（如Burkitt淋巴瘤、弥漫大B细胞淋巴瘤、滤泡性淋巴瘤）在儿童中常以结外肿块或淋巴结肿大（淋巴瘤形式）发病，骨髓受累相对少。前体B、T细胞肿瘤以白血病形式为主，故本题选成熟B细胞肿瘤。","《内科学》第9版·血液系统疾病·淋巴瘤","green"],["2020N128B","男性，52岁。10天前发热、咽痛，1天来突感心前区锐痛，呈持续性，向左肩放射，活动时加重。 既往有高血压病6年。查体∶T37.5℃，P 88次/分，BP160/90 mmHg;双肺（-），胸骨左缘3、 4肋间可闻及粗糙抓刮样音，收缩期明显，双侧脉搏对称。该患者最可能的诊断是",["急性心包炎","急性心肌炎","急性感染性心内膜炎","心脏压塞"],"C","B","内科学",2020,"real","内科学|循环系统疾病","心包摩擦音的识别","发热咽痛后出现心前区持续性锐痛、向肩部放射、活动及吸气加重，胸骨左缘3～4肋间闻及抓刮样（心包摩擦音），符合急性心包炎（病毒性/特发性）。心肌炎以心悸、心律失常、心肌酶升高为主；感染性心内膜炎有发热、新出现的心脏杂音、栓塞及血培养阳性；心脏压塞有低血压、颈静脉怒张、心音遥远。⚠️原答案存疑，所录答案C（急性感染性心内膜炎）与抓刮样心包摩擦音不符，应为急性心包炎。","《内科学》第9版·循环系统疾病·急性心包炎","yellow"],["2020N129B","女性，46岁。10天前有发热、恶心、腹泻，2 天来心悸伴心前区闷痛，活动后明显加重，夜间 睡眠中有憋气感。既往体健。查体∶T37.6 ℃，P 110 次/分，BP 110/65 mmHg，双肺底偶 闻及湿啰音，心律整，心尖部可闻及S、奔马律，肝未及。该患者最可能的诊断是",["急性心包炎","急性心肌炎","急性感染性心内膜炎","心脏压塞"],"B","B","外科学",2020,"real","外科学|外科总论","急性病毒性心肌炎诊断","患者青年女性，有发热、恶心、腹泻的前驱感染史，随后出现心悸、心前区闷痛、心率增快、心尖部S3及奔马律与双肺底湿啰音，提示病毒性心肌炎合并左心功能不全，故选B。急性心包炎以心包摩擦音与心包积液为特点，无奔 碱","神经生长因子"],"AD","X","生物化学",2020,"real","生物化学|酶","酪氨酸激酶受体的配体","酪氨酸激酶受体（受体型酪氨酸激酶）的配体包括胰岛素、胰岛素样生长因子、表皮生长因子、神经生长因子、血小板源生长因子等生长因子类。肾上腺素、乙酰胆碱均作用于G蛋白偶联受体，不激活酪氨酸激酶受体，故不选B、C。","《生物化学与分子生物学》第9版·细胞信号转导·酪氨酸激酶受体","green"],["2020N137X","下列关于一氧化氮对循环系统作用的描述，正确的有",["抑制血管平滑肌细胞增殖","使血管平滑肌细胞膜发生超极化","抑制血小板黏附，防止血栓形成","降低血管平滑肌胞质内游离Ca2浓度"],"ACD","X","外科学",2020,"real","外科学|其他","NO对循环系统的作用","NO由内皮型NOS催化L-精氨酸生成，激活鸟苷酸环化酶使cGMP升高，经PKG降低血管平滑肌胞质游离Ca2+而舒张血管（D）；并可抑制血管平滑肌细胞增殖（A）、抑制血小板黏附与聚集而防止血栓形成（C）。B错，NO以降低胞质Ca2+为主要机制，并非通过细胞膜超极化发挥作用。","《生理学》第9版·血液循环·血管内皮的内分泌功能","green"],["2020N138X","当发生气胸时，对机体功能活动的危害有",["引起肺气肿","吸气阻力增大","呼气阻力增大","阻碍静脉和淋巴回流"],"CD","X","外科学",2020,"real","外科学|胸心外科","气胸对呼吸循环的影响","气胸时胸膜腔内压升高甚至转为正压，压迫肺组织使肺萎陷、气道受压，呼气阻力增大（C）；正压压迫腔静脉与淋巴管，阻碍静脉与淋巴回流，回心血量与心搏出量减少（D）。A错，肺气肿是慢性气道疾病的病理状态，并非气胸所致；B吸气阻力增大不是气胸的主要危害，气胸的核心危害是肺萎陷与通气/血流比失调。","《生理学》第9版·呼吸·肺通气的阻力与胸膜腔内压","green"],["2020N139X","人在进食后可增强胃排空的因素有",["促胃液素","肠-胃反射","迷走-迷走反射","壁内神经丛反射"],"CD","X","生理学",2020,"real","生理学|消化和吸收","胃排空的促进与抑制因素","进食后胃扩张可经迷走-迷走长反射（C）和壁内神经丛短反射（D）增强胃运动和胃排空。促胃液素虽促胃酸分泌，但同时增强幽门括约肌收缩，总体延缓排空，A不符；肠-胃反射由十二指肠内酸、脂肪、高渗液引起，抑制胃排空，B不符。故选C、D。","《生理学》第9版·消化和吸收·胃内消化","green"],["2020N140X","下列关于肾脏分泌 NH。和 NH7的描述，正确的有",["近端小管主要泌 NH\"","集合管主要泌 NH3","与泌H密切相关","与重吸收 HCO7密切相关"],"CD","X","外科学",2020,"real","外科学|其他","肾小管泌氨与酸碱平衡","肾小管各段均参与排酸保碱：近端小管以NH4+形式排泌氨，远端小管与集合管以NH3形式扩散排泌，二者均与H+分泌及HCO3-重吸收密切相关——泌氨可中和管液中H+，促进HCO3-重吸收，起排酸保碱作用，故C、D正确。⚠️按教材，A（近端小管主要泌NH4+）与B（集合管主要泌NH3）亦为正确表述，原答案未选A、B存疑。","《生理学》第9版·尿的生成和排出·肾小管与集合管的分泌","yellow"],["2020N141X","在下列情况下，可使骨骼肌肌梭Ⅰ。类纤维传入冲动增多的有",["骨骼肌收缩缩短时","骨骼肌被动拉长时","支配该肌梭的a运动神经元兴奋时","支配该肌梭的γ 运动神经元兴奋时"],"BD","X","生理学",2020,"real","生理学|神经系统","肌梭Ia类传入的影响因素（α-γ共同激活）","肌梭的传入冲动取决于梭内肌纤维与整个肌肉长度的对比。骨骼肌被动拉长时肌梭受牵拉、Ia类传入增多，B正确；γ运动神经元兴奋使梭内肌收缩、肌梭张力增加，Ia传入增多，D正确。肌肉主动收缩缩短时肌梭松弛，传入减少，A错；α运动神经元兴奋使肌梭与梭外肌同步缩短，A错C亦错。","《生理学》第9版·神经系统·躯体运动的调控","green"],["2020N142X","真核生物染色体 DNA 的复制方式有",["半保留复制","半不连续复制","双向复制","D-环复制"],"ABC","X","外科学",2020,"real","外科学|其他","真核DNA复制特点","真核染色体DNA以半保留方式复制（A）；因DNA聚合酶只能沿5'→3'方向延伸，前导链连续合成、随从链以冈崎片段不连续合成，即半不连续复制（B）；复制自多个复制起始点启动，向两侧双向推进（C）。D错，D-环复制是线粒体DNA的复制方式，不见于核染色体DNA。","《生物化学与分子生物学》第9版·DNA的生物合成·真核生物DNA复制","green"],["2020N143X","真核生物 mRNA前体剪接部位的结构有",["5'-剪接位点为GU","3'-剪接位点为 AG","终止密码的3'端","切割信号序列5'-AAUAA-3'"],"AB","X","外科学",2020,"real","外科学|其他","mRNA剪接位点结构","mRNA前体（hnRNA）内含子剪接遵循GU-AG规则：5'剪接位点（供体位点）为GU，3'剪接位点（受体位点）为AG，分支点含保守的腺苷酸，故A、B正确。C错，终止密码位于编码区，与剪接位点无关；D错，5'-AAUAA-3'是mRNA 3'端加poly(A)尾的信号，属另一加工环节。","《生物化学与分子生物学》第9版·RNA的生物合成·转录后加工","green"],["2020N144X","蛋白质常发生磷酸化的氨基酸残基是",["丝氨酸","苏氨酸","酪氨酸","苯丙氨酸"],"ABC","X","生物化学",2020,"real","生物化学|氨基酸代谢","可逆磷酸化的氨基酸位点","可磷酸化的氨基酸残基必须含侧链羟基：丝氨酸、苏氨酸、酪氨酸，分别由丝/苏氨酸激酶和酪氨酸激酶催化，是信号转导和酶活性调节的重要方式。苯丙氨酸侧链为苯甲基，无羟基，不能接受磷酸基，故不选D。","《生物化学与分子生物学》第9版·酶·酶的共价修饰调节","green"],["2020N145X","转录因子的 DNA结合结构有",["锌指模体","螺旋-环-螺旋","脯氨酸富含结构域","亮氨酸拉链"],"ABD","X","生物化学",2020,"real","生物化学|蛋白质的结构与功能","转录因子的结构域","转录因子分DNA结合结构域和转录激活结构域。DNA结合结构域有锌指、螺旋-环-螺旋（bHLH）、亮氨酸拉链、同源盒（螺旋-转角-螺旋）等；而富含脯氨酸、富含谷氨酰胺、酸性氨基酸的结构域属转录激活结构域，故C不选。","《生物化学与分子生物学》第9版·基因表达调控·反式作用因子","green"],["2020N146X","下列属于真核生物基因组结构中的中度重复序列的有",["短散在核元件（SINEs）","长散在核元件（LINEs）","反向重复序列","卫星DNA"],"AB","X","外科学",2020,"real","外科学|其他","中度重复序列的类型","真核基因组的中度重复序列包括短散在核元件（SINEs，如Alu家族，长约300bp）与长散在核元件（LINEs，如L1，长约6~7kb），多与转座、基因表达调控及进化相关，故A、B正确。C反向重复序列与D卫星DNA属高度重复序列（卫星DNA位于着丝粒与异染色质区），故不选。","《生物化学与分子生物学》第9版·真核基因与基因组","green"],["2020N147X","下列胆汁酸中，属于初级胆汁酸的有",["胆酸","牛磺胆酸","鹅脱氧胆酸","甘氨鹅脱氧胆酸"],"ACD","X","生理学",2020,"real","生理学|消化和吸收","初级与次级胆汁酸的分类","初级胆汁酸在肝内由胆固醇合成，包括游离型胆酸、鹅脱氧胆酸（A、C）及其与甘氨酸或牛磺酸结合的甘氨胆酸、牛磺胆酸、甘氨鹅脱氧胆酸、牛磺鹅脱氧胆酸；次级胆汁酸由初级者在肠道经细菌作用生成（脱氧胆酸、石胆酸）。⚠️原答案ACD漏掉同样属初级结合型的牛磺胆酸，按教材应选A、B、C、D，原答案存疑。","《生理学》第9版·消化和吸收·胆汁的分泌与排出","yellow"],["2020N148X","下列病变中，属于脂肪变性的有",["心肌细胞间出现脂肪细胞","肾小管上皮细胞中出现脂滴","心肌细胞中出现脂滴","肝细胞水肿，内含大量红染细颗粒状物"],"BC","X","病理学",2020,"real","病理学|细胞和组织的适应与损伤","脂肪变性与脂肪浸润的区别","脂肪变性指非脂肪细胞胞质内出现脂滴。B肾小管上皮细胞内脂滴（肾脂肪变，见于肾病综合征等）、C心肌细胞内脂滴（心肌脂肪变，形成虎斑心）均属脂肪变性。A心肌细胞间出现脂肪细胞属脂肪浸润（脂肪组织增生替代萎缩组织），是两种不同概念；D肝细胞水肿内含红染细颗粒状物是细胞水肿（水样变）的表现。故答案为BC。","《病理学》第9版·细胞和组织的适应与损伤·脂肪变性","green"],["2020N149X","下列情况中，属于肿瘤增生特点的有",["增生与机体不协调","增生多为多克隆性","增生具有相对的自主性","增生具有无限增殖的潜能"],"ACD","X","外科学",2020,"real","外科学|其他","肿瘤增生的特点","肿瘤性增生与机体需要不相协调，原因去除后仍持续生长（A）；具有相对自主性，逃逸正常生长调控（C）；并获得无限增殖（永生化）潜能，端粒酶活性高（D）。B错，肿瘤为单克隆性增生，多克隆性增生见于炎症、修复等反应性增生，正是与肿瘤性增生的根本区别之一。","《病理学》第9版·肿瘤·肿瘤性增生与反应性增生","green"],["2020N150X","在慢性支气管炎中常见的病变有",["柱状上皮纤毛脱落","支气管上皮鳞状化生","支气管管壁软骨变性、萎缩","支气管腺体黏液腺化生"],"ABCD","X","外科学",2020,"real","外科学|其他","慢支的病理变化","慢性支气管炎的病理改变包括：黏膜上皮纤毛粘连、倒伏、变短乃至脱落（A）；上皮受损后可发生鳞状上皮化生（B）；支气管壁软骨变性、萎缩、钙化（C）；黏液腺增生肥大、浆液腺发生黏液腺化生，分泌亢进（D）。故四项均正确。","《病理学》第9版·呼吸系统疾病·慢性支气管炎","green"],["2020N151X","亚急性重型肝炎的病理特点有",["肝细胞亚大块坏死","肝细胞再生结节形成","残存肝细胞出现明显异型","网状纤维支架塌陷"],"ABD","X","外科学",2020,"real","外科学|其他","亚急性重型肝炎病理特点","亚急性重型肝炎的病理特点为肝细胞亚大块坏死（A，坏死面积占肝实质的15%~50%），同时肝细胞呈结节状再生形成再生结节（B），坏死区网状纤维支架塌陷、胶原化（D），最终演变为坏死后性肝硬化。C错，残存肝细胞明显异型增生常提示癌变倾向，并非本病的诊断性特点。","《病理学》第9版·消化系统疾病·重型病毒性肝炎","green"],["2020N152X","下列病变中，属于胃癌晚期的有",["癌细胞浸润至黏膜下层","癌细胞转移到局部淋巴结","癌细胞转移到双侧卵巢","癌细胞转移到左锁骨上淋巴结"],"CD","X","外科学",2020,"real","外科学|普通外科","胃癌晚期与早期判定","胃癌晚期指癌组织已侵透肌层达浆膜或已有远处转移。C双侧卵巢转移形成Krukenberg瘤、D左锁骨上淋巴结转移（Virchow淋巴结）均属远处转移，为晚期表现。A癌细胞浸润至黏膜下层属早期胃癌（不论大小与淋巴结转移）；B局部（区域）淋巴结转移在早期胃癌中也可出现，故不选。","《外科学》第9版·普通外科·胃癌·分期","green"],["2020N153X","在肾炎肾穿刺活检切片中.发现颗粒型的免疫荧光，该患者的肾脏疾病可能的类型有",["肺出血肾炎综合征","链球菌感染后性肾炎","狼疮性肾炎","IgA肾病"],"BCD","X","病理学",2020,"real","病理学|局部血液循环障碍","免疫荧光类型与肾炎分型","颗粒型（团块状）荧光提示免疫复合物沉积。B链球菌感染后肾炎为上皮下“驼峰状”免疫复合物沉积，呈粗颗粒；C狼疮性肾炎为“满堂亮”多种免疫球蛋白及补体颗粒状沉积；DIgA肾病为系膜区IgA颗粒状沉积，三者均为颗粒型。A肺出血肾炎综合征（Goodpasture病）为抗基底膜抗体呈线型荧光。故答案为BCD。","《病理学》第9版·泌尿系统疾病·肾小球肾炎","green"],["2020N154X","胸水中葡萄糖含量可降低的疾病有",["脓胸","类风湿关节炎","恶性胸腔积液","系统性红斑狼疮"],"ABCD","X","外科学",2020,"real","外科学|胸心外科","胸水葡萄糖降低的疾病","胸水葡萄糖含量降低见于：脓胸，细菌与大量白细胞消耗葡萄糖（A）；类风湿关节炎胸膜炎，因胸膜炎症与葡萄糖转运障碍（B）；恶性胸腔积液，肿瘤细胞与炎细胞代谢旺盛、葡萄糖消耗增加（C）；系统性红斑狼疮胸膜炎（D）。故四项均可致胸水葡萄糖降低。","《诊断学》第9版·胸水检查·渗出液的特点","green"],["2020N155X","男性，65 岁。6年前患心肌梗死，为评估患者目前的心脏功能，可选用的检查手段有",["动态心电图","超声心动图","放射性核素心脏检查","冠状动脉造影"],"ABC","X","内科学",2020,"real","内科学|循环系统疾病","心功能评估的检查手段","评估陈旧性心肌梗死患者目前心脏功能可选动态心电图（A，发现心律失常与心肌缺血）、超声心动图（B，评估室壁运动、射血分数、心腔大小）、放射性核素心脏检查（C，评估心肌灌注与存活心肌、EF）。冠状动脉造影用于明确冠状动脉解剖与血运重建，主要评价血管而非心脏功能，D不选。","《内科学》第9版·循环系统疾病·冠状动脉粥样硬化性心脏病","green"],["2020N156X","自身免疫性慢性胃炎患者产生巨幼细胞贫血的机制有",["胃整壁细胞分泌内因子减少","内因子抗体致其功能异常","胃吸收维生素 B1减少","回肠吸收维生素 B减少"],"ABD","X","内科学",2020,"real","内科学|血液系统疾病","A型胃炎致巨幼贫的机制","自身免疫性慢性胃炎（A型胃炎）时壁细胞被破坏，内因子分泌减少（A对），并产生内因子抗体阻断其与维生素B₁₂结合（B对），回肠末端B₁₂吸收障碍（D对），致巨幼细胞贫血。C“胃吸收维生素B₁减少”表述错误，胃不吸收维生素B₁（硫胺素，在十二指肠与空肠吸收），且本病缺乏的是B₁₂。","《内科学》第9版·血液系统疾病·巨幼细胞贫血","green"],["2020N157X","急性肾损伤患者，下列情况需要紧急透析治疗的有",["血钾7.0mmol/L.","动脉血 pH7.25","严重肾损伤性脑病","利尿治疗无效的严重肺水肿"],"ACD","X","内科学",2020,"real","内科学|泌尿系统疾病","AKI紧急透析指征","急性肾损伤紧急透析指征：血钾>6.5mmol/L（A，7.0为明确指征）、严重代谢性酸中毒（pH<7.2或HCO₃⁻<12mmol/L，B的pH7.25未达标准）、药物不能纠正的容量过负荷/肺水肿（D）、尿毒症性脑病或心包炎（C）、高分解代谢。故A、C、D需紧急透析，B可先保守纠正。","《内科学》第9版·泌尿系统疾病·急性肾损伤","green"],["2020N158X","根据 MDS的FAB分型标准，下列符合难治性贫血伴原始细胞增多转变型的有",["外周血原始细胞≥5%","骨髓原始细胞>20??<30%","幼粒细胞胞桨中出现 Auer 小体","环形铁粒幼细胞≥15%"],"BC","X","外科学",2020,"real","外科学|其他","MDS的FAB分型","FAB分型的RAEB-T（转化型难治性贫血伴原始细胞增多）标准为：骨髓原始细胞20%~30%（B），幼粒细胞胞质中出现Auer小体（C），一旦见到Auer小体即归入该型。D环形铁粒幼细胞≥15%为RAS型（伴环形铁粒幼细胞难治性贫血）的特点，故不选。⚠️按FAB标准，外周血原始细胞≥5%（A）亦为RAEB-T的条件，原答案未选A存疑。","《内科学》第9版·血液系统疾病·骨髓增生异常综合征","yellow"],["2020N159X","Cushing 综合征可出现的临床表现有",["贫血","皮肤色素沉着","病理性骨折","精神异常"],"BCD","X","外科学",2020,"real","外科学|骨科","库欣综合征的临床表现","库欣综合征因皮质醇长期过多，出现向心性肥胖、满月脸、水牛背、紫纹、高血压、低血钾、糖耐量减低、骨质疏松致病理骨折（C）、精神异常（抑郁或兴奋，D）；ACTH依赖性者因POMC增多伴皮肤色素沉着（B）。A错，皮质醇促进骨髓造血，患者多有红细胞与血红蛋白升高，不出现贫血。","《内科学》第9版·内分泌系统疾病·库欣综合征","green"],["2020N160X","目前常见的肺癌病理类型有",["大细胞癌","小细胞癌","鳞状细胞癌","腺癌"],"BCD","X","外科学",2020,"real","外科学|其他","肺癌常见病理类型","目前常见肺癌病理类型为鳞状细胞癌（C）、腺癌（D）、小细胞癌（B）及大细胞癌，其中腺癌已居首位、鳞癌次之，小细胞癌约占15%、恶性程度最高。本题按答案选B、C、D。A大细胞癌属四大类型之一但发病率低（约5%或更低），在常见类型中排序靠后，故未入选。","《病理学》第9版·呼吸系统疾病·肺癌的组织学类型","green"],["2020N161X","失血时输血的原则中，正确的有",["失血量低于总血容量 10??，不需输血，可待其自行代偿","失血量达总血容量10?0??，输入晶体及胶体液","失血量达总血容量 20??30??，可适当输入浓缩红细胞","失血量超过总血容量 30??，应全部输入全血"],"ABC","X","外科学",2020,"real","外科学|外科总论","失血性休克的输血原则","失血量<总血容量10%（约500ml）时，机体可通过血管收缩与血液重分布代偿，不需输血（A）；失血10%~20%时先快速输注晶体液与胶体液扩容（B）；失血20%~30%时因携氧能力明显下降，可输浓缩红细胞（C）。D错，失血>30%应输全血或红细胞加血浆等成分血，全部输全血易致循环超负荷与输血反应。","《外科学》第9版·外科总论·输血·输血适应证","green"],["2020N162X","长期肠外营养可能产生的并发症有",["肝功能损害","肾功能损害","水、电解质平衡紊乱","骨质疏松"],"ACD","X","外科学",2020,"real","外科学|其他","长期肠外营养并发症","长期肠外营养的并发症包括：肝损害（转氨酶升高、胆汁淤积、脂肪肝甚至肝纤维化，A）；水、电解质与酸碱平衡紊乱（C）；长期缺乏肠内营养与氨基酸负荷致钙磷代谢异常、骨钙丢失而出现骨质疏松（D）。B错，肠外营养本身不致肾功能损害，但可增加肾结石、肾钙化的风险。","《外科学》第9版·外科总论·外科营养·肠外营养并发症","green"],["2020N163X","丹毒的临床特点有",["β-溶血性链球菌为主要致病菌","口腔溃疡可以是诱发因素","反复发作可发生组织坏死","治愈后易复发"],"BD","X","外科学",2020,"real","外科学|其他","丹毒的临床特点","丹毒好发于下肢与面部，面部丹毒常继发于鼻窦炎、口腔溃疡或龋病等病灶（B）；治疗不彻底易反复发作，反复发作致淋巴管阻塞、淋巴水肿乃至象皮肿，故治愈后易复发（D）。C错，丹毒病变局限于皮肤淋巴管网，边界清楚、一般不化脓坏死，与蜂窝织炎不同。⚠️A「乙型溶血性链球菌为主要致病菌」按教材亦为正确表述，原答案未选A存疑。","《外科学》第9版·外科总论·外科感染·丹毒","yellow"],["2020N164X","造成半月板损伤的因素有",["膝的半屈","膝的挤压","膝的内收外展","膝的旋转"],"ABCD","X","外科学",2020,"real","外科学|骨科","半月板损伤的受伤机制","半月板损伤多发生于膝关节半屈位、小腿固定时，若同时发生膝的内收或外展并伴旋转，半月板被挤压于股骨髁与胫骨平台之间而撕裂（旋转研磨应力是致伤关键）。故半屈、挤压、内收外展与旋转均为致伤因素，四项均正确，尤以内收（或外展）伴旋转时最易损伤。","《外科学》第9版·骨科·膝关节半月板损伤","green"],["2020N165X","关于粘连性肩关节囊炎，正确的描述有",["最主要的激发因素是肩部急性挫伤","肩盂肱关节囊炎粘连、僵硬，致肩关节痛和活动受限","颈椎病可诱发本病","本病有自限性"],"BCD","X","外科学",2020,"real","外科学|骨科","粘连性肩关节囊炎的临床特点","粘连性肩关节囊炎是盂肱关节囊的慢性炎症、纤维化与粘连，导致肩痛与各方向活动受限（B）；与颈椎病、糖尿病、甲状腺疾病及肩部长期制动相关（C）；病程有自限性，多在1~1.5年（少数2年）后逐渐缓解（D）。A错，最主要的激发因素为关节囊退变、长期制动与内分泌因素，急性挫伤并非主要因素。","《外科学》第9版·骨科·粘连性肩关节囊炎","green"],["2021N1A","下列关于人体内环境概念的描述，错误的是",["机体内的全部液体","细胞赖以生存的环境","其理化性质变动很小","生物进化的结果"],"A","A","生理学",2021,"real","生理学|其他","内环境（细胞外液）的概念","内环境指细胞外液（血浆、组织液、淋巴、脑脊液等），而非机体全部液体；细胞内液不属于内环境，故A为错误描述，选A。内环境是细胞赖以生存的环境，其温度、pH、渗透压等理化性质在负反馈调节下变动很小，是生物进化的结果，B、C、D叙述正确。","《生理学》第9版·绪论·内环境与稳态","green"],["2021N2A","实测神经细胞静息电位略小于钾平衡电位的主要原因是",["在钾外流背景上存在少量钠内流","在钾外流背景上存在少量钙内流","在钾外流背景上存在一定的氯内流","在钾外流背景上存在钠泵生电作用"],"A","A","生理学",2021,"real","生理学|细胞的基本功能","静息电位略小于钾平衡电位的原因","静息时膜主要对K+通透，静息电位接近K+平衡电位；但膜对Na+尚有少量通透性，少量Na+内流使膜内负电位略减小，故实测值略小于EK的绝对值，A正确。Ca2+内流在静息时极少；Cl-在神经细胞多为被动分布、内流不构成原因；生电性钠泵使膜超极化而非使之减小。","《生理学》第9版·细胞的基本功能·静息电位","green"],["2021N4A","填（书）写部分必须使用黑色字迹签字笔或者钢笔书写，字迹工整、笔迹清楚;涂写 部分必须使用2B铅笔填涂。 5.考试结束，将答题卡和试题册按规定交回。 （以下信息考生必须认真填写） 考生编号 考生姓名 一、A型题∶1～40小题，每小题1.5分;41～115小题，每小题2分;共210分。在每小题给出 A、B、C、D四个选项中，请选出一项最符合题目要求的。 1.下列关于人体内环境概念的描述，错误的是 A.机体 坏死见于脑和脓肿；脂肪坏死见于急性胰腺炎。","《病理学》第9版·细胞和组织的适应与损伤·坏死","green"],["2021N31A","与黏膜相关淋巴组织淋巴瘤发生关系密切的细菌是",["金黄色葡萄球菌","草绿色链球菌","幽门螺杆菌","大肠埃希菌一"],"C","A","内科学",2021,"real","内科学|消化系统疾病","HP与MALT淋巴瘤","胃黏膜相关淋巴组织（MALT）淋巴瘤的发生与幽门螺杆菌感染密切相关，HP慢性刺激驱动T细胞依赖性B细胞克隆性增殖；早期低度恶性者根除HP后约60%～80%可获完全缓解。金黄葡萄球菌、草绿色链球菌、大肠埃希菌均无此因果关系。","《内科学》第9版·消化系统疾病·胃淋巴瘤","green"],["2021N32A","急性重型肝炎中残留有少量肝细胞，其多见的部位是",["中央静脉周围","肝小叶周边","全小叶随机分布","残留的网状支架旁"],"B","A","生物化学",2021,"real","生物化学|其他","急性重型肝炎的病变分布","急性重型肝炎（暴发性肝炎）时肝细胞广泛大片坏死，坏死多自小叶中央带开始向周边扩展，仅小叶周边部（汇管区周围）残存少量肝细胞，故残存肝细胞多见于肝小叶周边。全小叶随机分布、残留网状支架旁不符合其病变规律。","《病理学》第9版·病毒性肝炎·重型肝炎","green"],["2021N33A","女性，45岁。自觉双手指关节疼痛 2年，近半年感觉关节僵硬。血清学检查∶类风湿因子阳 性。该患者关节内的主要病理改变是",["大量嗜酸性粒细胞浸润","肉芽肿性炎","非化脓性增生性滑膜炎","浆液渗出性炎"],"C","A","内科学",2021,"real","内科学|风湿免疫","RA的基本病理改变","RF阳性、对称性小关节肿痛伴晨僵>1小时，符合类风湿关节炎，其基本病理为慢性非化脓性增生性滑膜炎：滑膜细胞增生、淋巴细胞与浆细胞浸润、血管翳形成并侵蚀软骨与骨。嗜酸性粒细胞浸润见于寄生虫或嗜酸性肉芽肿；肉芽肿性炎见于结核、结节病；浆液渗出性炎见于急性滑膜炎。","《病理学》第9版·免疫性疾病·类风湿关节炎","green"],["2021N34A","胃癌好发的部位是",["胃前壁","胃后壁","胃窦","胃底"],"C","A","生物化学",2021,"real","生物化学|其他","胃癌的好发部位与大体类型","胃癌好发于胃窦部（尤其小弯侧近幽门处），约占半数以上，其次为贲门部，胃体及胃底较少见。这与胃窦部黏膜易受机械和化学刺激、幽门螺杆菌感染率高，以及慢性萎缩性胃炎、肠上皮化生等癌前病变好发于该处相一致，故答案选胃窦。","《病理学》第9版·消化道疾病·胃癌","green"],["2021N35A","关于心衰细胞的叙述，正确的是",["心衰时出现的形态特殊的心肌细胞","肺内吞噬炭末的巨噬细胞","肺内吞噬含铁血黄素的巨噬细胞","肺内吞噬脂质的巨噬细胞"],"C","A","内科学",2021,"real","内科学|循环系统疾病","心衰细胞的本质","心衰细胞是左心衰竭致慢性肺淤血时，肺泡腔内巨噬细胞吞噬红细胞并分解血红蛋白后形成的含铁血黄素巨噬细胞，故为吞噬含铁血黄素的巨噬细胞。吞噬炭末者为尘细胞（肺尘埃沉着症）；吞噬脂质者为泡沫细胞；心衰细胞并非心肌细胞本身。","《病理学》第9版·局部血液循环障碍·肺淤血","green"],["2021N36A","透明血栓的主要成分是",["纤维蛋白","血小板","红细胞","白细胞"],"A","A","生物化学",2021,"real","生物化学|其他","透明血栓的成分","透明血栓又称微血栓，发生于微循环的毛细血管及微静脉内，主要由纤维蛋白构成（DIC时），HE染色呈均质红染的纤维素样物质，常见于休克、DIC。白色血栓以血小板为主（心瓣膜、动脉内），红色血栓以红细胞和纤维蛋白为主（静脉），混合血栓见于动脉瘤及心房内。","《病理学》第9版·局部血液循环障碍·血栓的形态","green"],["2021N37A","导致支气管扩张症的主要病变基础是",["支气管纤毛柱状上皮的鳞状上皮化生","支气管壁的黏液腺大量增生","支气管壁结构破坏","肺组织纤维化"],"C","A","生物化学",2021,"real","生物化学|其他","支气管扩张症的发病基础","支气管扩张症的病变基础是支气管壁的慢性炎症反复破坏支气管壁的软骨、平滑肌和弹力纤维，使管壁支撑结构破坏、管腔持久性扩张，故主要病变基础是支气管壁结构破坏。纤毛上皮鳞化、黏液腺增生、肺纤维化为伴随改变或继发改变，不是扩张的根本基础。","《病理学》第9版·肺疾病·支气管扩张症","green"],["2021N38A","电镜下，驼峰状沉积物位于肾小球毛细血管基膜表面的疾病是",["急进性肾小球肾炎","急性弥漫性增生性肾小球肾炎","系膜增生性肾小球肾炎","膜增生性肾小球肾炎"],"B","A","病理学",2021,"real","病理学|细胞和组织的适应与损伤","驼峰状沉积物电镜特点","驼峰状电子致密物沉积于肾小球基底膜上皮侧（基膜外表面、足细胞下），是急性弥漫性增生性（链球菌感染后）肾小球肾炎的电镜特征，光镜下见内皮及系膜细胞增生、中性粒细胞浸润。急进性肾炎为基底膜断裂、新月体形成；系膜增生性为系膜区沉积；膜增生性为内皮下及系膜区沉积并致基底膜双轨状。故B正确。","《病理学》第9版·泌尿系统疾病·急性弥漫性增生性肾小球肾炎","green"],["2021N39A","绒毛膜癌的组织学特点是",["肿瘤自身无间质血管","癌组织出血坏死不明显","癌细胞形成绒毛结构","由分化不良的细胞滋养层细胞构成"],"A","A","病理学",2021,"real","病理学|肿瘤","绒癌与侵蚀性葡萄胎的组织学鉴别","绒毛膜癌由分化不良的细胞滋养层和合体滋养层细胞增生构成，自身无绒毛结构，也无自身的间质和血管，癌细胞直接靠宿主血管获取营养，故出血坏死极为明显，恶性程度高，早期即经血道广泛转移至肺、脑。B“出血坏死不明显”与事实相反，C“形成绒毛结构”是葡萄胎、侵蚀性葡萄胎的特点，D只说细胞滋养层细胞而忽略合体滋养层细胞。故选A。","《病理学》第9版·生殖系统疾病·绒毛膜癌","green"],["2021N40A","间质内常有淀粉样物质沉着的甲状腺肿瘤是",["未分化癌","髓样癌","滤泡癌","乳头状癌"],"B","A","生物化学",2021,"real","生物化学|其他","甲状腺髓样癌与淀粉样间质","甲状腺髓样癌来源于滤泡旁C细胞，可分泌降钙素，间质内常有淀粉样物质沉着（由降钙素等肽类物质构成），是其特征性改变。乳头状癌间质常有砂粒体，滤泡癌、未分化癌间质无淀粉样物沉着。","《病理学》第9版·甲状腺疾病·甲状腺髓样癌","green"],["2021N41A","符合肝细胞性黄疸检验特点的是",["尿胆原降低","尿胆红素阳性","血非结合胆红素显著减少__","血结合胆红素显著减少"],"B","A","生物化学",2021,"real","生物化学|血液生化","三类黄疸的检验特点","肝细胞性黄疸因肝细胞摄取、转化、排泄胆红素障碍，血中结合与非结合胆红素均升高，结合胆红素可逆流入血并经肾排出，故尿胆红素阳性；同时肠道胆红素减少使尿胆原可降低或正常、粪色变浅。故A、C、D的“显著减少”描述不准确，符合者是尿胆红素阳性。","《生物化学与分子生物学》第9版·血液生化·胆红素的代谢","green"],["2021N42A","诊断慢性阻塞性肺疾病的肺功能标准是",["吸入支气管扩张剂后 FEV<80??计值","吸入支气管扩张剂后FEV，<70??计值","吸入支气管扩张剂后FEV，/FVC<80%","吸入支气管扩张剂后 FEV/FVC<70%"],"D","A","生物化学",2021,"real","生物化学|其他","COPD的肺功能诊断标准","COPD的诊断依靠肺功能：吸入支气管扩张剂后FEV1/FVC<70%（0.70），表明存在持续气流受限，为必备诊断标准；FEV1占预计值百分比用于气流受限程度分级。仅靠FEV1占预计值<80%不能诊断COPD。","《内科学》第9版·慢性阻塞性肺疾病","green"],["2021N43A","男性，23 岁。接触花粉后突发喘憋半小时，家人送至急诊。既往体健。查体∶意识模糊， 双肺呼吸音明显减低，心率135次/分，律齐。鼻导管吸氧5 L/min的情况下查动脉血气分析 示 pH 7.10，PaCO。92 mmHg，PaO。65 mmHg，下一步治疗措施错误的是",["雾化吸人支气管扩张剂","静脉应用糖皮质激素","气管插管机械通气","静脉应用大剂量利尿剂"],"D","A","生物化学",2021,"real","生物化学|其他","危重哮喘的治疗","患者哮喘急性重度发作并出现意识模糊、呼吸音明显减弱、PaCO2升至92 mmHg（提示呼吸肌疲劳和通气衰竭）、pH 7.10，属危及生命的哮喘，需立即吸入支气管扩张剂、静脉糖皮质激素并气管插管机械通气。此时大剂量利尿剂会加重痰液黏稠与低血容量、电解质紊乱，属错误措施。","《内科学》第9版·支气管哮喘·危重哮喘的处理","green"],["2021N44A","血源性肺脓肿最常见的致病菌是",["金黄色葡萄球菌","军团菌","厌氧菌","铜绿假单胞菌"],"A","A","生物化学",2021,"real","生物化学|其他","血源性肺脓肿的致病菌","血源性肺脓肿多由身体其他部位感染（皮肤疖、痈、骨髓炎、静脉导管感染等）的细菌经血行播散至肺，最常见致病菌为金黄色葡萄球菌，常为两肺多发、周边分布的小脓肿。吸入性肺脓肿则以厌氧菌为主；军团菌、铜绿假单胞菌多见于医院获得性肺炎。","《内科学》第9版·肺脓肿","green"],["2021N45A","男性，60岁。高血压病20余年，血压最高 190/100 mmHg，无自觉不适，未规律治疗。来院 健康体检∶P 62次/分，BP180/90 mmHg，心肺（-）。化验∶尿蛋白（＋），血 TC6.4 mmol/ L，HDL-C0.98 mmol/L，LDL-C4.96 mmol/L，Glu 8.6 mmol/L，Cr122 μmol/L， UA 365 μmol/L。该患者应首选的降压药物是",["培哚普利","氨氯地平","吲达帕胺","比索洛尔"],"A","A","生物化学",2021,"real","生物化学|脂类代谢","高血压合并糖尿病肾病的选药","患者高血压合并糖尿病、尿蛋白阳性、LDL-C升高及血肌酐轻度升高，属高血压伴靶器官损害（肾）与多重危险因素，应首选ACEI（培哚普利）：降压同时降低尿蛋白、延缓肾病进展，且对糖脂代谢无不良影响。氨氯地平、吲达帕胺、比索洛尔不具备降尿蛋白作用。","《内科学》第9版·高血压·降压药物的选择","green"],["2021N47A","一般不会在急性心肌炎病人出现的临床表现是",["心脏压塞","猝死","急性肺水肿","酷似急性心肌梗死"],"A","A","生物化学",2021,"real","生物化学|其他","急性心肌炎的临床表现","急性心肌炎的临床表现多样，轻者无症状，重者可出现猝死、急性左心衰竭性肺水肿、严重心律失常，以及心电图ST-T改变和酶学升高而酷似急性心肌梗死。心脏压塞需有心包腔大量积液或出血，急性心肌炎一般不出现，故为“一般不会出现”的选项。","《内科学》第9版·心肌疾病·病毒性心肌炎","green"],["2021N48A","女性，46岁。因活动后出现心前区疼痛 2个月，每次自含硝酸甘油无效来诊。既往有高血压 病、关节炎史。查体∶P 80次/分，BP 150/65 mmHg，BMI 35 kg/m2，甲状腺无肿大，双肺 （一），心界向左扩大，心律整，心尖部 S.减弱，可闻及舒张早中期隆隆样杂音，胸骨左缘第 3 肋间可闻及舒张期叹气样杂音，双下肢水肿（±）。导致该患者心前区疼痛的最主要病因是",["冠心病，高血压病","肥厚性梗阻型心肌病","二尖瓣狭窄","主动脉瓣关闭不全"],"D","A","内科学",2021,"real","内科学|循环系统疾病","主动脉瓣关闭不全的心绞痛机制","胸骨左缘第3肋间舒张期叹气样杂音、心尖部舒张早中期隆隆样（Austin Flint杂音）、脉压增大（150/65mmHg）、心界向左下扩大，为主动脉瓣关闭不全；其心前区疼痛系舒张压低、冠脉灌注不足加左室肥厚耗氧增加所致，含硝酸甘油无效（与冠心病不同）。二尖瓣狭窄杂音为舒张中晚期、不伴脉压增大；肥厚型梗阻性心肌病杂音为收缩期喷射性。","《内科学》第9版·循环系统疾病·主动脉瓣关闭不全","green"],["2021N49A","下列不属于胃食管反流病并发症的是",["食管狭窄","食管憩室","上消化道出血","Barrett 食管"],"B","A","生物化学",2021,"real","生物化学|其他","GERD的并发症","胃食管反流病的并发症包括食管狭窄（反复溃疡纤维化）、上消化道出血、Barrett食管（鳞状上皮被柱状上皮取代，为癌前病变）、食管腺癌。食管憩室源于食管壁结构薄弱处膨出，与反流无直接因果关系，不属其并发症。","《内科学》第9版·胃食管反流病","green"],["2021N50A","男性，25岁。2年来反复出现上腹痛，一般多发生于进餐1小时后。1天来呕吐咖啡渣样胃 内容物伴黑便1次。既往无肝炎病史。查体∶BP 100/60 mmHg，心率92次/分，心律整，上 腹部轻压痛，肝脾肋下未触及。最可能的诊断是",["胃溃疡出血","十二指肠溃疡出血","胃癌出血","肝硬化食管胃底静脉曲张破裂出血"],"A","A","病理学",2021,"real","病理学|消化系统疾病","胃溃疡与十二指肠溃疡的鉴别","青年男性，慢性反复上腹痛2年，疼痛多在进餐后1小时出现，符合胃溃疡“进食—疼痛—缓解”的节律（十二指肠溃疡多为空腹痛、夜间痛、进食缓解）。近日呕咖啡渣样物伴黑便，提示溃疡并发出血。无肝病史、肝脾不大，不支持食管胃底静脉破裂；胃癌多见于中老年 2021,"real","内科学|风湿免疫","ANCA相关血管炎的分类","ANCA相关血管炎包括显微镜下多血管炎（MPA）、肉芽肿性多血管炎（GPA）、嗜酸性肉芽肿性多血管炎（EGPA），以小血管坏死性炎症、ANCA阳性为特征。IgA血管炎（过敏性紫癜）属免疫复合物性小血管炎；狼疮相关、类风湿相关血管炎为继发性免疫复合物血管炎，均不属ANCA相关。","《内科学》第9版·风湿性疾病·ANCA相关血管炎","green"],["2021N57A","下列关于术前准备的叙述中，错误的是",["高血压患者应继续服用降压药物，避免戒断综合征","确有凝血障碍者，择期手术前应作相应治疗","肾功能重度损害者，在有效的透析疗法处理下，可耐受手术","糖尿病病人术前须将血糖控制到正常才能手术"],"D","A","病理学",2021,"real","病理学|内分泌系统疾病","糖尿病患者的术前血糖管理","糖尿病病人术前只须将血糖控制在轻度升高、稳定且无酮症酸中毒的状态（一般空腹血糖7.8～10.0mmol/L、尿糖±～+），不必强求降至正常；过分严格控糖会增加术中、术后低血糖风险，故D错误。高血压患者应继续服降压药以防戒断反跳；凝血障碍者择期手术前须纠正；重度肾功能损害经充分透析可耐受手术，A、B、C均正确。","《外科学》第9版·围手术期处理·术前准备","green"],["2021N58A","下列不需要使用全胃肠外营养的情况是",["短肠综合征","溃疡性结肠炎长期腹泻","重症急性胰腺炎","胆囊造瘘术后"],"D","A","病理学",2021,"real","病理学|消化系统疾病","肠外营养的适应证","全胃肠外营养适用于胃肠道不能或不宜利用、且预计5～7天以上不能经肠进食者：短肠综合征因吸收面积不足必须TPN；溃疡性结肠炎长期腹泻致营养丢失需TPN支持；重症急性胰腺炎需禁食使胰腺休息，须TPN。胆囊造瘘术后仅引流胆汁，胃、肠功能完好，可经口或肠内营养，不需TPN，故选D。","《外科学》第9版·外科病人的营养代谢·肠外营养","green"],["2021N60A","女性，32岁。间断吞咽困难伴呕吐 10年。上消化道造影提示食管明显扩张，蠕动减弱，食管 末端呈\"鸟嘴\"样狭窄，狭窄部黏膜尚光滑。宜采用的手术方式是",["食管大部切除，胃代食管术","食管下段、贲门部肌层切开术","食管下段十近端胃切除术","腹腔镜胃底折叠术"],"B","A","外科学",2021,"real","外科学|其他","贲门失弛缓症术式","间断吞咽困难伴呕吐10年、食管明显扩张、蠕动减弱、末端呈鸟嘴样狭窄而黏膜光滑，为贲门失弛缓症的典型表现。治疗以降低食管下括约肌压力为原则，首选食管下段贲门肌层切开术（Heller术）并加抗反流措施，选B。A、C为食管切除重建，创伤大，不用于良性功能性疾病；D胃底折叠术用于反流性食管炎，会加重吞咽困难。","《外科学》第9版·胸心外科·食管疾病·贲门失弛缓症","green"],["2021N61A","有关乳腺癌血行转移的叙述，错误的是",["癌细胞可经淋巴途径进人静脉","癌细胞直接侵入血循环","血行转移只发生在肿瘤晚期","常见远处转移部位依次为骨、肺、肝"],"C","A","外科学",2021,"real","外科学|普通外科","乳腺癌血行转移特点","乳腺癌血行转移途径包括：癌细胞直接侵入血循环（B）；经淋巴管进入静脉或经胸导管入血（A）；且血行转移可在临床早期即已发生，甚至以远处转移为首发表现。D亦正确，常见远处转移部位依次为骨、肺、肝。C错在「只发生在肿瘤晚期」这一绝对化表述，故为本题答案。","《外科学》第9版·普通外科·乳腺癌·转移途径","green"],["2021N62A","男性，55 岁。因腹痛1个月来诊。肠镜发现乙状结肠肿物，病理提示中分化腺癌。腹部CT 提示乙状结肠肿物，5 cm×4 cm 大小，侵及浆膜，肝左外叶可见直径2 cm 转移灶，腹腔内未 ____ 见肿大淋巴结。首选的治疗措施是",["结肠癌根治术","结肠癌根治联合肝左外叶切除术","全身化疗","局部放疗"],"B","A","病理学",2021,"real","病理学|肿瘤","结直肠癌肝转移的手术指征","乙状结肠中分化腺癌侵及浆膜，同时肝左外叶有单发2cm转移灶，腹腔无肿大淋巴结，属可根治的Ⅳa期（寡转移）。结直肠癌肝转移若转移灶单发、局限于一段或一叶、可完整切除且余肝代偿良好，应争取同期或分期根治性切除，5年生存率显著提高，故首选结肠癌根治联合肝左外叶切除。单纯化疗、放疗为姑息手段。选B。","《外科学》第9版·结直肠癌·肝转移的处理","green"],["2021N63A","男性， 病理学|造血系统疾病","缺铁性贫血的诊断","共用题干缺失，据后续小题（匙状甲、血小板增高、红细胞大小不等）可确定为缺铁性贫血。诊断依据为小细胞低色素性贫血（Hb、MCV、MCHC均降低），血清铁蛋白和铁降低、总铁结合力升高。急性风湿热有发热、关节痛、ASO升高；结核病有低热盗汗及肺部病灶；甲减为正细胞性贫血伴TSH升高。故选C。","《内科学》第9版·血液系统疾病·缺铁性贫血","yellow"],["2021N71A","该患者还可能出现的体征是",["柞状指","爪形手","匙状甲","手末端指节肿大"],"C","A","病理学",2021,"real","病理学|其他","缺铁性贫血的体征（匙状甲）","共用题干缺失，由上题确定为缺铁性贫血。缺铁使指甲营养不良，出现指甲变薄、变脆、反甲（匙状甲），故C正确。杵状指见于发绀型先心病、支气管扩张、肺癌；爪形手见于尺神经损伤或前臂缺血性肌挛缩；手末端指节肿大见于肢端肥大症。这些都是干扰项，缺铁性贫血最典型的外周体征是匙状甲。","《内科学》第9版·血液系统疾病·缺铁性贫血","yellow"],["2021N72A","下列不支持上述诊断的外周血检查结果是",["红细胞形态大小不等","血小板可增高","白细胞可正常","出现镰形红细胞"],"D","A","病理学",2021,"real","病理学|其他","缺铁性贫血的外周血象","共用题干缺失，确定为缺铁性贫血。缺铁性贫血外周血涂片示红细胞大小不一、中心淡染区扩大，血小板及白细胞可正常或增多（血小板可反应性增高），故A、B、C均符合。镰形红细胞见于镰状细胞贫血，属血红蛋白分子病，与缺铁无关，故为不支持该诊断的检查结果，选D。","《内科学》第9版·血液系统疾病·缺铁性贫血","yellow"],["2021N73A","该患者最可能的诊断是",["结核性胸膜炎","恶性胸腔积液","脓胸","类风湿相关胸腔积液"],"C","A","病理学",2021,"real","病理学|传染病与寄生虫病","脓胸的胸水特点","共用题干缺失。脓胸（化脓性胸膜炎）多因肺部感染、胸部外伤或食管穿孔引起，为渗出性乃至脓性胸腔积液：胸水外观浑浊、白细胞明显增多以中性粒细胞为主、pH降低、LDH显著升高，可伴发热、胸痛和中毒症状。结核性胸膜炎以淋巴细胞为主的草黄色渗出液、ADA升高；恶性胸水为血性、可查到癌细胞；类风湿性胸水低糖明显。故选C。","《外科学》第9版·脓胸","yellow"],["2021N74A","为明确诊断，首选的检查是",["胸水找肿瘤细胞","胸水细菌培养＋药敏试验","胸水结核菌培养","胸水类风湿因子检查"],"B","A","内科学",2021,"real","内科学|风湿免疫","脓胸的病原学诊断","胸腔积液伴发热、胸痛、胸水呈脓性或中性粒细胞显著升高时，需明确病原以指导抗生素选择，胸水细菌培养加药敏试验最有价值，阳性即可确诊脓胸并精准用药。胸水找瘤细胞用于恶性积液；结核菌培养阳性率低、耗时长（但必要时仍应送检）；类风湿因子检测仅用于疑类风湿胸膜炎。","《内科学》第9版·呼吸系统疾病·胸腔积液","green"],["2021N76A","该患者目前最主要的诊断是",["瓣膜性心脏病","原发性高血压","扩张型心肌病","冠心病"],"C","A","内科学",2021,"real","内科学|循环系统疾病","扩张型心肌病的诊断与鉴别","中青年起病、心脏增大、慢性全心衰竭，超声示心腔扩大、室壁变薄、弥漫性室壁运动减弱、LVEF明显下降而瓣膜结构正常，为扩张型心肌病。瓣膜性心脏病有特征性杂音与瓣膜病变；原发性高血压以心室肥厚为主而心腔扩张多晚期；冠心病多呈节段性室壁运动异常。","《内科学》第9版·循环系统疾病·扩张型心肌病","green"],["2021N77A","该患者即刻选用的治疗药物，不正确的是",["利尿剂","β受体拮抗剂","抗凝药","血管紧张素转换酶抑制剂"],"B","A","内科学",2021,"real","内科学|其他","β受体拮抗剂的禁忌时机","该扩张型心肌病患者处于心衰症状明显期（肺淤血、水肿、活动受限），即刻不宜使用β受体拮抗剂——应在利尿达干体重、血流动力学稳定后小剂量起始，过早使用可负性肌力、加重心衰。利尿剂减轻淤血、ACEI改善重构、抗凝用于合并房颤或左室血栓者，均属当下可用。","《内科学》第9版·循环系统疾病·慢性心力衰竭","green"],["2021N78A","该患者治疗1周后，体温正常，心悸气短症状缓解，夜间可平卧，下肢水肿消失。查 体∶P68次/分，BP125/70 mmHg，左下肺偶闻及湿啰音，心率92次/分，心律绝对不整，杂音 同前。对该患者在制定长期治疗心功能不全的方案中，不正确的是",["坚持服用ACEI或 ARB类药物","选用β受体拮抗剂","选用醛固酮受体拮抗剂","选用钙通道阻滞剂"],"D","A","生理学",2021,"real","生理学|细胞的基本功能","慢性心衰的长期药物治疗","慢性心功能不全的长期治疗方案以ACEI/ARB、β受体拮抗剂、醛固酮受体拮抗剂（及利尿剂、地高辛）为核心，可改善预后；短效二氢吡啶类钙通道阻滞剂有负性肌力作用、激活交感，不宜用于收缩性心衰，故D为“不正确”项。A、B、C均属指南推荐。","《内科学》第9版·循环系统疾病·心力衰竭","green"],["2021N79A","最可能的诊断是",["肝性脑病","糖尿病酮症酸中毒","脑血管病","尿毒症"],"A","A","内科学",2021,"real","内科学|内分泌与代谢","肝性脑病的诊断","肝硬化/肝衰竭患者出现性格改变、行为异常、嗜睡、定向力障碍及扑翼样震颤，首先考虑肝性脑病。DKA有多尿、深大呼吸、血糖显著升高及酮味；脑血管病多有局灶体征、头颅CT见低密度灶；尿毒症有慢性肾病、肌酐显著升高及尿毒症毒素表现。","《内科学》第9版·消化系统疾病·肝性脑病","green"],["2021N80A","对确诊最有价值的检查是",["血糖","血氨","血肌酐","头颅CT"],"B","A","内科学",2021,"real","内科学|其他","血氨的诊断价值","血氨升高是肝性脑病（尤其门体分流型）最有价值的诊断依据，血氨与意识障碍程度及脑电图改变相关，降氨治疗有效可反证。血糖用于排除低血糖昏迷及DKA；血肌酐排除尿毒症脑病；头颅CT用于排除脑血管意外和脑水肿，但均非肝性脑病的诊断指标。","《内科学》第9版·消化系统疾病·肝性脑病","green"],["2021N81A","为缓解患者的躁动，首选的治疗药物是",["苯巴比妥","地西泮","水合氯醛","异丙嗪"],"D","A","内科学",2021,"real","内科学|其他","肝性脑病镇静药的选择","肝性脑病患者应避免使用经肝代谢的镇静催眠药：苯巴比妥、地西泮、水合氯醛均抑制中枢、加重肝损及意识障碍，属禁忌。躁动明显时可谨慎选用抗组胺类异丙嗪，作用温和且不依赖肝脏代谢，必要时减量、密切观察。","《内科学》第9版·消化系统疾病·肝性脑病","green"],["2021N82A","最可能的诊断是",["急性膀胱炎","急性肾盂肾炎","尿道综合征","肾结核"],"B","A","内科学",2021,"real","内科学|泌尿系统疾病","急性肾盂肾炎的诊断","尿频、尿急、尿痛伴发热寒战、腰痛、肾区叩痛，尿白细胞增多，符合急性肾盂肾炎。急性膀胱炎无发热与腰痛；尿道综合征尿检无脓尿、培养阴性；肾结核呈慢性过程、有肺结核史、普通培养无菌、抗感染治疗无效。","《内科学》第9版·泌尿系统疾病·尿路感染","green"],["2021N83A","下列尿检结果最支持该患者诊断的是",["蛋白（±）","沉渣镜检红细胞20～25个/HP","沉渣镜检白细胞 10～15个/HP","沉渣镜检见白细胞管型"],"D","A","内科学",2021,"real","内科学|其他","白细胞管型的定位价值","尿沉渣见白细胞管型提示白细胞在肾小管内凝聚，是上尿路感染（肾盂肾炎）的特异性依据。单纯蛋白（±）无定位意义；镜下血尿在膀胱炎与肾盂肾炎均可出现；白细胞10～15个/HP仅示脓尿，不能区分上下尿路。","《内科学》第9版·泌尿系统疾病·尿路感染","green"],["2021N85A","最可能的诊断是",["原发性骨髓纤维化","慢性淋巴细胞白血病","慢性髓系白血病","急性髓系白血病"],"C","A","内科学",2021,"real","内科学|血液系统疾病","CML的诊断与Ph染色体","脾脏显著肿大、白细胞显著升高以中晚幼粒细胞为主、嗜碱性粒细胞增多、中性粒细胞碱性磷酸酶积分降低，并检出Ph染色体/t(9;22)或BCR-ABL融合基因，为慢性髓系白血病。原发性骨髓纤维化有泪滴状红细胞、骨髓干抽；慢淋以成熟小淋巴细胞增多、SmIg弱阳性；急性髓系白血病以原始细胞≥20%为主。","《内科学》第9版·血液系统疾病·慢性髓系白血病","green"],["2021N86A","为确定诊断，首选的检查是 B. 腹部B超 A.血网织红细胞计数 D. 骨髓细胞学检查 C。食管钡剂造影 87 对诊断和治疗最有意义的进一步检查是 A.BCR-ABL 融合基因",["Graves病 B.结节性毒性甲状腺肿 D.亚急性甲状腺炎 C.桥本甲状腺炎","JAK2V617F基因突变","IgHV基因突变","PML-RARA 融合基因"],"D","A","生理学",2021,"real","生理学|血液","PML-RARA融合基因与APL","题干与选项经OCR错乱混排，仅可辨出所涉为血液系统疾病病例串题，选项含BCR-ABL、JAK2V617F、IgHV、PML-RARA等分子标志。按所给答案D（PML-RARA融合基因），其对应疾病为急性早幼粒细胞白血病（M3），该融合基因是t(15;17)的标志与全反式维甲酸/砷剂治疗靶点。⚠️题干不完整、选项错配，原答案存疑，仅就能辨认的知识点作答。","《内科学》第9版·血液系统疾病·急性白血病","yellow"],["2021N89A","对确诊最有价值的检查指标是",["TSBAb(+)","TgAb(-)","TPOAb(-)","TRAb(+)"],"D","A","内科学",2021,"real","内科学|其他","TRAb的诊断价值","Graves病的确诊依靠TSH受体抗体（TRAb）阳性，其敏感性、特异性均高，并可判断复发与停药时机。TSBAb阳性提示自身免疫性甲状腺炎所致甲减；TgAb、TPOAb阳性主要见于桥本甲状腺炎，对Graves病诊断价值低于TRAb。","《内科学》第9版·内分泌与代谢疾病·甲状腺功能亢进症","green"],["2021N90A","如果患者希望在 1年内妊娠生育，正确的治疗方法是",["对症治疗，选用美托洛尔","首选I治疗","首选丙硫氧略啶治疗","首选左甲状腺素"],"C","A","内科学",2021,"real","内科学|其他","备孕/妊娠期甲亢用药","近期（1年内）计划妊娠者，抗甲状腺药物首选丙硫氧嘧啶（PTU）：其与蛋白结合率高、不易通过胎盘，致畸风险低于甲巯咪唑。¹³¹I为妊娠绝对禁忌；美托洛尔仅控制心率不能治疗甲亢；左甲状腺素用于甲减。故首选PTU治疗。","《内科学》第9版·内分泌与代谢疾病·甲状腺功能亢进症","green"],["2021N91A","最可能的诊断是",["系统性红斑狼疮","多发性骨髓瘤","干燥综合征","贝赫切特病"],"C","A","内科学",2021,"real","内科学|风湿免疫","干燥综合征的诊断","中年女性口干、眼干、猖獗龋齿、腮腺肿大，伴高球蛋白血症、抗SSA/SSB阳性，符合干燥综合征。系统性红斑狼疮以蝶形红斑、抗dsDNA、狼疮肾炎为特点；多发性骨髓瘤有骨痛、贫血、M蛋白、本周蛋白尿；贝赫切特病以口腔、生殖器溃疡及眼色素膜炎为主。","《内科学》第9版·风湿性疾病·干燥综合征","green"],["2021N92A","下列病变中，该病最常出现的是",["肾小球病变","肾小管酸中毒","消化道多发溃疡并出血","病理性骨折"],"B","A","内科学",2021,"real","内科学|其他","干燥综合征的肾小管酸中毒","干燥综合征肾脏受累以肾小管间质性病变为主，最常见为远端肾小管酸中毒（Ⅰ型），表现为低钾性麻痹、肾结石、骨软化，尿pH持续>5.5。肾小球病变较少且轻；消化道多发溃疡出血见于贝赫切特病；病理性骨折见于骨软化或多发性骨髓瘤。","《内科学》第9版·风湿性疾病·干燥综合征","green"],["2021N93A","最可能的诊断是",["脾破裂","肝破裂","胰腺破裂","肠系膜撕裂"],"A","A","内科学",2021,"real","内科学|其他","脾破裂的诊断","左上腹外伤后失血性休克、腹穿抽出不凝血、B超示脾周积液及脾实质回声不均，最可能为脾破裂，是腹腔实质脏器损伤中最常见者。肝破裂多在右上腹；胰腺破裂多伴上腹深部疼痛、血淀粉酶升高；肠系膜撕裂出血量相对少、多可保守。","《外科学》第9版·腹部损伤·脾破裂","green"],["2021N94A","为明确诊断，急诊首选的检查是",["腹腔动脉造影","腹部CT","腹部MRI","腹部X线平片"],"B","A","内科学",2021,"real","内科学|其他","腹部损伤的CT评估","血流动力学尚稳定的腹部闭合伤，急诊首选腹部CT（增强），可同时显示实质脏器裂伤、腹腔积血、造影剂外溢及后腹膜损伤，敏感性与特异性均高。腹腔动脉造影用于活动性出血的栓塞治疗；MRI耗时长；腹部平片仅用于判断气腹或肠梗阻。","《外科学》第9版·腹部损伤·影像学检查","green"],["2021N95A","如若手术，术中探查的顺序是",["先探查胰腺，后探查肝脾","先探查胃肠，后探查肝脾","先探查肝脾，后探查胃肠及其它","先探查肠系膜血管，后探查其它"],"C","A","外科学",2021,"real","外科学|普通外科","腹部损伤探查顺序","腹部损伤剖腹探查应遵循「先止血、后修补」原则：进腹后迅速吸净积血，先系统探查肝、脾、胰、肾及肠系膜血管等实质性脏器与血管，控制活动性出血，再依次探查胃肠道等空腔脏器及腹膜后间隙，故C正确。A仅先查胰腺片面；B先查胃肠可能遗漏大出血而危及生命；D以系膜血管为先同样片面，均不选。","《外科学》第9版·普通外科·腹部损伤·剖腹探查术","green"],["2021N96A","最可能的诊断是",["急性胆囊炎","急性胰腺炎","急性胃炎","急性胆管炎"],"B","A","内科学",2021,"real","内科学|消化系统疾病","急性胰腺炎的临床诊断","饱餐或饮酒后突发持续性上腹剧痛向腰背放射、弯腰抱膝位可减轻、伴恶心呕吐而呕吐后腹痛不缓解，血淀粉酶/脂肪酶显著升高，为急性胰腺炎典型表现。急性胆囊炎痛在右上腹、Murphy征阳性；急性胃炎多为中上腹隐痛、呕吐后缓解；急性胆管炎有Charcot三联征。","《内科学》第9版·消化系统疾病·急性胰腺炎","green"],["2021N97A","目前的最佳治疗方案是",["禁食、补液，应用抗生素","腹腔灌洗","急诊手术引流","经内镜Oddi括约肌切开"],"A","A","内科学",2021,"real","内科学|其他","轻症急性胰腺炎的治疗","轻症急性胰腺炎（无器官衰竭、无坏死感染）首选内科综合治疗：禁食、胃肠减压、积极补液（乳酸林格液）、抑制胰酶与胃酸、镇痛、必要时抗感染及营养支持。腹腔灌洗、急诊手术引流用于感染性坏死；内镜下Oddi括约肌切开仅用于合并胆道梗阻的胆源性胰腺炎。","《内科学》第9版·消化系统疾病·急性胰腺炎","green"],["2021N98A","最可能的诊断是",["左下肢肌筋膜炎","左下肢丹毒","左下肢深静脉血栓形成","左下肢浅静脉炎"],"C","A","内科学",2021,"real","内科学|其他","DVT的临床表现","下肢肿胀、皮温升高、浅静脉扩张、Homans征（足背屈时小腿疼痛）阳性，术后或卧床后发生，为下肢深静脉血栓形成。丹毒有境界清楚的红斑、发热、局部灼痛；肌筋膜炎以肌肉压痛、无肿胀为特点；浅静脉炎为沿静脉走行的条索状红肿，范围局限。","《外科学》第9版·周围血管疾病·深静脉血栓形成","green"],["2021N99A","下列治疗措施中错误的是",["抗凝","多做下肢运动","抬高患肢","手术"],"B","A","内科学",2021,"real","内科学|其他","DVT急性期制动","急性下肢DVT应卧床休息、抬高患肢、抗凝（低分子肝素序贯华法林或NOAC），必要时导管接触溶栓或手术取栓。绝对错误且危险的是“多做下肢运动”——活动可使血栓脱落造成肺栓塞，急性期应制动。故B为错误措施。","《外科学》第9版·周围血管疾病·深静脉血栓形成","green"],["2021N100A","应首先考虑的诊断是",["十二指肠溃疡","门静脉高压症","胃癌","胆管结石"],"B","A","内科学",2021,"real","内科学|其他","门静脉高压症的诊断","肝硬化病史、脾大脾功能亢进（血小板、白细胞减少）、食管胃底静脉曲张伴呕血、腹水，为门静脉高压症及其主要并发症食管胃底静脉曲张破裂出血。十二指肠溃疡出血无脾大与脾功亢；胃癌有消瘦、贫血、肿块，不伴脾大；胆管结石以Charcot三联征为主。","《内科学》第9版·消化系统疾病·肝硬化门静脉高压","green"],["2021N101A","为明确诊断，首选的检查是",["腹部 B超","肠系膜上动脉造影","上消化道造影","胃镜"],"D","A","内科学",2021,"real","内科学|其他","上消化道出血的首选检查","明确门静脉高压所致上消化道出血的部位与病因，首选胃镜：可直接观察曲张静脉的部位、条数、红色征及有无活动性出血，并同期行套扎或硬化剂治疗，兼具诊断与治疗价值。腹部B超、肠系膜上动脉造影、钡餐不能直接显示出血灶。","《内科学》第9版·消化系统疾病·上消化道出血","green"],["2021N102A","下列治疗措施中，不恰当的是",["扩容补液","使用止血药","内镜治疗","手术治疗"],"D","A","内科学",2021,"real","内科学|其他","静脉曲张出血的急诊处理顺序","急性食管胃底静脉曲张破裂出血的处理为扩容（注意避免过度扩容升高门脉压）、止血药物（生长抑素/特利加压素）、内镜下套扎或硬化、必要时三腔二囊管压迫或TIPS。急性出血期手术（分流/断流）死亡率高，不作为首选措施，故D不恰当。","《外科学》第9版·门静脉高压症·食管胃底静脉破裂出血","green"],["2021N103A","最可能的诊断是",["右股骨转子间骨折","右股骨颈骨折","右髋后脱位","右髋前脱位"],"B","A","内科学",2021,"real","内科学|其他","股骨颈骨折的体征","老年跌倒后髋部疼痛不能站立、患肢短缩外旋畸形（45°～60°）、大转子叩痛，为股骨颈骨折。转子间骨折外旋可达90°、局部肿胀瘀斑明显、压痛在转子间；髋后脱位为屈曲内收内旋畸形；髋前脱位为外旋外展屈曲。","《外科学》第9版·下肢骨骨折·股骨颈骨折","green"],["2021N104A","首选的检查是",["X线片","MRI","CT","骨扫描"],"A","A","内科学",2021,"real","内科学|其他","股骨颈骨折的X线诊断","骨盆正位X线片是股骨颈骨折的首选检查，可显示骨折线部位、移位程度（Garden分型）及是否合并脱位；对临床高度怀疑而X线阴性者再行MRI或骨扫描。CT用于评估复杂骨折与移位，MRI用于隐匿性骨折。","《外科学》第9版·下肢骨骨折·股骨颈骨折","green"],["2021N105A","最可能出现的并发症是",["脂肪栓塞","创伤性骨化","坐骨神经损伤","股骨头坏死"],"D","A","内科学",2021,"real","内科学|其他","股骨颈骨折与股骨头坏死","股骨颈骨折最典型的并发症是股骨头缺血性坏死，因股骨头的血供主要来自旋股内侧动脉的骺外侧动脉，骨折（尤其头下型、移位明显）易损伤该血管，发生率可达20%～40%。脂肪栓塞见于长骨干骨折与多发伤；创伤性骨化见于肘部损伤；坐骨神经损伤见于髋后脱位。","《外科学》第9版·下肢骨骨折·股骨颈骨折","green"],["2021N106A","最可能的临床诊断是",["类风湿关节炎","关节内游离体","骨关节炎","狭窄性腱鞘炎"],"D","A","内科学",2021,"real","内科学|风湿免疫","扳机指的诊断","手指屈伸时弹响、交锁，掌指关节掌侧可触及痛性结节、压痛并可随屈伸滑动，为狭窄性腱鞘炎（扳机指）。类风湿关节炎为多发对称性小关节肿痛、晨僵>1小时；关节内游离体交锁发生在关节内、无掌侧结节；骨关节炎见于老年、远端指间关节Heberden结节。","《外科学》第9版·手部损伤与疾病·狭窄性腱鞘炎","green"],["2021N107A","目前最正确的治疗是 ____",["腱鞘切开减压","限制中指运动","口服糖皮质激素","反复按摩患处"],"B","A","内科学",2021,"real","内科学|其他","扳机指的分级治疗","狭窄性腱鞘炎早期（病程短、无固定交锁）以保守治疗为主：减少患指活动、制动休息、局部热敷，配合腱鞘内注射糖皮质激素多可缓解。腱鞘切开减压用于反复发作、保守无效者；单纯限制活动比口服激素更有效；反复按摩可加重腱鞘水肿，不推荐。","《外科学》第9版·手部损伤与疾病·狭窄性腱鞘炎","green"],["2021N108A","一般认为职业是人们常规谋生的手段，而专业是对公众所期待的责任有公开承诺的职业团 体。下列对医学专业的描述不正确的是",["医学专业需要通过系统的训练","医学专业没有既定的职业目标","医学专业的定位高于利益需求","医学专业要求专业共同体自律"],"B","A","内科学",2021,"real","内科学|其他","医学专业的特征","医学专业有明确、公开的职业目标——维护与促进健康、防治疾病、减轻痛苦，故“没有既定的职业目标”表述错误且与专业精神相悖。医学专业需系统训练、定位高于利益需求、要求专业共同体自律三项均符合《医师宪章》对专业的界定。","《医学伦理学》·医学专业精神·专业的特征","green"],["2021N109A","医生在与患者的语言交流中，恰当的沟通用语是",["\"不检查，一切后果自负!\"","\"医学上的东西，跟你说多了你也不懂!\"","\"我们只管看病，其他事情管不了!\"","\"请按医嘱服药，病情有变化随时就诊。\""],"D","A","内科学",2021,"real","内科学|其他","医患沟通用语","恰当用语应交代医嘱并给出随访指引：“请按医嘱服药，病情有变化随时就诊”既尊重患者又明确责任，属规范表达。A、B、C分别含威胁、贬低与推诿，损害知情同意与医患信任，不符合沟通伦理。","《医学伦理学》·医患沟通·语言沟通规范","green"],["2021N110A","女性，19岁。海外留学回国休假，因月经不调就诊。患者诉出国后月经不正常，担心因不适 应当地气候身体出现问题。此时最佳的沟通是",["关注月经异常情况并予以诊治","关注月经情况，了解患者在国外的心理状况并予以诊治","关注月经情况，了解患者在国外的社会适应性状况并予以诊治","关注月经情况，了解患者在国外的心理和社会适应性状况并予以诊治和安慰"],"D","A","内科学",2021,"real","内科学|其他","整体医学观的沟通","患者月经不调可能与出国后心理压力、作息与环境适应、社会适应不良等多因素相关，最佳沟通是在关注月经问题的同时了解其心理状态与社会适应状况，并给予诊治与安慰，体现生物-心理-社会医学模式。仅看月经、只看心理或只看社会适应均不全面。","《医学伦理学》·临床诊疗伦理·生物心理社会医学模式","green"],["2021N111A","女性，22岁。因急性淋巴细胞性白血病恶化再次入院化疗。患者情绪低落，不愿配合治疗。 此时不恰当的医患沟通方式是",["同情支持，鼓励患者树立战胜疾病的信心","强调对治疗的依从性，否则就建议转院","亲切诚恳，与患者建立良好的关系","耐心解释，帮助其克服对治疗的恐惧"],"B","A","人文",2021,"real","人文|医患沟通","不依从患者的沟通方式","患者因病情恶化情绪低落、不配合治疗，沟通应以共情倾听、耐心解释、情感支持为主，帮助其表达顾虑、重建治疗信心。以「不依从就建议转院」施压，是把方案强加于患者，带有胁迫与推诿性质，破坏信任并损害患者自主选择，属不恰当的沟通方式。A、C、D均为支持性沟通。故选B。","《医学伦理学》第9版·医疗人际关系伦理·医患沟通","green"],["2021N112A","辅助生殖技术是指代替自然生殖过程某些步骤的手段。根据临床伦理学的原则，关于医务 人员的义务，下列观点正确的是",["为不育夫妇提供出于个人偏好而选择胎儿性别的辅助生殖服务","为夫妇提供出于提升未来婴儿智力目的的辅助生殖服务","为单身女性提供捐赠精子或捐赠胚胎的辅助生殖服务","为不育夫妇提供与弥补正常功能障碍直接相关的辅助生殖服务"],"D","A","人文",2021,"real","人文|医学伦理","辅助生殖技术的适应证与医务人员义务","辅助生殖技术应以治疗不育为直接目的，医务人员只能提供与弥补生育功能障碍直接相关的服务。出于个人偏好选择胎儿性别（医学需要的性别选择除外）、以提升未来婴儿智力为目的的干预、为单身女性提供供精或供胚胎，均超出技术适应证，违背有利、不伤害与社会公益原则。故选D。","《医学伦理学》第9版·生命医学技术伦理·辅助生殖技术伦理","green"],["2021N113A","遗传咨询医师面向患者进行遗传咨询，以减少遗传病带给患者及其家庭的痛苦，帮助他们做 出符合其最佳利益的决定。从伦理学视角分析，下列描述正确的是",["咨询医师提出的意见应当是指令性的，因为咨询医师的意见是专业意见","咨询医师提出的意见应当是指令性的，因为咨询医师与患者的价值是一致的","咨询医师提出的意见应当是非指令性的，应该以患者的价值为中心","咨询医师提出的意见应当是非指令性的，应该以咨询医师的价值为中心"],"C","A","人文",2021,"real","人文|医学伦理","遗传咨询的非指令性原则","遗传咨询的核心是尊重咨询者的自主决定：医师提供疾病风险、再发风险与可选方案的准确信息，保持非指令性（非指导性），使当事人依据自身价值取向作出决定。指令性意见等于以医生价值替代当事人价值，可致歧视、心理伤害与不当决定。故C正确，A、B因指令性错误，D以医师价值为中心亦错。","《医学伦理学》第9版·生命医学技术伦理·遗传咨询与基因伦理","green"],["2021N114A","临床试验的目的是",["使受试者获得经济上的好处","使受试者获得健康上的好处","使研究者获得学术发展上的好处","发展和促进可被普遍化的知识"],"D","A","人文",2021,"real","人文|医学伦理","临床试验的普遍化知识目的","临床试验的根本目的是发展和促进可被普遍化的知识，以改进未来患者的诊疗水平；受试者个人经济好处、健康受益、研究者学术发展都不是试验的目的，也不能作为让他人承担风险的理由。受试者受益与社会获益属试验的伦理要求或可能结果，不能与目的混同。故选D。","《医学伦理学》第9版·医学科研伦理·临床试验的目的","green"],["2021N115A","某医院急诊科凌晨2点接诊一名车祸昏迷患者，经诊断为颅内出血，需立即手术以挽救患者 生命。此时无法联系到患者的近亲属或关系人，下列做法正确的是 A.经治医生可自行决定实施手术治疗",["B、C、D是其下两道小题的备选项，请从 中选择一项最符合题目要求的，每个选项可以被选择一次或两次。 A.CO中毒 C. PCO。升高 B.PO。降低 D.2，3-DPG减少","经医生所在科室主任同意后实施手术治疗","经医院负责人或被授权的负责人批准后实施手术治疗","经请示上级医疗机构主管部门批准后实施手术治疗 二、B型题∶116～135小题，每小题1.5分，共30分"],"C","A","外科学",2021,"real","外科学|其他","紧急情况下的知情同意","患者昏迷、病情危重需立即手术抢救生命而无法取得近亲属意见时，为抢救患者生命可采取紧急救治措施，但须经医疗机构负责人或授权的负责人批准（《民法典》与《执业医师法》规定），故选C。经治医生自行决定或仅经科室主任同意均缺乏法定授权；请示上级卫生行政部门会延误抢救时机，A、B、D不选。","《医学伦理学》·医患关系·紧急救治与知情同意的例外","green"],["2021N116B","不阻碍 Hb结合O2，但阻碍HbO2释放O。的因素是",["CO中毒","PO。降低","PCO。升高","2，3-DPG减少"],"D","B","外科学",2021,"real","外科学|其他","2,3-DPG对氧解离的影响","2,3-DPG与去氧血红蛋白结合，稳定T构象、降低Hb对O2亲和力，利于组织释氧。DPG减少时Hb对O2亲和力升高、氧解离曲线左移，只阻碍HbO2在组织中释放O2，而不影响Hb与O2的结合，故选D。CO中毒同时阻碍结合与释放；PO2降低主要影响结合；PCO2升高（波尔效应）促进释氧，A、B、C不选。","《生理学》第9版·呼吸·氧解离曲线的影响因素","green"],["2021N117B","既阻碍 Hb 结合 O.，又阻碍 HbO。释放O。的因素是",["CO中毒","PO。降低","PCO。升高","2，3-DPG减少"],"A","B","外科学",2021,"real","外科学|其他","CO中毒的双重机制","CO与Hb的亲和力约为O2的250倍，且COHb不能携带O2，故既阻碍Hb与O2结合；同时CO使氧解离曲线左移，阻碍HbO2在组织中释放O2，造成双重危害，故选A。2,3-DPG减少与PCO2升高只影响释放环节；PO2降低主要影响结合，B、C、D不选。","《生理学》第9版·呼吸·气体在血液中的运输","green"],["2021N118B","主要促进胰酶分泌，而水和 HCO。分泌量较少的胃肠激素是",["胰多肽","促胰液素","缩胆囊素","胰高血糖素"],"C","B","生理学",2021,"real","生理学|消化和吸收","CCK与促胰液素对胰液分泌的差异","缩胆囊素（CCK）由十二指肠和空肠I细胞分泌，主要促进胰液中胰酶（蛋白水解酶、淀粉酶、脂肪酶）的分泌，对水和HCO3-促泌作用弱，并引起胆囊收缩、Oddi括约肌舒张，C正确。促胰液素则相反，以促水和HCO3-为主；胰多肽、胰高血糖素不参与餐后胰液分泌的主要调节。","《生理学》第9版·消化和吸收·胰液的分泌调节","green"],["2021N119B","主要促进水和 HCO。分泌，而胰酶分泌量较少的胃肠激素是",["胰多肽","促胰液素","缩胆囊素","胰高血糖素"],"B","B","生理学",2021,"real","生理学|消化和吸收","促胰液素促水和HCO3-分泌","促胰液素由小肠上段S细胞在盐酸、脂肪酸、蛋白质分解产物刺激下释放，作用于胰腺导管上皮细胞，主要促进水和HCO3-分泌（可增加10倍以上），对胰酶促泌作用弱，B正确。这是它与缩胆囊素分工的经典对照。","《生理学》第9版·消化和吸收·胰液的分泌调节","green"],["2021N120B","参与三羧酸循环的酶是",["琥珀酰CoA 合成酶","HMG CoA还原酶","乙酰CoA羧化酶","HMG CoA裂解酶"],"A","B","生物化学",2021,"real","生物化学|脂类代谢","三羧酸循环的酶与底物水平磷酸化","琥珀酰CoA合成酶催化三羧酸循环中琥珀酰CoA转化为琥珀酸，同时使GDP磷酸化生成GTP，是循环中唯一的底物水平磷酸化反应。HMG-CoA还原酶、乙酰CoA羧化酶、HMG-CoA裂解酶分别参与胆固醇合成、脂肪酸合成和酮体生成。","《生物化学与分子生物学》第9版·糖代谢·三羧酸循环","green"],["2021N121B","产物是酮体的酶是",["琥珀酰CoA 合成酶","HMG CoA还原酶","乙酰CoA羧化酶","HMG CoA裂解酶"],"D","B","生物化学",2021,"real","生物化学|脂类代谢","酮体生成的酶","酮体生成的最后一步由HMG-CoA裂解酶（HMG-CoA裂合酶）催化：HMG-CoA裂解为乙酰乙酸和乙酰CoA。HMG-CoA合酶是酮体生成的限速酶，HMG-CoA还原酶是胆固醇合成限速酶，琥珀酰CoA转硫酶参与酮体利用而非生成。","《生物化学与分子生物学》第9版·脂类代谢·酮体的生成与利用","green"],["2021N122B","长度大于200 nt的RNA分子是",["tRNA","IncRNA","scRNA","miRNA"],"B","B","外科学",2021,"real","外科学|其他","lncRNA的概念","长链非编码RNA（lncRNA）指长度大于200个核苷酸、不编码蛋白质的RNA，参与基因转录、剪接、染色质修饰等调控，故选B。tRNA长约74~95nt；miRNA约19~25nt；scRNA为信号识别颗粒中的小胞质RNA（约300nt），习惯上归入小分子RNA，不称lncRNA，A、C、D不选。","《生物化学与分子生物学》第9版·RNA的分类与功能","green"],["2021N123B","能与 mRNA 3'端非翻译区结合而抑制翻译的 RNA分子是",["tRNA","IncRNA","scRNA","miRNA"],"D","B","生物化学",2021,"real","生物化学|RNA转录与翻译","miRNA与翻译抑制","miRNA由RNA聚合酶Ⅱ转录、经Drosha和Dicer加工成约22 nt成熟体，与RISC复合物结合后主要识别靶mRNA的3'端非翻译区（3'-UTR），通过降解mRNA或抑制翻译下调基因表达。tRNA运载氨基酸，lncRNA多经表观调控，scRNA功能多样，均非此机制。","《生物化学与分子生物学》第9版·基因表达调控·非编码RNA的调控","green"],["2021N124B","属于纤维素性炎的是",["大叶性肺炎仰","小叶性肺炎","支原体肺炎","病毒性肺炎"],"A","B","外科学",2021,"real","外科学|其他","大叶性肺炎的炎症类型","大叶性肺炎由肺炎链球菌引起，病变累及肺段乃至整个肺叶，肺泡内大量纤维素渗出并混有红细胞、中性粒细胞，属纤维素性炎，故选A。小叶性肺炎为化脓性炎；支原体肺炎与病毒性肺炎均以间质性炎为主，B、C、D不选。","《病理学》第9版·呼吸系统疾病·大叶性肺炎","green"],["2021N125B","属于化脓性炎的是",["大叶性肺炎仰","小叶性肺炎","支原体肺炎","病毒性肺炎"],"B","B","外科学",2021,"real","外科学|其他","小叶性肺炎的炎症类型","小叶性肺炎（支气管肺炎）以细支气管为中心的化脓性炎，肺泡腔内充满中性粒细胞为主的脓性渗出物，可形成小脓肿并融合，故选B。大叶性肺炎为纤维素性炎；支原体肺炎与病毒性肺炎为间质性炎，以淋巴细胞、单核细胞浸润为主，A、C、D不选。","《病理学》第9版·呼吸系统疾病·小叶性肺炎","green"],["2021N126B","最常见的肺结核类型是",["局灶型肺结核","浸润型肺结核","慢性纤维空洞型肺结核","干酪性肺炎"],"B","B","内科学",2021,"real","内科学|呼吸系统疾病","肺结核的分型构成","继发型肺结核中浸润型肺结核最常见，约占成人肺结核的多数，病灶多位于上叶尖后段与下叶背段，以渗出、增殖为主，可伴空洞。局灶型为早期非活动性病变；慢性纤维空洞型为晚期不可逆改变；干酪性肺炎病情凶险但少见。","《内科学》第9版·呼吸系统疾病·肺结核","green"],["2021N127B","病情危重，中毒症状明显的肺结核类型是 C.小细胞肺癌 D.大细胞肺癌 A。肺腺癌 B. 肺鳞状细胞癌(",["局灶型肺结核","浸润型肺结核","慢性纤维空洞型肺结核","干酪性肺炎"],"D","B","内科学",2021,"real","内科学|呼吸系统疾病","干酪性肺炎的特点","干酪性肺炎由大量结核分枝杆菌经支气管播散或干酪灶液化破溃入支气管引起，呈大叶性实变伴多发虫蚀样空洞，中毒症状重、高热、衰竭，痰菌强阳性，属重症肺结核。浸润型病情相对轻；慢性纤维空洞型以纤维化、肺毁损为特点但进展缓慢。","《内科学》第9版·呼吸系统疾病·肺结核","green"],["2021N128B","亚洲人群中容易出现 EGFR 基因突变，可以使用口服靶向药治疗的肺癌是",["肺腺癌","肺鳞状细胞癌","小细胞肺癌","大细胞肺癌"],"A","B","外科学",2021,"real","外科学|其他","肺腺癌EGFR突变与靶向治疗","肺腺癌在亚洲人群、不吸烟女性中EGFR突变率高（可达50%左右），对吉非替尼、厄洛替尼、奥希替尼等口服酪氨酸激酶抑制剂（TKI）敏感，故选A。鳞癌EGFR突变罕见，多用免疫检查点抑制剂；小细胞肺癌以化疗加放疗为主，无TK 不能与蛋白解离；胃大部切除致内因子（壁细胞分泌）缺乏；末端回肠是B12-内因子复合物的特异吸收部位，切除后无法吸收；抗内因子抗体使B12不能与内因子结合（恶性贫血）。四者均可致B12缺乏，进而甲硫氨酸合酶受阻、叶酸代谢障碍，引起巨幼红细胞性贫血。⚠️题干“缺乏维生素B1”应为“维生素B12”的OCR错误，选项内容均围绕B12，按B12判题。","《生物化学与分子生物学》第9版·维生素·维生素B12","yellow"],["2021N137X","颈动脉窦和主动脉弓压力感受性反射的生理特点有",["具有双向调节血压能力","对心率快慢无调节作用","主要调节血压的短期变化","血压持续升高时可发生重调定"],"ACD","X","外科学",2021,"real","外科学|其他","压力感受性反射的特点","颈动脉窦与主动脉弓压力感受性反射对血压进行双向调节：血压升高时抑制心交感、增强心迷走使血压回降，血压降低时反之（A）；其主要意义是缓冲血压的短期波动、维持动脉血压相对恒定（C）；当血压长期持续升高时，反射出现重调定，工作阈值上移（D）。B错，该反射通过改变心率与心输出量发挥作用，对心率有明显调节。","《生理学》第9版·血液循环·压力感受性反射","green"],["2021N138X","参与人体产热活动调节的内分泌激素有",["胰岛素","生长激素","甲状腺激素","糖皮质激素"],"BC","X","外科学",2021,"real","外科学|普通外科","调节产热的激素","参与产热调节的内分泌激素主要有甲状腺激素（提高组织耗氧率与基础代谢率，是调节产热最重要的激素，C）与生长激素（促进蛋白质合成、增加产热，B），此外还有肾上腺素与去甲肾上腺素。A胰岛素主要调节糖代谢；D糖皮质激素主要调节物质代谢与应激反应，一般不列为调节产热的激素，故不选。","《生理学》第9版·能量代谢与体温·产热与产热调节","green"],["2021N139X","肾小管和集合管上皮细胞参与调节和维持机体酸碱平衡的功能活动有",["Na--H*交换","质子泵活动","NH、或 NH;的分泌","Nat-K*-2CI同向转运"],"ABC","X","外科学",2021,"real","外科学|外科总论","肾小管排酸保碱方式","肾小管与集合管参与酸碱平衡的功能活动包括：近端小管Na+-H+交换泌H+（A）；远端小管闰细胞借H+-ATP酶（质子泵）主动泌H+（B）；近端小管以NH4+、集合管以NH3形式排泌氨，中和H+并促进HCO3-重吸收（C）。D错，Na+-K+-2Cl-同向转运体参与髓袢升支粗段NaCl重吸收与尿浓缩稀释，与酸碱调节无关。","《生理学》第9版·尿的生成和排出·肾对酸碱平衡的调节","green"],["2021N140X","眼科检查时，用后马托品滴眼后可引起的效应有",["扩瞳","复视","视觉模糊","青光眼症状缓解"],"AC","X","外科学",2021,"real","外科学|其他","后马托品滴眼效应","后马托品为阿托品类M胆碱受体阻断药，滴眼后阻断瞳孔括约肌M受体使瞳孔扩大（A），并麻痹睫状肌、丧失调节能力，故看近物模糊（C）。B错，复视由眼外肌麻痹引起，散瞳不产生复视；D错，瞳孔扩大使虹膜根部前移、房角变窄、房水排出受阻，可使眼压升高甚至诱发青光眼发作，而非缓解青光眼症状。","《药理学》第9版·胆碱受体阻断药","green"],["2021N141X","非快眼动睡眠的生理意义有",["促进儿童生长发育","促进脑内蛋白质合成","有助于体力恢复","有助于建立突触联系"],"AC","X","外科学",2021,"real","外科学|其他","NREM睡眠的生理意义","非快眼动（慢波）睡眠脑电呈高幅慢波，生长激素分泌达高峰，有利于促进儿童生长发育（A），并有利于体力恢复（C）。B促进脑内蛋白质合成、D有助于建立突触联系并巩固记忆，属异相睡眠（快眼动睡眠）的生理意义，故不选。","《生理学》第9版·神经系统的功能·睡眠与觉醒","green"],["2021N142X","胞质和线粒体都涉及到的代谢途径有",["天门冬氨酸-精氨酸代琥珀酸穿梭","α-磷酸甘油穿梭","鸟氨酸循环","三羧酸循环"],"ABC","X","外科学",2021,"real","外科学|其他","胞质与线粒体共同参与的代谢","鸟氨酸循环（尿素合成）跨越细胞两级：氨基甲酰磷酸合成在线粒体，其余步骤在胞质，C正确；天冬氨酸-精氨酸代琥珀酸穿梭把线粒体内氨基转移至胞质供尿素合成，A正确；α-磷酸甘油穿梭把胞质NADH的还原当量运入线粒体氧化，B正确。D错，三羧酸循环只在线粒体基质内进行，不涉及胞质。","《生物化学与分子生物学》第9版·氨基酸代谢·尿素合成与穿梭","green"],["2021N143X","可以作为营养必需氨基酸的有",["赖氨酸","色氨酸","亮氨酸","组氨酸"],"ABCD","X","生物化学",2021,"real","生物化学|蛋白质的结构与功能","营养必需氨基酸的种类","成人营养必需氨基酸共8种：缬氨酸、异亮氨酸、亮氨酸、苯丙氨酸、甲硫氨酸、色氨酸、苏氨酸、赖氨酸；组氨酸为婴儿必需氨基酸。题中赖氨酸、色氨酸、亮氨酸属成人必需，组氨酸对婴儿属必需，故四项均可列入，答案ABCD。记忆口诀：甲携来本亮色木同。","《生物化学与分子生物学》第9版·氨基酸代谢·蛋白质的营养作用","green"],["2021N144X","嘌呤核苷酸和嘧啶核苷酸从头合成的共同原料有",["天冬氨酸","甘氨酸","CO","磷酸核糖焦磷酸（PRPP）"],"ACD","X","生物化学",2021,"real","生物化学|核苷酸代谢","嘌呤/嘧啶合成的原料对比","嘌呤与嘧啶从头合成共同的原料有天冬氨酸（嘌呤N1，嘧啶N1及C4~C6）、谷氨酰胺（提供氮）、CO2（嘧啶C2、嘌呤C6）以及PRPP（提供磷酸核糖）。甘氨酸只参与嘌呤环的C4、C5、N7合成，嘧啶合成不用甘氨酸，故B不选。","《生物化学与分子生物学》第9版·核苷酸代谢·嘌呤与嘧啶的从头合成","green"],["2021N145X","具有酶催化活性的受体有",["G蛋白偶联受体","表皮生长因子受体","核受体","转化生长因子受体"],"BD","X","生物化学",2021,"real","生物化学|酶","具酶活性的受体","具酶活性的受体包括受体型酪氨酸激酶（表皮生长因子受体、胰岛素受体）、丝/苏氨酸激酶受体（转化生长因子β受体）、鸟苷酸环化酶受体及与JAK结合的细胞因子受体，故B、D正确。G蛋白偶联受体本身无酶活性、需经G蛋白和效应器传递；核受体为配体依赖性转录因子，无催化活性。","《生物化学与分子生物学》第9版·细胞信号转导·受体类型","green"],["2021N146X","能够经代谢生成胆红素的化合物有",["血红蛋白","肌红蛋白","细胞色素","过氧化物酶"],"ABCD","X","生物化学",2021,"real","生物化学|蛋白质的结构与功能","胆红素的来源","体内含铁卟啉（血红素）并可降解生成胆红素的蛋白质包括血红蛋白、肌红蛋白、细胞色素、过氧化氢酶、过氧化物酶等，其中血红蛋白来源占80%以上。血红素在血红素加氧酶作用下生成胆绿素，再经还原酶还原为胆红素，卟啉环打开释放CO和Fe2+。","《生物化学与分子生物学》第9版·血液生化·胆红素的生成","green"],["2021N147X","血浆蛋白质的特性有 A.大多数在肝合成 B.大多数是糖蛋白 D.均为球蛋白",["阿米巴肝脓肿","疖","均为分泌型蛋白质","流行性乙型脑炎 C.流行性脑脊髓膜炎"],"ABC","X","外科学",2021,"real","外科学|其他","血浆蛋白的性质","血浆蛋白质绝大多数由肝细胞合成（A）；除白蛋白外，多数血浆蛋白为糖蛋白，含寡糖链（B）；它们均在粗面内质网核糖体合成、经高尔基体加工后分泌入血，属分泌型蛋白质（C）。D错，血浆蛋白包括白蛋白与球蛋白（α1、α2、β、γ），并非均为球蛋白。","《生物化学与分子生物学》第9版·血液的生物化学·血浆蛋白质","green"],["2021N149X","属于肉芽肿性病变的有",["砂粒体","结核结节","风湿小体","伤寒小结"],"BCD","X","病理学",2021,"real","病理学|传染病与寄生虫病","肉芽肿性病变的类型","肉芽肿性病变的本质是巨噬细胞及其转化细胞（类上皮细胞、多核巨细胞）聚集形成的结节性病变。B结核结节由类上皮细胞、Langhans巨细胞、淋巴细胞和中央干酪样坏死构成；C风湿小体（Aschoff小体）以纤维素样坏死为中心，周围聚集风湿细胞（巨噬细胞源性）和淋巴细胞，属肉芽肿性炎；D伤寒小结由伤寒细胞聚集构成，同属肉芽肿性炎。A砂粒体是甲状腺乳头状癌中钙盐沉积形成的同心圆小体，不是肉芽肿。故BCD正确。","《病理学》第9版·炎症·肉芽肿性炎","green"],["2021N150X","属于癌前病变的有",["黏膜白斑","慢性非萎缩性胃炎","慢性溃疡性结肠炎","大肠绒毛状腺瘤"],"ACD","X","病理学",2021,"real","病理学|肿瘤","癌前病变的判定","癌前病变指本身非恶性、但具有发展为癌的潜在可能性的病变。A黏膜白斑（口腔、外阴黏膜上皮增生性白斑）可发展为鳞癌；C慢性溃疡性结肠炎病程长者可发生异型增生并癌变；D大肠绒毛状腺瘤癌变率最高，属典型癌前病变。B慢性非萎缩性胃炎病变轻、无腺体萎缩及肠化，不属癌前病变（慢性萎缩性胃炎伴肠上皮化生才需随访）。故ACD正确。","《病理学》第9版·肿瘤·癌前病变","green"],["2021N151X","甲状腺乳头状癌的特征包括",["肿瘤细胞核内可见假包涵体","患者预后和局部淋巴结转移有关","肿瘤间质内常见淀粉样物质沉积","肿瘤细胞核呈毛玻璃状"],"AD","X","外科学",2021,"real","外科学|普通外科","乳头状癌的病理特征","甲状腺乳头状癌的特征性细胞学改变为核内假包涵体（A）与核淡染呈毛玻璃样（D），此外还有核沟、核重叠。B错，乳头状癌常见颈部淋巴结转移，但一般不影响其良好预后；C错，肿瘤间质内淀粉样物质沉积是髓样癌的特点，故不选。","《病理学》第9版·内分泌系统疾病·甲状腺乳头状癌","green"],["2021N152X","由门脉高压症导致的病理表现包括",["淤血性脾大","胃底食管静脉曲张","蜘蛛状血管痣","胃肠淤血、水肿"],"ABD","X","外科学",2021,"real","外科学|普通外科","门脉高压的临床表现","门静脉高压症直接导致的病理表现有三：淤血性脾大伴脾功能亢进（A）；食管胃底静脉曲张，破裂可致大出血（B）；门体侧支循环开放与胃肠黏膜淤血水肿，加之低蛋白血症与醛固酮增多形成腹水（D）。C蜘蛛状血管痣属肝功能减退、雌激素灭活障碍的表现，并非门脉高压所致，故不选。","《外科学》第9版·普通外科·门静脉高压症·病理生理","green"],["2021N153X","属于玻璃样变的病变有",["Aschoff小体”","Mallory 小体","Rusell小体","Apoptosis 小体"],"BC","X","病理学",2021,"real","病理学|细胞和组织的适应与损伤","Mallory小体与Russell小体","玻璃样变是细胞内或间质中出现均匀红染、半透明的蛋白质性物质。B Mallory小体是酒精性肝病时肝细胞胞质内透明变性物质（细胞骨架蛋白聚集），属细胞内玻璃样变；C Russell小体是浆细胞胞质内蓄积的免疫球蛋白形成的圆形均质红染小体，也属细胞内玻璃样变。A Aschoff小体由纤维素样坏死和风湿细胞构成，其中心属纤维素样坏死；D 凋亡小体为凋亡细胞胞膜包裹碎片形成，不是蛋白质蓄积。故BC正确。","《病理学》第9版·细胞和组织的适应与损伤·玻璃样变","green"],["2021N154X","男性，30岁。反复咳黄绿色脓痰、咯血 20余年，曾多次住院治疗，此次再发5天来诊。查 体∶双侧中下肺可闻及较多湿啰音。肺CT示右中叶、左舌叶及双下叶可见支气管壁增厚， 部分呈囊腔样改变，其内可见气液平。可以选择的经验性抗菌药物有",["头孢他啶","头孢吡肟","厄他培南","环丙沙星"],"ABD","X","外科学",2021,"real","外科学|其他","支扩经验性抗菌药物选择","反复咳黄绿色脓痰与咯血20余年，CT示支气管壁增厚、囊状扩张伴气液平，为支气管扩张合并感染，常见致病菌为铜绿假单胞菌、流感嗜血杆菌与肺炎链球菌。经验性抗感染应覆盖假单胞菌：头孢他啶（A）、头孢吡肟（B）、环丙沙星（D）均可选。C厄他培南对铜绿假单胞菌天然无效，故不选。","《内科学》第9版·呼吸系统疾病·支气管扩张症·治疗","green"],["2021N155X","符合房室旁路典型预激综合征的心电图特点有",["PR间期<0.12秒","QRS波起始部粗钝","QT间期延长","T波与QRS主波方向相反"],"ABD","X","外科学",2021,"real","外科学|其他","WPW心电图特点","典型预激综合征（WPW）的心电图特点为：PR间期缩短<0.12秒（A）；QRS波起始部粗钝形成delta波，使QRS增宽（B）；继发性ST-T改变，T波方向常与QRS主波相反（D）。C错，QT间期一般正常或轻度延长，并非其诊断特点，故不选。","《诊断学》第9版·心电图·预激综合征","green"],["2021N156X","可引起上消化道出血的病因有",["食管憩室炎","消化性溃疡","胃癌","慢性萎缩性胃炎"],"ABC","X","内科学",2021,"real","内科学|消化系统疾病","上消化道出血的病因","可引起上消化道出血的病因：消化性溃疡（最常见，B）、胃癌（肿瘤糜烂出血，C）、食管憩室炎（憩室炎症可致黏膜糜烂出血，A），此外还有食管胃底静脉曲张、急性胃黏膜病变、食管贲门黏膜撕裂。慢性萎缩性胃炎主要致胃酸减少与维生素B₁₂吸收障碍，一般不引起上消化道出血，D不选。","《内科学》第9版·消化系统疾病·上消化道出血","green"],["2021N157X","肾病综合征的并发症有",["急性肾损伤","慢性肾衰竭","肾静脉血栓","蛋白质及脂肪代谢紊乱"],"ACD","X","内科学",2021,"real","内科学|泌尿系统疾病","肾病综合征的并发症","肾病综合征并发症包括感染、血栓栓塞（肾静脉血栓最常见，C）、急性肾损伤（A，有效血容量不足或特发性ARF）、蛋白质及脂肪代谢紊乱（D，营养不良、高脂血症、血栓倾向）及内分泌紊乱。慢性肾衰竭不是肾病综合征的直接并发症，B不选。","《内科学》第9版·泌尿系统疾病·肾病综合征","green"],["2021N158X","支持血管内溶血的特异性检查结果有",["血浆游离血红蛋白升高","尿中血红蛋白阳性","尿 Rous 试验阳性","血清非结合胆红素升高"],"ABC","X","外科学",2021,"real","外科学|其他","血管内溶血的实验室证据","支持血管内溶血的特异性检查为：血浆游离血红蛋白升高（A）；血红蛋白尿使尿血红蛋白阳性（B）；慢性血管内溶血时肾小管上皮细胞吞噬血红蛋白分解后形成含铁血黄素，尿Rous试验（尿含铁血黄素试验）阳性（C）。D血清非结合胆红素升高在血管内与血管外溶血均可出现，缺乏特异性，故不选。","《内科学》第9版·血液系统疾病·溶血性贫血的实验室检查","green"],["2021N159X","可引起高血压、低血钾的肾上腺疾病有",["原发性醛固酮增多症","Addison病","Liddle综合征","嗜铬细胞瘤"],"ACD","X","内科学",2021,"real","内科学|循环系统疾病","高血压伴低钾的鉴别","引起高血压伴低血钾的肾上腺疾病：原发性醛固酮增多症（A，醛固酮保钠排钾）、Liddle综合征（C，假性醛固酮增多，ENaC功能增强，虽非肾上腺疾病但机制同类）、嗜铬细胞瘤（D，儿茶酚胺促钾内移并可继发醛固酮增多）。Addison病为皮质醇与醛固酮均缺乏，表现为低血压、高血钾，B不选。","《内科学》第9版·内分泌与代谢疾病·原发性醛固酮增多症","green"],["2021N160X","胆道疾病的常见并发症有",["癌变","狭窄","出血","肝脓肿"],"ABC","X","外科学",2021,"real","外科学|其他","胆道疾病的并发症","胆道疾病的常见并发症包括：结石与慢性炎症长期刺激致胆管癌变（A）；反复胆管炎后胆管纤维性狭窄，引起梗阻性黄疸与胆汁性肝硬化（B）；结石侵蚀或感染破坏血管引起胆道出血（C）。D错，肝脓肿是胆道感染进展的结果之一，教材归纳胆道疾病的主要并发症为癌变、狭窄、出血、结石复发与胰腺炎，故不选。","《外科学》第9版·普通外科·胆道疾病·常见并发症","green"],["2021N161X","肝癌破裂出血的治疗方法有",["手术切除","肝动脉栓塞","非手术治疗","放射治疗"],"ABC","X","外科学",2021,"real","外科学|普通外科","肝癌破裂出血的处理","肝癌破裂出血的处理：对血流动力学稳定、病灶局限可切除者行急诊肝切除术（A）；对肿瘤不能切除、出血汹涌者行选择性肝动脉栓塞（TAE）止血（B）；对晚期、门静脉有癌栓或不能耐受手术者，采用输血、止血、腹带加压包扎等非手术治疗（C）。D错，放疗起效慢，对破裂出血无止血作用。","《外科学》第9版·普通外科·肝癌·自发性破裂","green"],["2021N162X","\"早期胃癌\"这一概念所包含的内容有",["病变局限于胃黏膜层内或黏膜下层，有淋巴结转移","病变局限于胃黏膜层内或黏膜下层，无淋巴结转移","病变浸润达浆膜层，无淋巴结转移","微小胃癌及小胃癌是早期胃癌的特殊类型"],"ABD","X","外科学",2021,"real","外科学|普通外科","早期胃癌概念的内涵","早期胃癌指癌组织仅侵及黏膜层或黏膜下层，不论有无淋巴结转移，故A（有淋巴结转移）与B（无淋巴结转移）均属其内涵。D正确，微小胃癌（直径<5mm）与小胃癌（<10mm）是早期胃癌的特殊类型，预后更好。C错，浸润达浆膜层属进展期胃癌，故不选。","《外科学》第9版·普通外科·胃癌·早期胃癌的概念","green"],["2021N163X","男性急性尿潴留的常见原因有",["良性前列腺增生","尿路狭窄","尿路结石","前列腺炎"],"ABC","X","外科学",2021,"real","外科学|泌尿外科","急性尿潴留的常见原因","男性急性尿潴留最常见原因为良性前列腺增生致膀胱颈出口梗阻（A），其次为尿道狭窄（B）、尿道或膀 期初"],"D","A","生理学",2022,"real","生理学|血液循环","主动脉瓣关闭时相与等容舒张期","射血期末室内压低于主动脉压，主动脉内血液回推使主动脉瓣关闭，标志着等容舒张期开始，D正确。心房收缩期末为房室瓣关闭（等容收缩期开始前）；快速射血期初为主动脉瓣开放；减慢射血期初瓣膜仍开放。等容舒张期室内压急降而容积不变。","《生理学》第9版·血液循环·心脏的泵血功能","green"],["2022N6A","可以增加静脉回心血量的是",["大失血","用力呼气","每搏输出量增加","由平卧位突然站立"],"C","A","生理学",2022,"real","生理学|其他","影响静脉回心血量的因素","静脉回心血量取决于外周静脉压与中心静脉压之差及静脉阻力。心缩力增强使每搏输出量增加、射血更完全，收缩末期心室容积更小、舒张期室内压更低，对心房及静脉血的抽吸增强，回心血量增多，C正确。大失血使循环血量减少；用力呼气使胸内压升高、静脉回流受阻；由卧位突然站立使下肢血液淤滞、回心血量减少。","《生理学》第9版·血液循环·血管生理","green"],["2022N7A","在呼吸过程中，肺内压最低值出现的时期是",["吸气相起始期","吸气相中期","呼气相起始期","呼气相中期"],"B","A","生理学",2022,"real","生理学|其他","呼吸过程中肺内压的变化","吸气时胸廓扩大使肺被动扩张、肺内压下降，吸气中期肺内压降至最低（较大气压低1~2mmHg），此时气体入肺最快；吸气末肺内压与大气压相等。呼气时肺内压升高为正压。故B正确，其余各期肺内压均高于吸气中期。","《生理学》第9版·呼吸·肺通气原理","green"],["2022N8A","辅脂酶在甘油三酯消化中的作用是",["分解甘油三酯","乳化甘油三酯","激活胰脂肪酶","防止胰脂肪酶从脂滴表面清除"],"D","A","生物化学",2022,"real","生物化学|酶","辅脂酶的作用","胰脂肪酶须吸附在乳化脂滴的水化油-水界面上才发挥作用，胆汁酸盐和磷脂会占据界面并将其“挤走”。辅脂酶与胰脂肪酶结合后锚定于脂滴表面，防止脂肪酶被胆盐清除，从而维持其催化活性，故作用为D。辅脂酶本身无脂肪酶活性、不乳化脂质、也不能激活胰脂肪酶（激活者是胰蛋白酶原激活过程）。","《生物化学与分子生物学》第9版·脂类代谢·脂类的消化与吸收","green"],["2022N9A","可导致肾小球滤过率增加的因素是",["交感神经兴奋","肾盂结石","收缩压升高到150 mmHg","肾血浆流量增加"],"D","A","生理学",2022,"real","生理学|尿的生成和排出","肾血浆流量与滤过平衡","肾血浆流量增加使血浆胶体渗透压在滤过膜后段上升更快被稀释、有效滤过压升高，滤过平衡点向出球小动脉端移动，GFR增多，D正确。交感神经兴奋使入球小动脉收缩、GFR下降；肾盂结石致肾小囊内压升高、有效滤过压降低；收缩压在80~180mmHg范围内肾血流自身调节使GFR基本不变。","《生理学》第9版·尿的生成和排出·肾小球的滤过功能","green"],["2022N10A","肾脏直小血管的功能是",["带走肾髓质中的溶质","维持肾皮质低渗状态","保持肾髓质间质的高渗状态","维持肾组织的血液供应"],"C","A","生理学",2022,"real","生理学|其他","直小血管的逆流交换作用","直小血管与髓袢平行走行，呈U形，作为逆流交换器既带走髓质中多余水分和溶质，又最大限度保留溶质，从而维持肾髓质间质的高渗梯度，为尿浓缩所必需，C正确。它不带走全部溶质、也不维持皮质低渗（皮质低渗靠近端小管等渗重吸收与直小血管供血），其功能重点不在单纯供血。","《生理学》第9版·尿的生成和排出·尿的浓缩和稀释","green"],["2022N11A","突触前抑制的特点是",["感觉传入通路中少见","减少突触前神经元的递质释放","增加被抑制神经元的CI内流","被抑制神经元产生IPSP"],"B","A","生理学",2022,"real","生理学|神经系统","突触前抑制的机制与特点","突触前抑制的结构基础是轴突-轴突式突触：末梢A的递质使末梢B去极化幅度减小、进入B的Ca2+减少，从而B释放递质减少、后继神经元EPSP减小，故B正确。它多见于感觉传入通路（A错）；突触后膜无CI-通透性改变、也不产生IPSP（C、D为突触后抑制的特点）。","《生理学》第9版·神经系统·突触传递","green"],["2022N12A","在人类，属于单突触反射的是",["腱反射______ _","逃避反射__","吸吮反射___I"," 胞内移向细胞外，故细胞外液减少、细胞内液亦减少（而非增加），B错误，为本题答案。高渗使抗利尿激素分泌增加致尿量减少，血容量下降激活肾素-血管紧张素-醛固酮系统使醛固酮增加，故A、C、D均正确。","《病理学》第9版·细胞和组织的适应与损伤·水代谢紊乱","green"],["2022N58A","休克代偿期的临床表现是",["血压正常或稍高，心率、脉压正常","血压正常或稍低，心率、脉压正常","血压正常或稍高，心率快，脉压缩小","血压正常或稍低，心率快，脉压增加"],"C","A","外科学",2022,"real","外科学|外科总论","休克代偿期表现","休克代偿期（微循环收缩期）交感-肾上腺髓质强烈兴奋，心率增快、外周血管收缩，舒张压升高使脉压缩小，而收缩压尚可维持正常或稍高，故C正确。A、B所述脉压正常与代偿期不符；D脉压增大见于高排低阻型感染性休克或动静脉瘘，故不选。","《外科学》第9版·外科总论·休克·临床表现与分期","green"],["2022N59A","全胃肠外营养时，补充氮（克）和热量（千卡）的比例一般是",["1:10～1:50","1:60～1:90 0","1:150～1:200","1:250～1:300"],"C","A","病理学",2022,"real","病理学|其他","TPN的氮热比","全胃肠外营养时须同时供给足够非蛋白热量以保证氨基酸用于合成蛋白质而不被作为能源消耗。一般按每补充1g氮（约6.25g蛋白质）同时供给150～200kcal非蛋白热量（葡萄糖与脂肪乳），即氮与热量之比为1∶150～1∶200，故选C。比例低于此值（热量不足）则氨基酸被氧化供能，起不到合成代谢作用；过高则增加代谢负担和脂肪蓄积。","《外科学》第9版·外科病人的营养代谢·肠外营养","green"],["2022N60A","预防甲亢术后甲状腺危象最关键的措施是",["术后应用镇静药物","吸氧","术后给予氢化可的松","术前使基础代谢率降至正常范围"],"D","A","内科学",2022,"real","内科学|内分泌与代谢","甲亢术前准备与危象预防","甲状腺危象的根本预防在于术前充分准备：使基础代谢率降至正常（±20%）、心率<90次/分、体重增加、情绪稳定后再手术，可显著降低危象发生率。术后镇静、吸氧、氢化可的松均为危象发生后的处理，不能起预防作用。","《外科学》第9版·甲状腺疾病·甲状腺危象的预防","green"],["2022N61A","女性，38岁。双侧乳房周期性胀痛3年，自检可触及直径1.5 cm不规则包块，伴触痛，月经 过后疼痛有所减轻，包块略缩小。最可能的诊断是",["乳腺癌","乳房纤维腺瘤","乳腺囊性增生病","乳管内乳头状瘤"],"C","A","病理学",2022,"real","病理学|细胞和组织的适应与损伤","乳腺囊性增生病的临床表现","中年女性，双侧乳房周期性胀痛3年，可触及不规则、边界不清的结节伴触痛，症状与月经周期密切相关（经后缓解、肿块缩小），是乳腺囊性增生病的典型表现，其病理基础为小叶腺泡及导管上皮增生、导管扩张囊性变，属良性增生性病变。乳腺癌多为单侧无痛性硬块、边界不清、活动度差；纤维腺瘤为边界清楚、光滑活动的无痛肿块；乳管内乳头状瘤以乳头溢液为主。","《外科学》第9版·乳房疾病·乳腺囊性增生病","green"],["2022N62A","下列有关创伤性窒息的病理生理改变，错误的是",["瞬间声门紧闭","小支气管和肺泡破裂","胸内压骤升","上腔静脉系统血逆流"],"B","A","病理学",2022,"real","病理学|其他","创伤性窒息的病理生理","创伤性窒息见于胸部或上腹部受强力挤压瞬间，患者反射性声门紧闭、胸内压骤升，上腔静脉系统血液逆流至头颈肩部，形成特征性皮肤黏膜密集瘀斑、球结膜下出血。此时气道因声门关闭处于闭合状态，压力经血流传导而非经气道传导，故不会造成小支气管和肺泡破裂（后者见于爆震伤、高压气浪伤），B错误，为本题答案；A、C、D均正确。","《外科学》第9版·胸部损伤·创伤性窒息","green"],["2022N63A","下列关于肺癌的描述，正确的是",["鳞癌常为周围型","鳞癌通常首先血行转移","腺癌在早期发生淋巴转移","小细胞癌对放、化疗都敏感"],"D","A","病理学",2022,"real","病理学|肿瘤","各型肺癌的生物学行为","小细胞癌分化最差、生长快、转移早，但恶性程度高者对放射治疗和化学治疗均高度敏感，是各型肺癌中对放化疗最敏感者，故D正确。鳞癌多位于肺门附近（中央型），早期即经淋巴道转移，A、B错；腺癌多为周围型，早期多经血道转移至脑、骨、肝，C错。","《病理学》第9版·呼吸系统疾病·肺癌","green"],["2022N64A","下列检查中，不属于诊断前列腺癌基本方法的是",["直肠指检","血清PSA水平","穿刺活检","血清癌胚抗原"],"D","A","外科学",2022,"real","外科学|泌尿外科","前列腺癌诊断方法","前列腺癌的基本诊断方法为直肠指检（A）、血清PSA（B）与经直肠超声引导下系统穿刺活检（C），三者构成诊断链。D血清癌胚抗原（CEA）主要在结直肠癌、胃癌、胰腺癌时升高，对前列腺癌无诊断价值，故为本题答案。","《外科学》第9版·泌尿外科·前列腺癌·诊断","green"],["2022N65A","腰椎管狭窄症区别于腰椎间盘突出症的主要临床特点是",["腰痛","坐骨神经痛","腰椎侧凸","神经源性间歇跛行"],"D","A","外科学",2022,"real","外科学|骨科","神经源性间歇跛行","腰椎管狭窄症最具鉴别意义的特点是神经源性间歇跛行：行走数十至数百米后出现下肢麻木、无力、酸痛，蹲下或弯腰休息后缓解，骑自行车不受限（椎管容积改变小），故选D。腰痛、坐骨神经痛与腰椎侧凸在腰椎间盘突出症中同样常见，不具鉴别价值，A、B、C不选。","《外科学》第9版·骨科·腰椎管狭窄症","green"],["2022N66A","下列不属于颈椎骨折合并高位截瘫并发症的是",["呼吸道感染_","泌尿道结石","心力衰竭","体温失调"],"C","A","外科学",2022,"real","外科学|外科总论","高位截瘫的并发症","颈椎骨折合并高位截瘫的常见并发症包括：呼吸肌麻痹与呼吸道感染（A）、泌尿系感染与结石（B）、压疮、深静脉血栓及体温失调（损伤平面以下汗腺分泌与血管舒缩功能障碍，D）、自主神经反射异常。C心力衰竭不是其典型并发症，高位颈髓损伤因交感传出中断反可出现心动过缓与低血压，故选C。","《外科学》第9版·骨科·脊柱骨折·脊髓损伤并发症","green"],["2022N67A","女性，56岁。车祸伤，右髋痛，右下肢变短，活动明显受限 2小时来诊。检查见右髋关节屈 曲、内收内旋。最可能的诊断是",["股骨颈骨折","股骨转子骨折","髋关节后脱位","髋关节前脱位"],"C","A","病理学",2022,"real","病理学|其他","髋关节前、后脱位的畸形鉴别","外伤后右髋痛、右下肢短缩，查体见患髋屈曲、内收、内旋，是髋关节后脱位的典型畸形（前脱位表现为外展、外旋、屈曲，且下肢多无明显短缩；中心性脱位伴髋臼骨折）。股骨颈及转子间骨折表现为下肢短缩、外旋45°～90°，但无内收内旋固定畸形。故选C。","《外科学》第9版·关节脱位·髋关节脱位","green"],["2022N68A","该孕妇的体检诊断，不正确的是",["心动过速","高血压","心脏扩大","正常第三心音"],"C","A","病理学",2022,"real","病理学|其他","妊娠期心血管系统的生理变化","本题为妊娠期心血管系统变化的共用题干题。妊娠中晚期血容量增加40%～50%、心率增快，可闻及生理性第三心音，出现心浊音界轻度扩大和心搏量增加，均属正常生理适应。故“心脏扩大”不能作为体检诊断（心脏器质性扩大属病理状态），C为不正确项。心动过速、下肢水肿、第三心音在妊娠期均属正常现象。","《妇产科学》第9版·妊娠生理·妊娠期母体变化","yellow"],["2022N69A","该孕妇出现第三心音最可能的原因是",["心室舒张期负荷过重","心率过快","心脏扩大","心力衰竭"],"A","A","病理学",2022,"real","病理学|其他","生理性第三心音的产生机制","妊娠期血容量增加使心脏前负荷（容量负荷）明显增大，心室舒张期充盈量增加，快速充盈期血流冲击心室壁产生生理性第三心音，故其最可能的原因是心室舒张期负荷过重，选A。心率过快只使第三心音更易听到而非产生原因；心脏扩大和心力衰竭属病理状态，本例为生理性变化，故B、C、D不选。","《妇产科学》第9版·妊娠生理·妊娠期母体变化","yellow"],["2022N70A","根据患者目前检查结果，最可能的诊断是",["肺栓塞","气胸","急性心肌梗死","胸腔积液"],"B","A","病理学",2022,"real","病理学|局部血液循环障碍","气胸的诊断","本题为共用题干题，题干缺失，答案为气胸。自发性气胸起病突然，患侧胸痛伴呼吸困难，查体患侧胸廓饱满、呼吸动度减弱、叩诊呈鼓音、呼吸音消失、气管向健侧移位，X线示患侧肺压缩边缘。肺栓塞需有深静脉血栓来源并靠CTPA确诊；急性心肌梗死以胸骨后压榨痛、心电图ST段抬高及肌钙蛋白升高为特征；胸腔积液叩诊为浊音。故选B。","《病理学》第9版·呼吸系统疾病·气胸","yellow"],["2022N71A","该患者还可能出现的体征是",["气管向左侧偏移","左胸可闻及胸膜摩擦音","左肺可闻及湿啰音","左胸语音震颤消失"],"D","A","病理学",2022,"real","病理学|其他","气胸的体征","共用题干缺失，患者为（左侧）气胸。气胸时胸膜腔积气使肺组织被压缩、含气肺组织减少，声波传导受阻，患侧语音震颤明显减弱乃至消失，故D正确。气管应向健侧（右侧）偏移而非左侧，A错；胸膜摩擦音见于干性胸膜炎，气胸时胸膜分离反而消失，B错；湿啰音见于肺水肿、肺炎等肺泡内有渗出液时，C错。","《病理学》第9版·呼吸系统疾病·气胸","yellow"],["2022N72A","该患者不可能出现的体征是",["心尖搏动消失","肺动脉瓣区第二心音增强","心界叩诊向左扩大","窦性心动过速"],"C","A","病理学",2022,"real","病理学|其他","大量气胸的体征与心界变化","共用题干缺失，患者为左侧气胸。气胸时因肺压缩、通气/血流比例失调和纵隔移位，可出现窦性心动过速和肺动脉瓣区第二心音（P2）增强；大量气胸致左侧胸膜腔压力增高，心尖搏动可减弱或消失。但心界叩诊向患侧扩大需有心脏本身增大或心包积液，气胸时叩诊呈鼓音、心界反而缩小或向健侧移位，故C不可能出现。","《病理学》第9版·呼吸系统疾病·气胸","yellow"],["2022N73A","该患者最可能的诊断是",["医院获得性肺炎","肺不张","急性呼吸窘迫综合征","心力衰竭"],"C","A","病理学",2022,"real","病理学|呼吸系统疾病","ARDS的病理与临床特点","共用题干缺失，从答案看考查急性呼吸窘迫综合征（ARDS）。ARDS由严重感染、创伤、休克等诱发弥漫性肺泡毛细血管损伤，肺泡内富含蛋白的渗出液形成透明膜，临床表现为原发病后1～3天出现进行性呼吸困难和顽固性低氧血症，常规吸氧难以纠正，胸片示双肺弥漫浸润影，PaO2/FiO2≤300。医院获得性肺炎须有入院48小时后新发感染证据；肺不张为局限性呼吸音减弱。","《病理学》第9版·呼吸系统疾病·急性呼吸窘迫综合征","yellow"],["2022N74A","对该患者疾病诊断意义最大的检查是",["痰培养","胸部CT","动脉血气分析","心脏超声"],"C","A","内科学",2022,"real","内科学|其他","动脉血气分析的作用","判断呼吸衰竭及其类型最有意义的检查是动脉血气分析：PaO₂<60mmHg伴或不伴PaCO₂>50mmHg即可确诊并分型，同时评价酸碱失衡与氧合指数，是诊断与调整机械通气的金标准。痰培养为病原学、胸部CT为形态学、心脏超声为心功能评估。","《内科学》第9版·呼吸系统疾病·呼吸衰竭","green"],["2022N75A","确诊后该患者首选的治疗是",["氧疗，机械通气","强心，利尿","抗感染治疗","气管镜吸痰"],"A","A","内科学",2022,"real","内科学|其他","呼衰的氧疗与机械通气","呼吸衰竭确立后，首要治疗是纠正缺氧与通气不足：氧疗并根据病情选择无创或有创机械通气（Ⅱ型呼衰低流量持续吸氧，必要时无创通气），同时治疗原发病。强心利尿用于心衰为主者；抗感染是基础病因治疗；气管镜吸痰为辅助排痰措施。","《内科学》第9版·呼吸系统疾病·呼吸衰竭","green"],["2022N76A","该患者冠心病的分型是",["稳定型心绞痛","不稳定型心绞痛","非ST段抬高型心肌梗死","急性 ST段抬高型心肌梗死"],"B","A","内科学",2022,"real","内科学|循环系统疾病","不稳定型心绞痛的识别","心绞痛发作频率增加、程度加重、时间延长、活动耐量下降或静息时发作，属不稳定型心绞痛（恶化劳力型），病理基础为斑块不稳定、血栓未完全闭塞，肌钙蛋白阴性与NSTEMI区别。稳定型心绞痛在1～3个月内发作性质稳定；STEMI有持续性胸痛及ST段抬高等心电图改变。","《内科学》第9版·循环系统疾病·不稳定型心绞痛","green"],["2022N77A","根据加拿大心血管病学会（CCS）分级，该患者疾病严重度为",["I级","级","Ⅲ级","Ⅳ级"],"B","A","内科学",2022,"real","内科学|其他","CCS心绞痛分级","CCS心绞痛严重程度分级：Ⅰ级为一般活动（步行>200m、登楼>1层）不引起心绞痛；Ⅱ级为日常活动轻度受限，快步行走或登楼1层以上、饱餐后或情绪激动时发作；Ⅲ级为明显受限（步行100～200m即发作）；Ⅳ级为休息时发作。本题所述属Ⅱ级。","《内科学》第9版·循环系统疾病·稳定型心绞痛","green"],["2022N78A","该患者最佳的治疗选择是",["溶栓治疗","长效硝酸甘油口服","PCI术","加用β受体拮抗剂"],"C","A","内科学",2022,"real","内科学|其他","UA的介入治疗指征","不稳定型心绞痛属高危急性冠脉综合征，药物控制不佳或存在高危特征时应尽早行冠状动脉造影及经皮冠状动脉介入治疗（PCI），以血运重建降低心梗与死亡风险。溶栓仅用于无PCI条件的STEMI且为UA/NSTEMI禁忌；长效硝酸酯、β受体拮抗剂仅为药物治疗，不能替代血运重建。","《内科学》第9版·循环系统疾病·不稳定型心绞痛","green"],["2022N79A","该患者最可能的诊断是",["急性胃炎","胃溃疡","急性胰腺炎","急性心肌梗死"],"C","A","内科学",2022,"real","内科学|循环系统疾病","急性胰腺炎的诊断","上腹持续剧痛向腰背放射、呕吐后不缓解、弯腰可减轻、血淀粉酶升高，为急性胰腺炎；需与急性心梗鉴别（下壁心梗可表现为上腹痛），但后者有心肌酶、心电图动态改变。急性胃炎疼痛轻、呕吐后缓解；胃溃疡为上腹痛、进食后加重；急性胆管炎有Charcot三联征。","《内科学》第9版·消化系统疾病·急性胰腺炎","green"],["2022N80A","对该患者确诊最有意义的检查是",["血、尿淀粉酶","胃镜","腹部B超","心电图 售"],"A","A","内科学",2022,"real","内科学|其他","血尿淀粉酶对急性胰腺炎的诊断","确诊急性胰腺炎最有意义的是血清及尿淀粉酶（血清淀粉酶≥正常上限3倍即有诊断价值，脂肪酶特异性更高）。胃镜、腹部B超主要用于排除溃疡与胆道病因；心电图用于排除心梗，均不直接诊断胰腺炎。","《内科学》第9版·消化系统疾病·急性胰腺炎","green"],["2022N81A","对该患者的最基本治疗是",["镇痛","禁食、补液","心电监护和扩冠脉治疗","抑酸药物治疗"],"B","A","内科学",2022,"real","内科学|其他","急性胰腺炎的基础治疗","急性胰腺炎最基本的治疗是禁食、胃肠减压与补液（液体复苏为早期核心，首选乳酸林格液），可减少胰液分泌、纠正低血容量。镇痛、抑酸为辅助；心电监护加扩冠脉为冠心病治疗，若误诊将延误病情。","《内科学》第9版·消化系统疾病·急性胰腺炎","green"],["2022N82A","该患者最可能的诊断是",["急性尿道炎","尿道综合征","急性膀胱炎","急性肾孟肾炎 ]"],"D","A","内科学",2022,"real","内科学|其他","急性肾盂肾炎的诊断","发热寒战、腰痛伴尿频尿急尿痛，尿中白细胞增多并见白细胞管型，为急性肾盂肾炎的典型表现：管型提示炎症位于肾实质。急性膀胱炎与急性尿道炎仅有尿路刺激症状、无发热及腰痛；尿道综合征尿检与尿培养均阴性、多见于中年女性，故不选。","《内科学》第9版·泌尿系统疾病·尿路感染","green"],["2022N83A","不作为常用治疗的药物是",["环丙沙星","阿莫西林","罗红霉素","头孢呋辛"],"C","A","内科学",2022,"real","内科学|其他","肾盂肾炎的抗生素选择","急性肾盂肾炎经验性用药应选对革兰阴性杆菌有效的药物：喹诺酮类（环丙沙星）、氨基青霉素（阿莫西林，宜联合β内酰胺酶抑制剂）、第二/三代头孢（头孢呋辛）均可。罗红霉素属大环内酯类，主要覆盖革兰阳性球菌与非典型病原体，对大肠埃希菌无效，故不作为常用治疗。","《内科学》第9版·泌尿系统疾病·尿路感染","green"],["2022N84A","一般用药的疗程是",["3～5天","6~9天","10～14天","15~19天"],"C","A","内科学",2022,"real","内科学|其他","肾盂肾炎的疗程","急性肾盂肾炎抗菌疗程一般10～14天，体温正常后继续口服序贯，可显著降低复发率；3～5天仅适用于非妊娠女性的单纯性膀胱炎，对肾实质感染不足，15～19天无额外获益且增加不良反应与耐药风险。故疗程选10～14天。","《内科学》第9版·泌尿系统疾病·尿路感染","green"],["2022N85A","该患者最可能的诊断是",["再生障碍性贫血","急性白血病","Evans 综合征","霍奇金淋巴瘤"],"B","A","内科学",2022,"real","内科学|血液系统疾病","急性白血病的临床表现","青年患者出现发热、贫血、出血倾向（皮肤瘀点、牙龈出血）、胸骨压痛及肝脾淋巴结肿大，血象示白细胞异常、可见原始细胞，最可能为急性白血病。再生障碍性贫血无肝脾淋巴结肿大及胸骨压痛；Evans综合征为AIHA合并ITP；霍奇金淋巴瘤以淋巴结肿大、B症状为主而少有原始细胞。","《内科学》第9版·血液系统疾病·急性白血病","green"],["2022N86A","查体中应特别注意的体征是",["睑结膜苍白}","巩膜黄染","胸骨压痛","心脏杂音"],"C","A","内科学",2022,"real","内科学|其他","胸骨压痛的诊断价值","胸骨压痛是急性白血病白血病细胞在骨髓腔内大量增殖、压力增高所致的特征性体征，对提示白血病最有意义。睑结膜苍白仅提示贫血；巩膜黄染提示溶血或肝病；心脏杂音提示心内膜炎或贫血性杂音，特异性差。","《内科学》第9版·血液系统疾病·急性白血病","green"],["2022N87A","对诊断最有意义的检查是",["骨髓细胞学检查","骨髓活检","淋巴结活检","Coombs试验"],"A","A","内科学",2022,"real","内科学|其他","急性白血病的骨髓诊断","骨髓细胞学检查是确诊急性白血病的必查项目，可判断原始细胞比例（≥20%）、形态学分型（FAB）及细胞化学染色，结合流式细胞术、遗传学与分子检测完成WHO分型。骨髓活检用于判断增生程度与纤维化；淋巴结活检用于淋巴瘤；Coombs试验诊断AIHA。","《内科学》第9版·血液系统疾病·急性白血病","green"],["2022N88A","对患者确诊最有价值的检查结果是",["TPOAb阳性","TgAb阳性","TPOAb和 TgAb均阳性","TRAb阳性"],"D","A","内科学",2022,"real","内科学|其他","TRAb阳性与Graves病","Graves病确诊最特异的是TRAb阳性，它反映针对TSH受体的刺激性抗体，与病情活动、复发相关，可用于停药决策。TPOAb、TgAb阳性主要见于桥本甲状腺炎；二者同时阳性也不能确立Graves病。","《内科学》第9版·内分泌与代谢疾病·甲状腺功能亢进症","green"],["2022N89A","给予患者甲巯咪唑10 mg，每日二次治疗。2周后门诊复查;近 3天来感咽痛，T38.2℃，咽 部稍充血，查肝功正常，外周血 WBC 2.1×10°/L，中性粒细胞0.8×10°/L，考虑粒细胞减少 的最可能原因是",["疾病本身所致粒细胞减少","急性病毒感染","甲巯咪唑引起的粒细胞减少","假性粒细胞减少"],"C","A","内科学",2022,"real","内科学|其他","ATD致粒细胞缺乏","服用甲巯咪唑2周后出现咽痛发热、外周血白细胞2.1×10⁹/L、中性粒细胞0.8×10⁹/L，为抗甲状腺药物所致粒细胞缺乏（中性粒<1.5×10⁹/L），是最严重的副作用之一，多在用药后2～3个月内发生，与剂量相关。病毒感染可致中性粒减少但一般较轻；假性粒细胞减少见于感染、脾大等分布异常。","《内科学》第9版·内分泌与代谢疾病·甲状腺功能亢进症","green"],["2022N90A","针对患者粒细胞减少，不合适的处理是",["换用丙硫氧嘧啶100 mg，每日三次","停用甲巯咪唑","给予升白细胞药物","严密监测粒细胞变化"],"A","A","内科学",2022,"real","内科学|其他","ATD粒细胞缺乏的处理","甲巯咪唑引起粒细胞缺乏时，处理包括立即停药（B）、升白细胞药物（C）、监测血象与防治感染（D），必要时用G-CSF；不合适的做法是立即换用丙硫氧嘧啶（A）——PTU与甲巯咪唑同属硫脲类，存在交叉反应，可再次引起粒细胞缺乏，应改用¹³¹I或手术。","《内科学》第9版·内分泌与代谢疾病·甲状腺功能亢进症","green"],["2022N91A","该患者最可能的诊断是",["类风湿关节炎","风湿热","强直性脊柱炎","系统性红斑狼疮"],"A","A","内科学",2022,"real","内科学|风湿免疫","类风湿关节炎的诊断","中年女性、双手近端指间关节与掌指关节对称性肿痛伴晨僵>1小时、RF阳性、可见皮下结节与骨侵蚀，符合类风湿关节炎。风湿热多见于青少年、以游走性大关节炎及心脏炎为特点；强直性脊柱炎以骶髂关节炎、HLA-B27阳性为主；SLE有蝶形红斑、多系统损害、抗dsDNA阳性。","《内科学》第9版·风湿性疾病·类风湿关节炎","green"],["2022N92A","最有诊断价值的实验室检查是",["血清抗 Sm 抗体_","红细胞沉降率","HLA-B27","血清抗CCP抗体"],"D","A","内科学",2022,"real","内科学|风湿免疫","抗CCP抗体的诊断价值","抗CCP（环瓜氨酸肽）抗体对类
