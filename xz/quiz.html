液系统疾病·溶血性贫血","green"],["YC25N086A","【病例】男性，35岁，因“劳\n累后酱油色尿3年”来诊：查体：贫血貌，\n巩膜轻度黄染。血红蛋白80g/L，酸溶血\n试验阳性 【设问】对患者诊断特异性较强的结果是",["血浆结合珠蛋白水平下降","静脉血栓形成","骨髓造血衰竭","红细胞膜CD55和CD59表达下降"],"D","A","内科学",2025,"mock","内科学|血液系统疾病","PNH的CD55/CD59检测","PNH是获得性红细胞膜糖基磷脂酰肌醇（GPI）锚合成障碍性疾病，红细胞、粒细胞、单核细胞膜上CD55与CD59表达显著下降，导致补体调节缺陷、血管内溶血，流式细胞术检测其阴性细胞群是最敏感、最特异的诊断指标。结合珠蛋白下降仅提示溶血；静脉血栓形成与骨髓衰竭是本病的表现而非特异诊断依据。","《内科学》第9版·血液系统疾病·溶血性贫血","green"],["YC25N087A","【病例】男性，35岁，因“劳\n累后酱油色尿3年”来诊：查体：贫血貌，\n巩膜轻度黄染。血红蛋白80g/L，酸溶血\n试验阳性 【设问】该患者最不可能出现的检查结果\n是",["骨髓含铁血黄素水平升高","网织红水平升高","全血细胞减少","血红蛋白尿\n（\n病、高血压病史20余年。近期感觉视物模\n糊，眼底检查发现新生血管形成。来院检\n查血压165/105mmHg。尿糖阳性，尿酮体\n（-），空腹血糖9.6mmol/L，血Cr178\numol/L。"],"A","A","内科学",2025,"mock","内科学|循环系统疾病","PNH的铁代谢与实验室特点","PNH长期血管内溶血使血红蛋白随尿持续丢失，多数患者呈缺铁状态，骨髓细胞外铁与含铁血黄素降低而非升高，故A最不可能出现。网织红细胞因骨髓代偿而升高；长期溶血与骨髓衰竭可致全血细胞减少（PNH-AA综合征）；血红蛋白尿是本病的标志性表现。","《内科学》第9版·血液系统疾病·溶血性贫血","green"],["YC25N088A","【病例】女性，56岁，糖尿\n病、高血压病史20余年。近期感觉视物模\n糊，眼底检查发现新生血管形成。来院检\n查血压165/105mmHg。尿糖阳性，尿酮体\n（-），空腹血糖9.6mmol/L，血Cr178\numol/L。 【设问】该患者降压首选药物是",["ACEI","β受体阻滞剂","CCB","呋塞米"],"A","A","内科学",2025,"mock","内科学|循环系统疾病","糖尿病肾病降压首选ACEI/ARB","糖尿病患者出现蛋白尿与血肌酐升高（178μmol/L），提示糖尿病肾病合并肾功能不全。ACEI（或ARB）能扩张出球小动脉、降低肾小球内高压、减少蛋白尿并延缓肾病进展，且不增高血糖，是首选降压药，需监测血钾与血肌酐。β受体阻滞剂可掩盖低血糖症状；CCB降蛋白尿作用弱；呋塞米仅用于水肿与容量负荷过重。","《内科学》第9版·泌尿系统疾病·糖尿病肾病","green"],["YC25N089A","【病例】女性，56岁，糖尿\n病、高血压病史20余年。近期感觉视物模\n糊，眼底检查发现新生血管形成。来院检\n查血压165/105mmHg。尿糖阳性，尿酮体\n（-），空腹血糖9.6mmol/L，血Cr178\numol/L。 【设问】该患者糖尿病视网膜病变属于",["1期","2期","3期","4期"],"D","A","内科学",2025,"mock","内科学|循环系统疾病","糖尿病视网膜病变分期","我国糖尿病视网膜病变分期中，Ⅰ~Ⅲ期为单纯型（非增殖型）：Ⅰ期微血管瘤或合并小出血点，Ⅱ期硬性渗出，Ⅲ期棉絮状斑（软性渗出）；Ⅳ期出现新生血管或玻璃体积血，Ⅴ期纤维血管增殖，Ⅵ期视网膜脱离或新生血管性青光眼。本例眼底见新生血管形成，属Ⅳ期（增殖期起点）。","《内科学》第9版·内分泌与代谢疾病·糖尿病","green"],["YC25N090A","患者使用胰岛素治疗后晨起空腹血糖仍然偏高，此时应予以的处理是",["增加胰岛素使用量","联合使用改善胰岛素抵抗的药物","严格控制饮食摄入","检查夜间血糖明确病因\n（\n来无明显诱因发热、双膝关节疼痛入院。\n查体：体温38.1℃，四肢皮肤可见出血点，\n口腔黏膜溃疡，心、肺、腹部检查未见异\n常。化验血Hb100g/L，WBC5.3*10^9，Plt\n21*10^9，网织红0.045。尿蛋白（++），确\n诊为系统性红斑狼疮"],"D","A","生理学",2025,"mock","生理学|能量代谢和体温","胰岛素治疗与清晨高血糖的鉴别","胰岛素治疗后晨起空腹血糖仍高，存在两种截然不同的原因：一是苏木杰效应（夜间低血糖后反跳性高血糖，需减少胰岛素），二是黎明现象（夜间血糖正常或偏高、清晨升糖激素分泌增多，需增加或调整胰岛素）。二者处理相反，故不可盲目加量，必须先监测夜间血糖（必要时加测凌晨 2～3 点）明确病因，D 正确。A 增加胰岛素量若为苏木杰效应将使低血糖更严重。B 改善胰岛素抵抗药物不能解决剂量不当或黎明现象。C 单纯严格控制饮食不能纠正夜间低血糖反跳，且可能加重低血糖。故先查明病因再调整方案。","《内科学》第9版·内分泌与代谢疾病·糖尿病","green"],["YC25N091A","【病例】女性，32岁。2周\n来无明显诱因发热、双膝关节疼痛入院。\n查体：体温38.1℃，四肢皮肤可见出血点，\n口腔黏膜溃疡，心、肺、腹部检查未见异\n常。化验血Hb100g/L，WBC5.3*10^9，Plt\n21*10^9，网织红0.045。尿蛋白（++），确\n诊为系统性红斑狼疮 【设问】最支持该项诊断的检查结果是",["抗dsDNA抗体阳性","抗sm抗体阳性","SSA抗体阳性","CCP抗体阳性"],"B","A","内科学",2025,"mock","内科学|风湿免疫","SLE标记性抗体（抗Sm）","抗Sm抗体是SLE的标记性抗体，特异性极高（约99%），一旦阳性对SLE诊断具有决定性意义，故最支持该诊断。抗dsDNA抗体特异性也较高但敏感度低，且与疾病活动、狼疮肾炎相关；抗SSA抗体多见于干燥综合征与SLE；抗CCP抗体是类风湿关节炎的特异性抗体。","《内科学》第9版·风湿性疾病·系统性红斑狼疮","green"],["YC25N092A","【病例】女性，32岁。2周\n来无明显诱因发热、双膝关节疼痛入院。\n查体：体温38.1℃，四肢皮肤可见出血点，\n口腔黏膜溃疡，心、肺、腹部检查未见异\n常。化验血Hb100g/L，WBC5.3*10^9，Plt\n21*10^9，网织红0.045。尿蛋白（++），确\n诊为系统性红斑狼疮 【设问】该患者基础背景治疗应选用",["糖皮质激素","环孢素","羟氯喹","吗替麦考酚酯\n（\n因转移性右下腹痛12小时入院，诊断为“急\n性阑尾炎”，当晚行阑尾切除术，病理为坏\n疽性阑尾炎。自术后次日晨起，患者表现\n为腹痛，烦躁不安，未解小便，查体：面\n色苍白，皮肤湿冷，心率110次／分，较\n弱，血压80／60mmHg，腹稍胀，全腹压痛，\n肌紧张，肠鸣音减弱。"],"C","A","内科学",2025,"mock","内科学|风湿免疫","SLE的基础治疗（羟氯喹）","羟氯喹是SLE的基础背景治疗，可减少复发、降低血栓与器官损伤、改善长期预后，所有无禁忌的SLE患者均推荐长期服用，并需定期眼底检查。糖皮质激素用于活动期诱导缓解，不作为基础维持；环孢素、吗替麦考酚酯属免疫抑制剂，用于重要脏器受累或激素减量困难者。","《内科学》第9版·风湿性疾病·系统性红斑狼疮","green"],["YC25N093A","该患者目前情况，应考虑的诊断\n二十余年教学积淀·助力学员考研上岸！",["术后肠麻痹","术后疼痛所致","术后尿潴留","术后腹腔内出血"],"D","A","内科学",2025,"mock","内科学|其他","阑尾术后腹腔内出血","阑尾切除术后次日出现腹痛、烦躁、面色苍白、皮肤湿冷、心率增快、血压下降、全腹压痛及肌紧张、肠鸣音减弱、未解小便，是术后腹腔内出血致失血性休克的表现（阑尾系膜血管结扎线脱落最常见）。术后肠麻痹无休克与腹膜刺激征；术后疼痛不会引起血压下降与皮肤湿冷；尿潴留表现为膀胱充盈，不能解释休克与腹膜炎体征。","《外科学》第9版·阑尾疾病·阑尾切除术的并发症","green"],["YC25N094A","【病例】患者，男，18岁。\n因转移性右下腹痛12小时入院，诊断为“急\n性阑尾炎”，当晚行阑尾切除术，病理为坏\n疽性阑尾炎。自术后次日晨起，患者表现\n为腹痛，烦躁不安，未解小便，查体：面\n色苍白，皮肤湿冷，心率110次／分，较\n弱，血压80／60mmHg，腹稍胀，全腹压痛，\n肌紧张，肠鸣音减弱。 【设问】诊断明确后，应采取何种治疗方\n法",["镇静、止痛治疗","留置导尿管","输液输血治疗","剖腹探查术\n（\n既往有胆囊结石，近2个月出现巩膜、皮\n肤黄染，呈进行性加重，无腹痛，消瘦，\n查体：肝肋下可触及，右上腹扪及肿大的\n胆囊，无触痛，无发热。"],"D","A","外科学",2025,"mock","外科学|外科总论","术后腹腔内出血的处理","确诊腹腔内出血后应在补液输血抗休克的同时立即剖腹探查，找到出血点（多为阑尾系膜或系膜血管结扎线滑脱）予以确切止血并清除腹腔积血。镇静止痛会掩盖病情；留置导尿管 2,3-DPG 升高与脱氧 Hb 结合稳定 T 型，右移，选（见于缺氧、贫血、慢性阻塞性肺疾病）。A pH 增加使 Hb 更易结合 O₂（Bohr 效应），曲线左移，不选。B Hb 由 T 型变构为 R 型即由“紧密型”转为“松弛型”，对 O₂ 亲和力增高，曲线左移，不选。故答案为 CD。","《生理学》第9版·呼吸·气体在血液中的运输","green"],["YC25N138X","壁细胞上存在的受体有",["组胺受体","CCK受体","生长抑素受体","蛙皮素受体"],"ABC","X","外科学",2025,"mock","外科学|其他","壁细胞受体类型","胃壁细胞膜上同时存在多种调节受体：组胺H₂受体（经cAMP促进胃酸分泌）、促胃液素/CCK-B受体（经Ca²⁺促进泌酸）、乙酰胆碱M₃受体及生长抑素受体（抑制泌酸）。故组胺受体、CCK受体、生长抑素受体均存在。蛙皮素（铃蟾肽）受体位于G细胞，介导促胃液素释放，不在壁细胞上。","《生理学》第9版·消化·胃液分泌的调节","green"],["YC25N139X","可以NH4+形式泌氨的部位有",["近端小管","髓袢升支细段","髓袢升支粗段","集合管"],"AC","X","外科学",2025,"mock","外科学|其他","肾脏泌氨与酸碱平衡","肾小管泌氨有两种形式：近端小管上皮细胞摄取谷氨酰胺，经谷氨酰胺酶生成NH₃与NH₄⁺，NH₄⁺经管腔膜主动分泌入小管液并伴HCO₃⁻重吸收；髓袢升支粗段也存在NH₄⁺的主动重吸收与再循环。髓袢升支细段与集合管不以NH₄⁺形式泌氨（集合管主要靠H⁺-ATP酶泌氢与NH₃弥散）。","《生理学》第9版·泌尿·肾小管和集合管的物质转运","green"],["YC25N140X","下列生理功能主要由胆碱能纤维\n释放递质实现的是",["温热性发汗","LES舒张","胃液的分泌","胃的容受性舒张"],"AC","X","生理学",2025,"mock","生理学|消化和吸收","胆碱能纤维与肽能纤维的功能","A 温热性发汗：汗腺的交感神经支配属胆碱能纤维（释放 ACh 作用于 M 受体），选。B 下食管括约肌（LES）舒张：由迷走神经抑制性纤维释放 VIP 和 NO 实现，属肽能/非肾上腺素非胆碱能（NANC）递质，不选。C 胃液分泌：迷走神经释放 ACh 直接兴奋壁细胞，并经 GRP 促 G 细胞释放促胃液素，二者均为胆碱能通路主导的环节，选。D 胃容受性舒张：由迷走神经抑制性纤维释放 VIP/NO 引起，属肽能纤维而非胆碱能，不选。故答案为 AC。判断要点是“抑制性效应多由 VIP/NO 介导，兴奋性腺体分泌与汗腺多由 ACh 介导”。","《生理学》第9版·神经系统·自主神经系统","green"],["YC25N141X","下列关于糖皮激素的生理作用说\n法正确的有",["促进脂肪合成","减少组织对糖的利用","促进骨髓造血功能，使血液中红细胞、\n血小板数量增加","可促进胎儿肺泡发育，防止新生儿呼吸\n窘迫综合征"],"BCD","X","外科学",2025,"mock","外科学|其他","糖皮质激素的生理作用","糖皮质激素抑制外周组织对葡萄糖的摄取与利用（B），促进骨髓造血使红细胞、血小板与中性粒细胞增多（C），并能促进胎儿肺泡Ⅱ型细胞合成肺表面活性物质，常用于促胎肺成熟、预防新生儿呼吸窘迫综合征（D）。糖皮质激素促进脂肪分解并引起脂肪向心性重新分布，而非促进脂肪合成，故A错误。","《生理学》第9版·内分泌·肾上腺皮质激素","green"],["YC25N142X","磷酸化为其活性形式的酶包括",["糖原磷酸化酶","激素敏感性甘油三酯脂肪酶","HMG-还原酶","丙酮酸脱氢酶"],"AB","X","生物化学",2025,"mock","生物化学|糖代谢","磷酸化/去磷酸化对酶活性的双向调节","糖原磷酸化酶经磷酸化酶b激酶磷酸化后由低活性的b型转为高活性的a型；激素敏感性甘油三酯脂肪酶（HSL）被PKA磷酸化后活性升高，促进脂肪动员，故A、B正确。HMG-CoA还原酶磷酸化后活性降低，丙酮酸脱氢酶复合体被PDH激酶磷酸化后失活，二者的活性形式均为去磷酸化状态，故C、D不选。","《生物化学与分子生物学》第9版·酶·酶的共价修饰调节","green"],["YC25N143X","常常参与肝脏生物转化第二相反\n应的基团有",["葡糖醛酸","甘氨酸","乙酰CoA","SAM"],"ABCD","X","外科学",2025,"mock","外科学|其他","第二相结合反应的供体","生物转化第二相为结合反应，常见结合基团及其供体为：葡萄糖醛酸（UDPGA）、硫酸基（PAPS）、乙酰基（乙酰CoA）、甲基（SAM）、甘氨酸、谷胱甘肽。四项所举葡糖醛酸、甘氨酸、乙酰CoA（供乙酰基）、SAM（供甲基）均参与第二相结合反应。","《生物化学与分子生物学》第9版·肝的生物化学·生物转化","green"],["YC25N144X","信号转导通路中，属于丝氨酸/苏\n氨酸蛋白激酶的是",["MAPK","PKC","RTK","Grab2"],"AB","X","生物化学",2025,"mock","生物化学|酶","丝氨酸/苏氨酸蛋白激酶","MAPK家族（ERK、p38、JNK）与PKC均属丝氨酸/苏氨酸蛋白激酶，磷酸化靶蛋白的丝氨酸或苏氨酸残基，故A、B正确。RTK（受体型酪氨酸激酶）磷酸化靶蛋白的酪氨酸残基，属酪氨酸蛋白激酶；Grb2是含SH2与SH3结构域的接头蛋白，本身没有激酶活性，靠募集SOS激活Ras，故C、D不选。","《生物化学与分子生物学》第9版·细胞信号转导·蛋白激酶与接头蛋白","green"],["YC25N145X","下列目的基因与载体的链接方式\n中适用于表达载体的有",["单一相同黏端连接","不同黏端连接","黏-平连接","平端连接"],"BC","X","外科学",2025,"mock","外科学|其他","表达载体的定向克隆","表达载体要求目的基因定向、正确地插入启动子下游并保持开放读框。不同黏端连接（两种不同黏性末端互补）可保证定向克隆，最常用（B）；黏-平连接可借助一端黏性末端定位、另一端平端减少自连，也属可行（C）。单一相同黏端连接可使插入片段以两个方向进入载体、并有载体自连，无法保证表达；平端连接效率低且不定向，均不适用于表达载体构建。","《生物化学与分子生物学》第9版·基因重组与基因工程","green"],["YC25N147X","可对蛋白质空间结构进行分析的\n生物技术包括",["Western-Blotting","生物信息学预测","核磁共振","冷冻电镜"],"BCD","X","外科学",2025,"mock","外科学|其他","蛋白质空间结构分析技术","研究蛋白质空间结构的技术包括：生物信息学同源建模与结构预测（B）、核磁共振（NMR，适用于小分子量蛋白溶液结构，C）、冷冻电镜（解析大分子复合物近原子分辨率结构，D）。Western blotting仅检测特定蛋白的表达量与分子量，不能解析空间结构。","《生物化学与分子生物学》第9版·蛋白质的结构与功能·研究方法","green"],["YC25N148X","属于液化性坏死的疾病是",["肝脓肿","风湿病","甲型肝炎","肝细胞点灶状坏死"],"ACD","X","病理学",2025,"mock","病理学|细胞和组织的适应与损伤","坏死的类型","液化性坏死发生于蛋白质与脂质含量高而凝固酶少的组织，或坏死组织被蛋白水解酶迅速溶解者。肝脓肿由大量中性粒细胞浸润、蛋白水解酶溶解坏死肝组织形成脓液，为液化性坏死，A正确；甲型肝炎时肝细胞点灶状坏死，坏死细胞被溶解吸收，属液化性坏死，C正确；肝细胞点灶状坏死本身即液化性坏死，D正确。B错：风湿病的特征性病变是结缔组织纤维素样坏死（风湿小体中央的纤维素样坏死灶），非液化性坏死。要点：脑梗死与脓肿是最典型的液化性坏死；胰腺炎则为脂肪坏死。","《病理学》第9版·细胞和组织的适应与损伤·坏死","green"],["YC25N149X","下列属于弥漫性非毒性甲状腺肿\n的特征是",["滤泡上皮细胞周围可见大量吸收空泡","胶质储存期上皮细胞呈扁平状","增生期上皮细胞呈高柱状","结节期可见不对称的甲状腺肿大"],"BD","X","外科学",2025,"mock","外科学|普通外科","单纯性甲状腺肿的分期病理","弥漫性非毒性甲状腺肿（单纯性甲状腺肿）分三期：增生期滤泡上皮增生呈立方或高柱状、胶质少；胶质蓄积期滤泡腔显著扩大、充满胶质、上皮受压变扁平，此时甲状腺弥漫性对称肿大；结节期形成大小不等的结节，甲状腺呈不对称性肿大，结节内常见出血、坏死、囊性变、纤维化与钙化。吸收空泡大量出现是甲亢（Graves病）的表现。⚠️原答案存疑：增生期上皮呈高柱状亦为教材所述特征，C项应视为正确，故按教材答案更接近BCD。","《病理学》第9版·内分泌系统·甲状腺疾病·非毒性甲状腺肿","yellow"],["YC25N150X","肉芽肿性炎的说法正确的是",["主要成分是上皮样细胞和多核巨细胞","炎性息肉和炎性假瘤属于肉芽肿性炎","各型肉芽肿表现不一","组织修复时可出现"],"AC","X","病理学",2025,"mock","病理学|炎症","肉芽肿性炎","肉芽肿性炎是以巨噬细胞及其衍生细胞（上皮样细胞、多核巨细胞）局限性增生形成结节为特点的特殊类型慢性炎症，故主要成分为上皮样细胞与多核巨细胞，A正确；不同病因的肉芽肿形态各异（结核为干酪样坏死性肉芽肿、结节病为非干酪性、伤寒为伤寒小结、异物性肉芽肿伴异物及裂隙），C正确。B错：炎性息肉与炎性假瘤属增生性炎（黏膜上皮或纤维组织增生形成），不形成肉芽肿，切勿与“肉芽组织/肉芽肿”混淆；D错：组织修复时出现的是肉芽组织（新生毛细血管、成纤维细胞、炎细胞），而非肉芽肿性炎。","《病理学》第9版·炎症·肉芽肿性炎","green"],["YC25N151X","以下属于浸润性生长的肿瘤是",["葡萄胎","血管瘤","动脉瘤","Bowen病"],"BD","X","外科学",2025,"mock","外科学|神经外科","浸润性生长的肿瘤","血管瘤无包膜、边界不清，向周围组织间隙内生长，属良性肿瘤中的浸润性生长方式（B）；Bowen病为表皮内原位癌，癌细胞异型明显、可累及毛囊与汗腺导管并向深部推进，具有浸润性生长的生物学行为（D）。葡萄胎为滋养层细胞增生伴绒毛水肿，呈膨胀性生长（A）；动脉瘤是血管壁的局限性扩张，并非真性肿瘤（C）。","《病理学》第9版·肿瘤·肿瘤的生长方式","green"],["YC25N152X","关于病毒性肝炎的说法正确的是",["桥接坏死大部分可以完全再生","甲肝病毒引起肝硬化的转化率较高","部分肝细胞可见凋亡小体出现","所有的急性肝炎都可以见到毛玻璃样的\n肝细胞"],"BC","X","外科学",2025,"mock","外科学|其他","病毒性肝炎的病理变化","病毒性肝炎时肝细胞凋亡形成嗜酸性小体（Councillman小体），见于各型急性肝炎（C）。桥接坏死累及汇管区与中央静脉之间或相邻汇管区的肝细胞，网状支架塌陷，多难以完全再生、常进展为肝硬化（A错）；甲型肝炎为自限性、不转慢性，极少发展为肝硬化（B错）；毛玻璃样肝细胞为HBsAg在胞质内蓄积的表现，见于乙型肝炎病毒携带者与慢性乙型肝炎，并非所有急性肝炎都有（D错）。⚠️原答案存疑：B项“甲肝病毒引起肝硬化转化率较高”与教材不符，按教材答案应为C。","《病理学》第9版·传染病·病毒性肝炎","yellow"],["YC25N153X","关于结核病的叙述，正确的是",["慢性纤维空洞型肺结核的传染性最强，\n危害最大","原发性肺结核病变新旧不一，上重下轻","原发性、继发性肺结核均可引起粟粒性\n结核病","睾丸结核是男性不育的常见原因"],"AC","X","外科学",2025,"mock","外科学|其他","肺结核类型与特点","慢性纤维空洞型肺结核为继发性肺结核的晚期类型，空洞长期不愈、反复排菌，传染性最强、对周围人群危害最大（A）；原发性和继发性肺结核的血行播散均可引起急性或慢性粟粒性结核病（C）。“病变新旧不一、上重下轻”是继发性肺结核的特点，原发性肺结核表现为原发综合征（Ghon灶、淋巴管炎、肺门淋巴结肿大），故B错误。男性生殖系结核以附睾结核最常见，可致输精管阻塞而不育，但D并非教材强调的“常见原因”表述。","《病理学》第9版·传染病·结核病","green"],["YC25N154X","气胸常见的体征包括",["气管向健侧移位","语颤减弱","肝浊音界下降","呼吸音降低"],"ACD","X","外科学",2025,"mock","外科学|胸心外科","气胸的体征","气胸的典型体征：患侧胸廓饱满、呼吸动度减弱，气管与纵隔向健侧移位，叩诊呈鼓音，听诊呼吸音减弱或消失，语音传导（语颤）减弱，右侧气胸时肝浊音界下移甚至消失，可伴皮下气肿。⚠️原答案存疑：语颤减弱（B）同样是气胸的公认体征，其机制为胸膜腔积气阻碍声波传导，故按教材B亦应入选，本题更接近ABCD。","《外科学》第9版·胸心外科·气胸·临床表现与体征","yellow"],["YC25N155X","对慢性心衰病人远期改善有积极\n意义的药物是",["洋地黄","ACEI","呋塞米","β受体阻滞剂"],"BD","X","内科学",2025,"mock","内科学|循环系统疾病","改善心衰远期预后的药物","对慢性心衰远期预后有改善作用的是神经内分泌拮抗剂：ACEI（抑制RAAS、逆转心室重构、降低病死率）与β受体阻滞剂（抑制交感激活、减少猝死），故选BD。洋地黄可减轻症状、减少住院，但不降低总病死率；呋塞米缓解淤血症状，无改善远期生存的证据，长期大剂量还可能激活神经内分泌。","《内科学》第9版·循环系统疾病·慢性心力衰竭","green"],["YC25N157X","可表现为急进型肾炎综合征的非\n新月体肾炎为",["SLE","过敏性紫癜性肾炎","重症急性肾炎","重症膜增生性肾炎"],"CD","X","外科学",2025,"mock","外科学|其他","急进型肾炎综合征的病因","急进型肾炎综合征指起病急、肾功能急剧恶化（数周至数月内进展至尿毒症）的肾炎综合征。非新月体性肾炎中，重症急性链球菌感染后肾炎（毛细血管内增生性，C）与重症膜增生性肾炎（D）均可表现为此型。而SLE肾炎与过敏性紫癜性肾炎常伴广泛新月体形成，属新月体性肾炎范畴，故不选。","《内科学》第9版·泌尿系统·急进性肾小球肾炎","green"],["YC25N158X","APL免疫学检查常为阳性的是",["CD13","CD33","CD34","CD117"],"ABD","X","外科学",2025,"mock","外科学|其他","APL免疫表型","急性早幼粒细胞白血病（APL，M₃，t(15;17)/PML-RARα）瘤细胞表达髓系标志CD13、CD33、CD117，常为阳性；而CD34多为阴性，HLA-DR阴性，这是与其它类型AML鉴别的重要免疫表型特点。故阳性者为CD13、CD33、CD117。","《内科学》第9版·血液系统·急性白血病","green"],["YC25N159X","符合原发性甲减检查的是",["TRH下降","TSH下降","TT4降低","FT4降低"],"CD","X","内科学",2025,"mock","内科学|内分泌与代谢","原发性甲减的甲状腺功能特点","原发性甲减是甲状腺本身病变（桥本甲状腺炎、甲状腺术后或¹³¹I治疗后），甲状腺激素合成不足使TT₄、FT₄降低；负反馈减弱使TRH、TSH升高（TSH是诊断原发性甲减最敏感的指标），故选CD。TSH下降与TRH下降见于垂体性或下丘脑性（中枢性）甲减。","《内科学》第9版·内分泌与代谢疾病·甲状腺功能减退症","green"],["YC25N160X","胰腺炎严重程度指标?",["血Ca+","C反应蛋白","血糖浓度","血沉"],"ABC","X","内科学",2025,"mock","内科学|消化系统疾病","急性胰腺炎严重程度的实验室指标","急性胰腺炎严重程度评估的实验室指标包括血钙（<2mmol/L提示脂肪坏死皂化、重症）、C反应蛋白（>150mg/L提示重症）与血糖（应激与胰岛破坏致空腹血糖>11.1mmol/L，Ranson指标之一），故选ABC。血沉特异性差、升高缓慢且与病情严重度相关性弱，不作严重度判断指标。","《内科学》第9版·消化系统疾病·急性胰腺炎","green"],["YC25N161X","脾切除适应症",["多毛细胞白血病","副脾","脾结核","脾囊肿"],"ABCD","X","外科学",2025,"mock","外科学|普通外科","脾切除适应证","脾切除的适应证包括脾本身的病变与脾功能相关的疾病：多毛细胞白血病以显著脾大为特征，脾切除可缓解血细胞减少（A）；脾结核药物难以控制或形成脓肿/脾亢者（C）；脾囊肿尤其是真性囊肿、寄生虫性囊肿或体积大者（D）。副脾本身非疾病，但在遗传性球形红细胞增多症、ITP等行脾切除时应一并切除副脾以防复发，故亦列于本题（B）。外伤性脾破裂、门脉高压脾亢亦为常见指征。","《外科学》第9版·普通外科·脾疾病·脾切除术适应证","green"],["YC25N162X","下列关于血尿的叙述，正确的有",["尿液呈红色即是血尿","一般在1000mL尿中含1mL血液即呈肉眼\n血尿","离心尿每个高倍镜视野中红细胞＞3个\n即有病理意义","血尿程度与疾病严重性成正比"],"BC","X","外科学",2025,"mock","外科学|其他","血尿的定义与意义","血尿的判定：肉眼血尿指每1000ml尿中含1ml以上血液，呈洗肉水样或血色（B）；镜下血尿指离心尿每高倍视野红细胞>3个，有病理意义（C）。尿呈红色不等于血尿，需排除利福平、酚红、甜菜、红心火龙果等药物食物色素及血红蛋白尿、肌红蛋白尿（A错）；血尿程度与病变严重性并不平行，如膀胱癌可表现为间歇无痛肉眼血尿而病变已属晚期（D错）。","《外科学》第9版·泌尿外科·泌尿系统常见症状·血尿","green"],["YC25N163X","下列哪些疾病可出现症征不符的\n临床特点",["肠系膜上静脉血栓形成","肠系膜上动脉血栓形成","胆道蛔虫症","贲门失弛缓症"],"ABC","X","外科学",2025,"mock","外科学|其他","症征不符的急腹症","症征不符指腹痛剧烈而腹部体征轻微，因病变早期为缺血或痉挛性疼痛、尚无腹膜炎症波及壁层腹膜。肠系膜上动脉栓塞（急性缺血，疼痛剧烈而腹软压痛轻）、肠系膜上静脉血栓形成（早期同样以剧痛与体征分离为特点）以及胆道蛔虫症（阵发钻顶样剧痛而剑突下仅轻压痛、间歇期 "green"],["2017N20A","生物氧化中的 P/O比值的含义",["生成ATP数与消耗 1/2O2的比值","分解蛋白质与需要的 1/2O2的比值","需要的磷酸与生成的 1/2O2的比值","氧化的磷脂与消耗的 1/2O2的比值"],"A","A","生理学",2017,"real","生理学|其他","P/O比值与氧化磷酸化","P/O比值指氧化磷酸化过程中每消耗1/2mol O2（即一原子氧）所生成的ATP摩尔数，正确为A。它反映氧化与磷酸化的耦联效率：NADH氧化P/O约为2.5，FADH2约为1.5。B、C、D分别把P/O误解为蛋白分解、磷酸消耗或磷脂氧化，均不符合定义。","《生物化学与分子生物学》第9版·生物氧化·氧化磷酸化","green"],["2017N21A","食物蛋白质营养价值指的是",["蛋白质的含量","蛋白质与脂肪的比值","蛋白质的吸收率","蛋白质在体内的利用率"],"D","A","生理学",2017,"real","生理学|消化和吸收","蛋白质营养价值（生物学价值）","蛋白质营养价值取决于其在体内的利用率，即被消化吸收后实际参与维持氮平衡和合成的比例（生物学价值），D正确。含量、吸收率只反映数量与吸收程度，不能说明被机体利用的效率；蛋白质与脂肪的比值无营养学意义。含必需氨基酸齐全者生物学价值高。","《生理学》第9版·能量代谢与体温·能量代谢","green"],["2017N22A","直接参与嘌呤、嘧啶和尿素合成的氨基酸是",["谷氨酰胺","天冬氨酸","丙氨酸","亮氨酸"],"B","A","生物化学",2017,"real","生物化学|核苷酸代谢","嘌呤/嘧啶/尿素合成的共同原料","天冬氨酸既提供嘌呤环的N1，又提供嘧啶环的N1及C4~C6，还在尿素循环中与瓜氨酸缩合生成精氨酸代琥珀酸，故是三者共同原料。谷氨酰胺只供嘌呤、嘧啶的氮（尿素第二个氮来自天冬氨酸，不是谷氨酰胺），丙氨酸、亮氨酸均不直接参与。","《生物化学与分子生物学》第9版·核苷酸代谢·嘌呤核苷酸从头合成","green"],["2017N23A","端粒酶的组成成分是",["DNA修复酶+引物","RNA聚合酶+辅基","逆转录酶+RNA","DNA聚合酶+底物"],"C","A","生物化学",2017,"real","生物化学|DNA复制与修复","端粒酶的组成与功能","端粒酶是核糖核蛋白复合体，由端粒酶RNA（TERC，含合成TTAGGG重复序列的模板）和具有逆转录酶活性的端粒酶逆转录酶（TERT）组成。它以自身RNA为模板逆转录合成端粒DNA，延长端粒，故本质是逆转录酶+RNA。它既非DNA修复酶，也不是普通RNA聚合酶或DNA聚合酶加底物。","《生物化学与分子生物学》第9版·DNA的生物合成·端粒与端粒酶","green"],["2017N24A","真核生物与原核生物转录的相同点是",["都以操纵子模式进行调控","RNA合成酶相同","转录都具有不对称性","产物都需要在胞核加工"],"C","A","生物化学",2017,"real","生物化学|酶","转录的不对称性","转录的不对称性指双链DNA中只有一条链作为模板，两条链并非等量转录，真核与原核均如此，故为共同点。原核基因多以操纵子形式组织并受其调控，真核一般不以操纵子为主要模式；两者RNA聚合酶不同，真核产物还需在核内加工，故A、B、D均不成立。","《生物化学与分子生物学》第9版·RNA的生物合成·转录的一般特点","green"],["2017N25A","热激蛋白(热休克蛋白 )的生理功能是",["作为酶参与蛋白质合成","促进新生多肽链的折叠","参与蛋白质靶向运输","肽链合成起始的关键分子"],"B","A","外科学",2017,"real","外科学|外科总论","分子伴侣与蛋白折叠","热休克蛋白（HSP）属分子伴侣，在细胞内识别新生多肽链或未折叠蛋白暴露的疏水区并与之结合，防止错误折叠与聚集，并借助ATP水解能量促其正确折叠、跨膜转运或送交降解，故B正确。HSP本身不是酶，不参与肽链合成的起始，也不决定蛋白质合成的场所与运输方向，A、C、D均错。","《生物化学与分子生物学》第9版·蛋白质的生物合成·蛋白质合成后的折叠","green"],["2017N26A","基因工程中黏性末端连接指的是",["PCR引导肽链与 DNA模板连接","氨基酸之间肽键形成","同一限制酶切位点的连接","cDNA 与RNA形成杂交体"],"C","A","生物化学",2017,"real","生物化学|蛋白质的结构与功能","黏性末端与DNA连接","用同一种限制性核酸内切酶分别切割载体与外源DNA，可产生碱基互补的单链突出端（黏性末端），两者退火后由DNA连接酶封口，这就是黏性末端连接。它不涉及PCR引导肽链、肽键形成，也不是cDNA-RNA杂交体。（本题知识点标签有误，实属基因重组技术）","《生物化学与分子生物学》第9版·基因重组与分子生物学技术·重组DNA技术","green"],["2017N27A","下列关于蛋白激酶叙述，正确的是",["底物可以是脂类物质","可使亮氨酸残基磷酸化","蛋白质磷酸化后活性改变","属于第二信使物质"],"C","A","生物化学",2017,"real","生物化学|酶","蛋白质磷酸化与共价修饰调节","蛋白激酶催化ATP的γ-磷酸基转移至蛋白质底物中丝氨酸、苏氨酸或酪氨酸残基的羟基上，故底物是蛋白质、磷酸化位点不含亮氨酸。磷酸化引起构象改变，使酶或功能蛋白活性升高或降低，这是共价修饰调节的基础。蛋白激酶本身是催化酶，不是第二信使。","《生物化学与分子生物学》第9版·酶·酶的调节","green"],["2017N28A","能够调节血红蛋白运氧功能的物质是",["三羧酸循环产物","2,3-二磷酸甘油酸旁路产物","磷酸戊糖途径产物","丙酮酸脱氢酶复合体催化产物"],"B","A","生物化学",2017,"real","生物化学|糖代谢","2,3-BPG旁路与血红蛋白运氧","红细胞糖酵解存在2,3-BPG旁路（Rapoport-Luebering支路），生成2,3-二磷酸甘油酸。2,3-BPG与脱氧血红蛋白结合稳定其T态，降低Hb对氧的亲和力，促进氧在组织释放，是调节血红蛋白运氧功能的重要物质。它并非三羧酸循环、磷酸戊糖途径或丙酮酸脱氢酶复合体的产物。","《生物化学与分子生物学》第9版·糖代谢·糖酵解的调节","green"],["2017N29A","下列形态学改变中属于凋亡特征的是",["多为片状细胞死亡","细胞核固缩、破裂","常为炎症反应和修复再生","细胞膜完整，发泡成芽"],"D","A","病理学",2017,"real","病理学|细胞和组织的适应与损伤","凋亡与坏死的形态鉴别","凋亡的形态学核心是单个细胞发生程序性死亡，细胞皱缩、染色质边集浓集，但细胞膜始终保持完整并出芽形成凋亡小体，随后被巨噬细胞或邻近细胞吞噬清除，因此不引起炎症反应。A项片状细胞死亡是凝固性坏死的特征；B项核固缩、核破裂是坏死性改变，凋亡时核染色质虽碎裂但仍包裹于完整胞膜内形成凋亡小体；C项明显炎症反应和修复再生是坏死的转归。故D正确。","《病理学》第9版·细胞和组织的适应与损伤·细胞死亡","green"],["2017N30A","急性左心功能衰竭导致肺出血的原因是",["肺静脉小分支破裂","肺动脉小分支破裂","肺静脉端毛细血管漏出增加","肺动脉端毛细血管漏出增加"],"C","A","生物化学",2017,"real","生物化学|其他","心源性肺水肿的发生机制","急性左心功能衰竭时左室舒张末压升高，压力逆传使肺静脉压及肺毛细血管静脉端流体静压升高，血浆和红细胞漏出增加，形成肺水肿伴肺出血，故为肺静脉端毛细血管漏出增加。动脉端压力升高主要见于肺血流量增多；小分支破裂属血管破裂性出血，非本例机制。","《病理学》第9版·局部血液循环障碍·水肿","green"],["2017N31A","下列肉芽肿中常见有 Langhans 巨细胞的是",["风湿小结","黏液潴留结节","结核结节","术后缝线反应结节"],"C","A","病理学",2017,"real","病理学|炎症","结核结节与Langhans巨细胞","Langhans巨细胞由多个类上皮细胞融合而成，其数十个核呈马蹄形或环形排列于胞质周边，是结核结节的标志性细胞，故见于结核结节。风湿小结的特征细胞是Aschoff细胞和Anitschkow细胞；黏液潴留结节（甲状腺胶质潴留性结节）表面为滤泡上皮，无多核巨细胞；术后缝线反应属异物性肉芽肿，其中的多核巨细胞为异物型，核杂乱散布于胞质而不呈周边排列。据此只有C符合。","《病理学》第9版·炎症·肉芽肿性炎","green"],["2017N32A","尸检病理见脏层胸膜多发、粟粒大小、一致性硬结节，首先考虑的疾病是",["小叶性肺炎","肝癌肺转移","血源性播散性结核","栓塞性肺脓肿"],"C","A","生物化学",2017,"real","生物化学|其他","粟粒性肺结核的病理特点","脏层胸膜弥漫分布粟粒大小、大小一致、分布均匀的硬结节，是经血行播散的粟粒性肺结核的典型表现（结核结节由类上皮细胞、朗汉斯巨细胞及干酪样坏死构成）。小叶性肺炎为支气管播散的小叶实变，肝癌肺转移结节大小不一，栓塞性肺脓肿有化脓坏死。","《病理学》第9版·传染病·血源播散性结核病","green"],["2017N33A","小血管壁纤维素性坏死，常见的疾病是",["心肌病","良性高血压","急进型高血压","肺动脉高压"],"C","A","病理学",2017,"real","病理学|细胞和组织的适应与损伤","纤维素样坏死与常见疾病","纤维素样坏死是结缔组织和小血管壁的坏死类型，镜下坏死物呈强嗜酸性颗粒状、细丝状或团块状，状似纤维素。常见于急进型（恶性）高血压的细小动脉壁、系统性红斑狼疮、风湿病及胃溃疡底部。良性高血压只引起细小动脉玻璃样变（透明变），不发生坏死；心肌病以心肌肥大、变性为主；肺动脉高压主要见肺小动脉中层肥厚及丛状改变。故C正确。","《病理学》第9版·细胞和组织的适应与损伤·坏死","green"],["2017N34A","下列病理改变符合病毒性肺炎的是",["常有肺泡结构破坏","肺泡间隔水肿，炎细胞浸润","肺泡内壁常有大量纤维素渗出","局部区域中性粒细胞浸润"],"B","A","内科学",2017,"real","内科学|呼吸系统疾病","病毒性肺炎的组织学特点","病毒性肺炎为间质性肺炎：病变主要在肺间质，肺泡间隔增宽、水肿，淋巴细胞与单核细胞浸润，肺泡腔及肺泡上皮结构基本完整。细菌性肺炎（肺炎链球菌）才出现肺泡内大量纤维素性渗出、肺泡壁毛细血管扩张及中性粒细胞聚集，故C、D属细菌性肺炎；A肺泡结构破坏见于重症融合性病变，与病毒性肺炎不符。","《病理学》第9版·呼吸系统疾病·病毒性肺炎","green"],["2017N35A","引起肝细胞毛玻璃样变性的病原体是",["HAV","HBV","HCV","HEV"],"B","A","病理学",2017,"real","病理学|细胞和组织的适应与损伤","毛玻璃样肝细胞与HBsAg","毛玻璃样肝细胞是肝细胞胞质内HBsAg大量蓄积所致，HE染色胞质呈淡红染细颗粒状如毛玻璃，地衣红或醛复红染色阳性，电镜下为增生滑面内质网的囊泡内含HBsAg，是HBV感染的特征性形态标志。HAV、HEV引起急性肝炎，不形成毛玻璃样变；HCV感染的特征改变是肝细胞脂肪变、汇管区淋巴细胞聚集和胆管上皮损伤。故为HBV，选B。","《病理学》第9版·消化系统疾病·病毒性肝炎","green"],["2017N36A","下列疾病中，容易导致肠腔狭窄的疾病是",["伤寒","阿米巴肠病","痢疾","肠结核"],"D","A","生物化学",2017,"real","生物化学|其他","肠结核与肠腔狭窄","肠结核的溃疡呈环形（与肠长轴垂直），愈合时纤维组织增生、瘢痕收缩易使肠腔环形狭窄，甚至梗阻。伤寒溃疡沿肠长轴分布、愈合后不留狭窄；细菌性痢疾为假膜性炎，阿米巴肠病为烧瓶状溃疡，均不引起明显狭窄。","《病理学》第9版·肠道疾病·肠结核","green"],["2017N37A","慢性肾盂肾炎的炎症性质是",["变质性炎症","增殖性炎症","化脓性炎症","肉芽肿性炎症"],"C","A","生物化学",2017,"real","生物化学|其他","慢性肾盂肾炎的炎症性质","慢性肾盂肾炎是细菌感染引起的肾盂、肾盏黏膜及肾间质的慢性化脓性炎症，伴纤维化、瘢痕形成和肾小管萎缩，故炎症性质为化脓性炎。变质性炎见于病毒性肝炎，增殖性炎见于肉芽肿性炎等，肉芽肿性炎症常见于结核。","《病理学》第9版·泌尿系统疾病·肾盂肾炎","green"],["2017N38A","在淋巴结活检切片中见到单核、双核的大细胞，核仁明显且呈红色。首先考虑的疾病是",["T细胞淋巴瘤","霍奇金淋巴瘤","Burkitt 淋巴瘤","大B细胞淋巴瘤"],"B","A","生物化学",2017,"real","生物化学|其他","R-S细胞与霍奇金淋巴瘤","淋巴结结构破坏、出现体积大、单核或双核相对排列（镜影细胞）、核仁大而明显呈嗜酸性红色的细胞，即R-S细胞，是霍奇金淋巴瘤的诊断性细胞。T细胞淋巴瘤细胞多形、Burkitt淋巴瘤呈星空状、大B细胞淋巴瘤为大淋巴细胞弥漫增生，均无R-S细胞。","《病理学》第9版·淋巴造血系统疾病·霍奇金淋巴瘤","green"],["2017N39A","在子宫肌层内发现水肿的绒毛，其诊断是",["葡萄胎","绒毛状腺瘤","绒毛膜上皮癌","侵蚀性葡萄胎"],"D","A","生物化学",2017,"real","生物化学|其他","侵蚀性葡萄胎与葡萄胎鉴别","正常绒毛局限于宫腔，若在子宫肌层内见到水肿的绒毛（绒毛侵入肌层、血管内可见绒毛栓），说明病变已侵透深肌层，诊断为侵蚀性葡萄胎。葡萄胎绒毛限于宫腔，绒毛膜上皮癌无绒毛结构，绒毛状腺瘤是大肠肿瘤。","《病理学》第9版·生殖系统疾病·滋养层细胞疾病","green"],["2017N40A","系统性红斑狼疮所致的疣状心内膜炎，其赘生物的主要成分是",["纤维素","血小板凝块","血小板凝块和低毒化脓菌","纤维素网络和血小板小梁"],"B","A","内科学",2017,"real","内科学|风湿免疫","Libman-Sacks心内膜炎赘生物成分","SLE所致疣状心内膜炎即Libman-Sacks心内膜炎，赘生物由纤维素样坏死物质、血小板血栓及增生内皮构成，为无菌性（非感染性）赘生物，故主要成分为血小板凝块。含化脓菌成分者为急性感染性心内膜炎（C错）；单纯纤维素者为风湿性心内膜炎（A、D错）。该赘生物可累及瓣膜两面及心壁内膜。","《病理学》第9版·免疫性疾病·系统性红斑狼疮","green"],["2017N41A","下列可见于肝源性水肿的临床表现是",["水肿由颜面部向全身蔓延","可表现为踝部水肿","常伴发颈静脉充盈","常为非凹陷性水肿"],"B","A","生物化学",2017,"real","生物化学|其他","肝源性/心源性/肾源性水肿鉴别","肝源性水肿由门静脉高压、低白蛋白血症及淋巴回流障碍所致，水肿最先出现于下垂部位（踝部），呈凹陷性，逐渐向上蔓延，头面部少见。颜面先肿见于肾源性，颈静脉充盈见于心源性（右心衰），非凹陷性见于黏液性水肿。","《病理学》第9版·局部血液循环障碍·水肿","green"],["2017N42A","患者剑突下可见搏动，在深吸气后明显，最可能的临床意义是",["腹主动脉瘤","肝血管瘤","右心室扩大","左心室室壁瘤"],"C","A","生物化学",2017,"real","生物化学|其他","心前区搏动的鉴别","剑突下搏动且深吸气时增强，是右心室肥厚扩大的体征：深吸气时胸腔负压增大、右心回心血量增多，右室充盈加强、搏动更明显。腹主动脉瘤的搏动在剑突下偏左，且随呼气或按压而明显；肝血管瘤、左室室壁瘤位置与规律不符。","《诊断学》第9版·体格检查·心脏检查","green"],["2017N43A","医院获得性肺炎最常见的致病菌是",["革兰氏阳性杆菌","革兰氏阴性杆菌","革兰氏阳性球菌","革兰氏阴性球菌"],"B","A","内科学",2017,"real","内科学|呼吸系统疾病","HAP常见致病菌","医院获得性肺炎（HAP）以革兰阴性杆菌最多见，包括铜绿假单胞菌、鲍曼不动杆菌、肺炎克雷伯菌、大肠埃希菌，常为多重耐药菌；革兰阳性球菌以MRSA、肠球菌为主。社区获得性肺炎则以肺炎链球菌、流感嗜血杆菌等革兰阳性/阴性球菌多见。故答案为革兰阴性杆菌，其余选项发生率明显低。","《内科学》第9版·呼吸系统疾病·医院获得性肺炎","green"],["2017N44A","男性，46岁。发热性咳嗽、咳痰 3天，右侧胸痛 2天，既往有 “关节炎”病史。查体： T38.7℃，右 下肺呼吸音减低， 可闻及少许湿性啰音。 胸片提示右侧胸腔积液， 胸水示： 白细胞 15000×106/L,单核10%， pH6.9，LDH986U/L,ADA90U/L 。胸腔积液最可能的原因是",["结核性胸膜炎","肺癌","类风湿关节炎","脓胸"],"D","A","内科学",2017,"real","内科学|呼吸系统疾病","脓胸与结核性胸膜炎胸水鉴别","胸水白细胞15000×10⁶/L（远超脓胸10000×10⁶/L标准）、单核仅10%（以中性粒为主）、LDH 986U/L、pH 6.9，均为典型脓胸表现；结核性胸膜炎胸水以淋巴细胞为主（>50%）、ADA明显升高但pH多>7.2、白细胞多在1000以下；肺癌胸水多血性、以淋巴细胞为主；类风湿胸水白细胞低、葡萄糖极低。故为脓胸。","《内科学》第9版·呼吸系统疾病·胸腔积液","green"],["2017N45A","男性，72岁。慢性咳嗽、咳痰 20年，活动后呼吸困难 3年，加重1周。既往吸烟史 50年。血气 分析提示 PaO250mmHg,PaCO 268mmHg 。出现呼吸衰竭最主要的机制是：",["通气/血流比例失调","肺泡通气量下降","弥散功能障碍","肺内分流"],"B","A","内科学",2017,"real","内科学|呼吸系统疾病","COPD致Ⅱ型呼衰机制","患者PaO₂ 50mmHg、PaCO₂ 68mmHg属Ⅱ型呼吸衰竭。COPD时气道阻塞、肺泡弹性回缩力下降致有效肺泡通气量减少，CO₂潴留，是导致Ⅱ型呼衰最主要的机制。V/Q失调、弥散障碍、肺内分流主要造成低氧血症而CO₂多正常或降低，不能解释PaCO₂显著升高。故选肺泡通气量下降。","《内科学》第9版·呼吸系统疾病·呼吸衰竭","green"],["2017N46A","女，48岁。咳嗽、胸闷 4个月，无发热。胸部 CT提示双侧肺门、纵隔淋巴结肿大，伴双肺网格 影及小结节影，双下肺底少许蜂窝状改变。支气管镜检查显示支气管黏膜呈铺路石样改变。支气管肺泡灌 洗液检查最可能的结果是",["中性粒细胞比例增加","淋巴细胞比例升高且 CD4+/CD8+比值增加","淋巴细胞比例增高且 CD4+/CD8+比值减少","嗜酸性粒细胞比例增加"],"B","A","生理学",2017,"real","生理学|呼吸","结节病的支气管肺泡灌洗液特点","双肺门及纵隔淋巴结对称性肿大、双肺网格结节影、支气管黏膜铺路石样改变、BALF以淋巴细胞增高为主且CD4+/CD8+比值升高，是肺结节病的典型表现，故选B。过敏性肺炎虽也以淋巴细胞为主但CD8+占优；IPF多为中性粒细胞、肺泡蛋白沉积症以巨噬细胞和PAS阳性物质为主，中性粒细胞增多见于感染。","《内科学》第9版·呼吸系统疾病·结节病","green"],["2017N47A","下列关于血浆脑钠肽 (BNP)叙述，正确的是",["主要来源于左心房","左心室功能不全可明显增高","增高可提示存在心肌损伤","快速心房颤动时可明显增高"],"B","A","生物化学",2017,"real","生物化学|其他","BNP的来源与临床意义","BNP主要由心室（尤其左心室）肌细胞合成、分泌，心室容量负荷或室壁张力增高时释放明显增多，是心衰诊断、分级和预后判断的重要指标，故左心室功能不全时可明显增高。它反映心肌牵张而非心肌损伤（肌钙蛋白提示损伤），快速房颤可轻度升高但一般不显著。","《内科学》第9版·心力衰竭·利钠肽","green"],["2017N48A","男，56岁。1个月发生 3次夜间睡觉中因突发心前区疼痛而惊醒，伴出汗、咽部发紧、呼吸不畅， 持续10分钟左右自行缓解， 白天活动正常。 既往发现血压升高 1年， 未治疗， 吸烟 20年。 查体： P60/分， BP160/80mmHg ，双肺正常，心率整齐，心音正常，双下肢水肿。该患者应首选的降压治疗药物是：",["血管紧张素转换酶抑制剂","血管紧张素Ⅱ受体拮抗剂","钙通道阻滞剂","β受体拮抗剂"],"C","A","生物化学",2017,"real","生物化学|酶","变异型心绞痛的治疗","患者夜间睡眠中反复发作心前区疼痛伴出汗、持续10分钟自行缓解，白天活动不受限，属静息型心绞痛，结合吸烟及高血压考虑冠状动脉痉挛（变异型心绞痛），首选钙通道阻滞剂解除痉挛。ACEI、ARB、β受体拮抗剂或可能加重痉挛，不是首选。","《内科学》第9版·冠心病·心绞痛","green"],["2017N49A","男性，65岁。因心力衰竭 2年入院。查体：口唇稍发绀，颈静脉充盈，双肺底均可闻及湿罗音， 心界向两侧扩大，心率整齐，心率 76次/分，双下肺凹陷性水肿（ +）。心电图示：窦性心律、完全性左 束支传导阻滞，超声心动图示左心室扩大，室壁弥漫性运动减弱伴运动不协调。 LVEF32% 。该患者最佳的 治疗方案是",["长期使用醛固酮受体拮抗剂","联合使用正性肌力药及血管扩张药物","联合使用β受体拮抗剂和利尿剂","心脏再同步化治疗（ CRT）"],"D","A","内科学",2017,"real","内科学|循环系统疾病","CRT适应证","患者NYHAⅢ～Ⅳ级心衰，窦性心律、完全性左束支传导阻滞，QRS≥120ms，LVEF 32%≤35%，超声示左室扩大、弥漫性运动减弱，符合心脏再同步化治疗（CRT）Ⅰ类适应证，可改善症状并降低死亡率。单纯醛固酮受体拮抗剂、β受体拮抗剂加利尿剂仅为药物治疗的一部分；正性肌力药仅用于急性期。","《内科学》第9版·循环系统疾病·心力衰竭","green"],["2017N50A","阿司匹林引起 NSAID溃疡的最主要致溃疡机制是",["抑制COX-1","抑制COX-2","同时抑制 COX-1和COX-2","局部作用"],"A","A","病理学",2017,"real","病理学|其他","NSAID相关性溃疡机制","阿司匹林等NSAID通过抑制环氧合酶阻断前列腺素合成。COX-1在胃黏膜组成型表达，其产物PGE2、PGI2促进黏液与碳酸氢盐分泌、增加黏膜血流，是黏膜屏障的生理性保护因素，抑制COX-1使屏障削弱，是致溃疡的最主要机制。COX-2为炎症诱导型，选择性抑制COX-2反而胃肠损伤较轻；药物局部作用是次要机制。故A正确。","《内科学》第9版·消化系统疾病·消化性溃疡","green"],["2017N51A","原发性肝癌早期的转移方式主要是",["肝外血行转移","淋巴转移","种植转移","肝内转移"],"D","A","病理学",2017,"real","病理学|肿瘤","肝癌的转移途径","原发性肝癌的转移以肝内血行播散最常见且发生最早，癌细胞沿门静脉分支在肝内形成多发或弥漫性癌结节，门静脉癌栓是其典型表现。肝外血行转移多见于晚期，常转移至肺、骨、脑；淋巴转移以肝门淋巴结多见；腹腔种植转移较少。因此“早期转移方式主要是肝内转移”，选D。","《病理学》第9版·消化系统疾病·原发性肝癌","green"],["2017N52A","男性，53岁。肝硬化病史 8年。5天来无明显原因出现腹胀，腹水迅速增加，脾脏进一步增大， 体温正常。最可能发生的并发症是：",["原发性肝细胞癌","原发性腹膜炎","门静脉血栓形成","肝肾综合征"],"C","A","内科学",2017,"real","内科学|消化系统疾病","门静脉血栓形成的识别","肝硬化患者短期内腹水迅速增加、脾脏进一步增大而体温正常，是门静脉血栓形成的典型表现：门脉阻塞后腹水顽固、脾大加重、可伴腹痛。自发性腹膜炎多有发热、腹痛、腹水白细胞升高；肝肾综合征以少尿、氮质血症为主而无脾大加重；肝癌需AFP及影像证实。","《内科学》第9版·消化系统疾病·肝硬化","green"],["2017N53A","男性，25岁。 因肉眼血尿 2天就诊，3天前有上呼吸道感染。 既往体健。 查体， 血压 BP125/85mmHg ， 皮肤黏膜未见出血点和紫癜，心肺腹检查未见异常。化验尿常规：蛋白（ ++），沉渣镜检 RBC满视野/HP， WBC 0-3/HP ，血常规 Hb105g/L ，WBC 6.0×109/L，PLt210×109/L,血肌酐120μmol/L 。该患者最可能的诊 断是",["急性肾小球肾炎","急进性肾小球肾炎","IgA肾病","肾病综合征"],"C","A","病理学",2017,"real","病理学|泌尿系统疾病","IgA肾病与急性肾炎的鉴别","青年男性，上呼吸道感染后3天即出现肉眼血尿，血压正常、无水肿、无大量蛋白尿及低白蛋白血症，肾功能基本正常，符合IgA肾病“咽炎同步血尿”的特点。急性链球菌感染后肾炎潜伏期多为1～3周，常伴水肿、高血压和补体下降；急进性肾炎短期内肾功能急剧恶化、少尿；肾病综合征须有大量蛋白尿和低白蛋白血症。故选C。","《内科学》第9版·泌尿系统疾病·IgA肾病","green"],["2017N54A","下列检查结果支持溶血性贫血的是",["尿中尿胆原排泄减少","血清非结合胆红素减少","血清结合珠蛋白减少","血网织红细胞减少"],"C","A","内科学",2017,"real","内科学|血液系统疾病","溶血性贫血的实验室证据","溶血时大量血红蛋白释放入血，与结合珠蛋白结合后被单核巨噬系统清除，故血清结合珠蛋白明显降低，是溶血的重要指标。溶血时尿胆原排出增多（A错）、非结合胆红素升高（B错）、网织红细胞代偿性增多（D错）。三项均与答案方向相反，故唯一支持溶血的是结合珠蛋白减少。","《内科学》第9版·血液系统疾病·溶血性贫血","green"],["2017N55A","临床诊断Ⅰ型糖尿病的主要依据是",["年轻患者典型三多一少症状","反复出现酮症","胰岛素分泌曲线低平","需用胰岛素控制血糖"],"C","A","内科学",2017,"real","内科学|内分泌与代谢","1型糖尿病分型依据","1型糖尿病本质是胰岛β细胞破坏致胰岛素绝对缺乏，故胰岛素释放试验示分泌曲线低平、C肽水平显著降低，为其分型的主要实验室依据。年轻、三多一少、反复酮症、需胰岛素治疗虽支持1型，但2型晚期或应激时也可出现，特异性不足。故最有价值的是胰岛素分泌曲线低平。","《内科学》第9版·内分泌与代谢疾病·糖尿病","green"],["2017N56A","下列药物中，属于改变病情抗风湿的药物是",["环孢素","阿司匹林","醋酸泼尼松","塞来昔布"],"A","A","病理学",2017,"real","病理学|其他","改变病情抗风湿药分类","改变病情抗风湿药指能延缓或阻止关节骨破坏、改变疾病进程的药物，包括甲氨蝶呤、来氟米特、羟氯喹、柳氮磺吡啶、环孢素及生物制剂。阿司匹林、塞来昔布为非甾体抗炎药，只缓解症状；醋酸泼尼松为糖皮质激素，起效快但不能阻止骨破坏，长期使用副作用大，均不属DMARD。故A正确。","《内科学》第9版·风湿性疾病·类风湿关节炎","green"],["2017N57A","低钾血症经过补钾治疗仍然不能纠正低血钾，此时考虑合并存在的情况是",["低钠血症","低磷血症","低钙血症","低镁血症"],"D","A","内科学",2017,"real","内科学|其他","顽固性低钾与低镁血症","低镁血症可致肾小管钾重吸收障碍（ROMK通道持续开放）并伴醛固酮增多，产生顽固性低钾，此时单纯补钾难以奏效，必须同时补镁才能纠正。低钠、低钙、低磷均不直接造成补钾抵抗。临床上凡低钾经济补钾不易纠正并伴低钙、心律失常者应想到低镁。","《内科学》第9版·内分泌与代谢疾病·水电解质代谢紊乱","green"],["2017N58A","结肠癌患者血清 CEA检测的临床意义，下列描述不正确的是",["CEA的阳性率和结肠癌分期有关","术后CEA未明显下降说明可能有肿瘤的残留","术后CEA持续上升提示肿瘤复发","术前CEA指标正常是缩小切除范围的依据"],"D","A","病理学",2017,"real","病理学|肿瘤","CEA的临床意义","血清CEA在结肠癌的阳性率与分期有关，分期越晚阳性率越高；根治术后CEA下降不明显提示肿瘤残留，术后持续升高提示复发或转移，故A、B、C均正确。D项错误：术前CEA正常既不能排除淋巴结及腹腔播散，也不能作为缩小切除范围的依据，结肠癌切除范围由肿瘤部位和淋巴引流决定，须遵循根治原则。","《外科学》第9版·结直肠癌·肿瘤标志物","green"],["2017N59A","男性，45岁。因甲状腺癌行左叶甲状腺全切术，术后出现饮水呛咳，但发音正常。首先考虑的原因 是",["喉返神经损伤","交感神经损伤","喉上神经外支损伤","喉上神经内支损伤"],"D","A","病理学",2017,"real","病理学|肿瘤","喉上神经损伤的定位","喉上神经内支为感觉支，支配声门以上喉黏膜感觉，损伤后喉黏膜感觉丧失，进食尤其饮水时易误吸而呛咳；喉上神经外支为运动支，支配环甲肌，损伤后音调降低、发音费力；喉返神经损伤则出现声音嘶哑甚至呼吸困难。本例发音正常、仅饮水呛咳，符合喉上神经内支损伤。交感神经损伤表现为Horner综合征。","《外科学》第9版·甲状腺疾病·甲状腺手术并发症","green"],["2017N60A","女，55岁。左侧乳房内肿块 4cm×3cm ，基底不固定，左腋下可触及多个质硬淋巴结相互融合。淋 巴结活检病理报告乳腺癌转移，未发现远处转移。按照国际标准，应属于的分期是",["T1N1M0","T2N1M0","T3N1M0","T2N2M0"],"D","A","外科学",2017,"real","外科学|普通外科","乳腺癌TNM分期","肿块4cm属T2（>2cm且≤5cm）；左腋下多个质硬淋巴结相互融合为N2（同侧腋窝淋巴结彼此融合或与周围组织固定）；无远处转移为M0，故为T2N2M0，选D。A、B中N1指同侧腋窝淋巴结肿大但可推动；C的T3指肿瘤最大径>5cm，与本例4cm不符，故均不选。","《外科学》第9版·普通外科·乳腺癌·分期","green"],["2017N61A","最容易发生嵌顿的腹外疝是",["脐疝","腹股沟直疝","腹股沟斜疝","股疝"],"D","A","外科学",2017,"real","外科学|普通外科","股疝最易嵌顿的解剖基础","股疝经股环、股管向卵圆窝突出，股环狭小、周边为坚韧的股环韧带、陷窝韧带与耻骨梳韧带，疝囊颈窄而疝块以锐角突出，故最易嵌顿并迅速进展为绞窄，选D。斜疝虽也可嵌顿但发生率低于股疝；直疝疝囊颈宽大、极少嵌顿；脐疝多见于婴幼儿，成人脐疝虽易嵌顿但总体少见，A、B、C不选。","《外科学》第9版·普通外科·腹外疝·股疝","green"],["2017N62A","下列关于结肠癌的描述，正确的是",["在胃肠道癌中预后最好","右侧结肠癌常出现肠梗阻","左侧结肠癌常出现贫血","早期转移以血道为主"],"A","A","病理学",2017,"real","病理学|肿瘤","左、右半结肠癌的临床病理差异","结肠癌在胃肠道癌中预后相对最好，5年生存率明显高于食管癌、胃癌和肝癌，A正确。右半结肠肠腔宽、内容物稀，以隆起型多见，临床表现为贫血、乏力、腹部包块，较少发生梗阻；左半结肠肠腔窄，以浸润缩窄型多见，易致肠梗阻，故B、C颠倒；结肠癌早期转移以淋巴道为主，血行转移至肝多见于进展期，D错误。","《病理学》第9版·消化系统疾病·结直肠癌","green"],["2017N63A","男性，65岁。反复上腹部不适、轻度黄疸 3个月，腹痛、黄疸加重伴高热 2天。入院查体： T39.5℃， P125次/分，BP75/50mmHg ，右上腹压痛。腹部超声检查发现胆囊多发结石，胆总管直径 1.5cm，胰头显 示不清。血 WBC15×109/L,中性粒细胞 90%。该患者首选的治疗方法是",["大剂量抗生素抗感染后择期手术","全胃肠外营养后择期手术","大量输液抗休克同时尽早手术","应用血管收缩剂至血压正常后及早手术"],"C","A","外科学",2017,"real","外科学|外科总论","AOSC治疗原则","腹痛、黄疸、高热构成Charcot三联征，再加血压下降与中性粒细胞90%，符合急性梗阻性化脓性胆管炎（Reynolds五联征）。其本质是胆道梗阻合并严重感染，治疗关键是紧急解除梗阻、胆道减压引流，同时抗休克抗感染，故应大量输液抗休克同时尽早手术，选C。单纯抗感染或营养支持后择期手术会延误减压；用血管收缩剂升压会掩盖休克、加重组织缺血，均不可取。","《外科学》第9版·普通外科·胆道疾病·急性梗阻性化脓性胆管炎","green"],["2017N64A","男性，62岁。脓血便 3个月，结肠镜检距肛门处 7cm处直肠前壁肿物，直径约 2cm，活检病理诊 断为直肠癌，合理的手术方式是：",["Hartman 术","Miles术","Dixon 术","York-Mason 术"],"C","A","外科学",2017,"real","外科学|其他","直肠癌保肛术式选择","肿瘤位于直肠中段（距肛缘7cm）、直径仅2cm，按直肠癌手术原则可保留肛门，行经腹直肠癌切除、结肠直肠端端吻合，即Dixon术，选C。Miles术适用于距肛缘<5cm的直肠下段癌；Hartmann术用于急性梗阻、全身情况差不能一期吻合者；York-Mason术为经骶入路局部切除，均不适用于本例，A、B、D不选。","《外科学》第9版·普通外科·结直肠癌·手术方式选择","green"],["2017N65A","男，80岁。摔伤致右髋部疼痛 2天，平素体健。 X线检查见右股骨颈头下型骨折，有移位。比较 恰当的治疗是",["皮牵引","人工股骨头置换术","闭合复位内固定","卧床休息，穿防旋转鞋"],"B","A","外科学",2017,"real","外科学|骨科","股骨颈骨折术式选择","头下型股骨颈骨折时支持带血管与髓内血供几近中断，极易不愈合及股骨头缺血坏死；患者80岁、骨折有移位，长期卧床与内固定失败率高，宜行人工股骨头置换以早期下床、减少并发症，选B。皮牵引与卧床休息不能解决骨不愈合；闭合复位内固定主要适用于年龄较轻、移位轻或无移位骨折，A、C、D不选。","《外科学》第9版·骨科·股骨颈骨折·治疗","green"],["2017N66A","急性血源性骨髓炎的好发部位是",["桡骨、尺骨","肱骨、肩胛骨","骨盆、脊椎","胫骨、股骨"],"D","A","外科学",2017,"real","外科学|骨科","急性血源性骨髓炎好发部位及机制","急性血源性骨髓炎好发于长骨干骺端，以胫骨近端与股骨远端最多见。该处为松质骨、血窦丰富而血流缓慢，细菌易滞留；干骺端又缺乏吞噬细胞、毛细血管呈袢状弯曲，故成为血源性感染的着床部位，选D。桡尺骨、肱骨、肩胛骨、骨盆与脊椎均非好发部位，A、B、C不选。","《外科学》第9版·骨科·骨与关节感染·急性血源性骨髓炎","green"],["2017N68A","该患者呼吸困难的主要类型是",["肺源性","心源性","神经精神性","血源性"],"B","A","病理学",2017,"real","病理学|其他","呼吸困难的病因分型","本题原为共用题干题，题干在题库中被省略。从选项看考查呼吸困难按病因的分型。心源性呼吸困难由左心功能不全致肺淤血、肺顺应性下降和气道阻力增加引起，表现为劳力性呼吸困难、夜间阵发性呼吸困难及端坐呼吸。肺源性者伴明显肺疾病体征；神经精神性者见于中枢病变或过度通气；血源性者见于重度贫血、CO中毒。答案取心源性。","《病理学》第9版·局部血液循环障碍·肺淤血","yellow"],["2017N70A","该患者最可能的诊断是",["缺铁性贫血","巨幼细胞性贫血","再生障碍性贫血","溶血性贫血"],"B","A","病理学",2017,"real","病理学|损伤的修复","巨幼细胞贫血的骨髓象","本题为共用题干题，题干被省略。由后续小题“牛肉样舌”“核幼浆老”可判定该病例为巨幼细胞性贫血，本题即问诊断，故选B。其依据是叶酸或维生素B12缺乏致DNA合成障碍，出现核质发育不平衡；缺铁性贫血为小细胞低色素、骨髓“核老浆幼”；再生障碍性贫血全血细胞减少、骨髓增生低下；溶血性贫血有网织红细胞增高及胆红素升高。","《内科学》第9版·血液系统疾病·巨幼细胞贫血","yellow"],["2017N71A","该患者还有可能出现的体征是",["牛肉样舌","匙状甲","皮肤瘀斑","脾肿大"],"A","A","病理学",2017,"real","病理学|其他","巨幼细胞贫血的体征","本题共用题干省略，据“核幼浆老”可确定为巨幼细胞贫血。维生素B12或叶酸缺乏可致舌乳头萎缩、舌面光滑呈鲜红色，即“牛肉样舌”，故A正确。匙状甲见于缺铁性贫血；皮肤瘀斑提示血小板减少或凝血异常；脾肿大见于溶血性贫血、骨髓增殖性疾病等，巨幼贫一般无明显脾大。","《内科学》第9版·血液系统疾病·巨幼细胞贫血","yellow"],["2017N72A","最可能支持该患者诊断的骨髓象是：",["浆细胞比例增高","粒红比例倒置","“核老浆幼”现象","“核幼浆老”现象 (73～75共用题干) 女性，45岁。术后卧床 3天突发呼吸困难、胸痛， CTPA诊断为肺栓塞。查体：R24 次/分，口唇发 绀，双肺呼吸音清， P2>A2，左下肢肿胀"],"D","A","病理学",2017,"real","病理学|局部血液循环障碍","巨幼细胞贫血骨髓象核幼浆老","本题共用题干省略，但由后一小题“核幼浆老”与“牛肉样舌”可确认为巨幼细胞性贫血，故骨髓象表现为“核幼浆老”，即细胞核发育落后于胞质，选D。浆细胞比例增高见于多发性骨髓瘤；粒红比例倒置见于红系明显增生；核老浆幼是缺铁性贫血因血红蛋白合成障碍形成的典型表现，正是本题的干扰项。","《内科学》第9版·血液系统疾病·巨幼细胞贫血","yellow"],["2017N73A","该患者最可能的血气分析结果是",["PaO2降低，PaCO2降低","PaO2降低，PaCO2升高","PaO2正常，PaCO2降低","PaO2正常，PaCO2升高"],"A","A","病理学",2017,"real","病理学|其他","肺栓塞的血气特点","本例术后卧床3天，突发呼吸困难、胸痛，CTPA确诊肺栓塞，左下肢肿胀提示下肢深静脉血栓来源。肺栓塞时栓塞区通气/血流比例失调、死腔增大及支气管收缩，导致低氧血症并反射性过度通气，故表现为PaO2降低伴PaCO2降低，即Ⅰ型呼吸衰竭，选A。PaCO2升高见于肺泡通气不足，如COPD急性加重、镇静剂过量。","《病理学》第9版·局部血液循环障碍·栓塞","green"],["2017N74A","下列情况，对决定患者是否采取溶栓治疗意义最大的是",["低氧血症程度","血压与右心功能情况","呼吸困难程度","发病时间长短"],"B","A","内科学",2017,"real","内科学|其他","肺栓塞溶栓指征","肺栓塞是否溶栓取决于血流动力学状态：低血压、休克或右心功能不全（超声示右室扩大、右心衰、肌钙蛋白/BNP升高）属高危/中高危，是溶栓核心指征；发病时间、低氧程度、呼吸困难轻重均非决定性因素。故对决定溶栓意义最大的是血压与右心功能情况。","《内科学》第9版·呼吸系统疾病·肺血栓栓塞症","green"],["2017N76A","该患者应首先考虑的诊断是：",["心力衰竭","扩张型心肌病","心包积液","急性心肌炎"],"C","A","内科学",2017,"real","内科学|循环系统疾病","心包积液的诊断","心界向两侧扩大、心音低钝遥远、颈静脉充盈、下肢水肿，结合超声示心包腔大量无回声区，诊断为心包积液。扩张型心肌病虽心界扩大但可闻及明显杂音、心音不低钝；心力衰竭心界扩大程度轻；急性心肌炎多有感染前驱史、心律失常与心肌酶明显升高。","《内科学》第9版·循环系统疾病·心包疾病","green"],["2017N77A","为明确诊断，最有价值的检查是",["X线胸片","心电图","超声心动图","心肌损伤标志物测定"],"C","A","内科学",2017,"real","内科学|其他","心包积液的超声价值","超声心动图可确诊心包积液并定量（少量<100ml、中量100～500ml、大量>500ml），同时评估心包厚度、纤维素分隔、右房右室塌陷以判断心脏压塞，是首选、最有价值的检查。X线胸片仅见心影增大（烧瓶心）不能定性；心电图示低电压、电交替；心肌标志物用于排除心梗。","《内科学》第9版·循环系统疾病·心包疾病","green"],["2017N78A","对该患者采取最关键的治疗措施是",["应用正性肌力药物","应用静脉血管舒张剂","应用静脉心肌营养药物","心包穿刺术 (79～81共用题干) 患者，男， 54岁，近两个月来反酸、烧心，多于餐后出现，平卧位时明显， 5天来情况加重，有时伴有 胸骨后疼痛， ECG检查未见明显异常，胃镜检查可见食管黏膜破损融合"],"D","A","内科学",2017,"real","内科学|其他","心包穿刺的指征","大量心包积液已出现颈静脉充盈等心包腔内压升高表现，解除压迫最关键的处置是心包穿刺抽液，既能迅速缓解症状又能明确积液性质（送常规、生化、细胞学、结核相关检查）。正性肌力药、扩血管药、心肌营养药均不能降低心包腔内压，作用有限。","《内科学》第9版·循环系统疾病·心包疾病","green"],["2017N79A","该患者最可能的诊断是：",["胃食管反流病","心绞痛","食管憩室炎","食管癌"],"A","A","内科学",2017,"real","内科学|循环系统疾病","GERD的诊断与内镜分级","反酸、烧心于餐后及平卧位加重，伴胸骨后痛而ECG正常，胃镜见食管下段黏膜破损并融合（洛杉矶分级C/D级），符合胃食管反流病。心绞痛与体位无关、活动后发作；食管憩室炎以吞咽困难、食物反流为主；食管癌进行性吞咽困难、黏膜溃疡浸润，故A最符合。","《内科学》第9版·消化系统疾病·胃食管反流病","green"],["2017N80A","选用的治疗是：",["口服氢氧化铝","口服硝酸甘油","口服奥美拉唑","手术治疗"],"C","A","内科学",2017,"real","内科学|其他","GERD的PPI治疗","有食管黏膜破损（食管炎）者应首选质子泵抑制剂，奥美拉唑抑酸作用强、起效快，首剂后症状缓解率高。氢氧化铝中和胃酸弱、易便秘；硝酸甘油用于心绞痛；手术仅用于严重并发症或药物依赖者。故首选口服奥美拉唑。","《内科学》第9版·消化系统疾病·胃食管反流病","green"],["2017N81A","若需维持治疗，选用的最佳药物是：",["雷尼替丁","奥美拉唑","硝酸异山梨酯","顺铂和5-氟尿嘧啶 (82～84共用题干) 女性，26岁，妊娠 30周。3天来腰痛伴尿频、尿痛， 2天来发热，体温最高达"],"B","A","内科学",2017,"real","内科学|其他","GERD维持治疗方案","GERD需长期维持治疗的食管炎（尤其C/D级）标准方案是质子泵抑制剂，奥美拉唑按需或长期低剂量维持疗效确切。雷尼替丁为H₂受体拮抗剂，抑酸不如PPI、易耐受；硝酸异山梨酯降低LES压力反而加重反流；顺铂加5-FU为食管癌化疗方案。","《内科学》第9版·消化系统疾病·胃食管反流病","green"],["2017N82A","患者最可能诊断是",["尿道综合征","急性膀胱炎","急性肾盂肾炎","肾结核"],"C","A","内科学",2017,"real","内科学|泌尿系统疾病","急性肾盂肾炎的诊断","孕妇出现发热、腰痛伴尿频尿痛，提示上尿路感染；膀胱炎一般无发热、腰痛及全身症状。肾结核多为慢性、无菌性脓尿、抗生素无效。尿道综合征仅有尿路刺激症状而尿检无异常。故诊断为急性肾盂肾炎。","《内科学》第9版·泌尿系统疾病·尿路感染","green"],["2017N83A","若做清洁后中段尿细菌培养，最可能的结果是",["未见细菌生长","大肠埃希菌","粪链球菌","结核杆菌"],"B","A","内科学",2017,"real","内科学|其他","尿路感染常见病原菌","社区获得性尿路感染约80%～90%由大肠埃希菌引起，急性肾盂肾炎最常见病原体亦为大肠埃希菌，故清洁中段尿培养最可能为大肠埃希菌。粪链球菌多见于医院获得性或复杂性感染；结核杆菌见于肾结核，普通培养不生长。","《内科学》第9版·泌尿系统疾病·尿路感染","green"],["2017N84A","最首选用的治疗",["多饮水及对症治疗","静脉给予大环内酯类抗生素","抗结核治疗","静脉给予第三代头孢菌素类抗生素"],"D","A","内科学",2017,"real","内科学|其他","妊娠期急性肾盂肾炎的抗生素选择","妊娠合并急性肾盂肾炎属复杂性尿路感染，需住院静脉给药，首选第三代头孢菌素（如头孢噻肟、头孢曲松），对胎儿安全且覆盖大肠埃希菌。大环内酯类对肠道革兰阴性菌无效；抗结核无从谈起；仅多饮水对症对孕妇上尿路感染不足。","《内科学》第9版·泌尿系统疾病·尿路感染","green"],["2017N85A","该患者最可能的诊断是。",["慢性淋巴细胞白血病","结核性淋巴结炎","淋巴结转移肿瘤","淋巴瘤"],"D","A","内科学",2017,"real","内科学|血液系统疾病","淋巴瘤的临床表现","无痛性进行性淋巴结肿大伴发热、盗汗、消瘦等B症状是淋巴瘤的典型表现；淋巴结可活动、质韧，融合成大块提示侵袭性。慢性淋巴细胞白血病多见于老年、以淋巴细胞绝对值增高为主；结核性淋巴结炎常破溃成瘘、伴低热；淋巴结转移癌质硬固定、有原发灶。","《内科学》第9版·血液系统疾病·淋巴瘤","green"],["2017N86A","对明确诊断最具有意义的检查是：",["PPD试验","淋巴结B超","淋巴结活检","骨髓活检"],"C","A","内科学",2017,"real","内科学|其他","淋巴瘤的确诊方法","淋巴瘤确诊与分型依赖淋巴结完整切除活检行形态学与免疫组化、分子检测，是金标准。PPD试验只能筛查结核；淋巴结B超仅判断大小形态；骨髓活检用于分期判断有无骨髓浸润，不能替代淋巴结病理。故选淋巴结活检。","《内科学》第9版·血液系统疾病·淋巴瘤","green"],["2017N87A","引起该患者贫血最可能的原因是",["慢性疾病致铁代谢障碍","骨髓内肿瘤细胞浸润","营养不良","自身免疫异常"],"D","A","内科学",2017,"real","内科学|其他","淋巴瘤合并自身免疫性溶血性贫血","淋巴瘤患者出现贫血的机制中，自身免疫性溶血（AIHA，Coombs试验阳性）是较特异的原因，可出现网织红细胞升高、间接胆红素增高。慢性病性贫血、骨髓浸润、营养不良、化疗骨髓抑制亦常见，但题干所给答案为免疫异常。临床遇到淋巴瘤伴溶血应查Coombs试验。","《内科学》第9版·血液系统疾病·淋巴瘤","yellow"],["2017N88A","该患者临床最可能的诊断是",["Graves 病","亚急性甲状腺炎","结节性甲状腺肿","自身免疫性甲状腺炎"],"A","A","内科学",2017,"real","内科学|内分泌与代谢","Graves病的诊断要点","甲状腺弥漫性肿大伴血管杂音、突眼、心悸多汗消瘦、T₃T₄升高TSH降低、TRAb阳性，符合Graves病。亚急性甲状腺炎有颈前疼痛、ESR明显增快、摄碘率降低（分离现象）；结节性甲状腺肿为多发结节、甲状腺功能多正常；自身免疫性甲状腺炎（桥本）多为质地韧硬、TPOAb高、甲功可减低。","《内科学》第9版·内分泌与代谢疾病·甲状腺功能亢进症","green"],["2017N89A","在下列选项中，对该患者首选的治疗是",["131I治疗","口服糖皮质激素治疗","口服甲巯咪唑","口服非甾体类抗炎药"],"C","A","内科学",2017,"real","内科学|其他","Graves病抗甲状腺药物选择","初诊Graves病、无压迫症状、非妊娠者首选抗甲状腺药物，甲巯咪唑为首选（半衰期长、每日一次、肝毒性低于PTU）。¹³¹I适用于药物无效复发、甲状腺较大者，禁用于妊娠哺乳；糖皮质激素用于甲状腺眼病活动期或危象；NSAIDs用于亚甲炎。","《内科学》第9版·内分泌与代谢疾病·甲状腺功能亢进症","green"],["2017N90A","患者经治疗后，甲状腺激素水平仍较高，症状不缓解，下一步最恰当的处理是",["131I治疗","糖皮质激素加量","改服碘剂治疗","加服β受体拮抗剂"],"A","A","生理学",2017,"real","生理学|内分泌","Graves甲亢的131I治疗指征","病例串题的后段提问，患者为甲亢（甲状腺激素水平高、症状明显），抗甲状腺药物疗效不佳且继续大剂量碘或糖皮质激素均非长期方案，此时选放射性131I治疗破坏甲状腺组织，A最恰当。β受体拮抗剂仅对症控制心率症状，糖皮质激素只在甲状腺危象时加量，碘剂仅术前或危象短期使用。","《内科学》第9版·内分泌系统疾病·甲状腺功能亢进症","yellow"],["2017N91A","下列检查无助于该患者诊断的是",["Schirmer 试验","腮腺造影","涎腺放射性核素扫描","双膝关节 X线片"],"D","A","内科学",2017,"real","内科学|其他","干燥综合征的辅助检查","口眼干燥、猖獗龋齿、腮腺肿大者应考虑干燥综合征，其检查包括Schirmer试验（泪液分泌）、腮腺造影（点状/球状扩张）、涎腺放射性核素扫描（摄取排泄延缓）、抗SSA/SSB抗体及唇腺活检。双膝关节X线片与本病诊断无关，故选D。","《内科学》第9版·风湿性疾病·干燥综合征","green"],["2017N92A","该病在皮肤特征性表现是",["紫癜样皮疹","荨麻疹样皮疹","结节样红斑","环形红斑"],"A","A","内科学",2017,"real","内科学|其他","干燥综合征的皮肤表现","干燥综合征皮肤特征性表现为高球蛋白血症所致的紫癜样皮疹，多见于下肢、呈米粒大小可触及性紫癜，分批出现并遗留色素沉着。荨麻疹样皮疹、结节性红斑见于血管炎、贝赫切特病、结节病；环形红斑见于风湿热。","《内科学》第9版·风湿性疾病·干燥综合征","green"],["2017N93A","首选的诊断方法是",["腹部CT检查","腹腔穿刺","腹腔动脉造影","立位腹平片"],"B","A","内科学",2017,"real","内科学|其他","诊断性腹腔穿刺的指征","腹部闭合性损伤疑有腹腔内出血时，腹腔穿刺（或灌洗）简便、快速、阳性率高，抽出不凝血即可确诊，是首选的诊断方法。腹部CT适用于血流动力学稳定者定位；腹腔动脉造影用于明确出血血管并栓塞；立位腹平片主要用于判断膈下游离气体。","《外科学》第9版·腹部损伤·腹腔内出血的诊断","green"],["2017N94A","最可能的诊断是",["胃穿孔","小肠破裂","腹膜后血肿","肝脾破裂"],"D","A","内科学",2017,"real","内科学|其他","脾破裂的诊断","左上腹外伤后失血性休克、腹穿抽出不凝血、脾区叩浊、左肋骨折，最可能为脾破裂（占腹腔实质脏器损伤首位）。肝破裂多有右上腹外伤、右季肋压痛、可伴胆汁性腹膜炎；腹膜后血肿多无腹穿不凝血；胃小肠破裂以气腹、腹膜炎为主。","《外科学》第9版·腹部损伤·脾破裂","green"],["2017N95A","最有价值的检查是",["立位腹平片","腹部B超","腹腔穿刺","腹部CT"],"A","A","内科学",2017,"real","内科学|其他","膈下游离气体的检查","对判断空腔脏器破裂最有价值的检查是立位腹平片：膈下可见新月形游离气体即可确诊消化道穿孔，简单快捷。腹部B超对气体不敏感；腹腔穿刺阳性提示出血或消化液漏出但定位困难；腹部CT更精确但耗时，急性期首选仍为立位平片。","《外科学》第9版·腹部损伤·空腔脏器损伤","green"],["2017N96A","最有效的治疗方法",["胃肠加压、输液","镇痛镇静治疗","应用广谱抗生素","手术探查"],"D","A","内科学",2017,"real","内科学|其他","消化道穿孔的手术指征","消化道穿孔伴弥漫性腹膜炎一旦确诊应急诊手术探查，行穿孔修补或部分切除加腹腔冲洗引流，是最有效的治疗。胃肠减压、输液、镇痛镇静、广谱抗生素均为术前准备和辅助措施，不能替代手术清除污染源。","《外科学》第9版·胃十二指肠疾病·消化性溃疡急性穿孔","green"],["2017N97A","引起该患者症状的致病菌为",["大肠埃希菌","变形杆菌","产气荚膜杆菌","厌氧芽胞杆菌"],"D","A","内科学",2017,"real","内科学|其他","气性坏疽的病原体","气性坏疽由梭状芽胞杆菌（厌氧芽胞杆菌，以产气荚膜梭菌为主）引起，属厌氧菌感染，伤口深、污染重、肌肉坏死并产气、捻发音、进展迅速。大肠埃希菌、变形杆菌为肠道革兰阴性杆菌，引起化脓性感染而不产气性坏疽；故致病菌为厌氧芽胞杆菌。","《外科学》第9版·外科感染·气性坏疽","green"],["2017N98A","该伤口处置应用",["抗生素稀释液","过氧化氢溶液","高锰酸钾稀释液","无菌生理盐水"],"B","A","内科学",2017,"real","内科学|其他","气性坏疽的局部处理","气性坏疽伤口应敞开、充分引流，用3%过氧化氢（双氧水）反复冲洗以提供有氧环境、抑制厌氧菌，并可用高锰酸钾溶液湿敷。抗生素稀释液冲洗无效且刺激组织；无菌生理盐水不能抑制厌氧菌；关键是彻底清创加氧化剂冲洗。","《外科学》第9版·外科感染·气性坏疽","green"],["2017N99A","治疗中不必使用的药物是",["青霉素","丙种球蛋白","甲硝唑","TAT"],"B","A","内科学",2017,"real","内科学|其他","气性坏疽的药物治疗","气性坏疽治疗包括彻底清创、大剂量青霉素（或克林霉素）加甲硝唑抗厌氧菌、多价抗毒血清（TAT/抗气性坏疽血清）及高压氧，丙种球蛋白无明确疗效且不针对外毒素，故不必使用。甲硝唑针对厌氧菌、青霉素针对产气荚膜梭菌、抗毒血清中和外毒素。","《外科学》第9版·外科感染·气性坏疽","green"],["2017N100A","该病人可能发生的最严重情况是",["幽门梗阻","消化道穿孔","消化道黏膜损伤","回盲瓣梗阻"],"B","A","内科学",2017,"real","内科学|其他","消化道异物的并发症","误吞异物（或胃石）嵌顿于胃窦、十二指肠球部时，最严重的后果是压迫、摩擦致局部缺血坏死而发生消化道穿孔，引起急性弥漫性腹膜炎、腹腔脓肿，甚至危及生命。幽门梗阻、黏膜损伤、回盲瓣梗阻虽可发生但相对轻，故最严重情况为穿孔。","《外科学》第9版·胃十二指肠疾病·消化道异物","green"],["2017N101A","判断有无上述严重后果最简单有效的方法是",["腹部B超","腹部CT","腹部触诊检查","消化道造影"],"C","A","内科学",2017,"real","内科学|其他","腹膜刺激征的临床价值","判断有无消化道穿孔最简单有效的办法是腹部触诊：出现腹肌紧张、压痛、反跳痛（腹膜刺激征）、肝浊音界缩小或消失即高度提示穿孔，床旁即可完成。B超、CT、消化道造影均需搬运及时间，且造影剂可能外漏加重腹膜炎。","《外科学》第9版·胃十二指肠疾病·消化道穿孔","green"],["2017N102A","经过一天观察，腹痛减轻，仍未排便。处理措施是",["开腹探查，取异物","结肠镜检查","口服液体石蜡油","胃镜检查"],"C","A","内科学",2017,"real","内科学|其他","消化道异物的保守处理","观察一天腹痛减轻、无腹膜刺激征、仍未排出异物，说明异物已通过幽门进入肠道且无梗阻、无穿孔，可予口服液体石蜡油润滑导泻，促进异物随粪便排出并观察。开腹探查、结肠镜、胃镜均有创且有再损伤风险，不宜首选。","《外科学》第9版·胃十二指肠疾病·消化道异物","green"],["2017N103A","最可能的诊断是",["肺癌骨转移","髋关节骨关节炎","髋关节化脓性关节炎","全髋关节结核"],"D","A","内科学",2017,"real","内科学|呼吸系统疾病","髋关节结核的诊断","髋关节结核多见于儿童青壮年，起病缓慢，表现为髋部疼痛、跛行、夜啼，“4”字试验阳性、Thomas征阳性，血沉增快，X线示关节间隙变窄、骨质破坏，伴低热盗汗。化脓性关节炎起病急、高热剧痛；骨关节炎见于老年、活动后痛；肺癌骨转移多有原发灶、破坏呈溶骨性。","《外科学》第9版·骨与关节结核·髋关节结核","green"],["2017N104A","下列检查中，对确诊最有价值的是",["胸部X线片","骨扫描","髋部B超","髋部MRI"],"D","A","内科学",2017,"real","内科学|其他","关节结核的MRI价值","MRI对骨与关节结核的早期诊断价值最高，可在X线改变出现前显示骨髓水肿、关节腔积液、滑膜增厚及椎旁脓肿，并明确病变范围。X线片早期常阴性；骨扫描特异性差；B超仅能显示积液和脓肿，不能评价骨破坏。","《外科学》第9版·骨与关节结核·影像学检查","green"],["2017N105A","住院治疗 4周后，患者精神状况和食欲改善，复查血沉 20mm/h, 但是肿物没有消失，进一步治疗 方案是",["肿物切除术","髋人形石膏固定","人工关节置换术","病灶清除术"],"D","A","内科学",2017,"real","内科学|其他","髋关节结核病灶清除术","髋关节结核经4周规范抗结核治疗全身症状好转、血沉下降，但局部病灶（寒性脓肿、骨破坏）未消退，应行病灶清除术：清除坏死骨、干酪样物质和脓肿，同时植骨或关节融合，可缩短疗程、保留功能。单纯肿物切除、石膏固定、人工关节置换均不宜在活动期进行。","《外科学》第9版·骨与关节结核·手术治疗","green"],["2017N106A","体格检查有力的证据是",["左股骨下端皮温升高","左股骨下端肿胀","左股骨下端（干骺端）深压痛","左膝关节伸屈受限"],"C","A","内科学",2017,"real","内科学|其他","急性骨髓炎的早期体征","急性血源性骨髓炎早期最有力的体征是病变部位（干骺端）局限性深压痛，因炎症尚局限于骨髓腔内，局部皮温升高、肿胀出现较晚。皮温升高、关节活动受限为非特异表现。故深压痛最具诊断价值。","《外科学》第9版·骨与关节感染·急性血源性骨髓炎","green"],["2017N107A","下列有诊断意义的辅助检查是",["局部穿刺","血培养","X线检查","血常规"],"A","A","内科学",2017,"real","内科学|其他","骨髓炎的分层穿刺","局部脓肿分层穿刺抽出脓液或血性混浊液，涂片见脓细胞和细菌即可确诊急性骨髓炎，并可行药敏，是最有诊断意义的辅助检查，应在使用抗生素前完成。血培养阳性率低；X线需2周后才出现改变；血常规仅有提示意义。","《外科学》第9版·骨与关节感染·急性血源性骨髓炎","green"],["2017N108A","《备急千金药方》曰： “凡大医治病，必当安神定志，无欲无求，先发大慈恻隐之心，誓愿普救含灵 之苦”，体现的是",["医乃仁术","博极医源","治病求本","医患和谐"],"A","A","内科学",2017,"real","内科学|其他","大医精诚的伦理内涵","“先发大慈恻隐之心，誓愿普救含灵之苦”是孙思邈《备急千金要方·大医精诚》的核心，强调医者须具仁爱之心，体现“医乃仁术”的医学道德本质。“博极医源”指钻研医理，“治病求本”为治则，“医患和谐”为现代提法，均非此句主旨。","《医学伦理学》·医学道德范畴·医乃仁术","green"],["2017N110A","某医学院骨科医生给聋哑患者做腰椎手术，术中需要患者反馈感受。因患者不会手语并不识字， 医 生使用了手绘的腰椎疼痛区域分布及疼痛表达图形，与患者进行十几次“ 对话”，顺畅准确。这种沟通方式",["上行沟通","下行沟通","平行沟通","非语言沟通"],"B","A","外科学",2017,"real","外科学|其他","非语言沟通","医生以手绘疼痛区域分布图、疼痛表情图形与聋哑且不识字的患者交流，靠图形、姿势、表情等非言语符号传递信息并获反馈，属非语言沟通。上行、下行、平行沟通是组织内部按层级方向的沟通分类，不适合医患之间的情形，故A、B、C不选。⚠️原答案标为B，与题干情形及沟通学分类不符，存疑。","《医学伦理学》·医患关系·医患沟通的方式","yellow"],["2017N111A","女性患者， 36岁。因头晕、头痛来医院就诊，当时测血压 200/130mmHg ，医生经诊疗和慎重考虑 后，予留院观察，患者不同意执意回家，从伦理角度来看，医生的最佳做法是",["尊重患者自主权，但应尽力劝导患者留院观察","应尽力劝导患者留院观察，无效时行使干涉权","为救治病人，强行让患者留院观察","同意患者回家，告知其后果自负"],"D","A","人文",2017,"real","人文|医学伦理","患者拒绝治疗的伦理处理","患者神志清楚、具备完全决策能力，拒绝留院属行使自主权，但血压200/130mmHg随时可发生脑卒中、急性左心衰。医生应把病情危险、替代方案、复诊时机与急诊指征讲清并反复劝导，劝导无效仍应尊重其决定并做好记录。强行留观侵犯自主权，以「后果自负」代替劝导则违背有利与不伤害原则。故最佳做法是尊重自主权同时尽力劝导。⚠️原答案存疑，理由：选项A（尊重患者自主权、尽力劝导）最符合伦理要求，被记录的D仅表示放任回家，未体现医生的劝导与说明义务。","《医学伦理学》第9版·临床诊疗伦理·尊重原则与患者自主权","yellow"],["2017N112A","在患者所拥有的伦理权利中，患者的疾病认知权是指",["任何人在患病情况下都有获得相应医疗服务的权利","患者对其所患疾病的性质、治疗情况及预后有知悉的权利","医生的诊疗方案须经患者了解并同意后方可实施","患者由于患病可以免除承担相应社会责任的权利"],"A","A","人文",2017,"real","人文|医学伦理","患者的疾病认知权","疾病认知权即患者知悉自身疾病相关信息的权利，包含疾病性质、严重程度、治疗方案与预后，对应B。A是基本医疗权（医疗享有权），C是知情同意权，D是患病后免除一定社会责任的权利，四者同属患者权利但内涵不同。辨认关键是区分「知悉信息」与「作出决定」。⚠️原答案存疑，理由：题干所问疾病认知权的定义是B，A实为基本医疗权的表述。","《医学伦理学》第9版·医疗人际关系伦理·患者的权利","yellow"],["2017N113A","女性，23岁。妊娠27周，因呼吸衰竭需行剖宫产挽救患者生命。患者指定其家属做医疗决定。家 属因对手术方案不理解拒绝签字。由于其他抢救方案无效，患者和胎儿双双死亡。从医学伦理的角度看， 以下说法正确的是",["只要医务人员履行了知情同意程序，医务人员就能免责","医务人员不实施手术并不违法，符合伦理","医务人员应尊重患者的自主决定权","抢救患者生命是医生的首要考虑"],"D","A","内科学",2017,"real","内科学|呼吸系统疾病","生命权优先原则","当患者生命垂危且抢救措施明确有效时，救死扶伤是医师的首要职责，生命权优先于其他权益；家属拒绝签字不应成为放弃有效救治的理由，可通过医院伦理委员会、医务部门批准后实施。A免责说法错误，B违背医师救治义务，C在本例中患者已指定家属且方案关乎生命，不能简单以自主权否定救治。","《医学伦理学》·临床诊疗伦理·抢救生命的伦理原则","green"],["2017N114A","某药企在一个社区进行某药对高血压患者脑卒中发生率的影响随机双盲空白对照试验。 受试者为高 血压中危患者，时间为 3年。期间，患者发生脑卒中后即停止观察，试验组服用研究药物，对照组服用安 慰剂。社区医生每招募 1名受试者给其 100元作为酬劳。从伦理学角度来说，对该研究的正确评价是",["研究设计不符合伦理学的要求，受试者招募者之间存在利益冲突","研究设计符合伦理学要求，但受试者招募者之间存在利益冲突","研究设计完全科学，故无论理学的的问题","研究对手是这有较大的风险，但可得到伦理辩护"],"A","A","人文",2017,"real","人文|医学伦理","临床试验设计与利益冲突","以脑卒中为终点、设3年空白对照，对照组得不到已被证实有效的降压治疗，受试者风险超出最小化要求，违背不伤害与有利原则；同时每招募1名受试者给社区医生100元酬劳，使招募者的经济利益与入组数量挂钩，构成利益冲突，可诱导不当招募并损害自愿性。研究设计与利益安排均不合伦理，应经伦理委员会审查、去除经济诱导并改设合理对照。故选A。","《医学伦理学》第9版·医学科研伦理·涉及人的生物医学研究伦理","green"],["2017N115A","女性，20岁。有静脉吸毒史，检测发现其 HIV抗体(+)，患者要求医生为其保守秘密。医生正确 的做法是 A.为患者保密，不告知任何人",["B、C、D是其下两道小题的备选项，请 从中选择一项最符合题目要求的，每个选项可以被选择一次或两次。 A.毛细血管血压增高 B.血浆胶体渗透压降低 C.组织液胶体渗透压增高 D.毛细血管通透性增高","不公开患者该信息，只告知其直系家属","不公开患者该信息，但报告疾控中心","征得患者同意后报告疾控中心 二、B型题： 116～135小题，每小题"],"C","A","人文",2017,"real","人文|医学伦理","艾滋病病毒感染者信息的报告","HIV阳性属个人健康隐私，医生原则上应保密；但艾滋病属法定报告传染病，医疗机构须按规定向疾病预防控制机构报告，这是保密义务的法定例外，且报告无须征得患者同意。故不向社会与他人扩散、仅依法上报疾控中心的做法可获伦理辩护。A、B扩大了泄露范围，损害患者权益；D把法定义务变成需先征得同意，不符合规定。故选C。","《医学伦理学》第9版·临床诊疗伦理·保密义务及其例外","green"],["2017N116B","右心衰竭发生组织水肿的主要机制是",["毛细血管血压增高","血浆胶体渗透压降低","组织液胶体渗透压增高","毛细血管通透性增高"],"A","B","内科学",2017,"real","内科学|循环系统疾病","右心衰水肿的发生机制","右心衰竭时体循环静脉回流受阻，静脉压与毛细血管流体静压（血压）升高，滤出增多而回收减少，形成凹陷性水肿。这属静水压增高机制。血浆胶体渗透压降低见于肾病综合征、肝硬化；组织液胶体渗透压升高见于炎症；通透性增高见于过敏与感染。","《病理生理学》第9版·水电解质代谢紊乱·水肿","green"],["2017N117B","肾病综合征发生组织水肿的主要机制是",["毛细血管血压增高","血浆胶体渗透压降低","组织液胶体渗透压增高","毛细血管通透性增高"],"B","B","内科学",2017,"real","内科学|泌尿系统疾病","肾病性水肿的机制","肾病综合征因大量蛋白尿致低白蛋白血症，血浆胶体渗透压明显降低，水分向组织间隙转移而形成水肿，属胶体渗透压降低机制。毛细血管血压增高见于心衰，通透性增高见于炎症，组织液胶体渗透压增高见于淋巴回流障碍或炎症。","《病理生理学》第9版·水电解质代谢紊乱·水肿","green"],["2017N118B","缩宫素分泌调节的形式是",["以神经调节为主","以激素调节为主","以代谢产物反馈调节为主","受靶腺激素及下丘脑调节双重调节"],"A","B","外科学",2017,"real","外科学|其他","缩宫素分泌的神经调节","缩宫素由下丘脑室旁核与视上核合成、经神经垂体释放，其释放主要受神经反射调节：吸吮乳头与牵张子宫颈的刺激经脊髓上传，引起下丘脑神经元放电而释放缩宫素，形成射乳反射与分娩反射，选A。它不受靶腺激素与下丘脑释放激素的轴系双重调控，也不以代谢产物反馈为主，B、C、D不选。","《生理学》第9版·内分泌·神经垂体激素","green"],["2017N119B","甲状旁腺激素分泌的调节形式是",["以神经调节为主","以激素调节为主","以代谢产物反馈调节为主","受靶腺激素及下丘脑调节双重调节"],"C","B","生理学",2017,"real","生理学|内分泌","甲状旁腺激素分泌的调节（血钙负反馈）","甲状旁腺激素的分泌不受垂体调节，也不依赖神经支配，主要受血钙浓度负反馈调节：血钙降低→PTH分泌迅速增多→骨钙释放、肾小管重吸收钙增加、活化维生素D→血钙回升；血钙升高则相反。血钙是代谢产物，故为以代谢产物反馈调节为主，C正确。","《生理学》第9版·内分泌·钙磷调节","green"],["2017N120B","核酶的生物学作用是",["RNA编辑","RNA自身剪接","RNA加帽","RNA加多聚A尾"],"B","B","生物化学",2017,"real","生物化学|酶","核酶与RNA的催化功能","核酶指具有催化活性的RNA，如Ⅰ类、Ⅱ类内含子的自我剪接、RNase P的M1 RNA、核糖体大亚基rRNA的肽酰转移酶活性。因此“RNA自身剪接”是核酶生物学作用的典型体现；加帽、加多聚A尾由蛋白质酶催化，RNA编辑由编辑酶复合物完成。","《生物化学与分子生物学》第9版·RNA的生物合成·核酶","green"],["2017N121B","蛋白质氨基酸序列与 hnRNA序列不完全对应的可能原因是",["RNA编辑","RNA自身剪接","RNA加帽","RNA加多聚A尾"],"A","B","生物化学",2017,"real","生物化学|蛋白质的结构与功能","RNA编辑","hnRNA经剪接去掉内含子后一般与mRNA序列对应，但RNA编辑可在转录后改变碱基（插入、删除或替换），使成熟mRNA序列与DNA模板/hnRNA不完全一致，翻译出的氨基酸序列也与基因序列不完全对应。加帽、加尾只影响稳定性与翻译效率，不改变编码信息。","《生物化学与分子生物学》第9版·RNA的生物合成·真核RNA的转录后加工","green"],["2017N122B","检测蛋白质 -蛋白质相互作用的实验是",["酵母双杂交技术","DNA链末端合成终止法","聚合酶链反应","染色体免疫沉淀法"],"A","B","外科学",2017,"real","外科学|其他","蛋白-蛋白相互作用检测","酵母双杂交把诱饵蛋白与靶蛋白分别与转录因子的DNA结合域、转录激活域融合表达，若两蛋白相互作用可使结合域与激活域靠近、重建转录因子活性并激活报告基因，专用于检测蛋白质-蛋白质相互作用，选A。DNA链末端合成终止法用于测序；PCR只扩增核酸；染色质免疫沉淀检测DNA与蛋白结合，B、C、D不选。","《生物化学与分子生物学》第9版·基因重组与分子生物学技术","green"],["2017N123B","测定DNA-蛋白质相互作用的实验是",["酵母双杂交技术","DNA链末端合成终止法","聚合酶链反应","染色体免疫沉淀法"],"D","B","外科学",2017,"real","外科学|其他","DNA-蛋白相互作用检测","染色质免疫沉淀（ChIP）先用甲醛交联细胞内蛋白质与DNA，超声打碎染色质，再用特异抗体沉淀蛋白-DNA复合物，最后检测共沉淀的DNA序列，可判定某蛋白是否结合特定DNA片段，选D。酵母双杂交测蛋白-蛋白相互作用；DNA链末端合成终止法为测序；PCR仅扩增，无法反映结合关系，A、B、C不选。","《生物化学与分子生物学》第9版·基因重组与分子生物学技术","green"],["2017N124B","高血压病常见的血管病变是",["动脉玻璃样变性","动脉壁纤维素样变性","动脉粥样硬化","动脉中层钙化"],"A","B","内科学",2017,"real","内科学|循环系统疾病","良性高血压细动脉玻璃样变","良性高血压的基本血管病变是细小动脉玻璃样变性（透明变性），因血浆蛋白渗入血管壁、平滑肌细胞增生分泌基质所致，导致管壁增厚、管腔狭窄、阻力增加。纤维素样坏死见于恶性高血压；动脉粥样硬化见于大中动脉；中层钙化见于老年性动脉硬化（Monckeberg）。","《病理学》第9版·心血管系统疾病·高血压病","green"],["2017N125B","心肌梗死常见的冠状动脉病变是",["动脉玻璃样变性","动脉壁纤维素样变性","动脉粥样硬化","动脉中层钙化"],"C","B","内科学",2017,"real","内科学|循环系统疾病","心肌梗死的冠脉病变基础","心肌梗死绝大多数是在冠状动脉粥样硬化基础上发生斑块破裂、血栓形成或痉挛致管腔急性闭塞。纤维素样坏死见于恶性高血压及自身免疫性血管炎；玻璃样变见于良性高血压细动脉；中层钙化为Monckeberg动脉硬化，不引起管腔闭塞。","《病理学》第9版·心血管系统疾病·心肌梗死","green"],["2017N126B","急性蜂窝状炎性阑尾炎的病理特点是",["化脓性炎","纤维素性炎","浆液性炎","变质性炎"],"A","B","外科学",2017,"real","外科学|普通外科","化脓性炎与纤维素性炎鉴别","急性蜂窝织炎性阑尾炎时中性粒细胞自黏膜面向肌层、浆膜层弥漫浸润，阑尾壁各层充血水肿、大量脓性渗出，属典型化脓性炎，选A。纤维素性炎以纤维素渗出为主（大叶性肺炎、白喉）；浆液性炎见于风湿性关节炎、结核性胸膜炎早期；变质性炎以实质细胞变性坏死为主（病毒性肝炎、乙脑），B、C、D不选。","《病理学》第9版·炎症·炎症的病理学类型","green"],["2017N127B","风湿性关节炎的病理特点是",["化脓性炎","纤维素性炎","浆液性炎","变质性炎"],"C","B","外科学",2017,"real","外科学|其他","风湿性关节炎的渗出性质","风湿性关节炎时滑膜及关节周围组织充血水肿，关节腔内以浆液和少量纤维素渗出为主，属浆液性炎，选C。因渗出物易于完全吸收，临床不遗留关节畸形，这与类风湿关节炎的血管翳破坏不同。A化脓性炎见于化脓性关节炎；B纤维素性炎如绒毛心、大叶性肺炎；D变质性炎以细胞坏 X","小肠运动的形式",["紧张性收缩","分节运动","集团蠕动","逆蠕动"],"ABD","X","外科学",2017,"real","外科学|其他","小肠运动形式","小肠运动形式包括紧张性收缩（维持肠管形态与腔内压）、分节运动（以环行肌为主的节律性收缩，使食糜与消化液充分混合）和蠕动；十二指肠与回肠末端还有逆蠕动，起延缓排空、防止反流作用，故A、B、D正确。C集团蠕动是大肠特有的运动形式，推动结肠内容物长距离移动，小肠不存在，故不选。","《生理学》第9版·消化和吸收·小肠的运动","green"],["2017N138X","关于CO2在血液中运输的叙述，正确的是",["化学结合形式的 CO2主要是碳酸氢盐","小部分CO2直接溶解于血浆中","Hb与CO2结合生成氨基甲酰血红蛋白需酶催化","碳酸酐酶在 CO2的运输中发挥重要作用"],"ABD","X","外科学",2017,"real","外科学|其他","CO2的运输形式","血液中的CO2化学结合形式以碳酸氢盐为主，约占88%，在红细胞内由碳酸酐酶催化CO2与H2O生成H2CO3再解离而成；另有少量CO2直接物理溶解于血浆，虽比例小但决定血中PCO2，故A、B、D正确。C错，Hb与CO2结合生成氨基甲酰血红蛋白属直接结合，不需酶催化。","《生理学》第9版·呼吸·气体在血液中的运输","green"],["2017N139X","促进肾素分泌的因素有",["循环血量减少","肾小球滤过 Na+减少","动脉血压降低","肾交感神经活动减弱"],"ABC","X","外科学",2017,"real","外科学|其他","肾素分泌的调节因素","肾素由球旁细胞分泌。循环血量减少、动脉血压降低时入球小动脉牵张减弱，球旁细胞受刺激而释放肾素；流经致密斑的Na+、Cl-减少也可刺激肾素释放；肾交感神经兴奋经β1受体促肾素分泌，故A、B、C正确。D错，肾交感神经活动减弱时肾素分泌减少而非增多，故不选。","《生理学》第9版·尿的生成和排出·肾素-血管紧张素-醛固酮系统","green"],["2017N140X","影响突触前神经末梢递质释放量的主要因素有",["神经冲动的传导速度","动作电位频率","进入神经末梢的 Ca2+量","突触囊泡大小"],"BC","X","生理学",2017,"real","生理学|神经系统","影响递质释放量的因素（Ca2+内流）","递质释放量取决于到达末梢的冲动频率（频率编码使Ca2+内流总和）和末梢内Ca2+浓度——Ca2+是触发囊泡出胞的关键离子，故B、C正确。神经冲动传导速度只影响到达时间，不决定每次冲动释放量；突触囊泡大小由囊泡本身决定，与释放量无关。D为干扰项。","《生理学》第9版·神经系统·突触传递","green"],["2017N141X","下列关于汗液的叙述，正确的是",["汗液中不含蛋白质","刚刚分泌的汗液渗透压高于血浆","汗液中的 Na+浓度受醛固酮调节","由汗腺细胞被动分泌"],"AC","X","外科学",2017,"real","外科学|其他","汗液成分与分泌特点","汗液由汗腺细胞主动分泌（分泌部生成等渗液，经导管重吸收部分NaCl后成为低渗），主要成分为水、NaCl、尿素等，几乎不含蛋白质，A正确；导管对Na+的重吸收受醛固酮调节，C正确。B错，刚分泌的初级汗液为等渗而非高渗；D错，汗液为主动分泌而非被动分泌，且汗腺受交感胆碱能纤维支配。","《生理学》第9版·能量代谢与体温·机体的散热","green"],["2017N142X","能够导致核酸分子 Tm值升高的因素有",["GC含量升高","溶液离子强度高","温度提高","缓冲液浓度的改变"],"AB","X","外科学",2017,"real","外科学|其他","DNA变性Tm的影响因素","Tm是DNA双链解链50%时的温度。GC含量升高使互补氢键增多、碱基堆积力增强，双链更稳定，Tm升高，A正确；溶液离子强度增高可中和磷酸骨架间静电斥力，双链更稳定，Tm亦升高，B正确。C升高温度只是使体系接近Tm的过程，不会使Tm值本身升高；D缓冲液浓度改变对Tm影响甚微，且不属公认影响因素，故不选。","《生物化学与分子生物学》第9版·核酸的结构与功能","green"],["2017N143X","糖异生反应涉及的酶有",["磷酸烯醇式丙酮酸羧激酶","丙酮酸羧化酶","葡萄糖激酶","6-磷酸果糖激酶"],"AB","X","生物化学",2017,"real","生物化学|糖代谢","糖异生的四个关键酶","糖异生需绕过糖酵解三个不可逆反应：丙酮酸经丙酮酸羧化酶和磷酸烯醇式丙酮酸羧激酶生成磷酸烯醇式丙酮酸，果糖-1,6-二磷酸 ,"肉芽肿性炎以巨噬细胞及其转化细胞局限性浸润增生形成结节为特征。A伤寒小结由伤寒细胞（巨噬细胞）聚集构成，属感染性肉芽肿；B子宫内膜结核为结核性肉芽肿，含类上皮细胞和Langhans巨细胞；C硅肺结核在硅结节基础上伴结核性肉芽肿形成，属肉芽肿性炎。D新月体性肾小球肾炎的肾小球新月体由壁层上皮细胞和单核巨噬细胞增生构成，属增生性炎症，不形成肉芽肿。故ABC正确。","《病理学》第9版·炎症·肉芽肿性炎","green"],["2017N151X","下列病变属于子宫颈 CINⅢ 的有",["轻度异型增生","中度异型增生","重度异型增生","原位癌"],"CD","X","外科学",2017,"real","外科学|其他","CIN分级与CINⅢ","CINⅢ指子宫颈上皮内异型细胞累及上皮下1/3以上乃至全层，包括重度异型增生（C）与原位癌（D），两者病理上难以截然区分，处理原则相同。轻度异型增生相当于CINⅠ（异型细胞限于上皮下1/3），中度异型增生为CINⅡ（下2/3），故A、B不属于CINⅢ。","《病理学》第9版·女性生殖系统疾病·子宫颈上皮内瘤变","green"],["2017N152X","类风湿关节炎的滑膜改变有",["大量中性粒细胞浸润","大量淋巴细胞浸润","滑膜细胞增生","血管增生明显"],"BCD","X","内科学",2017,"real","内科学|风湿免疫","RA滑膜炎的病理特点","类风湿关节炎的滑膜病变为慢性非化脓性增生性滑膜炎：滑膜细胞增生、淋巴细胞及浆细胞大量浸润（形成淋巴滤泡）、血管增生并形成血管翳，故B、C、D正确。中性粒细胞大量浸润见于化脓性关节炎或痛风急性发作，A不选。","《病理学》第9版·免疫性疾病·类风湿关节炎","green"],["2017N153X","滤泡细胞性淋巴瘤的免疫组化检测中，阳性的指标有",["BCL-2","CD3","CD20","CD79a"],"ACD","X","内科学",2017,"real","内科学|血液系统疾病","滤泡性淋巴瘤免疫表型","滤泡性淋巴瘤来源于滤泡生发中心B细胞，表达泛B细胞标记CD20、CD79a，并因t(14:18)致BCL-2蛋白强阳性，故A、C、D正确。CD3为T细胞标记，B不选，可用于与T细胞淋巴瘤鉴别。","《内科学》第9版·血液系统疾病·淋巴瘤","green"],["2017N154X","下列属于慢性肺源性心脏病急性加重期的治疗原则有",["积极控制感染","积极利尿","积极应用正性肌力药","积极处理并发症"],"AD","X","外科学",2017,"real","外科学|外科总论","肺心病急性加重期治疗原则","慢性肺心病急性加重多由呼吸道感染诱发，治疗关键是积极控制感染、通畅呼吸道、纠正缺氧与二氧化碳潴留，并积极处理呼衰、心衰、心律失常等并发症，故A、D正确。B错，利尿剂应小量、缓慢、短程使用，过度利尿致低钾低氯性碱中毒、痰液黏稠及循环阻力增加；C错，正性肌力药仅在感染控制、利尿无效时小剂量短用。","《内科学》第9版·呼吸系统疾病·慢性肺源性心脏病","green"],["2017N155X","扩张型心肌病患者辅助检查可出现的异常结果有",["心电图可见病理 Q波","超声心动图可呈现二尖瓣反流","核素检查心肌可有灶性放射性减低","心室造影可出现室壁矛盾运动"],"ABC","X","内科学",2017,"real","内科学|循环系统疾病","扩张型心肌病的辅助检查","扩张型心肌病因心肌广泛纤维化，心电图可见病理性Q波（A对）；心腔扩大致二尖瓣相对关闭不全，超声见二尖瓣反流（B对）；核素检查示心肌弥漫性放射性减低或花斑样改变（C对）。室壁矛盾运动是心肌梗死节段性室壁瘤的表现，扩心病为弥漫性运动减弱，D不选。","《内科学》第9版·循环系统疾病·扩张型心肌病","green"],["2017N156X","溃疡性结肠炎的并发症可有",["中毒性巨结肠","癌变","肠出血","肠穿孔"],"ABCD","X","内科学",2017,"real","内科学|消化系统疾病","溃疡性结肠炎的并发症","溃疡性结肠炎的主要并发症包括中毒性巨结肠（暴发型、低钾或使用止泻剂诱因）、癌变（病程>10年、全结肠炎者风险高）、肠大出血、肠穿孔，以及肠狭窄、肛周病变少。故A、B、C、D均属其并发症。","《内科学》第9版·消化系统疾病·溃疡性结肠炎","green"],["2017N157X","重症急性肾衰竭透析治疗的方法有：",["间歇性血液透析","连续性动静脉血液滤过","连续性静静脉血液滤过","腹膜透析"],"ABC","X","内科学",2017,"real","内科学|泌尿系统疾 ,"加快葡萄糖氧化速率","缺氧时快速提供能量"],"D","A","生物化学",2018,"real","生物化学|糖代谢","糖酵解的生理意义","糖酵解在无氧条件下经底物水平磷酸化快速产能，1分子葡萄糖净生成2分子ATP和2分子乳酸，是缺氧时（如剧烈运动肌肉、成熟红细胞）获得能量的主要方式。它不能使血糖升高（糖异生才升血糖），也不加快葡萄糖氧化速度。","《生物化学与分子生物学》第9版·糖代谢·糖酵解","green"],["2018N21A","能够促进 ATP合酶合成 ATP的因素是",["物质还原速度的加速","质子顺浓度梯度向基质回流","寡霉素和 ATP合酶相互作用","电子从 Cytb到Cytc1的传递减慢"],"B","A","生物化学",2018,"real","生物化学|酶","ATP合酶与质子回流","ATP合酶利用跨内膜质子电化学梯度：质子经F0（c亚基组成的质子通道）顺浓度梯度回流至基质，带动γ亚基旋转使β亚基构象改变，将ADP与Pi合成ATP。寡霉素结合c亚基阻断质子通道，反使ATP合成减少；电子传递减慢只减少质子泵出，也不促进合成。","《生物化学与分子生物学》第9版·生物氧化·氧化磷酸化","green"],["2018N22A","能直接以甘氨酸为原料合成的化合物是",["二氢乳清酸","磷酸核糖焦磷酸","一磷酸腺苷","二磷酸尿苷"],"C","A","生理学",2018,"real","生理学|其他","嘌呤从头合成的原料（甘氨酸）","嘌呤核苷酸从头合成时，甘氨酸作为嘌呤环C4、C5和N7的直接供体参与构成，最终生成IMP并进而转变为AMP（一磷酸腺苷），故C正确。二氢乳清酸是嘧啶从头合成中间产物（由氨甲酰磷酸与天冬氨酸生成）；磷酸核糖焦磷酸是嘌呤合成的核糖供体；尿苷酸为嘧啶核苷酸。","《生物化学与分子生物学》第9版·核苷酸代谢·嘌呤核苷酸的合成","green"],["2018N23A","体内快速调节代谢的方式是",["酶蛋白生物合成","酶蛋白泛素化降解","酶蛋白化学修饰","同工酶亚基的聚合"],"C","A","生理学",2018,"real","生理学|其他","酶的化学修饰调节（快速调节）","酶的化学修饰（磷酸化/去磷酸化等共价修饰）可使酶活性数秒至数分钟内改变，是体内快速调节代谢的主要方式，C正确。酶蛋白生物合成与泛素化降解涉及基因表达和蛋白质降解，耗时长、属慢速调节；同工酶亚基聚合非普遍调节方式且也较慢。","《生物化学与分子生物学》第9版·酶·酶的调节","green"],["2018N24A","RNA 生物合成时，转录因子 TFⅡD结合的部位是",["TATA 盒","ATG","GC盒","Poly A"],"A","A","生物化学",2018,"real","生物化学|RNA转录与翻译","TFⅡD与TATA盒","真核RNA聚合酶Ⅱ转录起始时，TFⅡD（含TBP亚基）首先识别并结合启动子的TATA盒，使DNA弯曲，随后募集TFⅡB、TFⅡF/RNA聚合酶Ⅱ等装配前起始复合物，故TFⅡD的结合部位是TATA盒。ATG为起始密码子，GC盒由Sp1识别，PolyA为加尾信号。","《生物化学与分子生物学》第9版·RNA的生物合成·真核生物转录起始","green"],["2018N25A","蛋白质生物合成时具有 GTP酶活性的物质是",["23SrRNA","EF-G","EF-Tu","RF-2"],"C","A","生物化学",2018,"real","生物化学|酶","原核延伸因子EF-Tu与GTP","肽链延伸时EF-Tu与氨基酰-tRNA、GTP形成三元复合物并将其送入A位，EF-Tu本身具GTP酶活性，水解GTP后以EF-Tu-GDP形式释放；EF-G在转位时亦具GTP酶活性。23S rRNA是肽酰转移酶（核酶），RF-2为释放因子。本题按教材“EF-Tu为GTP结合蛋白”取C。","《生物化学与分子生物学》第9版·蛋白质的生物合成·肽链的延伸","green"],["2018N26A","在生物个体中，几乎所有细胞都表达的基因是",["管家基因","阻遏基因","可诱导基因","突变基因"],"A","A","生物化学",2018,"real","生物化学|DNA复制与修复","管家基因与奢侈基因","管家基因指几乎所有组织细胞都表达、编码维持基本生命活动所必需蛋白质（如核糖体蛋白、糖酵解酶）的基因，表达受环境因素影响较小。阻遏基因、可诱导基因属受调控的奢侈基因，突变基因不是分类概念。","《生物化学与分子生物学》第9版·基因表达调控·基因表达的特异性","green"],["2018N27A","下列可获得目的基因的方法是",["质 "男性， 65岁。三个月前出现三次无痛性血尿，近来出现腰痛及尿痛、尿频、血尿和排尿困难，有时尿 有血块。最可能的诊断是",["前列腺癌","膀胱肿癌","膀胱结石","肾癌"],"D","A","病理学",2018,"real","病理学|肿瘤","肾癌的临床表现","老年男性，有无痛性肉眼血尿（肾癌最常见初发症状），继以腰痛和血尿加重、出现血块及排尿困难，符合肾癌“血尿—腰痛—肿块”三联征的进程。膀胱癌以无痛性全程血尿为主，少见腰痛；膀胱结石有排尿中断及疼痛放射至阴茎头；前列腺癌多有排尿困难、PSA升高及骨痛。故选D。","《病理学》第9版·泌尿系统疾病·肾细胞癌","green"],["2018N61A","出现反常呼吸运动的胸部损伤是",["张力性气胸","多根多处肋骨骨折","开放性气胸","闭合性气胸"],"B","A","病理学",2018,"real","病理学|其他","连枷胸与反常呼吸","反常呼吸运动指吸气时胸部软化区向内陷、呼气时向外膨出，与正常胸廓运动方向相反，见于多根多处肋骨骨折形成的连枷胸。张力性气胸、开放性气胸、闭合性气胸主要表现为呼吸困难、气管移位、叩诊鼓音及呼吸音减弱，均不产生反常呼吸。故选B。","《外科学》第9版·胸部损伤·肋骨骨折","green"],["2018N62A","男性，65岁。患胆总管结石，手术切开胆总管探查、取石，并放置 T管引流。术后 T管造影发现仍有 0.5cm 残余结石。可经 T管瘘管取出残余结石的最短时间是",["术后2周","术后4周","术后6周","术后8周"],"C","A","外科学",2018,"real","外科学|外科总论","T管窦道形成与取残石时机","T管窦道由大网膜及周围组织包裹形成，术后2周时窦道壁尚薄弱，拔管或器械操作易致胆汁漏入腹腔引起胆汁性腹膜炎；术后4~6周窦道纤维化牢固，方可用胆道镜经瘘管取石、碎石，故最短时间为术后6周，选C。2周、4周过早，8周虽也可行但非最短，A、B、D不选。","《外科学》第9版·普通外科·胆道疾病·胆总管探查与T管引流","green"],["2018N63A","男，30 岁。上腹部钝器伤 3小时来院，曾呕吐少量鲜血，诉上腹及腰部疼痛。查体上腹压通，轻度肌紧 张，肠鸣音弱。腹部平片见右肾及腰大肌轮廓模糊。最可能的诊断是",["胃破裂","十二指肠破裂","脾脏破裂","空肠破裂"],"B","A","病理学",2018,"real","病理学|其他","腹膜后十二指肠破裂的识别","上腹部钝器伤后呕吐少量鲜血、上腹及腰部疼痛，腹部平片见右肾及腰大肌轮廓模糊，提示腹膜后积气积液，是腹膜后位十二指肠（第2、3段）破裂的典型X线表现。胃破裂多为气腹、膈下游离气体；空肠破裂位于腹腔内，表现为弥漫性腹膜炎；脾破裂以腹腔内出血、失血性休克和左季肋部压痛为主。故选B。","《外科学》第9版·腹部损伤·十二指肠损伤","green"],["2018N64A","女性， 35岁。甲状腺乳头状癌根治手术后第一天，发现饮水时有呛咳，说话音调降低。最可能的原因 是",["喉返神经损伤","喉上神经损伤","声带损伤","插管所致声门水肿"],"B","A","外科学",2018,"real","外科学|外科总论","喉上神经损伤的临床表现","术后饮水呛咳提示喉上神经内支（感觉支）损伤，声门以上喉黏膜感觉丧失、会厌反射障碍而误吸；说话音调降低提示喉上神经外支（运动支）损伤致环甲肌瘫痪、声带松弛。两者并存说明喉上神经主干受损，故B正确。喉返神经损伤为声音嘶哑、呼吸困难；声带损伤与插管后声门水肿多在拔管即出现且无呛咳，A、C、D不选。","《外科学》第9版·普通外科·甲状腺手术并发症","green"],["2018N65A","关于化脓性关节炎叙述，正确的是：",["关节液外观可为透明或浑浊黄白色","关节液培养最常见白色葡萄球菌","关节液镜检见多量革兰阴性细菌","多见于老年女性，可早期关节腔注射抗生素"],"A","A","病理学",2018,"real","病理学|炎症","化脓性关节炎关节液特点","化脓性关节炎关节液随病程由浆液性向脓性演变：早期（浆液期）可透明或微混，浆液纤维蛋白期浑浊，脓性期呈黄白色脓液，故A正确。致病菌最常见为金黄色葡萄球菌而非白色葡萄球菌；镜检多为革兰阳性球菌而非阴性菌；多见于儿童及青少年，而非老年女性。故选A。","《外科学》第9版·骨与关节化脓性感染·化脓性关节炎","green"],["2018N66A","下列膝关节检查结果与疾病的关系，错误的是",["浮髌试验 (+)：膝关节积液","前抽屉试验 (+)：后交叉韧带断裂","研磨试验 (+)：半月板损伤","麦氏试验 (+)：半月板损伤"],"B","A","病理学",2018,"real","病理学|其他","膝交叉韧带与半月板物理检查","前抽屉试验是屈膝90°时向前牵拉胫骨上端，若胫骨前移增大提示前交叉韧带断裂；后抽屉试验阳性才提示后交叉韧带断裂，故B对应关系错误，为本题答案。浮髌试验阳性提示膝关节积液；研磨试验（Apley试验）和麦氏试验（回旋挤压试验）阳性均提示半月板损伤，A、C、D对应均正确。","《外科学》第9版·运动系统慢性损伤·膝关节检查","green"],["2018N68A","患者最有可能的出血病因是",["食管贲门黏膜撕裂出血","胃溃疡伴出血","上消化道肿瘤伴出血","食管静脉曲张破裂出血"],"D","A","病理学",2018,"real","病理学|局部血液循环障碍","门脉高压侧支循环破裂出血","本题为共用题干题，题干在题库中缺失，仅从选项看为急性上消化道大出血的病因判断。肝硬化门脉高压患者突发大量呕血最可能是食管胃底静脉曲张破裂，出血量大、来势猛、易休克。贲门黏膜撕裂多有剧烈呕吐后呕血；胃溃疡出血多有慢性上腹痛史；上消化道肿瘤出血多为慢性少量、进行性贫血。答案取D。","《病理学》第9版·消化系统疾病·肝硬化","yellow"],["2018N70A","患者应考虑的主要疾病是",["肺气肿","气胸","肺栓塞","急性胸膜炎"],"B","A","病理学",2018,"real","病理学|局部血液循环障碍","气胸的体征","本题为共用题干题，题干缺失，需据选项与答案推定为自发性气胸。气胸起病突然，患侧胸痛、呼吸困难，查体患侧胸廓饱满、呼吸动度减弱、叩诊鼓音、呼吸音减弱或消失、气管向健侧移位。肺气肿为慢性进展性呼吸困难、双肺过清音；肺栓塞需有血栓来源和CTPA证据；急性胸膜炎为胸膜摩擦音、疼痛随呼吸加重。故取B。","《病理学》第9版·呼吸系统疾病·气胸","yellow"],["2018N71A","下列最能支持患者主要疾病的体征是",["气管左偏","左肺叩浊、呼吸音减弱","左肺呼吸音消失","双肺叩诊过清音"],"C","A","病理学",2018,"real","病理学|其他","气胸与肺不张的体征鉴别","本题共用题干缺失，与上一小题一致，患者主要疾病为气胸（左侧）。气胸时患侧胸膜腔内积气，肺组织压缩，听诊呼吸音明显减弱乃至消失，是最能支持的体征，故C正确。气管向患侧偏移见于肺不张、肺纤维化；叩诊浊音伴呼吸音减弱见于胸腔积液或肺实变；双肺过清音为肺气肿表现。","《病理学》第9版·呼吸系统疾病·气胸","yellow"],["2018N72A","为确诊首先选用的辅助检查是",["胸部B超","胸部X线片","胸部CT","肺动脉造影"],"B","A","病理学",2018,"real","病理学|其他","气胸的影像学检查选择","本题共用题干缺失，患者为气胸，确诊首选胸部X线片，可见患侧胸膜腔积气带、肺压缩边缘及气管移位，简便快速、敏感性高。胸部B超对气胸不敏感；胸部CT用于复杂或少量气胸、鉴别肺大疱；肺动脉造影（现为CTPA）用于肺栓塞。故选B。","《外科学》第9版·胸部损伤·气胸","yellow"],["2018N73A","患者最可能的诊断是",["慢性阻塞性肺疾病","支气管扩张症","肺结核","肺脓肿"],"B","A","病理学",2018,"real","病理学|炎症","支气管扩张症的临床病理联系","本题为共用题干题，题干被截断，从答案看应诊断为支气管扩张症。支气管扩张的典型表现为慢性咳嗽、咳大量脓痰、反复咯血，查体固定性湿啰音（多位于下肺背侧），可见杵状指，HRCT示支气管柱状或囊状扩张。COPD为持续气流受限、肺气肿体征；肺结核多有低热盗汗、上肺病灶；肺脓肿为高热、咳大量脓臭痰。","《病理学》第9版·呼吸系统疾病·支气管扩张症","yellow"],["2018N74A","为明确诊断，最有意义的检查是",["肺功能","胸部X线片","胸部HRCT","支气管镜"],"C","A","内科学",2018,"real","内科学|其他","支气管扩张的HRCT诊断","共用题干未完整录入，从后续治疗选“抗感染”推断为支气管扩张症合并感染。支气管扩张的确诊依靠胸部高分辨率CT（HRCT），可见支气管呈柱状、囊状扩张，管壁增厚，印戒征；X线胸片敏感性低，肺功能仅示阻塞性通气障碍，支气管镜不能显示扩张形态。","《内科学》第9版·呼吸系统疾病·支气管扩张症","yellow"],["2018N75A","根据诊断，目前最佳的处理方法是",["吸氧","抗感染","止血","体位引流"],"B","A","内科学",2018,"real","内科学|其他","支气管扩张急性加重治疗","支气管扩张急性加重期最常见的诱因是细菌感染（流感嗜血杆菌、铜绿假单胞菌、肺炎链球菌），治疗核心是抗感染，根据痰培养及药敏选择抗生素，兼顾覆盖铜绿假单胞菌。单纯吸氧、止血仅对症；体位引流在急性感染控制后进行，故目前最佳处理为抗感染。","《内科学》第9版·呼吸系统疾病·支气管扩张症","yellow"],["2018N76A","患者心力衰竭最可能的病因是",["扩张性心肌病","冠状动脉性心脏病","肺源性心脏病","风湿性心瓣膜病"],"A","A","内科学",2018,"real","内科学|循环系统疾病","扩张型心肌病诊断","中年男性，心界向两侧扩大、心音低钝、全心衰竭表现，超声示心腔扩大、室壁变薄、弥漫性运动减弱伴LVEF显著降低，符合扩张型心肌病。冠心病多有节段性室壁运动异常及心梗病史；肺心病有长期呼吸道疾病及右心扩大；风心病有特征性瓣膜杂音。","《内科学》第9版·循环系统疾病·扩张型心肌病","green"],["2018N77A","上述病情资料中，对判断病因诊断最有价值的检查结果是",["ECG示窦性心律，完全性左束支传导阻滞","NT-proBNP7015pg/ml","超声心动图心腔扩大、室壁薄、弥漫性运动减弱","LVEF32%"],"C","A","内科学",2018,"real","内科学|其他","超声心动图在心肌病病因诊断中的价值","病因诊断最有价值的是超声心动图：心腔扩大、室壁变薄、弥漫性运动减弱、LVEF降低是扩张型心肌病的形态学依据，并能排除瓣膜病、心包病。ECG的左束支传导阻滞、NT-proBNP升高、LVEF数值仅反映心功能受损程度，不能确定病因。","《内科学》第9版·循环系统疾病·扩张型心肌病","green"],["2018N78A","在患者目前的治疗中，不宜选用的药物是",["比索洛尔","托拉塞米","螺内酯","单硝酸异山梨酯"],"A","A","内科学",2018,"real","内科学|其他","β受体拮抗剂启动时机","患者目前有明显肺淤血（双肺底湿啰音）、LVEF 32%、心衰尚未稳定，此时不宜选用β受体拮抗剂比索洛尔——β阻滞剂应在利尿后体重恒定、血流动力学稳定（干体重）时小剂量起始，急性失代偿期加用可加重心衰。托拉塞米利尿、螺内酯拮抗醛固酮、硝酸异山梨酯扩血管均可应用。","《内科学》第9版·循环系统疾病·慢性心力衰竭","green"],["2018N79A","患者最可能诊断是",["肠结核","克罗恩病","肠易激综合症","溃疡性结肠炎"],"C","A","内科学",2018,"real","内科学|消化系统疾病","IBS的诊断（罗马Ⅳ）","反复腹痛伴排便习惯改变，无消瘦、无夜间痛醒、无报警症状，各项检查无器质性疾病，符合肠易激综合征（罗马Ⅳ标准：近3个月内反复腹痛，每周至少1天，伴排便相关或排便频率/性状改变）。肠结核多有结核中毒症状、右下腹包块；克罗恩病有瘘管、狭窄；溃疡性结肠炎为黏液脓血便。","《内科学》第9版·消化系统疾病·肠易激综合征","green"],["2018N80A","为确定诊断，最有意义的检查是",["PPD试验","腹部B超","钡剂灌肠","结肠镜"],"D","A","内科学",2018,"real","内科学|其他","IBS的排除性检查","结肠镜可直接观察全结肠黏膜并取活检，是排除炎症性肠病、肿瘤等器质性疾病、确立IBS诊断最有意义的检查。粪常规加隐血只能筛查；腹部B超对肠壁病变分辨率低；钡剂灌肠已逐步被结肠镜取代。","《内科学》第9版·消化系统疾病·肠易激综合征","green"],["2018N81A","可选择的治疗是",["口服抗结核药","口服柳氮磺胺吡啶","口服四维溴胺","口服布地奈德"],"C","A","内科学",2018,"real","内科学|其他","IBS的解痉治疗","IBS的治疗以调节肠道动力与内脏敏感性为主，匹维溴铵（题中“四维溴胺”为OCR）为肠道选择性钙拮抗剂，可缓解腹痛腹泻，是常用选择。抗结核药、柳氮磺吡啶、布地奈德分别为肠结核、IBD的治疗，本例无指征。","《内科学》第9版·消化系统疾病·肠易激综合征","green"],["2018N82A","患者最可能的诊断是",["急性膀胱炎","急性肾盂肾炎","慢性肾盂肾炎","尿道综合征"],"A","A","内科学",2018,"real","内科学|泌尿系统疾病","膀胱炎与肾盂肾炎鉴别","尿频、尿急、尿痛伴下腹不适，无发热、无腰痛及肾区叩痛，尿检白细胞增多，符合急性膀胱炎。急性肾盂肾炎有发热、寒战、腰痛、肾区叩痛；慢性肾盂肾炎有反复发作及影像学改变；尿道综合征尿检无异常。","《内科学》第9版·泌尿系统疾病·尿路感染","green"],["2018N83A","下列尿检查的结果支持诊断的是",["可见白细胞管型","尿乙酰 -β-D-氨基葡萄糖苷酶（ NAG）升高","清洁中段尿培养有大肠埃希菌","尿比重和渗透压下降"],"C","A","内科学",2018,"real","内科学|其他","尿培养的诊断价值","尿路感染诊断以真性细菌尿为核心，清洁中段尿培养出大肠埃希菌（菌落计数≥10⁵/ml）即支持诊断。白细胞管型提示上尿路感染（肾盂肾炎）；NAG升高提示肾小管损伤；尿比重和渗透压下降见于慢性肾小管功能受损，均非膀胱炎的支持依据。","《内科学》第9版·泌尿系统疾病·尿路感染","green"],["2018N84A","此时最主要的处理是",["对症治疗及多饮水","单剂量抗生素疗法","短疗程抗生素疗法","10-14天抗生素疗法"],"C","A","内科学",2018,"real","内科学|其他","单纯性膀胱炎的短程治疗","非妊娠、无复杂因素的急性单纯性膀胱炎推荐短程疗法：首选3天口服抗生素（磷霉素氨丁三醇单剂或喹诺酮类3天），疗效与7天相当而不良反应少。单剂量疗法复发率高；10～14天疗程适用于肾盂肾炎；仅多饮水对症不足。","《内科学》第9版·泌尿系统疾病·尿路感染","green"],["2018N85A","该患者应首选的紧急治疗不包括",["静滴地塞米松","静滴长春新碱","静滴免疫球蛋白","血小板成分输注"],"B","A","内科学",2018,"real","内科学|其他","ITP紧急治疗措施","ITP患者血小板极低伴出血，紧急治疗包括糖皮质激素（地塞米松/甲泼尼龙）、静脉输注丙种球蛋白、血小板输注（危及生命的出血时），长春新碱为免疫抑制剂，起效需数周，不属紧急措施。故不包括静滴长春新碱。","《内科学》第9版·血液系统疾病·免疫性血小板减少症","green"],["2018N86A","目前的临床症状中，提示该患者颅内出血风险最大的表现是",["四肢皮肤的出血点","牙龈出血","口腔颊黏膜血疱","间断鼻出血"],"C","A","内科学",2018,"real","内科学|其他","ITP出血危险的判断","口腔颊黏膜血疱提示黏膜下严重出血、血小板常低于10×10⁹/L，是颅内出血（尤其是口腔血疱伴头痛、呕吐）的高危信号，须立即输注血小板并强化治疗。皮肤出血点、牙龈出血、间断鼻出血属轻中度皮肤黏膜出血，危险性相对低。","《内科学》第9版·血液系统疾病·免疫性血小板减少症","green"],["2018N87A","下列实验室检查结果支持该诊断的是",["血白细胞减少，血红蛋白正常","抗核抗体阳性，抗磷脂抗体阳性","凝血时间延长，血块收缩良好","骨髓巨核细胞增多，产板型减少"],"D","A","内科学",2018,"real","内科学|其他","ITP的骨髓象","ITP骨髓象特点为巨核细胞数正常或增多，但成熟产板型巨核细胞减少（成熟障碍），故D支持诊断。白细胞减少、血红蛋白正常不能提示ITP；ANA、抗磷脂抗体阳性提示SLE等继发免疫性血小板减少；凝血时间延长属凝血因子缺陷（如DIC、血友病），而ITP凝血功能正常、血块收缩不良。","《内科学》第9版·血液系统疾病·免疫性血小板减少症","green"],["2018N88A","患者最可能的诊断是",["原发性高血压","原发性醛固酮增高症","嗜铬细胞瘤","肾动脉狭窄"],"C","A","内科学",2018,"real","内科学|循环系统疾病","嗜铬细胞瘤的临床三联征","阵发性高血压伴头痛、心悸、多汗三联征，发作时血压骤升、心率快，发作后可有体位性低血压，符合嗜铬细胞瘤。原发性高血压血压平稳升高；原醛为持续性高血压伴低血钾、肌无力；肾动脉狭窄多为难治性高血压伴腹部血管杂音、肾功能异常。","《内科学》第9版·内分泌与代谢疾病·嗜铬细胞瘤","green"],["2018N89A","对患者确诊最有价值的检查是",["超声心动图","肾及肾上腺 CT","肾动脉 B超","腹部X线片"],"B","A","内科学",2018,"real","内科学|其他","嗜铬细胞瘤的定位诊断","嗜铬细胞瘤约90%位于肾上腺髓质，肾上腺CT（或MRI）为定位诊断首选，可显示肿瘤大小、位置及与周围结构关系；结合血/尿甲氧基肾上腺素类物质（MN、NMN）升高可确诊。超声心动图、肾动脉B超、腹部平片均不能定位肾上腺肿瘤。","《内科学》第9版·内分泌与代谢疾病·嗜铬细胞瘤","green"],["2018N90A","患者因疾病而明显烦躁、焦虑，测血压 200/108mmHg ，心率 108次/分。应首选的治疗药物是",["β受体拮抗剂","α受体拮抗剂","醛固酮受体拮抗剂","血管紧张素转换酶抑制剂"],"B","A","内科学",2018,"real","内科学|其他","嗜铬细胞瘤危象的处理","嗜铬细胞瘤血压骤升时首先应阻断α受体（酚妥拉明静注或口服哌唑嗪/多沙唑嗪），控制血压并扩容后再考虑β受体拮抗剂，且β阻滞必须先α后β，否则α缩血管作用失去对抗可致血压更高、肺水肿。ACEI、醛固酮拮抗剂对儿茶酚胺危象无效。","《内科学》第9版·内分泌与代谢疾病·嗜铬细胞瘤","green"],["2018N91A","该患者最可能的诊断是",["再生障碍性贫血","贝赫切特（ Behcet）病","系统性红斑狼疮","急性肾小球肾炎"],"C","A","内科学",2018,"real","内科学|泌尿系统疾病","SLE的临床诊断","育龄女性出现发热、关节痛、皮疹、多浆膜腔积液、蛋白尿及血细胞减少等多系统损害，符合系统性红斑狼疮；抗核抗体、抗dsDNA、抗Sm抗体阳性可确诊。再生障碍性贫血为全血细胞减少无皮疹关节症状；贝赫切特病以口腔、生殖器溃疡及眼炎为特点；急性肾炎无多系统表现。","《内科学》第9版·风湿性疾病·系统性红斑狼疮","green"],["2018N92A","为明确诊断，查体中还应特别注意检查的是",["颜面部水肿","盘状红斑","结节状红斑","牙龈渗血"],"B","A","内科学",2018,"real","内科学|其他","SLE的皮肤黏膜表现","SLE特征性皮肤表现为盘状红斑（面部、头皮边界清楚的红斑伴毛囊角栓、萎缩），查体应特别注意，配合颧部蝶形红斑可支持诊断。颜面部水肿提示肾炎或低蛋白；结节状红斑见于贝赫切特病、结节病；牙龈渗血提示血小板减少或白血病。","《内科学》第9版·风湿性疾病·系统性红斑狼疮","green"],["2018N93A","最可能的诊断是：",["原发性甲亢","单纯性甲状腺肿","继发性甲亢","桥本甲状腺炎"],"C","A","内科学",2018,"real","内科学|内分泌与代谢","原发性与继发性甲亢鉴别","继发性甲亢（毒性多结节性甲状腺肿或毒性腺瘤）多发生于结节性甲状腺肿基础上，甲状腺呈结节状不对称肿大，无突眼及胫前黏液性水肿，TSH降低而TRAb阴性。原发性甲亢（Graves）为弥漫性肿大伴突眼、TRAb阳性；单纯性甲状腺肿甲功正常；桥本甲状腺炎多为甲减、TPOAb强阳性。","《内科学》第9版·内分泌与代谢疾病·甲状腺功能亢进症","green"],["2018N94A","确诊的主要根据是",["颈部CT","血清T3、T4、TSH值","甲状腺 B超","颈部MRI"],"B","A","内科学",2018,"real","内科学|其他","甲亢的实验室确诊","甲亢确诊依据是血清甲状腺功能：FT₃、FT₄升高伴TSH降低（亚临床甲亢仅TSH降低），再结合TRAb、甲状腺摄碘率及影像判断病因。颈部CT、甲状腺B超、MRI只能显示腺体形态、结节与血供，不能确定功能状态。","《内科学》第9版·内分泌与代谢疾病·甲状腺功能亢进症","green"],["2018N95A","首选的根治性治疗方法",["抗甲状腺药物治疗","甲状腺大部切除术","甲状腺全切术","同位素治疗"],"B","A","内科学",2018,"real","内科学|其他","继发性甲亢的手术指征","继发性甲亢（毒性结节性甲状腺肿/腺瘤）对药物和放射性碘反应差，且结节有恶变可能，首选根治性治疗为甲状腺大部切除术，疗效确切、复发率低。抗甲状腺药物仅作术前准备；全切术易致永久性甲减；同位素治疗对较大结节效果不佳。","《外科学》第9版·甲状腺疾病·甲状腺功能亢进的外科治疗","green"],["2018N96A","最佳治疗方案是",["局部无水酒精注射","局部放射治疗","选择性肝动脉栓塞","全身化疗"],"C","A","内科学",2018,"real","内科学|其他","肝癌的TACE治疗","该肝癌患者肿瘤体积大、肝功能差但无远处转移，属不能一期切除，最佳方案为选择性肝动脉插管化疗栓塞（TACE），可使肿瘤坏死缩小、部分患者获得降期手术机会。局部无水酒精注射适用于≤3cm小肝癌；放疗、全身化疗对肝癌效果有限。","《内科学》第9版·消化系统疾病·原发性肝癌","green"],["2018N97A","经治疗三个月后，肿瘤缩小为 5×6cm，肝功能改善，无远处转移。此时最适合的治疗是",["手术切除","射频消融治疗","介入治疗","化疗"],"A","A","内科学",2018,"real","内科学|其他","肝癌降期后手术切除","经TACE后肿瘤由大块缩小至5×6cm、肝功能改善、无远处转移，属降期成功，此时最适合争取根治性手术切除（或局部消融），可显著延长生存。继续介入、化疗不能根治，射频消融对>5cm病灶完全消融率低。","《内科学》第9版·消化系统疾病·原发性肝癌","green"],["2018N98A","首选的治疗措施是",["手术清除坏死组织并引流","穿刺置管引流积液","胰腺体尾部切除术","全身支持保守治疗"],"D","A","内科学",2018,"real","内科学|其他","急性胰腺炎早期液体治疗策略","急性胰腺炎早期（1～2周内）的胰周积液多为急性液体积聚，尚未形成成熟包裹，无感染证据时首选全身支持保守治疗（禁食、补液、抑酸抑酶、镇痛、营养支持）。此时手术清创引流会显著增加死亡率；穿刺置管引流适用于感染性坏死；胰腺体尾切除用于局限坏死感染且延期。","《内科学》第9版·消化系统疾病·急性胰腺炎","green"],["2018N99A","对判断患者的预后最有价值的化验结果是",["血清淀粉酶升高 3倍以上","血清钙降至","早期血糖升高","血清脂肪酶升高"],"B","A","内科学",2018,"real","内科学|其他","血钙与急性胰腺炎预后","血清钙降低程度是判断急性胰腺炎严重程度与预后最有价值的指标：脂肪坏死皂化消耗钙，血钙<2.0mmol/L提示重症坏死性胰腺炎、预后差。血淀粉酶升高幅度与病情轻重不平行；早期血糖升高、脂肪酶升高亦不能独立判定预后（Ranson标准中的血糖仅>11.1mmol/L为一项）。","《内科学》第9版·消化系统疾病·急性胰腺炎","green"],["2018N100A","一般拔除 T管时间是",["术后2周","术后4周","术后6周","术后8周"],"A","A","内科学",2018,"real","内科学|其他","T管拔除时间","胆总管探查T管引流后，一般于术后2周左右拔管，此时窦道初步形成；拔管前须经T管造影确认胆道通畅、无残余结石及下端梗阻，并夹管观察1～2天无不适。若合并胆道狭窄、残余结石或营养状况差者应延长至4周以上。","《外科学》第9版·胆道疾病·胆总管探查T管引流","green"],["2018N101A","拔除 T管前经 T管胆道造影，结果如下图。此图显示的征像是",["正常胆道造影","胆总管残余结石","壶腹部狭窄","左肝管显影不良"],"D","A","内科学",2018,"real","内科学|其他","T管胆道造影图像判读","T管造影示左肝管未显影或显影不良（题中图示），提示左肝管可能存在结石梗阻、狭窄或注入造影剂压力不足/导管位置偏右，需进一步评价。胆总管残余结石表现为充盈缺损，壶腹部狭窄表现为下端鸟嘴样、造影剂排空延迟，均与图示不符。","《外科学》第9版·胆道疾病·胆道造影","green"],["2018N102A","根据上述造影结果，下一步的处理应是",["常规拔除 T管","经T管窦道胆管镜取出结石","经Wipple手术","肝脏CT检查"],"D","A","内科学",2018,"real","内科学|其他","胆道异常的进一步评估","左肝管显影不良原因不明，需先行肝脏CT（或MRCP）评估左肝管有无结石、狭窄及肝内胆管扩张程度，再决定是否经T管窦道胆管镜取石或再次手术；在明确解剖与病因前不应草率拔管。","《外科学》第9版·胆道疾病·胆道疾病影像诊断","green"],["2018N103A","根据患者情况，首先应该考虑",["脊柱损伤合并骨盆骨折","脊柱损伤合并脊髓损伤","脊柱损伤合并双下肢骨折","胸部损伤合并骨盆骨折"],"B","A","内科学",2018,"real","内科学|其他","脊柱骨折合并脊髓损伤的判断","高处坠落或交通伤后出现脊柱骨折伴双下肢运动、感觉及括约肌功能障碍，应考虑脊柱损伤合并脊髓损伤，是决定预后与处理方式的关键。单纯骨盆骨折、下肢骨折不能解释神经功能缺损；胸部损伤不引起截瘫。","《外科学》第9版·脊柱脊髓损伤·脊髓损伤","green"],["2018N104A","对诊断最有价值的检查是",["脊髓造影","MRI检查","X线检查","脑脊液穿刺检查"],"B","A","内科学",2018,"real","内科学|其他","脊髓损伤的MRI评估","MRI能清晰显示脊髓水肿、出血、受压及韧带、椎间盘损伤，是评估脊髓损伤最有价值的检查；同时可判断脊髓损伤程度与预后。X线仅看骨性结构；CT看骨块与椎管占位优于X线但不能显示脊髓实质；脊髓造影有创且已少用。","《外科学》第9版·脊柱脊髓损伤·影像学检查","green"],["2018N105A","现场对该患者正确搬运方法是",["一人用一手抱颈，另一手抱脚放于担架上","一人抬头，另一人抬足放于木板上","两人架其上肢拉到担架上","两人将躯干保持平直状态成一体平移至木板上"],"D","A","内科学",2018,"real","内科学|其他","脊柱损伤的搬运方法","疑脊柱损伤者搬运时必须保持躯干轴线平直，由2～3人协同将患者整体平移至硬板担架上，头颈两侧加固定，避免屈曲、扭转造成脊髓继发损伤。抱颈抱脚、抬头抬足、架腋拖拉均会造成脊柱屈伸与扭转，属禁忌。","《外科学》第9版·脊柱脊髓损伤·现场急救与搬运","green"],["2018N106A","最可能的诊断是",["脊柱肿瘤","强直性脊柱炎","脊柱结核","化脓性脊柱炎"],"C","A","内科学",2018,"real","内科学|风湿免疫","脊柱结核的诊断与鉴别","缓慢起病的背痛、低热盗汗、消瘦，脊柱后凸畸形、局部压痛伴椎旁肌痉挛，血沉增快，影像示椎体破坏伴椎间隙变窄及椎旁脓肿，符合脊柱结核。强直性脊柱炎多见于青年男性、以骶髂关节炎起病、HLA-B27阳性；化脓性脊柱炎起病急、高热、破坏进展快；脊柱肿瘤以溶骨破坏、椎弓根破坏为主而椎间隙保留。","《外科学》第9版·骨与关节结核·脊柱结核","green"],["2018N107A","最具有诊断价值的检查是",["MRI","X 线片","CT","结核菌素试验"],"A","A","内科学",2018,"real","内科学|其他","脊柱结核的MRI诊断","MRI对脊柱结核早期诊断价值最高：可显示椎体骨髓水肿、椎间盘受累、椎管内或椎旁脓肿及脊髓受压，早于X线和CT发现病变，并可指导手术。X线需骨质破坏达30%以上才显影；CT对软组织脓肿与脊髓受压评价较差；结核菌素试验仅为辅助。","《外科学》第9版·骨与关节结核·影像学检查","green"],["2018N108A","“医学宪章：新千年的医师专业精神 ”提出了三项基本原则和十项专业责任。以下属于三项基本原则内 容的是",["将患者利益放在首位","对患者诚实","为患者保守秘密","提高医学质量"],"A","A","内科学",2018,"real","内科学|其他","医师宪章三项基本原则","《医学宪章：新千年的医师专业精神》提出三项基本原则：将患者利益放在首位的原则、患者自主的原则、社会公正的原则。对患者诚实、为患者保守秘密、提高医学质量均属十项专业责任，故A属基本原则。","《医学伦理学》·医学专业精神·医师宪章","green"],["2018N109A","某医院向患者承诺： “静脉输液穿刺一次成功，做不到当场还患者输液费 5元”此举动引起了社会热议。 该医院把医患关系错误的理解为",["技术关系","消费关系","责权关系","信托关系"],"B","A","人文",2018,"real","人文|医患沟通","医患关系的消费化误区","承诺「静脉穿刺一次不成功就退还输液费」，是把医疗服务当作可按商品质量退赔的买卖，用赔付条款换取服务结果，实质把医患关系简化为消费关系。医患关系的本质是信托关系，同时包含技术关系与责权关系，不能用等价交换与违约赔偿衡量；穿刺成功率还受血管条件等不可控因素影响。故选B。","《医学伦理学》第9版·医疗人际关系伦理·医患关系的性质","green"],["2018N110A","男， 43岁，需要被做手术。进入手术室前，执意要给主刀医生红包。被医生多次拒绝后，依旧执意 要给，否则拒绝手术。此时医生的最佳做法是",["收取红包，归自己所有","实在推脱不掉，收下红包上交，手术后归还给病人","收取红包，作为科室经费","执意拒绝红包，如果病人非要给，就拒绝手术"],"B","A","外科学",2018,"real","外科学|外科总论","红包的处理方式","患者执意送红包并以之为手术条件，医生应先反复解释拒收规定；若实在无法推脱，可暂收并按规定登记上交医院相关部门，术后由院方退还，既不延误救治又不违背廉洁行医，故B最佳。A据为己有、C充作科室经费均属违纪违法；D以拒收为由拒绝手术违背救死扶伤义务，可能构成拒诊。","《医学伦理学》·医德规范·廉洁行医与红包处理","green"],["2018N111A","下列属于医生的义务的是",["开展科学研究","保障自身安全","使用医疗设备","妥善保管病历"],"D","A","内科学",2018,"real","内科学|其他","医师的义务","妥善保管病历是医师的法定义务，《医师法》《医疗机构病历管理规定》要求客观、真实、完整、及时书写并保存病历，不得隐匿、伪造、销毁。开展科学研究是权利而非义务；保障自身安全、使用医疗设备并非医师对患者的义务内容。","《卫生法规》·执业医师法·医师的义务","green"],["2018N112A","男性， 78岁。因脑梗死昏迷被家属送至医院救治，治疗多日仍意识不清，家属要求放弃治疗。针对 家属的要求，医生应该首要考虑的因素是",["患者的社会地位","患者家属的意愿","患者的经济条件","患者的病情状况"],"D","A","内科学",2018,"real","内科学|神经系统","放弃治疗的伦理决策","家属要求放弃治疗时，医师首要考虑的是患者病情状况（有无救治希望、是否为终末期、放弃治疗是否符合患者最佳利益），并结合患者本人预嘱；社会地位、经济条件不能作为决定依据，家属意愿须在不违背患者利益与法律的前提下考量。","《医学伦理学》·临终关怀与放弃治疗·伦理决策依据","green"],["2018N113A","男性， 45岁。艾滋病病毒抗体检测为阳性，要求医生为其保密。医生下列哪种行为会受到伦理辩护",["将检测结果报告给患者单位的领导","将检测结果告知前来问询的患者父亲","将检测结果报告给疾控预防控制中心","将检测结果告知前来询问的患者投保公司职员"],"C","A","人文",2018,"real","人文|医学伦理","传染病报告的保密例外","艾滋病属法定报告传染病，医生须按规定向疾病预防控制机构报告，属保密义务的法定例外，可获伦理辩护。而向单位领导、前来询问的父亲及保险公司透露，既超出法定报告范围与必要限度，又可能造成歧视、就业与保险方面的损害，不能获伦理辩护。故选C。","《医学伦理学》第9版·临床诊疗伦理·保密义务及其例外","green"],["2018N114A","在以患者作为受试者的临床试验中，从伦理视角看，下列表述正确的是",["只有能够使受试者个人收益的临床试验才可以得到伦理辩护","既能够使受试者个人受益也能够使社会受益的临床试验才可以得到伦理辩护","只有在发展医学知识与不伤害受试者之间做出最佳平衡，对受试者可能造成的风险是最低的临床试验， 才可以得到伦理辩护","为了科学知识的增长和未来患者健康利益，对少数受试者的伤害是医学发展所必须的，可以得到伦理 辩护"],"C","A","人文",2018,"real","人文|医学伦理","风险最小化与风险收益比","涉及人的临床试验要获伦理辩护，须将发展医学知识与不伤害受试者相权衡，使受试者承担的风险最小化、风险与预期收益比合理，并有知情同意、伦理审查、随时退出等保障。A、B把受试者个人受益或社会受益当作唯一或必备理由，D以科学进步为名允许伤害少数人，都违背不伤害与尊重原则。故选C。","《医学伦理学》第9版·医学科研伦理·临床试验的伦理辩护","green"],["2018N115A","某患者家属，来医院找骨科医生，诉其家属因右踝部扭伤不能上班，请求开具假条。医生要求患者前 来就诊，家属述其行动不便，来医院有困难。根据《执业医师法》相关规定，医生做法正确的是 A.未亲自诊治患者，不予开具假条",["B、C、D是其下两道小题的备选项，请从中选择一 项最符合题目要求的，每个选项可以被选择一次或两次。 A.维拉帕米 B.美托洛尔 C.卡托普利 D.氯沙坦","考虑患者行动不便，予开具假条","考虑患者家属带其来医院有困难，予开假条","落实简化就医流程，予开具假条 二、B型题： 116-135小题，每小题"],"A","A","人文",2018,"real","人文|卫生法规","医师亲自诊查与出具医学证明的义务","执业医师法规定，医师实施医疗、预防、保健措施，签署诊断、治疗、流行病学等医学证明文件，必须亲自诊查、调查。未见到患者本人即开具病假证明，属未经诊查出具医学证明，可能掩盖病情、被用于骗取休假，医生应予拒绝并说明可由家属陪诊、上门诊查等途径解决。故选A。","《中华人民共和国执业医师法》·执业规则","green"],["2018N116B","属于血管紧张素转化酶抑制剂的是",["维拉帕米","美托洛尔","卡托普利","氯沙坦"],"C","B","生物化学",2018,"real","生物化学|酶","ACEI与ARB的分类","卡托普利含巯基，抑制血管紧张素转化酶（ACE），减少血管紧张素Ⅱ生成并减少缓激肽降解，属ACEI。维拉帕米为钙通道阻滞剂，美托洛尔为β1受体拮抗剂，氯沙坦为血管紧张素Ⅱ受体拮抗剂（ARB）。","《药理学》第9版·抗高血压药","green"],["2018N117B","属于血管紧张素 II受体拮抗剂的是",["维拉帕米","美托洛尔","卡托普利","氯沙坦"],"D","B","外科学",2018,"real","外科学|其他","ARB与ACEI的区分","氯沙坦为血管紧张素Ⅱ的AT1受体拮抗剂（ARB），阻断AngⅡ与AT1结合，减少血管收缩与醛固酮分泌，选D。维拉帕米为非二氢吡啶类钙通道阻滞剂；美托洛尔为β1受体阻滞剂；卡托普利为血管紧张素转换酶抑制剂，作用于AngⅡ生成环节而非受体，A、B、C不选。","《药理学》第9版·抗高血压药","green"],["2018N118B","能改善帕金森病运动减少症状的药物是",["利血平","哌唑嗪","育亨宾","左旋多巴"],"D","B","内科学",2018,"real","内科学|神经系统","左旋多巴的作用","左旋多巴为多巴胺前体，透过血脑屏障后经脱羧生成多巴胺，补充纹状体递质不足，对运动减少、肌强直改善最显著，是帕金森病最基本有效的药物。利血平耗竭囊泡内单胺（可致帕金森综合征）；哌唑嗪为α₁阻滞剂；育亨宾为α₂拮抗剂，均无治疗作用。","《内科学》第9版·神经系统疾病·帕金森病","green"],["2018N119B","能改善舞蹈病运动增多症状的药物是",["利血平","哌唑嗪","育亨宾","左旋多巴"],"A","B","外科学",2018,"real","外科学|其他","利血平耗竭单胺","亨廷顿舞蹈病的运动增多与纹状体多巴胺能活动相对增强有关。利血平耗竭神经末梢囊泡内的单胺（包括多巴胺），可减轻舞蹈样不自主动作，故选A。哌唑嗪为α1受体阻滞剂、育亨宾为α2受体阻滞剂，与本病无关；左旋多巴为多巴胺前体，反而加重舞蹈症状，B、C、D不选。","《药理学》第9版·抗帕金森病药与抗精神失常药","green"],["2018N120B","蛋白质生物合成后经修饰形成的氨基酸是",["羟脯氨酸","苏氨酸","硒代半胱氨酸","亮氨酸"],"A","B","生物化学",2018,"real","生物化学|蛋白质的结构与功能","胶原蛋白的羟化修饰","羟脯氨酸没有对应的遗传密码子，是胶原蛋白合成过程中脯氨酸残基经脯氨酰羟化酶（需维生素C、Fe2+）羟化后形成的翻译后修饰产物。苏氨酸、亮氨酸是原编码氨基酸，硒代半胱氨酸虽可经UGA密码子掺入，但属特殊掺入而非本题所问的修饰形成。","《生物化学与分子生物学》第9版·蛋白质的结构与功能·蛋白质的翻译后修饰","green"],["2018N121B","可以被磷酸化修饰的氨基酸是",["羟脯氨酸","苏氨酸","硒代半胱氨酸","亮氨酸"],"B","B","生物化学",2018,"real","生物化学|蛋白质的结构与功能","磷酸化修饰的氨基酸位点","蛋白质磷酸化由蛋白激酶催化，磷酸基连接在含羟基的丝氨酸、苏氨酸、酪氨酸残基侧链上，因此苏氨酸可被磷酸化修饰。羟脯氨酸的羟基在胶原中已羟化、一般不再磷酸化，亮氨酸、硒代半胱氨酸侧链无羟基，不能接受磷酸基。","《生物化学与分子生物学》第9版·酶·酶的调节","green"],["2018N122B","参与合成多肽链正确折叠的蛋白质是",["泛素","热激（休克）蛋白","逆转录酶","蛋白激酶"],"B","B","外科学",2018,"real","外科学|外科总论","分子伴侣促折叠功能","热激（休克）蛋白作为分子伴侣，识别新生多肽链或部分折叠蛋白暴露的疏水区，防止其聚集并协助正确折叠、跨膜转运，故选B。泛素的功能是标记待降解蛋白；逆转录酶以RNA为模板合成cDNA；蛋白激酶催化蛋白磷酸化传递信号，均无促折叠作用，A、C、D不选。","《生物化学与分子生物学》第9版·蛋白质的生物合成","green"],["2018N123B","可作为信号传递分子开关的蛋白质是",["泛素","热激（休克）蛋白","逆转录酶","蛋白激酶"],"D","B","外科学",2018,"real","外科学|外科总论","信号转导中的分子开关","蛋白激酶催化靶蛋白丝氨酸、苏氨酸或酪氨酸残基磷酸化，使其构象与活性发生改变，在信号转导中充当分子开关（如PKA、PKC、受体酪氨酸激酶），故选D。泛素参与蛋白降解标记；热激蛋白为分子伴侣；逆转录酶参与逆转录过程，均不属信号开关分子，A、B、C不选。","《生物化学与分子生物学》第9版·细胞信号转导","green"],["2018N124B","主要根据细胞核形态确诊的甲状腺癌是",["乳头状癌","滤泡状癌","髓样癌","肉瘤样癌"],"A","B","外科学",2018,"real","外科学|普通外科","甲状腺乳头状癌的核特征","甲状腺乳头状癌的确诊主要依据细胞核形态：核淡染呈毛玻璃样、核内假包涵体、核沟与核重叠，故选A。滤泡状癌的滤泡细胞形态与正常滤泡相似，须靠包膜与血管侵犯等生物学行为判断；髓样癌需靠C细胞来源、降钙素阳性及淀粉样间质识别；肉瘤样癌以明显异型与梭形细胞为特点，B、C、D不选。","《病理学》第9版·内分泌系统疾病·甲状腺癌","green"],["2018N125B","主要根据细胞生物学行为确诊的甲状腺癌是",["乳头状癌","滤泡状癌","髓样癌","肉瘤样癌"],"B","B","外科学",2018,"real","外科学|普通外科","滤泡状癌的生物学行为诊断","甲状腺滤泡状癌的瘤细胞形态与正常甲状腺滤泡高度相似，核无毛玻璃样、核沟等特征，确诊依赖其生物学行为：肿瘤穿透包膜、侵犯包膜血管或形成血管内瘤栓，故选B。乳头状癌靠核形态即可诊断；髓样癌靠降钙素与淀粉样间质；肉瘤样癌以显著异型细胞为特点，A、C、D不选。","《病理学》第9版·内分泌系统疾病·甲状腺癌","green"],["2018N126B","构成伤寒肉芽肿的主要细胞是",["巨噬细胞","淋巴细胞","多核巨细胞","浆细胞"],"A","B","病理学",2018,"real","病理学|炎症","伤寒小结的细胞组成","伤寒肉芽肿（伤寒小结）由巨噬细胞吞噬伤寒杆菌、红细胞、淋巴细胞及细胞碎片后转变为伤寒细胞，并聚集形成，因此构成的主体细胞是巨噬细胞，选A。淋巴细胞虽在病灶周边浸润但不构成主体；伤寒小结内一般无多核巨细胞（此点与结核结节不同）；浆细胞主要见于梅毒树胶肿等，故B、C、D均不选。","《病理学》第9版·炎症·肉芽肿性炎","green"],["2018N127B","构成梅毒肉芽肿的主要细胞是",["巨噬细胞","淋巴细胞","多核巨细胞","浆细胞"],"D","B","病理学",2018,"real","病理学|炎症","梅毒树胶肿的组织学特点","梅毒肉芽肿即树胶肿，镜下中央为凝固性坏死（树胶样），周围有类上皮细胞、Langhans巨细胞和淋巴细胞，但浆细胞恒定存在且数量众多，并伴小血管内皮细胞肿胀增生（闭塞性动脉内膜炎），故构成的主要细胞是浆细胞，选D。巨噬细胞、多核巨细胞虽也参与，但不是标志性主体；淋巴细胞在结核结节中更突出。故与上一小题区分。","《病理学》第9版·炎症·肉芽肿性炎","green"],["2018N128B","请判读下列心电图并做出判断",["窦性心动过速","阵发性室上性心动过速","心房扑动","心房颤动"],"C","B","外科学",2018,"real","外科学|其他","心房扑动心电图特征","心房扑动的心电图特征为P波消失，代之以规律、连续、锯齿状的扑动波（F波），频率约250~350次/分，等电位线消失，心室率因房室传导比例（多为2:1或3:1）而规则或成比例变化，据此判为心房扑动，选C。窦速有正常P波；室上速多突发突止、P波埋于QRS内；房颤f波大小不等、心室律绝对不齐，A、B、D不符。⚠️原题配图形，此处按答案说明其判读依据。","《诊断学》第9版·心电图·心房扑动","yellow"],["2018N129B","请判读下列心电图并做出判断",["窦性心动过速","阵发性室上性心动过速","心房扑动","心房颤动"],"B","B","外科学",2018,"real","外科学|其他","室上速心电图特征","阵发性室上性心动过速表现为突发突止，心率150~250次/分、节律规则，QRS波群形态正常（窄），P波常埋藏于QRS波中或呈逆行，据此判为室上速，选B。窦速心率多<150次/分且有明确窦性P波；房扑呈锯齿状F波；房颤心室律绝对不规则且无P波，A、C、D不符。⚠️原题配图形，按答案说明判读依据。","《诊断学》第9版·心电图·阵发性室上性心动过速","yellow"],["2018N130B","有机磷中毒时，患者的呼吸气味是",["烂苹果味","苦杏仁味","蒜臭味","腥臭味"],"C","B","外科学",2018,"real","外科学|其他","中毒患者呼气的特殊气味","有机磷杀虫药多为挥发性液体，中毒者呼气、呕吐物及污染衣物可闻及特征性蒜臭味，故选C。烂苹果味见于糖尿病酮症酸中毒；苦杏仁味见于氰化物中毒；腥臭味见于肝性脑病的肝臭或呼吸道厌氧菌感染，A、B、D不选。","《内科学》第9版·理化因素所致疾病·有机磷杀虫药中毒","green"],["2018N131B","氰化物中毒时，患者的呼吸气味是",["烂苹果味","苦杏仁味","蒜臭味","腥臭味"],"B","B","外科学",2018,"real","外科学|其他","氰化物中毒的临床特征","氰化物抑制细胞色素氧化酶，使组织不能利用氧，动脉血氧分压正常而静脉血呈鲜红色，呼气与口腔可闻及苦杏仁味，故选B。烂苹果味为酮症；蒜臭味为有机磷、磷化锌中毒；腥臭味见于肝臭，A、C、D不选。","《内科学》第9版·理化因素所致疾病·氰化物中毒","green"],["2018N132B","患者术后一般能存活 15年以上得肿瘤是：",["胰腺导管腺癌","结肠癌","甲状腺乳头状癌","胃癌"],"C","B","外科学",2018,"real","外科学|普通外科","常见肿瘤预后比较","甲状腺乳头状癌分化好、生长缓慢，属低度恶性肿瘤，规范手术加内分泌抑制治疗后10年生存率可达90%以上，多数患者可存活15年以上，故选C。胰腺导管腺癌5年生存率不足10%；进展期胃癌5年生存率约30%~50%；结肠癌根治术后约60%~70%，均难以普遍达到15年存活，A、B、D不选。","《外科学》第9版·普通外科·甲状腺癌·预后","green"],["2018N133B","患者术后很少存活5年的肿瘤是：",["胰腺导管腺癌","结肠癌","甲状腺乳头状癌","胃癌"],"A","B","外科学",2018,"real","外科学|普通外科","胰腺癌预后极差","胰腺导管腺癌起病隐匿，确诊时多已侵犯肠系膜上血管或发生肝转移，根治性切除率仅约20%，5年生存率不足10%，是预后最差的消化道恶性肿瘤，故选A。结肠癌根治术后5年生存率约60%~70%；甲状腺乳头状癌预后优异；早期胃癌根治后5年生存率>90%，B、C、D均不符合很少存活5年的表述。","《外科学》第9版·普通外科·胰腺癌·预后","green"],["2018N134B","男性， 82岁。粪便带血及黏液 1月。1周前结肠镜发现距肛缘 15cm处环周肿物，镜身不能进入，取 活检。病例报告：中分化腺癌。 3天前腹胀、腹痛，停止排便排气，诊断肠梗阻。应选择的手术方式是：",["Mile术","Dixon术","Hartmann 术","Parks 术"],"C","B","外科学",2018,"real","外科学|普通外科","梗阻性直肠癌的Hartmann手术","82岁高龄，直肠上段（距肛缘15cm）环周腺癌已并发完全性梗阻，肠管扩张水肿、近端积粪，一期切除吻合的吻合口瘘风险高，宜行经腹直肠切除、近端乙状结肠造口、远端直肠封闭（Hartmann术），二期还纳，故选C。Dixon术要求良好肠道准备与一期吻合，梗阻状态下不宜；Miles术适用于距肛缘<5cm的下段癌；Parks术需结肠肛管吻合，同样不宜在急性梗阻时施行。","《外科学》第9版·普通外科·结直肠癌·梗阻时的术式选择","green"],["2018N135B","男性， 58岁。脓血便 2周。肛门指诊距肛缘 4cm触及肿物，质硬，不活动，占据左侧大半周，上界未 触及，指套有血渍。拟诊直肠癌。应选择的手术方法是： 三、X型题： 136-165小题，每小题 2分，共 60分。在每小题给出的 A、B、C、D四个选项中，至少有两项 是符合题目要求的。请选出所有符合题目要求的答案，多选或少选均不得分。",["Mile术","Dixon术","Hartmann 术","Parks 术"],"A","B","外科学",2018,"real","外科学|其他","直肠下段癌Miles术","肿瘤下缘距肛缘4cm，属直肠下段，且质硬、固定、占据左侧大半周、上界未触及，须行腹会阴联合直肠癌根治术（Miles术），切除肛门并做永久性乙状结肠造口，故选A。Dixon术要求远端切缘距肿瘤≥2cm，4cm处无法保肛；Hartmann术用于急性梗阻不能吻合者；Parks术虽可保肛，但适用于齿状线上方有一定距离、分化较好者，故不选。","《外科学》第9版·普通外科·直肠癌·Miles术适应证","green"],["2018N136X","影响细胞静息电位的主要因素有",["K+平衡电位","膜两侧 [K+]的浓度差","Na+平衡电位","膜对K+、Na+的相对通透性"],"ABD","X","生理学",2018,"real","生理学|细胞的基本功能","影响静息电位的主要因素","静息电位接近K+平衡电位，故凡改变K+平衡电位（A）或膜两侧K+浓度差（B）者均影响静息电位；同时膜对Na+有少量通透性，膜对K+、Na+相对通透性改变（D）也改变静息电位。Na+平衡电位本身（C）不直接决定静息电位，仅通过Na+通透性起作用，故选A、B、D。","《生理学》第9版·细胞的基本功能·静息电位","green"],["2018N137X","血友病产生的原因有",["缺乏维生素 K","缺乏凝血因子 V","缺乏凝血因子Ⅷ","缺乏凝血因子Ⅸ"],"CD","X","外科学",2018,"real","外科学|其他","血友病A与B的凝血因子缺陷","血友病A为FⅧ基因缺陷致因子Ⅷ缺乏（C），血友病B为因子Ⅸ缺乏（D），两者均为X连锁隐性遗传，造成内源性凝血途径障碍、APTT延长。A错，维生素K缺乏致Ⅱ、Ⅶ、Ⅸ、Ⅹ因子γ-羧化障碍，属获得性凝血异常，不是血友病病因；B错，因子Ⅴ缺乏称为副血友病，不属典型血友病。","《内科学》第9版·血液系统疾病·凝血功能障碍性疾病","green"],["2018N138X","在生理状态下，能使冠脉血流量增多的因素有",["加快心率","增加外周阻力","降低动脉血压","增强心肌代谢活动"],"BD","X","外科学",2018,"real","外科学|其他","冠脉血流量的调节","冠脉血流主要受心肌代谢水平调控，心肌代谢增强时腺苷等代谢产物使冠脉小动脉强烈舒张，冠脉血流量显著增多，D正确；增加外周阻力使主动脉压升高、冠脉灌注压增大，冠脉血流亦增多，B正确。A错，心率加快使舒张期缩短、冠脉灌注时间减少，冠脉血流减少；C错，动脉血压降低使灌注压下降，冠脉血流减少。","《生理学》第9版·血液循环·冠脉循环","green"],["2018N139X","支持体温调定点学说的现象和依据有",["高热高湿环境下中暑的发生","发热初期出现发寒战等产热反应","发热恢复期发生出汗散热的反应","体温改变时下丘脑温度敏感神经元电活动改变"],"BCD","X","生理学",2018,"real","生理学|能量代谢和体温","体温调定点学说","调定点学说认为下丘脑PO/AH温度敏感神经元群设定体温调定点。发热初期调定点上移，机体出现寒战、产热增加（B）与皮肤血管收缩；热退时调定点下移，出现出汗散热（C）；体温改变时下丘脑温度敏感神经元放电频率随即改变（D），均为直接证据。A中暑是散热障碍致体温被动升高，不支持调定点上移，故选B、C、D。","《生理学》第9版·能量代谢与体温·体温调节","green"],["2018N140X","痛觉敏感器所具有的生理特性包括",["适宜刺激","换能作用","编码作用","快适应现象"],"BC","X","外科学",2018,"real","外科学|其他","痛觉感受器的生理特性","痛觉感受器为游离神经末梢，具有换能作用，可将各种刺激能量转变为感受器电位（B）；并具有编码作用，以传入冲动的频率与参加的神经纤维数目编码刺激强度（C）。A错，痛觉无适宜刺激，任何过强的机械、温度、化学刺激均可致痛；D错，痛觉感受器属慢适应，持续刺激下疼痛并不减弱。","《生理学》第9版·神经系统的功能·感觉器官","green"],["2018N141X","易化肌紧张的中枢部位有",["前庭核","纹状体","小脑半球中间部","大脑皮层运动区"],"AC","X","外科学",2018,"real","外科学|其他","肌紧张易化区与抑制区","易化区包括延髓网状结构背外侧、脑桥被盖、中脑中央灰质、下丘脑、底丘脑、红核、前庭核及小脑前叶两侧部，故A前庭核为易化区。小脑对肌紧张具有易化与抑制的双重调节，半球中间部参与经红核等结构的肌紧张调节环路，本题按答案归入易化相关部位（C）。B纹状体与D大脑皮层运动区属抑制区，经抑制易化区使肌紧张降低，故不选。","《生理学》第9版·神经系统的功能·姿势与肌紧张的调节","green"],["2018N142X","参与血液中氨运输的主要氨基酸有",["丙氨酸","鸟氨酸","谷氨酰胺","谷氨酸"],"AC","X","生物化学",2018,"real","生物化学|氨基酸代谢","丙氨酸与谷氨酰胺运氨","血中氨的主要运输形式是丙氨酸和谷氨酰胺：肌肉通过丙氨酸-葡萄糖循环把氨以丙氨酸形式送至肝；谷氨酰胺是氨的无毒运输和储存形式，在肝、肾经谷氨酰胺酶释放氨。谷氨酸只在脑等局部与氨结合生成谷氨酰胺，鸟氨酸是尿素循环中间产物，二者不是主要运输形式。","《生物化学与分子生物学》第9版·氨基酸代谢·氨的转运","green"],["2018N143X","能够影响氧化磷酸化的因素有",["[ADP]/[ATP]","甲状腺素增加","线粒体突变","CO阻断Cyta3"],"ABC","X","生物化学",2018,"real","生物化学|糖代谢","氧化磷酸化的调节与抑制剂","氧化磷酸化受ADP/ATP比值（呼吸控制）调节，甲状腺素可使解偶联样效应、ADP增多而加速氧化磷酸化，线粒体DNA突变可损伤呼吸链复合体，故A、B、C均影响氧化磷酸化。CO与细胞色素c氧化酶（Cytaa3，复合体Ⅳ）结合阻断电子传递，同样抑制氧化磷酸化，D亦应正确。⚠️原答案仅ABC，遗漏D，理由：CO抑制复合体Ⅳ，属典型氧化磷酸化抑制剂（与氰化物、H2S同类）。","《生物化学与分子生物学》第9版·生物氧化·氧化磷酸化的影响因素","yellow"],["2018N144X","参与蛋白质生物合成的能量物质有",["ATP","CTP","GTP","UTP"],"AC","X","外科学",2018,"real","外科学|其他","蛋白质合成的能量消耗","蛋白质生物合成的耗能环节：氨基酸活化生成氨酰-tRNA消耗ATP（A）；起始复合物形成、进位、转肽后移位及终止释放均需GTP（C）。CTP主要用于磷脂与糖原合成，UTP参与糖原合成及RNA合成，二者不直接为肽链延伸供能，故B、D不选。","《生物化学与分子生物学》第9版·蛋白质的生物合成·合成过程","green"],["2018N145X","参与基因转录调控的主要结构有",["启动子","衰减子","增强子","密码子"],"ABC","X","生物化学",2018,"real","生物化学|RNA转录与翻译","启动子/增强子/衰减子","启动子是RNA聚合酶识别、结合并起始转录的DNA序列；衰减子是细菌操纵子中可形成衰减子结构、通过转录终止调节表达的序列；增强子是可与特异蛋白结合、远距离增强转录的顺式元件。三者均参与转录调控。密码子是mRNA上编码氨基酸的三联体，属翻译范畴，不是调控结构。","《生物化学与分子生物学》第9版·基因表达调控·顺式作用元件","green"],["2018N146X","肝生物转化的作用有",["使多数非营养物质活性降低","使某些激素灭活","使多数非营养物质的水溶性降低","对毒性既可解毒也可加大毒性"],"ABD","X","外科学",2018,"real","外科学|其他","肝生物转化的作用与特点","肝生物转化经氧化、还原、水解与结合反应，使多数非营养物质的活性降低或丧失（A）；使激素、药物灭活是肝的重要功能（B）；结合反应使其水溶性增高而便于经胆汁或尿排出，故D（对毒性既可解毒也可加大毒性，如甲醇氧化为甲醛、对硫磷转为对氧磷）正确。C错，生物转化使水溶性升高而不是降低。","《生物化学与分子生物学》第9版·肝的生物化学·生物转化","green"],["2018N147X","能测定 DNA-蛋白质相互作用的实验技术有",["电泳迁移率变动测定","酵母双杂交","染色质免疫沉淀法","酶联免疫法"],"AC","X","外科学",2018,"real","外科学|其他","DNA-蛋白相互作用研究方法","电泳迁移率变动分析（EMSA）利用蛋白与DNA结合后分子量增大、在凝胶中迁移减慢的原理判定结合，A正确；染色质免疫沉淀（ChIP）用特异抗体沉淀蛋白-DNA复合物并检测共沉淀DNA，可直接证明某蛋白结合特定DNA序列，C正确。B酵母双杂交检测蛋白-蛋白相互作用；D酶联免疫法用于抗原抗体的定量检测，均不能反映DNA与蛋白结合。","《生物化学与分子生物学》第9版·基因重组与分子生物学技术","green"],["2018N148X","下列选项中，与肝硬化腹水生成机制相关的有",["门静脉高压","肝脏处理胆红素功能下降","肝内纤维组织增生压迫肝静脉主干","淋巴液从肝细胞膜中外渗"],"AD","X","内科学",2018,"real","内科学|消化系统疾病","肝硬化腹水的形成机制","肝硬化腹水形成与门静脉高压（A，使内脏血管床静水压升高、组织液回吸收减少）及肝淋巴液生成过多经肝包膜外渗（D）有关，此外还有低白蛋白血症、RAAS激活、抗利尿激素增多。B肝脏处理胆红素功能下降只引起黄疸，与腹水无关；C“压迫肝静脉主干”表述不准确，肝内纤维化主要压迫肝血窦与肝静脉小分支形成窦后阻力。","《内科学》第9版·消化系统疾病·肝硬化","green"],["2018N149X","下列病变中，属于心肌褐色萎缩病变的有",["心脏体积缩小","心底部大血管管腔缩小","冠状脉动程扭曲状","心室内膜呈虎斑心"],"AC","X","病理学",2018,"real","病理学|细胞和组织的适应与损伤","心脏褐色萎缩的肉眼改变","心肌褐色萎缩时心脏体积缩小、重量减轻，心肌细胞内脂褐素沉积使心肌呈深褐色；因心脏缩小、体积减小，冠状动脉相对延长而呈蛇行状扭曲，故A、C正确。心底部大血管因心脏上移、相对延长而扭曲，管腔并不缩小，B错误；心室内膜下出现虎斑状条纹（虎斑心）是心肌脂肪变的表现，属另一种病理改变，D错误。","《病理学》第9版·细胞和组织的适应与损伤·萎缩","green"],["2018N150X","下列疾病中，会发生纤维素样坏死的有",["膜性肾病","系统性红斑狼疮","风湿性心肌炎","良性高血压"],"BC","X","病理学",2018,"real","病理学|心血管系统疾病","纤维素样坏死与免疫性疾病的对应","纤维素样坏死常见于免疫复合物沉积或急进型高血压的血管壁。B系统性红斑狼疮的小血管壁、C风湿性心肌炎Aschoff小体中心均发生纤维素样坏死，正确。A膜性肾病为基底膜上皮下免疫复合物沉积致基底膜弥漫增厚、钉突形成，不出现纤维素样坏死；D良性高血压只引起细小动脉玻璃样变。故答案为BC。","《病理学》第9版·心血管系统疾病·风湿病","green"],["2018N151X","下列疾病中，属于假膜性炎的是",["大叶性肺炎","白喉","细菌性痢疾","风湿性心包炎"],"BC","X","外科学",2018,"real","外科学|其他","假膜性炎的判定","假膜性炎是发生于黏膜的纤维素性炎，渗出的纤维素与坏死上皮细胞、中性粒细胞混合形成假膜。白喉（咽喉黏膜，B）与细菌性痢疾（结肠黏膜，C）为典型假膜性炎。A大叶性肺炎为肺泡内纤维素性炎，不形成假膜；D风湿性心包炎为浆膜纤维素性炎，形成绒毛心，亦非假膜，故不选。","《病理学》第9版·炎症·纤维素性炎","green"],["2018N152X","在下列选项中，与肿瘤分期相关的有",["肿瘤的大小","淋巴结有无转移","肿瘤的浸润深度","肿瘤的分化程度"],"ABC","X","外科学",2018,"real","外科学|其他","TNM分期与病理分级的区别","肿瘤TNM分期依据肿瘤大小（T，A）、浸润深度（T，C）、淋巴结转移（N，B）与远处转移（M）确定，与分化程度无关。分化程度属病理分级（G），反映肿瘤的恶性程度与生长速度，故D不选。","《病理学》第9版·肿瘤·肿瘤的分级与分期","green"],["2018N153X","下列选项中，符合早期胃癌描述的有",["肿瘤最大径小于 2cm","肿瘤尚未侵及基层","可有局部淋巴结转移","可有单个的肝转移灶"],"BC","X","外科学",2018,"real","外科学|普通外科","早期胃癌的定义","早期胃癌指癌组织局限于黏膜层或黏膜下层，不论病灶大小、不论有无淋巴结转移，故B（未侵及肌层）与C（可有局部淋巴结转移）正确。A错，早期胃癌大小不限，直径<5mm为微小胃癌、<10mm为小胃癌，不能以2cm为界；D错，出现肝转移即属远处转移的Ⅳ期，已非早期。","《外科学》第9版·普通外科·胃癌·早期胃癌","green"],["2018N154X","下列抗结核药中，属杀菌药的有",["异烟肼","利福平","吡嗪酰胺","对氨基水杨酸"],"ABC","X","外科学",2018,"real","外科学|其他","抗结核杀菌药与抑菌药","异烟肼抑制分枝菌酸合成、利福平抑制DNA依赖RNA聚合酶、吡嗪酰胺在酸性巨噬细胞内杀菌，三者均属杀菌药（异烟肼、利福平为全效杀菌药，吡嗪酰胺为半效），A、B、C正确。对氨基水杨酸仅干扰结核菌叶酸合成，为抑菌药，且与利福平同服影响其吸收，故D不选。","《内科学》第9版·呼吸系统疾病·肺结核·化学治疗","green"],["2018N155X","心脏压塞主要体征有",["奇脉","心界扩大","血压下降，脉压增大","心率加快，心音减弱"],"ABD","X","外科学",2018,"real","外科学|其他","心脏压塞体征（Beck三联征）","心脏压塞时心包内压升高，心室舒张受限、每搏量锐减，出现Beck三联征：血压下降、脉压减小、颈静脉怒张、心音遥远；吸气时收缩压进一步下降形成奇脉（A）；心包积液使心界扩大（B）；代偿性心率加快、心音减弱（D）。C错，脉压应为减小而非增大，故不选。","《外科学》第9版·胸心外科·心包疾病·心脏压塞","green"],["2018N156X","有机磷中毒时的毒蕈碱样症状有",["腹痛、腹泻","大汗、流涎","肌纤维颤动","瞳孔缩小"],"ABD","X","外科学",2018,"real","外科学|其他","M样与N样症状鉴别","毒蕈碱样（M样）症状由副交感神经末梢及汗腺交感胆碱能纤维过度兴奋所致：腺体分泌增加、平滑肌痉挛，表现为腹痛腹泻（A）、大汗流涎（B）、瞳孔缩小（D）、支气管痉挛与分泌物增多。C肌纤维颤动是烟碱样（N样）症状，为ACh在骨骼肌运动终板蓄积所致，故不选。","《内科学》第9版·理化因素所致疾病·有机磷中毒的临床表现","green"],["2018N157X","急性肾炎综合征应具有的临床特点包括",["高血压","血尿","蛋白尿","肾功能不全"],"ABC","X","外科学",2018,"real","外科学|其他","急性肾炎综合征的构成","急性肾炎综合征的四大临床表现为血尿（B，常为首发）、蛋白尿（C）、水肿（多始于眼睑）和高血压（A），可伴一过性氮质血症。D肾功能不全不属该综合征的定义要素；进行性肾功能减退是急进性肾炎综合征的特点，故不选。","《内科学》第9版·泌尿系统疾病·急性肾小球肾炎","green"],["2018N158X",
