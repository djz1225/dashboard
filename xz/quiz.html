<script>
const DATA = [["2024N1A","在人体的自动控制系统中，由受控部分发出，到达控制部分的信息是",["偏差信息","前馈信息","反馈信息","指令信息"],"C","A","生理学",2024,"real","生理学|其他","反馈与自动控制","自动控制系统中信息流向决定名称：由受控部分（效应器、器官）发出、经反馈通路回送到控制部分的信息即反馈信息，故 C 正确。偏差信息是控制部分将反馈信号与参考（调定点）比较后产生的差值信号，属于控制部分内部/向效应器方向的误差信息，非受控部分发出，A 错。前馈信息是在干扰作用于受控部分之前由监测装置提前送出的信号，方向为扰动→控制部分，B 错。指令信息由控制部分发出、经传出通路抵达受控部分，方向相反，D 错。四类信息中唯有反馈信息符合“受控部分发出、到达控制部分”。","《生理学》第9版·绪论·人体功能活动的调节","green"],["2024N2A","神经纤维上两个先后发生的锋电位之间的最短间隔时间是",["≥绝对不应期","≥相对不应期","≥超常期","≥低常期"],"A","A","生理学",2024,"real","生理学|细胞的基本功能","动作电位与兴奋性周期","两个锋电位间的最短间隔取决于绝对不应期：此期内电压门控 Na⁺ 通道处于失活状态，无论刺激强度多大都不能再引起去极化，故最短间隔≥绝对不应期，A 正确。相对不应期起点即为绝对不应期终点，此期 Na⁺ 通道已部分恢复，较强刺激可再次兴奋，若答“≥相对不应期”则把本可兴奋的时段也算入不应期，间隔被高估，B 错。超常期、低常期均位于相对不应期之后，兴奋性已明显恢复，更不是限制因素，C、D 错。该现象决定了神经纤维兴奋的最大放电频率。","《生理学》第9版·细胞的基本功能·细胞的兴奋性与生物电现象","green"],["2024N3A","关于后负荷增加时骨骼肌收缩改变的叙述，错误的是",["开始缩短的时间推迟","收缩产生的张力减小","缩短的速度减小","缩短的距离减小"],"B","A","生理学",2024,"real","生理学|血液循环","骨骼肌收缩的形式与影响因素","后负荷相当于肌肉收缩时遇到的阻力，其增大时等张收缩的表现是：张力增大、开始缩短的潜伏期延长（缩短推迟）、缩短初速度减小、缩短程度（距离）减小，做功量在中等后负荷时最大。因此 A（缩短推迟）、C（速度减小）、D（距离减小）均为后负荷增加的正确描述。B 说“收缩产生的张力减小”方向相反——后负荷越大，肌肉需产生的张力越大，达到该张力前不能缩短，故 B 为错误项。注意与心肌异长/等长调节区分：心肌后负荷增大时搏出量减少，机制相同而表述不同。","《生理学》第9版·细胞的基本功能·肌细胞的收缩","green"],["2024N4A","蛋白质C系统的抗凝血机制",["灭活FⅧa和FⅤa","抑制FⅦa—FⅢ复合物","增强抗凝血酶活性","拮抗VitK的作用"],"A","A","生理学",2024,"real","生理学|血液","抗凝系统与纤溶","蛋白质 C 系统：凝血酶与内皮细胞膜上的凝血酶调节蛋白结合后，激活蛋白 C 生成活化蛋白 C（APC），以蛋白 S 为辅因子，水解灭活辅因子 FⅧa 和 FⅤa，从而阻断 X 酶复合物与凝血酶原酶复合物的形成，发挥抗凝作用，A 正确。抑制 FⅦa-组织因子复合物是组织因子途径抑制物（TFPI）的作用，B 错。增强抗凝血酶活性是肝素及内皮表面硫酸肝素的作用，C 错。拮抗维生素 K、减少 FⅡ、Ⅶ、Ⅸ、Ⅹ 的 γ-羧化是华法林等香豆素类药物的机制，D 错。故四项中仅 A 属蛋白 C 系统。","《生理学》第9版·血液·生理性止血","green"],["2024N5A","调节毛细血管前括约肌舒缩活动的主要因素",["交感神经","副交感神经","血管紧张素","局部代谢产物"],"D","A","生理学",2024,"real","生理学|血液循环","微循环与组织血流调节","微循环中后微动脉与毛细血管前括约肌无（或极少）神经支配，其舒缩主要由所在区域局部代谢产物浓度决定：代谢产物（低氧、CO₂ 升高、乳酸、腺苷、组胺、K⁺ 等）蓄积使之舒张，血流增加把代谢产物冲走后又收缩，如此交替形成血管舒缩活动，故 D 正确。交感缩血管纤维主要支配微动脉、后微动脉，对毛细血管前括约肌支配稀疏，且其紧张性活动不构成前括约肌交替舒缩的主要原因，A 错。副交感缩血管纤维在多数组织并不存在，B 错。血管紧张素Ⅱ属全身性体液因素，主要收缩微动脉、参与血压调节，不是前括约肌局部舒缩的主要调节者，C 错。","《生理学》第9版·血液循环·微循环","green"],["2024N6A","心迷走神经兴奋时，心脏的活动不会发生的明显改变是",["心室肌收缩力减弱","心房肌收缩力减弱","心率减慢","心内兴奋传导减慢"],"A","A","生理学",2024,"real","生理学|血液循环","心脏的神经支配","心迷走神经节后纤维释放 ACh，作用于心肌 M 受体，使腺苷酸环化酶活性降低、K⁺ 通道（IK-ACh）开放增加、Ca²⁺ 内流减少，表现为心率减慢（窦房结 4 期去极化减慢）、心房肌收缩力减弱、房室传导速度减慢（房室交界最敏感），故 C、D、B 都会明显出现。心室肌 M 受体密度低，且迷走神经纤维在心室分布极少，故迷走兴奋时心室肌收缩力几乎不发生明显减弱，A 为“不会发生的明显改变”，是本题答案。这也解释了刺激迷走神经时心室收缩力基本不变、而心房收缩明显减弱。","《生理学》第9版·血液循环·心血管活动的神经调节","green"],["2024N7A","下列各种情况下，可引起氧解离曲线右移的是",["CO中毒","血pH升高","PaCO₂降低","红细胞糖酵解加强"],"D","A","生理学",2024,"real","生理学|血液","氧解离曲线及其影响因素","氧解离曲线右移意味着 Hb 对 O₂ 亲和力降低、P₅₀ 增大，利于向组织释放氧。使曲线右移的因素为 PCO₂ 升高、pH 降低、温度升高、2,3-DPG 增多。红细胞糖酵解加强→2,3-DPG 生成增多→与脱氧 Hb 结合稳定 T 型→曲线右移，D 正确。CO 中毒时 Hb 与 CO 结合占据 O₂ 位点，剩余的 HbO₂ 对氧亲和力反而升高，曲线左移，A 错。pH 升高（碱中毒）使 Hb 对 O₂ 亲和力增大，曲线左移，B 错。PaCO₂ 降低同样使曲线左移，C 错。故只有 D 引起右移。","《生理学》第9版·呼吸·气体在血液中的运输","green"],["2024N8A","酸性食糜进入小肠后通过小肠黏膜释放某种胃肠激素而使胰液大量分泌 ，这\n种胃肠激素是",["促胰液素","促胃液素","抑胃肽","缩胆囊素"],"A","A","生理学",2024,"real","生理学|消化和吸收","胰液分泌的调节","酸性食糜进入十二指肠后刺激小肠黏膜 S 细胞释放促胰液素，作用于胰腺导管上皮，使胰液量大幅增加、HCO₃⁻ 浓度升高而酶含量并不增多，故 A 正确。促胃液素由胃窦 G 细胞释放，主要刺激胃酸和胃蛋白酶原分泌，对胰液以促进酶分泌为主且作用弱，B 错。抑胃肽作用于 B 细胞促胰岛素释放并抑制胃酸、胃排空，不引起胰液大量分泌，C 错。缩胆囊素由 I 细胞释放，主要引起胆囊收缩和胰酶分泌，不引起水和 HCO₃⁻ 大量分泌，D 错。此即“促胰液素—胰液量、缩胆囊素—胰酶”的分工。","《生理学》第9版·消化和吸收·胰液和胆汁的分泌调节","green"],["2024N9A","测得某受试者的体表面积为 1.67㎡，在基础状态下的耗氧量为 16.7L/h ，非\n蛋白氮的氧热价为 20.2KJ/L ，则该受试者的基础代谢率为",["140KJ/（㎡·h）","170KJ/（㎡·h）","200KJ/（㎡·h）","250KJ/（㎡·h）"],"C","A","生理学",2024,"real","生理学|能量代谢和体温","基础代谢率与间接测热","简化间接测热法：先由耗氧量乘以氧热价得每小时产热量，再除以体表面积。产热量=16.7 L/h×20.2 kJ/L≈337 kJ/h；基础代谢率=337÷1.67≈202 kJ/(m²·h)，最接近 C（200）。A 相当于漏除体表面积或换算错误；B、D 为随意取值，无计算依据。计算时须注意两点：氧热价以非蛋白呼吸商状态给出，本题直接采用题目数据；结果单位必须为每平方米每小时，才能与正常值（成年男性约 150～170 kJ/(m²·h)）比较，本例偏高提示可能为测定条件不合格或为甲亢等病理状态。","《生理学》第9版·能量代谢和体温·能量代谢的测定","green"],["2024N10A","对水不通透的肾小管和集合管部位是",["髓袢升支粗段","髓袢降支细段","近端小管","集合管"],"A","A","生理学",2024,"real","生理学|尿的生成和排出","肾小管各段物质转运特点","髓袢升支粗段管腔膜上存在 Na⁺-K⁺-2Cl⁻ 同向转运体，主动重吸收 NaCl 而对水不通透，小管液被稀释为低渗液，是尿液稀释的关键部位，故 A 正确。髓袢降支细段恰恰相反，只对水通透、对溶质（NaCl、尿素）不通透，水被重吸收使小管液浓缩，B 错。近端小管对水通透性很高，水的重吸收与溶质等渗成比例（约 65%～70%），C 错。集合管在 ADH 作用下对水高度通透（有 AQP2 插 不脱羧，故只有异柠檬酸脱氢酶符合。","《生物化学与分子生物学》第9版·糖代谢·三羧酸循环","green"],["2024N22A","下列代谢途径中，为合成酮体提供原料乙酰 CoA的是",["糖酵解","糖有氧氧化","脂肪酸β氧化","鸟氨酸循环"],"C","A","生物化学",2024,"real","生物化学|脂类代谢","酮体生成","脂肪酸β氧化每进行一轮，脂酰CoA经脱氢、加水、再脱氢、硫解产生1分子乙酰CoA、1分子NADH和1分子FADH₂，肝内生成的乙酰CoA充足时经硫解酶缩合为乙酰乙酰CoA供酮体生成，故β氧化是酮体碳源。糖有氧氧化产生的乙酰CoA主要进入TCA供能，糖酵解止于丙酮酸，鸟氨酸循环处理氨，均不提供酮体原料。","《生物化学与分子生物学》第9版·脂类代谢·酮体的生成与利用","green"],["2024N23A","下列物质中，参与肝细胞质 NADH转运至线粒体氧化呼吸链的是",["磷酸戊糖","磷酸二羟丙酮","丙氨酸","天冬氨酸"],"D","A","生理学",2024,"real","生理学|其他","NADH穿梭系统","胞质 NADH 不能直接穿过线粒体内膜，需经穿梭系统。苹果酸-天冬氨酸穿梭（心、肝等）中，胞质草酰乙酸接受 NADH 的氢生成苹果酸进入线粒体，在线粒体内重新生成草酰乙酸与 NADH 进入呼吸链；草酰乙酸不能直接穿膜，须经转氨酶作用变为天冬氨酸（谷氨酸→α-酮戊二酸）才能转运出线粒体，故天冬氨酸参与该穿梭，D 正确。磷酸戊糖是磷酸戊糖途径的产物/中间物，A 错。磷酸二羟丙酮参与的是 α-磷酸甘油穿梭，属另一穿梭系统，B 错。丙氨酸主要参与葡萄糖-丙氨酸循环，C 错。","《生物化学与分子生物学》第9版·生物氧化·氧化磷酸化","green"],["2024N24A","导致苯丙酮尿症的原因是",["酪氨酸转氨酶缺陷","酪氨酸羟化酶缺陷","苯丙氨酸转氨酶缺陷","苯丙氨酸羟化酶缺陷"],"D","A","生理学",2024,"real","生理学|其他","苯丙氨酸与酪氨酸代谢","苯丙酮尿症为常染色体隐性遗传病，根本缺陷是苯丙氨酸羟化酶（PAH）基因突变，使苯丙氨酸不能羟化为酪氨酸，血中苯丙氨酸蓄积并经转氨酶作用生成苯丙酮酸、苯乳酸等从尿排出，故 D 正确。酪氨酸转氨酶缺陷不影响苯丙氨酸的清除，A 错。酪氨酸羟化酶是儿茶酚胺合成限速酶，其缺陷导致的是多巴反应性肌张力障碍等，B 错。人体不存在“苯丙氨酸转氨酶”这一作为该病病因的酶，苯丙氨酸的代谢旁路转氨是蓄积后的结果而非病因，C 错。苯丙氨酸羟化酶还需四氢生物蝶呤为辅因子。","《生物化学与分子生物学》第9版·氨基酸代谢·芳香族氨基酸代谢","green"],["2024N25A","嘌呤核苷酸合成中， IMP转变生成 AMP的重要中间产物是",["XMP","GMP","腺苷酸代琥珀酸","S-腺苷甲硫氨酸"],"C","A","生物化学",2024,"real","生物化学|核苷酸代谢","IMP转向AMP/GMP","IMP是嘌呤核苷酸互变的分叉点：经腺苷酸代琥珀酸合成酶催化、消耗GTP并以天冬氨酸供氨，生成腺苷酸代琥珀酸，再由裂解酶释放延胡索酸而生成AMP，故C正确。转向GMP时先由IMP脱氢酶（NAD⁺为受氢体）生成XMP，再由GMP合成酶消耗ATP生成GMP；S-腺苷甲硫氨酸提供活性甲基，参与甲基化反应而非嘌呤互变。","《生物化学与分子生物学》第9版·核苷酸代谢·嘌呤核苷酸的合成与分解","green"],["2024N26A","参与真核生物线粒体 DNA复制的酶是",["DNA聚合酶α","DNA聚合酶β","DNA聚合酶γ","DNA聚合酶δ"],"C","A","生物化学",2024,"real","生物化学|DNA复制与修复","真核DNA聚合酶的种类与功能","真核DNA聚合酶分工明确：α含引物酶活性，起始核DNA复制；δ为核内复制延长的主要酶，并有3′→5′外切酶校读功能；ε参与后随链合成与修复；γ定位于线粒体，负责线粒体DNA的复制与修复，其突变导致线粒体病；β主要参与核DNA损伤的碱基切除修复。故参与线粒体DNA复制的是γ。","《生物化学与分子生物学》第9版·DNA的复制·DNA聚合酶","green"],["2024N27A","某基因的外显子 1编码蛋白质 A，外显子1～2、4编码蛋白质 B，转录后蛋\n白质B加工过程中与蛋白质 A有何差异",["前体mRNA剪切","前体mRNA的选择性剪接","mRNA编辑","无义介导的 mRNA降解"],"B","A","生物化学",2024,"real","生物化学|RNA转录与翻译","前体mRNA的选择性剪接","同一前体 ","FEV₁/FVC降低，余气量减小"],"C","B","外科学",2024,"real","外科学|其他","阻塞性与限制性通气障碍鉴别","阻塞性通气障碍时气道阻力增加，用力呼气流量下降幅度大于肺活量，故FEV₁/FVC比值降低；同时肺弹性回缩力下降、小气道提前闭合致气体陷闭，余气量增加，表现为肺总量增加而肺活量减少。这与慢阻肺的病理生理一致。","《生理学》第9版·呼吸·肺通气功能评价","green"],["2024N117B","限制性肺疾病，通气功能检查",["FEV₁/FVC基本不变，余气量增加","FEV₁/FVC基本不变，余气量减小","FEV₁/FVC减小，余气量增加","FEV₁/FVC减小，余气量减小"],"B","B","外科学",2024,"real","外科学|其他","限制性通气障碍肺功能特点","限制性通气障碍因肺顺应性下降、胸廓活动受限，各肺容积成比例缩小，FVC与FEV₁同幅减少，FEV₁/FVC比值基本不变甚至因回缩力增强而升高，余气量、肺总量均减小。若比值明显下降，说明并存阻塞性因素。","《生理学》第9版·呼吸·肺通气功能评价","green"],["2024N118B","输尿管结石尿量减少的原因是",["肾小囊内压升高","滤过膜通透性减小","血浆胶体渗透压升高","肾小球滤过总面积减少"],"A","B","外科学",2024,"real","外科学|泌尿外科","肾小囊内压升高致少尿","输尿管结石造成尿路梗阻，尿液排出受阻使肾盂、肾小管腔内压力升高，肾小囊内压随之上升；有效滤过压=肾小球毛细血管压−(血浆胶体渗透压+囊内压)，囊内压升高使有效滤过压减小，GFR下降而尿量减少。此为梗阻性少尿的机制，滤过膜、胶体渗透压与滤过面积无原发改变。","《生理学》第9版·泌尿·肾小球滤过及其影响因素","green"],["2024N119B","大量失血尿量减少的主要原因是",["肾小囊内压升高","滤过膜通透性减小","血浆胶体渗透压升高","肾小球滤过总面积减少"],"D","B","外科学",2024,"real","外科学|其他","失血性少尿机制","大量失血使交感神经与肾素-血管紧张素系统强烈兴奋，入球小动脉明显收缩、肾血流量锐减，开放的功能性毛细血管减少，有效滤过总面积下降、滤过系数降低，GFR降低而少尿。囊内压升高属梗阻机制，血浆胶体渗透压变化与滤过膜通透性改变均非失血早期少尿的主因。","《生理学》第9版·泌尿·肾血流量与肾小球滤过","green"],["2024N120B","糖酵解与磷酸戊糖途径的共同中间产物是",["果糖-6-磷酸","果糖-1，6-二磷酸","葡萄糖-6-磷酸","6-磷酸葡萄糖酸内酯"],"C","B","生物化学",2024,"real","生物化学|糖代谢","糖代谢途径的共同中间产物","葡萄糖-6-磷酸是糖代谢的共同枢纽：糖酵解起点由己糖激酶（肝为葡萄糖激酶）催化葡萄糖磷酸化生成G-6-P；磷酸戊糖途径同样以G-6-P为起点，经6-磷酸葡萄糖脱氢酶生成6-磷酸葡萄糖酸内酯。果糖-6-磷酸与果糖-1,6-二磷酸只见于糖酵解/糖异生，6-磷酸葡萄糖酸内酯仅为PPP特有中间物。","《生物化学与分子生物学》第9版·糖代谢·糖酵解与磷酸戊糖途径","green"],["2024N121B","糖原合成与糖原分解途径共同的重要中间产物",["果糖-6-磷酸","果糖-1，6-二磷酸","葡萄糖-6-磷酸","6-磷酸葡萄糖酸内酯"],"C","B","生物化学",2024,"real","生物化学|糖代谢","糖原合成与分解的共同中间物","糖原分解由糖原磷酸化酶（限速酶）断裂α-1,4-糖苷键生成葡萄糖-1-磷酸，再经磷酸葡萄糖变位酶转为葡萄糖-6-磷酸；糖原合成时G-6-P经同一位点酶转为G-1-P，进而在UDPG焦磷酸化酶催化下生成UDPG并加到引物非还原端。故两途径共用葡萄糖-6-磷酸这一中间物，它是糖原合成与分解的必经节点。","《生物化学与分子生物学》第9版·糖代谢·糖原的合成与分解","green"],["2024N122B","合成脂肪酸的原料是",["乙酰CoA","脂肪酰CoA","甲羟戊酸","乙酰乙酸"],"A","B","生物化学",2024,"real","生物化学|脂类代谢","脂肪酸合成的原料与限速酶","脂肪酸合成的碳源是乙酰CoA：先经乙酰CoA羧化酶（生物素为辅基，柠檬酸激活、软脂酰CoA抑制）生成丙二酰CoA，再由脂肪酸合酶以丙二酰CoA为二碳供体，经缩合、还原、脱水、再还原逐轮延长碳链。脂肪酰CoA是β氧化的底物，甲羟戊酸是胆固醇合成中间物，乙酰乙酸是酮体成分，均不作合成原料。","《生物化学与分子生物学》第9版·脂类代谢·脂肪酸的合成","green"],["2024N123B","HMG-CoA还原酶的别构抑制剂是",["乙酰CoA","脂肪酰CoA","甲羟戊酸","乙酰乙酸"],"C","B","生物化学",2024,"real","生物化学|酶","HMG-CoA还原酶的调节","HMG-CoA还原酶是胆固醇合成的限速酶，其活性受产物反馈抑制：甲羟戊酸（MVA）是该酶的别构抑制剂，胆固醇则通过抑制酶蛋白合成、促进酶降解和抑制mRNA翻译降低酶量。乙酰CoA是合成底物而非抑制剂，乙酰乙酸属酮体成分，与HMG-CoA还原酶调节无关。","《生物化学与分子生物学》第9版·脂类代谢·胆固醇的合成","green"],["2024N124B","股骨骨折两周后发生栓塞，最可能的原因是",["血栓栓塞","空气栓塞","脂肪栓塞","氮气栓塞"],"A","B","外科学",2024,"real","外科学|骨科","骨折后栓塞类型与时相","股骨骨折后长期制动、组织损伤与血液淤滞激活凝血，血栓多在小腿深静脉形成，2周时已机化并部分附着于静脉壁，脱落后经静脉→右心→肺动脉造成血栓栓塞，临床出现突发呼吸困难、胸痛。脂肪栓塞多在伤后24~72小时内发生（早于2周）；空气栓塞见于大静脉开放的手术或输液；氮气栓塞为减压病。","《外科学》第9版·骨科·骨折并发症·静脉血栓栓塞","green"],["2024N125B","潜水员上浮时发生栓塞，最可能的原因是",["血栓栓塞","空气栓塞","脂肪栓塞","氮气栓塞"],"D","B","病理学",2024,"real","病理学|局部血液循环障碍","栓塞类型","潜水员快速上浮时环境压力骤降，血中原本溶解的氮气（惰性气体）因溶解度骤降而析出形成气泡，阻塞血管引起症状，即氮气栓塞（减压病、沉箱病），故选D。空气栓塞多因静脉破裂（颈、胸部手术、静脉输液）致空气入血，A、B不符；脂肪栓塞见于长骨骨折、大面积脂肪组织挫伤；血栓栓塞为血栓脱落阻塞血管。要点：气泡可阻塞肺小血管，或经房间隔缺损进入体循环形成反常栓塞。","《病理学》第9版·局部血液循环障碍·栓塞","green"],["2024N126B","免疫荧光为颗粒状沉积的肾炎是",["微小病变性肾病","急性弥漫性增生性肾小球肾炎","Ⅰ型快速进行性肾小球肾炎","急性肾盂肾炎"],"B","B","病理学",2024,"real","病理学|泌尿系统疾病","肾小球肾炎病理分型","急性弥漫性增生性肾小球肾炎（毛细血管内增生性肾炎）由循环免疫复合物（链球菌成分相关）沉积致病，免疫荧光见IgG、C3沿毛细血管壁及系膜区呈粗颗粒状沉积，故选B。微小病变性肾病免疫荧光阴性（A排除）；Ⅰ型快速进行性肾小球肾炎为抗GBM抗体直接结合基底膜，呈线状沉积（C排除）；急性肾盂肾炎为化脓性炎症，无免疫复合物沉积荧光（D排除）。","《病理学》第9版·泌尿系统疾病·急性弥漫性增生性肾小球肾炎","green"],["2024N127B","免疫荧光为线状分布的肾炎是",["微小病变性肾病","急性弥漫性增生性肾小球肾炎","Ⅰ型快速进行性肾小球肾炎","急性肾盂肾炎"],"C","B","病理学",2024,"real","病理学|泌尿系统疾病","肾小球肾炎病理分型","Ⅰ型快速进行性肾小球肾炎（抗GBM抗体型，可呈Goodpasture综合征）的抗体直接针对基底膜Ⅳ型胶原成分，免疫荧光IgG沿肾小球基底膜呈线状连续沉积，故选C。急性弥漫性增生性肾炎为免疫复合物介导的颗粒状沉积（B排除）；微小病变免疫荧光阴性；急性肾盂肾炎为化脓性炎，无此种荧光。要点：线状提示抗GBM自身抗体，颗粒状提示循环或原位免疫复合物，是分型的核心鉴别点。","《病理学》第9版·泌尿系统疾病·快速进行性肾小球肾炎","green"],["2024N128B","结节病患者支气管肺泡灌洗液的特点是",["中性粒细胞比例增加","淋巴细胞比例增加","肺泡巨噬细胞比例增高","嗜碱性粒细胞比例增加"],"B","B","生理学",2024,"real","生理学|呼吸","肺泡灌洗液细胞学","结节病是以非干酪样肉芽肿为特征的全身性疾病，肺部受累时肺泡灌洗液典型表现为淋巴细胞比例明显增高（常＞25%～30%，以 CD4⁺T 细胞为主、CD4/CD8 比值升高），故 B 正确。中性粒细胞比例增加见于特发性肺纤维化、感染及 ARDS 等，A 错。肺泡巨噬细胞比例增高见于吸烟者及多数非肉芽肿性间质病，不具指向性，C 错。嗜碱性粒细胞比例增加在灌洗液中并无诊断意义，D 错。故淋巴细胞性肺泡炎是结节病 BALF 的鉴别要点。","《内科学》第9版·呼吸系统疾病·间质性肺疾病","green"],["2024N129B","特发性肺纤维化患者的支气管肺泡灌洗液的特点是",["中性粒细胞比例增加","淋巴细胞比例增加","肺泡巨噬细胞比例增高","嗜碱性粒细胞比例增加"],"A","B","生理学",2024,"real","生理学|呼吸","肺泡灌洗液细胞学","特发性肺纤维化（IPF）为寻常型间质性肺炎（UIP）的病理类型，早期即有明显的中性粒细胞浸润，支气管肺泡灌洗液表现为中性粒细胞比例升高（常＞5%～10%），淋巴细胞比例不增高，故 A 正确。淋巴细胞增高为结节病、外源性过敏性肺泡炎、NSIP 等的特点，B 错。肺泡巨噬细胞增高缺乏特异性，C 错。嗜碱性粒细胞比例增加无诊断价值，D 错。BALF 细胞分类对间质性肺病的鉴别有价值：淋巴细胞升高倾向肉芽肿性病变，中性粒细胞升高倾向纤维化性病变。","《内科学》第9版·呼吸系统疾病·间质性肺疾病","green"],["2024N130B","亚硝酸盐中毒引起的皮肤症状",["发绀","发红","苍白","黄疸"],"A","B","外科学",2024,"real","外科学|其他","高铁血红蛋白血症与发绀","亚硝酸盐将血红蛋白二价铁氧化为三价铁，形成高铁血红蛋白，失去携氧能力并使氧解离曲线左移，组织缺氧；当血中高铁血红蛋白超过15g/L时皮肤黏膜呈青紫，即化学性发绀，吸氧不能纠正，需亚甲蓝还原。不出现发红、苍白或黄疸。","《内科学》第9版·理化因素所致疾病·亚硝酸盐中毒","green"],["2024N131B","四氯化碳中毒引起的皮肤症状",["发绀","发红","苍白","黄疸"],"D","B","外科学",2024,"real","外科学|其他","四氯化碳中毒靶器官","四氯化碳经肝细胞色素P450活化生成三氯甲基自由基，引发脂质过氧化、破坏肝细胞膜与内质网，造成中毒性肝损害、肝细胞性黄疸，故皮肤巩膜黄染，并伴转氨酶升高、凝血障碍。其突出表现为肝（及肾）损伤，而非发绀、发红或苍白。","《内科学》第9版·理化因素所致疾病·中毒总论","green"],["2024N132B","肝脏的供血主要源于",["肝动脉","肝静脉","肝短动脉","门静脉"],"D","B","外科学",2024,"real","外科学|其他","肝脏双重血供","肝脏具门静脉与肝动脉双重血供。门静脉收集胃、肠、脾、胰的回流血，血流量约占肝总血流量70%~75%，其血氧低但富含自肠道吸收的营养物质与需经肝清除的毒物、胆红素前体，故肝的供血（血流量）主要源于门静脉，而供氧则以肝动脉为主。","《外科学》第9版·普通外科·肝脏疾病·肝解剖生理","green"],["2024N133B","肝脏的供氧主要源于",["肝动脉","肝静脉","肝短动脉","门静脉"],"A","B","外科学",2024,"real","外科学|其他","肝脏氧供来源","肝动脉血流量虽仅占肝总血流量的25%~30%，但均为动脉血、氧饱和度高，提供肝脏约50%的氧供；门静脉血氧分压约35mmHg、明显偏低，主要承担输送营养物质与吸收物质供代谢与生物转化。故肝的供氧主要来源于肝动脉。","《外科学》第9版·普通外科·肝脏疾病·肝解剖生理","green"],["2024N134B","Charcot三联征出现在",["急性胆囊炎","急性化脓性胆管炎","重症急性胰腺炎","急性化脓性阑尾炎"],"B","B","外科学",2024,"real","外科学|普通外科","Charcot三联征","Charcot三联征为右上腹痛、寒战高热、黄疸，是急性化脓性（梗阻性）胆管炎的典型表现，源于胆道梗阻合并细菌感染。急性胆囊炎一般无黄疸或仅轻度，重症急性胰腺炎以Grey-Turner征、Cullen征为特点，急性化脓性阑尾炎为转移性右下腹痛伴发热。","《外科学》第9版·普通外科·胆道疾病·急性梗阻性化脓性胆管炎","green"],["2024N135B","Cullen征出现在",["急性胆囊炎","急性化脓性胆管炎","重症急性胰腺炎","急性化脓性阑尾炎"],"C","B","外科学",2024,"real","外科学|普通外科","Cullen征与Grey-Turner征","Cullen征指脐周皮肤出现蓝色或紫蓝色瘀斑，系腹腔内出血沿腹膜后间隙渗至脐周所致，最常见于急性出血坏死性胰腺炎（也可见于宫外孕破裂、腹主动脉瘤破裂）。Grey-Turner征为双侧腰胁部瘀斑。本题其余各项均不出现脐周瘀斑。","《外科学》第9版·普通外科·胰腺疾病·急性胰腺炎","green"],["2024N136X","凝血酶（FⅡa）对血液凝固过程的正反馈作用有",["使FⅤ活化为FⅤa","使FⅧ活化为FⅧa","使FⅪ活化为FⅪa","使FXⅢ活化为FXⅢa"],"ABC","X","生物化学",2024,"real","生物化学|酶","凝血酶的正反馈作用","凝血酶生成后可通过正反馈放大自身产生：激活FⅤ、FⅧ（辅因子活化，使FⅩa、FⅨa的催化效率提高数百倍），并可激活FⅪ参与内源途径启动，故选A、B、C。D中FⅩⅢa由凝血酶在共同途径激活，作用是催化纤维蛋白单体交联稳定，属凝血酶的终末下游效应，不构成对凝血酶生成的正反馈，故不选。","《生物化学与分子生物学》第9版·血液的生物化学·凝血因子与凝血过程","green"],["2024N137X","动作电位0期去极化是由钙离子内流引起的心肌细胞有",["窦房结细胞","心房肌细胞","房室结细胞","浦肯野细胞"],"AC","X","生理学",2024,"real","生理学|血液循环","心肌细胞动作电位分型","A 窦房结细胞：属慢反应自律细胞，缺乏快 Na⁺ 通道，0 期去极化由 L 型 Ca²⁺ 通道（ICa-L）开放引起 Ca²⁺ 内流形成，选。B 心房肌细胞：属快反应非自律细胞，0 期由电压门控快 Na⁺ 通道内流形成，不选。C 房室结细胞：同为慢反应细胞，0 期由 Ca²⁺ 内流形成，选。D 浦肯野细胞：属快反应自律细胞，虽 4 期存在 If 内向电流，但 0 期仍由快 Na⁺ 内流构成，不选。判断关键是“快反应细胞—Na⁺ 内流；慢反应细胞（窦房结、房室结）—Ca²⁺ 内流”。故正确答案 AC。","《生理学》第9版·血液循环·心肌的生物电现象","green"],["2024N138X","在胃和十二指肠黏膜合成和释放的物质中，参与粘膜细胞保护作用的有",["前列环素","生长抑素","表皮生长因子","降钙素生成相关肽"],"ABCD","X","外科学",2024,"real","外科学|其他","胃黏膜保护性介质","胃十二指肠黏膜的自身防御由多种局部介质共同维持。前列环素（PGI₂）扩张黏膜血管、增加血流并促进黏液与HCO₃⁻分泌；生长抑素抑制胃泌素和胃酸分泌、减少损伤；表皮生长因子促进黏膜细胞增殖与修复；降钙素基因相关肽由感觉神经末梢释放，介导充血性保护反应。四项均有黏膜保护作用。","《生理学》第9版·消化·胃黏膜的保护机制","green"],["2024N139X","能够产热的激素，生效时间较快且发挥作用的时长较短的是",["生长激素","肾上腺素","甲状腺激素","去甲肾上腺素"],"ABD","X","外科学",2024,"real","外科学|普通外科","产热激素的时效特点","产热激素按生效快慢与时程长短可分两类：肾上腺素、去甲肾上腺素经β受体迅速增强代谢，数分钟内起效而作用短暂；生长激素也有较快出现的产热与促蛋白合成效应，半衰期短。甲状腺激素需经核受体调节基因转录，需数日才显效并持续数周，属生效慢、时程长者。故选生长激素、肾上腺素、去甲肾上腺素。","《生理学》第9版·内分泌·能量代谢与产热","green"],["2024N140X","患者使用阿托品后可出现的生理变化有",["闭汗","瞳孔扩大","心率加快","骨骼肌松弛"],"ABC","X","外科学",2024,"real","外科学|其他","阿托品的药理作用","阿托品阻断M胆碱受体：汗腺M受体被阻断致闭汗，皮肤干燥；瞳孔括约肌松弛、瞳孔开大肌作用相对增强致瞳孔扩大、眼压升高；阻断窦房结M受体、解除迷走张力使心率加快。骨骼肌松弛需阻断神经肌肉接头N₂受体（筒箭毒碱、泮库溴铵等），阿托品无此作用。","《药理学》第9版·外周神经系统药理·M胆碱受体阻断药","green"],["2024N141X","可引起骨质疏松的内分泌激素分泌紊乱有",["雌激素分泌过多","皮质醇分泌过多","甲状腺激素分泌过多","甲状旁腺激素分泌过多"],"BCD","X","内科学",2024,"real","内科学|内分泌与代谢","继发性骨质疏松的内分泌病因","皮质醇过多抑制成骨细胞、减少肠钙吸收；甲状腺激素过多使骨转换加快、骨量丢失；甲状旁腺激素过多促进骨吸收，三者均可致骨质疏松。雌激素是缺乏（绝经后）才引起骨量快速丢失，分泌过多并不引起骨质疏松，故A不选。","《内科学》第9版·内分泌与代谢疾病·骨质疏松症","green"],["2024N142X","参与血红素合成的酶是",["ALA合酶","亚铁螯合酶","血红素合酶","谷胱甘肽酶"],"AB","X","生物化学",2024,"real","生物化学|酶","血红素合成过程与ALA合酶","血红素合成的关键步骤在线粒体与胞质间交替：ALA合酶在线粒体催化琥珀酰CoA与甘氨酸缩合生成ALA 更低，房-室压差增大、充盈增加，故 D 正确。A 心肌纤维化使心室顺应性下降、舒张受限，充盈减少。B 直立体位使静脉回心血量减少，充盈减少。C 细胞外 Na⁺ 浓度显著升高会增强 Na⁺-Ca²⁺ 交换、促进 Ca²⁺ 外排，理论上利于舒张，但生理条件下细胞外 Na⁺ 浓度高度稳定、几乎不变化，且并非教材所述充盈调节因素，故不选。","《生理学》第9版·血液循环·心脏的泵血功能","green"],["2025N7A","实现动脉血压长期调节的主要机制是",["调节心脏收缩力","调节心率","调节外周阻力","调节细胞外液量"],"D","A","生理学",2025,"real","生理学|血液循环","动脉血压的长期调节","动脉血压的短期调节依靠神经（压力感受性反射、化学感受性反射）与快速体液机制，调节心率、心肌收缩力和外周阻力；而长期调节依靠肾-体液机制，即通过改变肾脏对钠水的排出量来调节细胞外液量，进而决定循环系统平均充盈压与血容量，最终使血压回到调定点。实验证明压力感受器在数日内即发生重调定而失去长期调压能力，故 D 正确。A 调节心肌收缩力、B 调节心率、C 调节外周阻力均为短期（数秒至数分钟）调节效应，不能维持长期血压水平。故长期调压的核心是“肾—细胞外液量—血压”负反馈。","《生理学》第9版·血液循环·动脉血压的调节","green"],["2025N8A","用力呼气时，收缩并起主要作用的呼吸肌是",["肋间外肌和膈肌","肋间内肌和腹肌","斜角肌和胸锁乳突肌","腹肌和胸大肌"],"B","A","生理学",2025,"real","生理学|其他","呼吸肌与呼吸运动","平静吸气为主动过程，主力肌是膈肌（占 60%～80%）与肋间外肌；用力吸气时还需斜角肌、胸锁乳突肌、胸大肌参与。用力呼气为主动过程：腹肌收缩使腹内压升高、推动膈肌上移，肋间内肌（肋间内肌的软骨间部分）收缩使肋骨下移内旋、胸廓容积缩小，两者共同使肺内压升高而完成用力呼气，故 B 正确。A 肋间外肌与膈肌是吸气肌，方向相反。C 斜角肌与胸锁乳突肌为用力吸气辅助肌。D 胸大肌在用力吸气时上提胸廓，与呼气无关。故呼、吸肌的区分是本题关键。","《生理学》第9版·呼吸·肺通气原理","green"],["2025N9A","支配胃窦黏膜G细胞的迷走神经末梢释放的递质是",["铃蟾素","组胺","缩胆囊素","促胃液素"],"A","A","生理学",2025,"real","生理学|消化和吸收","胃液分泌的调节","支配胃窦黏膜 G 细胞的迷走神经末梢释放的递质是铃蟾素（胃泌素释放肽，GRP），它作用于 G 细胞使其分泌促胃液素；ACh 只作用于壁细胞与 ECL 细胞，不直接刺激 G 细胞，故 A 正确。组胺由胃黏膜 ECL 细胞释放，是迷走兴奋（经 ACh）与促胃液素共同作用后的产物，并非迷走末梢递质，B 错。缩胆囊素由小肠 I 细胞分泌，属激素而非迷走递质，C 错。促胃液素本身是 G 细胞分泌的激素，不是神经递质，D 错。故迷走调节胃酸分泌存在“ACh 直接作用 + GRP-促胃液素间接作用”两条通路。","《生理学》第9版·消化和吸收·胃内消化","green"],["2025N10A","大肠内细菌分解食物残渣时，不会产生的物质是",["脂肪酸","维生素C","甘油","吲哚"],"B","A","生理学",2025,"real","生理学|其他","大肠内细菌的作用","大肠内细菌对糖和脂肪的分解称为发酵，可产生 CO₂、甲烷、氢、脂肪酸、甘油、乳酸、醋酸等；对蛋白质的分解称为腐败，可产生氨、硫化氢、组胺、吲哚、粪臭素等，故 A、C、D 均可产生。细菌还能利用食物残渣合成维生素 K 和维生素 B 族（B₁、B₂、B₁₂、叶酸、生物素等）供人体利用；但维生素 C 不能由肠道细菌合成，必须从食物（新鲜蔬果）摄取，故 B 为不会产生的物质，是本题答案。维生素 C 缺乏导致坏血病。","《生理学》第9版·消化和吸收·大肠的功能","green"],["2025N11A","食物特殊动力学效应最显著的是",["蛋白质","糖类","脂肪","纤维素"],"A","A","生理学",2025,"real","生理学|其他","食物的特殊动力效应","食物的特殊动力效应指进食后一段时间内机体产生的额外热量，蛋白质为 30% 左右，糖类约 6%，脂肪约 4%，混合膳食约 10%，故 A 正确。其机制主要与蛋白质分解后氨基酸的脱氨基、尿素合成及糖异生等耗能过程，以及肝内蛋白质合成、交感神经活动增强有关，并非单纯消化吸收活动耗能。B 糖类、C 脂肪的效应明显低于蛋白质。D 纤维素几乎不被消化吸收，产生的特殊动力效应很小。临床意义在于计算糖尿病等患 ,"real","病理学|肿瘤","癌基因与抑癌基因","PTEN的产物是一种双重特异性磷酸酶，能使磷脂酰肌醇3,4,5-三磷酸（PIP3）的3位去磷酸化生成PIP2，从而拮抗PI3K/AKT通路，抑制细胞生长与存活，故其酶活性为磷酸酶，选C。它不是激酶（激酶如SRC、ABL、RET等原癌基因产物），也不是乙酰化酶或硫解酶。要点：PTEN是迄今发现的第一个具有磷酸酶活性的抑癌基因，其失活见于子宫内膜癌、胶质母细胞瘤、前列腺癌等。","《病理学》第9版·肿瘤·抑癌基因","green"],["2025N29A","酒精性肝炎的肝细胞胞浆中可见Mallory小体，其组成成分是",["变性的内质网","变性的线粒体","过氧化物酶体","中间丝前角蛋白"],"D","A","生物化学",2025,"real","生物化学|酶","Mallory小体","酒精性肝炎时细胞骨架受损，肝细胞内中间丝前角蛋白（细胞角蛋白8、18）异常磷酸化并聚集，形成嗜酸性不规则玻璃样包涵体，即Mallory小体，为酒精性肝病较具提示意义的形态改变。内质网、线粒体变性肿胀表现为细胞水肿或嗜酸性变；过氧化物酶体增多属药物诱导的适应性改变，均不构成该包涵体。本题实际属病理学。","《病理学》第9版·细胞和组织的适应与损伤·细胞内物质蓄积","green"],["2025N30A","肺结核结节的上皮样细胞起源的细胞是",["鳞状上皮细胞","肺泡上皮细胞","淋巴细胞","巨噬细胞"],"D","A","内科学",2025,"real","内科学|呼吸系统疾病","结核结节与上皮样细胞的来源","结核结节由中央干酪样坏死、周围放射状排列的上皮样细胞和朗汉斯巨细胞及外围淋巴细胞构成。上皮样细胞是巨噬细胞吞噬结核分枝杆菌后转化而来，故起源于巨噬细胞。鳞状上皮细胞、肺泡上皮细胞不参与肉芽肿形成；淋巴细胞是外围反应性成分，不能转化为上皮样细胞。","《病理学》第9版·炎症·肉芽肿性炎","green"],["2025N31A","类风湿小结中央坏死类型",["凝固性坏死","液化性坏死","纤维素样坏死","干酪样坏死"],"C","A","内科学",2025,"real","内科学|风湿免疫","类风湿小结的病理特征","类风湿小结为类风湿关节炎的特征性病变，中央为纤维素样坏死，周围为栅栏状排列的增生的类上皮样组织细胞与淋巴细胞。凝固性坏死见于缺血性梗死；液化性坏死见于脓肿与脑梗死；干酪样坏死为结核的典型改变，均与类风湿小结不符。","《病理学》第9版·免疫性疾病·类风湿关节炎","green"],["2025N32A","凋亡的形态学特征",["细胞固缩，细胞膜完整，膜可发泡成芽，形成凋亡小体","细胞肿胀，细胞膜及细胞器膜溶解破坏，细胞自溶","细胞肿胀，细胞膜完整，细胞器膜溶解消失，形成凋亡小体","细胞固缩，细胞器膜溶解消失，核碎裂，形成凋亡小体"],"A","A","病理学",2025,"real","病理学|细胞和组织的适应与损伤","凋亡与坏死鉴别","凋亡为单个细胞的主动性死亡，早期细胞固缩、胞质致密、染色质边集，细胞膜保持完整并呈泡状（发泡）出芽，脱落形成膜包被的凋亡小体，被邻近细胞或巨噬细胞吞噬清除，不引起炎症，故A正确。B描述细胞肿胀、膜与细胞器膜溶解破裂、自溶，是细胞坏死的特点；C、D均含“细胞器膜溶解消失”，为坏死的膜结构崩解特征，与凋亡时膜结构完整（含细胞器膜）相矛盾。","《病理学》第9版·细胞和组织的适应与损伤·凋亡","green"],["2025N33A","动脉瘤内血栓多见的类型是",["白色血栓","混合血栓","红色血栓","透明血栓"],"B","A","生物化学",2025,"real","生物化学|其他","血栓的类型与形成部位","动脉瘤腔内血流缓慢并形成涡流，血液在有病变的瘤壁内面逐层凝固，形成灰白与暗红相间的层状血栓，即混合血栓（头、体、尾分别对应白色、混合、红色血栓结构）。心瓣膜上形成白色血栓，静脉内血流淤滞形成红色血栓，DIC时微血管内为透明血栓。本题实际属病理学。","《病理学》第9版·局部血液循环障碍·血栓形成","green"],["2025N34A","炎症时的白细胞游出，通常发生的部位是",["毛细血管","细动脉","淋巴管","毛细血管后小静脉"],"D","A","生物化学",2025,"real","生物化学|其他","白细胞游出的部位","白细胞渗出包括边集、附壁、黏附、游出与趋化，游出部位主要是毛细血管后小静脉：此处管壁薄、血压较低、血流缓慢，内皮细胞可收缩使间隙增宽，便于白细胞穿出。毛细血管与细动脉血流快、压力高不利于游出；淋巴管不参与白细胞渗出过程。本题实际属病理学。","《病理学》 A","人文",2025,"real","人文|医患沟通","医患关系的特征","医患关系的特征包括：目的的共同性（共同对抗疾病）、利益的一致性、信息的不对称性（医学知识壁垒）、以及情感与道德上的特殊性。B「言辞的一致性」不是医患关系的特征——医患双方表述本就存在差异，医生需用通俗语言转换专业术语，恰恰要求「不一致」的表述方式。故 B 不属于，本题问「不属于」，选 B。⚠️注：本地记录答案为 A，但按教材表述，目的的共同性确属医患关系特征，B 才是真正不属于者；原答案存疑。","《医学伦理学》第5版·医患关系·医患关系的性质与特征","yellow"],["2025N110A","某护士为患者输液，由于血管太细，穿刺数次均未成功。该情况下，护士与患者最\n佳的沟通表达是",["默不作声，继续操作","“你的血管也太细了，真不好扎!”","“不好意思，再忍一下!”","“抱歉，给您增加痛苦了，再坚持一下!”"],"D","A","人文",2025,"real","人文|医患沟通","操作失败时的沟通表达","沟通的核心是先承认患者承受的痛苦，再请求配合。D 同时包含道歉（抱歉）、共情（给您增加痛苦了）与请求（再坚持一下），最完整。A 默不作声会让患者感到被物化；B 把原因归咎于患者血管（「你的血管也太细」），带有责备意味；C 只有道歉没有共情，且「再忍一下」偏命令式。区别 B 与 D 的关键是有无归因于患者。","《医患沟通学》·沟通技巧·共情与道歉","green"],["2025N111A","男性，45岁。因病入院治疗，患者不愿他人知道自己病情，要求护士在同事前来探\n访时暂时将其床头卡撤下。患者要求保护的权力是",["平等医疗权","疾病知情权","个人隐私权","社会责任权"],"C","A","内科学",2025,"real","内科学|其他","患者隐私权与病情保密","床头卡载有患者姓名、诊断等个人信息，患者不愿被同事知晓病情而要求暂时撤下，属对自身健康信息保密、控制传播范围的合理要求，体现个人隐私权受法律与伦理保护，医护人员应予尊重并采取替代标识（如仅写床号）以保障医疗安全。平等医疗权指同等获得诊疗服务的权利；疾病知情权是患者了解自身病情的权利；社会责任权与本题情境无关。","《医学伦理学》·医患关系·患者的权利","green"],["2025N112A","关于知情同意，下列理解不恰当的是",["知情同意书不单是具有法律效力的文件","知情同意包括提供必要信息和医疗建议","知情同意表明患者同意并授权进行干预","知情同意的主要出发点是避免患者诉讼"],"D","A","人文",2025,"real","人文|医学伦理","知情同意的本质与要素","知情同意的本质是尊重患者自主权，通过充分告知使患者在理解基础上自主决定。D 把出发点说成「避免诉讼」，将伦理要求降格为法律自保手段，方向错误，故选 D。A 正确——知情同意书兼具法律证据与伦理沟通双重属性，但不止于法律文件；B 正确——告知内容须包括病情、方案、风险与替代方案；C 正确——签署即表示授权实施该干预。","《医学伦理学》第5版·知情同意·知情同意的伦理基础","green"],["2025N113A","临床医疗中保密原则是一个重要的伦理原则，下列关于保密原则理解错误的是",["医生应确保患者的医疗信息不被披露","医生应保证仅经患者的授权才透露信息","医生应采取措施限制他人获取患者信息","医生应将保护患者的个人隐私作为义务"],"B","A","人文",2025,"real","人文|医学伦理","保密原则的例外情形","B 的错误在于把保密绝对化。保密原则有法定例外：传染病依法上报、涉及伤害他人或公共安全、司法调查取证、以及患者本人授权的情况下均可披露。因此「仅经患者授权才透露」不符合法律规定。A、C、D 均为保密原则的正当表述——不披露、限制获取、作为义务。记忆要点：保密是原则，不是绝对；四类例外（上报、公共安全、司法、授权）要能用出来。","《医学伦理学》第5版·医患关系·保密原则及例外","green"],["2025N114A","临床试验和临床医疗的性质不同，下列说法错误的是",["临床医疗的目的是解决个体患者的健康问题","临床试验的目的是获取可被普遍化的知识","临床试验中社会利益不可超越受试者的安康","临床试验凡受益大于风险都可以得到伦理辩护"],"D","A","人文",2025,"real","人文|医学伦理","临床试验与临床医疗的性质区别","D 错在把伦理辩护简化为「受益大于风险」的算式。临床试验的伦理正当性须同时满足：有科学价值与社会价值、风险最小化、风险与受益比合理、独立伦理审查、知情同意、受试者选择公平。单凭受益大于风险不足以辩护——若试验设计不科学（结论不可用），即便对个体有益也不具伦理正当性。A、B、C 均正确区分了临床医疗（个体利益）与临床试验（可普遍化知识）的性质。","《医学伦理学》第5版·人体试验伦理·临床试验的伦理原则","green"],["2025N115A","刘某，35岁。某医院主治医生，年度考核合格，因个人原因辞职，今欲往某民营机\n构执业，根据我国《医师法》相关规定，以下做法正确的是",["直接前往民营机构执业","前往准许注册医疗健康主管部门变更注册","前往指定医疗机构培训3～6月","前往指定医疗机构培训3～6月并考试合格"],"B","A","人文",2025,"real","人文|卫生法规","变更注册与重新注册的区别","《医师法》规定，医师变更执业地点、执业类别、执业范围等注册事项的，应当到准予注册的卫生健康主管部门办理变更注册手续。辞职后到民营机构执业属执业地点变更，须办理变更注册，故选 B。A 直接执业属超范围执业；C、D 的「培训3~6月」是《医师法》对中止执业活动满二年后重新申请执业者的要求，与本题情形无关。","《中华人民共和国医师法》·执业注册·变更注册与重新注册","green"],["2025N116B","呼吸频率加快，潮气量不变，动脉血气分析结果是",["血液pH升高，PaCO₂升高","血液pH降低，PaCO₂降低","血液pH升高，PaCO₂降低","血液pH降低，PaCO₂升高"],"C","B","外科学",2025,"real","外科学|其他","过度通气血气特点","呼吸频率加快而潮气量不变，每分通气量增加，CO₂排出增多使PaCO₂下降；CO₂为酸性气体，其减少导致pH升高，形成呼吸性碱中毒，即pH升高、PaCO₂降低。pH降低伴PaCO₂降低见于代谢性酸中毒的呼吸代偿；PaCO₂升高提示通气不足。","《病理生理学》第9版·酸碱平衡紊乱·呼吸性碱中毒","green"],["2025N117B","糖尿病酮症酸中毒，动脉血气分析结果是",["血液pH升高，PaCO₂升\n高","血液pH降低，\nPaCO₂降低","血液pH升高\n，PaCO₂降低","血液pH降\n低，PaCO₂升高"],"B","B","内科学",2025,"real","内科学|内分泌与代谢","DKA的血气分析特点","糖尿病酮症酸中毒时酮体（乙酰乙酸、β-羟丁酸）大量生成消耗碳酸氢根，形成高阴离子间隙代谢性酸中毒，故pH降低；酸性物质刺激呼吸中枢引起深大呼吸（Kussmaul呼吸），过度通气使PaCO₂代偿性降低，故为pH降低、PaCO₂降低。pH升高见于碱中毒；PaCO₂升高见于通气不足。","《内科学》第9版·内分泌与代谢疾病·糖尿病酮症酸中毒","green"],["2025N118B","帕金森病的中枢病变部位是",["脊髓丘脑","纹状体","黑质","脊髓小脑"],"C","B","内科学",2025,"real","内科学|神经系统","帕金森病的病变部位","帕金森病的主要病变在黑质致密部，多巴胺能神经元变性、丢失，使纹状体多巴胺递质减少、乙酰胆碱功能相对亢进，出现静止性震颤、肌强直、运动迟缓与姿势平衡障碍。纹状体是受累靶区而非原发部位；脊髓丘脑与脊髓小脑分别与感觉传导和共济失调相关。","《神经病学》第8版·运动障碍性疾病·帕金森病","green"],["2025N119B","意向性震颤的中枢病变部位是",["脊髓丘脑","纹状体","黑质","脊髓小脑"],"D","B","外科学",2025,"real","外科学|其他","意向性震颤定位","意向性震颤指肢体主动接近目标时震颤加重、静止时减轻，属小脑（脊髓小脑、新小脑）及小脑-红核-丘脑-皮质通路病变，因运动执行中不能及时校正误差。纹状体病变产生舞蹈样动作与肌张力降低；黑质病变产生静止性震颤（帕金森病）；脊髓丘脑束传导痛温觉，损害致对侧痛温觉障碍。","《神经病学》第8版·运动障碍·小脑性共济失调","green"],["2025N120B","被磷酸化修饰的常见氨基酸残基是",["半胱氨酸残基","丝氨酸残基","亮氨酸残基","甲硫氨酸残基"],"B","B","生物化学",2025,"real","生物化学|氨基酸代谢","磷酸化修饰的氨基酸残基","蛋白激酶催化的磷酸化主要发生在含羟基的丝氨酸、苏氨酸和酪氨酸残基上，其中丝氨酸与苏氨酸磷酸化最常见，由PKA、PKC、MAPK等催化，是可逆共价修饰调节。半胱氨酸靠巯基形成二硫键或构成活性中心，亮氨酸为支链疏水氨基酸，甲硫氨酸以S-腺苷甲硫氨酸形式参与甲基转移。","《生物化学与分子生物学》第9版·酶·酶的共价修饰调节","green"],["2025N121B","能形成二硫键的氨基酸残基是",["半胱氨酸残基","丝氨酸残基","亮氨酸残基","甲硫氨酸残基"],"A","B","生物化学",2025,"real","生物化学|蛋白质的结构与功能","二硫键与半胱氨酸","半胱氨酸含巯基（-SH），两个半胱氨酸残基的巯基氧化脱氢即形成二硫键（-S-S-），是维持蛋白质空间构象的重要共价交联，常见于分泌蛋白、膜蛋白的分子内或亚基间。丝氨酸含羟基、亮氨酸为支链疏水残基、甲硫氨酸含硫醚键，均不能形成二硫键。","《生物化学与分子生物学》第9版·蛋白质的结构与功能·蛋白质的一级结构","green"],["2025N122B","能够调节血红蛋白运氧功能的物质是",["2,3-DPG","ALA","MHb","NADPH"],"A","B","外科学",2025,"real","外科学|其他","2,3-DPG调节氧解离曲线","2,3-二磷酸甘油酸与脱氧血红蛋白结合，稳定T构象、降低血红蛋白对氧的亲和力，使氧解离曲线右移，促进组织释氧；其增多见于慢性缺氧、贫血。ALA为血红素合成中间产物；MHb为失去携氧能力的高铁血红蛋白；NADPH为还原当量，维持谷胱甘肽还原状态。","《生理学》第9版·呼吸·氧的运输","green"],["2025N123B","能够维持血红蛋白还原状态的物质是",["2,3-DPG","ALA","MHb","NADPH"],"D","B","外科学",2025,"real","外科学|其他","NADPH与红细胞抗氧化","红细胞内NADPH由磷酸戊糖途径（G6PD催化）生成，作为谷胱甘肽还原酶的辅酶使氧化型谷胱甘肽还原，从而保护血红蛋白二价铁及红细胞膜蛋白免受氧化损伤；G6PD缺乏时NADPH不足，遇氧化性药物即发生溶血。2,3-DPG调节氧亲和力，MHb是氧化产物，ALA是血红素合成前体。","《生物化学与分子生物学》第9版·血液生化·红细胞的代谢","green"],["2025N124B","瘢痕组织的常见变性是",["淀粉样变","脂肪变","玻璃样变","黏液样变"],"C","B","外科学",2025,"real","外科学|其他","瘢痕组织玻璃样变","瘢痕组织由致密胶原纤维构成，胶原纤维老化、相互融合，镜下呈均匀红染无结构的片状物质，即玻璃样变（透明变性），临床表现为瘢痕收缩、变硬。淀粉样变见于慢性炎症与浆细胞病；脂肪变为肝、心肌等实质细胞受累；黏液样变为结缔组织基质黏多糖蓄积，多见于间叶肿瘤。","《病理学》第9版·细胞和组织的适应与损伤·玻璃样变","green"],["2025N125B","高血压患者肾小球入球小动脉常见的变性是",["淀粉样变","脂肪变","玻璃样变","黏液样变"],"C","B","内科学",2025,"real","内科学|循环系统疾病","高血压肾细动脉玻璃样变","良性高血压早期细小动脉痉挛，随后管壁血浆蛋白渗入并使内皮细胞及平滑肌细胞分泌基质增多，入球小动脉发生玻璃样变（细动脉硬化），管腔狭窄致肾缺血、肾小球硬化。淀粉样变见于淀粉样变性病；脂肪变多见于肝细胞；黏液样变见于结缔组织变性。","《病理学》第9版·心血管系统疾病·高血压病","green"],["2025N126B","以肾小球毛细血管丛部分玻璃样变和硬化为基本病变的疾病是",["系膜增生性肾小球肾炎","局灶性节段性肾小球硬化","微小病变性肾小球病","膜性肾小球病"],"B","B","病理学",2025,"real","病理学|细胞和组织的适应与损伤","肾小球肾炎病理分型","局灶性节段性肾小球硬化（FSGS）的基本病变是部分肾小球（局灶）的某些血管袢（节段）发生硬化，光镜下见毛细血管丛节段性玻璃样变物质沉积、毛细血管腔闭塞、泡沫细胞聚集，免疫荧光见IgM、C3在硬化区团块状沉积，电镜见足突广泛融合，故选B。系膜增生性肾炎为系膜细胞及基质增生（A不符）；微小病变光镜基本正常（C不符）；膜性肾病为基底膜弥漫增厚伴钉突（D不符）。","《病理学》第9版·泌尿系统疾病·局灶性节段性肾小球硬化","green"],["2025N127B","光镜下肾小球基本正常，以肾小管上皮细胞内脂质沉积为基本病变的疾病是",["系膜增生性肾小球肾炎","局灶性节段性肾小球硬化","微小病变性肾小球病","膜性肾小球病"],"C","B","病理学",2025,"real","病理学|泌尿系统疾病","微小病变性肾小球病","微小病变性肾小球病的光镜下肾小球基本正常（无增生、无硬化、无基底膜增厚），病变主要位于近端肾小管：上皮细胞内大量脂质空泡（脂质沉积）及蛋白重吸收颗粒，故C正确。A为系膜增生性肾炎；B为局灶性节段性肾小球硬化；D为膜性肾小球病（基底膜增厚、钉突）。要点：该病电镜下足突弥漫融合，免疫荧光阴性，是儿童肾病综合征最常见病因。","《病理学》第9版·泌尿系统疾病·微小病变性肾小球病","green"],["2025N128B","以肺段或肺叶病变为主，但不发生空洞性病变的是",["肺炎链球菌肺炎","支原体肺炎","金黄色葡萄球菌肺炎","病毒性肺炎"],"A","B","外科学",2025,"real","外科学|其他","大叶性肺炎病理特点","肺炎链球菌肺炎属大叶性肺炎，病变累及肺段乃至整个肺叶，病理分充血水肿、红色与灰色肝样变、消散四期，肺泡内为纤维素性渗出，一般不发生组织坏死与空洞，治愈后结构恢复正常。金黄色葡萄球菌肺炎易形成脓肿与肺空洞（气囊肿）；克雷伯菌肺炎也可形成空洞；支原体与病毒性肺炎呈间质性炎症。","《病理学》第9版·呼吸系统·细菌性肺炎","green"],["2025N129B","以持久性阵发性剧咳为特点的肺炎",["肺炎链球菌肺炎","支原体肺炎","金黄色葡萄球菌肺炎","病毒性肺炎"],"B","B","内科学",2025,"real","内科学|呼吸系统疾病","支原体肺炎的临床特点","支原体肺炎的突出特点是起病较缓、持久而顽固的阵发性剧烈干咳，肺部体征轻而X线改变明显，可伴咽痛、耳痛、皮疹，血清支原体IgM或核酸检测可确诊。肺炎链球菌肺炎为寒战高热、铁锈色痰、肺实变；金黄色葡萄球菌肺炎起病急、脓血痰、易形成肺脓肿与肺气囊肿；病毒性肺炎症状较轻、以上呼吸道症状为主。","《内科学》第9版·呼吸系统疾病·肺炎","green"],["2025N130B","UC的临床特点",["腹痛、黏液脓血便、便后缓解","腹痛、果酱样便、便后缓解","腹痛、黏液脓血便、便后加重","腹痛、黏液便、便后缓解"],"A","B","外科学",2025,"real","外科学|其他","溃疡性结肠炎临床特点","溃疡性结肠炎病变自直肠起连续向近端蔓延，主要累及黏膜与黏膜下层，反复黏液脓血便，伴左下腹或下腹痉挛性疼痛，排便后腹痛缓解（便意-便后缓解规律），里急后重常见。果酱样便提示阿米巴痢疾或肠套叠；便后腹痛加重见于缺血性肠病；仅黏液便、无脓血更符合肠易激综合征。","《内科学》第9版·消化系统·炎症性肠病·溃疡性结肠炎","green"],["2025N131B","肠易激综合征的临床特点",["腹痛、黏液脓血便、便后缓解","腹痛、果酱样便、便后缓解","腹痛、黏液脓血便、便后加重","腹痛、黏液便、便后缓解"],"D","B","外科学",2025,"real","外科学|其他","肠易激综合征与IBD鉴别","肠易激综合征为功能性肠病，无器质性病变：反复腹痛伴排便习惯改变（腹泻或便秘或交替），粪便多为稀水或糊状、可有黏液但无脓血，排便后腹痛缓解，夜间不发作，全身状况良好。黏液脓血便提示溃疡性结肠炎或感染性结肠炎；果酱样便提示阿米巴痢疾。","《内科学》第9版·消化系统·肠易激综合征","green"],["2025N132B","急性胆囊炎腹痛的特点是",["转移性腹痛、上腹痛减轻或持续","右下腹部疼痛、向会阴部放射","转移性腹痛、上腹痛持续","右上腹部疼痛、向右肩背部放射"],"D","B","外科学",2025,"real","外科学|普通外科","胆囊炎腹痛特点","急性胆囊炎因胆囊内压升高、胆囊壁炎症刺激膈神经与腹腔神经丛，疼痛位于右上腹，呈持续性胀痛或绞痛，向右肩背部放射，常在饱餐或夜间发作，伴恶心呕吐、Murphy征阳性。转移性右下腹痛见于阑尾炎；突发刀割样痛伴板状腹见于穿孔；束带状痛见于胰腺炎。","《外科学》第9版·普通外科·胆道疾病·急性胆囊炎","green"],["2025N133B","十二指肠溃疡穿孔腹痛的特点是",["转移性腹痛、上腹痛减轻或持续","右下腹部疼痛、向会阴部放射","转移性腹痛、上腹痛持续","右上腹部疼痛、向右肩背部放射"],"C","B","外科学",2025,"real","外科学|其他","溃疡穿孔腹痛转移规律","十二指肠溃疡穿孔时胃肠内容物先刺激上腹腹膜，突发上腹剧痛；随后液体沿右结肠旁沟流至右下腹，疼痛转移并固定于右下腹，而上腹痛可减轻、持续存在，故呈现“转移性腹痛、上腹痛持续”，易与阑尾炎混淆。向右肩背放射提示胆囊疾病；向会阴放射提示输尿管结石。","《外科学》第9版·普通外科·胃十二指肠疾病·溃疡病穿孔","green"],["2025N134B","肝性脑病发生率最高的术式是",["门静脉-下腔静脉分流术","远端脾-肾静脉分流术","贲门周围血管离断术","单纯脾切除术"],"A","B","内科学",2025,"real","内科学|消化系统疾病","门体分流术式与肝性脑病","门静脉-下腔静脉分流术（完全性门体分流）使来自肠道的血氨、胺类等毒性物质绕过肝脏直接进入体循环，肝性脑病发生率最高，且易出现慢性复发性肝性脑病。远端脾-肾分流术为选择性分流，保留门静脉向肝血流，脑病少；贲门周围血管离断术不减少门体分流，脑病发生率低；单纯脾切除对门体分流影响更小。","《外科学》第9版·门静脉高压症·手术治疗","green"],["2025N135B","不减少入肝血流量的术式是",["门静脉-下腔静脉分流术","远端脾-肾静脉分流术","贲门周围血管离断术","单纯脾切除术"],"C","B","外科学",2025,"real","外科学|普通外科","断流术与分流术对入肝血流的影响","断流术（贲门周围血管离断术）切断胃底贲门周围曲张静脉同时保留胃左静脉主干与门静脉入肝血流，故不减少入肝血流量，术后肝性脑病发生率低，但再出血率稍高。门腔分流、远端脾肾分流均使门静脉血部分或全部分流，入肝血流减少；单纯脾切除虽降低门静脉压力与脾血回流，也减少门静脉血流。","《外科学》第9版·普通外科·门静脉高压症·手术方式选择","green"],["2025N136X","骨骼肌前负荷增加时，最有可能发生的结果是",["主动张力增加","被动张力增加","总张力增加","初长度增加"],"ABCD","X","外科学",2025,"real","外科学|其他","前负荷对骨骼肌张力的影响","前负荷增加即肌肉初长度增加（D），粗细肌丝有效重叠增加使主动张力增大（A）；同时被动牵张的弹性成分被拉长，被动张力亦上升（B）；主动与被动张力之和为总张力，随之增加（C）。故四项均成立。但需注意超过最适初长度后主动张力反而下降。","《生理学》第9版·肌肉收缩·前负荷与长度-张力关系","green"],["2025N137X","影响心肌收缩力的因素有",["前负荷","后负荷","胞外Ca²+浓度","自主神经活动"],"ABCD","X","外科学",2025,"real","外科学|其他","心肌收缩力影响因素","影响收缩力的因素包括：前负荷经异长自身调节改变收缩力大小；后负荷增加使收缩张力增大而缩短速度降低；胞外Ca²⁺浓度决定兴奋-收缩耦联时进入胞质的Ca²⁺量，直接改变收缩能力（等长调节）；交感与迷走神经通过儿茶酚胺、乙酰胆碱调节钙通道与肌钙蛋白磷酸化水平。四项均影响心肌收缩力。","《生理学》第9版·血液循环·心脏的泵血功能","green"],["2025N138X","缩胆囊素的生理功能有",["促进胰液中各种酶的分泌","促进胆管上皮分泌大量的水和HCO₃-","促进胆囊收缩，促使胆汁排出","对胰腺组织有营养作用"],"ACD","X","生理学",2025,"real","生理学|消化和吸收","缩胆囊素的生理作用","A 缩胆囊素（CCK）作用于胰腺腺泡细胞，促进胰液中各种消化酶分泌，并使酶蛋白合成增加，正确。B 促进胆管上皮分泌大量水和 HCO₃⁻ 的是促胰液素，CCK 主要作用于胆囊与胰腺腺泡、对导管分泌作用弱，故不选。C CCK 使胆囊平滑肌强烈收缩、同时舒张 Oddi 括约肌，促使胆汁排出，正确。D CCK 对胰腺外分泌组织有营养（促生长）作用，长期给予可致胰腺重量与蛋白含量增加，正确。故答案为 ACD。记忆要点：CCK—胆囊收缩＋胰酶；促胰液素—胰液量＋HCO₃⁻。","《生理学》第9版·消化和吸收·胃肠激素","green"],["2025N139X","可以减少肾小球滤过率的疾病有",["肾盂积水","高血压肾小动脉硬化","早期糖尿病","尿崩症"],"AB","X","生理学",2025,"real","生理学|尿的生成和排出","肾小球滤过率及其影响因素","A 肾盂积水时肾盂内压升高，逆向传导使肾小囊内压升高，有效滤过压降低、GFR 减少，选。B 高血压所致肾小动脉硬化使肾血管床减少、肾血流量与滤过面积减小，GFR 降低，选。C 早期糖尿病处于高滤过状态，血糖升高使肾血浆流量增加、滤过分数上升，GFR 反而增高，不选（晚期出现蛋白尿与硬化后 GFR 才下降）。D 尿崩症主要因 ADH 缺乏致水重吸收障碍、尿量剧增，GFR 可正常，长期严重失水才可能略降，不属“减少 GFR 的疾病”，不选。故答案为 AB。","《生理学》第9版·尿的生成和排出·肾小球滤过率的影响因素","green"],["2025N140X","腺垂体分泌的激素有",["催乳素","缩宫素","促甲状腺激素","促肾上腺皮质激素"],"ACD","X","生理学",2025,"real","生理学|内分泌","腺垂体激素的种类","腺垂体分泌的激素包括生长激素、催乳素、促甲状腺激素、促肾上腺皮质激素、卵泡刺激素和黄体生成素，故 A 催乳素、C TSH、D ACTH 均正确。B 缩宫素（催产素）由下丘脑视上核、室旁核的大细胞神经元合成，经轴浆运输至神经垂体贮存并释放，属神经垂体（而非腺垂体）激素，不选。同理血管加压素（ADH）亦为神经垂体激素。故答案为 ACD。腺垂体激素受下丘脑释放激素/释放抑制激素双重调节，构成下丘脑-腺垂体-靶腺轴。","《生理学》第9版·内分泌·腺垂体","green"],["2025N141X","睾酮的生理作用有",["促进血浆低密度脂蛋白合成","促进骨骺闭合","引起负氮平衡","参与人体的水和电解质平衡"],"ABD","X","外科学",2025,"real","外科学|其他","睾酮的生理作用","睾酮促进骨骺与长骨融合（B），促进肾小管对Na⁺、水重吸收而参与水电解质平衡（D），并影响脂代谢使血浆低密度脂蛋白升高、高密度脂蛋白降低（A）。它促进蛋白质合成，形成正氮平衡，故“引起负氮平衡”错误。","《生理学》第9版·内分泌·性腺与生殖","green"],["2025N142X","DNA变性后发生的理化性质改变有",["黏度降低","碱基对之间氢键断裂","密度增加","260nm吸光度增加"],"ABD","X","外科学",2025,"real","外科学|其他","DNA变性后的理化性质","DNA变性指双链间氢键断裂、解为单链的过程，随之出现一系列理化改变：氢键断裂使碱基外露、紫外吸收增强，产生增色效应（260nm吸光度升高）；链解聚后溶液黏度降低；结构由松散变为致密，浮力密度升高（约+0.015g/cm³）；旋光度下降。四项均属教材所述变性后的理化性质改变。","《生物化学与分子生物学》第9版·核酸的结构与功能·DNA的理化性质","green"],["2025N143X","花生四烯酸能够转化成的生物活性物质有",["前列腺素","血栓素","白三烯","泛素"],"ABC","X","外科学",2025,"real","外科学|泌尿外科","花生四烯酸代谢产物","花生四烯酸经环加氧酶（COX）生成前列腺素与血栓素A₂，经脂加氧酶（LOX）生成白三烯，三者在炎症、血小板聚集、支气管收缩中作用重要，故ABC正确。泛素是介导蛋白质降解的小分子蛋白，与花生四烯酸代谢无关。","《生物化学与分子生物学》第9版·脂质代谢·多不饱和脂肪酸衍生物","green"],["2025N145X","表观遗传修饰的种类有",["激酶磷酸化修饰","DNA甲基化修饰","RAS棕榈酰化修饰","组蛋白乙酰化修饰"],"BD","X","外科学",2025,"real","外科学|其他","表观遗传修饰类型","表观遗传指DNA序列不变而基因表达可遗传的改变，主要形式有DNA甲基化（如CpG岛甲基化抑制转录）与组蛋白共价修饰（乙酰化、甲基化、磷酸化等）。激酶磷酸化修饰属细胞信号转导的可逆蛋白磷酸化，RAS棕榈酰化属翻译后脂修饰，二者均非表观遗传调控方式。","《生物化学与分子生物学》第9版·基因表达调控·表观遗传","green"],["2025N146X","肝生物转化的第一相反应有哪些",["氧化反应","还原反应","水解反应","结合反应"],"ABC","X","外科学",2025,"real","外科学|其他","生物转化两相反应","肝生物转化第一相反应为氧化、还原、水解，主要借细胞色素P450等酶系引入或暴露极性基团，使脂溶性物质水溶性略增；第二相为结合反应，与葡萄糖醛酸、硫酸、乙酰基、甘氨酸等结合后彻底水溶、便于排出。故第一相为氧化、还原、水解。","《生物化学与分子生物学》第9版·肝的生物化学·生物转化","green"],["2025N147X","参与DNA重组过程的酶",["DNA连接酶","逆转录酶","RNA聚合酶","限制性核酸内切酶"],"ABD","X","生物化学",2025,"real","生物化学|RNA转录与翻译","重组DNA技术的工具酶","重组DNA技术必需限制性核酸内切酶切割DNA产生黏性末端、DNA连接酶封闭切口形成磷酸二酯键以构建重组体，故选A、D；逆转录酶用于由mRNA合成cDNA、构建cDNA文库及逆转录病毒载体系统，也参与重组过程，故选B。RNA聚合酶用于转录反应、制备RNA探针，不参与DNA片段的拼接重组，故不选C。","《生物化学与分子生物学》第9版·DNA重组与重组DNA技术·重组DNA技术常用工具酶","green"],["2025N148X","属于内分泌性萎缩的有",["老年女性，乳腺萎缩","阿尔兹海默症患者的大脑萎缩","脊髓神经损伤而导致的肌肉萎缩","垂体缺血坏死时，肾上腺皮质萎缩"]," ",2026,"real","生理学|细胞的基本功能","继发性主动转运","Na⁺-Ca²⁺ 交换体（NCX）属继发性主动转运：它并不直接水解 ATP，而是利用 Na⁺-K⁺-ATP 酶建立的跨膜 Na⁺ 浓度梯度，以 3Na⁺ 内流换 1Ca²⁺ 外排（生电性，净移入 1 个正电荷），属反向转运，故 B 正确。原发性主动转运是泵直接分解 ATP 供能（如钠泵、钙泵），A 错。经载体易化扩散为顺浓度梯度的被动过程，无能量来源，C 错。通道易化扩散经通道顺梯度转运离子、速度极快，D 错。所以 NCX 是依赖钠泵供能的“二次主动转运”。","《生理学》第9版·细胞的基本功能·跨膜物质转运","green"],["2026N3A","静息电位状态下，神经元细胞膜内的K⁺离子流出所依赖的是",["Na-K泵","非门控通道","化学门控通道","电门控通道"],"B","A","生理学",2026,"real","生理学|细胞的基本功能","静息电位的形成机制","静息电位主要由 K⁺ 经非门控钾通道（漏通道，如双孔钾通道）顺浓度梯度外流形成，膜对 K⁺ 通透性高、对 Na⁺ 通透性很低，膜电位接近 K⁺ 平衡电位，故 B 正确。Na⁺-K⁺ 泵维持 Na⁺、K⁺ 浓度梯度并生电（每次泵出 3Na⁺、泵入 2K⁺，使膜内更负），是静息电位形成的前提，但 K⁺ 外流的直接通道不是泵本身，A 错。化学门控通道（配体门控）在递质结合时开放，介导突触后电位，C 错。电门控通道在膜电位变化时开放，介导动作电位，D 错。故静息时 K⁺ 外流依赖非门控通道。","《生理学》第9版·细胞的基本功能·细胞的生物电现象","green"],["2026N4A","组成骨骼肌粗肌丝的是",["肌动蛋白","肌钙蛋白","肌球蛋白","原肌球蛋白"],"C","A","生理学",2026,"real","生理学|细胞的基本功能","肌丝滑行与肌管系统","骨骼肌肌原纤维中，粗肌丝由肌球蛋白（肌凝蛋白）分子聚合而成，其头部具有 ATP 酶活性并可形成横桥，故 C 正确。细肌丝由肌动蛋白（ actin）、原肌球蛋白和肌钙蛋白三种蛋白构成：肌动蛋白是横桥结合位点所在，A 错；原肌球蛋白位于肌动蛋白双螺旋沟槽内，静息时阻挡结合位点，D 错；肌钙蛋白含 TnC，可结合 Ca²⁺ 触发构型改变而暴露结合位点，B 错。故“粗肌丝—肌球蛋白、细肌丝—肌动蛋白＋原肌球蛋白＋肌钙蛋白”的对应关系是本题考点，也是兴奋-收缩耦联的结构基础。","《生理学》第9版·细胞的基本功能·肌细胞的收缩","green"],["2026N5A","促红细胞生成素的主要功能是",["促进晚期红细胞凋亡","促进晚期红系祖细胞增殖","促进网织红细胞增殖","促进肺循环内红细胞进入体循环"],"B","A","生理学",2026,"real","生理学|血液","红细胞生成的调节（EPO）","促红细胞生成素（EPO）主要由肾皮质肾小管周围间质细胞（肝可少量产生）分泌，作用于骨髓红系特异性祖细胞（CFU-E，即晚期红系祖细胞）的 EPO 受体，促进其增殖、分化并抑制凋亡，使网织红细胞与红细胞生成增加，故 B 正确。EPO 抑制而非促进红系细胞凋亡，A 错。网织红细胞已排出细胞核，不再增殖，C 错。EPO 不参与红细胞在肺循环与体循环之间的分布，D 错。慢性肾病、慢性缺氧（高原、贫血）通过 EPO 变化影响红细胞数量，是临床常用考点。","《生理学》第9版·血液·血细胞的生成与破坏","green"],["2026N6A","兴奋在心脏内传导速度最快的是",["心房优势传导通路","房室交界","心室肌","浦肯野纤维"],"D","A","生理学",2026,"real","生理学|血液循环","心内兴奋传导与房室延搁","心内兴奋传导速度以浦肯野纤维最快（约 4 m/s），其细胞粗大、缝隙连接丰富、0 期 Na⁺ 内流迅速，保证心室肌几乎同步收缩，故 D 正确。心房优势传导通路速度约 1.0～1.2 m/s，较快但慢于浦肯野纤维，A 错。房室交界速度最慢（约 0.02～0.05 m/s），形成房-室延搁，使心房收缩完毕后心室才收缩，B 错。心室肌约 0.3～1.0 m/s，明显慢于浦肯野纤维，C 错。传导速度的差异有重要生理意义：延搁保证充盈，快传导保证同步射血。","《生理学》第9版·血液循环·心脏的泵血功能","green"],["2026N7A","乙酰胆碱打开的通道是",["钾离子通道","钠离子通道","钙离子通道","氯离子通道"],"A","A","生理学",2026,"real","生理学|其他","乙酰胆碱与M受体","在心肌，ACh 作用于 M₂ 受体，经 Gᵢ 蛋白直接激活 GIRK 家族乙酰胆碱敏感性钾通道（IK-ACh），使 K⁺ 外流增加、膜超极化或复极加速，表现为窦房结自律性降低、心率减慢、房室传导减慢，故 A 正确。ACh 使 Ca²⁺ 通道磷酸化减少、Ca²⁺ 内流下降，而非开放钙通道，C 错。在骨骼肌终板，ACh 作用于 N₂ 受体打开的是对 Na⁺、K⁺ 均通透的阳离子通道（以 Na⁺ 内流为主），并非单纯钠通道，B 错。氯通道由 GABA_A 等受体开放，D 错。故按心肌 M 受体通路答钾通道。","《生理学》第9版·血液循环·心血管活动的神经调节","green"],["2026N8A","丝虫病组织水肿的原因",["血浆胶体渗透压降低","毛细血管通透性升高","毛细血管血压升高","淋巴管阻塞"],"D","A","生理学",2026,"real","生理学|血液","水肿的发生机制","丝虫病时丝虫成虫寄居于淋巴管、淋巴结内，引起淋巴管炎与淋巴管阻塞，淋巴回流受阻，组织液中的蛋白质与液体不能经淋巴返回血循环，组织液胶体渗透压升高、液体在组织间隙积聚形成水肿（晚期呈象皮肿），故 D 正确。血浆胶体渗透压降低见于肾病综合征、肝硬化等大量蛋白丢失或合成障碍，A 错。毛细血管通透性升高见于炎症、烧伤、过敏，B 错。毛细血管血压升高见于右心衰、静脉淤血或静脉受压，C 错。故本题关键在于识别“丝虫—淋巴管机械性阻塞”。","《生理学》第9版·血液循环·组织液的生成与淋巴回流","green"],["2026N9A","能使肺顺应性增加的疾病",["肺水肿","肺纤维化","新生儿呼吸窘迫综合征","肺气肿"],"D","A","生理学",2026,"real","生理学|其他","肺顺应性与弹性阻力","肺顺应性反映肺的扩张性，与弹性阻力成反比。肺气肿时肺泡壁弹性纤维破坏、肺弹性回缩力下降，弹性阻力减小，顺应性增大（并可出现动态肺顺应性随呼吸频率升高而下降），故 D 正确。肺水肿使肺组织含液量增加、表面张力与组织黏弹性阻力增大，顺应性下降，A 错。肺纤维化使肺组织僵硬、弹性阻力明显增大，顺应性显著降低，B 错。新生儿呼吸窘迫综合征因肺表面活性物质缺乏、肺泡表面张力过高，顺应性极低，C 错。故只有肺气肿使顺应性增大。","《生理学》第9版·呼吸·肺通气的阻力","green"],["2026N10A","可以保证胰脂肪酶发挥作用的物质是",["磷脂酶A2","辅脂酶","胆固醇脂酶","肠激酶"],"B","A","生物化学",2026,"real","生物化学|脂类代谢","辅脂酶的作用","胰脂肪酶作用于水-脂界面，必须与辅脂酶结合才能锚定在胆汁酸乳化的脂滴表面，防止被胆盐“挤走”而发挥最大活性；辅脂酶由胰液分泌，经胰蛋白酶水解激活。磷脂酶A₂水解磷脂，胆固醇酯酶水解胆固醇酯，肠激酶负责激活胰蛋白酶原，都不是保证脂肪酶作用的辅助蛋白。","《生物化学与分子生物学》第9版·脂类代谢·脂类的消化与吸收","green"],["2026N11A","肾小管髓祥升支细段通透性较高的物质是",["水","尿素","Na⁺","菊粉"],"C","A","生理学",2026,"real","生理学|尿的生成和排出","髓袢各段通透性与逆流倍增","髓袢升支细段的特点是：对水不通透，对 NaCl 通透性高，Na⁺、Cl⁻ 顺浓度梯度被动扩散至内髓组织液，使小管液渗透压逐渐降低，故 C 正确。此段对水几乎不通透（与升支粗段共同构成“稀释段”），A 错。升支细段对尿素通透性低，尿素主要在髓袢降支细段与内髓集合管被转运，B 错。菊粉可自由滤过但不被肾小管重吸收或分泌，是测定 GFR 的理想物质，其通过肾小管各段浓度不变，D 错。故升支细段“透盐不透水”。","《生理学》第9版·尿的生成和排出·各段肾小管的重吸收","green"],["2026N12A","可导致抗利尿激素分泌减少的因素是",["静脉滴注甘露醇","静脉滴注生理盐水","动脉血压低于正常","饮用大量清水"],"D","A","生理学",2026,"real","生理学|血液循环","抗利尿激素分泌的调节","ADH 释放主要受血浆晶体渗透压与循环血量的调节。饮用大量清水后，水吸收入血使血浆晶体渗透压降低，下丘脑渗透压感受器兴奋性下降，ADH 释放减少，肾集合管对水通透性下降，尿量增多（水利尿），故 D 正确。静脉滴注甘露醇使血浆渗透压升高，经渗透压感受器使 ADH 增多（同时渗透性利尿），A 错。静脉滴注生理盐水为等渗液，主要扩充血容量而不明显改变渗透压，ADH 可轻度减少，但效应远弱于清水；B 不作为最佳答案。动脉血压低于正常时，压力感受器传入减少、ADH 释放增加，C 错。","《生理学》第9版·尿的生成和排出·尿生成的调节","green"],["2026N13A","人在暗处视物时，视网膜上较多的物质是",["视紫红质","全反型视黄醛","11-顺反视黄醛","全反型视黄醇"],"A","A","生理学",2026,"real","生理学|感觉器官","视杆细胞的光化学反应","在暗处，视紫红质（由 11-顺视黄醛与视蛋白结合而成）在视杆细胞外段大量存在，是暗视觉的物质基础；光照使 11-顺视黄醛异构为全反型并逐步水解，视紫红质分解，故暗处含量最多的物质是视紫红质，A 正确。全反型视黄醛是全反型视黄醇/视黄醛在光照后的产物，暗处含量低，B 错。11-顺视黄醛作为生色团与视蛋白结合存在于视紫红质分子内部，单以“物质含量”计不如完整的视紫红质，且其游离量极少，C 错。全反型视黄醇需在色素上皮转变为 11-顺视黄醛后参与再合成，暗处不蓄积，D 错。","《生理学》第9版·感觉器官·视觉","green"],["2026N14A","成人大脑皮层处于紧张活动时，脑电波常见波形是",["α波","β波","θ波","δ波"],"B","A","生理学",2026,"real","生理学|神经系统","正常脑电图的基本波形","健康成人清醒、安静闭眼时以α波（8～13 Hz）为主；睁眼、思考问题或处于紧张活动时，α波被β波（14～30 Hz，低波幅快波）取代，称α波阻断，故 B 正确。θ波（4～7 Hz）多见于困倦、儿童或某些脑区情绪活动时，C 错。δ波（0.5～3 Hz）出现于深睡、婴儿及重度脑器质病变时，D 错。α波为闭眼安静状态下的优势节律，而非紧张活动时的表现，A 错。故脑电波是反映大脑皮层功能状态的指标，可用于判断睡眠分期与脑病变。","《生理学》第9版·神经系统·脑的高级功能","green"],["2026N15A","不通过升高血糖直接导致胰岛素增高的激素是",["促胃液素","促胰液素","缩胆囊素","抑胃肽"],"D","A","生理学",2026,"real","生理学|消化和吸收","抑胃肽与肠促胰岛素","抑胃肽（GIP）是第一个被确认的肠促胰岛素：进食后由小肠 K 细胞分泌，在生理浓度下即直接作用于胰岛 B 细胞 GIP 受体，以葡萄糖依赖性方式增强胰岛素分泌，其作用不依赖血糖升高，故 D 为“不通过升高血糖而直接使胰岛素增高”的激素。促胃液素、促胰液素、缩胆囊素在生理浓度下对胰岛素分泌影响很小，只有在大剂量（药理量）时才引起胰岛素升高，且多伴随血糖变化或通过升高血糖间接实现，故 A、B、C 不符合题意。GLP-1 与 GIP 同属肠促胰岛素，为本题的知识延伸。","《生理学》第9版·消化和吸收·胃肠激素","green"],["2026N16A","卵巢排卵前的哪个激素释放最多",["雌酮","雌二醇","雌三醇","孕激素"],"B","A","生理学",2026,"real","生理学|内分泌","月经周期中激素的变化","排卵前一日，成熟卵泡的颗粒细胞与卵泡膜细胞在 LH 峰作用下大量合成雌激素，血中雌二醇（E₂）出现排卵前高峰（其强度高于月经周期其它阶段），并正反馈触发 LH 峰、引发排卵，故 B 正确。雌酮（E₁）活性弱、部分由雌二醇在外周转化而来，绝经后相对成为主要雌激素，A 错。雌三醇（E₃）是雌二醇和雌酮的肝内代谢产物，妊娠期由胎盘大量产生，活性最弱，C 错。孕激素在排卵后才由黄体大量分泌，排卵前处于低水平，D 错。故排卵前最高的是雌二醇。","《生理学》第9版·内分泌·女性生殖功能","green"],["2026N17A","能引起靶细胞mRNA特异降解的双链小RNA分子是",["核小RNA","核仁小RNA","干扰小RNA","催化小RNA"],"C","A","生理学",2026,"real","生理学|其他","RNA干扰（siRNA/miRNA）","干扰小 RNA（siRNA）为外源性双链 RNA 经 Dicer 剪切成约 21～23 bp 的双链小分子，其引导链与靶 mRNA 完全互补配对，由 RISC 中的 Argonaute 2 切割靶 mRNA，实现序列特异性降解，故 C 正确。核小 RNA（snRNA）参与剪接体组装与 mRNA 前体剪接，A 错。核仁小 RNA（snoRNA）参与 rRNA 加工与修饰，B 错。催化小 RNA（核酶类小 RNA）具有催化活性而非介导 mRNA 特异降解，D 错。关键鉴别点为“双链、序列特异降解 mRNA”对应 siRNA。","《生物化学与分子生物学》第9版·RNA的生物合成·RNA干扰","green"],["2026N18A","能使酶表现Km值不变，Vmax降低的抑制性质是",["竞争性抑制","非竞争性抑制","反竞争性抑制","不可逆性抑制"],"B","A","生物化学",2026,"real","生物化学|酶","可逆性抑制的动力学特点","非竞争性抑制剂与酶活性中心以外的部位结合，不阻碍底物结合（Km不变），但形成的ESI三元复合物不能释出产物，相当于有效酶量减少、Vmax降低，故B正确。竞争性抑制Km增大而Vmax不变；反竞争性抑制只与ES结合，Km和Vmax同等降低；不可逆抑制也使Vmax下降，但属共价结合、不被透析去除，不能仅凭动力学参数判定。","《生物化学与分子生物学》第9版·酶·抑制剂对酶促反应的影响","green"],["2026N19A","肌糖原不能转化为葡萄糖的原因是",["缺乏糖原磷酸化酶","缺乏葡萄糖-6-磷酸酶","缺乏葡萄糖激酶","缺乏脱支酶"],"B","A","生物化学",2026,"real","生物化学|酶","肌糖原不能释出葡萄糖的原因","肌糖原分解经磷酸化酶生成葡萄糖-1-磷酸，再转为葡萄糖-6-磷酸后即进入糖酵解供能；肌肉缺乏葡萄糖-6-磷酸酶，不能将其水解脱磷酸生成游离葡萄糖，故肌糖原不能直接补充血糖。肌组织具备糖原磷酸化酶、己糖激酶和脱支酶；葡萄糖-6-磷酸酶仅存在于肝和肾，是糖异生的关键酶。","《生物化学与分子生物学》第9版·糖代谢·糖原的合成与分解","green"],["2026N20A","ATP合酶由F₁和F₀组成，其中F₀的含义是",["首先发现的氧化磷酸化因子","ATP合成的部位","寡霉素结合部位","递氢递电子体"],"C","A","生物化学",2026,"real","生物化学|糖代谢","ATP合酶F₀与F₁的功能","F₀是嵌于线粒体内膜的疏水蛋白，构成质子回流通道，也是寡霉素的结合（抑制）部位，故C正确。F₁伸向基质，由α₃β₃γδε组成，含ATP合成/水解的催化位点。其命名来自氧化磷酸化因子（factor），不能说F₀是“首先发现的因子”；F₀本身不递氢递电子，递电子由呼吸链复合体完成。","《生物化学与分子生物学》第9版·生物氧化·ATP合酶","green"],["2026N21A","关于组氨酸正确的是",["分子结构中含有苯环","代谢障碍可产生一碳单位","活性形式可作为甲基供体","代谢障碍可引起白化病"],"B","A","生理学",2026,"real","生理学|其他","一碳单位代谢","组氨酸为半必需碱性氨基酸，其分解代谢在体内可产生一碳单位：组氨酸经脱氨、咪唑环开环后生成亚氨甲基谷氨酸，再释放甲酰基（N⁵-甲酰 FH₄），故 B 正确，且组氨酸是体内一碳单位的来源之一。A 错：组氨酸侧链含咪唑环，不含苯环（含苯环的是苯丙氨酸、酪氨酸、色氨酸）。C 错：活性甲基供体是 S-腺苷甲硫氨酸（SAM），其前体为甲硫氨酸，与组氨酸无关。D 错：白化病为酪氨酸酶缺陷致黑色素合成障碍。故组氨酸的代谢特点与一碳单位、组胺生成相关。","《生物化学与分子生物学》第9版·氨基酸代谢·一碳单位的代谢","green"],["2026N22A","能够催化RNA链3'末端和NTP形成磷酸二酯键的酶是",["DNA聚合酶","逆转录酶","连接酶","引物酶"],"D","A","生物化学",2026,"real","生物化学|DNA复制与修复","引物酶与磷酸二酯键的形成","引物酶（真核DNA聚合酶α兼具引物酶活性）以DNA单链为模板、以游离核糖核苷三磷酸（NTP）为底物，催化NTP的α-磷酸与RNA链3′-OH之间形成3′,5′-磷酸二酯键，从而合成RNA引物，故D正确。DNA聚合酶用dNTP，逆转录酶以RNA为模板合成DNA，连接酶只连接两个已存在的末端，不引入新的核苷酸。","《生物化学与分子生物学》第9版·DNA的复制·复制的起始与引物合成","green"],["2026N23A","端粒酶RNA具有的特点是",["自身具有转录模板的功能","具有特定启动子结构","属于催化性RNA","新发现的小RNA分子"],"A","A","生物化学",2026,"real","生物化学|RNA转录与翻译","端粒酶的RNA模板功能","端粒酶是核糖核蛋白复合物，其RNA组分含与端粒重复序列（人TTAGGG）互补的模板，可反复拷贝以延长端粒DNA的3′端，故A正确。该RNA不含启动子结构，也不被转录；端粒酶催化（逆转录酶）活性由蛋白质亚基TERT承担，RNA本身不是核酶，故C错；端粒酶发现已久，不是新发现的小RNA分子。","《生物化学与分子生物学》第9版·DNA的复制·端粒与端粒酶","green"],["2026N24A","密码子第3位碱基与反密码子第1位碱基不严格配对的特点是",["密码子的连续性","密码子的简并性","密码子的摆动性","密码子的通用性"],"C","A","生物化学",2026,"real","生物化学|RNA转录与翻译","密码子的摆动性","密码子第3位碱基与反密码子第1位碱基配对不严格，称摆动性，使一种tRNA可识别同一氨基酸的多个同义密码子，这是遗传密码简并性在翻译水平的表现。连续性指密码子按三个碱基连续阅读、无重叠无间隔；简并性指一种氨基酸对应多个密码子；通用性指密码表在生物界基本一致，三者均与配对宽松无关。","《生物化学与分子生物学》第9版·蛋白质的合成·遗传密码的特点","green"],["2026N25A","基因启动子CpG岛高度甲基化可导致的结果是",["DNA聚合酶活性改变","沉默子失去作用","转录受到抑制","肽链合成不成熟"],"C","A","生理学",2026,"real","生理学|其他","DNA甲基化与基因表达调控","基因启动子区 CpG 岛高度甲基化（5-甲基胞嘧啶增多）后，一方面直接阻碍转录因子与启动子结合，另一方面招募甲基化结合蛋白与组蛋白去乙酰化酶，使染色质结构致密、转录活性下降，导致该基因沉默（如抑癌基因沉默促癌），故 C 正确。甲基化不改变 DNA 聚合酶活性，DNA 复制照常进行，A 错。沉默子是被抑制性转录因子结合而抑制转录的元件，CpG 甲基化不使其失去作用，B 错。甲基化调控的是转录水平而非翻译，不产生“肽链合成不成熟”，D 错。表观遗传修饰的特点是不改变碱基序列而改变表达。","《生物化学与分子生物学》第9版·真核基因表达调控·表观遗传","green"],["2026N26A","可作为G蛋白偶联受体配体的是",["肾上腺素","甲状腺激素","生长因子","维甲酸"],"A","A","生物化学",2026,"real","生物化学|其他","G蛋白偶联受体的配体","肾上腺素为水溶性儿茶酚胺，不能自由过膜，需与膜上α、β肾上腺素能受体（G蛋白偶联受体）结合，经cAMP、IP₃/DAG等第二信使转导信号，故A正确。甲状腺激素与维甲酸为脂溶性，进入细胞与核受体结合调控基因转录；生长因子（如EGF）结合受体型酪氨酸激酶。","《生物化学与分子生物学》第9版·细胞信号转导·受体与配体","green"],["2026N27A","属于肝生物转化第二相反应的是",["酰基水杨酸酶水解成水杨酸","乙醇氧化成乙醛","苯酚转化成苯β-葡萄糖醛酸","硝基苯还原成亚硝基苯"],"C","A","生物化学",2026,"real","生物化学|酶","生物转化的两相反应","第二相反应即结合反应，需由结合基团供体提供葡萄糖醛酸、硫酸、谷胱甘肽、乙酰基、甲基等。苯酚转化为苯-β-葡萄糖醛酸苷是典型的葡萄糖醛酸结合，故C正确；乙酰水杨酸脱乙酰基属水解，乙醇氧化成乙醛属氧化，硝基苯还原为亚硝基苯属还原，三者均为第一相反应。","《生物化学与分子生物学》第9版·肝的生物化学·生物转化","green"],["2026N28A","影响血红蛋白合成的主要因素是",["ALA合酶活性调节","清蛋白结构改变","维生素B₆的缺乏","2,3-BPG与血红蛋白结合"],"A","A","生物化学",2026,"real","生物化学|酶","ALA合酶的调节","血红素合成限速酶ALA合酶的活性是血红蛋白合成的首要调节因素：血红素本身反馈抑制ALA合酶，而血红素又能促进珠蛋白mRNA翻译，故A正确。维生素B₆是ALA合酶的辅基，缺乏时会影响酶活性但属条件性因素；清蛋白属血浆蛋白与血红蛋白合成无关，2,3-BPG影响血红蛋白的氧亲和力而非合成。","《生物化学与分子生物学》第9版·血液的生物化学·血红素合成的调节","green"],["2026N29A","脓肿病变组织的坏死类型属于",["凝固性坏死","液化性坏死","纤维蛋白样坏死","脂肪坏死"],"B","A","病理学",2026,"real","病理学|细胞和组织的适应与损伤","坏死的类型","脓肿是局限性化脓性炎，金葡菌等产生蛋白水解酶使坏死组织迅速溶解液化，形成含脓液的囊腔，故其坏死类型为液化性坏死，选B。凝固性坏死见于心、肾、脾等实质器官的缺血性梗死，坏死组织保持轮廓（A不符）；纤维蛋白样坏死见于风湿病、系统性红斑狼疮等结缔组织病及恶性高血压的血管壁（C不符）；脂肪坏死见于急性胰腺炎及乳腺外伤，为酶性或外伤性脂肪坏死（D不符）。","《病理学》第9版·细胞和组织的适应与损伤·坏死","green"],["2026N30A","关于凋亡的叙述，正确的是",["意外事故性细胞死亡","由严重病理性刺激因子诱导发生","无新蛋白合成","不引起周围组织炎症反应"],"D","A","病理学",2026,"real","病理学|细胞和组织的适应与损伤","凋亡与坏死鉴别","凋亡是基因调控的程序性细胞死亡，细胞膜完整、形成凋亡小体后被吞噬清除，内容物不外溢，故不引起周围组织炎症反应，D正确。A“意外事故性细胞死亡”、B“严重病理性刺激因子诱导”描述的是坏死的被动性、病理性特征；C错在凋亡需启动凋亡相关基因、合成新蛋白（如BAX、caspase），属主动耗能的程序性过程，而非无新蛋白合成。","《病理学》第9版·细胞和组织的适应与损伤·凋亡","green"],["2026N31A","易引起肺褐色硬化的病变是",["大叶性肺炎","小叶性肺炎","间质性肺炎","慢性肺淤血"],"D","A","生物化学",2026,"real","生物化学|其他","肺褐色硬化","慢性肺淤血时肺泡壁毛细血管扩张充血、肺泡腔内有水肿液及吞噬含铁血黄素的心衰细胞；长期淤血导致肺泡隔纤维组织增生、含铁血黄素广泛沉着，肺呈棕褐色、质地变硬，即肺褐色硬化。大叶性肺炎是纤维素性炎、小叶性肺炎是化脓性炎、间质性肺炎以间质炎症为主，均不形成该改变。本题实际属病理学。","《病理学》第9版·局部血液循环障碍·慢性肺淤血","green"],["2026N32A","对缺血最耐受的细胞",["神经元细胞","心肌细胞","平滑肌细胞","纤维细胞"],"D","A","生物化学",2026,"real","生物化学|其他","细胞对缺氧的耐受性","各细胞对缺氧耐受性差异显著：神经元最敏感，缺血数分钟即发生不可逆损伤；其次为心肌细胞、肝细胞；平滑肌耐受性较强；纤维细胞（成纤维细胞）耐受性最强，缺血后仍可存活并参与肉芽组织机化修复，故D正确。本题实际属病理学。","《病理学》第9版·细胞和组织的适应与损伤·损伤的机制","green"],["2026N33A","丰乳术的填充物引起的炎症类型是",["浆液性炎","纤维蛋白性炎","肉芽肿性炎","化脓性炎"],"C","A","生物化学",2026,"real","生物化学|其他","异物性肉芽肿","丰乳术填充物（硅胶、聚丙烯酰胺水凝胶等）为不可降解异物，不能被巨噬细胞消化，长期刺激下巨噬细胞转化为上皮样细胞、融合成多核异物巨细胞，外围纤维组织包绕，形成异物性肉芽肿，故为肉芽肿性炎。浆液性炎与纤维蛋白性炎属渗出性炎，化脓性炎由化脓菌引起并有脓液形成。本题实际属病理学。","《病理学》第9版·炎症·慢性炎症与肉芽肿性炎","green"],["2026N34A","肺心病的心脏肉眼表现",["心室壁增厚，室间隔厚度大于左心室游离壁","心室壁增厚，室间隔厚度小于左心室游离壁","心房壁增厚，房间隔厚度大于左心房游离壁","心房壁增厚，房间隔厚度小于左心房游离壁"],"B","A","生物化学",2026,"real","生物化学|其他","肺心病的心脏病理改变","肺心病时肺动脉压持续升高使右心室后负荷增加，右心室壁肥厚（常＞5mm）伴右心室、右心房扩张；但左室游离壁厚约1.0~1.2cm，仍厚于增厚的右室壁，室间隔亦未超过左室游离壁厚度，故B正确。A、C、D将病变归为左心或心房壁增厚，并把室间隔与左室游离壁厚度关系说反，均不符合。本题实际属病理学。","《病理学》第9版·呼吸系统疾病·慢性肺源性心脏病","green"],["2026N35A","支原体肺炎的肉眼病理变化的特点是？",["累及一侧肺，红色，有实变","累及一侧肺，灰色，无实变","累及双侧肺，红色，无实变","累及双侧肺，灰色，无实变"],"B","A","病理学",2026,"real","病理学|呼吸系统疾病","间质性肺炎与病毒性肺炎","支原体肺炎属间质性肺炎，病变自支气管、细支气管沿间质蔓延，多累及一侧肺（常为下叶），肺组织充血呈暗灰红色但肺泡腔内无大量纤维素与中性粒细胞渗出，故实变不明显，肉眼观无肝样变，按“单侧受累+无明显实变”定位则以B最贴近。A为红色肝样变期的大叶性肺炎，C、D的双侧受累多见病毒性肺炎且均有实变或渗出。⚠️原答案存疑：教材描述支原体肺炎的肺组织多呈暗红色（而非灰色），若严格按颜色判断，本例选项与经典描述存在偏差，建议核对原题。","《病理学》第9版·呼吸系统疾病·支原体肺炎","yellow"],["2026N36A","肝细胞碎片状坏死指的是什么",["肝小叶任何部位肝细胞灶状坏死","肝小叶周围界板肝细胞灶状坏死","肝小叶中央静脉周围肝细胞灶状坏死","两个中央静脉之间出现坏死带"],"B","A","病理学",2026,"real","病理学|细胞和组织的适应与损伤","病毒性肝炎基本病变","碎片状坏死指肝小叶周边界板处肝细胞呈灶状、连续性坏死，伴炎细胞浸润，并突破界板向小叶内推进，故B正确。A“小叶任何部位灶状坏死”实为点状坏死，范围小、不限于界板；C“中央静脉周围灶状坏死”为中央静脉周围坏死（多见于缺血、淤血或药物损伤）；D“两个中央静脉之间坏死带”为桥接坏死的一种形式，见于中重度慢性肝炎。要点：碎片状坏死是判断慢性肝炎活动度的关键指标。","《病理学》第9版·消化系统疾病·病毒性肝炎","green"],["2026N37A","弥漫性毒性甲状腺肿的组织改变是",["滤泡上皮增生，胶质稀薄，间质淋巴组织增生","滤泡上皮细胞局灶性增生或萎缩性改变，间质纤维化","部分滤泡上皮破坏，胶质外溢，肉芽肿形成","甲状腺间质大量淋巴细胞和嗜酸性细胞浸润"],"A","A","生物化学",2026,"real","生物化学|其他","Graves病的组织学改变","Graves病镜下三特征：滤泡上皮增生呈高柱状并向腔内形成乳头、滤泡内胶质稀薄且边缘出现吸收空泡、间质淋巴组织增生可形成淋巴滤泡伴生发中心，故选A。B见于结节性甲状腺肿等增生与萎缩混杂并纤维化者；C为亚急性肉芽肿性甲状腺炎；D为桥本甲状腺炎的特点。本题实际属病理学。","《病理学》第9版·内分泌系统疾病·弥漫性毒性甲状腺肿","green"],["2026N38A","小细胞肺癌呈阴性表达的免疫组化标志物",["神经元特异性烯醇化酶(NSE)","嗜铬粒蛋白A(Cga)","突触素(Cyn)","结蛋白(desmin)"],"D","A","生物化学",2026,"real","生物化学|酶","小细胞肺癌的免疫组化标志","小细胞肺癌起源于神经内分泌细胞，免疫组化常表达NSE、嗜铬粒蛋白A、突触素等神经内分泌标志，故A、B、C均为阳性。结蛋白（desmin）是肌源性分化的标志，用于横纹肌肉瘤、平滑肌肉瘤等诊断，小细胞癌不表达，故D为阴性标志物。本题实际属病理学。","《病理学》第9版·呼吸系统疾病·肺癌","green"],["2026N39A","二型糖尿病的胰岛的病理变化",["玻璃样变性","黏液样变性","淀粉样变性","脂肪变性"],"C","A","病理学",2026,"real","病理学|细胞和组织的适应与损伤","糖尿病病理改变","2型糖尿病胰岛的病理改变以胰岛淀粉样变性为特征：β细胞分泌的胰岛淀粉样多肽（IAPP/amylin）在胰岛内沉积，形成均质红染的淀粉样物，压迫破坏β细胞，致胰岛素分泌不足，故C正确。玻璃样变性多见于高血压、糖尿病时的小动脉壁（A不符）；黏液样变性见于风湿病心肌间质、甲状腺功能低下组织（B不符）；脂肪变性主要见于肝、心、肾，胰岛少见（D不符）。1型糖尿病则以胰岛炎、β细胞减少为主。","《病理学》第9版·内分泌系统疾病·糖尿病","green"],["2026N40A","急性细菌性痢疾在肠道上的病理变化",["纤维蛋白性炎","出血性炎","化脓性炎","肉芽肿性炎"],"A","A","病理学",2026,"real","病理学|炎症","假膜性炎与细菌性痢疾","急性细菌性痢疾为假膜性炎，属纤维素性炎：痢疾杆菌内毒素使肠黏膜上皮坏死、血管通透性增高，大量纤维素与中性粒细胞渗出，与坏死组织、红细胞共同形成灰白色假膜，假膜脱落后形成地图状浅溃疡，故选A。出血性炎见于流行性出血热、钩端螺旋体病（B不符）；化脓性炎以中性粒细胞渗出、组织液化为主，如阑尾炎、脓肿（C不符）；肉芽肿性炎见于结核、伤寒等，为慢性增生性病变（D不符）。","《病理学》第9版·传染病与寄生虫病·细菌性痢疾","green"],["2026N41A","典型心脏压塞的Beck三联征是",["低血压、呼吸困难、心力衰竭","低血压、心音低钝、颈静脉怒张","心音低钝、心前区疼痛、心力衰竭","心前区疼痛、低血压、颈静脉怒张"],"B","A","生物化学",2026,"real","生物化学|其他","Beck三联征","心脏压塞时心包腔内压升高，心室舒张充盈受限、每搏量减少，出现血压下降甚至休克；体循环回流受阻致颈静脉怒张、Kussmaul征；心搏量减少及心包积液隔音使心音低钝遥远。三者合称Beck三联征。呼吸困难、心前区疼痛、心力衰竭均不属该三联征。本题实际属内科学。","《内科学》第9版·循环系统疾病·心包疾病","green"],["2026N42A","下列心电图最可能的诊断是(是一张图，心电图图样：V2-V4下移，Ⅲ导联轻度抬高)",["陈旧性下壁心肌梗死","预激综合征","左心室肥厚","心肌缺血"],"B","A","生物化学",2026,"real","生物化学|其他","心肌缺血的心电图定位","按题干描述V₂~V₄导联ST段下移、Ⅲ导联轻度抬高，符合前壁心内膜下缺血／非ST段抬高型心肌缺血的改变，选D更合理。预激综合征须见δ波、PR间期缩短与QRS增宽，不能仅凭ST-T "B","内科学",2026,"real","内科学|消化系统疾病","急性胰腺炎的Atlanta分类","按2012年修订的Atlanta分类，中度重症急性胰腺炎指存在短暂性器官衰竭（48小时内可恢复）和/或局部并发症（无菌性坏死、急性液体积聚、假性囊肿、胃出口梗阻等），病死率明显低于重度。轻度无器官衰竭及局部并发症；重度为器官衰竭持续超过48小时；危重为器官衰竭持续不缓解并叠加感染性坏死。","《内科学》第9版·消化系统疾病·急性胰腺炎","green"],["2026N131B","器官衰竭后48小时不恢复和感染性胰腺坏死的急性胰腺炎",["轻度急性胰腺炎","中度重症急性胰腺炎","重度重症急性胰腺炎","危重重症急性胰腺炎"],"D","B","内科学",2026,"real","内科学|消化系统疾病","重症急性胰腺炎的分层（重度与危重）","器官衰竭持续超过48小时不恢复并合并感染性胰腺坏死，属病情最重的极端类型，全身炎症反应、脓毒症与多器官衰竭叠加，病死率高，本题按细分层归为危重重症急性胰腺炎。⚠️按经典修订Atlanta分类，器官衰竭持续>48小时即为重度（severe）急性胰腺炎，\"危重（critical）\"系国内共识在重度基础上叠加感染性坏死的细化，若仅按Atlanta标准应选重度。","《内科学》第9版·消化系统疾病·急性胰腺炎","yellow"],["2026N132B","胆囊颈结石嵌顿的腹痛特点",["突发上腹部持续性刀割样痛，查体呈板状腹","突发上腹部阵发性钻顶样剧痛，间歇期无痛","突发上腹部持续性绞痛，阵发性加重向右肩部放射","突发上腹部持续性剧烈疼痛，呈束带状向腰背部放射"],"C","B","外科学",2026,"real","外科学|普通外科","胆绞痛特点","胆囊颈或胆囊管结石嵌顿使胆囊内压急剧升高、胆囊强力收缩，表现为突发上腹或右上腹持续性绞痛、阵发性加剧、向右肩背部放射，伴恶心呕吐，即胆绞痛。钻顶样痛间歇期完全无痛见于胆道蛔虫；刀割样痛伴板状腹见于溃疡穿孔；束带状向腰背放射见于急性胰腺炎。","《外科学》第9版·普通外科·胆道疾病·胆囊结石","green"],["2026N133B","上消化道穿孔的腹痛特点",["突发上腹部持续性刀割样痛，查体呈板状腹","突发上腹部阵发性钻顶样剧痛，间歇期无痛","突发上腹部持续性绞痛，阵发性加重向右肩部放射","突发上腹部持续性剧烈疼痛，呈束带状向腰背部放射"],"A","B","外科学",2026,"real","外科学|其他","上消化道穿孔腹痛特点","上消化道穿孔时胃酸、胆汁等强烈化学刺激迅速导致弥漫性腹膜炎：突发上腹持续性刀割样剧痛、迅速波及全腹，腹肌呈板状强直、压痛反跳痛明显，肝浊音界缩小或消失、膈下游离气体。持续性绞痛向右肩放射为胆绞痛；钻顶样痛为胆道蛔虫；束带状痛为胰腺炎。","《外科学》第9版·普通外科·胃十二指肠疾病·溃疡急性穿孔","green"],["2026N134B","甲状腺乳头状瘤基本治疗",["TSH抑制","外放射治疗","放射性核素治疗","手术治疗"],"D","B","外科学",2026,"real","外科学|普通外科","乳头状癌基本治疗","甲状腺乳头状癌（题目“乳头状瘤”为笔误）恶性度低、以淋巴道转移为主，基本治疗为手术：据肿瘤大小、部位与淋巴结情况行患侧腺叶加峡部切除或双侧腺叶全切，并清扫中央区（Ⅵ区）淋巴结；术后予TSH抑制治疗，高危者加¹³¹I清甲。外放射不属首选，放射性核素治疗只作为术后辅助。","《外科学》第9版·普通外科·甲状腺疾病·甲状腺癌治疗","green"],["2026N135B","甲状腺未分化癌治疗基本方式",["TSH抑制","外放射治疗","放射性核素治疗","手术治疗"],"C","B","外科学",2026,"real","外科学|普通外科","未分化癌治疗原则","甲状腺未分化癌多见于老年人，生长极快、恶性度极高，多数就诊时已广泛侵犯气管、食管、喉返神经及颈部软组织而无法根治切除。治疗以外放射治疗为主，可辅以手术减瘤与化疗；未分化癌细胞已失去摄碘功能，放射性核素治疗无效，TSH抑制亦无意义。⚠️原答案存疑：本题原答案选“放射性核素治疗”，与教材（未分化癌以外放射治疗为主、不摄碘故核素无效）相悖，正确项应为B外放射治疗。","《外科学》第9版·普通外科·甲状腺疾病·甲状腺未分化癌","yellow"],["2026N136X","可使心肌收缩能力升高的",["前负荷增加","甲状腺激素分泌增加","儿茶酚胺分泌增加","血钙浓度降低"],"BC","X","外科学",2026,"real","外科学|普通外科","心肌收缩能力的等长调节","心肌收缩能力指不依赖前后负荷而改变收缩效能的内在特性（等长调节）：甲状腺激素提高心肌代谢率、上调β受体与肌浆网钙泵，使收缩力增强；儿茶酚胺经β₁受体增加钙内流与肌钙蛋白磷酸化，收缩力增强。前负荷增加属异长自身调节，改变的是搏出量而非收缩能力；血钙降低使兴奋-收缩耦联减弱、收缩力下降。","《生理学》第9版·血液循环·影响心输出量的因素","green"],["2026N137X","血红蛋白氧饱和度降低的有",["人处在高原环境中","动脉血PCO₂升高","缺铁性贫血","动脉血pH升高"],"ABC","X","外科学",2026,"real","外科学|其他","影响血红蛋白氧饱和度的因素","血红蛋白氧饱和度取决于PaO₂与氧解离曲线的位置。高原环境吸入气氧分压降低，PaO₂下降使饱和度下降；PaCO₂升高经Bohr效应使曲线右移、同一PaO₂下饱和度降低。动脉血pH升高使曲线左移、饱和度略升高。⚠️原答案存疑：缺铁性贫血时血红蛋白总量减少，氧容量与氧含量下降，但PaO₂与氧饱和度均正常，故C不应入选，正确项应为AB。","《生理学》第9版·呼吸·氧的运输与氧解离曲线","yellow"],["2026N138X","促进胰液分泌的因素有",["促胰液素分泌增加","缩胆囊素分泌增加","促胃液素分泌增加","小肠内盐酸浓度增加"],"ABCD","X","生理学",2026,"real","生理学|消化和吸收","胰液分泌的调节","A 促胰液素增加：作用于胰腺导管上皮，促水和 HCO₃⁻ 大量分泌，选。B 缩胆囊素增加：作用于腺泡细胞，促胰酶分泌并增强其营养价值，选。C 促胃液素增加：可直接刺激胰腺腺泡（主要为酶）分泌，并促胃酸分泌间接促胰液素释放，故亦促进胰液分泌，选。D 小肠内盐酸浓度增加：酸性食糜刺激 S 细胞和 I 细胞释放促胰液素与缩胆囊素，并可直接刺激胰腺，是生理性胰液分泌的主要刺激，选。故 ABCD 全选。胰液分泌的头期、胃期、肠期均涉及神经与激素共同参与。","《生理学》第9版·消化和吸收·胰液分泌的调节","green"],["2026N139X","人平衡感觉相关的生理现象",["毛细胞电位","前庭姿势反射","半规管内淋巴活动","耳蜗微音器电位"],"ABC","X","外科学",2026,"real","外科学|其他","前庭器官与平衡觉","平衡觉由前庭器官介导：半规管壶腹嵴毛细胞在淋巴液流动（内淋巴随头转动冲击壶腹嵴）时产生感受器电位（毛细胞电位），经前庭神经传入，引起前庭姿势反射以维持体位与眼球的运动协调。耳蜗微音器电位源于耳蜗毛细胞，属听觉感受器电位，与平衡无关。","《生理学》第9版·神经系统·前庭器官与平衡感觉","green"],["2026N140X","使尿量增加的因素",["剧烈疼痛","肾髓质渗透压下降","激活RAAS系统","抗利尿激素减少"],"BD","X","外科学",2026,"real","外科学|其他","影响尿量的因素","尿量受肾小球滤过与集合管水重吸收调节：抗利尿激素减少使集合管对水通透性下降，水重吸收减少、尿量增多；肾髓质渗透压梯度下降使髓袢与集合管浓缩能力减弱，自由水重吸收减少，尿量增加（如渗透性利尿、髓质血流量增多）。剧烈疼痛与创伤应激使ADH分泌增多致尿少；激活RAAS使血管收缩、醛固酮促钠水重吸收，尿量减少。","《生理学》第9版·泌尿·尿生成的调节","green"],["2026N141X","糖皮质激素对血细胞的影响",["红细胞增加","血小板增加","嗜酸性粒细胞增加","淋巴细胞增加"],"AB","X","外科学",2026,"real","外科学|其他","糖皮质激素对血细胞的影响","糖皮质激素提高骨髓造血功能：使红细胞、血小板与中性粒细胞增多，机制包括刺激红系祖细胞增殖、延长中性粒细胞存活并促其自骨髓释放。同时使淋巴细胞与嗜酸性粒细胞减少（凋亡增加、分布改变），临床据此用于治疗淋巴瘤与过敏性疾病。故A、B正确。","《生理学》第9版·内分泌·肾上腺皮质激素","green"],["2026N142X","下列具有蛋白质超二级结构特点的有",["亮氨酸拉链","锌指结构","β折叠","α螺旋"],"AB","X","外科学",2026,"real","外科学|其他","超二级结构与模体","超二级结构指蛋白质分子中相邻的二级结构单位相互作用形成的局部空间组合体，如亮氨酸拉链（两性α螺旋通过亮氨酸侧链二聚化）、锌指结构（α螺旋与β折叠借锌离子固定）。α螺旋、β折叠是二级结构的基本形式，不是它们的组合体，故不属于超二级结构。","《生物化学与分子生物学》第9版·蛋白质的结构与功能","green"],["2026N143X","胆固醇在体内可转化为的物质有",["胆红素","胆汁酸","维生素D₃","胆素原"],"BC","X","生物化学",2026,"real","生物化学|酶","胆固醇的转化去路","胆固醇在体内不能彻底氧化供能，主要转化为：胆汁酸（肝内羟化为胆酸、鹅脱氧胆酸，是清除胆固醇的主要途径）、类固醇激素（肾上腺皮质激素与性激素）以及7-脱氢胆固醇（在皮肤经紫外线生成维生素D₃），故选B、C。胆红素来自血红素分解，胆素原由胆红素经肠道细菌还原生成，均与胆固醇无关，故A、D不选。","《生物化学与分子生物学》第9版·脂类代谢·胆固醇的转化","green"],["2026N144X","嘌呤核苷酸从头合成中反馈调节的酶",["PRPP合成酶","PRPP酰胺转移酶","IMP脱氢酶","CPS-II"],"ABC","X","生物化学",2026,"real","生物化学|核苷酸代谢","嘌呤从头合成的反馈调节","嘌呤核苷酸从头合成的反馈调节：PRPP合成酶受AMP、GMP、IMP反馈抑制（A）；PRPP酰胺转移酶受AMP、GMP及IMP抑制（B）；IMP脱氢酶受GMP抑制（C）；腺苷酸代琥珀酸合成酶受AMP抑制。CPS-Ⅱ是嘧啶核苷酸从头合成第一步的酶，受UMP反馈抑制，与嘌呤产物无关，故D不选。","《生物化学与分子生物学》第9版·核苷酸代谢·嘌呤核苷酸合成的调节","green"],["2026N145X","酶化学修饰的特点",["修饰的基团与酶共价连接","酶活性变化有级联放大效应","修饰反应是由另一种酶催化","酶构象变化引起酶活性变化"],"ABD","X","生物化学",2026,"real","生物化学|酶","酶的化学修饰特点","酶化学修饰的特点：修饰基团与酶蛋白以共价键相连（A）、经构象改变使酶在活性与无活性两种形式间切换（D）、并因逐级酶促反应而具有级联放大效应（B），均可选。C“修饰反应由另一种酶催化”同样是磷酸化酶/磷酸酶等催化共价修饰的公认特点。⚠️原答案存疑：C亦为正确描述，本答案未选C，请核对原题与答案。","《生物化学与分子生物学》第9版·酶·酶的共价修饰调节","yellow"],["2026N146X","p53抑癌基因发挥作用的机制是",["诱导BAX基因表达","促进细胞凋亡","使细胞周期阻滞于G₁期","使原癌基因获得启动子"],"ABC","X","病理学",2026,"real","病理学|肿瘤","癌基因与抑癌基因","p53为“基因组守护者”，其产物是转录因子，DNA损伤时激活靶基因：诱导p21等使细胞周期阻滞于G1期，争取修复时间（C正确）；修复失败时诱导BAX等促凋亡基因表达，启动凋亡（A、B正确）。D错：使原癌基因获得启动子是染色体易位、病毒插入等激活原癌基因的机制（如Burkitt淋巴瘤中Ig基因与MYC并置），与p53抑癌功能无关。","《病理学》第9版·肿瘤·抑癌基因","green"],["2026N147X","细胞内信号受体",["甲状腺激素","类固醇激素","转化生长因子β","乙酰胆碱"],"AB","X","外科学",2026,"real","外科学|普通外科","核受体与膜受体分类","细胞内（核）受体配体为亲脂性小分子，可直接跨膜进入细胞与胞内受体结合调节基因转录：甲状腺激素与类固醇激素（糖、盐、性激素）属此类。转化生长因子β作用于跨膜丝氨酸/苏氨酸激酶受体；乙酰胆碱作用于离子通道型（N）或G蛋白偶联型（M）膜受体。","《生物化学与分子生物学》第9版·细胞信号转导","green"],["2026N148X","参与炎症反应的机体成分有",["血浆蛋白","血管内皮细胞","细胞外基质","成纤维细胞"],"ABCD","X","外科学",2026,"real","外科学|其他","炎症反应的参与成分","炎症由血管、血浆蛋白与细胞、细胞外基质共同参与：血浆蛋白中的补体、凝血与激肽系统生成炎症介质并调理病原；血管内皮细胞表达黏附分子、调节血管通透性与白细胞渗出；细胞外基质成分与降解产物参与白细胞迁移与组织修复；成纤维细胞参与肉芽组织形成与纤维化。四项均属参与炎症反应的机体成分。","《病理学》第9版·炎症·炎症的概述","green"],["2026N149X","关于肉瘤的叙述，正确的有",["表现出向某种间叶组织分化的特点","大体特点为质软，色灰红，鱼肉状","镜下特点为实质与间质界限不清","多经淋巴道转移"],"ABC","X","外科学",2026,"real","外科学|其他","肉瘤的特点","肉瘤源于间叶组织，瘤细胞呈某种间叶组织的分化（纤维、脂肪、骨、软骨、血管等）；大体质软、色灰红、湿润呈鱼肉状，常有假包膜；镜下 是结构特异性，不是饱和现象的原因。C 结构类似物可结合同一载体，解释的是竞争性抑制现象。D “被动转运、不耗能”解释的是该过程属被动转运（顺梯度）的性质，与饱和无关。故结构特异性、饱和现象、竞争性抑制是载体转运的共同特点，须分别对应。","《生理学》第9版·细胞的基本功能·跨膜物质转运","green"],["YC25N003A","内质网上可通过G蛋白偶联受体\n通路激活而释放Ca2+的受体是",["L-Ca2+通道","T-Ca2+通道","雷诺丁受体","IP3受体"],"D","A","生理学",2025,"mock","生理学|细胞的基本功能","G蛋白偶联受体与IP3/Ca2+信号","G 蛋白偶联受体（如 α₁ 肾上腺素能受体、M 受体、血管紧张素受体等）激活 Gq 后激活磷脂酶 C，水解 PIP₂ 生成 IP₃ 与 DG；IP₃ 作用于内质网/肌浆网膜上的 IP₃ 受体（IP₃R，本身为 Ca²⁺ 通道），使内质网内 Ca²⁺ 释放入胞质，故 D 正确。L 型与 T 型 Ca²⁺ 通道位于细胞膜，介导胞外 Ca²⁺ 内流，A、B 错。雷诺丁受体位于肌浆网，由胞质 Ca²⁺ 升高（CICR）或 cADPR 激活，是骨骼肌兴奋-收缩耦联的钙释放通道，不经 GPCR-IP₃ 通路，C 错。","《生理学》第9版·细胞的基本功能·细胞信号转导","green"],["YC25N004A","关于纤溶酶的说法错误的是",["可由纤溶酶元被t-PA激活生成","可被PAI-1分解后抑制活性","可将纤维蛋白和纤维蛋白原分解成可溶\n性小肽","对FII、FV、FVIII、FX、FXII等\n凝血因子也有一定的降解作用"],"B","A","生物化学",2025,"mock","生物化学|酶","纤溶酶与PAI-1","纤溶酶原在t-PA、u-PA（及FⅫa、激肽释放酶）作用下裂解Arg⁵⁶¹-Val⁵⁶²肽键生成纤溶酶，故A正确；纤溶酶可将纤维蛋白和纤维蛋白原降解为可溶性小肽（C正确），并对FⅡ、FⅤ、FⅧ、FⅩ、FⅫ等凝血因子有一定降解作用（D正确）。PAI-1是与t-PA/u-PA结合使其失活，并非分解纤溶酶；抑制纤溶酶的是α₂-抗纤溶酶，故B为错误说法，本题选B。","《生物化学与分子生物学》第9版·血液的生物化学·纤维蛋白溶解","green"],["YC25N005A","生理状态下左右心室有明显差异\n的指标是",["每搏输出量","心输出量","心指数","心脏做功量"],"D","A","生理学",2025,"mock","生理学|血液循环","心输出量与心脏做功","左右心室的每搏输出量、每分输出量与心指数基本相同（体循环与肺循环串联、流量相等），故 A、B、C 生理状态下无明显差异。但两侧心室的后负荷差异很大：肺动脉压仅为主动脉压的 1/6 左右，右心室做功量仅为左心室的 1/6 左右，故心脏做功量是左右心室差异明显的指标，D 正确。临床意义在于：左心室壁厚（约 9～12 mm）显著厚于右心室（约 3 mm），长期压力负荷过重可导致左室肥厚，肺循环阻力增高则致右室肥厚。","《生理学》第9版·血液循环·心脏的泵血功能","green"],["YC25N006A","与心室肌细胞动作电位平台期无\n关的因素是",["IK1的内向整流特性","IK的延迟激活特性","If超级化开放的特性","慢Ca2+的激活特性"],"C","A","生理学",2025,"mock","生理学|细胞的基本功能","心室肌细胞动作电位平台期","心室肌平台期（2 期）由内外向电流共同形成：L 型慢 Ca²⁺ 通道激活引起 Ca²⁺ 内流（D 有关）；同时 IK（延迟整流钾电流）延迟激活、外向 K⁺ 电流逐渐增强（B 有关）；此外 IK1 的内向整流特性使膜在去极化时 K⁺ 外流受到减弱，对平台期的维持十分关键（A 有关）。If 是超极化激活的内向电流（主要成分为 Na⁺），存在于窦房结和浦肯野细胞，参与 4 期自动去极化，与心室肌（无自律性）平台期无关，故 C 为答案。区分类别：快反应细胞平台期—Ca²⁺ 内流与 K⁺ 外流平衡。","《生理学》第9版·血液循环·心肌的生物电现象","green"],["YC25N008A","促进胃蛋白酶原分泌的最强因素\n是",["迷走神经释放Ach","促胃液素","缩胆囊素","组胺"],"A","A","生物化学",2025,"mock","生物化学|酶","胃蛋白酶原分泌的调节","胃蛋白酶原由胃腺主细胞分泌，其分泌主要受迷走神经直接调控：ACh作用于主细胞M₃受体，是促进胃蛋白酶原分泌最强的因素，故A正确。促胃液素主要刺激壁细胞泌酸，对主细胞有较弱的间接促进作用；缩胆囊素主要促胰酶分泌与胆囊收缩；组胺主要促胃酸分泌，对主细胞作用弱。本题实际属生理学。","《生理学》第9版·消化和吸收·胃液分泌的调节","green"],["YC25N009A","利用简化后的间接侧热法测定能\n量代谢率时必须测量的是",["摄入O2的量","呼出CO2的量","呼吸商007--A1.平静吸气末比平静呼吸末时增大\n的是","肺内压"],"A","A","生理学",2025,"mock","生理学|能量代谢和体温","间接测热法与氧热价","简化（不测尿氮的）间接测热法只测单位时间耗氧量：按非蛋白呼吸商 0.82 取混合食物的氧热价（约 20.19 kJ/L），产热量=耗氧量×氧热价，故必须测量的是摄入（消耗）的 O₂ 量，A 正确。CO₂ 排出量仅在计算呼吸商时才需要，简化法不必测，B 错。呼吸商只是推算氧热价时的附加参数，本题直接给定取值，C 错。肺内压是呼吸运动中的气压变化，与测热无关，且该选项文字系混排，D 错。完整法还需测尿氮以扣除蛋白质代谢部分，再结合呼吸商查表得氧热价。","《生理学》第9版·能量代谢和体温·能量代谢的测定","green"],["YC25N010A","下列条件中通过改变滤过平衡点\n影响肾小球滤过率的是",["输尿管结石","低蛋白血症","交感神经强烈兴奋","大量饮用清水"],"C","A","生理学",2025,"mock","生理学|尿的生成和排出","肾血浆流量与滤过平衡点","滤过平衡点是有效滤过压降为零的位置，其位置取决于血浆胶体渗透压沿毛细血管上升的速度，而渗透压上升速度又取决于肾血浆流量。交感神经强烈兴奋使入球小动脉收缩、肾血流量与肾血浆流量减少，胶体渗透压沿毛细血管上升加快，滤过平衡点向入球端前移，有滤过作用的毛细血管长度缩短，GFR 降低，故 C 正确。A 输尿管结石使肾小囊内压升高，直接降低有效滤过压数值，不通过改变平衡点。B 低蛋白血症使血浆胶体渗透压降低，平衡点后移（滤过增多）。D 大量饮清水主要抑制 ADH、增加尿量，肾血浆流量变化小，不属影响平衡点的典型因素。","《生理学》第9版·尿的生成和排出·肾小球滤过率的影响因素","green"],["YC25N011A","直小血管维持内髓高渗的机制是",["逆流倍增","逆流交换","管-球反馈","球-管平衡"],"B","A","生理学",2025,"mock","生理学|尿的生成和排出","尿液浓缩与直小血管逆流交换","直小血管呈 U 形发夹样平行伸入内髓，其降支与升支之间以“逆流交换”方式工作：降支流入时与升支流出的血液交换溶质和水分，使溶质在内髓被反复“扣留”而不被血流带走，同时带走多余水分，从而维持内髓的高渗梯度；但逆流交换本身不能建立梯度，仅起维持作用，故 B 正确。逆流倍增是髓袢建立外髓至内髓渗透压梯度的机制，作用环节在髓袢而非直小血管，A 错。管-球反馈是致密斑感受远曲小管 NaCl 浓度调节入球小动脉的机制，C 错。球-管平衡指近端小管重吸收比例固定（约 65%～70%），D 错。","《生理学》第9版·尿的生成和排出·尿液的浓缩和稀释","green"],["YC25N012A","关于视锥系统的特点说法错误的\n是",["主司明视觉","光敏度高","可辨别颜色","和双极细胞呈单线联系"],"B","A","生理学",2025,"mock","生理学|感觉器官","视杆细胞与视锥细胞的功能特点","视锥系统主司昼光觉与色觉，其特点是光敏度低而分辨力高、暗处不能视物；空间总和池小、中央凹处一个视锥细胞与一个双极细胞、一个神经节细胞呈单线联系，故视敏度高，可精确分辨细节，选项 A、C、D 均正确。B 说“光敏度高”错误——高光敏度是视杆系统的特点（视紫红质含量多、多细胞会聚、可产生空间总和，故暗光下也能感光），故 B 为本题答案。视杆—暗视觉、无色觉、光敏度高；视锥—明视觉、有色觉、分辨力高。","《生理学》第9版·感觉器官·视觉","green"],["YC25N013A","闰绍细胞对脊髓前角运动神经元\n的控制方式属于",["突触前抑制","突触前易化","突触后抑制","突出后易化"],"C","A","生理学",2025,"mock","生理学|神经系统","突触后抑制（回返抑制）","闰绍细胞是脊髓前角内的抑制性中间神经元，α 运动神经元轴突发出侧支兴奋闰绍细胞，闰绍细胞再释放甘氨酸抑制同一（及邻近）α 运动神经元，形成负反馈，称回返抑制，它的抑制部位在突触后膜、引起超极化（IPSP），故属突触后抑制，C 正确。突触前抑制发生在轴突-轴突突触，机制是末梢去极化使递质释放减少，突触后膜无电位变化，A 错。突触前易化为增加递质释放，与抑制相反，B 错。突触后易化使突触后膜轻度去极化而兴奋性升高，与抑制相反，D 错。故关键判断是“抑制性中间神经元释放抑制性递质作用于突触后膜”。","《生理学》第9版·神经系统·神经系统功能活动的基本原理","green"],["YC25N014A","运动神经元α-γ共激活的意义\n是",["导致α僵直","导致γ僵直","避免肌肉过强收缩拉伤肌肉","在肌肉收缩时仍然可维持牵张反射"],"D","A","生理学",2025,"mock","生理学|神经系统","牵张反射与α-γ共激活","α-γ 共激活指锥体系下行冲动同时兴奋 α 与 γ 运动神经元：α 神经元使梭外肌收缩，γ 神经元使梭内肌同时收缩，两者缩短程度相匹配，使肌梭感受装置在肌肉缩短过程中仍持续受到适度牵张、保持传入冲动，从而在收缩全过程维持牵张反射与肌张力的反馈调节，故 D 正确。若只有 γ 兴奋（γ 僵直），表现为梭内肌收缩而不伴梭外肌收缩的去大脑僵直；若只有 α 兴奋，肌肉缩短使肌梭松弛、传入中断，反馈失控，故 A、B 是片面情形。C 是牵张反射的生理意义之一（保护作用），不是共激活的意义。","《生理学》第9版·神经系统·姿势的中枢调节","green"],["YC25N015A","可减少肾小管对磷重吸收的是",["甲状旁腺激素","1,25-二羟维生素D3","甲状腺激素","降钙素"],"D","A","生理学",2025,"mock","生理学|内分泌","降钙素与甲状旁腺激素","降钙素由甲状腺 C 细胞分泌，作用于破骨细胞抑制骨吸收，同时抑制肾近端小管对钙、磷、钠、氯的重吸收，使尿钙、尿磷排出增多、血钙血磷降低，故 D 可减少肾小管对磷的重吸收。甲状旁腺激素（A）同样抑制近端小管对磷酸盐的重吸收（排磷保钙），从“减少磷重吸收”这一点看 A 亦成立，且 PTH 是调节血磷最主要的激素，故本题选项不严谨。B 1,25-(OH)₂-D₃ 促进肾小管对钙磷的重吸收（使血磷升高）。C 甲状腺激素对肾小管磷转运无直接作用。⚠️原答案存疑：A 与 D 均可减少磷重吸收，若为单选则 PTH（A）更符合教材主要调节机制。","《生理学》第9版·内分泌·钙磷代谢的调节","yellow"],["YC25N016A","下列关于卵泡分泌雌激素的说法\n正确的是",["血浆中的雌激素可负反馈抑制腺垂体分\n泌FSH和LH","主要以雌三醇为主","提高低密度脂蛋白含量","促使子宫内膜蜕膜化"],"A","A","生理学",2025,"mock","生理学|内分泌","雌激素的生理作用与反馈调节","卵泡分泌的雌激素以雌二醇（E₂）为主，其在月经周期的大部分时间对下丘脑和腺垂体发挥负反馈作用，抑制 FSH 与 LH 分泌（仅排卵前高峰为正反馈），故 A 正确。B 错：血浆中以雌二醇活性最强、含量为主，雌三醇是肝内代谢产物、活性最弱。C 错：雌激素使血中 HDL 升高、LDL 降低，有利于防止动脉粥样硬化，而非提高 LDL 含量。D 错：使子宫内膜发生蜕膜化改变（分泌期转化、糖原增多）的是孕激素，雌激素主要促使内膜增生。故雌激素的负反馈调节是其周期调控的核心环节。","《生理学》第9版·内分泌·女性生殖功能","green"],["YC25N017A","关于蛋白质理化性质描述错误的\n是",["体内大多数蛋白的等电点小于人体pH值","蛋白质变性不涉及氨基酸序列的改变","蛋白质沉淀说明发生了变性","双缩脲反应可用于检测蛋白质水解程度"],"C","A","生理学",2025,"mock","生理学|其他","蛋白质变性、沉淀与显色反应","蛋白质沉淀不一定意味着变性：盐析、低温乙醇沉淀、等电点沉淀等属可逆沉淀，蛋白质构象未发生根本破坏，去除沉淀剂后仍可恢复活性；而重金属、强酸碱造成的沉淀多伴变性，故 C 为错误说法，是本题答案。A 正确：体内大多数蛋白质等电点在 pH 5 左右（小于生理 pH 7.4），故在体液中带负电荷（电泳时向正极移动）。B 正确：变性只破坏空间构象（次级键、二硫键），不涉及氨基酸序列（一级结构）改变。D 正确：双缩脲反应检测肽键数量，蛋白质水解程度越高肽键越少、呈色越浅，可用于判断水解程度。","《生物化学与分子生物学》第9版·蛋白质的结构与功能·蛋白质的理化性质","green"],["YC25N018A","下列属于酶促反应速率缓慢调节\n的方式是",["酶原的水解","溶酶体途径的降解","别构调节","磷酸化修饰"],"B","A","生物化学",2025,"mock","生物化学|酶","酶的缓慢调节（酶含量调节）","缓慢调节指改变细胞内酶的含量，通过基因转录与翻译水平的诱导/阻遏以及酶蛋白的降解（溶酶体途径、泛素-蛋白酶体途径）实现，效应出现慢、持续时间长，故B正确。别构调节、磷酸化等共价修饰、酶原水解激活均是对已存在酶分子活性的快速调节。","《生物化学与分子生物学》第9版·酶·酶的调节","green"],["YC25N019A","可催化生成α-1，6-糖苷键的酶\n二十余年教学积淀·助力学员考研上岸！",["α-1，6-糖苷酶","糖原合酶","糖原磷酸化酶","分支酶"],"D","A","病理学",2025,"mock","病理学|细胞和组织的适应与损伤","糖原合成与分解","糖原合成时，糖原合酶只能在已有糖原分子的非还原端以α-1,4-糖苷键逐个延长葡萄糖链；当支链长到6~7个残基时，分支酶（淀粉-(1,4→1,6)-转糖基酶）切下一段寡糖链并转移到另一分支的葡萄糖残基上，形成α-1,6-糖苷键分支，故D正确。α-1,6-糖苷酶与糖原磷酸化酶均作用于分解（脱支/磷酸解），方向相反；糖原合酶只催化α-1,4-糖苷键生成。⚠️原始排版错乱（题干中混入“二十余年教学积淀·助力学员考研上岸”广告语），请核对；本题实为生物化学糖代谢内容。","《生物化学与分子生物学》第9版·糖代谢·糖原的合成与分解","yellow"],["YC25N020A","下列关于肝脏合成脂肪的说法错\n误的是",["主要原料是甘油一酯和脂肪酸","合成后要和载脂蛋白结合以VLDL形式入\n血运输","其脂肪酸合成的原料乙酰CoA主要来源\n于葡萄糖的有氧氧化","脂肪酸合成的关键酶是乙酰CoA羧化酶"],"A","A","生理学",2025,"mock","生理学|其他","甘油三酯合成与VLDL","肝内合成甘油三酯走的是“α-磷酸甘油途径”：以糖酵解产生的磷酸二羟丙酮还原生成的 α-磷酸甘油与脂酰 CoA 为原料，经酯化生成甘油三酯，故 A 说“主要原料为甘油一酯和脂肪酸”错误（甘油一酯途径是小肠黏膜细胞合成 CM 时的主要方式），A 为答案。B 正确：肝合成的脂肪不能贮存，须与载脂蛋白 B100 等结合以 VLDL 形式入血运输，故脂肪肝与载脂蛋白合成不足或 VLDL 输出障碍有关。C 正确：合成脂肪酸的乙酰 CoA 主要来自葡萄糖有氧氧化，经柠檬酸-丙酮酸循环运出线粒体。D 正确：乙酰 CoA 羧化酶为脂肪酸合成的限速酶，受柠檬酸别构激活、丙二酰 CoA 抑制。","《生物化学与分子生物学》第9版·脂质代谢·甘油三酯的合成","green"],["YC25N021A","若使用鱼藤酮阻断线粒体电子传\n递，则一分子乙酰CoA在三羧酸循环中彻\n底氧化理论上可产生多少分子ATP",["12.5","10","2.5","1"],"C","A","生物化学",2025,"mock","生物化学|糖代谢","呼吸链抑制剂与P/O比","鱼藤酮阻断呼吸链复合体Ⅰ，使来自TCA三次脱氢的3分子NADH无法经复合体Ⅰ氧化产能；但琥珀酸脱氢酶产生的FADH₂经复合体Ⅱ直接将电子交给CoQ，绕过复合体Ⅰ，仍可经复合体Ⅲ、Ⅳ传递并生成1.5分子ATP；再加琥珀酰CoA合成酶催化的底物水平磷酸化生成1分子GTP，理论上共2.5分子ATP，故选C。","《生物化学与分子生物学》第9版·生物氧化·氧化磷酸化","green"],["YC25N022A","CPS-I的别构激活剂是",["精氨酸","精氨酸代琥珀酸","N-乙酰谷氨酸","天冬氨酸"],"C","A","生理学",2025,"mock","生理学|其他","尿素循环与CPS-I","尿素合成经鸟氨酸循环，第一步氨甲酰磷酸合成酶Ⅰ（CPS-Ⅰ）位于线粒体，催化 NH₃+CO₂+ATP 生成氨甲酰磷酸，其必需的别构激活剂是 N-乙酰谷氨酸（AGA），故 C 正确。精氨酸是循环的中间产物并能激活 CPS-Ⅰ 的活性（通过促进 AGA 生成），但作用为间接，A 不如 C 准确。精氨酸代琥珀酸是循环中间代谢物，不是 CPS-Ⅰ 的激活剂，B 错。天冬氨酸提供循环中第二个氮原子（在胞质经精氨酸代琥珀酸合成酶参与），D 错。氨甲酰磷酸合成酶Ⅱ位于胞质、参与嘧啶合成，受 UTP 反馈抑制。","《生物化学与分子生物学》第9版·氨基酸代谢·尿素合成","green"],["YC25N024A","关于原核生物转录过程描述错误\n的是",["-35区为RNApol最先识别的区段","RNApol沿着模板链的5'向3'移动","σ亚基脱落前，转录无法进入正常的延\n长阶段","利福平可特异性的结合RNA聚合酶的β\n亚基，抑制其转录活性"],"B","A","生物化学",2025,"mock","生物化学|RNA转录与翻译","原核转录过程与RNA聚合酶","RNA聚合酶沿DNA模板链的3′→5′方向移动，合成的RNA按5′→3′方向延伸，B把模板阅读方向说反，是错误项。原核σ因子先识别-35区（TTGACA）并协助全酶结合-10区；σ因子脱落后核心酶才进入正常延长；利福平特异结合β亚基抑制转录起始。故A、C、D均正确。","《生物化学与分子生物学》第9版·DNA的转录·原核生物的转录过程","green"],["YC25N025A","如果一个氨基酸的密码子是AUG，\n则与其配对的反密码子可以是",["UAC","UAU","GUA","TAC"],"B","A","生物化学",2025,"mock","生物化学|蛋白质的结构与功能","密码子与反密码子配对及摆动性","密码子为5′-AUG-3′，与之反向平行配对的反密码子需依次与A、U、G互补：5′-UAU-3′可与之配对，其中第1位U与密码子第3位G属摆动配对，故B正确。5′-UAC-3′的第3位C不能与密码子第1位A配对；5′-GUA-3′碱基与方向均不符；TAC含胸腺嘧啶，只存在于DNA，不会出现在tRNA反密码子中。","《生物化学与分子生物学》第9版·蛋白质的合成·密码子与反密码子的配对","green"],["YC25N026A","关于顺式作用元件的描述错误的\n是",["是编码基因附近的非编码DNA序列","是可影响自身基因表达活性的DNA序列","真核生物基因组中每一个基因都有各自\n特异的顺式作用元件","都位于转录起始点上游"],"D","A","生物化学",2025,"mock","生物化学|RNA转录与翻译","顺式作用元件与增强子","顺式作用元件是位于编码基因附近、可影响自身基因表达活性的非编码DNA序列，包括启动子、增强子、沉默子和各种应答元件，与编码序列同处一条DNA链，故A、B正确。不同基因的元件组合各异，并非每个基因都有特异元件；增强子与沉默子可位于转录起点上游、下游、内含子中甚至远隔数十kb，故D“都位于上游”错误。","《生物化学与分子生物学》第9版·基因表达调控·顺式作用元件","green"],["YC25N027A","下列基因编码产物为细胞内信号\n转导分子的是",["SIS","HER2","SRC","MYC"],"C","A","生物化学",2025,"mock","生物化学|其他","原癌基因产物分类","SRC编码非受体型酪氨酸蛋白激酶，位于胞质内，是经典原癌基因产物，属细胞内信号转导分子，故C正确。SIS编码PDGF的β链，属生长因子；HER2（ERBB2）编码受体型酪氨酸激酶，位于细胞膜；MYC编码核内转录因子，作用于核内DNA，三者均不是胞质内的信号转导分子。","《生物化学与分子生物学》第9版·细胞信号转导·信号转导分子与原癌基因","green"],["YC25N029A","关于萎缩的说法，错误的是：",["器官颜色多变深","部分脏器萎缩后体积可能会变大","萎缩是癌前病变","细胞功能下降，能量需求减少"],"C","A","病理学",2025,"mock","病理学|肿瘤","萎缩的概念与类型","萎缩本身是适应性改变，属可逆性细胞体积缩小，并不是癌前病变，故C的叙述错误，为本题答案（临床上某些萎缩性疾病如慢性萎缩性胃炎、萎缩性胆囊炎被列为癌前疾病，那是疾病层面而非“萎缩”这一基本病理过程）。A正确：萎缩细胞自噬增强、脂褐素蓄积，器官颜色多加深；B正确：萎缩的实质常伴间质脂肪组织增生填充，如心肌萎缩伴脂肪浸润、肾萎缩后肾周脂肪增多，使体积可增大甚至超过正常；D正确：细胞体积缩小、细胞器减少，功能与能量需求同步下降。","《病理学》第9版·细胞和组织的适应与损伤·萎缩","green"],["YC25N030A","细胞胞质内出现大小不等、圆形\n均质红染物质的病变，见于：",["纤维化的肾小球","高血压病时的细动脉","动脉粥样硬化的纤维斑块","肾病综合征的肾小管"],"D","A","生物化学",2025,"mock","生物化学|其他","细胞内玻璃样小滴","肾病综合征时肾小球滤过膜通透性增高，大量蛋白滤出后被近端小管上皮细胞吞饮，胞质内形成大小不等、圆形均质的红染玻璃样小滴，随尿排出。纤维化的肾小球表现为球性硬化，高血压病细动脉为管壁玻璃样变，动脉粥样硬化纤维斑块位于血管壁内，均不表现为胞质内小滴。本题实际属病理学。","《病理学》第9版·细胞和组织的适应与损伤·细胞内物质蓄积","green"],["YC25N031A","关于结节硬化型霍奇金淋巴瘤的\n说法，错误的是",["是最常见的经典型霍奇金淋巴瘤","与EB病毒感染相关","常有CD15表达","没有典型的R-S细胞"],"D","A","内科学",2025,"mock","内科学|血液系统疾病","结节硬化型霍奇金淋巴瘤的特点","结节硬化型是经典型霍奇金淋巴瘤最常见的亚型（约60%~70%），多见于青年女性，与EB病毒感染相关，免疫表型为CD15(+)、CD30(+)、CD20(-)，组织学上除典型R-S细胞外还可见特征性的陷窝细胞（腔隙型细胞）及胶原纤维束分隔的结节。因此\"没有典型的R-S细胞\"表述错误。其余三项均符合该亚型特点。","《病理学》第9版·淋巴造血系统疾病·霍奇金淋巴瘤","green"],["YC25N032A","最常见的胃癌类型是",["溃疡型","蕈伞型","胶样型","髓质型033--A1.下列哪种属于T细胞淋巴瘤"],"A","A","生物化学",2025,"mock","生物化学|其他","胃癌的大体分型","进展期胃癌肉眼分型中溃疡型最常见，癌组织坏死脱落形成边缘隆起、底部不平的火山口状溃疡；蕈伞型向腔内隆起呈息肉状；胶样型含大量黏液呈半透明胶冻状。⚠️原始排版错乱：D选项后混入“髓质型033--A1.下列哪种属于T细胞淋巴瘤”字样，请核对原题；按现有可辨选项应选A。本题实际属病理学。","《病理学》第9版·消化系统疾病·胃癌","green"],["YC25N034A","患者女性，多关节肿痛1年余，\n查体可见双颊蝶形红斑，尿液检查，红细\n胞5~10/HP，蛋白（++），该患者发病的超\n敏反应类型属于",["I型超敏反应","II型超敏反应","III型超敏反应","IV型超敏反应"],"C","A","生物化学",2025,"mock","生物化学|其他","Ⅲ型超敏反应（免疫复合物型）","青年女性、多关节肿痛、双颊蝶形红斑伴血尿蛋白尿，为系统性红斑狼疮合并狼疮肾炎的典型表现。其肾损害由可溶性自身抗原-抗体复合物沉积于肾小球基底膜、激活补体并招募中性粒细胞所致，属Ⅲ型超敏反应。Ⅰ型为IgE介导速发型，Ⅱ型为抗体直接针对细胞表面抗原，Ⅳ型为T细胞介导的迟发型。本题实际属病理学/免疫学。","《病理学》第9版·自身免疫性疾病·系统性红斑狼疮","green"],["YC25N035A","非ST段抬高性心肌梗死主要由什\n么血栓导致？",["白色血栓","透明血栓","混合血栓","红色血栓"],"A","A","内科学",2025,"mock","内科学|循环系统疾病","白色血栓与NSTEMI的发病机制","非ST段抬高型心肌梗死多为冠脉斑块破裂后形成以血小板和纤维蛋白为主的非闭塞性白色血栓，造成不完全性血管阻塞、心内膜下缺血，故心电图表现为ST段压低或T波倒置而无ST段抬高。红色血栓富含红细胞，见于完全闭塞性血栓（STEMI）；透明血栓为微循环内纤维蛋白血栓（DIC）；混合血栓见于动脉瘤内及血栓头部之后的部位。","《病理学》第9版·心血管系统疾病·血栓形成","green"],["YC25N036A","梗死发生所需的条件不包括",["动脉供血中断","组织对缺血敏感","栓子带有细菌","局部血液循环较差"],"C","A","病理学",2025,"mock","病理学|局部血液循环障碍","梗死的类型与形态","梗死形成的条件包括：动脉供血中断（血栓、栓塞、痉挛、压迫）；组织对缺血的耐受性即敏感度（脑、心肌敏感，皮肤、骨骼肌耐受强）；局部血液循环状态（双重血供、吻合支丰富或存在淤血者梗死范围与类型不同，如肺、肠淤血时形成出血性梗死）；以及血液氧含量（贫血、心衰时更易梗死）。栓子是否带菌只决定是否形成脓肿或继发感染，与梗死发生无关，故选C。要点：带菌栓子致败血性梗死，属梗死的继发改变而非条件。","《病理学》第9版·局部血液循环障碍·梗死","green"],["YC25N037A","下列关于大叶性肺炎的叙述，错\n误的是",["罹患大叶性肺炎后发生肺梗死可为贫血\n性梗死 二十余年教学积淀·助力学员考研上岸！","大叶性肺炎由支气管起病，向四周蔓延","大叶性肺炎灰色肝样变期痰培养常为阴\n性","大叶性肺炎的并发症发生率较低"],"B","A","内科学",2025,"mock","内科学|呼吸系统疾病","大叶性肺炎的蔓延方式","大叶性肺炎的病变经肺泡间的Kohn孔（肺泡间孔）在肺泡间蔓延，累及整个肺叶或肺段，而非沿支气管向四周蔓延（后者是支气管肺炎/小叶性肺炎的播散方式），故B错误。大叶性肺炎并发症已少见，肺梗死因肺有双重血供常为贫血性梗死；灰色肝样变期肺泡腔内渗出物机化、细菌多被消灭，痰培养常阴性，均符合事实。","《病理学》第9版·呼吸系统疾病·大叶性肺炎","green"],["YC25N038A","电镜下可见广泛的上皮细胞肿\n胀，足突消失的肾脏疾病是",["急性肾小球肾炎","系膜毛细血管性肾小球肾炎","膜性肾小球肾炎","脂性肾病"],"D","A","生物化学",2025,"mock","生物化学|其他","微小病变型肾病的电镜特点","光镜下肾小球基本正常，电镜下仅见上皮细胞（足细胞）广泛肿胀、足突融合消失，免疫荧光阴性，为微小病变型肾病（脂性肾病），多见于儿童肾病综合征，对糖皮质激素敏感。急性肾小球肾炎有内皮与系膜细胞增生及上皮下驼峰状沉积物；膜性肾小球肾炎基底膜增厚并有钉突；系膜毛细血管性肾小球肾炎呈双轨征。本题实际属病理学。","《病理学》第9版·泌尿系统疾病·微小病变型肾病","green"],["YC25N039A","早期宫颈癌多为",["糜烂型","外生菜花型","内生浸润型","溃疡型"],"A","A","生物化学",2025,"mock","生物化学|其他","子宫颈癌的大体类型","早期宫颈癌（原位癌及微小浸润癌）病变表浅、体积小，肉眼常无明确肿块，仅见宫颈黏膜呈糜烂样改变或略粗糙发红，故以糜烂型多见。外生菜花型、内生浸润型（结节型）与溃疡型均见于浸润癌进展到较大体积时，是晚期癌的肉眼形态。本题实际属病理学。","《病理学》第9版·生殖系统疾病·子宫颈癌","green"],["YC25N040A","恶性程度最高的甲状腺癌是",["肉瘤样癌","乳头状癌","滤泡状癌","髓样癌"],"A","A","生物化学",2025,"mock","生物化学|其他","甲状腺未分化癌","甲状腺未分化癌（间变性癌）包括肉瘤样癌、巨细胞癌与小细胞癌，多见于老年人，生长迅速、早期广泛浸润和转移，预后极差，为恶性程度最高者，故A正确。乳头状癌分化好、预后最佳；滤泡状癌易经血行转移但恶性度中等；髓样癌源于滤泡旁C细胞，中度恶性。本题实际属病理学。","《病理学》第9版·内分泌系统疾病·甲状腺癌","green"],["YC25N041A","下列病变容易引起S2反常分裂的\n是",["主动脉瓣狭窄","主动脉瓣关闭不全","二尖瓣狭窄","二尖瓣关闭不全"],"A","A","生物化学",2025,"mock","生物化学|其他","S₂反常分裂","第二心音反常分裂指A₂延迟至P₂之后，使正常随吸气增宽的生理性分裂消失（呼气时也分裂、吸气时不增宽）。主动脉瓣狭窄时左室射血期延长、主动脉瓣关闭明显延迟，A₂后移，是典型原因，也见于完全性左束支传导阻滞与右室起搏。二尖瓣狭窄或关闭不全不改变A₂、P₂的先后顺序，不引起反常分裂。本题实际属内科学。","《内科学》第9版·循环系统疾病·心脏瓣膜病","green"],["YC25N042A","下列实验室检查结果支持梗阻型\n黄疸的是",["间接胆红素升高","尿胆红素升高","尿胆素原升高","大便颜色加深"],"B","A","生物化学",2025,"mock","生物化学|血液生化","黄疸的实验室鉴别","梗阻性黄疸时结合胆红素反流入血，因其水溶性强、可经肾小球滤过，故尿胆红素强阳性，B正确。同时胆红素排入肠道减少，粪胆原生成减少，尿胆原减少或消失，大便颜色变浅甚至呈陶土色；血中以直接（结合）胆红素升高为主。间接胆红素升高、尿胆原升高、大便颜色加深见于溶血性黄疸。","《生物化学与分子生物学》第9版·肝的生物化学·胆色素的代谢","green"],["YC25N043A","关于COPD的治疗思路描述错误的\n是",["若患者日常活动受限明显应选用长效支\n气管舒张剂","应常规选用低剂量吸入式糖皮质激素控\n制炎症","戒烟是重要的预防措施","家庭氧疗时吸入氧浓度一般不高于30%"],"B","A","内科学",2025,"mock","内科学|呼吸系统疾病","COPD稳定期药物治疗原则","COPD稳定期抗炎治疗不推荐常规吸入糖皮质激素，仅用于反复急性加重（每年≥2次）且血嗜酸性粒细胞增高者，或在长效支气管舒张剂基础上联合使用以降低急性加重频率，故B错误。症状明显、活动受限者应选用长效支气管舒张剂（LAMA/LABA）；戒烟是最重要的预防措施；家庭氧疗采用低流量（1~2L/min）、吸氧浓度一般不超过30%，以防加重CO₂潴留。","《内科学》第9版·呼吸系统疾病·慢性阻塞性肺疾病","green"],["YC25N044A","女，32岁，外出旅游后出现头痛，\n咽痛，伴有低热和肌肉酸痛。咳嗽、干咳。\nX胸片示：双肺下叶边缘模糊斑片状影。下\n列抗生素对患者效果不佳的最可能是",["左氧氟沙星","头孢克圬","红霉素","阿奇霉素"],"B","A","生物化学",2025,"mock","生物化学|其他","非典型病原体肺炎的抗菌药物选择","青年女性旅游后出现头痛、咽痛、低热、肌肉酸痛伴干咳，X线示双肺下叶边缘模糊的斑片状影，符合支原体、衣原体等非典型病原体肺炎。此类病原体无细胞壁，β-内酰胺类（头孢克肟）对其完全无效，故效果不佳最可能是B；左氧氟沙星、红霉素、阿奇霉
