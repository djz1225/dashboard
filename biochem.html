ang SC','Microsoft YaHei',sans-serif\">brancher / debrancher</text><text x=\"29.0\" y=\"286.0\" text-anchor=\"start\" font-size=\"12\" font-weight=\"700\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">分支酶 / 脱枝酶</text><text x=\"29.0\" y=\"301.0\" text-anchor=\"start\" font-size=\"11.2\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">分支酶造 α-1,6 键；脱枝酶水解它</text><rect x=\"15.0\" y=\"316.0\" width=\"300.0\" height=\"102.0\" rx=\"7\" fill=\"#dcfce7\" stroke=\"#cbd5e1\" stroke-width=\"1.4\"/><text x=\"25.0\" y=\"335.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"700\" fill=\"#15803d\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">分支的三个好处</text><text x=\"25.0\" y=\"353.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#15803d\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">· 提高溶解度（减少渗透压效应）</text><text x=\"25.0\" y=\"369.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#15803d\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">· 多个非还原端 → 磷酸化酶可同时作用，</text><text x=\"25.0\" y=\"385.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#15803d\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">分解速度快</text><text x=\"25.0\" y=\"401.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#15803d\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">· 分支使糖原致密，节省胞内空间</text><rect x=\"15.0\" y=\"426.0\" width=\"300.0\" height=\"24.0\" rx=\"4\" fill=\"#e2e8f0\" stroke=\"#94a3b8\" stroke-width=\"1\"/><text x=\"21.0\" y=\"442.0\" text-anchor=\"start\" font-size=\"11.2\" font-weight=\"700\" fill=\"#1e293b\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">组织</text><text x=\"61.4\" y=\"442.0\" text-anchor=\"start\" font-size=\"11.2\" font-weight=\"700\" fill=\"#1e293b\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">能不能补血糖</text><text x=\"133.7\" y=\"442.0\" text-anchor=\"start\" font-size=\"11.2\" font-weight=\"700\" fill=\"#1e293b\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">原因</text><rect x=\"15.0\" y=\"450.0\" width=\"300.0\" height=\"36.0\" rx=\"3\" fill=\"#f8fafc\" stroke=\"#cbd5e1\" stroke-width=\"0.9\"/><text x=\"21.0\" y=\"465.0\" text-anchor=\"start\" font-size=\"11.2\" font-weight=\"700\" fill=\"#1e293b\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">肝</text><text x=\"61.4\" y=\"465.0\" text-anchor=\"start\" font-size=\"11.2\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">能</text><text x=\"133.7\" y=\"465.0\" text-anchor=\"start\" font-size=\"11.2\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">有葡糖-6-磷酸酶，可水解出游离葡</text><text x=\"133.7\" y=\"479.0\" text-anchor=\"start\" font-size=\"11.2\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">萄糖</text><rect x=\"15.0\" y=\"486.0\" width=\"300.0\" height=\"36.0\" rx=\"3\" fill=\"#ffffff\" stroke=\"#cbd5e1\" stroke-width=\"0.9\"/><text x=\"21.0\" y=\"501.0\" text-anchor=\"start\" font-size=\"11.2\" font-weight=\"700\" fill=\"#1e293b\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">肌</text><text x=\"61.4\" y=\"501.0\" text-anchor=\"start\" font-size=\"11.2\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">不能</text><text x=\"133.7\" y=\"501.0\" text-anchor=\"start\" font-size=\"11.2\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">缺葡糖-6-磷酸酶，G-6-P 只能自</text><text x=\"133.7\" y=\"515.0\" text-anchor=\"start\" font-size=\"11.2\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">己用</text><rect x=\"15.0\" y=\"527.0\" width=\"300.0\" height=\"76.0\" rx=\"7\" fill=\"#fee2e2\" stroke=\"#b91c1c\" stroke-width=\"1.2\"/><text x=\"25.0\" y=\"543.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"700\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">易错：糖原分解首产物是葡糖-1-磷酸（</text><text x=\"25.0\" y=\"559.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">不是葡糖-6-磷酸）</text><text x=\"25.0\" y=\"575.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">GS 磷酸化失活、GP 磷酸化激活——两者方向相</text><text x=\"25.0\" y=\"591.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">反，这是最容易记反的一对</text><rect x=\"11.0\" y=\"608.0\" width=\"308.0\" height=\"51.0\" rx=\"7\" fill=\"#ccfbf1\" stroke=\"#0f766e\" stroke-width=\"1.2\"/><text x=\"165.0\" y=\"623.0\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"700\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">糖原合成用 UDPG；分支提高溶解度与分解速度；</text><text x=\"165.0\" y=\"638.5\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"700\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">肌缺葡糖-6-磷酸酶故不能补血糖</text></svg>","fig_sh07_gluconeogenesis":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 330 647\" width=\"100%\" style=\"max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px\" role=\"img\"><text x=\"165.0\" y=\"22.6\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"700\" fill=\"#1e293b\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">糖异生：绕过三个不可逆反应</te 2 ATP + </text><text x=\"258.5\" y=\"111.0\" text-anchor=\"start\" font-size=\"11.2\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">2 GTP</text><rect x=\"15.0\" y=\"118.0\" width=\"300.0\" height=\"36.0\" rx=\"3\" fill=\"#ffffff\" stroke=\"#cbd5e1\" stroke-width=\"0.9\"/><text x=\"21.0\" y=\"133.0\" text-anchor=\"start\" font-size=\"11.2\" font-weight=\"700\" fill=\"#1e293b\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">果糖-1,6-二磷酸 → </text><text x=\"21.0\" y=\"147.0\" text-anchor=\"start\" font-size=\"11.2\" font-weight=\"700\" fill=\"#1e293b\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">果糖-6-磷酸</text><text x=\"140.6\" y=\"133.0\" text-anchor=\"start\" font-size=\"11.2\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">果糖二磷酸酶-1</text><text x=\"258.5\" y=\"133.0\" text-anchor=\"start\" font-size=\"11.2\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">1 H₂O</text><rect x=\"15.0\" y=\"154.0\" width=\"300.0\" height=\"36.0\" rx=\"3\" fill=\"#f8fafc\" stroke=\"#cbd5e1\" stroke-width=\"0.9\"/><text x=\"21.0\" y=\"169.0\" text-anchor=\"start\" font-size=\"11.2\" font-weight=\"700\" fill=\"#1e293b\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">葡糖-6-磷酸 → 葡萄</text><text x=\"21.0\" y=\"183.0\" text-anchor=\"start\" font-size=\"11.2\" font-weight=\"700\" fill=\"#1e293b\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">糖</text><text x=\"140.6\" y=\"169.0\" text-anchor=\"start\" font-size=\"11.2\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">葡糖-6-磷酸酶（</text><text x=\"140.6\" y=\"183.0\" text-anchor=\"start\" font-size=\"11.2\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',s amily=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">2 之差</text><text x=\"29.0\" y=\"379.5\" text-anchor=\"start\" font-size=\"11.2\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">胞质 2 NADH 按 1.5 计 → 30；按 2.5 计 → 32</text><rect x=\"15.0\" y=\"395.5\" width=\"300.0\" height=\"76.0\" rx=\"7\" fill=\"#fee2e2\" stroke=\"#b91c1c\" stroke-width=\"1.2\"/><text x=\"25.0\" y=\"411.5\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"700\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">易错：葡萄糖彻底氧化旧值 38 已废弃，</text><text x=\"25.0\" y=\"427.5\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">10 版是 30~32</text><text x=\"25.0\" y=\"443.5\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">「2.5 / 1.5」的来源是 10 个质子 / 4 个</text><text x=\"25.0\" y=\"459.5\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">质子每 ATP，不是随便定的</text><rect x=\"11.0\" y=\"476.5\" width=\"308.0\" height=\"51.0\" rx=\"7\" fill=\"#ccfbf1\" stroke=\"#0f766e\" stroke-width=\"1.2\"/><text x=\"165.0\" y=\"491.5\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"700\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">NADH 2.5、FADH₂ 1.5；葡萄糖彻底氧化 30 </text><text x=\"165.0\" y=\"507.0\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"700\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">或 32 ATP（取决于穿梭系统）</text></svg>","fig_sh08_shuttle":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 330 502\" width=\"100%\" style=\"max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px\" role=\"img\"><text x=\"165.0\" y=\"22.6\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"700\" fill=\"#1e293b\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">两条穿梭系统：差在能不能进线粒体</text><text x=\"165.0\" y=\"43.0\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"400\" fill=\"#64748b\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">NADH 本身不能过内膜，必须「换乘」</text><rect x=\"15.0\" y=\"58.0\" width=\"300.0\" height=\"60.0\" rx=\"6\" fill=\"#ffffff\" stroke=\"#cbd5e1\" stroke-width=\"1.1\"/><rect x=\"15.0\" y=\"58.0\" width=\"4.5\" height=\"60.0\" rx=\"2.2\" fill=\"#b45309\"/><text x=\"29.0\" y=\"77.0\" text-anchor=\"start\" font-size=\"14\" font-weight=\"700\" fill=\"#1e293b\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">α-磷酸甘油穿梭</text><text x=\"29.0\" y=\"94.0\" text-anchor=\"start\" font-size=\"12\" font-weight=\"700\" fill=\"#b45309\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">1.5 ATP/NADH</text><text x=\"29.0\" y=\"109.0\" text-anchor=\"start\" font-size=\"11.2\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">把氢交给 FAD → 走复合体Ⅱ；脑、骨骼肌为主</text><rect x=\"15.0\" y=\"122.0\" width=\"300.0\" height=\"60.0\" rx=\"6\" fill=\"#ffffff\" stroke=\"#cbd5e1\" stroke-width=\"1.1\"/><rect x=\"15.0\" y=\"122.0\" width=\"4.5\" height=\"60.0\" rx=\"2.2\" fill=\"#0f766e\"/><text x=\"29.0\" y=\"141.0\" text-anchor=\"start\" font-size=\"14\" font-weight=\"700\" fill=\"#1e293b\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">苹果酸-天冬氨酸穿梭</text><text x=\"29.0\" y=\"158.0\" text-anchor=\"start\" font-size=\"12\" font-weight=\"700\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">2.5 ATP/NADH</text><text x=\"29.0\" y=\"173.0\" text-anchor=\"start\" font-size=\"11.2\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">把氢交给线粒体 NAD⁺ → 走复合体Ⅰ；心、肝为主</text><rect x=\"15.0\" y=\"186.0\" width=\"300.0\" height=\"60.0\" rx=\"6\" fill=\"#ffffff\" stroke=\"#cbd5e1\" stroke-width=\"1.1\"/><rect x=\"15.0\" y=\"186.0\" width=\"4.5\" height=\"60.0\" rx=\"2.2\" fill=\"#b91c1c\"/><text x=\"29.0\" y=\"205.0\" text-anchor=\"start\" font-size=\"14\" font-weight=\"700\" fill=\"#1e293b\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">为什么必须穿梭</text><text x=\"29.0\" y=\"222.0\" text-anchor=\"start\" font-size=\"12\" font-weight=\"700\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">线粒体内膜不通 NADH</text><text x=\"29.0\" y=\"237.0\" text-anchor=\"start\" font-size=\"11.2\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">只能靠代谢物「背」进去</text><rect x=\"15.0\" y=\"252.0\" width=\"300.0\" height=\"102.0\" rx=\"7\" fill=\"#ccfbf1\" stroke=\"#cbd5e1\" stroke-width=\"1.4\"/><text x=\"25.0\" y=\"271.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"700\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">临床两个推论</text><text x=\"25.0\" y=\"289.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">· 心肌、肝以苹果酸穿梭为主 → 胞质 NADH </text><text x=\"25.0\" y=\"305.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">也能产 2.5，效率更高</text><text x=\"25.0\" y=\"321.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">· 骨骼肌、脑以甘油磷酸穿梭为主 → 同样 1 </text><text x=\"25.0\" y=\"337.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">分子葡萄糖少产 2 ATP</text><rect x=\"15.0\" y=\"362.0\" width=\"300.0\" height=\"76.0\" rx=\"7\" fill=\"#fee2e2\" stroke=\"#b91c1c\" stroke-width=\"1.2\"/><text x=\"25.0\" y=\"378.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"700\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">易错：两条穿梭的差别不是「NADH 多少」，</text><text x=\"25.0\" y=\"394.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">而是「氢交给谁」</text><text x=\"25.0\" y=\"410.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">甘油磷酸穿梭交出的是 FADH₂，所以只能折 1</text><text x=\"25.0\" y=\"426.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">.5</text><rect x=\"11.0\" y=\"443.0\" width=\"308.0\" height=\"51.0\" rx=\"7\" fill=\"#ccfbf1\" stroke=\"#0f766e\" stroke-width=\"1.2\"/><text x=\"165.0\" y=\"458.0\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"700\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">甘油磷酸穿梭交给 FADH₂（1.5）；苹果酸-天</text><text x=\"165.0\" y=\"473.5\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"700\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">冬氨酸穿梭交给 NADH（2.5）</text></svg>","fig_sh08_chemiosmosis":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 330 524\" width=\"100%\" style=\"max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px\" role=\"img\"><text x=\"165.0\" y=\"22.6\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"700\" fill=\"#1e293b\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">化学渗透：质子梯度怎么变成 ATP</text><text x=\"165.0\" y=\"43.0\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"400\" fill=\"#64748b\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">内膜不透 H⁺；H⁺ 只能经 ATP 合酶回流</text><rect x=\"15.0\" y=\"58.0\" width=\"300.0\" height=\"56.0\" rx=\"6\" fill=\"#ccfbf1\" stroke=\"#0f766e\" stroke-width=\"1.4\"/><text x=\"28.0\" y=\"77.0\" text-anchor=\"start\" font-size=\"12.6\" font-weight=\"700\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">① 电子传递泵出 H⁺</text><text x=\"28.0\" y=\"94.0\" text-anchor=\"start\" font-size=\"11.2\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">膜间隙 H⁺ 浓度升高 → 形成电化学梯度（质子动力势</text><text x=\"28.0\" y=\"109.0\" text-anchor=\"start\" font-size=\"11.2\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">）</text><line x1=\"165.0\" y1=\"115.0\" x2=\"165.0\" y2=\"114.5\" stroke=\"#64748b\" stroke-width=\"1.4\" stroke-linecap=\"round\"/><polygon points=\"165.0,119.0 163.0,114.4 167.0,114.4\" fill=\"#64748b\"/><rect x=\"15.0\" y=\"120.0\" width=\"300.0\" height=\"41.0\" rx=\"6\" fill=\"#fef3c7\" stroke=\"#b45309\" stroke-width=\"1.4\"/><text x=\"28.0\" y=\"139.0\" text-anchor=\"start\" font-size=\"12.6\" font-weight=\"700\" fill=\"#b45309\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">② 内膜对 H⁺ 不通透</text><text x=\"28.0\" y=\"156.0\" text-anchor=\"start\" font-size=\"11.2\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">梯度得以维持（这是假说的关键前提）</text><line x1=\"165.0\" y1=\"162.0\" x2=\"165.0\" y2=\"161.5\" stroke=\"#64748b\" stroke-width=\"1.4\" stroke-linecap=\"round\"/><polygon points=\"165.0,166.0 163.0,161.4 167.0,161.4\" fill=\"#64748b\"/><rect x=\"15.0\" y=\"167.0\" width=\"300.0\" height=\"41.0\" rx=\"6\" fill=\"#dcfce7\" stroke=\"#15803d\" stroke-width=\"1.4\"/><text x=\"28.0\" y=\"186.0\" text-anchor=\"start\" font-size=\"12.6\" font-weight=\"700\" fill=\"#15803d\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">③ H⁺ 经 F₀ 回流</text><text x=\"28.0\" y=\"203.0\" text-anchor=\"start\" font-size=\"11.2\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">F₀ 是质子通道，F₁ 是催化头部（α₃β₃γδε）</text><line x1=\"165.0\" y1=\"209.0\" x2=\"165.0\" y2=\"208.5\" stroke=\"#64748b\" stroke-width=\"1.4\" stroke-linecap=\"round\"/><polygon points=\"165.0,213.0 163.0,208.4 167.0,208.4\" fill=\"#64748b\"/><rect x=\"15.0\" y=\"214.0\" width=\"300.0\" height=\"41.0\" rx=\"6\" fill=\"#fee2e2\" stroke=\"#b91c1c\" stroke-width=\"1.4\"/><text x=\"28.0\" y=\"233.0\" text-anchor=\"start\" font-size=\"12.6\" font-weight=\"700\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">④ 回流驱动 γ 旋转 → 构象改变 → ADP+Pi→ATP</text><text x=\"28.0\" y=\"250.0\" text-anchor=\"start\" font-size=\"11.2\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">每 3 个 H⁺ 合成 1 ATP + 1 个用于转运</text><rect x=\"15.0\" y=\"258.0\" width=\"300.0\" height=\"118.0\" rx=\"7\" fill=\"#ccfbf1\" stroke=\"#cbd5e1\" stroke-width=\"1.4\"/><text x=\"25.0\" y=\"277.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"700\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">两个决定性证据</text><text x=\"25.0\" y=\"295.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">· 解偶联剂 2,4-二硝基苯酚（DNP）：</text><text x=\"25.0\" y=\"311.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">携带 H⁺ 穿过内膜，梯度消失 → 电子照传但</text><text x=\"25.0\" y=\"327.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">无 ATP</text><text x=\"25.0\" y=\"343.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">· 人工酸化膜间隙可驱动 ATP 合成（</text><text x=\"25.0\" y=\"359.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">无电子传递也能产 ATP）</text><rect x=\"15.0\" y=\"384.0\" width=\"300.0\" height=\"76.0\" rx=\"7\" fill=\"#fee2e2\" stroke=\"#b91c1c\" stroke-width=\"1.2\"/><text x=\"25.0\" y=\"400.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"700\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">易错：ATP 合酶是「分子马达」，不是「通道</text><text x=\"25.0\" y=\"416.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">」（F₀ 才是通道，F₁ 是催化）</text><text x=\"25.0\" y=\"432.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">解偶联剂不抑制电子传递，只让能量以热的形</text><text x=\"25.0\" y=\"448.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">式散失</text><rect x=\"11.0\" y=\"465.0\" width=\"308.0\" height=\"51.0\" rx=\"7\" fill=\"#ccfbf1\" stroke=\"#0f766e\" stroke-width=\"1.2\"/><text x=\"165.0\" y=\"480.0\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"700\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">质子梯度（不通透内膜维持）→ F₀ 回流 → F₁ </text><text x=\"165.0\" y=\"495.5\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"700\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">旋转催化 → ATP</text></svg>","fig_sh08_inhibitor":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 330 549\" width=\"100%\" sty 75569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">细胞窒息</text><rect x=\"15.0\" y=\"190.0\" width=\"300.0\" height=\"36.0\" rx=\"3\" fill=\"#ffffff\" stroke=\"#cbd5e1\" stroke-width=\"0.9\"/><text x=\"21.0\" y=\"205.0\" text-anchor=\"start\" font-size=\"11.2\" font-weight=\"700\" fill=\"#1e293b\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">寡霉素</text><text x=\"114.9\" y=\"205.0\" text-anchor=\"start\" font-size=\"11.2\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">ATP 合酶 F₀</text><text x=\"211.2\" y=\"205.0\" text-anchor=\"start\" font-size=\"11.2\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">质子不能回流，</text><text x=\"211.2\" y=\"219.0\" text-anchor=\"start\" font-size=\"11.2\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">梯度反而更高</text><rect x=\"15.0\" y=\"226.0\" width=\"300.0\" height=\"36.0\" rx=\"3\" fill=\"#f8fafc\" stroke=\"#cbd5e1\" stroke-width=\"0.9\"/><text x=\"21.0\" y=\"241.0\" text-anchor=\"start\" font-size=\"11.2\" font-weight=\"700\" fill=\"#1e293b\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">2,4-二硝基苯酚（</text><text x=\"21.0\" y=\"255.0\" text-anchor=\"start\" font-size=\"11.2\" font-weight=\"700\" fill=\"#1e293b\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">DNP）</text><text x=\"114.9\" y=\"241.0\" text-anchor=\"start\" font-size=\"11.2\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">携带 H⁺ 穿膜（</text><text x=\"114.9\" y=\"255.0\" text-anchor=\"start\" font-size=\"11.2\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">解偶联）</text><text x=\"211.2\" y=\"241.0\" text-anchor=\"start\" font-size=\"11.2\" font-weight=\"400\" fill=\"# ><text x=\"203.9\" y=\"169.0\" text-anchor=\"start\" font-size=\"11.2\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">「解旋酶的解压阀」</text><rect x=\"15.0\" y=\"176.0\" width=\"300.0\" height=\"36.0\" rx=\"3\" fill=\"#ffffff\" stroke=\"#cbd5e1\" stroke-width=\"0.9\"/><text x=\"21.0\" y=\"191.0\" text-anchor=\"start\" font-size=\"11.2\" font-weight=\"700\" fill=\"#1e293b\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">引物酶（DnaG</text><text x=\"21.0\" y=\"205.0\" text-anchor=\"start\" font-size=\"11.2\" font-weight=\"700\" fill=\"#1e293b\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">）</text><text x=\"105.6\" y=\"191.0\" text-anchor=\"start\" font-size=\"11.2\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">合成 RNA 引物</text><text x=\"203.9\" y=\"191.0\" text-anchor=\"start\" font-size=\"11.2\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">不需引物即可起始</text><rect x=\"15.0\" y=\"212.0\" width=\"300.0\" height=\"36.0\" rx=\"3\" fill=\"#f8fafc\" stroke=\"#cbd5e1\" stroke-width=\"0.9\"/><text x=\"21.0\" y=\"227.0\" text-anchor=\"start\" font-size=\"11.2\" font-weight=\"700\" fill=\"#1e293b\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">DNA 聚合酶Ⅲ</text><text x=\"105.6\" y=\"227.0\" text-anchor=\"start\" font-size=\"11.2\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">延伸新链</text><text x=\"203.9\" y=\"227.0\" text-anchor=\"start\" font-size=\"11.2\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">主酶；有 3′→5′ 外</text><text x=\"203.9\" y=\"241.0\" text-anchor=\"start\" font-size=\"11.2\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">切校  font-size=\"13.5\" font-weight=\"700\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">易错：聚合酶Ⅰ 切除引物用的是 5′→3′ 外切，</text><text x=\"25.0\" y=\"357.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">校正错误用 3′→5′ 外切</text><text x=\"25.0\" y=\"373.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">连接酶连接的是「缺口」而不是断裂的双链——</text><text x=\"25.0\" y=\"389.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">双链断裂要另一套机制</text><rect x=\"11.0\" y=\"406.0\" width=\"308.0\" height=\"51.0\" rx=\"7\" fill=\"#ccfbf1\" stroke=\"#0f766e\" stroke-width=\"1.2\"/><text x=\"165.0\" y=\"421.0\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"700\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">解旋-稳定-解压-引物-延伸-切除-连接，</text><text x=\"165.0\" y=\"436.5\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"700\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">七步一条流水线</text></svg>","fig_sh14_telomere":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 330 493\" width=\"100%\" style=\"max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px\" role=\"img\"><text x=\"165.0\" y=\"22.6\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"700\" fill=\"#1e293b\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">端粒与端粒酶：末端复制问题</text><text x=\"165.0\" y=\"43.0\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"400\" fill=\"#64748b\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">线性 DNA 每复制一次就短一点</text><rect x=\"15.0\" y=\"58.0\" width=\"300.0\" height=\"41.0\" rx=\"6\" fill=\"#fee2e \" stroke=\"#64748b\" stroke-width=\"1.4\" stroke-linecap=\"round\"/><polygon points=\"165.0,198.0 163.0,193.4 167.0,193.4\" fill=\"#64748b\"/><rect x=\"15.0\" y=\"199.0\" width=\"300.0\" height=\"41.0\" rx=\"6\" fill=\"#dcfce7\" stroke=\"#15803d\" stroke-width=\"1.4\"/><text x=\"28.0\" y=\"218.0\" text-anchor=\"start\" font-size=\"12.6\" font-weight=\"700\" fill=\"#15803d\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">④ 谁有端粒酶</text><text x=\"28.0\" y=\"235.0\" text-anchor=\"start\" font-size=\"11.2\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">生殖细胞、干细胞、多数肿瘤细胞高表达；体细胞低</text><rect x=\"15.0\" y=\"243.0\" width=\"300.0\" height=\"102.0\" rx=\"7\" fill=\"#ccfbf1\" stroke=\"#cbd5e1\" stroke-width=\"1.4\"/><text x=\"25.0\" y=\"262.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"700\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">两个临床推论</text><text x=\"25.0\" y=\"280.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">· 肿瘤「永生化」的关键一步是端粒酶重新激</text><text x=\"25.0\" y=\"296.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">活 → 端粒酶是抗癌靶点</text><text x=\"25.0\" y=\"312.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">· 端粒缩短与衰老相关；但端粒过长也可能增</text><text x=\"25.0\" y=\"328.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">加肿瘤风险，不是「越长越好」</text><rect x=\"15.0\" y=\"353.0\" width=\"300.0\" height=\"76.0\" rx=\"7\" fill=\"#fee2e2\" stroke=\"#b91c1c\" stroke-width=\"1.2\"/><text x=\"25.0\" y=\"369.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"700\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">易错：端粒酶本质是「逆转录酶」（RNA 为模</text><text x=\"25.0\" y=\"385.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">板），不是 DNA 聚合酶</text><text x=\"25.0\" y=\"401.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">端粒缩短不是所有细胞都发生——有端粒酶活性</text><text x=\"25.0\" y=\"417.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">的细胞可维持长度</text><rect x=\"11.0\" y=\"434.0\" width=\"308.0\" height=\"51.0\" rx=\"7\" fill=\"#ccfbf1\" stroke=\"#0f766e\" stroke-width=\"1.2\"/><text x=\"165.0\" y=\"449.0\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"700\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">末端复制问题靠端粒酶（逆转录酶）解决；</text><text x=\"165.0\" y=\"464.5\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"700\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">肿瘤靠它永生化</text></svg>","fig_sh14_fidelity":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 330 462\" width=\"100%\" style=\"max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px\" role=\"img\"><text x=\"165.0\" y=\"22.6\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"700\" fill=\"#1e293b\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">复制保真：三层防线</text><text x=\"165.0\" y=\"43.0\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"400\" fill=\"#64748b\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">错误率从 10⁻⁵ 降到 10⁻⁹</text><rect x=\"15.0\" y=\"58.0\" width=\"300.0\" height=\"41.0\" rx=\"6\" fill=\"#ccfbf1\" stroke=\"#0f766e\" stroke-width=\"1.4\"/><text x=\"28.0\" y=\"77.0\" text-anchor=\"start\" font-size=\"12.6\" font-weight=\"700\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">① 碱基选择</text><text x=\"28.0\" y=\"94.0\" text-anchor=\"start\" font-size=\"11.2\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">聚合酶活性中心按几何形状筛 dNTP，错误率约 10⁻⁵</text><line x1=\"165.0\" y1=\"100.0\" x2=\"165.0\" y2=\"99.5\" stroke=\"#64748b\" stroke-width=\"1.4\" stroke-linecap=\"round\"/><polygon points=\"165.0,104.0 163.0,99.4 167.0,99.4\" fill=\"#64748b\"/><rect x=\"15.0\" y=\"105.0\" width=\"300.0\" height=\"41.0\" rx=\"6\" fill=\"#fef3c7\" stroke=\"#b45309\" stroke-width=\"1.4\"/><text x=\"28.0\" y=\"124.0\" text-anchor=\"start\" font-size=\"12.6\" font-weight=\"700\" fill=\"#b45309\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">② 3′→5′ 外切校正</text><text x=\"28.0\" y=\"141.0\" text-anchor=\"start\" font-size=\"11.2\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">校对活性切掉错配碱基，再降 100~1000 倍</text><line x1=\"165.0\" y1=\"147.0\" x2=\"165.0\" y2=\"146.5\" stroke=\"#64748b\" stroke-width=\"1.4\" stroke-linecap=\"round\"/><polygon points=\"165.0,151.0 163.0,146.4 167.0,146.4\" fill=\"#64748b\"/><rect x=\"15.0\" y=\"152.0\" width=\"300.0\" height=\"41.0\" rx=\"6\" fill=\"#dcfce7\" stroke=\"#15803d\" stroke-width=\"1.4\"/><text x=\"28.0\" y=\"171.0\" text-anchor=\"start\" font-size=\"12.6\" font-weight=\"700\" fill=\"#15803d\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">③ 错配修复（MMR）</text><text x=\"28.0\" y=\"188.0\" text-anchor=\"start\" font-size=\"11.2\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">复制后识别并修正错配，再降 100~1000 倍</text><rect x=\"15.0\" y=\"196.0\" width=\"300.0\" height=\"118.0\" rx=\"7\" fill=\"#dcfce7\" stroke=\"#cbd5e1\" stroke-width=\"1.4\"/><text x=\"25.0\" y=\"215.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"700\" fill=\"#15803d\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">错配修复的识别逻辑</text><text x=\"25.0\" y=\"233.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#15803d\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">· 新合成链尚未甲基化（原核 dam 甲基化），</text><text x=\"25.0\" y=\"249.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#15803d\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">旧链已甲基化 → 据此判断「改哪条」</text><text x=\"25.0\" y=\"265.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#15803d\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">· 真核靠新链暂时的切口（nicked）识别</text><text x=\"25.0\" y=\"281.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#15803d\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">· MMR 缺陷 → 微卫星不稳定（MSI）→ Lync</text><text x=\"25.0\" y=\"297.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#15803d\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">h 综合征，且对免疫治疗敏感</text><rect x=\"15.0\" y=\"322.0\" width=\"300.0\" height=\"76.0\" rx=\"7\" fill=\"#fee2e2\" stroke=\"#b91c1c\" stroke-width=\"1.2\"/><text x=\"25.0\" y=\"338.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"700\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">易错：三层防线是「串联放大」，不是「并联</text><text x=\"25.0\" y=\"354.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">备份」——去掉任何一层错误率都显著上升</text><text x=\"25.0\" y=\"370.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">MMR 修的是「错配」，不是「损伤」，与 NER</text><text x=\"25.0\" y=\"386.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">/BER 分工不同</text><rect x=\"11.0\" y=\"403.0\" width=\"308.0\" height=\"51.0\" rx=\"7\" fill=\"#ccfbf1\" stroke=\"#0f766e\" stroke-width=\"1.2\"/><text x=\"165.0\" y=\"418.0\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"700\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">碱基选择 + 外切校正 + 错配修复，三层串联把</text><text x=\"165.0\" y=\"433.5\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"700\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">错误率降到 10⁻⁹</text></svg>","fig_sh14_reverse":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 330 496\" width=\"100%\" style=\"max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px\" role=\"img\"><text x=\"165.0\" y=\"22.6\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"700\" fill=\"#1e293b\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">逆转录：中心法则的扩展</text><text x=\"165.0\" y=\"43.0\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"400\" fill=\"#64748b\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">RNA → DNA，三步</text><rect x=\"15.0\" y=\"58.0\" width=\"300.0\" height=\"56.0\" rx=\"6\" fill=\"#ccfbf1\" stroke=\"#0f766e\" stroke-width=\"1.4\"/><text x=\"28.0\" y=\"77.0\" text-anchor=\"start\" font-size=\"12.6\" font-weight=\"700\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">① RNA 模板 + tRNA 引物</text><text x=\"28.0\" y=\"94.0\" text-anchor=\"start\" font-size=\"11.2\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">逆转录酶以 RNA 为模板，需要引物（病毒用宿主 tRN</text><text x=\"28.0\" y=\"109.0\" text-anchor=\"start\" font-size=\"11.2\" font-weight=\"400\" fil -apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">原理</text><rect x=\"15.0\" y=\"235.0\" width=\"300.0\" height=\"36.0\" rx=\"3\" fill=\"#f8fafc\" stroke=\"#cbd5e1\" stroke-width=\"0.9\"/><text x=\"21.0\" y=\"250.0\" text-anchor=\"start\" font-size=\"11.2\" font-weight=\"700\" fill=\"#1e293b\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">cDNA 合成</text><text x=\"124.0\" y=\"250.0\" text-anchor=\"start\" font-size=\"11.2\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">逆转录 + 第二链合成，用于克隆与表</text><text x=\"124.0\" y=\"264.0\" text-anchor=\"start\" font-size=\"11.2\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">达</text><rect x=\"15.0\" y=\"271.0\" width=\"300.0\" height=\"22.0\" rx=\"3\" fill=\"#ffffff\" stroke=\"#cbd5e1\" stroke-width=\"0.9\"/><text x=\"21.0\" y=\"286.0\" text-anchor=\"start\" font-size=\"11.2\" font-weight=\"700\" fill=\"#1e293b\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">端粒酶</text><text x=\"124.0\" y=\"286.0\" text-anchor=\"start\" font-size=\"11.2\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">本质即逆转录酶</text><rect x=\"15.0\" y=\"293.0\" width=\"300.0\" height=\"36.0\" rx=\"3\" fill=\"#f8fafc\" stroke=\"#cbd5e1\" stroke-width=\"0.9\"/><text x=\"21.0\" y=\"308.0\" text-anchor=\"start\" font-size=\"11.2\" font-weight=\"700\" fill=\"#1e293b\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">NRTI 类抗 HIV </text><text x=\"21.0\" y=\"322.0\" text-anchor=\"start\" font-size=\"11.2\" font-weight=\"700\" fill=\"#1e293b\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">药</text><text x=\"124.0\" y=\"308.0\" text-anchor=\"start\" font-size=\"11.2\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">核苷类逆转录 的来源与去路","src":"figs/gif_sh10_ammonia.gif","d":"血氨主要来自氨基酸脱氨基与肠道细菌产氨；去路以肝合成尿素为主，其次为合成谷氨酰胺运输与肾","slug":"sh10_ammonia"},{"k":"urea","t":"尿素循环五步","src":"figs/gif_sh10_urea.gif","d":"氨与二氧化碳在CPS-Ⅰ催化下合成氨甲酰磷酸，与鸟氨酸结合成瓜氨酸出线粒体，再接上第二个","slug":"sh10_urea"}],"11":[{"k":"urate","t":"嘌呤分解与尿酸生成","src":"figs/gif_sh11_urate.gif","d":"嘌呤核苷酸逐步降解为次黄嘌呤与鸟嘌呤，再经黄嘌呤氧化酶氧化为黄嘌呤、最终生成尿酸。人类缺","slug":"sh11_urate"}],"12":[{"k":"states","t":"进食—空腹—饥饿的代谢切换","src":"figs/gif_sh12_states.gif","d":"进食后以葡萄糖为主并储存；空腹早期依赖肝糖原，12小时后转向糖异生；长期饥饿时脂肪动员与","slug":"sh12_states"}],"13":[{"k":"gene","t":"断裂基因与剪接","src":"figs/gif_sh13_gene.gif","d":"真核基因由外显子与内含子相间构成，转录后经剪接去除内含子、拼接外显子，才能形成成熟mRN","slug":"sh13_gene"}],"14":[{"k":"fork","t":"DNA 复制的半不连续","src":"figs/gif_sh14_fork.gif","d":"DNA聚合酶只能沿5′→3′方向延伸，因此以复制叉移动方向为参照，一条链可连续合成（前导","slug":"sh14_fork"},{"k":"telomere","t":"端粒与端粒酶","src":"figs/gif_sh14_telomere.gif","d":"线性DNA复制时末端引物去除后无法补齐，端粒逐代缩短；端粒酶以自身RNA为模板延长3′端","slug":"sh14_telomere"}],"15":[{"k":"splice","t":"RNA 剪接的两次酯交换","src":"figs/gif_sh15_splice.gif","d":"剪接体识别5′剪接位点与分支点后，经两次酯交换把内含子以套索形式切除、并把相邻外显子连接","slug":"sh15_splice"},{"k":"transcribe","t":"转录的起始与延伸","src":"figs/gif_sh15_transcribe.gif","d":"RNA聚合酶由σ因子识别启动子（-35与-10区）后起始转录，局部解链形成开放复合物，按","slug":"sh15_transcribe"}],"16":[{"k":"ribosome","t":"核糖体三位点循环","src":"figs/gif_sh16_ribosome.gif","d":"氨酰-tRNA进入A位，肽酰转移酶（由rRNA催化）把肽链转到新氨基酸上，随后核糖体沿m","slug":"sh16_ribosome"}],"17":[{"k":"lac","t":"乳糖操纵子的双重调控","src":"figs/gif_sh17_lac.gif","d":"乳糖存在时阻遏蛋白从操纵基因脱落（负调控解除）；葡萄糖低时cAMP升高、CAP结合启动子","slug":"sh17_lac"}],"21":[{"k":"camp","t":"cAMP 级联的放大","src":"figs/gif_sh21_camp.gif","d":"一个激素分子结合受体后激活多个G蛋白，每个腺苷酸环化酶生成大量cAMP，cAMP激活PK","slug":"sh21_camp"},{"k":"rtk","t":"受体酪氨酸激酶的两条主路","src":"figs/gif_sh21_rtk.gif","d":"配体结合使RTK二聚化并自身磷酸化，磷酸酪氨酸位点招募接头蛋白，分别启动Ras-MAPK","slug":"sh21_rtk"}],"22":[{"k":"warburg","t":"Warburg 效应","src":"figs/gif_sh22_warburg.gif","d":"肿瘤细胞即使在有氧条件下也大量进行糖酵解。虽然每分子葡萄糖产ATP少，但通量大、可提供生","slug":"sh22_warburg"}],"23":[{"k":"brca","t":"PARP 抑制剂与 BRCA 的合成致死","src":"figs/gif_sh23_brca.gif","d":"抑制PARP使单链断裂堆积并在复制时转为双链断裂。正常细胞可用同源重组修复，而BRCA1","slug":"sh23_brca"}],"25":[{"k":"bilirubin","t":"胆红素的生成、转运与排泄","src":"figs/gif_sh25_bilirubin.gif","d":"血红蛋白降解生成未结合胆红素，与白蛋白结合运至肝，在肝内与葡萄糖醛酸结合成水溶性结合胆红","slug":"sh25_bilirubin"}],"26":[{"k":"g6pd","t":"G6PD 缺乏致溶血的链条","src":"figs/gif_sh26_g6pd.gif","d":"G6PD缺乏时NADPH生成不足，谷胱甘肽无法还原，红细胞在氧化性诱因下血红蛋白与膜脂被","slug":"sh26_g6pd"}]};

let curCh = 'all', kw = '';

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;')
  .replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function renderChips(){
  const el = document.getElementById('chips');
  let h = `<div class="chip ${curCh==='all'?'on':''}" data-ch="all">全部 ${CARDS.length}</div>`;
  for (const [k, name] of CHAPTERS) {
    const n = CARDS.filter(c => c[0].slice(3,5) === k).length;
    h += `<div class="chip ${curCh===k?'on':''}" data-ch="${k}">${k} ${name}<b style="opacity:.65;margin-left:3px">${n}</b></div>`;
  }
  el.innerHTML = h;
  el.querySelectorAll('.chip').forEach(c => {
    c.onclick = () => { curCh = c.dataset.ch; renderChips(); renderList(); };
  });
}

function cardText(c){
  let t = c[1] + ' ';
  for (const b of c[3]) {
    if (b[0] === 'q' || b[0] === 'q2') t += b[1] + ' ';
    else if (b[0] === 'l') t += b[2].join(' ') + ' ';
    else if (b[0] === 't') t += b[1] + ' ' + b[3].flat().join(' ') + ' ';
    else if (b[0] === 'i') {
      t += (b[2]||'') + ' ' + (b[3]||'') + ' ';
      const raw = (FIGS[b[1]]||'').replace(/<[^>]+>/g,' ');
      t += raw + ' ';
    }
  }
  return t;
}

function renderList(){
  const list = document.getElementById('list');
  let sel = CARDS.filter(c => curCh === 'all' || c[0].slice(3,5) === curCh);
  if (kw) {
    const k = kw.toLowerCase().replace(/\s+/g,'');
    sel = sel.filter(c => cardText(c).toLowerCase().replace(/\s+/g,'').includes(k));
  }
  document.getElementById('stat').textContent =
    `共 ${sel.length} 张卡` + (kw ? `（搜索「${kw}」）` : '');
  let html = '';
  const doneCh = {};
  for (const [id, title, lv, blocks] of sel) {
    const ch = id.slice(3,5);
    if (!doneCh[ch] && (MOTION[ch] || []).length) {
      doneCh[ch] = 1;
      html += `<div class="mcard"><div class="mh">▶ 本章动态图 ${MOTION[ch].length} 张</div>`;
      for (const m of MOTION[ch]) {
        html += `<div class="motion"><div class="mt">${esc(m.t)}</div>
          <img loading="lazy" src="${m.src}" alt="${esc(m.t)}">
          <div class="md">${esc(m.d)}</div></div>`;
      }
      html += `</div>`;
    }
    html += `<div class="card" id="card-${id}" data-fig="${(blocks.find(b=>b[0]==='i')||[])[1]||''}">
      <h2>${esc(title)}<span class="lv">第${Number(ch)}章</span></h2>`;
    for (const b of blocks) {
      if (b[0] === 'q') {
        html += `<div class="q">★ ${esc(b[1])}</div>`;
      } else if (b[0] === 'q2') {
        html += `<div class="q" style="background:#fffbeb;border-color:#b45309">💡 ${esc(b[1])}</div>`;
      } else if (b[0] === 'i') {
        const svg = FIGS[b[1]] || '';
        html += `<div class="fig" onclick="zoomFig('${b[1]}')">${svg}
          <div class="fig-cap">${esc(b[2]||'')}</div>
          <div class="fig-tip">🔍 点击全屏</div></div>`;
        if (b[3]) html += `<div class="cmt"><b>怎么读：</b>${esc(b[3])}</div>`;
      } else if (b[0] === 't') {
        html += `<div class="tw"><table><tr>${b[2].map(h=>`<th>${esc(h)}</th>`).join('')}</tr>`;
        for (const r of b[3]) html += `<tr>${r.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`;
        html += `</table></div>`;
      } else if (b[0] === 'l') {
        html += `<ul>${b[2].map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
      }
    }
    html += `</div>`;
  }
  list.innerHTML = html || '<p style="color:#64748b;padding:20px;text-align:center">没有匹配的卡片</p>';
}

let zEl = null;
function zoomFig(id){
  const svg = FIGS[id];
  if (!svg) return;
  if (!zEl) {
    zEl = document.createElement('div');
    zEl.className = 'zoom';
    zEl.onclick = () => zEl.classList.remove('on');
    document.body.appendChild(zEl);
  }
  zEl.innerHTML = `<div class="in">${svg}<div class="tip">点击任意处关闭</div></div>`;
  zEl.classList.add('on');
}

document.getElementById('q').addEventListener('input', e => {
  kw = e.target.value.trim();
  renderList();
});

renderChips();
renderList();

(function(){
  function gotoHash(){
    var h = (location.hash || '').replace('#','').trim();
    if (!h) return;
    if (h.indexOf('fig_') === 0) {
      var cf = document.querySelector('[data-fig="' + h + '"]');
      if (cf) {
        var mm = /card-SH-(\d{2})-/.exec(cf.id);
        if (mm) { curCh = mm[1]; renderChips(); renderList(); }
        setTimeout(function(){
          var e2 = document.querySelector('[data-fig="' + h + '"]');
          if (e2) {
            e2.scrollIntoView({behavior:'smooth', block:'start'});
            e2.style.transition = 'box-shadow .4s';
            e2.style.boxShadow = '0 0 0 3px #9a3412';
            setTimeout(function(){ e2.style.boxShadow = ''; }, 2400);
          }
        }, 80);
        return;
      }
    }
    var m = /^SH-(\d{2})-/.exec(h) || /^card-SH-(\d{2})-/.exec(h);
    if (m) { curCh = m[1]; renderChips(); renderList(); }
    var el = document.getElementById('card-' + h.replace(/^card-/, '')) || document.getElementById(h);
    if (el) {
      el.scrollIntoView({behavior:'smooth', block:'start'});
      el.style.transition = 'box-shadow .4s';
      el.style.boxShadow = '0 0 0 3px #9a3412';
      setTimeout(function(){ el.style.boxShadow = ''; }, 2200);
    }
  }
  window.addEventListener('load', function(){ setTimeout(gotoHash, 60); });
  window.addEventListener('hashchange', gotoHash);
})();
</script>
