汁酸丢失」） 数据 值 胆汁酸池 3~5 g 每日合成 0.4~0.6 g（补足粪排） 循环次数 6~10 次/日 易错：初级＝胆酸 + 鹅脱氧胆酸；次级＝脱氧 胆酸 + 石胆酸（细菌改造） 回肠切除/病变 → 胆汁酸吸收障碍 → 脂肪泻 + 胆石症风险↑ 胆汁酸池 3~5 g、每日循环 6~10 次； 初级由肝造、次级由菌改","fig_sh25_bilirubin":"胆红素：两种形式，两条路 未结合脂溶不入尿，结合水溶可入尿 对比 未结合胆红素 结合胆红素 水溶性 差（脂溶） 好 与白蛋白 结合运输 不结合 能否过肾滤 不能（故尿中阴性 ） 能（尿胆红素阳性 ） 能否过血脑屏 障 能（核黄疸风险） 不能 范登堡试验 间接反应 直接反应 为什么新生儿容易黄疸 · 红细胞寿命短、破坏多 → 胆红素生成量大 · 肝 UDP-葡萄糖醛酸转移酶活性低（ 发育不成熟）→ 结合能力不足 · 肠肝循环活跃（肠道菌群未建立，β-葡糖醛 酸苷酶活性高）→ 重吸收多 · 所以生理性黄疸多在生后 2~3 天出现、 1~2 周消退 易错：未结合胆红素不能经尿排出（脂溶、 与白蛋白结合），所以尿胆红素阴性 核黄疸的机制是未结合胆红素脂溶性、 可过血脑屏障沉积于基底节 未结合脂溶不入尿、可致核黄疸；结合水溶可入 尿；新生儿三因叠加致黄疸","fig_sh25_jaundice":"三型黄疸的指标组合 看以哪一项升高为主 类型 未结合 结合 尿胆红素 / 尿胆原 溶血性 ↑↑ 正常/轻↑ 阴性 / ↑↑ 肝细胞性 ↑ ↑ 阳性 / 不定 梗阻性 正常/轻↑ ↑↑ 强阳性 / ↓或阴性 为什么这样组合 · 溶血：生成过多，肝结合能力相对不足 → 未结合升高；尿胆原肠肝循环增加 → 尿胆原↑ · 肝细胞：结合与排泄都受损 → 两相都升高 · 梗阻：结合胆红素排不出 → 反流入血 → 结 合↑↑；肠道无胆红素 → 尿胆原↓ 易错：梗阻性黄疸「尿胆红素强阳性、 尿胆原减少或消失」——两者方向相反 溶血性黄疸尿胆红素阴性，这是与另两型最直 接的鉴别点 溶血未结合↑尿胆原↑、肝细胞双相↑、梗阻结合↑ ↑尿胆原↓","fig_sh25_biotrans":"生物转化：两相反应 Ⅰ相「加工」，Ⅱ相「加标签」 相 反应类型 目的 Ⅰ 相 氧化、还原、水解（CYP450 为 主） 暴露极性基团（-OH、 -NH₂、-COOH） Ⅱ 相 葡萄糖醛酸结合、硫酸结合、 乙酰化、谷胱甘肽结合、甲基化 极性大增， 便于排出 「生物转化 ≠ 解毒」 · 多数情况确实降低毒性、增加水溶性便于排 出 · 但少数情况会「致毒」：前致癌物（ 如苯并芘、黄曲霉毒素）经 CYP450 活化才致 癌 · 对乙酰氨基酚过量时，CYP450 产生毒性代 谢物 NAPQI，谷胱甘肽耗尽即肝坏死 易错：CYP450 是Ⅰ相酶（不是Ⅱ相） CYP450 被诱导（如利福平）会加速其他药物 代谢 → 药效下降（药物相互作用） Ⅰ相 CYP450 暴露极性基团、Ⅱ相结合反应便于 排出；但也可致毒","fig_sh25_liver":"肝功能指标：各自反映什么 别只看 ALT 指标 反映 敏感度 ALT 肝细胞损伤 最敏感（胞质，轻度损伤 即升高） AST 肝细胞（ 线粒体）损伤 重型肝炎时 AST&gt;ALT 提 示线粒体损伤 ALP / GGT 胆道梗阻/胆汁 淤积 GGT 更特异地反映胆道 白蛋白 肝合成功能 半衰期约 20 天， 反映慢性功能 凝血酶原时 间 PT 肝合成功能 因子Ⅶ 半衰期 4~6 h， 最敏感 易错：PT/INR 是最能反映「急性肝合成功能 」的指标（因子Ⅶ 半衰期最短） 白蛋白半衰期长，急性肝衰早期可正常——不能 靠它早期判断 ALT 看损伤、ALP/GGT 看胆道、白蛋白与 PT 看合成；急性功能看 PT","fig_sh26_protein":"血浆蛋白：白蛋白与球蛋白 A/G 比值的意义 白蛋白 35~55 g/L，占血浆总蛋白约 60% 维持 75~80% 胶体渗透压、运输、缓冲 球蛋白 α₁、α₂、β、γ 四段 运输、免疫（γ 球蛋白即抗体）、凝血因子 A/G 比值 正常 1.5~2.5 肝硬化、肾病综合征时下降或倒置 白蛋白为什么会低 · 合成减少：肝硬化、营养不良 · 丢失过多：肾病综合征（尿蛋白）、 蛋白丢失性肠病 · 分布异常：大量腹水、严重感染（毛细血管 渗漏） · 临床上「低白蛋白」必须三者都想到， 不能只想到「营养差」 易错：白蛋白只由肝合成，半衰期约 20 天 → 反映「慢性」肝功能 γ 球蛋白升高（而非白蛋白下降）是多发性骨 髓瘤的重要线索 白蛋白维持胶渗压 + 运输；A/G 倒置见肝硬化 与肾病；白蛋白低要三分法找原因","fig_sh26_rbc":" let curCh = 'all', kw = '';

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;')
  .replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function renderChips(){
  const el = document.getElementById('chips');
  let h = `<div class="chip ${curCh==='all'?'on':''}" data-ch="all">全部 ${CARDS.length}</div>`;
  for (const [k, name] of CHAPTERS) {
    const n = CARDS.filter(c => c[0].slice(3,5) === k).length;
    h += `<div class="chip ${curCh===k?'on':''}" data-ch="${k}">${k} ${name}<b style="opacity:.65;margin-left:3px">${n}</b></div>`;
  }
  el.innerHTML = h;
  el.querySelectorAll('.chip').forEach(c => {
    c.onclick = () => { curCh = c.dataset.ch; renderChips(); renderList(); };
  });
}

function cardText(c){
  let t = c[1] + ' ';
  for (const b of c[3]) {
    if (b[0] === 'q' || b[0] === 'q2') t += b[1] + ' ';
    else if (b[0] === 'l') t += b[2].join(' ') + ' ';
    else if (b[0] === 't') t += b[1] + ' ' + b[3].flat().join(' ') + ' ';
    else if (b[0] === 'i') {
      t += (b[2]||'') + ' ' + (b[3]||'') + ' ';
      t += (FIGTXT[b[1]] || '') + ' ';
    }
  }
  return t;
}

function renderList(){
  const list = document.getElementById('list');
  let sel = CARDS.filter(c => curCh === 'all' || c[0].slice(3,5) === curCh);
  if (kw) {
    const k = kw.toLowerCase().replace(/\s+/g,'');
    sel = sel.filter(c => cardText(c).toLowerCase().replace(/\s+/g,'').includes(k));
  }
  document.getElementById('stat').textContent =
    `共 ${sel.length} 张卡` + (kw ? `（搜索「${kw}」）` : '');
  let html = '';
  const doneCh = {};
  for (const [id, title, lv, blocks] of sel) {
    const ch = id.slice(3,5);
    if (!doneCh[ch] && (MOTION[ch] || []).length) {
      doneCh[ch] = 1;
      html += `<div class="mcard"><div class="mh">▶ 本章动态图 ${MOTION[ch].length} 张</div>`;
      for (const m of MOTION[ch]) {
        html += `<div class="motion"><div class="mt">${esc(m.t)}</div>
          <img loading="lazy" src="${m.src}" alt="${esc(m.t)}">
          <div class="md">${esc(m.d)}</div></div>`;
      }
      html += `</div>`;
    }
    html += `<div class="card" id="card-${id}" data-fig="${(blocks.find(b=>b[0]==='i')||[])[1]||''}">
      <h2>${esc(title)}<span class="lv">第${Number(ch)}章</span></h2>`;
    for (const b of blocks) {
      if (b[0] === 'q') {
        html += `<div class="q">★ ${esc(b[1])}</div>`;
      } else if (b[0] === 'q2') {
        html += `<div class="q" style="background:#fffbeb;border-color:#b45309">💡 ${esc(b[1])}</div>`;
      } else if (b[0] === 'i') {
        const src = 'figs/' + b[1] + '.svg';
        html += `<div class="fig" onclick="zoomFig('${b[1]}')">
          <img loading="lazy" decoding="async" src="${src}" alt="${esc(b[2]||'')}"
               style="display:block;width:100%;max-width:330px;height:auto;margin:0 auto">
          <div class="fig-cap">${esc(b[2]||'')}</div>
          <div class="fig-tip">🔍 点击全屏</div></div>`;
        if (b[3]) html += `<div class="cmt"><b>怎么读：</b>${esc(b[3])}</div>`;
      } else if (b[0] === 't') {
        html += `<div class="tw"><table><tr>${b[2].map(h=>`<th>${esc(h)}</th>`).join('')}</tr>`;
        for (const r of b[3]) html += `<tr>${r.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`;
        html += `</table></div>`;
      } else if (b[0] === 'l') {
        html += `<ul>${b[2].map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
      }
    }
    html += `</div>`;
  }
  list.innerHTML = html || '<p style="color:#64748b;padding:20px;text-align:center">没有匹配的卡片</p>';
}

let zEl = null;
function zoomFig(id){
  const src = 'figs/' + id + '.svg';
  if (!zEl) {
    zEl = document.createElement('div');
    zEl.className = 'zoom';
    zEl.onclick = () => zEl.classList.remove('on');
    document.body.appendChild(zEl);
  }
  zEl.innerHTML = `<div class="in"><img src="${src}" alt=""
    style="display:block;width:100%;height:auto"><div class="tip">点击任意处关闭</div></div>`;
  zEl.classList.add('on');
}

document.getElementById('q').addEventListener('input', e => {
  kw = e.target.value.trim();
  renderList();
});

renderChips();
renderList();

(function(){
  function gotoHash(){
    var h = (location.hash || '').replace('#','').trim();
    if (!h) return;
    if (h.indexOf('fig_') === 0) {
      var cf = document.querySelector('[data-fig="' + h + '"]');
      if (cf) {
        var mm = /card-SH-(\d{2})-/.exec(cf.id);
        if (mm) { curCh = mm[1]; renderChips(); renderList(); }
        setTimeout(function(){
          var e2 = document.querySelector('[data-fig="' + h + '"]');
          if (e2) {
            e2.scrollIntoView({behavior:'smooth', block:'start'});
            e2.style.transition = 'box-shadow .4s';
            e2.style.boxShadow = '0 0 0 3px #9a3412';
            setTimeout(function(){ e2.style.boxShadow = ''; }, 2400);
          }
        }, 80);
        return;
      }
    }
    var m = /^SH-(\d{2})-/.exec(h) || /^card-SH-(\d{2})-/.exec(h);
    if (m) { curCh = m[1]; renderChips(); renderList(); }
    var el = document.getElementById('card-' + h.replace(/^card-/, '')) || document.getElementById(h);
    if (el) {
      el.scrollIntoView({behavior:'smooth', block:'start'});
      el.style.transition = 'box-shadow .4s';
      el.style.boxShadow = '0 0 0 3px #9a3412';
      setTimeout(function(){ el.style.boxShadow = ''; }, 2200);
    }
  }
  window.addEventListener('load', function(){ setTimeout(gotoHash, 60); });
  window.addEventListener('hashchange', gotoHash);
})();
</script>
