=\"13.5\" font-weight=\"700\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">酶降低活化能、不改变 ΔG；只加速到达平衡，</text><text x=\"165.0\" y=\"393.5\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"700\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">不改变平衡点</text></svg>","fig_sh02_michaelis":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 330 544\" width=\"100%\" style=\"max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px\" role=\"img\"><text x=\"165.0\" y=\"22.6\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"700\" fill=\"#1e293b\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">米氏方程的三个关键点</text><text x=\"165.0\" y=\"43.0\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"400\" fill=\"#64748b\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">v = Vmax·[S] / (Km + [S])</text><rect x=\"23.0\" y=\"58.0\" width=\"284.0\" height=\"156.0\" rx=\"6\" fill=\"#ffffff\" stroke=\"#cbd5e1\" stroke-width=\"1.2\"/><polyline points=\"35.0,192.0 40.2,174.9 45.4,162.7 50.6,153.5 55.8,146.4 61.0,140.7 66.2,136.0 71.4,132.1 76.6,128.9 81.8,126.0 87.0,123.6 92.2,121.5 97.4,119.6 102.6,117.9 107.8,116.4 113.0,115.0 118.2,113.8 123.4,112.7 128.6,111.7 133.8,110.8 139.0,109.9 144.2,109.1 149.4,108.4 154.6,107.7 159.8,107.1 165.0,106.5 170.2,105.9 175.4,105.4 180.6,104.9 185.8,104.5 191.0,104.0 196.2,103.6 201.4,103.3 206.6,102.9 211.8,102.5 217.0,102.2 222.2,101.9 227.4,101.6 232.6,101.3 237.8,101.1 243.0,100.8 248.2,100.5 253.4,100.3 258.6,100.1 263.8,99.9 269.0,99.7 274.2,99.5 279.4,99.3 284.6,99.1 289.8,98.9 295.0,98.7\" fill=\"none\" stroke=\"#0f766e\" stroke-width=\"2.6\" stroke-linecap=\"round\"/><path d=\"M35.0,89.4 H295.0\" stroke=\"#0f766e\" stroke-width=\"1\" stroke-dasharray=\"4 3\" opacity=\"0.75\"/><path d=\"M61.0,140.7 H35.0\" stroke=\"#b45309\" stroke-width=\"1\" stroke-dasharray=\"3 2\"/><path d rosoft YaHei',sans-serif\">必背</text><text x=\"27.0\" y=\"259.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">Km 单位是浓度，是半速底物浓度</text><rect x=\"15.0\" y=\"274.0\" width=\"300.0\" height=\"42.0\" rx=\"6\" fill=\"#f8fafc\" stroke=\"#cbd5e1\" stroke-width=\"1.5\"/><text x=\"27.0\" y=\"294.0\" text-anchor=\"start\" font-size=\"14\" font-weight=\"700\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">Km 小 → 亲和力高</text><text x=\"305.0\" y=\"294.0\" text-anchor=\"end\" font-size=\"13.5\" font-weight=\"700\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">反比</text><text x=\"27.0\" y=\"311.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">Km 是亲和力的倒数度量</text><rect x=\"15.0\" y=\"326.0\" width=\"300.0\" height=\"102.0\" rx=\"7\" fill=\"#f8fafc\" stroke=\"#cbd5e1\" stroke-width=\"1.4\"/><text x=\"25.0\" y=\"345.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"700\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">两个易混的「常数」</text><text x=\"25.0\" y=\"363.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">· Km：与酶浓度无关，随底物种类/pH/温度/</text><text x=\"25.0\" y=\"379.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">离子强度而变 → 反映亲和力</text><text x=\"25.0\" y=\"395.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">· Vmax：= kcat·[E]总，随酶量变 → 反映</text><text x=\"25.0\" y=\"411.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#475569\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">酶量；kcat 才是固有催化常数</text><rect x=\"15.0\" y=\"436.0\" width=\"300.0\" height=\"44.0\" rx=\"7\" fill=\"#fee2e2\" stroke=\"#b91c1c\" stroke-width=\"1.2\"/><text x=\"25.0\" y=\"452.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"700\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">易错：Km 越大亲和力越「强」——恰恰相反，</text><text x=\"25.0\" y=\"468.0\" text-anchor=\"start\" font-size=\"13.5\" font-weight=\"400\" fill=\"#b91c1c\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">Km 越大亲和力越弱</text><rect x=\"11.0\" y=\"485.0\" width=\"308.0\" height=\"51.0\" rx=\"7\" fill=\"#ccfbf1\" stroke=\"#0f766e\" stroke-width=\"1.2\"/><text x=\"165.0\" y=\"500.0\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"700\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">Km 是半速底物浓度（越小越亲和）；Vmax 随酶</text><text x=\"165.0\" y=\"515.5\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"700\" fill=\"#0f766e\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">量变，不是固有常数</text></svg>","fig_sh02_inhibit":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 330 615.5\" width=\"100%\" style=\"max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px\" role=\"img\"><text x=\"165.0\" y=\"22.6\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"700\" fill=\"#1e293b\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">三种可逆抑制：只看 Vmax 与 Km</text><text x=\"165.0\" y=\"42.6\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"400\" fill=\"#64748b\" font-family=\"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif\">竞争性：Vmax不变Km↑ · 非竞争：Vmax↓Km不变 · 反竞争：两者都↓</text><rect x=\"15.0\" y=\"57.5\" width=\"300.0\" height=\"86.0\" rx=\"7\" fill=\"#fee2e2\" stroke=\"#b91c1c\" stroke-width=\"1.5\"/><text x=\"26.0\" y=\"78.5\" text-anchor=\"sta const MOTION = {"01":[{"k":"四级结构","t":"蛋白质折叠的四级层次","src":"figs/gif_sh01_fold.gif","d":"一级肽键 → 二级氢键 → 三级疏水塌缩 → 四级亚基组装；驱动力逐层更换","card":"SH-01-03"},{"k":"Hb 与 Mb","t":"Hb 的正协同与玻尔效应","src":"figs/gif_sh01_hb.gif","d":"每结合一个 O₂，T 态转 R 态，其余亚基亲和力骤升，形成 S 形曲线","card":"SH-01-06"},{"k":"变性","t":"变性 与 盐析","src":"figs/gif_sh01_denature.gif","d":"变性毁构象、不可逆；盐析只沉淀、稀释即复溶","card":"SH-01-05"}],"02":[{"k":"三种可逆抑制","t":"三种可逆抑制的动力学后果","src":"figs/gif_sh02_inhibit.gif","d":"竞争性被底物挤走 Km↑Vmax 不变；非竞争锁死部分酶 Vmax↓；反竞争只认 ES","card":"SH-02-03"},{"k":"三种活性调节","t":"酶原激活：切一刀就开工","src":"figs/gif_sh02_zymogen.gif","d":"激活肽被有限水解掉，活性中心暴露，已活化的酶再激活更多酶原","card":"SH-02-04"},{"k":"米氏方程","t":"米氏曲线为什么会饱和","src":"figs/gif_sh02_mm.gif","d":"底物少则线性、[S]=Km 时半速、底物过量则饱和；酶座位有限","card":"SH-02-02"}]};

let curCh = 'all', kw = '';

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;')
  .replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function renderChips(){
  const el = document.getElementById('chips');
  let h = `<div class="chip ${curCh==='all'?'on':''}" data-ch="all">全部 ${CARDS.length}</div>`;
  for (const [k, name] of CHAPTERS) {
    const n = CARDS.filter(c => c[0].slice(3,5) === k).length;
    h += `<div class="chip ${curCh===k?'on':''}" data-ch="${k}">${k} ${name}<b style="opacity:.65;margin-left:3px">${n}</b></div>`;
  }
  el.innerHTML = h;
  el.querySelectorAll('.chip').forEach(c => {
    c.onclick = () => { curCh = c.dataset.ch; renderChips(); renderList(); };
  });
}

function cardText(c){
  let t = c[1] + ' ';
  for (const b of c[3]) {
    if (b[0] === 'q' || b[0] === 'q2') t += b[1] + ' ';
    else if (b[0] === 'l') t += b[2].join(' ') + ' ';
    else if (b[0] === 't') t += b[1] + ' ' + b[3].flat().join(' ') + ' ';
    else if (b[0] === 'i') {
      t += (b[2]||'') + ' ' + (b[3]||'') + ' ';
      const raw = (FIGS[b[1]]||'').replace(/<[^>]+>/g,' ');
      t += raw + ' ';
    }
  }
  return t;
}

function renderList(){
  const list = document.getElementById('list');
  let sel = CARDS.filter(c => curCh === 'all' || c[0].slice(3,5) === curCh);
  if (kw) {
    const k = kw.toLowerCase().replace(/\s+/g,'');
    sel = sel.filter(c => cardText(c).toLowerCase().replace(/\s+/g,'').includes(k));
  }
  document.getElementById('stat').textContent =
    `共 ${sel.length} 张卡` + (kw ? `（搜索「${kw}」）` : '');
  let html = '';
  for (const [id, title, lv, blocks] of sel) {
    const ch = id.slice(3,5);
    html += `<div class="card" id="card-${id}" data-fig="${(blocks.find(b=>b[0]==='i')||[])[1]||''}">
      <h2>${esc(title)}<span class="lv">第${Number(ch)}章</span></h2>`;
    for (const b of blocks) {
      if (b[0] === 'q') {
        html += `<div class="q">★ ${esc(b[1])}</div>`;
      } else if (b[0] === 'q2') {
        html += `<div class="q" style="background:#fffbeb;border-color:#b45309">💡 ${esc(b[1])}</div>`;
      } else if (b[0] === 'i') {
        const svg = FIGS[b[1]] || '';
        html += `<div class="fig" onclick="zoomFig('${b[1]}')">${svg}
          <div class="fig-cap">${esc(b[2]||'')}</div>
          <div class="fig-tip">🔍 点击全屏</div></div>`;
        if (b[3]) html += `<div class="cmt"><b>怎么读：</b>${esc(b[3])}</div>`;
        const ms = MOTION[ch] || [];
        for (const m of ms) {
          if ((b[2]||'').indexOf(m.k) >= 0 || (m.card||'') === id) {
            html += `<div class="motion"><div class="mt">▶ ${esc(m.t)}</div>
              <img loading="lazy" src="${m.src}" alt="${esc(m.t)}">
              <div class="md">${esc(m.d)}</div></div>`;
          }
        }
      } else if (b[0] === 't') {
        html += `<div class="tw"><table><tr>${b[2].map(h=>`<th>${esc(h)}</th>`).join('')}</tr>`;
        for (const r of b[3]) html += `<tr>${r.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`;
        html += `</table></div>`;
      } else if (b[0] === 'l') {
        html += `<ul>${b[2].map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
      }
    }
    html += `</div>`;
  }
  list.innerHTML = html || '<p style="color:#64748b;padding:20px;text-align:center">没有匹配的卡片</p>';
}

let zEl = null;
function zoomFig(id){
  const svg = FIGS[id];
  if (!svg) return;
  if (!zEl) {
    zEl = document.createElement('div');
    zEl.className = 'zoom';
    zEl.onclick = () => zEl.classList.remove('on');
    document.body.appendChild(zEl);
  }
  zEl.innerHTML = `<div class="in">${svg}<div class="tip">点击任意处关闭</div></div>`;
  zEl.classList.add('on');
}

document.getElementById('q').addEventListener('input', e => {
  kw = e.target.value.trim();
  renderList();
});

renderChips();
renderList();

(function(){
  function gotoHash(){
    var h = (location.hash || '').replace('#','').trim();
    if (!h) return;
    if (h.indexOf('fig_') === 0) {
      var cf = document.querySelector('[data-fig="' + h + '"]');
      if (cf) {
        var mm = /card-SH-(\d{2})-/.exec(cf.id);
        if (mm) { curCh = mm[1]; renderChips(); renderList(); }
        setTimeout(function(){
          var e2 = document.querySelector('[data-fig="' + h + '"]');
          if (e2) {
            e2.scrollIntoView({behavior:'smooth', block:'start'});
            e2.style.transition = 'box-shadow .4s';
            e2.style.boxShadow = '0 0 0 3px #9a3412';
            setTimeout(function(){ e2.style.boxShadow = ''; }, 2400);
          }
        }, 80);
        return;
      }
    }
    var m = /^SH-(\d{2})-/.exec(h) || /^card-SH-(\d{2})-/.exec(h);
    if (m) { curCh = m[1]; renderChips(); renderList(); }
    var el = document.getElementById('card-' + h.replace(/^card-/, '')) || document.getElementById(h);
    if (el) {
      el.scrollIntoView({behavior:'smooth', block:'start'});
      el.style.transition = 'box-shadow .4s';
      el.style.boxShadow = '0 0 0 3px #9a3412';
      setTimeout(function(){ el.style.boxShadow = ''; }, 2200);
    }
  }
  window.addEventListener('load', function(){ setTimeout(gotoHash, 60); });
  window.addEventListener('hashchange', gotoHash);
