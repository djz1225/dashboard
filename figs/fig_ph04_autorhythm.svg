<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 609" width="100%" style="max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px" role="img"><text x="165.0" y="22.6" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">正常起搏点与传导路径</text><text x="165.0" y="43.0" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">窦房结做主，因为它的自律性最高</text><rect x="15.0" y="60.0" width="300.0" height="40.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="27.0" y="80.0" text-anchor="start" font-size="14" font-weight="700" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">窦房结</text><text x="305.0" y="80.0" text-anchor="end" font-size="13.5" font-weight="700" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">100 次/分</text><text x="27.0" y="97.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">正常起搏点（约 60~100）</text><rect x="15.0" y="106.0" width="300.0" height="40.0" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="27.0" y="126.0" text-anchor="start" font-size="14" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">房室交界</text><text x="305.0" y="126.0" text-anchor="end" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">50 次/分</text><text x="27.0" y="143.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">潜在起搏点</text><rect x="15.0" y="152.0" width="300.0" height="40.0" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/><text x="27.0" y="172.0" text-anchor="start" font-size="14" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">浦肯野纤维</text><text x="305.0" y="172.0" text-anchor="end" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">25 次/分</text><text x="27.0" y="189.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">潜在起搏点（最慢）</text><rect x="15.0" y="198.0" width="300.0" height="40.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="27.0" y="218.0" text-anchor="start" font-size="14" font-weight="700" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">心室肌</text><text x="305.0" y="218.0" text-anchor="end" font-size="13.5" font-weight="700" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">无自律性</text><text x="27.0" y="235.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">不产生节律</text><rect x="15.0" y="248.0" width="300.0" height="38.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/><text x="27.0" y="268.0" text-anchor="start" font-size="14" font-weight="700" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">① 窦房结</text><text x="27.0" y="286.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">发出冲动</text><line x1="165.0" y1="287.0" x2="165.0" y2="287.5" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/><polygon points="165.0,292.0 163.0,287.4 167.0,287.4" fill="#64748b"/><rect x="15.0" y="293.0" width="300.0" height="38.0" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/><text x="27.0" y="313.0" text-anchor="start" font-size="14" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">② 心房肌</text><text x="27.0" y="331.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">沿心房传导（0.3 m/s），房间束到左房</text><line x1="165.0" y1="332.0" x2="165.0" y2="332.5" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/><polygon points="165.0,337.0 163.0,332.4 167.0,332.4" fill="#64748b"/><rect x="15.0" y="338.0" width="300.0" height="54.0" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/><text x="27.0" y="358.0" text-anchor="start" font-size="14" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">③ 房室交界</text><text x="27.0" y="376.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">延搁约 0.1 s——保证心房先收缩、心室后收</text><text x="27.0" y="392.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">缩</text><line x1="165.0" y1="393.0" x2="165.0" y2="393.5" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/><polygon points="165.0,398.0 163.0,393.4 167.0,393.4" fill="#64748b"/><rect x="15.0" y="399.0" width="300.0" height="38.0" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.4"/><text x="27.0" y="419.0" text-anchor="start" font-size="14" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">④ 浦肯野纤维</text><text x="27.0" y="437.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">最快（4 m/s），心室同步收缩</text><rect x="15.0" y="439.0" width="300.0" height="108.0" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/><text x="25.0" y="455.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">房室交界「延搁」不是缺陷，是设计：</text><text x="25.0" y="471.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">让心房把血挤完再让心室收缩</text><text x="25.0" y="487.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">自律性来源：4 期自动去极化，窦房结的 If </text><text x="25.0" y="503.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">电流最强故频率最高</text><text x="25.0" y="519.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">「优势」机制：窦房结先兴奋，超速驱动压抑</text><text x="25.0" y="535.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">其他起搏点</text><rect x="11.0" y="550.0" width="308.0" height="51.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="165.0" y="565.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">窦房结自律性最高（约100次/分）故为正常起搏</text><text x="165.0" y="580.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">点；房室交界延搁约0.1秒</text></svg>