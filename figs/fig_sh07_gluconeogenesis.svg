<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 647" width="100%" style="max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px" role="img"><text x="165.0" y="22.6" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">糖异生：绕过三个不可逆反应</text><text x="165.0" y="43.0" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">四个关键酶 · 主要在线（肾）· 净耗 6 ATP</text><rect x="15.0" y="58.0" width="300.0" height="24.0" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/><text x="21.0" y="74.0" text-anchor="start" font-size="11.2" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">被绕过的反应</text><text x="140.6" y="74.0" text-anchor="start" font-size="11.2" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">糖异生用的酶</text><text x="258.5" y="74.0" text-anchor="start" font-size="11.2" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">消耗</text><rect x="15.0" y="82.0" width="300.0" height="36.0" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.9"/><text x="21.0" y="97.0" text-anchor="start" font-size="11.2" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">丙酮酸 → 磷酸烯醇式</text><text x="21.0" y="111.0" text-anchor="start" font-size="11.2" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">丙酮酸</text><text x="140.6" y="97.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">丙酮酸羧化酶（</text><text x="140.6" y="111.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">线粒体）+ PEPCK</text><text x="258.5" y="97.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">2 ATP + </text><text x="258.5" y="111.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">2 GTP</text><rect x="15.0" y="118.0" width="300.0" height="36.0" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.9"/><text x="21.0" y="133.0" text-anchor="start" font-size="11.2" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">果糖-1,6-二磷酸 → </text><text x="21.0" y="147.0" text-anchor="start" font-size="11.2" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">果糖-6-磷酸</text><text x="140.6" y="133.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">果糖二磷酸酶-1</text><text x="258.5" y="133.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">1 H₂O</text><rect x="15.0" y="154.0" width="300.0" height="36.0" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.9"/><text x="21.0" y="169.0" text-anchor="start" font-size="11.2" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">葡糖-6-磷酸 → 葡萄</text><text x="21.0" y="183.0" text-anchor="start" font-size="11.2" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">糖</text><text x="140.6" y="169.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">葡糖-6-磷酸酶（</text><text x="140.6" y="183.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">肝/肾）</text><text x="258.5" y="169.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">1 H₂O</text><rect x="15.0" y="195.0" width="300.0" height="102.0" rx="7" fill="#ccfbf1" stroke="#cbd5e1" stroke-width="1.4"/><text x="25.0" y="214.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">为什么只能在肝（肾）</text><text x="25.0" y="232.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 葡糖-6-磷酸酶只存在于肝与肾皮质的内质</text><text x="25.0" y="248.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">网，肌肉没有</text><text x="25.0" y="264.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 所以肌糖原不能直接补血糖，必须走乳酸循</text><text x="25.0" y="280.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">环绕道肝</text><rect x="15.0" y="305.0" width="300.0" height="46.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><rect x="15.0" y="305.0" width="4.5" height="46.0" rx="2.2" fill="#b91c1c"/><text x="29.0" y="324.0" text-anchor="start" font-size="14" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">能量账</text><text x="304.0" y="324.0" text-anchor="end" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">耗 6</text><text x="29.0" y="341.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">生成 1 分子葡萄糖耗 6 个高能键（4 ATP + 2 GTP）</text><rect x="15.0" y="355.0" width="300.0" height="46.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><rect x="15.0" y="355.0" width="4.5" height="46.0" rx="2.2" fill="#b45309"/><text x="29.0" y="374.0" text-anchor="start" font-size="14" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">与糖酵解关系</text><text x="304.0" y="374.0" text-anchor="end" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">非同路</text><text x="29.0" y="391.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">不是简单逆过程：需 4 个替代酶 + 2 个线粒体穿梭</text><rect x="15.0" y="405.0" width="300.0" height="46.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><rect x="15.0" y="405.0" width="4.5" height="46.0" rx="2.2" fill="#15803d"/><text x="29.0" y="424.0" text-anchor="start" font-size="14" font-weight="700" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">原料</text><text x="304.0" y="424.0" text-anchor="end" font-size="13.5" font-weight="700" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">3 类</text><text x="29.0" y="441.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">乳酸、甘油、生糖氨基酸（不能是脂肪酸）</text><rect x="15.0" y="455.0" width="300.0" height="46.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><rect x="15.0" y="455.0" width="4.5" height="46.0" rx="2.2" fill="#0f766e"/><text x="29.0" y="474.0" text-anchor="start" font-size="14" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">调控</text><text x="304.0" y="474.0" text-anchor="end" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">激素</text><text x="29.0" y="491.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">胰高血糖素/糖皮质激素↑；胰岛素↓</text><rect x="15.0" y="507.0" width="300.0" height="76.0" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/><text x="25.0" y="523.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">易错：糖异生不是「糖酵解倒着走」——三个不</text><text x="25.0" y="539.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">可逆步必须换酶</text><text x="25.0" y="555.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">脂肪酸不能净生糖（乙酰CoA 不能变丙酮酸），</text><text x="25.0" y="571.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">只有甘油部分可以</text><rect x="11.0" y="588.0" width="308.0" height="51.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="165.0" y="603.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">糖异生用 4 个关键酶绕过 3 个不可逆反应，</text><text x="165.0" y="618.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">只在肝肾，净耗 6 个高能键</text></svg>