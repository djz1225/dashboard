<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 554" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="糖异生：四个关键酶绕过三个不可逆反应"><title>糖异生：四个关键酶绕过三个不可逆反应</title><desc>糖异生用丙酮酸羧化酶与 PEPCK、果糖二磷酸酶-1、葡糖-6-磷酸酶四个关键酶绕过糖酵解的三个不可逆反应，主要在肝与肾，生成 1 分子葡萄糖净耗 6 个高能键（4 ATP + 2 GTP）。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">糖异生：四个关键酶绕过三个不可逆反应</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">只在肝（肾），净耗 6 个高能键（4 ATP + 2 GTP）</text><rect x="18.0" y="65.0" width="364.0" height="26.0" rx="6" fill="#f8fbfd"/><text x="26.0" y="82.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">被绕过的不可逆反应</text><text x="171.6" y="82.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">糖异生用的酶</text><text x="317.2" y="82.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">消耗</text><line x1="18.0" y1="133.0" x2="382.0" y2="133.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="109.0" font-size="12.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">丙酮酸 → 磷酸烯醇</text><text x="26.0" y="125.0" font-size="12.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">式丙酮酸</text><text x="171.6" y="109.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">丙酮酸羧化酶（线粒体）</text><text x="171.6" y="125.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">+ PEPCK</text><text x="317.2" y="109.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">2 ATP +</text><text x="317.2" y="125.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">2 GTP</text><line x1="18.0" y1="175.0" x2="382.0" y2="175.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="151.0" font-size="12.5" font-weight="700" fill="#c1440e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">果糖-1,6-二磷酸</text><text x="26.0" y="167.0" font-size="12.5" font-weight="700" fill="#c1440e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">→ 果糖-6-磷酸</text><text x="171.6" y="151.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">果糖二磷酸酶-1</text><text x="317.2" y="151.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">1 H₂O</text><line x1="18.0" y1="217.0" x2="382.0" y2="217.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="193.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">葡糖-6-磷酸 →</text><text x="26.0" y="209.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"> 葡萄糖</text><text x="171.6" y="193.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">葡糖-6-磷酸酶（肝、肾）</text><text x="317.2" y="193.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">1 H₂O</text><rect x="18.0" y="225.0" width="364.0" height="227.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="244.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">四个关键酶 · 能量账 · 原料</text><rect x="30.0" y="255.0" width="3.0" height="15.0" rx="1.5" fill="#0f766e"/><text x="39.0" y="268.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">为什么只在肝（肾）</text><text x="370.0" y="268.0" text-anchor="end" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">部位</text><text x="39.0" y="286.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">葡糖-6-磷酸酶只存在于肝与肾皮质的内质网，</text><text x="39.0" y="302.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肌肉没有</text><rect x="30.0" y="313.0" width="3.0" height="15.0" rx="1.5" fill="#b45309"/><text x="39.0" y="326.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">原料三类</text><text x="370.0" y="326.0" text-anchor="end" font-size="12" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">不能是脂肪酸</text><text x="39.0" y="344.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">乳酸、甘油、生糖氨基酸；脂肪酸不能净生</text><text x="39.0" y="360.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">糖（只有甘油部分可以）</text><rect x="30.0" y="371.0" width="3.0" height="15.0" rx="1.5" fill="#4a5a6b"/><text x="39.0" y="384.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">与糖酵解的关系</text><text x="370.0" y="384.0" text-anchor="end" font-size="12" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">非同路</text><text x="39.0" y="402.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">不是简单逆转：要 4 个替代酶 + 线粒体穿梭</text><rect x="30.0" y="413.0" width="3.0" height="15.0" rx="1.5" fill="#2f8f57"/><text x="39.0" y="426.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">调控</text><text x="370.0" y="426.0" text-anchor="end" font-size="12" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">激素</text><text x="39.0" y="444.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胰高血糖素、糖皮质激素 ↑；胰岛素 ↓</text><rect x="18.0" y="464.0" width="364.0" height="70.0" rx="8" fill="#e2f5f2"/><rect x="18.0" y="464.0" width="3.5" height="70.0" rx="1.8" fill="#0f766e"/><text x="32.0" y="484.0" font-size="11.5" font-weight="700" fill="#0f766e" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="501.0" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">糖异生不是「糖酵解倒着走」——三个不可逆步必须换酶；</text><text x="32.0" y="520.0" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肌糖原要靠乳酸循环绕道肝才能补血糖。</text></svg>