0" y="322.0" width="177.0" height="120.0" rx="9" fill="#fef3c7" stroke="#b45309" stroke-width="1.1"/><text x="29.0" y="343.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">脊髓半切（Brown-Séquard）</text><text x="29.0" y="362.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">同侧：深感觉障碍＋运动障碍</text><text x="29.0" y="382.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">对侧：痛温觉障碍（已交叉）</text><text x="29.0" y="402.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">因为浅感觉在脊髓内交叉、</text><text x="29.0" y="418.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">深感觉已上行</text><rect x="205.0" y="322.0" width="177.0" height="120.0" rx="9" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1.1"/><text x="216.0" y="343.0" font-size="12.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">延髓病变</text><text x="216.0" y="362.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">内侧丘系交叉在延髓</text><text x="216.0" y="382.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">→ 对侧深感觉丧失</text><text x="216.0" y="402.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">常伴对侧痛温觉与锥体束症状</text><rect x="18.0" y="452.0" width="364.0" height="70.0" rx="8" fill="#eef2f7"/><rect x="18.0" y="452.0" width="3.5" height="70.0" rx="1.8" fill="#4a5a6b"/><text x="32.0" y="472.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="489.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">浅感觉在脊髓交叉、深感觉在延髓交叉——这是判断病变</text><text x="32.0" y="508.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">平面的关键，也是脊髓半切「同侧深、对侧浅」的原因。</text></svg>