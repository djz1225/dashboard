i',sans-serif">丘脑</text><text x="30.0" y="150.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">在脊髓交叉（白质前连合）→ 脊髓丘脑侧束</text><text x="30.0" y="172.0" font-size="12" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">深感觉（本体＋精细触觉）</text><rect x="30.0" y="180.0" width="55.2" height="23.0" rx="5" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1"/><text x="57.6" y="196.0" text-anchor="middle" font-size="10" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">感受器</text><line x1="86.7" y1="191.5" x2="93.7" y2="191.5" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="93.7" y1="191.5" x2="89.8" y2="193.7" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="93.7" y1="191.5" x2="89.8" y2="189.3" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><rect x="95.2" y="180.0" width="55.2" height="23.0" rx="5" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1"/><text x="122.8" y="196.0" text-anchor="middle" font-size="10" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">脊神经节</text><line x1="151.9" y1="191.5" x2="158.9" y2="191.5" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="158.9" y1="191.5" x2="155.0" y2="193.7" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="158.9" y1="191.5" x2="155.0" y2="189.3" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><rect x="160.4" y="180.0" width="55.2" height="23.0" rx="5" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1"/><text x="188.0" y="196.0" text-anchor="middle" font-size="10" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">后索薄束楔束</text><line x1="217.1" y1="191.5" x2="224.1" y2="191.5" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="224.1" y1="191.5" x2="220.2" y2="193.7" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="224.1" y1="191.5" x2="220.2" y2="189.3" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><rect x="225.6" y="180.0" width="55.2" height="23.0" rx="5" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1"/><text x="253.2" y="196.0" text-anchor="middle" font-size="10" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">延髓换元</text><line x1="282.3" y1="191.5" x2="289.3" y2="191.5" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="289.3" y1="191.5" x2="285.4" y2="193.7" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="289.3" y1="191.5" x2="285.4" y2="189.3" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><rect x="290.8" y="180.0" width="55.2" height="23.0" rx="5" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1"/><text x="318.4" y="196.0" text-anchor="middle" font-size="10" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">丘脑</text><text x="30.0" y="219.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">在延髓交叉（内侧丘系交叉）</text><text x="30.0" y="241.0" font-size="12" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">头面部感觉</text><rect x="30.0" y="249.0" width="71.5" height="23.0" rx="5" fill="#f2ecfb" stroke="#7b4bb7" stroke-width="1"/><text x="65.8" y="265.0" text-anchor="middle" font-size="10" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">三叉神经节</text><line x1="103.0" y1="260.5" x2="110.0" y2="260.5" stroke="#8095a8" stroke-width="1.2" stroke-line