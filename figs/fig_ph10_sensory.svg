<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 450" width="100%" style="max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px" role="img"><text x="165.0" y="22.6" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">感觉传导通路：为什么要交叉</text><text x="165.0" y="43.0" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">浅感觉与深感觉走不同路径，交叉位置也不同</text><rect x="15.0" y="60.0" width="300.0" height="72.0" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.4"/><text x="24.0" y="79.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">浅感觉（痛温触）</text><text x="24.0" y="96.0" text-anchor="start" font-size="13" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">脊神经节 → 后角换元 → 立即交叉 → 脊髓丘脑</text><text x="24.0" y="112.0" text-anchor="start" font-size="13" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">侧束</text><text x="24.0" y="128.0" text-anchor="start" font-size="13" font-weight="600" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">在「脊髓」内交叉</text><rect x="15.0" y="138.0" width="300.0" height="72.0" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/><text x="24.0" y="157.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">深感觉（本体+精细触觉）</text><text x="24.0" y="174.0" text-anchor="start" font-size="13" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">脊神经节 → 后索（薄束/楔束）→ 延髓换元 → </text><text x="24.0" y="190.0" text-anchor="start" font-size="13" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">交叉</text><text x="24.0" y="206.0" text-anchor="start" font-size="13" font-weight="600" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">在「延髓」交叉（内侧丘系交叉）</text><rect x="15.0" y="216.0" width="300.0" height="56.0" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/><text x="24.0" y="235.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">头面部感觉</text><text x="24.0" y="252.0" text-anchor="start" font-size="13" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">三叉神经节 → 三叉神经脊束核 → 交叉</text><text x="24.0" y="268.0" text-anchor="start" font-size="13" font-weight="600" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">脑干内交叉</text><rect x="15.0" y="280.0" width="300.0" height="108.0" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/><text x="25.0" y="296.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">关键判断：浅感觉在脊髓交叉，深感觉在延髓</text><text x="25.0" y="312.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">交叉——这解释了「脊髓半切综合征」的表现</text><text x="25.0" y="328.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">脊髓半切：同侧深感觉障碍（因未交叉）+ 对</text><text x="25.0" y="344.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">侧痛温觉障碍（因已交叉）</text><text x="25.0" y="360.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">内侧丘系交叉在延髓，所以延髓病变可致对侧</text><text x="25.0" y="376.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">深感觉丧失</text><rect x="11.0" y="391.0" width="308.0" height="51.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="165.0" y="406.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">浅感觉在脊髓交叉、深感觉在延髓交叉；</text><text x="165.0" y="421.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">这是判断病变平面的关键</text></svg>