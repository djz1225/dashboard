<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 542" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="感觉传导通路：交叉位置决定病变表现"><title>感觉传导通路：交叉位置决定病变表现</title><desc>浅感觉经后角换元后立即在脊髓交叉，走脊髓丘脑侧束；深感觉沿后索上行至延髓换元后交叉（内侧丘系）；头面部经三叉神经脊束核在脑干交叉。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">感觉传导通路：交叉位置决定病变表现</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">浅感觉在脊髓交叉，深感觉在延髓交叉</text><rect x="18.0" y="65.0" width="364.0" height="245.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="83.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">三条通路与三个交叉点</text><text x="30.0" y="103.0" font-size="12" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">浅感觉（痛、温、粗触）</text><rect x="30.0" y="111.0" width="55.2" height="23.0" rx="5" fill="#fdeceb" stroke="#c0392b" stroke-width="1"/><text x="57.6" y="127.0" text-anchor="middle" font-size="10" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">感受器</text><line x1="86.7" y1="122.5" x2="93.7" y2="122.5" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="93.7" y1="122.5" x2="89.8" y2="124.7" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="93.7" y1="122.5" x2="89.8" y2="120.3" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><rect x="95.2" y="111.0" width="55.2" height="23.0" rx="5" fill="#fdeceb" stroke="#c0392b" stroke-width="1"/><text x="122.8" y="127.0" text-anchor="middle" font-size="10" font-weight="7