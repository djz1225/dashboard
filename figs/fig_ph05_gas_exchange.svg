<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 579" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="肺换气：影响扩散的因素"><title>肺换气：影响扩散的因素</title><desc>肺换气受分压差、呼吸膜面积（约 70 m²）、呼吸膜厚度（约 0.6 μm）、V/Q 比值（约 0.84）与温度溶解度影响；V/Q 升高成死腔样通气，降低成功能性分流。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肺换气：五个因素，核心是分压差与 V/Q</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">V/Q 失调是最常见的换气障碍原因</text><rect x="18.0" y="65.0" width="364.0" height="24.0" rx="6" fill="#e2f5f2"/><text x="25.0" y="81.0" font-size="11" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">因素</text><text x="126.9" y="81.0" font-size="11" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">正常值</text><text x="214.3" y="81.0" font-size="11" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">变化时的后果</text><line x1="18.0" y1="131.0" x2="382.0" y2="131.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="25.0" y="107.0" font-size="12.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">分压差</text><text x="126.9" y="107.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">最主要</text><text x="214.3" y="107.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">分压差越大，扩散越快；是最</text><text x="214.3" y="123.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">主要的决定因素</text><line x1="18.0" y1="173.0" x2="382.0" y2="173.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="25.0" y="149.0" font-size="12.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">呼吸膜面积</text><text x="126.9" y="149.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">约 70 m²</text><text x="214.3" y="149.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">面积↓（肺气肿）→ 换气障</text><text x="214.3" y="165.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">碍</text><line x1="18.0" y1="215.0" x2="382.0" y2="215.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="25.0" y="191.0" font-size="12.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">呼吸膜厚度</text><text x="126.9" y="191.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">约 0.6 μm</text><text x="214.3" y="191.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">厚度↑（肺水肿、纤维化）→</text><text x="214.3" y="207.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"> 换气障碍</text><line x1="18.0" y1="257.0" x2="382.0" y2="257.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="25.0" y="233.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">V/Q 比值</text><text x="126.9" y="233.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">约 0.84</text><text x="214.3" y="233.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">比值失调 → 最常见的换气障</text><text x="214.3" y="249.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">碍原因</text><line x1="18.0" y1="299.0" x2="382.0" y2="299.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="25.0" y="275.0" font-size="12.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">温度／溶解度</text><text x="126.9" y="275.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">溶解度差异</text><text x="214.3" y="275.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">CO₂ 溶解度是 O₂ 的约 24</text><text x="214.3" y="291.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"> 倍，故更容易扩散</text><rect x="18.0" y="301.0" width="3.0" height="14.0" rx="1.5" fill="#b45309"/><text x="28.0" y="311.0" font-size="13.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">V/Q 失调的两种极端</text><rect x="18.0" y="323.0" width="177.0" height="156.0" rx="9" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1.1"/><text x="29.0" y="344.0" font-size="12.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">V/Q ↑｜死腔样通气</text><text x="29.0" y="363.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肺泡有通气、无血流</text><text x="29.0" y="383.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">典型：肺栓塞</text><text x="29.0" y="403.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">通气被浪费，等于增加死腔</text><text x="29.0" y="423.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">血气：PaO₂↓，吸氧可改善</text><rect x="205.0" y="323.0" width="177.0" height="156.0" rx="9" fill="#fef3c7" stroke="#b45309" stroke-width="1.1"/><text x="216.0" y="344.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">V/Q ↓｜功能性分流</text><text x="216.0" y="363.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">有血流、无通气（气道阻塞、</text><text x="216.0" y="379.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肺不张）</text><text x="216.0" y="399.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">静脉血未经氧合直接回左心</text><text x="216.0" y="419.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">等于右向左分流</text><text x="216.0" y="439.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">血气：PaO₂↓，吸氧改善有</text><text x="216.0" y="455.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">限</text><rect x="18.0" y="489.0" width="364.0" height="70.0" rx="8" fill="#eef2f7"/><rect x="18.0" y="489.0" width="3.5" height="70.0" rx="1.8" fill="#4a5a6b"/><text x="32.0" y="509.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="526.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">CO₂ 扩散能力远强于 O₂，因此换气障碍时缺氧总比 </text><text x="32.0" y="545.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">CO₂ 潴留先出现；正常人也有少量生理性分流与死腔。</text></svg>