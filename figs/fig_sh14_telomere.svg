<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 740" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="端粒与端粒酶：末端复制问题"><title>端粒与端粒酶：末端复制问题</title><desc>线性 DNA 复制存在末端复制问题：随从链 5′ 端的 RNA 引物去除后留下缺口，而 DNA 聚合酶只能延伸已有的 3′-OH，无法补齐，故体细胞端粒每代缩短 50~200 bp，约 50 次分裂后进入复制性衰老（海弗利克极限）。端粒酶是自带RNA 模板的逆转录酶，以 3′ 悬垂为引物延长端粒重复序列 TTAGGG，再由普通机制补齐另一条链。生殖细胞与干细胞高表达，多数肿瘤细胞重新激活而永生化。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">端粒与端粒酶：末端复制问题</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">线性 DNA 每复制一次就短一点；端粒酶是自带 RNA 模板的</text><text x="18.0" y="68.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">逆转录酶</text><rect x="18.0" y="82.0" width="364.0" height="148.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="101.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">① 问题：末端无法补齐</text><line x1="36.0" y1="132.0" x2="234.4" y2="132.0" stroke="#0f766e" stroke-width="2.4" stroke-linecap="round"/><text x="238.4" y="135.0" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">3′ TTAGGG…</text><line x1="36.0" y1="146.0" x2="164.0" y2="146.0" stroke="#4a5a6b" stroke-width="2.4" stroke-linecap="round"/><line x1="164.0" y1="146.0" x2="234.4" y2="146.0" stroke="#cbd8e4" stroke-width="2.4" stroke-dasharray="3 3" stroke-linecap="round"/><text x="40.0" y="160.0" font-size="11.5" font-weight="400" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">5′ 端：RNA 引物去除后留下的缺口，无 3′-OH 可补</text><text x="30.0" y="188.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">DNA 聚合酶只能延伸已有 3′-OH，末端 RNA 引物去掉后，</text><text x="30.0" y="205.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">随从链 5′ 端无法被任何已知聚合酶补齐。</text><rect x="18.0" y="242.0" width="364.0" height="254.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="261.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">从缩短到补救</text><rect x="30.0" y="274.0" width="332.0" height="64.0" rx="8" fill="#ffffff" stroke="#e3eaf2" stroke-width="1.1"/><rect x="30.0" y="274.0" width="3.5" height="64.0" rx="1.8" fill="#4a5a6b"/><circle cx="49.0" cy="291.0" r="9" fill="#4a5a6b"/><text x="49.0" y="295.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">1</text><text x="65.0" y="295.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">② 后果｜每代缩短 50~200 bp</text><text x="352.0" y="295.0" text-anchor="end" font-size="12" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">进行性</text><text x="65.0" y="313.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">体细胞端粒随分裂次数递减，约 50 次后</text><text x="65.0" y="329.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">进入复制性衰老（海弗利克极限）</text><line x1="49.0" y1="340.0" x2="49.0" y2="347.0" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="347.0" x2="45.6" y2="340.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="347.0" x2="52.4" y2="340.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><rect x="30.0" y="349.0" width="332.0" height="64.0" rx="8" fill="#ffffff" stroke="#e3eaf2" stroke-width="1.1"/><rect x="30.0" y="349.0" width="3.5" height="64.0" rx="1.8" fill="#c1440e"/><circle cx="49.0" cy="366.0" r="9" fill="#c1440e"/><text x="49.0" y="370.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">2</text><text x="65.0" y="370.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">③ 端粒酶｜逆转录酶</text><text x="352.0" y="370.0" text-anchor="end" font-size="12" font-weight="700" fill="#c1440e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">换模板</text><text x="65.0" y="388.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">自带 RNA 模板，以 3′ 悬垂为引物延长</text><text x="65.0" y="404.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">端粒，再用普通机制补齐另一条链</text><line x1="49.0" y1="415.0" x2="49.0" y2="422.0" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="422.0" x2="45.6" y2="415.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="422.0" x2="52.4" y2="415.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><rect x="30.0" y="424.0" width="332.0" height="64.0" rx="8" fill="#ffffff" stroke="#e3eaf2" stroke-width="1.1"/><rect x="30.0" y="424.0" width="3.5" height="64.0" rx="1.8" fill="#c0392b"/><circle cx="49.0" cy="441.0" r="9" fill="#c0392b"/><text x="49.0" y="445.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">3</text><text x="65.0" y="445.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">④ 谁有活性</text><text x="352.0" y="445.0" text-anchor="end" font-size="12" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">表达谱</text><text x="65.0" y="463.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">生殖细胞、干细胞与约 90% 的肿瘤细胞高</text><text x="65.0" y="479.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">表达；体细胞几乎不表达</text><rect x="18.0" y="508.0" width="364.0" height="26.0" rx="6" fill="#f8fbfd"/><text x="26.0" y="525.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">细胞</text><text x="157.0" y="525.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">端粒酶</text><text x="244.4" y="525.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">结果</text><line x1="18.0" y1="576.0" x2="382.0" y2="576.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="552.0" font-size="12.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">生殖细胞 / </text><text x="26.0" y="568.0" font-size="12.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">干细胞</text><text x="157.0" y="552.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">高表达</text><text x="244.4" y="552.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">端粒维持，可长期分裂</text><line x1="18.0" y1="618.0" x2="382.0" y2="618.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="594.0" font-size="12.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">普通体细胞</text><text x="157.0" y="594.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">几乎不表达</text><text x="244.4" y="594.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">每代缩短 50~200 bp</text><text x="244.4" y="610.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">→ 衰老</text><line x1="18.0" y1="644.0" x2="382.0" y2="644.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="636.0" font-size="12.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">多数肿瘤细胞</text><text x="157.0" y="636.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">重新激活</text><text x="244.4" y="636.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">端粒维持 → 永生化</text><rect x="18.0" y="650.0" width="364.0" height="70.0" rx="8" fill="#fef3c7"/><rect x="18.0" y="650.0" width="3.5" height="70.0" rx="1.8" fill="#b45309"/><text x="32.0" y="670.0" font-size="11.5" font-weight="700" fill="#b45309" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">易错</text><text x="32.0" y="687.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">端粒酶本质是逆转录酶（以自身 RNA 为模板），不是</text><text x="32.0" y="706.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">DNA 聚合酶；它是抗癌靶点，但端粒并非越长越好。</text></svg>