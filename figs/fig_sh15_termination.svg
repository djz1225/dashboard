<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 457" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="转录终止的两种机制"><title>转录终止的两种机制</title><desc>原核转录终止有两种机制：不依赖 ρ 的终止靠 GC 富集回文序列转录出发夹结构使聚合酶停顿，紧随的寡聚 U 与模板 dA 配对最弱，酶随即脱落；依赖 ρ 的终止由 ρ 蛋白结合新生 RNA 5′ 端，借其 ATP 酶与解旋酶活性追上转录泡，把 RNA 从模板上拉下。真核终止不用发夹，而依赖 polyA 加尾信号的切割。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">转录终止的两种机制</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">不依赖 ρ 靠 GC 发夹 + 寡聚 U；依赖 ρ 靠 ATP 酶解旋把</text><text x="18.0" y="68.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">RNA 拉下来</text><rect x="18.0" y="82.0" width="364.0" height="159.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="101.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">① 不依赖 ρ：发夹 + 寡聚 U</text><line x1="32.0" y1="152.0" x2="179.2" y2="152.0" stroke="#7b4bb7" stroke-width="2.2" stroke-linecap="round"/><text x="32.0" y="142.0" font-size="11.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">新生 RNA 5′ → 3′</text><line x1="179.2" y1="152.0" x2="179.2" y2="128.0" stroke="#0f766e" stroke-width="2.2" stroke-linecap="round"/><line x1="191.2" y1="152.0" x2="191.2" y2="128.0" stroke="#0f766e" stroke-width="2.2" stroke-linecap="round"/><path d="M 179.2 128.0 A 6 6 0 0 1 191.2 128.0" fill="none" stroke="#0f766e" stroke-width="2.2"/><text x="185.2" y="112.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">GC 富集回文 → 发夹</text><line x1="191.2" y1="152.0" x2="352.0" y2="152.0" stroke="#c0392b" stroke-width="2.2" stroke-linecap="round"/><text x="352.0" y="164.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">寡聚 U</text><text x="32.0" y="164.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">rU-dA 配对最弱 → 聚合酶停顿后脱落</text><text x="30.0" y="182.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">发夹使 RNA 聚合酶停顿，紧接着的寡聚 U 与模板 dA 配对</text><text x="30.0" y="199.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">最不稳定，酶随即脱落 —— 与 -10 区「A/T 易解链」是同</text><text x="30.0" y="216.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一物理原理的反用。</text><rect x="18.0" y="253.0" width="177.0" height="104.0" rx="9" fill="#e2f5f2" stroke="#0f766e" stroke-width="1.1"/><text x="29.0" y="274.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">不依赖 ρ</text><text x="29.0" y="293.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">GC 富集回文形成发夹</text><text x="29.0" y="313.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">尾部寡聚 U 配对最弱</text><text x="29.0" y="333.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">无需额外蛋白与 ATP</text><rect x="205.0" y="253.0" width="177.0" height="104.0" rx="9" fill="#fde8dd" stroke="#c1440e" stroke-width="1.1"/><text x="216.0" y="274.0" font-size="12.5" font-weight="700" fill="#c1440e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">依赖 ρ</text><text x="216.0" y="293.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">ρ 结合新生 RNA 5′ 端</text><text x="216.0" y="313.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">有 ATP 酶与解旋酶活性</text><text x="216.0" y="333.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">追上转录泡把 RNA 拉下</text><rect x="18.0" y="367.0" width="364.0" height="70.0" rx="8" fill="#fef3c7"/><rect x="18.0" y="367.0" width="3.5" height="70.0" rx="1.8" fill="#b45309"/><text x="32.0" y="387.0" font-size="11.5" font-weight="700" fill="#b45309" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">易错</text><text x="32.0" y="404.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">ρ 依赖 ATP 主动解旋，不是被动等待；真核终止机制</text><text x="32.0" y="423.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">不同 —— 靠 polyA 加尾信号切割，而非发夹。</text></svg>