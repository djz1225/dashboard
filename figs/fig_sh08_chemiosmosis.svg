<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 794" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="化学渗透与 ATP 合酶"><title>化学渗透与 ATP 合酶</title><desc>电子传递把 H⁺ 泵到膜间隙形成质子动力势，内膜对 H⁺ 不通透使梯度得以维持；H⁺ 只能经 ATP 合酶的 F₀ 通道回流，带动 γ 亚基旋转、β 亚基构象改变，催化 ADP+Pi 生成 ATP（约 3 H⁺ 合成 1 ATP）。DNP 使 H⁺ 漏回、梯度消失，电子照常传递但不产 ATP。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">化学渗透与 ATP 合酶</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">内膜对 H⁺ 不通透 → 梯度成立；H⁺ 只经 F₀ 回流 → γ</text><text x="18.0" y="68.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">旋转 → 构象改变 → 合成 ATP</text><rect x="18.0" y="82.0" width="364.0" height="208.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="101.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">质子动力势怎么变成 ATP</text><rect x="30.0" y="142.0" width="340.0" height="64.0" rx="4" fill="#eef2f7"/><line x1="30.0" y1="142.0" x2="370.0" y2="142.0" stroke="#4a5a6b" stroke-width="1.2" stroke-dasharray="4 4" stroke-linecap="round"/><line x1="30.0" y1="206.0" x2="370.0" y2="206.0" stroke="#4a5a6b" stroke-width="1.2" stroke-dasharray="4 4" stroke-linecap="round"/><text x="30.0" y="124.0" font-size="12" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">膜间隙（H⁺ 高）</text><text x="40.0" y="170.0" font-size="12" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">电子传递</text><text x="40.0" y="190.0" font-size="12" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Ⅰ → Ⅲ → Ⅳ</text><line x1="142.0" y1="144.0" x2="142.0" y2="127.0" stroke="#b45309" stroke-width="1.4" stroke-linecap="round"/><line x1="142.0" y1="127.0" x2="138.8" y2="131.5" stroke="#b45309" stroke-width="1.4" stroke-linecap="round"/><line x1="142.0" y1="127.0" x2="145.2" y2="131.5" stroke="#b45309" stroke-width="1.4" stroke-linecap="round"/><line x1="158.0" y1="144.0" x2="158.0" y2="127.0" stroke="#b45309" stroke-width="1.4" stroke-linecap="round"/><line x1="158.0" y1="127.0" x2="154.8" y2="131.5" stroke="#b45309" stroke-width="1.4" stroke-linecap="round"/><line x1="158.0" y1="127.0" x2="161.2" y2="131.5" stroke="#b45309" stroke-width="1.4" stroke-linecap="round"/><line x1="174.0" y1="144.0" x2="174.0" y2="127.0" stroke="#b45309" stroke-width="1.4" stroke-linecap="round"/><line x1="174.0" y1="127.0" x2="170.8" y2="131.5" stroke="#b45309" stroke-width="1.4" stroke-linecap="round"/><line x1="174.0" y1="127.0" x2="177.2" y2="131.5" stroke="#b45309" stroke-width="1.4" stroke-linecap="round"/><text x="190.0" y="124.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">H⁺ 泵出</text><rect x="194.0" y="152.0" width="50.0" height="44.0" rx="5" fill="#e2f5f2" stroke="#0f766e" stroke-width="1.2"/><rect x="214.0" y="154.0" width="11.5" height="40.0" rx="2" fill="#ffffff"/><line x1="219.0" y1="128.0" x2="219.0" y2="206.0" stroke="#0f766e" stroke-width="1.8" stroke-linecap="round"/><line x1="219.0" y1="206.0" x2="215.5" y2="201.0" stroke="#0f766e" stroke-width="1.8" stroke-linecap="round"/><line x1="219.0" y1="206.0" x2="222.5" y2="201.0" stroke="#0f766e" stroke-width="1.8" stroke-linecap="round"/><text x="250.0" y="166.0" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">F₀ 质子通道</text><text x="250.0" y="186.0" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">F₁ 催化头部</text><text x="346.0" y="176.0" font-size="11.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">内膜</text><rect x="216.0" y="206.0" width="6.0" height="13.0" rx="1.5" fill="#0f766e"/><rect x="185.0" y="218.0" width="70.0" height="34.0" rx="6" fill="#e2f5f2" stroke="#0f766e" stroke-width="1.1"/><text x="220.0" y="233.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">F₁</text><text x="220.0" y="246.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">α₃β₃γδε</text><text x="256.0" y="212.0" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">γ 柄</text><text x="30.0" y="224.0" font-size="12" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">基质（H⁺ 低）</text><text x="220.0" y="270.0" text-anchor="middle" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">ADP + Pi → ATP</text><text x="278.0" y="270.0" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">3 H⁺ / 1 ATP</text><rect x="18.0" y="302.0" width="364.0" height="253.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="321.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">四步链条</text><rect x="30.0" y="332.0" width="3.0" height="15.0" rx="1.5" fill="#b45309"/><text x="39.0" y="345.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">① 泵出 H⁺</text><text x="370.0" y="345.0" text-anchor="end" font-size="12" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">建梯度</text><text x="39.0" y="363.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">电子传递把 H⁺ 从基质泵到膜间隙，形成电化学</text><text x="39.0" y="379.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">梯度（质子动力势）</text><rect x="30.0" y="388.0" width="3.0" height="15.0" rx="1.5" fill="#4a5a6b"/><text x="39.0" y="401.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">② 内膜不通透</text><text x="370.0" y="401.0" text-anchor="end" font-size="12" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">关键前提</text><text x="39.0" y="419.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">正因为内膜对 H⁺ 不通透，梯度才维持得住—</text><text x="39.0" y="435.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">—这是假说的要害</text><rect x="30.0" y="444.0" width="3.0" height="15.0" rx="1.5" fill="#0f766e"/><text x="39.0" y="457.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">③ 经 F₀ 回流</text><text x="370.0" y="457.0" text-anchor="end" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">唯一出口</text><text x="39.0" y="475.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">H⁺ 只能从 ATP 合酶的 F₀ 通道回基质，</text><text x="39.0" y="491.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">别无他路</text><rect x="30.0" y="500.0" width="3.0" height="15.0" rx="1.5" fill="#c1440e"/><text x="39.0" y="513.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">④ γ 旋转催化</text><text x="370.0" y="513.0" text-anchor="end" font-size="12" font-weight="700" fill="#c1440e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">构象改变</text><text x="39.0" y="531.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">回流带动 γ 旋转 → β 亚基构象依次改变</text><text x="39.0" y="547.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">→ ADP+Pi 生成 ATP</text><rect x="18.0" y="567.0" width="364.0" height="125.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="586.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">两个决定性证据</text><rect x="30.0" y="597.0" width="3.0" height="15.0" rx="1.5" fill="#c0392b"/><text x="39.0" y="610.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">DNP 解偶联</text><text x="370.0" y="610.0" text-anchor="end" font-size="12" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">证据 ①</text><text x="39.0" y="628.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">2,4-二硝基苯酚携带 H⁺ 穿膜，梯度消失：电</text><text x="39.0" y="644.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">子照传，ATP 归零</text><rect x="30.0" y="653.0" width="3.0" height="15.0" rx="1.5" fill="#2f8f57"/><text x="39.0" y="666.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">人工酸化</text><text x="370.0" y="666.0" text-anchor="end" font-size="12" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">证据 ②</text><text x="39.0" y="684.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">人为把膜间隙酸化，即使不传电子也能合成 ATP</text><rect x="18.0" y="704.0" width="364.0" height="70.0" rx="8" fill="#fef3c7"/><rect x="18.0" y="704.0" width="3.5" height="70.0" rx="1.8" fill="#b45309"/><text x="32.0" y="724.0" font-size="11.5" font-weight="700" fill="#b45309" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">易错</text><text x="32.0" y="741.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">ATP 合酶是「分子马达」：F₀ 才是通道，F₁ 是催化；</text><text x="32.0" y="760.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">解偶联剂不抑制电子传递，只让能量以热的形式散失。</text></svg>