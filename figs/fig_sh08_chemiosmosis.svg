<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 524" width="100%" style="max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px" role="img"><text x="165.0" y="22.6" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">化学渗透：质子梯度怎么变成 ATP</text><text x="165.0" y="43.0" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">内膜不透 H⁺；H⁺ 只能经 ATP 合酶回流</text><rect x="15.0" y="58.0" width="300.0" height="56.0" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/><text x="28.0" y="77.0" text-anchor="start" font-size="12.6" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">① 电子传递泵出 H⁺</text><text x="28.0" y="94.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">膜间隙 H⁺ 浓度升高 → 形成电化学梯度（质子动力势</text><text x="28.0" y="109.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">）</text><line x1="165.0" y1="115.0" x2="165.0" y2="114.5" stroke="#64748b" stroke-width="1.4" stroke-linecap="round"/><polygon points="165.0,119.0 163.0,114.4 167.0,114.4" fill="#64748b"/><rect x="15.0" y="120.0" width="300.0" height="41.0" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/><text x="28.0" y="139.0" text-anchor="start" font-size="12.6" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">② 内膜对 H⁺ 不通透</text><text x="28.0" y="156.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">梯度得以维持（这是假说的关键前提）</text><line x1="165.0" y1="162.0" x2="165.0" y2="161.5" stroke="#64748b" stroke-width="1.4" stroke-linecap="round"/><polygon points="165.0,166.0 163.0,161.4 167.0,161.4" fill="#64748b"/><rect x="15.0" y="167.0" width="300.0" height="41.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/><text x="28.0" y="186.0" text-anchor="start" font-size="12.6" font-weight="700" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">③ H⁺ 经 F₀ 回流</text><text x="28.0" y="203.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">F₀ 是质子通道，F₁ 是催化头部（α₃β₃γδε）</text><line x1="165.0" y1="209.0" x2="165.0" y2="208.5" stroke="#64748b" stroke-width="1.4" stroke-linecap="round"/><polygon points="165.0,213.0 163.0,208.4 167.0,208.4" fill="#64748b"/><rect x="15.0" y="214.0" width="300.0" height="41.0" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.4"/><text x="28.0" y="233.0" text-anchor="start" font-size="12.6" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">④ 回流驱动 γ 旋转 → 构象改变 → ADP+Pi→ATP</text><text x="28.0" y="250.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">每 3 个 H⁺ 合成 1 ATP + 1 个用于转运</text><rect x="15.0" y="258.0" width="300.0" height="118.0" rx="7" fill="#ccfbf1" stroke="#cbd5e1" stroke-width="1.4"/><text x="25.0" y="277.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">两个决定性证据</text><text x="25.0" y="295.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 解偶联剂 2,4-二硝基苯酚（DNP）：</text><text x="25.0" y="311.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">携带 H⁺ 穿过内膜，梯度消失 → 电子照传但</text><text x="25.0" y="327.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">无 ATP</text><text x="25.0" y="343.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 人工酸化膜间隙可驱动 ATP 合成（</text><text x="25.0" y="359.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">无电子传递也能产 ATP）</text><rect x="15.0" y="384.0" width="300.0" height="76.0" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/><text x="25.0" y="400.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">易错：ATP 合酶是「分子马达」，不是「通道</text><text x="25.0" y="416.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">」（F₀ 才是通道，F₁ 是催化）</text><text x="25.0" y="432.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">解偶联剂不抑制电子传递，只让能量以热的形</text><text x="25.0" y="448.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">式散失</text><rect x="11.0" y="465.0" width="308.0" height="51.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="165.0" y="480.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">质子梯度（不通透内膜维持）→ F₀ 回流 → F₁ </text><text x="165.0" y="495.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">旋转催化 → ATP</text></svg>