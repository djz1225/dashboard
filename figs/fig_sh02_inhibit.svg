<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 615.5" width="100%" style="max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px" role="img"><text x="165.0" y="22.6" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">三种可逆抑制：只看 Vmax 与 Km</text><text x="165.0" y="42.6" text-anchor="middle" font-size="13.5" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">竞争性：Vmax不变Km↑ · 非竞争：Vmax↓Km不变 · 反竞争：两者都↓</text><rect x="15.0" y="57.5" width="300.0" height="86.0" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/><text x="26.0" y="78.5" text-anchor="start" font-size="14" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">竞争性</text><text x="304.0" y="78.5" text-anchor="end" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">双倒数交于 y 轴</text><text x="26.0" y="97.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">抑制剂占活性中心，与底物争</text><text x="26.0" y="115.5" text-anchor="start" font-size="13.5" font-weight="600" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">Vmax 不变 ↑　Km 增大</text><text x="26.0" y="132.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">加大 [S] 可解除</text><rect x="15.0" y="149.5" width="300.0" height="86.0" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="26.0" y="170.5" text-anchor="start" font-size="14" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">非竞争性</text><text x="304.0" y="170.5" text-anchor="end" font-size="13.5" font-weight="400" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">双倒数交于 x 轴</text><text x="26.0" y="189.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">占活性中心外，E 与 ES 都能结合</text><text x="26.0" y="207.5" text-anchor="start" font-size="13.5" font-weight="600" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">Vmax 降低　Km 不变</text><text x="26.0" y="224.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">不能解除</text><rect x="15.0" y="241.5" width="300.0" height="86.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/><text x="26.0" y="262.5" text-anchor="start" font-size="14" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">反竞争性</text><text x="304.0" y="262.5" text-anchor="end" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">双倒数交于 平行</text><text x="26.0" y="281.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">只结合 ES 复合物</text><text x="26.0" y="299.5" text-anchor="start" font-size="13.5" font-weight="600" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">Vmax 降低　Km 减小</text><text x="26.0" y="316.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">不能解除</text><rect x="15.0" y="333.5" width="300.0" height="134.0" rx="7" fill="#ccfbf1" stroke="#cbd5e1" stroke-width="1.4"/><text x="25.0" y="352.5" text-anchor="start" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">推演记忆法（不用背表）</text><text x="25.0" y="370.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 占门口 → 要更多底物才挤得进 → Km 变大；</text><text x="25.0" y="386.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">底物够多能全挤走 → Vmax 不变</text><text x="25.0" y="402.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 占别处锁死部分酶 → 有效酶量少 → Vmax </text><text x="25.0" y="418.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">降低；剩下的酶亲和力没变 → Km 不变</text><text x="25.0" y="434.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 只认 ES → 反而「帮」底物结合（Km 变小</text><text x="25.0" y="450.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">），但产物放不出（Vmax 降低）→ 平行</text><rect x="15.0" y="475.5" width="300.0" height="76.0" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/><text x="25.0" y="491.5" text-anchor="start" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">临床：磺胺类竞争二氢蝶酸合酶（与 PABA 相</text><text x="25.0" y="507.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">似），首剂加倍占位</text><text x="25.0" y="523.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">加大 PABA 或补叶酸可竞争性逆转 — 所以只</text><text x="25.0" y="539.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">对能自身合成叶酸的细菌有效</text><rect x="11.0" y="556.5" width="308.0" height="51.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="165.0" y="571.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">Vmax 不变 Km↑＝竞争性；Vmax↓ Km 不变＝非</text><text x="165.0" y="587.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">竞争性；两者都↓＝反竞争性</text></svg>