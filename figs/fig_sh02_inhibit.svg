<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 583" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="三种可逆抑制：只看 Vmax 与 Km"><title>三种可逆抑制：只看 Vmax 与 Km</title><desc>竞争性抑制 Km 增大而 Vmax 不变（加大底物可解除），非竞争性 Vmax 降低而 Km 不变，反竞争性二者均降低；三者双倒数图分别交于 y 轴、x 轴、呈平行线。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">三种可逆抑制：只看 Vmax 与 Km</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">竞争性 Km↑、非竞争性 Vmax↓、反竞争性两者都↓</text><rect x="18.0" y="65.0" width="364.0" height="26.0" rx="6" fill="#f8fbfd"/><text x="26.0" y="82.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">类型</text><text x="106.1" y="82.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Vmax / Km</text><text x="208.0" y="82.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">机制与能否解除</text><line x1="18.0" y1="149.0" x2="382.0" y2="149.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="109.0" font-size="12.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">竞争性</text><text x="106.1" y="109.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Vmax 不变
</text><text x="106.1" y="125.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Km增大</text><text x="208.0" y="109.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">抑制剂占活性中心，与底物争；</text><text x="208.0" y="125.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">加大 [S] 可解除；双倒数图交</text><text x="208.0" y="141.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">于 y 轴</text><line x1="18.0" y1="207.0" x2="382.0" y2="207.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="167.0" font-size="12.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">非竞争性</text><text x="106.1" y="167.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Vmax 降低
</text><text x="106.1" y="183.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Km不变</text><text x="208.0" y="167.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">结合活性中心外，E 与 ES 都</text><text x="208.0" y="183.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">能结合；加大 [S] 不能解除；</text><text x="208.0" y="199.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">交于 x 轴</text><line x1="18.0" y1="249.0" x2="382.0" y2="249.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="225.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">反竞争性</text><text x="106.1" y="225.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Vmax 降低
</text><text x="106.1" y="241.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Km减小</text><text x="208.0" y="225.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">只结合 ES 复合物；不能解除；</text><text x="208.0" y="241.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">双倒数图两线平行</text><rect x="18.0" y="261.0" width="364.0" height="201.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="280.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">推演记忆法（不用背表）</text><rect x="30.0" y="291.0" width="3.0" height="15.0" rx="1.5" fill="#c0392b"/><text x="39.0" y="304.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">占门口</text><text x="370.0" y="304.0" text-anchor="end" font-size="12" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">→ Km 变大</text><text x="39.0" y="322.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">要更多底物才挤得进；底物足够多能全挤走</text><text x="39.0" y="338.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">→ Vmax 不变</text><rect x="30.0" y="349.0" width="3.0" height="15.0" rx="1.5" fill="#1f6fb2"/><text x="39.0" y="362.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">别处锁死部分酶</text><text x="370.0" y="362.0" text-anchor="end" font-size="12" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">→ Vmax 降</text><text x="39.0" y="380.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">有效酶量变少；剩下那部分酶亲和力没变</text><text x="39.0" y="396.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">→Km 不变</text><rect x="30.0" y="407.0" width="3.0" height="15.0" rx="1.5" fill="#b45309"/><text x="39.0" y="420.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">只认 ES</text><text x="370.0" y="420.0" text-anchor="end" font-size="12" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">→ 平行</text><text x="39.0" y="438.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">反而「帮」底物结合（Km 变小），但产物放不出</text><text x="39.0" y="454.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">（Vmax 降）</text><rect x="18.0" y="474.0" width="364.0" height="89.0" rx="8" fill="#e2f5f2"/><rect x="18.0" y="474.0" width="3.5" height="89.0" rx="1.8" fill="#0f766e"/><text x="32.0" y="494.0" font-size="11.5" font-weight="700" fill="#0f766e" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">临床</text><text x="32.0" y="511.0" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">临床：磺胺类竞争二氢蝶酸合酶（与 PABA 相似），首</text><text x="32.0" y="530.0" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">剂加倍占位；补 PABA 或叶酸可逆转，所以只对能自身</text><text x="32.0" y="549.0" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">合成叶酸的细菌有效。</text></svg>