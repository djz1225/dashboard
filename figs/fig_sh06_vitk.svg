<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 619" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="维生素 K 与 γ-羧化"><title>维生素 K 与 γ-羧化</title><desc>维生素 K 是 γ-羧化反应的辅因子：凝血因子Ⅱ Ⅶ Ⅸ Ⅹ 的谷氨酸残基经 γ-羧化生成 Gla 才能结合 Ca²⁺ 与磷脂；华法林阻断 K 循环，PT 为监测华法林的首选指标。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">维生素 K 与 γ-羧化</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">没有 K，凝血因子「造得出、用不上」</text><rect x="18.0" y="65.0" width="364.0" height="271.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="84.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">四步</text><rect x="30.0" y="97.0" width="340.0" height="48.0" rx="8" fill="#ffffff" stroke="#e3eaf2" stroke-width="1.1"/><rect x="30.0" y="97.0" width="3.5" height="48.0" rx="1.8" fill="#1f6fb2"/><circle cx="49.0" cy="114.0" r="9" fill="#1f6fb2"/><text x="49.0" y="118.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">1</text><text x="65.0" y="118.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">凝血因子前体（Ⅱ Ⅶ Ⅸ Ⅹ）</text><text x="360.0" y="118.0" text-anchor="end" font-size="12" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">无活性</text><text x="65.0" y="136.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">在肝合成，但尚无活性</text><line x1="49.0" y1="147.0" x2="49.0" y2="156.0" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="156.0" x2="45.6" y2="149.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="156.0" x2="52.4" y2="149.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><rect x="30.0" y="158.0" width="340.0" height="48.0" rx="8" fill="#ffffff" stroke="#e3eaf2" stroke-width="1.1"/><rect x="30.0" y="158.0" width="3.5" height="48.0" rx="1.8" fill="#4a5a6b"/><circle cx="49.0" cy="175.0" r="9" fill="#4a5a6b"/><text x="49.0" y="179.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">2</text><text x="65.0" y="179.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">谷氨酸残基 —CH₂—CH₂—COOH</text><text x="360.0" y="179.0" text-anchor="end" font-size="12" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">待修饰</text><text x="65.0" y="197.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">需在 γ 位再加上一个羧基</text><line x1="49.0" y1="208.0" x2="49.0" y2="217.0" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="217.0" x2="45.6" y2="210.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="217.0" x2="52.4" y2="210.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><rect x="30.0" y="219.0" width="340.0" height="48.0" rx="8" fill="#ffffff" stroke="#e3eaf2" stroke-width="1.1"/><rect x="30.0" y="219.0" width="3.5" height="48.0" rx="1.8" fill="#b45309"/><circle cx="49.0" cy="236.0" r="9" fill="#b45309"/><text x="49.0" y="240.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">3</text><text x="65.0" y="240.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">维生素 K 循环供能完成 γ-羧化</text><text x="360.0" y="240.0" text-anchor="end" font-size="12" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">开关</text><text x="65.0" y="258.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">K 还原酶循环，华法林在此阻断</text><line x1="49.0" y1="269.0" x2="49.0" y2="278.0" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="278.0" x2="45.6" y2="271.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="278.0" x2="52.4" y2="271.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><rect x="30.0" y="280.0" width="340.0" height="48.0" rx="8" fill="#ffffff" stroke="#e3eaf2" stroke-width="1.1"/><rect x="30.0" y="280.0" width="3.5" height="48.0" rx="1.8" fill="#2f8f57"/><circle cx="49.0" cy="297.0" r="9" fill="#2f8f57"/><text x="49.0" y="301.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">4</text><text x="65.0" y="301.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">γ-羧基谷氨酸（Gla）抓 Ca²⁺</text><text x="360.0" y="301.0" text-anchor="end" font-size="12" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">有活性</text><text x="65.0" y="319.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">才能结合磷脂膜、参与凝血</text><rect x="18.0" y="348.0" width="364.0" height="169.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="367.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">临床三个推论</text><rect x="30.0" y="378.0" width="3.0" height="15.0" rx="1.5" fill="#b45309"/><text x="39.0" y="391.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">新生儿</text><text x="370.0" y="391.0" text-anchor="end" font-size="12" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">出生后肌注 K₁</text><text x="39.0" y="409.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肠道无菌、母乳 K 含量低 → 常规</text><text x="39.0" y="425.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">预防出血症</text><rect x="30.0" y="436.0" width="3.0" height="15.0" rx="1.5" fill="#c0392b"/><text x="39.0" y="449.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">华法林</text><text x="370.0" y="449.0" text-anchor="end" font-size="12" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">抑制 K 循环</text><text x="39.0" y="467.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">抑制维生素 K 环氧化物还原酶 → 抗凝</text><rect x="30.0" y="478.0" width="3.0" height="15.0" rx="1.5" fill="#0f766e"/><text x="39.0" y="491.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">PT</text><text x="370.0" y="491.0" text-anchor="end" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">首选监测</text><text x="39.0" y="509.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">反映 Ⅱ Ⅶ Ⅸ Ⅹ；Ⅶ 半衰期最短，最先变化</text><rect x="18.0" y="529.0" width="364.0" height="70.0" rx="8" fill="#fef3c7"/><rect x="18.0" y="529.0" width="3.5" height="70.0" rx="1.8" fill="#b45309"/><text x="32.0" y="549.0" font-size="11.5" font-weight="700" fill="#b45309" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">易错</text><text x="32.0" y="566.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">K 缺乏不是「合成减少」，而是「合成出来但不能羧化」</text><text x="32.0" y="585.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">——补 K 后 PT 可在 6~12 h 内改善。</text></svg>