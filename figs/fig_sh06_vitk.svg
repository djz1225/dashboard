<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 541" width="100%" style="max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px" role="img"><text x="165.0" y="22.6" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">维生素 K：γ-羧化的开关</text><text x="165.0" y="43.0" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">没有 K，凝血因子「造得出、用不上」</text><rect x="15.0" y="58.0" width="300.0" height="41.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.4"/><text x="28.0" y="77.0" text-anchor="start" font-size="12.6" font-weight="700" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">① 凝血因子前体（Ⅱ Ⅶ Ⅸ Ⅹ）</text><text x="28.0" y="94.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">在肝合成，但尚无活性</text><line x1="165.0" y1="100.0" x2="165.0" y2="99.5" stroke="#64748b" stroke-width="1.4" stroke-linecap="round"/><polygon points="165.0,104.0 163.0,99.4 167.0,99.4" fill="#64748b"/><rect x="15.0" y="105.0" width="300.0" height="41.0" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/><text x="28.0" y="124.0" text-anchor="start" font-size="12.6" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">② 谷氨酸残基 —CH₂—CH₂—COOH</text><text x="28.0" y="141.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">需在 γ 位加一个羧基</text><line x1="165.0" y1="147.0" x2="165.0" y2="146.5" stroke="#64748b" stroke-width="1.4" stroke-linecap="round"/><polygon points="165.0,151.0 163.0,146.4 167.0,146.4" fill="#64748b"/><rect x="15.0" y="152.0" width="300.0" height="41.0" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/><text x="28.0" y="171.0" text-anchor="start" font-size="12.6" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">③ 维生素 K 循环供能完成 γ-羧化</text><text x="28.0" y="188.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">K 还原酶循环，华法林在此阻断</text><line x1="165.0" y1="194.0" x2="165.0" y2="193.5" stroke="#64748b" stroke-width="1.4" stroke-linecap="round"/><polygon points="165.0,198.0 163.0,193.4 167.0,193.4" fill="#64748b"/><rect x="15.0" y="199.0" width="300.0" height="41.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/><text x="28.0" y="218.0" text-anchor="start" font-size="12.6" font-weight="700" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">④ γ-羧基谷氨酸（Gla）抓 Ca²⁺</text><text x="28.0" y="235.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">才能结合磷脂膜，参与凝血</text><rect x="15.0" y="243.0" width="300.0" height="150.0" rx="7" fill="#ccfbf1" stroke="#cbd5e1" stroke-width="1.4"/><text x="25.0" y="262.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">临床三个推论</text><text x="25.0" y="280.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 新生儿肠道无菌、母乳 K 含量低 → 出生后</text><text x="25.0" y="296.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">常规肌注维生素 K₁ 预防出血症</text><text x="25.0" y="312.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 华法林抑制维生素 K 环氧化物还原酶 → 拮</text><text x="25.0" y="328.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">抗 K 循环 → 抗凝</text><text x="25.0" y="344.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· PT（凝血酶原时间）反映 Ⅱ Ⅶ Ⅸ Ⅹ，</text><text x="25.0" y="360.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">是监测华法林的首选指标（Ⅶ 半衰期最短，</text><text x="25.0" y="376.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">最先变化）</text><rect x="15.0" y="401.0" width="300.0" height="76.0" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/><text x="25.0" y="417.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">易错：维生素 K 缺乏不是「因子合成减少」，</text><text x="25.0" y="433.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">是「合成出来但不能羧化」</text><text x="25.0" y="449.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">所以补充维生素 K 后 PT 可在 6~12 h 内改</text><text x="25.0" y="465.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">善</text><rect x="11.0" y="482.0" width="308.0" height="51.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="165.0" y="497.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">维生素 K 是 γ-羧化反应的辅因子；华法林阻断</text><text x="165.0" y="512.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"> K 循环，PT 为首选监测</text></svg>