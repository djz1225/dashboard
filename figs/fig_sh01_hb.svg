<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 670" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="Hb 与 Mb 的氧解离曲线"><title>Hb 与 Mb 的氧解离曲线</title><desc>Hb 为四亚基、呈 S 形曲线，靠正协同在肺装载、在组织卸载，p50 约 26 mmHg；Mb 单链呈双曲线、亲和力高，只储氧。pH 降低、PCO₂ 升高、温度升高、2,3-BPG 升高使曲线右移，利于放氧。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Hb 与 Mb 的氧解离曲线</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Hb 靠 S 形曲线在肺装载、在组织卸载；Mb 双曲线只储不运</text><line x1="18.0" y1="73.0" x2="32.0" y2="73.0" stroke="#c0392b" stroke-width="2.2" stroke-linecap="round"/><text x="37.0" y="77.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Hb 血红蛋白（S 形，正协同）</text><line x1="210.1" y1="73.0" x2="224.1" y2="73.0" stroke="#1f6fb2" stroke-width="2.2" stroke-dasharray="5 3" stroke-linecap="round"/><text x="229.1" y="77.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Mb 肌红蛋白（双曲线，高亲和）</text><rect x="18.0" y="85.0" width="364.0" height="196.0" rx="9" fill="#ffffff" stroke="#e3eaf2" stroke-width="1.1"/><line x1="50.0" y1="118.1" x2="54.0" y2="118.1" stroke="#cbd8e4" stroke-width="1" stroke-linecap="round"/><text x="47.0" y="122.1" text-anchor="end" font-size="12" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">100</text><line x1="54.0" y1="118.1" x2="370.0" y2="118.1" stroke="#f1f6fa" stroke-width="1" stroke-linecap="round"/><line x1="50.0" y1="187.6" x2="54.0" y2="187.6" stroke="#cbd8e4" stroke-width="1" stroke-linecap="round"/><text x="47.0" y="191.6" text