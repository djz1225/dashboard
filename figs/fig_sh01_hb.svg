O₂↑、</text><text x="29.0" y="508.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">温度↑、2,3-BPG↑</text><text x="29.0" y="528.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">运动中的肌肉能多拿到氧</text><rect x="205.0" y="452.0" width="177.0" height="116.0" rx="9" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1.1"/><text x="216.0" y="473.0" font-size="12.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">左移＝更紧抓氧</text><text x="216.0" y="492.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">pH↑、PCO₂↓、温度↓、</text><text x="216.0" y="508.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">2,3-BPG↓</text><text x="216.0" y="528.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">库存血 2,3-BPG 下降</text><text x="216.0" y="544.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">即属此类</text><rect x="18.0" y="580.0" width="364.0" height="70.0" rx="8" fill="#e2f5f2"/><rect x="18.0" y="580.0" width="3.5" height="70.0" rx="1.8" fill="#0f766e"/><text x="32.0" y="600.0" font-size="11.5" font-weight="700" fill="#0f766e" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="617.0" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Hb 亲和力比 Mb 低才放得掉氧；曲线右移＝更容易卸氧</text><text x="32.0" y="636.0" font-size="13.5" font-weight="700" 