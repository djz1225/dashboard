<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 587" width="100%" style="max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px" role="img"><text x="165.0" y="22.6" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">肉碱穿梭：脂酰CoA 进线粒体的唯一门</text><text x="165.0" y="43.0" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">长链脂肪酸不能自己过内膜，必须换成脂酰肉碱</text><rect x="15.0" y="58.0" width="300.0" height="56.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.4"/><text x="28.0" y="77.0" text-anchor="start" font-size="12.6" font-weight="700" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">① 胞质活化</text><text x="28.0" y="94.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">脂酰CoA 合成酶：脂肪酸 + CoA + ATP → 脂酰CoA（</text><text x="28.0" y="109.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">耗 2 个高能键）</text><line x1="165.0" y1="115.0" x2="165.0" y2="114.5" stroke="#64748b" stroke-width="1.4" stroke-linecap="round"/><polygon points="165.0,119.0 163.0,114.4 167.0,114.4" fill="#64748b"/><rect x="15.0" y="120.0" width="300.0" height="56.0" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/><text x="28.0" y="139.0" text-anchor="start" font-size="12.6" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">② CPT-Ⅰ 转换</text><text x="28.0" y="156.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">脂酰CoA + 肉碱 → 脂酰肉碱（限速步，受丙二酰CoA </text><text x="28.0" y="171.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">抑制）</text><line x1="165.0" y1="177.0" x2="165.0" y2="176.5" stroke="#64748b" stroke-width="1.4" stroke-linecap="round"/><polygon points="165.0,181.0 163.0,176.4 167.0,176.4" fill="#64748b"/><rect x="15.0" y="182.0" width="300.0" height="41.0" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/><text x="28.0" y="201.0" text-anchor="start" font-size="12.6" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">③ 转位酶</text><text x="28.0" y="218.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">脂酰肉碱过内膜，CoA 留在胞质</text><line x1="165.0" y1="224.0" x2="165.0" y2="223.5" stroke="#64748b" stroke-width="1.4" stroke-linecap="round"/><polygon points="165.0,228.0 163.0,223.4 167.0,223.4" fill="#64748b"/><rect x="15.0" y="229.0" width="300.0" height="41.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/><text x="28.0" y="248.0" text-anchor="start" font-size="12.6" font-weight="700" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">④ CPT-Ⅱ 还原</text><text x="28.0" y="265.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">线粒体内变回脂酰CoA，进入 β-氧化</text><rect x="15.0" y="273.0" width="300.0" height="166.0" rx="7" fill="#ccfbf1" stroke="#cbd5e1" stroke-width="1.4"/><text x="25.0" y="292.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">三个临床联系</text><text x="25.0" y="310.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 丙二酰CoA 抑制 CPT-Ⅰ：脂肪酸合成旺盛</text><text x="25.0" y="326.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">时（进食后）自动关闭 β-氧化，避免「边合</text><text x="25.0" y="342.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">成边烧」</text><text x="25.0" y="358.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 肉碱缺乏（长期肠外营养、透析、遗传缺陷</text><text x="25.0" y="374.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">）→ 长链脂肪酸不能氧化 → 肌无力、</text><text x="25.0" y="390.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">低酮性低血糖</text><text x="25.0" y="406.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 中链脂肪酸（&lt;12C）不依赖肉碱，可直达线</text><text x="25.0" y="422.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">粒体 —— 这就是中链甘油三酯用于治疗的原理</text><rect x="15.0" y="447.0" width="300.0" height="76.0" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/><text x="25.0" y="463.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">易错：活化消耗的是 2 个高能磷酸键（ATP→A</text><text x="25.0" y="479.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">MP+PPi），不是 1 个 ATP</text><text x="25.0" y="495.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">CPT-Ⅰ 是限速步，受丙二酰CoA（而非产物）</text><text x="25.0" y="511.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">抑制</text><rect x="11.0" y="528.0" width="308.0" height="51.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="165.0" y="543.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">CPT-Ⅰ 是限速步、受丙二酰CoA 抑制；</text><text x="165.0" y="558.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">中链脂肪酸绕过肉碱</text></svg>