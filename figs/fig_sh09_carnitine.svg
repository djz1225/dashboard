<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 689" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="肉碱穿梭：长链脂酰CoA 的唯一门"><title>肉碱穿梭：长链脂酰CoA 的唯一门</title><desc>长链脂肪酸在胞质活化为脂酰CoA（消耗 2 个高能键），经 CPT-Ⅰ 转为脂酰肉碱（限速步，受丙二酰CoA 抑制）、转位酶过内膜、CPT-Ⅱ 在基质内还原为脂酰CoA进入 β-氧化；中链脂肪酸（&lt;12C）不依赖肉碱，肉碱缺乏时表现为肌无力与低酮性低血糖。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肉碱穿梭：长链脂酰CoA 的唯一门</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">活化耗 2 个高能键；CPT-Ⅰ 是限速步，被丙二酰CoA 抑制</text><rect x="18.0" y="65.0" width="364.0" height="313.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="84.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">四步换乘</text><rect x="30.0" y="97.0" width="340.0" height="80.0" rx="8" fill="#ffffff" stroke="#e3eaf2" stroke-width="1.1"/><rect x="30.0" y="97.0" width="3.5" height="80.0" rx="1.8" fill="#c0392b"/><circle cx="49.0" cy="114.0" r="9" fill="#c0392b"/><text x="49.0" y="118.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">1</text><text x="65.0" y="118.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">① 胞质活化</text><text x="360.0" y="118.0" text-anchor="end" font-size="12" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">耗 2 键</text><text x="65.0" y="136.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">脂酰CoA 合成酶：脂肪酸 + CoA + ATP</text><text x="65.0" y="152.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">→ 脂酰CoA + AMP + PPi，耗 2 个</text><text x="65.0" y="168.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">高能键</text><line x1="49.0" y1="179.0" x2="49.0" y2="186.0" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="186.0" x2="45.6" y2="179.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="186.0" x2="52.4" y2="179.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><rect x="30.0" y="188.0" width="340.0" height="64.0" rx="8" fill="#ffffff" stroke="#e3eaf2" stroke-width="1.1"/><rect x="30.0" y="188.0" width="3.5" height="64.0" rx="1.8" fill="#c1440e"/><circle cx="49.0" cy="205.0" r="9" fill="#c1440e"/><text x="49.0" y="209.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">2</text><text x="65.0" y="209.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">② CPT-Ⅰ｜外膜</text><text x="360.0" y="209.0" text-anchor="end" font-size="12" font-weight="700" fill="#c1440e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">限速</text><text x="65.0" y="227.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">脂酰CoA + 肉碱 → 脂酰肉碱；限速步，受丙</text><text x="65.0" y="243.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">二酰CoA 抑制</text><line x1="49.0" y1="254.0" x2="49.0" y2="261.0" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="261.0" x2="45.6" y2="254.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="261.0" x2="52.4" y2="254.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><rect x="30.0" y="263.0" width="340.0" height="48.0" rx="8" fill="#ffffff" stroke="#e3eaf2" stroke-width="1.1"/><rect x="30.0" y="263.0" width="3.5" height="48.0" rx="1.8" fill="#4a5a6b"/><circle cx="49.0" cy="280.0" r="9" fill="#4a5a6b"/><text x="49.0" y="284.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">3</text><text x="65.0" y="284.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">③ 转位酶</text><text x="360.0" y="284.0" text-anchor="end" font-size="12" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">过膜</text><text x="65.0" y="302.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">脂酰肉碱过内膜，CoA 留在胞质不进去</text><line x1="49.0" y1="313.0" x2="49.0" y2="320.0" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="320.0" x2="45.6" y2="313.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="320.0" x2="52.4" y2="313.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><rect x="30.0" y="322.0" width="340.0" height="48.0" rx="8" fill="#ffffff" stroke="#e3eaf2" stroke-width="1.1"/><rect x="30.0" y="322.0" width="3.5" height="48.0" rx="1.8" fill="#7b4bb7"/><circle cx="49.0" cy="339.0" r="9" fill="#7b4bb7"/><text x="49.0" y="343.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">4</text><text x="65.0" y="343.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">④ CPT-Ⅱ｜基质侧</text><text x="360.0" y="343.0" text-anchor="end" font-size="12" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">入基质</text><text x="65.0" y="361.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">变回脂酰CoA，交给 β-氧化</text><rect x="18.0" y="390.0" width="364.0" height="197.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="409.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">三个临床联系</text><rect x="30.0" y="420.0" width="3.0" height="15.0" rx="1.5" fill="#0f766e"/><text x="39.0" y="433.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">丙二酰CoA 抑制 CPT-Ⅰ</text><text x="370.0" y="433.0" text-anchor="end" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">反向调节</text><text x="39.0" y="451.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">进食后脂肪酸合成旺盛，丙二酰CoA 高 → 关</text><text x="39.0" y="467.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">闭 β-氧化，避免「边合成边烧」</text><rect x="30.0" y="476.0" width="3.0" height="15.0" rx="1.5" fill="#c0392b"/><text x="39.0" y="489.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肉碱缺乏</text><text x="370.0" y="489.0" text-anchor="end" font-size="12" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">长链不能烧</text><text x="39.0" y="507.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">长期肠外营养、透析、遗传缺陷 → 肌无力、</text><text x="39.0" y="523.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">低酮性低血糖</text><rect x="30.0" y="532.0" width="3.0" height="15.0" rx="1.5" fill="#2f8f57"/><text x="39.0" y="545.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">中链脂肪酸</text><text x="370.0" y="545.0" text-anchor="end" font-size="12" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">可绕过</text><text x="39.0" y="563.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">碳链 &lt;12C 不依赖肉碱，可直达线粒体 —— 中</text><text x="39.0" y="579.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">链甘油三酯的治疗原理</text><rect x="18.0" y="599.0" width="364.0" height="70.0" rx="8" fill="#fef3c7"/><rect x="18.0" y="599.0" width="3.5" height="70.0" rx="1.8" fill="#b45309"/><text x="32.0" y="619.0" font-size="11.5" font-weight="700" fill="#b45309" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">易错</text><text x="32.0" y="636.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">活化消耗的是 2 个高能磷酸键（ATP→AMP+PPi），不</text><text x="32.0" y="655.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">是 1 个 ATP；CPT-Ⅰ 受丙二酰CoA（而非产物）抑制。</text></svg>