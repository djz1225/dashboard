<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 620" width="100%" style="max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px" role="img"><text x="165.0" y="22.6" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">运动控制的三级结构</text><text x="165.0" y="43.0" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">脊髓管反射、脑干管姿势、大脑皮质管随意运动</text><rect x="15.0" y="60.0" width="300.0" height="56.0" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/><text x="24.0" y="79.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">脊髓</text><text x="24.0" y="96.0" text-anchor="start" font-size="13" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">牵张反射（肌梭→α运动神经元）、屈肌反射</text><text x="24.0" y="112.0" text-anchor="start" font-size="13" font-weight="600" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">最基本、最原始</text><rect x="15.0" y="122.0" width="300.0" height="56.0" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/><text x="24.0" y="141.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">脑干</text><text x="24.0" y="158.0" text-anchor="start" font-size="13" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">姿势反射、去大脑僵直（易化区&gt;抑制区）</text><text x="24.0" y="174.0" text-anchor="start" font-size="13" font-weight="600" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">维持抗重力姿势</text><rect x="15.0" y="184.0" width="300.0" height="56.0" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.4"/><text x="24.0" y="203.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">基底神经节</text><text x="24.0" y="220.0" text-anchor="start" font-size="13" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">调节肌张力、协调运动、启动运动</text><text x="24.0" y="236.0" text-anchor="start" font-size="13" font-weight="600" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">帕金森病、舞蹈病</text><rect x="15.0" y="246.0" width="300.0" height="56.0" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.4"/><text x="24.0" y="265.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">小脑</text><text x="24.0" y="282.0" text-anchor="start" font-size="13" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">协调运动、维持平衡、参与运动学习</text><text x="24.0" y="298.0" text-anchor="start" font-size="13" font-weight="600" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">损伤致共济失调</text><rect x="15.0" y="308.0" width="300.0" height="56.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/><text x="24.0" y="327.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">大脑皮质</text><text x="24.0" y="344.0" text-anchor="start" font-size="13" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">随意运动的发起与精细控制（锥体束）</text><text x="24.0" y="360.0" text-anchor="start" font-size="13" font-weight="600" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">最高级</text><rect x="15.0" y="372.0" width="300.0" height="102.0" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="25.0" y="391.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">两个必考的病理状态</text><text x="25.0" y="409.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 去大脑僵直：切断中脑 → 易化区相对占优 </text><text x="25.0" y="425.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">→ 伸肌紧张亢进（抗重力肌）</text><text x="25.0" y="441.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 脊休克：脊髓突然断离 → 断面以下暂时无</text><text x="25.0" y="457.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">反射（数周后恢复，但无意识控制）</text><rect x="15.0" y="482.0" width="300.0" height="76.0" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/><text x="25.0" y="498.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">牵张反射的两个成分：肌梭（感受牵拉，</text><text x="25.0" y="514.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">兴奋）+ 腱器官（感受张力，抑制）</text><text x="25.0" y="530.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">帕金森病：黑质多巴胺↓ → 纹状体 ACh 相对</text><text x="25.0" y="546.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">亢进 → 肌强直、静止性震颤</text><rect x="11.0" y="561.0" width="308.0" height="51.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="165.0" y="576.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">脊髓管反射、脑干管姿势、基底节调张力、</text><text x="165.0" y="591.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">小脑管协调、皮质管随意</text></svg>