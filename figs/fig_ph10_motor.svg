<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 695" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="运动调控：五级结构、两条下行通路"><title>运动调控：五级结构、两条下行通路</title><desc>脊髓完成牵张反射，脑干完成姿势反射，基底神经节调节肌张力，小脑协调运动，大脑皮质经锥体束发起随意运动；锥体外系调节肌张力与协调；去大脑僵直因易化区占优，脊休克为断面以下反射暂时消失。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">运动调控：五级结构、两条下行通路</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">脊髓管反射、脑干管姿势、基底节调张力、小脑管协调、皮质</text><text x="18.0" y="68.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">管随意</text><rect x="18.0" y="82.0" width="364.0" height="23.0" rx="6" fill="#e2f5f2"/><text x="25.0" y="98.0" font-size="11" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">结构</text><text x="105.1" y="98.0" font-size="11" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">功能</text><text x="228.8" y="98.0" font-size="11" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><line x1="18.0" y1="130.0" x2="382.0" y2="130.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="25.0" y="123.0" font-size="12.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">脊髓</text><text x="105.1" y="123.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">牵张反射、屈肌反射</text><text x="228.8" y="123.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">最基本、最原始的反射中枢</text><line x1="18.0" y1="171.0" x2="382.0" y2="171.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="25.0" y="148.0" font-size="12.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">脑干</text><text x="105.1" y="148.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">姿势反射、去大</text><text x="105.1" y="164.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">脑僵直</text><text x="228.8" y="148.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">易化区＞抑制区时伸肌</text><text x="228.8" y="164.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">紧张亢进</text><line x1="18.0" y1="212.0" x2="382.0" y2="212.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="25.0" y="189.0" font-size="12.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">基底神经节</text><text x="105.1" y="189.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">调节肌张力、启</text><text x="105.1" y="205.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">动运动</text><text x="228.8" y="189.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">帕金森病、舞蹈病</text><line x1="18.0" y1="253.0" x2="382.0" y2="253.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="25.0" y="230.0" font-size="12.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">小脑</text><text x="105.1" y="230.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">协调运动、维持平衡</text><text x="228.8" y="230.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">损伤 → 共济失调、意</text><text x="228.8" y="246.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">向性震颤</text><line x1="18.0" y1="294.0" x2="382.0" y2="294.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="25.0" y="271.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">大脑皮质</text><text x="105.1" y="271.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">随意运动、精细控制</text><text x="228.8" y="271.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">经锥体束（皮质脊髓束）</text><text x="228.8" y="287.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">下达</text><rect x="18.0" y="302.0" width="177.0" height="120.0" rx="9" fill="#e2f5f2" stroke="#0f766e" stroke-width="1.1"/><text x="29.0" y="323.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">锥体系</text><text x="29.0" y="342.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">皮质脊髓束＋皮质脑干束</text><text x="29.0" y="362.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">控制精细、技巧性随意运动</text><text x="29.0" y="382.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">损伤 → 硬瘫（肌张力↑、</text><text x="29.0" y="398.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">反射亢进、Babinski 阳性）</text><rect x="205.0" y="302.0" width="177.0" height="120.0" rx="9" fill="#f2ecfb" stroke="#7b4bb7" stroke-width="1.1"/><text x="216.0" y="323.0" font-size="12.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">锥体外系</text><text x="216.0" y="342.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">皮质-基底节-皮质环路等</text><text x="216.0" y="362.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">调节肌张力、协调肌群、姿势</text><text x="216.0" y="382.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">损伤 → 帕金森样或舞</text><text x="216.0" y="398.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">蹈样运动</text><rect x="18.0" y="432.0" width="364.0" height="161.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="450.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">三个必考状态</text><rect x="31.0" y="460.0" width="3.0" height="15.0" rx="1.5" fill="#1f6fb2"/><text x="40.0" y="473.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">牵张反射</text><text x="344.0" y="473.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">两成分</text><text x="40.0" y="491.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肌梭感受牵拉 → 兴奋 α 运动神经元；腱器官感受张</text><text x="40.0" y="507.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">力 → 抑制</text><rect x="31.0" y="515.0" width="3.0" height="15.0" rx="1.5" fill="#b45309"/><text x="40.0" y="528.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">去大脑僵直</text><text x="344.0" y="528.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">易化↑</text><text x="40.0" y="546.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">中脑上下丘之间切断 → 抗重力肌（伸肌）紧张亢进</text><rect x="31.0" y="554.0" width="3.0" height="15.0" rx="1.5" fill="#4a5a6b"/><text x="40.0" y="567.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">脊休克</text><text x="344.0" y="567.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">先消失后恢复</text><text x="40.0" y="585.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">断面以下反射暂时消失，数周后恢复但无意识控制</text><rect x="18.0" y="605.0" width="364.0" height="70.0" rx="8" fill="#eef2f7"/><rect x="18.0" y="605.0" width="3.5" height="70.0" rx="1.8" fill="#4a5a6b"/><text x="32.0" y="625.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="642.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">锥体系管「精细随意」、锥体外系管「张力与协调」；去</text><text x="32.0" y="661.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">大脑僵直的本质是易化区相对占优。</text></svg>