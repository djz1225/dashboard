<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 700" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="肥胖与胰岛素抵抗的生化链条"><title>肥胖与胰岛素抵抗的生化链条</title><desc>能量长期过剩使脂肪细胞容量不足，脂质溢出并异位沉积于肝、肌与胰岛；二酰甘油激活 PKCθ/ε，使胰岛素受体底物 IRS-1 丝氨酸磷酸化而无法正常酪氨酸磷酸化，PI3K-Akt 通路减弱、GLUT4 转位不足、葡萄糖摄取下降；机体代偿性高胰岛素血症最终导致 β 细胞衰竭与 2 型糖尿病。减重 5~10% 可显著改善肝胰岛素敏感性。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肥胖与胰岛素抵抗的生化链条</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">从能量过剩到信号失灵：五步链条，减重从源头断链</text><rect x="18.0" y="65.0" width="364.0" height="324.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="84.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">五步链条</text><rect x="30.0" y="97.0" width="340.0" height="48.0" rx="8" fill="#ffffff" stroke="#e3eaf2" stroke-width="1.1"/><rect x="30.0" y="97.0" width="3.5" height="48.0" rx="1.8" fill="#c0392b"/><circle cx="49.0" cy="114.0" r="9" fill="#c0392b"/><text x="49.0" y="118.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">1</text><text x="65.0" y="118.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">① 能量过剩 → 脂肪容量不足</text><text x="360.0" y="118.0" text-anchor="end" font-size="12" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">起点</text><text x="65.0" y="136.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">脂质溢出到肝、骨骼肌、胰岛等非脂肪组织</text><line x1="49.0" y1="147.0" x2="49.0" y2="154.0" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="154.0" x2="45.6" y2="147.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="154.0" x2="52.4" y2="147.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><rect x="30.0" y="156.0" width="340.0" height="48.0" rx="8" fill="#ffffff" stroke="#e3eaf2" stroke-width="1.1"/><rect x="30.0" y="156.0" width="3.5" height="48.0" rx="1.8" fill="#7b4bb7"/><circle cx="49.0" cy="173.0" r="9" fill="#7b4bb7"/><text x="49.0" y="177.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">2</text><text x="65.0" y="177.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">② 异位沉积二酰甘油</text><text x="360.0" y="177.0" text-anchor="end" font-size="12" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">信号</text><text x="65.0" y="195.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">DAG 激活 PKCθ / PKCε</text><line x1="49.0" y1="206.0" x2="49.0" y2="213.0" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="213.0" x2="45.6" y2="206.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="213.0" x2="52.4" y2="206.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><rect x="30.0" y="215.0" width="340.0" height="48.0" rx="8" fill="#ffffff" stroke="#e3eaf2" stroke-width="1.1"/><rect x="30.0" y="215.0" width="3.5" height="48.0" rx="1.8" fill="#c1440e"/><circle cx="49.0" cy="232.0" r="9" fill="#c1440e"/><text x="49.0" y="236.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">3</text><text x="65.0" y="236.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">③ IRS-1 丝氨酸磷酸化</text><text x="360.0" y="236.0" text-anchor="end" font-size="12" font-weight="700" fill="#c1440e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">失活</text><text x="65.0" y="254.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胰岛素受体底物不能正常酪氨酸磷酸化</text><line x1="49.0" y1="265.0" x2="49.0" y2="272.0" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="272.0" x2="45.6" y2="265.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="272.0" x2="52.4" y2="265.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><rect x="30.0" y="274.0" width="340.0" height="48.0" rx="8" fill="#ffffff" stroke="#e3eaf2" stroke-width="1.1"/><rect x="30.0" y="274.0" width="3.5" height="48.0" rx="1.8" fill="#b45309"/><circle cx="49.0" cy="291.0" r="9" fill="#b45309"/><text x="49.0" y="295.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">4</text><text x="65.0" y="295.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">④ PI3K-Akt 通路减弱</text><text x="360.0" y="295.0" text-anchor="end" font-size="12" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">抵抗</text><text x="65.0" y="313.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">GLUT4 转位不足 → 葡萄糖摄取下降</text><line x1="49.0" y1="324.0" x2="49.0" y2="331.0" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="331.0" x2="45.6" y2="324.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="331.0" x2="52.4" y2="324.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><rect x="30.0" y="333.0" width="340.0" height="48.0" rx="8" fill="#ffffff" stroke="#e3eaf2" stroke-width="1.1"/><rect x="30.0" y="333.0" width="3.5" height="48.0" rx="1.8" fill="#c0392b"/><circle cx="49.0" cy="350.0" r="9" fill="#c0392b"/><text x="49.0" y="354.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">5</text><text x="65.0" y="354.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">⑤ 高胰岛素血症 → β 细胞衰竭</text><text x="360.0" y="354.0" text-anchor="end" font-size="12" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">终点</text><text x="65.0" y="372.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">代偿失败，最终发展为 2 型糖尿病</text><rect x="18.0" y="401.0" width="364.0" height="197.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="420.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">临床三点</text><rect x="30.0" y="431.0" width="3.0" height="15.0" rx="1.5" fill="#0f766e"/><text x="39.0" y="444.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">为什么减重更根本</text><text x="370.0" y="444.0" text-anchor="end" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">断源头</text><text x="39.0" y="462.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">链条起点是能量过剩与异位脂质，药物只能改</text><text x="39.0" y="478.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">善某一段</text><rect x="30.0" y="487.0" width="3.0" height="15.0" rx="1.5" fill="#2f8f57"/><text x="39.0" y="500.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">减 5~10% 就有效</text><text x="370.0" y="500.0" text-anchor="end" font-size="12" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肝脂先降</text><text x="39.0" y="518.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肝胰岛素敏感性改善最明显，这也是代谢手术优</text><text x="39.0" y="534.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">于药物的原因</text><rect x="30.0" y="543.0" width="3.0" height="15.0" rx="1.5" fill="#b45309"/><text x="39.0" y="556.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">早期血糖可正常</text><text x="370.0" y="556.0" text-anchor="end" font-size="12" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">别只看血糖</text><text x="39.0" y="574.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">靠高胰岛素代偿，血糖仍可正常；腰围与肝脂</text><text x="39.0" y="590.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">更能反映沉积</text><rect x="18.0" y="610.0" width="364.0" height="70.0" rx="8" fill="#e2f5f2"/><rect x="18.0" y="610.0" width="3.5" height="70.0" rx="1.8" fill="#0f766e"/><text x="32.0" y="630.0" font-size="11.5" font-weight="700" fill="#0f766e" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="647.0" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胰岛素抵抗先于高血糖出现；只查空腹血糖会漏掉大量早</text><text x="32.0" y="666.0" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">期抵抗者。</text></svg>