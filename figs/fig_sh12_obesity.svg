<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 540" width="100%" style="max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px" role="img"><text x="165.0" y="22.6" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">肥胖与胰岛素抵抗的生化链条</text><text x="165.0" y="43.0" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">从异位脂质到信号失灵</text><rect x="15.0" y="58.0" width="300.0" height="41.0" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/><text x="28.0" y="77.0" text-anchor="start" font-size="12.6" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">① 能量过剩 → 脂肪细胞容量不足</text><text x="28.0" y="94.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">脂质溢出到肝、肌、胰岛</text><line x1="165.0" y1="100.0" x2="165.0" y2="99.5" stroke="#64748b" stroke-width="1.4" stroke-linecap="round"/><polygon points="165.0,104.0 163.0,99.4 167.0,99.4" fill="#64748b"/><rect x="15.0" y="105.0" width="300.0" height="41.0" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.4"/><text x="28.0" y="124.0" text-anchor="start" font-size="12.6" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">② 异位沉积二酰甘油（DAG）</text><text x="28.0" y="141.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">DAG 激活 PKCθ/PKCε</text><line x1="165.0" y1="147.0" x2="165.0" y2="146.5" stroke="#64748b" stroke-width="1.4" stroke-linecap="round"/><polygon points="165.0,151.0 163.0,146.4 167.0,146.4" fill="#64748b"/><rect x="15.0" y="152.0" width="300.0" height="41.0" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/><text x="28.0" y="171.0" text-anchor="start" font-size="12.6" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">③ IRS-1 丝氨酸磷酸化</text><text x="28.0" y="188.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">胰岛素受体底物不能正常酪氨酸磷酸化</text><line x1="165.0" y1="194.0" x2="165.0" y2="193.5" stroke="#64748b" stroke-width="1.4" stroke-linecap="round"/><polygon points="165.0,198.0 163.0,193.4 167.0,193.4" fill="#64748b"/><rect x="15.0" y="199.0" width="300.0" height="41.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/><text x="28.0" y="218.0" text-anchor="start" font-size="12.6" font-weight="700" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">④ PI3K-Akt 通路减弱</text><text x="28.0" y="235.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">GLUT4 转位不足 → 葡萄糖摄取下降</text><line x1="165.0" y1="241.0" x2="165.0" y2="240.5" stroke="#64748b" stroke-width="1.4" stroke-linecap="round"/><polygon points="165.0,245.0 163.0,240.4 167.0,240.4" fill="#64748b"/><rect x="15.0" y="246.0" width="300.0" height="41.0" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.4"/><text x="28.0" y="265.0" text-anchor="start" font-size="12.6" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">⑤ 代偿性高胰岛素血症 → β 细胞衰竭</text><text x="28.0" y="282.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">最终发展为 2 型糖尿病</text><rect x="15.0" y="290.0" width="300.0" height="118.0" rx="7" fill="#ccfbf1" stroke="#cbd5e1" stroke-width="1.4"/><text x="25.0" y="309.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">为什么「减重」比「加药」更根本</text><text x="25.0" y="327.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 链条的起点是能量过剩与异位脂质，</text><text x="25.0" y="343.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">药物只能改善某一段</text><text x="25.0" y="359.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 减重 5~10% 即可显著改善肝胰岛素敏感性（</text><text x="25.0" y="375.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">肝脂下降最快）</text><text x="25.0" y="391.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 这也是代谢手术效果优于药物的生化原因</text><rect x="15.0" y="416.0" width="300.0" height="60.0" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/><text x="25.0" y="432.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">易错：胰岛素抵抗早期血糖可能正常（</text><text x="25.0" y="448.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">靠高胰岛素代偿），不能只看血糖</text><text x="25.0" y="464.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">腰围/肝脂比体重更能反映异位脂质沉积程度</text><rect x="11.0" y="481.0" width="308.0" height="51.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="165.0" y="496.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">能量过剩 → 异位 DAG → PKC → IRS-1 失活 →</text><text x="165.0" y="511.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"> 抵抗；减重从源头断链</text></svg>