<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 608" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="基因家族与假基因"><title>基因家族与假基因</title><desc>基因家族是一组序列相似、功能相关的基因，由基因重复加变异演化而来，可分为串联重复（rRNA、tRNA、组蛋白基因）与散在家族（珠蛋白 α 簇在 16 号、β 簇在 11 号染色体）。珠蛋白家族按发育阶段由胚胎型 ζ₂ε₂ 依次切换为胎儿型α₂γ₂（HbF）与成人型 α₂β₂（HbA）。假基因是序列相似但已失活的成员，是进化化石；由 mRNA 逆转录整合形成的加工假基因无内含子，少数仍有活性。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">基因家族与假基因</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">基因重复 + 变异 = 家族；再失活 = 假基因</text><rect x="18.0" y="65.0" width="177.0" height="100.0" rx="9" fill="#e2f5f2" stroke="#0f766e" stroke-width="1.1"/><text x="29.0" y="86.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">串联重复家族</text><text x="29.0" y="105.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">成簇排在同一条染色体上</text><text x="29.0" y="125.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">rRNA、tRNA、组蛋白基因</text><rect x="205.0" y="65.0" width="177.0" height="100.0" rx="9" fill="#e2f5f2" stroke="#0f766e" stroke-width="1.1"/><text x="216.0" y="86.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">散在家族</text><text x="216.0" y="105.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">分散在不同染色体</text><text x="216.0" y="125.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">珠蛋白：α 簇 16 号、β</text><text x="216.0" y="141.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">簇 11 号</text><rect x="18.0" y="175.0" width="364.0" height="124.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="194.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">珠蛋白基因家族</text><text x="30.0" y="215.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">α 簇（16 号）与 β 簇（11 号）按发育阶段依次切换</text><rect x="30.0" y="229.0" width="107.7" height="44.0" rx="5" fill="#eef2f7" stroke="#4a5a6b" stroke-width="1"/><text x="83.8" y="246.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胚胎型</text><text x="83.8" y="262.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">ζ₂ε₂</text><rect x="140.7" y="229.0" width="107.7" height="44.0" rx="5" fill="#e2f5f2" stroke="#0f766e" stroke-width="1"/><text x="194.5" y="246.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胎儿型</text><text x="194.5" y="262.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">α₂γ₂ HbF</text><rect x="251.3" y="229.0" width="107.7" height="44.0" rx="5" fill="#e2f5f2" stroke="#0f766e" stroke-width="1"/><text x="305.2" y="246.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">成人型</text><text x="305.2" y="262.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">α₂β₂ HbA</text><line x1="30.0" y1="283.0" x2="362.0" y2="283.0" stroke="#8095a8" stroke-width="1.3" stroke-linecap="round"/><line x1="362.0" y1="283.0" x2="357.6" y2="285.4" stroke="#8095a8" stroke-width="1.3" stroke-linecap="round"/><line x1="362.0" y1="283.0" x2="357.6" y2="280.6" stroke="#8095a8" stroke-width="1.3" stroke-linecap="round"/><rect x="18.0" y="311.0" width="364.0" height="195.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="330.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">假基因</text><rect x="30.0" y="341.0" width="3.0" height="15.0" rx="1.5" fill="#4a5a6b"/><text x="39.0" y="354.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">假基因</text><text x="362.0" y="354.0" text-anchor="end" font-size="12" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">进化化石</text><text x="39.0" y="372.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">序列与功能基因相似但已失活（启动子缺失、</text><text x="39.0" y="388.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">移码、提前终止）</text><rect x="30.0" y="396.0" width="3.0" height="15.0" rx="1.5" fill="#b45309"/><text x="39.0" y="409.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">加工假基因</text><text x="362.0" y="409.0" text-anchor="end" font-size="12" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">例外</text><text x="39.0" y="427.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">由 mRNA 逆转录后整合而来，无内含子，少数仍有</text><text x="39.0" y="443.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">转录活性</text><rect x="30.0" y="451.0" width="3.0" height="15.0" rx="1.5" fill="#c0392b"/><text x="39.0" y="464.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">临床落点</text><text x="362.0" y="464.0" text-anchor="end" font-size="12" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">地中海贫血</text><text x="39.0" y="482.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">某个珠蛋白基因缺陷 → 按受累链分 α 型</text><text x="39.0" y="498.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">与 β 型</text><rect x="18.0" y="518.0" width="364.0" height="70.0" rx="8" fill="#e2f5f2"/><rect x="18.0" y="518.0" width="3.5" height="70.0" rx="1.8" fill="#0f766e"/><text x="32.0" y="538.0" font-size="11.5" font-weight="700" fill="#0f766e" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="555.0" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">家族成员序列相似但功能可分化，不等于功能冗余；假基</text><text x="32.0" y="574.0" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">因通常不表达。</text></svg>