<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 672" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="C 值悖论：基因组总量不决定复杂度"><title>C 值悖论：基因组总量不决定复杂度</title><desc>C 值指一个单倍体基因组的 DNA 总量。人的 C 值约 3×10⁹ bp、蛋白编码基因约 2 万个、编码序列仅占 1.5%，而某些两栖类的基因组比人大得多、基因数却不更多 —— 这就是 C 值悖论：基因组大小与生物复杂度不平行。基因组按重复程度分为单一序列（约 50~60%）、中度重复（约 30%，含 rRNA/tRNA 基因与Alu、LINE）与高度重复序列（约 10%，卫星 DNA、着丝粒、端粒）。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">C 值悖论：基因组总量不决定复杂度</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">人 3×10⁹ bp 只编约 2 万个基因，编码序列仅占 1.5%，其余</text><text x="18.0" y="68.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">多为重复序列</text><rect x="18.0" y="82.0" width="200.2" height="26.0" rx="3" fill="#e2f5f2" stroke="#0f766e" stroke-width="1"/><text x="118.1" y="99.0" text-anchor="middle" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">单一序列 55%</text><rect x="218.2" y="82.0" width="109.2" height="26.0" rx="3" fill="#f2ecfb" stroke="#7b4bb7" stroke-width="1"/><text x="272.8" y="99.0" text-anchor="middle" font-size="12" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">中度重复 30%</text><rect x="327.4" y="82.0" width="54.6" height="26.0" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1"/><text x="18.0" y="126.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">单一序列：蛋白编码基因；中度重复：rRNA/tRNA 基因、Alu 与</text><text x="18.0" y="143.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">LINE；高度重复：卫星 DNA、着丝粒与端粒。</text><rect x="18.0" y="168.0" width="364.0" height="26.0" rx="6" fill="#f8fbfd"/><text x="26.0" y="185.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">序列类型</text><text x="113.4" y="185.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">占比与规模</text><text x="200.7" y="185.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">代表</text><line x1="18.0" y1="220.0" x2="382.0" y2="220.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="212.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">单一序列</text><text x="113.4" y="212.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">约 50~60%</text><text x="200.7" y="212.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">蛋白编码基因与部分非编码序列</text><line x1="18.0" y1="262.0" x2="382.0" y2="262.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="238.0" font-size="12.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">中度重复</text><text x="113.4" y="238.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">约 30%</text><text x="200.7" y="238.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">rRNA/tRNA 基因、Alu（约 300</text><text x="200.7" y="254.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">bp）、LINE</text><line x1="18.0" y1="304.0" x2="382.0" y2="304.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="280.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">高度重复</text><text x="113.4" y="280.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">约 10%</text><text x="200.7" y="280.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">卫星 DNA、着丝粒与端粒的</text><text x="200.7" y="296.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">串联重复</text><rect x="18.0" y="310.0" width="364.0" height="147.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="329.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">人类基因组的三个数字</text><rect x="30.0" y="340.0" width="3.0" height="15.0" rx="1.5" fill="#0f766e"/><text x="39.0" y="353.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">3×10⁹ bp</text><text x="362.0" y="353.0" text-anchor="end" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">总量</text><text x="39.0" y="371.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">单倍体基因组约 30 亿碱基对</text><rect x="30.0" y="379.0" width="3.0" height="15.0" rx="1.5" fill="#0f766e"/><text x="39.0" y="392.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">2 万个</text><text x="362.0" y="392.0" text-anchor="end" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">基因数</text><text x="39.0" y="410.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">蛋白编码基因仅约 2 万个，与线虫相仿</text><rect x="30.0" y="418.0" width="3.0" height="15.0" rx="1.5" fill="#b45309"/><text x="39.0" y="431.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">1.5%</text><text x="362.0" y="431.0" text-anchor="end" font-size="12" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">编码占比</text><text x="39.0" y="449.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">外显子合计只占 1.5%，&gt;95% 为非编码</text><rect x="18.0" y="469.0" width="177.0" height="84.0" rx="9" fill="#e2f5f2" stroke="#0f766e" stroke-width="1.1"/><text x="29.0" y="490.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">人 3.2×10⁹ bp</text><text x="29.0" y="509.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">基因约 2 万个</text><text x="29.0" y="529.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">编码序列仅 1.5%</text><rect x="205.0" y="469.0" width="177.0" height="84.0" rx="9" fill="#fef3c7" stroke="#b45309" stroke-width="1.1"/><text x="216.0" y="490.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">蝾螈 ~4×10¹⁰ bp</text><text x="216.0" y="509.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">基因数并不更多</text><text x="216.0" y="529.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">多出来的几乎都是重复序列</text><rect x="18.0" y="563.0" width="364.0" height="89.0" rx="8" fill="#e2f5f2"/><rect x="18.0" y="563.0" width="3.5" height="89.0" rx="1.8" fill="#0f766e"/><text x="32.0" y="583.0" font-size="11.5" font-weight="700" fill="#0f766e" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="600.0" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">C 值悖论指的是「基因组大小与复杂度不平行」，不是</text><text x="32.0" y="619.0" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">「无关」；决定复杂度的是基因数目与调控网络，重复序</text><text x="32.0" y="638.0" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">列也不是垃圾 DNA。</text></svg>