<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 550" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="四类血浆脂蛋白：谁运什么"><title>四类血浆脂蛋白：谁运什么</title><desc>血浆脂蛋白按密度由低到高为 CM、VLDL、LDL、HDL，颗粒大小相反；CM 运外源甘油三酯，VLDL 运内源甘油三酯，LDL 把胆固醇运向外周（氧化成 ox-LDL 后致粥样硬化），HDL 把胆固醇逆向转运回肝。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">四类血浆脂蛋白：谁运什么</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">密度越高蛋白越多：CM &lt; VLDL &lt; LDL &lt; HDL；LDL 送、HDL 收</text><rect x="18.0" y="65.0" width="36.4" height="26.0" rx="3" fill="#eef2f7" stroke="#4a5a6b" stroke-width="1"/><text x="36.2" y="82.0" text-anchor="middle" font-size="12" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">CM</text><rect x="54.4" y="65.0" width="72.8" height="26.0" rx="3" fill="#fdeceb" stroke="#c0392b" stroke-width="1"/><text x="90.8" y="82.0" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">VLDL</text><rect x="127.2" y="65.0" width="101.9" height="26.0" rx="3" fill="#fdeceb" stroke="#c0392b" stroke-width="1"/><text x="178.2" y="82.0" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">LDL</text><rect x="229.1" y="65.0" width="152.9" height="26.0" rx="3" fill="#e6f6ec" stroke="#2f8f57" stroke-width="1"/><text x="305.6" y="82.0" text-anchor="middle" font-size="12" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">HDL</text><line x1="18.0" y1="105.0" x2="32.0" y2="105.0" stroke="#4a5a6b" stroke-width="2.2" stroke-linecap="round"/><text x="37.0" y="109.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">颗粒由大到小 →</text><line x1="138.8" y1="105.0" x2="152.8" y2="105.0" stroke="#2f8f57" stroke-width="2.2" stroke-linecap="round"/><text x="157.8" y="109.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">密度由低到高 →</text><rect x="18.0" y="123.0" width="364.0" height="26.0" rx="6" fill="#f8fbfd"/><text x="26.0" y="140.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">脂蛋白</text><text x="120.6" y="140.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">主要运输</text><text x="251.7" y="140.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">增减提示</text><line x1="18.0" y1="191.0" x2="382.0" y2="191.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="167.0" font-size="12.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">CM 乳糜微粒</text><text x="120.6" y="167.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">外源（食物）甘</text><text x="120.6" y="183.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">油三酯</text><text x="251.7" y="167.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">餐后高脂血症、胰</text><text x="251.7" y="183.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">腺炎风险</text><line x1="18.0" y1="233.0" x2="382.0" y2="233.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="209.0" font-size="12.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">VLDL</text><text x="120.6" y="209.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">内源（肝合成）</text><text x="120.6" y="225.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">甘油三酯</text><text x="251.7" y="209.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Ⅳ 型高甘油三酯血症</text><line x1="18.0" y1="275.0" x2="382.0" y2="275.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="251.0" font-size="12.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">LDL</text><text x="120.6" y="251.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胆固醇运向外周</text><text x="251.7" y="251.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Ⅱa 型，动脉粥样</text><text x="251.7" y="267.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">硬化（坏）</text><line x1="18.0" y1="301.0" x2="382.0" y2="301.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="293.0" font-size="12.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">HDL</text><text x="120.6" y="293.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胆固醇逆向转运回肝</text><text x="251.7" y="293.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">越高越好（好胆固醇）</text><rect x="18.0" y="307.0" width="364.0" height="141.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="326.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">两个进阶考点</text><rect x="30.0" y="337.0" width="3.0" height="15.0" rx="1.5" fill="#c0392b"/><text x="39.0" y="350.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">致粥样的真正凶手</text><text x="370.0" y="350.0" text-anchor="end" font-size="12" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">ox-LDL</text><text x="39.0" y="368.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">LDL 被氧化修饰成 ox-LDL，被巨噬细胞吞成泡</text><text x="39.0" y="384.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">沫细胞 → 斑块</text><rect x="30.0" y="393.0" width="3.0" height="15.0" rx="1.5" fill="#4a5a6b"/><text x="39.0" y="406.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">HDL 不一定都「好」</text><text x="370.0" y="406.0" text-anchor="end" font-size="12" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">功能异常</text><text x="39.0" y="424.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">慢性炎症时 HDL 可失去保护作用，不能只</text><text x="39.0" y="440.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">看数值</text><rect x="18.0" y="460.0" width="364.0" height="70.0" rx="8" fill="#e2f5f2"/><rect x="18.0" y="460.0" width="3.5" height="70.0" rx="1.8" fill="#0f766e"/><text x="32.0" y="480.0" font-size="11.5" font-weight="700" fill="#0f766e" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="497.0" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">CM 运外源、VLDL 运内源、LDL 送胆固醇、HDL 收胆固</text><text x="32.0" y="516.0" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">醇；动脉粥样硬化的关键是 ox-LDL 而非天然 LDL。</text></svg>