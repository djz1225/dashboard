<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 632" width="100%" style="max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px" role="img"><text x="165.0" y="22.6" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">小肠吸收：部位与方式</text><text x="165.0" y="43.0" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">小肠是主场所，因为面积大、酶多、停留久</text><rect x="15.0" y="60.0" width="300.0" height="42.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="27.0" y="80.0" text-anchor="start" font-size="14" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">铁</text><text x="27.0" y="97.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">十二指肠、空肠上段（主动转运）</text><rect x="15.0" y="108.0" width="300.0" height="42.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="27.0" y="128.0" text-anchor="start" font-size="14" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">钙</text><text x="27.0" y="145.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">十二指肠（受维生素 D 促进）</text><rect x="15.0" y="156.0" width="300.0" height="42.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="27.0" y="176.0" text-anchor="start" font-size="14" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">糖与蛋白</text><text x="27.0" y="193.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">全小肠，经载体继发性主动转运</text><rect x="15.0" y="204.0" width="300.0" height="42.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="27.0" y="224.0" text-anchor="start" font-size="14" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">脂肪</text><text x="27.0" y="241.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">需胆盐乳化（十二指肠、空肠）</text><rect x="15.0" y="252.0" width="300.0" height="42.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="27.0" y="272.0" text-anchor="start" font-size="14" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">维生素 B₁₂</text><text x="27.0" y="289.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">回肠末端（需内因子）</text><rect x="15.0" y="300.0" width="300.0" height="42.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="27.0" y="320.0" text-anchor="start" font-size="14" font-weight="700" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">胆盐</text><text x="27.0" y="337.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">回肠末端（肠肝循环，95% 被重吸收）</text><rect x="15.0" y="352.0" width="300.0" height="134.0" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="25.0" y="371.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">为什么小肠是主场所</text><text x="25.0" y="389.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 面积巨大：环状皱襞 + 绒毛 + 微绒毛 → </text><text x="25.0" y="405.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">约 200 m²</text><text x="25.0" y="421.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 酶丰富：刷状缘有双糖酶、肽酶</text><text x="25.0" y="437.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 停留时间长：有利于充分吸收</text><text x="25.0" y="453.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 绒毛内有中央乳糜管（吸收脂肪）与毛细血</text><text x="25.0" y="469.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">管（吸收水溶性物质）</text><rect x="15.0" y="494.0" width="300.0" height="76.0" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/><text x="25.0" y="510.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">回肠末端是「关键 1 米」：B₁₂ 与胆盐都在</text><text x="25.0" y="526.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">这里吸收，切除后后果严重</text><text x="25.0" y="542.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">脂肪吸收走淋巴（乳糜管）→ 淋巴管阻塞时可</text><text x="25.0" y="558.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">致脂肪泻</text><rect x="11.0" y="573.0" width="308.0" height="51.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="165.0" y="588.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">回肠末端管 B₁₂ 与胆盐；脂肪走淋巴，</text><text x="165.0" y="603.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">水溶性物质走门静脉</text></svg>