<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 628" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="吸收部位与机制"><title>吸收部位与机制</title><desc>小肠因面积巨大（约 200 m²）、刷状缘酶丰富、停留时间长而成为主要吸收部位；铁钙在十二指肠、B₁₂ 与胆盐在回肠末端，脂肪经乳糜管入淋巴。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">吸收：小肠是主场所，回肠末端是关键一米</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">面积大、酶多、停留久 —— 三个理由</text><rect x="18.0" y="65.0" width="364.0" height="190.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="83.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">为什么是小肠</text><rect x="30.0" y="93.0" width="3.0" height="15.0" rx="1.5" fill="#2f8f57"/><text x="39.0" y="106.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">面积巨大</text><text x="347.0" y="106.0" text-anchor="end" font-size="12" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">约 200 m²</text><text x="39.0" y="124.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">环状皱襞＋绒毛＋微绒毛，放大 600 倍</text><rect x="30.0" y="134.0" width="3.0" height="15.0" rx="1.5" fill="#1f6fb2"/><text x="39.0" y="147.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">酶丰富</text><text x="347.0" y="147.0" text-anchor="end" font-size="12" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">刷状缘</text><text x="39.0" y="165.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">双糖酶、肽酶在此完成最后水解</text><rect x="30.0" y="175.0" width="3.0" height="15.0" rx="1.5" fill="#7b4bb7"/><text x="39.0" y="188.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">停留时间长</text><text x="347.0" y="188.0" text-anchor="end" font-size="12" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">3~8 h</text><text x="39.0" y="206.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">有充足时间完成吸收</text><rect x="30.0" y="216.0" width="3.0" height="15.0" rx="1.5" fill="#b45309"/><text x="39.0" y="229.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">绒毛内两条管道</text><text x="347.0" y="229.0" text-anchor="end" font-size="12" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">分工</text><text x="39.0" y="247.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">中央乳糜管吸脂肪，毛细血管吸水溶性物质</text><rect x="18.0" y="267.0" width="364.0" height="24.0" rx="6" fill="#e2f5f2"/><text x="25.0" y="283.0" font-size="11" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">物质</text><text x="123.3" y="283.0" font-size="11" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">吸收部位</text><text x="217.9" y="283.0" font-size="11" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">机制与要点</text><line x1="18.0" y1="333.0" x2="382.0" y2="333.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="25.0" y="309.0" font-size="12.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">铁</text><text x="123.3" y="309.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">十二指肠、空</text><text x="123.3" y="325.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肠上段</text><text x="217.9" y="309.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">主动转运；维生素 C 促吸收，</text><text x="217.9" y="325.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">植酸抑制</text><line x1="18.0" y1="375.0" x2="382.0" y2="375.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="25.0" y="351.0" font-size="12.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">钙</text><text x="123.3" y="351.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">十二指肠</text><text x="217.9" y="351.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">受维生素 D 促进，活性形式</text><text x="217.9" y="367.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">为钙三醇</text><line x1="18.0" y1="417.0" x2="382.0" y2="417.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="25.0" y="393.0" font-size="12.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">糖与氨基酸</text><text x="123.3" y="393.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">全小肠</text><text x="217.9" y="393.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">经载体继发性主动转运（与 </text><text x="217.9" y="409.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Na⁺ 偶联）</text><line x1="18.0" y1="459.0" x2="382.0" y2="459.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="25.0" y="435.0" font-size="12.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">脂肪</text><text x="123.3" y="435.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">十二指肠、空</text><text x="123.3" y="451.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肠</text><text x="217.9" y="435.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">需胆盐乳化，形成乳糜微粒入</text><text x="217.9" y="451.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">淋巴</text><line x1="18.0" y1="485.0" x2="382.0" y2="485.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="25.0" y="477.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">维生素B₁₂</text><text x="123.3" y="477.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">回肠末端</text><text x="217.9" y="477.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">必须与内因子结合才能吸收</text><line x1="18.0" y1="511.0" x2="382.0" y2="511.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="25.0" y="503.0" font-size="12.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胆盐</text><text x="123.3" y="503.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">回肠末端</text><text x="217.9" y="503.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肠肝循环，约 95% 被重吸收</text><rect x="18.0" y="519.0" width="364.0" height="89.0" rx="8" fill="#eef2f7"/><rect x="18.0" y="519.0" width="3.5" height="89.0" rx="1.8" fill="#4a5a6b"/><text x="32.0" y="539.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="556.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">回肠末端是「关键一米」：B₁₂ 与胆盐都在此吸收，</text><text x="32.0" y="575.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">切除后致巨幼贫与脂肪泻；脂肪走淋巴，水溶性物质走门</text><text x="32.0" y="594.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">静脉。</text></svg>