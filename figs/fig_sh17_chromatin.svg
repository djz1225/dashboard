<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 689" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="染色质层面的三个旋钮"><title>染色质层面的三个旋钮</title><desc>染色质层面有三类「旋钮」：DNA 甲基化（CpG 岛的 C 变成 5-甲基胞嘧啶）抑制表达 —— 甲基化 CpG 结合蛋白招募去乙酰化酶使染色质紧缩；组蛋白乙酰化促进表达 —— 中和赖氨酸正电荷，与 DNA 的结合减弱而疏松；组蛋白甲基化双向 —— H3K4me3 激活、H3K27me3 抑制；染色质重塑双向 —— SWI/SNF 复合体耗 ATP 移动核小体。DNA 甲基化可由维持性甲基转移酶 DNMT1 在分裂时复制到子链，组蛋白修饰也可部分继承，故不改序列也能遗传，是同一基因组产生 200 多种稳定细胞类型的基础。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">染色质层面的三个旋钮</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">DNA 甲基化关、组蛋白乙酰化开、重塑改位置；都不改序列</text><text x="18.0" y="68.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">却能遗传</text><rect x="18.0" y="82.0" width="364.0" height="96.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="101.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">底物：核小体</text><circle cx="98.0" cy="144.0" r="15" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1.2"/><text x="98.0" y="148.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">组蛋白</text><polyline points="118.5,152.1 117.5,154.1 116.5,156.0 115.2,157.8 113.7,159.4 112.1,160.9 110.4,162.2 108.5,163.3 106.5,164.3 104.5,165.0 102.3,165.6 100.2,165.9 98.0,166.0 95.8,165.9 93.7,165.6 91.5,165.0 89.5,164.3 87.5,163.3 85.6,162.2 83.9,160.9 82.3,159.4 80.8,157.8 79.5,156.0 78.5,154.1 77.5,152.1" fill="none" stroke="#1f6fb2" stroke-width="2.4" stroke-linejoin="round"/><polyline points="77.5,135.9 78.5,133.9 79.5,132.0 80.8,130.2 82.3,128.6 83.9,127.1 85.6,125.8 87.5,124.7 89.5,123.7 91.5,123.0 93.7,122.4 95.8,122.1 98.0,122.0 100.2,122.1 102.3,122.4 104.5,123.0 106.5,123.7 108.5,124.7 110.4,125.8 112.1,127.1 113.7,128.6 115.2,130.2 116.5,132.0 117.5,133.9 118.5,135.9" fill="none" stroke="#1f6fb2" stroke-width="2.4" stroke-linejoin="round"/><text x="124.0" y="184.0" font-size="11.5" font-weight="400" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">DNA 缠 1.75 圈 / 147 bp</text><text x="186.4" y="130.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">核小体 = 146~147 bp DNA</text><text x="186.4" y="146.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">+ H2A·H2B·H3·H4 各 2 个</text><text x="186.4" y="162.0" font-size="11.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">（组蛋白八聚体）</text><rect x="18.0" y="190.0" width="364.0" height="26.0" rx="6" fill="#f8fbfd"/><text x="26.0" y="207.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">修饰</text><text x="135.2" y="207.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">对表达</text><text x="200.7" y="207.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">机制</text><line x1="18.0" y1="258.0" x2="382.0" y2="258.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="234.0" font-size="12.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">DNA 甲基化（</text><text x="26.0" y="250.0" font-size="12.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">CpG）</text><text x="135.2" y="234.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">抑制</text><text x="200.7" y="234.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">甲基化 CpG 结合蛋白招募去乙</text><text x="200.7" y="250.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">酰化酶，染色质紧缩</text><line x1="18.0" y1="300.0" x2="382.0" y2="300.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="276.0" font-size="12.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">组蛋白乙酰化</text><text x="135.2" y="276.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">促进</text><text x="200.7" y="276.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">中和赖氨酸正电荷，与 DNA 排</text><text x="200.7" y="292.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">斥减弱 → 染色质疏松</text><line x1="18.0" y1="326.0" x2="382.0" y2="326.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="318.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">组蛋白甲基化</text><text x="135.2" y="318.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">双向</text><text x="200.7" y="318.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">H3K4me3 激活；H3K27me3 抑制</text><line x1="18.0" y1="368.0" x2="382.0" y2="368.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="344.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">染色质重塑</text><text x="135.2" y="344.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">双向</text><text x="200.7" y="344.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">SWI/SNF 复合体耗 ATP 移动核</text><text x="200.7" y="360.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">小体，改变可及性</text><rect x="18.0" y="373.0" width="364.0" height="195.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="392.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">不改序列怎么遗传</text><rect x="30.0" y="403.0" width="3.0" height="15.0" rx="1.5" fill="#0f766e"/><text x="39.0" y="416.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">DNMT1</text><text x="362.0" y="416.0" text-anchor="end" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">维持性</text><text x="39.0" y="434.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">细胞分裂时把母链的甲基化「复印」到子链 C</text><text x="39.0" y="450.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">pG上</text><rect x="30.0" y="458.0" width="3.0" height="15.0" rx="1.5" fill="#0f766e"/><text x="39.0" y="471.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">组蛋白修饰</text><text x="362.0" y="471.0" text-anchor="end" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">部分继承</text><text x="39.0" y="489.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">修饰酶被招募到已修饰的核小体上，形成</text><text x="39.0" y="505.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">正反馈</text><rect x="30.0" y="513.0" width="3.0" height="15.0" rx="1.5" fill="#2f8f57"/><text x="39.0" y="526.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">结果</text><text x="362.0" y="526.0" text-anchor="end" font-size="12" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">200 多种细胞</text><text x="39.0" y="544.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">同一基因组产生并稳定维持多种细胞类型</text><text x="39.0" y="560.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">—— 表观记忆</text><rect x="18.0" y="580.0" width="364.0" height="89.0" rx="8" fill="#fef3c7"/><rect x="18.0" y="580.0" width="3.5" height="89.0" rx="1.8" fill="#b45309"/><text x="32.0" y="600.0" font-size="11.5" font-weight="700" fill="#b45309" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">易错</text><text x="32.0" y="617.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">甲基化主要发生在 CpG 岛的 C 上（5-甲基胞嘧啶）；</text><text x="32.0" y="636.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肿瘤中抑癌基因启动子超甲基化即被沉默，属表观改变而</text><text x="32.0" y="655.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">非突变。</text></svg>