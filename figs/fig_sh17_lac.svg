<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 678" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="乳糖操纵子：双重逻辑"><title>乳糖操纵子：双重逻辑</title><desc>乳糖操纵子受双重调控：阻遏蛋白（LacI）结合操纵基因 O 是负调控，乳糖的异构体异乳糖使其脱落而解阻遏；CAP-cAMP 结合 CAP 位点是正调控，使转录效率提高约 50 倍。葡萄糖与 cAMP 浓度反相关 —— 葡萄糖低时 cAMP 升高、CAP 结合，故葡萄糖高、乳糖有时只有低水平转录，葡萄糖低、乳糖有时才高水平表达，这就是分解物阻遏：细胞总优先利用最省能的碳源。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">乳糖操纵子：双重逻辑</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">阻遏蛋白管「能不能」，CAP-cAMP 管「多不多」；葡萄糖优</text><text x="18.0" y="68.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">先是核心</text><rect x="18.0" y="82.0" width="364.0" height="104.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="101.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">操纵子的元件顺序</text><rect x="30.0" y="114.0" width="44.6" height="20.0" rx="3" fill="#e2f5f2" stroke="#0f766e" stroke-width="1"/><text x="53.1" y="127.4" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">CAP 位</text><rect x="76.2" y="114.0" width="38.0" height="20.0" rx="3" fill="#e2f5f2" stroke="#0f766e" stroke-width="1"/><text x="96.0" y="127.4" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">P</text><rect x="115.8" y="114.0" width="38.0" height="20.0" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1"/><text x="135.6" y="127.4" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">O</text><rect x="155.4" y="114.0" width="71.0" height="20.0" rx="3" fill="#eef2f7" stroke="#4a5a6b" stroke-width="1"/><text x="191.7" y="127.4" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">lacZ</text><rect x="228.0" y="114.0" width="64.4" height="20.0" rx="3" fill="#eef2f7" stroke="#4a5a6b" stroke-width="1"/><text x="261.0" y="127.4" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">lacY</text><rect x="294.0" y="114.0" width="64.4" height="20.0" rx="3" fill="#eef2f7" stroke="#4a5a6b" stroke-width="1"/><text x="327.0" y="127.4" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">lacA</text><text x="30.0" y="144.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">O（操纵基因）紧接启动子 P：阻遏蛋白结合 O 即挡住 RNA</text><text x="30.0" y="161.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">聚合酶；CAP 位在更上游，结合后促进聚合酶招募。</text><rect x="18.0" y="198.0" width="364.0" height="26.0" rx="6" fill="#f8fbfd"/><text x="26.0" y="215.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">乳糖 / 葡萄糖</text><text x="157.0" y="215.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">阻遏蛋白 / CAP-cAMP</text><text x="317.2" y="215.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">转录</text><line x1="18.0" y1="266.0" x2="382.0" y2="266.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="242.0" font-size="12.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">葡萄糖高、乳糖无</text><text x="157.0" y="242.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">阻遏蛋白结合 O；CAP</text><text x="157.0" y="258.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"> 不结合</text><text x="317.2" y="242.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">关闭</text><line x1="18.0" y1="308.0" x2="382.0" y2="308.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="284.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">葡萄糖高、乳糖有</text><text x="157.0" y="284.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">阻遏蛋白不结合；CAP</text><text x="157.0" y="300.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"> 不结合</text><text x="317.2" y="284.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">低水平</text><line x1="18.0" y1="350.0" x2="382.0" y2="350.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="326.0" font-size="12.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">葡萄糖低、乳糖有</text><text x="157.0" y="326.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">阻遏蛋白不结合；</text><text x="157.0" y="342.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">CAP-cAMP 结合</text><text x="317.2" y="326.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">高水平</text><line x1="18.0" y1="392.0" x2="382.0" y2="392.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="368.0" font-size="12.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">葡萄糖低、乳糖无</text><text x="157.0" y="368.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">阻遏蛋白结合；CAP-cA</text><text x="157.0" y="384.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">MP结合</text><text x="317.2" y="368.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">关闭</text><rect x="18.0" y="397.0" width="364.0" height="179.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="416.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">为什么葡萄糖优先</text><rect x="30.0" y="427.0" width="3.0" height="15.0" rx="1.5" fill="#b45309"/><text x="39.0" y="440.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">葡萄糖 ↓ → cAMP ↑</text><text x="362.0" y="440.0" text-anchor="end" font-size="12" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">反相关</text><text x="39.0" y="458.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">腺苷酸环化酶被激活，cAMP 升高并结合 CAP</text><rect x="30.0" y="466.0" width="3.0" height="15.0" rx="1.5" fill="#0f766e"/><text x="39.0" y="479.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">CAP-cAMP 结合</text><text x="362.0" y="479.0" text-anchor="end" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">正调控</text><text x="39.0" y="497.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">促进 RNA 聚合酶结合启动子，转录效率提高约</text><text x="39.0" y="513.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">50 倍</text><rect x="30.0" y="521.0" width="3.0" height="15.0" rx="1.5" fill="#0f766e"/><text x="39.0" y="534.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">分解物阻遏</text><text x="362.0" y="534.0" text-anchor="end" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">优先用最省的</text><text x="39.0" y="552.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">葡萄糖充足时即使有乳糖也不大量表达</text><text x="39.0" y="568.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">lac 基因</text><rect x="18.0" y="588.0" width="364.0" height="70.0" rx="8" fill="#eef2f7"/><rect x="18.0" y="588.0" width="3.5" height="70.0" rx="1.8" fill="#4a5a6b"/><text x="32.0" y="608.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="625.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">lac 操纵子是「负调控为主 + 正调控辅助」：乳糖（异</text><text x="32.0" y="644.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">乳糖）解除阻遏是开关，cAMP-CAP 决定开多大。</text></svg>