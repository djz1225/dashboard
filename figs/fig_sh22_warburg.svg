<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 680" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="Warburg 效应：有氧也糖酵解"><title>Warburg 效应：有氧也糖酵解</title><desc>Warburg 效应指肿瘤细胞在有氧条件下仍以糖酵解为主要供能方式，1 分子葡萄糖只产约 2 ATP（正常有氧氧化 30~32 ATP），并生成大量乳酸酸化微环境。其优势不在效率而在：单位时间通量大、糖酵解中间产物可转成核糖/氨基酸/脂肪酸供增殖、PPP 支路提供 NADPH 供合成与抗氧化。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Warburg 效应：有氧也糖酵解</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肿瘤宁可「低效高通量」：要速度、要合成前体、要 NADPH，而</text><text x="18.0" y="68.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">不是 ATP 效率</text><rect x="18.0" y="82.0" width="177.0" height="120.0" rx="9" fill="#e6f6ec" stroke="#2f8f57" stroke-width="1.1"/><text x="29.0" y="103.0" font-size="12.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">正常细胞｜有氧氧化</text><text x="29.0" y="122.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">葡萄糖 → 丙酮酸 → 线粒</text><text x="29.0" y="138.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">体 TCA</text><text x="29.0" y="158.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">1 葡萄糖 ≈ 30~32 ATP</text><text x="29.0" y="178.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">只在缺氧时才大量糖酵解</text><rect x="205.0" y="82.0" width="177.0" height="120.0" rx="9" fill="#fdeceb" stroke="#c0392b" stroke-width="1.1"/><text x="216.0" y="103.0" font-size="12.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肿瘤细胞｜有氧糖酵解</text><text x="216.0" y="122.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">有氧仍走糖酵解 → 乳酸</text><text x="216.0" y="142.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">1 葡萄糖仅 ≈ 2 ATP</text><text x="216.0" y="162.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">乳酸酸化微环境、促侵袭</text><rect x="18.0" y="212.0" width="364.0" height="157.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="231.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">差 15 倍，为什么还选它</text><text x="30.0" y="252.0" font-size="11.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">每分子葡萄糖的 ATP 产量（示意）</text><text x="30.0" y="281.0" font-size="12" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">有氧氧化</text><rect x="122.0" y="269.0" width="170.0" height="16.0" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1"/><text x="298.0" y="281.0" font-size="12" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">30~32 ATP</text><text x="30.0" y="307.0" font-size="12" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">有氧糖酵解</text><rect x="122.0" y="295.0" width="10.6" height="16.0" rx="3" fill="#fdeceb" stroke="#c0392b" stroke-width="1"/><text x="138.6" y="307.0" font-size="12" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">2 ATP</text><text x="30.0" y="327.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">效率低但通量大：单位时间 ATP 反而更多，且中间产物被拿</text><text x="30.0" y="344.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">去造大分子。</text><rect x="18.0" y="381.0" width="364.0" height="197.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="400.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">三个「为什么有利」</text><rect x="30.0" y="411.0" width="3.0" height="15.0" rx="1.5" fill="#c0392b"/><text x="39.0" y="424.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">① 速度</text><text x="362.0" y="424.0" text-anchor="end" font-size="12" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">通量大</text><text x="39.0" y="442.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">单位时间 ATP 产量更高——每分子效率低，但</text><text x="39.0" y="458.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">每秒烧的葡萄糖多</text><rect x="30.0" y="467.0" width="3.0" height="15.0" rx="1.5" fill="#c0392b"/><text x="39.0" y="480.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">② 前体</text><text x="362.0" y="480.0" text-anchor="end" font-size="12" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">供合成</text><text x="39.0" y="498.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">糖酵解中间物转成核糖、氨基酸、脂肪酸，增殖</text><text x="39.0" y="514.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">全靠这些原料</text><rect x="30.0" y="523.0" width="3.0" height="15.0" rx="1.5" fill="#0f766e"/><text x="39.0" y="536.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">③ 还原力</text><text x="362.0" y="536.0" text-anchor="end" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">产 NADPH</text><text x="39.0" y="554.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">PPP 支路产 NADPH，供脂合成与抗氧化（对</text><text x="39.0" y="570.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">抗化疗 ROS）</text><rect x="18.0" y="590.0" width="364.0" height="70.0" rx="8" fill="#fef3c7"/><rect x="18.0" y="590.0" width="3.5" height="70.0" rx="1.8" fill="#b45309"/><text x="32.0" y="610.0" font-size="11.5" font-weight="700" fill="#b45309" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">易错</text><text x="32.0" y="627.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Warburg 是「有氧条件下仍糖酵解」，不是「无氧才糖</text><text x="32.0" y="646.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">酵解」；糖酵解增强 ≠ ATP 更多。</text></svg>