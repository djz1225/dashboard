<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 615" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="血浆蛋白与血浆渗透压"><title>血浆蛋白与血浆渗透压</title><desc>血浆渗透压分晶体（99.5%，Na⁺/Cl⁻ 产生，管细胞内外水分布）与胶体（0.5%，白蛋白产生，管血管内外水分布）两部分；白蛋白减少导致组织水肿。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">血浆蛋白与血浆渗透压</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">晶体管细胞内外，胶体管血管内外</text><rect x="18.0" y="65.0" width="177.0" height="140.0" rx="9" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1.1"/><text x="29.0" y="86.0" font-size="12.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">晶体渗透压（99.5%）</text><text x="29.0" y="105.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">约 770 kPa（≈300 mOsm/L）</text><text x="29.0" y="125.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">由 Na⁺、Cl⁻ 等小分</text><text x="29.0" y="141.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">子产生</text><text x="29.0" y="161.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">作用对象：细胞膜内外</text><text x="29.0" y="181.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">决定细胞内外水分布</text><rect x="205.0" y="65.0" width="177.0" height="140.0" rx="9" fill="#f2ecfb" stroke="#7b4bb7" stroke-width="1.1"/><text x="216.0" y="86.0" font-size="12.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胶体渗透压（0.5%）</text><text x="216.0" y="105.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">约 3.3 kPa（25 mmHg）</text><text x="216.0" y="125.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">由白蛋白产生（占 75%~80%）</text><text x="216.0" y="145.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">作用对象：毛细血管壁内外</text><text x="216.0" y="165.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">是唯一把水留在血管内的力</text><rect x="18.0" y="209.0" width="3.0" height="14.0" rx="1.5" fill="#0f766e"/><text x="28.0" y="219.0" font-size="13.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">为什么必须分两套</text><rect x="18.0" y="231.0" width="364.0" height="140.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="249.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">因屏障孔大小不同</text><rect x="30.0" y="259.0" width="3.0" height="15.0" rx="1.5" fill="#1f6fb2"/><text x="39.0" y="272.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">毛细血管壁</text><text x="347.0" y="272.0" text-anchor="end" font-size="12" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">有孔</text><text x="39.0" y="290.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">水和晶体自由通过 → 晶体渗透压两侧相等，</text><text x="39.0" y="306.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">对血管内外水分布无用</text><rect x="30.0" y="316.0" width="3.0" height="15.0" rx="1.5" fill="#7b4bb7"/><text x="39.0" y="329.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">细胞膜</text><text x="347.0" y="329.0" text-anchor="end" font-size="12" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">蛋白不通</text><text x="39.0" y="347.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">只有晶体渗透压差能驱动水移动 → 决定细胞</text><text x="39.0" y="363.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">内外水分布</text><rect x="18.0" y="377.0" width="3.0" height="14.0" rx="1.5" fill="#0f766e"/><text x="28.0" y="387.0" font-size="13.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">血浆蛋白三类（总蛋白 60~80 g/L）</text><rect x="18.0" y="399.0" width="364.0" height="114.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="417.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">组成</text><rect x="30.0" y="427.0" width="189.6" height="28.0" rx="5" fill="#f2ecfb" stroke="#7b4bb7" stroke-width="1.1"/><text x="124.8" y="446.0" text-anchor="middle" font-size="11" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">白蛋白 约 60%</text><rect x="219.6" y="427.0" width="110.6" height="28.0" rx="5" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1.1"/><text x="274.9" y="446.0" text-anchor="middle" font-size="11" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">球蛋白 约 35%</text><rect x="330.2" y="427.0" width="15.8" height="28.0" rx="4" fill="#eef2f7" stroke="#4a5a6b" stroke-width="1"/><text x="30.0" y="473.0" font-size="11" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">白蛋白最多 → 主要维持胶体渗透压</text><text x="30.0" y="491.0" font-size="11" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">纤维蛋白原约 5%，参与凝血</text><rect x="18.0" y="525.0" width="364.0" height="70.0" rx="8" fill="#eef2f7"/><rect x="18.0" y="525.0" width="3.5" height="70.0" rx="1.8" fill="#4a5a6b"/><text x="32.0" y="545.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="562.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">白蛋白↓（肝病/肾病）→ 胶体渗透压↓ → 组织液增</text><text x="32.0" y="581.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">多 → 水肿；注意是组织水肿，不是细胞水肿。</text></svg>