<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 677" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="血浆蛋白与 A/G 比值"><title>血浆蛋白与 A/G 比值</title><desc>血浆蛋白主要为白蛋白与球蛋白：白蛋白 35~55 g/L、约占总蛋白 60%，维持75~80% 的胶体渗透压并承担运输与缓冲，半衰期约 20 天；球蛋白分 α₁、α₂、β、γ 四段，负责运输、免疫（γ 球蛋白即抗体）与凝血。A/G 正常 1.5~2.5，肝硬化与肾病综合征时下降甚至倒置。白蛋白降低需分三路考虑：合成减少、丢失过多、分布异常。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">血浆蛋白与 A/G 比值</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">白蛋白占约 60%、管 75~80% 胶体渗透压；A/G 倒置是肝硬化与</text><text x="18.0" y="68.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肾病综合征的线索</text><rect x="18.0" y="82.0" width="364.0" height="108.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="101.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">电泳五区</text><rect x="30.0" y="114.0" width="171.0" height="22.0" rx="3" fill="#fdeceb" stroke="#c0392b" stroke-width="1"/><text x="116.3" y="128.4" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">ALB</text><rect x="202.6" y="114.0" width="25.0" height="22.0" rx="3" fill="#e6f6ec" stroke="#2f8f57" stroke-width="1"/><text x="215.9" y="128.4" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">α₁</text><rect x="229.2" y="114.0" width="38.2" height="22.0" rx="3" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1"/><text x="249.1" y="128.4" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">α₂</text><rect x="269.0" y="114.0" width="41.6" height="22.0" rx="3" fill="#f2ecfb" stroke="#7b4bb7" stroke-width="1"/><text x="290.6" y="128.4" text-anchor="middle" font-size="11.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">β</text><rect x="312.2" y="114.0" width="48.2" height="22.0" rx="3" fill="#e2f5f2" stroke="#0f766e" stroke-width="1"/><text x="337.1" y="128.4" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">γ</text><text x="30.0" y="148.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">血清蛋白电泳示意：白蛋白区最宽，γ 区主要为 IgG。A/G 即</text><text x="30.0" y="165.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">白蛋白与球蛋白之比。</text><rect x="18.0" y="202.0" width="364.0" height="26.0" rx="6" fill="#f8fbfd"/><text x="26.0" y="219.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">成分</text><text x="106.1" y="219.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">含量 / 构成</text><text x="244.4" y="219.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">主要功能</text><line x1="18.0" y1="270.0" x2="382.0" y2="270.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="246.0" font-size="12.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">白蛋白</text><text x="106.1" y="246.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">35~55 g/L，占总蛋白</text><text x="106.1" y="262.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">约 60%</text><text x="244.4" y="246.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">维持 75~80% 胶体渗透</text><text x="244.4" y="262.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">压、运输、缓冲</text><line x1="18.0" y1="328.0" x2="382.0" y2="328.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="288.0" font-size="12.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">球蛋白</text><text x="106.1" y="288.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">α₁·α₂·β</text><text x="106.1" y="304.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">·γ四段</text><text x="244.4" y="288.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">运输（如铜蓝蛋白）、</text><text x="244.4" y="304.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">免疫（γ 即抗体）、</text><text x="244.4" y="320.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">凝血因子</text><line x1="18.0" y1="370.0" x2="382.0" y2="370.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="346.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">A/G 比值</text><text x="106.1" y="346.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">正常 1.5~2.5</text><text x="244.4" y="346.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肝硬化、肾病综合征时</text><text x="244.4" y="362.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">下降甚至倒置</text><rect x="18.0" y="378.0" width="364.0" height="197.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="397.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">白蛋白低，三条路都要想到</text><rect x="30.0" y="408.0" width="3.0" height="15.0" rx="1.5" fill="#b45309"/><text x="39.0" y="421.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">合成减少</text><text x="362.0" y="421.0" text-anchor="end" font-size="12" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肝硬化 / 营养不良</text><text x="39.0" y="439.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肝是唯一合成部位；合成能力下降</text><text x="39.0" y="455.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">或原料不足</text><rect x="30.0" y="464.0" width="3.0" height="15.0" rx="1.5" fill="#c0392b"/><text x="39.0" y="477.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">丢失过多</text><text x="362.0" y="477.0" text-anchor="end" font-size="12" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肾病综合征 / 蛋白丢失性肠病</text><text x="39.0" y="495.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">从尿或肠道漏出，超过</text><text x="39.0" y="511.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肝的代偿合成能力</text><rect x="30.0" y="520.0" width="3.0" height="15.0" rx="1.5" fill="#4a5a6b"/><text x="39.0" y="533.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">分布异常</text><text x="362.0" y="533.0" text-anchor="end" font-size="12" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">腹水 / 严重感染</text><text x="39.0" y="551.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">漏入第三间隙或毛细血管渗漏 → 血</text><text x="39.0" y="567.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">中浓度下降</text><rect x="18.0" y="587.0" width="364.0" height="70.0" rx="8" fill="#e2f5f2"/><rect x="18.0" y="587.0" width="3.5" height="70.0" rx="1.8" fill="#0f766e"/><text x="32.0" y="607.0" font-size="11.5" font-weight="700" fill="#0f766e" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="624.0" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">γ 球蛋白升高（而非白蛋白下降）是多发性骨髓瘤的重</text><text x="32.0" y="643.0" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">要线索；白蛋白低不能只想到「营养差」。</text></svg>