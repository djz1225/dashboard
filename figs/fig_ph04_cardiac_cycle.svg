<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 621" width="100%" style="max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px" role="img"><text x="165.0" y="22.6" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">心动周期：压力决定瓣膜开关</text><text x="165.0" y="43.0" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">瓣膜只听压力差的话——这是理解全章的总钥匙</text><rect x="15.0" y="60.0" width="300.0" height="38.0" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/><text x="27.0" y="80.0" text-anchor="start" font-size="14" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">① 等容收缩期</text><text x="27.0" y="98.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">房室瓣、半月瓣均关；室内压急升，容积不变</text><line x1="165.0" y1="99.0" x2="165.0" y2="99.5" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/><polygon points="165.0,104.0 163.0,99.4 167.0,99.4" fill="#64748b"/><rect x="15.0" y="105.0" width="300.0" height="38.0" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.4"/><text x="27.0" y="125.0" text-anchor="start" font-size="14" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">② 快速射血期</text><text x="27.0" y="143.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">室内压 &gt; 主动脉压 → 半月瓣开，血射出</text><line x1="165.0" y1="144.0" x2="165.0" y2="144.5" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/><polygon points="165.0,149.0 163.0,144.4 167.0,144.4" fill="#64748b"/><rect x="15.0" y="150.0" width="300.0" height="38.0" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.4"/><text x="27.0" y="170.0" text-anchor="start" font-size="14" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">③ 减慢射血期</text><text x="27.0" y="188.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">室内压略降，靠惯性继续射血</text><line x1="165.0" y1="189.0" x2="165.0" y2="189.5" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/><polygon points="165.0,194.0 163.0,189.4 167.0,189.4" fill="#64748b"/><rect x="15.0" y="195.0" width="300.0" height="54.0" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/><text x="27.0" y="215.0" text-anchor="start" font-size="14" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">④ 等容舒张期</text><text x="27.0" y="233.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">半月瓣关闭、房室瓣未开；室内压急降，</text><text x="27.0" y="249.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">容积不变</text><line x1="165.0" y1="250.0" x2="165.0" y2="250.5" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/><polygon points="165.0,255.0 163.0,250.4 167.0,250.4" fill="#64748b"/><rect x="15.0" y="256.0" width="300.0" height="38.0" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/><text x="27.0" y="276.0" text-anchor="start" font-size="14" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">⑤ 快速充盈期</text><text x="27.0" y="294.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">室内压 &lt; 房内压 → 房室瓣开，血快速流入</text><line x1="165.0" y1="295.0" x2="165.0" y2="295.5" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/><polygon points="165.0,300.0 163.0,295.4 167.0,295.4" fill="#64748b"/><rect x="15.0" y="301.0" width="300.0" height="38.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/><text x="27.0" y="321.0" text-anchor="start" font-size="14" font-weight="700" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">⑥ 减慢充盈 + 心房收缩</text><text x="27.0" y="339.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">最后 25% 由心房收缩挤入</text><rect x="15.0" y="341.0" width="300.0" height="134.0" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="25.0" y="360.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">必记的三个「不变」与两个「最高」</text><text x="25.0" y="378.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 等容收缩期：容积不变、瓣膜全关、</text><text x="25.0" y="394.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">室内压上升最快</text><text x="25.0" y="410.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 等容舒张期：容积不变、瓣膜全关、</text><text x="25.0" y="426.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">室内压下降最快</text><text x="25.0" y="442.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 室内压最高：快速射血期末；室内压最低：</text><text x="25.0" y="458.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">快速充盈期末</text><rect x="15.0" y="483.0" width="300.0" height="76.0" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/><text x="25.0" y="499.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">第一心音＝房室瓣关闭（心室收缩开始）；</text><text x="25.0" y="515.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">第二心音＝半月瓣关闭（舒张开始）</text><text x="25.0" y="531.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">心率过快时舒张期缩短更明显 → 充盈不足 → </text><text x="25.0" y="547.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">每搏输出量下降</text><rect x="11.0" y="562.0" width="308.0" height="51.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="165.0" y="577.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">瓣膜开关只看压力差；等容期双瓣全关、</text><text x="165.0" y="592.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">容积不变，是判断周期的锚点</text></svg>