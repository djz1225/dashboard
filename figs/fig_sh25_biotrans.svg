<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 527" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="生物转化两相：加工 ≠ 解毒"><title>生物转化两相：加工 ≠ 解毒</title><desc>生物转化分两相：Ⅰ相以 CYP450 为主进行氧化、还原、水解，暴露 —OH、—NH₂、—COOH 等极性基团；Ⅱ相进行葡萄糖醛酸、硫酸、乙酰化、谷胱甘肽、甲基等结合反应，极性大增便于经胆汁或尿排出。但生物转化不等于解毒：苯并芘、黄曲霉毒素等前致癌物需经 CYP450 活化才致癌，对乙酰氨基酚过量时生成的 NAPQI 在谷胱甘肽耗竭后致肝坏死。CYP450 被诱导还可引起药物相互作用。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">生物转化两相：加工 ≠ 解毒</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Ⅰ相 CYP450 暴露极性基团，Ⅱ相结合反应加「标签」；但少数</text><text x="18.0" y="68.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">前体物经它活化致毒</text><rect x="18.0" y="82.0" width="177.0" height="136.0" rx="9" fill="#fde8dd" stroke="#c1440e" stroke-width="1.1"/><text x="29.0" y="103.0" font-size="12.5" font-weight="700" fill="#c1440e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Ⅰ 相｜加工</text><text x="29.0" y="122.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">氧化、还原、水解（CYP4</text><text x="29.0" y="138.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">50为主）</text><text x="29.0" y="158.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">目的：暴露 —OH / —NH₂</text><text x="29.0" y="174.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">/ —COOH</text><text x="29.0" y="194.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">亲水性略增，多数仍排不出去</text><rect x="205.0" y="82.0" width="177.0" height="136.0" rx="9" fill="#e6f6ec" stroke="#2f8f57" stroke-width="1.1"/><text x="216.0" y="103.0" font-size="12.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Ⅱ 相｜加标签</text><text x="216.0" y="122.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">葡萄糖醛酸、硫酸、乙酰、</text><text x="216.0" y="138.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">谷胱甘肽、甲基</text><text x="216.0" y="158.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">目的：极性大增，便于胆汁</text><text x="216.0" y="174.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">或尿排出</text><text x="216.0" y="194.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">结合后失活并被转运体泵出</text><rect x="18.0" y="228.0" width="364.0" height="197.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="247.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">「转化 ≠ 解毒」的三个证据</text><rect x="30.0" y="258.0" width="3.0" height="15.0" rx="1.5" fill="#c0392b"/><text x="39.0" y="271.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">前致癌物</text><text x="362.0" y="271.0" text-anchor="end" font-size="12" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">苯并芘/黄曲霉毒素</text><text x="39.0" y="289.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">本身不致癌，经 CYP450 活化才变</text><text x="39.0" y="305.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">成致癌物 —— 生物转化反而致毒</text><rect x="30.0" y="314.0" width="3.0" height="15.0" rx="1.5" fill="#b45309"/><text x="39.0" y="327.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">对乙酰氨基酚过量</text><text x="362.0" y="327.0" text-anchor="end" font-size="12" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">NAPQI</text><text x="39.0" y="345.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">CYP450 生成毒性代谢物 NAPQI；谷胱甘肽耗竭</text><text x="39.0" y="361.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">→ 肝细胞坏死（解毒用 N-乙酰半胱氨酸）</text><rect x="30.0" y="370.0" width="3.0" height="15.0" rx="1.5" fill="#4a5a6b"/><text x="39.0" y="383.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">酶被诱导</text><text x="362.0" y="383.0" text-anchor="end" font-size="12" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">药物相互作用</text><text x="39.0" y="401.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">利福平等诱导 CYP450 → 其他药物代谢</text><text x="39.0" y="417.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">加快、血药浓度下降、疗效减弱</text><rect x="18.0" y="437.0" width="364.0" height="70.0" rx="8" fill="#fef3c7"/><rect x="18.0" y="437.0" width="3.5" height="70.0" rx="1.8" fill="#b45309"/><text x="32.0" y="457.0" font-size="11.5" font-weight="700" fill="#b45309" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">易错</text><text x="32.0" y="474.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">CYP450 属Ⅰ相；生物转化多数降低毒性，但少数前体物</text><text x="32.0" y="493.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">质经它活化才致毒。</text></svg>