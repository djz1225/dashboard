 YaHei',sans-serif">低常期</text><text x="370.0" y="245.0" text-anchor="end" font-size="10.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">时间（示意）</text><rect x="18.0" y="253.0" width="364.0" height="247.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="271.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">分期与兴奋性</text><rect x="30.0" y="281.0" width="3.0" height="15.0" rx="1.5" fill="#c0392b"/><text x="39.0" y="294.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">绝对不应期</text><text x="347.0" y="294.0" text-anchor="end" font-size="12" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">兴奋性＝0</text><text x="39.0" y="312.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Na⁺ 通道失活，无论多强刺激都不能再兴奋</text><rect x="30.0" y="322.0" width="3.0" height="15.0" rx="1.5" fill="#1f6fb2"/><text x="39.0" y="335.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">相对不应期</text><text x="347.0" y="335.0" text-anchor="end" font-size="12" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">兴奋性↓</text><text x="39.0" y="353.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">部分 Na⁺ 通道恢复，需阈上刺激才兴奋</text><rect x="30.0" y="363.0" width="3.0" height="15.0" rx="1.5" fill="#7b4bb7"/><text x="39.0" y="376.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">超常期</text><text x="347.0" y="376.0" text-anchor="end" font-size="12" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">兴奋性↑</text><text x="39.0" y="394.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">膜电位接近阈电位，阈下刺激即可兴奋</text><rect x="30.0" y="404.0" width="3.0" height="15.0" rx="1.5" fill="#4a5a6b"/><text x="39.0" y="417.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">低常期</text><text x="347.0" y="417.0" text-anchor="end" font-size="12" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">兴奋性↓</text><text x="39.0" y="435.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">膜超极化，距阈电位远，需较强刺激</text><rect x="30.0" y="445.0" width="3.0" height="15.0" rx="1.5" fill="#b45309"/><text x="39.0" y="458.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">10版提示</text><text x="347.0" y="458.0" text-anchor="end" font-size="12" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">旧题按旧说</text><text x="39.0" y="476.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">第10版已删去「超常期」「低常期」两概念，</text><text x="39.0" y="492.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">答旧题时保留</text><rect x="18.0" y="512.0" width="364.0" height="70.0" rx="8" fill="#eef2f7"/><rect x="18.0" y="512.0" width="3.5" height="70.0" rx="1.8" fill="#4a5a6b"/><text x="32.0" y="532.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="549.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">绝对不应期＝Na⁺ 通道失活，任何刺激无效；它决定动</text><text x="32.0" y="568.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">作电位不能融合、并给出最高发放频率上限。</text></svg>