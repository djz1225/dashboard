<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 757" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="活性氧：一处漏电，三道清除"><title>活性氧：一处漏电，三道清除</title><desc>呼吸链复合体Ⅰ、Ⅲ 处约有 1~2% 的电子提前漏给 O₂ 生成超氧阴离子，SOD（Mn-SOD 在线粒体、Cu/Zn-SOD 在胞质）将其歧化为 H₂O₂，再由过氧化氢酶或谷胱甘肽过氧化物酶清除为水；后者依赖谷胱甘肽与 NADPH，故 G6PD 缺乏时抗氧化能力下降。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">活性氧：一处漏电，三道清除</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">复合体Ⅰ/Ⅲ 漏出的电子约占 1~2%，先变超氧，再逐级解毒</text><rect x="30.0" y="65.0" width="68.5" height="30.0" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1"/><text x="64.2" y="83.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">电子漏</text><line x1="100.0" y1="80.0" x2="119.0" y2="80.0" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="119.0" y1="80.0" x2="115.1" y2="82.2" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="119.0" y1="80.0" x2="115.1" y2="77.8" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><rect x="120.5" y="65.0" width="68.5" height="30.0" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1"/><text x="154.8" y="83.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">O₂·⁻</text><line x1="190.5" y1="80.0" x2="209.5" y2="80.0" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="209.5" y1="80.0" x2="205.6" y2="82.2" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="209.5" y1="80.0" x2="205.6" y2="77.8" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><rect x="211.0" y="65.0" width="68.5" height="30.0" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1"/><text x="245.2" y="83.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">H₂O₂</text><line x1="281.0" y1="80.0" x2="300.0" y2="80.0" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="300.0" y1="80.0" x2="296.1" y2="82.2" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="300.0" y1="80.0" x2="296.1" y2="77.8" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><rect x="301.5" y="65.0" width="68.5" height="30.0" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1"/><text x="335.8" y="83.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">H₂O</text><line x1="32.0" y1="113.0" x2="46.0" y2="113.0" stroke="#b45309" stroke-width="2.2" stroke-linecap="round"/><text x="51.0" y="117.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">复合体Ⅰ/Ⅲ 提前把电子交给 O₂</text><line x1="240.8" y1="113.0" x2="254.8" y2="113.0" stroke="#2f8f57" stroke-width="2.2" stroke-linecap="round"/><text x="259.8" y="117.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">SOD 歧化</text><rect x="18.0" y="139.0" width="364.0" height="329.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="158.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">漏电与清除链</text><rect x="30.0" y="171.0" width="340.0" height="64.0" rx="8" fill="#ffffff" stroke="#e3eaf2" stroke-width="1.1"/><rect x="30.0" y="171.0" width="3.5" height="64.0" rx="1.8" fill="#c0392b"/><circle cx="49.0" cy="188.0" r="9" fill="#c0392b"/><text x="49.0" y="192.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">1</text><text x="65.0" y="192.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">① 电子漏</text><text x="360.0" y="192.0" text-anchor="end" font-size="12" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">源头</text><text x="65.0" y="210.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">约 1~2% 的电子在复合体Ⅰ、Ⅲ 处提前交给</text><text x="65.0" y="226.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">O₂，生成超氧阴离子 O₂·⁻</text><line x1="49.0" y1="237.0" x2="49.0" y2="244.0" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="244.0" x2="45.6" y2="237.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="244.0" x2="52.4" y2="237.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><rect x="30.0" y="246.0" width="340.0" height="64.0" rx="8" fill="#ffffff" stroke="#e3eaf2" stroke-width="1.1"/><rect x="30.0" y="246.0" width="3.5" height="64.0" rx="1.8" fill="#2f8f57"/><circle cx="49.0" cy="263.0" r="9" fill="#2f8f57"/><text x="49.0" y="267.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">2</text><text x="65.0" y="267.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">② SOD 歧化</text><text x="360.0" y="267.0" text-anchor="end" font-size="12" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">第一道</text><text x="65.0" y="285.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">2 O₂·⁻ + 2 H⁺ → H₂O₂ + O₂；</text><text x="65.0" y="301.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Mn-SOD 在线粒体，Cu/Zn-SOD 在胞质</text><line x1="49.0" y1="312.0" x2="49.0" y2="319.0" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="319.0" x2="45.6" y2="312.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="319.0" x2="52.4" y2="312.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><rect x="30.0" y="321.0" width="340.0" height="64.0" rx="8" fill="#ffffff" stroke="#e3eaf2" stroke-width="1.1"/><rect x="30.0" y="321.0" width="3.5" height="64.0" rx="1.8" fill="#0f766e"/><circle cx="49.0" cy="338.0" r="9" fill="#0f766e"/><text x="49.0" y="342.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">3</text><text x="65.0" y="342.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">③ 过氧化氢酶 / 谷胱甘肽过氧化物酶</text><text x="360.0" y="342.0" text-anchor="end" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">第二道</text><text x="65.0" y="360.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">H₂O₂ → H₂O；谷胱甘肽过氧化物酶需谷</text><text x="65.0" y="376.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胱甘肽与 NADPH</text><line x1="49.0" y1="387.0" x2="49.0" y2="394.0" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="394.0" x2="45.6" y2="387.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="394.0" x2="52.4" y2="387.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><rect x="30.0" y="396.0" width="340.0" height="64.0" rx="8" fill="#ffffff" stroke="#e3eaf2" stroke-width="1.1"/><rect x="30.0" y="396.0" width="3.5" height="64.0" rx="1.8" fill="#b45309"/><circle cx="49.0" cy="413.0" r="9" fill="#b45309"/><text x="49.0" y="417.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">4</text><text x="65.0" y="417.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">④ 抗氧化不足 → 氧化应激</text><text x="360.0" y="417.0" text-anchor="end" font-size="12" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">后果</text><text x="65.0" y="435.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">脂质过氧化、蛋白与 DNA 损伤，与衰老、动</text><text x="65.0" y="451.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">脉粥样硬化相关</text><rect x="18.0" y="480.0" width="364.0" height="26.0" rx="6" fill="#f8fbfd"/><text x="26.0" y="497.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">酶</text><text x="157.0" y="497.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">定位</text><text x="259.0" y="497.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">作用</text><line x1="18.0" y1="532.0" x2="382.0" y2="532.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="524.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Mn-SOD</text><text x="157.0" y="524.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">线粒体基质</text><text x="259.0" y="524.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">清除线粒体内的超氧</text><line x1="18.0" y1="558.0" x2="382.0" y2="558.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="550.0" font-size="12.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Cu/Zn-SOD</text><text x="157.0" y="550.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胞质</text><text x="259.0" y="550.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">清除胞质超氧</text><line x1="18.0" y1="600.0" x2="382.0" y2="600.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="576.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">过氧化氢酶</text><text x="157.0" y="576.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">过氧化物酶体</text><text x="259.0" y="576.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">分解 H₂O₂ 为 H₂</text><text x="259.0" y="592.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">O</text><line x1="18.0" y1="642.0" x2="382.0" y2="642.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="618.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">谷胱甘肽过氧</text><text x="26.0" y="634.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">化物酶</text><text x="157.0" y="618.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胞质 / 线粒体</text><text x="259.0" y="618.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">需 NADPH（来自 PPP）</text><rect x="18.0" y="648.0" width="364.0" height="89.0" rx="8" fill="#fef3c7"/><rect x="18.0" y="648.0" width="3.5" height="89.0" rx="1.8" fill="#b45309"/><text x="32.0" y="668.0" font-size="11.5" font-weight="700" fill="#b45309" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">易错</text><text x="32.0" y="685.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">SOD 只把超氧变成 H₂O₂，不是终点；G6PD 缺乏时</text><text x="32.0" y="704.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">NADPH 不足 → 谷胱甘肽过氧化物酶失灵 → 氧化损伤</text><text x="32.0" y="723.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">（与蚕豆病同一机制）。</text></svg>