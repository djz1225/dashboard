<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 545" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="自主神经系统：交感与副交感"><title>自主神经系统：交感与副交感</title><desc>交感节后以去甲肾上腺素为主（汗腺例外用 ACh），受体为 α₁ 缩血管、β₁ 心脏、β₂ 支气管；副交感节后全部乙酰胆碱作用 M 受体；血管、汗腺、肾上腺髓质只受交感支配。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">自主神经系统：交感与副交感</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">看「递质、受体、效应」三件事</text><rect x="18.0" y="65.0" width="177.0" height="184.0" rx="9" fill="#fdeceb" stroke="#c0392b" stroke-width="1.1"/><text x="29.0" y="86.0" font-size="12.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">交感（应急）</text><text x="29.0" y="105.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">瞳孔 扩大（α₁）</text><text x="29.0" y="125.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">心率↑ 收缩力↑（β₁）</text><text x="29.0" y="145.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">支气管舒张（β₂）</text><text x="29.0" y="165.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胃肠蠕动↓（α/β）</text><text x="29.0" y="185.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">膀胱逼尿肌舒张（β）</text><text x="29.0" y="205.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">唾液少而黏稠（α）</text><text x="29.0" y="225.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">汗腺分泌↑（M，例外）</text><rect x="205.0" y="65.0" width="177.0" height="184.0" rx="9" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1.1"/><text x="216.0" y="86.0" font-size="12.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">副交感（休整）</text><text x="216.0" y="105.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">瞳孔 缩小（M）</text><text x="216.0" y="125.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">心率↓（M）</text><text x="216.0" y="145.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">支气管收缩（M）</text><text x="216.0" y="165.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胃肠蠕动↑（M）</text><text x="216.0" y="185.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">膀胱逼尿肌收缩（M）</text><text x="216.0" y="205.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">唾液多而稀薄（M）</text><text x="216.0" y="225.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">无副交感支配</text><rect x="18.0" y="259.0" width="364.0" height="184.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="277.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">递质与受体</text><rect x="31.0" y="287.0" width="3.0" height="15.0" rx="1.5" fill="#c0392b"/><text x="40.0" y="300.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">交感节后</text><text x="344.0" y="300.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">去甲肾上腺素</text><text x="40.0" y="318.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">多数释放 NE；汗腺例外用 ACh、M 受体</text><rect x="31.0" y="326.0" width="3.0" height="15.0" rx="1.5" fill="#1f6fb2"/><text x="40.0" y="339.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">副交感节后</text><text x="344.0" y="339.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">乙酰胆碱</text><text x="40.0" y="357.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">全部释放 ACh，作用于 M 受体（阿托品阻断）</text><rect x="31.0" y="365.0" width="3.0" height="15.0" rx="1.5" fill="#7b4bb7"/><text x="40.0" y="378.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">交感受体</text><text x="344.0" y="378.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">α₁ β₁ β₂</text><text x="40.0" y="396.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">α₁ 缩血管、β₁ 心脏、β₂ 支气管与骨骼肌血管</text><rect x="31.0" y="404.0" width="3.0" height="15.0" rx="1.5" fill="#4a5a6b"/><text x="40.0" y="417.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">只交感支配</text><text x="344.0" y="417.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">无双重支配</text><text x="40.0" y="435.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">血管、汗腺、肾上腺髓质</text><rect x="18.0" y="455.0" width="364.0" height="70.0" rx="8" fill="#eef2f7"/><rect x="18.0" y="455.0" width="3.5" height="70.0" rx="1.8" fill="#4a5a6b"/><text x="32.0" y="475.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="492.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">交感多用去甲肾上腺素（汗腺例外用 ACh），副交感全</text><text x="32.0" y="511.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">用 ACh 作用 M 受体；所以阿托品能抑制出汗。</text></svg>