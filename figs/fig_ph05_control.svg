<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 628" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="呼吸运动的调节"><title>呼吸运动的调节</title><desc>中枢化学感受器（延髓，感受脑脊液 H⁺）承担 CO₂ 的主要作用；外周化学感受器（颈动脉体、主动脉体）主要感受低氧；肺牵张反射抑制吸气，咳嗽喷嚏为防御性反射。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">呼吸运动的调节</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">平时靠 CO₂（中枢），应急靠低氧（外周）</text><rect x="18.0" y="65.0" width="177.0" height="120.0" rx="9" fill="#e2f5f2" stroke="#0f766e" stroke-width="1.1"/><text x="29.0" y="86.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">中枢化学感受器</text><text x="29.0" y="105.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">延髓，感受脑脊液 H⁺</text><text x="29.0" y="125.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">CO₂ 的主要通路（约 80%）</text><text x="29.0" y="145.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">不感受低氧</text><rect x="205.0" y="65.0" width="177.0" height="120.0" rx="9" fill="#fef3c7" stroke="#b45309" stroke-width="1.1"/><text x="216.0" y="86.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">外周化学感受器</text><text x="216.0" y="105.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">颈动脉体、主动脉体</text><text x="216.0" y="125.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">主要感受低氧（PO₂&lt;60</text><text x="216.0" y="141.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"> 才明显）</text><text x="216.0" y="161.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">起效快，应急用</text><rect x="18.0" y="195.0" width="177.0" height="120.0" rx="9" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1.1"/><text x="29.0" y="216.0" font-size="12.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肺牵张反射</text><text x="29.0" y="235.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肺扩张 → 抑制吸气</text><text x="29.0" y="255.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">防止肺过度扩张</text><rect x="205.0" y="195.0" width="177.0" height="120.0" rx="9" fill="#eef2f7" stroke="#4a5a6b" stroke-width="1.1"/><text x="216.0" y="216.0" font-size="12.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">防御性反射</text><text x="216.0" y="235.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">咳嗽、喷嚏</text><text x="216.0" y="255.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">清除气道刺激物</text><rect x="18.0" y="327.0" width="364.0" height="199.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="345.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">CO₂ 的通路</text><rect x="30.0" y="355.0" width="70.8" height="24.0" rx="5" fill="#e2f5f2" stroke="#0f766e" stroke-width="1"/><text x="65.4" y="371.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">CO₂ 入脑</text><line x1="102.2" y1="367.0" x2="110.2" y2="367.0" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="110.2" y1="367.0" x2="106.3" y2="369.2" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="110.2" y1="367.0" x2="106.3" y2="364.8" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><rect x="111.8" y="355.0" width="70.8" height="24.0" rx="5" fill="#e2f5f2" stroke="#0f766e" stroke-width="1"/><text x="147.1" y="371.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">碳酸酐酶</text><line x1="184.0" y1="367.0" x2="192.0" y2="367.0" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="192.0" y1="367.0" x2="188.1" y2="369.2" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="192.0" y1="367.0" x2="188.1" y2="364.8" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><rect x="193.5" y="355.0" width="70.8" height="24.0" rx="5" fill="#e2f5f2" stroke="#0f766e" stroke-width="1"/><text x="228.9" y="371.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">H⁺ ↑</text><line x1="265.8" y1="367.0" x2="273.8" y2="367.0" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="273.8" y1="367.0" x2="269.8" y2="369.2" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="273.8" y1="367.0" x2="269.8" y2="364.8" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><rect x="275.2" y="355.0" width="70.8" height="24.0" rx="5" fill="#e2f5f2" stroke="#0f766e" stroke-width="1"/><text x="310.6" y="371.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">中枢感受器</text><rect x="31.0" y="393.0" width="3.0" height="15.0" rx="1.5" fill="#7b4bb7"/><text x="40.0" y="406.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">关键一步</text><text x="344.0" y="406.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">间接作用</text><text x="40.0" y="424.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">CO₂ 先透过血脑屏障、生成 H⁺ 才刺激中枢</text><rect x="31.0" y="432.0" width="3.0" height="15.0" rx="1.5" fill="#b45309"/><text x="40.0" y="445.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">强度排序</text><text x="344.0" y="445.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">CO₂&gt;低氧</text><text x="40.0" y="463.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">CO₂ 对呼吸的刺激最强，低氧作用弱</text><rect x="31.0" y="471.0" width="3.0" height="15.0" rx="1.5" fill="#c0392b"/><text x="40.0" y="484.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">临床警示</text><text x="344.0" y="484.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Ⅱ型呼衰</text><text x="40.0" y="502.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">慢性 CO₂ 潴留时驱动转为依赖低氧，高浓度吸氧可致</text><text x="40.0" y="518.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">呼吸抑制</text><rect x="18.0" y="538.0" width="364.0" height="70.0" rx="8" fill="#eef2f7"/><rect x="18.0" y="538.0" width="3.5" height="70.0" rx="1.8" fill="#4a5a6b"/><text x="32.0" y="558.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="575.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">CO₂ 经 H⁺ 刺激中枢（主要通路）；低氧只经外周化</text><text x="32.0" y="594.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">学感受器，且是Ⅱ型呼衰时的关键驱动。</text></svg>