<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 496" width="100%" style="max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px" role="img"><text x="165.0" y="22.6" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">呼吸运动的调节</text><text x="165.0" y="43.0" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">平时靠 CO₂/H⁺（中枢），应急靠低氧（外周）</text><rect x="15.0" y="60.0" width="300.0" height="60.0" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.4"/><text x="24.0" y="79.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">中枢化学感受器</text><text x="24.0" y="96.0" text-anchor="start" font-size="13" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">延髓，感受脑脊液 H⁺</text><text x="24.0" y="114.0" text-anchor="start" font-size="13" font-weight="600" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">CO₂ 的主要通路（占 80%）</text><rect x="15.0" y="126.0" width="300.0" height="60.0" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/><text x="24.0" y="145.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">外周化学感受器</text><text x="24.0" y="162.0" text-anchor="start" font-size="13" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">颈动脉体、主动脉体</text><text x="24.0" y="180.0" text-anchor="start" font-size="13" font-weight="600" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">主要感受低氧（PO₂&lt;60 才明显）</text><rect x="15.0" y="192.0" width="300.0" height="60.0" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/><text x="24.0" y="211.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">肺牵张反射</text><text x="24.0" y="228.0" text-anchor="start" font-size="13" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">肺扩张 → 抑制吸气</text><text x="24.0" y="246.0" text-anchor="start" font-size="13" font-weight="600" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">防止肺过度扩张</text><rect x="15.0" y="258.0" width="300.0" height="60.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.4"/><text x="24.0" y="277.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">防御性反射</text><text x="24.0" y="294.0" text-anchor="start" font-size="13" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">咳嗽、喷嚏</text><text x="24.0" y="312.0" text-anchor="start" font-size="13" font-weight="600" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">清除刺激物</text><rect x="15.0" y="326.0" width="300.0" height="108.0" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/><text x="25.0" y="342.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">关键：CO₂ 不是直接刺激中枢感受器，</text><text x="25.0" y="358.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">而是透过血脑屏障生成 H⁺ 再起作用</text><text x="25.0" y="374.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">CO₂ 对呼吸的刺激作用最强（比低氧强得多）</text><text x="25.0" y="390.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">——所以给高浓度氧可能抑制呼吸</text><text x="25.0" y="406.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">慢性 CO₂ 潴留（Ⅱ型呼衰）时呼吸驱动转为依</text><text x="25.0" y="422.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">赖低氧，此时高浓度吸氧危险</text><rect x="11.0" y="437.0" width="308.0" height="51.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="165.0" y="452.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">CO₂经H⁺刺激中枢（主要通路）；低氧只在外周、</text><text x="165.0" y="467.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">且是Ⅱ型呼衰的关键驱动</text></svg>