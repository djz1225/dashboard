<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 502" width="100%" style="max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px" role="img"><text x="165.0" y="22.6" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">两条穿梭系统：差在能不能进线粒体</text><text x="165.0" y="43.0" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">NADH 本身不能过内膜，必须「换乘」</text><rect x="15.0" y="58.0" width="300.0" height="60.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><rect x="15.0" y="58.0" width="4.5" height="60.0" rx="2.2" fill="#b45309"/><text x="29.0" y="77.0" text-anchor="start" font-size="14" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">α-磷酸甘油穿梭</text><text x="29.0" y="94.0" text-anchor="start" font-size="12" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">1.5 ATP/NADH</text><text x="29.0" y="109.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">把氢交给 FAD → 走复合体Ⅱ；脑、骨骼肌为主</text><rect x="15.0" y="122.0" width="300.0" height="60.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><rect x="15.0" y="122.0" width="4.5" height="60.0" rx="2.2" fill="#0f766e"/><text x="29.0" y="141.0" text-anchor="start" font-size="14" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">苹果酸-天冬氨酸穿梭</text><text x="29.0" y="158.0" text-anchor="start" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">2.5 ATP/NADH</text><text x="29.0" y="173.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">把氢交给线粒体 NAD⁺ → 走复合体Ⅰ；心、肝为主</text><rect x="15.0" y="186.0" width="300.0" height="60.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><rect x="15.0" y="186.0" width="4.5" height="60.0" rx="2.2" fill="#b91c1c"/><text x="29.0" y="205.0" text-anchor="start" font-size="14" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">为什么必须穿梭</text><text x="29.0" y="222.0" text-anchor="start" font-size="12" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">线粒体内膜不通 NADH</text><text x="29.0" y="237.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">只能靠代谢物「背」进去</text><rect x="15.0" y="252.0" width="300.0" height="102.0" rx="7" fill="#ccfbf1" stroke="#cbd5e1" stroke-width="1.4"/><text x="25.0" y="271.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">临床两个推论</text><text x="25.0" y="289.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 心肌、肝以苹果酸穿梭为主 → 胞质 NADH </text><text x="25.0" y="305.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">也能产 2.5，效率更高</text><text x="25.0" y="321.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 骨骼肌、脑以甘油磷酸穿梭为主 → 同样 1 </text><text x="25.0" y="337.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">分子葡萄糖少产 2 ATP</text><rect x="15.0" y="362.0" width="300.0" height="76.0" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/><text x="25.0" y="378.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">易错：两条穿梭的差别不是「NADH 多少」，</text><text x="25.0" y="394.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">而是「氢交给谁」</text><text x="25.0" y="410.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">甘油磷酸穿梭交出的是 FADH₂，所以只能折 1</text><text x="25.0" y="426.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">.5</text><rect x="11.0" y="443.0" width="308.0" height="51.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="165.0" y="458.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">甘油磷酸穿梭交给 FADH₂（1.5）；苹果酸-天</text><text x="165.0" y="473.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">冬氨酸穿梭交给 NADH（2.5）</text></svg>