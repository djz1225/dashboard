<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 551" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="两条穿梭系统：差在把氢交给谁"><title>两条穿梭系统：差在把氢交给谁</title><desc>胞质 NADH 不能直接穿过线粒体内膜，须经穿梭系统换乘：α-磷酸甘油穿梭把氢交给线粒体 FAD 生成 FADH₂，经复合体Ⅱ 进入，折 1.5 ATP，脑与骨骼肌为主；苹果酸-天冬氨酸穿梭把氢交给线粒体 NAD⁺，经复合体Ⅰ 进入，折 2.5 ATP，心与肝为主。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">两条穿梭系统：差在把氢交给谁</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">NADH 本身过不了内膜，必须「换乘」；甘油磷酸交给 FAD，苹果</text><text x="18.0" y="68.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">酸交给 NAD⁺</text><rect x="18.0" y="82.0" width="177.0" height="156.0" rx="9" fill="#fef3c7" stroke="#b45309" stroke-width="1.1"/><text x="29.0" y="103.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">α-磷酸甘油穿梭｜1.5</text><text x="29.0" y="122.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胞质 NADH 把氢交给磷</text><text x="29.0" y="138.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">酸二羟丙酮</text><text x="29.0" y="158.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">→ 磷酸甘油 → 线粒体内再</text><text x="29.0" y="174.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">交 FAD</text><text x="29.0" y="194.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">走复合体Ⅱ，只折 1.5 ATP</text><text x="29.0" y="214.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">脑、骨骼肌为主</text><rect x="205.0" y="82.0" width="177.0" height="156.0" rx="9" fill="#fef3c7" stroke="#b45309" stroke-width="1.1"/><text x="216.0" y="103.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">苹果酸-天冬氨酸穿梭｜2.5</text><text x="216.0" y="122.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">草酰乙酸 → 苹果酸 携</text><text x="216.0" y="138.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">带氢过膜</text><text x="216.0" y="158.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">线粒体内再变回草酰乙酸 +</text><text x="216.0" y="174.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">NADH</text><text x="216.0" y="194.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">走复合体Ⅰ，可折 2.5 ATP</text><text x="216.0" y="214.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">心、肝为主</text><rect x="18.0" y="248.0" width="364.0" height="201.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="267.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">三个要点</text><rect x="30.0" y="278.0" width="3.0" height="15.0" rx="1.5" fill="#4a5a6b"/><text x="39.0" y="291.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">为什么必须穿梭</text><text x="370.0" y="291.0" text-anchor="end" font-size="12" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">内膜不通透</text><text x="39.0" y="309.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">线粒体内膜对 NADH 完全不透，氢只能由代</text><text x="39.0" y="325.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">谢物「背」进去</text><rect x="30.0" y="336.0" width="3.0" height="15.0" rx="1.5" fill="#0f766e"/><text x="39.0" y="349.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">差别的本质</text><text x="370.0" y="349.0" text-anchor="end" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">交给谁</text><text x="39.0" y="367.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">不是「NADH 多少」的差别，而是氢最终交给 FAD</text><text x="39.0" y="383.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">还是 NAD⁺</text><rect x="30.0" y="394.0" width="3.0" height="15.0" rx="1.5" fill="#b45309"/><text x="39.0" y="407.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">临床推论</text><text x="370.0" y="407.0" text-anchor="end" font-size="12" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">少 2 ATP</text><text x="39.0" y="425.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">骨骼肌、脑以甘油磷酸穿梭为主 → 同样 1 分</text><text x="39.0" y="441.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">子葡萄糖少产 2 ATP</text><rect x="18.0" y="461.0" width="364.0" height="70.0" rx="8" fill="#e2f5f2"/><rect x="18.0" y="461.0" width="3.5" height="70.0" rx="1.8" fill="#0f766e"/><text x="32.0" y="481.0" font-size="11.5" font-weight="700" fill="#0f766e" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="498.0" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">甘油磷酸穿梭交出的是 FADH₂（1.5），苹果酸穿梭交</text><text x="32.0" y="517.0" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">出的是 NADH（2.5）；这就是 30 与 32 的唯一来源。</text></svg>