<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 612" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="叶酸与 B₁₂：叶酸陷阱"><title>叶酸与 B₁₂：叶酸陷阱</title><desc>叶酸还原为 FH₄ 后接受一碳单位生成 5-甲基 FH₄，需 B₁₂ 依赖的甲硫氨酸合成酶交出甲基才能再生 FH₄；缺 B₁₂ 时叶酸被锁在 5-甲基形式，即「叶酸陷阱」，二者均致巨幼细胞贫血。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">叶酸与 B₁₂：叶酸陷阱</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">缺 B₁₂ 时叶酸被锁在 5-甲基形式，一碳单位代谢全面停滞</text><rect x="18.0" y="65.0" width="364.0" height="319.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="84.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一碳单位的循环</text><rect x="30.0" y="97.0" width="340.0" height="64.0" rx="8" fill="#ffffff" stroke="#e3eaf2" stroke-width="1.1"/><rect x="30.0" y="97.0" width="3.5" height="64.0" rx="1.8" fill="#0f766e"/><circle cx="49.0" cy="114.0" r="9" fill="#0f766e"/><text x="49.0" y="118.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">1</text><text x="65.0" y="118.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">叶酸 → FH₄</text><text x="360.0" y="118.0" text-anchor="end" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">进入</text><text x="65.0" y="136.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">二氢叶酸还原酶还原；FH₄ 才是真正的一</text><text x="65.0" y="152.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">碳单位载体</text><line x1="49.0" y1="163.0" x2="49.0" y2="172.0" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="172.0" x2="45.6" y2="165.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="172.0" x2="52.4" y2="165.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><rect x="30.0" y="174.0" width="340.0" height="48.0" rx="8" fill="#ffffff" stroke="#e3eaf2" stroke-width="1.1"/><rect x="30.0" y="174.0" width="3.5" height="48.0" rx="1.8" fill="#0f766e"/><circle cx="49.0" cy="191.0" r="9" fill="#0f766e"/><text x="49.0" y="195.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">2</text><text x="65.0" y="195.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">FH₄ 接一碳 → 5-甲基 FH₄</text><text x="360.0" y="195.0" text-anchor="end" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">载一碳</text><text x="65.0" y="213.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">这是叶酸在血中的主要运输形式</text><line x1="49.0" y1="224.0" x2="49.0" y2="233.0" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="233.0" x2="45.6" y2="226.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="233.0" x2="52.4" y2="226.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><rect x="30.0" y="235.0" width="340.0" height="64.0" rx="8" fill="#ffffff" stroke="#e3eaf2" stroke-width="1.1"/><rect x="30.0" y="235.0" width="3.5" height="64.0" rx="1.8" fill="#b45309"/><circle cx="49.0" cy="252.0" r="9" fill="#b45309"/><text x="49.0" y="256.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">3</text><text x="65.0" y="256.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">交出一碳需 B₁₂</text><text x="360.0" y="256.0" text-anchor="end" font-size="12" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">关键一步</text><text x="65.0" y="274.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">甲硫氨酸合成酶以甲基钴胺素为辅酶，把</text><text x="65.0" y="290.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">甲基转给同型半胱氨酸</text><line x1="49.0" y1="301.0" x2="49.0" y2="310.0" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="310.0" x2="45.6" y2="303.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="310.0" x2="52.4" y2="303.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><rect x="30.0" y="312.0" width="340.0" height="64.0" rx="8" fill="#ffffff" stroke="#e3eaf2" stroke-width="1.1"/><rect x="30.0" y="312.0" width="3.5" height="64.0" rx="1.8" fill="#2f8f57"/><circle cx="49.0" cy="329.0" r="9" fill="#2f8f57"/><text x="49.0" y="333.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">4</text><text x="65.0" y="333.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">回到 FH₄，循环继续</text><text x="360.0" y="333.0" text-anchor="end" font-size="12" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">再生</text><text x="65.0" y="351.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">FH₄ 才能供给 dTMP 合成；缺 B₁₂ 则</text><text x="65.0" y="367.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">叶酸被锁住</text><rect x="18.0" y="396.0" width="177.0" height="116.0" rx="9" fill="#fdeceb" stroke="#c0392b" stroke-width="1.1"/><text x="29.0" y="417.0" font-size="12.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">缺 B₁₂ ＝ 缺叶酸</text><text x="29.0" y="436.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">5-甲基 FH₄ 无法脱甲基</text><text x="29.0" y="452.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">→FH₄ 再生受阻</text><text x="29.0" y="472.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">dTMP 合成不足 → DNA 复</text><text x="29.0" y="488.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">制受阻 → 巨幼细胞贫血</text><rect x="205.0" y="396.0" width="177.0" height="116.0" rx="9" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1.1"/><text x="216.0" y="417.0" font-size="12.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">B₁₂ 独有的损害</text><text x="216.0" y="436.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">甲基丙二酰 CoA 变位酶</text><text x="216.0" y="452.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">也需B₁₂</text><text x="216.0" y="472.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">故缺 B₁₂ 特有神经髓</text><text x="216.0" y="488.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">鞘损伤</text><rect x="18.0" y="522.0" width="364.0" height="70.0" rx="8" fill="#e2f5f2"/><rect x="18.0" y="522.0" width="3.5" height="70.0" rx="1.8" fill="#0f766e"/><text x="32.0" y="542.0" font-size="11.5" font-weight="700" fill="#0f766e" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">临床</text><text x="32.0" y="559.0" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">单补叶酸可纠正贫血、却掩盖 B₁₂ 缺乏的神经损害进</text><text x="32.0" y="578.0" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">展——巨幼贫补叶酸前必须先测 B₁₂。</text></svg>