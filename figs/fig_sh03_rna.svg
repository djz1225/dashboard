<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 597" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="三类 RNA 的分工"><title>三类 RNA 的分工</title><desc>mRNA 占 1~5% 负责携带序列信息，tRNA 约 15% 搬运氨基酸（二级三叶草、三级倒 L 形、3′ 端 CCA），rRNA 约 80% 构成核糖体并提供肽酰转移酶活性。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">三类 RNA 的分工</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">mRNA 带图纸 · tRNA 搬砖 · rRNA 是催化车间</text><rect x="18.0" y="65.0" width="10.9" height="24.0" rx="3" fill="#fdeceb" stroke="#c0392b" stroke-width="1"/><rect x="28.9" y="65.0" width="54.6" height="24.0" rx="3" fill="#f2ecfb" stroke="#7b4bb7" stroke-width="1"/><rect x="83.5" y="65.0" width="298.5" height="24.0" rx="3" fill="#e2f5f2" stroke="#0f766e" stroke-width="1"/><text x="232.8" y="82.0" text-anchor="middle" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">rRNA 约 80%</text><text x="18.0" y="117.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">占总 RNA 的比例：mRNA 仅 1~5%（种类多、寿命短）</text><rect x="18.0" y="127.0" width="364.0" height="203.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="146.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">三种 RNA</text><rect x="30.0" y="157.0" width="3.0" height="15.0" rx="1.5" fill="#c0392b"/><text x="39.0" y="170.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">mRNA</text><text x="370.0" y="170.0" text-anchor="end" font-size="12" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">1~5%</text><text x="39.0" y="188.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">把 DNA 的序列抄一份带到胞质：5′ 帽子 + 编码</text><text x="39.0" y="204.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">区 + 3′ polyA</text><rect x="30.0" y="216.0" width="3.0" height="15.0" rx="1.5" fill="#7b4bb7"/><text x="39.0" y="229.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">tRNA</text><text x="370.0" y="229.0" text-anchor="end" font-size="12" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">约 15%</text><text x="39.0" y="247.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一端读密码子、一端带氨基酸，3′ 端一律</text><text x="39.0" y="263.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">CCA-OH</text><rect x="30.0" y="275.0" width="3.0" height="15.0" rx="1.5" fill="#0f766e"/><text x="39.0" y="288.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">rRNA</text><text x="370.0" y="288.0" text-anchor="end" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">约 80%</text><text x="39.0" y="306.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">构成核糖体并催化肽键形成——肽酰转移酶活性由</text><text x="39.0" y="322.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">rRNA 提供</text><rect x="18.0" y="342.0" width="364.0" height="153.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="361.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">tRNA 的三个必记数字</text><rect x="30.0" y="372.0" width="3.0" height="15.0" rx="1.5" fill="#7b4bb7"/><text x="39.0" y="385.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">二级结构</text><text x="370.0" y="385.0" text-anchor="end" font-size="12" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">三叶草</text><text x="39.0" y="403.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">氨基酸臂、D 臂、反密码子臂、TψC 臂</text><rect x="30.0" y="414.0" width="3.0" height="15.0" rx="1.5" fill="#0f766e"/><text x="39.0" y="427.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">三级结构</text><text x="370.0" y="427.0" text-anchor="end" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">倒 L 形</text><text x="39.0" y="445.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">功能形态；反密码子与氨基酸臂相距约 7 nm</text><rect x="30.0" y="456.0" width="3.0" height="15.0" rx="1.5" fill="#2f8f57"/><text x="39.0" y="469.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">3′ 端</text><text x="370.0" y="469.0" text-anchor="end" font-size="12" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">CCA-OH</text><text x="39.0" y="487.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">氨基酸接在末端 A 的 3′-OH 上</text><rect x="18.0" y="507.0" width="364.0" height="70.0" rx="8" fill="#fef3c7"/><rect x="18.0" y="507.0" width="3.5" height="70.0" rx="1.8" fill="#b45309"/><text x="32.0" y="527.0" font-size="11.5" font-weight="700" fill="#b45309" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">易错</text><text x="32.0" y="544.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">三叶草只是二级结构，功能形态是倒 L 形；核酶说明「</text><text x="32.0" y="563.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">酶＝蛋白质」有例外。</text></svg>