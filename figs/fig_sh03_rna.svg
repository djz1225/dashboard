<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 592" width="100%" style="max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px" role="img"><text x="165.0" y="22.6" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">三类 RNA 的分工</text><text x="165.0" y="43.0" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">mRNA 带图纸 · tRNA 搬砖 · rRNA 是车间</text><rect x="15.0" y="58.0" width="300.0" height="78.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/><text x="26.0" y="79.0" text-anchor="start" font-size="14" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">mRNA</text><text x="65.4" y="79.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">信使 RNA</text><text x="304.0" y="79.0" text-anchor="end" font-size="11.2" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">占总量 1~5%</text><text x="26.0" y="99.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">把 DNA 的序列抄一份带到胞质</text><text x="26.0" y="118.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">5′ 帽子 + 编码区 + 3′ polyA</text><rect x="15.0" y="142.0" width="300.0" height="78.0" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="26.0" y="163.0" text-anchor="start" font-size="14" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">tRNA</text><text x="65.4" y="163.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">转运 RNA</text><text x="304.0" y="163.0" text-anchor="end" font-size="11.2" font-weight="400" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">占总量 约 15%</text><text x="26.0" y="183.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">一端读密码子、一端带氨基酸</text><text x="26.0" y="202.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">三叶草二级 / 倒 L 三级，3′-CCA</text><rect x="15.0" y="226.0" width="300.0" height="78.0" rx="7" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="26.0" y="247.0" text-anchor="start" font-size="14" font-weight="700" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">rRNA</text><text x="65.4" y="247.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">核糖体 RNA</text><text x="304.0" y="247.0" text-anchor="end" font-size="11.2" font-weight="400" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">占总量 约 80%</text><text x="26.0" y="267.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">构成核糖体，催化肽键形成</text><text x="26.0" y="286.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">核酶：肽酰转移酶活性由 rRNA 提供</text><rect x="15.0" y="310.0" width="300.0" height="134.0" rx="7" fill="#fef3c7" stroke="#cbd5e1" stroke-width="1.4"/><text x="25.0" y="329.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">tRNA 的三个必记数字</text><text x="25.0" y="347.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 二级结构三叶草：氨基酸臂、D 臂、</text><text x="25.0" y="363.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">反密码子臂、TψC 臂</text><text x="25.0" y="379.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 三级结构倒 L 形：反密码子与氨基酸臂相</text><text x="25.0" y="395.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">距约 7 nm</text><text x="25.0" y="411.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 3′ 端一律是 CCA-OH，氨基酸接在 A 的 3</text><text x="25.0" y="427.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">′-OH 上</text><rect x="15.0" y="452.0" width="300.0" height="76.0" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/><text x="25.0" y="468.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">易错：三叶草只是 tRNA 的二级结构，</text><text x="25.0" y="484.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">功能形态是倒 L 形</text><text x="25.0" y="500.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">核酶的存在说明「酶＝蛋白质」有例外——rRNA</text><text x="25.0" y="516.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"> 就是催化剂</text><rect x="11.0" y="533.0" width="308.0" height="51.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="165.0" y="548.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">mRNA 抄图纸、tRNA 搬砖、rRNA 是催化车间；</text><text x="165.0" y="563.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">tRNA 功能态是倒 L 形</text></svg>