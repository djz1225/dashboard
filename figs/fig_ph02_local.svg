<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 585" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="局部电位与动作电位"><title>局部电位与动作电位</title><desc>局部电位是等级性、可总和、电紧张性衰减扩布的局部反应；动作电位全或无、不衰减传导、因不应期不能叠加。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">局部电位与动作电位</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">五点区别：可大不可传 vs 可传不可叠</text><rect x="18.0" y="65.0" width="364.0" height="158.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="83.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">传导方式</text><text x="30.0" y="105.0" font-size="11" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">局部电位（衰减）</text><text x="148.0" y="105.0" font-size="11" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">动作电位（不衰减）</text><line x1="36.0" y1="119.0" x2="36.0" y2="193.0" stroke="#cbd8e4" stroke-width="1" stroke-linecap="round"/><line x1="36.0" y1="193.0" x2="306.0" y2="193.0" stroke="#cbd8e4" stroke-width="1" stroke-linecap="round"/><line x1="38.0" y1="135.0" x2="306.0" y2="135.0" stroke="#0f766e" stroke-width="2.2" stroke-linecap="round"/><polyline points="38.0,135.0 42.5,136.8 47.0,138.4 51.5,140.1 56.0,141.6 60.5,143.1 65.0,144.5 69.5,145.8 74.0,147.1 78.5,148.4 83.0,149.6 87.5,150.7 92.0,151.8 96.5,152.8 101.0,153.8 105.5,154.8 110.0,155.7 114.5,156.6 119.0,157.4 123.5,158.2 128.0,159.0 132.5,159.8 137.0,160.5 141.5,161.1 146.0,161.8 150.5,162.4 155.0,163.0 159.5,163.6 164.0,164.1 168.