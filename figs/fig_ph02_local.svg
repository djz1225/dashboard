<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 402" width="100%" style="max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px" role="img"><text x="165.0" y="22.6" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">局部电位与动作电位：五点区别</text><text x="165.0" y="43.0" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">最容易混的一对概念</text><rect x="15.0" y="60.0" width="300.0" height="26.0" rx="4" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/><text x="85.0" y="78.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">局部电位</text><text x="245.0" y="78.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">动作电位</text><rect x="15.0" y="86.0" width="300.0" height="29.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="21.0" y="104.5" text-anchor="start" font-size="13.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">幅度</text><text x="81.0" y="100.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">随刺激强度增大</text><text x="309.0" y="100.0" text-anchor="end" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">全或无</text><rect x="15.0" y="117.0" width="300.0" height="46.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="21.0" y="144.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">传导</text><text x="81.0" y="131.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">电紧张性扩布，</text><text x="81.0" y="148.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">随距离衰减</text><text x="309.0" y="131.0" text-anchor="end" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">不衰减，</text><text x="309.0" y="148.0" text-anchor="end" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">可远距离传导</text><rect x="15.0" y="165.0" width="300.0" height="29.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="21.0" y="183.5" text-anchor="start" font-size="13.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">总和</text><text x="81.0" y="179.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">可时间/空间总和</text><text x="309.0" y="179.0" text-anchor="end" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">不能总和</text><rect x="15.0" y="196.0" width="300.0" height="29.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="21.0" y="214.5" text-anchor="start" font-size="13.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">阈值</text><text x="81.0" y="210.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">无阈值</text><text x="309.0" y="210.0" text-anchor="end" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">需达阈电位</text><rect x="15.0" y="227.0" width="300.0" height="29.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="21.0" y="245.5" text-anchor="start" font-size="13.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">性质</text><text x="81.0" y="241.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">等级性反应</text><text x="309.0" y="241.0" text-anchor="end" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">再生性、全幅</text><rect x="15.0" y="264.0" width="300.0" height="76.0" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/><text x="25.0" y="280.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">记法：局部电位「可大不可传」，动作电位「</text><text x="25.0" y="296.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">可传不可叠」</text><text x="25.0" y="312.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">终板电位、感受器电位、突触后电位都是局部</text><text x="25.0" y="328.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">电位</text><rect x="11.0" y="343.0" width="308.0" height="51.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="165.0" y="358.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">局部电位：等级性、可总和、衰减传导；</text><text x="165.0" y="373.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">动作电位：全或无、不衰减</text></svg>