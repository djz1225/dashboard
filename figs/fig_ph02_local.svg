stemFont,'PingFang SC','Microsoft YaHei',sans-serif">可时间/空间总和</text><text x="215.6" y="408.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">不能总和（不应期）</text><line x1="18.0" y1="441.0" x2="334.0" y2="441.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="434.0" font-size="13" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">阈值</text><text x="89.2" y="434.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">无阈值</text><text x="215.6" y="434.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">需达阈电位</text><line x1="18.0" y1="467.0" x2="334.0" y2="467.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="460.0" font-size="13" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">性质</text><text x="89.2" y="460.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">局部、可大不可传</text><text x="215.6" y="460.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">再生性、可传不可叠</text><rect x="18.0" y="495.0" width="364.0" height="70.0" rx="8" fill="#eef2f7"/><rect x="18.0" y="495.0" width="3.5" height="70.0" rx="1.8" fill="#4a5a6b"/><text x="32.0" y="515.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="532.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">局部电位「可大不可传」：等级性、可总和、衰减；动作</text><text x="32.0" y="551.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">电位「可传不可叠」：全或无、不衰减、有不应期。</text></svg>