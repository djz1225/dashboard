<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 490" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="DNA 与 RNA 的化学区别"><title>DNA 与 RNA 的化学区别</title><desc>DNA 与 RNA 的三处化学差别在于五碳糖（2′-H vs 2′-OH）、嘧啶碱基（T vs U）与链结构（双链 vs 单链）；2′-OH 使 RNA 易水解却也能折叠成催化中心。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">DNA 与 RNA 的化学区别</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">2′-OH 决定一切：RNA 易水解所以当工具，DNA 稳定所以当硬盘</text><rect x="18.0" y="65.0" width="177.0" height="160.0" rx="9" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1.1"/><text x="29.0" y="86.0" font-size="12.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">DNA</text><text x="29.0" y="105.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">五碳糖：脱氧核糖（2′-H）</text><text x="29.0" y="125.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">嘧啶：C 与 T（胸腺嘧啶）</text><text x="29.0" y="145.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">链：双链双螺旋</text><text x="29.0" y="165.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">稳定性：高，2′-H 不</text><text x="29.0" y="181.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">参与水解</text><text x="29.0" y="201.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">功能：储存遗传信息</text><rect x="205.0" y="65.0" width="177.0" height="160.0" rx="9" fill="#f2ecfb" stroke="#7b4bb7" stroke-width="1.1"/><text x="216.0" y="86.0" font-size="12.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">RNA</text><text x="216.0" y="105.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">五碳糖：核糖（2′-OH）</text><text x="216.0" y="125.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">嘧啶：C 与 U（尿嘧啶）</text><text x="216.0" y="145.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">链：单链、局部折叠</text><text x="216.0" y="165.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">稳定性：低，2′-OH 可</text><text x="216.0" y="181.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">自水解</text><text x="216.0" y="201.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">功能：传递、翻译、催化</text><rect x="18.0" y="235.0" width="364.0" height="153.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="254.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">为什么 2′-OH 决定一切</text><rect x="30.0" y="265.0" width="3.0" height="15.0" rx="1.5" fill="#7b4bb7"/><text x="39.0" y="278.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">2′-OH 进攻磷酸二酯键</text><text x="370.0" y="278.0" text-anchor="end" font-size="12" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">易水解</text><text x="39.0" y="296.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">RNA 因此易自发降解，不适合长期存信息</text><rect x="30.0" y="307.0" width="3.0" height="15.0" rx="1.5" fill="#1f6fb2"/><text x="39.0" y="320.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">去掉 2′-OH 后极稳定</text><text x="370.0" y="320.0" text-anchor="end" font-size="12" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">适合硬盘</text><text x="39.0" y="338.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">DNA 因此被选作遗传物质</text><rect x="30.0" y="349.0" width="3.0" height="15.0" rx="1.5" fill="#0f766e"/><text x="39.0" y="362.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">2′-OH 也有好处</text><text x="370.0" y="362.0" text-anchor="end" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">能折叠</text><text x="39.0" y="380.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">多出的氢键让 RNA 折叠成催化中心（核酶）</text><rect x="18.0" y="400.0" width="364.0" height="70.0" rx="8" fill="#eef2f7"/><rect x="18.0" y="400.0" width="3.5" height="70.0" rx="1.8" fill="#4a5a6b"/><text x="32.0" y="420.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="437.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">DNA 靠 2′-H 稳定做硬盘；RNA 靠 2′-OH 折叠做工</text><text x="32.0" y="456.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">具——结构决定分工。</text></svg>