<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 554" width="100%" style="max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px" role="img"><text x="165.0" y="22.6" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">DNA 与 RNA 的三处化学差别</text><text x="165.0" y="43.0" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">2′-OH · 胸腺嘧啶/U · 双链/单链</text><rect x="15.0" y="58.0" width="300.0" height="52.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><text x="25.0" y="76.0" text-anchor="start" font-size="11.5" font-weight="700" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">五碳糖</text><text x="25.0" y="96.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">DNA：脱氧核糖（2′-H）</text><text x="305.0" y="96.0" text-anchor="end" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">RNA：核糖（2′-OH）</text><rect x="15.0" y="114.0" width="300.0" height="52.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><text x="25.0" y="132.0" text-anchor="start" font-size="11.5" font-weight="700" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">嘧啶碱基</text><text x="25.0" y="152.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">DNA：C、T（胸腺嘧啶）</text><text x="305.0" y="152.0" text-anchor="end" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">RNA：C、U（尿嘧啶）</text><rect x="15.0" y="170.0" width="300.0" height="52.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><text x="25.0" y="188.0" text-anchor="start" font-size="11.5" font-weight="700" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">链结构</text><text x="25.0" y="208.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">DNA：双链、双螺旋</text><text x="305.0" y="208.0" text-anchor="end" font-size="13.5" font-weight="400" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">RNA：单链、局部折叠</text><rect x="15.0" y="226.0" width="300.0" height="52.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><text x="25.0" y="244.0" text-anchor="start" font-size="11.5" font-weight="700" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">稳定性</text><text x="25.0" y="264.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">DNA：高（2′-H 不参与水解）</text><text x="305.0" y="264.0" text-anchor="end" font-size="13.5" font-weight="400" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">RNA：低（2′-OH 可自水解）</text><rect x="15.0" y="282.0" width="300.0" height="52.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><text x="25.0" y="300.0" text-anchor="start" font-size="11.5" font-weight="700" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">功能</text><text x="25.0" y="320.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">DNA：储存遗传信息</text><text x="305.0" y="320.0" text-anchor="end" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">RNA：传递/翻译/催化</text><rect x="15.0" y="338.0" width="300.0" height="150.0" rx="7" fill="#ccfbf1" stroke="#cbd5e1" stroke-width="1.4"/><text x="25.0" y="357.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">2′-OH 为什么决定一切</text><text x="25.0" y="375.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· RNA 的 2′-OH 可进攻自身磷酸二酯键 → R</text><text x="25.0" y="391.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">NA 易自发水解 → 不适合长期储存信息</text><text x="25.0" y="407.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· DNA 去掉 2′-OH 后极稳定 → 适合做「硬</text><text x="25.0" y="423.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">盘」；这也是为什么遗传物质是 DNA 而非 RN</text><text x="25.0" y="439.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">A</text><text x="25.0" y="455.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 但 2′-OH 也让 RNA 能形成更多氢键 → 可</text><text x="25.0" y="471.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">折叠成催化中心（核酶）</text><rect x="11.0" y="495.0" width="308.0" height="51.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="165.0" y="510.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">DNA 靠 2′-H 稳定做硬盘；RNA 靠 2′-OH 折</text><text x="165.0" y="525.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">叠做工具——结构决定分工</text></svg>