<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 554" width="100%" style="max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px" role="img"><text x="165.0" y="22.6" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">肾上腺：皮质三层 + 髓质</text><text x="165.0" y="43.0" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">三层各管一类激素，口诀：球盐、束糖、网性</text><rect x="15.0" y="60.0" width="300.0" height="42.0" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/><text x="27.0" y="80.0" text-anchor="start" font-size="14" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">球状带</text><text x="305.0" y="80.0" text-anchor="end" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">球盐</text><text x="27.0" y="97.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">盐皮质激素（醛固酮）——保钠排钾</text><rect x="15.0" y="108.0" width="300.0" height="42.0" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="27.0" y="128.0" text-anchor="start" font-size="14" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">束状带</text><text x="305.0" y="128.0" text-anchor="end" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">束糖</text><text x="27.0" y="145.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">糖皮质激素（皮质醇）——升糖抗炎</text><rect x="15.0" y="156.0" width="300.0" height="42.0" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/><text x="27.0" y="176.0" text-anchor="start" font-size="14" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">网状带</text><text x="305.0" y="176.0" text-anchor="end" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">网性</text><text x="27.0" y="193.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">性激素（雄激素为主）</text><rect x="15.0" y="204.0" width="300.0" height="44.0" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="27.0" y="224.0" text-anchor="start" font-size="14" font-weight="700" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">髓质</text><text x="305.0" y="224.0" text-anchor="end" font-size="13.5" font-weight="700" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">髓质</text><text x="27.0" y="241.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">肾上腺素 + 去甲肾上腺素（交感节后神经元</text><text x="27.0" y="257.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">）</text><rect x="15.0" y="258.0" width="300.0" height="118.0" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="25.0" y="277.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">糖皮质激素的「抗炎」双刃</text><text x="25.0" y="295.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 治疗量：抗炎、抗过敏、抗休克、抑制免疫</text><text x="25.0" y="311.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 但同时：升血糖、升血压、抑骨形成、</text><text x="25.0" y="327.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">抑免疫</text><text x="25.0" y="343.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 长期用：库欣样表现（满月脸、水牛背、</text><text x="25.0" y="359.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">骨质疏松、易感染）</text><rect x="15.0" y="384.0" width="300.0" height="108.0" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/><text x="25.0" y="400.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">调节差别：醛固酮主要受 RAAS 与血钾调节；</text><text x="25.0" y="416.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">皮质醇受 ACTH 调节</text><text x="25.0" y="432.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">应激时 CRH→ACTH→皮质醇急剧升高，是「允许</text><text x="25.0" y="448.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">作用」的基础</text><text x="25.0" y="464.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">嗜铬细胞瘤：髓质分泌大量儿茶酚胺 → 阵发性</text><text x="25.0" y="480.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">高血压</text><rect x="11.0" y="495.0" width="308.0" height="51.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="165.0" y="510.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">球盐、束糖、网性；醛固酮看 RAAS 与血钾，</text><text x="165.0" y="525.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">皮质醇看 ACTH</text></svg>