<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 573" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="脂肪酸合成 vs 分解：五处相反"><title>脂肪酸合成 vs 分解：五处相反</title><desc>脂肪酸合成在胞质以 ACP 为载体、用 NADPH 作还原剂、以丙二酰CoA 为二碳单位、从甲基端向羧基端延伸；β-氧化在线粒体基质以 CoA 为载体、产 FADH₂ 与 NADH、以乙酰CoA 为二碳单位、从羧基端向甲基端降解；合成限速酶为乙酰CoA 羧化酶，受柠檬酸激活、软脂酰CoA 抑制。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">脂肪酸合成 vs 分解：五处相反</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">场所、载体、二碳单位、还原剂、方向全都相反——记「相反」比</text><text x="18.0" y="68.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">记细节省力</text><rect x="18.0" y="82.0" width="364.0" height="26.0" rx="6" fill="#f8fbfd"/><text x="26.0" y="99.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">对比项</text><text x="106.1" y="99.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">合成</text><text x="251.7" y="99.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">分解（β-氧化）</text><line x1="18.0" y1="134.0" x2="382.0" y2="134.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="126.0" font-size="12.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">场所</text><text x="106.1" y="126.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胞质</text><text x="251.7" y="126.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">线粒体基质</text><line x1="18.0" y1="160.0" x2="382.0" y2="160.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="152.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">酰基载体</text><text x="106.1" y="152.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">ACP（酰基载体蛋白）</text><text x="251.7" y="152.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">CoA</text><line x1="18.0" y1="186.0" x2="382.0" y2="186.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="178.0" font-size="12.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">二碳单位</text><text x="106.1" y="178.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">丙二酰CoA（3C 供 2C）</text><text x="251.7" y="178.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">乙酰CoA（2C）</text><line x1="18.0" y1="212.0" x2="382.0" y2="212.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="204.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">氧化还原</text><text x="106.1" y="204.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">耗 NADPH</text><text x="251.7" y="204.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">产 FADH₂ 与 NADH</text><line x1="18.0" y1="238.0" x2="382.0" y2="238.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="230.0" font-size="12.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">方向</text><text x="106.1" y="230.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">从甲基端到羧基端</text><text x="251.7" y="230.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">从羧基端到甲基端</text><line x1="18.0" y1="264.0" x2="382.0" y2="264.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="256.0" font-size="12.5" font-weight="700" fill="#c1440e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">关键酶</text><text x="106.1" y="256.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">乙酰CoA 羧化酶（限速）</text><text x="251.7" y="256.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">CPT-Ⅰ（入口限速）</text><rect x="18.0" y="270.0" width="364.0" height="201.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="289.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">乙酰CoA 羧化酶</text><rect x="30.0" y="300.0" width="3.0" height="15.0" rx="1.5" fill="#c1440e"/><text x="39.0" y="313.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">为什么是限速酶</text><text x="370.0" y="313.0" text-anchor="end" font-size="12" font-weight="700" fill="#c1440e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">承诺步</text><text x="39.0" y="331.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">乙酰CoA + CO₂ + ATP → 丙二酰CoA，不可逆，</text><text x="39.0" y="347.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">是合成的承诺步</text><rect x="30.0" y="358.0" width="3.0" height="15.0" rx="1.5" fill="#0f766e"/><text x="39.0" y="371.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">别构调节</text><text x="370.0" y="371.0" text-anchor="end" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">柠檬酸 / 软脂酰CoA</text><text x="39.0" y="389.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">柠檬酸（碳充足）激活；软脂酰CoA</text><text x="39.0" y="405.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">（产物）抑制</text><rect x="30.0" y="416.0" width="3.0" height="15.0" rx="1.5" fill="#2f8f57"/><text x="39.0" y="429.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">共价调节</text><text x="370.0" y="429.0" text-anchor="end" font-size="12" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">激素开关</text><text x="39.0" y="447.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胰高血糖素 → 磷酸化失活；胰岛素 → 去</text><text x="39.0" y="463.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">磷酸化激活</text><rect x="18.0" y="483.0" width="364.0" height="70.0" rx="8" fill="#fef3c7"/><rect x="18.0" y="483.0" width="3.5" height="70.0" rx="1.8" fill="#b45309"/><text x="32.0" y="503.0" font-size="11.5" font-weight="700" fill="#b45309" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">易错</text><text x="32.0" y="520.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">合成用 NADPH（来自 PPP 与苹果酸酶），不是 NADH；</text><text x="32.0" y="539.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">丙二酰CoA 既供二碳、又抑制 CPT-Ⅰ，一物两用。</text></svg>