<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 533" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="酶促反应：只降活化能，不改平衡点"><title>酶促反应：只降活化能，不改平衡点</title><desc>酶通过降低反应活化能加快反应速度，但不改变 ΔG、平衡常数与产物终量，因此只能加速到达平衡，不能使热力学不允许的反应发生。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">酶促反应：只降活化能，不改平衡点</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">酶降低活化能 Ea → 反应更快；ΔG、平衡常数与产物终量</text><text x="18.0" y="68.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一律不变</text><line x1="18.0" y1="90.0" x2="32.0" y2="90.0" stroke="#4a5a6b" stroke-width="2.2" stroke-linecap="round"/><text x="37.0" y="94.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">无酶：Ea 高</text><line x1="117.0" y1="90.0" x2="131.0" y2="90.0" stroke="#c1440e" stroke-width="2.2" stroke-dasharray="5 3" stroke-linecap="round"/><text x="136.0" y="94.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">有酶：Ea 低</text><rect x="18.0" y="102.0" width="364.0" height="190.0" rx="9" fill="#ffffff" stroke="#e3eaf2" stroke-width="1.1"/><line x1="50.0" y1="233.2" x2="54.0" y2="233.2" stroke="#cbd8e4" stroke-width="1" stroke-linecap="round"/><text x="47.0" y="237.2" text-anchor="end" font-size="12" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">底物</text><line x1="54.0" y1="233.2" x2="370.0" y2="233.2" stroke="#f1f6fa" stroke-width="1" stroke-linecap="round"/><line x1="50.0" y