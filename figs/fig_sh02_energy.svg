<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 422" width="100%" style="max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px" role="img"><text x="165.0" y="22.6" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">酶只降活化能，不改平衡点</text><text x="165.0" y="43.0" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">ΔG 不变 → 产物终浓度不变，只是更快到达</text><rect x="23.0" y="58.0" width="284.0" height="150.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><path d="M57.480000000000004,151.0 C113.8,151.0 134.28,82.8 165.0,82.8 C195.72,82.8 216.2,164.2 272.52,164.2" fill="none" stroke="#b91c1c" stroke-width="2.2"/><path d="M57.480000000000004,151.0 C103.56,151.0 124.04,126.8 165.0,126.8 C205.96,126.8 226.44,164.2 272.52,164.2" fill="none" stroke="#0f766e" stroke-width="2.4"/><path d="M47.24,151.0 H282.76" stroke="#64748b" stroke-width="1" stroke-dasharray="3 3" opacity="0.7"/><path d="M47.24,164.2 H282.76" stroke="#64748b" stroke-width="1" stroke-dasharray="3 3" opacity="0.7"/><path d="M165.0,82.8 V151.0" stroke="#b91c1c" stroke-width="1.2" stroke-dasharray="2 2"/><path d="M165.0,126.8 V151.0" stroke="#0f766e" stroke-width="1.2" stroke-dasharray="2 2"/><text x="170.1" y="102.6" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">Ea 无酶</text><text x="221.3" y="142.2" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">Ea 有酶</text><text x="52.4" y="146.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">底物</text><text x="262.3" y="159.2" text-anchor="end" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">产物</text><rect x="15.0" y="216.0" width="146.0" height="58.0" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/><text x="88.0" y="235.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">酶改变的</text><text x="88.0" y="252.0" text-anchor="middle" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">活化能 Ea 降低 → </text><text x="88.0" y="266.0" text-anchor="middle" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">速度加快</text><rect x="169.0" y="216.0" width="146.0" height="58.0" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.4"/><text x="242.0" y="235.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">酶不改变的</text><text x="242.0" y="252.0" text-anchor="middle" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">ΔG、平衡常数、</text><text x="242.0" y="266.0" text-anchor="middle" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">产物终量</text><rect x="15.0" y="282.0" width="300.0" height="76.0" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/><text x="25.0" y="298.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">易错：酶不能让反应「更彻底」，只能让反应</text><text x="25.0" y="314.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">「更快到终点」</text><text x="25.0" y="330.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">同理，酶不能启动本来热力学不允许的反应（</text><text x="25.0" y="346.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">ΔG&gt;0 仍不发生）</text><rect x="11.0" y="363.0" width="308.0" height="51.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="165.0" y="378.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">酶降低活化能、不改变 ΔG；只加速到达平衡，</text><text x="165.0" y="393.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">不改变平衡点</text></svg>