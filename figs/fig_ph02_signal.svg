<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 499" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="跨膜信号转导：六类受体"><title>跨膜信号转导：六类受体</title><desc>离子通道型、G 蛋白耦联、酶联型、招募型、核受体与外泌体六类受体；膜受体反应快、核受体经基因转录起效慢。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">跨膜信号转导：六类受体</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">先问受体在哪，再问信号怎么往细胞内传</text><rect x="18.0" y="65.0" width="177.0" height="104.0" rx="9" fill="#fdeceb" stroke="#c0392b" stroke-width="1.1"/><text x="29.0" y="86.0" font-size="12.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">① 离子通道型</text><text x="29.0" y="105.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">受体即通道，配体结合后开放</text><text x="29.0" y="125.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">离子内流，毫秒级</text><text x="29.0" y="145.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">例：终板膜 N₂ 受体</text><rect x="205.0" y="65.0" width="177.0" height="104.0" rx="9" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1.1"/><text x="216.0" y="86.0" font-size="12.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">② G 蛋白耦联</text><text x="216.0" y="105.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">配体→G 蛋白→AC/PLC</text><text x="216.0" y="125.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">生成第二信使</text><text x="216.0" y="145.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">例：β 受体、M 受体</text><rect x="18.0" y="179.0" width="177.0" height="104.0" rx="9" fill="#e6f6ec" stroke="#2f8f57" stroke-width="1.1"/><text x="29.0" y="200.0" font-size="12.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">③ 酶联型</text><text x="29.0" y="219.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">受体自带酪氨酸激酶活性</text><text x="29.0" y="239.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">例：胰岛素、生长因子受体</text><rect x="205.0" y="179.0" width="177.0" height="104.0" rx="9" fill="#f2ecfb" stroke="#7b4bb7" stroke-width="1.1"/><text x="216.0" y="200.0" font-size="12.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">④ 招募型</text><text x="216.0" y="219.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">受体无酶活性，招募胞内激酶</text><text x="216.0" y="239.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">例：生长激素、催乳素、EPO</text><rect x="18.0" y="293.0" width="177.0" height="104.0" rx="9" fill="#fef3c7" stroke="#b45309" stroke-width="1.1"/><text x="29.0" y="314.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">⑤ 核受体</text><text x="29.0" y="333.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胞内/核内，调控基因转录</text><text x="29.0" y="353.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">小时级</text><text x="29.0" y="373.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">例：类固醇、甲状腺激素</text><rect x="205.0" y="293.0" width="177.0" height="104.0" rx="9" fill="#eef2f7" stroke="#4a5a6b" stroke-width="1.1"/><text x="216.0" y="314.0" font-size="12.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">⑥ 外泌体（10版新增）</text><text x="216.0" y="333.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">膜性小囊泡，携蛋白与核酸</text><text x="216.0" y="353.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">在细胞间传递，例免疫调节</text><rect x="18.0" y="409.0" width="364.0" height="70.0" rx="8" fill="#eef2f7"/><rect x="18.0" y="409.0" width="3.5" height="70.0" rx="1.8" fill="#4a5a6b"/><text x="32.0" y="429.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="446.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">受体在膜上＝快（通道 ms＞G 蛋白 s＞酶联 min）；</text><text x="32.0" y="465.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">受体在胞内＝慢（核受体，改基因表达）。</text></svg>