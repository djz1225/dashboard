<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 683" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="肝功能指标：各自反映什么"><title>肝功能指标：各自反映什么</title><desc>ALT 主要存在于肝细胞胞质，最敏感地反映肝细胞损伤；AST 部分来自线粒体，重型肝炎时 AST&gt;ALT 提示线粒体广泛损伤。ALP 与 GGT 升高反映胆道梗阻与胆汁淤积（GGT 更特异）。白蛋白（35~55 g/L，半衰期约 20 天）与凝血酶原时间反映肝合成功能，其中因子Ⅶ 半衰期仅 4~6 h，PT/INR 是最早、最敏感的急性合成功能指标。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肝功能指标：各自反映什么</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">ALT 看损伤、ALP/GGT 看胆道、白蛋白与 PT 看合成；急性功能</text><text x="18.0" y="68.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">首选 PT</text><rect x="18.0" y="82.0" width="364.0" height="26.0" rx="6" fill="#f8fbfd"/><text x="26.0" y="99.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">指标</text><text x="120.6" y="99.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">反映</text><text x="244.4" y="99.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">关键数值 / 敏感度</text><line x1="18.0" y1="150.0" x2="382.0" y2="150.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="126.0" font-size="12.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">ALT</text><text x="120.6" y="126.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肝细胞损伤（胞质）</text><text x="244.4" y="126.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">最敏感，轻度损伤</text><text x="244.4" y="142.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">即升高</text><line x1="18.0" y1="192.0" x2="382.0" y2="192.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="168.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">AST</text><text x="120.6" y="168.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肝细胞损伤</text><text x="120.6" y="184.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">（线粒体）</text><text x="244.4" y="168.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">重型肝炎 AST&gt;ALT 提</text><text x="244.4" y="184.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">示线粒体损伤</text><line x1="18.0" y1="234.0" x2="382.0" y2="234.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="210.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">ALP / GGT</text><text x="120.6" y="210.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胆道梗阻、胆</text><text x="120.6" y="226.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">汁淤积</text><text x="244.4" y="210.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">GGT 更特异地反映胆道；</text><text x="244.4" y="226.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">ALP 也来自骨</text><line x1="18.0" y1="276.0" x2="382.0" y2="276.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="252.0" font-size="12.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">白蛋白</text><text x="120.6" y="252.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肝合成功能（慢性）</text><text x="244.4" y="252.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">35~55 g/L，半衰期约</text><text x="244.4" y="268.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">20 天</text><line x1="18.0" y1="334.0" x2="382.0" y2="334.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="294.0" font-size="12.5" font-weight="700" fill="#c1440e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">PT / INR</text><text x="120.6" y="294.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肝合成功能（急性）</text><text x="244.4" y="294.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">凝血酶原时间；因子Ⅶ</text><text x="244.4" y="310.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">半衰期 4~6 h，最</text><text x="244.4" y="326.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">先变化</text><line x1="18.0" y1="376.0" x2="382.0" y2="376.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="352.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胆红素</text><text x="120.6" y="352.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">摄取 / 结合 /</text><text x="120.6" y="368.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"> 排泄</text><text x="244.4" y="352.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">升高提示处理能力下降，</text><text x="244.4" y="368.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">但不特异</text><rect x="18.0" y="384.0" width="364.0" height="197.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="403.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">三条判断线</text><rect x="30.0" y="414.0" width="3.0" height="15.0" rx="1.5" fill="#c1440e"/><text x="39.0" y="427.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">急性功能</text><text x="362.0" y="427.0" text-anchor="end" font-size="12" font-weight="700" fill="#c1440e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">看 PT / INR</text><text x="39.0" y="445.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">因子Ⅶ 半衰期最短 → PT 最先延长；白</text><text x="39.0" y="461.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">蛋白半衰期长，早期可正常</text><rect x="30.0" y="470.0" width="3.0" height="15.0" rx="1.5" fill="#0f766e"/><text x="39.0" y="483.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胆道梗阻</text><text x="362.0" y="483.0" text-anchor="end" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">看 ALP / GGT</text><text x="39.0" y="501.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">两者同时明显升高提示胆汁淤积，而非单</text><text x="39.0" y="517.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">纯肝细胞损伤</text><rect x="30.0" y="526.0" width="3.0" height="15.0" rx="1.5" fill="#1f6fb2"/><text x="39.0" y="539.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">慢性肝病</text><text x="362.0" y="539.0" text-anchor="end" font-size="12" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">看白蛋白</text><text x="39.0" y="557.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">半衰期约 20 天，反映一段时间的合成总</text><text x="39.0" y="573.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">量与储备</text><rect x="18.0" y="593.0" width="364.0" height="70.0" rx="8" fill="#fef3c7"/><rect x="18.0" y="593.0" width="3.5" height="70.0" rx="1.8" fill="#b45309"/><text x="32.0" y="613.0" font-size="11.5" font-weight="700" fill="#b45309" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">易错</text><text x="32.0" y="630.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">别只看 ALT：ALT 只说明「有损伤」，不说明「功能好</text><text x="32.0" y="649.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">坏」；功能看白蛋白与 PT。</text></svg>