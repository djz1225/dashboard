<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 719" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="血糖稳态：一个降糖、五个升糖"><title>血糖稳态：一个降糖、五个升糖</title><desc>胰岛素促葡萄糖摄取（GLUT4）、促糖原脂肪蛋白合成、抑糖异生、促 K⁺ 入细胞；升糖激素有胰高血糖素、肾上腺素、糖皮质激素、生长激素；血糖升高是最强刺激，并有肠促胰岛素效应。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">血糖稳态：一个降糖、五个升糖</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胰岛素是唯一降糖激素</text><rect x="18.0" y="65.0" width="364.0" height="184.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="83.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胰岛素的四条作用</text><rect x="31.0" y="93.0" width="3.0" height="15.0" rx="1.5" fill="#0f766e"/><text x="40.0" y="106.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">促摄取</text><text x="344.0" y="106.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">GLUT4 转位</text><text x="40.0" y="124.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肌肉、脂肪摄取葡萄糖↑（脑不依赖胰岛素）</text><rect x="31.0" y="132.0" width="3.0" height="15.0" rx="1.5" fill="#2f8f57"/><text x="40.0" y="145.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">促合成</text><text x="344.0" y="145.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">糖原/脂肪/蛋白</text><text x="40.0" y="163.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">促糖原、脂肪、蛋白合成，抑制其分解</text><rect x="31.0" y="171.0" width="3.0" height="15.0" rx="1.5" fill="#1f6fb2"/><text x="40.0" y="184.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">抑异生</text><text x="344.0" y="184.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肝糖输出↓</text><text x="40.0" y="202.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">抑制糖异生与糖原分解 → 空腹血糖↓</text><rect x="31.0" y="210.0" width="3.0" height="15.0" rx="1.5" fill="#7b4bb7"/><text x="40.0" y="223.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">保钾</text><text x="344.0" y="223.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">K⁺ 入细胞</text><text x="40.0" y="241.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">与葡萄糖同用可纠正高钾（胰岛素＋葡萄糖）</text><rect x="18.0" y="261.0" width="364.0" height="23.0" rx="6" fill="#e2f5f2"/><text x="25.0" y="277.0" font-size="11" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">升糖激素</text><text x="141.5" y="277.0" font-size="11" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">机制</text><text x="243.4" y="277.0" font-size="11" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><line x1="18.0" y1="325.0" x2="382.0" y2="325.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="25.0" y="302.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胰高血糖素（</text><text x="25.0" y="318.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">α 细胞）</text><text x="141.5" y="302.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">糖原分解＋</text><text x="141.5" y="318.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">糖异生</text><text x="243.4" y="302.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">最强升糖激素，血糖低时</text><text x="243.4" y="318.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">首当其冲</text><line x1="18.0" y1="366.0" x2="382.0" y2="366.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="25.0" y="343.0" font-size="12.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肾上腺素</text><text x="141.5" y="343.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">糖原分解</text><text x="243.4" y="343.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">应激、低血糖时的快</text><text x="243.4" y="359.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">速升糖</text><line x1="18.0" y1="407.0" x2="382.0" y2="407.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="25.0" y="384.0" font-size="12.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">糖皮质激素</text><text x="141.5" y="384.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">糖异生、抗</text><text x="141.5" y="400.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胰岛素</text><text x="243.4" y="384.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">升糖且抑制外周利用</text><line x1="18.0" y1="448.0" x2="382.0" y2="448.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="25.0" y="425.0" font-size="12.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">生长激素</text><text x="141.5" y="425.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">抗胰岛素</text><text x="243.4" y="425.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">长期过量 → 血糖↑（巨</text><text x="243.4" y="441.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">人症可继发糖尿病）</text><rect x="18.0" y="456.0" width="364.0" height="161.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="474.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胰岛素分泌的调节</text><rect x="31.0" y="484.0" width="3.0" height="15.0" rx="1.5" fill="#0f766e"/><text x="40.0" y="497.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">血糖</text><text x="344.0" y="497.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">最强刺激</text><text x="40.0" y="515.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">血糖升高直接刺激 β 细胞；口服葡萄糖＞静脉（肠促</text><text x="40.0" y="531.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胰岛素效应）</text><rect x="31.0" y="539.0" width="3.0" height="15.0" rx="1.5" fill="#2f8f57"/><text x="40.0" y="552.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肠促胰岛素</text><text x="344.0" y="552.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">GLP-1 / GIP</text><text x="40.0" y="570.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">进食后提前放大分泌，为「头期」准备</text><rect x="31.0" y="578.0" width="3.0" height="15.0" rx="1.5" fill="#1f6fb2"/><text x="40.0" y="591.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">神经与激素</text><text x="344.0" y="591.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">迷走促、交感 α₂ 抑</text><text x="40.0" y="609.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">氨基酸、脂肪酸、酮体也可刺激分泌</text><rect x="18.0" y="629.0" width="364.0" height="70.0" rx="8" fill="#eef2f7"/><rect x="18.0" y="629.0" width="3.5" height="70.0" rx="1.8" fill="#4a5a6b"/><text x="32.0" y="649.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="666.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胰岛素绝对不足 → 脂肪大量分解 → 酮体堆积 → 糖</text><text x="32.0" y="685.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">尿病酮症酸中毒；胰岛素是唯一降糖激素。</text></svg>