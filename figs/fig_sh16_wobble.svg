<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 686" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="摆动配对：第三位放松"><title>摆动配对：第三位放松</title><desc>摆动配对指反密码子第 1 位与密码子第 3 位的配对不严格：G 可配 C 或 U，C 只配 G，A 只配 U，U 可配 A 或 G，次黄嘌呤 I 可配 U、C、A 三种。前两位严格配对保证识别特异性，第三位放松使约 30 余种 tRNA 即可覆盖全部 61 个密码子，代价是第三位突变多为同义突变 —— 这正是简并性的物理基础。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">摆动配对：第三位放松</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">反密码子第 1 位配密码子第 3 位；I 最松，一种 tRNA 可读三</text><text x="18.0" y="68.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">个密码子</text><rect x="18.0" y="82.0" width="364.0" height="166.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="101.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">配对示意</text><text x="30.0" y="126.0" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">密码子</text><text x="30.0" y="138.0" font-size="11.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">5′ → 3′</text><line x1="96.0" y1="138.0" x2="356.0" y2="138.0" stroke="#0f766e" stroke-width="2" stroke-linecap="round"/><text x="139.3" y="132.0" text-anchor="middle" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">G</text><text x="226.0" y="132.0" text-anchor="middle" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">C</text><text x="312.7" y="132.0" text-anchor="middle" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">A</text><line x1="139.3" y1="140.0" x2="139.3" y2="160.0" stroke="#cbd8e4" stroke-width="1.3" stroke-linecap="round"/><line x1="226.0" y1="140.0" x2="226.0" y2="160.0" stroke="#cbd8e4" stroke-width="1.3" stroke-linecap="round"/><line x1="312.7" y1="140.0" x2="312.7" y2="160.0" stroke="#2f8f57" stroke-width="1.8" stroke-dasharray="3 3" stroke-linecap="round"/><text x="312.7" y="144.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">松</text><line x1="96.0" y1="162.0" x2="356.0" y2="162.0" stroke="#7b4bb7" stroke-width="2" stroke-linecap="round"/><text x="139.3" y="176.0" text-anchor="middle" font-size="12" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">C</text><text x="226.0" y="176.0" text-anchor="middle" font-size="12" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">G</text><text x="312.7" y="176.0" text-anchor="middle" font-size="12" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">I</text><text x="30.0" y="176.0" font-size="11.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">反密码子</text><text x="30.0" y="188.0" font-size="11.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">3′ → 5′</text><text x="30.0" y="206.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">前两位严格配对（A-U、G-C），第三位可以「摆一摆」；I（</text><text x="30.0" y="223.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">次黄嘌呤）由 A 脱氨生成，可读 U、C、A 三个密码子。</text><rect x="18.0" y="260.0" width="364.0" height="26.0" rx="6" fill="#f8fbfd"/><text x="26.0" y="277.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">反密码子第 1 位</text><text x="149.8" y="277.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">可配密码子第 3 位</text><text x="280.8" y="277.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">严格度</text><line x1="18.0" y1="312.0" x2="382.0" y2="312.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="304.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">G</text><text x="149.8" y="304.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">C 或 U</text><text x="280.8" y="304.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">较严</text><line x1="18.0" y1="338.0" x2="382.0" y2="338.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="330.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">C</text><text x="149.8" y="330.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">G</text><text x="280.8" y="330.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">严格</text><line x1="18.0" y1="364.0" x2="382.0" y2="364.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="356.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">A</text><text x="149.8" y="356.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">U</text><text x="280.8" y="356.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">严格</text><line x1="18.0" y1="390.0" x2="382.0" y2="390.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="382.0" font-size="12.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">U</text><text x="149.8" y="382.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">A 或 G</text><text x="280.8" y="382.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">放松</text><line x1="18.0" y1="416.0" x2="382.0" y2="416.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="408.0" font-size="12.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">I（次黄嘌呤）</text><text x="149.8" y="408.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">U、C、A</text><text x="280.8" y="408.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">最松，一读三</text><rect x="18.0" y="421.0" width="364.0" height="163.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="440.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">为什么需要摆动</text><rect x="30.0" y="451.0" width="3.0" height="15.0" rx="1.5" fill="#4a5a6b"/><text x="39.0" y="464.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一对一太贵</text><text x="362.0" y="464.0" text-anchor="end" font-size="12" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">需 61 种</text><text x="39.0" y="482.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">若每个密码子各配一种 tRNA，代价过高</text><rect x="30.0" y="490.0" width="3.0" height="15.0" rx="1.5" fill="#0f766e"/><text x="39.0" y="503.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">摆动后够用</text><text x="362.0" y="503.0" text-anchor="end" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">约 30 余种</text><text x="39.0" y="521.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">30 余种 tRNA 即可覆盖 61 个密码子</text><rect x="30.0" y="529.0" width="3.0" height="15.0" rx="1.5" fill="#0f766e"/><text x="39.0" y="542.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">代价是同义突变</text><text x="362.0" y="542.0" text-anchor="end" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">简并的物理基础</text><text x="39.0" y="560.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">第三位突变常不改变氨基酸 → 蛋</text><text x="39.0" y="576.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">白仍正常</text><rect x="18.0" y="596.0" width="364.0" height="70.0" rx="8" fill="#fef3c7"/><rect x="18.0" y="596.0" width="3.5" height="70.0" rx="1.8" fill="#b45309"/><text x="32.0" y="616.0" font-size="11.5" font-weight="700" fill="#b45309" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">易错</text><text x="32.0" y="633.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">位置不要颠倒：摆动发生在「反密码子第 1 位」与「密</text><text x="32.0" y="652.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">码子第 3 位」。</text></svg>