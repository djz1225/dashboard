<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 496" width="100%" style="max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px" role="img"><text x="165.0" y="22.6" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">尿生成的调节：三条主线</text><text x="165.0" y="43.0" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">神经、体液、自身调节各管一段</text><rect x="15.0" y="60.0" width="300.0" height="72.0" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.4"/><text x="24.0" y="79.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">交感神经</text><text x="24.0" y="96.0" text-anchor="start" font-size="13" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">入球小动脉收缩（α₁）→ 肾血流↓、滤过↓；</text><text x="24.0" y="112.0" text-anchor="start" font-size="13" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">促肾素释放</text><text x="24.0" y="128.0" text-anchor="start" font-size="13" font-weight="600" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">血容量不足时保钠保水</text><rect x="15.0" y="138.0" width="300.0" height="56.0" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/><text x="24.0" y="157.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">抗利尿激素 ADH</text><text x="24.0" y="174.0" text-anchor="start" font-size="13" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">集合管 AQP2↑ → 水重吸收↑ → 尿少而浓</text><text x="24.0" y="190.0" text-anchor="start" font-size="13" font-weight="600" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">血浆晶体渗透压↑ 时释放（最重要刺激）</text><rect x="15.0" y="200.0" width="300.0" height="56.0" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/><text x="24.0" y="219.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">醛固酮</text><text x="24.0" y="236.0" text-anchor="start" font-size="13" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">远曲小管/集合管保 Na⁺ 排 K⁺ → 水随钠保留</text><text x="24.0" y="252.0" text-anchor="start" font-size="13" font-weight="600" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">受 RAAS 与血 K⁺ 调节</text><rect x="15.0" y="262.0" width="300.0" height="72.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/><text x="24.0" y="281.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">心房钠尿肽 ANP</text><text x="24.0" y="298.0" text-anchor="start" font-size="13" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">入球舒张、出球收缩 → 滤过↑；抑制肾素与醛固</text><text x="24.0" y="314.0" text-anchor="start" font-size="13" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">酮</text><text x="24.0" y="330.0" text-anchor="start" font-size="13" font-weight="600" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">血容量↑ 时释放，促排钠排水</text><rect x="15.0" y="342.0" width="300.0" height="92.0" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/><text x="25.0" y="358.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">ADH 释放的最重要刺激是「血浆晶体渗透压升</text><text x="25.0" y="374.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">高」，不是血压下降（后者次要）</text><text x="25.0" y="390.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">大量出汗 → 血浆晶体渗透压↑ → ADH↑ → 尿</text><text x="25.0" y="406.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">少；大量失血 → 血压↓ → ADH 也↑</text><text x="25.0" y="422.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">ANP 与 RAAS 方向相反，共同维持血容量稳定</text><rect x="11.0" y="437.0" width="308.0" height="51.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="165.0" y="452.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">ADH 管水（晶体渗透压驱动）、醛固酮管钠（</text><text x="165.0" y="467.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">RAAS驱动）、ANP 反向排钠</text></svg>