<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 576" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="miRNA 与 siRNA"><title>miRNA 与 siRNA</title><desc>miRNA 与 siRNA 都装配进 RISC 复合体起作用，区别在配对程度：miRNA 由内源基因组编码，与靶 mRNA 部分互补（多结合 3′UTR），主要抑制翻译，只需 6~8 nt 的种子序列配对即可识别，故一个 miRNA 可调控上百个靶基因，是网络式调控；siRNA 来自外源病毒、转座子或内源，与靶 mRNA 完全互补，由 Ago 直接切割降解，通常高度特异。部分互补抑制翻译、完全互补切割降解，是两者的本质差别。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">miRNA 与 siRNA</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">部分互补 → 抑制翻译（一管多）；完全互补 → 切割降解</text><text x="18.0" y="68.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">（高特异）</text><rect x="18.0" y="82.0" width="364.0" height="206.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="101.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">配对方式决定机制</text><text x="30.0" y="122.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">miRNA：5′ 端 6~8 nt 种子序列配对，中段鼓起，3′ </text><text x="30.0" y="138.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">端部分配对</text><line x1="30.0" y1="148.0" x2="354.0" y2="148.0" stroke="#7b4bb7" stroke-width="1.9" stroke-linecap="round"/><line x1="30.0" y1="163.0" x2="354.0" y2="163.0" stroke="#0f766e" stroke-width="1.9" stroke-linecap="round"/><line x1="43.5" y1="149.5" x2="43.5" y2="161.5" stroke="#cbd8e4" stroke-width="1.3" stroke-linecap="round"/><line x1="70.5" y1="149.5" x2="70.5" y2="161.5" stroke="#cbd8e4" stroke-width="1.3" stroke-linecap="round"/><line x1="97.5" y1="149.5" x2="97.5" y2="161.5" stroke="#cbd8e4" stroke-width="1.3" stroke-linecap="round"/><line x1="124.5" y1="149.5" x2="124.5" y2="161.5" stroke="#cbd8e4" stroke-width="1.3" stroke-linecap="round"/><line x1="205.5" y1="149.5" x2="205.5" y2="161.5" stroke="#cbd8e4" stroke-width="1.3" stroke-linecap="round"/><line x1="232.5" y1="149.5" x2="232.5" y2="161.5" stroke="#cbd8e4" stroke-width="1.3" stroke-linecap="round"/><line x1="313.5" y1="149.5" x2="313.5" y2="161.5" stroke="#cbd8e4" stroke-width="1.3" stroke-linecap="round"/><line x1="340.5" y1="149.5" x2="340.5" y2="161.5" stroke="#cbd8e4" stroke-width="1.3" stroke-linecap="round"/><text x="30.0" y="177.0" font-size="11.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">miRNA</text><text x="354.0" y="177.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">mRNA</text><text x="30.0" y="197.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">siRNA：与靶 mRNA 完全互补，配对无鼓起 → 直接被切割</text><line x1="30.0" y1="205.0" x2="354.0" y2="205.0" stroke="#c1440e" stroke-width="1.9" stroke-linecap="round"/><line x1="30.0" y1="220.0" x2="354.0" y2="220.0" stroke="#0f766e" stroke-width="1.9" stroke-linecap="round"/><line x1="43.5" y1="206.5" x2="43.5" y2="218.5" stroke="#cbd8e4" stroke-width="1.3" stroke-linecap="round"/><line x1="70.5" y1="206.5" x2="70.5" y2="218.5" stroke="#cbd8e4" stroke-width="1.3" stroke-linecap="round"/><line x1="97.5" y1="206.5" x2="97.5" y2="218.5" stroke="#cbd8e4" stroke-width="1.3" stroke-linecap="round"/><line x1="124.5" y1="206.5" x2="124.5" y2="218.5" stroke="#cbd8e4" stroke-width="1.3" stroke-linecap="round"/><line x1="151.5" y1="206.5" x2="151.5" y2="218.5" stroke="#cbd8e4" stroke-width="1.3" stroke-linecap="round"/><line x1="178.5" y1="206.5" x2="178.5" y2="218.5" stroke="#cbd8e4" stroke-width="1.3" stroke-linecap="round"/><line x1="205.5" y1="206.5" x2="205.5" y2="218.5" stroke="#cbd8e4" stroke-width="1.3" stroke-linecap="round"/><line x1="232.5" y1="206.5" x2="232.5" y2="218.5" stroke="#cbd8e4" stroke-width="1.3" stroke-linecap="round"/><line x1="259.5" y1="206.5" x2="259.5" y2="218.5" stroke="#cbd8e4" stroke-width="1.3" stroke-linecap="round"/><line x1="286.5" y1="206.5" x2="286.5" y2="218.5" stroke="#cbd8e4" stroke-width="1.3" stroke-linecap="round"/><line x1="313.5" y1="206.5" x2="313.5" y2="218.5" stroke="#cbd8e4" stroke-width="1.3" stroke-linecap="round"/><line x1="340.5" y1="206.5" x2="340.5" y2="218.5" stroke="#cbd8e4" stroke-width="1.3" stroke-linecap="round"/><text x="30.0" y="234.0" font-size="11.5" font-weight="700" fill="#c1440e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">siRNA</text><text x="354.0" y="234.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">mRNA</text><text x="30.0" y="246.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">两者都装配进 RISC 复合体，由 Ago 蛋白执行；差别在配对是</text><text x="30.0" y="263.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">否完美，决定了「抑制翻译」还是「直接切割」。</text><rect x="18.0" y="300.0" width="364.0" height="26.0" rx="6" fill="#f8fbfd"/><text x="26.0" y="317.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">对比项</text><text x="106.1" y="317.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">miRNA</text><text x="259.0" y="317.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">siRNA</text><line x1="18.0" y1="368.0" x2="382.0" y2="368.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="344.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">来源</text><text x="106.1" y="344.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">内源基因组编码</text><text x="259.0" y="344.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">外源（病毒、转座子）</text><text x="259.0" y="360.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">或内源</text><line x1="18.0" y1="394.0" x2="382.0" y2="394.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="386.0" font-size="12.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">与靶mRNA</text><text x="106.1" y="386.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">部分互补，多结合3′UTR</text><text x="259.0" y="386.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">完全互补</text><line x1="18.0" y1="420.0" x2="382.0" y2="420.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="412.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">主要作用</text><text x="106.1" y="412.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">抑制翻译（部分降解）</text><text x="259.0" y="412.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">直接切割降解 mRNA</text><line x1="18.0" y1="462.0" x2="382.0" y2="462.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="438.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">靶向数量</text><text x="106.1" y="438.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一个可调多个靶（网络式）</text><text x="259.0" y="438.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">通常高度特异（</text><text x="259.0" y="454.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">狙击式）</text><rect x="18.0" y="467.0" width="364.0" height="89.0" rx="8" fill="#eef2f7"/><rect x="18.0" y="467.0" width="3.5" height="89.0" rx="1.8" fill="#4a5a6b"/><text x="32.0" y="487.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="504.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">不要认为两者机制完全不同：都经 RISC 复合体起作用；</text><text x="32.0" y="523.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">miRNA 一管多靠的是 6~8 nt 种子序列，代价是精</text><text x="32.0" y="542.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">确性下降。</text></svg>