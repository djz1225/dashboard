<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 499" width="100%" style="max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px" role="img"><text x="165.0" y="22.6" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">缺乏症一一对应</text><text x="165.0" y="43.0" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">脂溶性看四个病，水溶性看四个病</text><rect x="15.0" y="58.0" width="146.5" height="75.0" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.3"/><text x="24.0" y="76.0" text-anchor="start" font-size="12.2" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">A 缺乏</text><text x="24.0" y="93.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">夜盲、干眼症、角膜软化（</text><text x="24.0" y="108.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">视紫红质合成不足）</text><rect x="168.5" y="58.0" width="146.5" height="75.0" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.3"/><text x="177.5" y="76.0" text-anchor="start" font-size="12.2" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">D 缺乏</text><text x="177.5" y="93.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">佝偻病（儿童）、</text><text x="177.5" y="108.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">骨软化症（成人）、</text><text x="177.5" y="123.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">手足搐搦</text><rect x="15.0" y="140.0" width="146.5" height="75.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.3"/><text x="24.0" y="158.0" text-anchor="start" font-size="12.2" font-weight="700" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">E 缺乏</text><text x="24.0" y="175.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">溶血性贫血（红细胞膜脂</text><text x="24.0" y="190.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">质过氧化）、神经病变</text><rect x="168.5" y="140.0" width="146.5" height="75.0" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.3"/><text x="177.5" y="158.0" text-anchor="start" font-size="12.2" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">K 缺乏</text><text x="177.5" y="175.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">凝血因子Ⅱ Ⅶ Ⅸ Ⅹ 活化</text><text x="177.5" y="190.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">障碍 → 出血（新生儿出</text><text x="177.5" y="205.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">血症）</text><rect x="15.0" y="224.0" width="146.5" height="60.0" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.3"/><text x="24.0" y="242.0" text-anchor="start" font-size="12.2" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">B₁ 缺乏</text><text x="24.0" y="259.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">脚气病（干性/湿性）、</text><text x="24.0" y="274.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">Wernicke 脑病</text><rect x="168.5" y="224.0" width="146.5" height="60.0" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.3"/><text x="177.5" y="242.0" text-anchor="start" font-size="12.2" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">PP 缺乏</text><text x="177.5" y="259.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">癞皮病「三 D」：皮炎、</text><text x="177.5" y="274.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">腹泻、痴呆</text><rect x="15.0" y="291.0" width="146.5" height="75.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.3"/><text x="24.0" y="309.0" text-anchor="start" font-size="12.2" font-weight="700" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">叶酸/B₁₂ 缺乏</text><text x="24.0" y="326.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">巨幼细胞贫血；B₁₂ 还致</text><text x="24.0" y="341.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">亚急性联合变性</text><rect x="168.5" y="291.0" width="146.5" height="75.0" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.3"/><text x="177.5" y="309.0" text-anchor="start" font-size="12.2" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">C 缺乏</text><text x="177.5" y="326.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">坏血病：牙龈出血、</text><text x="177.5" y="341.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">伤口不愈、毛细血管脆性</text><text x="177.5" y="356.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">增加</text><rect x="15.0" y="375.0" width="300.0" height="60.0" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/><text x="25.0" y="391.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">B₁₂ 缺乏的神经症状（亚急性联合变性）叶酸</text><text x="25.0" y="407.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">不能纠正，反而掩盖贫血</text><text x="25.0" y="423.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">所以巨幼贫必须先查 B₁₂ 再用叶酸</text><rect x="11.0" y="440.0" width="308.0" height="51.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="165.0" y="455.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">A 夜盲、D 佝偻、E 溶血、K 出血；B₁ 脚气、</text><text x="165.0" y="470.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">PP 三 D、叶酸 B₁₂ 巨幼贫、C 坏血病</text></svg>