<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 522" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="酶的三种调节：秒级 / 分钟级 / 一次性"><title>酶的三种调节：秒级 / 分钟级 / 一次性</title><desc>别构调节经效应物结合调节亚基改变构象，秒级；共价修饰靠磷酸化级联放大，分钟级；酶原激活靠肽键有限水解，一次性且不可逆。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">酶的三种调节：秒级 / 分钟级 / 一次性</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">别构秒级微调、共价修饰分钟级放大、酶原激活一次性开关</text><rect x="18.0" y="65.0" width="123.8" height="26.0" rx="3" fill="#e2f5f2" stroke="#0f766e" stroke-width="1"/><text x="79.9" y="82.0" text-anchor="middle" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">别构 秒级</text><rect x="141.8" y="65.0" width="120.1" height="26.0" rx="3" fill="#fde8dd" stroke="#c1440e" stroke-width="1"/><text x="201.8" y="82.0" text-anchor="middle" font-size="12" font-weight="700" fill="#c1440e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">共价修饰 分钟级</text><rect x="261.9" y="65.0" width="120.1" height="26.0" rx="3" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1"/><text x="321.9" y="82.0" text-anchor="middle" font-size="12" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">酶原激活 一次性</text><rect x="18.0" y="105.0" width="364.0" height="203.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="124.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">三条路线</text><rect x="30.0" y="135.0" width="3.0" height="15.0" rx="1.5" fill="#0f766e"/><text x="39.0" y="148.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">别构调节</text><text x="370.0" y="148.0" text-anchor="end" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">秒级</text><text x="39.0" y="166.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">效应物结合调节亚基 → 构象改变 → S 形曲线，</text><text x="39.0" y="182.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">不遵守米氏方程（例：ATP 抑制 PFK-1）</text><rect x="30.0" y="194.0" width="3.0" height="15.0" rx="1.5" fill="#c1440e"/><text x="39.0" y="207.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">共价修饰</text><text x="370.0" y="207.0" text-anchor="end" font-size="12" font-weight="700" fill="#c1440e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">分钟级</text><text x="39.0" y="225.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">磷酸化 / 去磷酸化（也可腺苷化）→ 级联放大，</text><text x="39.0" y="241.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一个激酶管很多酶（例：激素信号转导）</text><rect x="30.0" y="253.0" width="3.0" height="15.0" rx="1.5" fill="#1f6fb2"/><text x="39.0" y="266.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">酶原激活</text><text x="370.0" y="266.0" text-anchor="end" font-size="12" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一次性</text><text x="39.0" y="284.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肽键有限水解、去掉一段肽 → 不可逆、改变一级</text><text x="39.0" y="300.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">结构（例：胰蛋白酶原、胃蛋白酶原、凝血因子）</text><rect x="18.0" y="320.0" width="177.0" height="100.0" rx="9" fill="#fef3c7" stroke="#b45309" stroke-width="1.1"/><text x="29.0" y="341.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">酶原激活＝水解</text><text x="29.0" y="360.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">本质是肽键断裂，不是</text><text x="29.0" y="376.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">构象改变</text><text x="29.0" y="396.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">所以不可逆、只发生一次</text><rect x="205.0" y="320.0" width="177.0" height="100.0" rx="9" fill="#e6f6ec" stroke="#2f8f57" stroke-width="1.1"/><text x="216.0" y="341.0" font-size="12.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">保护意义</text><text x="216.0" y="360.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">消化酶若以活性形式合成</text><text x="216.0" y="380.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胰腺会自身消化（急性</text><text x="216.0" y="396.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胰腺炎）</text><rect x="18.0" y="432.0" width="364.0" height="70.0" rx="8" fill="#eef2f7"/><rect x="18.0" y="432.0" width="3.5" height="70.0" rx="1.8" fill="#4a5a6b"/><text x="32.0" y="452.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="469.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">别构靠构象、共价修饰靠磷酸基、酶原激活靠水解——三</text><text x="32.0" y="488.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">种层次互补。</text></svg>