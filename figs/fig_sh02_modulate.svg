<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 492" width="100%" style="max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px" role="img"><text x="165.0" y="22.6" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">酶活性的三种调节方式</text><text x="165.0" y="43.0" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">秒级微调 / 分钟级放大 / 一次性开关</text><rect x="15.0" y="58.0" width="300.0" height="92.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/><text x="26.0" y="79.0" text-anchor="start" font-size="14" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">别构调节</text><text x="304.0" y="79.0" text-anchor="end" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">秒级</text><text x="26.0" y="98.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">效应物结合调节亚基 → 构象改变</text><text x="26.0" y="115.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">S 形曲线，不遵守米氏方程</text><text x="26.0" y="134.0" text-anchor="start" font-size="13.5" font-weight="600" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">例：ATP 抑制磷酸果糖激酶-1</text><rect x="15.0" y="156.0" width="300.0" height="92.0" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="26.0" y="177.0" text-anchor="start" font-size="14" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">共价修饰</text><text x="304.0" y="177.0" text-anchor="end" font-size="13.5" font-weight="400" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">分钟级</text><text x="26.0" y="196.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">磷酸化 / 去磷酸化（也可腺苷化等）</text><text x="26.0" y="213.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">级联放大，一个激酶管很多酶</text><text x="26.0" y="232.0" text-anchor="start" font-size="13.5" font-weight="600" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">例：激素信号转导</text><rect x="15.0" y="254.0" width="300.0" height="92.0" rx="7" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="26.0" y="275.0" text-anchor="start" font-size="14" font-weight="700" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">酶原激活</text><text x="304.0" y="275.0" text-anchor="end" font-size="13.5" font-weight="400" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">一次性</text><text x="26.0" y="294.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">肽键有限水解，去掉一段肽</text><text x="26.0" y="311.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">不可逆、一次性，改变一级结构</text><text x="26.0" y="330.0" text-anchor="start" font-size="13.5" font-weight="600" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">例：胰蛋白酶原、胃蛋白酶原、凝血因子</text><rect x="15.0" y="352.0" width="300.0" height="76.0" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/><text x="25.0" y="368.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">易错：酶原激活的本质是「肽键水解」，</text><text x="25.0" y="384.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">不是构象改变</text><text x="25.0" y="400.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">保护意义：消化酶若以活性形式合成，</text><text x="25.0" y="416.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">胰腺会自身消化（急性胰腺炎）</text><rect x="11.0" y="433.0" width="308.0" height="51.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="165.0" y="448.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">别构秒级微调、共价修饰分钟级放大、酶原激活</text><text x="165.0" y="463.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">一次性开关；三者互补</text></svg>