<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 679" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="尿的浓缩与稀释：髓袢造梯度、ADH 用梯度"><title>尿的浓缩与稀释：髓袢造梯度、ADH 用梯度</title><desc>降支细段只透水、升支粗段只出盐，逆流倍增使髓质渗透压由 300 升到 1200 mOsm/L；集合管在 ADH 作用下借这一梯度重吸收水，故尿可浓可稀。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">尿的浓缩与稀释：髓袢造梯度、ADH 用梯度</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">逆流倍增把外髓 300 变成内髓 1200 mOsm/L</text><rect x="18.0" y="65.0" width="364.0" height="190.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="83.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">髓袢：造梯度</text><polyline points="130.0,99.0 130.0,215.0 188.0,215.0 188.0,99.0" fill="none" stroke="#0f766e" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/><line x1="130.0" y1="111.0" x2="130.0" y2="141.0" stroke="#8095a8" stroke-width="1.3" stroke-linecap="round"/><line x1="130.0" y1="141.0" x2="127.8" y2="137.1" stroke="#8095a8" stroke-width="1.3" stroke-linecap="round"/><line x1="130.0" y1="141.0" x2="132.2" y2="137.1" stroke="#8095a8" stroke-width="1.3" stroke-linecap="round"/><line x1="188.0" y1="203.0" x2="188.0" y2="173.0" stroke="#8095a8" stroke-width="1.3" stroke-linecap="round"/><line x1="188.0" y1="173.0" x2="190.2" y2="176.9" stroke="#8095a8" stroke-width="1.3" stroke-linecap="round"/><line x1="188.0" y1="173.0" x2="185.8" y2="176.9" stroke="#8095a8" stroke-width="1.3" stroke-linecap="round"/><line x1="126.0" y1="165.0" x2="100.0" y2="165.0" stroke="#1f6fb2" stroke-width="1.6" stroke-linecap="round"/><line x1="100.0" y1="165.0" x2="104.8" y2="162.4" stroke="#1f6fb2" stroke-width="1.6" stroke-linecap="round"/><line x1="100.0" y1="165.0" x2="104.8" y2="167.6" stroke="#1f6fb2" stroke-width="1.6" stroke-linecap="round"/><line x1="192.0" y1="165.0" x2="218.0" y2="165.0" stroke="#c0392b" stroke-width="1.6" stroke-linecap="round"/><line x1="218.0" y1="165.0" x2="213.2" y2="167.6" stroke="#c0392b" stroke-width="1.6" stroke-linecap="round"/><line x1="218.0" y1="165.0" x2="213.2" y2="162.4" stroke="#c0392b" stroke-width="1.6" stroke-linecap="round"/><text x="30.0" y="125.0" font-size="12" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">降支细段</text><text x="30.0" y="143.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">只透水</text><text x="30.0" y="159.0" font-size="11.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">H₂O 出</text><text x="30.0" y="177.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">管液变浓</text><text x="206.0" y="125.0" font-size="12" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">升支粗段</text><text x="206.0" y="143.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">只出盐</text><text x="206.0" y="159.0" font-size="11.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">NaCl 出</text><text x="206.0" y="177.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">管液变稀</text><text x="30.0" y="239.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">同一管内液体反向流动 → 外髓到内髓逐层倍增（逆流倍增）</text><rect x="18.0" y="267.0" width="364.0" height="180.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="285.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">梯度：分层递增</text><text x="30.0" y="305.0" font-size="12" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">髓质渗透压梯度（mOsm/L）</text><text x="96.0" y="326.0" text-anchor="end" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">外髓</text><rect x="104.0" y="313.0" width="47.5" height="18.0" rx="3" fill="#0f766e" opacity="0.12"/><text x="158.5" y="326.0" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">300</text><text x="96.0" y="352.0" text-anchor="end" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">外髓深部</text><rect x="104.0" y="339.0" width="95.0" height="18.0" rx="3" fill="#0f766e" opacity="0.26"/><text x="206.0" y="352.0" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">600</text><text x="96.0" y="378.0" text-anchor="end" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">内髓</text><rect x="104.0" y="365.0" width="142.5" height="18.0" rx="3" fill="#0f766e" opacity="0.4"/><text x="253.5" y="378.0" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">900</text><text x="96.0" y="404.0" text-anchor="end" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">内髓深部</text><rect x="104.0" y="391.0" width="190.0" height="18.0" rx="3" fill="#0f766e" opacity="0.54"/><text x="301.0" y="404.0" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">1200</text><text x="30.0" y="431.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">直小血管逆流交换：带走水、不冲走溶质 → 梯度得以维持</text><rect x="18.0" y="459.0" width="177.0" height="120.0" rx="9" fill="#fef3c7" stroke="#b45309" stroke-width="1.1"/><text x="29.0" y="480.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">缺水 / 失水</text><text x="29.0" y="499.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">血浆晶体渗透压↑ → ADH↑</text><text x="29.0" y="519.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">集合管 AQP2 上膜 → </text><text x="29.0" y="535.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">水回吸收↑</text><text x="29.0" y="555.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">尿少而浓（可达 1200）</text><rect x="205.0" y="459.0" width="177.0" height="120.0" rx="9" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1.1"/><text x="216.0" y="480.0" font-size="12.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">大量饮清水</text><text x="216.0" y="499.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">血浆晶体渗透压↓ → ADH↓</text><text x="216.0" y="519.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">集合管几乎不透水</text><text x="216.0" y="539.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">尿多而稀（可低至 50）</text><rect x="18.0" y="589.0" width="364.0" height="70.0" rx="8" fill="#eef2f7"/><rect x="18.0" y="589.0" width="3.5" height="70.0" rx="1.8" fill="#4a5a6b"/><text x="32.0" y="609.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="626.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">髓袢造梯度、集合管用梯度；尿崩症是 ADH 缺乏或受体</text><text x="32.0" y="645.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">不敏感 → 每日 10 L 以上低渗尿。</text></svg>