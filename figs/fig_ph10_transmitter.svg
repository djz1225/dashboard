<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 587" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="递质与受体：一个递质、多种受体"><title>递质与受体：一个递质、多种受体</title><desc>ACh 作用于 M（副交感与汗腺）与 N（神经节 N₁、骨骼肌 N₂）受体；NE 作用于 α₁、β₁、β₂；多巴胺作用于 D₁/D₂；交感节后多为 NE（汗腺例外为 ACh），副交感节后全为 ACh。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">递质与受体：一个递质、多种受体</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">决定效应的是受体类型，不是递质本身</text><rect x="18.0" y="65.0" width="364.0" height="23.0" rx="6" fill="#e2f5f2"/><text x="25.0" y="81.0" font-size="11" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">递质</text><text x="112.4" y="81.0" font-size="11" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">主要受体</text><text x="243.4" y="81.0" font-size="11" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">阻断剂 / 一句话</text><line x1="18.0" y1="129.0" x2="382.0" y2="129.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="25.0" y="106.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">乙酰胆碱</text><text x="112.4" y="106.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">M（副交感、汗腺）</text><text x="243.4" y="106.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">阿托品阻断 M；汗腺是交</text><text x="243.4" y="122.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">感却用 ACh</text><line x1="18.0" y1="170.0" x2="382.0" y2="170.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="25.0" y="147.0" font-size="12.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">乙酰胆碱</text><text x="112.4" y="147.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">N₁（神经节）/ N₂</text><text x="112.4" y="163.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">（骨骼肌）</text><text x="243.4" y="147.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">筒箭毒碱阻断 N₂ </text><text x="243.4" y="163.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">→ 肌松</text><line x1="18.0" y1="211.0" x2="382.0" y2="211.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="25.0" y="188.0" font-size="12.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">去甲肾上腺素</text><text x="112.4" y="188.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">α₁ 缩血管、β₁ </text><text x="112.4" y="204.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">心、β₂ 支气管</text><text x="243.4" y="188.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">酚妥拉明阻断 α；β₂ </text><text x="243.4" y="204.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">舒张支气管</text><line x1="18.0" y1="252.0" x2="382.0" y2="252.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="25.0" y="229.0" font-size="12.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">多巴胺</text><text x="112.4" y="229.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">D₁ / D₂</text><text x="243.4" y="229.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">黑质多巴胺↓ → 帕金森</text><text x="243.4" y="245.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">病（用 L-DOPA）</text><line x1="18.0" y1="293.0" x2="382.0" y2="293.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="25.0" y="270.0" font-size="12.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肽类 / NO</text><text x="112.4" y="270.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">调质、弥散</text><text x="243.4" y="270.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">神经肽常与经典递质共存，</text><text x="243.4" y="286.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">起调制作用</text><rect x="18.0" y="301.0" width="364.0" height="184.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="319.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">自主神经的递质规律</text><rect x="31.0" y="329.0" width="3.0" height="15.0" rx="1.5" fill="#c0392b"/><text x="40.0" y="342.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">交感节后</text><text x="344.0" y="342.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">去甲肾上腺素</text><text x="40.0" y="360.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">绝大多数释放 NE；汗腺是例外（ACh＋M 受体）</text><rect x="31.0" y="368.0" width="3.0" height="15.0" rx="1.5" fill="#1f6fb2"/><text x="40.0" y="381.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">副交感节后</text><text x="344.0" y="381.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">乙酰胆碱</text><text x="40.0" y="399.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">全部释放 ACh，作用于 M 受体</text><rect x="31.0" y="407.0" width="3.0" height="15.0" rx="1.5" fill="#7b4bb7"/><text x="40.0" y="420.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">交感与副交感节前</text><text x="344.0" y="420.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">乙酰胆碱</text><text x="40.0" y="438.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">都作用于神经节 N₁ 受体</text><rect x="31.0" y="446.0" width="3.0" height="15.0" rx="1.5" fill="#b45309"/><text x="40.0" y="459.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肾上腺髓质</text><text x="344.0" y="459.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">交感节后神经元</text><text x="40.0" y="477.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">直接分泌肾上腺素与 NE 入血（无节后纤维）</text><rect x="18.0" y="497.0" width="364.0" height="70.0" rx="8" fill="#eef2f7"/><rect x="18.0" y="497.0" width="3.5" height="70.0" rx="1.8" fill="#4a5a6b"/><text x="32.0" y="517.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="534.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">汗腺受交感支配却释放 ACh、作用 M 受体——所以阿托</text><text x="32.0" y="553.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">品能抑制出汗；同一递质效应不同，全看受体。</text></svg>