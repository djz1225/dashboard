<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 527" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="P/O 比：2.5 与 1.5 从哪来"><title>P/O 比：2.5 与 1.5 从哪来</title><desc>P/O 比等于该底物进入呼吸链后泵出的质子数除以 4：NADH 经复合体Ⅰ 进入共泵 10 个 H⁺，10/4＝2.5；FADH₂ 经复合体Ⅱ 进入不泵质子，共 6 个 H⁺，6/4＝1.5。葡萄糖彻底氧化为 30 或 32 ATP，差别仅在胞质 NADH 走甘油磷酸穿梭（1.5）还是苹果酸-天冬氨酸穿梭（2.5）。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">P/O 比：2.5 与 1.5 从哪来</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">P/O ＝ 泵出的 H⁺ ÷ 4；旧值 3 与 2 已废弃，10 版统一按</text><text x="18.0" y="68.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">2.5 / 1.5 计</text><rect x="18.0" y="82.0" width="364.0" height="26.0" rx="6" fill="#fef3c7"/><text x="200.0" y="99.5" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">P/O = 泵出 H⁺ 数 ÷ 4</text><rect x="18.0" y="118.0" width="364.0" height="26.0" rx="6" fill="#f8fbfd"/><text x="26.0" y="135.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">底物</text><text x="135.2" y="135.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">电子入口与泵质子</text><text x="324.5" y="135.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">P/O</text><line x1="18.0" y1="170.0" x2="382.0" y2="170.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="162.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">NADH</text><text x="135.2" y="162.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">复合体Ⅰ 进入，共泵 10 H⁺</text><text x="324.5" y="162.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">2.5</text><line x1="18.0" y1="212.0" x2="382.0" y2="212.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="188.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">FADH₂</text><text x="135.2" y="188.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">复合体Ⅱ 进入（不泵），共</text><text x="135.2" y="204.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"> 6H⁺</text><text x="324.5" y="188.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">1.5</text><line x1="18.0" y1="238.0" x2="382.0" y2="238.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="230.0" font-size="12.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">抗坏血酸</text><text x="135.2" y="230.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">直接交给 cyt c，绕过 Ⅰ ⅡⅢ</text><text x="324.5" y="230.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">1.0</text><line x1="18.0" y1="280.0" x2="382.0" y2="280.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="256.0" font-size="12.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">1 葡萄糖</text><text x="26.0" y="272.0" font-size="12.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">彻底氧化</text><text x="135.2" y="256.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">10 NADH + 2 FADH₂ + 2 GTP</text><text x="324.5" y="256.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">30 或32</text><rect x="18.0" y="288.0" width="177.0" height="120.0" rx="9" fill="#fdeceb" stroke="#c0392b" stroke-width="1.1"/><text x="29.0" y="309.0" font-size="12.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">30 ATP｜甘油磷酸穿梭</text><text x="29.0" y="328.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胞质 2 NADH 交给 FADH₂</text><text x="29.0" y="348.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">按 1.5 计 → 少 2 个 ATP</text><text x="29.0" y="368.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">脑、骨骼肌走这条</text><rect x="205.0" y="288.0" width="177.0" height="120.0" rx="9" fill="#fef3c7" stroke="#b45309" stroke-width="1.1"/><text x="216.0" y="309.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">32 ATP｜苹果酸穿梭</text><text x="216.0" y="328.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胞质 2 NADH 交给线粒体</text><text x="216.0" y="344.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">NAD⁺</text><text x="216.0" y="364.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">按 2.5 计 → 多 2 个 ATP</text><text x="216.0" y="384.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">心、肝走这条</text><rect x="18.0" y="418.0" width="364.0" height="89.0" rx="8" fill="#fef3c7"/><rect x="18.0" y="418.0" width="3.5" height="89.0" rx="1.8" fill="#b45309"/><text x="32.0" y="438.0" font-size="11.5" font-weight="700" fill="#b45309" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">易错</text><text x="32.0" y="455.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">30 与 32 之差只来自胞质那 2 个 NADH 走哪条穿梭；</text><text x="32.0" y="474.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">「2.5 / 1.5」的来源是 10 个质子 / 每 ATP 4 个质</text><text x="32.0" y="493.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">子，不是随便定的。</text></svg>