<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 677.5" width="100%" style="max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px" role="img"><text x="165.0" y="22.6" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">红细胞生成与调节</text><text x="165.0" y="42.6" text-anchor="middle" font-size="13.5" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">核心：缺氧 → EPO → 骨髓造血；原料缺一样都不成</text><text x="15.0" y="72.5" text-anchor="start" font-size="13.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">第10版正常值（与9版不同，注意）</text><rect x="15.0" y="79.5" width="300.0" height="28.0" rx="5" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.4"/><text x="25.0" y="98.5" text-anchor="start" font-size="13.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">项目</text><text x="305.0" y="98.5" text-anchor="end" font-size="13.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">第10版</text><rect x="15.0" y="107.5" width="300.0" height="38.0" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="25.0" y="125.5" text-anchor="start" font-size="14" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">红细胞 男</text><text x="305.0" y="125.5" text-anchor="end" font-size="14" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">(4.3~5.8)×10¹²/L</text><text x="25.0" y="143.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">9版为 4.0~5.5</text><rect x="15.0" y="145.5" width="300.0" height="38.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="25.0" y="163.5" text-anchor="start" font-size="14" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">红细胞 女</text><text x="305.0" y="163.5" text-anchor="end" font-size="14" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">(3.8~5.1)×10¹²/L</text><text x="25.0" y="181.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">9版为 3.5~5.0</text><rect x="15.0" y="183.5" width="300.0" height="38.0" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="25.0" y="201.5" text-anchor="start" font-size="14" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">血红蛋白 男</text><text x="305.0" y="201.5" text-anchor="end" font-size="14" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">130~175 g/L</text><text x="25.0" y="219.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">9版为 120~160</text><rect x="15.0" y="221.5" width="300.0" height="38.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="25.0" y="239.5" text-anchor="start" font-size="14" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">血红蛋白 女</text><text x="305.0" y="239.5" text-anchor="end" font-size="14" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">115~150 g/L</text><text x="25.0" y="257.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">9版为 110~150</text><rect x="15.0" y="267.5" width="300.0" height="38.0" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/><text x="27.0" y="287.5" text-anchor="start" font-size="14" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">① 缺氧</text><text x="27.0" y="305.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">肾（主）+ 肝产生 EPO</text><line x1="165.0" y1="306.5" x2="165.0" y2="308.0" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/><polygon points="165.0,312.5 163.0,307.9 167.0,307.9" fill="#64748b"/><rect x="15.0" y="313.5" width="300.0" height="38.0" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/><text x="27.0" y="333.5" text-anchor="start" font-size="14" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">② EPO</text><text x="27.0" y="351.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">作用于骨髓红系祖细胞，促增殖分化</text><line x1="165.0" y1="352.5" x2="165.0" y2="354.0" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/><polygon points="165.0,358.5 163.0,353.9 167.0,353.9" fill="#64748b"/><rect x="15.0" y="359.5" width="300.0" height="38.0" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/><text x="27.0" y="379.5" text-anchor="start" font-size="14" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">③ 成熟</text><text x="27.0" y="397.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">需铁、叶酸、维生素 B₁₂</text><line x1="165.0" y1="398.5" x2="165.0" y2="400.0" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/><polygon points="165.0,404.5 163.0,399.9 167.0,399.9" fill="#64748b"/><rect x="15.0" y="405.5" width="300.0" height="38.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/><text x="27.0" y="425.5" text-anchor="start" font-size="14" font-weight="700" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">④ 释放</text><text x="27.0" y="443.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">网织红细胞入血，1~2 天后成熟</text><rect x="15.0" y="445.5" width="300.0" height="86.0" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="25.0" y="464.5" text-anchor="start" font-size="13.5" font-weight="700" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">三种原料缺乏的后果</text><text x="25.0" y="482.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 缺铁 → 小细胞低色素性贫血（MCV↓）</text><text x="25.0" y="498.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 缺叶酸/B₁₂ → 巨幼细胞性贫血（MCV↑）</text><text x="25.0" y="514.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 缺 B₁₂ 还伴神经症状（因影响髓鞘）</text><rect x="15.0" y="539.5" width="300.0" height="76.0" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/><text x="25.0" y="555.5" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">10版新增：血浆中叶酸主要以 N⁵-甲基四氢叶</text><text x="25.0" y="571.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">酸形式存在</text><text x="25.0" y="587.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">EPO 主要来自肾（约 90%），肾衰贫血的根子</text><text x="25.0" y="603.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">在这里</text><rect x="11.0" y="618.5" width="308.0" height="51.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="165.0" y="633.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">缺氧→EPO→骨髓造血；缺铁小细胞、缺叶酸B12大</text><text x="165.0" y="649.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">细胞，这是贫血鉴别的起点</text></svg>