<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 795" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="红细胞生成与调节"><title>红细胞生成与调节</title><desc>缺氧经肾分泌 EPO 刺激骨髓红系祖细胞增殖分化，需铁、叶酸、维生素 B₁₂ 作原料；肾衰致 EPO 减少是肾性贫血的根源。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">红细胞生成与调节</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">缺氧 → EPO → 骨髓造血；原料缺一样都不成</text><rect x="18.0" y="65.0" width="364.0" height="46.0" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.1"/><rect x="18.0" y="65.0" width="3.5" height="46.0" rx="1.8" fill="#b45309"/><circle cx="38" cy="83" r="9.5" fill="#b45309"/><text x="38.0" y="87.0" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">1</text><text x="56.0" y="87.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">缺氧</text><text x="370.0" y="87.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">启动</text><text x="56.0" y="105.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肾（为主，约 90%）+ 肝感受缺氧，分泌 EPO</text><line x1="38.0" y1="113.0" x2="38.0" y2="124.0" stroke="#4a5a6b" stroke-width="2" stroke-linecap="round"/><line x1="38.0" y1="124.0" x2="34.2" y2="117.0" stroke="#4a5a6b" stroke-width="2" stroke-linecap="round"/><line x1="38.0" y1="124.0" x2="41.8" y2="117.0" stroke="#4a5a6b" stroke-width="2" stroke-linecap="round"/><rect x="18.0" y="126.0" width="364.0" height="62.0" rx="8" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1.1"/><rect x="18.0" y="126.0" width="3.5" height="62.0" rx="1.8" fill="#1f6fb2"/><circle cx="38" cy="144" r="9.5" fill="#1f6fb2"/><text x="38.0" y="148.0" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">2</text><text x="56.0" y="148.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">EPO</text><text x="370.0" y="148.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">核心激素</text><text x="56.0" y="166.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">经血到骨髓，作用于红系祖细胞（CFU-E），抑凋亡</text><text x="56.0" y="182.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">促增殖分化</text><line x1="38.0" y1="190.0" x2="38.0" y2="201.0" stroke="#4a5a6b" stroke-width="2" stroke-linecap="round"/><line x1="38.0" y1="201.0" x2="34.2" y2="194.0" stroke="#4a5a6b" stroke-width="2" stroke-linecap="round"/><line x1="38.0" y1="201.0" x2="41.8" y2="194.0" stroke="#4a5a6b" stroke-width="2" stroke-linecap="round"/><rect x="18.0" y="203.0" width="364.0" height="46.0" rx="8" fill="#f2ecfb" stroke="#7b4bb7" stroke-width="1.1"/><rect x="18.0" y="203.0" width="3.5" height="46.0" rx="1.8" fill="#7b4bb7"/><circle cx="38" cy="221" r="9.5" fill="#7b4bb7"/><text x="38.0" y="225.0" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">3</text><text x="56.0" y="225.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">成熟</text><text x="370.0" y="225.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">原料</text><text x="56.0" y="243.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">需铁、叶酸、维生素 B₁₂ 三个原料</text><line x1="38.0" y1="251.0" x2="38.0" y2="262.0" stroke="#4a5a6b" stroke-width="2" stroke-linecap="round"/><line x1="38.0" y1="262.0" x2="34.2" y2="255.0" stroke="#4a5a6b" stroke-width="2" stroke-linecap="round"/><line x1="38.0" y1="262.0" x2="41.8" y2="255.0" stroke="#4a5a6b" stroke-width="2" stroke-linecap="round"/><rect x="18.0" y="264.0" width="364.0" height="46.0" rx="8" fill="#e6f6ec" stroke="#2f8f57" stroke-width="1.1"/><rect x="18.0" y="264.0" width="3.5" height="46.0" rx="1.8" fill="#2f8f57"/><circle cx="38" cy="282" r="9.5" fill="#2f8f57"/><text x="38.0" y="286.0" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">4</text><text x="56.0" y="286.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">释放</text><text x="370.0" y="286.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">入血</text><text x="56.0" y="304.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">网织红细胞入血，约 5 天后成熟</text><line x1="38.0" y1="312.0" x2="38.0" y2="323.0" stroke="#4a5a6b" stroke-width="2" stroke-linecap="round"/><line x1="38.0" y1="323.0" x2="34.2" y2="316.0" stroke="#4a5a6b" stroke-width="2" stroke-linecap="round"/><line x1="38.0" y1="323.0" x2="41.8" y2="316.0" stroke="#4a5a6b" stroke-width="2" stroke-linecap="round"/><rect x="18.0" y="325.0" width="364.0" height="46.0" rx="8" fill="#eef2f7" stroke="#4a5a6b" stroke-width="1.1"/><rect x="18.0" y="325.0" width="3.5" height="46.0" rx="1.8" fill="#4a5a6b"/><circle cx="38" cy="343" r="9.5" fill="#4a5a6b"/><text x="38.0" y="347.0" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">5</text><text x="56.0" y="347.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">负反馈关闭</text><text x="370.0" y="347.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">闭环</text><text x="56.0" y="365.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">携氧能力↑ → 组织氧分压回升 → EPO 分泌↓</text><rect x="18.0" y="371.0" width="3.0" height="14.0" rx="1.5" fill="#0f766e"/><text x="28.0" y="381.0" font-size="13.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">原料缺乏的三种贫血</text><rect x="18.0" y="393.0" width="364.0" height="181.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="411.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">鉴别要点</text><rect x="30.0" y="421.0" width="3.0" height="15.0" rx="1.5" fill="#b45309"/><text x="39.0" y="434.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">缺铁</text><text x="347.0" y="434.0" text-anchor="end" font-size="12" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">小细胞低色素</text><text x="39.0" y="452.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">MCV↓；铁在十二指肠与空肠上段以 Fe²⁺</text><text x="39.0" y="468.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"> 吸收</text><rect x="30.0" y="478.0" width="3.0" height="15.0" rx="1.5" fill="#7b4bb7"/><text x="39.0" y="491.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">缺叶酸 / B₁₂</text><text x="347.0" y="491.0" text-anchor="end" font-size="12" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">巨幼细胞性</text><text x="39.0" y="509.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">DNA 合成受阻，核发育落后于胞质，MCV↑</text><rect x="30.0" y="519.0" width="3.0" height="15.0" rx="1.5" fill="#c0392b"/><text x="39.0" y="532.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">缺 B₁₂</text><text x="347.0" y="532.0" text-anchor="end" font-size="12" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">伴神经症状</text><text x="39.0" y="550.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">因影响髓鞘；内因子缺乏（胃大部切除）也致</text><text x="39.0" y="566.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">B₁₂ 吸收障碍</text><rect x="18.0" y="586.0" width="364.0" height="107.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="604.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">正常值（第10版）</text><text x="30.0" y="632.0" font-size="12" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">红细胞 男 (4.3~5.8)×10¹²/L　女 (3.8~5.1)×10¹²/L</text><text x="30.0" y="651.0" font-size="12" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">血红蛋白 男 130~175 g/L　女 115~150 g/L</text><text x="30.0" y="670.0" font-size="11.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">以上为第10版数值，与 9 版不同，务必按新版记</text><rect x="18.0" y="705.0" width="364.0" height="70.0" rx="8" fill="#eef2f7"/><rect x="18.0" y="705.0" width="3.5" height="70.0" rx="1.8" fill="#4a5a6b"/><text x="32.0" y="725.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="742.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">缺氧→EPO→骨髓造血；缺铁为小细胞低色素，缺叶酸/B₁₂</text><text x="32.0" y="761.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"> 为巨幼细胞，这是贫血鉴别的起点。</text></svg>