<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 521" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="真核三套 RNA 聚合酶"><title>真核三套 RNA 聚合酶</title><desc>真核有三套 RNA 聚合酶：RNA 聚合酶Ⅰ在核仁转录 45S rRNA 前体，加工成 28S、18S 与 5.8S rRNA，对 α-鹅膏蕈碱不敏感；RNA 聚合酶Ⅱ转录 mRNA 前体及多数 snRNA、miRNA，对 α-鹅膏蕈碱极敏感；RNA 聚合酶Ⅲ转录 tRNA、5S rRNA 与部分snRNA，中度敏感。真核 mRNA 前体须经加帽（7-甲基鸟苷，5′-5′ 三磷酸连接）、加尾（识别 AAUAAA 后无模板添加 polyA）与剪接三层加工。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">真核三套 RNA 聚合酶</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Ⅰ 造 rRNA、Ⅱ 造 mRNA、Ⅲ 造 tRNA；α-鹅膏蕈碱敏感性依</text><text x="18.0" y="68.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">次极敏 &gt; 中 &gt; 不敏</text><rect x="18.0" y="82.0" width="364.0" height="26.0" rx="6" fill="#f8fbfd"/><text x="26.0" y="99.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">聚合酶</text><text x="135.2" y="99.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">产物</text><text x="309.9" y="99.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">α-鹅膏蕈碱</text><line x1="18.0" y1="150.0" x2="382.0" y2="150.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="126.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">RNA 聚合酶Ⅰ</text><text x="135.2" y="126.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">45S rRNA 前体</text><text x="135.2" y="142.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">→28S/18S/5.8S</text><text x="309.9" y="126.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">不敏感</text><line x1="18.0" y1="192.0" x2="382.0" y2="192.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="168.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">RNA 聚合酶Ⅱ</text><text x="135.2" y="168.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">mRNA 前体、多数 snRNA、</text><text x="135.2" y="184.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">miRNA</text><text x="309.9" y="168.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">极敏感</text><line x1="18.0" y1="218.0" x2="382.0" y2="218.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="210.0" font-size="12.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">RNA 聚合酶Ⅲ</text><text x="135.2" y="210.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">tRNA、5S rRNA、部分snRNA</text><text x="309.9" y="210.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">中度敏感</text><rect x="18.0" y="224.0" width="364.0" height="195.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="243.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">mRNA 加工三件套（真核特有）</text><rect x="30.0" y="254.0" width="3.0" height="15.0" rx="1.5" fill="#2f8f57"/><text x="39.0" y="267.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">① 加帽</text><text x="362.0" y="267.0" text-anchor="end" font-size="12" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">7-甲基鸟苷</text><text x="39.0" y="285.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">通过 5′-5′ 三磷酸连接（不是 3′-5′</text><text x="39.0" y="301.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">磷酸二酯键），保护 5′ 端并引导出核与</text><text x="39.0" y="317.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">起始识别</text><rect x="30.0" y="325.0" width="3.0" height="15.0" rx="1.5" fill="#0f766e"/><text x="39.0" y="338.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">② 加尾</text><text x="362.0" y="338.0" text-anchor="end" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">polyA 50~250 nt</text><text x="39.0" y="356.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">加尾酶识别 AAUAAA 信号后无模板</text><text x="39.0" y="372.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">加上，稳定 mRNA、协助出核</text><rect x="30.0" y="380.0" width="3.0" height="15.0" rx="1.5" fill="#0f766e"/><text x="39.0" y="393.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">③ 剪接</text><text x="362.0" y="393.0" text-anchor="end" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">两次酯交换</text><text x="39.0" y="411.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">剪接体切除内含子，外显子连接成成熟mRNA</text><rect x="18.0" y="431.0" width="364.0" height="70.0" rx="8" fill="#eef2f7"/><rect x="18.0" y="431.0" width="3.5" height="70.0" rx="1.8" fill="#4a5a6b"/><text x="32.0" y="451.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">易错</text><text x="32.0" y="468.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">帽子是 5′-5′ 三磷酸连接，polyA 尾不由模板编码</text><text x="32.0" y="487.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">—— 这两点最常考。</text></svg>