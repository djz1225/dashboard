/5.8S）</text><text x="222.2" y="97.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">α-鹅膏蕈碱（</text><text x="222.2" y="111.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">不敏感）</text><rect x="15.0" y="118.0" width="300.0" height="36.0" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.9"/><text x="21.0" y="133.0" text-anchor="start" font-size="11.2" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">RNA 聚合</text><text x="21.0" y="147.0" text-anchor="start" font-size="11.2" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">酶Ⅱ</text><text x="77.6" y="133.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">mRNA 前体、多数 snRNA、</text><text x="77.6" y="147.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">miRNA</text><text x="222.2" y="133.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">α-鹅膏蕈碱（</text><text x="222.2" y="147.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">极敏感）</text><rect x="15.0" y="154.0" width="300.0" height="36.0" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.9"/><text x="21.0" y="169.0" text-anchor="start" font-size="11.2" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">RNA 聚合</text><text x="21.0" y="183.0" text-anchor="start" font-size="11.2" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">酶Ⅲ</text><text x="77.6" y="169.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">tRNA、5S rRNA、部分 sn</text><text x="77.6" y="183.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">RNA</text><text x="222.2" y="169.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">α-鹅膏蕈碱（</text><text x="222.2" y="183.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">中度敏感）</text><rect x="15.0" y="195.0" width="300.0" height="46.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><rect x="15.0" y="195.0" width="4.5" height="46.0" rx="2.2" fill="#0f766e"/><text x="29.0" y="214.0" text-anchor="start" font-size="14" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">mRNA 加工三件套</text><text x="304.0" y="214.0" text-anchor="end" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">3 步</text><text x="29.0" y="231.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">加帽（5′ 5′-5′ 三磷酸连 7-甲基鸟苷）、加尾（polyA）、剪接</text><rect x="15.0" y="245.0" width="300.0" height="46.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><rect x="15.0" y="245.0" width="4.5" height="46.0" rx="2.2" fill="#b45309"/><text x="29.0" y="264.0" text-anchor="start" font-size="14" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">为什么加帽</text><text x="304.0" y="264.0" text-anchor="end" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">保护+识别</text><text x="29.0" y="281.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">保护 5′ 端、协助出核、起始翻译识别</text><rect x="15.0" y="295.0" width="300.0" height="46.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><rect x="15.0" y="295.0" width="4.5" height="46.0" rx="2.2" fill="#15803d"/><text x="29.0" y="314.0" text-anchor="start" font-size="14" font-weight="700" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">为什么加尾</text><text x="304.0" y="314.0" text-anchor="end" font-size="13.5" font-weight="700" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">稳定</text><text x="29.0" y="331.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">稳定 mRNA、协助出核、提高翻译效率</text><rect x="15.0" y="345.0" width="300.0" height="46.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><rect x="15.0" y="345.0" width="4.5" height="46.0" rx="2.2" fill="#b91c1c"/><text x="29.0" y="364.0" text-anchor="start" font-size="14" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">剪接两步酯交换</text><text x="304.0" y="364.0" text-anchor="end" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">2 次</text><text x="29.0" y="381.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">第一次酯交换切 5′ 端、第二次连接外显子</text><rect x="15.0" y="397.0" width="300.0" height="76.0" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/><text x="25.0" y="413.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">易错：帽子通过 5′-5′ 三磷酸连接，</text><text x="25.0" y="429.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">不是普通 3′-5′ 磷酸二酯键</text><text x="25.0" y="445.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">polyA 尾不是模板编码的——加尾酶识别 AAUA</text><text x="25.0" y="461.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">AA 信号后「无模板」加上去</text><rect x="11.0" y="478.0" width="308.0" height="51.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="165.0" y="493.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">Ⅰ 造 rRNA、Ⅱ 造 mRNA、Ⅲ 造 tRNA；帽子是 </text><text x="165.0" y="508.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">5′-5′ 连接，尾巴不由模板编码</text></svg>