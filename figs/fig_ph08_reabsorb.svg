<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 557.5" width="100%" style="max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px" role="img"><text x="165.0" y="22.6" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">肾小管各段重吸收什么</text><text x="165.0" y="42.6" text-anchor="middle" font-size="13.5" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">近端小管是「主力」，髓袢管浓缩，远曲管管精细调节</text><rect x="15.0" y="59.5" width="300.0" height="56.0" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/><text x="24.0" y="78.5" text-anchor="start" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">近端小管</text><text x="24.0" y="95.5" text-anchor="start" font-size="13" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">67% 的水、Na⁺；全部葡萄糖、氨基酸</text><text x="24.0" y="111.5" text-anchor="start" font-size="13" font-weight="600" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">等渗重吸收，量大</text><rect x="15.0" y="121.5" width="300.0" height="56.0" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/><text x="24.0" y="140.5" text-anchor="start" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">髓袢降支细段</text><text x="24.0" y="157.5" text-anchor="start" font-size="13" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">只透水，不透溶质</text><text x="24.0" y="173.5" text-anchor="start" font-size="13" font-weight="600" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">水出、盐留 → 小管液变浓</text><rect x="15.0" y="183.5" width="300.0" height="72.0" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.4"/><text x="24.0" y="202.5" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">髓袢升支粗段</text><text x="24.0" y="219.5" text-anchor="start" font-size="13" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">主动重吸收 Na⁺-Cl⁻（Na⁺-K⁺-2Cl⁻ 同向转运</text><text x="24.0" y="235.5" text-anchor="start" font-size="13" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">），不透水</text><text x="24.0" y="251.5" text-anchor="start" font-size="13" font-weight="600" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">盐出、水留 → 小管液变稀（稀释段）</text><rect x="15.0" y="261.5" width="300.0" height="56.0" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/><text x="24.0" y="280.5" text-anchor="start" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">远曲小管</text><text x="24.0" y="297.5" text-anchor="start" font-size="13" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">Na⁺ 重吸收（受醛固酮调节），水不易通过</text><text x="24.0" y="313.5" text-anchor="start" font-size="13" font-weight="600" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">精细调节</text><rect x="15.0" y="323.5" width="300.0" height="56.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/><text x="24.0" y="342.5" text-anchor="start" font-size="13.5" font-weight="700" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">集合管</text><text x="24.0" y="359.5" text-anchor="start" font-size="13" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">水（受 ADH 调节）、尿素</text><text x="24.0" y="375.5" text-anchor="start" font-size="13" font-weight="600" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">决定最终尿量浓度</text><rect x="15.0" y="387.5" width="300.0" height="108.0" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/><text x="25.0" y="403.5" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">葡萄糖重吸收上限（肾糖阈）约 180 mg/dl，</text><text x="25.0" y="419.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">超过则出现尿糖</text><text x="25.0" y="435.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">髓袢升支粗段是「稀释段」：只出盐不出水，</text><text x="25.0" y="451.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">小管液渗透压降到最低</text><text x="25.0" y="467.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">袢利尿剂（呋塞米）作用在这里：抑制 Na⁺-K</text><text x="25.0" y="483.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">⁺-2Cl⁻ 转运 → 强效利尿</text><rect x="11.0" y="498.5" width="308.0" height="51.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="165.0" y="513.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">近端小管重吸收 67% 水钠；髓袢升支粗段只出</text><text x="165.0" y="529.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">盐不出水＝稀释段</text></svg>