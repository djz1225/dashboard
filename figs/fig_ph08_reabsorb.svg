<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 487" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="肾小管重吸收：近端是主力，髓袢造梯度"><title>肾小管重吸收：近端是主力，髓袢造梯度</title><desc>近端小管等渗重吸收 67% 水钠并吸收全部葡萄糖；降支细段只透水、升支粗段只出盐（稀释段，袢利尿剂作用点）；远曲小管受醛固酮、集合管受 ADH 调节。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肾小管重吸收：近端是主力，髓袢造梯度</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">各段分工不同——重吸收比例决定利尿药的作用点</text><rect x="18.0" y="65.0" width="364.0" height="84.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="83.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">谁吸得最多</text><text x="30.0" y="103.0" font-size="12" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">水、Na⁺ 重吸收的分配（占滤过量）</text><rect x="30.0" y="111.0" width="211.7" height="26.0" rx="5" fill="#e2f5f2" stroke="#0f766e" stroke-width="1.1"/><text x="135.9" y="128.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">近端小管 67%</text><rect x="241.7" y="111.0" width="79.0" height="26.0" rx="5" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1.1"/><text x="281.2" y="128.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">髓袢 25%</text><rect x="320.7" y="111.0" width="25.3" height="26.0" rx="5" fill="#f2ecfb" stroke="#7b4bb7" stroke-width="1.1"/><rect x="18.0" y="155.0" width="3.0" height="14.0" rx="1.5" fill="#0f766e"/><text x="28.0" y="165.0" font-size="13.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">各段转运特点</text><rect x="18.0" y="177.0" width="364.0" height="23.0" rx="6" fill="#e2f5f2"/><text x="25.0" y="193.0" font-size="11" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">节段</text><text x="112.4" y="193.0" font-size="11" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">关键转运体</text><text x="214.3" y="193.0" font-size="11" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话机制</text><line x1="18.0" y1="241.0" x2="382.0" y2="241.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="25.0" y="218.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">近端小管</text><text x="112.4" y="218.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Na⁺-H⁺ 交换</text><text x="214.3" y="218.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">等渗重吸收 67% 水钠；葡萄</text><text x="214.3" y="234.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">糖、氨基酸全在此</text><line x1="18.0" y1="266.0" x2="382.0" y2="266.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="25.0" y="259.0" font-size="12.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">降支细段</text><text x="112.4" y="259.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">只透水</text><text x="214.3" y="259.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">水出、盐留 → 小管液变浓</text><line x1="18.0" y1="307.0" x2="382.0" y2="307.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="25.0" y="284.0" font-size="12.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">升支粗段</text><text x="112.4" y="284.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Na⁺-K⁺-2Cl⁻</text><text x="214.3" y="284.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">只出盐不出水 → 稀释段；袢</text><text x="214.3" y="300.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">利尿剂作用点</text><line x1="18.0" y1="348.0" x2="382.0" y2="348.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="25.0" y="325.0" font-size="12.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">远曲小管</text><text x="112.4" y="325.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Na⁺-Cl⁻ 同向</text><text x="214.3" y="325.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">醛固酮促保 Na⁺ 排 K⁺；水</text><text x="214.3" y="341.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">不易通过</text><line x1="18.0" y1="389.0" x2="382.0" y2="389.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="25.0" y="366.0" font-size="12.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">集合管</text><text x="112.4" y="366.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">AQP2、尿素</text><text x="214.3" y="366.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">ADH 调水；决定最终尿量</text><text x="214.3" y="382.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">与尿渗透压</text><rect x="18.0" y="397.0" width="364.0" height="70.0" rx="8" fill="#eef2f7"/><rect x="18.0" y="397.0" width="3.5" height="70.0" rx="1.8" fill="#4a5a6b"/><text x="32.0" y="417.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="434.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">升支粗段是稀释段（只出盐不出水）；葡萄糖重吸收上限</text><text x="32.0" y="453.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">＝肾糖阈约 180 mg/dl，超过即尿糖。</text></svg>