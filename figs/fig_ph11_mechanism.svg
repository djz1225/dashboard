<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 699" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="激素作用机制：受体在哪决定快慢"><title>激素作用机制：受体在哪决定快慢</title><desc>肽类与儿茶酚胺作用于膜受体、经 cAMP/IP₃/DG/Ca²⁺ 第二信使快速起效；类固醇与甲状腺激素进入细胞作用于核受体、调控基因转录而慢；激素具有特异性、信使性、高效能放大与相互作用。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">激素作用机制：受体在哪，决定快慢</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">膜受体靠第二信使（快），核受体改基因（慢）</text><rect x="18.0" y="65.0" width="364.0" height="310.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="83.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">两条纵向因果链</text><text x="30.0" y="105.0" font-size="12.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肽类 / 儿茶酚胺 → 快</text><rect x="30.0" y="115.0" width="152.0" height="40.0" rx="7" fill="#fdeceb" stroke="#c0392b" stroke-width="1"/><text x="106.0" y="132.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">激素</text><text x="106.0" y="146.0" text-anchor="middle" font-size="10" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">亲水，进不了细胞</text><line x1="106.0" y1="156.5" x2="106.0" y2="166.5" stroke="#4a5a6b" stroke-width="1.5" stroke-linecap="round"/><line x1="106.0" y1="166.5" x2="103.4" y2="161.7" stroke="#4a5a6b" stroke-width="1.5" stroke-linecap="round"/><line x1="106.0" y1="166.5" x2="108.6" y2="161.7" stroke=