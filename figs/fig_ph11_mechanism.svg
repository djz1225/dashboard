<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 536" width="100%" style="max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px" role="img"><text x="165.0" y="22.6" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">激素作用机制：受体在哪，决定快慢</text><text x="165.0" y="43.0" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">膜受体靠第二信使（快），核受体改基因（慢）</text><rect x="15.0" y="60.0" width="300.0" height="42.0" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/><text x="27.0" y="80.0" text-anchor="start" font-size="14" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">肽类/儿茶酚胺</text><text x="305.0" y="80.0" text-anchor="end" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">快</text><text x="27.0" y="97.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">膜受体 → 第二信使（cAMP、IP₃/DG、Ca²⁺）</text><rect x="15.0" y="108.0" width="300.0" height="42.0" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/><text x="27.0" y="128.0" text-anchor="start" font-size="14" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">类固醇激素</text><text x="305.0" y="128.0" text-anchor="end" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">慢</text><text x="27.0" y="145.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">进细胞 → 核受体 → 调控基因转录</text><rect x="15.0" y="156.0" width="300.0" height="42.0" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/><text x="27.0" y="176.0" text-anchor="start" font-size="14" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">甲状腺激素</text><text x="305.0" y="176.0" text-anchor="end" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">慢</text><text x="27.0" y="193.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">同核受体，但需转运体进入细胞</text><rect x="15.0" y="208.0" width="300.0" height="150.0" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="25.0" y="227.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">激素作用的四个一般特征</text><text x="25.0" y="245.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 特异性：只与有受体的靶细胞结合</text><text x="25.0" y="261.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 信使性：传递信息，不直接参与代谢（</text><text x="25.0" y="277.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">不提供能量）</text><text x="25.0" y="293.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 高效能放大：极微量就能产生显著效应（</text><text x="25.0" y="309.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">级联放大）</text><text x="25.0" y="325.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 相互作用：协同、拮抗、允许作用（</text><text x="25.0" y="341.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">如糖皮质激素对儿茶酚胺的允许作用）</text><rect x="15.0" y="366.0" width="300.0" height="108.0" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/><text x="25.0" y="382.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">允许作用：某激素本身无直接效应，但缺它另</text><text x="25.0" y="398.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">一激素就失效（皮质醇 vs 肾上腺素）</text><text x="25.0" y="414.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">激素不提供能量、不参与代谢反应本身——只调</text><text x="25.0" y="430.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">节速率</text><text x="25.0" y="446.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">「快慢」看受体位置：膜上快（秒~分）、</text><text x="25.0" y="462.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">胞内慢（小时~天）</text><rect x="11.0" y="477.0" width="308.0" height="51.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="165.0" y="492.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">膜受体靠第二信使（快）；核受体改基因转录（</text><text x="165.0" y="507.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">慢）；激素只调速不给能</text></svg>