<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 707" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="心脏泵血：CO = HR × SV"><title>心脏泵血：CO = HR × SV</title><desc>心输出量＝心率×搏出量；搏出量受前负荷（异长调节）、后负荷（动脉压）、心肌收缩力（等长调节）影响，心率过快或过慢都使心输出量下降。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">心脏泵血：CO = HR × SV</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">搏出量看前负荷、后负荷与收缩力；心输出量还要看心率</text><rect x="18.0" y="65.0" width="364.0" height="190.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="83.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">泵血的三个基本量</text><rect x="30.0" y="93.0" width="3.0" height="15.0" rx="1.5" fill="#0f766e"/><text x="39.0" y="106.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">每搏输出量 SV</text><text x="347.0" y="106.0" text-anchor="end" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">约 70 ml</text><text x="39.0" y="124.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一侧心室一次收缩射出的血量</text><rect x="30.0" y="134.0" width="3.0" height="15.0" rx="1.5" fill="#2f8f57"/><text x="39.0" y="147.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">射血分数 EF</text><text x="347.0" y="147.0" text-anchor="end" font-size="12" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">55%~65%</text><text x="39.0" y="165.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">＝搏出量/舒张末期容积，比搏出量更敏感</text><rect x="30.0" y="175.0" width="3.0" height="15.0" rx="1.5" fill="#c0392b"/><text x="39.0" y="188.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">心输出量 CO</text><text x="347.0" y="188.0" text-anchor="end" font-size="12" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">4.5~6 L/min</text><text x="39.0" y="206.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">＝心率×搏出量；心指数约 3.0~3.5</text><rect x="30.0" y="216.0" width="3.0" height="15.0" rx="1.5" fill="#4a5a6b"/><text x="39.0" y="229.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">心力储备</text><text x="347.0" y="229.0" text-anchor="end" font-size="12" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">约 25 L/min</text><text x="39.0" y="247.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">强运动时 CO 可增至静息的 5~6 倍</text><rect x="18.0" y="267.0" width="177.0" height="188.0" rx="9" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1.1"/><text x="29.0" y="288.0" font-size="12.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">前负荷｜异长调节</text><text x="29.0" y="307.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">心室舒张末容积↑ → 心肌</text><text x="29.0" y="323.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">初长度↑</text><text x="29.0" y="343.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一定范围内收缩力↑（Frank</text><text x="29.0" y="359.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">-Starling）</text><text x="29.0" y="379.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">超出限度则过度牵拉、收缩</text><text x="29.0" y="395.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">力反而↓</text><text x="29.0" y="415.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">例：回心血量↑ → 搏出量</text><text x="29.0" y="431.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">↑</text><rect x="205.0" y="267.0" width="177.0" height="188.0" rx="9" fill="#fef3c7" stroke="#b45309" stroke-width="1.1"/><text x="216.0" y="288.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">后负荷｜动脉压</text><text x="216.0" y="307.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">动脉压↑ → 射血阻力↑ →</text><text x="216.0" y="323.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"> 搏出量↓</text><text x="216.0" y="343.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">可通过异长自身调节部分代</text><text x="216.0" y="359.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">偿</text><text x="216.0" y="379.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">高血压早期搏出量尚可维持</text><text x="216.0" y="399.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">长期后负荷↑ → 心室向心</text><text x="216.0" y="415.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">性肥厚</text><rect x="18.0" y="465.0" width="364.0" height="140.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="483.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">另外两个变量</text><rect x="30.0" y="493.0" width="3.0" height="15.0" rx="1.5" fill="#c0392b"/><text x="39.0" y="506.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">心肌收缩力</text><text x="347.0" y="506.0" text-anchor="end" font-size="12" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">等长调节</text><text x="39.0" y="524.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">交感→β₁→Ca²⁺ 内流↑→收缩力↑；不</text><text x="39.0" y="540.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">依赖初长度</text><rect x="30.0" y="550.0" width="3.0" height="15.0" rx="1.5" fill="#7b4bb7"/><text x="39.0" y="563.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">心率</text><text x="347.0" y="563.0" text-anchor="end" font-size="12" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">过快／过慢</text><text x="39.0" y="581.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">过快→舒张期缩短→充盈不足→SV↓；过慢→</text><text x="39.0" y="597.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">CO 也↓</text><rect x="18.0" y="617.0" width="364.0" height="70.0" rx="8" fill="#eef2f7"/><rect x="18.0" y="617.0" width="3.5" height="70.0" rx="1.8" fill="#4a5a6b"/><text x="32.0" y="637.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="654.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">前负荷看回心血量、后负荷看动脉压、收缩力看交感与 </text><text x="32.0" y="673.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Ca²⁺；三者决定搏出量，心率再放大成心输出量。</text></svg>