<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 525" width="100%" style="max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px" role="img"><text x="165.0" y="22.6" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">着色性干皮病：NER 缺陷</text><text x="165.0" y="43.0" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">紫外线一晒就伤</text><rect x="15.0" y="58.0" width="300.0" height="41.0" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.4"/><text x="28.0" y="77.0" text-anchor="start" font-size="12.6" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">① UV 使相邻嘧啶形成二聚体</text><text x="28.0" y="94.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">T-T 二聚体，造成螺旋扭曲</text><line x1="165.0" y1="100.0" x2="165.0" y2="99.5" stroke="#64748b" stroke-width="1.4" stroke-linecap="round"/><polygon points="165.0,104.0 163.0,99.4 167.0,99.4" fill="#64748b"/><rect x="15.0" y="105.0" width="300.0" height="41.0" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/><text x="28.0" y="124.0" text-anchor="start" font-size="12.6" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">② NER 识别并切除一段</text><text x="28.0" y="141.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">约 25~30 nt 的寡核苷酸被切掉</text><line x1="165.0" y1="147.0" x2="165.0" y2="146.5" stroke="#64748b" stroke-width="1.4" stroke-linecap="round"/><polygon points="165.0,151.0 163.0,146.4 167.0,146.4" fill="#64748b"/><rect x="15.0" y="152.0" width="300.0" height="41.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/><text x="28.0" y="171.0" text-anchor="start" font-size="12.6" font-weight="700" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">③ 聚合酶填补 + 连接酶封闭</text><text x="28.0" y="188.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">恢复原序列</text><line x1="165.0" y1="194.0" x2="165.0" y2="193.5" stroke="#64748b" stroke-width="1.4" stroke-linecap="round"/><polygon points="165.0,198.0 163.0,193.4 167.0,193.4" fill="#64748b"/><rect x="15.0" y="199.0" width="300.0" height="41.0" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.4"/><text x="28.0" y="218.0" text-anchor="start" font-size="12.6" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">④ NER 缺陷 → 二聚体残留</text><text x="28.0" y="235.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">突变累积 → 皮肤癌（20 岁前高发）</text><rect x="15.0" y="243.0" width="300.0" height="134.0" rx="7" fill="#fef3c7" stroke="#cbd5e1" stroke-width="1.4"/><text x="25.0" y="262.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">两条 NER 亚通路</text><text x="25.0" y="280.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 全基因组 NER（GG-NER）：XPC 识别全基</text><text x="25.0" y="296.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">因组的扭曲</text><text x="25.0" y="312.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 转录偶联 NER（TC-NER）：RNA 聚合酶Ⅱ </text><text x="25.0" y="328.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">遇到损伤停滞 → CSA/CSB 招募修复</text><text x="25.0" y="344.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· TC-NER 缺陷 → Cockayne 综合征（</text><text x="25.0" y="360.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">发育障碍、早老，但皮肤癌不多）</text><rect x="15.0" y="385.0" width="300.0" height="76.0" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/><text x="25.0" y="401.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">易错：着色性干皮病是 NER 缺陷，不是 MMR </text><text x="25.0" y="417.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">缺陷</text><text x="25.0" y="433.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">患者必须严格避光——防晒是主要治疗手段，</text><text x="25.0" y="449.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">不是「补充维生素」</text><rect x="11.0" y="466.0" width="308.0" height="51.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="165.0" y="481.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">UV 致嘧啶二聚体、需 NER 修复；NER 缺陷 → </text><text x="165.0" y="496.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">着色性干皮病、早发皮肤癌</text></svg>