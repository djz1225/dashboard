<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 669" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="着色性干皮病：NER 坏了，UV 就成了致癌物"><title>着色性干皮病：NER 坏了，UV 就成了致癌物</title><desc>紫外线使相邻嘧啶形成环丁烷二聚体（T-T），造成双螺旋扭曲。NER 由 XPC（GG-NER）或停滞的 RNA 聚合酶Ⅱ（TC-NER，靠 CSA/CSB 招募）识别，切除约 25~30 nt 的寡核苷酸，再由聚合酶填补、连接酶封口。NER 基因缺陷即着色性干皮病，光产物残留致突变累积，曝光部位皮肤癌多在 20 岁前发生，治疗以严格避光为主。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">着色性干皮病：NER 坏了，UV 就成了致癌物</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">嘧啶二聚体造成螺旋扭曲 → 只有 NER 能切；缺陷者 20 岁前多</text><text x="18.0" y="68.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">发皮肤癌</text><rect x="18.0" y="82.0" width="364.0" height="332.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="101.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">NER 四步</text><rect x="30.0" y="114.0" width="332.0" height="64.0" rx="8" fill="#ffffff" stroke="#e3eaf2" stroke-width="1.1"/><rect x="30.0" y="114.0" width="3.5" height="64.0" rx="1.8" fill="#c0392b"/><circle cx="49.0" cy="131.0" r="9" fill="#c0392b"/><text x="49.0" y="135.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">1</text><text x="65.0" y="135.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">① UV 造成嘧啶二聚体</text><text x="352.0" y="135.0" text-anchor="end" font-size="12" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">损伤</text><text x="65.0" y="153.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">相邻两个嘧啶共价相连（T-T），双螺旋局部</text><text x="65.0" y="169.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">扭曲，复制与转录被卡住</text><line x1="49.0" y1="180.0" x2="49.0" y2="188.0" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="188.0" x2="45.6" y2="181.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="188.0" x2="52.4" y2="181.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><rect x="30.0" y="190.0" width="332.0" height="64.0" rx="8" fill="#ffffff" stroke="#e3eaf2" stroke-width="1.1"/><rect x="30.0" y="190.0" width="3.5" height="64.0" rx="1.8" fill="#0f766e"/><circle cx="49.0" cy="207.0" r="9" fill="#0f766e"/><text x="49.0" y="211.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">2</text><text x="65.0" y="211.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">② 识别扭曲处</text><text x="352.0" y="211.0" text-anchor="end" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">XPC</text><text x="65.0" y="229.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">GG-NER 由 XPC 识别全基因组的扭曲；</text><text x="65.0" y="245.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">TC-NER 由停滞的 RNA 聚合酶Ⅱ招募CSA/CSB</text><line x1="49.0" y1="256.0" x2="49.0" y2="264.0" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="264.0" x2="45.6" y2="257.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="264.0" x2="52.4" y2="257.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><rect x="30.0" y="266.0" width="332.0" height="64.0" rx="8" fill="#ffffff" stroke="#e3eaf2" stroke-width="1.1"/><rect x="30.0" y="266.0" width="3.5" height="64.0" rx="1.8" fill="#c1440e"/><circle cx="49.0" cy="283.0" r="9" fill="#c1440e"/><text x="49.0" y="287.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">3</text><text x="65.0" y="287.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">③ 切除一段寡核苷酸</text><text x="352.0" y="287.0" text-anchor="end" font-size="12" font-weight="700" fill="#c1440e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">切除</text><text x="65.0" y="305.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">核酸内切酶在损伤两侧各切一刀，切掉约</text><text x="65.0" y="321.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">25~30 nt</text><line x1="49.0" y1="332.0" x2="49.0" y2="340.0" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="340.0" x2="45.6" y2="333.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="340.0" x2="52.4" y2="333.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><rect x="30.0" y="342.0" width="332.0" height="64.0" rx="8" fill="#ffffff" stroke="#e3eaf2" stroke-width="1.1"/><rect x="30.0" y="342.0" width="3.5" height="64.0" rx="1.8" fill="#2f8f57"/><circle cx="49.0" cy="359.0" r="9" fill="#2f8f57"/><text x="49.0" y="363.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">4</text><text x="65.0" y="363.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">④ 填补并封口</text><text x="352.0" y="363.0" text-anchor="end" font-size="12" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">复原</text><text x="65.0" y="381.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">DNA 聚合酶按对侧模板填补，连接酶封闭缺</text><text x="65.0" y="397.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">口 —— 序列恢复原样</text><rect x="18.0" y="426.0" width="364.0" height="141.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="445.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">两种缺陷，两种表型</text><rect x="30.0" y="456.0" width="3.0" height="15.0" rx="1.5" fill="#c0392b"/><text x="39.0" y="469.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">NER 缺陷</text><text x="362.0" y="469.0" text-anchor="end" font-size="12" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">光产物残留</text><text x="39.0" y="487.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">二聚体修不掉 → 突变累积 → 皮肤癌（多</text><text x="39.0" y="503.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">在 20 岁前，曝光部位）</text><rect x="30.0" y="512.0" width="3.0" height="15.0" rx="1.5" fill="#4a5a6b"/><text x="39.0" y="525.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">TC-NER 缺陷</text><text x="362.0" y="525.0" text-anchor="end" font-size="12" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Cockayne 综合征</text><text x="39.0" y="543.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">发育障碍、早老，但皮肤癌不多 ——</text><text x="39.0" y="559.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">两条亚通路表型不同</text><rect x="18.0" y="579.0" width="364.0" height="70.0" rx="8" fill="#fef3c7"/><rect x="18.0" y="579.0" width="3.5" height="70.0" rx="1.8" fill="#b45309"/><text x="32.0" y="599.0" font-size="11.5" font-weight="700" fill="#b45309" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">易错</text><text x="32.0" y="616.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">是 NER 缺陷，不是 MMR；治疗核心是严格避光防晒，不</text><text x="32.0" y="635.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">是「补维生素」。</text></svg>