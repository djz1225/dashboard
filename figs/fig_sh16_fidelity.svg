<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 739" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="翻译保真：第二套遗传密码"><title>翻译保真：第二套遗传密码</title><desc>氨酰-tRNA 合成酶负责把氨基酸接到对应 tRNA 上，是决定密码子含义的「第二套遗传密码」：① 氨基酸 + ATP → 氨酰-AMP + PPi；② 编辑位点水解错误的氨酰-AMP，筛掉相似氨基酸（Ile/Val、Thr/Ser 最易混，故校验最严）；③ 氨酰-AMP 接到 tRNA 3′-CCA 末端 A 的 3′-OH 上；④ 核糖体再按 codon-anticodon 配对复核一次。该酶须同时识别正确的氨基酸与正确的 tRNA，两重识别保证翻译保真。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">翻译保真：第二套遗传密码</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">氨酰-tRNA 合成酶同时识别「对的氨基酸」与「对的 tRNA」，并</text><text x="18.0" y="68.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">自带校对位点</text><rect x="18.0" y="82.0" width="364.0" height="329.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="101.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">四步，两处校对</text><rect x="30.0" y="114.0" width="332.0" height="64.0" rx="8" fill="#ffffff" stroke="#e3eaf2" stroke-width="1.1"/><rect x="30.0" y="114.0" width="3.5" height="64.0" rx="1.8" fill="#b45309"/><circle cx="49.0" cy="131.0" r="9" fill="#b45309"/><text x="49.0" y="135.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">1</text><text x="65.0" y="135.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">① 活化</text><text x="352.0" y="135.0" text-anchor="end" font-size="12" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">耗 2 键</text><text x="65.0" y="153.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">氨基酸 + ATP → 氨酰-AMP + PPi，形</text><text x="65.0" y="169.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">成高能混合酸酐</text><line x1="49.0" y1="180.0" x2="49.0" y2="187.0" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="187.0" x2="45.6" y2="180.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="187.0" x2="52.4" y2="180.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><rect x="30.0" y="189.0" width="332.0" height="64.0" rx="8" fill="#ffffff" stroke="#e3eaf2" stroke-width="1.1"/><rect x="30.0" y="189.0" width="3.5" height="64.0" rx="1.8" fill="#c1440e"/><circle cx="49.0" cy="206.0" r="9" fill="#c1440e"/><text x="49.0" y="210.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">2</text><text x="65.0" y="210.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">② 校对（编辑位点）</text><text x="352.0" y="210.0" text-anchor="end" font-size="12" font-weight="700" fill="#c1440e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">双筛</text><text x="65.0" y="228.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">编辑位点水解错误的氨酰-AMP，把相似的氨</text><text x="65.0" y="244.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">基酸筛掉</text><line x1="49.0" y1="255.0" x2="49.0" y2="262.0" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="262.0" x2="45.6" y2="255.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="262.0" x2="52.4" y2="255.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><rect x="30.0" y="264.0" width="332.0" height="64.0" rx="8" fill="#ffffff" stroke="#e3eaf2" stroke-width="1.1"/><rect x="30.0" y="264.0" width="3.5" height="64.0" rx="1.8" fill="#0f766e"/><circle cx="49.0" cy="281.0" r="9" fill="#0f766e"/><text x="49.0" y="285.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">3</text><text x="65.0" y="285.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">③ 转移</text><text x="352.0" y="285.0" text-anchor="end" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">接上 tRNA</text><text x="65.0" y="303.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">氨酰-AMP + tRNA → 氨酰-tRNA，酯</text><text x="65.0" y="319.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">键连到 3′-CCA 末端 A 的 3′-OH</text><line x1="49.0" y1="330.0" x2="49.0" y2="337.0" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="337.0" x2="45.6" y2="330.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="337.0" x2="52.4" y2="330.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><rect x="30.0" y="339.0" width="332.0" height="64.0" rx="8" fill="#ffffff" stroke="#e3eaf2" stroke-width="1.1"/><rect x="30.0" y="339.0" width="3.5" height="64.0" rx="1.8" fill="#0f766e"/><circle cx="49.0" cy="356.0" r="9" fill="#0f766e"/><text x="49.0" y="360.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">4</text><text x="65.0" y="360.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">④ 核糖体复核</text><text x="352.0" y="360.0" text-anchor="end" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">二次检查</text><text x="65.0" y="378.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">codon-anticodon 配对不匹配则被拒绝，</text><text x="65.0" y="394.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">延长因子校对后水解 GTP</text><rect x="18.0" y="423.0" width="364.0" height="195.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="442.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">为什么叫「第二套密码」</text><rect x="30.0" y="453.0" width="3.0" height="15.0" rx="1.5" fill="#0f766e"/><text x="39.0" y="466.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">两重识别</text><text x="362.0" y="466.0" text-anchor="end" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">氨基酸 + tRNA</text><text x="39.0" y="484.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">必须同时认对氨基酸与 tRNA，任何一</text><text x="39.0" y="500.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">步错都改变蛋白序列</text><rect x="30.0" y="508.0" width="3.0" height="15.0" rx="1.5" fill="#0f766e"/><text x="39.0" y="521.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">决定密码子含义</text><text x="362.0" y="521.0" text-anchor="end" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">实质在此</text><text x="39.0" y="539.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">密码子对应哪个氨基酸，最终由合成酶（而非</text><text x="39.0" y="555.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">密码表）裁定</text><rect x="30.0" y="563.0" width="3.0" height="15.0" rx="1.5" fill="#b45309"/><text x="39.0" y="576.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">最严的一对</text><text x="362.0" y="576.0" text-anchor="end" font-size="12" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Ile / Val</text><text x="39.0" y="594.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">只差一个亚甲基；Thr/Ser 亦然，故编辑位</text><text x="39.0" y="610.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">点最严格</text><rect x="18.0" y="630.0" width="364.0" height="89.0" rx="8" fill="#eef2f7"/><rect x="18.0" y="630.0" width="3.5" height="89.0" rx="1.8" fill="#4a5a6b"/><text x="32.0" y="650.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">易错</text><text x="32.0" y="667.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">若人为改变某 tRNA 的反密码子，它就会把氨基酸带到</text><text x="32.0" y="686.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">新位置 —— 实验证明决定权在合成酶；校对发生在活</text><text x="32.0" y="705.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">化阶段，不在核糖体上。</text></svg>