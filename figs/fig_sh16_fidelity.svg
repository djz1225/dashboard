<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 525" width="100%" style="max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px" role="img"><text x="165.0" y="22.6" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">翻译保真：两套密码</text><text x="165.0" y="43.0" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">第二套密码在氨酰-tRNA 合成酶</text><rect x="15.0" y="58.0" width="300.0" height="41.0" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/><text x="28.0" y="77.0" text-anchor="start" font-size="12.6" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">① 氨基酸 + ATP → 氨酰-AMP</text><text x="28.0" y="94.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">形成高能中间物，释放 PPi</text><line x1="165.0" y1="100.0" x2="165.0" y2="99.5" stroke="#64748b" stroke-width="1.4" stroke-linecap="round"/><polygon points="165.0,104.0 163.0,99.4 167.0,99.4" fill="#64748b"/><rect x="15.0" y="105.0" width="300.0" height="41.0" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/><text x="28.0" y="124.0" text-anchor="start" font-size="12.6" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">② 校对：筛掉相似氨基酸</text><text x="28.0" y="141.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">活性中心有「编辑位点」，水解错误的氨酰-AMP</text><line x1="165.0" y1="147.0" x2="165.0" y2="146.5" stroke="#64748b" stroke-width="1.4" stroke-linecap="round"/><polygon points="165.0,151.0 163.0,146.4 167.0,146.4" fill="#64748b"/><rect x="15.0" y="152.0" width="300.0" height="41.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/><text x="28.0" y="171.0" text-anchor="start" font-size="12.6" font-weight="700" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">③ 氨酰-AMP + tRNA → 氨酰-tRNA</text><text x="28.0" y="188.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">把氨基酸接到 tRNA 3′-CCA 的 A 上</text><line x1="165.0" y1="194.0" x2="165.0" y2="193.5" stroke="#64748b" stroke-width="1.4" stroke-linecap="round"/><polygon points="165.0,198.0 163.0,193.4 167.0,193.4" fill="#64748b"/><rect x="15.0" y="199.0" width="300.0" height="41.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.4"/><text x="28.0" y="218.0" text-anchor="start" font-size="12.6" font-weight="700" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">④ 核糖体再检查一次</text><text x="28.0" y="235.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"> codon-反密码子配对不匹配则被拒绝</text><rect x="15.0" y="243.0" width="300.0" height="134.0" rx="7" fill="#ccfbf1" stroke="#cbd5e1" stroke-width="1.4"/><text x="25.0" y="262.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">为什么叫「第二套遗传密码」</text><text x="25.0" y="280.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 密码子与氨基酸的对应关系，实际由氨酰-t</text><text x="25.0" y="296.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">RNA 合成酶决定</text><text x="25.0" y="312.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 它必须同时识别「正确的氨基酸」和「正确</text><text x="25.0" y="328.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">的 tRNA」——两重识别</text><text x="25.0" y="344.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 若人为改变某 tRNA 的反密码子，该 tRNA</text><text x="25.0" y="360.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"> 就会把氨基酸带到新位置（实验证明这一点）</text><rect x="15.0" y="385.0" width="300.0" height="76.0" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/><text x="25.0" y="401.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">易错：氨酰-tRNA 合成酶的校对发生在「活化</text><text x="25.0" y="417.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">阶段」，不在核糖体上</text><text x="25.0" y="433.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">相似氨基酸（如 Ile/Val、Thr/Ser）最易混</text><text x="25.0" y="449.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">淆，故这些酶的编辑位点最严格</text><rect x="11.0" y="466.0" width="308.0" height="51.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="165.0" y="481.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">氨酰-tRNA 合成酶做双重识别与校对，是决定密</text><text x="165.0" y="496.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">码子含义的「第二套密码」</text></svg>