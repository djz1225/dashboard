<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 683" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="GPCR—G 蛋白—效应酶：一个受体，三条下游"><title>GPCR—G 蛋白—效应酶：一个受体，三条下游</title><desc>GPCR 激活后换掉 α 亚基上的 GDP：Gs 激活腺苷酸环化酶使 cAMP 升高、PKA 激活；Gi 抑制腺苷酸环化酶使 cAMP 下降；Gq 激活磷脂酶 C 生成 IP₃ 与 DAG，升高 Ca²⁺ 并激活 PKC。霍乱毒素 ADP-核糖基化 Gsα 使其持续活化，百日咳毒素修饰 Giα 使其不能抑制，两者都致 cAMP 升高但靶点不同。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">GPCR—G 蛋白—效应酶：一个受体，三条下游</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Gs 升 cAMP、Gi 降 cAMP、Gq 走 PLC 产 IP₃+DAG；α 亚基</text><text x="18.0" y="68.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">结合 GTP 才有活性</text><rect x="18.0" y="82.0" width="364.0" height="170.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="101.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">四段接力</text><text x="30.0" y="122.0" font-size="11.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">细胞外</text><rect x="30.0" y="126.0" width="332.0" height="40.0" rx="4" fill="#eef2f7"/><line x1="30.0" y1="126.0" x2="362.0" y2="126.0" stroke="#4a5a6b" stroke-width="1.2" stroke-dasharray="4 4" stroke-linecap="round"/><line x1="30.0" y1="166.0" x2="362.0" y2="166.0" stroke="#4a5a6b" stroke-width="1.2" stroke-dasharray="4 4" stroke-linecap="round"/><rect x="56.0" y="119.0" width="11.5" height="54.0" rx="4" fill="#e2f5f2" stroke="#0f766e" stroke-width="1.1"/><rect x="71.0" y="119.0" width="11.5" 