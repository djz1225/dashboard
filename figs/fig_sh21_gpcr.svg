d"/><line x1="148.0" y1="209.0" x2="180.0" y2="209.0" stroke="#8095a8" stroke-width="1.4" stroke-linecap="round"/><line x1="180.0" y1="209.0" x2="175.6" y2="211.4" stroke="#8095a8" stroke-width="1.4" stroke-linecap="round"/><line x1="180.0" y1="209.0" x2="175.6" y2="206.6" stroke="#8095a8" stroke-width="1.4" stroke-linecap="round"/><rect x="182.0" y="196.0" width="104.0" height="26.0" rx="6" fill="#fde8dd" stroke="#c1440e" stroke-width="1.1"/><text x="234.0" y="213.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c1440e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">效应酶</text><text x="234.0" y="232.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#c1440e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">腺苷酸环化酶 / PLC</text><line x1="288.0" y1="209.0" x2="318.0" y2="209.0" stroke="#8095a8" stroke-width="1.4" stroke-linecap="round"/><line x1="318.0" y1="209.0" x2="313.6" y2="211.4" stroke="#8095a8" stroke-width="1.4" stroke-linecap="round"/><line x1="318.0" y1="209.0" x2="313.6" y2="206.6" stroke="#8095a8" stroke-width="1.4" stroke-linecap="round"/><text x="322.0" y="206.0" font-size="11.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">第二信使</text><text x="322.0" y="221.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">cAMP / IP₃</text><rect x="18.0" y="264.0" width="364.0" height="26.0" rx="6" fill="#f8fbfd"/><text x="26.0" y="281.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">G 蛋白</text><text x="91.5" y="281.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">效应酶 → 第二信使</text><text x="251.7" y="281.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">下游结果</text><line x1="18.0" y1="332.0" x2="382.0" y2="332.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="308.0" font-size="12.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Gs</text><text x="91.5" y="308.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">腺苷酸环化酶 ↑ → cA</text><text x="91.5" y="324.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">MP↑</text><text x="251.7" y="308.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">PKA 激活</text><line x1="18.0" y1="374.0" x2="382.0" y2="374.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="350.0" font-size="12.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Gi</text><text x="91.5" y="350.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">腺苷酸环化酶 ↓ → cA</text><text x="91.5" y="366.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">MP↓</text><text x="251.7" y="350.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">PKA 抑制</text><line x1="18.0" y1="416.0" x2="382.0" y2="416.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="392.0" font-size="12.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Gq</text><text x="91.5" y="392.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">磷脂酶 C ↑ → IP₃</text><text x="91.5" y="408.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"> +DAG</text><text x="251.7" y="392.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Ca²⁺↑ + PKC 激活</text><rect x="18.0" y="424.0" width="364.0" height="157.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="443.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">两条毒素，作用点不同</text><rect x="30.0" y="454.0" width="3.0" height="15.0" rx="1.5" fill="#c0392b"/><text x="39.0" y="467.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">霍乱毒素</text><text x="362.0" y="467.0" text-anchor="end" font-size="12" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">锁死 Gs</text><text x="39.0" y="485.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">ADP-核糖基化 Gsα → 失去 GTP 酶活性</text><text x="39.0" y="501.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">→cAMP 持续升高 → 大量分泌 Cl⁻ 与水</text><text x="39.0" y="517.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">→水样泻</text><rect x="30.0" y="526.0" width="3.0" height="15.0" rx="1.5" fill="#1f6fb2"/><text x="39.0" y="539.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">百日咳毒素</text><text x="362.0" y="539.0" text-anchor="end" font-size="12" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">锁死 Gi</text><text x="39.0" y="557.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">ADP-核糖基化 Giα → 无法抑制腺苷酸环化</text><text x="39.0" y="573.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">酶 → cAMP 同样升高；方向相似，靶点不同</text><rect x="18.0" y="593.0" width="364.0" height="70.0" rx="8" fill="#e2f5f2"/><rect x="18.0" y="593.0" width="3.5" height="70.0" rx="1.8" fill="#0f766e"/><text x="32.0" y="613.0" font-size="11.5" font-weight="700" fill="#0f766e" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="630.0" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Gα 结合 GTP 才有活性、水解 GTP 即关闭；Gq 走</text><text x="32.0" y="649.0" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">PLC，不碰腺苷酸环化酶。</text></svg>