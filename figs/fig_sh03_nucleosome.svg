<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 560" width="100%" style="max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px" role="img"><text x="165.0" y="22.6" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">DNA 的四级包装</text><text x="165.0" y="43.0" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">2 m DNA 装进 6 μm 细胞核，压缩约 8000 倍</text><rect x="15.0" y="58.0" width="300.0" height="50.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><rect x="15.0" y="58.0" width="5.0" height="50.0" rx="2.5" fill="#0f766e"/><text x="29.0" y="78.0" text-anchor="start" font-size="14" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">① 双螺旋</text><text x="305.0" y="78.0" text-anchor="end" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">≈ ×1</text><text x="29.0" y="95.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">直径 2 nm</text><rect x="15.0" y="113.0" width="300.0" height="50.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><rect x="15.0" y="113.0" width="5.0" height="50.0" rx="2.5" fill="#b45309"/><text x="29.0" y="133.0" text-anchor="start" font-size="14" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">② 核小体</text><text x="305.0" y="133.0" text-anchor="end" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">≈ ×6</text><text x="29.0" y="150.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">146 bp 绕 H2A/H2B/H3/H4 八聚体 1.75 圈</text><rect x="15.0" y="168.0" width="300.0" height="50.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><rect x="15.0" y="168.0" width="5.0" height="50.0" rx="2.5" fill="#15803d"/><text x="29.0" y="188.0" text-anchor="start" font-size="14" font-weight="700" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">③ 螺线管</text><text x="305.0" y="188.0" text-anchor="end" font-size="13.5" font-weight="700" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">≈ ×40</text><text x="29.0" y="205.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">6 个核小体一圈，直径 30 nm</text><rect x="15.0" y="223.0" width="300.0" height="50.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><rect x="15.0" y="223.0" width="5.0" height="50.0" rx="2.5" fill="#b91c1c"/><text x="29.0" y="243.0" text-anchor="start" font-size="14" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">④ 襻环 / 染色体</text><text x="305.0" y="243.0" text-anchor="end" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">≈ ×8000</text><text x="29.0" y="260.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">非组蛋白支架，进一步压缩</text><rect x="15.0" y="278.0" width="300.0" height="134.0" rx="7" fill="#fef3c7" stroke="#cbd5e1" stroke-width="1.4"/><text x="25.0" y="297.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">核小体的三个数字</text><text x="25.0" y="315.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 146 bp DNA 盘绕核心颗粒 1.75 圈，</text><text x="25.0" y="331.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">外加 20~60 bp 连接 DNA</text><text x="25.0" y="347.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 组蛋白八聚体：H2A、H2B、H3、H4 各 2 </text><text x="25.0" y="363.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">个；H1 结合在入口/出口</text><text x="25.0" y="379.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 核心颗粒直径约 11 nm，加 H1 后约 10 n</text><text x="25.0" y="395.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">m 的「串珠」</text><rect x="15.0" y="420.0" width="300.0" height="76.0" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/><text x="25.0" y="436.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">临床：组蛋白乙酰化 → 染色质疏松 → 转录活</text><text x="25.0" y="452.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">跃；去乙酰化则沉默</text><text x="25.0" y="468.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">HDAC 抑制剂（如丙戊酸）正是靠「松开染色</text><text x="25.0" y="484.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">质」起效</text><rect x="11.0" y="501.0" width="308.0" height="51.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="165.0" y="516.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">核小体（146 bp/1.75 圈）→ 30 nm 螺线管 →</text><text x="165.0" y="531.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"> 襻环，总压缩约 8000 倍</text></svg>