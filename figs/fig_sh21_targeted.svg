<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 504" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="靶向药：先有突变，才有药"><title>靶向药：先有突变，才有药</title><desc>靶向治疗以驱动性异常为靶：BCR-ABL 融合（t(9;22)）用伊马替尼，HER2 扩增用曲妥珠单抗，BRAF V600E 用维莫非尼，EGFR 敏感突变用吉非替尼，K-RAS G12C 用索托拉西布。胞内激酶靶点用小分子 TKI（多竞争 ATP 位点），胞外域靶点用抗体。用药前需基因检测确认靶点。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">靶向药：先有突变，才有药</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">药只认特定的异常蛋白；用药前必须做基因检测，无靶点则无效</text><rect x="18.0" y="65.0" width="364.0" height="26.0" rx="6" fill="#f8fbfd"/><text x="26.0" y="82.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">突变 / 异常</text><text x="127.9" y="82.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肿瘤（分子特征）</text><text x="266.2" y="82.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">对应药物</text><line x1="18.0" y1="133.0" x2="382.0" y2="133.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="109.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">BCR-ABL</text><text x="127.9" y="109.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">慢性髓性白血病</text><text x="127.9" y="125.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">（t(9;22)）</text><text x="266.2" y="109.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">伊马替尼</text><line x1="18.0" y1="159.0" x2="382.0" y2="159.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="151.0" font-size="12.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">HER2 扩增</text><text x="127.9" y="151.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">乳腺癌、胃癌（过表达）</text><text x="266.2" y="151.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">曲妥珠单抗</text><line x1="18.0" y1="185.0" x2="382.0" y2="185.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="177.0" font-size="12.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">BRAF V600E</text><text x="127.9" y="177.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">黑色素瘤（点突变）</text><text x="266.2" y="177.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">维莫非尼</text><line x1="18.0" y1="211.0" x2="382.0" y2="211.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="203.0" font-size="12.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">EGFR 突变</text><text x="127.9" y="203.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">非小细胞肺癌（L858R）</text><text x="266.2" y="203.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">吉非替尼</text><line x1="18.0" y1="253.0" x2="382.0" y2="253.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="229.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">K-RAS G12C</text><text x="127.9" y="229.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肺癌、结直肠癌</text><text x="127.9" y="245.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">（点突变）</text><text x="266.2" y="229.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">索托拉西布</text><rect x="18.0" y="261.0" width="364.0" height="141.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="280.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">靶点在哪，决定用什么药</text><rect x="30.0" y="291.0" width="3.0" height="15.0" rx="1.5" fill="#c1440e"/><text x="39.0" y="304.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胞内靶点</text><text x="362.0" y="304.0" text-anchor="end" font-size="12" font-weight="700" fill="#c1440e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">用小分子</text><text x="39.0" y="322.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">BCR-ABL、BRAF 是胞内激酶 → TKI 可进胞</text><text x="39.0" y="338.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">内，多与 ATP 竞争激酶结构域</text><rect x="30.0" y="347.0" width="3.0" height="15.0" rx="1.5" fill="#1f6fb2"/><text x="39.0" y="360.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胞外靶点</text><text x="362.0" y="360.0" text-anchor="end" font-size="12" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">用抗体</text><text x="39.0" y="378.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">HER2 的靶点在胞外域 → 抗体结合后阻断二聚</text><text x="39.0" y="394.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">化并被免疫清除</text><rect x="18.0" y="414.0" width="364.0" height="70.0" rx="8" fill="#fef3c7"/><rect x="18.0" y="414.0" width="3.5" height="70.0" rx="1.8" fill="#b45309"/><text x="32.0" y="434.0" font-size="11.5" font-weight="700" fill="#b45309" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">易错</text><text x="32.0" y="451.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">TKI 多为竞争 ATP 结合位点，不是降解蛋白；耐药常来</text><text x="32.0" y="470.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">自靶点二次突变或旁路激活。</text></svg>