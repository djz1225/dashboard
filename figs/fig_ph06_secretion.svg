<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 728" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="消化液分泌"><title>消化液分泌</title><desc>唾液、胃液、胰液、胆汁、小肠液各有分工；胰液消化力最强、胰蛋白酶原靠肠激酶激活；胆汁不含消化酶，仅靠胆盐乳化脂肪。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">消化液分泌：谁分泌、分泌什么、受谁调节</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">记住「部位—细胞—成分—调节」四列就够了</text><rect x="18.0" y="65.0" width="364.0" height="259.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="83.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">五类消化液对照表</text><rect x="18.0" y="93.0" width="316.0" height="24.0" rx="6" fill="#e2f5f2"/><text x="24.0" y="109.0" font-size="10.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">部位</text><text x="77.7" y="109.0" font-size="10.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">分泌细胞</text><text x="144.1" y="109.0" font-size="10.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">主要成分</text><text x="251.5" y="109.0" font-size="10.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">调节</text><line x1="18.0" y1="156.0" x2="334.0" y2="156.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="24.0" y="134.0" font-size="12" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">唾液</text><text x="77.7" y="134.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">腺泡细胞</text><text x="144.1" y="134.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">唾液淀粉酶、黏蛋</text><text x="144.1" y="149.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">白</text><text x="251.5" y="134.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">副交感为主（</text><text x="251.5" y="149.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">量多）</text><line x1="18.0" y1="195.0" x2="334.0" y2="195.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="24.0" y="173.0" font-size="12" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胃液</text><text x="77.7" y="173.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">壁／主细</text><text x="77.7" y="188.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胞</text><text x="144.1" y="173.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">盐酸、内因子、胃</text><text x="144.1" y="188.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">蛋白酶原</text><text x="251.5" y="173.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">迷走、胃泌素、</text><text x="251.5" y="188.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">组胺</text><line x1="18.0" y1="234.0" x2="334.0" y2="234.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="24.0" y="212.0" font-size="12" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胰液</text><text x="77.7" y="212.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">腺泡／导</text><text x="77.7" y="227.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">管</text><text x="144.1" y="212.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">全套消化酶＋HCO</text><text x="144.1" y="227.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">₃⁻</text><text x="251.5" y="212.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">促胰液素、CCK、</text><text x="251.5" y="227.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">迷走</text><line x1="18.0" y1="273.0" x2="334.0" y2="273.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="24.0" y="251.0" font-size="12" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胆汁</text><text x="77.7" y="251.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肝细胞</text><text x="144.1" y="251.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胆盐（无消化酶）</text><text x="251.5" y="251.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">促胰液素、胆</text><text x="251.5" y="266.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">盐肠肝循环</text><line x1="18.0" y1="312.0" x2="334.0" y2="312.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="24.0" y="290.0" font-size="12" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">小肠液</text><text x="77.7" y="290.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肠腺／上</text><text x="77.7" y="305.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">皮</text><text x="144.1" y="290.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肠激酶、双糖酶、</text><text x="144.1" y="305.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肽酶</text><text x="251.5" y="290.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">局部刺激为主</text><rect x="18.0" y="330.0" width="3.0" height="14.0" rx="1.5" fill="#0f766e"/><text x="28.0" y="340.0" font-size="13.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胰液与胆汁：消化两大主力</text><rect x="18.0" y="352.0" width="177.0" height="156.0" rx="9" fill="#f2ecfb" stroke="#7b4bb7" stroke-width="1.1"/><text x="29.0" y="373.0" font-size="12.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胰液｜消化力最强</text><text x="29.0" y="392.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">碳酸氢盐中和胃酸、提供适</text><text x="29.0" y="408.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">宜 pH</text><text x="29.0" y="428.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胰蛋白酶原需肠激酶激活（</text><text x="29.0" y="444.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">级联放大）</text><text x="29.0" y="464.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胰脂肪酶需胆盐协同</text><text x="29.0" y="484.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胰淀粉酶分解淀粉为麦芽糖</text><rect x="205.0" y="352.0" width="177.0" height="156.0" rx="9" fill="#e6f6ec" stroke="#2f8f57" stroke-width="1.1"/><text x="216.0" y="373.0" font-size="12.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胆汁｜不含消化酶</text><text x="216.0" y="392.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胆盐乳化脂肪、形成微胶粒</text><text x="216.0" y="412.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">促进脂肪与脂溶性维生素吸</text><text x="216.0" y="428.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">收</text><text x="216.0" y="448.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胆色素是血红蛋白代谢产物</text><text x="216.0" y="468.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胆囊收缩靠 CCK，分泌靠促</text><text x="216.0" y="484.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胰液素</text><rect x="18.0" y="518.0" width="364.0" height="108.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="536.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">两点提醒</text><rect x="30.0" y="546.0" width="3.0" height="15.0" rx="1.5" fill="#c0392b"/><text x="39.0" y="559.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">激活级联</text><text x="347.0" y="559.0" text-anchor="end" font-size="12" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">急性胰腺炎</text><text x="39.0" y="577.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胰蛋白酶原早激活 → 自身消化胰腺</text><rect x="30.0" y="587.0" width="3.0" height="15.0" rx="1.5" fill="#4a5a6b"/><text x="39.0" y="600.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胆囊切除</text><text x="347.0" y="600.0" text-anchor="end" font-size="12" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">脂肪耐受差</text><text x="39.0" y="618.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胆盐仍可由肝直接分泌入肠，脂肪消化受影响</text><rect x="18.0" y="638.0" width="364.0" height="70.0" rx="8" fill="#eef2f7"/><rect x="18.0" y="638.0" width="3.5" height="70.0" rx="1.8" fill="#4a5a6b"/><text x="32.0" y="658.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="675.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胆汁没有消化酶，靠物理乳化；胰蛋白酶原在肠内被肠激</text><text x="32.0" y="694.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">酶激活——这是级联放大的起点。</text></svg>