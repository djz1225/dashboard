<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 561" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="生理性止血：三个阶段"><title>生理性止血：三个阶段</title><desc>血管收缩、血小板止血栓（黏附-激活-聚集）、血液凝固三阶段；凝血只是第三步。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">生理性止血：三个阶段</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">血管收缩 → 血小板栓 → 凝血块；凝血只是第三步</text><rect x="18.0" y="65.0" width="364.0" height="218.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="83.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">三阶段（顺序必考）</text><rect x="30.0" y="93.0" width="316.0" height="60.0" rx="8" fill="#fdeceb" stroke="#c0392b" stroke-width="1.1"/><rect x="30.0" y="93.0" width="3.2" height="60.0" rx="1.6" fill="#c0392b"/><circle cx="48" cy="110" r="8.5" fill="#c0392b"/><text x="48.0" y="114.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">1</text><text x="63.0" y="114.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">血管收缩</text><text x="335.0" y="114.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">30 秒内</text><text x="63.0" y="131.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">损伤即刻反射性收缩 + 5-HT/TXA₂，使血</text><text x="63.0" y="147.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">流减慢</text><line x1="48.0" y1="155.0" x2="48.0" y2="168.0" stroke="#4a5a6b" stroke-width="1.8" stroke-linecap="round"/><line x1="48.0" y1="168.0" x2="44.6" y2="161.9" stroke="#4a5a6b" stroke-width="1.8" stroke-linecap="round"/><line x1="48.0" y1="168.0" x2="51.4" y2="161.9" stroke="#4a5a6b" stroke-width="1.8" stroke-linecap="round"/><rect x="30.0" y="170.0" width="316.0" height="44.0" rx="8" fill="#e2f5f2" stroke="#0f766e" stroke-width="1.1"/><rect x="30.0" y="170.0" width="3.2" height="44.0" rx="1.6" fill="#0f766e"/><circle cx="48" cy="187" r="8.5" fill="#0f766e"/><text x="48.0" y="191.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">2</text><text x="63.0" y="191.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">血小板止血栓</text><text x="335.0" y="191.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">早期</text><text x="63.0" y="208.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">黏附（vWF）→ 激活 → 聚集（GPⅡb/Ⅲa）</text><line x1="48.0" y1="216.0" x2="48.0" y2="229.0" stroke="#4a5a6b" stroke-width="1.8" stroke-linecap="round"/><line x1="48.0" y1="229.0" x2="44.6" y2="222.9" stroke="#4a5a6b" stroke-width="1.8" stroke-linecap="round"/><line x1="48.0" y1="229.0" x2="51.4" y2="222.9" stroke="#4a5a6b" stroke-width="1.8" stroke-linecap="round"/><rect x="30.0" y="231.0" width="316.0" height="44.0" rx="8" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1.1"/><rect x="30.0" y="231.0" width="3.2" height="44.0" rx="1.6" fill="#1f6fb2"/><circle cx="48" cy="248" r="8.5" fill="#1f6fb2"/><text x="48.0" y="252.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">3</text><text x="63.0" y="252.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">血液凝固</text><text x="335.0" y="252.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">数分钟</text><text x="63.0" y="269.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">凝血因子级联 → 凝血酶 → 纤维蛋白网</text><rect x="18.0" y="295.0" width="364.0" height="145.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="313.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">血小板三步</text><rect x="31.0" y="323.0" width="3.0" height="15.0" rx="1.5" fill="#1f6fb2"/><text x="40.0" y="336.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">黏附</text><text x="344.0" y="336.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">要 vWF</text><text x="40.0" y="354.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">血小板 + 内皮下胶原，vWF 搭桥</text><rect x="31.0" y="362.0" width="3.0" height="15.0" rx="1.5" fill="#b45309"/><text x="40.0" y="375.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">激活</text><text x="344.0" y="375.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">放颗粒</text><text x="40.0" y="393.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">形态改变，释放 ADP、5-HT、TXA₂</text><rect x="31.0" y="401.0" width="3.0" height="15.0" rx="1.5" fill="#0f766e"/><text x="40.0" y="414.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">聚集</text><text x="344.0" y="414.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">GPⅡb/Ⅲa</text><text x="40.0" y="432.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">结合纤维蛋白原把血小板连起来</text><rect x="18.0" y="452.0" width="364.0" height="89.0" rx="8" fill="#eef2f7"/><rect x="18.0" y="452.0" width="3.5" height="89.0" rx="1.8" fill="#4a5a6b"/><text x="32.0" y="472.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="489.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">止血＝生理全过程；凝血＝其中第三阶段（只管纤维蛋白</text><text x="32.0" y="508.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">形成）。阿司匹林不可逆抑制 COX-1 → TXA₂↓ → </text><text x="32.0" y="527.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">聚集受抑。</text></svg>