<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 565.5" width="100%" style="max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px" role="img"><text x="165.0" y="22.6" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">生理性止血：三个阶段</text><text x="165.0" y="42.6" text-anchor="middle" font-size="13.5" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">血管收缩 → 血小板栓 → 凝血块，最后靠纤溶收尾</text><rect x="15.0" y="59.5" width="300.0" height="54.0" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/><text x="27.0" y="79.5" text-anchor="start" font-size="14" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">① 血管收缩</text><text x="27.0" y="97.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">损伤即刻，反射性 + 5-HT/TXA₂ 收缩，</text><text x="27.0" y="113.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">30 秒内</text><line x1="165.0" y1="114.5" x2="165.0" y2="116.0" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/><polygon points="165.0,120.5 163.0,115.9 167.0,115.9" fill="#64748b"/><rect x="15.0" y="121.5" width="300.0" height="54.0" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/><text x="27.0" y="141.5" text-anchor="start" font-size="14" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">② 血小板止血栓</text><text x="27.0" y="159.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">黏附（vWF）→ 激活 → 聚集（GPⅡb/Ⅲa + 纤</text><text x="27.0" y="175.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">维蛋白原）</text><line x1="165.0" y1="176.5" x2="165.0" y2="178.0" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/><polygon points="165.0,182.5 163.0,177.9 167.0,177.9" fill="#64748b"/><rect x="15.0" y="183.5" width="300.0" height="38.0" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.4"/><text x="27.0" y="203.5" text-anchor="start" font-size="14" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">③ 血液凝固</text><text x="27.0" y="221.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">凝血因子级联，纤维蛋白网包裹血细胞</text><line x1="165.0" y1="222.5" x2="165.0" y2="224.0" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/><polygon points="165.0,228.5 163.0,223.9 167.0,223.9" fill="#64748b"/><rect x="15.0" y="229.5" width="300.0" height="54.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.4"/><text x="27.0" y="249.5" text-anchor="start" font-size="14" font-weight="700" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">④ 血块收缩与溶解</text><text x="27.0" y="267.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">血小板收缩蛋白使血块回缩；纤溶系统逐步溶</text><text x="27.0" y="283.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">解</text><rect x="15.0" y="285.5" width="300.0" height="134.0" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="25.0" y="304.5" text-anchor="start" font-size="13.5" font-weight="700" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">血小板的三步（必考顺序）</text><text x="25.0" y="322.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 黏附：血小板 + 内皮下胶原，需 vWF 搭</text><text x="25.0" y="338.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">桥</text><text x="25.0" y="354.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 激活：形状改变、释放颗粒（ADP、5-HT、</text><text x="25.0" y="370.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">TXA₂）</text><text x="25.0" y="386.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 聚集：GPⅡb/Ⅲa 结合纤维蛋白原，</text><text x="25.0" y="402.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">把血小板连起来</text><rect x="15.0" y="427.5" width="300.0" height="76.0" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/><text x="25.0" y="443.5" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">区分：止血＝生理过程；凝血＝其中第三阶段（</text><text x="25.0" y="459.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">只讲纤维蛋白形成）</text><text x="25.0" y="475.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">阿司匹林抗血小板：不可逆抑制 COX-1 → TXA</text><text x="25.0" y="491.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">₂ 减少 → 聚集受抑</text><rect x="11.0" y="506.5" width="308.0" height="51.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="165.0" y="521.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">止血三阶段：血管收缩→血小板栓→凝血块；</text><text x="165.0" y="537.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">凝血只是第三步</text></svg>