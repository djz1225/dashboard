<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 657" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="视觉：折光系统与感光换能"><title>视觉：折光系统与感光换能</title><desc>屈光间质为角膜（43 D 最强、不可调）、房水、晶状体（19 D、可调）、玻璃体，视网膜不属于屈光间质；视杆细胞管暗光觉，视锥细胞管明视觉与色觉；看近物时晶状体变凸、瞳孔缩小、双眼会聚。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">视觉：折光系统与感光换能</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">角膜管大折光、晶状体管调节、视网膜管换能</text><rect x="18.0" y="59.0" width="3.0" height="14.0" rx="1.5" fill="#0f766e"/><text x="28.0" y="69.0" font-size="13.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">折光系统（屈光间质）</text><rect x="18.0" y="81.0" width="364.0" height="23.0" rx="6" fill="#e2f5f2"/><text x="25.0" y="97.0" font-size="11" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">结构</text><text x="105.1" y="97.0" font-size="11" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">折光力 / 特点</text><text x="217.9" y="97.0" font-size="11" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话机制</text><line x1="18.0" y1="145.0" x2="382.0" y2="145.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="25.0" y="122.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">角膜</text><text x="105.1" y="122.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">约 43 D，最强</text><text x="217.9" y="122.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">提供约 2/3 折光力，但</text><text x="217.9" y="138.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">不可调节</text><line x1="18.0" y1="186.0" x2="382.0" y2="186.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="25.0" y="163.0" font-size="12.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">房水</text><text x="105.1" y="163.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">屈光 + 营养</text><text x="217.9" y="163.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">循环受阻 → 眼压↑ → </text><text x="217.9" y="179.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">青光眼</text><line x1="18.0" y1="227.0" x2="382.0" y2="227.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="25.0" y="204.0" font-size="12.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">晶状体</text><text x="105.1" y="204.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">约 19 D，可调</text><text x="217.9" y="204.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">看近时变凸（睫状肌收缩、悬</text><text x="217.9" y="220.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">韧带松弛）</text><line x1="18.0" y1="268.0" x2="382.0" y2="268.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="25.0" y="245.0" font-size="12.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">玻璃体</text><text x="105.1" y="245.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">占容积 4/5</text><text x="217.9" y="245.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">参与折光、支撑视网膜（非屈</text><text x="217.9" y="261.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">光主角）</text><rect x="18.0" y="276.0" width="177.0" height="124.0" rx="9" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1.1"/><text x="29.0" y="297.0" font-size="12.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">视杆细胞</text><text x="29.0" y="316.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">含视紫红质，暗光觉</text><text x="29.0" y="336.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">无色觉、光敏度高</text><text x="29.0" y="356.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">周边多，中央凹没有</text><text x="29.0" y="376.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">维生素 A 缺乏 → 夜盲</text><rect x="205.0" y="276.0" width="177.0" height="124.0" rx="9" fill="#fef3c7" stroke="#b45309" stroke-width="1.1"/><text x="216.0" y="297.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">视锥细胞</text><text x="216.0" y="316.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">三种视色素，明视觉＋色觉</text><text x="216.0" y="336.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">中央凹密集 → 视锐度最高</text><text x="216.0" y="356.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">光敏度低，暗处看不清</text><rect x="18.0" y="410.0" width="364.0" height="145.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="428.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">调节与屈光不正</text><rect x="31.0" y="438.0" width="3.0" height="15.0" rx="1.5" fill="#0f766e"/><text x="40.0" y="451.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">近反射</text><text x="344.0" y="451.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">三联动</text><text x="40.0" y="469.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">晶状体变凸 ＋ 瞳孔缩小 ＋ 双眼会聚（内直肌收缩）</text><rect x="31.0" y="477.0" width="3.0" height="15.0" rx="1.5" fill="#b45309"/><text x="40.0" y="490.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">近视</text><text x="344.0" y="490.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">像在膜前</text><text x="40.0" y="508.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">眼轴过长或折光过强 → 凹透镜矫正</text><rect x="31.0" y="516.0" width="3.0" height="15.0" rx="1.5" fill="#1f6fb2"/><text x="40.0" y="529.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">远视</text><text x="344.0" y="529.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">像在膜后</text><text x="40.0" y="547.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">眼轴过短或折光不足 → 凸透镜矫正</text><rect x="18.0" y="567.0" width="364.0" height="70.0" rx="8" fill="#eef2f7"/><rect x="18.0" y="567.0" width="3.5" height="70.0" rx="1.8" fill="#4a5a6b"/><text x="32.0" y="587.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="604.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">角膜折光最强但不可调，晶状体可调；视杆管暗光、视锥</text><text x="32.0" y="623.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">管色觉与锐度——中央凹只有视锥。</text></svg>