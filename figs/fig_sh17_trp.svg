<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 639" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="色氨酸操纵子：阻遏 + 衰减"><title>色氨酸操纵子：阻遏 + 衰减</title><desc>色氨酸操纵子有双重调控：① 阻遏 —— 色氨酸充足时与阻遏蛋白结合并阻断转录起始，属全或无的粗调；② 衰减 —— 前导区 4 段序列的配对方式取决于核糖体翻译前导肽的速度：色氨酸充足时核糖体顺利通过 1 区，2-3 不配对而 3-4 配对形成终止发夹，转录提前终止；色氨酸缺乏时核糖体停在 1 区的 Trp 密码子，2-3 配对形成抗终止结构，转录继续。衰减提供约 10 倍的连续调节，其前提是原核边转录边翻译。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">色氨酸操纵子：阻遏 + 衰减</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">粗调靠阻遏（全或无），细调靠衰减（约 10 倍）；都建立在边</text><text x="18.0" y="68.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">转录边翻译之上</text><rect x="18.0" y="82.0" width="364.0" height="134.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="101.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">元件与前导区</text><rect x="30.0" y="114.0" width="41.3" height="20.0" rx="3" fill="#e2f5f2" stroke="#0f766e" stroke-width="1"/><text x="51.5" y="127.4" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">P</text><rect x="72.9" y="114.0" width="41.3" height="20.0" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1"/><text x="94.4" y="127.4" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">O</text><rect x="115.8" y="114.0" width="97.4" height="20.0" rx="3" fill="#e2f5f2" stroke="#0f766e" stroke-width="1"/><text x="165.3" y="127.4" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">前导区</text><rect x="214.8" y="114.0" width="143.6" height="20.0" rx="3" fill="#eef2f7" stroke="#4a5a6b" stroke-width="1"/><text x="287.4" y="127.4" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">trpE…A</text><text x="30.0" y="154.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">前导区的 4 段序列（1·2·3·4）决定形成哪种发夹：</text><rect x="30.0" y="164.0" width="78.0" height="18.0" rx="3" fill="#eef2f7" stroke="#4a5a6b" stroke-width="1"/><text x="69.0" y="177.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">1 区</text><rect x="114.0" y="164.0" width="78.0" height="18.0" rx="3" fill="#e2f5f2" stroke="#0f766e" stroke-width="1"/><text x="153.0" y="177.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">2 区</text><rect x="198.0" y="164.0" width="78.0" height="18.0" rx="3" fill="#e2f5f2" stroke="#0f766e" stroke-width="1"/><text x="237.0" y="177.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">3 区</text><rect x="282.0" y="164.0" width="78.0" height="18.0" rx="3" fill="#eef2f7" stroke="#4a5a6b" stroke-width="1"/><text x="321.0" y="177.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">4 区</text><text x="30.0" y="198.0" font-size="11.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">2-3 配对 = 抗终止（继续转录）</text><text x="201.6" y="198.0" font-size="11.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">3-4 配对 = 终止发夹</text><rect x="18.0" y="228.0" width="177.0" height="120.0" rx="9" fill="#fdeceb" stroke="#c0392b" stroke-width="1.1"/><text x="29.0" y="249.0" font-size="12.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">色氨酸充足</text><text x="29.0" y="268.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">核糖体紧跟，顺利通过 1 区</text><text x="29.0" y="288.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">2-3 不配对 → 3-4 配对</text><text x="29.0" y="308.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">形成终止发夹，转录提前终止</text><rect x="205.0" y="228.0" width="177.0" height="120.0" rx="9" fill="#e6f6ec" stroke="#2f8f57" stroke-width="1.1"/><text x="216.0" y="249.0" font-size="12.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">色氨酸缺乏</text><text x="216.0" y="268.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">核糖体停在 1 区的 Trp</text><text x="216.0" y="284.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"> 密码子</text><text x="216.0" y="304.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">2-3 配对（抗终止）</text><text x="216.0" y="324.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">RNA 聚合酶继续转录</text><rect x="18.0" y="358.0" width="364.0" height="179.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="377.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">为什么需要第二道闸</text><rect x="30.0" y="388.0" width="3.0" height="15.0" rx="1.5" fill="#4a5a6b"/><text x="39.0" y="401.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">单靠阻遏不够</text><text x="362.0" y="401.0" text-anchor="end" font-size="12" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">全或无</text><text x="39.0" y="419.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">阻遏只能开或关，无法按浓度微调产量</text><rect x="30.0" y="427.0" width="3.0" height="15.0" rx="1.5" fill="#0f766e"/><text x="39.0" y="440.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">衰减补上细调</text><text x="362.0" y="440.0" text-anchor="end" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">约 10 倍</text><text x="39.0" y="458.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">在转录已经开始后再决定是否提前终止，提供</text><text x="39.0" y="474.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">连续调节区间</text><rect x="30.0" y="482.0" width="3.0" height="15.0" rx="1.5" fill="#0f766e"/><text x="39.0" y="495.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">前提是边转录边翻译</text><text x="362.0" y="495.0" text-anchor="end" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">原核专属</text><text x="39.0" y="513.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">核糖体的位置即「色氨酸浓度传感器」，真核</text><text x="39.0" y="529.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">无此机制</text><rect x="18.0" y="549.0" width="364.0" height="70.0" rx="8" fill="#fef3c7"/><rect x="18.0" y="549.0" width="3.5" height="70.0" rx="1.8" fill="#b45309"/><text x="32.0" y="569.0" font-size="11.5" font-weight="700" fill="#b45309" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">易错</text><text x="32.0" y="586.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">方向别记反：色氨酸充足时是「形成终止子、转录提前终</text><text x="32.0" y="605.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">止」；缺乏时才「2-3 配对、继续转录」。</text></svg>