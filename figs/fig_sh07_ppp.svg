<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 561" width="100%" style="max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px" role="img"><text x="165.0" y="22.6" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">磷酸戊糖途径：不产 ATP，产两样东西</text><text x="165.0" y="43.0" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">NADPH 供还原与合成 · 核糖-5-磷酸供核苷酸</text><rect x="15.0" y="58.0" width="146.5" height="90.0" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.3"/><text x="24.0" y="76.0" text-anchor="start" font-size="12.2" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">NADPH 的两大用途</text><text x="24.0" y="93.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">① 供还原性合成（脂肪酸、</text><text x="24.0" y="108.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">胆固醇、核苷酸）
② 维</text><text x="24.0" y="123.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">持谷胱甘肽还原态，</text><text x="24.0" y="138.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">保护红细胞膜</text><rect x="168.5" y="58.0" width="146.5" height="90.0" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.3"/><text x="177.5" y="76.0" text-anchor="start" font-size="12.2" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">核糖-5-磷酸的用途</text><text x="177.5" y="93.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">合成 PRPP → 嘌呤/嘧啶</text><text x="177.5" y="108.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">核苷酸；也可进入糖酵解</text><rect x="15.0" y="157.0" width="300.0" height="41.0" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.4"/><text x="28.0" y="176.0" text-anchor="start" font-size="12.6" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">① G-6-P 脱氢 → 6-磷酸葡糖酸内酯</text><text x="28.0" y="193.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">限速酶：葡糖-6-磷酸脱氢酶（G6PD）</text><line x1="165.0" y1="199.0" x2="165.0" y2="198.5" stroke="#64748b" stroke-width="1.4" stroke-linecap="round"/><polygon points="165.0,203.0 163.0,198.4 167.0,198.4" fill="#64748b"/><rect x="15.0" y="204.0" width="300.0" height="41.0" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/><text x="28.0" y="223.0" text-anchor="start" font-size="12.6" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">② 生成 NADPH + 核酮糖-5-磷酸</text><text x="28.0" y="240.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">此步是 NADPH 的主要来源</text><line x1="165.0" y1="246.0" x2="165.0" y2="245.5" stroke="#64748b" stroke-width="1.4" stroke-linecap="round"/><polygon points="165.0,250.0 163.0,245.4 167.0,245.4" fill="#64748b"/><rect x="15.0" y="251.0" width="300.0" height="41.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/><text x="28.0" y="270.0" text-anchor="start" font-size="12.6" font-weight="700" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">③ 异构/转酮/转醛重排</text><text x="28.0" y="287.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">产出核糖-5-磷酸与糖酵解中间物</text><rect x="15.0" y="295.0" width="300.0" height="134.0" rx="7" fill="#fee2e2" stroke="#cbd5e1" stroke-width="1.4"/><text x="25.0" y="314.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">G6PD 缺乏＝蚕豆病</text><text x="25.0" y="332.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· NADPH 不足 → 谷胱甘肽无法还原 → 红细</text><text x="25.0" y="348.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">胞膜脂质与血红蛋白被氧化</text><text x="25.0" y="364.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 表现：进食蚕豆/服用伯氨喹/磺胺后急性溶</text><text x="25.0" y="380.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">血、 Heinz 小体</text><text x="25.0" y="396.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 检验：G6PD 活性降低、直接抗人球蛋白试</text><text x="25.0" y="412.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">验（Coombs）阴性（区别于自身免疫性溶血）</text><rect x="15.0" y="437.0" width="300.0" height="60.0" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/><text x="25.0" y="453.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">易错：磷酸戊糖途径产 NADPH（不是 NADH），</text><text x="25.0" y="469.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">且不产 ATP</text><text x="25.0" y="485.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">它发生在胞质，与糖酵解共用 G-6-P 起点</text><rect x="11.0" y="502.0" width="308.0" height="51.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="165.0" y="517.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">PPP 产 NADPH + 核糖-5-磷酸；G6PD 缺乏 → </text><text x="165.0" y="532.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">NADPH↓ → 蚕豆病溶血</text></svg>