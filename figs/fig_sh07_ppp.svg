<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 732" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="磷酸戊糖途径与 G6PD 缺乏"><title>磷酸戊糖途径与 G6PD 缺乏</title><desc>磷酸戊糖途径以 G6PD 为限速酶，产 NADPH 与核糖-5-磷酸，不产 ATP；NADPH 供还原性合成并维持谷胱甘肽还原态，G6PD 缺乏时红细胞失去抗氧化能力，进食蚕豆或某些药物后发生急性溶血（蚕豆病）。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">磷酸戊糖途径与 G6PD 缺乏</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">不产 ATP，产两样东西：NADPH 与核糖-5-磷酸</text><rect x="18.0" y="65.0" width="364.0" height="226.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="84.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">三步</text><rect x="30.0" y="97.0" width="340.0" height="48.0" rx="8" fill="#ffffff" stroke="#e3eaf2" stroke-width="1.1"/><rect x="30.0" y="97.0" width="3.5" height="48.0" rx="1.8" fill="#c0392b"/><circle cx="49.0" cy="114.0" r="9" fill="#c0392b"/><text x="49.0" y="118.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">1</text><text x="65.0" y="118.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">G-6-P 脱氢 → 6-磷酸葡糖酸内酯</text><text x="360.0" y="118.0" text-anchor="end" font-size="12" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">限速</text><text x="65.0" y="136.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">限速酶：葡糖-6-磷酸脱氢酶（G6PD）</text><line x1="49.0" y1="147.0" x2="49.0" y2="156.0" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="156.0" x2="45.6" y2="149.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="156.0" x2="52.4" y2="149.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><rect x="30.0" y="158.0" width="340.0" height="48.0" rx="8" fill="#ffffff" stroke="#e3eaf2" stroke-width="1.1"/><rect x="30.0" y="158.0" width="3.5" height="48.0" rx="1.8" fill="#b45309"/><circle cx="49.0" cy="175.0" r="9" fill="#b45309"/><text x="49.0" y="179.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">2</text><text x="65.0" y="179.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">生成 NADPH + 核酮糖-5-磷酸</text><text x="360.0" y="179.0" text-anchor="end" font-size="12" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">产 NADPH</text><text x="65.0" y="197.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">此步是体内 NADPH 的主要来源</text><line x1="49.0" y1="208.0" x2="49.0" y2="217.0" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="217.0" x2="45.6" y2="210.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="217.0" x2="52.4" y2="210.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><rect x="30.0" y="219.0" width="340.0" height="64.0" rx="8" fill="#ffffff" stroke="#e3eaf2" stroke-width="1.1"/><rect x="30.0" y="219.0" width="3.5" height="64.0" rx="1.8" fill="#0f766e"/><circle cx="49.0" cy="236.0" r="9" fill="#0f766e"/><text x="49.0" y="240.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">3</text><text x="65.0" y="240.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">异构 / 转酮 / 转醛重排</text><text x="360.0" y="240.0" text-anchor="end" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">重排</text><text x="65.0" y="258.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">产出核糖-5-磷酸与糖酵解中间物，可回流</text><text x="65.0" y="274.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">糖酵解</text><rect x="18.0" y="303.0" width="177.0" height="116.0" rx="9" fill="#fef3c7" stroke="#b45309" stroke-width="1.1"/><text x="29.0" y="324.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">NADPH 的两大用途</text><text x="29.0" y="343.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">供还原性合成（脂肪酸、</text><text x="29.0" y="359.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胆固醇）</text><text x="29.0" y="379.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">维持谷胱甘肽还原态，保护</text><text x="29.0" y="395.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">红细胞膜</text><rect x="205.0" y="303.0" width="177.0" height="116.0" rx="9" fill="#e2f5f2" stroke="#0f766e" stroke-width="1.1"/><text x="216.0" y="324.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">核糖-5-磷酸的用途</text><text x="216.0" y="343.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">合成 PRPP → 嘌呤 / </text><text x="216.0" y="359.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">嘧啶核苷酸</text><text x="216.0" y="379.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">多余时可经重排进入糖酵解</text><rect x="18.0" y="429.0" width="364.0" height="201.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="448.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">G6PD 缺乏＝蚕豆病</text><rect x="30.0" y="459.0" width="3.0" height="15.0" rx="1.5" fill="#c0392b"/><text x="39.0" y="472.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">G6PD 缺乏</text><text x="370.0" y="472.0" text-anchor="end" font-size="12" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">蚕豆病</text><text x="39.0" y="490.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">NADPH 不足 → 谷胱甘肽无法还原 → 红细胞膜</text><text x="39.0" y="506.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">脂质与血红蛋白被氧化</text><rect x="30.0" y="517.0" width="3.0" height="15.0" rx="1.5" fill="#b45309"/><text x="39.0" y="530.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">诱因与表现</text><text x="370.0" y="530.0" text-anchor="end" font-size="12" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">急性溶血</text><text x="39.0" y="548.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">进食蚕豆、服用伯氨喹或磺胺后出现溶血、</text><text x="39.0" y="564.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Heinz 小体</text><rect x="30.0" y="575.0" width="3.0" height="15.0" rx="1.5" fill="#0f766e"/><text x="39.0" y="588.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">鉴别</text><text x="370.0" y="588.0" text-anchor="end" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Coombs 阴性</text><text x="39.0" y="606.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">G6PD 活性降低、直接抗人球蛋白试验阴性</text><text x="39.0" y="622.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">（区别于自身免疫性溶血）</text><rect x="18.0" y="642.0" width="364.0" height="70.0" rx="8" fill="#fef3c7"/><rect x="18.0" y="642.0" width="3.5" height="70.0" rx="1.8" fill="#b45309"/><text x="32.0" y="662.0" font-size="11.5" font-weight="700" fill="#b45309" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">易错</text><text x="32.0" y="679.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">磷酸戊糖途径产 NADPH（不是 NADH），也不产 ATP；</text><text x="32.0" y="698.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">它与糖酵解共用 G-6-P 这个起点。</text></svg>