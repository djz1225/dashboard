<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 741" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="心血管活动的调节"><title>心血管活动的调节</title><desc>心交感（β₁）加快加强、心迷走（M）减慢减弱、交感缩血管（α）收缩血管；减压反射经颈动脉窦—主动脉弓负反馈稳定血压，体液因素以肾上腺素、去甲肾上腺素、血管紧张素Ⅱ 与 ADH 为主。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">心血管活动的调节：神经快、体液慢</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">减压反射是负反馈范例：血压升→把血压拉回</text><rect x="18.0" y="65.0" width="364.0" height="149.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="83.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">神经调节：三条通路</text><rect x="30.0" y="93.0" width="3.0" height="15.0" rx="1.5" fill="#c0392b"/><text x="39.0" y="106.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">心交感神经</text><text x="347.0" y="106.0" text-anchor="end" font-size="12" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">HR↑ 收缩力↑</text><text x="39.0" y="124.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">去甲肾上腺素→β₁ 受体→Ca²⁺ 内流↑</text><rect x="30.0" y="134.0" width="3.0" height="15.0" rx="1.5" fill="#1f6fb2"/><text x="39.0" y="147.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">心迷走神经</text><text x="347.0" y="147.0" text-anchor="end" font-size="12" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">HR↓ 收缩力↓</text><text x="39.0" y="165.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">乙酰胆碱→M 受体→K⁺ 通道开放、Ca²⁺↓</text><rect x="30.0" y="175.0" width="3.0" height="15.0" rx="1.5" fill="#7b4bb7"/><text x="39.0" y="188.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">交感缩血管神经</text><text x="347.0" y="188.0" text-anchor="end" font-size="12" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">血管收缩</text><text x="39.0" y="206.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">去甲肾上腺素→α 受体；皮肤内脏最密</text><rect x="18.0" y="220.0" width="3.0" height="14.0" rx="1.5" fill="#2f8f57"/><text x="28.0" y="230.0" font-size="13.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">减压反射（颈动脉窦—主动脉弓）</text><rect x="18.0" y="242.0" width="364.0" height="46.0" rx="8" fill="#fdeceb" stroke="#c0392b" stroke-width="1.1"/><rect x="18.0" y="242.0" width="3.5" height="46.0" rx="1.8" fill="#c0392b"/><circle cx="38" cy="260" r="9.5" fill="#c0392b"/><text x="38.0" y="264.0" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">1</text><text x="56.0" y="264.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">血压 ↑</text><text x="370.0" y="264.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">刺激</text><text x="56.0" y="282.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">动脉壁被牵拉 → 压力感受器发放增加</text><line x1="38.0" y1="290.0" x2="38.0" y2="305.0" stroke="#4a5a6b" stroke-width="2" stroke-linecap="round"/><line x1="38.0" y1="305.0" x2="34.2" y2="298.0" stroke="#4a5a6b" stroke-width="2" stroke-linecap="round"/><line x1="38.0" y1="305.0" x2="41.8" y2="298.0" stroke="#4a5a6b" stroke-width="2" stroke-linecap="round"/><rect x="18.0" y="288.0" width="364.0" height="46.0" rx="8" fill="#eef2f7" stroke="#4a5a6b" stroke-width="1.1"/><rect x="18.0" y="288.0" width="3.5" height="46.0" rx="1.8" fill="#4a5a6b"/><circle cx="38" cy="306" r="9.5" fill="#4a5a6b"/><text x="38.0" y="310.0" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">2</text><text x="56.0" y="310.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">传入神经</text><text x="370.0" y="310.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">传入</text><text x="56.0" y="328.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">窦神经→舌咽；减压神经→迷走</text><line x1="38.0" y1="336.0" x2="38.0" y2="351.0" stroke="#4a5a6b" stroke-width="2" stroke-linecap="round"/><line x1="38.0" y1="351.0" x2="34.2" y2="344.0" stroke="#4a5a6b" stroke-width="2" stroke-linecap="round"/><line x1="38.0" y1="351.0" x2="41.8" y2="344.0" stroke="#4a5a6b" stroke-width="2" stroke-linecap="round"/><rect x="18.0" y="334.0" width="364.0" height="46.0" rx="8" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1.1"/><rect x="18.0" y="334.0" width="3.5" height="46.0" rx="1.8" fill="#1f6fb2"/><circle cx="38" cy="352" r="9.5" fill="#1f6fb2"/><text x="38.0" y="356.0" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">3</text><text x="56.0" y="356.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">延髓心血管中枢</text><text x="370.0" y="356.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">中枢</text><text x="56.0" y="374.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">心迷走↑、心交感↓、缩血管中枢↓</text><line x1="38.0" y1="382.0" x2="38.0" y2="397.0" stroke="#4a5a6b" stroke-width="2" stroke-linecap="round"/><line x1="38.0" y1="397.0" x2="34.2" y2="390.0" stroke="#4a5a6b" stroke-width="2" stroke-linecap="round"/><line x1="38.0" y1="397.0" x2="41.8" y2="390.0" stroke="#4a5a6b" stroke-width="2" stroke-linecap="round"/><rect x="18.0" y="380.0" width="364.0" height="46.0" rx="8" fill="#f2ecfb" stroke="#7b4bb7" stroke-width="1.1"/><rect x="18.0" y="380.0" width="3.5" height="46.0" rx="1.8" fill="#7b4bb7"/><circle cx="38" cy="398" r="9.5" fill="#7b4bb7"/><text x="38.0" y="402.0" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">4</text><text x="56.0" y="402.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">效应器</text><text x="370.0" y="402.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">效应</text><text x="56.0" y="420.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">心率↓、收缩力↓、血管舒张 → 血压↓</text><line x1="38.0" y1="428.0" x2="38.0" y2="443.0" stroke="#4a5a6b" stroke-width="2" stroke-linecap="round"/><line x1="38.0" y1="443.0" x2="34.2" y2="436.0" stroke="#4a5a6b" stroke-width="2" stroke-linecap="round"/><line x1="38.0" y1="443.0" x2="41.8" y2="436.0" stroke="#4a5a6b" stroke-width="2" stroke-linecap="round"/><rect x="18.0" y="426.0" width="364.0" height="46.0" rx="8" fill="#e6f6ec" stroke="#2f8f57" stroke-width="1.1"/><rect x="18.0" y="426.0" width="3.5" height="46.0" rx="1.8" fill="#2f8f57"/><circle cx="38" cy="444" r="9.5" fill="#2f8f57"/><text x="38.0" y="448.0" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">5</text><text x="56.0" y="448.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">血压 ↓</text><text x="370.0" y="448.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">结果</text><text x="56.0" y="466.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">回到调定点，负反馈完成</text><rect x="18.0" y="490.0" width="364.0" height="149.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="508.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">体液调节：四个主角</text><rect x="30.0" y="518.0" width="3.0" height="15.0" rx="1.5" fill="#c0392b"/><text x="39.0" y="531.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肾上腺素</text><text x="347.0" y="531.0" text-anchor="end" font-size="12" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">强心</text><text x="39.0" y="549.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">心输出量↑为主，临床作强心药</text><rect x="30.0" y="559.0" width="3.0" height="15.0" rx="1.5" fill="#1f6fb2"/><text x="39.0" y="572.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">去甲肾上腺素</text><text x="347.0" y="572.0" text-anchor="end" font-size="12" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">升压</text><text x="39.0" y="590.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">缩血管为主，血压明显升高</text><rect x="30.0" y="600.0" width="3.0" height="15.0" rx="1.5" fill="#7b4bb7"/><text x="39.0" y="613.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">血管紧张素Ⅱ／ADH</text><text x="347.0" y="613.0" text-anchor="end" font-size="12" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">缩血管</text><text x="39.0" y="631.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">前者最强并促醛固酮；后者大剂量升压</text><rect x="18.0" y="651.0" width="364.0" height="70.0" rx="8" fill="#eef2f7"/><rect x="18.0" y="651.0" width="3.5" height="70.0" rx="1.8" fill="#4a5a6b"/><text x="32.0" y="671.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="688.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">压力感受器在正常血压范围内最敏感，长期高血压会「重</text><text x="32.0" y="707.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">设调定点」；切断减压神经 → 血压升高且波动大。</text></svg>