<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 599" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="进食—空腹—饥饿：代谢五阶段"><title>进食—空腹—饥饿：代谢五阶段</title><desc>进食后 0~4 h 以葡萄糖为主，胰岛素升高促糖原与脂肪合成；4~12 h 靠肝糖原分解与糖异生；12~24 h 肝糖原耗尽、脂肪动员加强；1~3 d 酮体升高、脑开始利用；3 d 以上脑利用酮体达 60~70%。代谢方向由胰岛素/胰高血糖素比值决定，肝是唯一能向外输出葡萄糖的器官。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">进食—空腹—饥饿：代谢五阶段</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">方向由胰岛素/胰高血糖素比值决定，不是看某一个激素的绝对值</text><rect x="18.0" y="65.0" width="69.8" height="44.0" rx="5" fill="#fdeceb" stroke="#c0392b" stroke-width="1"/><text x="52.9" y="82.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">0~4 h</text><text x="52.9" y="98.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">葡萄糖</text><rect x="90.8" y="65.0" width="69.8" height="44.0" rx="5" fill="#fdeceb" stroke="#c0392b" stroke-width="1"/><text x="125.7" y="82.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">4~12 h</text><text x="125.7" y="98.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肝糖原</text><rect x="163.6" y="65.0" width="69.8" height="44.0" rx="5" fill="#fef3c7" stroke="#b45309" stroke-width="1"/><text x="198.5" y="82.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">12~24 h</text><text x="198.5" y="98.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">糖异生</text><rect x="236.4" y="65.0" width="69.8" height="44.0" rx="5" fill="#f2ecfb" stroke="#7b4bb7" stroke-width="1"/><text x="271.3" y="82.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">1~3 d</text><text x="271.3" y="98.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">脂肪+酮体</text><rect x="309.2" y="65.0" width="69.8" height="44.0" rx="5" fill="#e2f5f2" stroke="#0f766e" stroke-width="1"/><text x="344.1" y="82.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">3 d 以上</text><text x="344.1" y="98.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">酮体为主</text><line x1="18.0" y1="119.0" x2="382.0" y2="119.0" stroke="#8095a8" stroke-width="1.3" stroke-linecap="round"/><line x1="382.0" y1="119.0" x2="377.6" y2="121.4" stroke="#8095a8" stroke-width="1.3" stroke-linecap="round"/><line x1="382.0" y1="119.0" x2="377.6" y2="116.6" stroke="#8095a8" stroke-width="1.3" stroke-linecap="round"/><rect x="18.0" y="129.0" width="364.0" height="146.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="148.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">五个阶段的关键变化</text><rect x="30.0" y="157.0" width="3.0" height="15.0" rx="1.5" fill="#c0392b"/><text x="40.0" y="170.0" font-size="12" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">进食后 0~4 h</text><text x="122.0" y="170.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胰岛素↑；糖原合成与脂合成开启</text><rect x="30.0" y="179.0" width="3.0" height="15.0" rx="1.5" fill="#b45309"/><text x="40.0" y="192.0" font-size="12" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">空腹 4~12 h</text><text x="122.0" y="192.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胰高血糖素↑；糖原分解、糖异生启动</text><rect x="30.0" y="201.0" width="3.0" height="15.0" rx="1.5" fill="#b45309"/><text x="40.0" y="214.0" font-size="12" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">12~24 h</text><text x="122.0" y="214.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肝糖原耗尽；脂肪动员加强，糖异生成主力</text><rect x="30.0" y="223.0" width="3.0" height="15.0" rx="1.5" fill="#7b4bb7"/><text x="40.0" y="236.0" font-size="12" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">1~3 d</text><text x="122.0" y="236.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">酮体升高，脑开始改用酮体</text><rect x="30.0" y="245.0" width="3.0" height="15.0" rx="1.5" fill="#0f766e"/><text x="40.0" y="258.0" font-size="12" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">3 d 以上</text><text x="122.0" y="258.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">脑利用酮体达 60~70%，节省葡萄糖给红细胞</text><rect x="18.0" y="287.0" width="177.0" height="100.0" rx="9" fill="#e2f5f2" stroke="#0f766e" stroke-width="1.1"/><text x="29.0" y="308.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">核心变量</text><text x="29.0" y="327.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胰岛素/胰高血糖素比值下降</text><text x="29.0" y="347.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">比值是「总开关」，不</text><text x="29.0" y="363.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">是单个激素</text><rect x="205.0" y="287.0" width="177.0" height="100.0" rx="9" fill="#fdeceb" stroke="#c0392b" stroke-width="1.1"/><text x="216.0" y="308.0" font-size="12.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肝｜输出</text><text x="216.0" y="327.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">唯一能在空腹时输出葡</text><text x="216.0" y="343.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">萄糖的器官</text><text x="216.0" y="363.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">靠糖原分解与糖异生</text><rect x="18.0" y="397.0" width="177.0" height="100.0" rx="9" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1.1"/><text x="29.0" y="418.0" font-size="12.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肌肉｜供给</text><text x="29.0" y="437.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">消耗支链氨基酸</text><text x="29.0" y="457.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">输出乳酸与丙氨酸给肝</text><rect x="205.0" y="397.0" width="177.0" height="100.0" rx="9" fill="#f2ecfb" stroke="#7b4bb7" stroke-width="1.1"/><text x="216.0" y="418.0" font-size="12.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">脂肪组织｜脂解</text><text x="216.0" y="437.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胰岛素↓ → HSL 激活</text><text x="216.0" y="457.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">游离脂肪酸升高供肝</text><rect x="18.0" y="509.0" width="364.0" height="70.0" rx="8" fill="#fef3c7"/><rect x="18.0" y="509.0" width="3.5" height="70.0" rx="1.8" fill="#b45309"/><text x="32.0" y="529.0" font-size="11.5" font-weight="700" fill="#b45309" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">易错</text><text x="32.0" y="546.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">长期饥饿时蛋白分解反而下降（保护肌肉），这是与创伤</text><text x="32.0" y="565.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">应激的重要区别。</text></svg>