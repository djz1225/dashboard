<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 609" width="100%" style="max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px" role="img"><text x="165.0" y="22.6" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">进食—空腹—饥饿：代谢切换</text><text x="165.0" y="43.0" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">方向由胰岛素/胰高血糖素比值决定</text><rect x="15.0" y="58.0" width="300.0" height="24.0" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/><text x="21.0" y="74.0" text-anchor="start" font-size="11.2" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">阶段</text><text x="91.8" y="74.0" text-anchor="start" font-size="11.2" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">主要燃料</text><text x="156.4" y="74.0" text-anchor="start" font-size="11.2" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">关键变化</text><rect x="15.0" y="82.0" width="300.0" height="36.0" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.9"/><text x="21.0" y="97.0" text-anchor="start" font-size="11.2" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">进食后 0~4</text><text x="21.0" y="111.0" text-anchor="start" font-size="11.2" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"> h</text><text x="91.8" y="97.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">葡萄糖</text><text x="156.4" y="97.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">胰岛素↑；糖原合成、脂合成开</text><text x="156.4" y="111.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">启</text><rect x="15.0" y="118.0" width="300.0" height="36.0" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.9"/><text x="21.0" y="133.0" text-anchor="start" font-size="11.2" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">空腹 4~12 </text><text x="21.0" y="147.0" text-anchor="start" font-size="11.2" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">h</text><text x="91.8" y="133.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">肝糖原</text><text x="156.4" y="133.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">胰高血糖素↑；糖原分解、</text><text x="156.4" y="147.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">糖异生启动</text><rect x="15.0" y="154.0" width="300.0" height="36.0" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.9"/><text x="21.0" y="169.0" text-anchor="start" font-size="11.2" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">12~24 h</text><text x="91.8" y="169.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">糖异生为</text><text x="91.8" y="183.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">主</text><text x="156.4" y="169.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">肝糖原耗尽；脂肪动员加强</text><rect x="15.0" y="190.0" width="300.0" height="36.0" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.9"/><text x="21.0" y="205.0" text-anchor="start" font-size="11.2" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">1~3 d</text><text x="91.8" y="205.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">脂肪 + 酮</text><text x="91.8" y="219.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">体</text><text x="156.4" y="205.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">酮体升高，脑开始用酮体</text><rect x="15.0" y="226.0" width="300.0" height="36.0" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.9"/><text x="21.0" y="241.0" text-anchor="start" font-size="11.2" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">3 d 以上</text><text x="91.8" y="241.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">酮体为主</text><text x="156.4" y="241.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">脑利用酮体达 60~70%，</text><text x="156.4" y="255.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">节省葡萄糖</text><rect x="15.0" y="267.0" width="300.0" height="46.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><rect x="15.0" y="267.0" width="4.5" height="46.0" rx="2.2" fill="#b91c1c"/><text x="29.0" y="286.0" text-anchor="start" font-size="14" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">核心变量</text><text x="304.0" y="286.0" text-anchor="end" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">比值</text><text x="29.0" y="303.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">胰岛素/胰高血糖素比值下降 → 全面切向「分解供能」</text><rect x="15.0" y="317.0" width="300.0" height="46.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><rect x="15.0" y="317.0" width="4.5" height="46.0" rx="2.2" fill="#0f766e"/><text x="29.0" y="336.0" text-anchor="start" font-size="14" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">肝的作用</text><text x="304.0" y="336.0" text-anchor="end" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">输出</text><text x="29.0" y="353.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">唯一能在空腹时向外输出葡萄糖的器官</text><rect x="15.0" y="367.0" width="300.0" height="46.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><rect x="15.0" y="367.0" width="4.5" height="46.0" rx="2.2" fill="#b45309"/><text x="29.0" y="386.0" text-anchor="start" font-size="14" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">肌肉的作用</text><text x="304.0" y="386.0" text-anchor="end" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">供给</text><text x="29.0" y="403.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">消耗支链氨基酸、输出乳酸与丙氨酸</text><rect x="15.0" y="417.0" width="300.0" height="46.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><rect x="15.0" y="417.0" width="4.5" height="46.0" rx="2.2" fill="#15803d"/><text x="29.0" y="436.0" text-anchor="start" font-size="14" font-weight="700" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">脂肪组织</text><text x="304.0" y="436.0" text-anchor="end" font-size="13.5" font-weight="700" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">脂解</text><text x="29.0" y="453.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">胰岛素↓ → HSL 激活 → 脂解，游离脂肪酸升高</text><rect x="15.0" y="469.0" width="300.0" height="76.0" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/><text x="25.0" y="485.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">易错：判断代谢方向看「比值」，不是看某一</text><text x="25.0" y="501.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">个激素的绝对浓度</text><text x="25.0" y="517.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">长期饥饿时蛋白分解会下降（保护肌肉），</text><text x="25.0" y="533.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">这是与创伤应激的重要区别</text><rect x="11.0" y="550.0" width="308.0" height="51.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="165.0" y="565.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">进食靠糖、空腹靠糖原、12 h 后靠糖异生、</text><text x="165.0" y="580.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">3 d 后靠酮体；方向看激素比值</text></svg>