<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 783" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="尿酸：人的终点，别嘌醇在此拦截"><title>尿酸：人的终点，别嘌醇在此拦截</title><desc>嘌呤核苷酸经脱氨脱磷酸生成次黄嘌呤与鸟嘌呤，再由黄嘌呤氧化酶依次氧化为黄嘌呤和尿酸；人缺乏尿酸氧化酶，尿酸即终产物，浓度过高时结晶沉积于关节与肾而致痛风。别嘌醇与非布司他抑制黄嘌呤氧化酶减少生成，苯溴马隆抑制URAT1 促排泄。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">尿酸：人的终点，别嘌醇在此拦截</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">人缺尿酸氧化酶，所以停在尿酸；浓度高即结晶 → 痛风</text><rect x="18.0" y="65.0" width="364.0" height="281.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="84.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">降解四步</text><rect x="30.0" y="97.0" width="340.0" height="64.0" rx="8" fill="#ffffff" stroke="#e3eaf2" stroke-width="1.1"/><rect x="30.0" y="97.0" width="3.5" height="64.0" rx="1.8" fill="#0f766e"/><circle cx="49.0" cy="114.0" r="9" fill="#0f766e"/><text x="49.0" y="118.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">1</text><text x="65.0" y="118.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">① 核苷酸降级</text><text x="360.0" y="118.0" text-anchor="end" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">降级</text><text x="65.0" y="136.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">AMP、GMP 先脱氨再脱磷酸，生成次黄嘌</text><text x="65.0" y="152.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">呤与鸟嘌呤</text><line x1="49.0" y1="163.0" x2="49.0" y2="170.0" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="170.0" x2="45.6" y2="163.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="170.0" x2="52.4" y2="163.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><rect x="30.0" y="172.0" width="340.0" height="48.0" rx="8" fill="#ffffff" stroke="#e3eaf2" stroke-width="1.1"/><rect x="30.0" y="172.0" width="3.5" height="48.0" rx="1.8" fill="#c1440e"/><circle cx="49.0" cy="189.0" r="9" fill="#c1440e"/><text x="49.0" y="193.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">2</text><text x="65.0" y="193.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">② 次黄嘌呤 → 黄嘌呤</text><text x="360.0" y="193.0" text-anchor="end" font-size="12" font-weight="700" fill="#c1440e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">别嘌醇</text><text x="65.0" y="211.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">黄嘌呤氧化酶催化；别嘌醇在此位点抑制</text><line x1="49.0" y1="222.0" x2="49.0" y2="229.0" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="229.0" x2="45.6" y2="222.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="229.0" x2="52.4" y2="222.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><rect x="30.0" y="231.0" width="340.0" height="48.0" rx="8" fill="#ffffff" stroke="#e3eaf2" stroke-width="1.1"/><rect x="30.0" y="231.0" width="3.5" height="48.0" rx="1.8" fill="#c0392b"/><circle cx="49.0" cy="248.0" r="9" fill="#c0392b"/><text x="49.0" y="252.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">3</text><text x="65.0" y="252.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">③ 黄嘌呤 → 尿酸</text><text x="360.0" y="252.0" text-anchor="end" font-size="12" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">终点</text><text x="65.0" y="270.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">同一种酶；尿酸是人的终产物，不再往下分解</text><line x1="49.0" y1="281.0" x2="49.0" y2="288.0" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="288.0" x2="45.6" y2="281.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="288.0" x2="52.4" y2="281.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><rect x="30.0" y="290.0" width="340.0" height="48.0" rx="8" fill="#ffffff" stroke="#e3eaf2" stroke-width="1.1"/><rect x="30.0" y="290.0" width="3.5" height="48.0" rx="1.8" fill="#4a5a6b"/><circle cx="49.0" cy="307.0" r="9" fill="#4a5a6b"/><text x="49.0" y="311.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">4</text><text x="65.0" y="311.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">④ 尿酸排泄</text><text x="360.0" y="311.0" text-anchor="end" font-size="12" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">去路</text><text x="65.0" y="329.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肾排出约 2/3，肠道分解为辅</text><rect x="18.0" y="358.0" width="364.0" height="26.0" rx="6" fill="#f8fbfd"/><text x="26.0" y="375.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">药物</text><text x="135.2" y="375.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">靶点</text><text x="259.0" y="375.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">机制</text><line x1="18.0" y1="426.0" x2="382.0" y2="426.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="402.0" font-size="12.5" font-weight="700" fill="#c1440e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">别嘌醇</text><text x="135.2" y="402.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">黄嘌呤氧化酶</text><text x="259.0" y="402.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">抑制尿酸生成（</text><text x="259.0" y="418.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">不是促排）</text><line x1="18.0" y1="452.0" x2="382.0" y2="452.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="444.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">非布司他</text><text x="135.2" y="444.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">黄嘌呤氧化酶</text><text x="259.0" y="444.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">同类，选择性更高</text><line x1="18.0" y1="478.0" x2="382.0" y2="478.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="470.0" font-size="12.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">苯溴马隆</text><text x="135.2" y="470.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肾小管 URAT1</text><text x="259.0" y="470.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">促尿酸排泄</text><rect x="18.0" y="484.0" width="364.0" height="197.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="503.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">进化与临床</text><rect x="30.0" y="514.0" width="3.0" height="15.0" rx="1.5" fill="#b45309"/><text x="39.0" y="527.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">为什么只有人痛风</text><text x="370.0" y="527.0" text-anchor="end" font-size="12" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">基因失活</text><text x="39.0" y="545.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">多数哺乳动物有尿酸氧化酶，能把尿酸降为水溶</text><text x="39.0" y="561.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">性尿囊素；人类该基因失活</text><rect x="30.0" y="570.0" width="3.0" height="15.0" rx="1.5" fill="#2f8f57"/><text x="39.0" y="583.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">为什么保留尿酸</text><text x="370.0" y="583.0" text-anchor="end" font-size="12" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">抗氧化</text><text x="39.0" y="601.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">尿酸是血浆中最主要的水溶性抗氧化剂之一，可能</text><text x="39.0" y="617.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">是进化收益</text><rect x="30.0" y="626.0" width="3.0" height="15.0" rx="1.5" fill="#c0392b"/><text x="39.0" y="639.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">急性期用药</text><text x="370.0" y="639.0" text-anchor="end" font-size="12" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">别急降</text><text x="39.0" y="657.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">痛风急性期不宜起始降尿酸，以免尿酸波动加</text><text x="39.0" y="673.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">重发作</text><rect x="18.0" y="693.0" width="364.0" height="70.0" rx="8" fill="#e2f5f2"/><rect x="18.0" y="693.0" width="3.5" height="70.0" rx="1.8" fill="#0f766e"/><text x="32.0" y="713.0" font-size="11.5" font-weight="700" fill="#0f766e" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">易错</text><text x="32.0" y="730.0" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">别嘌醇抑制的是「生成」而不是「排泄」；尿酸不是纯废</text><text x="32.0" y="749.0" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">物，它是最主要的水溶性抗氧化剂之一。</text></svg>