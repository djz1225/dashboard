<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 518.5" width="100%" style="max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px" role="img"><text x="165.0" y="21.3" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">冠脉循环：为什么心肌收缩时血流反而减少</text><text x="165.0" y="41.5" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">左冠血流主要发生在舒张期</text><rect x="15.0" y="58.5" width="300.0" height="54.0" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.4"/><text x="27.0" y="78.5" text-anchor="start" font-size="14" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">收缩期</text><text x="27.0" y="96.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">心室壁挤压壁内血管 → 左冠血流↓（可近乎中</text><text x="27.0" y="112.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">断）</text><line x1="165.0" y1="113.5" x2="165.0" y2="115.0" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/><polygon points="165.0,119.5 163.0,114.9 167.0,114.9" fill="#64748b"/><rect x="15.0" y="120.5" width="300.0" height="54.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/><text x="27.0" y="140.5" text-anchor="start" font-size="14" font-weight="700" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">舒张早期</text><text x="27.0" y="158.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">心肌松弛，挤压解除 → 左冠血流骤增（</text><text x="27.0" y="174.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">主要灌注期）</text><line x1="165.0" y1="175.5" x2="165.0" y2="177.0" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/><polygon points="165.0,181.5 163.0,176.9 167.0,176.9" fill="#64748b"/><rect x="15.0" y="182.5" width="300.0" height="38.0" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/><text x="27.0" y="202.5" text-anchor="start" font-size="14" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">舒张期</text><text x="27.0" y="220.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">主动脉压仍高，冠脉持续灌注</text><rect x="15.0" y="222.5" width="300.0" height="118.0" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="25.0" y="241.5" text-anchor="start" font-size="13.5" font-weight="700" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">冠脉循环的四个特点</text><text x="25.0" y="259.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 血流丰富：占心输出量 4~5%，但心脏只占</text><text x="25.0" y="275.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">体重 0.5%</text><text x="25.0" y="291.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 摄氧率高：静息已摄取 70~75%，储备很少</text><text x="25.0" y="307.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 血流有周期性：左冠主要靠舒张期灌注</text><text x="25.0" y="323.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 代谢调节为主：腺苷是最重要的舒血管物质</text><rect x="15.0" y="348.5" width="300.0" height="108.0" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/><text x="25.0" y="364.5" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">心率过快时舒张期缩短最明显 → 冠脉灌注不足</text><text x="25.0" y="380.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"> → 心肌缺血</text><text x="25.0" y="396.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">10版新增「冠脉有效灌注压」概念：主动脉压 </text><text x="25.0" y="412.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">− 心室舒张末压</text><text x="25.0" y="428.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">因此主动脉舒张压降低（如主动脉瓣关闭不全</text><text x="25.0" y="444.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">）会造成冠脉缺血</text><rect x="11.0" y="459.5" width="308.0" height="51.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="165.0" y="474.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">左冠靠舒张期灌注；心率过快→舒张期缩短→冠脉</text><text x="165.0" y="490.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">缺血</text></svg>