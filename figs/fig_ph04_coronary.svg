<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 557" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="冠脉循环：收缩期血流反而减少"><title>冠脉循环：收缩期血流反而减少</title><desc>心室收缩挤压壁内血管使左冠血流骤降，舒张早期挤压解除、血流骤增，左冠主要靠舒张期灌注；血流占心输出量 4~5%、摄氧率 70~75%、以代谢调节为主。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">冠脉循环：收缩期血流反而减少</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">左冠主要靠舒张期灌注——心肌一挤就断流</text><line x1="18.0" y1="63.0" x2="32.0" y2="63.0" stroke="#0f766e" stroke-width="2.2" stroke-linecap="round"/><text x="36.0" y="67.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">左冠状动脉血流</text><rect x="18.0" y="79.0" width="364.0" height="168.0" rx="9" fill="#ffffff" stroke="#e3eaf2" stroke-width="1.1"/><line x1="48.0" y1="116.5" x2="52.0" y2="116.5" stroke="#8095a8" stroke-width="1" stroke-linecap="round"/><text x="45.0" y="120.5" text-anchor="end" font-size="10.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">1.0</text><line x1="52.0" y1="116.5" x2="370.0" y2="116.5" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><line x1="48.0" y1="146.2" x2="52.0" y2="146.2" stroke="#8095a8" stroke-width="1" stroke-linecap="round"/><text x="45.0" y="150.2" text-anchor="end" font-size="10.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">0.5</text><line x1="52.0" y1="146.2" x2="370.0" y2="146.2" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><line x1="48.0" y1="176.0" x2="52.0" y2="176.0" stroke="#8095a8" stroke-width="1" stroke-linecap