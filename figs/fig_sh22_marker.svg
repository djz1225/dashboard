<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 577" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="肿瘤标志物：升高不等于癌"><title>肿瘤标志物：升高不等于癌</title><desc>常用肿瘤标志物：AFP（肝细胞癌、生殖细胞瘤）、CEA（结直肠癌）、CA19-9（胰腺癌、胆管癌）、PSA（前列腺癌）、CA125（卵巢癌）。但良性炎症、梗阻、妊娠、吸烟都可使其升高（特异性有限），敏感性亦不足以排除肿瘤。正确用法是疗效监测、复发预警与高危人群筛查，诊断必须结合影像与病理。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肿瘤标志物：升高不等于癌</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">敏感性有限（正常不能排除癌）、特异性有限（升高不能诊断癌）</text><text x="18.0" y="68.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">——只能用来监测</text><rect x="18.0" y="82.0" width="364.0" height="26.0" rx="6" fill="#f8fbfd"/><text x="26.0" y="99.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">标志物</text><text x="91.5" y="99.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">主要相关肿瘤</text><text x="237.1" y="99.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">也明显升高见于</text><line x1="18.0" y1="150.0" x2="382.0" y2="150.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="126.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">AFP</text><text x="91.5" y="126.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肝细胞癌、生殖细胞瘤</text><text x="237.1" y="126.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肝炎/肝硬化活动期、</text><text x="237.1" y="142.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">妊娠</text><line x1="18.0" y1="192.0" x2="382.0" y2="192.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="168.0" font-size="12.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">CEA</text><text x="91.5" y="168.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">结直肠癌（监测为主）</text><text x="237.1" y="168.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">吸烟、炎症性肠病、</text><text x="237.1" y="184.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肝硬化</text><line x1="18.0" y1="218.0" x2="382.0" y2="218.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="210.0" font-size="12.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">CA19-9</text><text x="91.5" y="210.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胰腺癌、胆管癌</text><text x="237.1" y="210.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胆道梗阻、胰腺炎</text><line x1="18.0" y1="260.0" x2="382.0" y2="260.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="236.0" font-size="12.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">PSA</text><text x="91.5" y="236.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">前列腺癌</text><text x="237.1" y="236.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">前列腺增生、前列腺</text><text x="237.1" y="252.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">炎、导尿后</text><line x1="18.0" y1="302.0" x2="382.0" y2="302.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="278.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">CA125</text><text x="91.5" y="278.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">卵巢癌</text><text x="237.1" y="278.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">子宫内膜异位、盆腔</text><text x="237.1" y="294.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">炎、妊娠</text><rect x="18.0" y="310.0" width="364.0" height="165.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="329.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">三个正确用法</text><rect x="30.0" y="340.0" width="3.0" height="15.0" rx="1.5" fill="#2f8f57"/><text x="39.0" y="353.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">疗效监测</text><text x="362.0" y="353.0" text-anchor="end" font-size="12" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">最主要用途</text><text x="39.0" y="371.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">治疗后浓度下降 → 提示有效；看动态趋势</text><text x="39.0" y="387.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">远比单次绝对值有用</text><rect x="30.0" y="396.0" width="3.0" height="15.0" rx="1.5" fill="#0f766e"/><text x="39.0" y="409.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">复发预警</text><text x="362.0" y="409.0" text-anchor="end" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">早于影像</text><text x="39.0" y="427.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">术后再度升高 → 提示复发，触发影像检查</text><rect x="30.0" y="436.0" width="3.0" height="15.0" rx="1.5" fill="#4a5a6b"/><text x="39.0" y="449.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">高危筛查</text><text x="362.0" y="449.0" text-anchor="end" font-size="12" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">不能确诊</text><text x="39.0" y="467.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">必须结合影像与病理；单独升高不作诊断依据</text><rect x="18.0" y="487.0" width="364.0" height="70.0" rx="8" fill="#fef3c7"/><rect x="18.0" y="487.0" width="3.5" height="70.0" rx="1.8" fill="#b45309"/><text x="32.0" y="507.0" font-size="11.5" font-weight="700" fill="#b45309" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">易错</text><text x="32.0" y="524.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">AFP 升高也见于肝炎肝硬化活动期——判读必须结合增</text><text x="32.0" y="543.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">强 CT/MRI 与病理。</text></svg>