<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 672" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="跨膜物质转运"><title>跨膜物质转运</title><desc>按是否需膜蛋白、是否耗能分六类：单纯扩散、通道与载体介导的易化扩散、原发性与继发性主动转运、出胞入胞。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">跨膜物质转运</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">两问定性：要不要膜蛋白？耗不耗能？</text><rect x="18.0" y="65.0" width="364.0" height="198.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="83.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">决策树</text><rect x="126.0" y="93.0" width="124.0" height="24.0" rx="6" fill="#e2f5f2" stroke="#0f766e" stroke-width="1"/><text x="188.0" y="109.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">是否直接耗能？</text><rect x="30.0" y="139.0" width="138.0" height="24.0" rx="6" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1"/><text x="99.0" y="155.0" text-anchor="middle" font-size="11" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">不耗能（被动）</text><line x1="188.0" y1="119.0" x2="99.0" y2="137.0" stroke="#8095a8" stroke-width="1.3" stroke-linecap="round"/><line x1="99.0" y1="137.0" x2="103.2" y2="133.5" stroke="#8095a8" stroke-width="1.3" stroke-linecap="round"/><line x1="99.0" y1="137.0" x2="104.3" y2="138.6" stroke="#8095a8" stroke-width="1.3" stroke-linecap="round"/><text x="99.0" y="179.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">需膜蛋白？</text><rect x="208.0" y="139.0" width="138.0" height="24.0" rx="6" fill="#fdeceb" stroke="#c0392b" stroke-width="1"/><text x="277.0" y="155.0" text-anchor="middle" font-size="11" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">耗能（主动/膜泡）</text><line x1="188.0" y1="119.0" x2="277.0" y2="137.0" stroke="#8095a8" stroke-width="1.3" stroke-linecap="round"/><line x1="277.0" y1="137.0" x2="271.7" y2="138.6" stroke="#8095a8" stroke-width="1.3" stroke-linecap="round"/><line x1="277.0" y1="137.0" x2="272.8" y2="133.5" stroke="#8095a8" stroke-width="1.3" stroke-linecap="round"/><text x="277.0" y="179.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">能量形式？</text><rect x="30.0" y="193.0" width="73.0" height="34.0" rx="6" fill="#eef2f7" stroke="#4a5a6b" stroke-width="1"/><text x="66.5" y="208.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">单纯扩散</text><text x="66.5" y="221.0" text-anchor="middle" font-size="9.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">O₂/CO₂</text><line x1="99.0" y1="183.0" x2="66.5" y2="191.0" stroke="#8095a8" stroke-width="1.1" stroke-linecap="round"/><line x1="66.5" y1="191.0" x2="69.8" y2="188.0" stroke="#8095a8" stroke-width="1.1" stroke-linecap="round"/><line x1="66.5" y1="191.0" x2="70.9" y2="192.2" stroke="#8095a8" stroke-width="1.1" stroke-linecap="round"/><rect x="111.0" y="193.0" width="73.0" height="34.0" rx="6" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1"/><text x="147.5" y="208.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">易化扩散</text><text x="147.5" y="221.0" text-anchor="middle" font-size="9.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">通道·载体</text><line x1="99.0" y1="183.0" x2="147.5" y2="191.0" stroke="#8095a8" stroke-width="1.1" stroke-linecap="round"/><line x1="147.5" y1="191.0" x2="143.3" y2="192.5" stroke="#8095a8" stroke-width="1.1" stroke-linecap="round"/><line x1="147.5" y1="191.0" x2="144.0" y2="188.2" stroke="#8095a8" stroke-width="1.1" stroke-linecap="round"/><rect x="192.0" y="193.0" width="73.0" height="34.0" rx="6" fill="#fdeceb" stroke="#c0392b" stroke-width="1"/><text x="228.5" y="208.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">原发性</text><text x="228.5" y="221.0" text-anchor="middle" font-size="9.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Na⁺泵</text><line x1="277.0" y1="183.0" x2="228.5" y2="191.0" stroke="#8095a8" stroke-width="1.1" stroke-linecap="round"/><line x1="228.5" y1="191.0" x2="232.0" y2="188.2" stroke="#8095a8" stroke-width="1.1" stroke-linecap="round"/><line x1="228.5" y1="191.0" x2="232.7" y2="192.5" stroke="#8095a8" stroke-width="1.1" stroke-linecap="round"/><rect x="273.0" y="193.0" width="73.0" height="34.0" rx="6" fill="#f2ecfb" stroke="#7b4bb7" stroke-width="1"/><text x="309.5" y="208.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">继发性</text><text x="309.5" y="221.0" text-anchor="middle" font-size="9.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Na⁺-葡萄糖</text><line x1="277.0" y1="183.0" x2="309.5" y2="191.0" stroke="#8095a8" stroke-width="1.1" stroke-linecap="round"/><line x1="309.5" y1="191.0" x2="305.1" y2="192.2" stroke="#8095a8" stroke-width="1.1" stroke-linecap="round"/><line x1="309.5" y1="191.0" x2="306.2" y2="188.0" stroke="#8095a8" stroke-width="1.1" stroke-linecap="round"/><text x="30.0" y="245.0" font-size="10.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">＋ 出胞 / 入胞：膜泡运输，转运大分子（递质释放、吞噬）</text><rect x="18.0" y="275.0" width="364.0" height="295.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="293.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">六种方式</text><rect x="30.0" y="303.0" width="3.0" height="15.0" rx="1.5" fill="#4a5a6b"/><text x="39.0" y="316.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">单纯扩散</text><text x="347.0" y="316.0" text-anchor="end" font-size="12" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">无蛋白·不耗能</text><text x="39.0" y="334.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">直接穿过脂质双分子层；例 O₂、CO₂、乙</text><text x="39.0" y="350.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">醇、类固醇</text><rect x="30.0" y="360.0" width="3.0" height="15.0" rx="1.5" fill="#1f6fb2"/><text x="39.0" y="373.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">易化扩散·通道</text><text x="347.0" y="373.0" text-anchor="end" font-size="12" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">快·无饱和</text><text x="39.0" y="391.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">经离子通道，门控开关；例 Na⁺、K⁺、Ca²⁺</text><text x="39.0" y="407.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"> 通道</text><rect x="30.0" y="417.0" width="3.0" height="15.0" rx="1.5" fill="#1f6fb2"/><text x="39.0" y="430.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">易化扩散·载体</text><text x="347.0" y="430.0" text-anchor="end" font-size="12" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">有饱和·有竞争</text><text x="39.0" y="448.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">载体构象改变；例葡萄糖 GLUT、氨基酸</text><rect x="30.0" y="458.0" width="3.0" height="15.0" rx="1.5" fill="#c0392b"/><text x="39.0" y="471.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">原发性主动</text><text x="347.0" y="471.0" text-anchor="end" font-size="12" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">直接耗 ATP</text><text x="39.0" y="489.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">逆浓度梯度；Na⁺-K⁺-ATP 酶（3Na⁺ 出／</text><text x="39.0" y="505.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">2K⁺ 入）</text><rect x="30.0" y="515.0" width="3.0" height="15.0" rx="1.5" fill="#7b4bb7"/><text x="39.0" y="528.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">继发性主动</text><text x="347.0" y="528.0" text-anchor="end" font-size="12" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">间接耗能</text><text x="39.0" y="546.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">借 Na⁺ 浓度势能；肠/肾 Na⁺-葡萄糖</text><text x="39.0" y="562.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">同向转运</text><rect x="18.0" y="582.0" width="364.0" height="70.0" rx="8" fill="#eef2f7"/><rect x="18.0" y="582.0" width="3.5" height="70.0" rx="1.8" fill="#4a5a6b"/><text x="32.0" y="602.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="619.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">有无饱和看是不是载体（通道无饱和、载体有饱和）；耗</text><text x="32.0" y="638.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">不耗能看是否直接/间接用 ATP。</text></svg>