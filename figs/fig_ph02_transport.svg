<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 608" width="100%" style="max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px" role="img"><text x="165.0" y="22.6" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">跨膜物质转运：靠什么过膜，耗不耗能</text><text x="165.0" y="43.0" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">分两大关：是否需膜蛋白，是否耗能</text><rect x="15.0" y="60.0" width="300.0" height="62.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="24.0" y="80.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">单纯扩散</text><text x="306.0" y="80.0" text-anchor="end" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">不耗能、无蛋白</text><text x="24.0" y="98.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">直接穿脂质双分子层</text><text x="24.0" y="115.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">例：O₂、CO₂、N₂、乙醇、类固醇</text><rect x="15.0" y="128.0" width="300.0" height="62.0" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/><text x="24.0" y="148.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">易化扩散·通道</text><text x="306.0" y="148.0" text-anchor="end" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">不耗能、快、无饱和</text><text x="24.0" y="166.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">经离子通道，门控开关</text><text x="24.0" y="183.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">例：Na⁺、K⁺、Ca²⁺ 通道</text><rect x="15.0" y="196.0" width="300.0" height="62.0" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/><text x="24.0" y="216.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">易化扩散·载体</text><text x="306.0" y="216.0" text-anchor="end" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">不耗能、有饱和、有竞争</text><text x="24.0" y="234.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">经载体蛋白构象改变</text><text x="24.0" y="251.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">例：葡萄糖（GLUT）、氨基酸</text><rect x="15.0" y="264.0" width="300.0" height="62.0" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/><text x="24.0" y="284.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">原发性主动</text><text x="306.0" y="284.0" text-anchor="end" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">耗能、逆浓度</text><text x="24.0" y="302.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">直接分解 ATP</text><text x="24.0" y="319.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">例：Na⁺-K⁺-ATP 酶（3Na⁺出／2K⁺入）</text><rect x="15.0" y="332.0" width="300.0" height="62.0" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="24.0" y="352.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">继发性主动</text><text x="306.0" y="352.0" text-anchor="end" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">间接耗能、同向/反向</text><text x="24.0" y="370.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">借 Na⁺ 浓度势能</text><text x="24.0" y="387.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">例：肠/肾 Na⁺-葡萄糖同向转运</text><rect x="15.0" y="400.0" width="300.0" height="62.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="24.0" y="420.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">出胞/入胞</text><text x="306.0" y="420.0" text-anchor="end" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">耗能</text><text x="24.0" y="438.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">膜泡运输，大分子</text><text x="24.0" y="455.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">例：递质释放、蛋白分泌、吞噬</text><rect x="15.0" y="470.0" width="300.0" height="76.0" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/><text x="25.0" y="486.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">判断口诀：耗不耗能看是否直接/间接用 ATP；</text><text x="25.0" y="502.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">有没有饱和看是不是载体</text><text x="25.0" y="518.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">通道无饱和（开就一直过），载体有饱和（</text><text x="25.0" y="534.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">会被占满）——这是最常考的区别</text><rect x="11.0" y="549.0" width="308.0" height="51.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="165.0" y="564.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">无蛋白不耗能＝单纯扩散；有蛋白不耗能＝易化</text><text x="165.0" y="579.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">扩散；耗能＝主动转运</text></svg>