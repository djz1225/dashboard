l="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">Tm 经验公式</text><text x="305.0" y="295.5" text-anchor="end" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">估算</text><text x="27.0" y="312.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">Tm ≈ 69.3 + 0.41 × GC%（长链 DNA）</text><rect x="15.0" y="327.5" width="300.0" height="86.0" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="25.0" y="346.5" text-anchor="start" font-size="13.5" font-weight="700" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">两个易混</text><text x="25.0" y="364.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 变性：氢键断、双链解开，但共价键完好 →</text><text x="25.0" y="380.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"> 可复性</text><text x="25.0" y="396.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 降解：磷酸二酯键断 → 片段化 → 不可逆</text><rect x="15.0" y="421.5" width="300.0" height="76.0" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/><text x="25.0" y="437.5" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">易错：Tm 是「一半解链」的温度，不是「开始</text><text x="25.0" y="453.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">解链」的温度</text><text x="25.0" y="469.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">A260 = 1 约相当于 50 μg/mL 双链 DNA、</text><text x="25.0" y="485.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">40 μg/mL RNA、20 μg/mL 寡核苷酸</text><rect x="11.0" y="502.5" width="308.0" height="51.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="165.0" y="517.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">GC 越高 Tm 越高；变性只断氢键可复性，</text><text x="165.0" y="533.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">降解断共价键不可逆</text></svg>