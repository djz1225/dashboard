<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 539" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="核酸变性与 Tm"><title>核酸变性与 Tm</title><desc>核酸变性时双链解开、碱基暴露，A260 升高 25~40%（增色效应），Tm 为解链一半时的温度，GC 含量越高 Tm 越高（Tm≈69.3+0.41×GC%）；变性只断氢键可复性，降解断磷酸二酯键不可逆。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">核酸变性与 Tm</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">双链解开 → 碱基暴露 → A260 升高（增色效应）；Tm 是解一</text><text x="18.0" y="68.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">半时的温度</text><line x1="18.0" y1="90.0" x2="32.0" y2="90.0" stroke="#0f766e" stroke-width="2.2" stroke-linecap="round"/><text x="37.0" y="94.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">GC 含量低（Tm 低）</text><line x1="158.9" y1="90.0" x2="172.9" y2="90.0" stroke="#b45309" stroke-width="2.2" stroke-dasharray="5 3" stroke-linecap="round"/><text x="177.9" y="94.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">GC 含量高（Tm 高）</text><rect x="18.0" y="102.0" width="364.0" height="194.0" rx="9" fill="#ffffff" stroke="#e3eaf2" stroke-width="1.1"/><line x1="50.0" y1="145.7" x2="54.0" y2="145.7" stroke="#cbd8e4" stroke-width="1" stroke-linecap="round"/><text x="47.0" y="149.7" text-anchor="end" font-size="12" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">1.35</text><line x1="54.0" y1="145.7" x2="370.0" y2="145.7" stroke="#f1f6fa" stroke-width="1" strok