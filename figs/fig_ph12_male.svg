<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 694" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="男性生殖：下丘脑-垂体-睾丸轴"><title>男性生殖：下丘脑-垂体-睾丸轴</title><desc>GnRH 脉冲式释放促腺垂体分泌 LH 与 FSH；LH 促间质细胞分泌睾酮，FSH 促支持细胞产生 ABP 与抑制素；睾酮维持生精并负反馈抑制 GnRH/LH，抑制素选择性抑制 FSH。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">男性生殖：下丘脑-垂体-睾丸轴</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">LH 管间质细胞（睾酮），FSH 管支持细胞（生精）</text><rect x="18.0" y="65.0" width="364.0" height="312.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="83.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">四级链</text><rect x="60.0" y="93.0" width="150.0" height="42.0" rx="8" fill="#e2f5f2" stroke="#0f766e" stroke-width="1.1"/><text x="70.0" y="110.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">下丘脑</text><text x="70.0" y="127.0" font-size="11" font-weight="400" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">GnRH（脉冲式）</text><circle cx="44" cy="114" r="8" fill="#0f766e"/><text x="44.0" y="118.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">1</text><line x1="80.0" y1="137.0" x2="80.0" y2="159.0" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="80.0" y1="159.0" x2="77.1" y2="153.7" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="80.0" y1="159.0" x2="82.9" y2="153.7" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><rect x="60.0" y="159.0" width="150.0" height="42.0" rx="8" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1.1"/><text x="70.0" y="176.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">腺垂体</text><text x="70.0" y="193.0" font-size="11" font-weight="400" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">LH ＋ FSH</text><circle cx="44" cy="180" r="8" fill="#1f6fb2"/><text x="44.0" y="184.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">2</text><line x1="80.0" y1="203.0" x2="80.0" y2="225.0" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="80.0" y1="225.0" x2="77.1" y2="219.7" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="80.0" y1="225.0" x2="82.9" y2="219.7" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><rect x="60.0" y="225.0" width="150.0" height="42.0" rx="8" fill="#fdeceb" stroke="#c0392b" stroke-width="1.1"/><text x="70.0" y="242.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">睾丸间质细胞</text><text x="70.0" y="259.0" font-size="11" font-weight="400" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">LH → 睾酮</text><circle cx="44" cy="246" r="8" fill="#c0392b"/><text x="44.0" y="250.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">3</text><line x1="80.0" y1="269.0" x2="80.0" y2="291.0" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="80.0" y1="291.0" x2="77.1" y2="285.7" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="80.0" y1="291.0" x2="82.9" y2="285.7" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><rect x="60.0" y="291.0" width="150.0" height="42.0" rx="8" fill="#f2ecfb" stroke="#7b4bb7" stroke-width="1.1"/><text x="70.0" y="308.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">支持细胞</text><text x="70.0" y="325.0" font-size="11" font-weight="400" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">FSH → ABP、抑制素</text><circle cx="44" cy="312" r="8" fill="#7b4bb7"/><text x="44.0" y="316.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">4</text><polyline points="210.0,246.0 240.0,246.0 240.0,114.0" fill="none" stroke="#b45309" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 3"/><line x1="240.0" y1="118.0" x2="212.0" y2="114.0" stroke="#b45309" stroke-width="1.6" stroke-linecap="round"/><line x1="212.0" y1="114.0" x2="217.6" y2="111.9" stroke="#b45309" stroke-width="1.6" stroke-linecap="round"/><line x1="212.0" y1="114.0" x2="216.8" y2="117.6" stroke="#b45309" stroke-width="1.6" stroke-linecap="round"/><text x="245.0" y="106.0" font-size="10.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">负反馈</text><text x="60.0" y="361.0" font-size="11" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">抑制素只抑制 FSH（对 LH 无影响）</text><rect x="18.0" y="389.0" width="364.0" height="184.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="407.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">睾酮的作用</text><rect x="31.0" y="417.0" width="3.0" height="15.0" rx="1.5" fill="#1f6fb2"/><text x="40.0" y="430.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胚胎期</text><text x="344.0" y="430.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">分化</text><text x="40.0" y="448.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">睾酮＋双氢睾酮（DHT）促中肾管与尿生殖窦向男性分化</text><rect x="31.0" y="456.0" width="3.0" height="15.0" rx="1.5" fill="#c0392b"/><text x="40.0" y="469.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">青春期</text><text x="344.0" y="469.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">第二性征</text><text x="40.0" y="487.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">喉结、声音低沉、肌肉与骨骼生长、毛发分布改变</text><rect x="31.0" y="495.0" width="3.0" height="15.0" rx="1.5" fill="#7b4bb7"/><text x="40.0" y="508.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">维持生精</text><text x="344.0" y="508.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">局部高浓度</text><text x="40.0" y="526.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">支持细胞分泌 ABP 结合雄激素，使曲细精管内浓度极高</text><rect x="31.0" y="534.0" width="3.0" height="15.0" rx="1.5" fill="#b45309"/><text x="40.0" y="547.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">其他</text><text x="344.0" y="547.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">同化作用</text><text x="40.0" y="565.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">促蛋白合成、促骨钙沉积；过多负反馈抑制 GnRH/LH</text><rect x="18.0" y="585.0" width="364.0" height="89.0" rx="8" fill="#eef2f7"/><rect x="18.0" y="585.0" width="3.5" height="89.0" rx="1.8" fill="#4a5a6b"/><text x="32.0" y="605.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="622.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">LH 作用于间质细胞、FSH 作用于支持细胞；抑制素只抑</text><text x="32.0" y="641.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">制 FSH，睾酮抑制 GnRH/LH——这是判断睾丸功能</text><text x="32.0" y="660.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">的关键。</text></svg>