<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 751" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="甲状腺激素：合成四步、作用五条"><title>甲状腺激素：合成四步、作用五条</title><desc>摄碘→TPO 活化碘并碘化酪氨酸→偶联生成 T₃T₄ 储存于胶质→TSH 促释放、TBG 运输；作用为提高代谢率与产热、促生长发育、提高神经兴奋性、加快心率；缺碘在胎儿致呆小症、在成人致甲状腺肿。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">甲状腺激素：合成四步、作用五条</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">碘是原料，过氧化物酶 TPO 是关键酶</text><rect x="18.0" y="65.0" width="364.0" height="327.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="83.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">合成四步</text><rect x="30.0" y="93.0" width="316.0" height="60.0" rx="8" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1.1"/><rect x="30.0" y="93.0" width="3.2" height="60.0" rx="1.6" fill="#1f6fb2"/><circle cx="48" cy="110" r="8.5" fill="#1f6fb2"/><text x="48.0" y="114.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">1</text><text x="63.0" y="114.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">摄碘</text><text x="335.0" y="114.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">原料</text><text x="63.0" y="131.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">滤泡细胞基底面碘泵主动摄碘（逆浓度）；碘是</text><text x="63.0" y="147.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">合成原料</text><line x1="48.0" y1="155.0" x2="48.0" y2="168.0" stroke="#4a5a6b" stroke-width="1.8" stroke-linecap="round"/><line x1="48.0" y1="168.0" x2="44.6" y2="161.9" stroke="#4a5a6b" stroke-width="1.8" stroke-linecap="round"/><line x1="48.0" y1="168.0" x2="51.4" y2="161.9" stroke="#4a5a6b" stroke-width="1.8" stroke-linecap="round"/><rect x="30.0" y="170.0" width="316.0" height="60.0" rx="8" fill="#f2ecfb" stroke="#7b4bb7" stroke-width="1.1"/><rect x="30.0" y="170.0" width="3.2" height="60.0" rx="1.6" fill="#7b4bb7"/><circle cx="48" cy="187" r="8.5" fill="#7b4bb7"/><text x="48.0" y="191.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">2</text><text x="63.0" y="191.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">活化与碘化</text><text x="335.0" y="191.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">TPO</text><text x="63.0" y="208.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">TPO 使碘活化，与甲状腺球蛋白上的酪氨酸结合</text><text x="63.0" y="224.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">（MIT/DIT）</text><line x1="48.0" y1="232.0" x2="48.0" y2="245.0" stroke="#4a5a6b" stroke-width="1.8" stroke-linecap="round"/><line x1="48.0" y1="245.0" x2="44.6" y2="238.9" stroke="#4a5a6b" stroke-width="1.8" stroke-linecap="round"/><line x1="48.0" y1="245.0" x2="51.4" y2="238.9" stroke="#4a5a6b" stroke-width="1.8" stroke-linecap="round"/><rect x="30.0" y="247.0" width="316.0" height="60.0" rx="8" fill="#e2f5f2" stroke="#0f766e" stroke-width="1.1"/><rect x="30.0" y="247.0" width="3.2" height="60.0" rx="1.6" fill="#0f766e"/><circle cx="48" cy="264" r="8.5" fill="#0f766e"/><text x="48.0" y="268.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">3</text><text x="63.0" y="268.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">偶联与储存</text><text x="335.0" y="268.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">储存</text><text x="63.0" y="285.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">DIT+DIT→T₄，MIT+DIT→T₃，储存于胶质，</text><text x="63.0" y="301.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">储量可用数周</text><line x1="48.0" y1="309.0" x2="48.0" y2="322.0" stroke="#4a5a6b" stroke-width="1.8" stroke-linecap="round"/><line x1="48.0" y1="322.0" x2="44.6" y2="315.9" stroke="#4a5a6b" stroke-width="1.8" stroke-linecap="round"/><line x1="48.0" y1="322.0" x2="51.4" y2="315.9" stroke="#4a5a6b" stroke-width="1.8" stroke-linecap="round"/><rect x="30.0" y="324.0" width="316.0" height="60.0" rx="8" fill="#fdeceb" stroke="#c0392b" stroke-width="1.1"/><rect x="30.0" y="324.0" width="3.2" height="60.0" rx="1.6" fill="#c0392b"/><circle cx="48" cy="341" r="8.5" fill="#c0392b"/><text x="48.0" y="345.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">4</text><text x="63.0" y="345.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">释放与运输</text><text x="335.0" y="345.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">TSH</text><text x="63.0" y="362.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">TSH 促胞吞释放；血中以 TBG 结合运输，游离</text><text x="63.0" y="378.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">部分起作用</text><rect x="18.0" y="398.0" width="3.0" height="14.0" rx="1.5" fill="#0f766e"/><text x="28.0" y="408.0" font-size="13.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">生理作用（几乎全身）</text><rect x="18.0" y="420.0" width="177.0" height="100.0" rx="9" fill="#e2f5f2" stroke="#0f766e" stroke-width="1.1"/><text x="29.0" y="441.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">代谢</text><text x="29.0" y="460.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">提高基础代谢率、产热↑</text><text x="29.0" y="480.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">甲亢怕热多汗、食欲亢</text><text x="29.0" y="496.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">进而消瘦</text><rect x="205.0" y="420.0" width="177.0" height="100.0" rx="9" fill="#f2ecfb" stroke="#7b4bb7" stroke-width="1.1"/><text x="216.0" y="441.0" font-size="12.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">生长发育</text><text x="216.0" y="460.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胎儿与婴幼儿脑、骨骼</text><text x="216.0" y="476.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">发育必需</text><text x="216.0" y="496.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">缺 → 呆小症（智力＋身材）</text><rect x="18.0" y="530.0" width="177.0" height="100.0" rx="9" fill="#fef3c7" stroke="#b45309" stroke-width="1.1"/><text x="29.0" y="551.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">神经系统</text><text x="29.0" y="570.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">提高中枢兴奋性</text><text x="29.0" y="590.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">甲亢易激动、失眠</text><rect x="205.0" y="530.0" width="177.0" height="100.0" rx="9" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1.1"/><text x="216.0" y="551.0" font-size="12.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">心血管</text><text x="216.0" y="570.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">心率↑、心输出量↑</text><text x="216.0" y="590.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">甲亢可致房颤</text><rect x="18.0" y="642.0" width="364.0" height="89.0" rx="8" fill="#eef2f7"/><rect x="18.0" y="642.0" width="3.5" height="89.0" rx="1.8" fill="#4a5a6b"/><text x="32.0" y="662.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="679.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">原发甲亢 T₃T₄↑、TSH↓；原发甲减 T₃T₄↓、TSH</text><text x="32.0" y="698.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">↑。胎儿期缺碘 → 呆小症，成人缺碘 → 单纯性</text><text x="32.0" y="717.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">甲状腺肿。</text></svg>