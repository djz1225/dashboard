<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 616" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="2,3-BPG：升上去，曲线右移，更易放氧"><title>2,3-BPG：升上去，曲线右移，更易放氧</title><desc>2,3-BPG 由糖酵解中间产物 1,3-BPG 经二磷酸甘油酸变位酶生成，结合脱氧血红蛋白（T 态）使其稳定，从而降低氧亲和力、使氧解离曲线右移（p50 由约 26 升至约 32 mmHg），组织更易获得氧。高原、慢性缺氧、贫血、妊娠时代偿性升高；库存血保存2 周后 2,3-BPG 明显下降使曲线左移，是大量输血后组织缺氧的原因之一。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">2,3-BPG：升上去，曲线右移，更易放氧</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">2,3-BPG 结合脱氧血红蛋白、稳定 T 态 → 氧亲和力下降（右</text><text x="18.0" y="68.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">移）→ 组织拿到更多氧</text><line x1="18.0" y1="90.0" x2="32.0" y2="90.0" stroke="#c0392b" stroke-width="2.2" stroke-linecap="round"/><text x="37.0" y="94.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">正常：p50 ≈ 26 mmHg</text><line x1="173.9" y1="90.0" x2="187.9" y2="90.0" stroke="#b45309" stroke-width="2.2" stroke-dasharray="5 3" stroke-linecap="round"/><text x="192.9" y="94.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">2,3-BPG↑：p50 ≈ 32 mmHg</text><rect x="18.0" y="102.0" width="364.0" height="190.0" rx="9" fill="#ffffff" stroke="#e3eaf2" stroke-width="1.1"/><line x1="50.0" y1="134.7" x2="54.0" y2="134.7" stroke="#cbd8e4" stroke-width="1" stroke-linecap="round"/><text x="47.0" y="138.7" text-anchor="end" font-size="12" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Mic