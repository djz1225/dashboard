<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 456" width="100%" style="max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px" role="img"><text x="165.0" y="22.6" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">2,3-BPG：氧亲和力的调节器</text><text x="165.0" y="43.0" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">升高 → 曲线右移 → 更易放氧</text><rect x="15.0" y="58.0" width="300.0" height="60.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><rect x="15.0" y="58.0" width="4.5" height="60.0" rx="2.2" fill="#0f766e"/><text x="29.0" y="77.0" text-anchor="start" font-size="14" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">2,3-BPG 生成</text><text x="29.0" y="94.0" text-anchor="start" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">1,3-BPG → 2,3-BPG（二磷酸甘油酸变位酶）</text><text x="29.0" y="109.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">消耗 1 个 ATP（去磷酸化回 3-PG）</text><rect x="15.0" y="122.0" width="300.0" height="60.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><rect x="15.0" y="122.0" width="4.5" height="60.0" rx="2.2" fill="#b45309"/><text x="29.0" y="141.0" text-anchor="start" font-size="14" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">作用机制</text><text x="29.0" y="158.0" text-anchor="start" font-size="12" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">结合脱氧血红蛋白（T 态）</text><text x="29.0" y="173.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">稳定 T 态 → 降亲和力 → 右移</text><rect x="15.0" y="186.0" width="300.0" height="60.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><rect x="15.0" y="186.0" width="4.5" height="60.0" rx="2.2" fill="#15803d"/><text x="29.0" y="205.0" text-anchor="start" font-size="14" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">何时升高</text><text x="29.0" y="222.0" text-anchor="start" font-size="12" font-weight="700" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">高原、慢性缺氧、贫血、妊娠</text><text x="29.0" y="237.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">代偿性增加组织供氧</text><rect x="15.0" y="250.0" width="300.0" height="60.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><rect x="15.0" y="250.0" width="4.5" height="60.0" rx="2.2" fill="#b91c1c"/><text x="29.0" y="269.0" text-anchor="start" font-size="14" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">何时降低</text><text x="29.0" y="286.0" text-anchor="start" font-size="12" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">库存血（保存 2 周后明显下降）</text><text x="29.0" y="301.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">大量输库存血 → 氧解离曲线左移</text><rect x="15.0" y="316.0" width="300.0" height="76.0" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/><text x="25.0" y="332.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">易错：2,3-BPG 升高使氧亲和力「下降」（</text><text x="25.0" y="348.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">曲线右移），不是升高</text><text x="25.0" y="364.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">库存血 2,3-BPG 下降是大量输血后组织缺氧</text><text x="25.0" y="380.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">的原因之一</text><rect x="11.0" y="397.0" width="308.0" height="51.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="165.0" y="412.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">2,3-BPG 结合 T 态降亲和力（右移）；</text><text x="165.0" y="427.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">高原升高代偿、库存血下降</text></svg>