<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 701" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="三羧酸循环：一轮的收支"><title>三羧酸循环：一轮的收支</title><desc>三羧酸循环一轮生成 3 NADH、1 FADH₂、1 GTP，按 NADH 2.5、FADH₂ 1.5 计共 10 ATP；限速酶为异柠檬酸脱氢酶，反应在线粒体基质（琥珀酸脱氢酶在内膜），是三大物质代谢的共同通路。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">三羧酸循环：一轮的收支</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">3 NADH + 1 FADH₂ + 1 GTP = 10 ATP（按 2.5 / 1.5 计）</text><rect x="18.0" y="65.0" width="273.0" height="24.0" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1"/><text x="154.5" y="82.0" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">3 NADH</text><rect x="291.0" y="65.0" width="54.6" height="24.0" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1"/><rect x="345.6" y="65.0" width="36.4" height="24.0" rx="3" fill="#e2f5f2" stroke="#0f766e" stroke-width="1"/><line x1="18.0" y1="105.0" x2="32.0" y2="105.0" stroke="#b45309" stroke-width="2.2" stroke-linecap="round"/><text x="37.0" y="109.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">3 × 2.5 = 7.5</text><line x1="143.2" y1="105.0" x2="157.2" y2="105.0" stroke="#b45309" stroke-width="2.2" stroke-linecap="round"/><text x="162.2" y="109.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">1.5</text><line x1="197.0" y1="105.0" x2="211.0" y2="105.0" stroke="#0f766e" stroke-width="2.2" stroke-linecap="round"/><text x="216.0" y="109.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">1.0</text><rect x="18.0" y="121.0" width="364.0" height="26.0" rx="6" fill="#f8fbfd"/><text x="26.0" y="138.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">环节</text><text x="186.2" y="138.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">产物</text><text x="309.9" y="138.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">折合 ATP</text><line x1="18.0" y1="189.0" x2="382.0" y2="189.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="165.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">异柠檬酸 → α-</text><text x="26.0" y="181.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">酮戊二酸</text><text x="186.2" y="165.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">1 NADH</text><text x="309.9" y="165.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">2.5</text><line x1="18.0" y1="231.0" x2="382.0" y2="231.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="207.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">α-酮戊二酸 → 琥珀</text><text x="26.0" y="223.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">酰CoA</text><text x="186.2" y="207.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">1 NADH</text><text x="309.9" y="207.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">2.5</text><line x1="18.0" y1="257.0" x2="382.0" y2="257.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="249.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">琥珀酰CoA → 琥珀酸</text><text x="186.2" y="249.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">1 GTP</text><text x="309.9" y="249.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">1.0</text><line x1="18.0" y1="283.0" x2="382.0" y2="283.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="275.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">琥珀酸 → 延胡索酸</text><text x="186.2" y="275.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">1 FADH₂</text><text x="309.9" y="275.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">1.5</text><line x1="18.0" y1="309.0" x2="382.0" y2="309.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="301.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">苹果酸 → 草酰乙酸</text><text x="186.2" y="301.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">1 NADH</text><text x="309.9" y="301.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">2.5</text><line x1="18.0" y1="351.0" x2="382.0" y2="351.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="327.0" font-size="12.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">合计（含底物磷酸化）</text><text x="186.2" y="327.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">3 NADH + 1 FADH₂</text><text x="186.2" y="343.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"> + 1 GTP</text><text x="309.9" y="327.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">10</text><rect x="18.0" y="357.0" width="177.0" height="116.0" rx="9" fill="#fde8dd" stroke="#c1440e" stroke-width="1.1"/><text x="29.0" y="378.0" font-size="12.5" font-weight="700" fill="#c1440e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">限速酶</text><text x="29.0" y="397.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">异柠檬酸脱氢酶（最重要）</text><text x="29.0" y="417.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">另有柠檬酸合酶、α-酮戊二</text><text x="29.0" y="433.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">酸脱氢酶</text><rect x="205.0" y="357.0" width="177.0" height="116.0" rx="9" fill="#eef2f7" stroke="#4a5a6b" stroke-width="1.1"/><text x="216.0" y="378.0" font-size="12.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">位置</text><text x="216.0" y="397.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">线粒体基质</text><text x="216.0" y="417.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">唯一例外：琥珀酸脱氢酶在</text><text x="216.0" y="433.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">内膜（复合体Ⅱ）</text><rect x="18.0" y="483.0" width="177.0" height="116.0" rx="9" fill="#fef3c7" stroke="#b45309" stroke-width="1.1"/><text x="29.0" y="504.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">回补反应</text><text x="29.0" y="523.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">草酰乙酸需不断补充</text><text x="29.0" y="543.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">丙酮酸羧化酶、苹果酸酶</text><rect x="205.0" y="483.0" width="177.0" height="116.0" rx="9" fill="#e2f5f2" stroke="#0f766e" stroke-width="1.1"/><text x="216.0" y="504.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">枢纽意义</text><text x="216.0" y="523.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">糖、脂、蛋白三大代谢</text><text x="216.0" y="539.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">的共同通路</text><text x="216.0" y="559.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">也是呼吸链 NADH 的主</text><text x="216.0" y="575.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">要来源</text><rect x="18.0" y="611.0" width="364.0" height="70.0" rx="8" fill="#fef3c7"/><rect x="18.0" y="611.0" width="3.5" height="70.0" rx="1.8" fill="#b45309"/><text x="32.0" y="631.0" font-size="11.5" font-weight="700" fill="#b45309" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">易错</text><text x="32.0" y="648.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一轮是 10 ATP，不是 12；三羧酸循环不产 NADPH，那</text><text x="32.0" y="667.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">是磷酸戊糖途径的事。</text></svg>