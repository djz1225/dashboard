<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 588.5" width="100%" style="max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px" role="img"><text x="165.0" y="22.6" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">三羧酸循环：一轮的收支</text><text x="165.0" y="42.6" text-anchor="middle" font-size="13.5" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">3 NADH + 1 FADH₂ + 1 GTP = 10 ATP（按 2.5 / 1.5 计）</text><rect x="15.0" y="57.5" width="300.0" height="24.0" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/><text x="21.0" y="73.5" text-anchor="start" font-size="11.2" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">环节</text><text x="152.4" y="73.5" text-anchor="start" font-size="11.2" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">产物</text><text x="263.8" y="73.5" text-anchor="start" font-size="11.2" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">折合 ATP</text><rect x="15.0" y="81.5" width="300.0" height="22.0" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.9"/><text x="21.0" y="96.5" text-anchor="start" font-size="11.2" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">异柠檬酸 → α-酮戊二酸</text><text x="152.4" y="96.5" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">1 NADH</text><text x="263.8" y="96.5" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">2.5</text><rect x="15.0" y="103.5" width="300.0" height="36.0" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.9"/><text x="21.0" y="118.5" text-anchor="start" font-size="11.2" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">α-酮戊二酸 → 琥珀酰Co</text><text x="21.0" y="132.5" text-anchor="start" font-size="11.2" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">A</text><text x="152.4" y="118.5" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">1 NADH</text><text x="263.8" y="118.5" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">2.5</text><rect x="15.0" y="139.5" width="300.0" height="22.0" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.9"/><text x="21.0" y="154.5" text-anchor="start" font-size="11.2" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">琥珀酰CoA → 琥珀酸</text><text x="152.4" y="154.5" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">1 GTP</text><text x="263.8" y="154.5" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">1.0</text><rect x="15.0" y="161.5" width="300.0" height="22.0" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.9"/><text x="21.0" y="176.5" text-anchor="start" font-size="11.2" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">琥珀酸 → 延胡索酸</text><text x="152.4" y="176.5" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">1 FADH₂</text><text x="263.8" y="176.5" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">1.5</text><rect x="15.0" y="183.5" width="300.0" height="22.0" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.9"/><text x="21.0" y="198.5" text-anchor="start" font-size="11.2" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">苹果酸 → 草酰乙酸</text><text x="152.4" y="198.5" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">1 NADH</text><text x="263.8" y="198.5" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">2.5</text><rect x="15.0" y="205.5" width="300.0" height="36.0" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.9"/><text x="21.0" y="220.5" text-anchor="start" font-size="11.2" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">合计（含底物磷酸化）</text><text x="152.4" y="220.5" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">3NADH+1FADH₂+1GT</text><text x="152.4" y="234.5" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">P</text><text x="263.8" y="220.5" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">10</text><rect x="15.0" y="246.5" width="300.0" height="46.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><rect x="15.0" y="246.5" width="4.5" height="46.0" rx="2.2" fill="#b91c1c"/><text x="29.0" y="265.5" text-anchor="start" font-size="14" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">限速酶</text><text x="304.0" y="265.5" text-anchor="end" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">3 个</text><text x="29.0" y="282.5" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">异柠檬酸脱氢酶（最重要）；另两个调控点：柠檬酸合酶、α-酮戊二酸脱氢酶</text><rect x="15.0" y="296.5" width="300.0" height="46.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><rect x="15.0" y="296.5" width="4.5" height="46.0" rx="2.2" fill="#0f766e"/><text x="29.0" y="315.5" text-anchor="start" font-size="14" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">位置</text><text x="304.0" y="315.5" text-anchor="end" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">基质</text><text x="29.0" y="332.5" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">线粒体基质；唯一例外是琥珀酸脱氢酶在内膜（复合体Ⅱ）</text><rect x="15.0" y="346.5" width="300.0" height="46.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><rect x="15.0" y="346.5" width="4.5" height="46.0" rx="2.2" fill="#b45309"/><text x="29.0" y="365.5" text-anchor="start" font-size="14" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">回补反应</text><text x="304.0" y="365.5" text-anchor="end" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">必需</text><text x="29.0" y="382.5" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">草酰乙酸需不断补充：丙酮酸羧化酶、苹果酸酶</text><rect x="15.0" y="396.5" width="300.0" height="46.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><rect x="15.0" y="396.5" width="4.5" height="46.0" rx="2.2" fill="#15803d"/><text x="29.0" y="415.5" text-anchor="start" font-size="14" font-weight="700" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">枢纽意义</text><text x="304.0" y="415.5" text-anchor="end" font-size="13.5" font-weight="700" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">枢纽</text><text x="29.0" y="432.5" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">连接糖、脂、蛋白三大代谢的最终共同通路</text><rect x="15.0" y="448.5" width="300.0" height="76.0" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/><text x="25.0" y="464.5" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">易错：一次循环不是「产 12 ATP」——按 10 </text><text x="25.0" y="480.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">版的 2.5/1.5 计是 10 ATP</text><text x="25.0" y="496.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">三羧酸循环不产 NADPH，那是磷酸戊糖途径的</text><text x="25.0" y="512.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">事</text><rect x="11.0" y="529.5" width="308.0" height="51.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="165.0" y="544.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">一轮 3NADH+1FADH₂+1GTP=10 ATP；限速酶是</text><text x="165.0" y="560.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">异柠檬酸脱氢酶</text></svg>