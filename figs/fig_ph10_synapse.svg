<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 672" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="化学性突触传递：电 → 化学 → 电"><title>化学性突触传递：电 → 化学 → 电</title><desc>动作电位到末梢引起 Ca²⁺ 内流，囊泡胞吐释放递质，递质结合后膜受体产生 EPSP（Na⁺ 内流为主）或 IPSP（Cl⁻ 内流/K⁺ 外流）；递质由酶解或重摄取清除；单向传递与突触延搁均由结构决定。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">化学性突触传递：电 → 化学 → 电</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">单向传递由「递质只从前膜释放、受体只在后膜」决定</text><rect x="18.0" y="65.0" width="364.0" height="166.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="83.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">结构：三段</text><rect x="30.0" y="93.0" width="316.0" height="56.0" rx="8" fill="#f2ecfb" stroke="#7b4bb7" stroke-width="1.1"/><text x="40.0" y="110.0" font-size="11.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">突触前末梢</text><circle cx="56.0" cy="131.0" r="4.6" fill="#7b4bb7"/><circle cx="64.0" cy="139.0" r="3.4" fill="#7b4bb7"/><circle cx="82.0" cy="131.0" r="4.6" fill="#7b4bb7"/><circle cx="90.0" cy="139.0" r="3.4" fill="#7b4bb7"/><circle cx="108.0" cy="131.0" r="4.6" fill="#7b4bb7"/><circle cx="116.0" cy="139.0" r="3.4" fill="#7b4bb7"/><circle cx="134.0" cy="131.0" r="4.6" fill="#7b4bb7"/><circle cx="142.0" cy="139.0" r="3.4" fill="#7b4bb7"/><circle cx="160.0" cy="131.0" r="4.6" fill="#7b4bb7"/><circle cx="168.0" cy="139.0" r="3.4" fill="#7b4bb7"/><text x="336.0" y="110.0" text-anchor="end" font-size="11" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">囊泡（含递质）</text><rect x="30.0" y="151.0" width="316.0" height="22.0" rx="4" fill="#eef2f7" stroke="#4a5a6b" stroke-width="1"/><text x="40.0" y="166.0" font-size="11" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">突触间隙 20~30 nm</text><text x="336.0" y="166.0" text-anchor="end" font-size="11" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">递质扩散过来</text><rect x="30.0" y="175.0" width="316.0" height="46.0" rx="8" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1.1"/><text x="40.0" y="192.0" font-size="11.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">突触后膜</text><text x="40.0" y="210.0" font-size="11" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">受体 + 离子通道（EPSP / IPSP）</text><rect x="180.0" y="179.0" width="14.0" height="10.0" rx="2" fill="#1f6fb2"/><rect x="206.0" y="179.0" width="14.0" height="10.0" rx="2" fill="#1f6fb2"/><rect x="232.0" y="179.0" width="14.0" height="10.0" rx="2" fill="#1f6fb2"/><rect x="258.0" y="179.0" width="14.0" height="10.0" rx="2" fill="#1f6fb2"/><line x1="300.0" y1="133.0" x2="300.0" y2="101.0" stroke="#7b4bb7" stroke-width="1.4" stroke-linecap="round"/><line x1="300.0" y1="101.0" x2="302.4" y2="105.4" stroke="#7b4bb7" stroke-width="1.4" stroke-linecap="round"/><line x1="300.0" y1="101.0" x2="297.6" y2="105.4" stroke="#7b4bb7" stroke-width="1.4" stroke-linecap="round"/><text x="294.0" y="123.0" text-anchor="end" font-size="10.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Ca²⁺</text><rect x="18.0" y="243.0" width="364.0" height="327.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="261.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">四步</text><rect x="30.0" y="271.0" width="316.0" height="60.0" rx="8" fill="#f2ecfb" stroke="#7b4bb7" stroke-width="1.1"/><rect x="30.0" y="271.0" width="3.2" height="60.0" rx="1.6" fill="#7b4bb7"/><circle cx="48" cy="288" r="8.5" fill="#7b4bb7"/><text x="48.0" y="292.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">1</text><text x="63.0" y="292.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">电信号到末梢</text><text x="335.0" y="292.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">电</text><text x="63.0" y="309.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">动作电位传到突触前膜 → 电压门控 Ca²⁺ 通</text><text x="63.0" y="325.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">道开放、Ca²⁺ 内流</text><line x1="48.0" y1="333.0" x2="48.0" y2="346.0" stroke="#4a5a6b" stroke-width="1.8" stroke-linecap="round"/><line x1="48.0" y1="346.0" x2="44.6" y2="339.9" stroke="#4a5a6b" stroke-width="1.8" stroke-linecap="round"/><line x1="48.0" y1="346.0" x2="51.4" y2="339.9" stroke="#4a5a6b" stroke-width="1.8" stroke-linecap="round"/><rect x="30.0" y="348.0" width="316.0" height="60.0" rx="8" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1.1"/><rect x="30.0" y="348.0" width="3.2" height="60.0" rx="1.6" fill="#1f6fb2"/><circle cx="48" cy="365" r="8.5" fill="#1f6fb2"/><text x="48.0" y="369.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">2</text><text x="63.0" y="369.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">化学信号释放</text><text x="335.0" y="369.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">化学</text><text x="63.0" y="386.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">突触小泡与前膜融合，递质以胞吐方式进入间隙</text><text x="63.0" y="402.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">（耗能）</text><line x1="48.0" y1="410.0" x2="48.0" y2="423.0" stroke="#4a5a6b" stroke-width="1.8" stroke-linecap="round"/><line x1="48.0" y1="423.0" x2="44.6" y2="416.9" stroke="#4a5a6b" stroke-width="1.8" stroke-linecap="round"/><line x1="48.0" y1="423.0" x2="51.4" y2="416.9" stroke="#4a5a6b" stroke-width="1.8" stroke-linecap="round"/><rect x="30.0" y="425.0" width="316.0" height="60.0" rx="8" fill="#fdeceb" stroke="#c0392b" stroke-width="1.1"/><rect x="30.0" y="425.0" width="3.2" height="60.0" rx="1.6" fill="#c0392b"/><circle cx="48" cy="442" r="8.5" fill="#c0392b"/><text x="48.0" y="446.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">3</text><text x="63.0" y="446.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">电信号再现</text><text x="335.0" y="446.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">电</text><text x="63.0" y="463.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">递质结合后膜受体 → 离子通道开放 → EPSP </text><text x="63.0" y="479.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">或 IPSP</text><line x1="48.0" y1="487.0" x2="48.0" y2="500.0" stroke="#4a5a6b" stroke-width="1.8" stroke-linecap="round"/><line x1="48.0" y1="500.0" x2="44.6" y2="493.9" stroke="#4a5a6b" stroke-width="1.8" stroke-linecap="round"/><line x1="48.0" y1="500.0" x2="51.4" y2="493.9" stroke="#4a5a6b" stroke-width="1.8" stroke-linecap="round"/><rect x="30.0" y="502.0" width="316.0" height="60.0" rx="8" fill="#eef2f7" stroke="#4a5a6b" stroke-width="1.1"/><rect x="30.0" y="502.0" width="3.2" height="60.0" rx="1.6" fill="#4a5a6b"/><circle cx="48" cy="519" r="8.5" fill="#4a5a6b"/><text x="48.0" y="523.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">4</text><text x="63.0" y="523.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">递质清除</text><text x="335.0" y="523.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">终止</text><text x="63.0" y="540.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">AChE 水解 ACh、NE 重摄取 → 保证信号</text><text x="63.0" y="556.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">能「停」</text><rect x="18.0" y="582.0" width="364.0" height="70.0" rx="8" fill="#eef2f7"/><rect x="18.0" y="582.0" width="3.5" height="70.0" rx="1.8" fill="#4a5a6b"/><text x="32.0" y="602.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="619.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">单向传递：递质只从突触前膜释放、受体只在后膜。突触</text><text x="32.0" y="638.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">延搁每个突触 0.3~0.5 ms，突触越多反应越慢。</text></svg>