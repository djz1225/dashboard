<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 799" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="体温调节"><title>体温调节</title><desc>产热安静时靠内脏、运动时靠骨骼肌、寒战最高效；散热主要靠辐射（60%）、蒸发（25%）与传导对流（15%）；发热是调定点上移，中暑是散热失效。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">体温调节：产热与散热在调定点下平衡</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">调定点在下丘脑，效应只有两条：多产热、多散热</text><rect x="18.0" y="59.0" width="3.0" height="14.0" rx="1.5" fill="#c0392b"/><text x="28.0" y="69.0" font-size="13.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">产热：安静靠内脏、运动靠骨骼肌</text><rect x="18.0" y="81.0" width="364.0" height="165.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="99.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">产热的四个来源</text><rect x="30.0" y="109.0" width="3.0" height="15.0" rx="1.5" fill="#c0392b"/><text x="39.0" y="122.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">安静时｜内脏</text><text x="347.0" y="122.0" text-anchor="end" font-size="12" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">主要</text><text x="39.0" y="140.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肝、心、肾产热为主，约占 56%</text><rect x="30.0" y="150.0" width="3.0" height="15.0" rx="1.5" fill="#1f6fb2"/><text x="39.0" y="163.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">运动时｜骨骼肌</text><text x="347.0" y="163.0" text-anchor="end" font-size="12" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">剧增</text><text x="39.0" y="181.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">产热可增 10~20 倍，成为主要来源</text><rect x="30.0" y="191.0" width="3.0" height="15.0" rx="1.5" fill="#7b4bb7"/><text x="39.0" y="204.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">寒战＋非寒战</text><text x="347.0" y="204.0" text-anchor="end" font-size="12" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">最高效</text><text x="39.0" y="222.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">寒战是骨骼肌节律收缩；非寒战靠褐色脂肪 </text><text x="39.0" y="238.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">UCP1</text><rect x="18.0" y="252.0" width="3.0" height="14.0" rx="1.5" fill="#1f6fb2"/><text x="28.0" y="262.0" font-size="13.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">散热：主要靠皮肤，辐射占六成</text><rect x="18.0" y="274.0" width="364.0" height="205.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="292.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">三种散热方式</text><rect x="30.0" y="304.0" width="189.6" height="32.0" rx="4" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1.1"/><text x="124.8" y="324.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">辐射 60%</text><rect x="219.6" y="304.0" width="79.0" height="32.0" rx="4" fill="#f2ecfb" stroke="#7b4bb7" stroke-width="1.1"/><text x="259.1" y="324.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">蒸发 25%</text><rect x="298.6" y="304.0" width="47.4" height="32.0" rx="4" fill="#e6f6ec" stroke="#2f8f57" stroke-width="1.1"/><text x="322.3" y="318.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">传导对流</text><text x="322.3" y="331.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">15%</text><rect x="30.0" y="350.0" width="3.0" height="15.0" rx="1.5" fill="#1f6fb2"/><text x="39.0" y="363.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">辐射</text><text x="347.0" y="363.0" text-anchor="end" font-size="12" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">60%</text><text x="39.0" y="381.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">与环境温差相关，是最主要的散热方式</text><rect x="30.0" y="391.0" width="3.0" height="15.0" rx="1.5" fill="#7b4bb7"/><text x="39.0" y="404.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">蒸发</text><text x="347.0" y="404.0" text-anchor="end" font-size="12" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">25%</text><text x="39.0" y="422.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">出汗；湿度大时失效；另有不感蒸发约 1 L/</text><text x="39.0" y="438.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">日</text><rect x="30.0" y="448.0" width="3.0" height="15.0" rx="1.5" fill="#2f8f57"/><text x="39.0" y="461.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">传导对流</text><text x="347.0" y="461.0" text-anchor="end" font-size="12" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">15%</text><text x="39.0" y="479.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">靠空气与物体接触带走热量</text><rect x="18.0" y="485.0" width="3.0" height="14.0" rx="1.5" fill="#b45309"/><text x="28.0" y="495.0" font-size="13.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">调定点：发热与中暑是两回事</text><rect x="18.0" y="507.0" width="364.0" height="46.0" rx="8" fill="#fdeceb" stroke="#c0392b" stroke-width="1.1"/><rect x="18.0" y="507.0" width="3.5" height="46.0" rx="1.8" fill="#c0392b"/><circle cx="38" cy="525" r="9.5" fill="#c0392b"/><text x="38.0" y="529.0" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">1</text><text x="56.0" y="529.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">致热原</text><text x="370.0" y="529.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">起点</text><text x="56.0" y="547.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">细菌毒素等使下丘脑调定点上移</text><line x1="38.0" y1="555.0" x2="38.0" y2="570.0" stroke="#4a5a6b" stroke-width="2" stroke-linecap="round"/><line x1="38.0" y1="570.0" x2="34.2" y2="563.0" stroke="#4a5a6b" stroke-width="2" stroke-linecap="round"/><line x1="38.0" y1="570.0" x2="41.8" y2="563.0" stroke="#4a5a6b" stroke-width="2" stroke-linecap="round"/><rect x="18.0" y="553.0" width="364.0" height="46.0" rx="8" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1.1"/><rect x="18.0" y="553.0" width="3.5" height="46.0" rx="1.8" fill="#1f6fb2"/><circle cx="38" cy="571" r="9.5" fill="#1f6fb2"/><text x="38.0" y="575.0" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">2</text><text x="56.0" y="575.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">先感到冷</text><text x="370.0" y="575.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">产热↑</text><text x="56.0" y="593.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">体温低于新调定点 → 寒战、血管收缩</text><line x1="38.0" y1="601.0" x2="38.0" y2="616.0" stroke="#4a5a6b" stroke-width="2" stroke-linecap="round"/><line x1="38.0" y1="616.0" x2="34.2" y2="609.0" stroke="#4a5a6b" stroke-width="2" stroke-linecap="round"/><line x1="38.0" y1="616.0" x2="41.8" y2="609.0" stroke="#4a5a6b" stroke-width="2" stroke-linecap="round"/><rect x="18.0" y="599.0" width="364.0" height="46.0" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.1"/><rect x="18.0" y="599.0" width="3.5" height="46.0" rx="1.8" fill="#b45309"/><circle cx="38" cy="617" r="9.5" fill="#b45309"/><text x="38.0" y="621.0" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">3</text><text x="56.0" y="621.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">体温升高</text><text x="370.0" y="621.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">发热</text><text x="56.0" y="639.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">产热＞散热，升到新调定点水平</text><line x1="38.0" y1="647.0" x2="38.0" y2="662.0" stroke="#4a5a6b" stroke-width="2" stroke-linecap="round"/><line x1="38.0" y1="662.0" x2="34.2" y2="655.0" stroke="#4a5a6b" stroke-width="2" stroke-linecap="round"/><line x1="38.0" y1="662.0" x2="41.8" y2="655.0" stroke="#4a5a6b" stroke-width="2" stroke-linecap="round"/><rect x="18.0" y="645.0" width="364.0" height="46.0" rx="8" fill="#e6f6ec" stroke="#2f8f57" stroke-width="1.1"/><rect x="18.0" y="645.0" width="3.5" height="46.0" rx="1.8" fill="#2f8f57"/><circle cx="38" cy="663" r="9.5" fill="#2f8f57"/><text x="38.0" y="667.0" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">4</text><text x="56.0" y="667.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">退热药</text><text x="370.0" y="667.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">处理</text><text x="56.0" y="685.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">抑制前列腺素 → 调定点下移 → 出汗散热</text><rect x="18.0" y="709.0" width="364.0" height="70.0" rx="8" fill="#eef2f7"/><rect x="18.0" y="709.0" width="3.5" height="70.0" rx="1.8" fill="#4a5a6b"/><text x="32.0" y="729.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="746.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">发热是调定点上移（先冷后热）；中暑是散热失效（调定</text><text x="32.0" y="765.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">点正常）——机制完全不同，处理也不同。</text></svg>