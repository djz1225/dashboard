<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 767" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="酶活性测定：测什么、怎么测"><title>酶活性测定：测什么、怎么测</title><desc>活性中心由一级结构上相距很远、折叠后聚拢的少数残基组成，含结合基团与催化基团；酶活性以在规定条件下每分钟催化 1 μmol 底物为 1 U，比活性（U/mg）反映纯度，温度、pH、激活剂与抑制剂均影响测定。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">酶活性测定：测什么、怎么测</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">活性中心决定「测什么」，测定条件决定「测得准不准」</text><rect x="18.0" y="65.0" width="364.0" height="153.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="84.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">活性中心：一级远、三级近</text><rect x="30.0" y="95.0" width="3.0" height="15.0" rx="1.5" fill="#1f6fb2"/><text x="39.0" y="108.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">结合基团</text><text x="370.0" y="108.0" text-anchor="end" font-size="12" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">识别</text><text x="39.0" y="126.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">识别并固定底物，决定专一性</text><rect x="30.0" y="137.0" width="3.0" height="15.0" rx="1.5" fill="#c1440e"/><text x="39.0" y="150.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">催化基团</text><text x="370.0" y="150.0" text-anchor="end" font-size="12" font-weight="700" fill="#c1440e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">断/成键</text><text x="39.0" y="168.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">直接参与键的断裂或形成</text><rect x="30.0" y="179.0" width="3.0" height="15.0" rx="1.5" fill="#4a5a6b"/><text x="39.0" y="192.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">活性中心外必需基团</text><text x="370.0" y="192.0" text-anchor="end" font-size="12" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">维持构象</text><text x="39.0" y="210.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">如二硫键、结构残基，维持活性中心的三维形状</text><text x="18.0" y="224.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">关键残基在一级结构上彼此很远，折叠后靠在一起才成活性中心</text><rect x="18.0" y="242.0" width="364.0" height="201.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="261.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">三个概念</text><rect x="30.0" y="272.0" width="3.0" height="15.0" rx="1.5" fill="#0f766e"/><text x="39.0" y="285.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">酶活力单位 U</text><text x="370.0" y="285.0" text-anchor="end" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">规定条件</text><text x="39.0" y="303.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">最适 pH、25 ℃、足够底物下，每分钟催化 1</text><text x="39.0" y="319.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">μmol 底物</text><rect x="30.0" y="330.0" width="3.0" height="15.0" rx="1.5" fill="#2f8f57"/><text x="39.0" y="343.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">比活性</text><text x="370.0" y="343.0" text-anchor="end" font-size="12" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">U/mg 蛋白</text><text x="39.0" y="361.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">每毫克蛋白的酶活力 → 反映酶的纯度，是提</text><text x="39.0" y="377.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">纯的指标</text><rect x="30.0" y="388.0" width="3.0" height="15.0" rx="1.5" fill="#b45309"/><text x="39.0" y="401.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Km 与 Vmax</text><text x="370.0" y="401.0" text-anchor="end" font-size="12" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">从曲线读</text><text x="39.0" y="419.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">测不同 [S] 下的初速度后作图，反映亲和</text><text x="39.0" y="435.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">力与酶量</text><rect x="18.0" y="455.0" width="177.0" height="100.0" rx="9" fill="#fdeceb" stroke="#c0392b" stroke-width="1.1"/><text x="29.0" y="476.0" font-size="12.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">温度</text><text x="29.0" y="495.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">最适温度前随温度升高加快</text><text x="29.0" y="515.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">过热则变性，活性不可逆丢失</text><rect x="205.0" y="455.0" width="177.0" height="100.0" rx="9" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1.1"/><text x="216.0" y="476.0" font-size="12.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">pH</text><text x="216.0" y="495.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">各酶有最适 pH（胃蛋白酶约</text><text x="216.0" y="511.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">1.5）</text><text x="216.0" y="531.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">偏离改变必需基团的解离状态</text><rect x="18.0" y="565.0" width="177.0" height="100.0" rx="9" fill="#e6f6ec" stroke="#2f8f57" stroke-width="1.1"/><text x="29.0" y="586.0" font-size="12.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">激活剂</text><text x="29.0" y="605.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">金属离子、Cl⁻、胆汁酸等</text><text x="29.0" y="625.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">提高活性或促使酶原激活</text><rect x="205.0" y="565.0" width="177.0" height="100.0" rx="9" fill="#eef2f7" stroke="#4a5a6b" stroke-width="1.1"/><text x="216.0" y="586.0" font-size="12.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">抑制剂</text><text x="216.0" y="605.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">不可逆：共价结合必需基团</text><text x="216.0" y="625.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">可逆：竞争 / 非竞争 /</text><text x="216.0" y="641.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"> 反竞争</text><rect x="18.0" y="677.0" width="364.0" height="70.0" rx="8" fill="#e2f5f2"/><rect x="18.0" y="677.0" width="3.5" height="70.0" rx="1.8" fill="#0f766e"/><text x="32.0" y="697.0" font-size="11.5" font-weight="700" fill="#0f766e" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="714.0" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">报告酶活性必须同时给「单位定义 + 测定条件」，否则</text><text x="32.0" y="733.0" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">数值无法比较。</text></svg>