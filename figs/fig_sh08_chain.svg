<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 773" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="呼吸链：电子单向流，质子单向泵"><title>呼吸链：电子单向流，质子单向泵</title><desc>呼吸链按 NADH→复合体Ⅰ→Q→复合体Ⅲ→cyt c→复合体Ⅳ→O₂ 单向传电子；Ⅰ、Ⅲ、Ⅳ 分别泵出 4、4、2 个 H⁺，共 10 个，每 4 个 H⁺ 合成 1 分子 ATP；复合体Ⅱ（琥珀酸脱氢酶）只把 FADH₂ 的电子交给 Q，不泵质子，故 FADH₂ 的 P/O 只有 1.5。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">呼吸链：电子单向流，质子单向泵</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">NADH→Ⅰ→Q→Ⅲ→cyt c→Ⅳ→O₂；Ⅰ 4 H⁺、Ⅲ 4 H⁺、Ⅳ</text><text x="18.0" y="68.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">2 H⁺，复合体Ⅱ 不泵</text><rect x="18.0" y="82.0" width="364.0" height="372.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="101.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">电子的单向路线</text><rect x="30.0" y="114.0" width="340.0" height="64.0" rx="8" fill="#ffffff" stroke="#e3eaf2" stroke-width="1.1"/><rect x="30.0" y="114.0" width="3.5" height="64.0" rx="1.8" fill="#b45309"/><circle cx="49.0" cy="131.0" r="9" fill="#b45309"/><text x="49.0" y="135.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">1</text><text x="65.0" y="135.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">复合体Ⅰ｜NADH 脱氢酶</text><text x="360.0" y="135.0" text-anchor="end" font-size="12" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">泵 4 H⁺</text><text x="65.0" y="153.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">接受 NADH 电子（FMN、铁硫中心），</text><text x="65.0" y="169.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">交给泛醌</text><line x1="49.0" y1="180.0" x2="49.0" y2="187.0" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="187.0" x2="45.6" y2="180.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="187.0" x2="52.4" y2="180.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><rect x="30.0" y="189.0" width="340.0" height="64.0" rx="8" fill="#ffffff" stroke="#e3eaf2" stroke-width="1.1"/><rect x="30.0" y="189.0" width="3.5" height="64.0" rx="1.8" fill="#b45309"/><circle cx="49.0" cy="206.0" r="9" fill="#b45309"/><text x="49.0" y="210.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">2</text><text x="65.0" y="210.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">泛醌 Q｜膜内流动</text><text x="360.0" y="210.0" text-anchor="end" font-size="12" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">流动载体</text><text x="65.0" y="228.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">脂溶性，膜内自由扩散；也收复合体Ⅱ 的</text><text x="65.0" y="244.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">FADH₂ 电子</text><line x1="49.0" y1="255.0" x2="49.0" y2="262.0" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="262.0" x2="45.6" y2="255.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="262.0" x2="52.4" y2="255.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><rect x="30.0" y="264.0" width="340.0" height="48.0" rx="8" fill="#ffffff" stroke="#e3eaf2" stroke-width="1.1"/><rect x="30.0" y="264.0" width="3.5" height="48.0" rx="1.8" fill="#c1440e"/><circle cx="49.0" cy="281.0" r="9" fill="#c1440e"/><text x="49.0" y="285.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">3</text><text x="65.0" y="285.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">复合体Ⅲ｜细胞色素 bc₁</text><text x="360.0" y="285.0" text-anchor="end" font-size="12" font-weight="700" fill="#c1440e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">泵 4 H⁺</text><text x="65.0" y="303.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Q 循环转交 cyt c，再泵 4 H⁺</text><line x1="49.0" y1="314.0" x2="49.0" y2="321.0" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="321.0" x2="45.6" y2="314.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="321.0" x2="52.4" y2="314.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><rect x="30.0" y="323.0" width="340.0" height="48.0" rx="8" fill="#ffffff" stroke="#e3eaf2" stroke-width="1.1"/><rect x="30.0" y="323.0" width="3.5" height="48.0" rx="1.8" fill="#0f766e"/><circle cx="49.0" cy="340.0" r="9" fill="#0f766e"/><text x="49.0" y="344.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">4</text><text x="65.0" y="344.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">细胞色素 c｜外周蛋白</text><text x="360.0" y="344.0" text-anchor="end" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">流动载体</text><text x="65.0" y="362.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">唯一可溶，单电子传递，送到复合体Ⅳ</text><line x1="49.0" y1="373.0" x2="49.0" y2="380.0" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="380.0" x2="45.6" y2="373.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="380.0" x2="52.4" y2="373.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><rect x="30.0" y="382.0" width="340.0" height="64.0" rx="8" fill="#ffffff" stroke="#e3eaf2" stroke-width="1.1"/><rect x="30.0" y="382.0" width="3.5" height="64.0" rx="1.8" fill="#1f6fb2"/><circle cx="49.0" cy="399.0" r="9" fill="#1f6fb2"/><text x="49.0" y="403.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">5</text><text x="65.0" y="403.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">复合体Ⅳ｜细胞色素 c 氧化酶</text><text x="360.0" y="403.0" text-anchor="end" font-size="12" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">泵 2 H⁺</text><text x="65.0" y="421.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">交给 O₂ 生成 H₂O；氰化物、CO </text><text x="65.0" y="437.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">在此阻断</text><rect x="18.0" y="466.0" width="364.0" height="186.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="485.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">四个复合体各泵几个质子</text><text x="30.0" y="508.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Ⅰ</text><rect x="64.0" y="498.0" width="101.6" height="15.0" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1"/><text x="172.6" y="510.0" font-size="12" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">4 H⁺</text><text x="30.0" y="530.0" font-size="12.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Ⅱ</text><rect x="64.0" y="520.0" width="254.0" height="15.0" rx="3" fill="#ffffff" stroke="#e3eaf2" stroke-width="1" opacity="0.9"/><text x="71.0" y="532.0" font-size="12" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">不泵质子</text><text x="30.0" y="552.0" font-size="12.5" font-weight="700" fill="#c1440e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Ⅲ</text><rect x="64.0" y="542.0" width="101.6" height="15.0" rx="3" fill="#fde8dd" stroke="#c1440e" stroke-width="1"/><text x="172.6" y="554.0" font-size="12" font-weight="700" fill="#c1440e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">4 H⁺</text><text x="30.0" y="574.0" font-size="12.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Ⅳ</text><rect x="64.0" y="564.0" width="50.8" height="15.0" rx="3" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1"/><text x="121.8" y="576.0" font-size="12" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">2 H⁺</text><text x="30.0" y="594.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">合计 Ⅰ+Ⅲ+Ⅳ = 10 H⁺ → 每 4 H⁺ 合成 1 ATP</text><text x="30.0" y="610.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">故 NADH 折 2.5、FADH₂ 只折 1.5；复合体Ⅱ 是唯一不泵</text><text x="30.0" y="626.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">质子的入口，这就是 FADH₂ 少产 ATP 的原因。</text><rect x="18.0" y="664.0" width="364.0" height="89.0" rx="8" fill="#e2f5f2"/><rect x="18.0" y="664.0" width="3.5" height="89.0" rx="1.8" fill="#0f766e"/><text x="32.0" y="684.0" font-size="11.5" font-weight="700" fill="#0f766e" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="701.0" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">共泵 10 H⁺ → 10/4 = 2.5 ATP；复合体Ⅱ 不泵质</text><text x="32.0" y="720.0" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">子，所以 FADH₂ 只折 1.5 ATP。氧不是被底物直接还</text><text x="32.0" y="739.0" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">原，而是链末端的最终电子受体。</text></svg>