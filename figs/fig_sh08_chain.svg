<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 523.5" width="100%" style="max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px" role="img"><text x="165.0" y="22.6" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">呼吸链：四个复合体与两个穿梭者</text><text x="165.0" y="42.6" text-anchor="middle" font-size="13.5" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">电子单向流：NADH → Ⅰ → Q → Ⅲ → cyt c → Ⅳ → O₂</text><rect x="15.0" y="57.5" width="300.0" height="41.0" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/><text x="28.0" y="76.5" text-anchor="start" font-size="12.6" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">复合体Ⅰ（NADH-泛醌还原酶）</text><text x="28.0" y="93.5" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">接受 NADH 的电子，泵 4 H⁺；含 FMN、铁硫中心</text><line x1="165.0" y1="99.5" x2="165.0" y2="99.0" stroke="#64748b" stroke-width="1.4" stroke-linecap="round"/><polygon points="165.0,103.5 163.0,98.9 167.0,98.9" fill="#64748b"/><rect x="15.0" y="104.5" width="300.0" height="41.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/><text x="28.0" y="123.5" text-anchor="start" font-size="12.6" font-weight="700" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">泛醌 Q（流动电子载体）</text><text x="28.0" y="140.5" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">在膜内自由扩散，也接收复合体Ⅱ（FADH₂）的电子</text><line x1="165.0" y1="146.5" x2="165.0" y2="146.0" stroke="#64748b" stroke-width="1.4" stroke-linecap="round"/><polygon points="165.0,150.5 163.0,145.9 167.0,145.9" fill="#64748b"/><rect x="15.0" y="151.5" width="300.0" height="41.0" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/><text x="28.0" y="170.5" text-anchor="start" font-size="12.6" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">复合体Ⅲ（细胞色素 bc₁）</text><text x="28.0" y="187.5" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">Q 循环，泵 4 H⁺；把电子交给细胞色素 c</text><line x1="165.0" y1="193.5" x2="165.0" y2="193.0" stroke="#64748b" stroke-width="1.4" stroke-linecap="round"/><polygon points="165.0,197.5 163.0,192.9 167.0,192.9" fill="#64748b"/><rect x="15.0" y="198.5" width="300.0" height="41.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.4"/><text x="28.0" y="217.5" text-anchor="start" font-size="12.6" font-weight="700" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">细胞色素 c（外周蛋白）</text><text x="28.0" y="234.5" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">在膜间隙侧传递电子，是唯一可溶的细胞色素</text><line x1="165.0" y1="240.5" x2="165.0" y2="240.0" stroke="#64748b" stroke-width="1.4" stroke-linecap="round"/><polygon points="165.0,244.5 163.0,239.9 167.0,239.9" fill="#64748b"/><rect x="15.0" y="245.5" width="300.0" height="41.0" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.4"/><text x="28.0" y="264.5" text-anchor="start" font-size="12.6" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">复合体Ⅳ（细胞色素 c 氧化酶）</text><text x="28.0" y="281.5" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">把电子交给 O₂ 生成 H₂O，泵 2 H⁺；氰化物在此阻断</text><rect x="15.0" y="289.5" width="300.0" height="102.0" rx="7" fill="#ccfbf1" stroke="#cbd5e1" stroke-width="1.4"/><text x="25.0" y="308.5" text-anchor="start" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">两组数字必记</text><text x="25.0" y="326.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 泵质子：Ⅰ 4 H⁺、Ⅲ 4 H⁺、Ⅳ 2 H⁺，</text><text x="25.0" y="342.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">共 10 H⁺ → 每 4 H⁺ 合成 1 ATP</text><text x="25.0" y="358.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 复合体Ⅱ 不泵质子（所以 FADH₂ 只折 1.5</text><text x="25.0" y="374.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"> ATP 而非 2.5）</text><rect x="15.0" y="399.5" width="300.0" height="60.0" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/><text x="25.0" y="415.5" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">易错：氧不是被底物直接还原，而是呼吸链末</text><text x="25.0" y="431.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">端的最终电子受体</text><text x="25.0" y="447.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">电子流向是单向的 NADH→O₂，反向不成立</text><rect x="11.0" y="464.5" width="308.0" height="51.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="165.0" y="479.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">Ⅰ→Q→Ⅲ→cyt c→Ⅳ→O₂；Ⅰ Ⅲ Ⅳ 泵质子，Ⅱ 不泵（</text><text x="165.0" y="495.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">故 FADH₂ 少产 ATP）</text></svg>