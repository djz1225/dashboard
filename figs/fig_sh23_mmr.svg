<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 583" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="MMR 缺陷：微卫星不稳定与 Lynch 综合征"><title>MMR 缺陷：微卫星不稳定与 Lynch 综合征</title><desc>MMR 由 MSH2/MSH6（识别）与 MLH1/PMS2（切除）组成，任一基因失活即错配修复功能丧失，复制错配累积于微卫星短重复序列使其长度改变，形成微卫星不稳定（MSI）。MMR 基因胚系突变即 Lynch 综合征（遗传性非息肉病性结直肠癌，右半结肠多见）；MSI-H 肿瘤对 PD-1 抑制剂敏感，预后相对较好。与 APC 突变的 FAP 是两种不同的遗传性结直肠癌。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">MMR 缺陷：微卫星不稳定与 Lynch 综合征</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">错配修复四蛋白任一缺失 → 微卫星长度改变（MSI）→ 右半结</text><text x="18.0" y="68.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肠癌、对 PD-1 敏感</text><rect x="18.0" y="82.0" width="364.0" height="197.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="101.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">MMR 的两步与四个基因</text><rect x="30.0" y="112.0" width="3.0" height="15.0" rx="1.5" fill="#0f766e"/><text x="39.0" y="125.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">识别错配</text><text x="362.0" y="125.0" text-anchor="end" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">MSH2 · MSH6</text><text x="39.0" y="143.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">组成 MutSα 沿 DNA 滑动，识别错配与</text><text x="39.0" y="159.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">插入缺失环</text><rect x="30.0" y="168.0" width="3.0" height="15.0" rx="1.5" fill="#0f766e"/><text x="39.0" y="181.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">执行切除</text><text x="362.0" y="181.0" text-anchor="end" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">MLH1 · PMS2</text><text x="39.0" y="199.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">组成 MutLα 切开新链；四者任一失活</text><text x="39.0" y="215.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">即功能丧失</text><rect x="30.0" y="224.0" width="3.0" height="15.0" rx="1.5" fill="#c0392b"/><text x="39.0" y="237.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">后果</text><text x="362.0" y="237.0" text-anchor="end" font-size="12" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">MSI</text><text x="39.0" y="255.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">微卫星短重复序列长度改变 → 可用 PCR 或免</text><text x="39.0" y="271.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">疫组化检测</text><rect x="18.0" y="291.0" width="364.0" height="26.0" rx="6" fill="#f8fbfd"/><text x="26.0" y="308.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">对比</text><text x="106.1" y="308.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Lynch 综合征</text><text x="259.0" y="308.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">FAP（息肉病）</text><line x1="18.0" y1="359.0" x2="382.0" y2="359.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="335.0" font-size="12.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">全称</text><text x="106.1" y="335.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">遗传性非息肉病性结</text><text x="106.1" y="351.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">直肠癌</text><text x="259.0" y="335.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">家族性腺瘤性息肉病</text><line x1="18.0" y1="401.0" x2="382.0" y2="401.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="377.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">缺陷基因</text><text x="106.1" y="377.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">MMR 基因（MSH2/MLH1</text><text x="106.1" y="393.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">等）胚系突变</text><text x="259.0" y="377.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">APC 胚系突变</text><line x1="18.0" y1="443.0" x2="382.0" y2="443.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="419.0" font-size="12.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肠道表现</text><text x="106.1" y="419.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">息肉少，右半结肠癌多见</text><text x="259.0" y="419.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">结肠满布息肉（常 &gt;</text><text x="259.0" y="435.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">100 个）</text><line x1="18.0" y1="485.0" x2="382.0" y2="485.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="461.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">分子标志</text><text x="106.1" y="461.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">MSI-H、错配修复蛋</text><text x="106.1" y="477.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">白表达缺失</text><text x="259.0" y="461.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">APC 通路激活、</text><text x="259.0" y="477.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">无MSI</text><rect x="18.0" y="493.0" width="364.0" height="70.0" rx="8" fill="#e2f5f2"/><rect x="18.0" y="493.0" width="3.5" height="70.0" rx="1.8" fill="#0f766e"/><text x="32.0" y="513.0" font-size="11.5" font-weight="700" fill="#0f766e" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="530.0" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">MSI-H 提示预后相对好且对 PD-1 抑制剂敏感；Lynch</text><text x="32.0" y="549.0" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">与 FAP 是两种不同的遗传性结直肠癌。</text></svg>