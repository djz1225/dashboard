<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 592" width="100%" style="max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px" role="img"><text x="165.0" y="22.6" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">颈动脉窦-主动脉弓减压反射</text><text x="165.0" y="43.0" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">负反馈的经典范例：血压升高时把血压拉回</text><rect x="15.0" y="60.0" width="300.0" height="38.0" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/><text x="27.0" y="80.0" text-anchor="start" font-size="14" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">血压 ↑</text><text x="27.0" y="98.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">动脉壁被牵拉</text><line x1="165.0" y1="99.0" x2="165.0" y2="99.5" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/><polygon points="165.0,104.0 163.0,99.4 167.0,99.4" fill="#64748b"/><rect x="15.0" y="105.0" width="300.0" height="54.0" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/><text x="27.0" y="125.0" text-anchor="start" font-size="14" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">压力感受器兴奋</text><text x="27.0" y="143.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">颈动脉窦（窦神经→舌咽神经）、主动脉弓（</text><text x="27.0" y="159.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">减压神经→迷走）</text><line x1="165.0" y1="160.0" x2="165.0" y2="160.5" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/><polygon points="165.0,165.0 163.0,160.4 167.0,160.4" fill="#64748b"/><rect x="15.0" y="166.0" width="300.0" height="38.0" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/><text x="27.0" y="186.0" text-anchor="start" font-size="14" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">延髓心血管中枢</text><text x="27.0" y="204.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">心迷走中枢↑、心交感中枢↓、缩血管中枢↓</text><line x1="165.0" y1="205.0" x2="165.0" y2="205.5" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/><polygon points="165.0,210.0 163.0,205.4 167.0,205.4" fill="#64748b"/><rect x="15.0" y="211.0" width="300.0" height="38.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/><text x="27.0" y="231.0" text-anchor="start" font-size="14" font-weight="700" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">效应</text><text x="27.0" y="249.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">心率↓、心肌收缩力↓、血管舒张</text><line x1="165.0" y1="250.0" x2="165.0" y2="250.5" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/><polygon points="165.0,255.0 163.0,250.4 167.0,250.4" fill="#64748b"/><rect x="15.0" y="256.0" width="300.0" height="38.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/><text x="27.0" y="276.0" text-anchor="start" font-size="14" font-weight="700" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">血压 ↓</text><text x="27.0" y="294.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">回到调定点（负反馈完成）</text><rect x="15.0" y="296.0" width="300.0" height="118.0" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="25.0" y="315.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">必须掌握的两个「反」</text><text x="25.0" y="333.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 血压↑ → 反射使血压↓（这就是负反馈）</text><text x="25.0" y="349.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 血压↓ → 反射使血压↑（同一反射的另一方</text><text x="25.0" y="365.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">向）</text><text x="25.0" y="381.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 切断减压神经 → 血压升高且波动大（</text><text x="25.0" y="397.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">失去缓冲）</text><rect x="15.0" y="422.0" width="300.0" height="108.0" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/><text x="25.0" y="438.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">颈动脉窦主要感受「搏动性」压力变化，</text><text x="25.0" y="454.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">对快速变化更敏感</text><text x="25.0" y="470.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">压力感受器在「正常血压范围内」最敏感；</text><text x="25.0" y="486.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">长期高血压会重设调定点</text><text x="25.0" y="502.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">颈动脉体化学感受器管呼吸，别与颈动脉窦压</text><text x="25.0" y="518.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">力感受器搞混</text><rect x="11.0" y="533.0" width="308.0" height="51.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="165.0" y="548.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">血压↑→压力感受器→延髓→心率↓血管舒张→血压↓；</text><text x="165.0" y="563.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">这属负反馈</text></svg>