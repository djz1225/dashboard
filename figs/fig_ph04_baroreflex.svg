<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 683" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="颈动脉窦-主动脉弓减压反射"><title>颈动脉窦-主动脉弓减压反射</title><desc>血压升高牵拉压力感受器（颈动脉窦经窦神经、主动脉弓经减压神经），延髓心血管中枢使心迷走↑、心交感↓、缩血管中枢↓，心率下降、血管舒张，血压回落，完成负反馈。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">颈动脉窦-主动脉弓减压反射</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">负反馈的经典范例：血压升高时把血压拉回</text><rect x="18.0" y="65.0" width="364.0" height="340.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="83.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">反射弧五段</text><rect x="30.0" y="93.0" width="316.0" height="44.0" rx="8" fill="#fdeceb" stroke="#c0392b" stroke-width="1.1"/><rect x="30.0" y="93.0" width="3.2" height="44.0" rx="1.6" fill="#c0392b"/><circle cx="48" cy="110" r="8.5" fill="#c0392b"/><text x="48.0" y="114.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">1</text><text x="63.0" y="114.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">血压 ↑</text><text x="335.0" y="114.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">刺激</text><text x="63.0" y="131.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">动脉壁被牵拉，感受器放电频率升高</text><line x1="48.0" y1="139.0" x2="48.0" y2="152.0" stroke="#4a5a6b" stroke-width="1.8" stroke-linecap="round"/><line x1="48.0" y1="152.0" x2="44.6" y2="145.9" stroke="#4a5a6b" stroke-width="1.8" stroke-linecap="round"/><line x1="48.0" y1="152.0" x2="51.4" y2="145.9" stroke="#4a5a6b" stroke-width="1.8" stroke-linecap="round"/><rect x="30.0" y="154.0" width="316.0" height="60.0" rx="8" fill="#e2f5f2" stroke="#0f766e" stroke-width="1.1"/><rect x="30.0" y="154.0" width="3.2" height="60.0" rx="1.6" fill="#0f766e"/><circle cx="48" cy="171" r="8.5" fill="#0f766e"/><text x="48.0" y="175.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">2</text><text x="63.0" y="175.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">压力感受器</text><text x="335.0" y="175.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">感受</text><text x="63.0" y="192.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">颈动脉窦（窦神经→舌咽）、主动脉弓（减压神</text><text x="63.0" y="208.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">经→迷走）</text><line x1="48.0" y1="216.0" x2="48.0" y2="229.0" stroke="#4a5a6b" stroke-width="1.8" stroke-linecap="round"/><line x1="48.0" y1="229.0" x2="44.6" y2="222.9" stroke="#4a5a6b" stroke-width="1.8" stroke-linecap="round"/><line x1="48.0" y1="229.0" x2="51.4" y2="222.9" stroke="#4a5a6b" stroke-width="1.8" stroke-linecap="round"/><rect x="30.0" y="231.0" width="316.0" height="44.0" rx="8" fill="#f2ecfb" stroke="#7b4bb7" stroke-width="1.1"/><rect x="30.0" y="231.0" width="3.2" height="44.0" rx="1.6" fill="#7b4bb7"/><circle cx="48" cy="248" r="8.5" fill="#7b4bb7"/><text x="48.0" y="252.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">3</text><text x="63.0" y="252.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">延髓心血管中枢</text><text x="335.0" y="252.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">整合</text><text x="63.0" y="269.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">心迷走中枢↑、心交感中枢↓、缩血管中枢↓</text><line x1="48.0" y1="277.0" x2="48.0" y2="290.0" stroke="#4a5a6b" stroke-width="1.8" stroke-linecap="round"/><line x1="48.0" y1="290.0" x2="44.6" y2="283.9" stroke="#4a5a6b" stroke-width="1.8" stroke-linecap="round"/><line x1="48.0" y1="290.0" x2="51.4" y2="283.9" stroke="#4a5a6b" stroke-width="1.8" stroke-linecap="round"/><rect x="30.0" y="292.0" width="316.0" height="44.0" rx="8" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1.1"/><rect x="30.0" y="292.0" width="3.2" height="44.0" rx="1.6" fill="#1f6fb2"/><circle cx="48" cy="309" r="8.5" fill="#1f6fb2"/><text x="48.0" y="313.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">4</text><text x="63.0" y="313.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">效应</text><text x="335.0" y="313.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">输出</text><text x="63.0" y="330.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">心率↓、心肌收缩力↓、血管舒张 → 血压↓</text><line x1="48.0" y1="338.0" x2="48.0" y2="351.0" stroke="#4a5a6b" stroke-width="1.8" stroke-linecap="round"/><line x1="48.0" y1="351.0" x2="44.6" y2="344.9" stroke="#4a5a6b" stroke-width="1.8" stroke-linecap="round"/><line x1="48.0" y1="351.0" x2="51.4" y2="344.9" stroke="#4a5a6b" stroke-width="1.8" stroke-linecap="round"/><rect x="30.0" y="353.0" width="316.0" height="44.0" rx="8" fill="#e6f6ec" stroke="#2f8f57" stroke-width="1.1"/><rect x="30.0" y="353.0" width="3.2" height="44.0" rx="1.6" fill="#2f8f57"/><circle cx="48" cy="370" r="8.5" fill="#2f8f57"/><text x="48.0" y="374.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">5</text><text x="63.0" y="374.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">回到调定点</text><text x="335.0" y="374.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">闭环</text><text x="63.0" y="391.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">负反馈完成；血压↓时同一反射反向升压</text><rect x="18.0" y="417.0" width="364.0" height="145.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="435.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">三个考点</text><rect x="31.0" y="445.0" width="3.0" height="15.0" rx="1.5" fill="#1f6fb2"/><text x="40.0" y="458.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">双向性</text><text x="344.0" y="458.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">同一反射</text><text x="40.0" y="476.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">血压↑则降压、血压↓则升压，属负反馈缓冲</text><rect x="31.0" y="484.0" width="3.0" height="15.0" rx="1.5" fill="#b45309"/><text x="40.0" y="497.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">敏感性</text><text x="344.0" y="497.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">搏动性压力</text><text x="40.0" y="515.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">颈动脉窦对快速搏动性变化最敏感</text><rect x="31.0" y="523.0" width="3.0" height="15.0" rx="1.5" fill="#c0392b"/><text x="40.0" y="536.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">切断效应</text><text x="344.0" y="536.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">血压↑且波动</text><text x="40.0" y="554.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">切断减压神经失去缓冲，血压升高且不稳</text><rect x="18.0" y="574.0" width="364.0" height="89.0" rx="8" fill="#eef2f7"/><rect x="18.0" y="574.0" width="3.5" height="89.0" rx="1.8" fill="#4a5a6b"/><text x="32.0" y="594.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="611.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">血压↑→压力感受器→延髓→心率↓、血管舒张→血压↓，</text><text x="32.0" y="630.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">属负反馈。长期高血压会重设调定点；颈动脉体是化学感</text><text x="32.0" y="649.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">受器，别混淆。</text></svg>