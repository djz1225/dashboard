<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 848" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="核糖体三位点循环"><title>核糖体三位点循环</title><desc>翻译时核糖体有三个 tRNA 位点：A（氨酰）、P（肽酰）、E（退出）。循环为：氨酰-tRNA 进位到 A 位（EF-Tu，耗 1 GTP）→ 肽酰转移酶把 P 位肽链转到 A 位氨基酸上（由 rRNA 催化，即核酶）→ 核糖体沿 mRNA 前移一个密码子（EF-G，耗 1 GTP）→ 空载 tRNA 从 E 位释放。加上氨基酸活化耗 2 个高能键（ATP→AMP+PPi），每延长 1 个氨基酸共耗 4 个高能键。肽链方向为 N 端→C 端。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">核糖体三位点循环</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">A 进位 → P 成肽 → 移位 → E 退出；每延长 1 个氨基酸耗</text><text x="18.0" y="68.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">4 个高能键</text><rect x="18.0" y="82.0" width="364.0" height="158.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="101.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">70S 核糖体（50S + 30S）</text><rect x="30.0" y="114.0" width="328.0" height="46.0" rx="11" fill="#f2ecfb" stroke="#7b4bb7" stroke-width="1.2"/><rect x="30.0" y="166.0" width="328.0" height="34.0" rx="9" fill="#e2f5f2" stroke="#0f766e" stroke-width="1.2"/><text x="39.0" y="129.0" font-size="11.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">50S</text><text x="39.0" y="185.0" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">30S</text><circle cx="108.7" cy="163.0" r="7.5" fill="#ffffff" stroke="#0f766e" stroke-width="1.1"/><text x="108.7" y="166.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">E</text><circle cx="200.6" cy="163.0" r="7.5" fill="#ffffff" stroke="#0f766e" stroke-width="1.1"/><text x="200.6" y="166.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">P</text><circle cx="292.4" cy="163.0" r="7.5" fill="#ffffff" stroke="#0f766e" stroke-width="1.1"/><text x="292.4" y="166.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">A</text><line x1="38.0" y1="214.0" x2="350.0" y2="214.0" stroke="#4a5a6b" stroke-width="2.2" stroke-linecap="round"/><text x="38.0" y="228.0" font-size="11.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">mRNA  5′ → 3′</text><rect x="18.0" y="252.0" width="364.0" height="326.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="271.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">循环四步</text><rect x="30.0" y="284.0" width="332.0" height="64.0" rx="8" fill="#ffffff" stroke="#e3eaf2" stroke-width="1.1"/><rect x="30.0" y="284.0" width="3.5" height="64.0" rx="1.8" fill="#0f766e"/><circle cx="49.0" cy="301.0" r="9" fill="#0f766e"/><text x="49.0" y="305.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">1</text><text x="65.0" y="305.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">① 进位｜A 位</text><text x="352.0" y="305.0" text-anchor="end" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">1 GTP</text><text x="65.0" y="323.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">氨酰-tRNA 的 anticodon 与 A 位密码子</text><text x="65.0" y="339.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">配对，EF-Tu 水解 1 GTP</text><line x1="49.0" y1="350.0" x2="49.0" y2="356.0" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="356.0" x2="45.6" y2="349.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="356.0" x2="52.4" y2="349.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><rect x="30.0" y="358.0" width="332.0" height="64.0" rx="8" fill="#ffffff" stroke="#e3eaf2" stroke-width="1.1"/><rect x="30.0" y="358.0" width="3.5" height="64.0" rx="1.8" fill="#0f766e"/><circle cx="49.0" cy="375.0" r="9" fill="#0f766e"/><text x="49.0" y="379.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">2</text><text x="65.0" y="379.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">② 成肽｜P 位</text><text x="352.0" y="379.0" text-anchor="end" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">无耗能</text><text x="65.0" y="397.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肽酰转移酶把 P 位肽链转到 A 位氨基酸</text><text x="65.0" y="413.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">的氨基上 —— 由 rRNA 催化（核酶）</text><line x1="49.0" y1="424.0" x2="49.0" y2="430.0" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="430.0" x2="45.6" y2="423.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="430.0" x2="52.4" y2="423.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><rect x="30.0" y="432.0" width="332.0" height="64.0" rx="8" fill="#ffffff" stroke="#e3eaf2" stroke-width="1.1"/><rect x="30.0" y="432.0" width="3.5" height="64.0" rx="1.8" fill="#c1440e"/><circle cx="49.0" cy="449.0" r="9" fill="#c1440e"/><text x="49.0" y="453.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">3</text><text x="65.0" y="453.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">③ 移位</text><text x="352.0" y="453.0" text-anchor="end" font-size="12" font-weight="700" fill="#c1440e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">1 GTP</text><text x="65.0" y="471.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">核糖体沿 mRNA 前移一个密码子，肽酰-</text><text x="65.0" y="487.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">tRNA 由 A 位进 P 位；EF-G 水解 1 GTP</text><line x1="49.0" y1="498.0" x2="49.0" y2="504.0" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="504.0" x2="45.6" y2="497.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="504.0" x2="52.4" y2="497.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><rect x="30.0" y="506.0" width="332.0" height="64.0" rx="8" fill="#ffffff" stroke="#e3eaf2" stroke-width="1.1"/><rect x="30.0" y="506.0" width="3.5" height="64.0" rx="1.8" fill="#4a5a6b"/><circle cx="49.0" cy="523.0" r="9" fill="#4a5a6b"/><text x="49.0" y="527.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">4</text><text x="65.0" y="527.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">④ 退出｜E 位</text><text x="352.0" y="527.0" text-anchor="end" font-size="12" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">释放</text><text x="65.0" y="545.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">空载 tRNA 从 E 位释放，A 位空出接受下一</text><text x="65.0" y="561.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">个氨酰-tRNA</text><rect x="18.0" y="590.0" width="364.0" height="26.0" rx="6" fill="#f8fbfd"/><text x="26.0" y="607.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">耗能环节</text><text x="157.0" y="607.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">数量</text><text x="244.4" y="607.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">说明</text><line x1="18.0" y1="658.0" x2="382.0" y2="658.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="634.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">氨基酸活化</text><text x="157.0" y="634.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">2 个高能键</text><text x="244.4" y="634.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">氨基酸 + ATP → 氨酰</text><text x="244.4" y="650.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">-AMP + PPi</text><line x1="18.0" y1="684.0" x2="382.0" y2="684.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="676.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">进位</text><text x="157.0" y="676.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">1 GTP</text><text x="244.4" y="676.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">EF-Tu</text><line x1="18.0" y1="710.0" x2="382.0" y2="710.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="702.0" font-size="12.5" font-weight="700" fill="#c1440e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">移位</text><text x="157.0" y="702.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">1 GTP</text><text x="244.4" y="702.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">EF-G</text><line x1="18.0" y1="752.0" x2="382.0" y2="752.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="728.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">合计每延长 1</text><text x="26.0" y="744.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"> 个氨基酸</text><text x="157.0" y="728.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">4 个高能键</text><text x="244.4" y="728.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">2 + 1 + 1 = 4</text><rect x="18.0" y="758.0" width="364.0" height="70.0" rx="8" fill="#fef3c7"/><rect x="18.0" y="758.0" width="3.5" height="70.0" rx="1.8" fill="#b45309"/><text x="32.0" y="778.0" font-size="11.5" font-weight="700" fill="#b45309" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">易错</text><text x="32.0" y="795.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肽键由 rRNA 催化（核酶），不是蛋白质酶；新生肽链</text><text x="32.0" y="814.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">方向是 N 端 → C 端，与 mRNA 的 5′→3′ 对应。</text></svg>