<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 609" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="胆汁酸肠肝循环：95% 回收，池子一天转 6~10 次"><title>胆汁酸肠肝循环：95% 回收，池子一天转 6~10 次</title><desc>肝以胆固醇为原料、CYP7A1 为限速酶合成初级胆汁酸（胆酸、鹅脱氧胆酸），与甘氨酸或牛磺酸结合后分泌入胆汁；肠道细菌脱羟生成次级胆汁酸（脱氧胆酸、石胆酸）；约 95% 在回肠末端被主动重吸收经门静脉回肝，仅 5% 随粪排出。胆汁酸池 3~5 g、每日循环 6~10 次，每日新合成 0.4~0.6 g 即补足丢失。回肠病变或切除可致胆汁酸吸收障碍与脂肪泻。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胆汁酸肠肝循环：95% 回收，池子一天转 6~10 次</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">初级由肝造、次级由菌改；每天只新合成 0.4~0.6 g，靠高效回</text><text x="18.0" y="68.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">收撑住整个池</text><rect x="18.0" y="82.0" width="364.0" height="216.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="101.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一条回环，两个来源</text><text x="30.0" y="121.0" font-size="12" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">池 3~5 g ｜ 合成 0.4~0.6 g/日 ｜ 每日循环 6~10 次</text><rect x="100.0" y="132.0" width="182.0" height="36.0" rx="7" fill="#f2ecfb" stroke="#7b4bb7" stroke-width="1.1"/><text x="110.0" y="148.0" font-size="12.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肝</text><text x="126.0" y="148.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胆固醇 → 初级胆汁酸</text><text x="110.0" y="162.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">CYP7A1 限速；与甘氨酸/牛磺酸结合</text><rect x="100.0" y="228.0" width="182.0" height="36.0" rx="7" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1.1"/><text x="110.0" y="244.0" font-size="12.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肠</text><text x="126.0" y="244.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">细菌脱羟 → 次级胆汁酸</text><text x="110.0" y="258.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">回肠末端主动重吸收 95%</text><line x1="270.0" y1="168.0" x2="270.0" y2="226.0" stroke="#7b4bb7" stroke-width="1.7" stroke-linecap="round"/><line x1="270.0" y1="226.0" x2="267.1" y2="220.7" stroke="#7b4bb7" stroke-width="1.7" stroke-linecap="round"/><line x1="270.0" y1="226.0" x2="272.9" y2="220.7" stroke="#7b4bb7" stroke-width="1.7" stroke-linecap="round"/><text x="278.0" y="202.0" font-size="11.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胆汁入肠</text><line x1="112.0" y1="228.0" x2="112.0" y2="170.0" stroke="#0f766e" stroke-width="1.7" stroke-linecap="round"/><line x1="112.0" y1="170.0" x2="114.9" y2="175.3" stroke="#0f766e" stroke-width="1.7" stroke-linecap="round"/><line x1="112.0" y1="170.0" x2="109.1" y2="175.3" stroke="#0f766e" stroke-width="1.7" stroke-linecap="round"/><text x="34.0" y="194.0" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">95%</text><text x="34.0" y="206.0" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">重吸收</text><line x1="192.0" y1="264.0" x2="192.0" y2="280.0" stroke="#4a5a6b" stroke-width="1.5" stroke-linecap="round"/><line x1="192.0" y1="280.0" x2="189.6" y2="275.6" stroke="#4a5a6b" stroke-width="1.5" stroke-linecap="round"/><line x1="192.0" y1="280.0" x2="194.4" y2="275.6" stroke="#4a5a6b" stroke-width="1.5" stroke-linecap="round"/><text x="202.0" y="278.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">5% 随粪排出（即每日需新合成）</text><rect x="18.0" y="310.0" width="364.0" height="197.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="329.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">回环断在哪，病就在哪</text><rect x="30.0" y="340.0" width="3.0" height="15.0" rx="1.5" fill="#c0392b"/><text x="39.0" y="353.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">回肠病变</text><text x="362.0" y="353.0" text-anchor="end" font-size="12" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">吸收障碍</text><text x="39.0" y="371.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">末端回肠切除或克罗恩病 → 胆汁酸丢失</text><text x="39.0" y="387.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">→脂肪泻、脂溶性维生素缺乏</text><rect x="30.0" y="396.0" width="3.0" height="15.0" rx="1.5" fill="#b45309"/><text x="39.0" y="409.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">丢失代偿</text><text x="362.0" y="409.0" text-anchor="end" font-size="12" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">合成上调</text><text x="39.0" y="427.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肝把更多胆固醇转为胆汁酸；胆固醇消耗增加，</text><text x="39.0" y="443.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胆石风险随之改变</text><rect x="30.0" y="452.0" width="3.0" height="15.0" rx="1.5" fill="#4a5a6b"/><text x="39.0" y="465.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">次级胆汁酸</text><text x="362.0" y="465.0" text-anchor="end" font-size="12" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">结肠作用</text><text x="39.0" y="483.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">脱氧胆酸、石胆酸过多 → 分泌性腹泻，长期</text><text x="39.0" y="499.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">促癌风险升高</text><rect x="18.0" y="519.0" width="364.0" height="70.0" rx="8" fill="#e2f5f2"/><rect x="18.0" y="519.0" width="3.5" height="70.0" rx="1.8" fill="#0f766e"/><text x="32.0" y="539.0" font-size="11.5" font-weight="700" fill="#0f766e" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="556.0" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">初级＝胆酸 + 鹅脱氧胆酸（肝合成）；次级＝脱氧胆酸</text><text x="32.0" y="575.0" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">+ 石胆酸（细菌改造），别混。</text></svg>