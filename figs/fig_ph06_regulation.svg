<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 701" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="胃肠调节"><title>胃肠调节</title><desc>胃肠调节分三层：交感抑制、副交感促进、肠神经系统可半独立完成局部反射；激素中胃泌素管酸、促胰液素管碱、CCK 管酶与胆囊收缩。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胃肠调节：神经、体液、局部三层</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">外来神经之外，还有一整层「肠神经系统」</text><rect x="18.0" y="65.0" width="177.0" height="124.0" rx="9" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1.1"/><text x="29.0" y="86.0" font-size="12.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">交感兴奋｜抑制消化</text><text x="29.0" y="105.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">抑制胃肠运动与分泌</text><text x="29.0" y="125.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">括约肌收缩（排空减慢）</text><text x="29.0" y="145.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">血管收缩、血流减少</text><text x="29.0" y="165.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">紧张焦虑时食欲差即此机制</text><rect x="205.0" y="65.0" width="177.0" height="124.0" rx="9" fill="#fdeceb" stroke="#c0392b" stroke-width="1.1"/><text x="216.0" y="86.0" font-size="12.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">副交感（迷走）｜促进消化</text><text x="216.0" y="105.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">促进胃肠运动与分泌</text><text x="216.0" y="125.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">括约肌舒张（排空加快）</text><text x="216.0" y="145.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">血管舒张、血流增加</text><text x="216.0" y="165.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">进食后「消化模式」的主导</text><rect x="18.0" y="199.0" width="364.0" height="181.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="217.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肠神经系统（内在神经丛）</text><rect x="30.0" y="227.0" width="3.0" height="15.0" rx="1.5" fill="#2f8f57"/><text x="39.0" y="240.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">黏膜下神经丛</text><text x="347.0" y="240.0" text-anchor="end" font-size="12" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">分泌</text><text x="39.0" y="258.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">位于黏膜下层，主要控制腺体分泌与局部血流</text><rect x="30.0" y="268.0" width="3.0" height="15.0" rx="1.5" fill="#7b4bb7"/><text x="39.0" y="281.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肌间神经丛</text><text x="347.0" y="281.0" text-anchor="end" font-size="12" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">运动</text><text x="39.0" y="299.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">位于环形肌与纵行肌之间，主要控制平滑肌运</text><text x="39.0" y="315.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">动</text><rect x="30.0" y="325.0" width="3.0" height="15.0" rx="1.5" fill="#4a5a6b"/><text x="39.0" y="338.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">特点</text><text x="347.0" y="338.0" text-anchor="end" font-size="12" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">半独立</text><text x="39.0" y="356.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">切断外来神经后仍能完成局部反射，故称「肠</text><text x="39.0" y="372.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">脑」</text><rect x="18.0" y="386.0" width="3.0" height="14.0" rx="1.5" fill="#0f766e"/><text x="28.0" y="396.0" font-size="13.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胃肠激素三家</text><rect x="18.0" y="408.0" width="364.0" height="24.0" rx="6" fill="#e2f5f2"/><text x="24.0" y="424.0" font-size="10.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">激素</text><text x="111.4" y="424.0" font-size="10.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">来源细胞</text><text x="213.3" y="424.0" font-size="10.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">主要刺激</text><text x="300.6" y="424.0" font-size="10.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">主要作用</text><line x1="18.0" y1="471.0" x2="382.0" y2="471.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="24.0" y="449.0" font-size="12" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胃泌素</text><text x="111.4" y="449.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">G 细胞（胃窦）</text><text x="213.3" y="449.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">蛋白产物、胃</text><text x="213.3" y="464.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">扩张、迷走</text><text x="300.6" y="449.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">促胃酸分泌、</text><text x="300.6" y="464.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">促黏膜生长</text><line x1="18.0" y1="510.0" x2="382.0" y2="510.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="24.0" y="488.0" font-size="12" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">促胰液素</text><text x="111.4" y="488.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">S 细胞（十二指</text><text x="111.4" y="503.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肠）</text><text x="213.3" y="488.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">盐酸（最强）、</text><text x="213.3" y="503.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">脂肪酸</text><text x="300.6" y="488.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">促胰液大量分</text><text x="300.6" y="503.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">泌 HCO₃⁻</text><line x1="18.0" y1="549.0" x2="382.0" y2="549.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="24.0" y="527.0" font-size="12" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">缩胆囊素 CCK</text><text x="111.4" y="527.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">I 细胞（十二指</text><text x="111.4" y="542.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肠）</text><text x="213.3" y="527.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">蛋白产物、脂</text><text x="213.3" y="542.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肪酸</text><text x="300.6" y="527.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">促胆囊收缩、</text><text x="300.6" y="542.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">促胰酶分泌</text><line x1="18.0" y1="603.0" x2="382.0" y2="603.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="24.0" y="566.0" font-size="12" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">抑胃肽 GIP</text><text x="111.4" y="566.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">K 细胞（小肠）</text><text x="213.3" y="566.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">葡萄糖、脂肪</text><text x="300.6" y="566.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">抑制胃酸与胃</text><text x="300.6" y="581.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">排空、促胰岛</text><text x="300.6" y="596.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">素</text><rect x="18.0" y="611.0" width="364.0" height="70.0" rx="8" fill="#eef2f7"/><rect x="18.0" y="611.0" width="3.5" height="70.0" rx="1.8" fill="#4a5a6b"/><text x="32.0" y="631.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="648.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">促胰液素＝「酸来了快送碱」，CCK＝「脂肪蛋白来了快</text><text x="32.0" y="667.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">送酶、快挤胆囊」，胃泌素＝「有蛋白就多产酸」。</text></svg>