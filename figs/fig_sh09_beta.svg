<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 748" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="β-氧化：四步循环，软脂酸净 106 ATP"><title>β-氧化：四步循环，软脂酸净 106 ATP</title><desc>β-氧化在线粒体基质经脱氢、加水、再脱氢、硫解四步循环，每轮砍下 1 个乙酰CoA 并生成 1 FADH₂ 与 1 NADH。软脂酸 16C 经 7 轮生成 8 个乙酰CoA（8×10＝80）、7 FADH₂（7×1.5＝10.5）、7 NADH（7×2.5＝17.5），扣除活化消耗 2，净得 106 ATP。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">β-氧化：四步循环，软脂酸净 106 ATP</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">脱氢-加水-再脱氢-硫解；每轮砍下 1 个乙酰CoA，产 1 FADH₂</text><text x="18.0" y="68.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">+ 1 NADH</text><rect x="18.0" y="82.0" width="364.0" height="313.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="101.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一轮循环四步（线粒体基质）</text><rect x="30.0" y="114.0" width="340.0" height="64.0" rx="8" fill="#ffffff" stroke="#e3eaf2" stroke-width="1.1"/><rect x="30.0" y="114.0" width="3.5" height="64.0" rx="1.8" fill="#b45309"/><circle cx="49.0" cy="131.0" r="9" fill="#b45309"/><text x="49.0" y="135.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">1</text><text x="65.0" y="135.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">① 脂酰CoA 脱氢酶</text><text x="360.0" y="135.0" text-anchor="end" font-size="12" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">+1 FADH₂</text><text x="65.0" y="153.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">生成 1 FADH₂（走复合体Ⅱ → 1.5</text><text x="65.0" y="169.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">ATP），形成 α,β-烯酰CoA</text><line x1="49.0" y1="180.0" x2="49.0" y2="187.0" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="187.0" x2="45.6" y2="180.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="187.0" x2="52.4" y2="180.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><rect x="30.0" y="189.0" width="340.0" height="48.0" rx="8" fill="#ffffff" stroke="#e3eaf2" stroke-width="1.1"/><rect x="30.0" y="189.0" width="3.5" height="48.0" rx="1.8" fill="#4a5a6b"/><circle cx="49.0" cy="206.0" r="9" fill="#4a5a6b"/><text x="49.0" y="210.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">2</text><text x="65.0" y="210.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">② 烯酰CoA 水化酶</text><text x="360.0" y="210.0" text-anchor="end" font-size="12" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">加水</text><text x="65.0" y="228.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">加水，生成 β-羟脂酰CoA</text><line x1="49.0" y1="239.0" x2="49.0" y2="246.0" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="246.0" x2="45.6" y2="239.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="246.0" x2="52.4" y2="239.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><rect x="30.0" y="248.0" width="340.0" height="64.0" rx="8" fill="#ffffff" stroke="#e3eaf2" stroke-width="1.1"/><rect x="30.0" y="248.0" width="3.5" height="64.0" rx="1.8" fill="#b45309"/><circle cx="49.0" cy="265.0" r="9" fill="#b45309"/><text x="49.0" y="269.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">3</text><text x="65.0" y="269.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">③ β-羟脂酰CoA 脱氢酶</text><text x="360.0" y="269.0" text-anchor="end" font-size="12" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">+1 NADH</text><text x="65.0" y="287.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">生成 1 NADH（走复合体Ⅰ → 2.5 ATP），</text><text x="65.0" y="303.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">生成 β-酮脂酰CoA</text><line x1="49.0" y1="314.0" x2="49.0" y2="321.0" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="321.0" x2="45.6" y2="314.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="321.0" x2="52.4" y2="314.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><rect x="30.0" y="323.0" width="340.0" height="64.0" rx="8" fill="#ffffff" stroke="#e3eaf2" stroke-width="1.1"/><rect x="30.0" y="323.0" width="3.5" height="64.0" rx="1.8" fill="#c1440e"/><circle cx="49.0" cy="340.0" r="9" fill="#c1440e"/><text x="49.0" y="344.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">4</text><text x="65.0" y="344.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">④ 硫解酶</text><text x="360.0" y="344.0" text-anchor="end" font-size="12" font-weight="700" fill="#c1440e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">+1 乙酰CoA</text><text x="65.0" y="362.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">加 CoA 裂解，产出 1 乙酰CoA + 缩</text><text x="65.0" y="378.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">短 2C 的脂酰CoA</text><rect x="18.0" y="407.0" width="364.0" height="220.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="426.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">软脂酸 16C 的能量账</text><rect x="30.0" y="437.0" width="340.0" height="24.0" rx="5" fill="#f8fbfd"/><text x="38.0" y="453.0" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">项目</text><text x="140.0" y="453.0" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">数量</text><text x="242.0" y="453.0" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">折合 ATP</text><line x1="30.0" y1="486.0" x2="370.0" y2="486.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="38.0" y="478.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">β-氧化轮数</text><text x="140.0" y="478.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">7 轮</text><text x="242.0" y="478.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">—</text><line x1="30.0" y1="512.0" x2="370.0" y2="512.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="38.0" y="504.0" font-size="12" font-weight="400" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">乙酰CoA</text><text x="140.0" y="504.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">8 个</text><text x="242.0" y="504.0" font-size="12.5" font-weight="400" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">8 × 10 = 80</text><line x1="30.0" y1="538.0" x2="370.0" y2="538.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="38.0" y="530.0" font-size="12" font-weight="400" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">FADH₂</text><text x="140.0" y="530.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">7 个</text><text x="242.0" y="530.0" font-size="12.5" font-weight="400" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">7 × 1.5 = 10.5</text><line x1="30.0" y1="564.0" x2="370.0" y2="564.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="38.0" y="556.0" font-size="12" font-weight="400" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">NADH</text><text x="140.0" y="556.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">7 个</text><text x="242.0" y="556.0" font-size="12.5" font-weight="400" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">7 × 2.5 = 17.5</text><line x1="30.0" y1="590.0" x2="370.0" y2="590.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="38.0" y="582.0" font-size="12" font-weight="400" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">活化消耗</text><text x="140.0" y="582.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">ATP → AMP + PPi</text><text x="242.0" y="582.0" font-size="12.5" font-weight="400" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">−2</text><line x1="30.0" y1="616.0" x2="370.0" y2="616.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="38.0" y="608.0" font-size="12" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">净生成</text><text x="140.0" y="608.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">16C 完全氧化</text><text x="242.0" y="608.0" font-size="12.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">106</text><rect x="18.0" y="639.0" width="364.0" height="89.0" rx="8" fill="#e2f5f2"/><rect x="18.0" y="639.0" width="3.5" height="89.0" rx="1.8" fill="#0f766e"/><text x="32.0" y="659.0" font-size="11.5" font-weight="700" fill="#0f766e" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="676.0" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">净生成 106 ATP：先扣活化消耗的 2 个高能键。β-氧</text><text x="32.0" y="695.0" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">化在线粒体基质，脂肪酸合成在胞质——分区是调控</text><text x="32.0" y="714.0" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">的前提。</text></svg>