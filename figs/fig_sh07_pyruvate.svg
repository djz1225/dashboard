<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 609" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="丙酮酸的三条去路与 Cori 循环"><title>丙酮酸的三条去路与 Cori 循环</title><desc>丙酮酸有氧时经丙酮酸脱氢酶复合体（5 个辅酶）生成乙酰CoA 进入三羧酸循环，无氧时在肌生成乳酸、在酵母生成乙醇，肝与肾则经羧化酶与 PEPCK 异生为葡萄糖；乳酸经 Cori 循环回肝再生葡萄糖。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">丙酮酸的三条去路与 Cori 循环</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">有氧进线粒体、无氧留胞质成乳酸；乳酸循环让肌与肝接力</text><rect x="18.0" y="65.0" width="177.0" height="136.0" rx="9" fill="#fef3c7" stroke="#b45309" stroke-width="1.1"/><text x="29.0" y="86.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">有氧 → 乙酰CoA</text><text x="29.0" y="105.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">丙酮酸脱氢酶复合体</text><text x="29.0" y="125.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">5 个辅酶：TPP、硫辛酸、</text><text x="29.0" y="141.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">CoA、FAD、NAD⁺</text><text x="29.0" y="161.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">不可逆 → 乙酰CoA 不</text><text x="29.0" y="177.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">能净生糖</text><rect x="205.0" y="65.0" width="177.0" height="136.0" rx="9" fill="#fdeceb" stroke="#c0392b" stroke-width="1.1"/><text x="216.0" y="86.0" font-size="12.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">无氧（肌）→ 乳酸</text><text x="216.0" y="105.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">乳酸脱氢酶</text><text x="216.0" y="125.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">把 NADH 的氢交给丙酮酸，</text><text x="216.0" y="141.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">再生 NAD⁺</text><text x="216.0" y="161.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">使糖酵解在缺氧时得以继续</text><rect x="18.0" y="211.0" width="177.0" height="136.0" rx="9" fill="#fdeceb" stroke="#c0392b" stroke-width="1.1"/><text x="29.0" y="232.0" font-size="12.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">无氧（酵母）→ 乙醇</text><text x="29.0" y="251.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">丙酮酸脱羧酶（TPP）→</text><text x="29.0" y="267.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"> 乙醛</text><text x="29.0" y="287.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">乙醇脱氢酶 → 乙醇</text><text x="29.0" y="307.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">发酵工业的原理</text><rect x="205.0" y="211.0" width="177.0" height="136.0" rx="9" fill="#e6f6ec" stroke="#2f8f57" stroke-width="1.1"/><text x="216.0" y="232.0" font-size="12.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肝、肾 → 葡萄糖</text><text x="216.0" y="251.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">丙酮酸羧化酶 + PEPCK</text><text x="216.0" y="271.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">绕过糖酵解的三个不可逆反应</text><text x="216.0" y="291.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">净耗 6 个高能键</text><rect x="18.0" y="359.0" width="364.0" height="148.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="378.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Cori 循环：为什么必须存在</text><rect x="34.0" y="395.0" width="78.0" height="34.0" rx="8" fill="#fdeceb" stroke="#c0392b" stroke-width="1.1"/><text x="73.0" y="416.0" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">骨骼肌</text><rect x="284.0" y="395.0" width="78.0" height="34.0" rx="8" fill="#e6f6ec" stroke="#2f8f57" stroke-width="1.1"/><text x="323.0" y="416.0" text-anchor="middle" font-size="12" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肝</text><line x1="118.0" y1="409.0" x2="278.0" y2="409.0" stroke="#c0392b" stroke-width="1.6" stroke-linecap="round"/><line x1="278.0" y1="409.0" x2="272.7" y2="411.9" stroke="#c0392b" stroke-width="1.6" stroke-linecap="round"/><line x1="278.0" y1="409.0" x2="272.7" y2="406.1" stroke="#c0392b" stroke-width="1.6" stroke-linecap="round"/><text x="198.0" y="403.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">乳酸（经血）</text><line x1="278.0" y1="435.0" x2="118.0" y2="435.0" stroke="#2f8f57" stroke-width="1.6" stroke-linecap="round"/><line x1="118.0" y1="435.0" x2="123.3" y2="432.1" stroke="#2f8f57" stroke-width="1.6" stroke-linecap="round"/><line x1="118.0" y1="435.0" x2="123.3" y2="437.9" stroke="#2f8f57" stroke-width="1.6" stroke-linecap="round"/><text x="198.0" y="451.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">葡萄糖（经血）</text><text x="34.0" y="465.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肌肉缺葡糖-6-磷酸酶，肌糖原分解产生的乳酸不能自己变回糖，</text><text x="34.0" y="481.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">只能经血送肝；肝耗 6 ATP 做糖异生，葡萄糖再回肌利用。</text><rect x="18.0" y="519.0" width="364.0" height="70.0" rx="8" fill="#eef2f7"/><rect x="18.0" y="519.0" width="3.5" height="70.0" rx="1.8" fill="#4a5a6b"/><text x="32.0" y="539.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="556.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">丙酮酸脱氢酶复合体不可逆，这正是「乙酰CoA 不能净</text><text x="32.0" y="575.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">合成糖」的根源；缺氧时的乳酸是可被肝再利用的燃料。</text></svg>