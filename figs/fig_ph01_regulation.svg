<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 589" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="人体功能的三种调节方式"><title>人体功能的三种调节方式</title><desc>神经调节经反射弧、快速精确局限并居主导；体液调节经血液、缓慢广泛持久；自身调节不依赖神经和激素，作用范围小。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">人体功能的三种调节方式</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">看信号走哪条路：反射弧 / 血液 / 局部自身</text><rect x="18.0" y="65.0" width="364.0" height="197.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="83.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">信号走哪条路</text><text x="30.0" y="104.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">神经调节（主导）</text><rect x="30.0" y="110.0" width="41.8" height="26.0" rx="6" fill="#e2f5f2" stroke="#0f766e" stroke-width="1"/><text x="50.9" y="127.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">刺激</text><line x1="73.8" y1="123.0" x2="82.8" y2="123.0" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="82.8" y1="123.0" x2="78.4" y2="125.4" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="82.8" y1="123.0" x2="78.4" y2="120.6" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><rect x="84.8" y="110.0" width="41.8" height="26.0" rx="6" fill="#e2f5f2" stroke="#0f766e" stroke-width="1"/><text x="105.8" y="127.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f766e" font-f