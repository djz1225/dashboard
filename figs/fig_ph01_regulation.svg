<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 510" width="100%" style="max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px" role="img"><text x="165.0" y="22.6" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">机体生理功能的三种调节方式</text><text x="165.0" y="43.0" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">看「信号走哪条路」和「快慢、范围、精确度」</text><rect x="15.0" y="60.0" width="300.0" height="96.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.6"/><text x="25.0" y="82.0" text-anchor="start" font-size="15" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">神经调节</text><text x="305.0" y="82.0" text-anchor="end" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">反射弧</text><text x="25.0" y="102.0" text-anchor="start" font-size="13.5" font-weight="600" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">快、短、精确、局限</text><text x="25.0" y="122.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">神经冲动沿反射弧传导</text><text x="25.0" y="138.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">如：减压反射、膝跳反射</text><rect x="15.0" y="164.0" width="300.0" height="96.0" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/><text x="25.0" y="186.0" text-anchor="start" font-size="15" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">体液调节</text><text x="305.0" y="186.0" text-anchor="end" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">血液运输激素</text><text x="25.0" y="206.0" text-anchor="start" font-size="13.5" font-weight="600" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">慢、持久、广泛</text><text x="25.0" y="226.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">激素经血液到达靶细胞</text><text x="25.0" y="242.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">如：胰岛素降血糖、ADH 保水</text><rect x="15.0" y="268.0" width="300.0" height="96.0" rx="7" fill="#f8fafc" stroke="#64748b" stroke-width="1.6"/><text x="25.0" y="290.0" text-anchor="start" font-size="15" font-weight="700" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">自身调节</text><text x="305.0" y="290.0" text-anchor="end" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">局部自身</text><text x="25.0" y="310.0" text-anchor="start" font-size="13.5" font-weight="600" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">范围小、灵敏度低</text><text x="25.0" y="330.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">不依赖神经与体液</text><text x="25.0" y="346.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">如：肾血流自身调节、心搏出量</text><rect x="15.0" y="372.0" width="300.0" height="76.0" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/><text x="25.0" y="388.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">神经调节是主导：最快、最精确；体液调节负</text><text x="25.0" y="404.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">责持久广泛的部分</text><text x="25.0" y="420.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">自身调节不需要神经或激素参与——这是与前两</text><text x="25.0" y="436.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">者的根本区别</text><rect x="11.0" y="451.0" width="308.0" height="51.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="165.0" y="466.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">看信号走哪条路：反射弧＝神经，血液＝体液，</text><text x="165.0" y="481.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">局部自身＝自身调节</text></svg>