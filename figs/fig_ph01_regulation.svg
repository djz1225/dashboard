ddle" font-size="10.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">局部效应</text><rect x="18.0" y="268.0" width="3.0" height="14.0" rx="1.5" fill="#0f766e"/><text x="28.0" y="278.0" font-size="13.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">三者怎么区分</text><rect x="18.0" y="290.0" width="364.0" height="197.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="308.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">比较</text><rect x="30.0" y="318.0" width="3.0" height="15.0" rx="1.5" fill="#0f766e"/><text x="39.0" y="331.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">神经调节</text><text x="347.0" y="331.0" text-anchor="end" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">快·准·短</text><text x="39.0" y="349.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">经反射弧，作用迅速、精确、局限；是机体功</text><text x="39.0" y="365.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">能的主导调节</text><rect x="30.0" y="375.0" width="3.0" height="15.0" rx="1.5" fill="#7b4bb7"/><text x="39.0" y="388.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">体液调节</text><text x="347.0" y="388.0" text-anchor="end" font-size="12" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">慢·广·久</text><text x="39.0" y="406.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">激素经血液到达靶细胞，起效慢、作用广</text><text x="39.0" y="422.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">泛而持久</text><rect x="30.0" y="432.0" width="3.0" height="15.0" rx="1.5" fill="#4a5a6b"/><text x="39.0" y="445.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">自身调节</text><text x="347.0" y="445.0" text-anchor="end" font-size="12" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">局部·弱</text><text x="39.0" y="463.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">不依赖神经与激素，组织器官对局部刺激</text><text x="39.0" y="479.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">的自身反应</text><rect x="18.0" y="499.0" width="364.0" height="70.0" rx="8" fill="#eef2f7"/><rect x="18.0" y="499.0" width="3.5" height="70.0" rx="1.8" fill="#4a5a6b"/><text x="32.0" y="519.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="536.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">反射弧＝神经调节（最快最准）；血液运输＝体液调节（</text><text x="32.0" y="555.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">慢而广）；不需要神经和激素＝自身调节。</text></svg>