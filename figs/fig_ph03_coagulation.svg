<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 530" width="100%" style="max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px" role="img"><text x="165.0" y="22.6" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">凝血级联：两条启动路径，一个终点</text><text x="165.0" y="43.0" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">终点都是 凝血酶原 → 凝血酶 → 纤维蛋白</text><rect x="15.0" y="60.0" width="146.0" height="64.0" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/><text x="88.0" y="79.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">内源性（血管内）</text><text x="88.0" y="96.0" text-anchor="middle" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">Ⅻ→Ⅺ→Ⅸ→Ⅷ→Ⅹ
接触激活，</text><text x="88.0" y="110.0" text-anchor="middle" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">慢（分钟）</text><rect x="169.0" y="60.0" width="146.0" height="64.0" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.4"/><text x="242.0" y="79.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">外源性（组织因子）</text><text x="242.0" y="96.0" text-anchor="middle" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">Ⅲ+Ⅶ→Ⅹ
组织损伤启动，</text><text x="242.0" y="110.0" text-anchor="middle" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">快（秒）</text><rect x="15.0" y="134.0" width="300.0" height="38.0" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/><text x="27.0" y="154.0" text-anchor="start" font-size="14" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">共同途径</text><text x="27.0" y="172.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">Ⅹ → Ⅹa（+Ⅴ、Ca²⁺、PF3 形成凝血酶原酶）</text><line x1="165.0" y1="173.0" x2="165.0" y2="174.5" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/><polygon points="165.0,179.0 163.0,174.4 167.0,174.4" fill="#64748b"/><rect x="15.0" y="180.0" width="300.0" height="38.0" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.4"/><text x="27.0" y="200.0" text-anchor="start" font-size="14" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">凝血酶原 → 凝血酶</text><text x="27.0" y="218.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">Ⅱ → Ⅱa（这一步是级联的放大点）</text><line x1="165.0" y1="219.0" x2="165.0" y2="220.5" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/><polygon points="165.0,225.0 163.0,220.4 167.0,220.4" fill="#64748b"/><rect x="15.0" y="226.0" width="300.0" height="38.0" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.4"/><text x="27.0" y="246.0" text-anchor="start" font-size="14" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">纤维蛋白原 → 纤维蛋白</text><text x="27.0" y="264.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">Ⅰ → Ⅰa，再经ⅩⅢa 交联成稳定血块</text><rect x="15.0" y="266.0" width="300.0" height="150.0" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="25.0" y="285.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">必记要点</text><text x="25.0" y="303.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 内源与外源的共同起点是Ⅹ 的激活</text><text x="25.0" y="319.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· Ⅷ 缺 → 血友病 A；Ⅸ 缺 → 血友病 B（</text><text x="25.0" y="335.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">都是内源途径）</text><text x="25.0" y="351.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· Ca²⁺（Ⅳ因子）参与多个步骤，故枸橼酸抗</text><text x="25.0" y="367.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">凝靠螯合钙</text><text x="25.0" y="383.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 维生素 K 依赖因子：Ⅱ、Ⅶ、Ⅸ、Ⅹ（</text><text x="25.0" y="399.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">记住「2 7 9 10」）</text><rect x="15.0" y="424.0" width="300.0" height="44.0" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/><text x="25.0" y="440.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">抗凝药对应关系：肝素→抗凝血酶Ⅲ；华法林→拮</text><text x="25.0" y="456.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">抗维生素K（影响2/7/9/10）</text><rect x="11.0" y="471.0" width="308.0" height="51.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="165.0" y="486.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">外源快内源慢，都汇到Ⅹ；维K依赖因子是 2、7、</text><text x="165.0" y="501.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">9、10</text></svg>