<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 751" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="凝血级联"><title>凝血级联</title><desc>内源（Ⅻ→Ⅺ→Ⅸ→Ⅷ→Ⅹ，慢）与外源（Ⅲ+Ⅶ→Ⅹ，快）两条途径汇合于Ⅹ 的激活，共同生成凝血酶并形成纤维蛋白；维 K 依赖因子为 2、7、9、10。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">凝血级联</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">两条启动路径，一个共同终点</text><rect x="18.0" y="65.0" width="177.0" height="120.0" rx="9" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1.1"/><text x="29.0" y="86.0" font-size="12.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">内源性（血管内）</text><text x="29.0" y="105.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Ⅻ→Ⅺ→Ⅸ→Ⅷ→Ⅹ</text><text x="29.0" y="125.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">接触激活，慢（分钟级）</text><text x="29.0" y="145.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Ⅷ 缺＝血友病 A，Ⅸ 缺＝</text><text x="29.0" y="161.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">血友病 B</text><rect x="205.0" y="65.0" width="177.0" height="120.0" rx="9" fill="#fdeceb" stroke="#c0392b" stroke-width="1.1"/><text x="216.0" y="86.0" font-size="12.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">外源性（组织因子）</text><text x="216.0" y="105.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Ⅲ + Ⅶ→Ⅹ</text><text x="216.0" y="125.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">组织损伤启动，快（秒级）</text><text x="216.0" y="145.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">临床 PT 主要反映外源途径</text><rect x="18.0" y="189.0" width="3.0" height="14.0" rx="1.5" fill="#0f766e"/><text x="28.0" y="199.0" font-size="13.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">共同途径：三步放大</text><rect x="18.0" y="211.0" width="364.0" height="46.0" rx="8" fill="#f2ecfb" stroke="#7b4bb7" stroke-width="1.1"/><rect x="18.0" y="211.0" width="3.5" height="46.0" rx="1.8" fill="#7b4bb7"/><circle cx="38" cy="229" r="9.5" fill="#7b4bb7"/><text x="38.0" y="233.0" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">1</text><text x="56.0" y="233.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Ⅹ → Ⅹa</text><text x="370.0" y="233.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">汇合点</text><text x="56.0" y="251.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Ⅹa + Ⅴ + Ca²⁺ + PF3 组成凝血酶原酶复合物</text><line x1="38.0" y1="259.0" x2="38.0" y2="275.0" stroke="#4a5a6b" stroke-width="2" stroke-linecap="round"/><line x1="38.0" y1="275.0" x2="34.2" y2="268.0" stroke="#4a5a6b" stroke-width="2" stroke-linecap="round"/><line x1="38.0" y1="275.0" x2="41.8" y2="268.0" stroke="#4a5a6b" stroke-width="2" stroke-linecap="round"/><rect x="18.0" y="277.0" width="364.0" height="46.0" rx="8" fill="#fdeceb" stroke="#c0392b" stroke-width="1.1"/><rect x="18.0" y="277.0" width="3.5" height="46.0" rx="1.8" fill="#c0392b"/><circle cx="38" cy="295" r="9.5" fill="#c0392b"/><text x="38.0" y="299.0" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">2</text><text x="56.0" y="299.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">凝血酶原 → 凝血酶</text><text x="370.0" y="299.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">放大</text><text x="56.0" y="317.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Ⅱ → Ⅱa，这一步是级联的最大放大点</text><line x1="38.0" y1="325.0" x2="38.0" y2="341.0" stroke="#4a5a6b" stroke-width="2" stroke-linecap="round"/><line x1="38.0" y1="341.0" x2="34.2" y2="334.0" stroke="#4a5a6b" stroke-width="2" stroke-linecap="round"/><line x1="38.0" y1="341.0" x2="41.8" y2="334.0" stroke="#4a5a6b" stroke-width="2" stroke-linecap="round"/><rect x="18.0" y="343.0" width="364.0" height="46.0" rx="8" fill="#e6f6ec" stroke="#2f8f57" stroke-width="1.1"/><rect x="18.0" y="343.0" width="3.5" height="46.0" rx="1.8" fill="#2f8f57"/><circle cx="38" cy="361" r="9.5" fill="#2f8f57"/><text x="38.0" y="365.0" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">3</text><text x="56.0" y="365.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">纤维蛋白原 → 纤维蛋白</text><text x="370.0" y="365.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">成块</text><text x="56.0" y="383.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Ⅰ → Ⅰa，再经ⅩⅢa 交联成稳定血块</text><rect x="18.0" y="389.0" width="3.0" height="14.0" rx="1.5" fill="#0f766e"/><text x="28.0" y="399.0" font-size="13.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">必记四条</text><rect x="18.0" y="411.0" width="364.0" height="238.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="429.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">考点</text><rect x="30.0" y="439.0" width="3.0" height="15.0" rx="1.5" fill="#7b4bb7"/><text x="39.0" y="452.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">汇合点</text><text x="347.0" y="452.0" text-anchor="end" font-size="12" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">都是Ⅹ</text><text x="39.0" y="470.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">内源与外源两条路的共同起点是Ⅹ 因子</text><text x="39.0" y="486.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">的激活</text><rect x="30.0" y="496.0" width="3.0" height="15.0" rx="1.5" fill="#b45309"/><text x="39.0" y="509.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">维生素 K 依赖</text><text x="347.0" y="509.0" text-anchor="end" font-size="12" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">2·7·9·10</text><text x="39.0" y="527.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Ⅱ、Ⅶ、Ⅸ、Ⅹ；华法林拮抗维生素 K 即影</text><text x="39.0" y="543.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">响这四个</text><rect x="30.0" y="553.0" width="3.0" height="15.0" rx="1.5" fill="#1f6fb2"/><text x="39.0" y="566.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Ca²⁺ 参与</text><text x="347.0" y="566.0" text-anchor="end" font-size="12" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Ⅳ因子</text><text x="39.0" y="584.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">枸橼酸靠螯合 Ca²⁺ 抗凝；肝素增强抗</text><text x="39.0" y="600.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">凝血酶Ⅲ</text><rect x="30.0" y="610.0" width="3.0" height="15.0" rx="1.5" fill="#c0392b"/><text x="39.0" y="623.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">血友病</text><text x="347.0" y="623.0" text-anchor="end" font-size="12" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">内源途径</text><text x="39.0" y="641.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Ⅷ 缺＝A 型，Ⅸ 缺＝B 型</text><rect x="18.0" y="661.0" width="364.0" height="70.0" rx="8" fill="#eef2f7"/><rect x="18.0" y="661.0" width="3.5" height="70.0" rx="1.8" fill="#4a5a6b"/><text x="32.0" y="681.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="698.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">外源快、内源慢，都汇到Ⅹ；维 K 依赖因子是 2、7、</text><text x="32.0" y="717.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">9、10。</text></svg>