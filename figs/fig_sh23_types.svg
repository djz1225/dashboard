<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 670" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="DNA 损伤六大类型与各自的修复通路"><title>DNA 损伤六大类型与各自的修复通路</title><desc>DNA 损伤分六大类：碱基错配（→MMR）、碱基脱氨与修饰（→BER，O⁶-甲基鸟嘌呤可由 MGMT 直接修复）、氧化损伤如 8-oxoG（→BER）、大块螺旋扭曲如 UV 嘧啶二聚体与化学加合物（→NER）、单链断裂（→BER/SSBR，需 PARP）、双链断裂（→HR 或 NHEJ）。修复通路缺陷对应不同遗传性肿瘤易感综合征。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">DNA 损伤六大类型与各自的修复通路</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">小损伤找 BER、大扭曲找 NER、复制错配找 MMR、双链断裂找</text><text x="18.0" y="68.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">HR / NHEJ</text><rect x="18.0" y="82.0" width="364.0" height="26.0" rx="6" fill="#f8fbfd"/><text x="26.0" y="99.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">损伤类型</text><text x="120.6" y="99.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">典型来源与结构</text><text x="280.8" y="99.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">首选修复</text><line x1="18.0" y1="134.0" x2="382.0" y2="134.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="126.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">① 碱基错配</text><text x="120.6" y="126.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">复制时配错，母链仍能配对</text><text x="280.8" y="126.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">MMR</text><line x1="18.0" y1="176.0" x2="382.0" y2="176.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="152.0" font-size="12.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">② 碱基脱氨</text><text x="26.0" y="168.0" font-size="12.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">/修饰</text><text x="120.6" y="152.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">C→U、A→次黄嘌呤；烷基</text><text x="120.6" y="168.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">化 O⁶-甲基鸟嘌呤</text><text x="280.8" y="152.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">BER（O⁶ 可</text><text x="280.8" y="168.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">MGMT 直接修复）</text><line x1="18.0" y1="218.0" x2="382.0" y2="218.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="194.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">③ 氧化损伤</text><text x="120.6" y="194.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">8-oxoG 等氧化碱基、</text><text x="120.6" y="210.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">无嘌呤位点</text><text x="280.8" y="194.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">BER</text><line x1="18.0" y1="260.0" x2="382.0" y2="260.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="236.0" font-size="12.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">④ 螺旋扭曲</text><text x="120.6" y="236.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">UV 嘧啶二聚体、化学加合</text><text x="120.6" y="252.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">物（大块）</text><text x="280.8" y="236.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">NER</text><line x1="18.0" y1="302.0" x2="382.0" y2="302.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="278.0" font-size="12.5" font-weight="700" fill="#c1440e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">⑤ 单链断裂</text><text x="120.6" y="278.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">ROS、拓扑异构酶失败、</text><text x="120.6" y="294.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">BER 中间产物</text><text x="280.8" y="278.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">BER / PARP 参</text><text x="280.8" y="294.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">与的 SSBR</text><line x1="18.0" y1="344.0" x2="382.0" y2="344.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="320.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">⑥ 双链断裂</text><text x="120.6" y="320.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">电离辐射、复制叉崩塌</text><text x="280.8" y="320.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">HR（S/G2）或</text><text x="280.8" y="336.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">NHEJ（全周期）</text><rect x="18.0" y="352.0" width="364.0" height="197.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="371.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">三条最容易混的边界</text><rect x="30.0" y="382.0" width="3.0" height="15.0" rx="1.5" fill="#0f766e"/><text x="39.0" y="395.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">BER 与 NER</text><text x="362.0" y="395.0" text-anchor="end" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">名字即分工</text><text x="39.0" y="413.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">BER 切「碱基」，NER 切一段「核苷酸」—</text><text x="39.0" y="429.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">—损伤大块才动 NER</text><rect x="30.0" y="438.0" width="3.0" height="15.0" rx="1.5" fill="#0f766e"/><text x="39.0" y="451.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">MMR</text><text x="362.0" y="451.0" text-anchor="end" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">修的是错配</text><text x="39.0" y="469.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">针对复制错误与插入缺失环，不是「损伤」</text><text x="39.0" y="485.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">本身</text><rect x="30.0" y="494.0" width="3.0" height="15.0" rx="1.5" fill="#b45309"/><text x="39.0" y="507.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">HR 与 NHEJ</text><text x="362.0" y="507.0" text-anchor="end" font-size="12" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">看有没有模板</text><text x="39.0" y="525.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">有姐妹染色单体才用 HR，G1 只能 NHEJ</text><text x="39.0" y="541.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">（易错）</text><rect x="18.0" y="561.0" width="364.0" height="89.0" rx="8" fill="#e2f5f2"/><rect x="18.0" y="561.0" width="3.5" height="89.0" rx="1.8" fill="#0f766e"/><text x="32.0" y="581.0" font-size="11.5" font-weight="700" fill="#0f766e" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="598.0" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">同一个损伤可以有备用通路；修复通路缺陷分别对应不同</text><text x="32.0" y="617.0" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">遗传病（NER→着色性干皮病、MMR→Lynch、HR→BRCA</text><text x="32.0" y="636.0" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">相关肿瘤）。</text></svg>