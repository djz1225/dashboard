<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 485.5" width="100%" style="max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px" role="img"><text x="165.0" y="22.6" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">纤维蛋白溶解：把血块清掉</text><text x="165.0" y="42.6" text-anchor="middle" font-size="13.5" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">纤溶酶原 →（t-PA/u-PA）→ 纤溶酶 → 降解纤维蛋白</text><rect x="15.0" y="59.5" width="300.0" height="38.0" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/><text x="27.0" y="79.5" text-anchor="start" font-size="14" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">纤溶酶原</text><text x="27.0" y="97.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">由肝合成，存在于血浆与血块中</text><line x1="165.0" y1="98.5" x2="165.0" y2="100.0" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/><polygon points="165.0,104.5 163.0,99.9 167.0,99.9" fill="#64748b"/><rect x="15.0" y="105.5" width="300.0" height="38.0" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/><text x="27.0" y="125.5" text-anchor="start" font-size="14" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">激活物</text><text x="27.0" y="143.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">t-PA（血管内皮）、u-PA；Ⅻa 也可激活</text><line x1="165.0" y1="144.5" x2="165.0" y2="146.0" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/><polygon points="165.0,150.5 163.0,145.9 167.0,145.9" fill="#64748b"/><rect x="15.0" y="151.5" width="300.0" height="38.0" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.4"/><text x="27.0" y="171.5" text-anchor="start" font-size="14" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">纤溶酶</text><text x="27.0" y="189.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">丝氨酸蛋白酶，降解纤维蛋白与纤维蛋白原</text><line x1="165.0" y1="190.5" x2="165.0" y2="192.0" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/><polygon points="165.0,196.5 163.0,191.9 167.0,191.9" fill="#64748b"/><rect x="15.0" y="197.5" width="300.0" height="38.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/><text x="27.0" y="217.5" text-anchor="start" font-size="14" font-weight="700" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">降解产物</text><text x="27.0" y="235.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">FDP / D-二聚体 → 临床判断血栓的标志</text><rect x="15.0" y="237.5" width="300.0" height="102.0" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="25.0" y="256.5" text-anchor="start" font-size="13.5" font-weight="700" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">抑制物（为什么要抑）</text><text x="25.0" y="274.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· PAI-1：抑制 t-PA，防止过度纤溶</text><text x="25.0" y="290.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· α₂-抗纤溶酶：抑制纤溶酶</text><text x="25.0" y="306.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 临床用药：氨甲环酸/氨甲苯酸＝抗纤溶（</text><text x="25.0" y="322.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">止血用）</text><rect x="15.0" y="347.5" width="300.0" height="76.0" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/><text x="25.0" y="363.5" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">D-二聚体升高提示「有纤维蛋白形成并降解」—</text><text x="25.0" y="379.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">—不是血栓的特异指标</text><text x="25.0" y="395.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">抗纤溶药用于止血，溶栓药（rt-PA）用于开</text><text x="25.0" y="411.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">通血管，方向相反别混</text><rect x="11.0" y="426.5" width="308.0" height="51.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="165.0" y="441.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">纤溶＝溶栓通路；D-二聚体是纤溶产物，</text><text x="165.0" y="457.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">升高提示近期有血栓形成与溶解</text></svg>