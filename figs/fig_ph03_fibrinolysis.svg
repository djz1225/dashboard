<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 598" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="纤维蛋白溶解"><title>纤维蛋白溶解</title><desc>纤溶酶原经 t-PA/u-PA 激活为纤溶酶，降解纤维蛋白生成 FDP 与 D-二聚体；PAI-1 与 α₂-抗纤溶酶限制过度纤溶。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">纤维蛋白溶解</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">把已经形成的血块清掉，方向与凝血相反</text><rect x="18.0" y="65.0" width="364.0" height="46.0" rx="8" fill="#eef2f7" stroke="#4a5a6b" stroke-width="1.1"/><rect x="18.0" y="65.0" width="3.5" height="46.0" rx="1.8" fill="#4a5a6b"/><circle cx="38" cy="83" r="9.5" fill="#4a5a6b"/><text x="38.0" y="87.0" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">1</text><text x="56.0" y="87.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">纤溶酶原</text><text x="370.0" y="87.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">底物</text><text x="56.0" y="105.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">由肝合成，存在于血浆与血块中，本身无活性</text><line x1="38.0" y1="113.0" x2="38.0" y2="129.0" stroke="#4a5a6b" stroke-width="2" stroke-linecap="round"/><line x1="38.0" y1="129.0" x2="34.2" y2="122.0" stroke="#4a5a6b" stroke-width="2" stroke-linecap="round"/><line x1="38.0" y1="129.0" x2="41.8" y2="122.0" stroke="#4a5a6b" stroke-width="2" stroke-linecap="round"/><rect x="18.0" y="131.0" width="364.0" height="46.0" rx="8" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1.1"/><rect x="18.0" y="131.0" width="3.5" height="46.0" rx="1.8" fill="#1f6fb2"/><circle cx="38" cy="149" r="9.5" fill="#1f6fb2"/><text x="38.0" y="153.0" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">2</text><text x="56.0" y="153.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">激活物</text><text x="370.0" y="153.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">启动</text><text x="56.0" y="171.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">t-PA（血管内皮）、u-PA；Ⅻa 也可激活</text><line x1="38.0" y1="179.0" x2="38.0" y2="195.0" stroke="#4a5a6b" stroke-width="2" stroke-linecap="round"/><line x1="38.0" y1="195.0" x2="34.2" y2="188.0" stroke="#4a5a6b" stroke-width="2" stroke-linecap="round"/><line x1="38.0" y1="195.0" x2="41.8" y2="188.0" stroke="#4a5a6b" stroke-width="2" stroke-linecap="round"/><rect x="18.0" y="197.0" width="364.0" height="46.0" rx="8" fill="#f2ecfb" stroke="#7b4bb7" stroke-width="1.1"/><rect x="18.0" y="197.0" width="3.5" height="46.0" rx="1.8" fill="#7b4bb7"/><circle cx="38" cy="215" r="9.5" fill="#7b4bb7"/><text x="38.0" y="219.0" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">3</text><text x="56.0" y="219.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">纤溶酶</text><text x="370.0" y="219.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">主角</text><text x="56.0" y="237.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">丝氨酸蛋白酶，降解纤维蛋白与纤维蛋白原</text><line x1="38.0" y1="245.0" x2="38.0" y2="261.0" stroke="#4a5a6b" stroke-width="2" stroke-linecap="round"/><line x1="38.0" y1="261.0" x2="34.2" y2="254.0" stroke="#4a5a6b" stroke-width="2" stroke-linecap="round"/><line x1="38.0" y1="261.0" x2="41.8" y2="254.0" stroke="#4a5a6b" stroke-width="2" stroke-linecap="round"/><rect x="18.0" y="263.0" width="364.0" height="46.0" rx="8" fill="#e6f6ec" stroke="#2f8f57" stroke-width="1.1"/><rect x="18.0" y="263.0" width="3.5" height="46.0" rx="1.8" fill="#2f8f57"/><circle cx="38" cy="281" r="9.5" fill="#2f8f57"/><text x="38.0" y="285.0" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">4</text><text x="56.0" y="285.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">降解产物</text><text x="370.0" y="285.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">标志</text><text x="56.0" y="303.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">FDP / D-二聚体，临床上判断血栓形成的标志</text><rect x="18.0" y="309.0" width="3.0" height="14.0" rx="1.5" fill="#0f766e"/><text x="28.0" y="319.0" font-size="13.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">三个抑制点（防止纤溶过度）</text><rect x="18.0" y="331.0" width="364.0" height="165.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="349.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">抑制与用药</text><rect x="30.0" y="359.0" width="3.0" height="15.0" rx="1.5" fill="#1f6fb2"/><text x="39.0" y="372.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">PAI-1</text><text x="347.0" y="372.0" text-anchor="end" font-size="12" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">抑制 t-PA</text><text x="39.0" y="390.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">内皮细胞产生，抑制激活物，减少纤溶酶生成</text><rect x="30.0" y="400.0" width="3.0" height="15.0" rx="1.5" fill="#7b4bb7"/><text x="39.0" y="413.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">α₂-抗纤溶酶</text><text x="347.0" y="413.0" text-anchor="end" font-size="12" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">抑制纤溶酶</text><text x="39.0" y="431.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">血浆中主要的纤溶酶抑制物</text><rect x="30.0" y="441.0" width="3.0" height="15.0" rx="1.5" fill="#b45309"/><text x="39.0" y="454.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">氨甲环酸/氨甲苯酸</text><text x="347.0" y="454.0" text-anchor="end" font-size="12" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">抗纤溶药</text><text x="39.0" y="472.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">用于止血；与溶栓药（rt-PA）方向相反，</text><text x="39.0" y="488.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">别混</text><rect x="18.0" y="508.0" width="364.0" height="70.0" rx="8" fill="#eef2f7"/><rect x="18.0" y="508.0" width="3.5" height="70.0" rx="1.8" fill="#4a5a6b"/><text x="32.0" y="528.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="545.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">纤溶＝溶栓通路；D-二聚体升高提示近期有纤维蛋白形</text><text x="32.0" y="564.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">成并被降解，并非血栓的特异指标。</text></svg>