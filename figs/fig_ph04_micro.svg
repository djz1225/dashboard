<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 725" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="微循环的三条通路"><title>微循环的三条通路</title><desc>微循环有迂回通路（物质交换主战场，交替开放）、直捷通路（快速回流）和动-静脉短路（体温调节）三条通路；前括约肌受局部代谢物调节，后括约肌受交感支配。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">微循环的三条通路：一片区域，三种分工</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">营养靠迂回通路、回流靠直捷通路、调温靠动-静脉短路</text><rect x="18.0" y="65.0" width="364.0" height="272.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="83.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">三条通路的走向与功能</text><text x="30.0" y="103.0" font-size="12.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">① 迂回通路（营养通路）</text><rect x="30.0" y="111.0" width="53.6" height="24.0" rx="6" fill="#e6f6ec" stroke="#2f8f57" stroke-width="1"/><text x="56.8" y="128.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">微动脉</text><line x1="85.1" y1="123.0" x2="94.1" y2="123.0" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="94.1" y1="123.0" x2="90.2" y2="125.2" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="94.1" y1="123.0" x2="90.2" y2="120.8" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><rect x="95.6" y="111.0" width="53.6" height="24.0" rx="6" fill="#e6f6ec" stroke="#2f8f57" stroke-width="1"/><text x="122.4" y="128.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">后微动脉</text><line x1="150.7" y1="123.0" x2="159.7" y2="123.0" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="159.7" y1="123.0" x2="155.8" y2="125.2" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="159.7" y1="123.0" x2="155.8" y2="120.8" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><rect x="161.2" y="111.0" width="53.6" height="24.0" rx="6" fill="#e6f6ec" stroke="#2f8f57" stroke-width="1"/><text x="188.0" y="128.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">前括约肌</text><line x1="216.3" y1="123.0" x2="225.3" y2="123.0" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="225.3" y1="123.0" x2="221.4" y2="125.2" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="225.3" y1="123.0" x2="221.4" y2="120.8" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><rect x="226.8" y="111.0" width="53.6" height="24.0" rx="6" fill="#e6f6ec" stroke="#2f8f57" stroke-width="1"/><text x="253.6" y="128.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">真毛细血管</text><line x1="281.9" y1="123.0" x2="290.9" y2="123.0" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="290.9" y1="123.0" x2="287.0" y2="125.2" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="290.9" y1="123.0" x2="287.0" y2="120.8" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><rect x="292.4" y="111.0" width="53.6" height="24.0" rx="6" fill="#e6f6ec" stroke="#2f8f57" stroke-width="1"/><text x="319.2" y="128.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">微静脉</text><text x="30.0" y="151.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">路径长、血流慢、交换面积大 —— 物质交换主战场；约 20~</text><text x="30.0" y="166.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">35 秒轮流开放</text><text x="30.0" y="193.0" font-size="12.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">② 直捷通路</text><rect x="30.0" y="201.0" width="97.3" height="24.0" rx="6" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1"/><text x="78.7" y="218.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">微动脉</text><line x1="128.8" y1="213.0" x2="137.8" y2="213.0" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="137.8" y1="213.0" x2="133.9" y2="215.2" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="137.8" y1="213.0" x2="133.9" y2="210.8" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><rect x="139.3" y="201.0" width="97.3" height="24.0" rx="6" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1"/><text x="188.0" y="218.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">通血毛细血管</text><line x1="238.2" y1="213.0" x2="247.2" y2="213.0" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="247.2" y1="213.0" x2="243.2" y2="215.2" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="247.2" y1="213.0" x2="243.2" y2="210.8" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><rect x="248.7" y="201.0" width="97.3" height="24.0" rx="6" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1"/><text x="297.3" y="218.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">微静脉</text><text x="30.0" y="241.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">血流快，交换少 —— 让血液快速回流入静脉</text><text x="30.0" y="268.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">③ 动-静脉短路</text><rect x="30.0" y="276.0" width="97.3" height="24.0" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1"/><text x="78.7" y="293.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">微动脉</text><line x1="128.8" y1="288.0" x2="137.8" y2="288.0" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="137.8" y1="288.0" x2="133.9" y2="290.2" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="137.8" y1="288.0" x2="133.9" y2="285.8" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><rect x="139.3" y="276.0" width="97.3" height="24.0" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1"/><text x="188.0" y="293.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">动静脉吻合支</text><line x1="238.2" y1="288.0" x2="247.2" y2="288.0" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="247.2" y1="288.0" x2="243.2" y2="290.2" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="247.2" y1="288.0" x2="243.2" y2="285.8" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><rect x="248.7" y="276.0" width="97.3" height="24.0" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1"/><text x="297.3" y="293.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">微静脉</text><text x="30.0" y="316.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">不经过毛细血管 —— 皮肤多见，寒冷时开放以少散热</text><rect x="18.0" y="349.0" width="177.0" height="156.0" rx="9" fill="#e6f6ec" stroke="#2f8f57" stroke-width="1.1"/><text x="29.0" y="370.0" font-size="12.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">前括约肌｜局部代谢物</text><text x="29.0" y="389.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">受局部代谢产物（O₂↓、CO</text><text x="29.0" y="405.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">₂↑、腺苷）调节</text><text x="29.0" y="425.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">不受神经直接支配</text><text x="29.0" y="445.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">同一时间只有约 20% 毛细血</text><text x="29.0" y="461.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">管开放</text><text x="29.0" y="481.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">代谢旺盛 → 开放增多</text><rect x="205.0" y="349.0" width="177.0" height="156.0" rx="9" fill="#fef3c7" stroke="#b45309" stroke-width="1.1"/><text x="216.0" y="370.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">后括约肌｜受交感支配</text><text x="216.0" y="389.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">微静脉端，受交感神经支配</text><text x="216.0" y="409.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">休克时前括约肌麻痹、后括</text><text x="216.0" y="425.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">约肌仍收缩</text><text x="216.0" y="445.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">血液只进不出 → 微循环淤</text><text x="216.0" y="461.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">血</text><text x="216.0" y="481.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">是休克微循环淤血期的关键</text><rect x="18.0" y="515.0" width="364.0" height="108.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="533.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">两级调节</text><rect x="30.0" y="543.0" width="3.0" height="15.0" rx="1.5" fill="#1f6fb2"/><text x="39.0" y="556.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">血流量调节</text><text x="347.0" y="556.0" text-anchor="end" font-size="12" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">总闸</text><text x="39.0" y="574.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">微动脉是微循环的「总开关」，改变灌入量</text><rect x="30.0" y="584.0" width="3.0" height="15.0" rx="1.5" fill="#2f8f57"/><text x="39.0" y="597.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">毛细血管数</text><text x="347.0" y="597.0" text-anchor="end" font-size="12" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">分闸</text><text x="39.0" y="615.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">前括约肌逐个开放，改变交换面积</text><rect x="18.0" y="635.0" width="364.0" height="70.0" rx="8" fill="#eef2f7"/><rect x="18.0" y="635.0" width="3.5" height="70.0" rx="1.8" fill="#4a5a6b"/><text x="32.0" y="655.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="672.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">前括约肌对代谢物敏感、后括约肌受神经支配——休克淤</text><text x="32.0" y="691.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">血期的机制就在这一对差别。</text></svg>