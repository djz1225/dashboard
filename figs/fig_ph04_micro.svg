<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 402" width="100%" style="max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px" role="img"><text x="165.0" y="22.6" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">微循环的三条通路</text><text x="165.0" y="43.0" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">同一片区域，三种功能分工</text><rect x="15.0" y="60.0" width="300.0" height="72.0" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/><text x="24.0" y="79.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">① 迂回通路（营养通路）</text><text x="24.0" y="96.0" text-anchor="start" font-size="13" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">微动脉→后微动脉→毛细血管前括约肌→真毛细血</text><text x="24.0" y="112.0" text-anchor="start" font-size="13" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">管→微静脉</text><text x="24.0" y="128.0" text-anchor="start" font-size="13" font-weight="600" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">物质交换的主战场；交替开放（20~35 秒轮换）</text><rect x="15.0" y="138.0" width="300.0" height="56.0" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/><text x="24.0" y="157.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">② 直捷通路</text><text x="24.0" y="174.0" text-anchor="start" font-size="13" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">微动脉→通血毛细血管→微静脉</text><text x="24.0" y="190.0" text-anchor="start" font-size="13" font-weight="600" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">血流快，少量交换，主要让血快速回流</text><rect x="15.0" y="200.0" width="300.0" height="56.0" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.4"/><text x="24.0" y="219.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">③ 动-静脉短路</text><text x="24.0" y="236.0" text-anchor="start" font-size="13" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">微动脉→动静脉吻合支→微静脉</text><text x="24.0" y="252.0" text-anchor="start" font-size="13" font-weight="600" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">体温调节：皮肤，寒冷时开放以减少散热</text><rect x="15.0" y="264.0" width="300.0" height="76.0" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/><text x="25.0" y="280.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">毛细血管前括约肌受「局部代谢产物」调节，</text><text x="25.0" y="296.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">不是神经直接支配</text><text x="25.0" y="312.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">休克时微循环淤血就是「前括约肌麻痹、</text><text x="25.0" y="328.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">后括约肌仍收缩」→ 血液只进不出</text><rect x="11.0" y="343.0" width="308.0" height="51.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="165.0" y="358.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">营养靠迂回通路、回流靠直捷通路、调温靠动静</text><text x="165.0" y="373.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">脉短路</text></svg>