<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="静息电位的形成"><title>静息电位的形成</title><desc>静息电位本质是 K⁺ 平衡电位：K⁺ 通道开放使 K⁺ 外流、膜内变负；Na⁺ 少量内漏使静息电位略小于 E_K。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">静息电位的形成</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">本质＝K⁺ 平衡电位：K⁺ 外流造成内负外正</text><rect x="18.0" y="65.0" width="364.0" height="154.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="83.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">膜两侧在做什么</text><text x="30.0" y="105.0" font-size="11" font-weight="700" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">细胞外</text><text x="30.0" y="209.0" font-size="11" font-weight="700" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">细胞内</text><rect x="30.0" y="139.0" width="316.0" height="16.0" rx="3" fill="#eef2f7" stroke="#4a5a6b" stroke-width="1"/><text x="340.0" y="151.0" text-anchor="end" font-size="10.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">细胞膜</text><text x="274.0" y="127.0" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">+ + + +</text><text x="274.0" y="177.0" text-anchor="middle" font-size="12" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">− − − −</text><circle cx="106" cy="177" r="8.5" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1"/><text x="106.0" y="181.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">K</text><circle cx="130" cy="177" r="8.5" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1"/><text x="130.0" y="181.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">K</text><line x1="106.0" y1="163.0" x2="106.0" y2="119.0" stroke="#1f6fb2" stroke-width="1.8" stroke-linecap="round"/><line x1="106.0" y1="119.0" x2="108.9" y2="124.3" stroke="#1f6fb2" stroke-width="1.8" stroke-linecap="round"/><line x1="106.0" y1="119.0" x2="103.1" y2="124.3" stroke="#1f6fb2" stroke-width="1.8" stroke-linecap="round"/><text x="106.0" y="109.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">K⁺ 外流</text><circle cx="170" cy="123" r="8.5" fill="#fdeceb" stroke="#c0392b" stroke-width="1"/><text x="170.0" y="127.0" text-anchor="middle" font-size="9.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Na</text><circle cx="194" cy="123" r="8.5" fill="#fdeceb" stroke="#c0392b" stroke-width="1"/><text x="194.0" y="127.0" text-anchor="middle" font-size="9.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Na</text><line x1="170.0" y1="135.0" x2="170.0" y2="163.0" stroke="#c0392b" stroke-width="1.2" stroke-linecap="round"/><line x1="170.0" y1="163.0" x2="167.6" y2="158.6" stroke="#c0392b" stroke-width="1.2" stroke-linecap="round"/><line x1="170.0" y1="163.0" x2="172.4" y2="158.6" stroke="#c0392b" stroke-width="1.2" stroke-linecap="round"/><text x="170.0" y="191.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">少量内漏</text><rect x="18.0" y="225.0" width="3.0" height="14.0" rx="1.5" fill="#0f766e"/><text x="28.0" y="235.0" font-size="13.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">三步推演</text><rect x="18.0" y="247.0" width="364.0" height="197.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="265.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">形成过程</text><rect x="30.0" y="275.0" width="3.0" height="15.0" rx="1.5" fill="#1f6fb2"/><text x="39.0" y="288.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">① K⁺ 外流</text><text x="347.0" y="288.0" text-anchor="end" font-size="12" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">通透性最高</text><text x="39.0" y="306.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">膜对 K⁺ 通透性最高（K⁺ 通道开放），K⁺</text><text x="39.0" y="322.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">顺浓度梯度外流</text><rect x="30.0" y="332.0" width="3.0" height="15.0" rx="1.5" fill="#1f6fb2"/><text x="39.0" y="345.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">② 内负外正</text><text x="347.0" y="345.0" text-anchor="end" font-size="12" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">电荷分离</text><text x="39.0" y="363.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">K⁺ 带走正电荷 → 膜内变负、膜外变正 → </text><text x="39.0" y="379.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">形成电位差</text><rect x="30.0" y="389.0" width="3.0" height="15.0" rx="1.5" fill="#2f8f57"/><text x="39.0" y="402.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">③ 达到平衡</text><text x="347.0" y="402.0" text-anchor="end" font-size="12" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">E_K</text><text x="39.0" y="420.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">电场力阻止 K⁺ 继续外流，膜电位稳定在 K⁺</text><text x="39.0" y="436.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"> 平衡电位附近</text><rect x="18.0" y="456.0" width="177.0" height="116.0" rx="9" fill="#e2f5f2" stroke="#0f766e" stroke-width="1.1"/><text x="29.0" y="477.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">静息电位（神经）</text><text x="29.0" y="496.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">约 −70 mV</text><text x="29.0" y="516.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">略小于 E_K −88 mV</text><rect x="205.0" y="456.0" width="177.0" height="116.0" rx="9" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1.1"/><text x="216.0" y="477.0" font-size="12.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">E_K 数值</text><text x="216.0" y="496.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">神经细胞 −88 mV</text><text x="216.0" y="516.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">骨骼肌 −98 mV</text><rect x="18.0" y="582.0" width="177.0" height="116.0" rx="9" fill="#fdeceb" stroke="#c0392b" stroke-width="1.1"/><text x="29.0" y="603.0" font-size="12.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">为何略小于 E_K</text><text x="29.0" y="622.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">膜对 Na⁺ 也有少量通透</text><text x="29.0" y="642.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Na⁺ 内漏使膜去极化一点</text><rect x="205.0" y="582.0" width="177.0" height="116.0" rx="9" fill="#fef3c7" stroke="#b45309" stroke-width="1.1"/><text x="216.0" y="603.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">10版更新</text><text x="216.0" y="622.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">骨骼肌 K⁺ 内外比 155/4</text><text x="216.0" y="638.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">≈39 倍</text><text x="216.0" y="658.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Nernst 系数 61.5 mV（</text><text x="216.0" y="674.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">37℃）</text><rect x="18.0" y="710.0" width="364.0" height="70.0" rx="8" fill="#eef2f7"/><rect x="18.0" y="710.0" width="3.5" height="70.0" rx="1.8" fill="#4a5a6b"/><text x="32.0" y="730.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="747.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">静息电位≈K⁺ 平衡电位：K⁺ 外流造成内负外正；Na⁺</text><text x="32.0" y="766.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"> 少量内漏使它略小于 E_K。</text></svg>