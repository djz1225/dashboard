<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 638" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="前庭平衡与痒觉"><title>前庭平衡与痒觉</title><desc>半规管感受角加速度（旋转），椭圆囊与球囊感受直线加速度与头位；前庭反应包括姿势调节、眼球震颤与自主神经反应。痒觉由特异感受器与专用通路介导，急性痒靠组胺、慢性痒靠蛋白酶激活受体。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">前庭平衡与痒觉</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">半规管管旋转、耳石器管直线与重力；痒觉是独立通路</text><rect x="18.0" y="65.0" width="177.0" height="120.0" rx="9" fill="#e2f5f2" stroke="#0f766e" stroke-width="1.1"/><text x="29.0" y="86.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">半规管</text><text x="29.0" y="105.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">感受旋转加速度（角加速度）</text><text x="29.0" y="125.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">三个互相垂直的半规管</text><text x="29.0" y="145.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">壶腹嵴 → 前庭神经</text><rect x="205.0" y="65.0" width="177.0" height="120.0" rx="9" fill="#fef3c7" stroke="#b45309" stroke-width="1.1"/><text x="216.0" y="86.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">椭圆囊＋球囊</text><text x="216.0" y="105.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">感受直线加速度与头位</text><text x="216.0" y="121.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">（重力）</text><text x="216.0" y="141.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">统称耳石器</text><text x="216.0" y="161.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">囊斑 → 前庭神经</text><rect x="18.0" y="195.0" width="364.0" height="145.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="213.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">前庭反应三联</text><rect x="31.0" y="223.0" width="3.0" height="15.0" rx="1.5" fill="#2f8f57"/><text x="40.0" y="236.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">姿势调节</text><text x="344.0" y="236.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">维持平衡</text><text x="40.0" y="254.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">前庭脊髓束→抗重力肌，保持身体直立</text><rect x="31.0" y="262.0" width="3.0" height="15.0" rx="1.5" fill="#1f6fb2"/><text x="40.0" y="275.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">眼球震颤</text><text x="344.0" y="275.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">慢相-快相</text><text x="40.0" y="293.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">旋转后出现，慢相沿旋转方向、快相相反</text><rect x="31.0" y="301.0" width="3.0" height="15.0" rx="1.5" fill="#b45309"/><text x="40.0" y="314.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">自主神经反应</text><text x="344.0" y="314.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">晕动病</text><text x="40.0" y="332.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">恶心、呕吐、面色苍白、出汗</text><rect x="18.0" y="352.0" width="364.0" height="184.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="370.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">痒觉（第10版新增）</text><rect x="31.0" y="380.0" width="3.0" height="15.0" rx="1.5" fill="#0f766e"/><text x="40.0" y="393.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">独立通路</text><text x="344.0" y="393.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">不是弱痛觉</text><text x="40.0" y="411.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">有特异痒觉感受器与专用传导通路</text><rect x="31.0" y="419.0" width="3.0" height="15.0" rx="1.5" fill="#7b4bb7"/><text x="40.0" y="432.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">急性痒</text><text x="344.0" y="432.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">组胺</text><text x="40.0" y="450.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">组胺敏感型 C 纤维，抗组胺药有效</text><rect x="31.0" y="458.0" width="3.0" height="15.0" rx="1.5" fill="#b45309"/><text x="40.0" y="471.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">慢性痒</text><text x="344.0" y="471.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">PAR 受体</text><text x="40.0" y="489.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">蛋白酶激活受体，抗组胺药常无效</text><rect x="31.0" y="497.0" width="3.0" height="15.0" rx="1.5" fill="#1f6fb2"/><text x="40.0" y="510.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">脊髓</text><text x="344.0" y="510.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">专用神经元</text><text x="40.0" y="528.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">脊髓有专门传递痒觉的神经元</text><rect x="18.0" y="548.0" width="364.0" height="70.0" rx="8" fill="#eef2f7"/><rect x="18.0" y="548.0" width="3.5" height="70.0" rx="1.8" fill="#4a5a6b"/><text x="32.0" y="568.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="585.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">最常混的一对：半规管＝旋转（角加速度），耳石器＝直</text><text x="32.0" y="604.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">线加速度与重力。痒觉是独立通路，不等于弱痛觉。</text></svg>