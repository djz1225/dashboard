<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 538" width="100%" style="max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px" role="img"><text x="165.0" y="22.6" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">前庭平衡与痒觉</text><text x="165.0" y="43.0" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">前庭管头的位置与运动；痒觉是第10版新增内容</text><text x="15.0" y="73.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">前庭器官（两部分）</text><rect x="15.0" y="80.0" width="300.0" height="42.0" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/><text x="27.0" y="100.0" text-anchor="start" font-size="14" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">半规管</text><text x="27.0" y="117.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">感受「旋转」加速度（角加速度）</text><rect x="15.0" y="128.0" width="300.0" height="42.0" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="27.0" y="148.0" text-anchor="start" font-size="14" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">椭圆囊+球囊</text><text x="27.0" y="165.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">感受「直线」加速度与头位（重力）</text><rect x="15.0" y="180.0" width="300.0" height="86.0" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="25.0" y="199.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">前庭反应三联</text><text x="25.0" y="217.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 姿势调节（维持平衡）</text><text x="25.0" y="233.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 眼球震颤（旋转后出现，慢相-快相）</text><text x="25.0" y="249.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 自主神经反应（晕船、恶心、呕吐）</text><rect x="15.0" y="274.0" width="300.0" height="76.0" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/><text x="25.0" y="290.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">半规管＝旋转（角加速度）；耳石器＝直线加</text><text x="25.0" y="306.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">速度与重力——最常混的一对</text><text x="25.0" y="322.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">晕动病就是前庭刺激与视觉信息不一致导致的</text><text x="25.0" y="338.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">自主神经反应</text><rect x="15.0" y="356.0" width="300.0" height="118.0" rx="7" fill="#fee2e2" stroke="#cbd5e1" stroke-width="1.4"/><text x="25.0" y="375.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">痒觉（第10版新增）</text><text x="25.0" y="393.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 由特异的痒觉感受器与专用传导通路介导，</text><text x="25.0" y="409.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">不是「弱的痛觉」</text><text x="25.0" y="425.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 主要递质：组胺（急性痒）与蛋白酶激活受</text><text x="25.0" y="441.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">体（慢性痒）</text><text x="25.0" y="457.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 脊髓有专用的痒觉传导神经元</text><rect x="11.0" y="479.0" width="308.0" height="51.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="165.0" y="494.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">半规管管旋转、耳石器管直线与重力；痒觉是独</text><text x="165.0" y="509.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">立通路，不等于弱痛觉</text></svg>