<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 498" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="一碳单位：由 FH₄ 携带，SAM 供甲基"><title>一碳单位：由 FH₄ 携带，SAM 供甲基</title><desc>一碳单位以甲基、亚甲基、次甲基、甲酰基、亚氨甲基等形式存在，必须由四氢叶酸（FH₄）携带，参与嘌呤 C2 与 C8 及 dTMP 的合成；S-腺苷甲硫氨酸（SAM）是体内甲基化的直接供体，参与 DNA 甲基化与肌酸、胆碱、肾上腺素合成，两者分工不同、不可互换。缺乏叶酸或维生素 B₁₂ 时一碳单位代谢停滞，dTMP 不足导致巨幼细胞贫血。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一碳单位：由 FH₄ 携带，SAM 供甲基</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一碳单位不能游离存在；FH₄ 管「造原料」，SAM 管「加修饰」</text><rect x="18.0" y="65.0" width="364.0" height="26.0" rx="6" fill="#f8fbfd"/><text x="26.0" y="82.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">形式</text><text x="142.5" y="82.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">来源氨基酸</text><text x="259.0" y="82.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">去向</text><line x1="18.0" y1="117.0" x2="382.0" y2="117.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="109.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">甲基（-CH₃）</text><text x="142.5" y="109.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">丝氨酸、甘氨酸</text><text x="259.0" y="109.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">甲硫氨酸循环（需 B₁₂）</text><line x1="18.0" y1="159.0" x2="382.0" y2="159.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="135.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">亚甲基（-CH₂</text><text x="26.0" y="151.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">-）</text><text x="142.5" y="135.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">丝氨酸、甘氨酸</text><text x="259.0" y="135.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">dTMP 合成（关键）</text><line x1="18.0" y1="185.0" x2="382.0" y2="185.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="177.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">次甲基（-CH=）</text><text x="142.5" y="177.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">组氨酸、色氨酸</text><text x="259.0" y="177.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">嘌呤合成 C8</text><line x1="18.0" y1="211.0" x2="382.0" y2="211.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="203.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">甲酰基（-CHO）</text><text x="142.5" y="203.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">色氨酸、甘氨酸</text><text x="259.0" y="203.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">嘌呤合成 C2</text><line x1="18.0" y1="253.0" x2="382.0" y2="253.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="229.0" font-size="12.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">亚氨甲基（-CH</text><text x="26.0" y="245.0" font-size="12.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">=NH）</text><text x="142.5" y="229.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">组氨酸</text><text x="259.0" y="229.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">组氨酸分解</text><rect x="18.0" y="259.0" width="177.0" height="120.0" rx="9" fill="#e2f5f2" stroke="#0f766e" stroke-width="1.1"/><text x="29.0" y="280.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">FH₄｜携带者</text><text x="29.0" y="299.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">四氢叶酸携带一碳单位</text><text x="29.0" y="319.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">供嘌呤 C2、C8 与 dTMP</text><text x="29.0" y="335.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"> 的甲基</text><text x="29.0" y="355.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">缺乏叶酸 → 一碳单位停滞</text><rect x="205.0" y="259.0" width="177.0" height="120.0" rx="9" fill="#e2f5f2" stroke="#0f766e" stroke-width="1.1"/><text x="216.0" y="280.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">SAM｜甲基供体</text><text x="216.0" y="299.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">S-腺苷甲硫氨酸是甲基</text><text x="216.0" y="315.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">的直接供体</text><text x="216.0" y="335.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">供 DNA 甲基化、肌酸、胆碱</text><text x="216.0" y="355.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">再生需 B₁₂ 参与</text><rect x="18.0" y="389.0" width="364.0" height="89.0" rx="8" fill="#fef3c7"/><rect x="18.0" y="389.0" width="3.5" height="89.0" rx="1.8" fill="#b45309"/><text x="32.0" y="409.0" font-size="11.5" font-weight="700" fill="#b45309" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">易错</text><text x="32.0" y="426.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">两者不可互换：FH₄ 只搬运一碳单位，SAM 才是把甲基</text><text x="32.0" y="445.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">「装上去」的供体；缺叶酸或 B₁₂ → dTMP 不足</text><text x="32.0" y="464.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">→巨幼细胞贫血。</text></svg>