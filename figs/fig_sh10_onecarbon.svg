<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 565" width="100%" style="max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px" role="img"><text x="165.0" y="22.6" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">一碳单位：由 FH₄ 携带</text><text x="165.0" y="43.0" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">不能游离存在；SAM 才是甲基的直接供体</text><rect x="15.0" y="58.0" width="300.0" height="24.0" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/><text x="21.0" y="74.0" text-anchor="start" font-size="11.2" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">一碳单位形式</text><text x="131.0" y="74.0" text-anchor="start" font-size="11.2" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">来源氨基酸</text><text x="216.8" y="74.0" text-anchor="start" font-size="11.2" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">去向</text><rect x="15.0" y="82.0" width="300.0" height="36.0" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.9"/><text x="21.0" y="97.0" text-anchor="start" font-size="11.2" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">甲基（-CH₃）</text><text x="131.0" y="97.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">丝氨酸、</text><text x="131.0" y="111.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">甘氨酸</text><text x="216.8" y="97.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">甲硫氨酸合成</text><rect x="15.0" y="118.0" width="300.0" height="36.0" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.9"/><text x="21.0" y="133.0" text-anchor="start" font-size="11.2" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">亚甲基（-CH₂-）</text><text x="131.0" y="133.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">丝氨酸、</text><text x="131.0" y="147.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">甘氨酸</text><text x="216.8" y="133.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">dTMP 合成（</text><text x="216.8" y="147.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">关键）</text><rect x="15.0" y="154.0" width="300.0" height="36.0" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.9"/><text x="21.0" y="169.0" text-anchor="start" font-size="11.2" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">次甲基（-CH=）</text><text x="131.0" y="169.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">组氨酸、</text><text x="131.0" y="183.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">色氨酸</text><text x="216.8" y="169.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">嘌呤合成</text><rect x="15.0" y="190.0" width="300.0" height="36.0" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.9"/><text x="21.0" y="205.0" text-anchor="start" font-size="11.2" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">甲酰基（-CHO）</text><text x="131.0" y="205.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">色氨酸、</text><text x="131.0" y="219.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">甘氨酸</text><text x="216.8" y="205.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">嘌呤合成</text><rect x="15.0" y="226.0" width="300.0" height="36.0" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.9"/><text x="21.0" y="241.0" text-anchor="start" font-size="11.2" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">亚氨甲基（-CH=NH</text><text x="21.0" y="255.0" text-anchor="start" font-size="11.2" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">）</text><text x="131.0" y="241.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">组氨酸</text><text x="216.8" y="241.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">组氨酸分解</text><rect x="15.0" y="267.0" width="300.0" height="150.0" rx="7" fill="#ccfbf1" stroke="#cbd5e1" stroke-width="1.4"/><text x="25.0" y="286.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">FH₄ 与 SAM 的分工</text><text x="25.0" y="304.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· FH₄：携带一碳单位，用于「合成」核苷酸（</text><text x="25.0" y="320.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">嘌呤环 C2、C8 与 dTMP 的甲基）</text><text x="25.0" y="336.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· SAM：S-腺苷甲硫氨酸，是体内甲基化的直</text><text x="25.0" y="352.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">接供体（DNA 甲基化、肌酸、胆碱、肾上腺素</text><text x="25.0" y="368.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">）</text><text x="25.0" y="384.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 两者不可互换：FH₄ 管「造原料」，SAM </text><text x="25.0" y="400.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">管「加修饰」</text><rect x="15.0" y="425.0" width="300.0" height="76.0" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/><text x="25.0" y="441.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">易错：一碳单位必须由 FH₄ 携带，血中无游</text><text x="25.0" y="457.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">离一碳单位</text><text x="25.0" y="473.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">缺乏叶酸/B₁₂ → 一碳单位代谢停滞 → dTMP </text><text x="25.0" y="489.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">不足 → 巨幼细胞贫血</text><rect x="11.0" y="506.0" width="308.0" height="51.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="165.0" y="521.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">一碳单位由 FH₄ 携带（不可游离）；SAM 是甲</text><text x="165.0" y="536.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">基化的直接供体，分工不同</text></svg>