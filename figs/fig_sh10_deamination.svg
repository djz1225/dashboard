<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 606" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="三种脱氨基：联合脱氨基是主路"><title>三种脱氨基：联合脱氨基是主路</title><desc>氨基酸脱氨基有转氨基、氧化脱氨基与联合脱氨基三种方式：转氨基由 ALT、AST 催化，只把氨基转给 α-酮戊二酸生成谷氨酸，不产生游离氨；谷氨酸再由谷氨酸脱氢酶氧化脱氨真正释放 NH₃；两者串联即联合脱氨基，是肝肾的主要方式，心肌与骨骼肌则以嘌呤核苷酸循环为主。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">三种脱氨基：联合脱氨基是主路</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">转氨基只搬家不产氨，必须由谷氨酸脱氢酶收尾才真正把氨摘下来</text><rect x="18.0" y="65.0" width="364.0" height="313.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="84.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">四种方式里的主与辅</text><rect x="30.0" y="97.0" width="340.0" height="64.0" rx="8" fill="#ffffff" stroke="#e3eaf2" stroke-width="1.1"/><rect x="30.0" y="97.0" width="3.5" height="64.0" rx="1.8" fill="#1f6fb2"/><circle cx="49.0" cy="114.0" r="9" fill="#1f6fb2"/><text x="49.0" y="118.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">1</text><text x="65.0" y="118.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">① 转氨基（可逆）</text><text x="360.0" y="118.0" text-anchor="end" font-size="12" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">只搬家</text><text x="65.0" y="136.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">氨基酸 + α-酮戊二酸 ⇌ α-酮酸 + 谷氨</text><text x="65.0" y="152.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">酸；ALT、AST 催化，辅酶为磷酸吡哆醛</text><line x1="49.0" y1="163.0" x2="49.0" y2="170.0" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="170.0" x2="45.6" y2="163.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="170.0" x2="52.4" y2="163.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><rect x="30.0" y="172.0" width="340.0" height="64.0" rx="8" fill="#ffffff" stroke="#e3eaf2" stroke-width="1.1"/><rect x="30.0" y="172.0" width="3.5" height="64.0" rx="1.8" fill="#b45309"/><circle cx="49.0" cy="189.0" r="9" fill="#b45309"/><text x="49.0" y="193.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">2</text><text x="65.0" y="193.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">② 谷氨酸氧化脱氨</text><text x="360.0" y="193.0" text-anchor="end" font-size="12" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">产游离氨</text><text x="65.0" y="211.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">谷氨酸 + NAD⁺ → α-酮戊二酸 + NH₃</text><text x="65.0" y="227.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">+ NADH（谷氨酸脱氢酶）</text><line x1="49.0" y1="238.0" x2="49.0" y2="245.0" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="245.0" x2="45.6" y2="238.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="245.0" x2="52.4" y2="238.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><rect x="30.0" y="247.0" width="340.0" height="48.0" rx="8" fill="#ffffff" stroke="#e3eaf2" stroke-width="1.1"/><rect x="30.0" y="247.0" width="3.5" height="48.0" rx="1.8" fill="#c1440e"/><circle cx="49.0" cy="264.0" r="9" fill="#c1440e"/><text x="49.0" y="268.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">3</text><text x="65.0" y="268.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">③ 联合脱氨基</text><text x="360.0" y="268.0" text-anchor="end" font-size="12" font-weight="700" fill="#c1440e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">主路</text><text x="65.0" y="286.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">①+② 串联，是肝、肾最主要的脱氨方式</text><line x1="49.0" y1="297.0" x2="49.0" y2="304.0" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="304.0" x2="45.6" y2="297.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="304.0" x2="52.4" y2="297.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><rect x="30.0" y="306.0" width="340.0" height="64.0" rx="8" fill="#ffffff" stroke="#e3eaf2" stroke-width="1.1"/><rect x="30.0" y="306.0" width="3.5" height="64.0" rx="1.8" fill="#0f766e"/><circle cx="49.0" cy="323.0" r="9" fill="#0f766e"/><text x="49.0" y="327.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">4</text><text x="65.0" y="327.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">④ 嘌呤核苷酸循环</text><text x="360.0" y="327.0" text-anchor="end" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肌的替代</text><text x="65.0" y="345.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">心肌、骨骼肌为主（这些组织谷氨酸脱氢</text><text x="65.0" y="361.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">酶活性低）</text><rect x="18.0" y="390.0" width="364.0" height="26.0" rx="6" fill="#f8fbfd"/><text x="26.0" y="407.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">酶</text><text x="142.5" y="407.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">主要定位</text><text x="251.7" y="407.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">临床意义</text><line x1="18.0" y1="458.0" x2="382.0" y2="458.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="434.0" font-size="12.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">ALT（GPT）</text><text x="142.5" y="434.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肝细胞胞质</text><text x="251.7" y="434.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">急性肝炎最敏感，</text><text x="251.7" y="450.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">升高最早</text><line x1="18.0" y1="484.0" x2="382.0" y2="484.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="476.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">AST（GOT）</text><text x="142.5" y="476.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">心肌、肝线粒体</text><text x="251.7" y="476.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">心梗与肝病均升高</text><line x1="18.0" y1="510.0" x2="382.0" y2="510.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="502.0" font-size="12.5" font-weight="700" fill="#c1440e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">谷氨酸脱氢酶</text><text x="142.5" y="502.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肝线粒体</text><text x="251.7" y="502.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">联合脱氨基的关键酶</text><rect x="18.0" y="516.0" width="364.0" height="70.0" rx="8" fill="#fef3c7"/><rect x="18.0" y="516.0" width="3.5" height="70.0" rx="1.8" fill="#b45309"/><text x="32.0" y="536.0" font-size="11.5" font-weight="700" fill="#b45309" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">易错</text><text x="32.0" y="553.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">转氨基本身不产生游离氨；转氨酶辅酶是维生素 B₆，</text><text x="32.0" y="572.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">缺 B₆ 会影响转氨。</text></svg>