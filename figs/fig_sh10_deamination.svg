<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 522" width="100%" style="max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px" role="img"><text x="165.0" y="22.6" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">三种脱氨基：联合脱氨基是主路</text><text x="165.0" y="43.0" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">转氨基只搬家不移氨，必须靠谷氨酸脱氢酶收尾</text><rect x="15.0" y="58.0" width="300.0" height="56.0" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/><text x="28.0" y="77.0" text-anchor="start" font-size="12.6" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">① 转氨基（可逆）</text><text x="28.0" y="94.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">氨基酸 + α-酮戊二酸 ⇌ α-酮酸 + 谷氨酸；ALT/AST</text><text x="28.0" y="109.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"> 催化</text><line x1="165.0" y1="115.0" x2="165.0" y2="114.5" stroke="#64748b" stroke-width="1.4" stroke-linecap="round"/><polygon points="165.0,119.0 163.0,114.4 167.0,114.4" fill="#64748b"/><rect x="15.0" y="120.0" width="300.0" height="56.0" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/><text x="28.0" y="139.0" text-anchor="start" font-size="12.6" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">② 谷氨酸氧化脱氨基</text><text x="28.0" y="156.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">谷氨酸 + NAD⁺ → α-酮戊二酸 + NH₃ + NADH（</text><text x="28.0" y="171.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">谷氨酸脱氢酶）</text><line x1="165.0" y1="177.0" x2="165.0" y2="176.5" stroke="#64748b" stroke-width="1.4" stroke-linecap="round"/><polygon points="165.0,181.0 163.0,176.4 167.0,176.4" fill="#64748b"/><rect x="15.0" y="182.0" width="300.0" height="41.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/><text x="28.0" y="201.0" text-anchor="start" font-size="12.6" font-weight="700" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">③ 合起来＝联合脱氨基</text><text x="28.0" y="218.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">把氨真正「摘下来」，是肝、肾的主要脱氨方式</text><line x1="165.0" y1="224.0" x2="165.0" y2="223.5" stroke="#64748b" stroke-width="1.4" stroke-linecap="round"/><polygon points="165.0,228.0 163.0,223.4 167.0,223.4" fill="#64748b"/><rect x="15.0" y="229.0" width="300.0" height="41.0" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.4"/><text x="28.0" y="248.0" text-anchor="start" font-size="12.6" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">④ 嘌呤核苷酸循环</text><text x="28.0" y="265.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">心肌、骨骼肌的主要方式（谷氨酸脱氢酶活性低）</text><rect x="15.0" y="273.0" width="300.0" height="24.0" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/><text x="21.0" y="289.0" text-anchor="start" font-size="11.2" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">酶</text><text x="99.6" y="289.0" text-anchor="start" font-size="11.2" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">主要定位</text><text x="188.9" y="289.0" text-anchor="start" font-size="11.2" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">临床意义</text><rect x="15.0" y="297.0" width="300.0" height="36.0" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.9"/><text x="21.0" y="312.0" text-anchor="start" font-size="11.2" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">ALT（GPT）</text><text x="99.6" y="312.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">肝细胞胞质</text><text x="188.9" y="312.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">急性肝炎最敏感，</text><text x="188.9" y="326.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">升高早</text><rect x="15.0" y="333.0" width="300.0" height="22.0" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.9"/><text x="21.0" y="348.0" text-anchor="start" font-size="11.2" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">AST（GOT）</text><text x="99.6" y="348.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">心肌、肝线粒体</text><text x="188.9" y="348.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">心梗、肝病均升高</text><rect x="15.0" y="355.0" width="300.0" height="22.0" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.9"/><text x="21.0" y="370.0" text-anchor="start" font-size="11.2" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">谷氨酸脱氢酶</text><text x="99.6" y="370.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">肝线粒体</text><text x="188.9" y="370.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">联合脱氨基关键</text><rect x="15.0" y="382.0" width="300.0" height="76.0" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/><text x="25.0" y="398.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">易错：转氨基本身不产生游离氨（只是把氨基</text><text x="25.0" y="414.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">转给 α-酮戊二酸）</text><text x="25.0" y="430.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">转氨酶辅酶是磷酸吡哆醛（维生素 B₆）——缺 </text><text x="25.0" y="446.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">B₆ 会影响转氨</text><rect x="11.0" y="463.0" width="308.0" height="51.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="165.0" y="478.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">转氨基只搬家，联合脱氨基才真正脱氨；ALT 最</text><text x="165.0" y="493.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">敏感反映肝细胞损伤</text></svg>