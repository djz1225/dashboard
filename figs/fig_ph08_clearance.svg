<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 567" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="清除率：判断物质被肾怎么处理"><title>清除率：判断物质被肾怎么处理</title><desc>菊粉清除率等于 GFR（125 ml/min）为基准，肌酐略高、葡萄糖为 0、PAH 近似肾血浆流量；与菊粉相等只滤过、偏小有重吸收、偏大有分泌；滤过分数约 19%。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">清除率：判断物质「被肾怎么处理」</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">与菊粉比：相等只滤过、偏小有重吸收、偏大有分泌</text><rect x="18.0" y="65.0" width="364.0" height="204.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="83.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">四种基准物质</text><text x="118.0" y="105.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">菊粉</text><rect x="126.0" y="94.0" width="30.7" height="15.0" rx="3" fill="#e2f5f2" stroke="#0f766e" stroke-width="1"/><text x="162.7" y="105.0" font-size="11" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">125 ml/min</text><text x="126.0" y="120.0" font-size="11" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">只滤过不重吸收不分泌 → 等于 GFR</text><text x="118.0" y="147.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肌酐</text><rect x="126.0" y="136.0" width="34.4" height="15.0" rx="3" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1"/><text x="166.4" y="147.0" font-size="11" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">140 ml/min</text><text x="126.0" y="162.0" font-size="11" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">少量由小管分泌，略高于 GFR，临床估 GFR</text><text x="118.0" y="189.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">葡萄糖</text><rect x="126.0" y="178.0" width="2.5" height="15.0" rx="3" fill="#e6f6ec" stroke="#2f8f57" stroke-width="1"/><text x="156.0" y="189.0" font-size="11" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">0 ml/min</text><text x="126.0" y="204.0" font-size="11" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">滤过后全部重吸收 → 清除率为 0</text><text x="118.0" y="231.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">PAH</text><rect x="126.0" y="220.0" width="162.0" height="15.0" rx="3" fill="#f2ecfb" stroke="#7b4bb7" stroke-width="1"/><text x="294.0" y="231.0" font-size="11" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">660 ml/min</text><text x="126.0" y="246.0" font-size="11" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">滤过＋分泌几乎全清 → 近似肾血浆流量</text><rect x="18.0" y="281.0" width="364.0" height="184.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="299.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">四条判断规则</text><rect x="31.0" y="309.0" width="3.0" height="15.0" rx="1.5" fill="#0f766e"/><text x="40.0" y="322.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">＝ 菊粉</text><text x="344.0" y="322.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">只滤过</text><text x="40.0" y="340.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">如菊粉：既无重吸收也无分泌</text><rect x="31.0" y="348.0" width="3.0" height="15.0" rx="1.5" fill="#2f8f57"/><text x="40.0" y="361.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">＜ 菊粉</text><text x="344.0" y="361.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">有重吸收</text><text x="40.0" y="379.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">如葡萄糖、尿素（尿素部分重吸收）</text><rect x="31.0" y="387.0" width="3.0" height="15.0" rx="1.5" fill="#1f6fb2"/><text x="40.0" y="400.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">＞ 菊粉</text><text x="344.0" y="400.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">有分泌</text><text x="40.0" y="418.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">如 PAH；肌酐略高于 GFR</text><rect x="31.0" y="426.0" width="3.0" height="15.0" rx="1.5" fill="#b45309"/><text x="40.0" y="439.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">＝ 0</text><text x="344.0" y="439.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">完全重吸收</text><text x="40.0" y="457.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">正常血糖下的葡萄糖</text><rect x="18.0" y="477.0" width="364.0" height="70.0" rx="8" fill="#eef2f7"/><rect x="18.0" y="477.0" width="3.5" height="70.0" rx="1.8" fill="#4a5a6b"/><text x="32.0" y="497.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="514.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">滤过分数＝GFR / 肾血浆流量＝125/660 ≈ 19%；GFR</text><text x="32.0" y="533.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">是评价肾功能最重要的指标，临床用 eGFR 估算。</text></svg>