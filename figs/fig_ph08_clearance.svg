<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 538" width="100%" style="max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px" role="img"><text x="165.0" y="22.6" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">清除率：判断物质「被肾怎么处理」</text><text x="165.0" y="43.0" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">与菊粉比较，就知道是滤过、重吸收还是分泌</text><rect x="15.0" y="60.0" width="300.0" height="44.0" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/><text x="27.0" y="80.0" text-anchor="start" font-size="14" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">菊粉清除率</text><text x="305.0" y="80.0" text-anchor="end" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">基准</text><text x="27.0" y="97.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">＝GFR（125 ml/min），只滤过不重吸收不分</text><text x="27.0" y="113.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">泌</text><rect x="15.0" y="110.0" width="300.0" height="42.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="27.0" y="130.0" text-anchor="start" font-size="14" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">肌酐清除率</text><text x="27.0" y="147.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">略高于 GFR（少量由小管分泌），临床估 GFR</text><rect x="15.0" y="158.0" width="300.0" height="42.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="27.0" y="178.0" text-anchor="start" font-size="14" font-weight="700" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">葡萄糖清除率</text><text x="27.0" y="195.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">＝0，滤过后全部重吸收</text><rect x="15.0" y="206.0" width="300.0" height="42.0" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="27.0" y="226.0" text-anchor="start" font-size="14" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">PAH 清除率</text><text x="27.0" y="243.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">≈ 肾血浆流量（RPF），滤过+分泌几乎全清</text><rect x="15.0" y="258.0" width="300.0" height="118.0" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="25.0" y="277.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">判断规则（与菊粉比）</text><text x="25.0" y="295.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 等于菊粉 → 只滤过（如菊粉）</text><text x="25.0" y="311.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 小于菊粉 → 有重吸收（如葡萄糖、尿素）</text><text x="25.0" y="327.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 大于菊粉 → 有分泌（如 PAH、肌酐略高）</text><text x="25.0" y="343.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 等于 0 → 完全重吸收（葡萄糖在正常血糖</text><text x="25.0" y="359.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">下）</text><rect x="15.0" y="384.0" width="300.0" height="92.0" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/><text x="25.0" y="400.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">10版把「清除率」一节改名为「肾功能的评定</text><text x="25.0" y="416.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">」，内容有调整</text><text x="25.0" y="432.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">滤过分数 = GFR / RPF = 125/660 ≈ 19%</text><text x="25.0" y="448.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">GFR 是评价肾功能最重要的指标，临床常用 e</text><text x="25.0" y="464.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">GFR 估算</text><rect x="11.0" y="479.0" width="308.0" height="51.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="165.0" y="494.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">与菊粉比：相等＝只滤过、偏小＝有重吸收、</text><text x="165.0" y="509.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">偏大＝有分泌</text></svg>