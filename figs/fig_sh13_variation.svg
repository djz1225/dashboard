<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 607" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="基因组变异的四类"><title>基因组变异的四类</title><desc>基因组变异分四类：SNP 为单碱基替换，最常见（每人约 300 万个），决定个体化用药；STR 为 2~6 bp 短串联重复的长度多态，用于法医与亲子鉴定；CNV 为 kb~Mb 级拷贝数增减，通过剂量效应与自闭症、肿瘤相关；线粒体基因组为 16 569 bp 环状双链、37 个基因，母系遗传、突变率高、密码表与核基因略有差异（UGA 编码 Trp），且存在突变比例阈值效应。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">基因组变异的四类</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">SNP 最常见、CNV 影响最大、STR 用于鉴定、mtDNA 母系遗传</text><rect x="18.0" y="65.0" width="177.0" height="84.0" rx="9" fill="#e2f5f2" stroke="#0f766e" stroke-width="1.1"/><text x="29.0" y="86.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">SNP｜1 bp</text><text x="29.0" y="105.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">最常见，每人约 300 万个</text><text x="29.0" y="125.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">个体化用药：CYP2C19</text><rect x="205.0" y="65.0" width="177.0" height="84.0" rx="9" fill="#e2f5f2" stroke="#0f766e" stroke-width="1.1"/><text x="216.0" y="86.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">STR｜2~6 bp×n</text><text x="216.0" y="105.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">短串联重复，长度多态</text><text x="216.0" y="125.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">法医与亲子鉴定</text><rect x="18.0" y="159.0" width="177.0" height="84.0" rx="9" fill="#fef3c7" stroke="#b45309" stroke-width="1.1"/><text x="29.0" y="180.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">CNV｜kb~Mb</text><text x="29.0" y="199.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">拷贝数增减 → 剂量效应</text><text x="29.0" y="219.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">与自闭症、肿瘤相关</text><rect x="205.0" y="159.0" width="177.0" height="84.0" rx="9" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1.1"/><text x="216.0" y="180.0" font-size="12.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">mtDNA｜16 569 bp</text><text x="216.0" y="199.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">环状双链、37 个基因</text><text x="216.0" y="219.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">母系遗传，无组蛋白保护</text><rect x="18.0" y="255.0" width="364.0" height="250.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="274.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">线粒体基因组的四个特点</text><rect x="30.0" y="285.0" width="3.0" height="15.0" rx="1.5" fill="#1f6fb2"/><text x="39.0" y="298.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">母系遗传</text><text x="362.0" y="298.0" text-anchor="end" font-size="12" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">精子线粒体基本不入卵</text><text x="39.0" y="316.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">线粒体病由母亲传给全部子女，</text><text x="39.0" y="332.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">父亲不传</text><rect x="30.0" y="340.0" width="3.0" height="15.0" rx="1.5" fill="#b45309"/><text x="39.0" y="353.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">高突变率</text><text x="362.0" y="353.0" text-anchor="end" font-size="12" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">10 倍于核 DNA</text><text x="39.0" y="371.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">无组蛋白保护、靠近呼吸链 ROS 源，</text><text x="39.0" y="387.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">故积累快</text><rect x="30.0" y="395.0" width="3.0" height="15.0" rx="1.5" fill="#c0392b"/><text x="39.0" y="408.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">密码表有差异</text><text x="362.0" y="408.0" text-anchor="end" font-size="12" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">UGA = Trp</text><text x="39.0" y="426.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">线粒体 UGA 编码色氨酸，AGA/AGG 为终止，</text><text x="39.0" y="442.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">不能套通用密码表</text><rect x="30.0" y="450.0" width="3.0" height="15.0" rx="1.5" fill="#0f766e"/><text x="39.0" y="463.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">多拷贝</text><text x="362.0" y="463.0" text-anchor="end" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">阈值效应</text><text x="39.0" y="481.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">同一细胞内突变与野生型mtDNA共存，突变比</text><text x="39.0" y="497.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">例决定表型</text><rect x="18.0" y="517.0" width="364.0" height="70.0" rx="8" fill="#eef2f7"/><rect x="18.0" y="517.0" width="3.5" height="70.0" rx="1.8" fill="#4a5a6b"/><text x="32.0" y="537.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="554.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">SNP 最常见但单个影响小，CNV 数量少但一次影响大；</text><text x="32.0" y="573.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">结构变异如 t(9;22) 形成 BCR-ABL 融合基因。</text></svg>