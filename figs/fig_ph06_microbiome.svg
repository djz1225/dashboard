<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="肠道微生态与肠屏障"><title>肠道微生态与肠屏障</title><desc>肠屏障分化学（胃酸胆汁黏液抗菌肽）、机械（紧密连接）、生物（菌群占位）、免疫（GALT、sIgA）四层；菌群供能产 SCFA、合成维生素 K、训练免疫、参与胆汁酸与药物代谢。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肠道微生态与肠屏障</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">菌群＋屏障＝一道会主动工作的防线</text><rect x="18.0" y="65.0" width="177.0" height="84.0" rx="9" fill="#fef3c7" stroke="#b45309" stroke-width="1.1"/><text x="29.0" y="86.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">化学屏障</text><text x="29.0" y="105.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胃酸、胆汁、黏液</text><text x="29.0" y="125.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">黏液内含抗菌肽</text><rect x="205.0" y="65.0" width="177.0" height="84.0" rx="9" fill="#e2f5f2" stroke="#0f766e" stroke-width="1.1"/><text x="216.0" y="86.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">机械屏障</text><text x="216.0" y="105.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肠上皮细胞</text><text x="216.0" y="125.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">细胞间紧密连接</text><rect x="18.0" y="159.0" width="177.0" height="84.0" rx="9" fill="#e6f6ec" stroke="#2f8f57" stroke-width="1.1"/><text x="29.0" y="180.0" font-size="12.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">生物屏障</text><text x="29.0" y="199.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">常驻菌群占位竞争</text><text x="29.0" y="219.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">阻止致病菌定植</text><rect x="205.0" y="159.0" width="177.0" height="84.0" rx="9" fill="#f2ecfb" stroke="#7b4bb7" stroke-width="1.1"/><text x="216.0" y="180.0" font-size="12.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">免疫屏障</text><text x="216.0" y="199.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肠相关淋巴组织 GALT</text><text x="216.0" y="219.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">分泌型 sIgA</text><rect x="18.0" y="255.0" width="364.0" height="184.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="273.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">菌群的四个意义</text><rect x="31.0" y="283.0" width="3.0" height="15.0" rx="1.5" fill="#2f8f57"/><text x="40.0" y="296.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">供能</text><text x="344.0" y="296.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">SCFA</text><text x="40.0" y="314.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">发酵未消化碳水 → 短链脂肪酸，为结肠上皮供能</text><rect x="31.0" y="322.0" width="3.0" height="15.0" rx="1.5" fill="#1f6fb2"/><text x="40.0" y="335.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">合成</text><text x="344.0" y="335.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">维生素</text><text x="40.0" y="353.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">合成维生素 K 与部分 B 族维生素</text><rect x="31.0" y="361.0" width="3.0" height="15.0" rx="1.5" fill="#7b4bb7"/><text x="40.0" y="374.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">训练免疫</text><text x="344.0" y="374.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">免疫耐受</text><text x="40.0" y="392.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">训练免疫系统、维持口服耐受</text><rect x="31.0" y="400.0" width="3.0" height="15.0" rx="1.5" fill="#b45309"/><text x="40.0" y="413.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">代谢</text><text x="344.0" y="413.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">影响药效</text><text x="40.0" y="431.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">参与胆汁酸与药物代谢，影响药效</text><rect x="18.0" y="451.0" width="364.0" height="89.0" rx="8" fill="#eef2f7"/><rect x="18.0" y="451.0" width="3.5" height="89.0" rx="1.8" fill="#4a5a6b"/><text x="32.0" y="471.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="488.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">长期广谱抗生素 → 菌群失调 → 艰难梭菌过度繁殖 →</text><text x="32.0" y="507.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">抗生素相关性腹泻；紧密连接受损即「肠漏」，内毒素</text><text x="32.0" y="526.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">入血与慢性炎症相关。</text></svg>