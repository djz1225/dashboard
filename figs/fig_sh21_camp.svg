<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 708" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="cAMP-PKA：级联为什么能放大上万倍"><title>cAMP-PKA：级联为什么能放大上万倍</title><desc>激素→受体→Gs→腺苷酸环化酶→cAMP→PKA→磷酸化酶激酶→糖原磷酸化酶，每一层都是「一个分子催化多个下游」，逐级放大 10⁴~10⁶ 倍。cAMP 不是自动消失，而是被磷酸二酯酶（PDE）水解为 5′-AMP 而终止；咖啡因、茶碱抑制 PDE 使 cAMP 升高（支气管舒张）；GRK 磷酸化加重受体内吞造成脱敏。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">cAMP-PKA：级联为什么能放大上万倍</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">放大的要害是「每层一催多」，不是信号分子本身多；cAMP 由</text><text x="18.0" y="68.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">PDE 降解终止</text><rect x="18.0" y="82.0" width="364.0" height="277.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="101.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">五层，每层都是一催多</text><rect x="30.0" y="112.0" width="3.0" height="15.0" rx="1.5" fill="#4a5a6b"/><text x="39.0" y="125.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">① 激素</text><text x="362.0" y="125.0" text-anchor="end" font-size="12" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">×1</text><text x="39.0" y="143.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一个激素分子结合一个受体，放大从这里起步</text><rect x="30.0" y="152.0" width="3.0" height="15.0" rx="1.5" fill="#0f766e"/><text x="39.0" y="165.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">② Gs</text><text x="362.0" y="165.0" text-anchor="end" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一催多</text><text x="39.0" y="183.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一个受体可激活多个 Gs，每个 Gs 打开一个腺</text><text x="39.0" y="199.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">苷酸环化酶</text><rect x="30.0" y="208.0" width="3.0" height="15.0" rx="1.5" fill="#c1440e"/><text x="39.0" y="221.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">③ 环化酶</text><text x="362.0" y="221.0" text-anchor="end" font-size="12" font-weight="700" fill="#c1440e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一催多</text><text x="39.0" y="239.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一个酶每秒生成大量 cAMP；cAMP 是第二信使，</text><text x="39.0" y="255.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">可在胞内扩散</text><rect x="30.0" y="264.0" width="3.0" height="15.0" rx="1.5" fill="#c0392b"/><text x="39.0" y="277.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">④ PKA</text><text x="362.0" y="277.0" text-anchor="end" font-size="12" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一催多</text><text x="39.0" y="295.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">1 个 PKA 催化多个底物：磷酸化酶激酶 → 糖</text><text x="39.0" y="311.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">原磷酸化酶</text><rect x="30.0" y="320.0" width="3.0" height="15.0" rx="1.5" fill="#c0392b"/><text x="39.0" y="333.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">⑤ 结果</text><text x="362.0" y="333.0" text-anchor="end" font-size="12" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">10⁴~10⁶</text><text x="39.0" y="351.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">层层放大后葡萄糖大量释放，血糖迅速升高</text><rect x="18.0" y="371.0" width="364.0" height="26.0" rx="6" fill="#fef3c7"/><text x="200.0" y="388.5" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">1 个激素分子 → 上万 ~ 百万个葡萄糖分子</text><rect x="18.0" y="409.0" width="364.0" height="197.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="428.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">放大之后怎么关掉</text><rect x="30.0" y="439.0" width="3.0" height="15.0" rx="1.5" fill="#c1440e"/><text x="39.0" y="452.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">PDE</text><text x="362.0" y="452.0" text-anchor="end" font-size="12" font-weight="700" fill="#c1440e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">终止开关</text><text x="39.0" y="470.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">磷酸二酯酶把 cAMP 水解成 5′-AMP；「</text><text x="39.0" y="486.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">cAMP 自己消失」是错的</text><rect x="30.0" y="495.0" width="3.0" height="15.0" rx="1.5" fill="#b45309"/><text x="39.0" y="508.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">咖啡因/茶碱</text><text x="362.0" y="508.0" text-anchor="end" font-size="12" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">抑制 PDE</text><text x="39.0" y="526.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">PDE 被抑 → cAMP↑↑ → 支气管舒张</text><text x="39.0" y="542.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">（氨茶碱）</text><rect x="30.0" y="551.0" width="3.0" height="15.0" rx="1.5" fill="#4a5a6b"/><text x="39.0" y="564.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">GRK + 内吞</text><text x="362.0" y="564.0" text-anchor="end" font-size="12" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">脱敏</text><text x="39.0" y="582.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">受体被磷酸化并内吞 → 表面受体减少 → 反</text><text x="39.0" y="598.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">应减弱</text><rect x="18.0" y="618.0" width="364.0" height="70.0" rx="8" fill="#e2f5f2"/><rect x="18.0" y="618.0" width="3.5" height="70.0" rx="1.8" fill="#0f766e"/><text x="32.0" y="638.0" font-size="11.5" font-weight="700" fill="#0f766e" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="655.0" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">级联放大靠「一催多」逐层放大 10⁴~10⁶ 倍；cAMP</text><text x="32.0" y="674.0" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">必须被 PDE 降解，信号才会停止。</text></svg>