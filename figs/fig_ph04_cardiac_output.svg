<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 503.5" width="100%" style="max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px" role="img"><text x="165.0" y="22.6" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">心输出量：四个影响因素</text><text x="165.0" y="42.6" text-anchor="middle" font-size="13.5" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">CO = HR × SV；影响 SV 的又分前后负荷与收缩力</text><rect x="15.0" y="59.5" width="300.0" height="34.0" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/><text x="165.0" y="82.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">心输出量 CO = 心率 HR × 搏出量 SV</text><rect x="15.0" y="99.5" width="300.0" height="60.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/><text x="24.0" y="118.5" text-anchor="start" font-size="13.5" font-weight="700" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">前负荷（异长调节）</text><text x="24.0" y="135.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">心室舒张末期容积↑ → 初长度↑ → 收缩力↑</text><text x="24.0" y="153.5" text-anchor="start" font-size="13" font-weight="400" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">一定范围内正相关；超出则过度牵拉反而下降</text><rect x="15.0" y="165.5" width="300.0" height="60.0" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/><text x="24.0" y="184.5" text-anchor="start" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">后负荷（动脉压）</text><text x="24.0" y="201.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">动脉压↑ → 射血阻力↑ → 搏出量↓</text><text x="24.0" y="219.5" text-anchor="start" font-size="13" font-weight="400" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">但通过异长自身调节可部分代偿</text><rect x="15.0" y="231.5" width="300.0" height="60.0" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.4"/><text x="24.0" y="250.5" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">心肌收缩力（等长调节）</text><text x="24.0" y="267.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">交感兴奋 → Ca²⁺↑ → 收缩力↑</text><text x="24.0" y="285.5" text-anchor="start" font-size="13" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">不依赖初长度，与前后负荷无关</text><rect x="15.0" y="297.5" width="300.0" height="60.0" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/><text x="24.0" y="316.5" text-anchor="start" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">心率</text><text x="24.0" y="333.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">过快 → 舒张期缩短 → 充盈不足 → SV↓</text><text x="24.0" y="351.5" text-anchor="start" font-size="13" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">过慢 → 虽然充盈足但次数少 → CO 也下降</text><rect x="15.0" y="365.5" width="300.0" height="76.0" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/><text x="25.0" y="381.5" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">Frank-Starling 定律＝异长自身调节：</text><text x="25.0" y="397.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">回心血量越多，收缩越强（有一定限度）</text><text x="25.0" y="413.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">等长调节＝心肌收缩能力改变，不改变初长度—</text><text x="25.0" y="429.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">—交感兴奋属此类</text><rect x="11.0" y="444.5" width="308.0" height="51.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="165.0" y="459.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">CO=HR×SV；前负荷增收缩力、后负荷减搏出量、</text><text x="165.0" y="475.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">交感增强收缩力</text></svg>