<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 574" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="反射与中枢抑制"><title>反射与中枢抑制</title><desc>反射弧由感受器、传入神经、中枢、传出神经、效应器五个环节组成；中枢抑制分突触后抑制（产生 IPSP，含回返性与侧支抑制）与突触前抑制（轴-轴突触使递质释放减少，无 IPSP）。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">反射与中枢抑制</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">反射弧五环节；中枢抑制分突触后与突触前两类</text><rect x="18.0" y="65.0" width="364.0" height="104.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="83.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">反射弧</text><text x="30.0" y="103.0" font-size="12" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">反射弧五环节</text><rect x="30.0" y="111.0" width="54.4" height="24.0" rx="5" fill="#e2f5f2" stroke="#0f766e" stroke-width="1"/><text x="57.2" y="127.0" text-anchor="middle" font-size="10" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">感受器</text><line x1="85.9" y1="123.0" x2="93.9" y2="123.0" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="93.9" y1="123.0" x2="90.0" y2="125.2" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="93.9" y1="123.0" x2="90.0" y2="120.8" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><rect x="95.4" y="111.0" width="54.4" height="24.0" rx="5" fill="#e2f5f2" stroke="#0f766e" stroke-width="1"/><text x="122.6" y="127.0" text-anchor="middle" font-size="10" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">传入神经</text><line x1="151.3" y1="123.0" x2="159.3" y2="123.0" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="159.3" y1="123.0" x2="155.4" y2="125.2" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="159.3" y1="123.0" x2="155.4" y2="120.8" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><rect x="160.8" y="111.0" width="54.4" height="24.0" rx="5" fill="#e2f5f2" stroke="#0f766e" stroke-width="1"/><text x="188.0" y="127.0" text-anchor="middle" font-size="10" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">中枢</text><line x1="216.7" y1="123.0" x2="224.7" y2="123.0" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="224.7" y1="123.0" x2="220.8" y2="125.2" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="224.7" y1="123.0" x2="220.8" y2="120.8" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><rect x="226.2" y="111.0" width="54.4" height="24.0" rx="5" fill="#e2f5f2" stroke="#0f766e" stroke-width="1"/><text x="253.4" y="127.0" text-anchor="middle" font-size="10" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">传出神经</text><line x1="282.1" y1="123.0" x2="290.1" y2="123.0" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="290.1" y1="123.0" x2="286.2" y2="125.2" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="290.1" y1="123.0" x2="286.2" y2="120.8" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><rect x="291.6" y="111.0" width="54.4" height="24.0" rx="5" fill="#e2f5f2" stroke="#0f766e" stroke-width="1"/><text x="318.8" y="127.0" text-anchor="middle" font-size="10" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">效应器</text><text x="30.0" y="153.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">单突触反射（如膝跳反射）突触最少、反应最快</text><rect x="18.0" y="181.0" width="177.0" height="120.0" rx="9" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1.1"/><text x="29.0" y="202.0" font-size="12.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">突触后抑制</text><text x="29.0" y="221.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">产生 IPSP → 后膜超极化</text><text x="29.0" y="241.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">回返性抑制（Renshaw 细胞）</text><text x="29.0" y="261.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">侧支抑制；防止过度兴奋</text><rect x="205.0" y="181.0" width="177.0" height="120.0" rx="9" fill="#fef3c7" stroke="#b45309" stroke-width="1.1"/><text x="216.0" y="202.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">突触前抑制</text><text x="216.0" y="221.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">轴-轴突触使末梢去极化</text><text x="216.0" y="241.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">递质释放↓ → EPSP 变小</text><text x="216.0" y="261.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">无 IPSP，持续时间长；调控</text><text x="216.0" y="277.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">感觉传入</text><rect x="18.0" y="311.0" width="364.0" height="161.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="329.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">两类抑制的分工</text><rect x="31.0" y="339.0" width="3.0" height="15.0" rx="1.5" fill="#1f6fb2"/><text x="40.0" y="352.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">回返性抑制</text><text x="344.0" y="352.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">负反馈</text><text x="40.0" y="370.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">α 运动神经元兴奋 → Renshaw 细胞 → 抑制同一神</text><text x="40.0" y="386.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">经元及同类</text><rect x="31.0" y="394.0" width="3.0" height="15.0" rx="1.5" fill="#b45309"/><text x="40.0" y="407.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">突触前抑制</text><text x="344.0" y="407.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">感觉闸门</text><text x="40.0" y="425.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">多见于感觉传入通路，选择性地「关小」某一路信号</text><rect x="31.0" y="433.0" width="3.0" height="15.0" rx="1.5" fill="#2f8f57"/><text x="40.0" y="446.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">突触前易化</text><text x="344.0" y="446.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">相反过程</text><text x="40.0" y="464.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">末梢去极化时间延长 → 递质释放↑ → EPSP 增大</text><rect x="18.0" y="484.0" width="364.0" height="70.0" rx="8" fill="#eef2f7"/><rect x="18.0" y="484.0" width="3.5" height="70.0" rx="1.8" fill="#4a5a6b"/><text x="32.0" y="504.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="521.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">突触后抑制有 IPSP（超极化），突触前抑制没有 IPSP</text><text x="32.0" y="540.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">而是递质减少；回返性抑制是典型的负反馈。</text></svg>