<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 582" width="100%" style="max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px" role="img"><text x="165.0" y="22.6" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">表观遗传与肿瘤</text><text x="165.0" y="43.0" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">沉默抑癌基因，不靠突变也能致癌</text><rect x="15.0" y="58.0" width="300.0" height="60.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><rect x="15.0" y="58.0" width="4.5" height="60.0" rx="2.2" fill="#b91c1c"/><text x="29.0" y="77.0" text-anchor="start" font-size="14" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">启动子超甲基化</text><text x="29.0" y="94.0" text-anchor="start" font-size="12" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">沉默抑癌基因</text><text x="29.0" y="109.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">如 MLH1、BRCA1、CDKN2A 的沉默</text><rect x="15.0" y="122.0" width="300.0" height="60.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><rect x="15.0" y="122.0" width="4.5" height="60.0" rx="2.2" fill="#b45309"/><text x="29.0" y="141.0" text-anchor="start" font-size="14" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">全局低甲基化</text><text x="29.0" y="158.0" text-anchor="start" font-size="12" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">基因组不稳定</text><text x="29.0" y="173.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">转座子激活、染色体断裂</text><rect x="15.0" y="186.0" width="300.0" height="60.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><rect x="15.0" y="186.0" width="4.5" height="60.0" rx="2.2" fill="#0f766e"/><text x="29.0" y="205.0" text-anchor="start" font-size="14" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">组蛋白去乙酰化</text><text x="29.0" y="222.0" text-anchor="start" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">染色质紧缩</text><text x="29.0" y="237.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">HDAC 抑制剂（如丙戊酸）可逆转</text><rect x="15.0" y="250.0" width="300.0" height="60.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><rect x="15.0" y="250.0" width="4.5" height="60.0" rx="2.2" fill="#15803d"/><text x="29.0" y="269.0" text-anchor="start" font-size="14" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">可逆性</text><text x="29.0" y="286.0" text-anchor="start" font-size="12" font-weight="700" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">表观改变可被药物逆转</text><text x="29.0" y="301.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">这是「表观药物」的理论基础</text><rect x="15.0" y="316.0" width="300.0" height="134.0" rx="7" fill="#ccfbf1" stroke="#cbd5e1" stroke-width="1.4"/><text x="25.0" y="335.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">与突变的三个区别</text><text x="25.0" y="353.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 突变改变 DNA 序列、不可逆；表观改变不</text><text x="25.0" y="369.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">改序列、可逆</text><text x="25.0" y="385.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 突变需两次打击（抑癌基因）；表观沉默一</text><text x="25.0" y="401.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">次即可（两个等位同时甲基化）</text><text x="25.0" y="417.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 表观改变可在细胞间「遗传」，但一般不通</text><text x="25.0" y="433.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">过生殖系传递（除印记基因）</text><rect x="15.0" y="458.0" width="300.0" height="60.0" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/><text x="25.0" y="474.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">易错：肿瘤中既有「超甲基化沉默抑癌基因」，</text><text x="25.0" y="490.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">也有「全局低甲基化致不稳定」，方向相反</text><text x="25.0" y="506.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">印记基因是少数可经生殖系传递的表观现象</text><rect x="11.0" y="523.0" width="308.0" height="51.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="165.0" y="538.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">超甲基化沉默抑癌基因、全局低甲基化致不稳；</text><text x="165.0" y="553.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">表观改变可逆，故可成药</text></svg>