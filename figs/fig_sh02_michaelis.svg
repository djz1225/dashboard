2" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">（反比）</text><rect x="30.0" y="425.0" width="3.0" height="15.0" rx="1.5" fill="#c1440e"/><text x="39.0" y="438.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Vmax</text><text x="370.0" y="438.0" text-anchor="end" font-size="12" font-weight="700" fill="#c1440e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">酶量</text><text x="39.0" y="456.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">= kcat · [E]总，随酶量变；kcat 才是固有</text><text x="39.0" y="472.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">催化常数</text><rect x="30.0" y="483.0" width="3.0" height="15.0" rx="1.5" fill="#4a5a6b"/><text x="39.0" y="496.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Km 的稳定性</text><text x="370.0" y="496.0" text-anchor="end" font-size="12" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">无关酶量</text><text x="39.0" y="514.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">与酶浓度无关，但随底物种类、pH、温度、离子</text><text x="39.0" y="530.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">强度而变</text><rect x="18.0" y="550.0" width="364.0" height="70.0" rx="8" fill="#fef3c7"/><rect x="18.0" y="550.0" width="3.5" height="70.0" rx="1.8" fill="#b45309"/><text x="32.0" y="570.0" font-size="11.5" font-weight="700" fill="#b45309" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">易错</text><text x="32.0" y="587.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Km 越大亲和力越「弱」，别记反；Vmax 变大可能只是</text><text x="32.0" y="606.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">酶加多了。</text></svg>