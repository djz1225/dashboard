<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 544" width="100%" style="max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px" role="img"><text x="165.0" y="22.6" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">米氏方程的三个关键点</text><text x="165.0" y="43.0" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">v = Vmax·[S] / (Km + [S])</text><rect x="23.0" y="58.0" width="284.0" height="156.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><polyline points="35.0,192.0 40.2,174.9 45.4,162.7 50.6,153.5 55.8,146.4 61.0,140.7 66.2,136.0 71.4,132.1 76.6,128.9 81.8,126.0 87.0,123.6 92.2,121.5 97.4,119.6 102.6,117.9 107.8,116.4 113.0,115.0 118.2,113.8 123.4,112.7 128.6,111.7 133.8,110.8 139.0,109.9 144.2,109.1 149.4,108.4 154.6,107.7 159.8,107.1 165.0,106.5 170.2,105.9 175.4,105.4 180.6,104.9 185.8,104.5 191.0,104.0 196.2,103.6 201.4,103.3 206.6,102.9 211.8,102.5 217.0,102.2 222.2,101.9 227.4,101.6 232.6,101.3 237.8,101.1 243.0,100.8 248.2,100.5 253.4,100.3 258.6,100.1 263.8,99.9 269.0,99.7 274.2,99.5 279.4,99.3 284.6,99.1 289.8,98.9 295.0,98.7" fill="none" stroke="#0f766e" stroke-width="2.6" stroke-linecap="round"/><path d="M35.0,89.4 H295.0" stroke="#0f766e" stroke-width="1" stroke-dasharray="4 3" opacity="0.75"/><path d="M61.0,140.7 H35.0" stroke="#b45309" stroke-width="1" stroke-dasharray="3 2"/><path d="M61.0,140.7 V192" stroke="#b45309" stroke-width="1" stroke-dasharray="3 2"/><circle cx="61.0" cy="140.7" r="4.5" fill="#b45309" stroke="#fff" stroke-width="1.6"/><text x="58.0" y="207.0" text-anchor="end" font-size="13.5" font-weight="400" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">Km</text><text x="29.0" y="134.7" text-anchor="start" font-size="13.5" font-weight="400" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">Vmax/2</text><text x="301.0" y="83.4" text-anchor="end" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">Vmax</text><text x="303.0" y="207.0" text-anchor="end" font-size="13.5" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">[S]</text><text x="27.0" y="71.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">v</text><text x="48.0" y="162.0" text-anchor="middle" font-size="13.5" font-weight="400" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">一级</text><text x="191.0" y="162.0" text-anchor="middle" font-size="13.5" font-weight="400" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">零级（饱和）</text><rect x="15.0" y="222.0" width="300.0" height="42.0" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="27.0" y="242.0" text-anchor="start" font-size="14" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">[S] = Km → v = Vmax/2</text><text x="305.0" y="242.0" text-anchor="end" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">必背</text><text x="27.0" y="259.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">Km 单位是浓度，是半速底物浓度</text><rect x="15.0" y="274.0" width="300.0" height="42.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="27.0" y="294.0" text-anchor="start" font-size="14" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">Km 小 → 亲和力高</text><text x="305.0" y="294.0" text-anchor="end" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">反比</text><text x="27.0" y="311.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">Km 是亲和力的倒数度量</text><rect x="15.0" y="326.0" width="300.0" height="102.0" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="25.0" y="345.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">两个易混的「常数」</text><text x="25.0" y="363.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· Km：与酶浓度无关，随底物种类/pH/温度/</text><text x="25.0" y="379.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">离子强度而变 → 反映亲和力</text><text x="25.0" y="395.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· Vmax：= kcat·[E]总，随酶量变 → 反映</text><text x="25.0" y="411.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">酶量；kcat 才是固有催化常数</text><rect x="15.0" y="436.0" width="300.0" height="44.0" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/><text x="25.0" y="452.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">易错：Km 越大亲和力越「强」——恰恰相反，</text><text x="25.0" y="468.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">Km 越大亲和力越弱</text><rect x="11.0" y="485.0" width="308.0" height="51.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="165.0" y="500.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">Km 是半速底物浓度（越小越亲和）；Vmax 随酶</text><text x="165.0" y="515.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">量变，不是固有常数</text></svg>