<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 640" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="米氏方程：Km 与 Vmax 的物理意义"><title>米氏方程：Km 与 Vmax 的物理意义</title><desc>米氏方程 v = Vmax·[S]/(Km+[S])；Km 是初速度为半数 Vmax 时的底物浓度，与亲和力成反比；Vmax = kcat·[E]总，随酶量变化。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">米氏方程：Km 与 Vmax 的物理意义</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Km 是半速底物浓度（越小越亲和）；Vmax 随酶量变，不是</text><text x="18.0" y="68.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">固有常数</text><rect x="18.0" y="82.0" width="364.0" height="26.0" rx="6" fill="#e2f5f2"/><text x="200.0" y="99.5" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">v = Vmax · [S] / (Km + [S])</text><rect x="18.0" y="116.0" width="364.0" height="196.0" rx="9" fill="#ffffff" stroke="#e3eaf2" stroke-width="1.1"/><line x1="50.0" y1="158.1" x2="54.0" y2="158.1" stroke="#cbd8e4" stroke-width="1" stroke-linecap="round"/><text x="47.0" y="162.1" text-anchor="end" font-size="12" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Vmax</text><line x1="54.0" y1="158.1" x2="370.0" y2="158.1" stroke="#f1f6fa" stroke-width="1" stroke-linecap="round"/><line x1="50.0" y1="214.1" x2="54.0" y2="214.1" stroke="#cbd8e4" stroke-width="1" stroke-linecap="round"/><text x="47.0" y="218.1" text-anchor="end" font-size="12" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">½Vmax</text><line x1="54.0" y1="214.1" x2="370.0" y2="214.1" stroke="#f1f6fa" stroke-width="1" stroke-linecap="round"/><line x1="50.0" y1="270.0" x2="54.0" y2="270.0" stroke="#cbd8e4" stroke-width="1" stroke-linecap="round"/><text x="47.0" y="274.0" text-anchor="end" font-size="12" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">0</text><text x="47.0" y="127.0" text-anchor="end" font-size="11.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">初速度 v</text><line x1="133.0" y1="270.0" x2="133.0" y2="273.0" stroke="#cbd8e4" stroke-width="1" stroke-linecap="round"/><text x="133.0" y="309.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Km</text><line x1="243.6" y1="270.0" x2="243.6" y2="273.0" stroke="#cbd8e4" stroke-width="1" stroke-linecap="round"/><line x1="370.0" y1="270.0" x2="370.0" y2="273.0" stroke="#cbd8e4" stroke-width="1" stroke-linecap="round"/><text x="370.0" y="324.0" text-anchor="end" font-size="11.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">底物浓度 [S]</text><rect x="54.0" y="279.0" width="94.8" height="18.0" rx="4" fill="#eef2f7" stroke="#4a5a6b" stroke-width="1"/><text x="101.4" y="291.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一级（正比）</text><rect x="148.8" y="279.0" width="101.1" height="18.0" rx="4" fill="#eef2f7" stroke="#4a5a6b" stroke-width="1"/><text x="199.4" y="291.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">混合</text><rect x="249.9" y="279.0" width="120.1" height="18.0