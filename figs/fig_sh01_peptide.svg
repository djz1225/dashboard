<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 517.5" width="100%" style="max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px" role="img"><text x="165.0" y="22.6" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">肽键：为何不能自由旋转</text><text x="165.0" y="42.6" text-anchor="middle" font-size="13.5" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">C—N 有约 40% 双键性质 → 六个原子共处一平面</text><rect x="21.0" y="57.5" width="288.0" height="62.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/><rect x="31.0" y="67.5" width="88.0" height="28.0" rx="4" fill="#ffffff" stroke="#0f766e" stroke-width="1.3"/><text x="75.0" y="86.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">肽平面 1</text><rect x="127.0" y="67.5" width="88.0" height="28.0" rx="4" fill="#ffffff" stroke="#0f766e" stroke-width="1.3"/><text x="171.0" y="86.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">肽平面 2</text><rect x="223.0" y="67.5" width="88.0" height="28.0" rx="4" fill="#ffffff" stroke="#0f766e" stroke-width="1.3"/><text x="267.0" y="86.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">肽平面 3</text><text x="165.0" y="111.5" text-anchor="middle" font-size="13.5" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">Cα—CO—NH—Cα 刚性共面；只有 Cα 两侧 φ/ψ 可转</text><rect x="15.0" y="129.5" width="146.0" height="56.0" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/><text x="88.0" y="148.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">φ（phi）</text><text x="88.0" y="165.5" text-anchor="middle" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">Cα—N 键旋转角</text><rect x="169.0" y="129.5" width="146.0" height="56.0" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/><text x="242.0" y="148.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">ψ（psi）</text><text x="242.0" y="165.5" text-anchor="middle" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">Cα—C 键旋转角</text><rect x="15.0" y="193.5" width="300.0" height="42.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="27.0" y="213.5" text-anchor="start" font-size="14" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">肽键构型</text><text x="305.0" y="213.5" text-anchor="end" font-size="13.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">反式</text><text x="27.0" y="230.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">反式为主；Pro 可顺式，故常成拐点</text><rect x="15.0" y="245.5" width="300.0" height="38.0" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/><text x="27.0" y="265.5" text-anchor="start" font-size="14" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">① 刚性主链</text><text x="27.0" y="283.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">构象自由度被压缩到 2 个角</text><line x1="165.0" y1="284.5" x2="165.0" y2="286.0" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/><polygon points="165.0,290.5 163.0,285.9 167.0,285.9" fill="#64748b"/><rect x="15.0" y="291.5" width="300.0" height="38.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/><text x="27.0" y="311.5" text-anchor="start" font-size="14" font-weight="700" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">② 可规则重复</text><text x="27.0" y="329.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">φ/ψ 周期性取值 → α 螺旋、β 折叠</text><line x1="165.0" y1="330.5" x2="165.0" y2="332.0" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/><polygon points="165.0,336.5 163.0,331.9 167.0,331.9" fill="#64748b"/><rect x="15.0" y="337.5" width="300.0" height="38.0" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/><text x="27.0" y="357.5" text-anchor="start" font-size="14" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">③ 结构可预测</text><text x="27.0" y="375.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">这就是二级结构能自发形成的前提</text><rect x="15.0" y="377.5" width="300.0" height="76.0" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/><text x="25.0" y="393.5" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">易错：二硫键属一级结构的共价交联（</text><text x="25.0" y="409.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">也在三级中稳定构象）</text><text x="25.0" y="425.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">但肽键才是连接氨基酸的键——别把两者混成一</text><text x="25.0" y="441.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">句</text><rect x="11.0" y="458.5" width="308.0" height="51.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="165.0" y="473.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">肽键平面刚而不转；只有 φ/ψ 可转，才折得出 </text><text x="165.0" y="489.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">α 螺旋与 β 折叠</text></svg>