<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 558" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="肽键与肽链的方向性"><title>肽键与肽链的方向性</title><desc>肽键的 C—N 具约 40% 双键性质，六个原子共处一平面，不能自由旋转；只有 Cα 两侧的 φ、ψ 可旋转，因而能规则重复形成 α 螺旋与 β 折叠。肽链有 N 端到 C 端的方向性。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肽键与肽链的方向性</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">C—N 有约 40% 双键性质 → 六个原子共面；链有 N 端与 C 端，</text><text x="18.0" y="68.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">方向不可逆</text><rect x="18.0" y="82.0" width="364.0" height="115.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="101.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肽平面：刚而不转</text><rect x="30.0" y="112.0" width="59.2" height="34.0" rx="6" fill="#e6f6ec" stroke="#2f8f57" stroke-width="1.1"/><text x="59.6" y="127.0" text-anchor="middle" font-size="12" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">N 端</text><text x="59.6" y="140.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">NH₃⁺</text><line x1="90.2" y1="129.0" x2="99.2" y2="129.0" stroke="#8095a8" stroke-width="1.1" stroke-linecap="round"/><line x1="99.2" y1="129.0" x2="95.7" y2="130.9" stroke="#8095a8" stroke-width="1.1" stroke-linecap="round"/><line x1="99.2" y1="129.0" x2="95.7" y2="127.1" stroke="#8095a8" stroke-width="1.1" stroke-linecap="round"/><rect x="100.2" y="112.0" width="59.2" height="34.0" rx="6" fill="#eef2f7" stroke="#4a5a6b" stroke-width="1.1"/><text x="129.8" y="127.0" text-anchor="middle" font-size="12" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Cα</text><text x="129.8" y="140.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">φ/ψ</text><line x1="160.4" y1="129.0" x2="169.4" y2="129.0" stroke="#8095a8" stroke-width="1.1" stroke-linecap="round"/><line x1="169.4" y1="129.0" x2="165.9" y2="130.9" stroke="#8095a8" stroke-width="1.1" stroke-linecap="round"/><line x1="169.4" y1="129.0" x2="165.9" y2="127.1" stroke="#8095a8" stroke-width="1.1" stroke-linecap="round"/><rect x="170.4" y="112.0" width="59.2" height="34.0" rx="6" fill="#fde8dd" stroke="#c1440e" stroke-width="1.1"/><text x="200.0" y="127.0" text-anchor="middle" font-size="12" font-weight="700" fill="#c1440e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肽键</text><text x="200.0" y="140.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#c1440e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">C—N</text><line x1="230.6" y1="129.0" x2="239.6" y2="129.0" stroke="#8095a8" stroke-width="1.1" stroke-linecap="round"/><line x1="239.6" y1="129.0" x2="236.1" y2="130.9" stroke="#8095a8" stroke-width="1.1" stroke-linecap="round"/><line x1="239.6" y1="129.0" x2="236.1" y2="127.1" stroke="#8095a8" stroke-width="1.1" stroke-linecap="round"/><rect x="240.6" y="112.0" width="59.2" height="34.0" rx="6" fill="#eef2f7" stroke="#4a5a6b" stroke-width="1.1"/><text x="270.2" y="127.0" text-anchor="middle" font-size="12" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Cα</text><text x="270.2" y="140.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">φ/ψ</text><line x1="300.8" y1="129.0" x2="309.8" y2="129.0" stroke="#8095a8" stroke-width="1.1" stroke-linecap="round"/><line x1="309.8" y1="129.0" x2="306.3" y2="130.9" stroke="#8095a8" stroke-width="1.1" stroke-linecap="round"/><line x1="309.8" y1="129.0" x2="306.3" y2="127.1" stroke="#8095a8" stroke-width="1.1" stroke-linecap="round"/><rect x="310.8" y="112.0" width="59.2" height="34.0" rx="6" fill="#fdeceb" stroke="#c0392b" stroke-width="1.1"/><text x="340.4" y="127.0" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">C 端</text><text x="340.4" y="140.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">COO⁻</text><text x="30.0" y="164.0" font-size="12.5" font-weight="700" fill="#c1440e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Cα—CO—NH—Cα</text><text x="143.8" y="164.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">六个原子共处一平面，肽键不能自由旋转</text><text x="30.0" y="183.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">只有 Cα 两侧的 φ（Cα—N）与 ψ（Cα—C）可转</text><rect x="18.0" y="209.0" width="364.0" height="153.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="228.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">三个后果</text><rect x="30.0" y="239.0" width="3.0" height="15.0" rx="1.5" fill="#c1440e"/><text x="39.0" y="252.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">刚性主链</text><text x="370.0" y="252.0" text-anchor="end" font-size="12" font-weight="700" fill="#c1440e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">自由度 2</text><text x="39.0" y="270.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">构象自由度被压缩到 φ、ψ 两个角</text><rect x="30.0" y="281.0" width="3.0" height="15.0" rx="1.5" fill="#1f6fb2"/><text x="39.0" y="294.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">可规则重复</text><text x="370.0" y="294.0" text-anchor="end" font-size="12" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">折得出</text><text x="39.0" y="312.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">φ/ψ 周期性取值 → α 螺旋、β 折叠</text><rect x="30.0" y="323.0" width="3.0" height="15.0" rx="1.5" fill="#2f8f57"/><text x="39.0" y="336.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">可预测</text><text x="370.0" y="336.0" text-anchor="end" font-size="12" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">前提</text><text x="39.0" y="354.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">这就是二级结构能自发形成的原因</text><rect x="18.0" y="374.0" width="177.0" height="84.0" rx="9" fill="#e2f5f2" stroke="#0f766e" stroke-width="1.1"/><text x="29.0" y="395.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">反式为主</text><text x="29.0" y="414.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肽键构型以反式为主</text><text x="29.0" y="434.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Pro 可呈顺式，故常成拐点</text><rect x="205.0" y="374.0" width="177.0" height="84.0" rx="9" fill="#eef2f7" stroke="#4a5a6b" stroke-width="1.1"/><text x="216.0" y="395.0" font-size="12.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">二硫键不是肽键</text><text x="216.0" y="414.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">属一级结构的共价交联</text><text x="216.0" y="434.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">也参与稳定三级结构</text><rect x="18.0" y="468.0" width="364.0" height="70.0" rx="8" fill="#eef2f7"/><rect x="18.0" y="468.0" width="3.5" height="70.0" rx="1.8" fill="#4a5a6b"/><text x="32.0" y="488.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="505.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肽键平面刚而不转；只有 φ/ψ 可转，才折得出 α 螺</text><text x="32.0" y="524.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">旋与 β 折叠。</text></svg>