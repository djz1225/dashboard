<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 504" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="Chargaff 规则与碱基组成计算"><title>Chargaff 规则与碱基组成计算</title><desc>双链 DNA 中 A=T、G=C，故嘌呤总数等于嘧啶总数，A+G=T+C=50%；(A+T)/(G+C) 为物种特异的碱基组成比。该规则只对双链 DNA 成立。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Chargaff 规则与碱基组成计算</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">双链 DNA：A=T、G=C，所以 A+G = T+C；单链与 RNA 不成立</text><rect x="18.0" y="65.0" width="364.0" height="172.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="84.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">配对的算术</text><rect x="34.0" y="99.0" width="34.0" height="22.0" rx="5" fill="#fdeceb" stroke="#c0392b" stroke-width="1.1"/><text x="51.0" y="115.0" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">A</text><rect x="76.0" y="99.0" width="34.0" height="22.0" rx="5" fill="#fdeceb" stroke="#c0392b" stroke-width="1.1"/><text x="93.0" y="115.0" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">T</text><text x="124.0" y="114.0" font-size="12" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">A = T（2 个氢键）</text><rect x="34.0" y="129.0" width="34.0" height="22.0" rx="5" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1.1"/><text x="51.0" y="145.0" text-anchor="middle" font-size="12" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">G</text><rect x="76.0" y="129.0" width="34.0" height="22.0" rx="5" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1.1"/><text x="93.0" y="145.0" text-anchor="middle" font-size="12" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">C</text><text x="124.0" y="144.0" font-size="12" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">G ≡ C（3 个氢键，更稳）</text><rect x="34.0" y="161.0" width="332.0" height="26.0" rx="6" fill="#e2f5f2"/><text x="200.0" y="178.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">嘌呤总数 = 嘧啶总数 ⇒ A + G = T + C = 50%</text><text x="34.0" y="203.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">算例：若 A = 30%</text><text x="34.0" y="221.0" font-size="12.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">→ T = 30%，G = C = 20%（A+T 共占 60%）</text><rect x="18.0" y="249.0" width="364.0" height="153.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="268.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">三个推论</text><rect x="30.0" y="279.0" width="3.0" height="15.0" rx="1.5" fill="#0f766e"/><text x="39.0" y="292.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">碱基组成比</text><text x="370.0" y="292.0" text-anchor="end" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">(A+T)/(G+C)</text><text x="39.0" y="310.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">又称碱基组成比，物种特异，可用于分类</text><rect x="30.0" y="321.0" width="3.0" height="15.0" rx="1.5" fill="#2f8f57"/><text x="39.0" y="334.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">同一个体的不同组织</text><text x="370.0" y="334.0" text-anchor="end" font-size="12" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">相同</text><text x="39.0" y="352.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">碱基组成不随组织、年龄、营养状态改变</text><rect x="30.0" y="363.0" width="3.0" height="15.0" rx="1.5" fill="#b45309"/><text x="39.0" y="376.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">单链 DNA 与 RNA</text><text x="370.0" y="376.0" text-anchor="end" font-size="12" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">不成立</text><text x="39.0" y="394.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">单链病毒的 A/T 可以不等于 1，不能拿规则去算</text><rect x="18.0" y="414.0" width="364.0" height="70.0" rx="8" fill="#e2f5f2"/><rect x="18.0" y="414.0" width="3.5" height="70.0" rx="1.8" fill="#0f766e"/><text x="32.0" y="434.0" font-size="11.5" font-weight="700" fill="#0f766e" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="451.0" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">A=T、G=C 靠氢键（A-T 两个、G-C 三个）；Chargaff</text><text x="32.0" y="470.0" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">规则只适用于双链 DNA。</text></svg>