<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 432" width="100%" style="max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px" role="img"><text x="165.0" y="22.6" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">Chargaff 规则与碱基配对</text><text x="165.0" y="43.0" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">双链 DNA：A=T、G=C；所以 A+G = T+C</text><rect x="15.0" y="58.0" width="300.0" height="88.0" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><rect x="31.0" y="71.0" width="42.0" height="26.0" rx="5" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.3"/><text x="52.0" y="89.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">A</text><rect x="257.0" y="71.0" width="42.0" height="26.0" rx="5" fill="#fee2e2" stroke="#0f766e" stroke-width="1.3"/><text x="278.0" y="89.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">T</text><path d="M81,79 V89" stroke="#64748b" stroke-width="1.2" stroke-dasharray="2 2"/><path d="M97,79 V89" stroke="#64748b" stroke-width="1.2" stroke-dasharray="2 2"/><text x="165.0" y="88.0" text-anchor="middle" font-size="11.2" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">2 个氢键</text><rect x="31.0" y="105.0" width="42.0" height="26.0" rx="5" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.3"/><text x="52.0" y="123.0" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">G</text><rect x="257.0" y="105.0" width="42.0" height="26.0" rx="5" fill="#ccfbf1" stroke="#b91c1c" stroke-width="1.3"/><text x="278.0" y="123.0" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">C</text><path d="M81,113 V123" stroke="#64748b" stroke-width="1.2" stroke-dasharray="2 2"/><path d="M97,113 V123" stroke="#64748b" stroke-width="1.2" stroke-dasharray="2 2"/><path d="M113,113 V123" stroke="#64748b" stroke-width="1.2" stroke-dasharray="2 2"/><text x="165.0" y="122.0" text-anchor="middle" font-size="11.2" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">3 个氢键</text><rect x="15.0" y="154.0" width="300.0" height="42.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.1"/><text x="25.0" y="172.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">双链 DNA</text><text x="25.0" y="188.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">嘌呤总数 = 嘧啶总数</text><text x="305.0" y="178.0" text-anchor="end" font-size="14" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">A = T，G = C</text><rect x="15.0" y="200.0" width="300.0" height="42.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.1"/><text x="25.0" y="218.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">A + G</text><text x="25.0" y="234.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">各占 50%</text><text x="305.0" y="224.0" text-anchor="end" font-size="14" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">= T + C</text><rect x="15.0" y="246.0" width="300.0" height="42.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.1"/><text x="25.0" y="264.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">(A+T)/(G+C)</text><text x="25.0" y="280.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">又称「碱基组成比」</text><text x="305.0" y="270.0" text-anchor="end" font-size="14" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">物种特异</text><rect x="15.0" y="292.0" width="300.0" height="76.0" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/><text x="25.0" y="308.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">易错：Chargaff 规则只对双链 DNA 成立，</text><text x="25.0" y="324.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">单链 DNA 与 RNA 不成立</text><text x="25.0" y="340.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">所以单链病毒的 A/T 可以不等于 1，</text><text x="25.0" y="356.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">不能拿规则去算</text><rect x="11.0" y="373.0" width="308.0" height="51.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="165.0" y="388.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">A=T、G=C 靠氢键（A-T 两个、G-C 三个）；</text><text x="165.0" y="403.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">规则只适用于双链 DNA</text></svg>