<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 613" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="20 种氨基酸：只看侧链"><title>20 种氨基酸：只看侧链</title><desc>20 种氨基酸按侧链分为非极性脂肪族 7 种、芳香族 3 种、极性不带电 5 种、酸性 2 种、碱性 3 种；Cys 成二硫键、Pro 断螺旋、His 常为催化基团。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">20 种氨基酸：只看侧链</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">主链完全一样，性质全由侧链决定——非极性 / 极性 / 酸性</text><text x="18.0" y="68.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"> /碱性</text><rect x="18.0" y="82.0" width="364.0" height="26.0" rx="6" fill="#f8fbfd"/><text x="26.0" y="99.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">分类</text><text x="120.6" y="99.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">成员与数量</text><text x="266.2" y="99.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话机制</text><line x1="18.0" y1="150.0" x2="382.0" y2="150.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="126.0" font-size="12.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">非极性脂肪7</text><text x="120.6" y="126.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Gly Ala Val Leu Ile</text><text x="120.6" y="142.0" font-size="12