<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 625" width="100%" style="max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px" role="img"><text x="165.0" y="22.6" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">20 种氨基酸：按侧链分五类</text><text x="165.0" y="43.0" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">判断性质只看侧链——主链都一样</text><rect x="15.0" y="58.0" width="300.0" height="52.0" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="26.0" y="78.0" text-anchor="start" font-size="14" font-weight="700" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">非极性脂肪族（7）</text><text x="304.0" y="78.0" text-anchor="end" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">疏水，构成蛋白内核</text><text x="26.0" y="98.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">Gly Ala Val Leu Ile Pro Met</text><rect x="15.0" y="115.0" width="300.0" height="52.0" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="26.0" y="135.0" text-anchor="start" font-size="14" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">芳香族（3）</text><text x="304.0" y="135.0" text-anchor="end" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">疏水；Trp/Tyr 管 280nm 吸收</text><text x="26.0" y="155.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">Phe Tyr Trp</text><rect x="15.0" y="172.0" width="300.0" height="52.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/><text x="26.0" y="192.0" text-anchor="start" font-size="14" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">极性不带电（5）</text><text x="304.0" y="192.0" text-anchor="end" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">可形成氢键，多在表面</text><text x="26.0" y="212.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">Ser Thr Cys Asn Gln</text><rect x="15.0" y="229.0" width="300.0" height="52.0" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/><text x="26.0" y="249.0" text-anchor="start" font-size="14" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">酸性（2）</text><text x="304.0" y="249.0" text-anchor="end" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">带负电，pI 偏酸</text><text x="26.0" y="269.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">Asp Glu</text><rect x="15.0" y="286.0" width="300.0" height="52.0" rx="7" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="26.0" y="306.0" text-anchor="start" font-size="14" font-weight="700" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">碱性（3）</text><text x="304.0" y="306.0" text-anchor="end" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">带正电，pI 偏碱</text><text x="26.0" y="326.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">Lys Arg His</text><rect x="15.0" y="343.0" width="300.0" height="134.0" rx="7" fill="#ccfbf1" stroke="#cbd5e1" stroke-width="1.4"/><text x="25.0" y="362.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">三个必背特例</text><text x="25.0" y="380.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· Cys：含 —SH，可形成二硫键（唯一共价交</text><text x="25.0" y="396.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">联）</text><text x="25.0" y="412.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· Pro：环状亚氨基酸，使 α 螺旋在此中断（</text><text x="25.0" y="428.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">拐点）</text><text x="25.0" y="444.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· His：侧链咪唑基 pKa≈6.0，可在生理 pH </text><text x="25.0" y="460.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">附近供/受质子，是许多酶的催化位点</text><rect x="15.0" y="485.0" width="300.0" height="76.0" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/><text x="25.0" y="501.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">易错：芳香族是 Trp、Tyr、Phe（三种），</text><text x="25.0" y="517.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">不是两种</text><text x="25.0" y="533.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">280 nm 吸收主要来自 Trp 与 Tyr，Phe 贡</text><text x="25.0" y="549.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">献很小</text><rect x="11.0" y="566.0" width="308.0" height="51.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="165.0" y="581.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">判断氨基酸性质只看侧链；Cys 管二硫键、Pro </text><text x="165.0" y="596.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">断螺旋、His 当催化基团</text></svg>