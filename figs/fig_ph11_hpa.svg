<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 649" width="100%" style="max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px" role="img"><text x="165.0" y="22.6" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">下丘脑-垂体-靶腺轴</text><text x="165.0" y="43.0" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">三级结构，每级都有负反馈</text><rect x="15.0" y="60.0" width="300.0" height="54.0" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/><text x="27.0" y="80.0" text-anchor="start" font-size="14" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">下丘脑</text><text x="27.0" y="98.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">释放释放激素（TRH、CRH、GnRH、GHRH、</text><text x="27.0" y="114.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">多巴胺）</text><line x1="165.0" y1="115.0" x2="165.0" y2="115.5" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/><polygon points="165.0,120.0 163.0,115.4 167.0,115.4" fill="#64748b"/><rect x="15.0" y="121.0" width="300.0" height="54.0" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/><text x="27.0" y="141.0" text-anchor="start" font-size="14" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">腺垂体</text><text x="27.0" y="159.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">分泌促激素（TSH、ACTH、FSH/LH、GH、</text><text x="27.0" y="175.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">PRL）</text><line x1="165.0" y1="176.0" x2="165.0" y2="176.5" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/><polygon points="165.0,181.0 163.0,176.4 167.0,176.4" fill="#64748b"/><rect x="15.0" y="182.0" width="300.0" height="38.0" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.4"/><text x="27.0" y="202.0" text-anchor="start" font-size="14" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">靶腺</text><text x="27.0" y="220.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">甲状腺、肾上腺皮质、性腺</text><line x1="165.0" y1="221.0" x2="165.0" y2="221.5" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/><polygon points="165.0,226.0 163.0,221.4 167.0,221.4" fill="#64748b"/><rect x="15.0" y="227.0" width="300.0" height="38.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/><text x="27.0" y="247.0" text-anchor="start" font-size="14" font-weight="700" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">靶腺激素</text><text x="27.0" y="265.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">T₃/T₄、皮质醇、性激素 → 产生效应</text><rect x="15.0" y="267.0" width="300.0" height="44.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="27.0" y="287.0" text-anchor="start" font-size="14" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">负反馈</text><text x="27.0" y="304.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">靶腺激素回升 → 抑制下丘脑与垂体（</text><text x="27.0" y="320.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">长环反馈）</text><rect x="15.0" y="317.0" width="300.0" height="42.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="27.0" y="337.0" text-anchor="start" font-size="14" font-weight="700" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">短环反馈</text><text x="27.0" y="354.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">垂体促激素抑制下丘脑</text><rect x="15.0" y="369.0" width="300.0" height="134.0" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="25.0" y="388.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">两个特殊点</text><text x="25.0" y="406.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 神经垂体（后叶）只储存、不合成：ADH 与</text><text x="25.0" y="422.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">催产素由下丘脑合成</text><text x="25.0" y="438.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 催乳素（PRL）受下丘脑「抑制」为主（</text><text x="25.0" y="454.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">多巴胺），不是促进</text><text x="25.0" y="470.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 垂体门脉系统：下丘脑激素经血液直达腺垂</text><text x="25.0" y="486.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">体，不被稀释</text><rect x="15.0" y="511.0" width="300.0" height="76.0" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/><text x="25.0" y="527.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">原发 vs 继发：原发靶腺病变 → 靶腺激素↓、</text><text x="25.0" y="543.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">促激素↑；继发垂体病变 → 两者都↓</text><text x="25.0" y="559.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">长期用糖皮质激素后突然停药 → 肾上腺皮质萎</text><text x="25.0" y="575.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">缩 → 肾上腺危象，必须逐渐减量</text><rect x="11.0" y="590.0" width="308.0" height="51.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="165.0" y="605.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">下丘脑→垂体→靶腺三级，靠负反馈闭环；</text><text x="165.0" y="620.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">原发病变时促激素升高、继发时降低</text></svg>