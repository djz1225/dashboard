<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 773" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="下丘脑-垂体-靶腺轴：三级链＋三级反馈"><title>下丘脑-垂体-靶腺轴：三级链＋三级反馈</title><desc>下丘脑释放激素 → 腺垂体促激素 → 靶腺 → 靶腺激素，靶腺激素长环负反馈抑制下丘脑与垂体；神经垂体只储存 ADH 与催产素；PRL 以多巴胺抑制为主；原发病变促激素升高、继发病变降低。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">下丘脑-垂体-靶腺轴：三级链＋三级反馈</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">每一级都被下一级的产物回头抑制</text><rect x="18.0" y="65.0" width="364.0" height="300.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="83.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">三级纵向链</text><rect x="64.0" y="93.0" width="176.0" height="42.0" rx="8" fill="#e2f5f2" stroke="#0f766e" stroke-width="1.1"/><text x="74.0" y="110.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">下丘脑</text><text x="74.0" y="127.0" font-size="11" font-weight="400" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">TRH · CRH · GnRH · GHRH</text><circle cx="47" cy="114" r="8.5" fill="#0f766e"/><text x="47.0" y="118.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">1</text><line x1="86.0" y1="137.0" x2="86.0" y2="161.0" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="86.0" y1="161.0" x2="82.9" y2="155.3" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="86.0" y1="161.0" x2="89.1" y2="155.3" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><rect x="64.0" y="161.0" width="176.0" height="42.0" rx="8" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1.1"/><text x="74.0" y="178.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">腺垂体</text><text x="74.0" y="195.0" font-size="11" font-weight="400" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">TSH · ACTH · FSH/LH · GH</text><circle cx="47" cy="182" r="8.5" fill="#1f6fb2"/><text x="47.0" y="186.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">2</text><line x1="86.0" y1="205.0" x2="86.0" y2="229.0" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="86.0" y1="229.0" x2="82.9" y2="223.3" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="86.0" y1="229.0" x2="89.1" y2="223.3" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><rect x="64.0" y="229.0" width="176.0" height="42.0" rx="8" fill="#f2ecfb" stroke="#7b4bb7" stroke-width="1.1"/><text x="74.0" y="246.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">靶腺</text><text x="74.0" y="263.0" font-size="11" font-weight="400" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">甲状腺 · 肾上腺皮质 · 性腺</text><circle cx="47" cy="250" r="8.5" fill="#7b4bb7"/><text x="47.0" y="254.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">3</text><line x1="86.0" y1="273.0" x2="86.0" y2="297.0" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="86.0" y1="297.0" x2="82.9" y2="291.3" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="86.0" y1="297.0" x2="89.1" y2="291.3" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><rect x="64.0" y="297.0" width="176.0" height="42.0" rx="8" fill="#fdeceb" stroke="#c0392b" stroke-width="1.1"/><text x="74.0" y="314.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">靶腺激素</text><text x="74.0" y="331.0" font-size="11" font-weight="400" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">T₃T₄ · 皮质醇 · 性激素</text><circle cx="47" cy="318" r="8.5" fill="#c0392b"/><text x="47.0" y="322.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">4</text><polyline points="240.0,318.0 266.0,318.0 266.0,114.0" fill="none" stroke="#b45309" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 3"/><line x1="266.0" y1="118.0" x2="242.0" y2="114.0" stroke="#b45309" stroke-width="1.6" stroke-linecap="round"/><line x1="242.0" y1="114.0" x2="247.7" y2="112.0" stroke="#b45309" stroke-width="1.6" stroke-linecap="round"/><line x1="242.0" y1="114.0" x2="246.7" y2="117.7" stroke="#b45309" stroke-width="1.6" stroke-linecap="round"/><text x="272.0" y="106.0" font-size="10.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">负反馈</text><rect x="18.0" y="377.0" width="364.0" height="145.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="395.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">三个特殊点</text><rect x="31.0" y="405.0" width="3.0" height="15.0" rx="1.5" fill="#1f6fb2"/><text x="40.0" y="418.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">神经垂体</text><text x="344.0" y="418.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">只储存不合成</text><text x="40.0" y="436.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">ADH 与催产素由下丘脑合成、沿轴突运至后叶释放</text><rect x="31.0" y="444.0" width="3.0" height="15.0" rx="1.5" fill="#b45309"/><text x="40.0" y="457.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">催乳素 PRL</text><text x="344.0" y="457.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">抑制为主</text><text x="40.0" y="475.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">下丘脑以多巴胺持续抑制其分泌（断乳即泌乳）</text><rect x="31.0" y="483.0" width="3.0" height="15.0" rx="1.5" fill="#0f766e"/><text x="40.0" y="496.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">垂体门脉</text><text x="344.0" y="496.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">不经体循环</text><text x="40.0" y="514.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">下丘脑激素直达腺垂体，浓度高、作用快</text><rect x="18.0" y="534.0" width="177.0" height="120.0" rx="9" fill="#fef3c7" stroke="#b45309" stroke-width="1.1"/><text x="29.0" y="555.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">原发靶腺病变</text><text x="29.0" y="574.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">靶腺激素↓、促激素↑</text><text x="29.0" y="594.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">如原发甲减：T₃T₄↓、T</text><text x="29.0" y="610.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">SH↑</text><text x="29.0" y="630.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">病变在靶腺，垂体在努力</text><rect x="205.0" y="534.0" width="177.0" height="120.0" rx="9" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1.1"/><text x="216.0" y="555.0" font-size="12.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">继发垂体病变</text><text x="216.0" y="574.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">靶腺激素↓、促激素↓</text><text x="216.0" y="594.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">如垂体瘤压迫：T₃T₄↓、</text><text x="216.0" y="610.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">TSH↓</text><text x="216.0" y="630.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">病变在垂体，靶腺被饿死</text><rect x="18.0" y="664.0" width="364.0" height="89.0" rx="8" fill="#eef2f7"/><rect x="18.0" y="664.0" width="3.5" height="89.0" rx="1.8" fill="#4a5a6b"/><text x="32.0" y="684.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="701.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">原发靶腺病 → 促激素升高；继发病变 → 促激素降低。</text><text x="32.0" y="720.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">长期用糖皮质激素后骤停 → 皮质萎缩、肾上腺危象，</text><text x="32.0" y="739.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">必须渐减。</text></svg>