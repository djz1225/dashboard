<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 616" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="胰液与胆汁：消化两大主力"><title>胰液与胆汁：消化两大主力</title><desc>胰液含 HCO₃⁻ 与全套消化酶（最全面），蛋白酶以酶原分泌、由肠激酶激活；胆汁不含消化酶，胆盐乳化脂肪形成微胶粒促进吸收，胆囊收缩靠 CCK。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胰液与胆汁：消化两大主力</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胰液最全面，胆汁只管乳化脂肪</text><rect x="18.0" y="65.0" width="364.0" height="263.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="83.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">酶原激活：级联放大的起点</text><rect x="30.0" y="93.0" width="316.0" height="44.0" rx="8" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1.1"/><rect x="30.0" y="93.0" width="3.2" height="44.0" rx="1.6" fill="#1f6fb2"/><circle cx="48" cy="110" r="8.5" fill="#1f6fb2"/><text x="48.0" y="114.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">1</text><text x="63.0" y="114.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胰蛋白酶原</text><text x="335.0" y="114.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">酶原</text><text x="63.0" y="131.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胰液中以酶原形式分泌，避免自我消化</text><line x1="48.0" y1="139.0" x2="48.0" y2="152.0" stroke="#4a5a6b" stroke-width="1.8" stroke-linecap="round"/><line x1="48.0" y1="152.0" x2="44.6" y2="145.9" stroke="#4a5a6b" stroke-width="1.8" stroke-linecap="round"/><line x1="48.0" y1="152.0" x2="51.4" y2="145.9" stroke="#4a5a6b" stroke-width="1.8" stroke-linecap="round"/><rect x="30.0" y="154.0" width="316.0" height="44.0" rx="8" fill="#f2ecfb" stroke="#7b4bb7" stroke-width="1.1"/><rect x="30.0" y="154.0" width="3.2" height="44.0" rx="1.6" fill="#7b4bb7"/><circle cx="48" cy="171" r="8.5" fill="#7b4bb7"/><text x="48.0" y="175.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">2</text><text x="63.0" y="175.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肠激酶</text><text x="335.0" y="175.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">激活物</text><text x="63.0" y="192.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">小肠黏膜分泌，切下六肽 → 胰蛋白酶</text><line x1="48.0" y1="200.0" x2="48.0" y2="213.0" stroke="#4a5a6b" stroke-width="1.8" stroke-linecap="round"/><line x1="48.0" y1="213.0" x2="44.6" y2="206.9" stroke="#4a5a6b" stroke-width="1.8" stroke-linecap="round"/><line x1="48.0" y1="213.0" x2="51.4" y2="206.9" stroke="#4a5a6b" stroke-width="1.8" stroke-linecap="round"/><rect x="30.0" y="215.0" width="316.0" height="44.0" rx="8" fill="#e2f5f2" stroke="#0f766e" stroke-width="1.1"/><rect x="30.0" y="215.0" width="3.2" height="44.0" rx="1.6" fill="#0f766e"/><circle cx="48" cy="232" r="8.5" fill="#0f766e"/><text x="48.0" y="236.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">3</text><text x="63.0" y="236.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">级联放大</text><text x="335.0" y="236.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">放大</text><text x="63.0" y="253.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胰蛋白酶再激活糜蛋白酶原、羧肽酶原</text><line x1="48.0" y1="261.0" x2="48.0" y2="274.0" stroke="#4a5a6b" stroke-width="1.8" stroke-linecap="round"/><line x1="48.0" y1="274.0" x2="44.6" y2="267.9" stroke="#4a5a6b" stroke-width="1.8" stroke-linecap="round"/><line x1="48.0" y1="274.0" x2="51.4" y2="267.9" stroke="#4a5a6b" stroke-width="1.8" stroke-linecap="round"/><rect x="30.0" y="276.0" width="316.0" height="44.0" rx="8" fill="#fdeceb" stroke="#c0392b" stroke-width="1.1"/><rect x="30.0" y="276.0" width="3.2" height="44.0" rx="1.6" fill="#c0392b"/><circle cx="48" cy="293" r="8.5" fill="#c0392b"/><text x="48.0" y="297.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">4</text><text x="63.0" y="297.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胰腺自身消化</text><text x="335.0" y="297.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">病理</text><text x="63.0" y="314.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">激活提前发生在胰腺内 → 急性胰腺炎</text><rect x="18.0" y="340.0" width="177.0" height="176.0" rx="9" fill="#e2f5f2" stroke="#0f766e" stroke-width="1.1"/><text x="29.0" y="361.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胰液（消化力最强）</text><text x="29.0" y="380.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">HCO₃⁻：中和胃酸、供</text><text x="29.0" y="396.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">适宜pH</text><text x="29.0" y="416.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">蛋白酶：胰蛋白酶原等需肠</text><text x="29.0" y="432.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">激酶激活</text><text x="29.0" y="452.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">脂肪酶：需胆盐协同</text><text x="29.0" y="472.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">淀粉酶：淀粉 → 麦芽糖</text><text x="29.0" y="492.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">还有核酸酶</text><rect x="205.0" y="340.0" width="177.0" height="176.0" rx="9" fill="#fef3c7" stroke="#b45309" stroke-width="1.1"/><text x="216.0" y="361.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胆汁（不含消化酶）</text><text x="216.0" y="380.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胆盐：乳化脂肪成微胶粒</text><text x="216.0" y="400.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">促脂肪吸收（物理乳化）</text><text x="216.0" y="420.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胆色素：Hb 分解产物，</text><text x="216.0" y="436.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">非消化成分</text><text x="216.0" y="456.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胆固醇、卵磷脂、无机盐</text><text x="216.0" y="476.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胆囊收缩靠 CCK</text><rect x="18.0" y="526.0" width="364.0" height="70.0" rx="8" fill="#eef2f7"/><rect x="18.0" y="526.0" width="3.5" height="70.0" rx="1.8" fill="#4a5a6b"/><text x="32.0" y="546.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="563.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胆汁靠物理乳化而非化学分解；胰蛋白酶原被肠激酶激活，</text><text x="32.0" y="582.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">是级联放大的起点，也是急性胰腺炎自我消化的关键。</text></svg>