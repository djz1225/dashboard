<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 530" width="100%" style="max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px" role="img"><text x="165.0" y="22.6" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">胰液与胆汁：消化两大主力</text><text x="165.0" y="43.0" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">胰液最全面，胆汁只管乳化脂肪</text><rect x="15.0" y="60.0" width="300.0" height="134.0" rx="7" fill="#ccfbf1" stroke="#cbd5e1" stroke-width="1.4"/><text x="25.0" y="79.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">胰液（消化力最强）</text><text x="25.0" y="97.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 碳酸氢盐：中和胃酸，为胰酶提供适宜 pH</text><text x="25.0" y="113.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 蛋白水解酶：胰蛋白酶原、糜蛋白酶原（</text><text x="25.0" y="129.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">需肠激酶激活）</text><text x="25.0" y="145.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 脂肪酶：胰脂肪酶（需胆盐协同）</text><text x="25.0" y="161.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 淀粉酶：分解淀粉为麦芽糖</text><text x="25.0" y="177.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 核酸酶：分解 DNA/RNA</text><rect x="15.0" y="202.0" width="300.0" height="134.0" rx="7" fill="#fef3c7" stroke="#cbd5e1" stroke-width="1.4"/><text x="25.0" y="221.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">胆汁（不含消化酶）</text><text x="25.0" y="239.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 胆盐：乳化脂肪，形成微胶粒 → 促进脂肪</text><text x="25.0" y="255.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">吸收</text><text x="25.0" y="271.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 胆色素：血红蛋白分解产物，不是消化成分</text><text x="25.0" y="287.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 胆固醇、卵磷脂、无机盐</text><text x="25.0" y="303.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 胆囊收缩靠 CCK；胆汁分泌靠促胰液素与胆</text><text x="25.0" y="319.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">盐的肠肝循环</text><rect x="15.0" y="344.0" width="300.0" height="124.0" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/><text x="25.0" y="360.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">胆汁没有消化酶——它靠「物理乳化」，</text><text x="25.0" y="376.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">不是化学分解</text><text x="25.0" y="392.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">胰蛋白酶原在肠内被肠激酶激活，这是「级联</text><text x="25.0" y="408.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">放大」的起点，也是急性胰腺炎自我消化的关</text><text x="25.0" y="424.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">键</text><text x="25.0" y="440.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">胆囊切除后脂肪消化受影响，但胆盐仍可由肝</text><text x="25.0" y="456.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">直接分泌入肠</text><rect x="11.0" y="471.0" width="308.0" height="51.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="165.0" y="486.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">胰液含全套酶（最全面）；胆汁无酶、只乳化脂</text><text x="165.0" y="501.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">肪；胰蛋白酶原靠肠激酶激活</text></svg>