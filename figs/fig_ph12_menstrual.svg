<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 563" width="100%" style="max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px" role="img"><text x="165.0" y="22.6" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">月经周期：四个激素的时序</text><text x="165.0" y="43.0" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">以排卵为界，前半卵泡期、后半黄体期</text><rect x="15.0" y="60.0" width="300.0" height="38.0" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.4"/><text x="27.0" y="80.0" text-anchor="start" font-size="14" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">① 月经期（1~5 天）</text><text x="27.0" y="98.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">雌孕激素均低 → 内膜脱落</text><line x1="165.0" y1="99.0" x2="165.0" y2="99.5" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/><polygon points="165.0,104.0 163.0,99.4 167.0,99.4" fill="#64748b"/><rect x="15.0" y="105.0" width="300.0" height="38.0" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/><text x="27.0" y="125.0" text-anchor="start" font-size="14" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">② 卵泡期（6~14 天）</text><text x="27.0" y="143.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">FSH 促卵泡发育 → 雌激素↑ → 内膜增生</text><line x1="165.0" y1="144.0" x2="165.0" y2="144.5" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/><polygon points="165.0,149.0 163.0,144.4 167.0,144.4" fill="#64748b"/><rect x="15.0" y="150.0" width="300.0" height="38.0" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/><text x="27.0" y="170.0" text-anchor="start" font-size="14" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">③ 排卵（约 14 天）</text><text x="27.0" y="188.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">雌激素高峰正反馈 → LH 峰 → 排卵</text><line x1="165.0" y1="189.0" x2="165.0" y2="189.5" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/><polygon points="165.0,194.0 163.0,189.4 167.0,189.4" fill="#64748b"/><rect x="15.0" y="195.0" width="300.0" height="38.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/><text x="27.0" y="215.0" text-anchor="start" font-size="14" font-weight="700" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">④ 黄体期（15~28 天）</text><text x="27.0" y="233.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">黄体分泌孕激素 → 内膜转为分泌期</text><rect x="15.0" y="235.0" width="300.0" height="150.0" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="25.0" y="254.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">必须记住的两个「峰」与两个「反馈」</text><text x="25.0" y="272.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 雌激素有两个峰：排卵前高峰（最高）、</text><text x="25.0" y="288.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">黄体期次峰</text><text x="25.0" y="304.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 孕激素只有一个峰：黄体期（排卵后 7~8 </text><text x="25.0" y="320.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">天）</text><text x="25.0" y="336.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 排卵前：雌激素对 LH 是「正反馈」——这是</text><text x="25.0" y="352.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">全身唯一重要的正反馈</text><text x="25.0" y="368.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 黄体期：孕激素对 FSH/LH 是「负反馈」</text><rect x="15.0" y="393.0" width="300.0" height="108.0" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/><text x="25.0" y="409.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">基础体温：排卵后孕激素使体温升高 0.3~0.5</text><text x="25.0" y="425.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">℃，持续到下次月经前</text><text x="25.0" y="441.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">黄体寿命约 14 天，若未受孕则萎缩 → 雌孕</text><text x="25.0" y="457.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">激素下降 → 月经来潮</text><text x="25.0" y="473.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">HCG 结构类似 LH，可维持黄体——这是早孕试</text><text x="25.0" y="489.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">纸的原理</text><rect x="11.0" y="504.0" width="308.0" height="51.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="165.0" y="519.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">雌激素双峰、孕激素单峰；排卵前雌激素对LH是</text><text x="165.0" y="534.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">正反馈（全身唯一）</text></svg>