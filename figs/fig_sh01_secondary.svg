<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 515" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="α 螺旋与 β 折叠：同一种氢键"><title>α 螺旋与 β 折叠：同一种氢键</title><desc>α 螺旋每圈 3.6 残基、螺距 0.54 nm，氢键在链内 n 与 n+4 之间；β 折叠氢键在相邻链之间，呈锯齿状；两者都只涉及主链氢键。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">α 螺旋与 β 折叠：同一种氢键</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">都靠主链 C=O 与 N—H 之间的氢键，只是氢键的走向不同</text><rect x="18.0" y="65.0" width="364.0" height="106.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="84.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">氢键 pattern</text><text x="34.0" y="99.0" font-size="12.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">α 螺旋：链内 n → n+4</text><polyline points="38.0,121.0 39.6,123.2 41.2,125.3 42.7,127.4 44.3,129.3 45.9,131.0 47.5,132.6 49.0,133.8 50.6,134.8 52.2,135.5 53.8,135.9 55.4,136.0 56.9,135.7 58.5,135.2 60.1,134.3 61.7,133.1 63.2,131.7 64.8,130.1 66.4,128.2 68.0,126.2 69.6,124.1 71.1,121.9 72.7,119.7 74.3,117.6 75.9,115.5 77.4,113.5 79.0,111.7 80.6,110.1 82.2,108.7 83.8,107.6 85.3,106.7 86.9,106.2 88.5,106.0 90.1,106.1 91.6,106.6 93.2,107.3 94.8,108.3 96.4,109.6 98.0,111.2 99.5,113.0 101.1,114.9 102.7,117.0 104.3,119.1 105.8,121.3 107.4,123.5 109.0,125.6 110.6,127.7 112.2,129.6 113.7,131.3 115.3,132.8 116.9,134.0 118.5,134.9 120.0,135.6 121.6,135.9 123.2,136.0 124.8,135.7 126.4,135.1 127.9,134.1 129.5,132.9 131.1,131.5 132.7,129.8 134.2,127.9 135.8,125.9 137.4,123.8 139.0,121.6 140.6,119.4 142.1,117.3 143.7,115