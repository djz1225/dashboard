4"/><text x="242.0" y="197.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">β 折叠氢键</text><text x="242.0" y="214.0" text-anchor="middle" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">相邻两条 β 链之间，</text><text x="242.0" y="228.0" text-anchor="middle" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">互相平行</text><rect x="15.0" y="244.0" width="300.0" height="102.0" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="25.0" y="263.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">β转角与无规卷曲</text><text x="25.0" y="281.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· β转角：4 个残基，常含 Pro/Gly，</text><text x="25.0" y="297.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">作用是把链「掉头」，连接两条 β 链</text><text x="25.0" y="313.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 无规卷曲：无固定构象但对功能必需，</text><text x="25.0" y="329.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">常构成活性中心或铰链区</text><rect x="15.0" y="354.0" width="300.0" height="76.0" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/><text x="25.0" y="370.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">易错：α 螺旋的氢键在链内，β 折叠的氢键在</text><text x="25.0" y="386.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">链间</text><text x="25.0" y="402.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">两者都是主链氢键，与侧链无关——这是二级结</text><text x="25.0" y="418.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">构的定义</text><rect x="11.0" y="435.0" width="308.0" height="51.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="165.0" y="450.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">二级结构＝主链局部规则构象，全靠主链氢键；</text><text x="165.0" y="465.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">螺旋在链内、折叠在链间</text></svg>