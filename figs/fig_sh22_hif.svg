<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 685" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="HIF-1：氧在则降解，缺氧则稳定"><title>HIF-1：氧在则降解，缺氧则稳定</title><desc>常氧时 PHD（需 O₂、Fe²⁺、α-酮戊二酸）羟化 HIF-1α 的脯氨酸，被 pVHL 识别后泛素化并经蛋白酶体降解，半衰期仅数分钟；缺氧时 PHD 失活，HIF-1α 稳定并与 HIF-1β 结合入核，上调 GLUT1/3、HK2、PFKFB3、LDHA、VEGF、CA9 等靶基因。VHL 失活使 HIF 在常氧下也稳定（假性缺氧），是透明细胞肾癌的核心机制。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">HIF-1：氧在则降解，缺氧则稳定</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">PHD 是氧感受器，pVHL 是降解标签；VHL 失活 → 常氧下也「</text><text x="18.0" y="68.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">假性缺氧」</text><rect x="18.0" y="82.0" width="177.0" height="152.0" rx="9" fill="#e6f6ec" stroke="#2f8f57" stroke-width="1.1"/><text x="29.0" y="103.0" font-size="12.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">常氧｜HIF-1α 被降解</text><text x="29.0" y="122.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">PHD 羟化脯氨酸（需 O₂、</text><text x="29.0" y="138.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Fe²⁺、α-酮戊二酸）</text><text x="29.0" y="158.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">pVHL 识别羟化位点 → </text><text x="29.0" y="174.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">泛素化</text><text x="29.0" y="194.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">蛋白酶体降解，半衰期</text><text x="29.0" y="210.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">仅数分钟</text><rect x="205.0" y="82.0" width="177.0" height="152.0" rx="9" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1.1"/><text x="216.0" y="103.0" font-size="12.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">缺氧｜HIF-1α 稳定</text><text x="216.0" y="122.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">PHD 失活 → 脯氨酸不</text><text x="216.0" y="138.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">再羟化</text><text x="216.0" y="158.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">HIF-1α 与 HIF-1β 结合</text><text x="216.0" y="178.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">入核启动转录 → 适应缺氧</text><rect x="18.0" y="244.0" width="364.0" height="186.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="263.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">下游靶基因：一整套缺氧适应程序</text><rect x="30.0" y="274.0" width="3.0" height="15.0" rx="1.5" fill="#c0392b"/><text x="39.0" y="287.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">糖摄取</text><text x="362.0" y="287.0" text-anchor="end" font-size="12" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">GLUT1/3</text><text x="39.0" y="305.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">细胞膜葡萄糖转运体上调，摄取更多葡萄糖</text><rect x="30.0" y="313.0" width="3.0" height="15.0" rx="1.5" fill="#c1440e"/><text x="39.0" y="326.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">糖酵解</text><text x="362.0" y="326.0" text-anchor="end" font-size="12" font-weight="700" fill="#c1440e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">HK2·PFKFB3·LDHA</text><text x="39.0" y="344.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">糖酵解全链上调，丙酮酸转为乳酸</text><rect x="30.0" y="352.0" width="3.0" height="15.0" rx="1.5" fill="#c0392b"/><text x="39.0" y="365.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">血管生成</text><text x="362.0" y="365.0" text-anchor="end" font-size="12" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">VEGF</text><text x="39.0" y="383.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">促新生血管，改善供氧与输送</text><rect x="30.0" y="391.0" width="3.0" height="15.0" rx="1.5" fill="#4a5a6b"/><text x="39.0" y="404.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">酸化适应</text><text x="362.0" y="404.0" text-anchor="end" font-size="12" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">CA9</text><text x="39.0" y="422.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">碳酸酐酶，调胞内 pH 以耐受酸环境</text><rect x="18.0" y="442.0" width="364.0" height="141.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="461.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">VHL：降解通路的断点</text><rect x="30.0" y="472.0" width="3.0" height="15.0" rx="1.5" fill="#b45309"/><text x="39.0" y="485.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">VHL 失活</text><text x="362.0" y="485.0" text-anchor="end" font-size="12" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">假性缺氧</text><text x="39.0" y="503.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">无 pVHL 时 HIF-1α 常氧也稳定 → 血管与</text><text x="39.0" y="519.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">糖酵解基因持续开关打开</text><rect x="30.0" y="528.0" width="3.0" height="15.0" rx="1.5" fill="#0f766e"/><text x="39.0" y="541.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">对应疾病</text><text x="362.0" y="541.0" text-anchor="end" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">透明细胞肾癌</text><text x="39.0" y="559.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">VHL 双等位失活是核心机制，故该类肾癌</text><text x="39.0" y="575.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">高度依赖 HIF 通路</text><rect x="18.0" y="595.0" width="364.0" height="70.0" rx="8" fill="#fef3c7"/><rect x="18.0" y="595.0" width="3.5" height="70.0" rx="1.8" fill="#b45309"/><text x="32.0" y="615.0" font-size="11.5" font-weight="700" fill="#b45309" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">易错</text><text x="32.0" y="632.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">HIF-1 在常氧也表达，只是被快速降解；「假性缺氧」</text><text x="32.0" y="651.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">是 VHL 缺失的关键词。</text></svg>