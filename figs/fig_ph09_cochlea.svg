<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 748" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="听觉：从声波到神经冲动"><title>听觉：从声波到神经冲动</title><desc>外耳集音、中耳增压约 22 倍、耳蜗基底膜行波使毛细胞纤毛弯曲，K⁺ 内流去极化释放递质产生听觉冲动；高频在蜗底、低频在蜗顶；传音性聋有气骨导差，感音性聋没有。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">听觉：从声波到神经冲动</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">中耳增压 22 倍、耳蜗部位编码频率、毛细胞 K⁺ 内流换能</text><rect x="18.0" y="65.0" width="364.0" height="311.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="83.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">四步传导</text><rect x="30.0" y="93.0" width="316.0" height="60.0" rx="8" fill="#eef2f7" stroke="#4a5a6b" stroke-width="1.1"/><rect x="30.0" y="93.0" width="3.2" height="60.0" rx="1.6" fill="#4a5a6b"/><circle cx="48" cy="110" r="8.5" fill="#4a5a6b"/><text x="48.0" y="114.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">1</text><text x="63.0" y="114.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">外耳集音</text><text x="335.0" y="114.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">传音</text><text x="63.0" y="131.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">耳廓与耳道共振约 2000~3000 Hz，声波集</text><text x="63.0" y="147.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">中到鼓膜</text><line x1="48.0" y1="155.0" x2="48.0" y2="168.0" stroke="#4a5a6b" stroke-width="1.8" stroke-linecap="round"/><line x1="48.0" y1="168.0" x2="44.6" y2="161.9" stroke="#4a5a6b" stroke-width="1.8" stroke-linecap="round"/><line x1="48.0" y1="168.0" x2="51.4" y2="161.9" stroke="#4a5a6b" stroke-width="1.8" stroke-linecap="round"/><rect x="30.0" y="170.0" width="316.0" height="60.0" rx="8" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1.1"/><rect x="30.0" y="170.0" width="3.2" height="60.0" rx="1.6" fill="#1f6fb2"/><circle cx="48" cy="187" r="8.5" fill="#1f6fb2"/><text x="48.0" y="191.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">2</text><text x="63.0" y="191.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">中耳增压</text><text x="335.0" y="191.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">传音</text><text x="63.0" y="208.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">鼓膜→锤砧镫→卵圆窗；面积比＋杠杆 → 增压</text><text x="63.0" y="224.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">约 22 倍</text><line x1="48.0" y1="232.0" x2="48.0" y2="245.0" stroke="#4a5a6b" stroke-width="1.8" stroke-linecap="round"/><line x1="48.0" y1="245.0" x2="44.6" y2="238.9" stroke="#4a5a6b" stroke-width="1.8" stroke-linecap="round"/><line x1="48.0" y1="245.0" x2="51.4" y2="238.9" stroke="#4a5a6b" stroke-width="1.8" stroke-linecap="round"/><rect x="30.0" y="247.0" width="316.0" height="44.0" rx="8" fill="#e2f5f2" stroke="#0f766e" stroke-width="1.1"/><rect x="30.0" y="247.0" width="3.2" height="44.0" rx="1.6" fill="#0f766e"/><circle cx="48" cy="264" r="8.5" fill="#0f766e"/><text x="48.0" y="268.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">3</text><text x="63.0" y="268.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">耳蜗行波</text><text x="335.0" y="268.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">换能起点</text><text x="63.0" y="285.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">内淋巴振动 → 基底膜行波 → 毛细胞纤毛弯曲</text><line x1="48.0" y1="293.0" x2="48.0" y2="306.0" stroke="#4a5a6b" stroke-width="1.8" stroke-linecap="round"/><line x1="48.0" y1="306.0" x2="44.6" y2="299.9" stroke="#4a5a6b" stroke-width="1.8" stroke-linecap="round"/><line x1="48.0" y1="306.0" x2="51.4" y2="299.9" stroke="#4a5a6b" stroke-width="1.8" stroke-linecap="round"/><rect x="30.0" y="308.0" width="316.0" height="60.0" rx="8" fill="#fdeceb" stroke="#c0392b" stroke-width="1.1"/><rect x="30.0" y="308.0" width="3.2" height="60.0" rx="1.6" fill="#c0392b"/><circle cx="48" cy="325" r="8.5" fill="#c0392b"/><text x="48.0" y="329.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">4</text><text x="63.0" y="329.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">毛细胞换能</text><text x="335.0" y="329.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">电信号</text><text x="63.0" y="346.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">纤毛弯曲 → K⁺ 内流 → 去极化 → 释放递质</text><text x="63.0" y="362.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">→ 听神经</text><rect x="18.0" y="388.0" width="364.0" height="112.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="406.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">频率编码</text><text x="30.0" y="426.0" font-size="12" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">基底膜部位编码频率</text><rect x="30.0" y="436.0" width="120.1" height="24.0" rx="5" fill="#fdeceb" stroke="#c0392b" stroke-width="1.1"/><text x="90.0" y="453.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">蜗底 · 高频</text><rect x="150.1" y="436.0" width="101.1" height="24.0" rx="5" fill="#fef3c7" stroke="#b45309" stroke-width="1.1"/><text x="200.6" y="453.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">中部</text><rect x="251.2" y="436.0" width="94.8" height="24.0" rx="5" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1.1"/><text x="298.6" y="453.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">蜗顶 · 低频</text><text x="30.0" y="478.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">↓ 故蜗底病变先影响高频听力；行波最大振幅位置随频率移动</text><rect x="18.0" y="512.0" width="177.0" height="136.0" rx="9" fill="#fef3c7" stroke="#b45309" stroke-width="1.1"/><text x="29.0" y="533.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">传音性聋</text><text x="29.0" y="552.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">病变在外耳 / 中耳</text><text x="29.0" y="572.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">气导↓、骨导正常 → </text><text x="29.0" y="588.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">有气骨导差</text><text x="29.0" y="608.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Rinne 试验阴性（骨导</text><text x="29.0" y="624.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">＞气导）</text><rect x="205.0" y="512.0" width="177.0" height="136.0" rx="9" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1.1"/><text x="216.0" y="533.0" font-size="12.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">感音性聋</text><text x="216.0" y="552.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">病变在耳蜗 / 听神经</text><text x="216.0" y="572.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">气导、骨导同时↓ → </text><text x="216.0" y="588.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">无气骨导差</text><text x="216.0" y="608.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Rinne 试验阳性（气导</text><text x="216.0" y="624.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">＞骨导）</text><rect x="18.0" y="658.0" width="364.0" height="70.0" rx="8" fill="#eef2f7"/><rect x="18.0" y="658.0" width="3.5" height="70.0" rx="1.8" fill="#4a5a6b"/><text x="32.0" y="678.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="695.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">有气骨导差＝传音性；气骨导同时下降＝感音性。咽鼓管</text><text x="32.0" y="714.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">连通中耳与鼻咽，感冒易致中耳炎。</text></svg>