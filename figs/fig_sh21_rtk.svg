<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 536" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="RTK 的两条主路：Ras-MAPK 与 PI3K-Akt"><title>RTK 的两条主路：Ras-MAPK 与 PI3K-Akt</title><desc>配体结合使 RTK 二聚化并互相磷酸化（自身磷酸化），磷酸酪氨酸位点招募接头蛋白后分成两路：Grb2/SOS → Ras → Raf → MEK → ERK 促增殖；PI3K → PIP₃ → Akt 抑制凋亡促存活（PTEN 使 PIP₃ 去磷酸化而关闭此路）。胰岛素受体也是RTK，但通过 IRS-1 接 PI3K-Akt，走 GLUT4 转位、糖原合成与抑制糖异生的代谢分支。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">RTK 的两条主路：Ras-MAPK 与 PI3K-Akt</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">同一次自身磷酸化，分叉到「增殖」与「存活」；胰岛素受体换接</text><text x="18.0" y="68.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">头蛋白走代谢</text><rect x="18.0" y="82.0" width="112.7" height="27.0" rx="6" fill="#eef2f7" stroke="#4a5a6b" stroke-width="1"/><text x="74.3" y="100.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">配体</text><line x1="132.2" y1="95.5" x2="142.2" y2="95.5" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="142.2" y1="95.5" x2="138.2" y2="97.7" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="142.2" y1="95.5" x2="138.2" y2="93.3" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><rect x="143.7" y="82.0" width="112.7" height="27.0" rx="6" fill="#eef2f7" stroke="#4a5a6b" stroke-width="1"/><text x="200.0" y="100.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">受体二聚化</text><line x1="257.8" y1="95.5" x2="267.8" y2="95.5" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="267.8" y1="95.5" x2="263.9" y2="97.7" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="267.8" y1="95.5" x2="263.9" y2="93.3" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><rect x="269.3" y="82.0" width="112.7" height="27.0" rx="6" fill="#eef2f7" stroke="#4a5a6b" stroke-width="1"/><text x="325.7" y="100.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">互相磷酸化 pY</text><rect x="18.0" y="123.0" width="177.0" height="120.0" rx="9" fill="#fdeceb" stroke="#c0392b" stroke-width="1.1"/><text x="29.0" y="144.0" font-size="12.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Ras-MAPK｜管增殖</text><text x="29.0" y="163.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Grb2 / SOS 识别 pY</text><text x="29.0" y="183.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Ras → Raf → MEK → ERK</text><text x="29.0" y="203.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">ERK 入核 → 促增殖转录</text><rect x="205.0" y="123.0" width="177.0" height="120.0" rx="9" fill="#e6f6ec" stroke="#2f8f57" stroke-width="1.1"/><text x="216.0" y="144.0" font-size="12.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">PI3K-Akt｜管存活</text><text x="216.0" y="163.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">PI3K → PIP₃（PTEN 逆转）</text><text x="216.0" y="183.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">PIP₃ 招募 Akt（PDK1</text><text x="216.0" y="199.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"> 协助）</text><text x="216.0" y="219.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">抑制凋亡、促存活</text><rect x="18.0" y="253.0" width="364.0" height="181.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="272.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胰岛素受体的特殊性</text><rect x="30.0" y="283.0" width="3.0" height="15.0" rx="1.5" fill="#0f766e"/><text x="39.0" y="296.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">也是 RTK</text><text x="362.0" y="296.0" text-anchor="end" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">走代谢</text><text x="39.0" y="314.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胰岛素受体属 RTK，但接头用 IRS-1 而非</text><text x="39.0" y="330.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Grb2 → 同样接 PI3K-Akt</text><rect x="30.0" y="339.0" width="3.0" height="15.0" rx="1.5" fill="#c0392b"/><text x="39.0" y="352.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Akt 下游</text><text x="362.0" y="352.0" text-anchor="end" font-size="12" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">三条路</text><text x="39.0" y="370.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">GLUT4 转位上膜、糖原合成↑、糖异生↓ ——</text><text x="39.0" y="386.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">全程「储存」模式</text><rect x="30.0" y="395.0" width="3.0" height="15.0" rx="1.5" fill="#4a5a6b"/><text x="39.0" y="408.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">同一通路</text><text x="362.0" y="408.0" text-anchor="end" font-size="12" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">不同表型</text><text x="39.0" y="426.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">换一个接头蛋白就换一种表型：增殖 vs 代谢</text><rect x="18.0" y="446.0" width="364.0" height="70.0" rx="8" fill="#fef3c7"/><rect x="18.0" y="446.0" width="3.5" height="70.0" rx="1.8" fill="#b45309"/><text x="32.0" y="466.0" font-size="11.5" font-weight="700" fill="#b45309" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">易错</text><text x="32.0" y="483.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">RTK 是「自身磷酸化」（自己磷自己）；Ras 是单体小</text><text x="32.0" y="502.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">G 蛋白，不是三聚体 G 蛋白。</text></svg>