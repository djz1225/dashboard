<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 547" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="膜受体 vs 核受体：亲脂性决定走哪条路"><title>膜受体 vs 核受体：亲脂性决定走哪条路</title><desc>亲水配体（蛋白、肽类激素、儿茶酚胺）过不了脂双层，只能在膜受体（GPCR/RTK/离子通道）上「传话」，经胞内级联放大，起效秒至分钟；亲脂配体（类固醇、甲状腺激素、维甲酸）可穿膜直接结合胞内/核受体，作为转录因子调控基因表达，起效小时至天但作用持久。甲状腺激素虽名为胺类，受体却在核内。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">膜受体 vs 核受体：亲脂性决定走哪条路</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">亲水配体只能在膜上「传话」，亲脂配体直接进核改基因——快慢</text><text x="18.0" y="68.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">之别由此来</text><rect x="18.0" y="82.0" width="177.0" height="156.0" rx="9" fill="#e2f5f2" stroke="#0f766e" stroke-width="1.1"/><text x="29.0" y="103.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">膜受体｜膜上转导</text><text x="29.0" y="122.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">配体：蛋白、肽类激素、</text><text x="29.0" y="138.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">儿茶酚胺</text><text x="29.0" y="158.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">起效：秒 ~ 分钟</text><text x="29.0" y="178.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">膜上「传话」→ 胞内级</text><text x="29.0" y="194.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">联放大</text><text x="29.0" y="214.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">GPCR / RTK / 离子通道</text><rect x="205.0" y="82.0" width="177.0" height="156.0" rx="9" fill="#f2ecfb" stroke="#7b4bb7" stroke-width="1.1"/><text x="216.0" y="103.0" font-size="12.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">核受体｜胞内转录因子</text><text x="216.0" y="122.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">配体：类固醇、甲状腺激</text><text x="216.0" y="138.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">素、维甲酸</text><text x="216.0" y="158.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">起效：小时 ~ 天，作用持久</text><text x="216.0" y="178.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">直接进核结合 DNA 元件</text><text x="216.0" y="198.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">要等新蛋白合成，故慢</text><rect x="18.0" y="248.0" width="364.0" height="197.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="267.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">为什么会有这种分工</text><rect x="30.0" y="278.0" width="3.0" height="15.0" rx="1.5" fill="#0f766e"/><text x="39.0" y="291.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">亲水</text><text x="362.0" y="291.0" text-anchor="end" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">过不去</text><text x="39.0" y="309.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肽类激素溶于水，过不了脂双层 → 只能在膜表</text><text x="39.0" y="325.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">面传话，靠级联放大</text><rect x="30.0" y="334.0" width="3.0" height="15.0" rx="1.5" fill="#7b4bb7"/><text x="39.0" y="347.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">亲脂</text><text x="362.0" y="347.0" text-anchor="end" font-size="12" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">穿得进</text><text x="39.0" y="365.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">类固醇、甲状腺激素可自由穿膜 → 胞内受体本</text><text x="39.0" y="381.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">身就是转录因子</text><rect x="30.0" y="390.0" width="3.0" height="15.0" rx="1.5" fill="#4a5a6b"/><text x="39.0" y="403.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">快与慢</text><text x="362.0" y="403.0" text-anchor="end" font-size="12" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">分工代价</text><text x="39.0" y="421.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">膜受体快但不改基因；核受体慢但改变细胞表</text><text x="39.0" y="437.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">型，停药后效应仍持续</text><rect x="18.0" y="457.0" width="364.0" height="70.0" rx="8" fill="#fef3c7"/><rect x="18.0" y="457.0" width="3.5" height="70.0" rx="1.8" fill="#b45309"/><text x="32.0" y="477.0" font-size="11.5" font-weight="700" fill="#b45309" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">易错</text><text x="32.0" y="494.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">甲状腺激素名字像胺类，其实亲脂、受体在核内；核受体</text><text x="32.0" y="513.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">起效慢 ≠ 作用弱。</text></svg>