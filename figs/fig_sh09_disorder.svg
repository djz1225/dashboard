<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 497" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="脂代谢紊乱：三条主线"><title>脂代谢紊乱：三条主线</title><desc>脂代谢紊乱的三条主线是血脂异常（Ⅱa 型 LDL 升高、Ⅳ 型 VLDL 升高）、脂肪肝（肝 VLDL 输出小于甘油三酯合成）与酮症酸中毒（胰岛素绝对缺乏致脂解失控、酮体过量）；动脉粥样硬化的关键是 ox-LDL 形成泡沫细胞，必需脂肪酸仅亚油酸与 α-亚麻酸两种。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">脂代谢紊乱：三条主线</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">血脂异常看 LDL-C、脂肪肝看 VLDL 输出、酮症酸中毒看胰岛素</text><text x="18.0" y="68.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">绝对缺乏</text><rect x="18.0" y="82.0" width="364.0" height="313.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="101.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">三条主线 + 两个补充</text><rect x="30.0" y="112.0" width="3.0" height="15.0" rx="1.5" fill="#c0392b"/><text x="39.0" y="125.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">高脂血症</text><text x="370.0" y="125.0" text-anchor="end" font-size="12" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Ⅱa / Ⅳ 型</text><text x="39.0" y="143.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Ⅱa 型 LDL↑（与他汀最相关）；Ⅳ 型</text><text x="39.0" y="159.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">VLDL↑，以甘油三酯为主</text><rect x="30.0" y="169.0" width="3.0" height="15.0" rx="1.5" fill="#b45309"/><text x="39.0" y="182.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">脂肪肝</text><text x="370.0" y="182.0" text-anchor="end" font-size="12" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">输出不足</text><text x="39.0" y="200.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肝 VLDL 输出 &lt; 甘油三酯合成；饮酒、肥胖、</text><text x="39.0" y="216.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">糖尿病，可进展为脂肪性肝炎</text><rect x="30.0" y="226.0" width="3.0" height="15.0" rx="1.5" fill="#1f6fb2"/><text x="39.0" y="239.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">动脉粥样硬化</text><text x="370.0" y="239.0" text-anchor="end" font-size="12" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">ox-LDL</text><text x="39.0" y="257.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">ox-LDL → 泡沫细胞 → 斑块；LDL-C 是首</text><text x="39.0" y="273.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">要干预靶点</text><rect x="30.0" y="283.0" width="3.0" height="15.0" rx="1.5" fill="#b45309"/><text x="39.0" y="296.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">酮症酸中毒</text><text x="370.0" y="296.0" text-anchor="end" font-size="12" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胰岛素缺乏</text><text x="39.0" y="314.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">脂解失控 → 酮体过量；血糖高 + 血酮高 +</text><text x="39.0" y="330.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">阴离子间隙增大</text><rect x="30.0" y="340.0" width="3.0" height="15.0" rx="1.5" fill="#7b4bb7"/><text x="39.0" y="353.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">必需脂肪酸缺乏</text><text x="370.0" y="353.0" text-anchor="end" font-size="12" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">只有两种</text><text x="39.0" y="371.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">亚油酸（ω-6）与 α-亚麻酸（ω-3）；皮炎、</text><text x="39.0" y="387.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">生长迟缓</text><rect x="18.0" y="407.0" width="364.0" height="70.0" rx="8" fill="#fef3c7"/><rect x="18.0" y="407.0" width="3.5" height="70.0" rx="1.8" fill="#b45309"/><text x="32.0" y="427.0" font-size="11.5" font-weight="700" fill="#b45309" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">易错</text><text x="32.0" y="444.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">必需脂肪酸只有亚油酸与 α-亚麻酸两种；花生四烯酸</text><text x="32.0" y="463.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">可由亚油酸合成，不算必需。</text></svg>