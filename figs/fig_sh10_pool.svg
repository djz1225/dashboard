<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 578" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="氨基酸代谢库：三条进、三条出"><title>氨基酸代谢库：三条进、三条出</title><desc>氨基酸代谢库的来源为食物蛋白消化吸收、自身组织蛋白分解与非必需氨基酸合成，去路为合成组织蛋白、脱氨基后碳骨架进入三羧酸循环生糖生酮、以及合成嘌呤、卟啉与儿茶酚胺等含氮物；必需氨基酸 8 种（婴儿 9 种）。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">氨基酸代谢库：三条进、三条出</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">库本身很小，靠进出平衡维持；去路以合成蛋白与脱氨基为主</text><rect x="18.0" y="65.0" width="177.0" height="136.0" rx="9" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1.1"/><text x="29.0" y="86.0" font-size="12.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">进库｜3 条</text><text x="29.0" y="105.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">① 食物蛋白消化吸收</text><text x="29.0" y="125.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">② 自身组织蛋白分解</text><text x="29.0" y="145.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">③ 非必需氨基酸合成</text><rect x="205.0" y="65.0" width="177.0" height="136.0" rx="9" fill="#e6f6ec" stroke="#2f8f57" stroke-width="1.1"/><text x="216.0" y="86.0" font-size="12.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">出库｜3 条</text><text x="216.0" y="105.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">① 合成组织蛋白（最大去路）</text><text x="216.0" y="125.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">② 脱氨基后碳骨架入三</text><text x="216.0" y="141.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">羧酸循环</text><text x="216.0" y="161.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">③ 合成嘌呤、卟啉、儿</text><text x="216.0" y="177.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">茶酚胺</text><rect x="18.0" y="211.0" width="364.0" height="141.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="230.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">碳骨架与氮的分流</text><rect x="30.0" y="241.0" width="3.0" height="15.0" rx="1.5" fill="#b45309"/><text x="39.0" y="254.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">碳骨架的三种去向</text><text x="370.0" y="254.0" text-anchor="end" font-size="12" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">生糖/生酮</text><text x="39.0" y="272.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">转成丙酮酸、乙酰CoA 或三羧酸循环中间物</text><text x="39.0" y="288.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">→ 生糖或生酮</text><rect x="30.0" y="297.0" width="3.0" height="15.0" rx="1.5" fill="#4a5a6b"/><text x="39.0" y="310.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">库的缓冲意义</text><text x="370.0" y="310.0" text-anchor="end" font-size="12" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">不储存</text><text x="39.0" y="328.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">体内没有储存蛋白，吃多了就氧化或转脂，吃少了</text><text x="39.0" y="344.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">就拆自身蛋白</text><rect x="18.0" y="364.0" width="364.0" height="112.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="383.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">必需氨基酸 8 种（婴儿 9 种）</text><rect x="30.0" y="394.0" width="38.1" height="26.0" rx="5" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1"/><text x="49.1" y="412.0" text-anchor="middle" font-size="12" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">缬</text><rect x="73.1" y="394.0" width="38.1" height="26.0" rx="5" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1"/><text x="92.2" y="412.0" text-anchor="middle" font-size="12" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">异亮</text><rect x="116.2" y="394.0" width="38.1" height="26.0" rx="5" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1"/><text x="135.3" y="412.0" text-anchor="middle" font-size="12" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">亮</text><rect x="159.4" y="394.0" width="38.1" height="26.0" rx="5" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1"/><text x="178.4" y="412.0" text-anchor="middle" font-size="12" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">苯丙</text><rect x="202.5" y="394.0" width="38.1" height="26.0" rx="5" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1"/><text x="221.6" y="412.0" text-anchor="middle" font-size="12" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">蛋</text><rect x="245.6" y="394.0" width="38.1" height="26.0" rx="5" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1"/><text x="264.7" y="412.0" text-anchor="middle" font-size="12" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">色</text><rect x="288.8" y="394.0" width="38.1" height="26.0" rx="5" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1"/><text x="307.8" y="412.0" text-anchor="middle" font-size="12" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">苏</text><rect x="331.9" y="394.0" width="38.1" height="26.0" rx="5" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1"/><text x="350.9" y="412.0" text-anchor="middle" font-size="12" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">赖</text><text x="30.0" y="434.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">顺序：缬、异亮、亮、苯丙、蛋、色、苏、赖 —— 共 8 种；</text><text x="30.0" y="450.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">婴儿需 9 种（多加组氨酸）。</text><rect x="18.0" y="488.0" width="364.0" height="70.0" rx="8" fill="#e2f5f2"/><rect x="18.0" y="488.0" width="3.5" height="70.0" rx="1.8" fill="#0f766e"/><text x="32.0" y="508.0" font-size="11.5" font-weight="700" fill="#0f766e" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">口诀</text><text x="32.0" y="525.0" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">记忆：「缬异亮亮苯蛋色苏赖」；婴儿多加组氨酸，早产</text><text x="32.0" y="544.0" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">儿可能还需精氨酸。</text></svg>