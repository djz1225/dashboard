<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 763" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="抑制剂 vs 解偶联剂：断链与漏质子"><title>抑制剂 vs 解偶联剂：断链与漏质子</title><desc>呼吸链抑制剂阻断某一复合体，切断电子流（鱼藤酮阻Ⅰ、抗霉素A 阻Ⅲ、氰化物与 CO 阻Ⅳ 致细胞内窒息）；寡霉素阻 ATP 合酶 F₀ 使质子不能回流；解偶联剂如 2,4-二硝基苯酚携带 H⁺ 穿膜，使电子照常传递而 ATP 大减、能量以热散失。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">抑制剂 vs 解偶联剂：断链与漏质子</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">抑制剂阻断电子流，解偶联剂让质子漏回——两者后果完全不同</text><rect x="18.0" y="65.0" width="177.0" height="140.0" rx="9" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1.1"/><text x="29.0" y="86.0" font-size="12.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">抑制剂｜断链</text><text x="29.0" y="105.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">作用于某个复合体</text><text x="29.0" y="125.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">电子流被截断，上游堆积</text><text x="29.0" y="145.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">泵质子↓ → ATP↓</text><text x="29.0" y="165.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">下游 O₂ 消耗也↓</text><rect x="205.0" y="65.0" width="177.0" height="140.0" rx="9" fill="#fdeceb" stroke="#c0392b" stroke-width="1.1"/><text x="216.0" y="86.0" font-size="12.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">解偶联剂｜漏质子</text><text x="216.0" y="105.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">携带 H⁺ 穿过内膜</text><text x="216.0" y="125.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">电子照常传递，O₂ 照</text><text x="216.0" y="141.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">常消耗</text><text x="216.0" y="161.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">梯度消失 → ATP↓↓</text><text x="216.0" y="181.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">能量全部变成热</text><rect x="18.0" y="215.0" width="364.0" height="26.0" rx="6" fill="#f8fbfd"/><text x="26.0" y="232.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">药物</text><text x="157.0" y="232.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">作用位点</text><text x="273.5" y="232.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">后果</text><line x1="18.0" y1="283.0" x2="382.0" y2="283.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="259.0" font-size="12.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">鱼藤酮 / 阿米妥</text><text x="157.0" y="259.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">复合体Ⅰ</text><text x="273.5" y="259.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">NADH 的电子</text><text x="273.5" y="275.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">进不了链</text><line x1="18.0" y1="309.0" x2="382.0" y2="309.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="301.0" font-size="12.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">抗霉素 A</text><text x="157.0" y="301.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">复合体Ⅲ（b→c₁）</text><text x="273.5" y="301.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">cyt c 得不到电子</text><line x1="18.0" y1="351.0" x2="382.0" y2="351.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="327.0" font-size="12.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">氰化物 / CO</text><text x="26.0" y="343.0" font-size="12.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"> /叠氮</text><text x="157.0" y="327.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">复合体Ⅳ</text><text x="273.5" y="327.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">O₂ 无法还原</text><text x="273.5" y="343.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">→细胞内窒息</text><line x1="18.0" y1="393.0" x2="382.0" y2="393.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="369.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">寡霉素</text><text x="157.0" y="369.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">ATP 合酶 F₀</text><text x="273.5" y="369.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">质子不能回流，梯</text><text x="273.5" y="385.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">度反而更高</text><line x1="18.0" y1="435.0" x2="382.0" y2="435.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="411.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">2,4-二硝基苯酚</text><text x="157.0" y="411.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">携带 H⁺ 穿膜（</text><text x="157.0" y="427.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">解偶联）</text><text x="273.5" y="411.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">电子照传、ATP 大</text><text x="273.5" y="427.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">减、产热</text><rect x="18.0" y="441.0" width="364.0" height="201.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="460.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">氰化物中毒的生化基础</text><rect x="30.0" y="471.0" width="3.0" height="15.0" rx="1.5" fill="#c0392b"/><text x="39.0" y="484.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">为什么「细胞内窒息」</text><text x="370.0" y="484.0" text-anchor="end" font-size="12" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">氧不缺</text><text x="39.0" y="502.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">血氧饱和度正常，但复合体Ⅳ 被阻断，细胞</text><text x="39.0" y="518.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">用不上氧</text><rect x="30.0" y="529.0" width="3.0" height="15.0" rx="1.5" fill="#b45309"/><text x="39.0" y="542.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">为什么发绀不明显</text><text x="370.0" y="542.0" text-anchor="end" font-size="12" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">静脉血鲜红</text><text x="39.0" y="560.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">组织不能摄氧，静脉血仍含氧 → 皮肤樱桃红</text><text x="39.0" y="576.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">而乳酸飙升</text><rect x="30.0" y="587.0" width="3.0" height="15.0" rx="1.5" fill="#2f8f57"/><text x="39.0" y="600.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">解毒思路</text><text x="370.0" y="600.0" text-anchor="end" font-size="12" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">别混</text><text x="39.0" y="618.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">亚硝酸盐 / 羟钴胺结合氰根；亚甲蓝是用于高铁血</text><text x="39.0" y="634.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">红蛋白血症</text><rect x="18.0" y="654.0" width="364.0" height="89.0" rx="8" fill="#e2f5f2"/><rect x="18.0" y="654.0" width="3.5" height="89.0" rx="1.8" fill="#0f766e"/><text x="32.0" y="674.0" font-size="11.5" font-weight="700" fill="#0f766e" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">易错</text><text x="32.0" y="691.0" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">寡霉素不增加电子传递，反而使梯度堆积、反向抑制电子</text><text x="32.0" y="710.0" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">流；DNP 是解偶联剂不是抑制剂——这是最常被混</text><text x="32.0" y="729.0" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">淆的一条。</text></svg>