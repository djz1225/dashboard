<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 775" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="淋巴回流"><title>淋巴回流</title><desc>组织液经毛细淋巴管、集合淋巴管、胸导管（左 3/4）与右淋巴导管回血，动力来自组织液静水压、骨骼肌泵、呼吸运动与淋巴管自身收缩；受阻则水肿。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">淋巴回流：把组织液送回血液</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">毛细淋巴管是「单向阀」，堵了就水肿</text><rect x="18.0" y="65.0" width="364.0" height="206.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="83.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">回流路径</text><rect x="30.0" y="93.0" width="3.0" height="15.0" rx="1.5" fill="#1f6fb2"/><text x="39.0" y="106.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">毛细淋巴管</text><text x="347.0" y="106.0" text-anchor="end" font-size="12" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">起点</text><text x="39.0" y="124.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">内皮细胞呈叠瓦状、间隙大，单向开放只进不</text><text x="39.0" y="140.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">出</text><rect x="30.0" y="150.0" width="3.0" height="15.0" rx="1.5" fill="#7b4bb7"/><text x="39.0" y="163.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">集合淋巴管</text><text x="347.0" y="163.0" text-anchor="end" font-size="12" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">通路</text><text x="39.0" y="181.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">有平滑肌与瓣膜，靠自身收缩与外力推动</text><rect x="30.0" y="191.0" width="3.0" height="15.0" rx="1.5" fill="#2f8f57"/><text x="39.0" y="204.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胸导管</text><text x="347.0" y="204.0" text-anchor="end" font-size="12" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">左侧</text><text x="39.0" y="222.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">收集全身 3/4 淋巴（左上半身＋下半身）</text><rect x="30.0" y="232.0" width="3.0" height="15.0" rx="1.5" fill="#4a5a6b"/><text x="39.0" y="245.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">右淋巴导管</text><text x="347.0" y="245.0" text-anchor="end" font-size="12" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">右侧</text><text x="39.0" y="263.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">仅收集右上半身（约 1/4）</text><rect x="18.0" y="283.0" width="364.0" height="149.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="301.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">三个回流动力</text><rect x="30.0" y="311.0" width="3.0" height="15.0" rx="1.5" fill="#b45309"/><text x="39.0" y="324.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">组织液静水压↑</text><text x="347.0" y="324.0" text-anchor="end" font-size="12" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">推</text><text x="39.0" y="342.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">毛细血管滤过增多 → 淋巴生成增多</text><rect x="30.0" y="352.0" width="3.0" height="15.0" rx="1.5" fill="#2f8f57"/><text x="39.0" y="365.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">骨骼肌收缩＋呼吸运动</text><text x="347.0" y="365.0" text-anchor="end" font-size="12" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">挤／抽</text><text x="39.0" y="383.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肌肉泵配合瓣膜单向推动；吸气胸腔负压抽吸</text><rect x="30.0" y="393.0" width="3.0" height="15.0" rx="1.5" fill="#7b4bb7"/><text x="39.0" y="406.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">淋巴管自身收缩</text><text x="347.0" y="406.0" text-anchor="end" font-size="12" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">泵</text><text x="39.0" y="424.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">淋巴管平滑肌节律收缩是主动动力</text><rect x="18.0" y="444.0" width="177.0" height="100.0" rx="9" fill="#e6f6ec" stroke="#2f8f57" stroke-width="1.1"/><text x="29.0" y="465.0" font-size="12.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">回收蛋白质</text><text x="29.0" y="484.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">毛细血管漏出的少量蛋白质</text><text x="29.0" y="504.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">只能经淋巴回血，不能自行</text><text x="29.0" y="520.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">返回</text><rect x="205.0" y="444.0" width="177.0" height="100.0" rx="9" fill="#f2ecfb" stroke="#7b4bb7" stroke-width="1.1"/><text x="216.0" y="465.0" font-size="12.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">运输脂肪</text><text x="216.0" y="484.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">小肠吸收的脂肪形成乳糜微</text><text x="216.0" y="500.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">粒</text><text x="216.0" y="520.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">经中央乳糜管入淋巴</text><rect x="18.0" y="554.0" width="177.0" height="100.0" rx="9" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1.1"/><text x="29.0" y="575.0" font-size="12.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">调节体液平衡</text><text x="29.0" y="594.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">每天约 2~4 L 组织液经淋巴</text><text x="29.0" y="610.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">回血</text><text x="29.0" y="630.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">淋巴回流受阻即水肿</text><rect x="205.0" y="554.0" width="177.0" height="100.0" rx="9" fill="#fdeceb" stroke="#c0392b" stroke-width="1.1"/><text x="216.0" y="575.0" font-size="12.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">防御屏障</text><text x="216.0" y="594.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">淋巴结过滤细菌、产生淋巴</text><text x="216.0" y="610.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">细胞</text><text x="216.0" y="630.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">是免疫第一道哨所</text><rect x="18.0" y="666.0" width="364.0" height="89.0" rx="8" fill="#eef2f7"/><rect x="18.0" y="666.0" width="3.5" height="89.0" rx="1.8" fill="#4a5a6b"/><text x="32.0" y="686.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="703.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">淋巴回流＝回收蛋白＋运输脂肪＋调衡体液＋免疫防御；</text><text x="32.0" y="722.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">淋巴管阻塞（丝虫病、手术清扫）→ 组织液积聚 → 水</text><text x="32.0" y="741.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肿。</text></svg>