<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 788" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="ABO 血型与交叉配血"><title>ABO 血型与交叉配血</title><desc>ABO 血型按红细胞抗原分 A、B、AB、O 四型，血清中天然存在针对自身缺少抗原的抗体；输血须主侧与次侧交叉配血均相合。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">ABO 血型与交叉配血</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">抗体总是针对「自己没有的抗原」</text><rect x="18.0" y="59.0" width="3.0" height="14.0" rx="1.5" fill="#0f766e"/><text x="28.0" y="69.0" font-size="13.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">ABO 血型：抗原与抗体</text><rect x="18.0" y="81.0" width="364.0" height="174.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="99.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">四种血型</text><rect x="18.0" y="111.0" width="316.0" height="24.0" rx="6" fill="#e2f5f2"/><text x="26.0" y="127.0" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">血型</text><text x="82.9" y="127.0" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">红细胞抗原</text><text x="212.4" y="127.0" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">血清抗体</text><line x1="18.0" y1="161.0" x2="334.0" y2="161.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="154.0" font-size="13" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">A</text><text x="82.9" y="154.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">A 抗原</text><text x="212.4" y="154.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">抗 B</text><line x1="18.0" y1="187.0" x2="334.0" y2="187.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="180.0" font-size="13" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">B</text><text x="82.9" y="180.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">B 抗原</text><text x="212.4" y="180.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">抗 A</text><line x1="18.0" y1="213.0" x2="334.0" y2="213.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="206.0" font-size="13" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">AB</text><text x="82.9" y="206.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">A + B 抗原</text><text x="212.4" y="206.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">无抗体</text><line x1="18.0" y1="239.0" x2="334.0" y2="239.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="232.0" font-size="13" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">O</text><text x="82.9" y="232.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">无抗原</text><text x="212.4" y="232.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">抗 A + 抗 B</text><rect x="18.0" y="261.0" width="3.0" height="14.0" rx="1.5" fill="#0f766e"/><text x="28.0" y="271.0" font-size="13.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">交叉配血：两栏都要相合</text><rect x="18.0" y="283.0" width="364.0" height="181.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="301.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">配血原则</text><rect x="30.0" y="311.0" width="3.0" height="15.0" rx="1.5" fill="#c0392b"/><text x="39.0" y="324.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">主侧</text><text x="347.0" y="324.0" text-anchor="end" font-size="12" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">必查</text><text x="39.0" y="342.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">供者红细胞 + 受者血清：查受者抗体是否凝</text><text x="39.0" y="358.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">集供者红细胞</text><rect x="30.0" y="368.0" width="3.0" height="15.0" rx="1.5" fill="#1f6fb2"/><text x="39.0" y="381.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">次侧</text><text x="347.0" y="381.0" text-anchor="end" font-size="12" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">必查</text><text x="39.0" y="399.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">供者血清 + 受者红细胞：查供者抗体是否凝</text><text x="39.0" y="415.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">集受者红细胞</text><rect x="30.0" y="425.0" width="3.0" height="15.0" rx="1.5" fill="#2f8f57"/><text x="39.0" y="438.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">结论</text><text x="347.0" y="438.0" text-anchor="end" font-size="12" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">两栏相合</text><text x="39.0" y="456.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">两侧均不凝集方可输血；主侧凝集绝对不能输</text><rect x="18.0" y="476.0" width="177.0" height="100.0" rx="9" fill="#e6f6ec" stroke="#2f8f57" stroke-width="1.1"/><text x="29.0" y="497.0" font-size="12.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">输血首选</text><text x="29.0" y="516.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">同型输血</text><text x="29.0" y="536.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">紧急 ABO 不明时少量输 O </text><text x="29.0" y="552.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">型红细胞</text><rect x="205.0" y="476.0" width="177.0" height="100.0" rx="9" fill="#fef3c7" stroke="#b45309" stroke-width="1.1"/><text x="216.0" y="497.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">为什么 O 型可急用</text><text x="216.0" y="516.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">O 型红细胞无 A/B 抗原</text><text x="216.0" y="536.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">但血浆含抗 A 抗 B，不可大</text><text x="216.0" y="552.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">量输全血</text><rect x="18.0" y="586.0" width="177.0" height="100.0" rx="9" fill="#f2ecfb" stroke="#7b4bb7" stroke-width="1.1"/><text x="29.0" y="607.0" font-size="12.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">AB 型受者</text><text x="29.0" y="626.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">可接受任一 ABO 型红细胞</text><text x="29.0" y="646.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">血浆仍不能乱给</text><rect x="205.0" y="586.0" width="177.0" height="100.0" rx="9" fill="#fdeceb" stroke="#c0392b" stroke-width="1.1"/><text x="216.0" y="607.0" font-size="12.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Rh 系统</text><text x="216.0" y="626.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Rh 阴性母 + Rh 阳性胎</text><text x="216.0" y="646.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">→ 新生儿溶血，需抗 D</text><text x="216.0" y="662.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"> 球蛋白</text><rect x="18.0" y="698.0" width="364.0" height="70.0" rx="8" fill="#eef2f7"/><rect x="18.0" y="698.0" width="3.5" height="70.0" rx="1.8" fill="#4a5a6b"/><text x="32.0" y="718.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="735.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">抗体总针对自己没有的抗原；O 型红细胞可应急，但血</text><text x="32.0" y="754.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">浆不能乱给；交叉配血主、次侧必须都相合。</text></svg>