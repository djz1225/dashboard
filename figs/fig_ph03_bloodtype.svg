<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 583.5" width="100%" style="max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px" role="img"><text x="165.0" y="22.6" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">ABO 血型：抗原与抗体</text><text x="165.0" y="42.6" text-anchor="middle" font-size="13.5" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">记住：血清中天然存在针对「自己没有的抗原」的抗体</text><rect x="15.0" y="59.5" width="300.0" height="26.0" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.4"/><text x="23.0" y="77.5" text-anchor="start" font-size="13" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">血型</text><text x="91.0" y="77.5" text-anchor="start" font-size="13" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">红细胞抗原</text><text x="307.0" y="77.5" text-anchor="end" font-size="13" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">血清抗体</text><rect x="15.0" y="85.5" width="300.0" height="38.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><circle cx="37.0" cy="104.5" r="12" fill="#0f766e"/><text x="37.0" y="109.4" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">A</text><text x="91.0" y="109.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">A 抗原</text><text x="307.0" y="109.5" text-anchor="end" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">抗 B</text><rect x="15.0" y="126.5" width="300.0" height="38.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><circle cx="37.0" cy="145.5" r="12" fill="#0f766e"/><text x="37.0" y="150.4" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">B</text><text x="91.0" y="150.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">B 抗原</text><text x="307.0" y="150.5" text-anchor="end" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">抗 A</text><rect x="15.0" y="167.5" width="300.0" height="38.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><circle cx="37.0" cy="186.5" r="12" fill="#15803d"/><text x="37.0" y="191.4" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">AB</text><text x="91.0" y="191.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">A + B 抗原</text><text x="307.0" y="191.5" text-anchor="end" font-size="13.5" font-weight="700" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">无抗体</text><rect x="15.0" y="208.5" width="300.0" height="38.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><circle cx="37.0" cy="227.5" r="12" fill="#b91c1c"/><text x="37.0" y="232.4" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">O</text><text x="91.0" y="232.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">无抗原</text><text x="307.0" y="232.5" text-anchor="end" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">抗 A + 抗 B</text><rect x="15.0" y="255.5" width="300.0" height="150.0" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="25.0" y="274.5" text-anchor="start" font-size="13.5" font-weight="700" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">输血原则</text><text x="25.0" y="292.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 首选同型输血</text><text x="25.0" y="308.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 紧急且 ABO 不明：可少量输 O 型红细胞（</text><text x="25.0" y="324.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">不是全血）</text><text x="25.0" y="340.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· AB 型人可接受任一 ABO 型红细胞（</text><text x="25.0" y="356.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">但血浆不能乱给）</text><text x="25.0" y="372.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 交叉配血：主侧（供者红细胞+受者血清）</text><text x="25.0" y="388.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">与次侧都要相合</text><rect x="15.0" y="413.5" width="300.0" height="108.0" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/><text x="25.0" y="429.5" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">为什么 O 型可给他人：O 型红细胞无 A/B 抗</text><text x="25.0" y="445.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">原，不被受者抗体攻击</text><text x="25.0" y="461.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">但 O 型血浆含抗 A 抗 B，大量输全血仍会溶</text><text x="25.0" y="477.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">血——只能输洗涤红细胞</text><text x="25.0" y="493.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">Rh 阴性母亲 + Rh 阳性胎儿 → 新生儿溶血；</text><text x="25.0" y="509.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">需抗 D 免疫球蛋白</text><rect x="11.0" y="524.5" width="308.0" height="51.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="165.0" y="539.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">抗体总是针对自己没有的抗原；O 型红细胞可急</text><text x="165.0" y="555.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">用，但血浆不能乱给</text></svg>