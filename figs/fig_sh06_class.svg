<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 514" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="脂溶性 vs 水溶性维生素"><title>脂溶性 vs 水溶性维生素</title><desc>脂溶性维生素 A、D、E、K 需胆汁乳化吸收、可在体内储存，缺乏出现慢但过量易中毒；水溶性 B 族与 C 直接吸收入血、多余随尿排出，需每日补充且很少过量。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">脂溶性 vs 水溶性维生素</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">跟着脂肪走能存（缺得慢、易过量）；跟着水走易排（缺得快、</text><text x="18.0" y="68.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">少过量）</text><rect x="18.0" y="82.0" width="364.0" height="26.0" rx="6" fill="#f8fbfd"/><text x="26.0" y="99.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">对比项</text><text x="113.4" y="99.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">脂溶性 A D E K</text><text x="251.7" y="99.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">水溶性 B 族 + C</text><line x1="18.0" y1="134.0" x2="382.0" y2="134.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="126.0" font-size="12.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">吸收途径</text><text x="113.4" y="126.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">需胆汁乳化</text><text x="251.7" y="126.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">直接吸收入血</text><line x1="18.0" y1="176.0" x2="382.0" y2="176.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="152.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">体内储存</text><text x="113.4" y="152.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">可储存（肝、脂肪）</text><text x="251.7" y="152.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">几乎不储，多余随</text><text x="251.7" y="168.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">尿排出</text><line x1="18.0" y1="202.0" x2="382.0" y2="202.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="194.0" font-size="12.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">补充频率</text><text x="113.4" y="194.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">不必每日</text><text x="251.7" y="194.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">需每日补充</text><line x1="18.0" y1="228.0" x2="382.0" y2="228.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="220.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">缺乏表现</text><text x="113.4" y="220.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">出现慢</text><text x="251.7" y="220.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">出现快</text><line x1="18.0" y1="254.0" x2="382.0" y2="254.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="246.0" font-size="12.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">过量风险</text><text x="113.4" y="246.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">易蓄积中毒</text><text x="251.7" y="246.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">少见（B₆、烟酸例外）</text><rect x="18.0" y="262.0" width="364.0" height="169.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="281.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话记住</text><rect x="30.0" y="292.0" width="3.0" height="15.0" rx="1.5" fill="#7b4bb7"/><text x="39.0" y="305.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">脂溶性</text><text x="370.0" y="305.0" text-anchor="end" font-size="12" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">四条判据</text><text x="39.0" y="323.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">跟着脂肪走、能储存 → 缺得慢、容易过量</text><rect x="30.0" y="334.0" width="3.0" height="15.0" rx="1.5" fill="#0f766e"/><text x="39.0" y="347.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">水溶性</text><text x="370.0" y="347.0" text-anchor="end" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">四条判据</text><text x="39.0" y="365.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">跟着水走、易排出 → 缺得快、很少过量</text><rect x="30.0" y="376.0" width="3.0" height="15.0" rx="1.5" fill="#b45309"/><text x="39.0" y="389.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">临床连带</text><text x="370.0" y="389.0" text-anchor="end" font-size="12" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一起缺</text><text x="39.0" y="407.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胆道梗阻、胰腺外分泌不足 → 脂溶性维生素</text><text x="39.0" y="423.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">集体缺乏</text><rect x="18.0" y="443.0" width="364.0" height="51.0" rx="8" fill="#fef3c7"/><rect x="18.0" y="443.0" width="3.5" height="51.0" rx="1.8" fill="#b45309"/><text x="32.0" y="463.0" font-size="11.5" font-weight="700" fill="#b45309" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">易错</text><text x="32.0" y="480.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">脂溶性不是「只能脂溶」，而是「需要胆汁帮助吸收」。</text></svg>