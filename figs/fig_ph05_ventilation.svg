<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 619" width="100%" style="max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px" role="img"><text x="165.0" y="22.6" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">肺通气：动力与阻力</text><text x="165.0" y="43.0" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">动力＝呼吸肌造成的压力差；阻力以弹性为主</text><text x="15.0" y="73.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">动力：呼吸肌 → 胸膜腔负压 → 肺内压变化</text><rect x="15.0" y="80.0" width="300.0" height="38.0" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/><text x="27.0" y="100.0" text-anchor="start" font-size="14" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">① 吸气肌收缩</text><text x="27.0" y="118.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">膈肌 + 肋间外肌 → 胸廓扩大</text><line x1="165.0" y1="119.0" x2="165.0" y2="119.5" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/><polygon points="165.0,124.0 163.0,119.4 167.0,119.4" fill="#64748b"/><rect x="15.0" y="125.0" width="300.0" height="38.0" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/><text x="27.0" y="145.0" text-anchor="start" font-size="14" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">② 胸膜腔负压增大</text><text x="27.0" y="163.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">肺被牵拉扩张 → 肺内压 &lt; 大气压</text><line x1="165.0" y1="164.0" x2="165.0" y2="164.5" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/><polygon points="165.0,169.0 163.0,164.4 167.0,164.4" fill="#64748b"/><rect x="15.0" y="170.0" width="300.0" height="38.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/><text x="27.0" y="190.0" text-anchor="start" font-size="14" font-weight="700" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">③ 气体入肺</text><text x="27.0" y="208.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">压力差驱动气流（吸气是主动过程）</text><line x1="165.0" y1="209.0" x2="165.0" y2="209.5" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/><polygon points="165.0,214.0 163.0,209.4 167.0,209.4" fill="#64748b"/><rect x="15.0" y="215.0" width="300.0" height="54.0" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/><text x="27.0" y="235.0" text-anchor="start" font-size="14" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">④ 呼气</text><text x="27.0" y="253.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">平静呼气靠弹性回缩（被动）；用力呼气靠腹</text><text x="27.0" y="269.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">肌（主动）</text><rect x="15.0" y="271.0" width="300.0" height="42.0" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="27.0" y="291.0" text-anchor="start" font-size="14" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">弹性阻力</text><text x="305.0" y="291.0" text-anchor="end" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">70%</text><text x="27.0" y="308.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">占 70%，主要来自肺弹性纤维 + 表面张力</text><rect x="15.0" y="319.0" width="300.0" height="42.0" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/><text x="27.0" y="339.0" text-anchor="start" font-size="14" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">非弹性阻力</text><text x="305.0" y="339.0" text-anchor="end" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">30%</text><text x="27.0" y="356.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">占 30%，主要是气道阻力</text><rect x="15.0" y="371.0" width="300.0" height="102.0" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="25.0" y="390.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">两个必须会算的量</text><text x="25.0" y="408.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 肺顺应性 = 容积变化/压力变化，越大越易</text><text x="25.0" y="424.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">扩张（肺气肿↑、肺纤维化↓）</text><text x="25.0" y="440.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 表面活性物质（Ⅱ型细胞分泌）：降低表面</text><text x="25.0" y="456.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">张力 → 防止肺泡塌陷</text><rect x="15.0" y="481.0" width="300.0" height="76.0" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/><text x="25.0" y="497.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">胸膜腔是「负压」且「封闭」——一旦破裂成气</text><text x="25.0" y="513.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">胸，肺立刻塌陷</text><text x="25.0" y="529.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">肺泡表面活性物质缺乏（新生儿呼吸窘迫）→ </text><text x="25.0" y="545.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">肺泡塌陷 → 通气障碍</text><rect x="11.0" y="560.0" width="308.0" height="51.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="165.0" y="575.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">吸气主动（肌收缩）、平静呼气被动（弹性回缩</text><text x="165.0" y="590.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">）；弹性阻力占七成</text></svg>