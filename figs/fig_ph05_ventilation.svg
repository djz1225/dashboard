<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 647" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="肺通气：动力与阻力"><title>肺通气：动力与阻力</title><desc>肺通气动力来自呼吸肌收缩引起的胸膜腔负压与肺内压变化，吸气主动、平静呼气被动；阻力以弹性阻力为主（占 70%），表面活性物质降低表面张力防止肺泡塌陷。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肺通气：动力是压力差，阻力以弹性为主</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">吸气主动、平静呼气被动；胸膜腔负压是「封闭＋负压」两个条件</text><rect x="18.0" y="59.0" width="3.0" height="14.0" rx="1.5" fill="#0f766e"/><text x="28.0" y="69.0" font-size="13.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">动力：呼吸肌收缩 → 胸膜腔负压 → 肺内压变化</text><rect x="18.0" y="81.0" width="364.0" height="46.0" rx="8" fill="#fdeceb" stroke="#c0392b" stroke-width="1.1"/><rect x="18.0" y="81.0" width="3.5" height="46.0" rx="1.8" fill="#c0392b"/><circle cx="38" cy="99" r="9.5" fill="#c0392b"/><text x="38.0" y="103.0" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">1</text><text x="56.0" y="103.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">吸气肌收缩</text><text x="370.0" y="103.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">主动</text><text x="56.0" y="121.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">膈肌＋肋间外肌 → 胸廓容积扩大</text><line x1="38.0" y1="129.0" x2="38.0" y2="144.0" stroke="#4a5a6b" stroke-width="2" stroke-linecap="round"/><line x1="38.0" y1="144.0" x2="34.2" y2="137.0" stroke="#4a5a6b" stroke-width="2" stroke-linecap="round"/><line x1="38.0" y1="144.0" x2="41.8" y2="137.0" stroke="#4a5a6b" stroke-width="2" stroke-linecap="round"/><rect x="18.0" y="127.0" width="364.0" height="46.0" rx="8" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1.1"/><rect x="18.0" y="127.0" width="3.5" height="46.0" rx="1.8" fill="#1f6fb2"/><circle cx="38" cy="145" r="9.5" fill="#1f6fb2"/><text x="38.0" y="149.0" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">2</text><text x="56.0" y="149.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胸膜腔负压增大</text><text x="370.0" y="149.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">负压</text><text x="56.0" y="167.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肺被牵拉扩张 → 肺内压＜大气压</text><line x1="38.0" y1="175.0" x2="38.0" y2="190.0" stroke="#4a5a6b" stroke-width="2" stroke-linecap="round"/><line x1="38.0" y1="190.0" x2="34.2" y2="183.0" stroke="#4a5a6b" stroke-width="2" stroke-linecap="round"/><line x1="38.0" y1="190.0" x2="41.8" y2="183.0" stroke="#4a5a6b" stroke-width="2" stroke-linecap="round"/><rect x="18.0" y="173.0" width="364.0" height="46.0" rx="8" fill="#e6f6ec" stroke="#2f8f57" stroke-width="1.1"/><rect x="18.0" y="173.0" width="3.5" height="46.0" rx="1.8" fill="#2f8f57"/><circle cx="38" cy="191" r="9.5" fill="#2f8f57"/><text x="38.0" y="195.0" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">3</text><text x="56.0" y="195.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">气体入肺</text><text x="370.0" y="195.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">进气</text><text x="56.0" y="213.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">压力差驱动气流，肺容积增大</text><line x1="38.0" y1="221.0" x2="38.0" y2="236.0" stroke="#4a5a6b" stroke-width="2" stroke-linecap="round"/><line x1="38.0" y1="236.0" x2="34.2" y2="229.0" stroke="#4a5a6b" stroke-width="2" stroke-linecap="round"/><line x1="38.0" y1="236.0" x2="41.8" y2="229.0" stroke="#4a5a6b" stroke-width="2" stroke-linecap="round"/><rect x="18.0" y="219.0" width="364.0" height="46.0" rx="8" fill="#eef2f7" stroke="#4a5a6b" stroke-width="1.1"/><rect x="18.0" y="219.0" width="3.5" height="46.0" rx="1.8" fill="#4a5a6b"/><circle cx="38" cy="237" r="9.5" fill="#4a5a6b"/><text x="38.0" y="241.0" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">4</text><text x="56.0" y="241.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">呼气</text><text x="370.0" y="241.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">被动</text><text x="56.0" y="259.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">平静呼气靠弹性回缩（被动）；用力呼气靠腹肌（主动）</text><rect x="18.0" y="283.0" width="364.0" height="262.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="301.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">阻力与顺应性</text><rect x="30.0" y="313.0" width="221.2" height="32.0" rx="4" fill="#fdeceb" stroke="#c0392b" stroke-width="1.1"/><text x="140.6" y="333.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">弹性阻力 70%</text><rect x="251.2" y="313.0" width="94.8" height="32.0" rx="4" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1.1"/><text x="298.6" y="333.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">非弹性阻力 30%</text><rect x="30.0" y="359.0" width="3.0" height="15.0" rx="1.5" fill="#c0392b"/><text x="39.0" y="372.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">弹性阻力</text><text x="347.0" y="372.0" text-anchor="end" font-size="12" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">70%</text><text x="39.0" y="390.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肺弹性纤维（1/3）＋肺泡表面张力（2/3）</text><rect x="30.0" y="400.0" width="3.0" height="15.0" rx="1.5" fill="#1f6fb2"/><text x="39.0" y="413.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">非弹性阻力</text><text x="347.0" y="413.0" text-anchor="end" font-size="12" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">30%</text><text x="39.0" y="431.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">以气道阻力为主，与气道半径四次方成反比</text><rect x="30.0" y="441.0" width="3.0" height="15.0" rx="1.5" fill="#2f8f57"/><text x="39.0" y="454.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肺顺应性</text><text x="347.0" y="454.0" text-anchor="end" font-size="12" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">0.2 L/cmH₂O</text><text x="39.0" y="472.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">＝容积变化/压力变化；肺气肿↑、肺纤维化</text><text x="39.0" y="488.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">↓</text><rect x="30.0" y="498.0" width="3.0" height="15.0" rx="1.5" fill="#7b4bb7"/><text x="39.0" y="511.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">表面活性物质</text><text x="347.0" y="511.0" text-anchor="end" font-size="12" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Ⅱ型细胞</text><text x="39.0" y="529.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">降低表面张力、防止肺泡塌陷；新生儿缺乏→</text><text x="39.0" y="545.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">呼吸窘迫</text><rect x="18.0" y="557.0" width="364.0" height="70.0" rx="8" fill="#eef2f7"/><rect x="18.0" y="557.0" width="3.5" height="70.0" rx="1.8" fill="#4a5a6b"/><text x="32.0" y="577.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="594.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胸膜腔一旦破裂成气胸，负压消失 → 肺立刻塌陷；这</text><text x="32.0" y="613.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">解释了为什么胸膜腔必须是「封闭＋负压」。</text></svg>