<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 502" width="100%" style="max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px" role="img"><text x="165.0" y="22.6" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">平滑肌收缩：与骨骼肌的三处关键不同</text><text x="165.0" y="43.0" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">无肌钙蛋白，靠钙调蛋白；可持久收缩耗能极少</text><rect x="15.0" y="60.0" width="300.0" height="26.0" rx="4" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/><text x="85.0" y="78.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">骨骼肌</text><text x="241.0" y="78.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">平滑肌</text><rect x="15.0" y="86.0" width="300.0" height="29.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="21.0" y="104.5" text-anchor="start" font-size="13.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">Ca²⁺ 受体</text><text x="91.0" y="100.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">肌钙蛋白</text><text x="309.0" y="100.0" text-anchor="end" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">钙调蛋白（CaM）</text><rect x="15.0" y="118.0" width="300.0" height="29.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="21.0" y="136.5" text-anchor="start" font-size="13.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">调控方式</text><text x="91.0" y="132.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">原肌球蛋白移位</text><text x="309.0" y="132.0" text-anchor="end" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">MLCK 磷酸化</text><rect x="15.0" y="150.0" width="300.0" height="46.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="21.0" y="177.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">Ca²⁺ 来源</text><text x="91.0" y="164.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">主要肌质网</text><text x="309.0" y="164.0" text-anchor="end" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">细胞外为主</text><text x="309.0" y="181.0" text-anchor="end" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">（也来自肌质网）</text><rect x="15.0" y="199.0" width="300.0" height="46.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="21.0" y="226.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">结构与收缩</text><text x="91.0" y="213.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">横纹、快、易疲劳</text><text x="309.0" y="213.0" text-anchor="end" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">无横纹、慢、</text><text x="309.0" y="230.0" text-anchor="end" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">耗能少能持久</text><rect x="15.0" y="254.0" width="300.0" height="134.0" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="25.0" y="273.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">平滑肌的两个特有现象</text><text x="25.0" y="291.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 单个单位平滑肌：细胞间有缝隙连接，</text><text x="25.0" y="307.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">同步收缩（胃肠、子宫）</text><text x="25.0" y="323.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 多单位平滑肌：各自独立受支配（睫状肌、</text><text x="25.0" y="339.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">虹膜）</text><text x="25.0" y="355.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 可发生「紧张性收缩」：长时间维持张力而</text><text x="25.0" y="371.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">耗能很少</text><rect x="15.0" y="396.0" width="300.0" height="44.0" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/><text x="25.0" y="412.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">最大区别：平滑肌没有肌钙蛋白，Ca²⁺ 通过</text><text x="25.0" y="428.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">钙调蛋白起作用</text><rect x="11.0" y="443.0" width="308.0" height="51.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="165.0" y="458.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">骨骼肌靠肌钙蛋白，平滑肌靠钙调蛋白+MLCK；</text><text x="165.0" y="473.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">后者慢但省能持久</text></svg>