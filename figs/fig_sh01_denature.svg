<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 508" width="100%" style="max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px" role="img"><text x="165.0" y="22.6" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">变性：只破坏空间构象</text><text x="165.0" y="43.0" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">一级结构完好，所以变性蛋白仍能被蛋白酶水解</text><rect x="15.0" y="58.0" width="94.7" height="84.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/><text x="62.3" y="76.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">天然构象</text><circle cx="62" cy="102" r="15" fill="#ffffff" stroke="#0f766e" stroke-width="1.8"/><path d="M53.333333333333336,102 q9,-10 18,0" fill="none" stroke="#0f766e" stroke-width="1.4"/><text x="62.3" y="132.0" text-anchor="middle" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">有活性</text><rect x="117.7" y="58.0" width="94.7" height="84.0" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.4"/><text x="165.0" y="76.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">变性</text><path d="M147.0,98 q9,10 18,0 q9,-10 18,0" fill="none" stroke="#b91c1c" stroke-width="1.8" stroke-linecap="round"/><path d="M151.0,110 q8,-8 16,2" fill="none" stroke="#b91c1c" stroke-width="1.4" stroke-linecap="round"/><text x="165.0" y="132.0" text-anchor="middle" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">活性丧失</text><rect x="220.3" y="58.0" width="94.7" height="84.0" rx="7" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/><text x="267.7" y="76.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">复性</text><circle cx="268" cy="102" r="15" fill="#ffffff" stroke="#15803d" stroke-width="1.8"/><path d="M258.6666666666667,102 q9,-10 18,0" fill="none" stroke="#15803d" stroke-width="1.4"/><text x="267.7" y="132.0" text-anchor="middle" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">活性恢复</text><line x1="107.7" y1="102.0" x2="111.2" y2="102.0" stroke="#64748b" stroke-width="1.4" stroke-linecap="round"/><polygon points="115.7,102.0 111.1,104.0 111.1,100.0" fill="#64748b"/><line x1="216.3" y1="102.0" x2="219.8" y2="102.0" stroke="#64748b" stroke-width="1.4" stroke-linecap="round"/><polygon points="224.3,102.0 219.8,104.0 219.8,100.0" fill="#64748b"/><rect x="15.0" y="154.0" width="300.0" height="118.0" rx="7" fill="#fee2e2" stroke="#cbd5e1" stroke-width="1.4"/><text x="25.0" y="173.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">变性后：改变的是什么</text><text x="25.0" y="191.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 改变：空间构象破坏、溶解度降低、</text><text x="25.0" y="207.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">黏度增加、结晶能力消失</text><text x="25.0" y="223.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 改变：生物活性丧失、易被蛋白酶水解</text><text x="25.0" y="239.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 不变：一级结构、280 nm 紫外吸收、</text><text x="25.0" y="255.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">双缩脲等呈色反应、分子量</text><rect x="15.0" y="280.0" width="300.0" height="42.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="27.0" y="300.0" text-anchor="start" font-size="14" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">盐析（不变性）</text><text x="305.0" y="300.0" text-anchor="end" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">可逆</text><text x="27.0" y="317.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">高浓度中性盐破坏水化膜+中和电荷，可逆</text><rect x="15.0" y="332.0" width="300.0" height="42.0" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/><text x="27.0" y="352.0" text-anchor="start" font-size="14" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">变性沉淀（不可逆）</text><text x="305.0" y="352.0" text-anchor="end" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">不可逆</text><text x="27.0" y="369.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">加热/强酸碱/重金属/有机溶剂</text><rect x="15.0" y="384.0" width="300.0" height="60.0" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/><text x="25.0" y="400.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">易错：变性≠沉淀，沉淀≠变性（盐析可沉淀而</text><text x="25.0" y="416.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">不变性）</text><text x="25.0" y="432.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">复性前提：变性程度轻、未形成不可逆聚集</text><rect x="11.0" y="449.0" width="308.0" height="51.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="165.0" y="464.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">变性只毁空间构象、不动一级结构；盐析是沉淀</text><text x="165.0" y="479.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">不变性，二者不能混</text></svg>