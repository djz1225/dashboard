<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 531" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="变性与盐析：两件事"><title>变性与盐析：两件事</title><desc>变性破坏空间构象而保留一级结构，多不可逆；盐析用高浓度中性盐破坏水化膜与电荷使蛋白沉淀，但不改变构象，可逆。二者不能混为一谈。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">变性与盐析：两件事</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">变性动的是空间构象，盐析动的是溶解度——前者多不可逆，</text><text x="18.0" y="68.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">后者可逆</text><rect x="18.0" y="82.0" width="364.0" height="144.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="101.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">两条路径</text><text x="30.0" y="116.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">热、强酸碱、重金属、有机溶剂 → 构象被破坏</text><rect x="30.0" y="126.0" width="104.7" height="28.0" rx="6" fill="#fdeceb" stroke="#c0392b" stroke-width="1"/><text x="82.3" y="144.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">天然构象 有活性</text><line x1="136.2" y1="140.0" x2="146.2" y2="140.0" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="146.2" y1="140.0" x2="142.2" y2="142.2" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="146.2" y1="140.0" x2="142.2" y2="137.8" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><rect x="147.7" y="126.0" width="104.7" height="28.0" rx="6" fill="#fdeceb" stroke="#c0392b" stroke-width="1"/><text x="200.0" y="144.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">变性 活性丧失</text><line x1="253.8" y1="140.0" x2="263.8" y2="140.0" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="263.8" y1="140.0" x2="259.9" y2="142.2" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="263.8" y1="140.0" x2="259.9" y2="137.8" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><rect x="265.3" y="126.0" width="104.7" height="28.0" rx="6" fill="#fdeceb" stroke="#c0392b" stroke-width="1"/><text x="317.7" y="144.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">复性 活性恢复</text><text x="30.0" y="176.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">高浓度中性盐 → 破坏水化膜 + 中和电荷</text><rect x="30.0" y="186.0" width="104.7" height="28.0" rx="6" fill="#e6f6ec" stroke="#2f8f57" stroke-width="1"/><text x="82.3" y="204.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">蛋白质溶液</text><line x1="136.2" y1="200.0" x2="146.2" y2="200.0" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="146.2" y1="200.0" x2="142.2" y2="202.2" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="146.2" y1="200.0" x2="142.2" y2="197.8" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><rect x="147.7" y="186.0" width="104.7" height="28.0" rx="6" fill="#e6f6ec" stroke="#2f8f57" stroke-width="1"/><text x="200.0" y="204.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">盐析 沉淀</text><line x1="253.8" y1="200.0" x2="263.8" y2="200.0" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="263.8" y1="200.0" x2="259.9" y2="202.2" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="263.8" y1="200.0" x2="259.9" y2="197.8" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><rect x="265.3" y="186.0" width="104.7" height="28.0" rx="6" fill="#e6f6ec" stroke="#2f8f57" stroke-width="1"/><text x="317.7" y="204.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">透析去盐 复溶</text><rect x="18.0" y="238.0" width="177.0" height="100.0" rx="9" fill="#fdeceb" stroke="#c0392b" stroke-width="1.1"/><text x="29.0" y="259.0" font-size="12.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">变性·改变</text><text x="29.0" y="278.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">空间构象破坏、生物活性丧失</text><text x="29.0" y="298.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">溶解度↓、黏度↑、易被蛋</text><text x="29.0" y="314.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">白酶水解</text><rect x="205.0" y="238.0" width="177.0" height="100.0" rx="9" fill="#e6f6ec" stroke="#2f8f57" stroke-width="1.1"/><text x="216.0" y="259.0" font-size="12.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">变性·不变</text><text x="216.0" y="278.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一级结构、分子量</text><text x="216.0" y="298.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">280 nm 吸收、双缩脲呈</text><text x="216.0" y="314.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">色反应</text><rect x="18.0" y="348.0" width="177.0" height="100.0" rx="9" fill="#fef3c7" stroke="#b45309" stroke-width="1.1"/><text x="29.0" y="369.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">盐析·机制</text><text x="29.0" y="388.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">高浓度中性盐抢走水化膜</text><text x="29.0" y="408.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">中和表面电荷 → 沉淀</text><text x="29.0" y="424.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">但不变性</text><rect x="205.0" y="348.0" width="177.0" height="100.0" rx="9" fill="#eef2f7" stroke="#4a5a6b" stroke-width="1.1"/><text x="216.0" y="369.0" font-size="12.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">复性的前提</text><text x="216.0" y="388.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">变性程度轻</text><text x="216.0" y="408.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">未形成不可逆的聚集</text><rect x="18.0" y="460.0" width="364.0" height="51.0" rx="8" fill="#e2f5f2"/><rect x="18.0" y="460.0" width="3.5" height="51.0" rx="1.8" fill="#0f766e"/><text x="32.0" y="480.0" font-size="11.5" font-weight="700" fill="#0f766e" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="497.0" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">变性≠沉淀、沉淀≠变性：盐析能沉淀蛋白却不使其变性。</text></svg>