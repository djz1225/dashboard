<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 741" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="血红素合成：线粒体—胞质—线粒体三段"><title>血红素合成：线粒体—胞质—线粒体三段</title><desc>血红素合成在线粒体—胞质—线粒体之间穿梭三段：① 线粒体内琥珀酰CoA 与甘氨酸缩合成 ALA，ALA 合酶为限速酶、需磷酸吡哆醛（维生素 B₆）；② 胞质内 2 分子 ALA 经 ALA 脱水酶生成胆色素原，再经多步生成粪卟啉原Ⅲ；③ 回到线粒体，原卟啉Ⅸ 与 Fe²⁺ 在亚铁螯合酶催化下生成血红素。血红素反馈抑制 ALA 合酶。铅抑制 ALA 脱水酶与亚铁螯合酶，导致贫血、尿 ALA 与卟啉升高、腹绞痛与神经症状。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">血红素合成：线粒体—胞质—线粒体三段</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">ALA 合酶是限速酶（需 B₆）；铅抑制的是第 2 步 ALA 脱水酶</text><text x="18.0" y="68.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">与第 3 步亚铁螯合酶</text><rect x="18.0" y="82.0" width="364.0" height="348.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="101.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">三段穿梭，两个部位</text><rect x="30.0" y="114.0" width="332.0" height="80.0" rx="8" fill="#ffffff" stroke="#e3eaf2" stroke-width="1.1"/><rect x="30.0" y="114.0" width="3.5" height="80.0" rx="1.8" fill="#b45309"/><circle cx="49.0" cy="131.0" r="9" fill="#b45309"/><text x="49.0" y="135.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">1</text><text x="65.0" y="135.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">① 线粒体：起步</text><text x="352.0" y="135.0" text-anchor="end" font-size="12" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">ALA 合酶</text><text x="65.0" y="153.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">琥珀酰CoA + 甘氨酸 → ALA；ALA 合</text><text x="65.0" y="169.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">酶为限速酶，需磷酸吡哆醛（维</text><text x="65.0" y="185.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">生素B₆）</text><line x1="49.0" y1="196.0" x2="49.0" y2="204.0" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="204.0" x2="45.6" y2="197.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="204.0" x2="52.4" y2="197.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><rect x="30.0" y="206.0" width="332.0" height="64.0" rx="8" fill="#ffffff" stroke="#e3eaf2" stroke-width="1.1"/><rect x="30.0" y="206.0" width="3.5" height="64.0" rx="1.8" fill="#1f6fb2"/><circle cx="49.0" cy="223.0" r="9" fill="#1f6fb2"/><text x="49.0" y="227.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">2</text><text x="65.0" y="227.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">② 胞质：中间段</text><text x="352.0" y="227.0" text-anchor="end" font-size="12" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">铅抑制</text><text x="65.0" y="245.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">2 分子 ALA → 胆色素原 → …… → 粪</text><text x="65.0" y="261.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">卟啉原Ⅲ；ALA 脱水酶即在此步</text><line x1="49.0" y1="272.0" x2="49.0" y2="280.0" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="280.0" x2="45.6" y2="273.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="280.0" x2="52.4" y2="273.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><rect x="30.0" y="282.0" width="332.0" height="64.0" rx="8" fill="#ffffff" stroke="#e3eaf2" stroke-width="1.1"/><rect x="30.0" y="282.0" width="3.5" height="64.0" rx="1.8" fill="#c1440e"/><circle cx="49.0" cy="299.0" r="9" fill="#c1440e"/><text x="49.0" y="303.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">3</text><text x="65.0" y="303.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">③ 线粒体：收尾</text><text x="352.0" y="303.0" text-anchor="end" font-size="12" font-weight="700" fill="#c1440e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">铅抑制</text><text x="65.0" y="321.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">原卟啉Ⅸ + Fe²⁺ → 血红素；亚铁螯合</text><text x="65.0" y="337.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">酶催化，缺铁则原卟啉堆积</text><line x1="49.0" y1="348.0" x2="49.0" y2="356.0" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="356.0" x2="45.6" y2="349.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="356.0" x2="52.4" y2="349.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><rect x="30.0" y="358.0" width="332.0" height="64.0" rx="8" fill="#ffffff" stroke="#e3eaf2" stroke-width="1.1"/><rect x="30.0" y="358.0" width="3.5" height="64.0" rx="1.8" fill="#0f766e"/><circle cx="49.0" cy="375.0" r="9" fill="#0f766e"/><text x="49.0" y="379.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">4</text><text x="65.0" y="379.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">④ 反馈调节</text><text x="352.0" y="379.0" text-anchor="end" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">终产物反馈</text><text x="65.0" y="397.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">血红素作为终产物反馈抑制 ALA 合酶，</text><text x="65.0" y="413.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">合成速率随需求自动匹配</text><rect x="18.0" y="442.0" width="364.0" height="197.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="461.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">铅中毒为什么是这三个表现</text><rect x="30.0" y="472.0" width="3.0" height="15.0" rx="1.5" fill="#c0392b"/><text x="39.0" y="485.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">贫血</text><text x="362.0" y="485.0" text-anchor="end" font-size="12" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">两个酶被抑制</text><text x="39.0" y="503.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">ALA 脱水酶 + 亚铁螯合酶受阻 → 血红</text><text x="39.0" y="519.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">素不足 → 小细胞低色素贫血</text><rect x="30.0" y="528.0" width="3.0" height="15.0" rx="1.5" fill="#b45309"/><text x="39.0" y="541.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">尿 ALA / 卟啉升高</text><text x="362.0" y="541.0" text-anchor="end" font-size="12" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">中间产物堆积</text><text x="39.0" y="559.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">ALA、粪卟啉原不能前行，经尿排出</text><text x="39.0" y="575.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">使尿色加深</text><rect x="30.0" y="584.0" width="3.0" height="15.0" rx="1.5" fill="#4a5a6b"/><text x="39.0" y="597.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">腹绞痛与神经症状</text><text x="362.0" y="597.0" text-anchor="end" font-size="12" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">干扰钙依赖过程</text><text x="39.0" y="615.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">铅干扰钙依赖的神经递质释放与神</text><text x="39.0" y="631.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">经传导</text><rect x="18.0" y="651.0" width="364.0" height="70.0" rx="8" fill="#fef3c7"/><rect x="18.0" y="651.0" width="3.5" height="70.0" rx="1.8" fill="#b45309"/><text x="32.0" y="671.0" font-size="11.5" font-weight="700" fill="#b45309" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">易错</text><text x="32.0" y="688.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">铅抑制 ALA 脱水酶（第 2 步）与亚铁螯合酶（第 3</text><text x="32.0" y="707.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">步），不是限速酶 ALA 合酶。</text></svg>