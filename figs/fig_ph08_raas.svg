<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 608" width="100%" style="max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px" role="img"><text x="165.0" y="22.6" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">肾素-血管紧张素-醛固酮系统</text><text x="165.0" y="43.0" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">从「肾灌注不足」一路到「保钠升压」</text><rect x="15.0" y="60.0" width="300.0" height="54.0" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/><text x="27.0" y="80.0" text-anchor="start" font-size="14" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">① 触发</text><text x="27.0" y="98.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">肾灌注压↓、远曲小管 Na⁺↓、交感兴奋 → 球</text><text x="27.0" y="114.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">旁细胞释放肾素</text><line x1="165.0" y1="115.0" x2="165.0" y2="115.5" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/><polygon points="165.0,120.0 163.0,115.4 167.0,115.4" fill="#64748b"/><rect x="15.0" y="121.0" width="300.0" height="38.0" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/><text x="27.0" y="141.0" text-anchor="start" font-size="14" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">② 血管紧张素原</text><text x="27.0" y="159.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">肝产生，被肾素切成 Ang Ⅰ（十肽）</text><line x1="165.0" y1="160.0" x2="165.0" y2="160.5" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/><polygon points="165.0,165.0 163.0,160.4 167.0,160.4" fill="#64748b"/><rect x="15.0" y="166.0" width="300.0" height="38.0" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/><text x="27.0" y="186.0" text-anchor="start" font-size="14" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">③ Ang Ⅰ → Ang Ⅱ</text><text x="27.0" y="204.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">经肺 ACE（血管紧张素转换酶）切除两肽</text><line x1="165.0" y1="205.0" x2="165.0" y2="205.5" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/><polygon points="165.0,210.0 163.0,205.4 167.0,205.4" fill="#64748b"/><rect x="15.0" y="211.0" width="300.0" height="38.0" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.4"/><text x="27.0" y="231.0" text-anchor="start" font-size="14" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">④ Ang Ⅱ 的双作用</text><text x="27.0" y="249.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">① 强力缩血管 ② 促醛固酮分泌</text><line x1="165.0" y1="250.0" x2="165.0" y2="250.5" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/><polygon points="165.0,255.0 163.0,250.4 167.0,250.4" fill="#64748b"/><rect x="15.0" y="256.0" width="300.0" height="38.0" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.4"/><text x="27.0" y="276.0" text-anchor="start" font-size="14" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">⑤ 醛固酮</text><text x="27.0" y="294.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">远曲小管保 Na⁺ 排 K⁺ → 水钠潴留、血压↑</text><rect x="15.0" y="296.0" width="300.0" height="134.0" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="25.0" y="315.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">临床对应药物</text><text x="25.0" y="333.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· ACEI（普利类）：抑制 ACE，减少 Ang Ⅱ，</text><text x="25.0" y="349.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">但会咳嗽（缓激肽堆积）</text><text x="25.0" y="365.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· ARB（沙坦类）：阻断 Ang Ⅱ 的 AT₁ 受体，</text><text x="25.0" y="381.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">不咳嗽</text><text x="25.0" y="397.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 醛固酮拮抗剂（螺内酯）：保钾利尿</text><text x="25.0" y="413.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 肾素抑制剂（阿利吉仑）</text><rect x="15.0" y="438.0" width="300.0" height="108.0" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/><text x="25.0" y="454.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">Ang Ⅱ 比去甲肾上腺素缩血管还强（约 40 倍</text><text x="25.0" y="470.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">）</text><text x="25.0" y="486.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">ACEI/ARB 会升高血钾，与保钾利尿剂合用要</text><text x="25.0" y="502.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">警惕高钾</text><text x="25.0" y="518.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">双侧肾动脉狭窄时禁用 ACEI/ARB——会急性肾</text><text x="25.0" y="534.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">衰</text><rect x="11.0" y="549.0" width="308.0" height="51.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="165.0" y="564.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">肾素→AngⅠ→(ACE)→AngⅡ→缩血管＋促醛固酮；</text><text x="165.0" y="579.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">普利类抑制ACE、沙坦类阻断受体</text></svg>