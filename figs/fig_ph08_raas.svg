<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 776" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="肾素-血管紧张素-醛固酮系统"><title>肾素-血管紧张素-醛固酮系统</title><desc>肾灌注压下降、远曲小管 Na⁺ 减少或交感兴奋使球旁细胞释放肾素，将肝源血管紧张素原切为 Ang Ⅰ，经肺 ACE 转为 Ang Ⅱ；Ang Ⅱ 强力缩血管并促醛固酮分泌，后者保 Na⁺ 排 K⁺、水钠潴留升压；血压升高回头抑制肾素，属负反馈。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肾素-血管紧张素-醛固酮系统</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">从「肾灌注不足」一路到「保钠升压」</text><rect x="18.0" y="65.0" width="364.0" height="413.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="83.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">纵向因果链</text><rect x="56.0" y="93.0" width="254.0" height="64.0" rx="8" fill="#fdeceb" stroke="#c0392b" stroke-width="1.1"/><rect x="56.0" y="93.0" width="3.2" height="64.0" rx="1.6" fill="#c0392b"/><circle cx="41" cy="109" r="8.5" fill="#c0392b"/><text x="41.0" y="113.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">1</text><text x="68.0" y="113.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">触发</text><text x="300.0" y="113.0" text-anchor="end" font-size="11" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">球旁细胞</text><text x="68.0" y="130.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肾灌注压↓、远曲小管 Na⁺↓、交感兴奋 </text><text x="68.0" y="145.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">→ 球旁细胞释放肾素</text><line x1="78.0" y1="159.0" x2="78.0" y2="173.0" stroke="#4a5a6b" stroke-width="1.7" stroke-linecap="round"/><line x1="78.0" y1="173.0" x2="74.9" y2="167.3" stroke="#4a5a6b" stroke-width="1.7" stroke-linecap="round"/><line x1="78.0" y1="173.0" x2="81.1" y2="167.3" stroke="#4a5a6b" stroke-width="1.7" stroke-linecap="round"/><rect x="56.0" y="175.0" width="254.0" height="49.0" rx="8" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1.1"/><rect x="56.0" y="175.0" width="3.2" height="49.0" rx="1.6" fill="#1f6fb2"/><circle cx="41" cy="191" r="8.5" fill="#1f6fb2"/><text x="41.0" y="195.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">2</text><text x="68.0" y="195.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肾素切血管紧张素原</text><text x="300.0" y="195.0" text-anchor="end" font-size="11" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">限速 step</text><text x="68.0" y="212.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肝产生的血管紧张素原被切成 Ang Ⅰ（十肽）</text><line x1="78.0" y1="226.0" x2="78.0" y2="240.0" stroke="#4a5a6b" stroke-width="1.7" stroke-linecap="round"/><line x1="78.0" y1="240.0" x2="74.9" y2="234.3" stroke="#4a5a6b" stroke-width="1.7" stroke-linecap="round"/><line x1="78.0" y1="240.0" x2="81.1" y2="234.3" stroke="#4a5a6b" stroke-width="1.7" stroke-linecap="round"/><rect x="56.0" y="242.0" width="254.0" height="64.0" rx="8" fill="#f2ecfb" stroke="#7b4bb7" stroke-width="1.1"/><rect x="56.0" y="242.0" width="3.2" height="64.0" rx="1.6" fill="#7b4bb7"/><circle cx="41" cy="258" r="8.5" fill="#7b4bb7"/><text x="41.0" y="262.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">3</text><text x="68.0" y="262.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">ACE 切两肽</text><text x="300.0" y="262.0" text-anchor="end" font-size="11" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肺</text><text x="68.0" y="279.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肺血管内皮 ACE 把 Ang Ⅰ 切成 Ang </text><text x="68.0" y="294.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Ⅱ（八肽）</text><line x1="78.0" y1="308.0" x2="78.0" y2="322.0" stroke="#4a5a6b" stroke-width="1.7" stroke-linecap="round"/><line x1="78.0" y1="322.0" x2="74.9" y2="316.3" stroke="#4a5a6b" stroke-width="1.7" stroke-linecap="round"/><line x1="78.0" y1="322.0" x2="81.1" y2="316.3" stroke="#4a5a6b" stroke-width="1.7" stroke-linecap="round"/><rect x="56.0" y="324.0" width="254.0" height="64.0" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.1"/><rect x="56.0" y="324.0" width="3.2" height="64.0" rx="1.6" fill="#b45309"/><circle cx="41" cy="340" r="8.5" fill="#b45309"/><text x="41.0" y="344.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">4</text><text x="68.0" y="344.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Ang Ⅱ 双作用</text><text x="300.0" y="344.0" text-anchor="end" font-size="11" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">升压</text><text x="68.0" y="361.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">① 强力缩血管 ② 促醛固酮分泌（比去甲肾</text><text x="68.0" y="376.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">强约 40 倍）</text><line x1="78.0" y1="390.0" x2="78.0" y2="404.0" stroke="#4a5a6b" stroke-width="1.7" stroke-linecap="round"/><line x1="78.0" y1="404.0" x2="74.9" y2="398.3" stroke="#4a5a6b" stroke-width="1.7" stroke-linecap="round"/><line x1="78.0" y1="404.0" x2="81.1" y2="398.3" stroke="#4a5a6b" stroke-width="1.7" stroke-linecap="round"/><rect x="56.0" y="406.0" width="254.0" height="64.0" rx="8" fill="#e6f6ec" stroke="#2f8f57" stroke-width="1.1"/><rect x="56.0" y="406.0" width="3.2" height="64.0" rx="1.6" fill="#2f8f57"/><circle cx="41" cy="422" r="8.5" fill="#2f8f57"/><text x="41.0" y="426.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">5</text><text x="68.0" y="426.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">醛固酮保钠</text><text x="300.0" y="426.0" text-anchor="end" font-size="11" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">保钠</text><text x="68.0" y="443.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">远曲小管、集合管保 Na⁺ 排 K⁺ → 水钠</text><text x="68.0" y="458.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">潴留 → 血压↑</text><polyline points="310.0,438.0 328.0,438.0 328.0,125.0" fill="none" stroke="#b45309" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 3"/><line x1="328.0" y1="130.0" x2="308.0" y2="125.0" stroke="#b45309" stroke-width="1.5" stroke-linecap="round"/><line x1="308.0" y1="125.0" x2="313.8" y2="123.5" stroke="#b45309" stroke-width="1.5" stroke-linecap="round"/><line x1="308.0" y1="125.0" x2="312.4" y2="129.1" stroke="#b45309" stroke-width="1.5" stroke-linecap="round"/><text x="331.0" y="118.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">负反馈</text><rect x="18.0" y="490.0" width="364.0" height="184.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="508.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">临床对应药物</text><rect x="31.0" y="518.0" width="3.0" height="15.0" rx="1.5" fill="#0f766e"/><text x="40.0" y="531.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">ACEI 普利类</text><text x="344.0" y="531.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">抑制 ACE</text><text x="40.0" y="549.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Ang Ⅱ↓，但缓激肽堆积 → 干咳</text><rect x="31.0" y="557.0" width="3.0" height="15.0" rx="1.5" fill="#1f6fb2"/><text x="40.0" y="570.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">ARB 沙坦类</text><text x="344.0" y="570.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">阻断 AT₁</text><text x="40.0" y="588.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">不咳嗽，同样升高血钾</text><rect x="31.0" y="596.0" width="3.0" height="15.0" rx="1.5" fill="#7b4bb7"/><text x="40.0" y="609.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">螺内酯</text><text x="344.0" y="609.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">拮抗醛固酮</text><text x="40.0" y="627.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">保钾利尿，警惕高钾</text><rect x="31.0" y="635.0" width="3.0" height="15.0" rx="1.5" fill="#c0392b"/><text x="40.0" y="648.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">禁用</text><text x="344.0" y="648.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">双侧肾动脉狭窄</text><text x="40.0" y="666.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">ACEI/ARB 会致急性肾衰</text><rect x="18.0" y="686.0" width="364.0" height="70.0" rx="8" fill="#eef2f7"/><rect x="18.0" y="686.0" width="3.5" height="70.0" rx="1.8" fill="#4a5a6b"/><text x="32.0" y="706.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="723.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肾素→Ang Ⅰ→(ACE)→Ang Ⅱ→缩血管＋促醛固酮→</text><text x="32.0" y="742.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">保钠升压；血压升高又回头抑制肾素释放，构成负反馈。</text></svg>