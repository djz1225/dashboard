<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 561" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="剪接：两次酯交换与可变剪接"><title>剪接：两次酯交换与可变剪接</title><desc>真核 pre-mRNA 的剪接由剪接体（snRNP 加百余种蛋白）催化，经两次酯交换：第一次由分支点 A 的 2′-OH 攻击 5′ 剪接位点，切下上游外显子并使内含子形成套索；第二次由该外显子的 3′-OH 攻击 3′ 剪接位点，两个外显子连接，内含子以套索形式释放并降解。人类约 95% 的多外显子基因存在可变剪接，使一个基因产生多种 mRNA 与蛋白；剪接异常可致 β-地中海贫血与 SMA。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">剪接：两次酯交换与可变剪接</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">剪接体（snRNP + 上百蛋白）催化两次酯交换，内含子以套</text><text x="18.0" y="68.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">索形式释放</text><rect x="18.0" y="82.0" width="364.0" height="202.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="101.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">两次酯交换</text><rect x="30.0" y="114.0" width="92.4" height="20.0" rx="4" fill="#e2f5f2" stroke="#0f766e" stroke-width="1"/><text x="76.2" y="128.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">外显子 1</text><rect x="122.4" y="114.0" width="145.2" height="20.0" rx="4" fill="#eef2f7" stroke="#c9d6e2" stroke-width="1"/><text x="195.0" y="128.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">内含子（分支点 A）</text><rect x="267.6" y="114.0" width="92.4" height="20.0" rx="4" fill="#e2f5f2" stroke="#0f766e" stroke-width="1"/><text x="313.8" y="128.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">外显子 2</text><circle cx="234.6" cy="140.0" r="3.2" fill="#c1440e"/><text x="30.0" y="154.0" font-size="12" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">①</text><text x="46.0" y="154.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">第一次酯交换：分支点 A 的 2′-OH 攻击 5′ 剪接位点</text><text x="46.0" y="171.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">→ 切下外显子 1，内含子形成套索</text><text x="30.0" y="200.0" font-size="12" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">②</text><text x="46.0" y="200.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">第二次酯交换：外显子 1 的 3′-OH 攻击 3′ 剪接位点</text><text x="46.0" y="217.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">→ 两外显子连接</text><rect x="30.0" y="246.0" width="184.8" height="20.0" rx="4" fill="#e2f5f2" stroke="#0f766e" stroke-width="1"/><text x="122.4" y="260.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">成熟 mRNA（外显子 1+2）</text><rect x="18.0" y="296.0" width="364.0" height="163.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="315.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">可变剪接</text><rect x="30.0" y="326.0" width="3.0" height="15.0" rx="1.5" fill="#0f766e"/><text x="39.0" y="339.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">约 95%</text><text x="362.0" y="339.0" text-anchor="end" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">多外显子基因</text><text x="39.0" y="357.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">人类多外显子基因中约 95% 有可变剪接</text><rect x="30.0" y="365.0" width="3.0" height="15.0" rx="1.5" fill="#0f766e"/><text x="39.0" y="378.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">少数基因</text><text x="362.0" y="378.0" text-anchor="end" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">极大多样性</text><text x="39.0" y="396.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一个基因 → 多种 mRNA → 多种蛋白，是</text><text x="39.0" y="412.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">复杂生物的省基因策略</text><rect x="30.0" y="420.0" width="3.0" height="15.0" rx="1.5" fill="#c0392b"/><text x="39.0" y="433.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">剪接异常</text><text x="362.0" y="433.0" text-anchor="end" font-size="12" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">致病</text><text x="39.0" y="451.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">β-地中海贫血部分类型、脊髓性肌萎缩（SMA）</text><rect x="18.0" y="471.0" width="364.0" height="70.0" rx="8" fill="#fef3c7"/><rect x="18.0" y="471.0" width="3.5" height="70.0" rx="1.8" fill="#b45309"/><text x="32.0" y="491.0" font-size="11.5" font-weight="700" fill="#b45309" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">易错</text><text x="32.0" y="508.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">剪接靠 RNA-蛋白复合物与核酶活性，不是蛋白酶；内含</text><text x="32.0" y="527.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">子释放的形式是「套索」，不是线性片段。</text></svg>