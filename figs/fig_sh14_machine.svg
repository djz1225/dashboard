<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 552" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="复制体的七个岗位"><title>复制体的七个岗位</title><desc>复制体由七个岗位组成：解旋酶 DnaB 耗 ATP 解开双链形成复制叉；单链结合蛋白 SSB 保护单链防复性；拓扑异构酶消除正超螺旋；引物酶 DnaG 合成 RNA 引物提供 3′-OH；DNA 聚合酶Ⅲ 延伸新链并具 3′→5′ 外切校正；DNA 聚合酶Ⅰ 以 5′→3′ 外切切除引物并填补空隙；连接酶耗 ATP 封闭缺口。缺任何一环复制都无法完成。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">复制体的七个岗位</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">解旋 → 稳定 → 解压 → 引物 → 延伸 → 切除 → 连接，七</text><text x="18.0" y="68.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">步一条流水线</text><rect x="18.0" y="82.0" width="364.0" height="313.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="101.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">七个岗位各干一件事</text><rect x="30.0" y="112.0" width="3.0" height="15.0" rx="1.5" fill="#c1440e"/><text x="39.0" y="125.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">解旋酶 DnaB</text><text x="362.0" y="125.0" text-anchor="end" font-size="12" font-weight="700" fill="#c1440e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">耗 ATP</text><text x="39.0" y="143.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">解开双链形成复制叉，沿滞后链模板 5′→3′</text><text x="39.0" y="159.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">移动</text><rect x="30.0" y="166.0" width="3.0" height="15.0" rx="1.5" fill="#0f766e"/><text x="39.0" y="179.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">单链结合蛋白 SSB</text><text x="362.0" y="179.0" text-anchor="end" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">防复性</text><text x="39.0" y="197.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">覆盖单链、防止重新配对并被核酸酶降解</text><rect x="30.0" y="204.0" width="3.0" height="15.0" rx="1.5" fill="#b45309"/><text x="39.0" y="217.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">拓扑异构酶</text><text x="362.0" y="217.0" text-anchor="end" font-size="12" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">解压阀</text><text x="39.0" y="235.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">消除解旋产生的正超螺旋，否则复制叉会卡住</text><rect x="30.0" y="242.0" width="3.0" height="15.0" rx="1.5" fill="#7b4bb7"/><text x="39.0" y="255.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">引物酶 DnaG</text><text x="362.0" y="255.0" text-anchor="end" font-size="12" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">从头起始</text><text x="39.0" y="273.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">合成约 10 nt 的 RNA 引物，提供 3′-OH</text><rect x="30.0" y="280.0" width="3.0" height="15.0" rx="1.5" fill="#0f766e"/><text x="39.0" y="293.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">DNA 聚合酶Ⅲ</text><text x="362.0" y="293.0" text-anchor="end" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">主酶</text><text x="39.0" y="311.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">延伸新链；自带 3′→5′ 外切校正活性</text><rect x="30.0" y="318.0" width="3.0" height="15.0" rx="1.5" fill="#4a5a6b"/><text x="39.0" y="331.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">DNA 聚合酶Ⅰ</text><text x="362.0" y="331.0" text-anchor="end" font-size="12" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">换引物</text><text x="39.0" y="349.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">5′→3′ 外切切除 RNA 引物，同时填补空隙</text><rect x="30.0" y="356.0" width="3.0" height="15.0" rx="1.5" fill="#2f8f57"/><text x="39.0" y="369.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">DNA 连接酶</text><text x="362.0" y="369.0" text-anchor="end" font-size="12" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">封口</text><text x="39.0" y="387.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">连接相邻片段间的磷酸二酯键缺口，耗 ATP</text><rect x="18.0" y="407.0" width="42.1" height="26.0" rx="6" fill="#eef2f7" stroke="#4a5a6b" stroke-width="1"/><text x="39.1" y="425.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">解旋</text><line x1="61.6" y1="420.0" x2="70.1" y2="420.0" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="70.1" y1="420.0" x2="66.2" y2="422.2" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="70.1" y1="420.0" x2="66.2" y2="417.8" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><rect x="71.6" y="407.0" width="42.1" height="26.0" rx="6" fill="#eef2f7" stroke="#4a5a6b" stroke-width="1"/><text x="92.7" y="425.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">稳定</text><line x1="115.3" y1="420.0" x2="123.8" y2="420.0" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="123.8" y1="420.0" x2="119.8" y2="422.2" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="123.8" y1="420.0" x2="119.8" y2="417.8" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><rect x="125.3" y="407.0" width="42.1" height="26.0" rx="6" fill="#eef2f7" stroke="#4a5a6b" stroke-width="1"/><text x="146.4" y="425.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">解压</text><line x1="168.9" y1="420.0" x2="177.4" y2="420.0" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="177.4" y1="420.0" x2="173.5" y2="422.2" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="177.4" y1="420.0" x2="173.5" y2="417.8" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><rect x="178.9" y="407.0" width="42.1" height="26.0" rx="6" fill="#eef2f7" stroke="#4a5a6b" stroke-width="1"/><text x="200.0" y="425.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">引物</text><line x1="222.6" y1="420.0" x2="231.1" y2="420.0" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="231.1" y1="420.0" x2="227.1" y2="422.2" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="231.1" y1="420.0" x2="227.1" y2="417.8" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><rect x="232.6" y="407.0" width="42.1" height="26.0" rx="6" fill="#eef2f7" stroke="#4a5a6b" stroke-width="1"/><text x="253.6" y="425.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">延伸</text><line x1="276.2" y1="420.0" x2="284.7" y2="420.0" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="284.7" y1="420.0" x2="280.8" y2="422.2" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="284.7" y1="420.0" x2="280.8" y2="417.8" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><rect x="286.2" y="407.0" width="42.1" height="26.0" rx="6" fill="#eef2f7" stroke="#4a5a6b" stroke-width="1"/><text x="307.3" y="425.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">切除</text><line x1="329.9" y1="420.0" x2="338.4" y2="420.0" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="338.4" y1="420.0" x2="334.4" y2="422.2" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="338.4" y1="420.0" x2="334.4" y2="417.8" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><rect x="339.9" y="407.0" width="42.1" height="26.0" rx="6" fill="#eef2f7" stroke="#4a5a6b" stroke-width="1"/><text x="360.9" y="425.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">连接</text><rect x="18.0" y="443.0" width="364.0" height="89.0" rx="8" fill="#fef3c7"/><rect x="18.0" y="443.0" width="3.5" height="89.0" rx="1.8" fill="#b45309"/><text x="32.0" y="463.0" font-size="11.5" font-weight="700" fill="#b45309" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">易错</text><text x="32.0" y="480.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">两个外切方向最常混：聚合酶Ⅰ 用 5′→3′ 外切切引</text><text x="32.0" y="499.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">物，用 3′→5′ 外切校正错误；连接酶封的是缺口，</text><text x="32.0" y="518.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">不是双链断裂。</text></svg>