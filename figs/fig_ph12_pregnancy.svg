<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 563" width="100%" style="max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px" role="img"><text x="165.0" y="22.6" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">妊娠的维持与分娩启动</text><text x="165.0" y="43.0" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">HCG 救黄体，催产素发动分娩</text><rect x="15.0" y="60.0" width="300.0" height="38.0" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/><text x="27.0" y="80.0" text-anchor="start" font-size="14" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">① 着床</text><text x="27.0" y="98.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">受精后 6~7 天，滋养层侵入内膜</text><line x1="165.0" y1="99.0" x2="165.0" y2="99.5" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/><polygon points="165.0,104.0 163.0,99.4 167.0,99.4" fill="#64748b"/><rect x="15.0" y="105.0" width="300.0" height="54.0" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/><text x="27.0" y="125.0" text-anchor="start" font-size="14" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">② HCG</text><text x="27.0" y="143.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">滋养层分泌，维持黄体不萎缩 → 继续分泌孕</text><text x="27.0" y="159.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">激素</text><line x1="165.0" y1="160.0" x2="165.0" y2="160.5" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/><polygon points="165.0,165.0 163.0,160.4 167.0,160.4" fill="#64748b"/><rect x="15.0" y="166.0" width="300.0" height="54.0" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/><text x="27.0" y="186.0" text-anchor="start" font-size="14" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">③ 胎盘接替</text><text x="27.0" y="204.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">约 8~10 周后胎盘自己分泌孕激素，黄体可退</text><text x="27.0" y="220.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">化</text><line x1="165.0" y1="221.0" x2="165.0" y2="221.5" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/><polygon points="165.0,226.0 163.0,221.4 167.0,221.4" fill="#64748b"/><rect x="15.0" y="227.0" width="300.0" height="54.0" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.4"/><text x="27.0" y="247.0" text-anchor="start" font-size="14" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">④ 分娩启动</text><text x="27.0" y="265.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">催产素 + 前列腺素 → 子宫收缩 → 正反馈加</text><text x="27.0" y="281.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">强</text><rect x="15.0" y="283.0" width="300.0" height="102.0" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="25.0" y="302.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">分娩为什么是正反馈</text><text x="25.0" y="320.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 宫缩 → 压迫宫颈 → 催产素释放↑ → 宫缩</text><text x="25.0" y="336.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">更强</text><text x="25.0" y="352.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 直到胎儿娩出，刺激消失，循环终止</text><text x="25.0" y="368.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 这是正反馈「必须完成任务」的典型</text><rect x="15.0" y="393.0" width="300.0" height="108.0" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/><text x="25.0" y="409.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">HCG 在妊娠 8~10 周达高峰，之后下降——早孕</text><text x="25.0" y="425.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">反应与高峰相关</text><text x="25.0" y="441.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">孕激素使子宫安静（抑制收缩），这是保胎的</text><text x="25.0" y="457.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">激素基础</text><text x="25.0" y="473.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">催产素对子宫的作用在妊娠末期才明显（</text><text x="25.0" y="489.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">受体增多），故可用于引产</text><rect x="11.0" y="504.0" width="308.0" height="51.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="165.0" y="519.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">HCG 救黄体→胎盘接替；分娩靠催产素正反馈直</text><text x="165.0" y="534.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">到胎儿娩出</text></svg>