<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 619" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="妊娠的维持与分娩启动"><title>妊娠的维持与分娩启动</title><desc>受精后 6~7 天着床，滋养层分泌 HCG 维持黄体，8~10 周后胎盘接替分泌孕激素；孕激素使子宫安静，分娩时催产素与前列腺素使宫缩，经宫颈压迫形成正反馈直至胎儿娩出。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">妊娠的维持与分娩启动</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">HCG 救黄体，催产素发动分娩</text><rect x="18.0" y="65.0" width="364.0" height="295.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="83.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">妊娠四步</text><rect x="30.0" y="93.0" width="316.0" height="44.0" rx="8" fill="#eef2f7" stroke="#4a5a6b" stroke-width="1.1"/><rect x="30.0" y="93.0" width="3.2" height="44.0" rx="1.6" fill="#4a5a6b"/><circle cx="48" cy="110" r="8.5" fill="#4a5a6b"/><text x="48.0" y="114.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">1</text><text x="63.0" y="114.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">着床</text><text x="335.0" y="114.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">6~7 天</text><text x="63.0" y="131.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">受精后 6~7 天，滋养层侵入子宫内膜</text><line x1="48.0" y1="139.0" x2="48.0" y2="152.0" stroke="#4a5a6b" stroke-width="1.8" stroke-linecap="round"/><line x1="48.0" y1="152.0" x2="44.6" y2="145.9" stroke="#4a5a6b" stroke-width="1.8" stroke-linecap="round"/><line x1="48.0" y1="152.0" x2="51.4" y2="145.9" stroke="#4a5a6b" stroke-width="1.8" stroke-linecap="round"/><rect x="30.0" y="154.0" width="316.0" height="60.0" rx="8" fill="#e2f5f2" stroke="#0f766e" stroke-width="1.1"/><rect x="30.0" y="154.0" width="3.2" height="60.0" rx="1.6" fill="#0f766e"/><circle cx="48" cy="171" r="8.5" fill="#0f766e"/><text x="48.0" y="175.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">2</text><text x="63.0" y="175.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">HCG 救黄体</text><text x="335.0" y="175.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">8~10 周高峰</text><text x="63.0" y="192.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">滋养层分泌 HCG → 黄体不萎缩 → 继续分</text><text x="63.0" y="208.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">泌孕激素</text><line x1="48.0" y1="216.0" x2="48.0" y2="229.0" stroke="#4a5a6b" stroke-width="1.8" stroke-linecap="round"/><line x1="48.0" y1="229.0" x2="44.6" y2="222.9" stroke="#4a5a6b" stroke-width="1.8" stroke-linecap="round"/><line x1="48.0" y1="229.0" x2="51.4" y2="222.9" stroke="#4a5a6b" stroke-width="1.8" stroke-linecap="round"/><rect x="30.0" y="231.0" width="316.0" height="44.0" rx="8" fill="#f2ecfb" stroke="#7b4bb7" stroke-width="1.1"/><rect x="30.0" y="231.0" width="3.2" height="44.0" rx="1.6" fill="#7b4bb7"/><circle cx="48" cy="248" r="8.5" fill="#7b4bb7"/><text x="48.0" y="252.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">3</text><text x="63.0" y="252.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胎盘接替</text><text x="335.0" y="252.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">换班</text><text x="63.0" y="269.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">约 8~10 周后胎盘自己分泌孕激素，黄体可退化</text><line x1="48.0" y1="277.0" x2="48.0" y2="290.0" stroke="#4a5a6b" stroke-width="1.8" stroke-linecap="round"/><line x1="48.0" y1="290.0" x2="44.6" y2="283.9" stroke="#4a5a6b" stroke-width="1.8" stroke-linecap="round"/><line x1="48.0" y1="290.0" x2="51.4" y2="283.9" stroke="#4a5a6b" stroke-width="1.8" stroke-linecap="round"/><rect x="30.0" y="292.0" width="316.0" height="60.0" rx="8" fill="#fdeceb" stroke="#c0392b" stroke-width="1.1"/><rect x="30.0" y="292.0" width="3.2" height="60.0" rx="1.6" fill="#c0392b"/><circle cx="48" cy="309" r="8.5" fill="#c0392b"/><text x="48.0" y="313.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">4</text><text x="63.0" y="313.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">分娩启动</text><text x="335.0" y="313.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">正反馈</text><text x="63.0" y="330.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">催产素 + 前列腺素 → 子宫收缩 → 正反</text><text x="63.0" y="346.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">馈加强</text><rect x="18.0" y="372.0" width="364.0" height="145.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="390.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">维持与启动的分界</text><rect x="31.0" y="400.0" width="3.0" height="15.0" rx="1.5" fill="#1f6fb2"/><text x="40.0" y="413.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">维持期</text><text x="344.0" y="413.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">孕激素</text><text x="40.0" y="431.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">孕激素使子宫安静、抑制收缩，是保胎的激素基础</text><rect x="31.0" y="439.0" width="3.0" height="15.0" rx="1.5" fill="#c0392b"/><text x="40.0" y="452.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">启动期</text><text x="344.0" y="452.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">催产素</text><text x="40.0" y="470.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">妊娠末期子宫催产素受体增多，作用才明显</text><rect x="31.0" y="478.0" width="3.0" height="15.0" rx="1.5" fill="#b45309"/><text x="40.0" y="491.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">正反馈环</text><text x="344.0" y="491.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">越生越强</text><text x="40.0" y="509.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">宫缩→压迫宫颈→催产素↑→宫缩更强，直到胎儿娩出</text><rect x="18.0" y="529.0" width="364.0" height="70.0" rx="8" fill="#eef2f7"/><rect x="18.0" y="529.0" width="3.5" height="70.0" rx="1.8" fill="#4a5a6b"/><text x="32.0" y="549.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="566.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">HCG 救黄体 → 胎盘接替；分娩靠催产素正反馈直到胎</text><text x="32.0" y="585.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">儿娩出——这是正反馈「必须完成任务」的典型。</text></svg>