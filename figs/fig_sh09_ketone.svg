<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 610" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="酮体：肝造不用，肝外用"><title>酮体：肝造不用，肝外用</title><desc>酮体在肝线粒体由 2 乙酰CoA 经乙酰乙酰CoA、HMG-CoA 生成乙酰乙酸，再转为β-羟丁酸（约 70%）与丙酮；肝缺琥珀酰CoA 转硫酶，只能生成不能利用，肝外组织经该酶活化后硫解为 2 乙酰CoA 进入三羧酸循环。长期饥饿时脑可利用酮体供能达 60~70%。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">酮体：肝造不用，肝外用</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肝缺琥珀酰CoA 转硫酶，只能生产不能消费；酮体是脑的替代燃料</text><rect x="18.0" y="65.0" width="177.0" height="140.0" rx="9" fill="#f2ecfb" stroke="#7b4bb7" stroke-width="1.1"/><text x="29.0" y="86.0" font-size="12.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">生成｜肝线粒体</text><text x="29.0" y="105.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">2 乙酰CoA → 乙酰乙酰CoA</text><text x="29.0" y="125.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">→ HMG-CoA（HMG-CoA 合酶）</text><text x="29.0" y="145.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">→ 乙酰乙酸（裂解酶）</text><text x="29.0" y="165.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">→ β-羟丁酸 / 丙酮</text><rect x="205.0" y="65.0" width="177.0" height="140.0" rx="9" fill="#e6f6ec" stroke="#2f8f57" stroke-width="1.1"/><text x="216.0" y="86.0" font-size="12.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">利用｜肝外组织</text><text x="216.0" y="105.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">β-羟丁酸 → 乙酰乙酸</text><text x="216.0" y="125.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">琥珀酰CoA 转硫酶 → 乙酰</text><text x="216.0" y="141.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">乙酰CoA</text><text x="216.0" y="161.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">硫解 → 2 乙酰CoA</text><text x="216.0" y="181.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">进三羧酸循环供能</text><rect x="18.0" y="215.0" width="364.0" height="26.0" rx="6" fill="#f8fbfd"/><text x="26.0" y="232.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">酮体</text><text x="135.2" y="232.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">占比</text><text x="208.0" y="232.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">特点</text><line x1="18.0" y1="267.0" x2="382.0" y2="267.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="259.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">乙酰乙酸</text><text x="135.2" y="259.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">约 30%</text><text x="208.0" y="259.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">可被肝外利用</text><line x1="18.0" y1="293.0" x2="382.0" y2="293.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="285.0" font-size="12.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">β-羟丁酸</text><text x="135.2" y="285.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">约 70%</text><text x="208.0" y="285.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">主要形式，运输最稳定</text><line x1="18.0" y1="319.0" x2="382.0" y2="319.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="311.0" font-size="12.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">丙酮</text><text x="135.2" y="311.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">少量</text><text x="208.0" y="311.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">挥发性，经肺排出（烂苹果味）</text><rect x="18.0" y="327.0" width="364.0" height="181.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="346.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肝造不用的原因</text><rect x="30.0" y="357.0" width="3.0" height="15.0" rx="1.5" fill="#c0392b"/><text x="39.0" y="370.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">为什么肝不能利用</text><text x="370.0" y="370.0" text-anchor="end" font-size="12" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">缺一个酶</text><text x="39.0" y="388.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肝缺琥珀酰CoA 转硫酶，无法把乙酰乙酸活化为</text><text x="39.0" y="404.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">乙酰乙酰CoA</text><rect x="30.0" y="413.0" width="3.0" height="15.0" rx="1.5" fill="#0f766e"/><text x="39.0" y="426.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">不是浪费</text><text x="370.0" y="426.0" text-anchor="end" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">燃料投递</text><text x="39.0" y="444.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肝把酮体输送给脑、心、骨骼肌，本身不消耗</text><rect x="30.0" y="453.0" width="3.0" height="15.0" rx="1.5" fill="#2f8f57"/><text x="39.0" y="466.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">长期饥饿</text><text x="370.0" y="466.0" text-anchor="end" font-size="12" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">脑靠酮体</text><text x="39.0" y="484.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">脑可利用酮体供能达 60~70%，节省葡萄糖</text><text x="39.0" y="500.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">留给红细胞</text><rect x="18.0" y="520.0" width="364.0" height="70.0" rx="8" fill="#fef3c7"/><rect x="18.0" y="520.0" width="3.5" height="70.0" rx="1.8" fill="#b45309"/><text x="32.0" y="540.0" font-size="11.5" font-weight="700" fill="#b45309" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">易错</text><text x="32.0" y="557.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">酮体是替代燃料，不是代谢废物；饥饿性酮症 pH 基本</text><text x="32.0" y="576.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">正常，糖尿病酮症酸中毒才明显下降。</text></svg>