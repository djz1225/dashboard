<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 659" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="逆转录：中心法则的扩展"><title>逆转录：中心法则的扩展</title><desc>逆转录是以 RNA 为模板合成 DNA，为中心法则的扩展。逆转录酶需要引物提供 3′-OH（病毒借宿主 tRNA），先合成 RNA-DNA 杂交链，再由 RNase H 水解 RNA，最后合成第二条 DNA 链得到双链 cDNA，可整合进宿主基因组。应用包括 cDNA 合成与 RT-PCR；端粒酶本质即逆转录酶；抗 HIV 药物分核苷类（NRTI，掺入后链终止）与非核苷类（NNRTI，结合疏水口袋变构抑制）。逆转录酶无 3′→5′ 校正活性，故病毒变异率高。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">逆转录：中心法则的扩展</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">RNA → DNA：逆转录酶以 RNA 为模板、无校正活性，故病</text><text x="18.0" y="68.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">毒极易变异</text><rect x="18.0" y="82.0" width="364.0" height="256.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="101.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">三步</text><rect x="30.0" y="114.0" width="332.0" height="64.0" rx="8" fill="#ffffff" stroke="#e3eaf2" stroke-width="1.1"/><rect x="30.0" y="114.0" width="3.5" height="64.0" rx="1.8" fill="#7b4bb7"/><circle cx="49.0" cy="131.0" r="9" fill="#7b4bb7"/><text x="49.0" y="135.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">1</text><text x="65.0" y="135.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">① RNA 模板 + 引物</text><text x="352.0" y="135.0" text-anchor="end" font-size="12" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">需引物</text><text x="65.0" y="153.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">逆转录酶以 RNA 为模板，但需引物提供</text><text x="65.0" y="169.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">3′-OH；病毒借用宿主 tRNA</text><line x1="49.0" y1="180.0" x2="49.0" y2="188.0" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="188.0" x2="45.6" y2="181.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="188.0" x2="52.4" y2="181.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><rect x="30.0" y="190.0" width="332.0" height="64.0" rx="8" fill="#ffffff" stroke="#e3eaf2" stroke-width="1.1"/><rect x="30.0" y="190.0" width="3.5" height="64.0" rx="1.8" fill="#c1440e"/><circle cx="49.0" cy="207.0" r="9" fill="#c1440e"/><text x="49.0" y="211.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">2</text><text x="65.0" y="211.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">② 生成 RNA-DNA 杂交链</text><text x="352.0" y="211.0" text-anchor="end" font-size="12" font-weight="700" fill="#c1440e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">水解 RNA</text><text x="65.0" y="229.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">RNase H 水解杂交链中的 RNA 部分，</text><text x="65.0" y="245.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">留下单链 DNA</text><line x1="49.0" y1="256.0" x2="49.0" y2="264.0" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="264.0" x2="45.6" y2="257.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="264.0" x2="52.4" y2="257.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><rect x="30.0" y="266.0" width="332.0" height="64.0" rx="8" fill="#ffffff" stroke="#e3eaf2" stroke-width="1.1"/><rect x="30.0" y="266.0" width="3.5" height="64.0" rx="1.8" fill="#0f766e"/><circle cx="49.0" cy="283.0" r="9" fill="#0f766e"/><text x="49.0" y="287.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">3</text><text x="65.0" y="287.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">③ 合成第二条 DNA 链</text><text x="352.0" y="287.0" text-anchor="end" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">成 cDNA</text><text x="65.0" y="305.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">以第一条 DNA 为模板合成双链 cDNA，</text><text x="65.0" y="321.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">可整合进宿主基因组</text><rect x="18.0" y="350.0" width="364.0" height="26.0" rx="6" fill="#f8fbfd"/><text x="26.0" y="367.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">应用 / 药物</text><text x="135.2" y="367.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">原理</text><text x="280.8" y="367.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">落点</text><line x1="18.0" y1="418.0" x2="382.0" y2="418.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="394.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">cDNA 合成</text><text x="135.2" y="394.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">逆转录 + 第二链合成</text><text x="280.8" y="394.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">基因克隆、表达</text><text x="280.8" y="410.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">谱、RT-PCR</text><line x1="18.0" y1="460.0" x2="382.0" y2="460.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="436.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">端粒酶</text><text x="135.2" y="436.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">本质即逆转录酶</text><text x="280.8" y="436.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">自带 RNA 模板</text><text x="280.8" y="452.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">延长端粒</text><line x1="18.0" y1="502.0" x2="382.0" y2="502.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="478.0" font-size="12.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">NRTI 类抗</text><text x="26.0" y="494.0" font-size="12.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">HIV 药</text><text x="135.2" y="478.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">核苷类逆转录酶抑制剂</text><text x="280.8" y="478.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">如齐多夫定，掺</text><text x="280.8" y="494.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">入后链终止</text><line x1="18.0" y1="544.0" x2="382.0" y2="544.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="520.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">NNRTI 类</text><text x="135.2" y="520.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">非核苷类，结合酶</text><text x="135.2" y="536.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">疏水口袋</text><text x="280.8" y="520.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">变构抑制，不与</text><text x="280.8" y="536.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">底物竞争</text><rect x="18.0" y="550.0" width="364.0" height="89.0" rx="8" fill="#e2f5f2"/><rect x="18.0" y="550.0" width="3.5" height="89.0" rx="1.8" fill="#0f766e"/><text x="32.0" y="570.0" font-size="11.5" font-weight="700" fill="#0f766e" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">易错</text><text x="32.0" y="587.0" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">逆转录酶没有 3′→5′ 外切校正活性 → 错误率高</text><text x="32.0" y="606.0" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">→HIV 变异快，这是疫苗与单药治疗困难的根本原因；但</text><text x="32.0" y="625.0" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">蛋白质 → 核酸仍不成立。</text></svg>