<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 584" width="100%" style="max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px" role="img"><text x="165.0" y="22.6" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">药物-维生素拮抗：四组必记</text><text x="165.0" y="43.0" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">用错药 → 表现出维生素缺乏</text><rect x="15.0" y="58.0" width="300.0" height="60.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><rect x="15.0" y="58.0" width="4.5" height="60.0" rx="2.2" fill="#b91c1c"/><text x="29.0" y="77.0" text-anchor="start" font-size="14" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">异烟肼</text><text x="29.0" y="94.0" text-anchor="start" font-size="12" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">拮抗 B₆</text><text x="29.0" y="109.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">致周围神经病，需同补吡哆醇</text><rect x="15.0" y="122.0" width="300.0" height="60.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><rect x="15.0" y="122.0" width="4.5" height="60.0" rx="2.2" fill="#b91c1c"/><text x="29.0" y="141.0" text-anchor="start" font-size="14" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">甲氨蝶呤</text><text x="29.0" y="158.0" text-anchor="start" font-size="12" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">拮抗叶酸</text><text x="29.0" y="173.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">抑制二氢叶酸还原酶，需亚叶酸钙解救</text><rect x="15.0" y="186.0" width="300.0" height="60.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><rect x="15.0" y="186.0" width="4.5" height="60.0" rx="2.2" fill="#b45309"/><text x="29.0" y="205.0" text-anchor="start" font-size="14" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">华法林</text><text x="29.0" y="222.0" text-anchor="start" font-size="12" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">拮抗维生素 K</text><text x="29.0" y="237.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">抑制 K 环氧化物还原酶，测 PT/INR</text><rect x="15.0" y="250.0" width="300.0" height="60.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><rect x="15.0" y="250.0" width="4.5" height="60.0" rx="2.2" fill="#b45309"/><text x="29.0" y="269.0" text-anchor="start" font-size="14" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">肼苯哒嗪 / 青霉胺</text><text x="29.0" y="286.0" text-anchor="start" font-size="12" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">拮抗 B₆</text><text x="29.0" y="301.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">同类机制，注意神经症状</text><rect x="15.0" y="314.0" width="300.0" height="60.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><rect x="15.0" y="314.0" width="4.5" height="60.0" rx="2.2" fill="#0f766e"/><text x="29.0" y="333.0" text-anchor="start" font-size="14" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">长期广谱抗生素</text><text x="29.0" y="350.0" text-anchor="start" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">抑制肠道菌合成 K 与 B 族</text><text x="29.0" y="365.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">术后/ICU 注意补充</text><rect x="15.0" y="378.0" width="300.0" height="60.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><rect x="15.0" y="378.0" width="4.5" height="60.0" rx="2.2" fill="#0f766e"/><text x="29.0" y="397.0" text-anchor="start" font-size="14" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">奥美拉唑长期使用</text><text x="29.0" y="414.0" text-anchor="start" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">减少 B₁₂ 吸收</text><text x="29.0" y="429.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">胃酸不足致 B₁₂ 释放障碍</text><rect x="15.0" y="444.0" width="300.0" height="76.0" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/><text x="25.0" y="460.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">临床最常考：异烟肼→B₆、甲氨蝶呤→叶酸、</text><text x="25.0" y="476.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">华法林→维生素 K</text><text x="25.0" y="492.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">三者都要能说出「机制 + 监测指标 + 解救/</text><text x="25.0" y="508.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">替代」</text><rect x="11.0" y="525.0" width="308.0" height="51.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="165.0" y="540.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">异烟肼夺 B₆、甲氨蝶呤夺叶酸、华法林夺 K——</text><text x="165.0" y="555.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">机制决定监测与解救</text></svg>