<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 535" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="真核基因是断裂基因"><title>真核基因是断裂基因</title><desc>真核基因由外显子与内含子相间组成，属断裂基因：5′ 侧翼含启动子（TATA 框、CAAT 框、GC 框），外显子为成熟 mRNA 保留的片段（含 UTR），内含子转录后被剪除，3′ 侧翼的 AAUAAA 信号决定切割与加尾。人基因平均约 27 kb、平均 8 个内含子，外显子平均仅约 145 bp；剪接位点遵循 GT-AG 规则，可变剪接使一个基因产生多种 mRNA。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">真核基因是断裂基因</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">外显子与内含子相间排列；pre-mRNA 必须剪掉内含子才能出</text><text x="18.0" y="68.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">核翻译</text><rect x="18.0" y="82.0" width="364.0" height="174.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="101.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">从基因到成熟 mRNA</text><text x="30.0" y="127.4" font-size="11.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">基因</text><rect x="82.0" y="116.0" width="9.6" height="16.0" rx="3" fill="#f4f7fa" stroke="#b9c8d8" stroke-width="1"/><rect x="93.2" y="116.0" width="23.6" height="16.0" rx="3" fill="#e2f5f2" stroke="#0f766e" stroke-width="1"/><text x="105.8" y="127.4" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">E1</text><rect x="118.4" y="116.0" width="54.4" height="16.0" rx="3" fill="#eef2f7" stroke="#c9d6e2" stroke-width="1"/><rect x="174.4" y="116.0" width="18.0" height="16.0" rx="3" fill="#e2f5f2" stroke="#0f766e" stroke-width="1"/><text x="184.2" y="127.4" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">E2</text><rect x="194.0" y="116.0" width="60.0" height="16.0" rx="3" fill="#eef2f7" stroke="#c9d6e2" stroke-width="1"/><rect x="255.6" y="116.0" width="15.2" height="16.0" rx="3" fill="#e2f5f2" stroke="#0f766e" stroke-width="1"/><text x="264.0" y="127.4" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">E3</text><rect x="272.4" y="116.0" width="65.6" height="16.0" rx="3" fill="#eef2f7" stroke="#c9d6e2" stroke-width="1"/><rect x="339.6" y="116.0" width="20.8" height="16.0" rx="3" fill="#e2f5f2" stroke="#0f766e" stroke-width="1"/><text x="350.8" y="127.4" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">E4</text><text x="30.0" y="153.4" font-size="11.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">pre-mRNA</text><rect x="82.0" y="142.0" width="9.6" height="16.0" rx="3" fill="#f4f7fa" stroke="#b9c8d8" stroke-width="1"/><rect x="93.2" y="142.0" width="23.6" height="16.0" rx="3" fill="#e2f5f2" stroke="#0f766e" stroke-width="1"/><text x="105.8" y="153.4" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">E1</text><rect x="118.4" y="142.0" width="54.4" height="16.0" rx="3" fill="#eef2f7" stroke="#c9d6e2" stroke-width="1"/><rect x="174.4" y="142.0" width="18.0" height="16.0" rx="3" fill="#e2f5f2" stroke="#0f766e" stroke-width="1"/><text x="184.2" y="153.4" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">E2</text><rect x="194.0" y="142.0" width="60.0" height="16.0" rx="3" fill="#eef2f7" stroke="#c9d6e2" stroke-width="1"/><rect x="255.6" y="142.0" width="15.2" height="16.0" rx="3" fill="#e2f5f2" stroke="#0f766e" stroke-width="1"/><text x="264.0" y="153.4" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">E3</text><rect x="272.4" y="142.0" width="65.6" height="16.0" rx="3" fill="#eef2f7" stroke="#c9d6e2" stroke-width="1"/><rect x="339.6" y="142.0" width="20.8" height="16.0" rx="3" fill="#e2f5f2" stroke="#0f766e" stroke-width="1"/><text x="350.8" y="153.4" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">E4</text><rect x="82.0" y="168.0" width="64.7" height="16.0" rx="3" fill="#e2f5f2" stroke="#0f766e" stroke-width="1"/><rect x="148.7" y="168.0" width="50.9" height="16.0" rx="3" fill="#e2f5f2" stroke="#0f766e" stroke-width="1"/><rect x="201.6" y="168.0" width="44.0" height="16.0" rx="3" fill="#e2f5f2" stroke="#0f766e" stroke-width="1"/><rect x="247.6" y="168.0" width="62.4" height="16.0" rx="3" fill="#e2f5f2" stroke="#0f766e" stroke-width="1"/><text x="30.0" y="180.0" font-size="11.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">mRNA</text><text x="318.0" y="180.0" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">已剪接</text><rect x="82.0" y="188.0" width="12.0" height="11.5" rx="2" fill="#e2f5f2" stroke="#0f766e" stroke-width="1"/><text x="98.0" y="196.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">外显子</text><rect x="144.0" y="188.0" width="12.0" height="11.5" rx="2" fill="#eef2f7" stroke="#c9d6e2" stroke-width="1"/><text x="160.0" y="196.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">内含子</text><rect x="206.0" y="188.0" width="12.0" height="11.5" rx="2" fill="#f4f7fa" stroke="#b9c8d8" stroke-width="1"/><text x="222.0" y="196.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">侧翼</text><text x="30.0" y="214.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">人基因平均约 27 kb、平均 8 个内含子，而外显子平均仅约</text><text x="30.0" y="231.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">145 bp —— 基因的大部分是被剪掉的序列。</text><rect x="18.0" y="268.0" width="364.0" height="26.0" rx="6" fill="#f8fbfd"/><text x="26.0" y="285.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">结构</text><text x="98.8" y="285.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">定义与数值</text><text x="280.8" y="285.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">易错点</text><line x1="18.0" y1="336.0" x2="382.0" y2="336.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="312.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">外显子</text><text x="98.8" y="312.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">成熟 mRNA 保留的片段，含</text><text x="98.8" y="328.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">5′UTR 与 3′UTR</text><text x="280.8" y="312.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">≠ 全是编码序列</text><line x1="18.0" y1="378.0" x2="382.0" y2="378.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="354.0" font-size="12.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">内含子</text><text x="98.8" y="354.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">转录后被剪除，常远长于</text><text x="98.8" y="370.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">外显子</text><text x="280.8" y="354.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">≠ 无功能（含调</text><text x="280.8" y="370.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">控元件）</text><line x1="18.0" y1="420.0" x2="382.0" y2="420.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="396.0" font-size="12.5" font-weight="700" fill="#c1440e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">剪接位点</text><text x="98.8" y="396.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">内含子 5′ 端 GT、3′ 端</text><text x="98.8" y="412.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">AG（RNA 上 GU-AG）</text><text x="280.8" y="396.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">突变即致剪</text><text x="280.8" y="412.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">接异常</text><rect x="18.0" y="426.0" width="364.0" height="89.0" rx="8" fill="#fef3c7"/><rect x="18.0" y="426.0" width="3.5" height="89.0" rx="1.8" fill="#b45309"/><text x="32.0" y="446.0" font-size="11.5" font-weight="700" fill="#b45309" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">易错</text><text x="32.0" y="463.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">外显子 ≠ 编码序列：两端的 UTR 也在外显子里；一个</text><text x="32.0" y="482.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">基因靠可变剪接可产出多种 mRNA，「一基因一蛋白」是</text><text x="32.0" y="501.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">过时说法。</text></svg>