<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 750" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="能量代谢与基础代谢率"><title>能量代谢与基础代谢率</title><desc>呼吸商按糖 1.0、混合膳食 0.85、蛋白 0.80、脂肪 0.71 判断供能物质比例；BMR 需清醒静卧、空腹 12 h、室温 20~25℃、无精神紧张，甲亢升高甲减降低。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">能量代谢与基础代谢率</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">呼吸商三角色＋BMR 四个条件，是这一章的两个考点</text><rect x="18.0" y="59.0" width="3.0" height="14.0" rx="1.5" fill="#0f766e"/><text x="28.0" y="69.0" font-size="13.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">呼吸商 RQ＝CO₂ 产生量／O₂ 消耗量</text><rect x="18.0" y="81.0" width="364.0" height="184.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="99.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">四类底物的 RQ</text><text x="30.0" y="120.0" font-size="12" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">糖</text><rect x="86.0" y="110.0" width="260.0" height="14.0" rx="4" fill="#eef3f8"/><rect x="86.0" y="110.0" width="247.6" height="14.0" rx="4" fill="#fdeceb" stroke="#c0392b" stroke-width="1"/><text x="354.0" y="121.0" font-size="12" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">1.00</text><text x="86.0" y="136.0" font-size="10.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">全部由糖供能时</text><text x="30.0" y="158.0" font-size="12" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">混合膳食</text><rect x="86.0" y="148.0" width="260.0" height="14.0" rx="4" fill="#eef3f8"/><rect x="86.0" y="148.0" width="210.5" height="14.0" rx="4" fill="#e6f6ec" stroke="#2f8f57" stroke-width="1"/><text x="354.0" y="159.0" font-size="12" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">0.85</text><text x="86.0" y="174.0" font-size="10.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">正常人最常见</text><text x="30.0" y="196.0" font-size="12" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">蛋白质</text><rect x="86.0" y="186.0" width="260.0" height="14.0" rx="4" fill="#eef3f8"/><rect x="86.0" y="186.0" width="198.1" height="14.0" rx="4" fill="#f2ecfb" stroke="#7b4bb7" stroke-width="1"/><text x="354.0" y="197.0" font-size="12" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">0.80</text><text x="86.0" y="212.0" font-size="10.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">长期饥饿时比例升高</text><text x="30.0" y="234.0" font-size="12" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">脂肪</text><rect x="86.0" y="224.0" width="260.0" height="14.0" rx="4" fill="#eef3f8"/><rect x="86.0" y="224.0" width="175.8" height="14.0" rx="4" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1"/><text x="354.0" y="235.0" font-size="12" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">0.71</text><text x="86.0" y="250.0" font-size="10.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">纯脂肪氧化，RQ 最低</text><rect x="18.0" y="271.0" width="3.0" height="14.0" rx="1.5" fill="#0f766e"/><text x="28.0" y="281.0" font-size="13.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">基础代谢率 BMR：四个条件缺一不可</text><rect x="18.0" y="293.0" width="177.0" height="84.0" rx="9" fill="#e2f5f2" stroke="#0f766e" stroke-width="1.1"/><text x="29.0" y="314.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">清醒静卧</text><text x="29.0" y="333.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">清醒不是睡眠</text><text x="29.0" y="353.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">睡眠时 BMR 更低</text><rect x="205.0" y="293.0" width="177.0" height="84.0" rx="9" fill="#e6f6ec" stroke="#2f8f57" stroke-width="1.1"/><text x="216.0" y="314.0" font-size="12.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">空腹 12 h 以上</text><text x="216.0" y="333.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">排除食物特殊动力效应</text><text x="216.0" y="353.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">通常测清晨空腹</text><rect x="18.0" y="387.0" width="177.0" height="84.0" rx="9" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1.1"/><text x="29.0" y="408.0" font-size="12.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">室温 20~25℃</text><text x="29.0" y="427.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">过热过冷都会升高代谢</text><text x="29.0" y="447.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">避免寒战与出汗</text><rect x="205.0" y="387.0" width="177.0" height="84.0" rx="9" fill="#f2ecfb" stroke="#7b4bb7" stroke-width="1.1"/><text x="216.0" y="408.0" font-size="12.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">无精神紧张</text><text x="216.0" y="427.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">紧张→交感兴奋→代谢升高</text><text x="216.0" y="447.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">测前需安静休息</text><rect x="18.0" y="483.0" width="364.0" height="165.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="501.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">BMR 的临床意义</text><rect x="30.0" y="511.0" width="3.0" height="15.0" rx="1.5" fill="#4a5a6b"/><text x="39.0" y="524.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">正常值</text><text x="347.0" y="524.0" text-anchor="end" font-size="12" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">相对值 ±15%</text><text x="39.0" y="542.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">男性略高于女性，儿童高于成人，年龄越大越</text><text x="39.0" y="558.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">低</text><rect x="30.0" y="568.0" width="3.0" height="15.0" rx="1.5" fill="#c0392b"/><text x="39.0" y="581.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">甲亢／甲减</text><text x="347.0" y="581.0" text-anchor="end" font-size="12" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">↑ 60% 以上／↓</text><text x="39.0" y="599.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">甲状腺激素加速氧化磷酸化解偶联，产热增多</text><rect x="30.0" y="609.0" width="3.0" height="15.0" rx="1.5" fill="#7b4bb7"/><text x="39.0" y="622.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">食物特殊动力效应</text><text x="347.0" y="622.0" text-anchor="end" font-size="12" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">蛋白 30%</text><text x="39.0" y="640.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">糖 6%、脂肪 4%；含褐色脂肪 UCP1 产热</text><rect x="18.0" y="660.0" width="364.0" height="70.0" rx="8" fill="#eef2f7"/><rect x="18.0" y="660.0" width="3.5" height="70.0" rx="1.8" fill="#4a5a6b"/><text x="32.0" y="680.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="697.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">呼吸商：糖 1.0 &gt; 混合 0.85 &gt; 蛋白 0.80 &gt; 脂肪 </text><text x="32.0" y="716.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">0.71；BMR 甲亢↑ 甲减↓，是最敏感的辅助指标之一。</text></svg>