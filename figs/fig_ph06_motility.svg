<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 790" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="消化道运动"><title>消化道运动</title><desc>消化道运动包括蠕动（推进）、分节运动（混匀）、紧张性收缩与容受性舒张；慢波由 Cajal 间质细胞产生决定节律，动作电位决定收缩强度。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">消化道运动：把食物往前推、把食物磨碎</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">慢波决定节律，动作电位决定收缩强度</text><rect x="18.0" y="65.0" width="177.0" height="100.0" rx="9" fill="#e2f5f2" stroke="#0f766e" stroke-width="1.1"/><text x="29.0" y="86.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">蠕动</text><text x="29.0" y="105.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">环形肌舒张、纵行肌收缩</text><text x="29.0" y="125.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">把食团向前推进一段距离</text><rect x="205.0" y="65.0" width="177.0" height="100.0" rx="9" fill="#e6f6ec" stroke="#2f8f57" stroke-width="1.1"/><text x="216.0" y="86.0" font-size="12.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">分节运动</text><text x="216.0" y="105.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">小肠特有，环形肌多点同时</text><text x="216.0" y="121.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">收缩</text><text x="216.0" y="141.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">混匀食糜、增大与黏膜接触</text><rect x="18.0" y="175.0" width="177.0" height="100.0" rx="9" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1.1"/><text x="29.0" y="196.0" font-size="12.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">紧张性收缩</text><text x="29.0" y="215.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">消化道平滑肌持续的基础张</text><text x="29.0" y="231.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">力</text><text x="29.0" y="251.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">维持管腔内压与形态</text><rect x="205.0" y="175.0" width="177.0" height="100.0" rx="9" fill="#f2ecfb" stroke="#7b4bb7" stroke-width="1.1"/><text x="216.0" y="196.0" font-size="12.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">容受性舒张</text><text x="216.0" y="215.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">进食时胃底胃体舒张</text><text x="216.0" y="235.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">迷走神经肽能纤维介导，容</text><text x="216.0" y="251.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">纳食物</text><rect x="18.0" y="281.0" width="3.0" height="14.0" rx="1.5" fill="#0f766e"/><text x="28.0" y="291.0" font-size="13.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">消化道平滑肌的电活动（三层）</text><rect x="18.0" y="303.0" width="364.0" height="181.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="321.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">电活动决定机械活动</text><rect x="30.0" y="331.0" width="3.0" height="15.0" rx="1.5" fill="#4a5a6b"/><text x="39.0" y="344.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">静息电位</text><text x="347.0" y="344.0" text-anchor="end" font-size="12" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">−50~−60 mV</text><text x="39.0" y="362.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">不稳定，随代谢与牵拉而波动</text><rect x="30.0" y="372.0" width="3.0" height="15.0" rx="1.5" fill="#1f6fb2"/><text x="39.0" y="385.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">慢波（基本电节律）</text><text x="347.0" y="385.0" text-anchor="end" font-size="12" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">决定节律</text><text x="39.0" y="403.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">由 Cajal 间质细胞产生，胃约 3 次/分、十</text><text x="39.0" y="419.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">二指肠约 12 次/分</text><rect x="30.0" y="429.0" width="3.0" height="15.0" rx="1.5" fill="#c0392b"/><text x="39.0" y="442.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">动作电位</text><text x="347.0" y="442.0" text-anchor="end" font-size="12" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">决定强度</text><text x="39.0" y="460.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">慢波去极化到阈电位才触发，Ca²⁺ 内流→</text><text x="39.0" y="476.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">收缩；幅度越大收缩越强</text><rect x="18.0" y="490.0" width="3.0" height="14.0" rx="1.5" fill="#2f8f57"/><text x="28.0" y="500.0" font-size="13.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">各段的运动特点</text><rect x="18.0" y="512.0" width="364.0" height="24.0" rx="6" fill="#e2f5f2"/><text x="24.0" y="528.0" font-size="10.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">部位</text><text x="104.1" y="528.0" font-size="10.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">主要运动</text><text x="206.0" y="528.0" font-size="10.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">作用</text><text x="293.4" y="528.0" font-size="10.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">关键点</text><line x1="18.0" y1="575.0" x2="382.0" y2="575.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="24.0" y="553.0" font-size="12" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">口腔—食管</text><text x="104.1" y="553.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">蠕动</text><text x="206.0" y="553.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">推送食团</text><text x="293.4" y="553.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">食管下括约肌防</text><text x="293.4" y="568.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">反流</text><line x1="18.0" y1="614.0" x2="382.0" y2="614.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="24.0" y="592.0" font-size="12" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胃</text><text x="104.1" y="592.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">容受性舒张＋蠕</text><text x="104.1" y="607.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">动</text><text x="206.0" y="592.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">贮存、磨碎、</text><text x="206.0" y="607.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">排空</text><text x="293.4" y="592.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">排空速度：糖&gt;</text><text x="293.4" y="607.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">蛋白&gt;脂肪</text><line x1="18.0" y1="653.0" x2="382.0" y2="653.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="24.0" y="631.0" font-size="12" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">小肠</text><text x="104.1" y="631.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">分节运动为主</text><text x="206.0" y="631.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">混匀＋推送</text><text x="293.4" y="631.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">蠕动冲可快速推</text><text x="293.4" y="646.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">进</text><line x1="18.0" y1="692.0" x2="382.0" y2="692.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="24.0" y="670.0" font-size="12" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">大肠</text><text x="104.1" y="670.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">袋状往返＋集团</text><text x="104.1" y="685.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">蠕动</text><text x="206.0" y="670.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">吸收水、形成</text><text x="206.0" y="685.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">粪便</text><text x="293.4" y="670.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">集团蠕动多在餐</text><text x="293.4" y="685.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">后</text><rect x="18.0" y="700.0" width="364.0" height="70.0" rx="8" fill="#eef2f7"/><rect x="18.0" y="700.0" width="3.5" height="70.0" rx="1.8" fill="#4a5a6b"/><text x="32.0" y="720.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="737.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">慢波只决定「能不能收缩、多久一次」，动作电位才决定</text><text x="32.0" y="756.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">「收缩多强」；切断外来神经慢波依然存在。</text></svg>