<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 514" width="100%" style="max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px" role="img"><text x="165.0" y="22.6" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">负反馈、正反馈与前馈</text><text x="165.0" y="43.0" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">关键看「输出对输入做了什么」</text><text x="15.0" y="73.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">① 负反馈（绝大多数调节属此类）</text><rect x="15.0" y="82.0" width="58.0" height="32.0" rx="5" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.3"/><text x="44.0" y="103.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">调定点</text><line x1="74.0" y1="98.0" x2="80.4" y2="98.0" stroke="#64748b" stroke-width="1.4" stroke-linecap="round"/><polygon points="84.0,98.0 80.3,99.6 80.3,96.4" fill="#64748b"/><rect x="85.0" y="82.0" width="58.0" height="32.0" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/><text x="114.0" y="103.0" text-anchor="middle" font-size="13" font-weight="700" fill="#cbd5e1" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">控制部分</text><line x1="144.0" y1="98.0" x2="150.4" y2="98.0" stroke="#64748b" stroke-width="1.4" stroke-linecap="round"/><polygon points="154.0,98.0 150.3,99.6 150.3,96.4" fill="#64748b"/><rect x="155.0" y="82.0" width="58.0" height="32.0" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/><text x="184.0" y="103.0" text-anchor="middle" font-size="13" font-weight="700" fill="#cbd5e1" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">效应器</text><line x1="214.0" y1="98.0" x2="220.4" y2="98.0" stroke="#64748b" stroke-width="1.4" stroke-linecap="round"/><polygon points="224.0,98.0 220.3,99.6 220.3,96.4" fill="#64748b"/><rect x="225.0" y="82.0" width="58.0" height="32.0" rx="5" fill="#dcfce7" stroke="#15803d" stroke-width="1.3"/><text x="254.0" y="103.0" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">输出变量</text><path d="M254.0,114 L254.0,136 L114.0,136 L114.0,116" fill="none" stroke="#15803d" stroke-width="1.8" stroke-dasharray="5 3"/><polygon points="114.0,114 110.0,121 118.0,121" fill="#15803d"/><text x="213.0" y="140.0" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">反馈：抑制（−）</text><rect x="15.0" y="154.0" width="300.0" height="40.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="27.0" y="174.0" text-anchor="start" font-size="14" font-weight="700" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">例：减压反射</text><text x="27.0" y="191.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">血压↑→心率↓→血压↓</text><rect x="15.0" y="200.0" width="300.0" height="40.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="27.0" y="220.0" text-anchor="start" font-size="14" font-weight="700" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">例：血糖</text><text x="27.0" y="237.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">血糖↑→胰岛素↑→血糖↓</text><rect x="15.0" y="250.0" width="300.0" height="102.0" rx="7" fill="#fee2e2" stroke="#cbd5e1" stroke-width="1.4"/><text x="25.0" y="269.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">② 正反馈（少见，用于必须加速完成的过程）</text><text x="25.0" y="287.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 输出促进输入，使偏离越来越大</text><text x="25.0" y="303.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 分娩：宫缩→刺激产道→宫缩更强</text><text x="25.0" y="319.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 凝血：凝血酶→激活更多凝血酶原</text><text x="25.0" y="335.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 排尿、射精：一旦启动就进行到底</text><rect x="15.0" y="362.0" width="300.0" height="86.0" rx="7" fill="#ccfbf1" stroke="#cbd5e1" stroke-width="1.4"/><text x="25.0" y="381.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">③ 前馈（第10版新增定义与示意图）</text><text x="25.0" y="399.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 干扰信号尚未引起偏差，就提前启动纠正</text><text x="25.0" y="415.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 预见性，不是事后纠正</text><text x="25.0" y="431.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 例：进食前唾液分泌、运动前心率上升</text><rect x="11.0" y="455.0" width="308.0" height="51.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="165.0" y="470.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">负反馈＝拉回（绝大多数）；正反馈＝推向极端（</text><text x="165.0" y="485.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">分娩凝血）；前馈＝提前启动</text></svg>