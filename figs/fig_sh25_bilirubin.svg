<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 551" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="两种胆红素：脂溶的不进尿，水溶的才进尿"><title>两种胆红素：脂溶的不进尿，水溶的才进尿</title><desc>未结合胆红素脂溶、与白蛋白结合运输，不能经肾小球滤过，故尿胆红素阴性，也不能经尿排出；因其脂溶可透过血脑屏障沉积于基底节，造成核黄疸。结合胆红素水溶、分子小、不与白蛋白紧密结合，可经肾滤出使尿胆红素阳性，但不能过血脑屏障。范登堡试验分别呈间接与直接反应。新生儿黄疸源于生成多、肝酶未成熟、肠肝循环活跃三因叠加。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">两种胆红素：脂溶的不进尿，水溶的才进尿</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">未结合脂溶性、与白蛋白结合 → 过不了肾滤、尿胆红素阴性；却</text><text x="18.0" y="68.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">能过血脑屏障致核黄疸</text><rect x="18.0" y="82.0" width="177.0" height="160.0" rx="9" fill="#fef3c7" stroke="#b45309" stroke-width="1.1"/><text x="29.0" y="103.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">未结合胆红素｜间接</text><text x="29.0" y="122.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">脂溶性，不溶于水</text><text x="29.0" y="142.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">与白蛋白结合运输，不</text><text x="29.0" y="158.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">能经肾滤</text><text x="29.0" y="178.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">尿胆红素：阴性</text><text x="29.0" y="198.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">可过血脑屏障 → 核黄疸</text><text x="29.0" y="218.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">范登堡试验：间接反应</text><rect x="205.0" y="82.0" width="177.0" height="160.0" rx="9" fill="#e6f6ec" stroke="#2f8f57" stroke-width="1.1"/><text x="216.0" y="103.0" font-size="12.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">结合胆红素｜直接</text><text x="216.0" y="122.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">水溶性</text><text x="216.0" y="142.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">不与白蛋白结合，分子小</text><text x="216.0" y="162.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">可经肾滤 → 尿胆红素阳性</text><text x="216.0" y="182.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">不能过血脑屏障</text><text x="216.0" y="202.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">范登堡试验：直接反应</text><rect x="18.0" y="252.0" width="364.0" height="197.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="271.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">新生儿为什么容易黄疸：三因叠加</text><rect x="30.0" y="282.0" width="3.0" height="15.0" rx="1.5" fill="#c0392b"/><text x="39.0" y="295.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">生成多</text><text x="362.0" y="295.0" text-anchor="end" font-size="12" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">红细胞破坏</text><text x="39.0" y="313.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">新生儿红细胞量多、寿命短 → 胆红素</text><text x="39.0" y="329.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">生成量大</text><rect x="30.0" y="338.0" width="3.0" height="15.0" rx="1.5" fill="#c1440e"/><text x="39.0" y="351.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">结合少</text><text x="362.0" y="351.0" text-anchor="end" font-size="12" font-weight="700" fill="#c1440e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">酶未成熟</text><text x="39.0" y="369.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肝 UDP-葡萄糖醛酸转移酶活性低 → 结</text><text x="39.0" y="385.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">合能力不足</text><rect x="30.0" y="394.0" width="3.0" height="15.0" rx="1.5" fill="#b45309"/><text x="39.0" y="407.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">重吸收多</text><text x="362.0" y="407.0" text-anchor="end" font-size="12" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肠肝循环活跃</text><text x="39.0" y="425.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肠道菌群未建立、β-葡糖醛酸苷酶活性高</text><text x="39.0" y="441.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">→ 未结合胆红素被水解重吸收</text><rect x="18.0" y="461.0" width="364.0" height="70.0" rx="8" fill="#fef3c7"/><rect x="18.0" y="461.0" width="3.5" height="70.0" rx="1.8" fill="#b45309"/><text x="32.0" y="481.0" font-size="11.5" font-weight="700" fill="#b45309" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">易错</text><text x="32.0" y="498.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">未结合胆红素不能经尿排出（脂溶 + 与白蛋白结合），</text><text x="32.0" y="517.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">故尿胆红素阴性；正因脂溶才可沉积基底节 → 核黄疸。</text></svg>