<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 493" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="肾小管分泌：三种物质、两组竞争"><title>肾小管分泌：三种物质、两组竞争</title><desc>肾小管分泌 H⁺（保碱）、K⁺（受醛固酮调节）、NH₃（排酸）；H⁺ 与 K⁺ 竞争 Na⁺ 交换，故酸中毒伴高钾、碱中毒伴低钾。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肾小管分泌：三种物质、两组竞争</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">分泌是「主动排」，竞争同一转运体会互相拖累</text><rect x="18.0" y="65.0" width="364.0" height="177.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="83.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">分泌什么、为什么</text><rect x="31.0" y="93.0" width="3.0" height="15.0" rx="1.5" fill="#c0392b"/><text x="40.0" y="106.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">H⁺</text><text x="344.0" y="106.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">泌氢</text><text x="40.0" y="124.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">与管腔 Na⁺ 交换；H⁺ 排得多 → HCO₃⁻ 重吸收也</text><text x="40.0" y="140.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">多（保碱）</text><rect x="31.0" y="148.0" width="3.0" height="15.0" rx="1.5" fill="#1f6fb2"/><text x="40.0" y="161.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">K⁺</text><text x="344.0" y="161.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">泌钾</text><text x="40.0" y="179.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Na⁺-K⁺ 交换；醛固酮↑、碱中毒↑；酸中毒时反而</text><text x="40.0" y="195.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">泌 K⁺↓→高钾</text><rect x="31.0" y="203.0" width="3.0" height="15.0" rx="1.5" fill="#7b4bb7"/><text x="40.0" y="216.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">NH₃ / NH₄⁺</text><text x="344.0" y="216.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">中和排酸</text><text x="40.0" y="234.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">NH₃ 扩散入管腔结合 H⁺ → 促泌氢、排酸保碱</text><rect x="18.0" y="254.0" width="177.0" height="120.0" rx="9" fill="#e6f6ec" stroke="#2f8f57" stroke-width="1.1"/><text x="29.0" y="275.0" font-size="12.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Na⁺-K⁺ 交换↑</text><text x="29.0" y="294.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">醛固酮↑、碱中毒、高钾饮食</text><text x="29.0" y="314.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">泌 K⁺↑ → 血 K⁺↓</text><text x="29.0" y="334.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">螺内酯阻断 → 保钾利尿</text><rect x="205.0" y="254.0" width="177.0" height="120.0" rx="9" fill="#fef3c7" stroke="#b45309" stroke-width="1.1"/><text x="216.0" y="275.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Na⁺-H⁺ 交换↑</text><text x="216.0" y="294.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">酸中毒、低钾</text><text x="216.0" y="314.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">泌 H⁺↑、泌 K⁺↓ → 反</text><text x="216.0" y="330.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">常性碱性尿</text><text x="216.0" y="350.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">噻嗪类利尿剂可致低钾</text><rect x="18.0" y="384.0" width="364.0" height="89.0" rx="8" fill="#eef2f7"/><rect x="18.0" y="384.0" width="3.5" height="89.0" rx="1.8" fill="#4a5a6b"/><text x="32.0" y="404.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="421.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">K⁺ 与 H⁺ 竞争同一个 Na⁺ 交换：酸中毒→血钾高，</text><text x="32.0" y="440.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">碱中毒/利尿→血钾低；竞争性抑制是青霉素、利尿剂相</text><text x="32.0" y="459.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">互影响的原因。</text></svg>