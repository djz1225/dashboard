xt><text x="29.0" y="327.5" text-anchor="start" font-size="13.5" font-weight="600" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">维持：疏水 + 离子键 + 氢键</text><rect x="15.0" y="341.5" width="300.0" height="60.0" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/><text x="25.0" y="357.5" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">变性破坏的是二、三、四级（空间构象）</text><text x="25.0" y="373.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">一级结构不变 → 仍可被蛋白酶水解、仍起双缩</text><text x="25.0" y="389.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">脲反应</text><rect x="11.0" y="406.5" width="308.0" height="51.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="165.0" y="421.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">二级氢键、三级疏水、四级非共价；只有一级靠</text><text x="165.0" y="437.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">共价肽键</text></svg>