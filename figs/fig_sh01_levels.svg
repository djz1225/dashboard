<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 465.5" width="100%" style="max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px" role="img"><text x="165.0" y="22.6" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">四级结构与各自的维持力</text><text x="165.0" y="42.6" text-anchor="middle" font-size="13.5" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">一级肽键 · 二级氢键 · 三级疏水 · 四级非共价</text><rect x="15.0" y="57.5" width="300.0" height="66.0" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/><rect x="15.0" y="57.5" width="5.0" height="66.0" rx="2.5" fill="#b91c1c"/><text x="29.0" y="78.5" text-anchor="start" font-size="14" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">一级结构</text><text x="304.0" y="78.5" text-anchor="end" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">共价</text><text x="29.0" y="97.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">氨基酸排列顺序</text><text x="29.0" y="114.5" text-anchor="start" font-size="13.5" font-weight="600" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">维持：肽键（+二硫键）</text><rect x="15.0" y="128.5" width="300.0" height="66.0" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/><rect x="15.0" y="128.5" width="5.0" height="66.0" rx="2.5" fill="#b45309"/><text x="29.0" y="149.5" text-anchor="start" font-size="14" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">二级结构</text><text x="304.0" y="149.5" text-anchor="end" font-size="13.5" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">非共价</text><text