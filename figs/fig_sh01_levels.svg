<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 572" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="蛋白质的四级结构"><title>蛋白质的四级结构</title><desc>蛋白质一级结构由肽键维持，二级靠主链氢键，三级以疏水作用为主，四级靠亚基间非共价键；变性只破坏二、三、四级，一级结构不变。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">蛋白质的四级结构</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一级靠肽键（共价），二级氢键、三级疏水、四级非共价——只有</text><text x="18.0" y="68.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一级是共价</text><rect x="18.0" y="82.0" width="364.0" height="278.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="101.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">层次与维持力</text><rect x="30.0" y="112.0" width="340.0" height="54.0" rx="8" fill="#ffffff" stroke="#e3eaf2" stroke-width="1"/><rect x="30.0" y="112.0" width="3.5" height="54.0" rx="1.8" fill="#1f6fb2"/><text x="42.0" y="130.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一级结构</text><text x="360.0" y="130.0" text-anchor="end" font-size="12.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">共价</text><text x="42.0" y="148.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">氨基酸的排列顺序；维持力是肽键（+ 二硫键）</text><rect x="30.0" y="174.0" width="340.0" height="54.0" rx="8" fill="#ffffff" stroke="#e3eaf2" stroke-width="1"/><rect x="30.0" y="174.0" width="3.5" height="54.0" rx="1.8" fill="#0f766e"/><text x="42.0" y="192.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">二级结构</text><text x="360.0" y="192.0" text-anchor="end" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">氢键</text><text x="42.0" y="210.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">α 螺旋 / β 折叠 / β 转角；维持力是主链氢键</text><rect x="30.0" y="236.0" width="340.0" height="54.0" rx="8" fill="#ffffff" stroke="#e3eaf2" stroke-width="1"/><rect x="30.0" y="236.0" width="3.5" height="54.0" rx="1.8" fill="#c1440e"/><text x="42.0" y="254.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">三级结构</text><text x="360.0" y="254.0" text-anchor="end" font-size="12.5" font-weight="700" fill="#c1440e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">疏水为主</text><text x="42.0" y="272.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">整条肽链的全部空间构象；疏水作用 + 离子键 +</text><text x="42.0" y="287.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"> 氢键</text><rect x="30.0" y="298.0" width="340.0" height="54.0" rx="8" fill="#ffffff" stroke="#e3eaf2" stroke-width="1"/><rect x="30.0" y="298.0" width="3.5" height="54.0" rx="1.8" fill="#7b4bb7"/><text x="42.0" y="316.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">四级结构</text><text x="360.0" y="316.0" text-anchor="end" font-size="12.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">非共价</text><text x="42.0" y="334.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">亚基间的空间排布；疏水 + 离子键 + 氢键</text><rect x="18.0" y="372.0" width="177.0" height="100.0" rx="9" fill="#fdeceb" stroke="#c0392b" stroke-width="1.1"/><text x="29.0" y="393.0" font-size="12.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">变性破坏了什么</text><text x="29.0" y="412.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">二、三、四级（空间构象）</text><text x="29.0" y="432.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">活性丧失、溶解度下降</text><rect x="205.0" y="372.0" width="177.0" height="100.0" rx="9" fill="#e6f6ec" stroke="#2f8f57" stroke-width="1.1"/><text x="216.0" y="393.0" font-size="12.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">变性没动什么</text><text x="216.0" y="412.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一级结构完好（肽键未断）</text><text x="216.0" y="432.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">仍能被蛋白酶水解、仍起双</text><text x="216.0" y="448.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">缩脲反应</text><rect x="18.0" y="482.0" width="364.0" height="70.0" rx="8" fill="#eef2f7"/><rect x="18.0" y="482.0" width="3.5" height="70.0" rx="1.8" fill="#4a5a6b"/><text x="32.0" y="502.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="519.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">二级氢键、三级疏水、四级非共价；只有一级结构靠</text><text x="32.0" y="538.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">共价肽键。</text></svg>