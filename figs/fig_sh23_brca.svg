<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 631" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="BRCA 与 PARP 抑制剂：合成致死"><title>BRCA 与 PARP 抑制剂：合成致死</title><desc>PARP 抑制剂阻断单链断裂修复，SSB 在复制时崩成双链断裂。正常细胞有 HR 通路可精确修复 DSB 而存活；BRCA1/2 突变肿瘤缺乏 HR，DSB 无法修复而死亡——这就是「合成致死」：单纯 BRCA 缺陷或单纯 PARP 抑制都不致死，两者叠加才致死。因此 PARP 抑制剂只对 BRCA 突变（HR 缺陷）肿瘤有效，用药前须检测。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">BRCA 与 PARP 抑制剂：合成致死</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">PARP 抑制让单链断裂堆成双链断裂；无 HR 的肿瘤细胞才修不了</text><text x="18.0" y="68.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">——正常细胞靠 HR 存活</text><rect x="18.0" y="82.0" width="364.0" height="185.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="101.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">四种组合，四种命运</text><rect x="116.0" y="116.0" width="119.0" height="22.0" rx="4" fill="#f8fbfd"/><text x="175.5" y="131.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">PARP 正常</text><rect x="239.0" y="116.0" width="119.0" height="22.0" rx="4" fill="#f8fbfd"/><text x="298.5" y="131.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">PARP 抑制</text><text x="30.0" y="158.0" font-size="12" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">BRCA 正常</text><text x="30.0" y="172.0" font-size="11.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">HR 完好</text><rect x="116.0" y="143.0" width="119.0" height="34.0" rx="6" fill="#e6f6ec" stroke="#2f8f57" stroke-width="1.1"/><text x="175.5" y="159.0" text-anchor="middle" font-size="12" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">存活</text><text x="175.5" y="172.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">BER 修单链</text><rect x="239.0" y="143.0" width="119.0" height="34.0" rx="6" fill="#e6f6ec" stroke="#2f8f57" stroke-width="1.1"/><text x="298.5" y="159.0" text-anchor="middle" font-size="12" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">存活</text><text x="298.5" y="172.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">HR 修双链</text><text x="30.0" y="197.0" font-size="12" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">BRCA 突变</text><text x="30.0" y="211.0" font-size="11.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">HR 缺陷</text><rect x="116.0" y="182.0" width="119.0" height="34.0" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.1"/><text x="175.5" y="198.0" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">存活</text><text x="175.5" y="211.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">仍有 HR 缺陷</text><rect x="239.0" y="182.0" width="119.0" height="34.0" rx="6" fill="#fdeceb" stroke="#c0392b" stroke-width="1.1"/><text x="298.5" y="198.0" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">死亡</text><text x="298.5" y="211.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">合成致死</text><text x="30.0" y="225.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">两个通路同时坏才死，坏一个还能活 —— 这就是「合成致死」</text><text x="30.0" y="242.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">的选择性来源。</text><rect x="18.0" y="279.0" width="364.0" height="250.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="298.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">四步推演：为什么只杀肿瘤</text><rect x="30.0" y="309.0" width="3.0" height="15.0" rx="1.5" fill="#c1440e"/><text x="39.0" y="322.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">第一步</text><text x="362.0" y="322.0" text-anchor="end" font-size="12" font-weight="700" fill="#c1440e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">PARP 被抑</text><text x="39.0" y="340.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">PARP 参与单链断裂修复；被抑制后单链断裂</text><text x="39.0" y="356.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">（SSB）不断堆积</text><rect x="30.0" y="364.0" width="3.0" height="15.0" rx="1.5" fill="#c0392b"/><text x="39.0" y="377.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">第二步</text><text x="362.0" y="377.0" text-anchor="end" font-size="12" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">复制成双链</text><text x="39.0" y="395.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">复制叉撞上未修的 SSB → 崩成双链断裂</text><text x="39.0" y="411.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">（DSB）</text><rect x="30.0" y="419.0" width="3.0" height="15.0" rx="1.5" fill="#2f8f57"/><text x="39.0" y="432.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">第三步</text><text x="362.0" y="432.0" text-anchor="end" font-size="12" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">正常细胞活</text><text x="39.0" y="450.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">有 HR（BRCA1/2）→ 精确修复 DSB →</text><text x="39.0" y="466.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"> 存活</text><rect x="30.0" y="474.0" width="3.0" height="15.0" rx="1.5" fill="#c0392b"/><text x="39.0" y="487.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">第四步</text><text x="362.0" y="487.0" text-anchor="end" font-size="12" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肿瘤细胞死</text><text x="39.0" y="505.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">BRCA 突变无 HR → DSB 无法修复 →</text><text x="39.0" y="521.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"> 凋亡</text><rect x="18.0" y="541.0" width="364.0" height="70.0" rx="8" fill="#e2f5f2"/><rect x="18.0" y="541.0" width="3.5" height="70.0" rx="1.8" fill="#0f766e"/><text x="32.0" y="561.0" font-size="11.5" font-weight="700" fill="#0f766e" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="578.0" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">不是「药直接杀癌细胞」，而是两个缺陷叠加；只对</text><text x="32.0" y="597.0" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">BRCA 突变（HR 缺陷）者有效，用药前须做 BRCA 检测。</text></svg>