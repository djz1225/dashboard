<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 497" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="氧解离曲线：为什么是 S 形"><title>氧解离曲线：为什么是 S 形</title><desc>Hb 与 O₂ 结合呈正协同，故曲线为 S 形：上段平坦用于运输、中段陡、下段更陡利于组织释氧；pH↓、PCO₂↑、温度↑、2,3-DPG↑ 使曲线右移，反之左移，CO 中毒双重打击。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">氧解离曲线：为什么是 S 形</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">上段平坦管运输、中段陡、下段更陡管释放</text><rect x="18.0" y="65.0" width="364.0" height="186.0" rx="9" fill="#ffffff" stroke="#e3eaf2" stroke-width="1.1"/><line x1="48.0" y1="87.0" x2="52.0" y2="87.0" stroke="#8095a8" stroke-width="1" stroke-linecap="round"/><text x="45.0" y="91.0" text-anchor="end" font-size="10.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">100</text><line x1="52.0" y1="87.0" x2="370.0" y2="87.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><line x1="48.0" y1="110.2" x2="52.0" y2="110.2" stroke="#8095a8" stroke-width="1" stroke-linecap="round"/><text x="45.0" y="114.2" text-anchor="end" font-size="10.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">75</text><line x1="52.0" y1="110.2" x2="370.0" y2="110.2" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><line x1="48.0" y1="133.5" x2="52.0" y2="133.5" stroke="#8095a8" stroke-width="1" stroke-linecap="round"/><text x="45.0" y="137.5" text-anchor="end" font-size="10.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">50</text><line x1="52.0" y1="133.5" x2="370.0" y2="133.5" stroke="#e3eaf2" strok