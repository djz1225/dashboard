<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 496" width="100%" style="max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px" role="img"><text x="165.0" y="22.6" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">氧解离曲线：为什么是 S 形</text><text x="165.0" y="43.0" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">上段平坦运输、中段陡释放、下段更陡</text><rect x="15.0" y="60.0" width="300.0" height="150.0" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><polyline points="49.0,184.0 55.4,183.8 61.7,183.0 68.0,181.2 74.4,178.2 80.8,174.1 87.1,169.0 93.4,163.1 99.8,156.6 106.2,149.9 112.5,143.3 118.9,137.0 125.2,131.0 131.6,125.5 137.9,120.5 144.2,116.0 150.6,112.1 156.9,108.5 163.3,105.4 169.6,102.6 176.0,100.2 182.3,98.1 188.7,96.2 195.0,94.5 201.4,93.0 207.8,91.7 214.1,90.5 220.5,89.5 226.8,88.5 233.2,87.7 239.5,87.0 245.8,86.3 252.2,85.7 258.5,85.1 264.9,84.6 271.2,84.2 277.6,83.8 284.0,83.4 290.3,83.0 296.6,82.7 303.0,82.4" fill="none" stroke="#0f766e" stroke-width="2.6" stroke-linejoin="round"/><line x1="49" y1="184" x2="303" y2="184" stroke="#94a3b8" stroke-width="1.4"/><line x1="49" y1="184" x2="49" y2="78" stroke="#94a3b8" stroke-width="1.4"/><text x="176.0" y="202.0" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">PO₂ (mmHg)</text><text x="43.0" y="80.0" text-anchor="start" font-size="13" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">SaO₂</text><text x="239.5" y="86.0" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">上段：平坦（运输）</text><text x="140.4" y="138.0" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">中段：陡</text><text x="55.0" y="168.0" text-anchor="start" font-size="13" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">下段：更陡（组织释放）</text><rect x="15.0" y="216.0" width="300.0" height="134.0" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="25.0" y="235.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">三条曲线的影响</text><text x="25.0" y="253.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 左移（亲和力↑，释氧难）：pH↑、PCO₂↓、</text><text x="25.0" y="269.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">温度↓、2,3-DPG↓、CO 中毒</text><text x="25.0" y="285.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 右移（亲和力↓，释氧易）：pH↓（酸中毒）、</text><text x="25.0" y="301.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">PCO₂↑、温度↑、2,3-DPG↑</text><text x="25.0" y="317.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 记忆：酸、热、高二氧化碳 → 右移（</text><text x="25.0" y="333.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">运动肌肉正好如此，多释氧）</text><rect x="15.0" y="358.0" width="300.0" height="76.0" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/><text x="25.0" y="374.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">P50 正常约 26~27 mmHg：Hb 氧饱和度 50%</text><text x="25.0" y="390.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"> 时的 PO₂</text><text x="25.0" y="406.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">CO 中毒：不仅占据结合位点，还把曲线左移，</text><text x="25.0" y="422.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">双重打击，故极度缺氧</text><rect x="11.0" y="437.0" width="308.0" height="51.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="165.0" y="452.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">曲线右移＝易释氧（酸热高CO₂）；左移＝难释</text><text x="165.0" y="467.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">氧（碱冷低CO₂、CO中毒）</text></svg>