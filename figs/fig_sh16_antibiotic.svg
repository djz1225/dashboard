<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="抗生素：钉在核糖体的哪一步"><title>抗生素：钉在核糖体的哪一步</title><desc>抗生素按结合亚基分工：作用于 30S 的有链霉素（引起读码错误、抑制起始）与四环素（阻断氨酰-tRNA 进位到 A 位）；作用于 50S 的有氯霉素（抑制肽酰转移酶）、红霉素（堵住出口通道）与嘌呤霉素（模拟氨酰-tRNA 进入 A 位，使肽链提前释放）。选择性来自细菌 70S（30S+50S）与人 80S（40S+60S）的结构差异，但氯霉素也能抑制人线粒体核糖体，故可致骨髓抑制。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">抗生素：钉在核糖体的哪一步</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">30S 管读码与进位，50S 管成肽与出口；选择性来自 70S 与</text><text x="18.0" y="68.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">80S 的结构差异</text><rect x="18.0" y="82.0" width="364.0" height="164.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="101.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">药物结合的位置</text><rect x="30.0" y="114.0" width="328.0" height="46.0" rx="11" fill="#f2ecfb" stroke="#7b4bb7" stroke-width="1.2"/><rect x="30.0" y="166.0" width="328.0" height="34.0" rx="9" fill="#e2f5f2" stroke="#0f766e" stroke-width="1.2"/><line x1="38.0" y1="214.0" x2="350.0" y2="214.0" stroke="#4a5a6b" stroke-width="2.2" stroke-linecap="round"/><text x="38.0" y="228.0" font-size="11.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">mRNA  5′ → 3′</text><text x="38.0" y="129.0" font-size="11.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">50S</text><text x="38.0" y="185.0" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">30S</text><rect x="123.8" y="136.0" width="48.5" height="17.0" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1"/><text x="148.1" y="147.9" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">氯霉素</text><rect x="228.8" y="136.0" width="48.5" height="17.0" rx="4" fill="#ffffff" stroke="#b45309" stroke-width="1"/><text x="253.0" y="147.9" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">红霉素</text><rect x="301.8" y="136.0" width="60.0" height="17.0" rx="4" fill="#ffffff" stroke="#7b4bb7" stroke-width="1"/><text x="331.8" y="147.9" text-anchor="middle" font-size="11.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">嘌呤霉素</text><rect x="117.3" y="174.0" width="48.5" height="17.0" rx="4" fill="#ffffff" stroke="#1f6fb2" stroke-width="1"/><text x="141.5" y="185.9" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">链霉素</text><rect x="228.8" y="174.0" width="48.5" height="17.0" rx="4" fill="#ffffff" stroke="#2f8f57" stroke-width="1"/><text x="253.0" y="185.9" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">四环素</text><rect x="18.0" y="258.0" width="364.0" height="26.0" rx="6" fill="#f8fbfd"/><text x="26.0" y="275.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">药物</text><text x="113.4" y="275.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">靶点</text><text x="259.0" y="275.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">后果</text><line x1="18.0" y1="326.0" x2="382.0" y2="326.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="302.0" font-size="12.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">链霉素</text><text x="113.4" y="302.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">30S</text><text x="259.0" y="302.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">引起读码错误、</text><text x="259.0" y="318.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">抑制起始</text><line x1="18.0" y1="352.0" x2="382.0" y2="352.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="344.0" font-size="12.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">四环素</text><text x="113.4" y="344.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">30S A 位</text><text x="259.0" y="344.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">阻止氨酰-tRNA 进位</text><line x1="18.0" y1="378.0" x2="382.0" y2="378.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="370.0" font-size="12.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">氯霉素</text><text x="113.4" y="370.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">50S 肽酰转移酶</text><text x="259.0" y="370.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">抑制肽键形成</text><line x1="18.0" y1="404.0" x2="382.0" y2="404.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="396.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">红霉素</text><text x="113.4" y="396.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">50S 出口通道</text><text x="259.0" y="396.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">阻止新生肽链穿出</text><line x1="18.0" y1="446.0" x2="382.0" y2="446.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="422.0" font-size="12.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">嘌呤霉素</text><text x="113.4" y="422.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">50S A 位（模拟氨酰-</text><text x="113.4" y="438.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">tRNA）</text><text x="259.0" y="422.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">使肽链提前释放</text><rect x="18.0" y="451.0" width="364.0" height="89.0" rx="8" fill="#e2f5f2"/><rect x="18.0" y="451.0" width="3.5" height="89.0" rx="1.8" fill="#0f766e"/><text x="32.0" y="471.0" font-size="11.5" font-weight="700" fill="#0f766e" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="488.0" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">细菌核糖体 70S（30S+50S）、人 80S（40S+60S），</text><text x="32.0" y="507.0" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">结构差异带来选择性；但氯霉素也抑制人线粒体核糖体</text><text x="32.0" y="526.0" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">→ 骨髓抑制。</text></svg>