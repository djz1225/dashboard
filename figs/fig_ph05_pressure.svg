<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 604" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="胸膜腔内压与肺内压"><title>胸膜腔内压与肺内压</title><desc>肺内压与大气压之差驱动气流；胸膜腔内压＝肺内压−肺回缩力，平静吸气约 −10、平静呼气约 −5 mmHg，靠胸膜腔封闭与肺回缩倾向维持负压。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胸膜腔内压与肺内压：两个压差分工</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肺内压管「进不进气」，胸膜腔内压管「肺会不会塌」</text><line x1="18.0" y1="63.0" x2="33.0" y2="63.0" stroke="#1f6fb2" stroke-width="2.2" stroke-linecap="round"/><text x="38.0" y="67.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肺内压</text><line x1="88.5" y1="63.0" x2="103.5" y2="63.0" stroke="#c0392b" stroke-width="2.2" stroke-linecap="round"/><text x="108.5" y="67.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胸膜腔内压</text><rect x="18.0" y="77.0" width="364.0" height="178.0" rx="9" fill="#ffffff" stroke="#e3eaf2" stroke-width="1.1"/><line x1="48.0" y1="118.0" x2="52.0" y2="118.0" stroke="#cbd8e4" stroke-width="1" stroke-linecap="round"/><text x="45.0" y="122.0" text-anchor="end" font-size="10.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">+2</text><line x1="52.0" y1="118.0" x2="370.0" y2="118.0" stroke="#f1f6fa" stroke-width="1" stroke-linecap="round"/><line x1="48.0" y1="130.7" x2="52.0" y2="130.7" stroke="#cbd8e4" stroke-width="1" stroke-linecap="round"/><text x="45.0" y="134.7" text-anchor="end" font-size="10.5" font-weight="400" fill="#8095a8" font-family="-apple-system,Blink