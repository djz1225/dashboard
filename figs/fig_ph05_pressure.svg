 肺回缩力；平静吸气 −10，平</text><text x="39.0" y="396.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">静呼气 −5 mmHg</text><rect x="30.0" y="406.0" width="3.0" height="15.0" rx="1.5" fill="#b45309"/><text x="39.0" y="419.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">为何是负压</text><text x="347.0" y="419.0" text-anchor="end" font-size="12" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">两个条件</text><text x="39.0" y="437.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胸膜腔封闭 ＋ 肺始终有回缩倾向（拉胸膜）</text><rect x="30.0" y="447.0" width="3.0" height="15.0" rx="1.5" fill="#4a5a6b"/><text x="39.0" y="460.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">临床意义</text><text x="347.0" y="460.0" text-anchor="end" font-size="12" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">气胸／肺不张</text><text x="39.0" y="478.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胸膜腔与大气相通→负压消失→肺塌陷；肺纤</text><text x="39.0" y="494.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">维化→回缩力↑→负压更负</text><rect x="18.0" y="514.0" width="364.0" height="70.0" rx="8" fill="#eef2f7"/><rect x="18.0" y="514.0" width="3.5" height="70.0" rx="1.8" fill="#4a5a6b"/><text x="32.0" y="534.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="551.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">用力呼气时胸膜腔内压可转为正压（如剧烈咳嗽），这是</text><text x="32.0" y="570.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">「负压恒定」之外唯一要记的例外。</text></svg>