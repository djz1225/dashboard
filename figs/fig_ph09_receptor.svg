<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 712" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="感受器的一般特性与痛觉"><title>感受器的一般特性与痛觉</title><desc>感受器具有适宜刺激、换能、编码与适应四个一般特性；快适应见于触觉嗅觉，慢适应见于痛觉与颈动脉窦；痛觉无适宜刺激、几乎不适应，痒觉有独立通路。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">感受器的一般特性与痛觉</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">换能、编码、适应是三条必考；痛觉几乎不适应</text><rect x="18.0" y="65.0" width="177.0" height="116.0" rx="9" fill="#e2f5f2" stroke="#0f766e" stroke-width="1.1"/><text x="29.0" y="86.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">适宜刺激</text><text x="29.0" y="105.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">每种感受器只对一种能量形</text><text x="29.0" y="121.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">式最敏感</text><text x="29.0" y="141.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">眼对光、耳对声，特异性由</text><text x="29.0" y="157.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">结构决定</text><rect x="205.0" y="65.0" width="177.0" height="116.0" rx="9" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1.1"/><text x="216.0" y="86.0" font-size="12.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">换能作用</text><text x="216.0" y="105.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">刺激能量 → 感受器电位（</text><text x="216.0" y="121.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">局部电位）</text><text x="216.0" y="141.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">达阈值才触发动作电位</text><rect x="18.0" y="191.0" width="177.0" height="116.0" rx="9" fill="#f2ecfb" stroke="#7b4bb7" stroke-width="1.1"/><text x="29.0" y="212.0" font-size="12.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">编码作用</text><text x="29.0" y="231.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">性质：专用通路＋中枢部位</text><text x="29.0" y="251.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">强度：动作电位的频率</text><rect x="205.0" y="191.0" width="177.0" height="116.0" rx="9" fill="#fef3c7" stroke="#b45309" stroke-width="1.1"/><text x="216.0" y="212.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">适应现象</text><text x="216.0" y="231.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">恒定刺激下传入冲动逐渐减少</text><text x="216.0" y="251.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">快适应：触觉、嗅觉；慢适</text><text x="216.0" y="267.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">应：痛觉、颈动脉窦</text><rect x="18.0" y="319.0" width="177.0" height="136.0" rx="9" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1.1"/><text x="29.0" y="340.0" font-size="12.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">快适应感受器</text><text x="29.0" y="359.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">触觉、嗅觉</text><text x="29.0" y="379.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">报告「变了」而不是「</text><text x="29.0" y="395.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一直有」</text><text x="29.0" y="415.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">意义：忽略持续无关刺激</text><rect x="205.0" y="319.0" width="177.0" height="136.0" rx="9" fill="#fef3c7" stroke="#b45309" stroke-width="1.1"/><text x="216.0" y="340.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">慢适应感受器</text><text x="216.0" y="359.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">痛觉、本体感觉、颈动脉窦</text><text x="216.0" y="375.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">压力感受器</text><text x="216.0" y="395.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">持续报告，不能漏</text><text x="216.0" y="415.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">痛觉几乎不适应 → 保</text><text x="216.0" y="431.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">护性设计</text><rect x="18.0" y="465.0" width="364.0" height="145.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="483.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">痛觉的特殊之处</text><rect x="31.0" y="493.0" width="3.0" height="15.0" rx="1.5" fill="#c0392b"/><text x="40.0" y="506.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">痛觉无适宜刺激</text><text x="344.0" y="506.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">任何过强刺激</text><text x="40.0" y="524.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">机械、温度、化学刺激过强均可致痛</text><rect x="31.0" y="532.0" width="3.0" height="15.0" rx="1.5" fill="#7b4bb7"/><text x="40.0" y="545.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">痒觉是独立通路</text><text x="344.0" y="545.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">非弱痛觉</text><text x="40.0" y="563.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">特异感受器＋专用传导通路；组胺（急性痒）</text><rect x="31.0" y="571.0" width="3.0" height="15.0" rx="1.5" fill="#4a5a6b"/><text x="40.0" y="584.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">内脏痛特点</text><text x="344.0" y="584.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">定位不清</text><text x="40.0" y="602.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">牵涉痛：皮肤特定区域与内脏同一脊髓节段</text><rect x="18.0" y="622.0" width="364.0" height="70.0" rx="8" fill="#eef2f7"/><rect x="18.0" y="622.0" width="3.5" height="70.0" rx="1.8" fill="#4a5a6b"/><text x="32.0" y="642.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="659.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">痛觉几乎不适应，这是保护性设计；痒觉是独立通路，不</text><text x="32.0" y="678.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">等于「弱的痛觉」。</text></svg>