<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 480" width="100%" style="max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px" role="img"><text x="165.0" y="22.6" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">感受器的四个一般生理特性</text><text x="165.0" y="43.0" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">换能、编码、适应、敏感——四件事都考</text><rect x="15.0" y="60.0" width="300.0" height="56.0" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/><text x="24.0" y="79.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">感受器的适宜刺激</text><text x="24.0" y="96.0" text-anchor="start" font-size="13" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">每种感受器只对一种能量形式最敏感</text><text x="24.0" y="112.0" text-anchor="start" font-size="13" font-weight="600" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">眼对光、耳对声——特异性由结构决定</text><rect x="15.0" y="122.0" width="300.0" height="56.0" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/><text x="24.0" y="141.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">换能作用</text><text x="24.0" y="158.0" text-anchor="start" font-size="13" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">刺激能量 → 感受器电位（局部电位）</text><text x="24.0" y="174.0" text-anchor="start" font-size="13" font-weight="600" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">感受器电位达阈值才产生动作电位</text><rect x="15.0" y="184.0" width="300.0" height="56.0" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.4"/><text x="24.0" y="203.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">编码作用</text><text x="24.0" y="220.0" text-anchor="start" font-size="13" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">刺激的「性质、强度、部位」编成神经冲动序列</text><text x="24.0" y="236.0" text-anchor="start" font-size="13" font-weight="600" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">强度编码为频率，性质靠专用通路与中枢部位</text><rect x="15.0" y="246.0" width="300.0" height="56.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.4"/><text x="24.0" y="265.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">适应现象</text><text x="24.0" y="282.0" text-anchor="start" font-size="13" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">恒定刺激持续作用，传入冲动逐渐减少</text><text x="24.0" y="298.0" text-anchor="start" font-size="13" font-weight="600" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">有快适应（触觉）与慢适应（痛觉、颈动脉窦）</text><rect x="15.0" y="310.0" width="300.0" height="108.0" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/><text x="25.0" y="326.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">快适应＝触觉、嗅觉（告诉你「变了」，</text><text x="25.0" y="342.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">不告诉你「一直有」）</text><text x="25.0" y="358.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">慢适应＝痛觉、本体感觉、颈动脉窦压力感受</text><text x="25.0" y="374.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">器（必须一直报告）</text><text x="25.0" y="390.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">痛觉几乎不适应——这是保护性设计，所以能持</text><text x="25.0" y="406.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">续报警</text><rect x="11.0" y="421.0" width="308.0" height="51.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="165.0" y="436.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">换能把刺激变成感受器电位；强度靠频率编码；</text><text x="165.0" y="451.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">痛觉慢适应、触觉快适应</text></svg>