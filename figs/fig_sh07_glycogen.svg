<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 667" width="100%" style="max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px" role="img"><text x="165.0" y="22.6" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">糖原：为什么用 UDPG 与分支</text><text x="165.0" y="43.0" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">合酶与磷酸化酶是双向开关，磷酸化后活性相反</text><rect x="15.0" y="58.0" width="300.0" height="60.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><rect x="15.0" y="58.0" width="4.5" height="60.0" rx="2.2" fill="#0f766e"/><text x="29.0" y="77.0" text-anchor="start" font-size="14" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">糖原合成关键酶</text><text x="29.0" y="94.0" text-anchor="start" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">糖原合酶（GS）</text><text x="29.0" y="109.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">磷酸化后失活；胰岛素去磷酸化→激活</text><rect x="15.0" y="122.0" width="300.0" height="60.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><rect x="15.0" y="122.0" width="4.5" height="60.0" rx="2.2" fill="#b45309"/><text x="29.0" y="141.0" text-anchor="start" font-size="14" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">糖原分解关键酶</text><text x="29.0" y="158.0" text-anchor="start" font-size="12" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">糖原磷酸化酶（GP）</text><text x="29.0" y="173.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">磷酸化后激活；胰高血糖素/肾上腺素→激活</text><rect x="15.0" y="186.0" width="300.0" height="60.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><rect x="15.0" y="186.0" width="4.5" height="60.0" rx="2.2" fill="#15803d"/><text x="29.0" y="205.0" text-anchor="start" font-size="14" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">为什么用 UDPG</text><text x="29.0" y="222.0" text-anchor="start" font-size="12" font-weight="700" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">UDP-葡萄糖</text><text x="29.0" y="237.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">葡萄糖必须先「活化」才能接到糖链末端</text><rect x="15.0" y="250.0" width="300.0" height="60.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><rect x="15.0" y="250.0" width="4.5" height="60.0" rx="2.2" fill="#b91c1c"/><text x="29.0" y="269.0" text-anchor="start" font-size="14" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">brancher / debrancher</text><text x="29.0" y="286.0" text-anchor="start" font-size="12" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">分支酶 / 脱枝酶</text><text x="29.0" y="301.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">分支酶造 α-1,6 键；脱枝酶水解它</text><rect x="15.0" y="316.0" width="300.0" height="102.0" rx="7" fill="#dcfce7" stroke="#cbd5e1" stroke-width="1.4"/><text x="25.0" y="335.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">分支的三个好处</text><text x="25.0" y="353.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 提高溶解度（减少渗透压效应）</text><text x="25.0" y="369.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 多个非还原端 → 磷酸化酶可同时作用，</text><text x="25.0" y="385.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">分解速度快</text><text x="25.0" y="401.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 分支使糖原致密，节省胞内空间</text><rect x="15.0" y="426.0" width="300.0" height="24.0" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/><text x="21.0" y="442.0" text-anchor="start" font-size="11.2" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">组织</text><text x="61.4" y="442.0" text-anchor="start" font-size="11.2" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">能不能补血糖</text><text x="133.7" y="442.0" text-anchor="start" font-size="11.2" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">原因</text><rect x="15.0" y="450.0" width="300.0" height="36.0" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.9"/><text x="21.0" y="465.0" text-anchor="start" font-size="11.2" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">肝</text><text x="61.4" y="465.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">能</text><text x="133.7" y="465.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">有葡糖-6-磷酸酶，可水解出游离葡</text><text x="133.7" y="479.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">萄糖</text><rect x="15.0" y="486.0" width="300.0" height="36.0" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.9"/><text x="21.0" y="501.0" text-anchor="start" font-size="11.2" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">肌</text><text x="61.4" y="501.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">不能</text><text x="133.7" y="501.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">缺葡糖-6-磷酸酶，G-6-P 只能自</text><text x="133.7" y="515.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">己用</text><rect x="15.0" y="527.0" width="300.0" height="76.0" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/><text x="25.0" y="543.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">易错：糖原分解首产物是葡糖-1-磷酸（</text><text x="25.0" y="559.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">不是葡糖-6-磷酸）</text><text x="25.0" y="575.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">GS 磷酸化失活、GP 磷酸化激活——两者方向相</text><text x="25.0" y="591.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">反，这是最容易记反的一对</text><rect x="11.0" y="608.0" width="308.0" height="51.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="165.0" y="623.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">糖原合成用 UDPG；分支提高溶解度与分解速度；</text><text x="165.0" y="638.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">肌缺葡糖-6-磷酸酶故不能补血糖</text></svg>