<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 592" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="糖原合成与分解"><title>糖原合成与分解</title><desc>糖原合成靠糖原合酶（磷酸化后失活）以 UDPG 为供体，分解靠糖原磷酸化酶（磷酸化后激活）产葡糖-1-磷酸；分支酶造 α-1,6 键提高溶解度与分解速度；肌缺葡糖-6-磷酸酶，故肌糖原不能直接补血糖。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">糖原合成与分解</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">合酶与磷酸化酶是双向开关：磷酸化后活性恰好相反</text><rect x="18.0" y="65.0" width="177.0" height="136.0" rx="9" fill="#e6f6ec" stroke="#2f8f57" stroke-width="1.1"/><text x="29.0" y="86.0" font-size="12.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">糖原合酶 GS｜合成</text><text x="29.0" y="105.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">磷酸化后失活</text><text x="29.0" y="125.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胰岛素 → 去磷酸化 →</text><text x="29.0" y="141.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"> 激活</text><text x="29.0" y="161.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">把 UDPG 的糖基接到非</text><text x="29.0" y="177.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">还原端</text><rect x="205.0" y="65.0" width="177.0" height="136.0" rx="9" fill="#fdeceb" stroke="#c0392b" stroke-width="1.1"/><text x="216.0" y="86.0" font-size="12.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">糖原磷酸化酶 GP｜分解</text><text x="216.0" y="105.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">磷酸化后激活</text><text x="216.0" y="125.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胰高血糖素 / 肾上</text><text x="216.0" y="141.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">腺素→激活</text><text x="216.0" y="161.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">从非还原端逐个切下葡糖-</text><text x="216.0" y="177.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">1-磷酸</text><rect x="18.0" y="211.0" width="364.0" height="185.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="230.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">为什么用 UDPG 与分支</text><rect x="30.0" y="241.0" width="3.0" height="15.0" rx="1.5" fill="#0f766e"/><text x="39.0" y="254.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">为什么用 UDPG</text><text x="370.0" y="254.0" text-anchor="end" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">先活化</text><text x="39.0" y="272.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">葡萄糖必须先活化成 UDP-葡萄糖才能接到糖</text><text x="39.0" y="288.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">链末端</text><rect x="30.0" y="299.0" width="3.0" height="15.0" rx="1.5" fill="#0f766e"/><text x="39.0" y="312.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">分支酶 / 脱枝酶</text><text x="370.0" y="312.0" text-anchor="end" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">α-1,6</text><text x="39.0" y="330.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">分支酶造 α-1,6 键，脱枝酶水解它</text><rect x="30.0" y="341.0" width="3.0" height="15.0" rx="1.5" fill="#2f8f57"/><text x="39.0" y="354.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">分支的三个好处</text><text x="370.0" y="354.0" text-anchor="end" font-size="12" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">三利</text><text x="39.0" y="372.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">提高溶解度（减少渗透压）、多个非还原端使分解更</text><text x="39.0" y="388.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">快、糖原更致密</text><rect x="18.0" y="408.0" width="177.0" height="84.0" rx="9" fill="#e6f6ec" stroke="#2f8f57" stroke-width="1.1"/><text x="29.0" y="429.0" font-size="12.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肝糖原｜能补血糖</text><text x="29.0" y="448.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">有葡糖-6-磷酸酶</text><text x="29.0" y="468.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">可水解出游离葡萄糖释放入血</text><rect x="205.0" y="408.0" width="177.0" height="84.0" rx="9" fill="#eef2f7" stroke="#4a5a6b" stroke-width="1.1"/><text x="216.0" y="429.0" font-size="12.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肌糖原｜不能补血糖</text><text x="216.0" y="448.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">缺葡糖-6-磷酸酶</text><text x="216.0" y="468.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">G-6-P 只能自己氧化供能</text><rect x="18.0" y="502.0" width="364.0" height="70.0" rx="8" fill="#fef3c7"/><rect x="18.0" y="502.0" width="3.5" height="70.0" rx="1.8" fill="#b45309"/><text x="32.0" y="522.0" font-size="11.5" font-weight="700" fill="#b45309" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">易错</text><text x="32.0" y="539.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">糖原分解首产物是葡糖-1-磷酸（不是葡糖-6-磷酸）；</text><text x="32.0" y="558.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">GS 磷酸化失活、GP 磷酸化激活，这对最容易记反。</text></svg>