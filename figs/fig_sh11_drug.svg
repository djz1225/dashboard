<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 533" width="100%" style="max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px" role="img"><text x="165.0" y="22.6" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">抗核苷酸代谢药：三个靶点</text><text x="165.0" y="43.0" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">叶酸 → dTMP → 嘌呤，任一处断链都能抑增殖</text><rect x="15.0" y="58.0" width="300.0" height="24.0" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/><text x="21.0" y="74.0" text-anchor="start" font-size="11.2" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">药物</text><text x="93.9" y="74.0" text-anchor="start" font-size="11.2" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">靶点酶</text><text x="204.7" y="74.0" text-anchor="start" font-size="11.2" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">后果</text><rect x="15.0" y="82.0" width="300.0" height="36.0" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.9"/><text x="21.0" y="97.0" text-anchor="start" font-size="11.2" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">甲氨蝶呤（</text><text x="21.0" y="111.0" text-anchor="start" font-size="11.2" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">MTX）</text><text x="93.9" y="97.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">二氢叶酸还原酶</text><text x="204.7" y="97.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">FH₄ 不足 → dTMP </text><text x="204.7" y="111.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">与嘌呤合成受阻</text><rect x="15.0" y="118.0" width="300.0" height="36.0" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.9"/><text x="21.0" y="133.0" text-anchor="start" font-size="11.2" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">5-氟尿嘧啶（</text><text x="21.0" y="147.0" text-anchor="start" font-size="11.2" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">5-FU）</text><text x="93.9" y="133.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">胸苷酸合酶</text><text x="204.7" y="133.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">dTMP 生成受阻（</text><text x="204.7" y="147.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">「自杀底物」）</text><rect x="15.0" y="154.0" width="300.0" height="36.0" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.9"/><text x="21.0" y="169.0" text-anchor="start" font-size="11.2" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">6-巯基嘌呤（</text><text x="21.0" y="183.0" text-anchor="start" font-size="11.2" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">6-MP）</text><text x="93.9" y="169.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">抑制嘌呤合成（</text><text x="93.9" y="183.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">需 HGPRT 活化）</text><text x="204.7" y="169.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">IMP 生成受阻</text><rect x="15.0" y="190.0" width="300.0" height="36.0" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.9"/><text x="21.0" y="205.0" text-anchor="start" font-size="11.2" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">羟基脲</text><text x="93.9" y="205.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">核糖核苷酸还原酶</text><text x="204.7" y="205.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">dNTP 不足 → DNA </text><text x="204.7" y="219.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">合成停滞</text><rect x="15.0" y="226.0" width="300.0" height="36.0" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.9"/><text x="21.0" y="241.0" text-anchor="start" font-size="11.2" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">阿糖胞苷</text><text x="93.9" y="241.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">DNA 聚合酶</text><text x="204.7" y="241.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">掺入 DNA 后终止延</text><text x="204.7" y="255.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">伸</text><rect x="15.0" y="267.0" width="300.0" height="118.0" rx="7" fill="#fee2e2" stroke="#cbd5e1" stroke-width="1.4"/><text x="25.0" y="286.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">为什么 MTX 要「亚叶酸钙解救」</text><text x="25.0" y="304.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· MTX 抑制 DHFR，正常细胞也被抑制</text><text x="25.0" y="320.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 亚叶酸钙（甲酰四氢叶酸）绕过 DHFR 直接</text><text x="25.0" y="336.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">补 FH₄ → 救正常细胞</text><text x="25.0" y="352.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 这是「大剂量 MTX + 亚叶酸解救」方案的</text><text x="25.0" y="368.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">生化基础</text><rect x="15.0" y="393.0" width="300.0" height="76.0" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/><text x="25.0" y="409.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">易错：6-MP 是前药，需 HGPRT 活化；HGPRT</text><text x="25.0" y="425.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"> 缺乏者无效</text><text x="25.0" y="441.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">5-FU 是「自杀底物」——被当作正常底物代谢</text><text x="25.0" y="457.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">后不可逆抑制靶酶</text><rect x="11.0" y="474.0" width="308.0" height="51.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="165.0" y="489.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">MTX 断叶酸、5-FU 断 dTMP、6-MP 断嘌呤；</text><text x="165.0" y="504.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">MTX 需亚叶酸钙解救</text></svg>