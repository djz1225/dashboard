<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 593" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="抗代谢药：三个靶点"><title>抗代谢药：三个靶点</title><desc>抗核苷酸代谢药作用于三个层次：甲氨蝶呤抑制二氢叶酸还原酶使 FH₄ 不足，5-氟尿嘧啶抑制胸苷酸合酶阻断 dTMP，6-巯基嘌呤抑制嘌呤合成（需 HGPRT 活化）；羟基脲抑制核糖核苷酸还原酶使 dNTP 不足，阿糖胞苷抑制 DNA 聚合酶。大剂量 MTX 需用亚叶酸钙解救。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">抗代谢药：三个靶点</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">叶酸 → dTMP → 嘌呤 → dNTP，任一处断链都能抑制增殖</text><rect x="18.0" y="65.0" width="364.0" height="26.0" rx="6" fill="#f8fbfd"/><text x="26.0" y="82.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">药物</text><text x="142.5" y="82.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">靶点酶</text><text x="251.7" y="82.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">后果</text><line x1="18.0" y1="133.0" x2="382.0" y2="133.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="109.0" font-size="12.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">甲氨蝶呤 MTX</text><text x="142.5" y="109.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">二氢叶酸还原酶</text><text x="251.7" y="109.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">FH₄ 不足 → dTMP</text><text x="251.7" y="125.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">与嘌呤受阻</text><line x1="18.0" y1="175.0" x2="382.0" y2="175.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="151.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">5-氟尿嘧啶</text><text x="26.0" y="167.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">5-FU</text><text x="142.5" y="151.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胸苷酸合酶</text><text x="251.7" y="151.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">dTMP 生成受阻（</text><text x="251.7" y="167.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">自杀底物）</text><line x1="18.0" y1="217.0" x2="382.0" y2="217.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="193.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">6-巯基嘌呤</text><text x="26.0" y="209.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">6-MP</text><text x="142.5" y="193.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">嘌呤合成（需</text><text x="142.5" y="209.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">HGPRT 活化）</text><text x="251.7" y="193.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">IMP 生成受阻</text><line x1="18.0" y1="259.0" x2="382.0" y2="259.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="235.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">羟基脲</text><text x="142.5" y="235.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">核糖核苷酸</text><text x="142.5" y="251.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">还原酶</text><text x="251.7" y="235.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">dNTP 不足 → DNA</text><text x="251.7" y="251.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"> 合成停滞</text><line x1="18.0" y1="285.0" x2="382.0" y2="285.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="277.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">阿糖胞苷</text><text x="142.5" y="277.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">DNA 聚合酶</text><text x="251.7" y="277.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">掺入 DNA 后终止延伸</text><rect x="18.0" y="291.0" width="364.0" height="181.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="310.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">MTX 的两面</text><rect x="30.0" y="321.0" width="3.0" height="15.0" rx="1.5" fill="#c0392b"/><text x="39.0" y="334.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">为什么 MTX 要解救</text><text x="370.0" y="334.0" text-anchor="end" font-size="12" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">非选择性</text><text x="39.0" y="352.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">MTX 抑制二氢叶酸还原酶，正常细胞也被抑制</text><rect x="30.0" y="361.0" width="3.0" height="15.0" rx="1.5" fill="#2f8f57"/><text x="39.0" y="374.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">亚叶酸钙解救</text><text x="370.0" y="374.0" text-anchor="end" font-size="12" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">绕过</text><text x="39.0" y="392.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">甲酰四氢叶酸绕过 DHFR 直接补 FH₄ → 救正</text><text x="39.0" y="408.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">常细胞</text><rect x="30.0" y="417.0" width="3.0" height="15.0" rx="1.5" fill="#0f766e"/><text x="39.0" y="430.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">方案基础</text><text x="370.0" y="430.0" text-anchor="end" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">大剂量 + 解救</text><text x="39.0" y="448.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">这就是「大剂量 MTX + 亚叶酸钙解救」</text><text x="39.0" y="464.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">的生化依据</text><rect x="18.0" y="484.0" width="364.0" height="89.0" rx="8" fill="#fef3c7"/><rect x="18.0" y="484.0" width="3.5" height="89.0" rx="1.8" fill="#b45309"/><text x="32.0" y="504.0" font-size="11.5" font-weight="700" fill="#b45309" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">易错</text><text x="32.0" y="521.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">6-MP 是前药，需 HGPRT 活化，HGPRT 缺乏者无效；</text><text x="32.0" y="540.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">5-FU 是「自杀底物」，被当作正常底物代谢后不可逆抑</text><text x="32.0" y="559.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">制靶酶。</text></svg>