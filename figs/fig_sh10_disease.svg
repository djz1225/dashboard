<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 564" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="遗传性氨基酸病：缺哪个酶就堆哪个底物"><title>遗传性氨基酸病：缺哪个酶就堆哪个底物</title><desc>氨基酸遗传病遵循「缺哪个酶就堆哪个底物」：苯丙氨酸羟化酶缺乏致苯丙酮尿症（苯丙氨酸堆积、智力障碍、鼠尿味），酪氨酸酶缺乏致白化病，尿黑酸氧化酶缺乏致尿黑酸尿症（尿氧化变黑、褐黄病），支链 α-酮酸脱氢酶缺乏致枫糖尿症；胱硫醚 β-合酶缺乏则致同型胱氨酸尿症。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">遗传性氨基酸病：缺哪个酶就堆哪个底物</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一个酶 → 一个底物堆积 → 一种病；苯丙氨酸与酪氨酸最容易混</text><rect x="18.0" y="65.0" width="364.0" height="26.0" rx="6" fill="#f8fbfd"/><text x="26.0" y="82.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">疾病</text><text x="135.2" y="82.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">缺陷酶</text><text x="237.1" y="82.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">堆积与表现</text><line x1="18.0" y1="133.0" x2="382.0" y2="133.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="109.0" font-size="12.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">苯丙酮尿症PKU</text><text x="135.2" y="109.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">苯丙氨酸羟化酶</text><text x="237.1" y="109.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">苯丙氨酸→苯丙酮酸；智</text><text x="237.1" y="125.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">力障碍、鼠尿味</text><line x1="18.0" y1="175.0" x2="382.0" y2="175.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="151.0" font-size="12.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">白化病</text><text x="135.2" y="151.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">酪氨酸酶</text><text x="237.1" y="151.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">不能生成黑色素；毛发皮</text><text x="237.1" y="167.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肤白、畏光</text><line x1="18.0" y1="217.0" x2="382.0" y2="217.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="193.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">尿黑酸尿症</text><text x="135.2" y="193.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">尿黑酸氧化酶</text><text x="237.1" y="193.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">尿黑酸堆积；尿氧化变黑、</text><text x="237.1" y="209.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">关节褐黄病</text><line x1="18.0" y1="259.0" x2="382.0" y2="259.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="235.0" font-size="12.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">枫糖尿症</text><text x="135.2" y="235.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">支链 α-</text><text x="135.2" y="251.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">酮酸脱氢酶</text><text x="237.1" y="235.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">亮/异亮/缬氨酸堆积；尿</text><text x="237.1" y="251.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">有枫糖味</text><rect x="18.0" y="265.0" width="364.0" height="197.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="284.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">三个易混点</text><rect x="30.0" y="295.0" width="3.0" height="15.0" rx="1.5" fill="#0f766e"/><text x="39.0" y="308.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">PKU vs 白化病</text><text x="370.0" y="308.0" text-anchor="end" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">同一底物链</text><text x="39.0" y="326.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">PKU 是 Phe 不能变 Tyr（皮肤也浅）；白化</text><text x="39.0" y="342.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">病是 Tyr 在但不能变黑色素</text><rect x="30.0" y="351.0" width="3.0" height="15.0" rx="1.5" fill="#0f766e"/><text x="39.0" y="364.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">同型胱氨酸尿症</text><text x="370.0" y="364.0" text-anchor="end" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">补充一个</text><text x="39.0" y="382.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胱硫醚 β-合酶缺乏 → 同型半胱氨酸升高；血</text><text x="39.0" y="398.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">栓、晶状体脱位</text><rect x="30.0" y="407.0" width="3.0" height="15.0" rx="1.5" fill="#2f8f57"/><text x="39.0" y="420.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">新生儿筛查</text><text x="370.0" y="420.0" text-anchor="end" font-size="12" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">查浓度</text><text x="39.0" y="438.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">筛的是苯丙氨酸浓度（不是尿味）；确诊后需终身</text><text x="39.0" y="454.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">低 Phe 饮食</text><rect x="18.0" y="474.0" width="364.0" height="70.0" rx="8" fill="#e2f5f2"/><rect x="18.0" y="474.0" width="3.5" height="70.0" rx="1.8" fill="#0f766e"/><text x="32.0" y="494.0" font-size="11.5" font-weight="700" fill="#0f766e" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="511.0" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">四个病都是「酶缺陷 → 底物堆积」；PKU 患者皮肤浅</text><text x="32.0" y="530.0" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">的原因在 Phe 羟化酶，不在酪氨酸酶。</text></svg>