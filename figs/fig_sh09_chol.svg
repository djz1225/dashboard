<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 651" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="胆固醇合成：HMG-CoA 还原酶是总闸"><title>胆固醇合成：HMG-CoA 还原酶是总闸</title><desc>胆固醇以 3 个乙酰CoA 缩合成 HMG-CoA，再由 HMG-CoA 还原酶（限速酶、他汀靶点）耗 2 NADPH 还原为甲羟戊酸，经鲨烯等多步生成胆固醇，共耗 18 乙酰CoA、36 ATP、16 NADPH；胆固醇不能彻底氧化供能，去向是胆汁酸、类固醇激素、维生素 D₃ 与细胞膜。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胆固醇合成：HMG-CoA 还原酶是总闸</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">他汀抑制此酶；胆固醇环状结构不能彻底氧化，只作前体</text><rect x="18.0" y="65.0" width="364.0" height="329.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="84.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">四步主线</text><rect x="30.0" y="97.0" width="340.0" height="64.0" rx="8" fill="#ffffff" stroke="#e3eaf2" stroke-width="1.1"/><rect x="30.0" y="97.0" width="3.5" height="64.0" rx="1.8" fill="#c0392b"/><circle cx="49.0" cy="114.0" r="9" fill="#c0392b"/><text x="49.0" y="118.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">1</text><text x="65.0" y="118.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">① 3 乙酰CoA → HMG-CoA</text><text x="360.0" y="118.0" text-anchor="end" font-size="12" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">起始</text><text x="65.0" y="136.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">在胞质与内质网；与酮体生成的 HMG-CoA 合</text><text x="65.0" y="152.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">酶不是同一套</text><line x1="49.0" y1="163.0" x2="49.0" y2="170.0" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="170.0" x2="45.6" y2="163.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="170.0" x2="52.4" y2="163.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><rect x="30.0" y="172.0" width="340.0" height="64.0" rx="8" fill="#ffffff" stroke="#e3eaf2" stroke-width="1.1"/><rect x="30.0" y="172.0" width="3.5" height="64.0" rx="1.8" fill="#c1440e"/><circle cx="49.0" cy="189.0" r="9" fill="#c1440e"/><text x="49.0" y="193.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">2</text><text x="65.0" y="193.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">② → 甲羟戊酸</text><text x="360.0" y="193.0" text-anchor="end" font-size="12" font-weight="700" fill="#c1440e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">限速</text><text x="65.0" y="211.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">HMG-CoA 还原酶（限速酶、他汀靶点），耗 2</text><text x="65.0" y="227.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">NADPH</text><line x1="49.0" y1="238.0" x2="49.0" y2="245.0" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="245.0" x2="45.6" y2="238.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="245.0" x2="52.4" y2="238.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><rect x="30.0" y="247.0" width="340.0" height="64.0" rx="8" fill="#ffffff" stroke="#e3eaf2" stroke-width="1.1"/><rect x="30.0" y="247.0" width="3.5" height="64.0" rx="1.8" fill="#7b4bb7"/><circle cx="49.0" cy="264.0" r="9" fill="#7b4bb7"/><text x="49.0" y="268.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">3</text><text x="65.0" y="268.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">③ 甲羟戊酸 → 鲨烯 → 胆固醇</text><text x="360.0" y="268.0" text-anchor="end" font-size="12" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">耗能大</text><text x="65.0" y="286.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">多步反应，共耗 18 乙酰CoA、36 ATP、16</text><text x="65.0" y="302.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">NADPH</text><line x1="49.0" y1="313.0" x2="49.0" y2="320.0" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="320.0" x2="45.6" y2="313.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="320.0" x2="52.4" y2="313.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><rect x="30.0" y="322.0" width="340.0" height="64.0" rx="8" fill="#ffffff" stroke="#e3eaf2" stroke-width="1.1"/><rect x="30.0" y="322.0" width="3.5" height="64.0" rx="1.8" fill="#0f766e"/><circle cx="49.0" cy="339.0" r="9" fill="#0f766e"/><text x="49.0" y="343.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">4</text><text x="65.0" y="343.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">④ 胆固醇的去路</text><text x="360.0" y="343.0" text-anchor="end" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">四大去路</text><text x="65.0" y="361.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">转变为胆汁酸、类固醇激素、维生素 D₃；</text><text x="65.0" y="377.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">构成细胞膜</text><rect x="18.0" y="406.0" width="364.0" height="26.0" rx="6" fill="#f8fbfd"/><text x="26.0" y="423.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">因素</text><text x="120.6" y="423.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">方向</text><text x="178.9" y="423.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">机制</text><line x1="18.0" y1="458.0" x2="382.0" y2="458.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="450.0" font-size="12.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胆固醇升高</text><text x="120.6" y="450.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">抑制</text><text x="178.9" y="450.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">反馈抑制还原酶活性 + 减少酶合成</text><line x1="18.0" y1="484.0" x2="382.0" y2="484.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="476.0" font-size="12.5" font-weight="700" fill="#c1440e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">他汀</text><text x="120.6" y="476.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">抑制</text><text x="178.9" y="476.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">竞争性抑制 HMG-CoA 还原酶</text><line x1="18.0" y1="510.0" x2="382.0" y2="510.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="502.0" font-size="12.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胰岛素</text><text x="120.6" y="502.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">激活</text><text x="178.9" y="502.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">去磷酸化 / 增加酶表达</text><line x1="18.0" y1="536.0" x2="382.0" y2="536.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="528.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胰高血糖素</text><text x="120.6" y="528.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">抑制</text><text x="178.9" y="528.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">磷酸化失活</text><rect x="18.0" y="542.0" width="364.0" height="89.0" rx="8" fill="#e2f5f2"/><rect x="18.0" y="542.0" width="3.5" height="89.0" rx="1.8" fill="#0f766e"/><text x="32.0" y="562.0" font-size="11.5" font-weight="700" fill="#0f766e" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">易错</text><text x="32.0" y="579.0" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胆固醇不能彻底氧化成 CO₂ 与 H₂O——环状结构进不</text><text x="32.0" y="598.0" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">了 β-氧化；它只能作为胆汁酸、类固醇激素与维生素</text><text x="32.0" y="617.0" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">D 的前体。</text></svg>