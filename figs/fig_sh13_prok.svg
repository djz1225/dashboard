<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 648" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="原核多顺反子 vs 真核单顺反子"><title>原核多顺反子 vs 真核单顺反子</title><desc>原核基因以操纵子为单位转录成多顺反子 mRNA，一条 mRNA 携带多个基因、各有核糖体结合位点，且因无核膜可边转录边翻译，原始转录本基本即成熟mRNA；真核基因一基因一套调控元件，转录出单顺反子 pre-mRNA，须经加帽、加尾与剪接三层加工才能出核翻译。操纵子只存在于原核。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">原核多顺反子 vs 真核单顺反子</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">原核一条 mRNA 带多个基因、边转录边翻译；真核一基因一 mRNA</text><rect x="18.0" y="65.0" width="364.0" height="140.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="84.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">原核：多顺反子 + 操纵子</text><text x="30.0" y="106.0" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">操纵子：一个启动子带一串基因</text><rect x="30.0" y="113.0" width="31.4" height="20.0" rx="3" fill="#e2f5f2" stroke="#0f766e" stroke-width="1"/><text x="46.5" y="126.4" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">P</text><rect x="63.0" y="113.0" width="28.1" height="20.0" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1"/><text x="77.8" y="126.4" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">O</text><rect x="92.7" y="113.0" width="71.0" height="20.0" rx="3" fill="#e2f5f2" stroke="#0f766e" stroke-width="1"/><text x="129.0" y="126.4" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">lacZ</text><rect x="165.3" y="113.0" width="71.0" height="20.0" rx="3" fill="#e2f5f2" stroke="#0f766e" stroke-width="1"/><text x="201.6" y="126.4" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">lacY</text><rect x="237.9" y="113.0" width="71.0" height="20.0" rx="3" fill="#e2f5f2" stroke="#0f766e" stroke-width="1"/><text x="274.2" y="126.4" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">lacA</text><rect x="310.5" y="113.0" width="28.1" height="20.0" rx="3" fill="#eef2f7" stroke="#4a5a6b" stroke-width="1"/><text x="325.4" y="126.4" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">T</text><text x="30.0" y="154.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">↓ 一条多顺反子 mRNA（3 个编码区，各有 RBS）</text><rect x="30.0" y="161.0" width="247.5" height="14.0" rx="3" fill="#e2f5f2" stroke="#0f766e" stroke-width="1"/><text x="44.9" y="189.0" font-size="11.5" font-weight="400" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">AUG…UAA</text><text x="124.0" y="189.0" font-size="11.5" font-weight="400" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">AUG…UAA</text><text x="203.2" y="189.0" font-size="11.5" font-weight="400" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">AUG…UAA</text><rect x="18.0" y="217.0" width="364.0" height="126.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="236.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">真核：单顺反子 + 三层加工</text><text x="30.0" y="258.0" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一个基因一套调控元件，转录后要加工</text><rect x="30.0" y="265.0" width="44.6" height="20.0" rx="3" fill="#e2f5f2" stroke="#0f766e" stroke-width="1"/><text x="53.1" y="278.4" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">启动子</text><rect x="76.2" y="265.0" width="41.3" height="20.0" rx="3" fill="#e2f5f2" stroke="#0f766e" stroke-width="1"/><text x="97.7" y="278.4" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">E1</text><rect x="119.1" y="265.0" width="51.2" height="20.0" rx="3" fill="#eef2f7" stroke="#4a5a6b" stroke-width="1"/><rect x="171.9" y="265.0" width="38.0" height="20.0" rx="3" fill="#e2f5f2" stroke="#0f766e" stroke-width="1"/><text x="191.7" y="278.4" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">E2</text><rect x="211.5" y="265.0" width="51.2" height="20.0" rx="3" fill="#eef2f7" stroke="#4a5a6b" stroke-width="1"/><rect x="264.3" y="265.0" width="38.0" height="20.0" rx="3" fill="#e2f5f2" stroke="#0f766e" stroke-width="1"/><text x="284.1" y="278.4" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">E3</text><rect x="303.9" y="265.0" width="44.6" height="20.0" rx="3" fill="#eef2f7" stroke="#4a5a6b" stroke-width="1"/><text x="327.0" y="278.4" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">终止</text><text x="30.0" y="306.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">↓ 加帽（5′-5′）+ 加尾（polyA）+ 剪接</text><rect x="30.0" y="313.0" width="151.8" height="14.0" rx="3" fill="#e2f5f2" stroke="#0f766e" stroke-width="1"/><text x="189.8" y="324.0" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">单顺反子</text><rect x="18.0" y="355.0" width="364.0" height="26.0" rx="6" fill="#f8fbfd"/><text x="26.0" y="372.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">对比项</text><text x="106.1" y="372.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">原核</text><text x="259.0" y="372.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">真核</text><line x1="18.0" y1="423.0" x2="382.0" y2="423.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="399.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">转录单元</text><text x="106.1" y="399.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">多顺反子（一条 mRNA 带</text><text x="106.1" y="415.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">多个基因）</text><text x="259.0" y="399.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">单顺反子（一基因一</text><text x="259.0" y="415.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">mRNA）</text><line x1="18.0" y1="449.0" x2="382.0" y2="449.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="441.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">调控单位</text><text x="106.1" y="441.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">操纵子（operon）</text><text x="259.0" y="441.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一基因一套调控元件</text><line x1="18.0" y1="491.0" x2="382.0" y2="491.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="467.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">转录与翻</text><text x="26.0" y="483.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">译</text><text x="106.1" y="467.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">同一空间，可同时进行</text><text x="259.0" y="467.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">核内转录、胞质翻</text><text x="259.0" y="483.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">译，分开</text><line x1="18.0" y1="533.0" x2="382.0" y2="533.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="509.0" font-size="12.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">原始转录</text><text x="26.0" y="525.0" font-size="12.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">本</text><text x="106.1" y="509.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">基本即成熟 mRNA</text><text x="259.0" y="509.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">需加帽、加尾、剪接</text><rect x="18.0" y="539.0" width="364.0" height="89.0" rx="8" fill="#e2f5f2"/><rect x="18.0" y="539.0" width="3.5" height="89.0" rx="1.8" fill="#0f766e"/><text x="32.0" y="559.0" font-size="11.5" font-weight="700" fill="#0f766e" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="576.0" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">最本质的差别是空间：原核无核膜，转录与翻译可同时进</text><text x="32.0" y="595.0" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">行，衰减调控（trp 操纵子）正依赖这一点；操纵子只</text><text x="32.0" y="614.0" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">在原核。</text></svg>