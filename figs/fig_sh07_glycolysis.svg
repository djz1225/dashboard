<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 638" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="糖酵解：投资两笔、回收四笔"><title>糖酵解：投资两笔、回收四笔</title><desc>糖酵解投资 2 步共耗 2 ATP，裂解为 2 分子 3-磷酸甘油醛，回收阶段经磷酸甘油酸激酶与丙酮酸激酶各产 2 ATP，净得 2 ATP 与 2 NADH；三个不可逆反应由己糖激酶、PFK-1、丙酮酸激酶催化。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">糖酵解：投资两笔、回收四笔</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">净得 2 ATP + 2 NADH；三个不可逆反应就是三个调控点</text><rect x="18.0" y="65.0" width="364.0" height="278.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="84.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">收支账单</text><text x="30.0" y="105.0" font-size="12" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">投资</text><text x="82.0" y="105.0" font-size="12.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">−2 ATP</text><text x="142.0" y="105.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">葡萄糖→G-6-P（己糖激酶 −1）；</text><text x="142.0" y="120.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">F-6-P→F-1,6-BP（PFK-1 −1）</text><rect x="30.0" y="141.0" width="336.0" height="5.0" rx="2.5" fill="#eef3f8"/><rect x="30.0" y="141.0" width="100.8" height="5.0" rx="2.5" fill="#c0392b"/><text x="30.0" y="165.0" font-size="12" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">裂解</text><text x="82.0" y="165.0" font-size="12.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">1 → 2</text><text x="142.0" y="165.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">F-1,6-BP → 2 × 3-磷酸甘油醛，一</text><text x="142.0" y="180.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">分子的账变成两份</text><rect x="30.0" y="201.0" width="336.0" height="5.0" rx="2.5" fill="#eef3f8"/><rect x="30.0" y="201.0" width="168.0" height="5.0" rx="2.5" fill="#4a5a6b"/><text x="30.0" y="225.0" font-size="12" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">回收</text><text x="82.0" y="225.0" font-size="12.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">+4 ATP</text><text x="142.0" y="225.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">磷酸甘油酸激酶 +2、丙酮酸激酶 +2（</text><text x="142.0" y="240.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">各 2 分子 → 共 4）</text><rect x="30.0" y="261.0" width="336.0" height="5.0" rx="2.5" fill="#eef3f8"/><rect x="30.0" y="261.0" width="309.1" height="5.0" rx="2.5" fill="#2f8f57"/><text x="30.0" y="285.0" font-size="12" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">净得</text><text x="82.0" y="285.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">+2 ATP</text><text x="142.0" y="285.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">另产 2 NADH（胞质，需穿梭才进线粒</text><text x="142.0" y="300.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">体产能）</text><rect x="30.0" y="321.0" width="336.0" height="5.0" rx="2.5" fill="#eef3f8"/><rect x="30.0" y="321.0" width="336.0" height="5.0" rx="2.5" fill="#0f766e"/><rect x="18.0" y="355.0" width="364.0" height="26.0" rx="6" fill="#f8fbfd"/><text x="26.0" y="372.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">不可逆反应</text><text x="127.9" y="372.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">关键酶</text><text x="251.7" y="372.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">调控</text><line x1="18.0" y1="423.0" x2="382.0" y2="423.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="399.0" font-size="12.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">葡萄糖</text><text x="26.0" y="415.0" font-size="12.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">→G-6-P</text><text x="127.9" y="399.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">己糖激酶（肝为葡</text><text x="127.9" y="415.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">糖激酶）</text><text x="251.7" y="399.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">产物抑制；肝的葡糖激</text><text x="251.7" y="415.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">酶不受 G-6-P 抑制</text><line x1="18.0" y1="481.0" x2="382.0" y2="481.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="441.0" font-size="12.5" font-weight="700" fill="#c1440e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">F-6-P</text><text x="26.0" y="457.0" font-size="12.5" font-weight="700" fill="#c1440e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">→F-1,6-BP</text><text x="127.9" y="441.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">磷酸果糖激酶-1（</text><text x="127.9" y="457.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">PFK-1）</text><text x="251.7" y="441.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">最重要限速酶；ATP、</text><text x="251.7" y="457.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">柠檬酸抑制，</text><text x="251.7" y="473.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">F-1,6-BP 激活</text><line x1="18.0" y1="523.0" x2="382.0" y2="523.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="499.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">PEP → </text><text x="26.0" y="515.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">丙酮酸</text><text x="127.9" y="499.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">丙酮酸激酶</text><text x="251.7" y="499.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">ATP、丙氨酸抑制；</text><text x="251.7" y="515.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">F-1,6-BP 激活</text><rect x="18.0" y="529.0" width="364.0" height="89.0" rx="8" fill="#e2f5f2"/><rect x="18.0" y="529.0" width="3.5" height="89.0" rx="1.8" fill="#0f766e"/><text x="32.0" y="549.0" font-size="11.5" font-weight="700" fill="#0f766e" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="566.0" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">底物水平磷酸化只有两处（各产 2 ATP）；最关键限速</text><text x="32.0" y="585.0" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">酶是 PFK-1。加上 2 NADH 进呼吸链，1 分子葡萄糖彻</text><text x="32.0" y="604.0" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">底氧化净得 30~32 ATP。</text></svg>