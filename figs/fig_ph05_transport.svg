ont,'PingFang SC','Microsoft YaHei',sans-serif">3-DPG↑</text><text x="29.0" y="485.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">记忆：酸、热、高 CO₂ → </text><text x="29.0" y="501.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">右移</text><text x="29.0" y="521.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">运动肌肉正需要多释氧</text><rect x="205.0" y="409.0" width="177.0" height="136.0" rx="9" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1.1"/><text x="216.0" y="430.0" font-size="12.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">左移｜亲和力↑、难释氧</text><text x="216.0" y="449.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">pH↑、PCO₂↓、温度↓、2,</text><text x="216.0" y="465.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">3-DPG↓</text><text x="216.0" y="485.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">CO 中毒：占位又把曲线左移</text><text x="216.0" y="505.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胎儿 Hb 亲和力高，同属左</text><text x="216.0" y="521.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">移</text><rect x="18.0" y="555.0" width="364.0" height="149.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="573.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">CO₂ 的三种运输形式</text><rect x="30.0" y="583.0" width="3.0" height="15.0" rx="1.5" fill="#4a5a6b"/><text x="39.0" y="596.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">溶解</text><text x="347.0" y="596.0" text-anchor="end" font-size="12" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">5%</text><text x="39.0" y="614.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">物理溶解量极少，但决定动脉血 PO₂</text><rect x="30.0" y="624.0" width="3.0" height="15.0" rx="1.5" fill="#1f6fb2"/><text x="39.0" y="637.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">氨基甲酰血红蛋白</text><text x="347.0" y="637.0" text-anchor="end" font-size="12" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">7%</text><text x="39.0" y="655.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">CO₂ 与 Hb 的氨基结合，不需酶</text><rect x="30.0" y="665.0" width="3.0" height="15.0" rx="1.5" fill="#c0392b"/><text x="39.0" y="678.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">碳酸氢盐 HCO₃⁻</text><text x="347.0" y="678.0" text-anchor="end" font-size="12" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">88%</text><text x="39.0" y="696.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">碳酸酐酶催化，是 CO₂ 运输的主要形式</text><rect x="18.0" y="716.0" width="364.0" height="70.0" rx="8" fill="#eef2f7"/><rect x="18.0" y="716.0" width="3.5" height="70.0" rx="1.8" fill="#4a5a6b"/><text x="32.0" y="736.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="753.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">曲线右移＝易释氧（酸热高 CO₂）；左移＝难释氧（碱</text><text x="32.0" y="772.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">冷低 CO₂、CO 中毒、库存血）。</text></svg>