<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 503" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="同工酶：同一反应，两个方向"><title>同工酶：同一反应，两个方向</title><desc>LDH 由 H、M 两种亚基组成四聚体，共五种同工酶；LDH1（H₄）在心肌催化乳酸→丙酮酸，LDH5（M₄）在肝与骨骼肌催化丙酮酸→乳酸。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">同工酶：同一反应，两个方向</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">LDH1（H₄）心肌促乳酸→丙酮酸；LDH5（M₄）肝肌促丙酮酸→</text><text x="18.0" y="68.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">乳酸</text><rect x="18.0" y="82.0" width="177.0" height="104.0" rx="9" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1.1"/><text x="29.0" y="103.0" font-size="12.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">LDH1 = H₄</text><text x="29.0" y="122.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">乳酸 → 丙酮酸</text><text x="29.0" y="142.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">主要在心肌</text><text x="29.0" y="162.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">亲和力高、被丙酮酸抑制</text><rect x="205.0" y="82.0" width="177.0" height="104.0" rx="9" fill="#f2ecfb" stroke="#7b4bb7" stroke-width="1.1"/><text x="216.0" y="103.0" font-size="12.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">LDH5 = M₄</text><text x="216.0" y="122.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">丙酮酸 → 乳酸</text><text x="216.0" y="142.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">主要在肝、骨骼肌</text><text x="216.0" y="162.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">亲和力低、不被抑制</text><rect x="18.0" y="196.0" width="364.0" height="205.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="215.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">五种同工酶</text><text x="30.0" y="234.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">同工酶＝不同亚基组合出的不同分子形式</text><rect x="30.0" y="244.0" width="316.0" height="24.0" rx="5" fill="#e8f2fb"/><text x="38.0" y="260.0" font-size="12" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">LDH1</text><text x="84.0" y="260.0" font-size="12" font-weight="400" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">H H H H</text><text x="338.0" y="260.0" text-anchor="end" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">4 个 H 亚基</text><rect x="30.0" y="271.0" width="316.0" height="24.0" rx="5" fill="#e8f2fb"/><text x="38.0" y="287.0" font-size="12" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">LDH2</text><text x="84.0" y="287.0" font-size="12" font-weight="400" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">H H H M</text><text x="338.0" y="287.0" text-anchor="end" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">3H + 1M</text><rect x="30.0" y="298.0" width="316.0" height="24.0" rx="5" fill="#eef2f7"/><text x="38.0" y="314.0" font-size="12" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">LDH3</text><text x="84.0" y="314.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">H H M M</text><text x="338.0" y="314.0" text-anchor="end" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">2H + 2M</text><rect x="30.0" y="325.0" width="316.0" height="24.0" rx="5" fill="#f2ecfb"/><text x="38.0" y="341.0" font-size="12" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">LDH4</text><text x="84.0" y="341.0" font-size="12" font-weight="400" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">H M M M</text><text x="338.0" y="341.0" text-anchor="end" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">1H + 3M</text><rect x="30.0" y="352.0" width="316.0" height="24.0" rx="5" fill="#f2ecfb"/><text x="38.0" y="368.0" font-size="12" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">LDH5</text><text x="84.0" y="368.0" font-size="12" font-weight="400" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">M M M M</text><text x="338.0" y="368.0" text-anchor="end" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">4 个 M 亚基</text><rect x="18.0" y="413.0" width="364.0" height="70.0" rx="8" fill="#e2f5f2"/><rect x="18.0" y="413.0" width="3.5" height="70.0" rx="1.8" fill="#0f766e"/><text x="32.0" y="433.0" font-size="11.5" font-weight="700" fill="#0f766e" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="450.0" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">查同工酶谱就是查「哪一型升高」：LDH1 高提示心肌，</text><text x="32.0" y="469.0" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">LDH5 高提示肝。</text></svg>