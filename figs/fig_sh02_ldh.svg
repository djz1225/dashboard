<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 509.5" width="100%" style="max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px" role="img"><text x="165.0" y="22.6" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">同工酶：同一反应，两个方向</text><text x="165.0" y="42.6" text-anchor="middle" font-size="13.5" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">LDH1（H₄）心肌促乳酸→丙酮酸；LDH5（M₄）肝肌促丙酮酸→乳酸</text><rect x="15.0" y="57.5" width="145.0" height="106.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/><text x="87.5" y="78.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">LDH1 = H₄</text><text x="87.5" y="109.5" text-anchor="middle" font-size="14" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">乳酸 → 丙酮酸</text><text x="87.5" y="133.5" text-anchor="middle" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">主要在 心肌</text><text x="87.5" y="152.5" text-anchor="middle" font-size="13.5" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">有氧</text><rect x="170.0" y="57.5" width="145.0" height="106.0" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="242.5" y="78.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">LDH5 = M₄</text><text x="242.5" y="109.5" text-anchor="middle" font-size="14" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">丙酮酸 → 乳酸</text><text x="242.5" y="133.5" text-anchor="middle" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">主要在 肝、骨骼肌</text><text x="242.5" y="152.5" text-anchor="middle" font-size="13.5" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">无氧糖酵解</text><text x="15.0" y="186.5" text-anchor="start" font-size="13.5" font-weight="700" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">两种亚基 → 五种同工酶（四聚体）</text><rect x="15.0" y="197.5" width="56.0" height="58.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><text x="43.0" y="215.5" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC',sans-serif">LDH1</text><text x="43.0" y="233.5" text-anchor="middle" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">H₄</text><text x="43.0" y="248.5" text-anchor="middle" font-size="10.8" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">4H + 0M</text><rect x="76.0" y="197.5" width="56.0" height="58.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><text x="104.0" y="215.5" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC',sans-serif">LDH2</text><text x="104.0" y="233.5" text-anchor="middle" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">H₃M</text><text x="104.0" y="248.5" text-anchor="middle" font-size="10.8" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">3H + 1M</text><rect x="137.0" y="197.5" width="56.0" height="58.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><text x="165.0" y="215.5" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC',sans-serif">LDH3</text><text x="165.0" y="233.5" text-anchor="middle" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">H₂M₂</text><text x="165.0" y="248.5" text-anchor="middle" font-size="10.8" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">2H + 2M</text><rect x="198.0" y="197.5" width="56.0" height="58.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><text x="226.0" y="215.5" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC',sans-serif">LDH4</text><text x="226.0" y="233.5" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">HM₃</text><text x="226.0" y="248.5" text-anchor="middle" font-size="10.8" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">1H + 3M</text><rect x="259.0" y="197.5" width="56.0" height="58.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><text x="287.0" y="215.5" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC',sans-serif">LDH5</text><text x="287.0" y="233.5" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">M₄</text><text x="287.0" y="248.5" text-anchor="middle" font-size="10.8" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">0H + 4M</text><rect x="15.0" y="265.5" width="300.0" height="42.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="27.0" y="285.5" text-anchor="start" font-size="14" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">正常血清</text><text x="305.0" y="285.5" text-anchor="end" font-size="13.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">LDH2 最高</text><text x="27.0" y="302.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">LDH2 &gt; LDH1 &gt; LDH3 &gt; LDH4 &gt; LDH5</text><rect x="15.0" y="317.5" width="300.0" height="42.0" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/><text x="27.0" y="337.5" text-anchor="start" font-size="14" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">急性心肌梗死</text><text x="305.0" y="337.5" text-anchor="end" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">翻转</text><text x="27.0" y="354.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">LDH1 &gt; LDH2（LDH 翻转）</text><rect x="15.0" y="369.5" width="300.0" height="76.0" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/><text x="25.0" y="385.5" text-anchor="start" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">记忆：H 在心（Heart）→ LDH1 高；M 在肌（</text><text x="25.0" y="401.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">Muscle）→ LDH5 高</text><text x="25.0" y="417.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">心梗看 LDH1 翻转，肝病看 LDH5 升高 —— </text><text x="25.0" y="433.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">一张同工酶谱能定位组织</text><rect x="11.0" y="450.5" width="308.0" height="51.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="165.0" y="465.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">同工酶＝同一反应不同版本；H₄ 在心促乳酸利</text><text x="165.0" y="481.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">用，M₄ 在肝肌促乳酸生成</text></svg>