<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 556" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="动脉血压：四个形成条件、五个影响因素"><title>动脉血压：四个形成条件、五个影响因素</title><desc>动脉血压需血液充盈、心脏射血、外周阻力、大动脉弹性四个条件；搏出量主要影响收缩压，心率与外周阻力主要影响舒张压，大动脉弹性降低使脉压增大。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">动脉血压：四个形成条件、五个影响因素</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">收缩压看搏出量，舒张压看外周阻力，脉压看大动脉弹性</text><rect x="18.0" y="65.0" width="177.0" height="84.0" rx="9" fill="#e2f5f2" stroke="#0f766e" stroke-width="1.1"/><text x="29.0" y="86.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">血液充盈</text><text x="29.0" y="105.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">循环系统内有足够血液</text><text x="29.0" y="125.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">是形成血压的前提</text><rect x="205.0" y="65.0" width="177.0" height="84.0" rx="9" fill="#fdeceb" stroke="#c0392b" stroke-width="1.1"/><text x="216.0" y="86.0" font-size="12.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">心脏射血</text><text x="216.0" y="105.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">提供能量，是血压动力</text><text x="216.0" y="125.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">搏出量决定收缩压</text><rect x="18.0" y="159.0" width="177.0" height="84.0" rx="9" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1.1"/><text x="29.0" y="180.0" font-size="12.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">外周阻力</text><text x="29.0" y="199.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">小动脉口径是主要来源</text><text x="29.0" y="219.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">决定舒张压高低</text><rect x="205.0" y="159.0" width="177.0" height="84.0" rx="9" fill="#f2ecfb" stroke="#7b4bb7" stroke-width="1.1"/><text x="216.0" y="180.0" font-size="12.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">大动脉弹性</text><text x="216.0" y="199.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">缓冲收缩压、维持舒张压</text><text x="216.0" y="219.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">弹性↓→脉压增大</text><rect x="18.0" y="249.0" width="3.0" height="14.0" rx="1.5" fill="#0f766e"/><text x="28.0" y="259.0" font-size="13.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">五个影响因素：看收缩压／舒张压／脉压各自怎么变</text><rect x="18.0" y="271.0" width="364.0" height="24.0" rx="6" fill="#e2f5f2"/><text x="24.0" y="287.0" font-size="10.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">因素↑</text><text x="125.9" y="287.0" font-size="10.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">收缩压</text><text x="198.7" y="287.0" font-size="10.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">舒张压</text><text x="271.5" y="287.0" font-size="10.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">脉压</text><line x1="18.0" y1="319.0" x2="382.0" y2="319.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="24.0" y="312.0" font-size="12" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">搏出量</text><text x="125.9" y="312.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">↑ 明显</text><text x="198.7" y="312.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">略↑</text><text x="271.5" y="312.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">增大</text><line x1="18.0" y1="343.0" x2="382.0" y2="343.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="24.0" y="336.0" font-size="12" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">心率</text><text x="125.9" y="336.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">略↑</text><text x="198.7" y="336.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">↑ 明显</text><text x="271.5" y="336.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">减小</text><line x1="18.0" y1="367.0" x2="382.0" y2="367.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="24.0" y="360.0" font-size="12" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">外周阻力</text><text x="125.9" y="360.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">略↑</text><text x="198.7" y="360.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">↑ 明显</text><text x="271.5" y="360.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">减小</text><line x1="18.0" y1="391.0" x2="382.0" y2="391.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="24.0" y="384.0" font-size="12" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">大动脉弹性↓</text><text x="125.9" y="384.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">↑</text><text x="198.7" y="384.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">↓</text><text x="271.5" y="384.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">增大</text><line x1="18.0" y1="415.0" x2="382.0" y2="415.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="24.0" y="408.0" font-size="12" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">循环血量↓</text><text x="125.9" y="408.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">↓</text><text x="198.7" y="408.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">↓</text><text x="271.5" y="408.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">变化小</text><line x1="18.0" y1="439.0" x2="382.0" y2="439.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="24.0" y="432.0" font-size="12" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">血管容量↑</text><text x="125.9" y="432.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">↓</text><text x="198.7" y="432.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">↓</text><text x="271.5" y="432.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">变化小</text><rect x="18.0" y="447.0" width="364.0" height="89.0" rx="8" fill="#eef2f7"/><rect x="18.0" y="447.0" width="3.5" height="89.0" rx="1.8" fill="#4a5a6b"/><text x="32.0" y="467.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="484.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">记忆锚：搏出量→收缩压、外周阻力→舒张压、弹性→脉</text><text x="32.0" y="503.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">压。老年人脉压大是因为大动脉硬化，不是收缩压单独升</text><text x="32.0" y="522.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">高。</text></svg>