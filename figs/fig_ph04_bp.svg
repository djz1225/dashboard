<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 670.0" width="100%" style="max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px" role="img"><text x="165.0" y="22.6" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">动脉血压：形成条件与影响因素</text><text x="165.0" y="43.0" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">四个形成条件缺一不可，五个因素决定高低</text><text x="15.0" y="73.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">形成条件（必须同时具备）</text><rect x="15.0" y="80.0" width="300.0" height="32.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="27.0" y="100.0" text-anchor="start" font-size="14" font-weight="700" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">·</text><text x="27.0" y="117.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">足够的血液充盈</text><rect x="15.0" y="118.0" width="300.0" height="32.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="27.0" y="138.0" text-anchor="start" font-size="14" font-weight="700" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">·</text><text x="27.0" y="155.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">心脏射血（动力）</text><rect x="15.0" y="156.0" width="300.0" height="32.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="27.0" y="176.0" text-anchor="start" font-size="14" font-weight="700" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">·</text><text x="27.0" y="193.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">外周阻力</text><rect x="15.0" y="194.0" width="300.0" height="32.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="27.0" y="214.0" text-anchor="start" font-size="14" font-weight="700" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">·</text><text x="27.0" y="231.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">大动脉弹性回缩</text><text x="15.0" y="249.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">影响因素</text><rect x="15.0" y="256.0" width="300.0" height="34.5" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="25.0" y="276.5" text-anchor="start" font-size="14" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">搏出量 ↑</text><text x="145.0" y="276.1" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">收缩压↑明显，脉压增大</text><rect x="15.0" y="294.5" width="300.0" height="51.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="25.0" y="315.0" text-anchor="start" font-size="14" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">心率 ↑</text><text x="145.0" y="314.6" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">舒张压↑明显（舒张期缩短</text><text x="145.0" y="331.1" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">），脉压减小</text><rect x="15.0" y="349.5" width="300.0" height="34.5" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="25.0" y="370.0" text-anchor="start" font-size="14" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">外周阻力 ↑</text><text x="145.0" y="369.6" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">舒张压↑明显，脉压减小</text><rect x="15.0" y="388.0" width="300.0" height="51.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="25.0" y="408.5" text-anchor="start" font-size="14" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">大动脉弹性 ↓</text><text x="145.0" y="408.1" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">收缩压↑、舒张压↓，</text><text x="145.0" y="424.6" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">脉压增大</text><rect x="15.0" y="443.0" width="300.0" height="51.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="25.0" y="463.5" text-anchor="start" font-size="14" font-weight="700" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">循环血量/血管容量</text><text x="145.0" y="463.1" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">失血→血压↓；容量↑→血压</text><text x="145.0" y="479.6" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">↑</text><rect x="15.0" y="500.0" width="300.0" height="108.0" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/><text x="25.0" y="516.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">判读口诀：收缩压反映搏出量，舒张压反映外</text><text x="25.0" y="532.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">周阻力</text><text x="25.0" y="548.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">老年人脉压增大：大动脉硬化 → 弹性回缩差 </text><text x="25.0" y="564.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">→ 舒张压反而低</text><text x="25.0" y="580.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">10版改用 ESH/ESC 2013 与 ACC/AHA 2017</text><text x="25.0" y="596.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"> 双表，正常血压 &lt;120/80</text><rect x="11.0" y="611.0" width="308.0" height="51.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="165.0" y="626.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">收缩压看搏出量、舒张压看外周阻力；大动脉硬</text><text x="165.0" y="641.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">化→脉压增大</text></svg>