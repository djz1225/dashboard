<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 526" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="嘌呤与嘧啶：两条相反的建造路线"><title>嘌呤与嘧啶：两条相反的建造路线</title><desc>嘌呤合成以 PRPP 为起点，边搭边挂地把天冬氨酸（N1）、一碳单位（C2、C8）、谷氨酰胺（N3、N9）、甘氨酸（C4、C5、N7）与 CO₂（C6）装成嘌呤环；嘧啶则先合成乳清酸环再接 PRPP 生成 UMP。嘌呤限速酶为 PRPP 酰胺转移酶，嘧啶限速酶为胞质的 CPS-Ⅱ。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">嘌呤与嘧啶：两条相反的建造路线</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">嘌呤在 PRPP 上「边搭边挂」，嘧啶先成环再接糖</text><rect x="18.0" y="65.0" width="364.0" height="198.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="84.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">两条路线与原子来源</text><rect x="30.0" y="95.0" width="164.0" height="56.0" rx="6" fill="#e2f5f2" stroke="#0f766e" stroke-width="1"/><text x="38.0" y="112.0" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">嘌呤：先有糖</text><text x="38.0" y="128.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">以 PRPP 为起点</text><text x="38.0" y="143.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">逐个把原子装上去</text><rect x="200.0" y="95.0" width="164.0" height="56.0" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1"/><text x="208.0" y="112.0" font-size="12" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">嘧啶：先有环</text><text x="208.0" y="128.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">先合成乳清酸</text><text x="208.0" y="143.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">再接 PRPP → UMP</text><text x="30.0" y="165.0" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">嘌呤环的原子从哪来</text><rect x="30.0" y="175.0" width="164.0" height="23.0" rx="4" fill="#e8f2fb"/><text x="38.0" y="191.0" font-size="12" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">N1</text><text x="186.0" y="191.0" text-anchor="end" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">天冬氨酸</text><rect x="200.0" y="175.0" width="164.0" height="23.0" rx="4" fill="#e2f5f2"/><text x="208.0" y="191.0" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">C2、C8</text><text x="356.0" y="191.0" text-anchor="end" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一碳单位</text><rect x="30.0" y="201.0" width="164.0" height="23.0" rx="4" fill="#eef2f7"/><text x="38.0" y="217.0" font-size="12" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">N3、N9</text><text x="186.0" y="217.0" text-anchor="end" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">谷氨酰胺</text><rect x="200.0" y="201.0" width="164.0" height="23.0" rx="4" fill="#e6f6ec"/><text x="208.0" y="217.0" font-size="12" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">C4、C5、N7</text><text x="356.0" y="217.0" text-anchor="end" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">甘氨酸</text><rect x="30.0" y="227.0" width="164.0" height="23.0" rx="4" fill="#fef3c7"/><text x="38.0" y="243.0" font-size="12" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">C6</text><text x="186.0" y="243.0" text-anchor="end" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">CO₂</text><rect x="18.0" y="275.0" width="364.0" height="149.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="294.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">两条路线的限速酶</text><rect x="30.0" y="305.0" width="3.0" height="15.0" rx="1.5" fill="#0f766e"/><text x="39.0" y="318.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">嘌呤限速酶</text><text x="370.0" y="318.0" text-anchor="end" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">1 个</text><text x="39.0" y="336.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">PRPP 酰胺转移酶；受 AMP、GMP、IMP 反馈抑制</text><rect x="30.0" y="345.0" width="3.0" height="15.0" rx="1.5" fill="#b45309"/><text x="39.0" y="358.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">嘧啶限速酶</text><text x="370.0" y="358.0" text-anchor="end" font-size="12" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">1 个</text><text x="39.0" y="376.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">CPS-Ⅱ（胞质）；受 UTP、CTP 反馈抑制</text><rect x="30.0" y="385.0" width="3.0" height="15.0" rx="1.5" fill="#4a5a6b"/><text x="39.0" y="398.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">共同点</text><text x="370.0" y="398.0" text-anchor="end" font-size="12" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">都在胞质</text><text x="39.0" y="416.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">嘌呤与嘧啶的合成都发生在胞质</text><rect x="18.0" y="436.0" width="364.0" height="70.0" rx="8" fill="#fef3c7"/><rect x="18.0" y="436.0" width="3.5" height="70.0" rx="1.8" fill="#b45309"/><text x="32.0" y="456.0" font-size="11.5" font-weight="700" fill="#b45309" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">易错</text><text x="32.0" y="473.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">CPS-Ⅰ 管尿素（线粒体），CPS-Ⅱ 管嘧啶（胞质）—</text><text x="32.0" y="492.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">—名字像，位置与产物全不同。</text></svg>