<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 572.5" width="100%" style="max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px" role="img"><text x="165.0" y="22.6" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">嘌呤与嘧啶：两条相反的建造路线</text><text x="165.0" y="42.6" text-anchor="middle" font-size="13.5" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">嘌呤在 PRPP 上「边搭边挂」；嘧啶先成环再挂糖</text><rect x="15.0" y="57.5" width="146.5" height="75.0" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.3"/><text x="24.0" y="75.5" text-anchor="start" font-size="12.2" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">嘌呤合成</text><text x="24.0" y="92.5" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">以 PRPP（磷酸核糖）为</text><text x="24.0" y="107.5" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">起点，逐个把原子装上去，</text><text x="24.0" y="122.5" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">先在核糖上「长环」</text><rect x="168.5" y="57.5" width="146.5" height="75.0" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.3"/><text x="177.5" y="75.5" text-anchor="start" font-size="12.2" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">嘧啶合成</text><text x="177.5" y="92.5" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">先合成乳清酸（游离环），</text><text x="177.5" y="107.5" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">再接 PRPP 变成 UMP</text><rect x="15.0" y="141.5" width="300.0" height="24.0" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/><text x="21.0" y="157.5" text-anchor="start" font-size="11.2" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">嘌呤环元素来源</text><text x="165.1" y="157.5" text-anchor="start" font-size="11.2" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">提供者</text><rect x="15.0" y="165.5" width="300.0" height="22.0" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.9"/><text x="21.0" y="180.5" text-anchor="start" font-size="11.2" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">N1</text><text x="165.1" y="180.5" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">天冬氨酸</text><rect x="15.0" y="187.5" width="300.0" height="22.0" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.9"/><text x="21.0" y="202.5" text-anchor="start" font-size="11.2" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">C2、C8</text><text x="165.1" y="202.5" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">一碳单位（FH₄）</text><rect x="15.0" y="209.5" width="300.0" height="22.0" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.9"/><text x="21.0" y="224.5" text-anchor="start" font-size="11.2" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">N3、N9</text><text x="165.1" y="224.5" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">谷氨酰胺</text><rect x="15.0" y="231.5" width="300.0" height="22.0" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.9"/><text x="21.0" y="246.5" text-anchor="start" font-size="11.2" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">C4、C5、N7</text><text x="165.1" y="246.5" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">甘氨酸</text><rect x="15.0" y="253.5" width="300.0" height="22.0" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.9"/><text x="21.0" y="268.5" text-anchor="start" font-size="11.2" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">C6</text><text x="165.1" y="268.5" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">CO₂</text><rect x="15.0" y="280.5" width="300.0" height="46.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><rect x="15.0" y="280.5" width="4.5" height="46.0" rx="2.2" fill="#b91c1c"/><text x="29.0" y="299.5" text-anchor="start" font-size="14" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">限速酶（嘌呤）</text><text x="304.0" y="299.5" text-anchor="end" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">1 个</text><text x="29.0" y="316.5" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">PRPP 酰胺转移酶；受 AMP/IMP/GMP 反馈抑制</text><rect x="15.0" y="330.5" width="300.0" height="46.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><rect x="15.0" y="330.5" width="4.5" height="46.0" rx="2.2" fill="#b91c1c"/><text x="29.0" y="349.5" text-anchor="start" font-size="14" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">限速酶（嘧啶）</text><text x="304.0" y="349.5" text-anchor="end" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">1 个</text><text x="29.0" y="366.5" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">CPS-Ⅱ（胞质）；受 UTP/CTP 反馈</text><rect x="15.0" y="380.5" width="300.0" height="46.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><rect x="15.0" y="380.5" width="4.5" height="46.0" rx="2.2" fill="#0f766e"/><text x="29.0" y="399.5" text-anchor="start" font-size="14" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">部位</text><text x="304.0" y="399.5" text-anchor="end" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">胞质</text><text x="29.0" y="416.5" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">两者都在胞质（嘌呤也在肝胞质）</text><rect x="15.0" y="432.5" width="300.0" height="76.0" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/><text x="25.0" y="448.5" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">易错：CPS-Ⅰ 管尿素（线粒体），CPS-Ⅱ 管嘧</text><text x="25.0" y="464.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">啶（胞质）——名字像，位置与产物全不同</text><text x="25.0" y="480.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">嘌呤环的 C2、C8 来自一碳单位，这是与叶酸</text><text x="25.0" y="496.5" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">代谢的关键连接点</text><rect x="11.0" y="513.5" width="308.0" height=