<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 722" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="排尿反射：一个正反馈式的脊髓反射"><title>排尿反射：一个正反馈式的脊髓反射</title><desc>膀胱充盈牵张感受器→盆神经传入骶髓初级中枢→盆神经使逼尿肌收缩、内括约肌舒张；尿液入后尿道进一步兴奋感受器形成正反馈直至排空；脑桥易化、皮质抑制。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">排尿反射：一个正反馈式的脊髓反射</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">骶髓是初级中枢，脑桥与大脑皮质可易化也可抑制</text><rect x="18.0" y="65.0" width="364.0" height="327.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="83.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">反射弧五环节</text><rect x="30.0" y="93.0" width="316.0" height="60.0" rx="8" fill="#eef2f7" stroke="#4a5a6b" stroke-width="1.1"/><rect x="30.0" y="93.0" width="3.2" height="60.0" rx="1.6" fill="#4a5a6b"/><circle cx="48" cy="110" r="8.5" fill="#4a5a6b"/><text x="48.0" y="114.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">1</text><text x="63.0" y="114.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">膀胱充盈</text><text x="335.0" y="114.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">启动</text><text x="63.0" y="131.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">尿量达 300~400 ml 出现充盈感，400~500 ml</text><text x="63.0" y="147.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">出现胀痛</text><line x1="48.0" y1="155.0" x2="48.0" y2="168.0" stroke="#4a5a6b" stroke-width="1.8" stroke-linecap="round"/><line x1="48.0" y1="168.0" x2="44.6" y2="161.9" stroke="#4a5a6b" stroke-width="1.8" stroke-linecap="round"/><line x1="48.0" y1="168.0" x2="51.4" y2="161.9" stroke="#4a5a6b" stroke-width="1.8" stroke-linecap="round"/><rect x="30.0" y="170.0" width="316.0" height="60.0" rx="8" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1.1"/><rect x="30.0" y="170.0" width="3.2" height="60.0" rx="1.6" fill="#1f6fb2"/><circle cx="48" cy="187" r="8.5" fill="#1f6fb2"/><text x="48.0" y="191.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">2</text><text x="63.0" y="191.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">牵张感受器兴奋</text><text x="335.0" y="191.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">传入</text><text x="63.0" y="208.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">膀胱壁牵张 → 盆神经传入 → 骶髓（S₂~S₄）</text><text x="63.0" y="224.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">初级中枢</text><line x1="48.0" y1="232.0" x2="48.0" y2="245.0" stroke="#4a5a6b" stroke-width="1.8" stroke-linecap="round"/><line x1="48.0" y1="245.0" x2="44.6" y2="238.9" stroke="#4a5a6b" stroke-width="1.8" stroke-linecap="round"/><line x1="48.0" y1="245.0" x2="51.4" y2="238.9" stroke="#4a5a6b" stroke-width="1.8" stroke-linecap="round"/><rect x="30.0" y="247.0" width="316.0" height="60.0" rx="8" fill="#fdeceb" stroke="#c0392b" stroke-width="1.1"/><rect x="30.0" y="247.0" width="3.2" height="60.0" rx="1.6" fill="#c0392b"/><circle cx="48" cy="264" r="8.5" fill="#c0392b"/><text x="48.0" y="268.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">3</text><text x="63.0" y="268.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">逼尿肌收缩、括约肌舒张</text><text x="335.0" y="268.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">传出</text><text x="63.0" y="285.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">盆神经（副交感）→ 逼尿肌收缩；交感受抑 →</text><text x="63.0" y="301.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">内括约肌舒张</text><line x1="48.0" y1="309.0" x2="48.0" y2="322.0" stroke="#4a5a6b" stroke-width="1.8" stroke-linecap="round"/><line x1="48.0" y1="322.0" x2="44.6" y2="315.9" stroke="#4a5a6b" stroke-width="1.8" stroke-linecap="round"/><line x1="48.0" y1="322.0" x2="51.4" y2="315.9" stroke="#4a5a6b" stroke-width="1.8" stroke-linecap="round"/><rect x="30.0" y="324.0" width="316.0" height="60.0" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.1"/><rect x="30.0" y="324.0" width="3.2" height="60.0" rx="1.6" fill="#b45309"/><circle cx="48" cy="341" r="8.5" fill="#b45309"/><text x="48.0" y="345.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">4</text><text x="63.0" y="345.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">尿液入后尿道 → 正反馈</text><text x="335.0" y="345.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">正反馈</text><text x="63.0" y="362.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">尿液刺激尿道感受器 → 反射进一步加强，直至</text><text x="63.0" y="378.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">膀胱排空</text><rect x="18.0" y="404.0" width="364.0" height="216.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="422.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">高位中枢与临床</text><rect x="31.0" y="432.0" width="3.0" height="15.0" rx="1.5" fill="#0f766e"/><text x="40.0" y="445.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">脑桥排尿中枢</text><text x="344.0" y="445.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">易化</text><text x="40.0" y="463.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">接受骶髓传入并协调逼尿肌与括约肌；脑桥以上病变→</text><text x="40.0" y="479.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">逼尿肌-括约肌协同失调</text><rect x="31.0" y="487.0" width="3.0" height="15.0" rx="1.5" fill="#7b4bb7"/><text x="40.0" y="500.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">大脑皮质</text><text x="344.0" y="500.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">抑制</text><text x="40.0" y="518.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">成人可有意识地延迟排尿；婴幼儿皮质未成熟 → </text><text x="40.0" y="534.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">不能控制</text><rect x="31.0" y="542.0" width="3.0" height="15.0" rx="1.5" fill="#b45309"/><text x="40.0" y="555.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">脊休克期</text><text x="344.0" y="555.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">尿潴留</text><text x="40.0" y="573.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">脊髓突然断离后反射消失 → 尿潴留、充盈性尿失禁</text><rect x="31.0" y="581.0" width="3.0" height="15.0" rx="1.5" fill="#4a5a6b"/><text x="40.0" y="594.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">骶髓损伤</text><text x="344.0" y="594.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">真性失禁</text><text x="40.0" y="612.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">初级中枢毁坏 → 反射弧断裂，尿液持续滴出</text><rect x="18.0" y="632.0" width="364.0" height="70.0" rx="8" fill="#eef2f7"/><rect x="18.0" y="632.0" width="3.5" height="70.0" rx="1.8" fill="#4a5a6b"/><text x="32.0" y="652.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="669.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">排尿是「正反馈直到排空」的反射；脊休克期是尿潴留，</text><text x="32.0" y="688.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">骶髓毁坏才是真性尿失禁。</text></svg>