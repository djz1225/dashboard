<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 655" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="DNA 复制的三条规律"><title>DNA 复制的三条规律</title><desc>DNA 复制有三条规律：半保留 —— 每个子代分子由一条旧链与一条新链组成，由 Meselson-Stahl ¹⁵N 密度梯度实验证明；双向 —— 从复制起点向两侧同时延伸形成两个复制叉；半不连续 —— 因 DNA 聚合酶只能把新链 5′→3′ 延伸，两条模板方向相反，故前导链连续合成、随从链退回分段合成冈崎片段。两条新链的合成方向都是 5′→3′。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">DNA 复制的三条规律</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">半保留 · 双向 · 半不连续；冈崎片段是聚合酶只能 5′→3′</text><text x="18.0" y="68.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">的必然结果</text><rect x="18.0" y="82.0" width="364.0" height="134.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="101.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">① 半保留</text><text x="30.0" y="122.0" font-size="11.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">亲代 DNA（两条旧链）</text><line x1="30.0" y1="132.0" x2="92.0" y2="132.0" stroke="#4a5a6b" stroke-width="2.6" stroke-linecap="round"/><line x1="30.0" y1="144.0" x2="92.0" y2="144.0" stroke="#4a5a6b" stroke-width="2.6" stroke-linecap="round"/><line x1="104.0" y1="138.0" x2="132.0" y2="138.0" stroke="#8095a8" stroke-width="1.3" stroke-linecap="round"/><line x1="132.0" y1="138.0" x2="127.6" y2="140.4" stroke="#8095a8" stroke-width="1.3" stroke-linecap="round"/><line x1="132.0" y1="138.0" x2="127.6" y2="135.6" stroke="#8095a8" stroke-width="1.3" stroke-linecap="round"/><line x1="142.0" y1="124.0" x2="216.0" y2="124.0" stroke="#4a5a6b" stroke-width="2.6" stroke-linecap="round"/><line x1="142.0" y1="134.0" x2="216.0" y2="134.0" stroke="#0f766e" stroke-width="2.6" stroke-linecap="round"/><text x="222.0" y="127.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">子代 1</text><line x1="142.0" y1="148.0" x2="216.0" y2="148.0" stroke="#0f766e" stroke-width="2.6" stroke-linecap="round"/><line x1="142.0" y1="158.0" x2="216.0" y2="158.0" stroke="#4a5a6b" stroke-width="2.6" stroke-linecap="round"/><text x="222.0" y="161.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">子代 2</text><text x="30.0" y="174.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">灰＝旧链，绿＝新链：每个子代分子都保留一条旧链 ——</text><text x="30.0" y="191.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Meselson-Stahl ¹⁵N 密度梯度实验所证明。</text><rect x="18.0" y="228.0" width="364.0" height="148.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="247.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">② 半不连续</text><text x="30.0" y="272.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">模板</text><line x1="84.0" y1="272.0" x2="362.0" y2="272.0" stroke="#4a5a6b" stroke-width="2.2" stroke-linecap="round"/><text x="86.0" y="268.0" font-size="11.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">3′</text><text x="362.0" y="268.0" text-anchor="end" font-size="11.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">5′</text><text x="30.0" y="294.0" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">前导链</text><line x1="84.0" y1="294.0" x2="362.0" y2="294.0" stroke="#0f766e" stroke-width="2.2" stroke-linecap="round"/><line x1="362.0" y1="294.0" x2="355.9" y2="297.4" stroke="#0f766e" stroke-width="2.2" stroke-linecap="round"/><line x1="362.0" y1="294.0" x2="355.9" y2="290.6" stroke="#0f766e" stroke-width="2.2" stroke-linecap="round"/><text x="86.0" y="290.0" font-size="11.5" font-weight="400" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">5′</text><text x="30.0" y="316.0" font-size="11.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">随从链</text><line x1="143.0" y1="316.0" x2="84.0" y2="316.0" stroke="#7b4bb7" stroke-width="2.2" stroke-linecap="round"/><line x1="84.0" y1="316.0" x2="89.3" y2="313.1" stroke="#7b4bb7" stroke-width="2.2" stroke-linecap="round"/><line x1="84.0" y1="316.0" x2="89.3" y2="318.9" stroke="#7b4bb7" stroke-width="2.2" stroke-linecap="round"/><line x1="216.0" y1="316.0" x2="157.0" y2="316.0" stroke="#7b4bb7" stroke-width="2.2" stroke-linecap="round"/><line x1="157.0" y1="316.0" x2="162.3" y2="313.1" stroke="#7b4bb7" stroke-width="2.2" stroke-linecap="round"/><line x1="157.0" y1="316.0" x2="162.3" y2="318.9" stroke="#7b4bb7" stroke-width="2.2" stroke-linecap="round"/><line x1="289.0" y1="316.0" x2="230.0" y2="316.0" stroke="#7b4bb7" stroke-width="2.2" stroke-linecap="round"/><line x1="230.0" y1="316.0" x2="235.3" y2="313.1" stroke="#7b4bb7" stroke-width="2.2" stroke-linecap="round"/><line x1="230.0" y1="316.0" x2="235.3" y2="318.9" stroke="#7b4bb7" stroke-width="2.2" stroke-linecap="round"/><line x1="362.0" y1="316.0" x2="303.0" y2="316.0" stroke="#7b4bb7" stroke-width="2.2" stroke-linecap="round"/><line x1="303.0" y1="316.0" x2="308.3" y2="313.1" stroke="#7b4bb7" stroke-width="2.2" stroke-linecap="round"/><line x1="303.0" y1="316.0" x2="308.3" y2="318.9" stroke="#7b4bb7" stroke-width="2.2" stroke-linecap="round"/><text x="30.0" y="334.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">同一条模板上方向相反：前导链顺着复制叉连续延伸，随从链</text><text x="30.0" y="351.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">只能等模板暴露出一个片段再「往回」合成冈崎片段。</text><rect x="18.0" y="388.0" width="364.0" height="26.0" rx="6" fill="#f8fbfd"/><text x="26.0" y="405.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">规律</text><text x="106.1" y="405.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">含义</text><text x="266.2" y="405.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">证据 / 后果</text><line x1="18.0" y1="456.0" x2="382.0" y2="456.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="432.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">半保留</text><text x="106.1" y="432.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">每个子代含一条旧链 +</text><text x="106.1" y="448.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"> 一条新链</text><text x="266.2" y="432.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">¹⁵N 密度梯</text><text x="266.2" y="448.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">度实验</text><line x1="18.0" y1="498.0" x2="382.0" y2="498.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="474.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">双向</text><text x="106.1" y="474.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">从起点向两侧同时延伸</text><text x="266.2" y="474.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">两个复制叉，</text><text x="266.2" y="490.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">速度加倍</text><line x1="18.0" y1="540.0" x2="382.0" y2="540.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="516.0" font-size="12.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">半不连续</text><text x="106.1" y="516.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">前导链连续、随从链成片段</text><text x="266.2" y="516.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">聚合酶只能 5′</text><text x="266.2" y="532.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">→3′ 合成</text><rect x="18.0" y="546.0" width="364.0" height="89.0" rx="8" fill="#fef3c7"/><rect x="18.0" y="546.0" width="3.5" height="89.0" rx="1.8" fill="#b45309"/><text x="32.0" y="566.0" font-size="11.5" font-weight="700" fill="#b45309" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">易错</text><text x="32.0" y="583.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">两条新链的合成方向都是 5′→3′，只是相对复制叉的</text><text x="32.0" y="602.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">方向相反；「半不连续」指随从链不连续，不是两条链都</text><text x="32.0" y="621.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">不连续。</text></svg>