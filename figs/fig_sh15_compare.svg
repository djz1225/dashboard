<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 540" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="复制 vs 转录：三处关键差异"><title>复制 vs 转录：三处关键差异</title><desc>复制与转录的三处关键差异：① 引物 —— 复制必须由引物酶提供 RNA 引物与 3′-OH，RNA 聚合酶可从头起始；② 模板使用 —— 复制两条链都当模板，转录只用一条模板链（另一条为编码链，序列与 mRNA 相同，T 换成 U）；③ 保真度 —— 复制错误率 10⁻⁹ 级，转录约 10⁻⁵ 级且 RNA 聚合酶无校正活性，因 RNA 是消耗品、错误可重来，生物对转录选择了速度。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">复制 vs 转录：三处关键差异</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">引物 · 链选择 · 保真度；转录让精度让位于速度</text><rect x="18.0" y="65.0" width="364.0" height="26.0" rx="6" fill="#f8fbfd"/><text x="26.0" y="82.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">对比项</text><text x="106.1" y="82.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">复制</text><text x="251.7" y="82.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">转录</text><line x1="18.0" y1="133.0" x2="382.0" y2="133.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="109.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">引物</text><text x="106.1" y="109.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">需要 RNA 引物提供</text><text x="106.1" y="125.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">3′-OH</text><text x="251.7" y="109.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">不需要，RNA 聚合酶</text><text x="251.7" y="125.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">可从头起始</text><line x1="18.0" y1="159.0" x2="382.0" y2="159.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="151.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">模板使用</text><text x="106.1" y="151.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">两条链都复制</text><text x="251.7" y="151.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">只转录一条（模板链）</text><line x1="18.0" y1="185.0" x2="382.0" y2="185.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="177.0" font-size="12.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">产物</text><text x="106.1" y="177.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">1 个 DNA → 2 个 DNA</text><text x="251.7" y="177.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">1 段 DNA → 多个RNA</text><line x1="18.0" y1="227.0" x2="382.0" y2="227.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="203.0" font-size="12.5" font-weight="700" fill="#c1440e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">酶</text><text x="106.1" y="203.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">DNA 聚合酶（有校正）</text><text x="251.7" y="203.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">RNA 聚合酶（无</text><text x="251.7" y="219.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">校正活性）</text><line x1="18.0" y1="253.0" x2="382.0" y2="253.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="245.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">保真度</text><text x="106.1" y="245.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">10⁻⁹ 级</text><text x="251.7" y="245.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">约 10⁻⁵，够用即可</text><rect x="18.0" y="259.0" width="364.0" height="179.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="278.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">为什么转录不需要高保真</text><rect x="30.0" y="289.0" width="3.0" height="15.0" rx="1.5" fill="#7b4bb7"/><text x="39.0" y="302.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">RNA 是消耗品</text><text x="362.0" y="302.0" text-anchor="end" font-size="12" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">错误可重来</text><text x="39.0" y="320.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一个 mRNA 分子错了只影响少量蛋白，可再</text><text x="39.0" y="336.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">转录纠正</text><rect x="30.0" y="344.0" width="3.0" height="15.0" rx="1.5" fill="#b45309"/><text x="39.0" y="357.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">速度是刚需</text><text x="362.0" y="357.0" text-anchor="end" font-size="12" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">转录要快</text><text x="39.0" y="375.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">若像复制那样严格校对，速度跟不上代谢需求</text><rect x="30.0" y="383.0" width="3.0" height="15.0" rx="1.5" fill="#0f766e"/><text x="39.0" y="396.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">所以选了速度</text><text x="362.0" y="396.0" text-anchor="end" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">取速度</text><text x="39.0" y="414.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">生物在「速度」与「精度」之间对转录选择</text><text x="39.0" y="430.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">了速度</text><rect x="18.0" y="450.0" width="364.0" height="70.0" rx="8" fill="#fef3c7"/><rect x="18.0" y="450.0" width="3.5" height="70.0" rx="1.8" fill="#b45309"/><text x="32.0" y="470.0" font-size="11.5" font-weight="700" fill="#b45309" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">易错</text><text x="32.0" y="487.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">模板链与编码链因基因而异：同一段 DNA 上不同基因的</text><text x="32.0" y="506.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">模板链可以相反，编码链序列与 mRNA 相同（T 换成 U）。</text></svg>