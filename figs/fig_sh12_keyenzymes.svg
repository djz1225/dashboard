<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 549" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="关键酶的激素开关"><title>关键酶的激素开关</title><desc>胰岛素代表「合成/储存」模式，激活 PFK-1、糖原合酶、乙酰CoA 羧化酶、HMG-CoA 还原酶并抑制糖异生关键酶、糖原磷酸化酶与 HSL；胰高血糖素方向完全相反。糖原合酶磷酸化后失活、糖原磷酸化酶磷酸化后激活，是常被记反的一对。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">关键酶的激素开关</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胰岛素激活所有合成酶、抑制所有分解酶；胰高血糖素恰好相反</text><rect x="18.0" y="65.0" width="364.0" height="26.0" rx="6" fill="#f8fbfd"/><text x="26.0" y="82.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">关键酶</text><text x="200.7" y="82.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胰岛素</text><text x="295.4" y="82.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胰高血糖素</text><line x1="18.0" y1="117.0" x2="382.0" y2="117.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="109.0" font-size="12.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">PFK-1（糖酵解）</text><text x="200.7" y="109.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">激活</text><text x="295.4" y="109.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">抑制</text><line x1="18.0" y1="143.0" x2="382.0" y2="143.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="135.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">果糖二磷酸酶-1</text><text x="200.7" y="135.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">抑制</text><text x="295.4" y="135.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">激活</text><line x1="18.0" y1="169.0" x2="382.0" y2="169.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="161.0" font-size="12.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">糖原合酶（合成）</text><text x="200.7" y="161.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">激活</text><text x="295.4" y="161.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">抑制</text><line x1="18.0" y1="195.0" x2="382.0" y2="195.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="187.0" font-size="12.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">糖原磷酸化酶（分解）</text><text x="200.7" y="187.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">抑制</text><text x="295.4" y="187.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">激活</text><line x1="18.0" y1="221.0" x2="382.0" y2="221.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="213.0" font-size="12.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">乙酰CoA 羧化酶</text><text x="200.7" y="213.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">激活</text><text x="295.4" y="213.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">抑制</text><line x1="18.0" y1="247.0" x2="382.0" y2="247.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="239.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">HMG-CoA 还原酶</text><text x="200.7" y="239.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">激活</text><text x="295.4" y="239.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">抑制</text><line x1="18.0" y1="273.0" x2="382.0" y2="273.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="265.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">HSL（脂解）</text><text x="200.7" y="265.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">抑制</text><text x="295.4" y="265.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">激活</text><text x="18.0" y="283.0" font-size="12" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">果糖二磷酸酶-1 属糖异生，乙酰CoA 羧化酶属脂合成，HMG-CoA 还</text><text x="18.0" y="300.0" font-size="12" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">原酶属胆固醇合成——三者都是分解/合成方向的关键闸门。</text><rect x="18.0" y="331.0" width="177.0" height="116.0" rx="9" fill="#e2f5f2" stroke="#0f766e" stroke-width="1.1"/><text x="29.0" y="352.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一条规律</text><text x="29.0" y="371.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">先问：这条酶属于合成</text><text x="29.0" y="387.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">还是分解</text><text x="29.0" y="407.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">合成酶：胰岛素激活；分解</text><text x="29.0" y="423.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">酶：胰高血糖素激活</text><rect x="205.0" y="331.0" width="177.0" height="116.0" rx="9" fill="#fdeceb" stroke="#c0392b" stroke-width="1.1"/><text x="216.0" y="352.0" font-size="12.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">最易记反的一对</text><text x="216.0" y="371.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">糖原合酶磷酸化后失活</text><text x="216.0" y="391.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">糖原磷酸化酶磷酸化后激活</text><rect x="18.0" y="459.0" width="364.0" height="70.0" rx="8" fill="#e2f5f2"/><rect x="18.0" y="459.0" width="3.5" height="70.0" rx="1.8" fill="#0f766e"/><text x="32.0" y="479.0" font-size="11.5" font-weight="700" fill="#0f766e" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">口诀</text><text x="32.0" y="496.0" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">不用逐条背：记住「合成酶怕磷酸」，磷酸化 = 分解模</text><text x="32.0" y="515.0" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">式开启。</text></svg>