<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 572" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="血糖的六来源五去路"><title>血糖的六来源五去路</title><desc>血糖有六个来源（食物、肝糖原、糖异生、肌糖原自用、其他单糖、乳酸甘油氨基酸）与五条去路（氧化供能、合成糖原、变脂肪、变非必需氨基酸、随尿排出）；胰岛素唯一降糖，胰高血糖素等五个激素升糖。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">血糖的六来源五去路</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胰岛素是唯一降糖激素；升糖激素有五个，肾糖阈约 8.9~10</text><text x="18.0" y="68.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">mmol/L</text><rect x="18.0" y="82.0" width="177.0" height="180.0" rx="9" fill="#fdeceb" stroke="#c0392b" stroke-width="1.1"/><text x="29.0" y="103.0" font-size="12.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">来源 6</text><text x="29.0" y="122.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">① 食物糖消化吸收</text><text x="29.0" y="142.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">② 肝糖原分解</text><text x="29.0" y="162.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">③ 糖异生（肝、肾）</text><text x="29.0" y="182.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">④ 肌糖原（仅自用，不</text><text x="29.0" y="198.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">补血糖）</text><text x="29.0" y="218.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">⑤ 其他单糖转化</text><text x="29.0" y="238.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">⑥ 乳酸、甘油、生糖氨基酸</text><rect x="205.0" y="82.0" width="177.0" height="180.0" rx="9" fill="#e6f6ec" stroke="#2f8f57" stroke-width="1.1"/><text x="216.0" y="103.0" font-size="12.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">去路 5</text><text x="216.0" y="122.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">① 各组织氧化供能（最主要）</text><text x="216.0" y="142.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">② 合成肝糖原、肌糖原</text><text x="216.0" y="162.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">③ 转变为脂肪</text><text x="216.0" y="182.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">④ 转变为非必需氨基酸</text><text x="216.0" y="202.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">⑤ 随尿排出（超过肾糖阈）</text><rect x="18.0" y="272.0" width="364.0" height="26.0" rx="6" fill="#f8fbfd"/><text x="26.0" y="289.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">激素</text><text x="135.2" y="289.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">血糖</text><text x="208.0" y="289.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">主要机制</text><line x1="18.0" y1="340.0" x2="382.0" y2="340.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="316.0" font-size="12.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胰岛素</text><text x="135.2" y="316.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">↓（唯一）</text><text x="208.0" y="316.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">促葡萄糖摄取、促糖原与脂肪</text><text x="208.0" y="332.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">合成、抑制糖异生</text><line x1="18.0" y1="366.0" x2="382.0" y2="366.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="358.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胰高血糖素</text><text x="135.2" y="358.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">↑</text><text x="208.0" y="358.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">促肝糖原分解与糖异生</text><line x1="18.0" y1="392.0" x2="382.0" y2="392.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="384.0" font-size="12.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肾上腺素</text><text x="135.2" y="384.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">↑</text><text x="208.0" y="384.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">应急时促糖原分解，升糖最快</text><line x1="18.0" y1="434.0" x2="382.0" y2="434.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="410.0" font-size="12.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">糖皮质激素</text><text x="135.2" y="410.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">↑</text><text x="208.0" y="410.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">促糖异生、抑制外周组织</text><text x="208.0" y="426.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">利用葡萄糖</text><line x1="18.0" y1="476.0" x2="382.0" y2="476.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="452.0" font-size="12.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">生长激素/</text><text x="26.0" y="468.0" font-size="12.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">甲状腺激素</text><text x="135.2" y="452.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">↑</text><text x="208.0" y="452.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">拮抗胰岛素、促进分解代谢</text><rect x="18.0" y="482.0" width="364.0" height="70.0" rx="8" fill="#e2f5f2"/><rect x="18.0" y="482.0" width="3.5" height="70.0" rx="1.8" fill="#0f766e"/><text x="32.0" y="502.0" font-size="11.5" font-weight="700" fill="#0f766e" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="519.0" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胰岛素是唯一降血糖的激素，但升糖激素不止胰高血糖素；</text><text x="32.0" y="538.0" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">尿糖出现说明血糖已超过肾糖阈。</text></svg>