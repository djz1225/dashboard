<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 636" width="100%" style="max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px" role="img"><text x="165.0" y="22.6" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">血糖：六来源 五去路</text><text x="165.0" y="43.0" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">胰岛素只降不升，升糖激素有五个</text><rect x="15.0" y="58.0" width="146.5" height="60.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.3"/><text x="24.0" y="76.0" text-anchor="start" font-size="12.2" font-weight="700" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">来源 ①</text><text x="24.0" y="93.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">食物糖消化吸收</text><rect x="168.5" y="58.0" width="146.5" height="60.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.3"/><text x="177.5" y="76.0" text-anchor="start" font-size="12.2" font-weight="700" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">来源 ②</text><text x="177.5" y="93.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">肝糖原分解</text><rect x="15.0" y="125.0" width="146.5" height="75.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.3"/><text x="24.0" y="143.0" text-anchor="start" font-size="12.2" font-weight="700" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">来源 ③</text><text x="24.0" y="160.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">糖异生（肝、肾）</text><rect x="168.5" y="125.0" width="146.5" height="75.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.3"/><text x="177.5" y="143.0" text-anchor="start" font-size="12.2" font-weight="700" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">来源 ④⑤⑥</text><text x="177.5" y="160.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">肌糖原（仅自用）/ 其他</text><text x="177.5" y="175.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">单糖转化 / 乳酸甘油氨</text><text x="177.5" y="190.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">基酸</text><rect x="15.0" y="209.0" width="146.5" height="60.0" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.3"/><text x="24.0" y="227.0" text-anchor="start" font-size="12.2" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">去路 ①</text><text x="24.0" y="244.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">各组织氧化供能（</text><text x="24.0" y="259.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">最主要）</text><rect x="168.5" y="209.0" width="146.5" height="60.0" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.3"/><text x="177.5" y="227.0" text-anchor="start" font-size="12.2" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">去路 ②</text><text x="177.5" y="244.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">合成肝糖原、肌糖原</text><rect x="15.0" y="276.0" width="146.5" height="60.0" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.3"/><text x="24.0" y="294.0" text-anchor="start" font-size="12.2" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">去路 ③④</text><text x="24.0" y="311.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">转变为脂肪/非必需氨基</text><text x="24.0" y="326.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">酸</text><rect x="168.5" y="276.0" width="146.5" height="60.0" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.3"/><text x="177.5" y="294.0" text-anchor="start" font-size="12.2" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">去路 ⑤</text><text x="177.5" y="311.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">随尿排出（超过肾糖阈 8</text><text x="177.5" y="326.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">.9~10 mmol/L）</text><rect x="15.0" y="345.0" width="300.0" height="24.0" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/><text x="21.0" y="361.0" text-anchor="start" font-size="11.2" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">激素</text><text x="133.2" y="361.0" text-anchor="start" font-size="11.2" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">对血糖</text><text x="194.0" y="361.0" text-anchor="start" font-size="11.2" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">主要机制</text><rect x="15.0" y="369.0" width="300.0" height="36.0" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.9"/><text x="21.0" y="384.0" t