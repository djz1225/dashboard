<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 505.0" width="100%" style="max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px" role="img"><text x="165.0" y="20.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">生长发育的规律与激素调控（第10版新增整章</text><text x="165.0" y="38.0" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">）</text><text x="165.0" y="58.0" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">两个生长突增期；两种激素分工</text><rect x="15.0" y="75.0" width="300.0" height="42.0" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/><text x="27.0" y="95.0" text-anchor="start" font-size="14" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">第一突增期</text><text x="305.0" y="95.0" text-anchor="end" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">婴儿期</text><text x="27.0" y="112.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">婴儿期（0~1 岁），身高增长最快</text><rect x="15.0" y="123.0" width="300.0" height="44.0" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="27.0" y="143.0" text-anchor="start" font-size="14" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">第二突增期</text><text x="305.0" y="143.0" text-anchor="end" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">青春期</text><text x="27.0" y="160.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">青春期（女孩约 10~12 岁，男孩约 12~14 </text><text x="27.0" y="176.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">岁）</text><rect x="15.0" y="177.0" width="300.0" height="150.0" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="25.0" y="196.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">两种激素的分工</text><text x="25.0" y="214.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 生长激素 GH：促长骨生长（经 IGF-1 介</text><text x="25.0" y="230.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">导），几乎全程起作用</text><text x="25.0" y="246.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 甲状腺激素：胎儿期与婴幼儿期对脑发育最</text><text x="25.0" y="262.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">关键，缺则呆小症</text><text x="25.0" y="278.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 性激素：青春期促突增并促骨骺闭合（</text><text x="25.0" y="294.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">闭合后不再长高）</text><text x="25.0" y="310.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 胰岛素、皮质醇也参与，但非主导</text><rect x="15.0" y="335.0" width="300.0" height="108.0" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/><text x="25.0" y="351.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">幼年 GH 缺乏 → 侏儒症（身材矮小但智力正</text><text x="25.0" y="367.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">常）</text><text x="25.0" y="383.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">幼年 GH 过多 → 巨人症；成年后过多 → 肢端</text><text x="25.0" y="399.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">肥大症</text><text x="25.0" y="415.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">甲状腺激素缺乏 → 呆小症（智力与身材都受影</text><text x="25.0" y="431.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">响）——两者区别就在智力</text><rect x="11.0" y="446.0" width="308.0" height="51.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="165.0" y="461.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">GH 管长骨（侏儒但智力正常）、甲状腺激素管</text><text x="165.0" y="476.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">脑发育（呆小症智力受损）</text></svg>