<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="生长发育：两个突增期、三种激素分工"><title>生长发育：两个突增期、三种激素分工</title><desc>婴儿期与青春期是两个生长突增期；GH 经 IGF-1 促长骨生长（缺则侏儒症，智力正常）；甲状腺激素对胎儿及婴幼儿脑发育最关键（缺则呆小症）；性激素促青春期突增并促骨骺闭合。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">生长发育：两个突增期、三种激素分工</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">GH 管长骨、甲状腺激素管脑、性激素管突增与骨骺闭合</text><rect x="18.0" y="65.0" width="364.0" height="186.0" rx="9" fill="#ffffff" stroke="#e3eaf2" stroke-width="1.1"/><line x1="48.0" y1="98.8" x2="52.0" y2="98.8" stroke="#8095a8" stroke-width="1" stroke-linecap="round"/><text x="45.0" y="102.8" text-anchor="end" font-size="10.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">25</text><line x1="52.0" y1="98.8" x2="370.0" y2="98.8" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><line x1="48.0" y1="115.0" x2="52.0" y2="115.0" stroke="#8095a8" stroke-width="1" stroke-linecap="round"/><text x="45.0" y="119.0" text-anchor="end" font-size="10.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">20</text><line x1="52.0" y1="115.0" x2="370.0" y2="115.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><line x1="48.0" y1="147.5" x2="52.0" y2="147.5" stroke="#8095a8" stroke-width="1" stroke-linecap="round"/><text x="45.0" y="151.5" text-anchor="end" font-size="10.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">10</text><line x1="52.0" y1="147.5" x2="370.0" y2="147.5" stroke="#e3