<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 544" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="脑的高级功能：学习记忆与睡眠"><title>脑的高级功能：学习记忆与睡眠</title><desc>记忆分感觉记忆、短时记忆、长时记忆与巩固，巩固依赖海马与 LTP；睡眠分慢波睡眠（生长激素↑、促体力恢复）与 REM（做梦、肌张力最低、促记忆巩固）。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">脑的高级功能：学习记忆与睡眠</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">记忆有分工，睡眠有两个时相</text><rect x="18.0" y="65.0" width="364.0" height="263.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="83.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">记忆四步</text><rect x="30.0" y="93.0" width="316.0" height="44.0" rx="8" fill="#eef2f7" stroke="#4a5a6b" stroke-width="1.1"/><rect x="30.0" y="93.0" width="3.2" height="44.0" rx="1.6" fill="#4a5a6b"/><circle cx="48" cy="110" r="8.5" fill="#4a5a6b"/><text x="48.0" y="114.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">1</text><text x="63.0" y="114.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">感觉记忆</text><text x="335.0" y="114.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">&lt; 1 s</text><text x="63.0" y="131.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">极短（&lt;1 秒），信息量大，多为视觉后像</text><line x1="48.0" y1="139.0" x2="48.0" y2="152.0" stroke="#4a5a6b" stroke-width="1.8" stroke-linecap="round"/><line x1="48.0" y1="152.0" x2="44.6" y2="145.9" stroke="#4a5a6b" stroke-width="1.8" stroke-linecap="round"/><line x1="48.0" y1="152.0" x2="51.4" y2="145.9" stroke="#4a5a6b" stroke-width="1.8" stroke-linecap="round"/><rect x="30.0" y="154.0" width="316.0" height="44.0" rx="8" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1.1"/><rect x="30.0" y="154.0" width="3.2" height="44.0" rx="1.6" fill="#1f6fb2"/><circle cx="48" cy="171" r="8.5" fill="#1f6fb2"/><text x="48.0" y="175.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">2</text><text x="63.0" y="175.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">短时记忆</text><text x="335.0" y="175.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">7±2</text><text x="63.0" y="192.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">数十秒~数分钟，容量约 7±2</text><line x1="48.0" y1="200.0" x2="48.0" y2="213.0" stroke="#4a5a6b" stroke-width="1.8" stroke-linecap="round"/><line x1="48.0" y1="213.0" x2="44.6" y2="206.9" stroke="#4a5a6b" stroke-width="1.8" stroke-linecap="round"/><line x1="48.0" y1="213.0" x2="51.4" y2="206.9" stroke="#4a5a6b" stroke-width="1.8" stroke-linecap="round"/><rect x="30.0" y="215.0" width="316.0" height="44.0" rx="8" fill="#e2f5f2" stroke="#0f766e" stroke-width="1.1"/><rect x="30.0" y="215.0" width="3.2" height="44.0" rx="1.6" fill="#0f766e"/><circle cx="48" cy="232" r="8.5" fill="#0f766e"/><text x="48.0" y="236.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">3</text><text x="63.0" y="236.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">长时记忆</text><text x="335.0" y="236.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">巩固</text><text x="63.0" y="253.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">容量近乎无限，需海马参与巩固</text><line x1="48.0" y1="261.0" x2="48.0" y2="274.0" stroke="#4a5a6b" stroke-width="1.8" stroke-linecap="round"/><line x1="48.0" y1="274.0" x2="44.6" y2="267.9" stroke="#4a5a6b" stroke-width="1.8" stroke-linecap="round"/><line x1="48.0" y1="274.0" x2="51.4" y2="267.9" stroke="#4a5a6b" stroke-width="1.8" stroke-linecap="round"/><rect x="30.0" y="276.0" width="316.0" height="44.0" rx="8" fill="#fdeceb" stroke="#c0392b" stroke-width="1.1"/><rect x="30.0" y="276.0" width="3.2" height="44.0" rx="1.6" fill="#c0392b"/><circle cx="48" cy="293" r="8.5" fill="#c0392b"/><text x="48.0" y="297.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">4</text><text x="63.0" y="297.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">突触可塑性</text><text x="335.0" y="297.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">LTP</text><text x="63.0" y="314.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">反复强化形成 LTP——学习记忆的细胞基础</text><rect x="18.0" y="340.0" width="177.0" height="104.0" rx="9" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1.1"/><text x="29.0" y="361.0" font-size="12.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">慢波睡眠 SWS</text><text x="29.0" y="380.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">深睡，脑电以慢波为主</text><text x="29.0" y="400.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">生长激素分泌↑</text><text x="29.0" y="420.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">促体力恢复</text><rect x="205.0" y="340.0" width="177.0" height="104.0" rx="9" fill="#f2ecfb" stroke="#7b4bb7" stroke-width="1.1"/><text x="216.0" y="361.0" font-size="12.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">快动眼睡眠 REM</text><text x="216.0" y="380.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">眼球快速运动、做梦</text><text x="216.0" y="400.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肌张力最低（生理性瘫痪）</text><text x="216.0" y="420.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">促记忆巩固</text><rect x="18.0" y="454.0" width="364.0" height="70.0" rx="8" fill="#eef2f7"/><rect x="18.0" y="454.0" width="3.5" height="70.0" rx="1.8" fill="#4a5a6b"/><text x="32.0" y="474.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="491.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">记忆靠海马巩固为长时记忆（LTP 是细胞基础）；REM </text><text x="32.0" y="510.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">期做梦且肌张力最低，故做梦不会真的动作。</text></svg>