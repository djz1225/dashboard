<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 496" width="100%" style="max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px" role="img"><text x="165.0" y="22.6" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">脑的高级功能：学习记忆与睡眠</text><text x="165.0" y="43.0" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">记忆有分工、睡眠有两个时相</text><text x="15.0" y="73.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">记忆的四个阶段（10版改为「人类的记忆巩固」）</text><rect x="15.0" y="80.0" width="300.0" height="38.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.4"/><text x="27.0" y="100.0" text-anchor="start" font-size="14" font-weight="700" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">感觉记忆</text><text x="27.0" y="118.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">极短（&lt;1 秒），量大</text><line x1="165.0" y1="119.0" x2="165.0" y2="118.5" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/><polygon points="165.0,123.0 163.0,118.4 167.0,118.4" fill="#64748b"/><rect x="15.0" y="124.0" width="300.0" height="38.0" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/><text x="27.0" y="144.0" text-anchor="start" font-size="14" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">短时记忆</text><text x="27.0" y="162.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">数十秒~数分钟，容量有限（约 7±2）</text><line x1="165.0" y1="163.0" x2="165.0" y2="162.5" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/><polygon points="165.0,167.0 163.0,162.4 167.0,162.4" fill="#64748b"/><rect x="15.0" y="168.0" width="300.0" height="38.0" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/><text x="27.0" y="188.0" text-anchor="start" font-size="14" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">长时记忆</text><text x="27.0" y="206.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">容量近乎无限，需巩固</text><line x1="165.0" y1="207.0" x2="165.0" y2="206.5" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/><polygon points="165.0,211.0 163.0,206.4 167.0,206.4" fill="#64748b"/><rect x="15.0" y="212.0" width="300.0" height="38.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/><text x="27.0" y="232.0" text-anchor="start" font-size="14" font-weight="700" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">巩固</text><text x="27.0" y="250.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">海马参与；反复强化形成突触可塑性（LTP）</text><rect x="15.0" y="252.0" width="146.0" height="64.0" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/><text x="88.0" y="271.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">慢波睡眠 SWS</text><text x="88.0" y="288.0" text-anchor="middle" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">深睡、生长激素分泌↑</text><text x="88.0" y="302.0" text-anchor="middle" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
促体力恢复</text><rect x="169.0" y="252.0" width="146.0" height="64.0" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.4"/><text x="242.0" y="271.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">快动眼睡眠 REM</text><text x="242.0" y="288.0" text-anchor="middle" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">眼球快速运动、</text><text x="242.0" y="302.0" text-anchor="middle" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">做梦
促记忆巩固</text><rect x="15.0" y="326.0" width="300.0" height="108.0" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/><text x="25.0" y="342.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">长时程增强（LTP）是学习记忆的细胞基础：</text><text x="25.0" y="358.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">突触持续增强</text><text x="25.0" y="374.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">REM 期肌张力最低（生理性「瘫痪」），</text><text x="25.0" y="390.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">故做梦时不会真的动作</text><text x="25.0" y="406.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">海马损伤 → 无法形成新的长期记忆（但远期记</text><text x="25.0" y="422.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">忆保留）</text><rect x="11.0" y="437.0" width="308.0" height="51.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="165.0" y="452.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">记忆靠海马巩固为长时记忆（LTP 是细胞基础）；</text><text x="165.0" y="467.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">REM 期做梦且肌张力最低</text></svg>