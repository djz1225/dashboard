<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 875" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="嘌呤从头合成：约 11 步，全在胞质"><title>嘌呤从头合成：约 11 步，全在胞质</title><desc>嘌呤从头合成在胞质进行约 11 步：由核糖-5-磷酸生成 PRPP，谷氨酰胺的酰胺氮经 PRPP 酰胺转移酶（限速酶）挂上，再依次装入甘氨酸、一碳单位（C2、C8）、谷氨酰胺（N3、N9）、CO₂ 与天冬氨酸，生成 IMP 后分流为 AMP 与 GMP；补救合成只需 1~2 步，是脑与骨髓的主要途径，HGPRT 缺乏致 Lesch-Nyhan 综合征，ADA 缺乏致严重联合免疫缺陷。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">嘌呤从头合成：约 11 步，全在胞质</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">PRPP + 谷氨酰胺 + 甘氨酸 + 一碳单位 + 天冬氨酸 + CO₂</text><text x="18.0" y="68.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">→IMP</text><rect x="18.0" y="82.0" width="364.0" height="26.0" rx="6" fill="#e2f5f2"/><text x="200.0" y="99.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">PRPP → → → IMP → AMP / GMP（耗大量 ATP）</text><rect x="18.0" y="118.0" width="364.0" height="345.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="137.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">四个阶段</text><rect x="30.0" y="150.0" width="340.0" height="64.0" rx="8" fill="#ffffff" stroke="#e3eaf2" stroke-width="1.1"/><rect x="30.0" y="150.0" width="3.5" height="64.0" rx="1.8" fill="#c0392b"/><circle cx="49.0" cy="167.0" r="9" fill="#c0392b"/><text x="49.0" y="171.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">1</text><text x="65.0" y="171.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">① 生成 PRPP</text><text x="360.0" y="171.0" text-anchor="end" font-size="12" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">先备糖</text><text x="65.0" y="189.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">磷酸戊糖途径的核糖-5-磷酸 + ATP</text><text x="65.0" y="205.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">→PRPP（PRPP 合成酶）</text><line x1="49.0" y1="216.0" x2="49.0" y2="223.0" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="223.0" x2="45.6" y2="216.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="223.0" x2="52.4" y2="216.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><rect x="30.0" y="225.0" width="340.0" height="64.0" rx="8" fill="#ffffff" stroke="#e3eaf2" stroke-width="1.1"/><rect x="30.0" y="225.0" width="3.5" height="64.0" rx="1.8" fill="#c1440e"/><circle cx="49.0" cy="242.0" r="9" fill="#c1440e"/><text x="49.0" y="246.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">2</text><text x="65.0" y="246.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">② 挂上第一个氮</text><text x="360.0" y="246.0" text-anchor="end" font-size="12" font-weight="700" fill="#c1440e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">限速</text><text x="65.0" y="264.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">谷氨酰胺的酰胺氮挂到 PRPP 上，生成 5-磷</text><text x="65.0" y="280.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">酸核糖胺（限速酶）</text><line x1="49.0" y1="291.0" x2="49.0" y2="298.0" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="298.0" x2="45.6" y2="291.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="298.0" x2="52.4" y2="291.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><rect x="30.0" y="300.0" width="340.0" height="80.0" rx="8" fill="#ffffff" stroke="#e3eaf2" stroke-width="1.1"/><rect x="30.0" y="300.0" width="3.5" height="80.0" rx="1.8" fill="#0f766e"/><circle cx="49.0" cy="317.0" r="9" fill="#0f766e"/><text x="49.0" y="321.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">3</text><text x="65.0" y="321.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">③ 装环</text><text x="360.0" y="321.0" text-anchor="end" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">约 10 步</text><text x="65.0" y="339.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">甘氨酸 → 一碳单位（C2、C8）→ 谷氨</text><text x="65.0" y="355.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">酰胺（N3、N9）→ CO₂ → 天冬氨</text><text x="65.0" y="371.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">酸（N1）</text><line x1="49.0" y1="382.0" x2="49.0" y2="389.0" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="389.0" x2="45.6" y2="382.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><line x1="49.0" y1="389.0" x2="52.4" y2="382.9" stroke="#4a5a6b" stroke-width="1.6" stroke-linecap="round"/><rect x="30.0" y="391.0" width="340.0" height="64.0" rx="8" fill="#ffffff" stroke="#e3eaf2" stroke-width="1.1"/><rect x="30.0" y="391.0" width="3.5" height="64.0" rx="1.8" fill="#0f766e"/><circle cx="49.0" cy="408.0" r="9" fill="#0f766e"/><text x="49.0" y="412.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">4</text><text x="65.0" y="412.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">④ IMP → AMP / GMP</text><text x="360.0" y="412.0" text-anchor="end" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">分流</text><text x="65.0" y="430.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">IMP 是共同中间物，分流为腺苷酸与鸟苷酸，</text><text x="65.0" y="446.0" font-size="12.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">互相反馈抑制</text><rect x="18.0" y="475.0" width="177.0" height="104.0" rx="9" fill="#e2f5f2" stroke="#0f766e" stroke-width="1.1"/><text x="29.0" y="496.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">从头合成｜贵</text><text x="29.0" y="515.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">约 11 步，耗大量 ATP</text><text x="29.0" y="535.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肝为主，供快速增殖组织</text><text x="29.0" y="555.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">增殖期细胞明显活跃</text><rect x="205.0" y="475.0" width="177.0" height="104.0" rx="9" fill="#e6f6ec" stroke="#2f8f57" stroke-width="1.1"/><text x="216.0" y="496.0" font-size="12.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">补救合成｜省</text><text x="216.0" y="515.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">1~2 步，直接用游离碱基</text><text x="216.0" y="535.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">脑、骨髓主要靠这条路</text><text x="216.0" y="555.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">HGPRT、APRT 催化</text><rect x="18.0" y="589.0" width="364.0" height="165.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="608.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">补救通路与它的病</text><rect x="30.0" y="619.0" width="3.0" height="15.0" rx="1.5" fill="#c0392b"/><text x="39.0" y="632.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">HGPRT 缺乏</text><text x="370.0" y="632.0" text-anchor="end" font-size="12" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Lesch-Nyhan</text><text x="39.0" y="650.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">X 连锁；自残、高尿酸、智力障碍</text><rect x="30.0" y="659.0" width="3.0" height="15.0" rx="1.5" fill="#1f6fb2"/><text x="39.0" y="672.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">ADA 缺乏</text><text x="370.0" y="672.0" text-anchor="end" font-size="12" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">SCID</text><text x="39.0" y="690.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">腺苷堆积毒害淋巴细胞 → 严重联合免疫缺陷</text><rect x="30.0" y="699.0" width="3.0" height="15.0" rx="1.5" fill="#b45309"/><text x="39.0" y="712.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">6-巯基嘌呤</text><text x="370.0" y="712.0" text-anchor="end" font-size="12" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">需先活化</text><text x="39.0" y="730.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">6-MP 必须经 HGPRT 活化才起效，故 HGPRT</text><text x="39.0" y="746.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">完全缺乏者耐药</text><rect x="18.0" y="766.0" width="364.0" height="89.0" rx="8" fill="#e2f5f2"/><rect x="18.0" y="766.0" width="3.5" height="89.0" rx="1.8" fill="#0f766e"/><text x="32.0" y="786.0" font-size="11.5" font-weight="700" fill="#0f766e" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="803.0" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">脑组织缺乏从头合成嘌呤的酶系、骨髓增殖快，两者都高</text><text x="32.0" y="822.0" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">度依赖补救，所以 HGPRT 缺陷时神经与造血系统受</text><text x="32.0" y="841.0" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">损最重。</text></svg>