<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 606" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="三大物质互转的边界"><title>三大物质互转的边界</title><desc>糖可转变为脂肪（乙酰CoA 合成脂肪酸、糖酵解供甘油骨架），蛋白可经生糖氨基酸转为糖，糖加氨基可合成非必需氨基酸；但脂肪酸不能净生糖，因为丙酮酸脱氢酶催化的丙酮酸→乙酰CoA 不可逆，且乙酰CoA 的两个碳在三羧酸循环中以 CO₂ 丢失，净增碳为零。甘油与奇数碳脂肪酸的丙酰CoA 是例外。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">三大物质互转的边界</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">唯一的硬墙：乙酰CoA 不能净生糖，所以脂肪酸不能净变糖</text><rect x="18.0" y="65.0" width="364.0" height="26.0" rx="6" fill="#f8fbfd"/><text x="26.0" y="82.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">转化方向</text><text x="135.2" y="82.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">能否</text><text x="215.3" y="82.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">关键节点</text><line x1="18.0" y1="133.0" x2="382.0" y2="133.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="109.0" font-size="12.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">糖 → 脂肪</text><text x="135.2" y="109.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">能</text><text x="215.3" y="109.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">乙酰CoA → 脂肪酸；糖酵解</text><text x="215.3" y="125.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">供甘油骨架</text><line x1="18.0" y1="175.0" x2="382.0" y2="175.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="151.0" font-size="12.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">脂肪 → 糖</text><text x="135.2" y="151.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">基本不能</text><text x="215.3" y="151.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">只有甘油部分可生糖，脂</text><text x="215.3" y="167.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肪酸不行</text><line x1="18.0" y1="217.0" x2="382.0" y2="217.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="193.0" font-size="12.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">蛋白 → 糖</text><text x="135.2" y="193.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">能</text><text x="215.3" y="193.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">生糖氨基酸 → 丙酮酸 / 三</text><text x="215.3" y="209.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">羧酸循环中间物</text><line x1="18.0" y1="259.0" x2="382.0" y2="259.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="235.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">糖 → 蛋白</text><text x="135.2" y="235.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">能（需氨基）</text><text x="215.3" y="235.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">α-酮酸 + 氨基 → 非</text><text x="215.3" y="251.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">必需氨基酸</text><line x1="18.0" y1="301.0" x2="382.0" y2="301.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="277.0" font-size="12.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">脂肪 → 蛋白</text><text x="135.2" y="277.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">不能</text><text x="215.3" y="277.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">缺氮源，且乙酰CoA 变不成</text><text x="215.3" y="293.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">氨基酸碳架</text><rect x="18.0" y="307.0" width="364.0" height="197.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="326.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">为什么乙酰CoA 不能净生糖</text><rect x="30.0" y="337.0" width="3.0" height="15.0" rx="1.5" fill="#c1440e"/><text x="39.0" y="350.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">① 丙酮酸脱氢酶不可逆</text><text x="370.0" y="350.0" text-anchor="end" font-size="12" font-weight="700" fill="#c1440e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">单向阀</text><text x="39.0" y="368.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">丙酮酸 → 乙酰CoA 此反应不可逆，不能回</text><text x="39.0" y="384.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">头变丙酮酸</text><rect x="30.0" y="393.0" width="3.0" height="15.0" rx="1.5" fill="#b45309"/><text x="39.0" y="406.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">② 两个碳以 CO₂ 丢失</text><text x="370.0" y="406.0" text-anchor="end" font-size="12" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">净碳为零</text><text x="39.0" y="424.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">三羧酸循环中乙酰CoA 的两个碳以 CO₂ </text><text x="39.0" y="440.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">形式离开</text><rect x="30.0" y="449.0" width="3.0" height="15.0" rx="1.5" fill="#c0392b"/><text x="39.0" y="462.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">③ 结论</text><text x="370.0" y="462.0" text-anchor="end" font-size="12" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">不能净生糖</text><text x="39.0" y="480.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">「2 碳进、2 碳出」，无法净增碳 → 不能</text><text x="39.0" y="496.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">净合成葡萄糖</text><rect x="18.0" y="516.0" width="364.0" height="70.0" rx="8" fill="#fef3c7"/><rect x="18.0" y="516.0" width="3.5" height="70.0" rx="1.8" fill="#b45309"/><text x="32.0" y="536.0" font-size="11.5" font-weight="700" fill="#b45309" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">易错</text><text x="32.0" y="553.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">严格说是「脂肪酸不能净变糖」，甘油可以；奇数碳脂肪</text><text x="32.0" y="572.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">酸的丙酰CoA 经琥珀酰CoA 也是例外。</text></svg>