<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 706" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="启动子：-35 与 -10 区"><title>启动子：-35 与 -10 区</title><desc>原核启动子有两个共有序列：-35 区（TTGACA，起点上游约 35 bp）与 -10 区即 Pribnow 盒（TATAAT，上游约 10 bp），两者相隔约 20 bp。A-T 只有两个氢键，故 -10 区熔点最低，转录起始的局部解链在此发生形成开放复合物。σ 因子负责识别启动子并决定识别哪一套（σ⁷⁰ 管家基因、σ³² 热休克等），核心酶 α₂ββ′ 只催化不识别。真核则有 -25~-30 的 TATA 框与更上游的 CAAT、GC 框。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">启动子：-35 与 -10 区</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">-35 TTGACA、-10 TATAAT；A/T 富集使解链最容易，σ 因</text><text x="18.0" y="68.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">子负责识别</text><rect x="18.0" y="82.0" width="364.0" height="179.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="101.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">原核启动子的两个共有序列</text><line x1="30.0" y1="170.0" x2="356.0" y2="170.0" stroke="#cbd8e4" stroke-width="1.8" stroke-linecap="round"/><rect x="38.0" y="140.0" width="78.0" height="20.0" rx="4" fill="#e2f5f2" stroke="#0f766e" stroke-width="1"/><text x="77.0" y="154.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">TTGACA</text><text x="77.0" y="135.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">-35 区</text><rect x="160.4" y="140.0" width="78.0" height="20.0" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="1"/><text x="199.4" y="154.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">TATAAT</text><text x="199.4" y="135.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">-10 区</text><line x1="264.7" y1="164.0" x2="264.7" y2="176.0" stroke="#0f766e" stroke-width="1.8" stroke-linecap="round"/><text x="264.7" y="190.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">+1 起点</text><line x1="290.7" y1="186.0" x2="356.0" y2="186.0" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="356.0" y1="186.0" x2="352.1" y2="188.2" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="356.0" y1="186.0" x2="352.1" y2="183.8" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><text x="49.6" y="186.0" font-size="11.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">约 20 bp 间隔</text><text x="30.0" y="202.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">A-T 只有两个氢键（G-C 三个），故 -10 区是整段序列的「</text><text x="30.0" y="219.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">最低熔点」，转录起始的局部解链（开放复合物）就发生</text><text x="30.0" y="236.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">在这里。</text><rect x="18.0" y="273.0" width="364.0" height="26.0" rx="6" fill="#f8fbfd"/><text x="26.0" y="290.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">元件</text><text x="149.8" y="290.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">位置</text><text x="266.2" y="290.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">共有序列</text><line x1="18.0" y1="325.0" x2="382.0" y2="325.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="317.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">-35 区</text><text x="149.8" y="317.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">起点上游约 35bp</text><text x="266.2" y="317.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">TTGACA</text><line x1="18.0" y1="367.0" x2="382.0" y2="367.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="343.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">-10 区（</text><text x="26.0" y="359.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Pribnow 盒）</text><text x="149.8" y="343.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">起点上游约 10bp</text><text x="266.2" y="343.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">TATAAT</text><line x1="18.0" y1="393.0" x2="382.0" y2="393.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="385.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">真核 TATA 框</text><text x="149.8" y="385.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">上游 -25~-30 bp</text><text x="266.2" y="385.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">TATAAA</text><line x1="18.0" y1="435.0" x2="382.0" y2="435.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="411.0" font-size="12.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">真核 CAAT / </text><text x="26.0" y="427.0" font-size="12.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">GC框</text><text x="149.8" y="411.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">更上游</text><text x="266.2" y="411.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">决定基础表达水平</text><rect x="18.0" y="441.0" width="364.0" height="163.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="460.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">σ 因子决定「认哪套启动子」</text><rect x="30.0" y="471.0" width="3.0" height="15.0" rx="1.5" fill="#0f766e"/><text x="39.0" y="484.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">σ⁷⁰</text><text x="362.0" y="484.0" text-anchor="end" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">管家基因</text><text x="39.0" y="502.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">识别 -35 与 -10 共有序列，最常用</text><rect x="30.0" y="510.0" width="3.0" height="15.0" rx="1.5" fill="#b45309"/><text x="39.0" y="523.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">σ³²</text><text x="362.0" y="523.0" text-anchor="end" font-size="12" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">热休克</text><text x="39.0" y="541.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">识别热休克基因启动子，应急换岗</text><rect x="30.0" y="549.0" width="3.0" height="15.0" rx="1.5" fill="#0f766e"/><text x="39.0" y="562.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">σ²⁸ / σ⁵⁴</text><text x="362.0" y="562.0" text-anchor="end" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">鞭毛 / 氮代谢</text><text x="39.0" y="580.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">更换 σ 因子即整体切换一套基因，是</text><text x="39.0" y="596.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">最省事的调控</text><rect x="18.0" y="616.0" width="364.0" height="70.0" rx="8" fill="#eef2f7"/><rect x="18.0" y="616.0" width="3.5" height="70.0" rx="1.8" fill="#4a5a6b"/><text x="32.0" y="636.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">易错</text><text x="32.0" y="653.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">核心酶（α₂ββ′）只负责催化、不认启动子；σ 因</text><text x="32.0" y="672.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">子才识别启动子，全酶 = 核心酶 + σ。</text></svg>