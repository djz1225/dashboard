<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 453" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="B 族维生素与辅酶对应"><title>B 族维生素与辅酶对应</title><desc>B 族维生素是辅酶或辅基的前体：B₁→TPP、B₂→FMN/FAD、PP→NAD⁺/NADP⁺、B₆→磷酸吡哆醛、泛酸→CoA、生物素→羧化、叶酸→FH₄、B₁₂→甲基钴胺素；维生素 C 不构成辅酶，是羟化酶的电子供体。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">B 族维生素与辅酶对应</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">B 族几乎都是辅酶前体；C 不构成辅酶，是羟化酶的还原剂</text><rect x="18.0" y="65.0" width="364.0" height="26.0" rx="6" fill="#f8fbfd"/><text x="26.0" y="82.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">维生素</text><text x="113.4" y="82.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">辅酶（辅基）形式</text><text x="222.6" y="82.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">典型反应</text><line x1="18.0" y1="117.0" x2="382.0" y2="117.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="109.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">B₁ 硫胺素</text><text x="113.4" y="109.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">TPP</text><text x="222.6" y="109.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">α-酮酸氧化脱羧、转酮醇酶</text><line x1="18.0" y1="143.0" x2="382.0" y2="143.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="135.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">B₂ 核黄素</text><text x="113.4" y="135.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">FMN / FAD</text><text x="222.6" y="135.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">氧化还原（递氢）</text><line x1="18.0" y1="169.0" x2="382.0" y2="169.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="161.0" font-size="12.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">PP 烟酸</text><text x="113.4" y="161.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">NAD⁺ / NADP⁺</text><text x="222.6" y="161.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">氧化还原（递氢）</text><line x1="18.0" y1="195.0" x2="382.0" y2="195.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="187.0" font-size="12.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">B₆ 吡哆醇</text><text x="113.4" y="187.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">磷酸吡哆醛</text><text x="222.6" y="187.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">转氨基、脱羧</text><line x1="18.0" y1="221.0" x2="382.0" y2="221.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="213.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">泛酸</text><text x="113.4" y="213.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">CoA / ACP</text><text x="222.6" y="213.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">酰基转移</text><line x1="18.0" y1="247.0" x2="382.0" y2="247.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="239.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">生物素</text><text x="113.4" y="239.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">羧基生物素</text><text x="222.6" y="239.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">羧化反应</text><line x1="18.0" y1="273.0" x2="382.0" y2="273.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="265.0" font-size="12.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">叶酸</text><text x="113.4" y="265.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">FH₄</text><text x="222.6" y="265.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一碳单位传递</text><line x1="18.0" y1="315.0" x2="382.0" y2="315.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="291.0" font-size="12.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">B₁₂ 钴</text><text x="26.0" y="307.0" font-size="12.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胺素</text><text x="113.4" y="291.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">甲基钴胺素</text><text x="222.6" y="291.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">甲基转移（变位酶也需）</text><line x1="18.0" y1="357.0" x2="382.0" y2="357.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="333.0" font-size="12.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">C 抗坏血酸</text><text x="113.4" y="333.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">（不是辅酶）</text><text x="222.6" y="333.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">羟化酶辅助因子：胶原脯氨</text><text x="222.6" y="349.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">酸/赖氨酸羟化</text><rect x="18.0" y="363.0" width="364.0" height="70.0" rx="8" fill="#fef3c7"/><rect x="18.0" y="363.0" width="3.5" height="70.0" rx="1.8" fill="#b45309"/><text x="32.0" y="383.0" font-size="11.5" font-weight="700" fill="#b45309" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">易错</text><text x="32.0" y="400.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">高频混淆：B₁ 是 TPP（不是 TMP）、B₂ 是 FMN/FAD、</text