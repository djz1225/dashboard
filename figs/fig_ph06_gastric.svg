<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 556" width="100%" style="max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px" role="img"><text x="165.0" y="22.6" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">胃液分泌的三个时相</text><text x="165.0" y="43.0" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">头期最「好吃」，胃期量最大，肠期最少</text><rect x="15.0" y="60.0" width="300.0" height="60.0" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/><text x="24.0" y="79.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">头期</text><text x="306.0" y="79.0" text-anchor="end" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">30%</text><text x="24.0" y="96.0" text-anchor="start" font-size="13" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">量大、酸度高、消化力强</text><text x="24.0" y="114.0" text-anchor="start" font-size="13" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">视觉/嗅觉/咀嚼 → 迷走神经 → 胃腺</text><rect x="15.0" y="126.0" width="300.0" height="60.0" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.4"/><text x="24.0" y="145.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">胃期</text><text x="306.0" y="145.0" text-anchor="end" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">60%</text><text x="24.0" y="162.0" text-anchor="start" font-size="13" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">量最大，酸度最高</text><text x="24.0" y="180.0" text-anchor="start" font-size="13" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">食物扩张胃 + 蛋白分解产物 → 胃泌素</text><rect x="15.0" y="192.0" width="300.0" height="60.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.4"/><text x="24.0" y="211.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">肠期</text><text x="306.0" y="211.0" text-anchor="end" font-size="13.5" font-weight="700" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">10%</text><text x="24.0" y="228.0" text-anchor="start" font-size="13" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">量最少</text><text x="24.0" y="246.0" text-anchor="start" font-size="13" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">食物进入十二指肠 → 少量胃泌素</text><rect x="15.0" y="260.0" width="300.0" height="118.0" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="25.0" y="279.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">胃液成分与分泌细胞</text><text x="25.0" y="297.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 壁细胞：盐酸（内因子）—— 胃酸由 H⁺-K⁺</text><text x="25.0" y="313.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">-ATP 酶泵出</text><text x="25.0" y="329.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 主细胞：胃蛋白酶原（需盐酸激活）</text><text x="25.0" y="345.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 黏液细胞：黏液-碳酸氢盐屏障</text><text x="25.0" y="361.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· G 细胞：胃泌素（促胃酸分泌）</text><rect x="15.0" y="386.0" width="300.0" height="108.0" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/><text x="25.0" y="402.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">刺激胃酸的三条途径最终都汇到壁细胞：组胺（</text><text x="25.0" y="418.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">H₂）&gt; 胃泌素 &gt; 乙酰胆碱</text><text x="25.0" y="434.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">抑酸药：PPI 抑制 H⁺-K⁺-ATP 酶（最后一关</text><text x="25.0" y="450.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">），H₂ 受体拮抗剂抑制组胺途径</text><text x="25.0" y="466.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">内因子缺乏 → 维生素 B₁₂ 吸收障碍 → 巨幼</text><text x="25.0" y="482.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">细胞性贫血（萎缩性胃炎）</text><rect x="11.0" y="497.0" width="308.0" height="51.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="165.0" y="512.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">胃期量最大、头期消化力最强；胃酸由壁细胞 H</text><text x="165.0" y="527.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">⁺-K⁺-ATP 酶分泌</text></svg>