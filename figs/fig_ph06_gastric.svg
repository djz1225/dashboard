<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 807" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="胃液与胃黏膜屏障"><title>胃液与胃黏膜屏障</title><desc>壁细胞分泌盐酸与内因子、主细胞分泌胃蛋白酶原、黏液细胞构成屏障、G 细胞分泌胃泌素；三时相中头期消化力最强、胃期量最大；屏障受损致溃疡。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胃液与胃黏膜屏障：谁分泌、谁保护</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胃酸由壁细胞 H⁺-K⁺-ATP 酶泵出，这是抑酸药的最后一关</text><rect x="18.0" y="65.0" width="364.0" height="24.0" rx="6" fill="#e2f5f2"/><text x="25.0" y="81.0" font-size="11" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">细胞</text><text x="112.4" y="81.0" font-size="11" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">分泌物</text><text x="207.0" y="81.0" font-size="11" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">作用与临床</text><line x1="18.0" y1="131.0" x2="382.0" y2="131.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="25.0" y="107.0" font-size="12.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">壁细胞</text><text x="112.4" y="107.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">盐酸＋内因子</text><text x="207.0" y="107.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">盐酸杀菌、激活胃蛋白酶原；内</text><text x="207.0" y="123.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">因子助 B₁₂ 吸收</text><line x1="18.0" y1="173.0" x2="382.0" y2="173.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="25.0" y="149.0" font-size="12.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">主细胞</text><text x="112.4" y="149.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胃蛋白酶原</text><text x="207.0" y="149.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">需盐酸激活成胃蛋白酶，分解蛋</text><text x="207.0" y="165.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">白质</text><line x1="18.0" y1="215.0" x2="382.0" y2="215.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="25.0" y="191.0" font-size="12.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">黏液细胞</text><text x="112.4" y="191.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">黏液＋HCO₃⁻</text><text x="207.0" y="191.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">构成黏液-碳酸氢盐屏障，隔离</text><text x="207.0" y="207.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">盐酸</text><line x1="18.0" y1="241.0" x2="382.0" y2="241.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="25.0" y="233.0" font-size="12.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">G 细胞</text><text x="112.4" y="233.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胃泌素</text><text x="207.0" y="233.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">促壁细胞分泌盐酸、促黏膜生长</text><line x1="18.0" y1="283.0" x2="382.0" y2="283.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="25.0" y="259.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肠嗜铬样细</text><text x="25.0" y="275.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胞</text><text x="112.4" y="259.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">组胺</text><text x="207.0" y="259.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">经 H₂ 受体促酸，作用强于胃</text><text x="207.0" y="275.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">泌素</text><rect x="18.0" y="285.0" width="3.0" height="14.0" rx="1.5" fill="#0f766e"/><text x="28.0" y="295.0" font-size="13.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">三个时相：头期消化力最强、胃期量最大</text><rect x="18.0" y="307.0" width="364.0" height="221.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="325.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">三时相</text><rect x="30.0" y="337.0" width="94.8" height="32.0" rx="4" fill="#e2f5f2" stroke="#0f766e" stroke-width="1.1"/><text x="77.4" y="357.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">头期 30%</text><rect x="124.8" y="337.0" width="189.6" height="32.0" rx="4" fill="#fdeceb" stroke="#c0392b" stroke-width="1.1"/><text x="219.6" y="357.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胃期 60%</text><rect x="314.4" y="337.0" width="31.6" height="32.0" rx="4" fill="#eef2f7" stroke="#4a5a6b" stroke-width="1.1"/><text x="330.2" y="351.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肠期</text><text x="330.2" y="364.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">10%</text><rect x="30.0" y="383.0" width="3.0" height="15.0" rx="1.5" fill="#0f766e"/><text x="39.0" y="396.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">头期</text><text x="347.0" y="396.0" text-anchor="end" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">30%</text><text x="39.0" y="414.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">视觉／嗅觉／咀嚼 → 迷走神经 → 胃腺；酸</text><text x="39.0" y="430.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">度高、酶多、消化力最强</text><rect x="30.0" y="440.0" width="3.0" height="15.0" rx="1.5" fill="#c0392b"/><text x="39.0" y="453.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胃期</text><text x="347.0" y="453.0" text-anchor="end" font-size="12" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">60%</text><text x="39.0" y="471.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">食物扩张胃＋蛋白分解产物 → 迷走-迷走反</text><text x="39.0" y="487.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">射＋胃泌素；量最大、酸度最高</text><rect x="30.0" y="497.0" width="3.0" height="15.0" rx="1.5" fill="#4a5a6b"/><text x="39.0" y="510.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肠期</text><text x="347.0" y="510.0" text-anchor="end" font-size="12" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">10%</text><text x="39.0" y="528.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">食糜入十二指肠 → 少量胃泌素；量最少</text><rect x="18.0" y="540.0" width="364.0" height="165.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="558.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胃黏膜屏障与损伤</text><rect x="30.0" y="568.0" width="3.0" height="15.0" rx="1.5" fill="#2f8f57"/><text x="39.0" y="581.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">黏液-碳酸氢盐屏障</text><text x="347.0" y="581.0" text-anchor="end" font-size="12" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">第一道</text><text x="39.0" y="599.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">黏液层＋HCO₃⁻ 形成 pH 梯度，中和胃酸</text><rect x="30.0" y="609.0" width="3.0" height="15.0" rx="1.5" fill="#1f6fb2"/><text x="39.0" y="622.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">黏膜上皮紧密连接</text><text x="347.0" y="622.0" text-anchor="end" font-size="12" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">第二道</text><text x="39.0" y="640.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">防止 H⁺ 反向弥散进入黏膜</text><rect x="30.0" y="650.0" width="3.0" height="15.0" rx="1.5" fill="#c0392b"/><text x="39.0" y="663.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">损伤因素</text><text x="347.0" y="663.0" text-anchor="end" font-size="12" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">NSAIDs／幽门螺杆菌</text><text x="39.0" y="681.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">抑制前列腺素 → 黏液与血流↓ → 屏障破损</text><text x="39.0" y="697.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"> → 溃疡</text><rect x="18.0" y="717.0" width="364.0" height="70.0" rx="8" fill="#eef2f7"/><rect x="18.0" y="717.0" width="3.5" height="70.0" rx="1.8" fill="#4a5a6b"/><text x="32.0" y="737.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="754.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">内因子缺乏（萎缩性胃炎、胃大部切除）→ 维生素 B₁</text><text x="32.0" y="773.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">₂ 吸收障碍 → 巨幼细胞性贫血。</text></svg>