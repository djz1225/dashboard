<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 462" width="100%" style="max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px" role="img"><text x="165.0" y="22.6" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">复制保真：三层防线</text><text x="165.0" y="43.0" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">错误率从 10⁻⁵ 降到 10⁻⁹</text><rect x="15.0" y="58.0" width="300.0" height="41.0" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/><text x="28.0" y="77.0" text-anchor="start" font-size="12.6" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">① 碱基选择</text><text x="28.0" y="94.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">聚合酶活性中心按几何形状筛 dNTP，错误率约 10⁻⁵</text><line x1="165.0" y1="100.0" x2="165.0" y2="99.5" stroke="#64748b" stroke-width="1.4" stroke-linecap="round"/><polygon points="165.0,104.0 163.0,99.4 167.0,99.4" fill="#64748b"/><rect x="15.0" y="105.0" width="300.0" height="41.0" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/><text x="28.0" y="124.0" text-anchor="start" font-size="12.6" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">② 3′→5′ 外切校正</text><text x="28.0" y="141.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">校对活性切掉错配碱基，再降 100~1000 倍</text><line x1="165.0" y1="147.0" x2="165.0" y2="146.5" stroke="#64748b" stroke-width="1.4" stroke-linecap="round"/><polygon points="165.0,151.0 163.0,146.4 167.0,146.4" fill="#64748b"/><rect x="15.0" y="152.0" width="300.0" height="41.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/><text x="28.0" y="171.0" text-anchor="start" font-size="12.6" font-weight="700" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">③ 错配修复（MMR）</text><text x="28.0" y="188.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">复制后识别并修正错配，再降 100~1000 倍</text><rect x="15.0" y="196.0" width="300.0" height="118.0" rx="7" fill="#dcfce7" stroke="#cbd5e1" stroke-width="1.4"/><text x="25.0" y="215.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">错配修复的识别逻辑</text><text x="25.0" y="233.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 新合成链尚未甲基化（原核 dam 甲基化），</text><text x="25.0" y="249.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">旧链已甲基化 → 据此判断「改哪条」</text><text x="25.0" y="265.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 真核靠新链暂时的切口（nicked）识别</text><text x="25.0" y="281.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· MMR 缺陷 → 微卫星不稳定（MSI）→ Lync</text><text x="25.0" y="297.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">h 综合征，且对免疫治疗敏感</text><rect x="15.0" y="322.0" width="300.0" height="76.0" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/><text x="25.0" y="338.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">易错：三层防线是「串联放大」，不是「并联</text><text x="25.0" y="354.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">备份」——去掉任何一层错误率都显著上升</text><text x="25.0" y="370.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">MMR 修的是「错配」，不是「损伤」，与 NER</text><text x="25.0" y="386.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">/BER 分工不同</text><rect x="11.0" y="403.0" width="308.0" height="51.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="165.0" y="418.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">碱基选择 + 外切校正 + 错配修复，三层串联把</text><text x="165.0" y="433.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">错误率降到 10⁻⁹</text></svg>