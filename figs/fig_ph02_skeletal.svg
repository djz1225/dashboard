<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 579" width="100%" style="max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px" role="img"><text x="165.0" y="22.6" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">骨骼肌兴奋-收缩耦联</text><text x="165.0" y="43.0" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">关键：Ca²⁺ 从肌质网释放，作用于肌钙蛋白</text><rect x="15.0" y="60.0" width="300.0" height="38.0" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/><text x="27.0" y="80.0" text-anchor="start" font-size="14" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">① 终板电位</text><text x="27.0" y="98.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">ACh 结合 N₂ 受体 → Na⁺ 内流 → 终板电位</text><line x1="165.0" y1="99.0" x2="165.0" y2="99.5" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/><polygon points="165.0,104.0 163.0,99.4 167.0,99.4" fill="#64748b"/><rect x="15.0" y="105.0" width="300.0" height="38.0" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/><text x="27.0" y="125.0" text-anchor="start" font-size="14" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">② 动作电位</text><text x="27.0" y="143.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">沿肌膜传导，进入 T 管</text><line x1="165.0" y1="144.0" x2="165.0" y2="144.5" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/><polygon points="165.0,149.0 163.0,144.4 167.0,144.4" fill="#64748b"/><rect x="15.0" y="150.0" width="300.0" height="38.0" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/><text x="27.0" y="170.0" text-anchor="start" font-size="14" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">③ 三联管耦联</text><text x="27.0" y="188.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">T 管膜上的 DHP 受体 → 激活肌质网 RyR</text><line x1="165.0" y1="189.0" x2="165.0" y2="189.5" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/><polygon points="165.0,194.0 163.0,189.4 167.0,189.4" fill="#64748b"/><rect x="15.0" y="195.0" width="300.0" height="38.0" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/><text x="27.0" y="215.0" text-anchor="start" font-size="14" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">④ Ca²⁺ 释放</text><text x="27.0" y="233.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">肌质网内 Ca²⁺ 大量释放到肌浆</text><line x1="165.0" y1="234.0" x2="165.0" y2="234.5" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/><polygon points="165.0,239.0 163.0,234.4 167.0,234.4" fill="#64748b"/><rect x="15.0" y="240.0" width="300.0" height="54.0" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.4"/><text x="27.0" y="260.0" text-anchor="start" font-size="14" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">⑤ 肌丝滑行</text><text x="27.0" y="278.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">Ca²⁺ 结合肌钙蛋白 → 原肌球蛋白移位 → 横</text><text x="27.0" y="294.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">桥循环</text><line x1="165.0" y1="295.0" x2="165.0" y2="295.5" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/><polygon points="165.0,300.0 163.0,295.4 167.0,295.4" fill="#64748b"/><rect x="15.0" y="301.0" width="300.0" height="38.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/><text x="27.0" y="321.0" text-anchor="start" font-size="14" font-weight="700" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">⑥ 舒张</text><text x="27.0" y="339.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">Ca²⁺ 被泵回肌质网（耗能），肌钙蛋白脱落</text><rect x="15.0" y="341.0" width="300.0" height="42.0" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/><text x="27.0" y="361.0" text-anchor="start" font-size="14" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">耦联因子</text><text x="305.0" y="361.0" text-anchor="end" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">核心</text><text x="27.0" y="378.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">Ca²⁺（不是神经冲动本身）</text><rect x="15.0" y="389.0" width="300.0" height="42.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="27.0" y="409.0" text-anchor="start" font-size="14" font-weight="700" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">储备</text><text x="27.0" y="426.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">肌质网 Ca²⁺；耗竭则收缩无力</text><rect x="15.0" y="441.0" width="300.0" height="76.0" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/><text x="25.0" y="457.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">兴奋-收缩耦联的关键结构是「三联管」，</text><text x="25.0" y="473.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">关键离子是 Ca²⁺</text><text x="25.0" y="489.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">舒张也需要能量：Ca²⁺ 泵把 Ca²⁺ 收回肌质</text><text x="25.0" y="505.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">网（所以尸僵时 ATP 耗尽无法舒张）</text><rect x="11.0" y="520.0" width="308.0" height="51.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="165.0" y="535.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">电信号→DHP/RyR→肌质网放 Ca²⁺→肌钙蛋白→横</text><text x="165.0" y="550.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">桥循环；舒张靠 Ca²⁺ 泵</text></svg>