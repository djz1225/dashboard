<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 727" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="骨骼肌兴奋-收缩耦联"><title>骨骼肌兴奋-收缩耦联</title><desc>动作电位经 T 管—三联管激活肌质网 RyR 释放 Ca²⁺，Ca²⁺ 结合肌钙蛋白触发横桥循环；舒张靠 Ca²⁺ 泵耗能回收。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">骨骼肌兴奋-收缩耦联</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">关键结构三联管，关键离子 Ca²⁺</text><rect x="18.0" y="65.0" width="364.0" height="162.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="83.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">结构示意</text><text x="30.0" y="105.0" font-size="11" font-weight="700" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肌膜</text><text x="188.0" y="105.0" text-anchor="middle" font-size="11" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">T 管（肌膜内陷）</text><text x="346.0" y="105.0" text-anchor="end" font-size="11" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">终池＝肌质网</text><line x1="30.0" y1="115.0" x2="346.0" y2="115.0" stroke="#4a5a6b" stroke-width="2.2" stroke-linecap="round"/><line x1="178.0" y1="115.0" x2="178.0" y2="171.0" stroke="#0f766e" stroke-width="2.2" stroke-linecap="round"/><line x1="198.0" y1="115.0" x2="198.0" y2="171.0" stroke="#0f766e" stroke-width="2.2" stroke-linecap="round"/><line x1="178.0" y1="171.0" x2="198.0" y2="171.0" stroke="#0f766e" stroke-width="2.2" stroke-linecap="round"/><rect x="123.0