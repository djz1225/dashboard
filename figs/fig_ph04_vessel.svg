<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 661" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="血管的功能分类"><title>血管的功能分类</title><desc>弹性贮器血管（大动脉）缓冲血压波动，阻力血管（小动脉）决定外周阻力，交换血管（毛细血管）完成物质交换，容量血管（静脉）贮存 60%~70% 血量。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">血管的功能分类：四类血管各管一件事</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">动脉管压力、毛细血管管交换、静脉管容量</text><rect x="18.0" y="65.0" width="364.0" height="76.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="83.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">串联顺序</text><rect x="32.0" y="97.0" width="75.0" height="28.0" rx="6" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1"/><text x="69.5" y="114.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">大动脉</text><line x1="108.5" y1="111.0" x2="117.5" y2="111.0" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="117.5" y1="111.0" x2="113.6" y2="113.2" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="117.5" y1="111.0" x2="113.6" y2="108.8" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><rect x="119.0" y="97.0" width="75.0" height="28.0" rx="6" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1"/><text x="156.5" y="114.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">小动脉</text><line x1="195.5" y1="111.0" x2="204.5" y2="111.0" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="204.5" y1="111.0" x2="200.6" y2="113.2" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="204.5" y1="111.0" x2="200.6" y2="108.8" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><rect x="206.0" y="97.0" width="75.0" height="28.0" rx="6" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1"/><text x="243.5" y="114.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">毛细血管</text><line x1="282.5" y1="111.0" x2="291.5" y2="111.0" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="291.5" y1="111.0" x2="287.6" y2="113.2" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="291.5" y1="111.0" x2="287.6" y2="108.8" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><rect x="293.0" y="97.0" width="75.0" height="28.0" rx="6" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1"/><text x="330.5" y="114.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">静脉</text><rect x="18.0" y="153.0" width="364.0" height="24.0" rx="6" fill="#e2f5f2"/><text x="25.0" y="169.0" font-size="11" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">血管类型</text><text x="119.6" y="169.0" font-size="11" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">代表</text><text x="207.0" y="169.0" font-size="11" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">主要功能</text><line x1="18.0" y1="219.0" x2="382.0" y2="219.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="25.0" y="195.0" font-size="12.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">弹性贮器血管</text><text x="119.6" y="195.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">主动脉、肺动</text><text x="119.6" y="211.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">脉</text><text x="207.0" y="195.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">弹性好，缓冲收缩压、维持舒张</text><text x="207.0" y="211.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">压（形成脉搏）</text><line x1="18.0" y1="261.0" x2="382.0" y2="261.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="25.0" y="237.0" font-size="12.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">阻力血管</text><text x="119.6" y="237.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">小动脉、微动</text><text x="119.6" y="253.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">脉</text><text x="207.0" y="237.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">外周阻力主要来源，决定舒张压</text><line x1="18.0" y1="287.0" x2="382.0" y2="287.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="25.0" y="279.0" font-size="12.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">交换血管</text><text x="119.6" y="279.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">毛细血管</text><text x="207.0" y="279.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">仅一层内皮，物质交换的场所</text><line x1="18.0" y1="329.0" x2="382.0" y2="329.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="25.0" y="305.0" font-size="12.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">容量血管</text><text x="119.6" y="305.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">静脉系统</text><text x="207.0" y="305.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">容纳 60%~70% 血量，是血液贮</text><text x="207.0" y="321.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">存库</text><rect x="18.0" y="337.0" width="364.0" height="222.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="355.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">静脉回流的四个助力</text><rect x="30.0" y="365.0" width="3.0" height="15.0" rx="1.5" fill="#2f8f57"/><text x="39.0" y="378.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肌肉泵</text><text x="347.0" y="378.0" text-anchor="end" font-size="12" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">挤压</text><text x="39.0" y="396.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">骨骼肌收缩挤压静脉，瓣膜保证单向回流</text><rect x="30.0" y="406.0" width="3.0" height="15.0" rx="1.5" fill="#1f6fb2"/><text x="39.0" y="419.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">呼吸泵</text><text x="347.0" y="419.0" text-anchor="end" font-size="12" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">吸气</text><text x="39.0" y="437.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胸腔负压增大→静脉回流↑（吸气时回心血量</text><text x="39.0" y="453.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">增多）</text><rect x="30.0" y="463.0" width="3.0" height="15.0" rx="1.5" fill="#7b4bb7"/><text x="39.0" y="476.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">心脏抽吸</text><text x="347.0" y="476.0" text-anchor="end" font-size="12" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">舒张期</text><text x="39.0" y="494.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">心室舒张抽吸心房与大静脉血</text><rect x="30.0" y="504.0" width="3.0" height="15.0" rx="1.5" fill="#4a5a6b"/><text x="39.0" y="517.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">体位与重力</text><text x="347.0" y="517.0" text-anchor="end" font-size="12" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">低位</text><text x="39.0" y="535.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">久站下肢静脉压升高→易水肿；卧位回心血量</text><text x="39.0" y="551.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">↑</text><rect x="18.0" y="571.0" width="364.0" height="70.0" rx="8" fill="#eef2f7"/><rect x="18.0" y="571.0" width="3.5" height="70.0" rx="1.8" fill="#4a5a6b"/><text x="32.0" y="591.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="608.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">外周阻力看小动脉、物质交换看毛细血管、血压的「血库」</text><text x="32.0" y="627.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">看静脉；静脉回流靠肌肉泵＋呼吸泵＋瓣膜。</text></svg>