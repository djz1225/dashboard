ily="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">造成移码</text><rect x="11.0" y="398.0" width="308.0" height="51.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="165.0" y="413.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">HR 精确但限 S/G2（需模板）；NHEJ 快但易错、</text><text x="165.0" y="428.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">全周期可用</text></svg>