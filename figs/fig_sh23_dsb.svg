<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 515" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="双链断裂：用不用模板，决定走 HR 还是 NHEJ"><title>双链断裂：用不用模板，决定走 HR 还是 NHEJ</title><desc>双链断裂修复分两路：HR（同源重组）需要姐妹染色单体作模板，只在 S/G2 期可用，精确但慢，关键蛋白为 BRCA1/2 与 RAD51；NHEJ（非同源末端连接）不需模板、全周期可用（G1 期唯一选择），快但易产生缺失或插入，关键蛋白为 Ku70/80 与 DNA-PK。两者互补才既保精确又不留缺口；CRISPR 敲除正是利用 NHEJ 的易错性。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">双链断裂：用不用模板，决定走 HR 还是 NHEJ</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">HR 精确但要有姐妹染色单体（S/G2）；NHEJ 全周期可用但</text><text x="18.0" y="68.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">易出错</text><rect x="18.0" y="82.0" width="177.0" height="124.0" rx="9" fill="#e6f6ec" stroke="#2f8f57" stroke-width="1.1"/><text x="29.0" y="103.0" font-size="12.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">HR｜同源重组</text><text x="29.0" y="122.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">需要模板：姐妹染色单体</text><text x="29.0" y="142.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">仅 S / G2 期可用</text><text x="29.0" y="162.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">精确无误，保真度高</text><text x="29.0" y="182.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">关键：BRCA1/2、RAD51</text><rect x="205.0" y="82.0" width="177.0" height="124.0" rx="9" fill="#fef3c7" stroke="#b45309" stroke-width="1.1"/><text x="216.0" y="103.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">NHEJ｜非同源末端连接</text><text x="216.0" y="122.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">不需要模板</text><text x="216.0" y="142.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">全周期可用（G1 只能靠它）</text><text x="216.0" y="162.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">快，但易缺失/插入</text><text x="216.0" y="182.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">关键：Ku70/80、DNA-PK</text><rect x="18.0" y="216.0" width="364.0" height="197.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="235.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">为什么必须两条并存</text><rect x="30.0" y="246.0" width="3.0" height="15.0" rx="1.5" fill="#b45309"/><text x="39.0" y="259.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">G1 期</text><text x="362.0" y="259.0" text-anchor="end" font-size="12" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">只能 NHEJ</text><text x="39.0" y="277.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">没有姐妹染色单体可作模板 → 先接上再说，</text><text x="39.0" y="293.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">代价是序列易错</text><rect x="30.0" y="302.0" width="3.0" height="15.0" rx="1.5" fill="#2f8f57"/><text x="39.0" y="315.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">S / G2 期</text><text x="362.0" y="315.0" text-anchor="end" font-size="12" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">优先 HR</text><text x="39.0" y="333.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">刚复制出的姐妹染色单体就在旁边 → 精确还</text><text x="39.0" y="349.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">原原序列</text><rect x="30.0" y="358.0" width="3.0" height="15.0" rx="1.5" fill="#0f766e"/><text x="39.0" y="371.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">缺一不可</text><text x="362.0" y="371.0" text-anchor="end" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">两条都要并存</text><text x="39.0" y="389.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">只有 NHEJ → 基因组持续丢信息；只有</text><text x="39.0" y="405.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">HR → G1 期断裂无人修</text><rect x="18.0" y="425.0" width="364.0" height="70.0" rx="8" fill="#e2f5f2"/><rect x="18.0" y="425.0" width="3.5" height="70.0" rx="1.8" fill="#0f766e"/><text x="32.0" y="445.0" font-size="11.5" font-weight="700" fill="#0f766e" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="462.0" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">CRISPR 敲除正是利用 NHEJ 的易错性造成移码；HR 缺</text><text x="32.0" y="481.0" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">陷（BRCA）肿瘤则对 PARP 抑制剂敏感。</text></svg>