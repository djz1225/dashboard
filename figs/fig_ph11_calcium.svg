nkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">促进肾 1α-羟化酶 → 活化</text><text x="29.0" y="427.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">维生素 D</text><text x="29.0" y="447.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">骨、肾、肠三个靶器官都动员</text><rect x="205.0" y="335.0" width="177.0" height="136.0" rx="9" fill="#f2ecfb" stroke="#7b4bb7" stroke-width="1.1"/><text x="216.0" y="356.0" font-size="12.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">维生素 D 的关键点</text><text x="216.0" y="375.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">升钙、也升磷（促肠道</text><text x="216.0" y="391.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">吸收两者）</text><text x="216.0" y="411.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">缺乏 → 佝偻病（儿童）、</text><text x="216.0" y="427.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">骨软化症</text><text x="216.0" y="447.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">需经肝、肾两次羟化才有活性</text><rect x="18.0" y="481.0" width="364.0" height="70.0" rx="8" fill="#eef2f7"/><rect x="18.0" y="481.0" width="3.5" height="70.0" rx="1.8" fill="#4a5a6b"/><text x="32.0" y="501.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" 