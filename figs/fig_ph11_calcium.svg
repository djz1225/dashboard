<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 571" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="钙磷代谢的调节：三种激素、三个靶器官"><title>钙磷代谢的调节：三种激素、三个靶器官</title><desc>PTH 通过骨、肾、肠使血钙升高、血磷降低，并激活 1α-羟化酶；1,25-(OH)₂-D₃ 促肠吸收钙磷，升钙也升磷；降钙素抑制破骨细胞使血钙下降；三者构成双向负反馈。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">钙磷代谢的调节：三种激素、三个靶器官</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">PTH 升钙降磷，降钙素降钙，维生素 D 升钙又升磷</text><rect x="18.0" y="65.0" width="364.0" height="23.0" rx="6" fill="#e2f5f2"/><text x="25.0" y="81.0" font-size="11" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">激素</text><text x="141.5" y="81.0" font-size="11" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">靶器官效应</text><text x="301.6" y="81.0" font-size="11" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">血钙/血磷</text><line x1="18.0" y1="129.0" x2="382.0" y2="129.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="25.0" y="106.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">甲状旁腺激素 PTH</text><text x="141.5" y="106.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">骨：溶骨↑；肾：保钙排磷</text><text x="141.5" y="122.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">＋促 1α-羟化；肠：间接</text><text x="301.6" y="106.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">血钙↑ </text><text x="301.6" y="122.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">血磷↓</text><line x1="18.0" y1="170.0" x2="382.0" y2="170.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="25.0" y="147.0" font-size="12.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">1,25-(OH)₂-D₃</text><text x="141.5" y="147.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肠：促钙结合蛋白合成、吸</text><text x="141.5" y="163.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">收钙磷；骨：溶骨</text><text x="301.6" y="147.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">血钙↑ </text><text x="301.6" y="163.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">血磷↑</text><line x1="18.0" y1="211.0" x2="382.0" y2="211.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="25.0" y="188.0" font-size="12.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">降钙素 CT</text><text x="141.5" y="188.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">骨：抑制破骨细胞；肾：</text><text x="141.5" y="204.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">排钙排磷</text><text x="301.6" y="188.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">血钙↓ </text><text x="301.6" y="204.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">血磷↓</text><rect x="18.0" y="219.0" width="364.0" height="104.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="237.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">负反馈闭环</text><text x="30.0" y="257.0" font-size="12" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">血钙的调节回路（以血钙↓ 为例）</text><rect x="30.0" y="265.0" width="70.8" height="24.0" rx="5" fill="#e2f5f2" stroke="#0f766e" stroke-width="1"/><text x="65.4" y="281.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">血钙↓</text><line x1="102.2" y1="277.0" x2="110.2" y2="277.0" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="110.2" y1="277.0" x2="106.3" y2="279.2" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="110.2" y1="277.0" x2="106.3" y2="274.8" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><rect x="111.8" y="265.0" width="70.8" height="24.0" rx="5" fill="#e2f5f2" stroke="#0f766e" stroke-width="1"/><text x="147.1" y="281.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">PTH↑</text><line x1="184.0" y1="277.0" x2="192.0" y2="277.0" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="192.0" y1="277.0" x2="188.1" y2="279.2" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="192.0" y1=