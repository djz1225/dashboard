<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 603" width="100%" style="max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px" role="img"><text x="165.0" y="22.6" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">血氨：两来源 三去路</text><text x="165.0" y="43.0" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">氨有毒，必须马上处理</text><rect x="15.0" y="58.0" width="146.5" height="60.0" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.3"/><text x="24.0" y="76.0" text-anchor="start" font-size="12.2" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">来源 ①</text><text x="24.0" y="93.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">氨基酸脱氨基（最主要）</text><rect x="168.5" y="58.0" width="146.5" height="60.0" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.3"/><text x="177.5" y="76.0" text-anchor="start" font-size="12.2" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">来源 ②</text><text x="177.5" y="93.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">肠道细菌产氨（未被吸收</text><text x="177.5" y="108.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">的氨基酸与尿素被分解）</text><rect x="15.0" y="127.0" width="300.0" height="60.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><rect x="15.0" y="127.0" width="4.5" height="60.0" rx="2.2" fill="#0f766e"/><text x="29.0" y="146.0" text-anchor="start" font-size="14" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">去路 ① 合成尿素</text><text x="29.0" y="163.0" text-anchor="start" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">肝，最主要（占 80% 以上）</text><text x="29.0" y="178.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">尿素经肾排出</text><rect x="15.0" y="191.0" width="300.0" height="60.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><rect x="15.0" y="191.0" width="4.5" height="60.0" rx="2.2" fill="#b45309"/><text x="29.0" y="210.0" text-anchor="start" font-size="14" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">去路 ② 合成谷氨酰胺</text><text x="29.0" y="227.0" text-anchor="start" font-size="12" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">脑、肌；谷氨酰胺是氨的无毒运输形式</text><text x="29.0" y="242.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">到肝/肾再释放</text><rect x="15.0" y="255.0" width="300.0" height="60.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><rect x="15.0" y="255.0" width="4.5" height="60.0" rx="2.2" fill="#15803d"/><text x="29.0" y="274.0" text-anchor="start" font-size="14" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">去路 ③ 直接排铵盐</text><text x="29.0" y="291.0" text-anchor="start" font-size="12" font-weight="700" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">肾小管上皮分泌 NH₄⁺ 随尿排</text><text x="29.0" y="306.0" text-anchor="start" font-size="11.2" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">兼调节酸碱平衡</text><rect x="15.0" y="321.0" width="300.0" height="134.0" rx="7" fill="#fee2e2" stroke="#cbd5e1" stroke-width="1.4"/><text x="25.0" y="340.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">肝性脑病的生化基础</text><text x="25.0" y="358.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 肝功能衰竭或门体分流 → 血氨不能变尿素 </text><text x="25.0" y="374.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">→ 氨入脑</text><text x="25.0" y="390.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 氨与谷氨酸结合成谷氨酰胺 → 消耗谷氨酸 </text><text x="25.0" y="406.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">→ 影响神经递质</text><text x="25.0" y="422.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 治疗：乳果糖酸化肠道（减少氨吸收）、</text><text x="25.0" y="438.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">谷氨酸/精氨酸降氨、限制蛋白</text><rect x="15.0" y="463.0" width="300.0" height="76.0" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/><text x="25.0" y="479.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">易错：氨的主要去路是合成尿素，不是「直接</text><text x="25.0" y="495.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">由肾排氨」</text><text x="25.0" y="511.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">谷氨酰胺是氨的运输形式而不是终产物——到肝/</text><text x="25.0" y="527.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">肾还要再释放</text><rect x="11.0" y="544.0" width="308.0" height="51.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="165.0" y="559.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">血氨两来源三去路，合成尿素是主路；肝功能衰</text><text x="165.0" y="574.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">竭 → 氨入脑 → 肝性脑病</text></svg>