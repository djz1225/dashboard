<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 511" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="血氨：两来源、三去路"><title>血氨：两来源、三去路</title><desc>血氨主要来自氨基酸脱氨基与肠道细菌分解未被吸收的氨基酸和尿素；去路是在肝合成尿素（占 80% 以上）、合成谷氨酰胺作为脑与肌的无毒运输形式，以及肾小管上皮分泌 NH₄⁺ 随尿排出兼调节酸碱平衡。肝功能衰竭时血氨不能变尿素而进入脑，是肝性脑病的生化基础。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">血氨：两来源、三去路</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">氨有毒，主要去路是合成尿素（占 80% 以上），不是直接由</text><text x="18.0" y="68.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肾排氨</text><rect x="18.0" y="82.0" width="177.0" height="136.0" rx="9" fill="#fef3c7" stroke="#b45309" stroke-width="1.1"/><text x="29.0" y="103.0" font-size="12.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">来源｜2 条</text><text x="29.0" y="122.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">① 氨基酸脱氨基（最主要）</text><text x="29.0" y="142.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">② 肠道细菌产氨：分解未吸</text><text x="29.0" y="158.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">收的氨基酸与尿素</text><rect x="205.0" y="82.0" width="177.0" height="136.0" rx="9" fill="#e6f6ec" stroke="#2f8f57" stroke-width="1.1"/><text x="216.0" y="103.0" font-size="12.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">去路｜3 条</text><text x="216.0" y="122.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">① 肝合成尿素（80% 以上）</text><text x="216.0" y="142.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">② 合成谷氨酰胺（脑、肌的</text><text x="216.0" y="158.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">无毒运输形式）</text><text x="216.0" y="178.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">③ 肾小管分泌 NH₄⁺ </text><text x="216.0" y="194.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">随尿排出</text><rect x="18.0" y="228.0" width="364.0" height="181.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="247.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肝性脑病的生化基础</text><rect x="30.0" y="258.0" width="3.0" height="15.0" rx="1.5" fill="#c0392b"/><text x="39.0" y="271.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肝衰竭或门体分流</text><text x="370.0" y="271.0" text-anchor="end" font-size="12" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">氨入脑</text><text x="39.0" y="289.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">血氨不能变尿素 → 氨入脑 → 肝性脑病</text><rect x="30.0" y="298.0" width="3.0" height="15.0" rx="1.5" fill="#b45309"/><text x="39.0" y="311.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">氨对脑的毒性</text><text x="370.0" y="311.0" text-anchor="end" font-size="12" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">耗谷氨酸</text><text x="39.0" y="329.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">氨 + 谷氨酸 → 谷氨酰胺，消耗谷氨酸，影响</text><text x="39.0" y="345.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">神经递质</text><rect x="30.0" y="354.0" width="3.0" height="15.0" rx="1.5" fill="#2f8f57"/><text x="39.0" y="367.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">治疗思路</text><text x="370.0" y="367.0" text-anchor="end" font-size="12" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">降氨</text><text x="39.0" y="385.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">乳果糖酸化肠道减少吸收；谷氨酸 / 精氨酸降氨；</text><text x="39.0" y="401.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">限制蛋白</text><rect x="18.0" y="421.0" width="364.0" height="70.0" rx="8" fill="#e2f5f2"/><rect x="18.0" y="421.0" width="3.5" height="70.0" rx="1.8" fill="#0f766e"/><text x="32.0" y="441.0" font-size="11.5" font-weight="700" fill="#0f766e" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">易错</text><text x="32.0" y="458.0" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">谷氨酰胺是氨的运输形式而不是终产物——到肝、肾还要</text><text x="32.0" y="477.0" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">再释放出氨。</text></svg>