 font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">刺激</text><text x="77.0" y="266.0" text-anchor="start" font-size="13" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">蛋白产物、脂肪酸</text><text x="24.0" y="282.0" text-anchor="start" font-size="13" font-weight="600" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">作用</text><text x="77.0" y="282.0" text-anchor="start" font-size="13" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">促胆囊收缩、促胰酶分泌</text><rect x="15.0" y="294.0" width="300.0" height="76.0" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/><text x="25.0" y="310.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">促胰液素＝「酸来了，快送碱」；CCK＝「脂肪</text><text x="25.0" y="326.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">蛋白来了，快送酶、快挤胆囊」</text><text x="25.0" y="342.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">胃泌素与 CCK 结构相近（同属缩胆囊素族），</text><text x="25.0" y="358.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">但作用完全不同</text><rect x="11.0" y="373.0" width="308.0" height="51.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="165.0" y="388.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">胃泌素管酸、促胰液素管碱、CCK 管酶和胆囊——</text><text x="165.0" y="403.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">按「送什么」记</text></svg>