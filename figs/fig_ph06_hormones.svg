<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 556" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="胃肠激素三家"><title>胃肠激素三家</title><desc>胃泌素由胃窦 G 细胞分泌，被蛋白产物、胃扩张与迷走刺激，促胃酸与黏膜生长；促胰液素由十二指肠 S 细胞分泌，盐酸是最强刺激，促胰液 HCO₃⁻；CCK 由 I 细胞分泌，促胆囊收缩与胰酶分泌。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胃肠激素三家：胃泌素 / 促胰液素 / CCK</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">按「谁分泌、被什么刺激、管什么」记</text><rect x="18.0" y="65.0" width="364.0" height="199.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="83.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">三家的分工</text><rect x="30.0" y="93.0" width="316.0" height="23.0" rx="6" fill="#e2f5f2"/><text x="37.0" y="109.0" font-size="10.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">激素</text><text x="119.2" y="109.0" font-size="10.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">来源细胞</text><text x="201.3" y="109.0" font-size="10.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">主要刺激</text><text x="277.2" y="109.0" font-size="10.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">主要作用</text><line x1="30.0" y1="170.0" x2="346.0" y2="170.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="37.0" y="132.0" font-size="11.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胃泌素</text><text x="119.2" y="132.0" font-size="11" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">G 细胞（胃窦）</text><text x="201.3" y="132.0" font-size="11" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">蛋白产物、</text><text x="201.3" y="147.0" font-size="11" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胃扩张、迷</text><text x="201.3" y="162.0" font-size="11" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">走神经</text><text x="277.2" y="132.0" font-size="11" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">促胃酸、促</text><text x="277.2" y="147.0" font-size="11" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">黏膜生长</text><line x1="30.0" y1="209.0" x2="346.0" y2="209.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="37.0" y="186.0" font-size="11.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">促胰液素</text><text x="119.2" y="186.0" font-size="11" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">S 细胞（</text><text x="119.2" y="201.0" font-size="11" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">十二指肠）</text><text x="201.3" y="186.0" font-size="11" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">盐酸（最强）</text><text x="201.3" y="201.0" font-size="11" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">、脂肪酸</text><text x="277.2" y="186.0" font-size="11" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">促胰液大量</text><text x="277.2" y="201.0" font-size="11" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">分泌 HCO₃⁻</text><line x1="30.0" y1="248.0" x2="346.0" y2="248.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="37.0" y="225.0" font-size="11.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">缩胆囊素 </text><text x="37.0" y="240.0" font-size="11.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">CCK</text><text x="119.2" y="225.0" font-size="11" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">I 细胞（</text><text x="119.2" y="240.0" font-size="11" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">十二指肠）</text><text x="201.3" y="225.0" font-size="11" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">蛋白产物、</text><text x="201.3" y="240.0" font-size="11" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">脂肪酸</text><text x="277.2" y="225.0" font-size="11" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">促胆囊收缩、</text><text x="277.2" y="240.0" font-size="11" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">促胰酶分泌</text><rect x="18.0" y="276.0" width="177.0" height="84.0" rx="9" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1.1"/><text x="29.0" y="297.0" font-size="12.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">促胰液素＝送碱</text><text x="29.0" y="316.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">酸进十二指肠</text><text x="29.0" y="336.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">→ 胰液大量 HCO₃⁻ 中和</text><rect x="205.0" y="276.0" width="177.0" height="84.0" rx="9" fill="#f2ecfb" stroke="#7b4bb7" stroke-width="1.1"/><text x="216.0" y="297.0" font-size="12.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">CCK＝送酶＋挤胆囊</text><text x="216.0" y="316.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">脂肪蛋白进十二指肠</text><text x="216.0" y="336.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">→ 胰酶↑、胆囊收缩</text><rect x="18.0" y="370.0" width="177.0" height="84.0" rx="9" fill="#fdeceb" stroke="#c0392b" stroke-width="1.1"/><text x="29.0" y="391.0" font-size="12.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胃泌素＝管酸</text><text x="29.0" y="410.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">蛋白产物、胃扩张、迷走</text><text x="29.0" y="430.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">→ 胃酸↑、黏膜生长</text><rect x="205.0" y="370.0" width="177.0" height="84.0" rx="9" fill="#eef2f7" stroke="#4a5a6b" stroke-width="1.1"/><text x="216.0" y="391.0" font-size="12.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">同族不同命</text><text x="216.0" y="410.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">胃泌素与 CCK 结构相近</text><text x="216.0" y="430.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">作用却完全不同</text><rect x="18.0" y="466.0" width="364.0" height="70.0" rx="8" fill="#eef2f7"/><rect x="18.0" y="466.0" width="3.5" height="70.0" rx="1.8" fill="#4a5a6b"/><text x="32.0" y="486.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="503.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话串起来：胃泌素管酸、促胰液素管碱、CCK 管酶</text><text x="32.0" y="522.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">和胆囊——按「送什么」记最牢。</text></svg>