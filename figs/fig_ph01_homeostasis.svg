<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 643" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="内环境与稳态"><title>内环境与稳态</title><desc>内环境即细胞外液（占体重约 20%），由血浆、组织液、淋巴、脑脊液构成；稳态是围绕调定点的动态平衡，经扰动—检测—纠正三步维持。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">内环境与稳态</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">内环境＝细胞外液；稳态＝围绕调定点的动态平衡</text><rect x="18.0" y="59.0" width="3.0" height="14.0" rx="1.5" fill="#0f766e"/><text x="28.0" y="69.0" font-size="13.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">体液分布（约占体重 60%）</text><rect x="18.0" y="81.0" width="364.0" height="114.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="99.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">占体重比例</text><rect x="30.0" y="109.0" width="210.8" height="30.0" rx="6" fill="#eef2f7" stroke="#4a5a6b" stroke-width="1.1"/><rect x="240.8" y="109.0" width="105.2" height="30.0" rx="6" fill="#e2f5f2" stroke="#0f766e" stroke-width="1.1"/><text x="135.4" y="129.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">细胞内液 40%</text><text x="293.4" y="129.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">细胞外液 20%</text><text x="30.0" y="159.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">细胞外液＝内环境：血浆 + 组织液 + 淋巴 + 脑脊液（血</text><text x="30.0" y="176.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">浆只是内环境的一部分）</text><rect x="18.0" y="201.0" width="3.0" height="14.0" rx="1.5" fill="#2f8f57"/><text x="28.0" y="211.0" font-size="13.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">稳态：不是「不变」，是「波动中稳定」</text><rect x="18.0" y="223.0" width="177.0" height="136.0" rx="9" fill="#fdeceb" stroke="#c0392b" stroke-width="1.1"/><text x="29.0" y="244.0" font-size="12.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">不是：恒定不变</text><text x="29.0" y="263.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">把稳态理解成某个数值</text><text x="29.0" y="279.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">绝对不动</text><text x="29.0" y="299.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">把内环境理解成「细胞内液」</text><text x="29.0" y="319.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">血浆只是内环境的一部分，</text><text x="29.0" y="335.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">不是全部</text><rect x="205.0" y="223.0" width="177.0" height="136.0" rx="9" fill="#e6f6ec" stroke="#2f8f57" stroke-width="1.1"/><text x="216.0" y="244.0" font-size="12.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">而是：动态平衡</text><text x="216.0" y="263.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">某指标围绕调定点小幅波动</text><text x="216.0" y="283.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">靠调节系统持续纠偏维持</text><text x="216.0" y="303.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一旦调节失效 → 稳态破坏 </text><text x="216.0" y="319.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">→ 疾病</text><rect x="18.0" y="369.0" width="364.0" height="46.0" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.1"/><rect x="18.0" y="369.0" width="3.5" height="46.0" rx="1.8" fill="#b45309"/><circle cx="38" cy="387" r="9.5" fill="#b45309"/><text x="38.0" y="391.0" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">1</text><text x="56.0" y="391.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">扰动</text><text x="370.0" y="391.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">起点</text><text x="56.0" y="409.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">外环境变化、进食、运动使某指标偏离调定点</text><line x1="38.0" y1="417.0" x2="38.0" y2="433.0" stroke="#4a5a6b" stroke-width="2" stroke-linecap="round"/><line x1="38.0" y1="433.0" x2="34.2" y2="426.0" stroke="#4a5a6b" stroke-width="2" stroke-linecap="round"/><line x1="38.0" y1="433.0" x2="41.8" y2="426.0" stroke="#4a5a6b" stroke-width="2" stroke-linecap="round"/><rect x="18.0" y="435.0" width="364.0" height="46.0" rx="8" fill="#e6f6ec" stroke="#2f8f57" stroke-width="1.1"/><rect x="18.0" y="435.0" width="3.5" height="46.0" rx="1.8" fill="#2f8f57"/><circle cx="38" cy="453" r="9.5" fill="#2f8f57"/><text x="38.0" y="457.0" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">2</text><text x="56.0" y="457.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">检测</text><text x="370.0" y="457.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">感受器</text><text x="56.0" y="475.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">感受器感知偏差（如颈动脉体感受 PO₂）</text><line x1="38.0" y1="483.0" x2="38.0" y2="499.0" stroke="#4a5a6b" stroke-width="2" stroke-linecap="round"/><line x1="38.0" y1="499.0" x2="34.2" y2="492.0" stroke="#4a5a6b" stroke-width="2" stroke-linecap="round"/><line x1="38.0" y1="499.0" x2="41.8" y2="492.0" stroke="#4a5a6b" stroke-width="2" stroke-linecap="round"/><rect x="18.0" y="501.0" width="364.0" height="46.0" rx="8" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1.1"/><rect x="18.0" y="501.0" width="3.5" height="46.0" rx="1.8" fill="#1f6fb2"/><circle cx="38" cy="519" r="9.5" fill="#1f6fb2"/><text x="38.0" y="523.0" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">3</text><text x="56.0" y="523.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">纠正</text><text x="370.0" y="523.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">效应器</text><text x="56.0" y="541.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">效应器反向调整，把指标拉回调定点</text><rect x="18.0" y="553.0" width="364.0" height="70.0" rx="8" fill="#eef2f7"/><rect x="18.0" y="553.0" width="3.5" height="70.0" rx="1.8" fill="#4a5a6b"/><text x="32.0" y="573.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="590.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">内环境＝细胞外液（约占体重 20%）；稳态＝围绕调定</text><text x="32.0" y="609.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">点的动态平衡，靠负反馈持续纠偏。</text></svg>