<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 494" width="100%" style="max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px" role="img"><text x="165.0" y="22.6" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">内环境与稳态</text><text x="165.0" y="43.0" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">内环境＝细胞外液；稳态＝动态平衡，不是不变</text><text x="15.0" y="73.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">体液分布（占体重约 60%）</text><rect x="15.0" y="82.0" width="300.0" height="34.0" rx="5" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.4"/><rect x="15.0" y="82.0" width="200.0" height="34.0" rx="5" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.4"/><rect x="217.0" y="82.0" width="98.0" height="34.0" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/><text x="115.0" y="104.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">细胞内液 40%</text><text x="266.0" y="104.0" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">细胞外液</text><rect x="15.0" y="122.0" width="300.0" height="42.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="27.0" y="142.0" text-anchor="start" font-size="14" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">细胞外液 = 内环境</text><text x="305.0" y="142.0" text-anchor="end" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">20%</text><text x="27.0" y="159.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">血浆 + 组织液 + 淋巴 + 脑脊液</text><rect x="15.0" y="174.0" width="146.0" height="58.0" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/><text x="88.0" y="193.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">❌ 不是这个</text><text x="88.0" y="210.0" text-anchor="middle" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">恒定不变、静止</text><rect x="169.0" y="174.0" width="146.0" height="58.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/><text x="242.0" y="193.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">✓ 是这个</text><text x="242.0" y="210.0" text-anchor="middle" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">动态平衡，围绕调定</text><text x="242.0" y="224.0" text-anchor="middle" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">点波动</text><rect x="15.0" y="240.0" width="300.0" height="54.0" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/><text x="27.0" y="260.0" text-anchor="start" font-size="14" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">① 扰动</text><text x="27.0" y="278.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">外环境变化 / 进食 / 运动使某指标偏离调定</text><text x="27.0" y="294.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">点</text><line x1="165.0" y1="295.0" x2="165.0" y2="296.5" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/><polygon points="165.0,301.0 163.0,296.4 167.0,296.4" fill="#64748b"/><rect x="15.0" y="302.0" width="300.0" height="38.0" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/><text x="27.0" y="322.0" text-anchor="start" font-size="14" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">② 检测</text><text x="27.0" y="340.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">感受器感知偏差（如颈动脉体感受 PO₂）</text><line x1="165.0" y1="341.0" x2="165.0" y2="342.5" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/><polygon points="165.0,347.0 163.0,342.4 167.0,342.4" fill="#64748b"/><rect x="15.0" y="348.0" width="300.0" height="38.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/><text x="27.0" y="368.0" text-anchor="start" font-size="14" font-weight="700" fill="#15803d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">③ 纠正</text><text x="27.0" y="386.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">效应器反向调整，把指标拉回调定点</text><rect x="15.0" y="388.0" width="300.0" height="44.0" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/><text x="25.0" y="404.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">易错：内环境只指细胞外液，血浆只是其中一</text><text x="25.0" y="420.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">部分</text><rect x="11.0" y="435.0" width="308.0" height="51.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="165.0" y="450.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">内环境＝细胞外液（占体重 20%）；稳态＝围绕</text><text x="165.0" y="465.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">调定点的动态平衡</text></svg>