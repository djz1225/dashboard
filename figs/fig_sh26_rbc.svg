<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 595" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="红细胞代谢：无核无线粒体，只能糖酵解"><title>红细胞代谢：无核无线粒体，只能糖酵解</title><desc>红细胞无核、无线粒体，不能进行三羧酸循环与氧化磷酸化，只能靠糖酵解供能：主路产 2 ATP 维持离子泵与膜完整性。另有两支路：Rapoport-Luebering 支路占糖酵解通量的 20~25%，生成 2,3-BPG 调节血红蛋白氧亲和力（消耗 1 个 ATP）；磷酸戊糖途径占 5~10%，产 NADPH 供谷胱甘肽还原酶使用，保护血红蛋白与膜脂。三条通路缺一不可。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">红细胞代谢：无核无线粒体，只能糖酵解</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">主路产 2 ATP 维持离子泵；两条支路分别管「放氧调节」与</text><text x="18.0" y="68.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">「抗氧化」</text><rect x="18.0" y="82.0" width="364.0" height="165.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="101.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一条主路 + 两条支路</text><rect x="30.0" y="114.0" width="102.0" height="27.0" rx="6" fill="#fdeceb" stroke="#c0392b" stroke-width="1"/><text x="81.0" y="132.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">葡萄糖</text><line x1="133.5" y1="127.5" x2="143.5" y2="127.5" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="143.5" y1="127.5" x2="139.6" y2="129.7" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="143.5" y1="127.5" x2="139.6" y2="125.3" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><rect x="145.0" y="114.0" width="102.0" height="27.0" rx="6" fill="#fdeceb" stroke="#c0392b" stroke-width="1"/><text x="196.0" y="132.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">糖酵解（胞质）</text><line x1="248.5" y1="127.5" x2="258.5" y2="127.5" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="258.5" y1="127.5" x2="254.6" y2="129.7" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="258.5" y1="127.5" x2="254.6" y2="125.3" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><rect x="260.0" y="114.0" width="102.0" height="27.0" rx="6" fill="#fdeceb" stroke="#c0392b" stroke-width="1"/><text x="311.0" y="132.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">丙酮酸 → 乳酸</text><rect x="30.0" y="161.0" width="161.0" height="32.0" rx="6" fill="#fde8dd" stroke="#c1440e" stroke-width="1.1"/><text x="40.0" y="175.0" font-size="12" font-weight="700" fill="#c1440e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">R-L 支路</text><text x="40.0" y="188.0" font-size="11.5" font-weight="400" fill="#c1440e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">→ 2,3-BPG（20~25%）</text><rect x="201.0" y="161.0" width="161.0" height="32.0" rx="6" fill="#e2f5f2" stroke="#0f766e" stroke-width="1.1"/><text x="211.0" y="175.0" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">PPP</text><text x="211.0" y="188.0" font-size="11.5" font-weight="400" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">→ NADPH（5~10%）</text><line x1="196.0" y1="143.0" x2="196.0" y2="159.0" stroke="#8095a8" stroke-width="1.3" stroke-linecap="round"/><line x1="196.0" y1="159.0" x2="193.6" y2="154.6" stroke="#8095a8" stroke-width="1.3" stroke-linecap="round"/><line x1="196.0" y1="159.0" x2="198.4" y2="154.6" stroke="#8095a8" stroke-width="1.3" stroke-linecap="round"/><text x="30.0" y="205.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">净得 2 ATP，全部用于维持 Na⁺-K⁺ 泵与膜骨架；没有线粒体，</text><text x="30.0" y="222.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">不能彻底氧化，也不能靠脂肪酸供能。</text><rect x="18.0" y="259.0" width="364.0" height="234.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="278.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">四条通道各管什么</text><rect x="30.0" y="289.0" width="3.0" height="15.0" rx="1.5" fill="#c0392b"/><text x="39.0" y="302.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">主路 糖酵解</text><text x="362.0" y="302.0" text-anchor="end" font-size="12" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">90%</text><text x="39.0" y="320.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">1 葡萄糖 → 2 乳酸，净得 2 ATP（无氧也能进行）</text><rect x="30.0" y="328.0" width="3.0" height="15.0" rx="1.5" fill="#c1440e"/><text x="39.0" y="341.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">支路 ① R-L</text><text x="362.0" y="341.0" text-anchor="end" font-size="12" font-weight="700" fill="#c1440e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">20~25%</text><text x="39.0" y="359.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">1,3-BPG → 2,3-BPG；消耗 1 个 ATP 换「调</text><text x="39.0" y="375.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">节放氧」的能力</text><rect x="30.0" y="383.0" width="3.0" height="15.0" rx="1.5" fill="#0f766e"/><text x="39.0" y="396.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">支路 ② PPP</text><text x="362.0" y="396.0" text-anchor="end" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">5~10%</text><text x="39.0" y="414.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">产 NADPH，供谷胱甘肽还原酶还原 GSSG → 保</text><text x="39.0" y="430.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">护膜脂与血红蛋白</text><rect x="30.0" y="438.0" width="3.0" height="15.0" rx="1.5" fill="#4a5a6b"/><text x="39.0" y="451.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">缺什么</text><text x="362.0" y="451.0" text-anchor="end" font-size="12" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">无 TCA、无氧化磷酸化</text><text x="39.0" y="469.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">无线粒体 + 无核 → 不能彻底</text><text x="39.0" y="485.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">氧化、不能合成新蛋白</text><rect x="18.0" y="505.0" width="364.0" height="70.0" rx="8" fill="#fef3c7"/><rect x="18.0" y="505.0" width="3.5" height="70.0" rx="1.8" fill="#b45309"/><text x="32.0" y="525.0" font-size="11.5" font-weight="700" fill="#b45309" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">易错</text><text x="32.0" y="542.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">「红细胞只有糖酵解」不完整——必须说「糖酵解 +</text><text x="32.0" y="561.0" font-size="13.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">2,3-BPG 支路 + PPP」；缺 PPP 即 G6PD 缺乏性溶血。</text></svg>