<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 582" width="100%" style="max-width:330px;display:block;margin:0 auto;background:#ffffff;border-radius:10px" role="img"><text x="165.0" y="22.6" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">肾小球滤过：三个因素决定滤过量</text><text x="165.0" y="43.0" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">有效滤过压＝毛细血管压−（胶渗压＋囊内压）</text><rect x="15.0" y="60.0" width="300.0" height="52.0" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/><text x="165.0" y="80.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">有效滤过压 =</text><text x="165.0" y="100.0" text-anchor="middle" font-size="13" font-weight="400" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">毛细血管压 −（胶体渗透压＋囊内压）</text><rect x="15.0" y="118.0" width="300.0" height="44.0" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/><text x="27.0" y="138.0" text-anchor="start" font-size="14" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">肾小球毛细血管压 约 45 mmHg</text><text x="27.0" y="155.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">主要动力；受入球/出球小动脉舒缩调节</text><rect x="15.0" y="168.0" width="300.0" height="44.0" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="27.0" y="188.0" text-anchor="start" font-size="14" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">血浆胶体渗透压 约 25 mmHg</text><text x="27.0" y="205.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">阻力；大量输血浆/低蛋白时下降→滤过↑</text><rect x="15.0" y="218.0" width="300.0" height="44.0" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="27.0" y="238.0" text-anchor="start" font-size="14" font-weight="700" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">囊内压 约 10 mmHg</text><text x="27.0" y="255.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">阻力；尿路梗阻时升高→滤过↓</text><rect x="15.0" y="270.0" width="300.0" height="150.0" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="25.0" y="289.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">滤过膜三层与两个屏障</text><text x="25.0" y="307.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 三层：内皮细胞窗孔 → 基膜 → 足细胞裂孔</text><text x="25.0" y="323.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 机械屏障：按分子大小筛选（&gt;69 kDa 不</text><text x="25.0" y="339.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">能过）</text><text x="25.0" y="355.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 电学屏障：基膜带负电，排斥带负电的白蛋</text><text x="25.0" y="371.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">白</text><text x="25.0" y="387.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">· 故肾炎时白蛋白漏出（蛋白尿），因为负电</text><text x="25.0" y="403.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">荷丢失</text><rect x="15.0" y="428.0" width="300.0" height="92.0" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/><text x="25.0" y="444.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">三个因素的增减方向要能立刻判断：入球收缩→</text><text x="25.0" y="460.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">滤过↓；出球收缩→滤过↑</text><text x="25.0" y="476.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">肾血流量自身调节：动脉压 80~180 mmHg 时</text><text x="25.0" y="492.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">肾血流基本恒定（肌源学说）</text><text x="25.0" y="508.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#b91c1c" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">滤过分数 = 肾小球滤过率/肾血浆流量 ≈ 19%</text><rect x="11.0" y="523.0" width="308.0" height="51.0" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="165.0" y="538.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">有效滤过压=毛细血管压−(胶渗压+囊内压)；</text><text x="165.0" y="553.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">出球收缩使滤过↑，入球收缩使滤过↓</text></svg>