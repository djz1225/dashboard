<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 661" width="100%" style="max-width:400px;display:block;margin:0 auto;background:#ffffff;border-radius:12px" role="img" aria-label="肾小球滤过：三个压力、一道筛子"><title>肾小球滤过：三个压力、一道筛子</title><desc>有效滤过压＝肾小球毛细血管压−(血浆胶体渗透压＋囊内压)＝10 mmHg；滤过膜有机械与电学两层屏障，肾炎丢失负电荷导致蛋白尿；入球收缩滤过↓、出球收缩滤过↑。</desc><text x="18.0" y="26.0" font-size="17.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肾小球滤过：三个压力、一道筛子</text><text x="18.0" y="51.0" font-size="12.5" font-weight="400" fill="#8095a8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">有效滤过压＝动力−阻力；滤过膜带负电，先挡白蛋白</text><rect x="18.0" y="65.0" width="364.0" height="208.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="83.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">有效滤过压：两个阻力之和</text><text x="128.0" y="105.0" text-anchor="end" font-size="12" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肾小球毛细血管压</text><rect x="136.0" y="94.0" width="158.0" height="14.0" rx="3" fill="#fdeceb" stroke="#c0392b" stroke-width="1"/><text x="299.0" y="105.0" font-size="11.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">+45</text><text x="136.0" y="120.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">主要动力；入球/出球小动脉舒缩调节</text><text x="128.0" y="147.0" text-anchor="end" font-size="12" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">血浆胶体渗透压</text><rect x="136.0" y="136.0" width="87.8" height="14.0" rx="3" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1"/><text x="228.8" y="147.0" font-size="11.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">−25</text><text x="136.0" y="162.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">阻力；大量输血浆或低蛋白时↓→滤过↑</text><text x="128.0" y="189.0" text-anchor="end" font-size="12" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">囊内压</text><rect x="136.0" y="178.0" width="35.1" height="14.0" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1"/><text x="176.1" y="189.0" font-size="11.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">−10</text><text x="136.0" y="204.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">阻力；尿路梗阻时↑→滤过↓</text><line x1="30.0" y1="220.0" x2="346.0" y2="220.0" stroke="#e3eaf2" stroke-width="1" stroke-linecap="round"/><text x="30.0" y="238.0" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">有效滤过压 = 45 −（25+10）= 10 mmHg</text><text x="30.0" y="256.0" font-size="11.5" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">GFR 125 ml/min · 滤过分数 19% · 肾血浆流量 660</text><rect x="18.0" y="285.0" width="364.0" height="160.0" rx="9" fill="#f8fbfd" stroke="#e3eaf2" stroke-width="1.1"/><text x="30.0" y="303.0" font-size="11.5" font-weight="700" fill="#e3eaf2" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">滤过膜：两层屏障</text><text x="30.0" y="323.0" font-size="12" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">滤过膜三层（分子量 &gt;69 kDa 不能过）</text><rect x="30.0" y="331.0" width="98.0" height="24.0" rx="5" fill="#e2f5f2" stroke="#0f766e" stroke-width="1"/><text x="79.0" y="347.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">内皮窗孔</text><line x1="129.5" y1="343.0" x2="137.5" y2="343.0" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="137.5" y1="343.0" x2="133.6" y2="345.2" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="137.5" y1="343.0" x2="133.6" y2="340.8" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><rect x="139.0" y="331.0" width="98.0" height="24.0" rx="5" fill="#e2f5f2" stroke="#0f766e" stroke-width="1"/><text x="188.0" y="347.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">基膜</text><line x1="238.5" y1="343.0" x2="246.5" y2="343.0" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="246.5" y1="343.0" x2="242.6" y2="345.2" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><line x1="246.5" y1="343.0" x2="242.6" y2="340.8" stroke="#8095a8" stroke-width="1.2" stroke-linecap="round"/><rect x="248.0" y="331.0" width="98.0" height="24.0" rx="5" fill="#e2f5f2" stroke="#0f766e" stroke-width="1"/><text x="297.0" y="347.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">足细胞裂孔</text><rect x="31.0" y="367.0" width="3.0" height="15.0" rx="1.5" fill="#1f6fb2"/><text x="40.0" y="380.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">机械屏障</text><text x="344.0" y="380.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">按大小筛</text><text x="40.0" y="398.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">基膜是主要屏障，分子越大越难过</text><rect x="31.0" y="406.0" width="3.0" height="15.0" rx="1.5" fill="#b45309"/><text x="40.0" y="419.0" font-size="12.5" font-weight="700" fill="#16202e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">电学屏障</text><text x="344.0" y="419.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">带负电</text><text x="40.0" y="437.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">排斥白蛋白（也带负电）→ 肾炎时负电荷丢失→蛋白尿</text><rect x="18.0" y="457.0" width="177.0" height="104.0" rx="9" fill="#e8f2fb" stroke="#1f6fb2" stroke-width="1.1"/><text x="29.0" y="478.0" font-size="12.5" font-weight="700" fill="#1f6fb2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">入球小动脉收缩</text><text x="29.0" y="497.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肾血流量↓、毛细血管压↓</text><text x="29.0" y="517.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">有效滤过压↓ → GFR↓</text><text x="29.0" y="537.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">如：去甲肾上腺素、剧烈运动</text><rect x="205.0" y="457.0" width="177.0" height="104.0" rx="9" fill="#fdeceb" stroke="#c0392b" stroke-width="1.1"/><text x="216.0" y="478.0" font-size="12.5" font-weight="700" fill="#c0392b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">出球小动脉收缩</text><text x="216.0" y="497.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">肾血流量↓，但毛细血管压↑</text><text x="216.0" y="517.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">有效滤过压↑ → GFR↑</text><text x="216.0" y="537.0" font-size="12" font-weight="400" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">滤过分数↑（如：Ang Ⅱ）</text><rect x="18.0" y="571.0" width="364.0" height="70.0" rx="8" fill="#eef2f7"/><rect x="18.0" y="571.0" width="3.5" height="70.0" rx="1.8" fill="#4a5a6b"/><text x="32.0" y="591.0" font-size="11.5" font-weight="700" fill="#4a5a6b" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">一句话</text><text x="32.0" y="608.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">出球收缩使滤过↑、入球收缩使滤过↓——判断血压、药</text><text x="32.0" y="627.0" font-size="13.5" font-weight="700" fill="#4a5a6b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">物、神经影响的方向钥匙。</text></svg>