<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 556" role="img" aria-labelledby="ft fd" style="background:#ffffff"><title id="ft">神经退行性病变：同一逻辑，不同蛋白</title><desc id="fd">神经退行性疾病有共同机制：异常蛋白聚集、选择性神经元丢失与胶质反应，不同疾病只是蛋白种类与起始脑区不同。阿尔茨海默病有两个核心病理：APP 异常剪切产生的 Aβ42 在细胞外沉积成老年斑，是起始因素；tau 蛋白过度磷酸化在细胞内聚成神经原纤维缠结，其数量与痴呆程度的相关性比斑块更强。病变从内嗅皮层与海马开始向新皮层扩展，故最早表现为近事记忆障碍。帕金森病则由 α-突触核蛋白异常聚集形成 Lewy 小体，黑质致密部多巴胺神经元丢失，表现为静止性震颤、肌强直与运动迟缓。两者均属蛋白错误折叠病。</desc><text x="22" y="28" font-size="17.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">神经退行性病变：同一逻辑，不同蛋白</text><text x="22" y="46" font-size="11.5" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">异常蛋白聚集 + 选择性神经元丢失 → AD（Aβ/tau）与 PD（α-突触核蛋白）</text><rect x="22" y="60" width="436" height="176" rx="10" fill="#f8fbfd" stroke="#dfe8f1" stroke-width="1"/><circle cx="76" cy="116" r="16" fill="#fdf8fc" stroke="#2c5f9e" stroke-width="1.4"/><circle cx="76" cy="116" r="6" fill="#dbe7f5" stroke="#2c5f9e" stroke-width="1"/><path d="M92,116 H140" stroke="#2c5f9e" stroke-width="3" stroke-linecap="round" opacity="0.6"/><path d="M70,101 l-8,-14 M82,101 l6,-14" stroke="#2c5f9e" stroke-width="2" opacity="0.55"/><text x="76" y="150" font-size="11.5" fill="#a8b6c4" font-weight="700" text-anchor="middle" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">神经元</text><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.155;0.1556;1" dur="11.4s" repeatCount="indefinite"/><circle cx="52" cy="90" r="2.6" fill="#2c5f9e" opacity="0.8"/><circle cx="64" cy="90" r="2.6" fill="#2c5f9e" opacity="0.8"/><circle cx="76" cy="90" r="2.6" fill="#2c5f9e" opacity="0.8"/><circle cx="88" cy="90" r="2.6" fill="#2c5f9e" opacity="0.8"/><text x="76" y="80" font-size="11.5" fill="#2c5f9e" font-weight="700" text-anchor="middle" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">蛋白聚集</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.155;0.1556;0.32;0.3206;1" dur="11.4s" repeatCount="indefinite"/><circle cx="122" cy="94" r="9" fill="#0f766e" opacity="0.35" stroke="#0f766e" stroke-width="1.4"/><text x="122" y="82" font-size="11.5" fill="#0f766e" font-weight="700" text-anchor="middle" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">老年斑</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.32;0.3206;0.485;0.4856;1" dur="11.4s" repeatCount="indefinite"/><path d="M70,126 q6,-14 12,-2 q4,-10 8,2" fill="none" stroke="#a8791a" stroke-width="2"/><text x="102" y="136" font-size="11.5" fill="#a8791a" font-weight="700" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">缠结</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.485;0.4856;0.65;0.6506;1" dur="11.4s" repeatCount="indefinite"/><text x="36" y="168" font-size="11.5" fill="#c1440e" font-weight="700" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">起始：内嗅皮层/海马</text></g><text x="168" y="82" font-size="11.5" fill="#a8b6c4" font-weight="700" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">AD vs PD</text><rect x="168" y="96" width="288" height="66" rx="7" fill="#0f766e" opacity="0.08"/><text x="174" y="110" font-size="12" fill="#0f766e" font-weight="700" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">阿尔茨海默病</text><text x="174" y="126" font-size="11.5" fill="#8899aa" font-weight="400" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">蛋白：Aβ（斑）+ tau（缠结）</text><text x="174" y="142" font-size="11.5" fill="#8899aa" font-weight="400" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">脑区：内嗅皮层 → 海马 → 新皮层</text><text x="174" y="157" font-size="11.5" fill="#8899aa" font-weight="400" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">首发：近事记忆障碍</text><rect x="168" y="168" width="288" height="66" rx="7" fill="#c0392b" opacity="0.08"/><text x="174" y="182" font-size="12" fill="#c0392b" font-weight="700" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">帕金森病</text><text x="174" y="198" font-size="11.5" fill="#8899aa" font-weight="400" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">蛋白：α-突触核蛋白（Lewy 小体）</text><text x="174" y="214" font-size="11.5" fill="#8899aa" font-weight="400" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">脑区：黑质致密部多巴胺神经元</text><text x="174" y="229" font-size="11.5" fill="#8899aa" font-weight="400" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">首发：静止性震颤、肌强直、运动迟缓</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.155;0.1556;0.32;0.3206;1" dur="11.4s" repeatCount="indefinite"/><rect x="167" y="95" width="290" height="68" rx="8" fill="none" stroke="#0f766e" stroke-width="1.8"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.65;0.6506;0.82;0.8206;1" dur="11.4s" repeatCount="indefinite"/><rect x="167" y="167" width="290" height="68" rx="8" fill="none" stroke="#c0392b" stroke-width="1.8"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.82;0.8206;1" dur="11.4s" repeatCount="indefinite"/><text x="24" y="246" font-size="11.5" fill="#2f8f57" font-weight="700" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">同是蛋白病，蛋白与脑区不同</text></g><text x="443" y="82" font-size="11.5" fill="#a8b6c4" font-weight="700" text-anchor="end" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"></text><rect x="22" y="258" width="436" height="3" rx="1.5" fill="#e8eff6"/><path d="M22,259.5 H458" stroke="#0f766e" stroke-width="3" stroke-linecap="round" opacity="0.42" stroke-dasharray="436" stroke-dashoffset="436"><animate attributeName="stroke-dashoffset" values="436;0" keyTimes="0;1" dur="11.4s" repeatCount="indefinite"/></path><circle cx="56.7" cy="259.5" r="4" fill="#ffffff" stroke="#cfdce8" stroke-width="1.5"/><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.155;0.1556;1" dur="11.4s" repeatCount="indefinite"/><circle cx="56.7" cy="259.5" r="5.5" fill="#2c5f9e"/></g><g opacity="1"><animate attributeName="opacity" values="0.0;0.0;1.0;1.0" keyTimes="0;0.155;0.1556;1" dur="11.4s" repeatCount="indefinite"/><text x="56.7" y="280" text-anchor="middle" font-size="11.5" fill="#b6c4d2" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">共同机制</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.155;0.1556;1" dur="11.4s" repeatCount="indefinite"/><text x="56.7" y="280" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2c5f9e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">共同机制</text></g><circle cx="130.0" cy="259.5" r="4" fill="#ffffff" stroke="#cfdce8" stroke-width="1.5"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.155;0.1556;0.32;0.3206;1" dur="11.4s" repeatCount="indefinite"/><circle cx="130.0" cy="259.5" r="5.5" fill="#0f766e"/></g><g opacity="1"><animate attributeName="opacity" values="1.0;1.0;0.0;0.0;1.0;1.0" keyTimes="0;0.155;0.1556;0.32;0.3206;1" dur="11.4s" repeatCount="indefinite"/><text x="130.0" y="280" text-anchor="middle" font-size="11.5" fill="#b6c4d2" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">Aβ 斑块</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.155;0.1556;0.32;0.3206;1" dur="11.4s" repeatCount="indefinite"/><text x="130.0" y="280" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">Aβ 斑块</text></g><circle cx="203.3" cy="259.5" r="4" fill="#ffffff" stroke="#cfdce8" stroke-width="1.5"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.32;0.3206;0.485;0.4856;1" dur="11.4s" repeatCount="indefinite"/><circle cx="203.3" cy="259.5" r="5.5" fill="#a8791a"/></g><g opacity="1"><animate attributeName="opacity" values="1.0;1.0;0.0;0.0;1.0;1.0" keyTimes="0;0.32;0.3206;0.485;0.4856;1" dur="11.4s" repeatCount="indefinite"/><text x="203.3" y="280" text-anchor="middle" font-size="11.5" fill="#b6c4d2" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">tau 缠结</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.32;0.3206;0.485;0.4856;1" dur="11.4s" repeatCount="indefinite"/><text x="203.3" y="280" text-anchor="middle" font-size="11.5" font-weight="700" fill="#a8791a" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">tau 缠结</text></g><circle cx="276.7" cy="259.5" r="4" fill="#ffffff" stroke="#cfdce8" stroke-width="1.5"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.485;0.4856;0.65;0.6506;1" dur="11.4s" repeatCount="indefinite"/><circle cx="276.7" cy="259.5" r="5.5" fill="#c1440e"/></g><g opacity="1"><animate attributeName="opacity" values="1.0;1.0;0.0;0.0;1.0;1.0" keyTimes="0;0.485;0.4856;0.65;0.6506;1" dur="11.4s" repeatCount="indefinite"/><text x="276.7" y="280" text-anchor="middle" font-size="11.5" fill="#b6c4d2" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">起始脑区</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.485;0.4856;0.65;0.6506;1" dur="11.4s" repeatCount="indefinite"/><text x="276.7" y="280" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c1440e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">起始脑区</text></g><circle cx="350.0" cy="259.5" r="4" fill="#ffffff" stroke="#cfdce8" stroke-width="1.5"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.65;0.6506;0.82;0.8206;1" dur="11.4s" repeatCount="indefinite"/><circle cx="350.0" cy="259.5" r="5.5" fill="#c0392b"/></g><g opacity="1"><animate attributeName="opacity" values="1.0;1.0;0.0;0.0;1.0;1.0" keyTimes="0;0.65;0.6506;0.82;0.8206;1" dur="11.4s" repeatCount="indefinite"/><text x="350.0" y="280" text-anchor="middle" font-size="11.5" fill="#b6c4d2" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">Lewy 小体</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.65;0.6506;0.82;0.8206;1" dur="11.4s" repeatCount="indefinite"/><text x="350.0" y="280" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c0392b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">Lewy 小体</text></g><circle cx="423.3" cy="259.5" r="4" fill="#ffffff" stroke="#cfdce8" stroke-width="1.5"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.82;0.8206;1" dur="11.4s" repeatCount="indefinite"/><circle cx="423.3" cy="259.5" r="5.5" fill="#2f8f57"/></g><g opacity="1"><animate attributeName="opacity" values="1.0;1.0;0.0;0.0" keyTimes="0;0.82;0.8206;1" dur="11.4s" repeatCount="indefinite"/><text x="423.3" y="280" text-anchor="middle" font-size="11.5" fill="#b6c4d2" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">两病鉴别</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.82;0.8206;1" dur="11.4s" repeatCount="indefinite"/><text x="423.3" y="280" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">两病鉴别</text></g><rect x="22" y="292" width="436" height="92" rx="10" fill="#ffffff" stroke="#e3ebf3" stroke-width="1"/><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.155;0.1556;1" dur="11.4s" repeatCount="indefinite"/><rect x="22" y="293" width="3" height="90" fill="#2c5f9e" opacity="0.85"/><text x="40" y="318" font-size="11.5" fill="#a8b6c4" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">因为</text><text x="78" y="318" font-size="12.5" fill="#6b7c8d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">异常蛋白聚集 + 选择性神经元丢失 + 胶质反应</text><text x="40" y="354" font-size="11.5" fill="#2c5f9e" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">所以</text><text x="78" y="354" font-size="14.5" fill="#2c5f9e" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">不同疾病只是「哪种蛋白、哪个脑区」不同</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.155;0.1556;0.32;0.3206;1" dur="11.4s" repeatCount="indefinite"/><rect x="22" y="293" width="3" height="90" fill="#0f766e" opacity="0.85"/><text x="40" y="318" font-size="11.5" fill="#a8b6c4" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">因为</text><text x="78" y="318" font-size="12.5" fill="#6b7c8d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">APP 异常剪切产生 Aβ42，沉积形成细胞外老年斑</text><text x="40" y="354" font-size="11.5" fill="#0f766e" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">所以</text><text x="78" y="354" font-size="14.5" fill="#0f766e" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">Aβ 是起始因素，可引发级联损伤</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.32;0.3206;0.485;0.4856;1" dur="11.4s" repeatCount="indefinite"/><rect x="22" y="293" width="3" height="90" fill="#a8791a" opacity="0.85"/><text x="40" y="318" font-size="11.5" fill="#a8b6c4" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">因为</text><text x="78" y="318" font-size="12.5" fill="#6b7c8d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">tau 蛋白过度磷酸化，聚集成细胞内神经原纤维缠结</text><text x="40" y="354" font-size="11.5" fill="#a8791a" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">所以</text><text x="78" y="354" font-size="14.5" fill="#a8791a" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">缠结数量与痴呆程度的相关性比斑块更强</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.485;0.4856;0.65;0.6506;1" dur="11.4s" repeatCount="indefinite"/><rect x="22" y="293" width="3" height="90" fill="#c1440e" opacity="0.85"/><text x="40" y="318" font-size="11.5" fill="#a8b6c4" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">因为</text><text x="78" y="318" font-size="12.5" fill="#6b7c8d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">从内嗅皮层与海马开始，逐渐扩展至新皮层</text><text x="40" y="354" font-size="11.5" fill="#c1440e" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">所以</text><text x="78" y="354" font-size="14.5" fill="#c1440e" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">故最早表现为近事记忆障碍，后期才全面衰退</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.65;0.6506;0.82;0.8206;1" dur="11.4s" repeatCount="indefinite"/><rect x="22" y="293" width="3" height="90" fill="#c0392b" opacity="0.85"/><text x="40" y="318" font-size="11.5" fill="#a8b6c4" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">因为</text><text x="78" y="318" font-size="12.5" fill="#6b7c8d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">α-突触核蛋白异常聚集形成 Lewy 小体</text><text x="40" y="354" font-size="11.5" fill="#c0392b" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">所以</text><text x="78" y="354" font-size="14.5" fill="#c0392b" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">黑质致密部多巴胺神经元丢失 → 静止性震颤、肌强直</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.82;0.8206;1" dur="11.4s" repeatCount="indefinite"/><rect x="22" y="293" width="3" height="90" fill="#2f8f57" opacity="0.85"/><text x="40" y="318" font-size="11.5" fill="#a8b6c4" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">因为</text><text x="78" y="318" font-size="12.5" fill="#6b7c8d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">AD 以认知衰退为主；PD 以运动症状为主但可伴痴呆</text><text x="40" y="354" font-size="11.5" fill="#2f8f57" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">所以</text><text x="78" y="354" font-size="14.5" fill="#2f8f57" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">两者均有异常蛋白沉积，但蛋白种类与起始脑区不同</text></g><text x="22" y="403" font-size="11.5" fill="#a8b6c4" font-weight="700" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">四个关键点</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.32;0.3206;0.485;0.4856;1" dur="11.4s" repeatCount="indefinite"/><rect x="22" y="413" width="3" height="15" rx="1.5" fill="#0f766e"/><text x="34" y="424" font-size="12.5" fill="#0f766e" font-weight="700" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">AD 双病理</text><text x="104" y="424" font-size="12" fill="#6b7c8d" font-weight="400" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">Aβ 老年斑（细胞外）+ tau 缠结（细胞内）</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.32;0.3206;0.485;0.4856;1" dur="11.4s" repeatCount="indefinite"/><rect x="22" y="436" width="3" height="15" rx="1.5" fill="#a8791a"/><text x="34" y="447" font-size="12.5" fill="#a8791a" font-weight="700" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">相关性</text><text x="104" y="447" font-size="12" fill="#6b7c8d" font-weight="400" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">缠结数量与痴呆程度的相关性比斑块更强</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.485;0.4856;0.65;0.6506;1" dur="11.4s" repeatCount="indefinite"/><rect x="22" y="459" width="3" height="15" rx="1.5" fill="#c1440e"/><text x="34" y="470" font-size="12.5" fill="#c1440e" font-weight="700" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">AD 起始脑区</text><text x="104" y="470" font-size="12" fill="#6b7c8d" font-weight="400" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">内嗅皮层与海马 → 故先出现近事记忆障碍</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.65;0.6506;0.82;0.8206;1" dur="11.4s" repeatCount="indefinite"/><rect x="22" y="482" width="3" height="15" rx="1.5" fill="#c0392b"/><text x="34" y="493" font-size="12.5" fill="#c0392b" font-weight="700" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">PD 核心</text><text x="104" y="493" font-size="12" fill="#6b7c8d" font-weight="400" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">α-突触核蛋白组成 Lewy 小体，黑质多巴胺神经元丢失</text></g><rect x="22" y="501" width="436" height="48" rx="8" fill="#fdf8fc"/><text x="34" y="521" font-size="12" fill="#1e293b" font-weight="700" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">记忆：AD 是「两个蛋白、从海马开始」；PD 是「一个蛋白、从黑质开始」。</text><text x="34" y="536" font-size="12" fill="#1e293b" font-weight="700" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">两者都是蛋白错误折叠病，只是蛋白种类与起始脑区不同</text></svg>