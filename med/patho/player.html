</div><script>
(function(g){
  var SPEEDS=[0.5,1,1.5];
  function makeBar(svg){
    var wrap=document.createElement('div'); wrap.className='smctl';
    function btn(t,ti){var b=document.createElement('button');b.type='button';
      b.className='smbtn';b.textContent=t;if(ti)b.title=ti;return b;}
    var bPrev=btn('\u2039','上一相位'), bPlay=btn('\u23f8','暂停 / 继续'),
        bNext=btn('\u203a','下一相位'), bSpeed=btn('1\u00d7','切换速度'),
        bReset=btn('\u21ba','回到开头');
    var lab=document.createElement('span'); lab.className='smlab';

    var dur=0;
    svg.querySelectorAll('animate[dur]').forEach(function(a){
      var v=parseFloat(a.getAttribute('dur'))||0; if(v>dur) dur=v; });
    dur=dur||10;

    var marks=[];
    svg.querySelectorAll('animate[dur]').forEach(function(a){
      var v=parseFloat(a.getAttribute('dur'))||0;
      if(Math.abs(v-dur)>0.01) return;
      var kt=(a.getAttribute('keyTimes')||'').trim(); if(!kt) return;
      kt.split(';').forEach(function(x){var q=parseFloat(x);
        if(!isNaN(q)&&q>0.03&&q<0.97) marks.push(q); }); });
    marks.sort(function(a,b){return a-b});
    var groups=[];
    marks.forEach(function(m){
      if(groups.length && m-groups[groups.length-1].last<0.05){
        var q=groups[groups.length-1]; q.sum+=m; q.n+=1; q.last=m;
      } else groups.push({sum:m,n:1,last:m});
    });
    var uniq=[0];
    groups.forEach(function(q){var v=q.sum/q.n;
      if(v-uniq[uniq.length-1]>0.04) uniq.push(v);});
    if(uniq.length<2) uniq=[0,0.5,1];
    if(uniq[uniq.length-1]<0.96) uniq.push(1);
    uniq=uniq.map(function(v){return Math.round(v*1000)/1000});
    var nStep=Math.max(uniq.length-1,1);

    var t=0, playing=true, speed=1, last=0, raf=null;
    function manual(){try{if(!svg.animationsPaused())svg.pauseAnimations();}catch(e){}}
    function apply(){manual();try{svg.setCurrentTime(t%dur);}catch(e){}}
    function paint(){
      bPlay.textContent=playing?'\u23f8':'\u25b6';
      bPlay.classList.toggle('on',playing);
      bSpeed.textContent=speed+'\u00d7';
      var now=t/dur,k=0;
      for(var i=0;i<uniq.length-1;i++) if(now>=uniq[i]-1e-6) k=i;
      lab.textContent='\u7b2c '+(k+1)+' / '+nStep+' \u6b65';
    }
    function loop(now){
      if(!playing) return;
      if(!last) last=now;
      var dt=(now-last)/1000; last=now;
      t+=dt*speed; if(t>=dur) t-=dur;
      apply(); paint(); raf=requestAnimationFrame(loop);
    }
    function play(){playing=true;last=0;raf=requestAnimationFrame(loop);paint();}
    function pause(){playing=false;if(raf)cancelAnimationFrame(raf);raf=null;apply();paint();}
    bPlay.onclick=function(){playing?pause():play();};
    bSpeed.onclick=function(){var i=SPEEDS.indexOf(speed);
      speed=SPEEDS[(i+1)%SPEEDS.length]; last=0; paint();};
    function step(d){
      pause();
      var best=0,bd=1e9;
      for(var i=0;i<uniq.length;i++){var q=Math.abs(t/dur-uniq[i]);
        if(q<bd){bd=q;best=i;}}
      var ni=Math.max(0,Math.min(best+d,uniq.length-1));
      t=Math.min(uniq[ni]*dur+0.012,dur-0.002);
      apply(); paint();
    }
    bPrev.onclick=function(){step(-1);};
    bNext.onclick=function(){step(1);};
    bReset.onclick=function(){pause();t=0;apply();paint();};

    [bPrev,bPlay,bNext,bSpeed,bReset].forEach(function(b){wrap.appendChild(b);});
    wrap.appendChild(lab);

    manual(); apply(); paint();
    if('IntersectionObserver' in window){
      var io=new IntersectionObserver(function(es){
        es.forEach(function(e){ if(e.isIntersecting) play(); else pause(); });
      },{rootMargin:'120px'});
      io.observe(svg.closest('.stage')||svg);
    } else play();
    return wrap;
  }
  g.initSmilCtl=function(root){
    (root||document).querySelectorAll('.stage').forEach(function(st){
      if(st.dataset.ctl) return;
      var svg=st.querySelector('svg'); if(!svg||!svg.pauseAnimations) return;
      // 只有「有真实循环动画」的图才加控件：
      //   至少 2 个 animate，且最大 dur > 1s（排除只有一个标题淡入的静态图）
      var durs=[], mx=0;
      svg.querySelectorAll('animate[dur]').forEach(function(a){
        var v=parseFloat(a.getAttribute('dur'))||0; durs.push(v); if(v>mx) mx=v;});
      if(durs.length<2 || mx<=1) { st.dataset.ctl='1'; st.classList.add('static'); return; }
      st.dataset.ctl='1';
      st.appendChild(makeBar(svg));
    });
  };
  if(document.readyState==='loading')
    document.addEventListener('DOMContentLoaded',function(){g.initSmilCtl()});
  else g.initSmilCtl();
})(window);
</script><script>
const DATA = window.__PLAYER_DATA = [{"cid":"proc_cell_injury","t":"细胞损伤：从可逆到不可逆","d":"细胞损伤有一条相对固定的顺序：缺氧或毒物使ATP下降，Na⁺-K⁺-ATP酶最先失灵，细胞内水钠潴留而肿胀，脂肪酸氧化受抑出现脂滴。这些改变在去除原因后可以完全","f":"proc_cell_injury.svg","lv":0,"ln":"L0 细胞损伤与死亡"},{"cid":"proc_necrosis_apoptosis","t":"坏死与凋亡：两种死亡方式的对照","d":"坏死与凋亡是两种本质不同的细胞死亡。坏死由强烈损伤被动触发，此时ATP已耗竭，细胞肿胀、膜破裂、内容物外漏，释放DAMP激活免疫，因此总是伴随炎症，且常成片累及","f":"proc_necrosis_apoptosis.svg","lv":0,"ln":"L0 细胞损伤与死亡"},{"cid":"proc_thrombosis","t":"血栓形成：从内皮破口到牢固血栓","d":"血栓形成遵循Virchow三要素：内皮损伤、血流改变与高凝状态，任一成立都可能长血栓。内皮破口暴露胶原后，vWF桥接GPⅠb使血小板黏附活化，释放ADP与TXA","f":"proc_thrombosis.svg","lv":1,"ln":"L1 循环障碍"},{"cid":"proc_thrombus_type","t":"血栓四型：成分决定治疗","d":"血栓按成分与形成环境分四型。动脉内流速高、剪切力大，血栓始于内皮损伤并以血小板聚集为主，形成灰白色质硬的白血栓，是心梗与脑梗的直接原因。静脉内流速低、易淤滞，凝","f":"proc_thrombus_type.svg","lv":1,"ln":"L1 循环障碍"},{"cid":"proc_antithrombotic","t":"抗栓药：三类靶点与监测","d":"抗栓药的选择取决于血栓成分。动脉白血栓以血小板为主，故用抗血小板药：阿司匹林抑制COX-1，氯吡格雷与替格瑞洛抑制P2Y12，用于冠心病、缺血性卒中与支架术后。","f":"proc_antithrombotic.svg","lv":1,"ln":"L1 循环障碍"},{"cid":"proc_rejection","t":"移植排斥：四种类型与对策","d":"移植排斥按发生时间与机制分四型。超急性排斥因受者体内已有预存抗体，如ABO血型不符或多次输血妊娠致敏，在接通血流后数分钟至数小时即发生，属Ⅱ型超敏反应，抗体结合","f":"proc_rejection.svg","lv":1,"ln":"L1 循环障碍"},{"cid":"proc_banff","t":"移植肾 Banff 分级：把病变变成分数","d":"移植肾活检采用Banff半定量标准描述病变严重程度，使不同中心的数据可以比较，这是分级的根本目的。急性细胞性排斥看间质炎症（i）与小管炎（t），t分级依据小管横","f":"proc_banff.svg","lv":1,"ln":"L1 循环障碍"},{"cid":"proc_embolism","t":"栓塞：栓子沿哪条路走","d":"栓塞是栓子随血流运行并阻塞血管的过程。最常见的途径是体静脉与右心的栓子经肺动脉入肺，占全部栓塞的95%以上。左心与主动脉的栓子进入体循环，好发于脑、脾、肾与下肢","f":"proc_embolism.svg","lv":1,"ln":"L1 循环障碍"},{"cid":"proc_infarct","t":"梗死：为什么有的灰白、有的暗红","d":"梗死是动脉阻塞导致的缺血性坏死。能否代偿取决于侧支循环：肺有支气管动脉、肝有门静脉与肝动脉双重供血，因此不易梗死。贫血性梗死发生在心、肾、脾等结构致密、侧支少的","f":"proc_infarct.svg","lv":1,"ln":"L1 循环障碍"},{"cid":"proc_dic","t":"DIC：先广泛凝血，后广泛出血","d":"DIC的本质是凝血与纤溶同时失控。严重感染、创伤、产科意外或恶性肿瘤使组织因子大量进入血循环，启动外源途径，凝血酶在全身微血管内爆发式生成，纤维蛋白沉积形成弥漫","f":"proc_dic.svg","lv":1,"ln":"L1 循环障碍"},{"cid":"proc_inflammation","t":"急性炎症：血管反应的五个环节","d":"急性炎症的血管反应有固定顺序：损伤即刻细动脉短暂痉挛，随后组胺、前列腺素与NO使其扩张，局部出现红与热；血流先加速后因通透性增高与血液浓缩而变慢，轴流消失，白细","f":"proc_inflammation.svg","lv":2,"ln":"L2 炎症与修复"},{"cid":"proc_leukocyte","t":"白细胞渗出：从滚动到吞噬","d":"白细胞渗出分六步。血流变慢后白细胞离开轴流靠近管壁，选择素介导弱黏附使其沿内皮滚动；内皮活化后表达ICAM-1，与白细胞整合素结合形成牢固黏附；随后白细胞穿出内","f":"proc_leukocyte.svg","lv":2,"ln":"L2 炎症与修复"},{"cid":"proc_healing","t":"创伤愈合：从血凝块到瘢痕","d":"创伤愈合分四期。止血期由血管收缩、血小板栓与纤维蛋白凝块封住创口并形成临时支架；炎症期中性粒细胞在24小时内到达清除细菌与碎屑，第2~3天起巨噬细胞接手；肉芽期","f":"proc_healing.svg","lv":2,"ln":"L2 炎症与修复"},{"cid":"proc_atherosclerosis","t":"动脉粥样硬化：从脂纹到斑块破裂","d":"动脉粥样硬化起于内皮损伤。高血压、吸烟、LDL升高与糖尿病使内皮功能障碍、黏附分子表达上调，LDL进入内膜并被氧化为ox-LDL。ox-LDL招募单核细胞穿入内","f":"proc_atherosclerosis.svg","lv":3,"ln":"L3 血管病理"},{"cid":"proc_myocarditis","t":"心肌炎与心肌病：腔大、壁厚、壁硬","d":"心肌炎多由病毒感染引起，病毒直接损伤与免疫反应双重作用，病理诊断标准是心肌间质炎症细胞浸润与心肌细胞坏死同时存在。多数患者可完全恢复，部分转为扩张型心肌病，暴发","f":"proc_myocarditis.svg","lv":3,"ln":"L3 血管病理"},{"cid":"proc_aneurysm","t":"动脉瘤与主动脉夹层：扩张 vs 裂开","d":"动脉瘤与夹层的共同基础是中膜退变：动脉粥样硬化、高血压与结缔组织病使弹性纤维断裂、平滑肌减少，管壁抗张力下降。按Laplace定律，管壁张力与直径成正比，因此瘤","f":"proc_aneurysm.svg","lv":3,"ln":"L3 血管病理"},{"cid":"proc_carcinogenesis","t":"肿瘤发生：多阶段、多基因累积","d":"肿瘤发生是多阶段、多基因累积的过程。启动阶段致癌物造成DNA损伤形成启动细胞，这一步不可逆但单独不足以成瘤；促长阶段促癌剂刺激已启动细胞增殖，本身不引起突变但同","f":"proc_carcinogenesis.svg","lv":4,"ln":"L4 肿瘤总论"},{"cid":"proc_metastasis","t":"肿瘤转移：六步级联","d":"肿瘤转移是一个低效但致命的级联。肿瘤细胞先因E-钙黏蛋白下调而黏附减弱、脱离原发灶，并由基质金属蛋白酶降解基底膜；随后侵入血管或淋巴管。进入循环的绝大多数细胞会","f":"proc_metastasis.svg","lv":4,"ln":"L4 肿瘤总论"},{"cid":"proc_lobar_pneumonia","t":"大叶性肺炎：四期演变","d":"大叶性肺炎典型者分四期。充血水肿期在1~2天，毛细血管扩张、浆液渗出，肺泡内细菌大量繁殖；红色肝样变期在3~4天，纤维蛋白原渗出凝固，红细胞与纤维蛋白充满肺泡，","f":"proc_lobar_pneumonia.svg","lv":5,"ln":"L5 系统病理（呼吸·消化）"},{"cid":"proc_resp_failure","t":"呼吸衰竭：四个机制与两个类型","d":"呼吸衰竭按海平面静息吸空气时PaO₂<60mmHg判定，据PaCO₂分两型。发生机制有四：通气障碍使肺泡通气量下降，PaO₂降低且PaCO₂升高，形成Ⅱ型；弥散","f":"proc_resp_failure.svg","lv":5,"ln":"L5 系统病理（呼吸·消化）"},{"cid":"proc_ild","t":"间质性肺疾病：UIP 与 NSIP 的分界","d":"间质性肺病的病变在肺泡间隔而非肺泡腔，故早期表现为限制性通气障碍。不同病因最终都走向间质炎症、纤维化与蜂窝肺。特发性肺纤维化的病理类型是普通型间质性肺炎（UIP","f":"proc_ild.svg","lv":5,"ln":"L5 系统病理（呼吸·消化）"},{"cid":"proc_peptic_ulcer","t":"消化性溃疡：侵袭与防御失衡","d":"消化性溃疡的本质是侵袭因素超过防御因素。防御包括黏液-碳酸氢盐层、上皮紧密连接、黏膜血流与前列腺素；侵袭主要包括胃酸与胃蛋白酶，幽门螺杆菌与NSAID是两大外因","f":"proc_peptic_ulcer.svg","lv":5,"ln":"L5 系统病理（呼吸·消化）"},{"cid":"proc_ibd","t":"炎症性肠病：UC 与 CD 怎么分","d":"溃疡性结肠炎与克罗恩病是炎症性肠病的两端。两者有共同的遗传、菌群与免疫基础，但累及层次完全不同。UC只累及黏膜与黏膜下层，病灶从直肠向近端连续蔓延、不跳跃，病理","f":"proc_ibd.svg","lv":5,"ln":"L5 系统病理（呼吸·消化）"},{"cid":"proc_cirrhosis","t":"肝硬化：从纤维化到假小叶","d":"肝硬化的核心是肝星状细胞活化。病毒、酒精、胆汁淤积等持续损伤肝细胞，反复坏死伴炎症，炎症因子与坏死产物使星状细胞由储脂型转为肌纤维母细胞型，大量合成Ⅰ、Ⅲ型胶原","f":"proc_cirrhosis.svg","lv":5,"ln":"L5 系统病理（呼吸·消化）"},{"cid":"proc_hepatitis","t":"病毒性肝炎：五型与肝衰竭","d":"病毒性肝炎按传播途径与慢性化倾向分五型。甲型与戊型经粪-口传播，多为自限性急性肝炎且不转为慢性，但戊型在孕妇中病死率显著升高。乙型与丙型经血液与体液传播，慢性化","f":"proc_hepatitis.svg","lv":5,"ln":"L5 系统病理（呼吸·消化）"},{"cid":"proc_gn","t":"急性肾炎：免疫复合物如何伤肾","d":"急性弥漫性增生性肾小球肾炎多在链球菌感染后1~3周发病。抗原与抗体形成循环免疫复合物沉积于肾小球，属Ⅲ型超敏反应。复合物激活补体经典途径，C5a招募中性粒细胞，","f":"proc_gn.svg","lv":6,"ln":"L6 泌尿系统"},{"cid":"proc_gn_types","t":"肾小球肾炎：五型怎么分","d":"肾小球肾炎的病理分型要靠三个维度：光镜改变、免疫荧光沉积部位与电镜下的沉积位置，而不是单看临床表现。急性弥漫性增生性在感染后1~3周发病，内皮与系膜细胞增生使毛","f":"proc_gn_types.svg","lv":6,"ln":"L6 泌尿系统"},{"cid":"proc_atn","t":"急性肾小管坏死：少尿的三个机制","d":"急性肾小管坏死多由肾缺血或肾毒物引起，两者都先伤及代谢最活跃、耗氧最多的近端小管。ATP耗竭、钙超载与活性氧使上皮细胞坏死脱落，管壁失去完整性；脱落的细胞与Ta","f":"proc_atn.svg","lv":6,"ln":"L6 泌尿系统"},{"cid":"proc_immunofluorescence","t":"免疫荧光：四种模式定四类病","d":"肾活检的免疫荧光判读决定病理分型，因为同一个「肾炎」在不同沉积模式下是完全不同的疾病。颗粒状沉积是免疫复合物在上皮下离散分布，见于膜性肾病。线状沉积是抗体直接针","f":"proc_immunofluorescence.svg","lv":6,"ln":"L6 泌尿系统"},{"cid":"proc_tubulointerstitial","t":"肾小管间质性肾病：小管功能先受累","d":"肾小管间质性肾病的损伤靶点是肾间质与小管，肾小球相对完好。药物、感染等因素先引起间质水肿与炎症细胞浸润，间质压力升高压迫小管；持续损伤使小管上皮变性、坏死与萎缩","f":"proc_tubulointerstitial.svg","lv":6,"ln":"L6 泌尿系统"},{"cid":"proc_dn","t":"糖尿病肾病：五期与可逆窗口","d":"糖尿病肾病由长期高血糖经多元醇通路、晚期糖基化终产物、蛋白激酶C与己糖胺通路共同损伤，造成细胞外基质增多。按Mogensen分五期：Ⅰ期高滤过、肾体积增大，GF","f":"proc_dn.svg","lv":6,"ln":"L6 泌尿系统"},{"cid":"proc_tuberculosis","t":"结核病：肉芽肿与干酪样坏死","d":"结核菌经飞沫抵达肺泡后被巨噬细胞吞噬，但能阻止吞噬体与溶酶体融合而在胞内繁殖。2~4周后Th1细胞活化巨噬细胞，巨噬细胞在IFN-γ作用下转变为上皮样细胞，多个","f":"proc_tuberculosis.svg","lv":7,"ln":"L7 感染性疾病"},{"cid":"proc_malaria","t":"疟疾：从蚊到红细胞的六步","d":"疟疾由雌性按蚊传播，子孢子随唾液进入血流后约30分钟内即进入肝细胞，故血中停留时间极短。红前期在肝细胞内裂体增殖且无症状，间日疟与卵形疟在此期可形成休眠子，成为","f":"proc_malaria.svg","lv":7,"ln":"L7 感染性疾病"},{"cid":"proc_thyroid","t":"甲状腺疾病：功能、抗体与形态","d":"甲状腺疾病要先判功能、再查抗体、最后看形态。正常时TRH促TSH、TSH促甲状腺分泌T4/T3，T4占分泌量90%以上，T3活性强数倍。Graves病由TSI模","f":"proc_thyroid.svg","lv":8,"ln":"L8 内分泌系统"},{"cid":"proc_thyroid_cancer","t":"甲状腺癌：四型与鉴别","d":"甲状腺癌分四型。乳头状癌最常见约占80%，与辐射暴露相关，特征为毛玻璃核、核沟与砂粒体，主要经淋巴道转移，预后好。滤泡状癌约占10%，诊断关键不是细胞学而是包膜","f":"proc_thyroid_cancer.svg","lv":8,"ln":"L8 内分泌系统"},{"cid":"proc_thyroiditis","t":"甲状腺炎：疼痛与抗体是分水岭","d":"甲状腺炎以桥本与亚急性最具代表性。桥本甲状腺炎由TPOAb与TgAb介导，激活补体与抗体依赖细胞毒作用破坏滤泡，淋巴细胞浸润并形成生发中心，滤泡萎缩、出现嗜酸性","f":"proc_thyroiditis.svg","lv":8,"ln":"L8 内分泌系统"},{"cid":"proc_mds","t":"骨髓增生异常综合征：热闹的骨髓，空虚的外周","d":"骨髓增生异常综合征的本质是造血干细胞的克隆性疾病。获得性基因突变使一个异常克隆扩增并压制正常造血，异常克隆分化成熟障碍、在骨髓内提前凋亡，形成无效造血——于是出","f":"proc_mds.svg","lv":12,"ln":"L12 造血系统"},{"cid":"proc_skin_pathology","t":"皮肤病理：病变落在哪一层","d":"皮肤病理的基本功是把病变定位到具体层次。表皮从基底层到角质层经历增殖、分化与角化的单向流程。角化过度是角质层异常增厚，见于银屑病与鱼鳞病；棘层肥厚是棘细胞层增生","f":"proc_skin_pathology.svg","lv":13,"ln":"L13 皮肤病理"},{"cid":"proc_stroke","t":"脑血管病：缺血与出血","d":"脑血管病分缺血性与出血性两大类。缺血性中血栓性多见于动脉粥样硬化斑块破裂，累及颈内动脉与大脑中动脉，起病相对缓慢并可有短暂性脑缺血发作前驱；栓塞性多因房颤时心房","f":"proc_stroke.svg","lv":14,"ln":"L14 神经病理"},{"cid":"proc_neurodegeneration","t":"神经退行性病变：同一逻辑，不同蛋白","d":"神经退行性疾病有共同机制：异常蛋白聚集、选择性神经元丢失与胶质反应，不同疾病只是蛋白种类与起始脑区不同。阿尔茨海默病有两个核心病理：APP异常剪切产生的Aβ42","f":"proc_neurodegeneration.svg","lv":14,"ln":"L14 神经病理"},{"cid":"proc_liver_carcinoma","t":"肝炎到肝癌：一条可追溯的演进链","d":"我国肝癌的主要路径是乙型肝炎到肝硬化再到肝细胞癌。HBVDNA可整合入宿主基因组，HCV则主要靠持续炎症与肝细胞再生增加突变机会；黄曲霉毒素与HBV有协同作用。","f":"proc_liver_carcinoma.svg","lv":9,"ln":"L9 肿瘤各论"},{"cid":"proc_lung_cancer","t":"肺癌：四型怎么分","d":"肺癌分型先看位置再看与吸烟的关系。中央型起自主支气管与肺门附近，多为鳞状细胞癌与小细胞癌，两者都与吸烟强相关；鳞癌常有角化珠与细胞间桥，易形成空洞。周围型起自段","f":"proc_lung_cancer.svg","lv":9,"ln":"L9 肿瘤各论"},{"cid":"proc_gastric_cancer","t":"胃癌：Correa 级联五步","d":"胃癌的发生遵循Correa级联：幽门螺杆菌定植胃窦黏膜，产尿素酶产氨并诱导慢性活动性炎症；长期炎症使腺体减少、壁细胞与主细胞丧失，形成慢性萎缩性胃炎，胃酸减少反","f":"proc_gastric_cancer.svg","lv":9,"ln":"L9 肿瘤各论"},{"cid":"proc_breast_cancer","t":"乳腺癌：三个受体决定治疗","d":"乳腺癌绝大多数起自终末导管小叶单位的上皮。病理评估的核心是三个受体与增殖指数：雌激素与孕激素受体阳性提示激素依赖性生长，可用他莫昔芬或芳香化酶抑制剂；HER2基","f":"proc_breast_cancer.svg","lv":9,"ln":"L9 肿瘤各论"},{"cid":"proc_prostate_bladder","t":"前列腺与膀胱：部位决定决策","d":"前列腺癌与良性增生部位不同：癌起于占腺体70%的外周带，增生起于移行带，这是两者最重要的解剖学区分。前列腺癌为雄激素依赖，腺体结构紊乱、基底细胞层消失，用Gle","f":"proc_prostate_bladder.svg","lv":9,"ln":"L9 肿瘤各论"},{"cid":"proc_lymphoma","t":"淋巴瘤：霍奇金与非霍奇金","d":"霍奇金与非霍奇金淋巴瘤都起自淋巴细胞，区别不在起源而在细胞类型、分布方式与分子特征。典型霍奇金淋巴瘤的标志是Reed-Sternberg细胞，双核、核仁明显如猫","f":"proc_lymphoma.svg","lv":9,"ln":"L9 肿瘤各论"},{"cid":"proc_melanoma","t":"黑色素瘤：从痣到垂直侵袭","d":"黑色素瘤多数起自正常皮肤，仅少数起自既有痣。早期瘤细胞沿表皮内水平扩展，尚未突破基底膜，即水平生长期（放射状生长期），此期完整切除可治愈，是识别的关键窗口。一旦","f":"proc_melanoma.svg","lv":9,"ln":"L9 肿瘤各论"},{"cid":"proc_soft_tissue_tumor","t":"软组织肿瘤：良性、中间性与恶性","d":"软组织肿瘤按生物学行为分良性、中间性与恶性。良性如脂肪瘤与纤维瘤，分化好、有包膜或边界清楚、生长缓慢且不转移。中间性以韧带样瘤为代表，成纤维细胞增生并向周围浸润","f":"proc_soft_tissue_tumor.svg","lv":9,"ln":"L9 肿瘤各论"},{"cid":"proc_gynecologic_tumor","t":"妇科三大肿瘤：筛查决定预后","d":"女性生殖系统三大肿瘤的组织来源与预后差别很大。宫颈癌的必要条件是高危型HPV持续感染，以16与18型为主，病毒E6灭活p53、E7灭活RB是癌变的核心机制；从C","f":"proc_gynecologic_tumor.svg","lv":9,"ln":"L9 肿瘤各论"},{"cid":"proc_mediastinal","t":"纵隔肿瘤：分区决定鉴别方向","d":"纵隔按解剖分前、中、后区，不同区好发不同肿瘤，分区是鉴别诊断的第一步。前纵隔最常见的肿瘤之一是胸腺瘤，起源于胸腺上皮，约30~40%的患者合并重症肌无力，这是极","f":"proc_mediastinal.svg","lv":9,"ln":"L9 肿瘤各论"},{"cid":"proc_ra","t":"类风湿关节炎：血管翳如何毁关节","d":"类风湿关节炎是慢性对称性多关节的自身免疫性炎症。遗传易感者在吸烟或感染触发下产生抗瓜氨酸化蛋白抗体，T细胞与B细胞浸润滑膜形成滤泡样结构，滑膜绒毛状增生形成血管","f":"proc_ra.svg","lv":10,"ln":"L10 骨与关节"},{"cid":"proc_osteosarcoma","t":"骨肉瘤：成骨、破皮质、肺转移","d":"骨肉瘤好发于10~25岁青少年，位于长骨干骺端，膝周约占60%，因生长最活跃的骺板附近细胞增殖旺盛。其定义性特征是肿瘤细胞直接成骨，X线上可见日光放射状骨针与骨","f":"proc_osteosarcoma.svg","lv":10,"ln":"L10 骨与关节"},{"cid":"proc_congenital","t":"先天畸形：四类发生机制","d":"先天畸形由遗传因素与环境致畸共同决定。遗传方面有染色体数目或结构异常与单基因突变，多为综合征性、累及多系统；环境方面以TORCH感染、酒精、药物、放射线与母体糖","f":"proc_congenital.svg","lv":11,"ln":"L11 儿科病理"},{"cid":"proc_childhood_tumor","t":"儿童肿瘤：胚胎性、敏感、治愈率高","d":"儿童肿瘤与成人有本质差异：多起自胚胎性未分化细胞而非上皮，因此癌少见，肉瘤与胚胎性肿瘤多见。神经母细胞瘤来自交感神经链的原始神经嵴细胞，多见于婴幼儿，尿VMA与","f":"proc_childhood_tumor.svg","lv":11,"ln":"L11 儿科病理"}];
(function(){
  const krow=document.getElementById('krow'), stages=document.getElementById('stages');
  let cur=null;
  DATA.forEach(function(d,i){
    const b=document.createElement('button');
    b.className='hbtn'+(i===0?' on':'');
    b.dataset.cid=d.cid;
    const nm=document.createElement('span');
    nm.textContent=d.t.split('：')[0];
    b.appendChild(nm);
    if(d.ln){
      const t=document.createElement('i');
      t.textContent=d.ln.split(' ')[0];
      t.title=d.ln;
      b.appendChild(t);
    }
    b.onclick=function(){ show(d.cid); };
    krow.appendChild(b);

    const st=document.createElement('div');
    st.className='stage'; st.id='st-'+d.cid;
    st.dataset.src=d.f;
    stages.appendChild(st);
  });
  const cache={};
  function show(cid){
    document.querySelectorAll('#krow .hbtn').forEach(function(x){
      var on=(x.dataset.cid===cid);
      x.classList.toggle('on', on);
      if(on && x.scrollIntoView)
        x.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
    });
    const rec0=DATA.find(function(y){return y.cid===cid;});
    const klab=document.getElementById('klab');
    if(klab) klab.innerHTML='知识点'+(rec0&&rec0.ln
      ? '<b style="color:#0f766e;font-weight:700;margin-left:6px">'+rec0.ln+'</b>' : '');
    document.querySelectorAll('.stage').forEach(x=>
      x.classList.toggle('on', x.id==='st-'+cid));
    const on=document.getElementById('st-'+cid);
    if(on) on.scrollIntoView({behavior:'smooth',block:'nearest'});
    history.replaceState(null,'','#c-'+cid);
    if(!on) return;
    if(on.dataset.ctl){ if(window.initSmilCtl) window.initSmilCtl(); return; }
    const rec=DATA.find(x=>x.cid===cid);
    if(!rec) return;
    on.innerHTML='<div class="desc" style="padding:24px 0">载入中…</div>';
    fetch('figs/'+rec.f).then(r=>r.text()).then(txt=>{
      on.innerHTML=txt+'<div class="desc">'+rec.d+'</div>';
      if(window.initSmilCtl) window.initSmilCtl();
    }).catch(()=>{
      on.innerHTML='<div class="desc">载入失败，请刷新重试</div>';
    });
  }
  // 初始：hash 指定 or 第一个
  const h=(location.hash||'').replace('#c-','');
  const target=DATA.find(x=>x.cid===h)||DATA[0];
  if(target) show(target.cid);
  window.addEventListener('hashchange',function(){
    const hh=(location.hash||'').replace('#c-','');
    if(hh) show(hh);
  });
  // 导出给连播脚本
  window.__playerShow = show;
})();
</script><script>// 连播控制：本层顺序连播 / 全学科跨层连播，带实时进度条
// 由 build3layer.py 在构建时读入并内联到 player.html（避免 f-string 大括号冲突）
(function () {
  var pbPlay = document.getElementById('pbPlay');
  var pbAll = document.getElementById('pbAll');
  var pbStop = document.getElementById('pbStop');
  var pbStat = document.getElementById('pbStat');
  var pbWrap = document.getElementById('pbBarWrap');
  var pbBar = document.getElementById('pbBar');
  if (!pbPlay || !window.__PLAYER_DATA) return;

  var DATA = window.__PLAYER_DATA;
  var queue = [], qi = 0, timer = null, playing = false, ticker = null;
  var expectCid = null;      // 连播自己切的目标，用于区分「手动切」
  var curDurMs = 0, t0 = 0;  // 当前张的预计时长与起始时刻
  var scopeName = '';        // 「本层」/「全部」用于提示文案

  function recOf(cid) {
    return DATA.find(function (x) { return x.cid === cid; });
  }
  function layerOf(cid) { var r = recOf(cid); return r ? r.lv : -1; }
  function titleOf(cid) { var r = recOf(cid); return r ? r.t : ''; }
  function layerNameOf(cid) {
    var r = recOf(cid);
    return r && r.ln ? r.ln.split(' ')[0] : '';
  }
  function setStat(t) { if (pbStat) pbStat.textContent = t; }

  function setBar(frac) {
    if (!pbBar) return;
    var p = Math.max(0, Math.min(1, frac)) * 100;
    pbBar.style.width = p.toFixed(1) + '%';
  }
  function showBar(on) {
    if (!pbWrap) return;
    pbWrap.classList.toggle('on', !!on);
    if (!on) setBar(0);
  }

  function stopPlay(msg) {
    playing = false; queue = []; qi = 0;
    if (timer) { clearTimeout(timer); timer = null; }
    if (ticker) { clearInterval(ticker); ticker = null; }
    showBar(false);
    if (pbPlay) {
      pbPlay.classList.remove('on');
      pbPlay.textContent = '\u25b6 \u8fde\u64ad\u672c\u5c42';
    }
    if (pbAll) {
      pbAll.classList.remove('on');
      pbAll.textContent = '\u25b6\u25b6 \u8fde\u64ad\u5168\u90e8';
    }
    if (pbStop) pbStop.disabled = true;
    if (msg) setStat(msg);
  }

  // 等 SVG 就绪 → 拿到这张的真实动画时长 → 起进度条 → 播完进下一张
  function waitThenNext() {
    if (!playing) return;
    var tries = 0;
    (function poll() {
      if (!playing) return;
      var st = document.querySelector('.stage.on');
      var svg = st && st.querySelector('svg');
      // SVG 还没 fetch 回来 → 每 300ms 再看，最多等 6 秒
      if (!svg) {
        if (++tries > 20) { nextInQueue(); return; }
        timer = setTimeout(poll, 300);
        return;
      }
      // 静态图（无播放控件）：1.2 秒后跳下一张
      if (!st.querySelector('.smctl')) {
        curDurMs = 1200;
        startTicker();
        return;
      }
      var dur = 0;
      svg.querySelectorAll('animate[dur]').forEach(function (a) {
        var v = parseFloat(a.getAttribute('dur')) || 0;
        if (v > dur) dur = v;
      });
      curDurMs = (dur || 10) * 1000;
      // 超过 15 秒的也只等 15 秒（个别长循环不必看全）
      curDurMs = Math.min(curDurMs, 15000) + 600;
      startTicker();
    })();
  }

  // 进度条：按 (已播张数 + 当前张进度) / 总张数 映射到 0~100%
  function startTicker() {
    if (ticker) clearInterval(ticker);
    t0 = Date.now();
    setBar((qi + 0) / queue.length);
    ticker = setInterval(function () {
      if (!playing) { clearInterval(ticker); ticker = null; return; }
      var f = Math.min(1, (Date.now() - t0) / (curDurMs || 1));
      setBar((qi + f) / queue.length);
      if (f >= 1) {
        clearInterval(ticker); ticker = null;
        nextInQueue();
      }
    }, 100);
  }

  function nextInQueue() {
    if (!playing) return;
    if (ticker) { clearInterval(ticker); ticker = null; }
    qi++;
    if (qi >= queue.length) {
      setBar(1);
      var n = queue.length;
      setTimeout(function () {
        stopPlay(scopeName + '\u5df2\u64ad\u5b8c\uff08\u5171 ' + n + ' \u5f20\uff09');
      }, 420);
      return;
    }
    var cid = queue[qi];
    expectCid = cid;
    if (window.__playerShow) window.__playerShow(cid);
    setStat('\u8fde\u64ad\u4e2d ' + (qi + 1) + '/' + queue.length +
            '\uff1a' + titleOf(cid));
    waitThenNext();
  }

  // 组织队列：范围 = 本层 / 全部；起点 = 当前图
  function startPlay(scope) {
    var cur = (location.hash || '').replace('#c-', '') ||
              (DATA[0] && DATA[0].cid);
    var lv = layerOf(cur);
    if (scope === 'layer') {
      queue = DATA.filter(function (x) { return x.lv === lv; })
                  .map(function (x) { return x.cid; });
      scopeName = '\u672c\u5c42';
    } else {
      queue = DATA.map(function (x) { return x.cid; });
      scopeName = '\u5168\u90e8';
    }
    if (!queue.length) queue = DATA.map(function (x) { return x.cid; });
    // 以当前图为起点重排（当前图算第 1 张）
    var startIdx = queue.indexOf(cur);
    if (startIdx > 0) queue = queue.slice(startIdx).concat(queue.slice(0, startIdx));
    qi = 0;
    playing = true;
    pbPlay.classList.toggle('on', scope === 'layer');
    pbAll.classList.toggle('on', scope !== 'layer');
    pbPlay.textContent = scope === 'layer' ? '\u23f9 \u8fde\u64ad\u4e2d'
                                           : '\u25b6 \u8fde\u64ad\u672c\u5c42';
    pbAll.textContent = scope !== 'layer' ? '\u23f9 \u8fde\u64ad\u4e2d'
                                          : '\u25b6\u25b6 \u8fde\u64ad\u5168\u90e8';
    if (pbStop) pbStop.disabled = false;
    showBar(true);
    expectCid = queue[qi];
    var ln = layerNameOf(queue[qi]);
    setStat('\u8fde\u64ad' + scopeName + ' ' + (qi + 1) + '/' + queue.length +
            (ln ? '\uff1a' + ln : '\uff1a') + ' \u00b7 ' + titleOf(queue[qi]));
    startWatch();
    waitThenNext();
  }

  pbPlay.onclick = function () {
    if (playing) { stopPlay('\u5df2\u505c\u6b62'); return; }
    startPlay('layer');
  };
  if (pbAll) {
    pbAll.onclick = function () {
      if (playing) { stopPlay('\u5df2\u505c\u6b62'); return; }
      startPlay('all');
    };
  }
  if (pbStop) pbStop.onclick = function () { stopPlay('\u5df2\u505c\u6b62'); };

  // 手动切图 → 终止连播（show 用 replaceState 不触发 hashchange，故用轮询比对）
  var watch = null;
  function startWatch() {
    if (watch) clearInterval(watch);
    watch = setInterval(function () {
      if (!playing) { clearInterval(watch); watch = null; return; }
      var cur = (location.hash || '').replace('#c-', '');
      if (expectCid && cur && cur !== expectCid) {
        stopPlay('\u5df2\u5207\u6362\uff0c\u8fde\u64ad\u7ed3\u675f');
      }
    }, 400);
  }
  window.addEventListener('hashchange', function () {
    if (playing) stopPlay('\u5df2\u5207\u6362\uff0c\u8fde\u64ad\u7ed3\u675f');
  });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden && playing) stopPlay('\u9875\u9762\u5df2\u5207\u51fa\uff0c\u8fde\u64ad\u6682\u505c');
  });
})();
</script></body></html>
