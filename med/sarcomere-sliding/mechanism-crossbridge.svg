<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" role="img" aria-label="横桥循环五步：ATP 结合、水解复位、动力冲程与释放"><rect width="1000" height="760" fill="#FFFFFF"/><text x="48.0" y="40.0" text-anchor="start" font-size="11.5" fill="#4E5B64" font-weight="700">机制通路之三</text><text x="48.0" y="72.0" text-anchor="start" font-size="22" fill="#1B2A33" font-weight="700">③ 横桥循环</text><text x="48.0" y="100.0" text-anchor="start" font-size="13.5" fill="#37474F" font-weight="400">唯一做功的环节：头部结合 → 摆动 → 解离 → 复位，单次约 50 ms</text><rect x="40.0" y="124" width="292" height="236" rx="14" fill="#FFFFFF" stroke="#C7D2DC" stroke-width="1.4" opacity="1.0"/><text x="60.0" y="158.0" text-anchor="start" font-size="18" fill="#4A6FA5" font-weight="700">①</text><text x="86.0" y="156.0" text-anchor="start" font-size="16" fill="#1B2A33" font-weight="700">rigor 结合态</text><rect x="64.0" y="247" width="244" height="18" rx="9" fill="#4A6FA5" stroke="#2E4A73" stroke-width="1.2" opacity="1.0"/><line x1="64.0" y1="200" x2="308.0" y2="200" stroke="#C97A5B" stroke-width="9" stroke-linecap="round"/><line x1="186.0" y1="247.0" x2="199.5" y2="233.5" stroke="#2E4A73" stroke-width="6.4" stroke-linecap="round"/><defs><radialGradient id="hbound45" cx="34%" cy="28%" r="74%"><stop offset="0" stop-color="#A4B7D2"/><stop offset="0.62" stop-color="#4A6FA5"/><stop offset="1" stop-color="#37527A"/></radialGradient></defs><g transform="rotate(45.0 212.0 221.0)"><ellipse cx="212.0" cy="221.0" rx="11.0" ry="14.7" fill="url(#hbound45)" stroke="#2E4A73" stroke-width="1.3"/></g><text x="58.0" y="310.0" text-anchor="start" font-size="11.5" fill="#37474F" font-weight="400">肌球蛋白头部与肌动蛋白呈高亲和力结合</text><text x="58.0" y="327.0" text-anchor="start" font-size="11.5" fill="#37474F" font-weight="400">；无 ATP 时无法解离（尸僵即此态</text><text x="58.0" y="344.0" text-anchor="start" font-size="11.5" fill="#37474F" font-weight="400">堆积）</text><rect x="354.0" y="124" width="292" height="236" rx="14" fill="#FFFFFF" stroke="#C7D2DC" stroke-width="1.4" opacity="1.0"/><text x="374.0" y="158.0" text-anchor="start" font-size="18" fill="#4A6FA5" font-weight="700">②</text><text x="400.0" y="156.0" text-anchor="start" font-size="16" fill="#1B2A33" font-weight="700">ATP 结合 → 解离</text><rect x="378.0" y="247" width="244" height="18" rx="9" fill="#4A6FA5" stroke="#2E4A73" stroke-width="1.2" opacity="1.0"/><line x1="378.0" y1="200" x2="622.0" y2="200" stroke="#C97A5B" stroke-width="9" stroke-linecap="round"/><line x1="500.0" y1="247.0" x2="513.5" y2="233.5" stroke="#2E4A73" stroke-width="6.4" stroke-linecap="round"/><defs><radialGradient id="hdetach45" cx="34%" cy="28%" r="74%"><stop offset="0" stop-color="#A4B7D2"/><stop offset="0.62" stop-color="#4A6FA5"/><stop offset="1" stop-color="#37527A"/></radialGradient></defs><g transform="rotate(45.0 526.0 221.0)"><ellipse cx="526.0" cy="221.0" rx="11.0" ry="14.7" fill="url(#hdetach45)" stroke="#2E4A73" stroke-width="1.3"/></g><circle cx="549.9" cy="219.1" r="12.0" fill="#B03A2E" stroke="white" stroke-width="1.6"/><text x="549.9" y="221.7" text-anchor="middle" font-size="12" fill="white" font-weight="700">ATP</text><text x="372.0" y="310.0" text-anchor="start" font-size="11.5" fill="#37474F" font-weight="400">ATP 结合到肌球蛋白头部，诱导构象</text><text x="372.0" y="327.0" text-anchor="start" font-size="11.5" fill="#37474F" font-weight="400">改变，亲和力骤降，头部脱离肌动蛋白</text><rect x="668.0" y="124" width="292" height="236" rx="14" fill="#FFFFFF" stroke="#C7D2DC" stroke-width="1.4" opacity="1.0"/><text x="688.0" y="158.0" text-anchor="start" font-size="18" fill="#4A6FA5" font-weight="700">③</text><text x="714.0" y="156.0" text-anchor="start" font-size="16" fill="#1B2A33" font-weight="700">ATP 水解 → 复位</text><rect x="692.0" y="247" width="244" height="18" rx="9" fill="#4A6FA5" stroke="#2E4A73" stroke-width="1.2" opacity="1.0"/><line x1="692.0" y1="200" x2="936.0" y2="200" stroke="#C97A5B" stroke-width="9" stroke-linecap="round"/><line x1="814.0" y1="247.0" x2="814.0" y2="227.9" stroke="#2E4A73" stroke-width="6.4" stroke-linecap="round"/><defs><radialGradient id="hcocked90" cx="34%" cy="28%" r="74%"><stop offset="0" stop-color="#A4B7D2"/><stop offset="0.62" stop-color="#4A6FA5"/><stop offset="1" stop-color="#37527A"/></radialGradient></defs><g transform="rotate(0.0 814.0 210.2)"><ellipse cx="814.0" cy="210.2" rx="11.0" ry="14.7" fill="url(#hcocked90)" stroke="#2E4A73" stroke-width="1.3"/></g><circle cx="836.1" cy="208.4" r="12.0" fill="#B03A2E" stroke="white" stroke-width="1.6"/><text x="836.1" y="210.9" text-anchor="middle" font-size="11" fill="white" font-weight="700">ADP·Pi</text><text x="686.0" y="310.0" text-anchor="start" font-size="11.5" fill="#37474F" font-weight="400">ATP→ADP+Pi，能量储存在头部</text><text x="686.0" y="327.0" text-anchor="start" font-size="11.5" fill="#37474F" font-weight="400">；头部沿细肌丝前移约 5 nm 并转</text><text x="686.0" y="344.0" text-anchor="start" font-size="11.5" fill="#37474F" font-weight="400">成垂直（预备冲程）</text><rect x="197.0" y="386" width="292" height="236" rx="14" fill="#FFFFFF" stroke="#1F5FA0" stroke-width="2.2" opacity="1.0"/><text x="217.0" y="420.0" text-anchor="start" font-size="18" fill="#1F5FA0" font-weight="700">④</text><text x="243.0" y="418.0" text-anchor="start" font-size="16" fill="#1B2A33" font-weight="700">Pi 释放 → 动力冲程</text><rect x="221.0" y="509" width="244" height="18" rx="9" fill="#4A6FA5" stroke="#2E4A73" stroke-width="1.2" opacity="1.0"/><line x1="221.0" y1="462" x2="465.0" y2="462" stroke="#C97A5B" stroke-width="9" stroke-linecap="round"/><line x1="343.0" y1="509.0" x2="356.5" y2="495.5" stroke="#2E4A73" stroke-width="6.4" stroke-linecap="round"/><defs><radialGradient id="hpower45" cx="34%" cy="28%" r="74%"><stop offset="0" stop-color="#A4B7D2"/><stop offset="0.62" stop-color="#4A6FA5"/><stop offset="1" stop-color="#37527A"/></radialGradient></defs><g transform="rotate(45.0 369.0 483.0)"><ellipse cx="369.0" cy="483.0" rx="11.0" ry="14.7" fill="url(#hpower45)" stroke="#2E4A73" stroke-width="1.3"/></g><path d="M 363.5,451.7 A 36.8,36.8 0 0 1 399.4,470.1" fill="none" stroke="#B03A2E" stroke-width="2.2" stroke-dasharray="5 4"/><polygon points="399.4,470.1 391.1,461.8 401.2,459.1" fill="#B03A2E"/><text x="405.8" y="455.4" text-anchor="start" font-size="11.5" fill="#B03A2E" font-weight="700" paint-order="stroke" stroke="white" stroke-width="3.2" stroke-linejoin="round">45°</text><circle cx="392.9" cy="481.1" r="12.0" fill="#B03A2E" stroke="white" stroke-width="1.6"/><text x="392.9" y="483.7" text-anchor="middle" font-size="12" fill="white" font-weight="700">Pi</text><text x="215.0" y="572.0" text-anchor="start" font-size="11.5" fill="#37474F" font-weight="400">Pi 释放触发强结合，头部向杆臂方向</text><text x="215.0" y="589.0" text-anchor="start" font-size="11.5" fill="#37474F" font-weight="400">扭动约 45°，拖动细肌丝向 M 线</text><text x="215.0" y="606.0" text-anchor="start" font-size="11.5" fill="#37474F" font-weight="400">滑行；产生 4–6 pN 力</text><rect x="511.0" y="386" width="292" height="236" rx="14" fill="#FFFFFF" stroke="#C7D2DC" stroke-width="1.4" opacity="1.0"/><text x="531.0" y="420.0" text-anchor="start" font-size="18" fill="#4A6FA5" font-weight="700">⑤</text><text x="557.0" y="418.0" text-anchor="start" font-size="16" fill="#1B2A33" font-weight="700">ADP 释放 → 回到起始</text><rect x="535.0" y="509" width="244" height="18" rx="9" fill="#4A6FA5" stroke="#2E4A73" stroke-width="1.2" opacity="1.0"/><line x1="535.0" y1="462" x2="779.0" y2="462" stroke="#C97A5B" stroke-width="9" stroke-linecap="round"/><line x1="657.0" y1="509.0" x2="670.5" y2="495.5" stroke="#2E4A73" stroke-width="6.4" stroke-linecap="round"/><defs><radialGradient id="hrelease45" cx="34%" cy="28%" r="74%"><stop offset="0" stop-color="#A4B7D2"/><stop offset="0.62" stop-color="#4A6FA5"/><stop offset="1" stop-color="#37527A"/></radialGradient></defs><g transform="rotate(45.0 683.0 483.0)"><ellipse cx="683.0" cy="483.0" rx="11.0" ry="14.7" fill="url(#hrelease45)" stroke="#2E4A73" stroke-width="1.3"/></g><circle cx="706.9" cy="481.1" r="12.0" fill="#B03A2E" stroke="white" stroke-width="1.6"/><text x="706.9" y="483.7" text-anchor="middle" font-size="12" fill="white" font-weight="700">ADP</text><text x="529.0" y="572.0" text-anchor="start" font-size="11.5" fill="#37474F" font-weight="400">ADP 释放，头部回到 rigor </text><text x="529.0" y="589.0" text-anchor="start" font-size="11.5" fill="#37474F" font-weight="400">构象，等待下一个 ATP；若 Ca²</text><text x="529.0" y="606.0" text-anchor="start" font-size="11.5" fill="#37474F" font-weight="400">⁺ 仍高则重复循环（约 50 ms/</text><text x="529.0" y="623.0" text-anchor="start" font-size="11.5" fill="#37474F" font-weight="400">次）</text><path d="M904,590 L928,630 L72,630 L72,368" fill="none" stroke="#1F5FA0" stroke-width="2.4" stroke-dasharray="8 6" opacity="0.8"/><polygon points="72,368 66,380 78,380" fill="#1F5FA0" opacity="0.8"/><text x="500.0" y="656.0" text-anchor="middle" font-size="12.5" fill="#1F5FA0" font-weight="700">Ca²⁺ 仍高 → 重复循环；Ca²⁺ 下降 → 循环停止、肌肉舒张</text><text x="500.0" y="740.0" text-anchor="middle" font-size="11.5" fill="#4E5B64" font-weight="400">① rigor 态即尸僵：ATP 耗竭后横桥无法解离　｜　④ 每步产生 4–6 pN 力，摆动约 45°</text></svg>