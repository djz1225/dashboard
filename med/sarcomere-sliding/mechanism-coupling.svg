<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" role="img" aria-label="兴奋-收缩耦联：动作电位到钙离子释放"><rect width="1000" height="620" fill="#FFFFFF"/><text x="48.0" y="40.0" text-anchor="start" font-size="11.5" fill="#4E5B64" font-weight="700">机制通路之一</text><text x="48.0" y="72.0" text-anchor="start" font-size="22" fill="#1B2A33" font-weight="700">① 兴奋-收缩耦联</text><text x="48.0" y="100.0" text-anchor="start" font-size="13.5" fill="#37474F" font-weight="400">动作电位沿肌膜与 T 管传至肌质网，触发 Ca²⁺ 释放</text><rect x="48" y="124" width="212" height="128" rx="12" fill="#FFFFFF" stroke="#4A6FA5" stroke-width="1.8" opacity="1.0"/><rect x="48" y="124" width="212" height="6" rx="3" fill="#4A6FA5" opacity="1.0"/><text x="66.0" y="164.0" text-anchor="start" font-size="20" fill="#4A6FA5" font-weight="700">1</text><text x="94.0" y="162.0" text-anchor="start" font-size="16" fill="#1B2A33" font-weight="700">动作电位</text><text x="66.0" y="190.0" text-anchor="start" font-size="12.5" fill="#37474F" font-weight="400">运动神经末梢释放</text><text x="66.0" y="230.0" text-anchor="start" font-size="11.5" fill="#4E5B64" font-weight="400">ACh → 终板电位 → 肌膜动作电位</text><polygon points="264,181.0 273,188.0 264,195.0" fill="#5F6C75"/><rect x="280" y="124" width="212" height="128" rx="12" fill="#FFFFFF" stroke="#1F5FA0" stroke-width="1.8" opacity="1.0"/><rect x="280" y="124" width="212" height="6" rx="3" fill="#1F5FA0" opacity="1.0"/><text x="298.0" y="164.0" text-anchor="start" font-size="20" fill="#1F5FA0" font-weight="700">2</text><text x="326.0" y="162.0" text-anchor="start" font-size="16" fill="#1B2A33" font-weight="700">T 管传导</text><text x="298.0" y="190.0" text-anchor="start" font-size="12.5" fill="#37474F" font-weight="400">动作电位深入细胞内部</text><text x="298.0" y="230.0" text-anchor="start" font-size="11.5" fill="#4E5B64" font-weight="400">T 管是肌膜的内陷，把兴奋带到深部</text><polygon points="496,181.0 505,188.0 496,195.0" fill="#5F6C75"/><rect x="512" y="124" width="212" height="128" rx="12" fill="#FFFFFF" stroke="#1C6B45" stroke-width="1.8" opacity="1.0"/><rect x="512" y="124" width="212" height="6" rx="3" fill="#1C6B45" opacity="1.0"/><text x="530.0" y="164.0" text-anchor="start" font-size="20" fill="#1C6B45" font-weight="700">3</text><text x="558.0" y="162.0" text-anchor="start" font-size="16" fill="#1B2A33" font-weight="700">肌质网释放 Ca²⁺</text><text x="530.0" y="190.0" text-anchor="start" font-size="12.5" fill="#37474F" font-weight="400">胞质 Ca²⁺ 从 1</text><text x="530.0" y="210.0" text-anchor="start" font-size="12.5" fill="#37474F" font-weight="400">0⁻⁷ 升至 10⁻⁵</text><text x="530.0" y="230.0" text-anchor="start" font-size="11.5" fill="#4E5B64" font-weight="400">升高约 100 倍，是收缩的触发信号</text><polygon points="728,181.0 737,188.0 728,195.0" fill="#5F6C75"/><rect x="744" y="124" width="212" height="128" rx="12" fill="#FFFFFF" stroke="#7B4FC4" stroke-width="1.8" opacity="1.0"/><rect x="744" y="124" width="212" height="6" rx="3" fill="#7B4FC4" opacity="1.0"/><text x="762.0" y="164.0" text-anchor="start" font-size="20" fill="#7B4FC4" font-weight="700">4</text><text x="790.0" y="162.0" text-anchor="start" font-size="16" fill="#1B2A33" font-weight="700">Ca²⁺ 结合 TnC</text><text x="762.0" y="190.0" text-anchor="start" font-size="12.5" fill="#37474F" font-weight="400">钙开关打开</text><text x="762.0" y="230.0" text-anchor="start" font-size="11.5" fill="#4E5B64" font-weight="400">肌钙蛋白 C 结合 Ca²⁺，</text><text x="762.0" y="247.0" text-anchor="start" font-size="11.5" fill="#4E5B64" font-weight="400">牵动原肌球蛋白</text><text x="48.0" y="312.0" text-anchor="start" font-size="16" fill="#1B2A33" font-weight="700">离子流向</text><rect x="48" y="328" width="904" height="200" rx="12" fill="#F7FAFC" stroke="#C7D2DC" stroke-width="1.2" opacity="1.0"/><line x1="130" y1="378" x2="870" y2="378" stroke="#4A6FA5" stroke-width="4"/><text x="130.0" y="366.0" text-anchor="start" font-size="11.5" fill="#4A6FA5" font-weight="700">肌膜</text><path d="M330,378 L330,454 q0,16 18,16" fill="none" stroke="#4A6FA5" stroke-width="4"/><text x="338.0" y="428.0" text-anchor="start" font-size="11.5" fill="#4A6FA5" font-weight="600">T 管</text><path d="M640,378 L640,454 q0,16 18,16" fill="none" stroke="#4A6FA5" stroke-width="4"/><text x="648.0" y="428.0" text-anchor="start" font-size="11.5" fill="#4A6FA5" font-weight="600">T 管</text><path d="M160,478 Q400,456 520,478 T840,478" fill="none" stroke="#1C6B45" stroke-width="3.4"/><text x="840.0" y="500.0" text-anchor="end" font-size="11.5" fill="#1C6B45" font-weight="700">肌质网（SR）</text><circle cx="360" cy="438" r="6.5" fill="#1C6B45" opacity="0.9"/><circle cx="404" cy="438" r="6.5" fill="#1C6B45" opacity="0.9"/><circle cx="448" cy="438" r="6.5" fill="#1C6B45" opacity="0.9"/><circle cx="492" cy="438" r="6.5" fill="#1C6B45" opacity="0.9"/><circle cx="536" cy="438" r="6.5" fill="#1C6B45" opacity="0.9"/><circle cx="580" cy="438" r="6.5" fill="#1C6B45" opacity="0.9"/><circle cx="624" cy="438" r="6.5" fill="#1C6B45" opacity="0.9"/><text x="500.0" y="530.0" text-anchor="middle" font-size="12.5" fill="#37474F" font-weight="400">肌质网释放的 Ca²⁺ 扩散至胞质，与细肌丝上的肌钙蛋白结合</text><text x="500.0" y="598.0" text-anchor="middle" font-size="11.5" fill="#4E5B64" font-weight="400">正常胞质 Ca²⁺ &lt;10⁻⁷ mol/L；激活后约 10⁻⁵ mol/L（升高约 100 倍）</text></svg>