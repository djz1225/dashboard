<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-label="钙开关：Ca2+ 决定肌动蛋白结合位点是否暴露"><rect width="1000" height="640" fill="#FFFFFF"/><text x="48.0" y="40.0" text-anchor="start" font-size="11.5" fill="#4E5B64" font-weight="700">机制通路之二</text><text x="48.0" y="72.0" text-anchor="start" font-size="22" fill="#1B2A33" font-weight="700">② 钙开关</text><text x="48.0" y="100.0" text-anchor="start" font-size="13.5" fill="#37474F" font-weight="400">Ca²⁺ 只决定「能不能收缩」；能量是否充足由 ATP 决定</text><rect x="48" y="124" width="436" height="300" rx="14" fill="#F5F7F9" stroke="#5F6C75" stroke-width="2.0" opacity="1.0"/><text x="68.0" y="158.0" text-anchor="start" font-size="12.5" fill="#5F6C75" font-weight="700">静息态｜Ca²⁺ &lt;10⁻⁷ mol/L</text><rect x="338" y="142" width="130" height="26" rx="13" fill="#EDEFF2" stroke="#5F6C75" stroke-width="1.2" opacity="1.0"/><text x="403.0" y="160.0" text-anchor="middle" font-size="11.5" fill="#37474F" font-weight="700">横桥不能结合 ✗</text><line x1="76" y1="274" x2="456" y2="274" stroke="#C97A5B" stroke-width="14" stroke-linecap="round"/><rect x="116.0" y="266.0" width="16" height="16" rx="3" fill="#B9C1C8" stroke="#8E979E" stroke-width="1.4"/><rect x="187.0" y="266.0" width="16" height="16" rx="3" fill="#B9C1C8" stroke="#8E979E" stroke-width="1.4"/><rect x="258.0" y="266.0" width="16" height="16" rx="3" fill="#B9C1C8" stroke="#8E979E" stroke-width="1.4"/><rect x="329.0" y="266.0" width="16" height="16" rx="3" fill="#B9C1C8" stroke="#8E979E" stroke-width="1.4"/><rect x="400.0" y="266.0" width="16" height="16" rx="3" fill="#B9C1C8" stroke="#8E979E" stroke-width="1.4"/><polyline points="84.0,267.0 104.2,252.0 124.4,267.0 144.7,252.0 164.9,267.0 185.1,252.0 205.3,267.0 225.6,252.0 245.8,267.0 266.0,252.0 286.2,267.0 306.4,252.0 326.7,267.0 346.9,252.0 367.1,267.0 387.3,252.0 407.6,267.0 427.8,252.0 448.0,267.0" fill="none" stroke="#D9971F" stroke-width="10" stroke-linecap="round" opacity="0.95"/><text x="266.0" y="330.0" text-anchor="middle" font-size="12.5" fill="#8A5A12" font-weight="700">原肌球蛋白横卧沟上 → 位点被遮挡</text><circle cx="156.8" cy="230.0" r="13" fill="#7B4FC4" stroke="#FFFFFF" stroke-width="2"/><text x="156.8" y="235.0" text-anchor="middle" font-size="11" fill="#FFFFFF" font-weight="700">T</text><circle cx="266.0" cy="230.0" r="13" fill="#7B4FC4" stroke="#FFFFFF" stroke-width="2"/><text x="266.0" y="235.0" text-anchor="middle" font-size="11" fill="#FFFFFF" font-weight="700">T</text><circle cx="375.2" cy="230.0" r="13" fill="#7B4FC4" stroke="#FFFFFF" stroke-width="2"/><text x="375.2" y="235.0" text-anchor="middle" font-size="11" fill="#FFFFFF" font-weight="700">T</text><text x="68.0" y="404.0" text-anchor="start" font-size="11.5" fill="#37474F" font-weight="400">Ca²⁺ 浓度低，TnC 未结合，原肌球蛋白保持原位</text><rect x="516" y="124" width="436" height="300" rx="14" fill="#F2FAF5" stroke="#1C6B45" stroke-width="2.0" opacity="1.0"/><text x="536.0" y="158.0" text-anchor="start" font-size="12.5" fill="#1C6B45" font-weight="700">激活态｜Ca²⁺ 10⁻⁵ mol/L</text><rect x="806" y="142" width="130" height="26" rx="13" fill="#1C6B45" stroke="#1C6B45" stroke-width="1.2" opacity="1.0"/><text x="871.0" y="160.0" text-anchor="middle" font-size="11.5" fill="#FFFFFF" font-weight="700">横桥可结合 ✓</text><line x1="544" y1="274" x2="924" y2="274" stroke="#C97A5B" stroke-width="14" stroke-linecap="round"/><rect x="584.0" y="266.0" width="16" height="16" rx="3" fill="#1C6B45" stroke="#0E4F32" stroke-width="1.4"/><rect x="655.0" y="266.0" width="16" height="16" rx="3" fill="#1C6B45" stroke="#0E4F32" stroke-width="1.4"/><rect x="726.0" y="266.0" width="16" height="16" rx="3" fill="#1C6B45" stroke="#0E4F32" stroke-width="1.4"/><rect x="797.0" y="266.0" width="16" height="16" rx="3" fill="#1C6B45" stroke="#0E4F32" stroke-width="1.4"/><rect x="868.0" y="266.0" width="16" height="16" rx="3" fill="#1C6B45" stroke="#0E4F32" stroke-width="1.4"/><polyline points="552.0,273.6 572.2,268.4 592.4,273.6 612.7,268.4 632.9,273.6 653.1,268.4 673.3,273.6 693.6,268.4 713.8,273.6 734.0,268.4 754.2,273.6 774.4,268.4 794.7,273.6 814.9,268.4 835.1,273.6 855.3,268.4 875.6,273.6 895.8,268.4 916.0,273.6" fill="none" stroke="#D9971F" stroke-width="3.0"/><text x="734.0" y="330.0" text-anchor="middle" font-size="12.5" fill="#1C6B45" font-weight="700">原肌球蛋白滚入双螺旋沟 → 位点暴露</text><circle cx="624.8" cy="230.0" r="13" fill="#1C6B45" stroke="#FFFFFF" stroke-width="2"/><text x="624.8" y="235.0" text-anchor="middle" font-size="11" fill="#FFFFFF" font-weight="700">T</text><circle cx="640.8" cy="216.0" r="8.5" fill="#1C6B45" stroke="#FFFFFF" stroke-width="1.6"/><text x="640.8" y="219.5" text-anchor="middle" font-size="11" fill="#FFFFFF" font-weight="700">Ca</text><circle cx="734.0" cy="230.0" r="13" fill="#1C6B45" stroke="#FFFFFF" stroke-width="2"/><text x="734.0" y="235.0" text-anchor="middle" font-size="11" fill="#FFFFFF" font-weight="700">T</text><circle cx="750.0" cy="216.0" r="8.5" fill="#1C6B45" stroke="#FFFFFF" stroke-width="1.6"/><text x="750.0" y="219.5" text-anchor="middle" font-size="11" fill="#FFFFFF" font-weight="700">Ca</text><circle cx="843.2" cy="230.0" r="13" fill="#1C6B45" stroke="#FFFFFF" stroke-width="2"/><text x="843.2" y="235.0" text-anchor="middle" font-size="11" fill="#FFFFFF" font-weight="700">T</text><circle cx="859.2" cy="216.0" r="8.5" fill="#1C6B45" stroke="#FFFFFF" stroke-width="1.6"/><text x="859.2" y="219.5" text-anchor="middle" font-size="11" fill="#FFFFFF" font-weight="700">Ca</text><text x="536.0" y="404.0" text-anchor="start" font-size="11.5" fill="#37474F" font-weight="400">Ca²⁺ 结合 TnC → 构象改变 → 牵动原肌球蛋白移位</text><rect x="48" y="464" width="904" height="66" rx="10" fill="#FCF8EE" stroke="#8A5A12" stroke-width="1.4" opacity="1.0"/><text x="70.0" y="492.0" text-anchor="start" font-size="12.5" fill="#8A5A12" font-weight="700">常见误区</text><text x="70.0" y="516.0" text-anchor="start" font-size="13.5" fill="#37474F" font-weight="400">Ca²⁺ 不是「燃料」。它只把开关拨到允许状态；拉动细肌丝的功全部由 ATP 水解提供。</text><text x="500.0" y="618.0" text-anchor="middle" font-size="11.5" fill="#4E5B64" font-weight="400">肌钙蛋白 C（TnC）是 Ca²⁺ 受体；原肌球蛋白移位约 2 nm 即可暴露结合位点</text></svg>