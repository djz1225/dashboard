<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 905" width="1440" height="905" role="img" aria-label="肌丝滑行机制：兴奋收缩耦联、钙开关与横桥循环三条通路"><rect width="1440" height="905" fill="#FFFFFF"/><text x="720.0" y="36.0" text-anchor="middle" font-size="21" fill="#1B2A33" font-weight="700">肌丝滑行 · 机制版</text><text x="720.0" y="60.0" text-anchor="middle" font-size="12.5" fill="#5C6B73" font-weight="400">三条通路串起来：动作电位 → Ca²⁺ 释放 → 钙开关打开 → 横桥循环做功 → 细肌丝滑动</text><text x="40.0" y="108.0" text-anchor="start" font-size="13.5" fill="#1B2A33" font-weight="700">通路一　兴奋-收缩耦联（Excitations–Contraction Coupling）</text><rect x="60" y="124" width="296" height="78" rx="12" fill="#FBFDFF" stroke="#4A6FA5" stroke-width="1.8"/><rect x="60" y="124" width="6" height="78" rx="3" fill="#4A6FA5"/><text x="82.0" y="154.0" text-anchor="start" font-size="13" fill="#1B2A33" font-weight="700">动作电位</text><text x="82.0" y="176.0" text-anchor="start" font-size="11" fill="#5C6B73" font-weight="400">沿肌膜传导</text><polygon points="363.0,157 374.0,163 363.0,169" fill="#5C6B73" opacity="0.6"/><rect x="382" y="124" width="296" height="78" rx="12" fill="#FBFDFF" stroke="#5B8FD6" stroke-width="1.8"/><rect x="382" y="124" width="6" height="78" rx="3" fill="#5B8FD6"/><text x="404.0" y="154.0" text-anchor="start" font-size="13" fill="#1B2A33" font-weight="700">T 管</text><text x="404.0" y="176.0" text-anchor="start" font-size="11" fill="#5C6B73" font-weight="400">深入细胞内部</text><polygon points="685.0,157 696.0,163 685.0,169" fill="#5C6B73" opacity="0.6"/><rect x="704" y="124" width="296" height="78" rx="12" fill="#FBFDFF" stroke="#2FA98C" stroke-width="1.8"/><rect x="704" y="124" width="6" height="78" rx="3" fill="#2FA98C"/><text x="726.0" y="154.0" text-anchor="start" font-size="13" fill="#1B2A33" font-weight="700">肌质网释放 Ca²⁺</text><text x="726.0" y="176.0" text-anchor="start" font-size="11" fill="#5C6B73" font-weight="400">浓度 10⁻⁷→10⁻⁵</text><polygon points="1007.0,157 1018.0,163 1007.0,169" fill="#5C6B73" opacity="0.6"/><rect x="1026" y="124" width="296" height="78" rx="12" fill="#FBFDFF" stroke="#8E5BD8" stroke-width="1.8"/><rect x="1026" y="124" width="6" height="78" rx="3" fill="#8E5BD8"/><text x="1048.0" y="154.0" text-anchor="start" font-size="13" fill="#1B2A33" font-weight="700">Ca²⁺ 结合 TnC</text><text x="1048.0" y="176.0" text-anchor="start" font-size="11" fill="#5C6B73" font-weight="400">开关打开</text><text x="40.0" y="250.0" text-anchor="start" font-size="13.5" fill="#1B2A33" font-weight="700">通路二　钙开关：Ca²⁺ 决定「能不能收缩」，ATP 决定「有没有能量」</text><rect x="60" y="266" width="660" height="168" rx="12" fill="#FBFDFF" stroke="#8090A0" stroke-width="1.6"/><text x="76.0" y="290.0" text-anchor="start" font-size="12" fill="#8090A0" font-weight="700">静息：Ca²⁺ 低（&lt;10⁻⁷ mol/L）</text><text x="702.0" y="290.0" text-anchor="end" font-size="11.5" fill="#8090A0" font-weight="700">横桥：不能结合 ✗</text><line x1="90" y1="354" x2="690" y2="354" stroke="#C97A5B" stroke-width="11" stroke-linecap="round"/><rect x="133.0" y="340.0" width="10" height="10" rx="2" fill="#C9CFD6" stroke="#A8B0B8" stroke-width="1"/><rect x="233.8" y="340.0" width="10" height="10" rx="2" fill="#C9CFD6" stroke="#A8B0B8" stroke-width="1"/><rect x="334.6" y="340.0" width="10" height="10" rx="2" fill="#C9CFD6" stroke="#A8B0B8" stroke-width="1"/><rect x="435.4" y="340.0" width="10" height="10" rx="2" fill="#C9CFD6" stroke="#A8B0B8" stroke-width="1"/><rect x="536.2" y="340.0" width="10" height="10" rx="2" fill="#C9CFD6" stroke="#A8B0B8" stroke-width="1"/><rect x="637.0" y="340.0" width="10" height="10" rx="2" fill="#C9CFD6" stroke="#A8B0B8" stroke-width="1"/><polyline points="100.0,351.0 129.0,337.0 158.0,351.0 187.0,337.0 216.0,351.0 245.0,337.0 274.0,351.0 303.0,337.0 332.0,351.0 361.0,337.0 390.0,351.0 419.0,337.0 448.0,351.0 477.0,337.0 506.0,351.0 535.0,337.0 564.0,351.0 593.0,337.0 622.0,351.0 651.0,337.0 680.0,351.0" fill="none" stroke="#E0A33C" stroke-width="7.5" stroke-linecap="round" opacity="0.92"/><text x="390.0" y="398.0" text-anchor="middle" font-size="10.5" fill="#6B4A22" font-weight="700">原肌球蛋白横卧在沟上 → 结合位点被遮挡</text><circle cx="227.6" cy="322.0" r="8" fill="#8E5BD8" stroke="white" stroke-width="1.4"/><text x="227.6" y="325.0" text-anchor="middle" font-size="7.5" fill="white" font-weight="700">T</text><circle cx="390.0" cy="322.0" r="8" fill="#8E5BD8" stroke="white" stroke-width="1.4"/><text x="390.0" y="325.0" text-anchor="middle" font-size="7.5" fill="white" font-weight="700">T</text><circle cx="552.4" cy="322.0" r="8" fill="#8E5BD8" stroke="white" stroke-width="1.4"/><text x="552.4" y="325.0" text-anchor="middle" font-size="7.5" fill="white" font-weight="700">T</text><rect x="760" y="266" width="660" height="168" rx="12" fill="#FBFDFF" stroke="#2FA98C" stroke-width="1.6"/><text x="776.0" y="290.0" text-anchor="start" font-size="12" fill="#2FA98C" font-weight="700">激活：Ca²⁺ 高（10⁻⁵ mol/L）</text><text x="1402.0" y="290.0" text-anchor="end" font-size="11.5" fill="#2FA98C" font-weight="700">横桥：可结合 ✓</text><line x1="790" y1="354" x2="1390" y2="354" stroke="#C97A5B" stroke-width="11" stroke-linecap="round"/><rect x="833.0" y="340.0" width="10" height="10" rx="2" fill="#1C6B45" stroke="#0E4F32" stroke-width="1"/><rect x="933.8" y="340.0" width="10" height="10" rx="2" fill="#1C6B45" stroke="#0E4F32" stroke-width="1"/><rect x="1034.6" y="340.0" width="10" height="10" rx="2" fill="#1C6B45" stroke="#0E4F32" stroke-width="1"/><rect x="1135.4" y="340.0" width="10" height="10" rx="2" fill="#1C6B45" stroke="#0E4F32" stroke-width="1"/><rect x="1236.2" y="340.0" width="10" height="10" rx="2" fill="#1C6B45" stroke="#0E4F32" stroke-width="1"/><rect x="1337.0" y="340.0" width="10" height="10" rx="2" fill="#1C6B45" stroke="#0E4F32" stroke-width="1"/><polyline points="800.0,354.2 829.0,349.8 858.0,354.2 887.0,349.8 916.0,354.2 945.0,349.8 974.0,354.2 1003.0,349.8 1032.0,354.2 1061.0,349.8 1090.0,354.2 1119.0,349.8 1148.0,354.2 1177.0,349.8 1206.0,354.2 1235.0,349.8 1264.0,354.2 1293.0,349.8 1322.0,354.2 1351.0,349.8 1380.0,354.2" fill="none" stroke="#E0A33C" stroke-width="2.0" opacity="0.95"/><text x="1090.0" y="398.0" text-anchor="middle" font-size="10.5" fill="#1C6B45" font-weight="700">原肌球蛋白滚入双螺旋沟 → 结合位点暴露</text><circle cx="927.6" cy="322.0" r="8" fill="#2FA98C" stroke="white" stroke-width="1.4"/><text x="927.6" y="325.0" text-anchor="middle" font-size="7.5" fill="white" font-weight="700">T</text><circle cx="938.6" cy="314.0" r="5" fill="#2FA98C" stroke="white" stroke-width="1"/><text x="938.6" y="316.0" text-anchor="middle" font-size="4.6" fill="white" font-weight="700">Ca</text><circle cx="1090.0" cy="322.0" r="8" fill="#2FA98C" stroke="white" stroke-width="1.4"/><text x="1090.0" y="325.0" text-anchor="middle" font-size="7.5" fill="white" font-weight="700">T</text><circle cx="1101.0" cy="314.0" r="5" fill="#2FA98C" stroke="white" stroke-width="1"/><text x="1101.0" y="316.0" text-anchor="middle" font-size="4.6" fill="white" font-weight="700">Ca</text><circle cx="1252.4" cy="322.0" r="8" fill="#2FA98C" stroke="white" stroke-width="1.4"/><text x="1252.4" y="325.0" text-anchor="middle" font-size="7.5" fill="white" font-weight="700">T</text><circle cx="1263.4" cy="314.0" r="5" fill="#2FA98C" stroke="white" stroke-width="1"/><text x="1263.4" y="316.0" text-anchor="middle" font-size="4.6" fill="white" font-weight="700">Ca</text><text x="40.0" y="440.0" text-anchor="start" font-size="13.5" fill="#1B2A33" font-weight="700">通路三　横桥循环（唯一做功的环节，单次 ≈50 ms）</text><rect x="60" y="456" width="258" height="250" rx="12" fill="#FBFDFF" stroke="#CBD5DC" stroke-width="1.4"/><circle cx="84" cy="480" r="14" fill="#4A6FA5"/><text x="84.0" y="485.0" text-anchor="middle" font-size="13" fill="white" font-weight="700">①</text><text x="106.0" y="485.0" text-anchor="start" font-size="11" fill="#1B2A33" font-weight="700">rigor 结合态</text><rect x="80" y="601" width="218" height="18" rx="9" fill="#4A6FA5" stroke="#2E4A73" stroke-width="1.1"/><line x1="80" y1="538" x2="298" y2="538" stroke="#C97A5B" stroke-width="8" stroke-linecap="round"/><line x1="189.0" y1="601.0" x2="201.6" y2="588.4" stroke="#2E4A73" stroke-width="6.0" stroke-linecap="round"/><defs><radialGradient id="hbound45" cx="34%" cy="28%" r="74%"><stop offset="0" stop-color="#A4B7D2"/><stop offset="0.62" stop-color="#4A6FA5"/><stop offset="1" stop-color="#37527A"/></radialGradient></defs><g transform="rotate(45.0 213.3 576.7)"><ellipse cx="213.3" cy="576.7" rx="10.3" ry="13.8" fill="url(#hbound45)" stroke="#2E4A73" stroke-width="1.3"/></g><text x="74.0" y="656.0" text-anchor="start" font-size="9.2" fill="#5C6B73" font-weight="400">肌球蛋白头部与肌动蛋白呈高亲和力结合；</text><text x="74.0" y="669.5" text-anchor="start" font-size="9.2" fill="#5C6B73" font-weight="400">无 ATP 时无法解离（尸僵即此态堆积）</text><polygon points="321.0,580 330.0,586 321.0,592" fill="#4A6FA5" opacity="0.55"/><rect x="334" y="456" width="258" height="250" rx="12" fill="#FBFDFF" stroke="#CBD5DC" stroke-width="1.4"/><circle cx="358" cy="480" r="14" fill="#4A6FA5"/><text x="358.0" y="485.0" text-anchor="middle" font-size="13" fill="white" font-weight="700">②</text><text x="380.0" y="485.0" text-anchor="start" font-size="10" fill="#1B2A33" font-weight="700">ATP 结合 → 解离</text><rect x="354" y="601" width="218" height="18" rx="9" fill="#4A6FA5" stroke="#2E4A73" stroke-width="1.1"/><line x1="354" y1="538" x2="572" y2="538" stroke="#C97A5B" stroke-width="8" stroke-linecap="round"/><line x1="463.0" y1="601.0" x2="475.6" y2="588.4" stroke="#2E4A73" stroke-width="6.0" stroke-linecap="round"/><defs><radialGradient id="hdetach45" cx="34%" cy="28%" r="74%"><stop offset="0" stop-color="#A4B7D2"/><stop offset="0.62" stop-color="#4A6FA5"/><stop offset="1" stop-color="#37527A"/></radialGradient></defs><g transform="rotate(45.0 487.3 576.7)"><ellipse cx="487.3" cy="576.7" rx="10.3" ry="13.8" fill="url(#hdetach45)" stroke="#2E4A73" stroke-width="1.3"/></g><circle cx="509.7" cy="575.0" r="9.5" fill="#E2483C" stroke="white" stroke-width="1.6"/><text x="509.7" y="577.4" text-anchor="middle" font-size="8.4" fill="white" font-weight="700">ATP</text><text x="348.0" y="656.0" text-anchor="start" font-size="9.2" fill="#5C6B73" font-weight="400">ATP 结合到肌球蛋白头部，诱导构象改变，</text><text x="348.0" y="669.5" text-anchor="start" font-size="9.2" fill="#5C6B73" font-weight="400">亲和力骤降，头部脱离肌动蛋白</text><polygon points="595.0,580 604.0,586 595.0,592" fill="#4A6FA5" opacity="0.55"/><rect x="608" y="456" width="258" height="250" rx="12" fill="#FBFDFF" stroke="#CBD5DC" stroke-width="1.4"/><circle cx="632" cy="480" r="14" fill="#4A6FA5"/><text x="632.0" y="485.0" text-anchor="middle" font-size="13" fill="white" font-weight="700">③</text><text x="654.0" y="485.0" text-anchor="start" font-size="10" fill="#1B2A33" font-weight="700">ATP 水解 → 复位</text><rect x="628" y="601" width="218" height="18" rx="9" fill="#4A6FA5" stroke="#2E4A73" stroke-width="1.1"/><line x1="628" y1="538" x2="846" y2="538" stroke="#C97A5B" stroke-width="8" stroke-linecap="round"/><line x1="737.0" y1="601.0" x2="737.0" y2="583.1" stroke="#2E4A73" stroke-width="6.0" stroke-linecap="round"/><defs><radialGradient id="hcocked90" cx="34%" cy="28%" r="74%"><stop offset="0" stop-color="#A4B7D2"/><stop offset="0.62" stop-color="#4A6FA5"/><stop offset="1" stop-color="#37527A"/></radialGradient></defs><g transform="rotate(0.0 737.0 566.6)"><ellipse cx="737.0" cy="566.6" rx="10.3" ry="13.8" fill="url(#hcocked90)" stroke="#2E4A73" stroke-width="1.3"/></g><circle cx="757.6" cy="564.9" r="9.5" fill="#E2483C" stroke="white" stroke-width="1.6"/><text x="757.6" y="567.3" text-anchor="middle" font-size="7.2" fill="white" font-weight="700">ADP·Pi</text><text x="622.0" y="656.0" text-anchor="start" font-size="9.2" fill="#5C6B73" font-weight="400">ATP→ADP+Pi，能量储存在头部；</text><text x="622.0" y="669.5" text-anchor="start" font-size="9.2" fill="#5C6B73" font-weight="400">头部沿细肌丝前移约 5 nm 并转成垂直（</text><text x="622.0" y="683.0" text-anchor="start" font-size="9.2" fill="#5C6B73" font-weight="400">预备冲程）</text><polygon points="869.0,580 878.0,586 869.0,592" fill="#4A6FA5" opacity="0.55"/><rect x="882" y="456" width="258" height="250" rx="12" fill="#FBFDFF" stroke="#CBD5DC" stroke-width="1.4"/><circle cx="906" cy="480" r="14" fill="#4A6FA5"/><text x="906.0" y="485.0" text-anchor="middle" font-size="13" fill="white" font-weight="700">④</text><text x="928.0" y="485.0" text-anchor="start" font-size="10" fill="#1B2A33" font-weight="700">Pi 释放 → 动力冲程</text><rect x="902" y="601" width="218" height="18" rx="9" fill="#4A6FA5" stroke="#2E4A73" stroke-width="1.1"/><line x1="902" y1="538" x2="1120" y2="538" stroke="#C97A5B" stroke-width="8" stroke-linecap="round"/><line x1="1011.0" y1="601.0" x2="1023.6" y2="588.4" stroke="#2E4A73" stroke-width="6.0" stroke-linecap="round"/><defs><radialGradient id="hpower45" cx="34%" cy="28%" r="74%"><stop offset="0" stop-color="#A4B7D2"/><stop offset="0.62" stop-color="#4A6FA5"/><stop offset="1" stop-color="#37527A"/></radialGradient></defs><g transform="rotate(45.0 1035.3 576.7)"><ellipse cx="1035.3" cy="576.7" rx="10.3" ry="13.8" fill="url(#hpower45)" stroke="#2E4A73" stroke-width="1.3"/></g><path d="M 1030.2,547.4 A 34.4,34.4 0 0 1 1063.7,564.6" fill="none" stroke="#E2483C" stroke-width="2.2" stroke-dasharray="5 4"/><polygon points="1063.7,564.6 1056.0,556.9 1065.4,554.3" fill="#E2483C"/><text x="1069.7" y="550.9" text-anchor="start" font-size="10.5" fill="#E2483C" font-weight="700" paint-order="stroke" stroke="white" stroke-width="3.2" stroke-linejoin="round">45°</text><circle cx="1057.7" cy="575.0" r="9.5" fill="#E2483C" stroke="white" stroke-width="1.6"/><text x="1057.7" y="577.4" text-anchor="middle" font-size="8.4" fill="white" font-weight="700">Pi</text><text x="896.0" y="656.0" text-anchor="start" font-size="9.2" fill="#5C6B73" font-weight="400">Pi 释放触发强结合，头部向杆臂方向扭动约</text><text x="896.0" y="669.5" text-anchor="start" font-size="9.2" fill="#5C6B73" font-weight="400"> 45°，拖动细肌丝向 M 线滑行；</text><text x="896.0" y="683.0" text-anchor="start" font-size="9.2" fill="#5C6B73" font-weight="400">产生 4–6 pN 力</text><polygon points="1143.0,580 1152.0,586 1143.0,592" fill="#4A6FA5" opacity="0.55"/><rect x="1156" y="456" width="258" height="250" rx="12" fill="#FBFDFF" stroke="#CBD5DC" stroke-width="1.4"/><circle cx="1180" cy="480" r="14" fill="#4A6FA5"/><text x="1180.0" y="485.0" text-anchor="middle" font-size="13" fill="white" font-weight="700">⑤</text><text x="1202.0" y="485.0" text-anchor="start" font-size="10" fill="#1B2A33" font-weight="700">ADP 释放 → 回到起始</text><rect x="1176" y="601" width="218" height="18" rx="9" fill="#4A6FA5" stroke="#2E4A73" stroke-width="1.1"/><line x1="1176" y1="538" x2="1394" y2="538" stroke="#C97A5B" stroke-width="8" stroke-linecap="round"/><line x1="1285.0" y1="601.0" x2="1297.6" y2="588.4" stroke="#2E4A73" stroke-width="6.0" stroke-linecap="round"/><defs><radialGradient id="hrelease45" cx="34%" cy="28%" r="74%"><stop offset="0" stop-color="#A4B7D2"/><stop offset="0.62" stop-color="#4A6FA5"/><stop offset="1" stop-color="#37527A"/></radialGradient></defs><g transform="rotate(45.0 1309.3 576.7)"><ellipse cx="1309.3" cy="576.7" rx="10.3" ry="13.8" fill="url(#hrelease45)" stroke="#2E4A73" stroke-width="1.3"/></g><circle cx="1331.7" cy="575.0" r="9.5" fill="#E2483C" stroke="white" stroke-width="1.6"/><text x="1331.7" y="577.4" text-anchor="middle" font-size="8.4" fill="white" font-weight="700">ADP</text><text x="1170.0" y="656.0" text-anchor="start" font-size="9.2" fill="#5C6B73" font-weight="400">ADP 释放，头部回到 rigor 构象，</text><text x="1170.0" y="669.5" text-anchor="start" font-size="9.2" fill="#5C6B73" font-weight="400">等待下一个 ATP；若 Ca²⁺ 仍高则重</text><text x="1170.0" y="683.0" text-anchor="start" font-size="9.2" fill="#5C6B73" font-weight="400">复循环（约 50 ms/次）</text><text x="40.0" y="744.0" text-anchor="start" font-size="12.5" fill="#1B2A33" font-weight="700">因果链（收缩全过程）</text><rect x="66.0" y="758" width="153.0" height="34" rx="8" fill="#EDF4FA" stroke="#CBD5DC" stroke-width="1"/><text x="142.5" y="780.0" text-anchor="middle