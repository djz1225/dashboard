<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" role="img" aria-label="过敏性紫癜（IgA 血管炎）的发病机制与四联征"><rect width="1000" height="720" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F6C75"/></marker></defs><text x="48.0" y="42.0" text-anchor="start" font-size="11.5" fill="#4E5B64" font-weight="700">机制版 · 血液系统</text><text x="48.0" y="76.0" text-anchor="start" font-size="22" fill="#1B2A33" font-weight="700">过敏性紫癜（IgA 血管炎）</text><text x="48.0" y="106.0" text-anchor="start" font-size="13.5" fill="#37474F" font-weight="400">IgA 免疫复合物沉积于小血管壁 → 白细胞碎裂性血管炎 → 四联征</text><rect x="48.0" y="132.0" width="285.3" height="120.0" rx="12" fill="#FFFFFF" stroke="#1F5FA0" stroke-width="1.8"/><text x="68.0" y="164.0" text-anchor="start" font-size="16" fill="#1B2A33" font-weight="700">① 诱因</text><text x="68.0" y="188.0" text-anchor="start" font-size="12.5" fill="#1F5FA0" font-weight="600">感染/药物/食物</text><text x="68.0" y="212.0" text-anchor="start" font-size="11.5" fill="#37474F" font-weight="400">黏膜免疫异常，产生大量 Ig</text><text x="68.0" y="230.0" text-anchor="start" font-size="11.5" fill="#37474F" font-weight="400">A1</text><line x1="337.3" y1="192.0" x2="352.3" y2="192.0" stroke="#1F5FA0" stroke-width="2.6" stroke-linecap="round" marker-end="url(#ah)"/><rect x="357.3" y="132.0" width="285.3" height="120.0" rx="12" fill="#FFFFFF" stroke="#8A5A12" stroke-width="1.8"/><text x="377.3" y="164.0" text-anchor="start" font-size="16" fill="#1B2A33" font-weight="700">② 沉积</text><text x="377.3" y="188.0" text-anchor="start" font-size="12.5" fill="#8A5A12" font-weight="600">IgA 免疫复合物</text><text x="377.3" y="212.0" text-anchor="start" font-size="11.5" fill="#37474F" font-weight="400">沉积于小血管壁（皮肤、关节、</text><text x="377.3" y="230.0" text-anchor="start" font-size="11.5" fill="#37474F" font-weight="400">肠、肾）</text><line x1="646.7" y1="192.0" x2="661.7" y2="192.0" stroke="#8A5A12" stroke-width="2.6" stroke-linecap="round" marker-end="url(#ah)"/><rect x="666.7" y="132.0" width="285.3" height="120.0" rx="12" fill="#FFFFFF" stroke="#A3382C" stroke-width="1.8"/><text x="686.7" y="164.0" text-anchor="start" font-size="16" fill="#1B2A33" font-weight="700">③ 血管炎</text><text x="686.7" y="188.0" text-anchor="start" font-size="12.5" fill="#A3382C" font-weight="600">白细胞碎裂性</text><text x="686.7" y="212.0" text-anchor="start" font-size="11.5" fill="#37474F" font-weight="400">补体激活、中性粒浸润 → 血</text><text x="686.7" y="230.0" text-anchor="start" font-size="11.5" fill="#37474F" font-weight="400">管壁坏死</text><text x="48.0" y="290.0" text-anchor="start" font-size="16" fill="#1B2A33" font-weight="700">四联征（可单独或组合出现）</text><rect x="48.0" y="308.0" width="214.0" height="168.0" rx="10" fill="#FFFFFF" stroke="#C7D2DC" stroke-width="1.4"/><rect x="48.0" y="308.0" width="214.0" height="42.0" rx="10" fill="#EDF4FA"/><text x="155.0" y="334.0" text-anchor="middle" font-size="12.5" fill="#1F5FA0" font-weight="700">皮肤</text><text x="155.0" y="372.0" text-anchor="middle" font-size="12.5" fill="#1B2A33" font-weight="700">可触性紫癜</text><text x="155.0" y="396.0" text-anchor="middle" font-size="11.5" fill="#37474F" font-weight="400">对称分布于下肢与臀</text><text x="155.0" y="413.0" text-anchor="middle" font-size="11.5" fill="#37474F" font-weight="400">部，压之不褪色</text><text x="155.0" y="464.0" text-anchor="middle" font-size="11.5" fill="#8A5A12" font-weight="700">必有（必要条件）</text><rect x="278.0" y="308.0" width="214.0" height="168.0" rx="10" fill="#FFFFFF" stroke="#C7D2DC" stroke-width="1.4"/><rect x="278.0" y="308.0" width="214.0" height="42.0" rx="10" fill="#EDF4FA"/><text x="385.0" y="334.0" text-anchor="middle" font-size="12.5" fill="#1F5FA0" font-weight="700">关节</text><text x="385.0" y="372.0" text-anchor="middle" font-size="12.5" fill="#1B2A33" font-weight="700">关节痛/关节炎</text><text x="385.0" y="396.0" text-anchor="middle" font-size="11.5" fill="#37474F" font-weight="400">膝踝等大关节，非游</text><text x="385.0" y="413.0" text-anchor="middle" font-size="11.5" fill="#37474F" font-weight="400">走性，不遗留畸形</text><text x="385.0" y="464.0" text-anchor="middle" font-size="11.5" fill="#8A5A12" font-weight="700">约 75%</text><rect x="508.0" y="308.0" width="214.0" height="168.0" rx="10" fill="#FFFFFF" stroke="#C7D2DC" stroke-width="1.4"/><rect x="508.0" y="308.0" width="214.0" height="42.0" rx="10" fill="#EDF4FA"/><text x="615.0" y="334.0" text-anchor="middle" font-size="12.5" fill="#1F5FA0" font-weight="700">胃肠</text><text x="615.0" y="372.0" text-anchor="middle" font-size="12.5" fill="#1B2A33" font-weight="700">腹痛、便血</text><text x="615.0" y="396.0" text-anchor="middle" font-size="11.5" fill="#37474F" font-weight="400">肠壁水肿出血，严重</text><text x="615.0" y="413.0" text-anchor="middle" font-size="11.5" fill="#37474F" font-weight="400">可肠套叠</text><text x="615.0" y="464.0" text-anchor="middle" font-size="11.5" fill="#8A5A12" font-weight="700">约 50–75%</text><rect x="738.0" y="308.0" width="214.0" height="168.0" rx="10" fill="#FFFFFF" stroke="#C7D2DC" stroke-width="1.4"/><rect x="738.0" y="308.0" width="214.0" height="42.0" rx="10" fill="#EDF4FA"/><text x="845.0" y="334.0" text-anchor="middle" font-size="12.5" fill="#1F5FA0" font-weight="700">肾脏</text><text x="845.0" y="372.0" text-anchor="middle" font-size="12.5" fill="#1B2A33" font-weight="700">紫癜性肾炎</text><text x="845.0" y="396.0" text-anchor="middle" font-size="11.5" fill="#37474F" font-weight="400">血尿、蛋白尿，决定</text><text x="845.0" y="413.0" text-anchor="middle" font-size="11.5" fill="#37474F" font-weight="400">远期预后</text><text x="845.0" y="464.0" text-anchor="middle" font-size="11.5" fill="#8A5A12" font-weight="700">约 30–50%</text><rect x="48.0" y="500.0" width="904.0" height="68.0" rx="10" fill="#FDF8EE" stroke="#8A5A12" stroke-width="1.2"/><text x="68.0" y="526.0" text-anchor="start" font-size="12.5" fill="#8A5A12" font-weight="700">考试要点</text><text x="68.0" y="550.0" text-anchor="start" font-size="13.5" fill="#37474F" font-weight="400">血小板计数正常 + 凝血功能正常，可与血小板减少性紫癜、DIC 鉴别；肾受累程度决定预后。</text><text x="500.0" y="702.0" text-anchor="middle" font-size="11.5" fill="#4E5B64" font-weight="400">本病为 IgA 血管炎，与过敏原检测无必然对应；仅用于教学示意。</text></svg>