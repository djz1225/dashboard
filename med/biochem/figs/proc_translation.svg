<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 556" role="img" aria-labelledby="ft fd" style="background:#ffffff"><title id="ft">翻译：三位点循环</title><desc id="fd">翻译在核糖体上进行：氨酰-tRNA 进入 A 位，肽基转移酶把 P 位肽链转到 A 位，核糖体再沿 mRNA 前移一个密码子；遇终止密码子由释放因子识别，肽链水解释放。每延长一个氨基酸消耗 4 个高能键。</desc><text x="22" y="28" font-size="17.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">翻译：三位点循环</text><text x="22" y="46" font-size="11.5" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">A 进位 → 成肽 → 移位；每延长 1 个氨基酸耗 4 个高能键</text><rect x="22" y="60" width="436" height="176" rx="10" fill="#f8fbfd" stroke="#dfe8f1" stroke-width="1"/><text x="37" y="81" font-size="11.5" fill="#8899aa" font-weight="700" letter-spacing="1" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">分子层面</text><path d="M36,180 H444" stroke="#2c5f9e" stroke-width="4" stroke-linecap="round"/><rect x="28" y="170" width="48" height="20" rx="4" fill="#dbe7f5" stroke="#2c5f9e" stroke-width="1.2"/><text x="52" y="185" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2c5f9e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">AUG</text><rect x="90" y="170" width="48" height="20" rx="4" fill="#dbe7f5" stroke="#2c5f9e" stroke-width="1.2"/><text x="114" y="185" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2c5f9e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">GCA</text><rect x="152" y="170" width="48" height="20" rx="4" fill="#dbe7f5" stroke="#2c5f9e" stroke-width="1.2"/><text x="176" y="185" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2c5f9e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">UAC</text><rect x="214" y="170" width="48" height="20" rx="4" fill="#fdeceb" stroke="#c0392b" stroke-width="1.2"/><text x="238" y="185" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c0392b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">UAA</text><text x="36" y="156" font-size="11" fill="#a8b6c4" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">mRNA 5′ → 3′</text><ellipse cx="172" cy="118" rx="62" ry="26" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.6"/><ellipse cx="172" cy="156" rx="46" ry="16" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="172" y="122" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">大亚基</text><text x="172" y="160" text-anchor="middle" font-size="11" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">小亚基</text><circle cx="138" cy="136" r="13" fill="#ffffff" stroke="#0f766e" stroke-width="1.2" opacity="0.9"/><text x="138" y="140" text-anchor="middle" font-size="11" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">E</text><circle cx="172" cy="136" r="13" fill="#ffffff" stroke="#0f766e" stroke-width="1.2" opacity="0.9"/><text x="172" y="140" text-anchor="middle" font-size="11" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">P</text><circle cx="206" cy="136" r="13" fill="#ffffff" stroke="#0f766e" stroke-width="1.2" opacity="0.9"/><text x="206" y="140" text-anchor="middle" font-size="11" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">A</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.3306;0.495;0.4956;1" dur="11.0s" repeatCount="indefinite"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.495;0.4956;0.665;0.6656;1" dur="11.0s" repeatCount="indefinite"/><circle cx="166" cy="100" r="5" fill="#c0392b"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.665;0.6656;0.83;0.8306;1" dur="11.0s" repeatCount="indefinite"/><circle cx="166" cy="100" r="5" fill="#c0392b"/><circle cx="166" cy="87" r="5" fill="#c0392b"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.83;0.8306;1" dur="11.0s" repeatCount="indefinite"/><circle cx="166" cy="100" r="5" fill="#c0392b"/><circle cx="166" cy="87" r="5" fill="#c0392b"/><circle cx="166" cy="74" r="5" fill="#c0392b"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.3306;0.495;0.4956;1" dur="11.0s" repeatCount="indefinite"/><path d="M428,186 L206,164" stroke="#a8791a" stroke-width="2.2" stroke-dasharray="4 3" fill="none"/><text x="444" y="202" text-anchor="end" font-size="11" font-weight="700" fill="#a8791a" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">氨酰-tRNA 进 A 位</text></g><text x="444" y="226" text-anchor="end" font-size="11" fill="#a8b6c4" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">每延长 1 个氨基酸耗 4 个高能键</text><rect x="22" y="258" width="436" height="3" rx="1.5" fill="#e8eff6"/><path d="M22,259.5 H458" stroke="#0f766e" stroke-width="3" stroke-linecap="round" opacity="0.42" stroke-dasharray="436" stroke-dashoffset="436"><animate attributeName="stroke-dashoffset" values="436;0" keyTimes="0;1" dur="11.0s" repeatCount="indefinite"/></path><circle cx="56.7" cy="259.5" r="4" fill="#ffffff" stroke="#cfdce8" stroke-width="1.5"/><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.16;0.1606;1" dur="11.0s" repeatCount="indefinite"/><circle cx="56.7" cy="259.5" r="5.5" fill="#2c5f9e"/></g><g opacity="1"><animate attributeName="opacity" values="0.0;0.0;1.0;1.0" keyTimes="0;0.16;0.1606;1" dur="11.0s" repeatCount="indefinite"/><text x="56.7" y="280" text-anchor="middle" font-size="11.5" fill="#b6c4d2" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">密码子识别</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.16;0.1606;1" dur="11.0s" repeatCount="indefinite"/><text x="56.7" y="280" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2c5f9e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">密码子识别</text></g><circle cx="130.0" cy="259.5" r="4" fill="#ffffff" stroke="#cfdce8" stroke-width="1.5"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.16;0.1606;0.33;0.3306;1" dur="11.0s" repeatCount="indefinite"/><circle cx="130.0" cy="259.5" r="5.5" fill="#a8791a"/></g><g opacity="1"><animate attributeName="opacity" values="1.0;1.0;0.0;0.0;1.0;1.0" keyTimes="0;0.16;0.1606;0.33;0.3306;1" dur="11.0s" repeatCount="indefinite"/><text x="130.0" y="280" text-anchor="middle" font-size="11.5" fill="#b6c4d2" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">氨基酸活化</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.16;0.1606;0.33;0.3306;1" dur="11.0s" repeatCount="indefinite"/><text x="130.0" y="280" text-anchor="middle" font-size="11.5" font-weight="700" fill="#a8791a" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">氨基酸活化</text></g><circle cx="203.3" cy="259.5" r="4" fill="#ffffff" stroke="#cfdce8" stroke-width="1.5"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.3306;0.495;0.4956;1" dur="11.0s" repeatCount="indefinite"/><circle cx="203.3" cy="259.5" r="5.5" fill="#0f766e"/></g><g opacity="1"><animate attributeName="opacity" values="1.0;1.0;0.0;0.0;1.0;1.0" keyTimes="0;0.33;0.3306;0.495;0.4956;1" dur="11.0s" repeatCount="indefinite"/><text x="203.3" y="280" text-anchor="middle" font-size="11.5" fill="#b6c4d2" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">进位</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.3306;0.495;0.4956;1" dur="11.0s" repeatCount="indefinite"/><text x="203.3" y="280" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">进位</text></g><circle cx="276.7" cy="259.5" r="4" fill="#ffffff" stroke="#cfdce8" stroke-width="1.5"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.495;0.4956;0.665;0.6656;1" dur="11.0s" repeatCount="indefinite"/><circle cx="276.7" cy="259.5" r="5.5" fill="#c0392b"/></g><g opacity="1"><animate attributeName="opacity" values="1.0;1.0;0.0;0.0;1.0;1.0" keyTimes="0;0.495;0.4956;0.665;0.6656;1" dur="11.0s" repeatCount="indefinite"/><text x="276.7" y="280" text-anchor="middle" font-size="11.5" fill="#b6c4d2" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">成肽</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.495;0.4956;0.665;0.6656;1" dur="11.0s" repeatCount="indefinite"/><text x="276.7" y="280" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c0392b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">成肽</text></g><circle cx="350.0" cy="259.5" r="4" fill="#ffffff" stroke="#cfdce8" stroke-width="1.5"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.665;0.6656;0.83;0.8306;1" dur="11.0s" repeatCount="indefinite"/><circle cx="350.0" cy="259.5" r="5.5" fill="#c1440e"/></g><g opacity="1"><animate attributeName="opacity" values="1.0;1.0;0.0;0.0;1.0;1.0" keyTimes="0;0.665;0.6656;0.83;0.8306;1" dur="11.0s" repeatCount="indefinite"/><text x="350.0" y="280" text-anchor="middle" font-size="11.5" fill="#b6c4d2" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">移位</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.665;0.6656;0.83;0.8306;1" dur="11.0s" repeatCount="indefinite"/><text x="350.0" y="280" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c1440e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">移位</text></g><circle cx="423.3" cy="259.5" r="4" fill="#ffffff" stroke="#cfdce8" stroke-width="1.5"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.83;0.8306;1" dur="11.0s" repeatCount="indefinite"/><circle cx="423.3" cy="259.5" r="5.5" fill="#2f8f57"/></g><g opacity="1"><animate attributeName="opacity" values="1.0;1.0;0.0;0.0" keyTimes="0;0.83;0.8306;1" dur="11.0s" repeatCount="indefinite"/><text x="423.3" y="280" text-anchor="middle" font-size="11.5" fill="#b6c4d2" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">终止释放</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.83;0.8306;1" dur="11.0s" repeatCount="indefinite"/><text x="423.3" y="280" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">终止释放</text></g><rect x="22" y="292" width="436" height="92" rx="10" fill="#ffffff" stroke="#e3ebf3" stroke-width="1"/><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.16;0.1606;1" dur="11.0s" repeatCount="indefinite"/><rect x="22" y="293" width="3" height="90" fill="#2c5f9e" opacity="0.85"/><text x="40" y="318" font-size="11.5" fill="#a8b6c4" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">因为</text><text x="78" y="318" font-size="12.5" fill="#6b7c8d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">mRNA 上每 3 个碱基是一个密码子</text><text x="40" y="354" font-size="11.5" fill="#2c5f9e" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">所以</text><text x="78" y="354" font-size="14.5" fill="#2c5f9e" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">阅读框固定，AUG 起始、UAA/UAG/UGA 终止</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.16;0.1606;0.33;0.3306;1" dur="11.0s" repeatCount="indefinite"/><rect x="22" y="293" width="3" height="90" fill="#a8791a" opacity="0.85"/><text x="40" y="318" font-size="11.5" fill="#a8b6c4" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">因为</text><text x="78" y="318" font-size="12.5" fill="#6b7c8d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">氨酰-tRNA 合成酶把氨基酸挂到 tRNA 上，耗 ATP</text><text x="40" y="354" font-size="11.5" fill="#a8791a" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">所以</text><text x="78" y="354" font-size="14.5" fill="#a8791a" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">生成氨酰-tRNA，同时完成一次校对</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.3306;0.495;0.4956;1" dur="11.0s" repeatCount="indefinite"/><rect x="22" y="293" width="3" height="90" fill="#0f766e" opacity="0.85"/><text x="40" y="318" font-size="11.5" fill="#a8b6c4" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">因为</text><text x="78" y="318" font-size="12.5" fill="#6b7c8d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">氨酰-tRNA 进入核糖体 A 位（耗 1 GTP）</text><text x="40" y="354" font-size="11.5" fill="#0f766e" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">所以</text><text x="78" y="354" font-size="14.5" fill="#0f766e" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">反密码子与密码子配对</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.495;0.4956;0.665;0.6656;1" dur="11.0s" repeatCount="indefinite"/><rect x="22" y="293" width="3" height="90" fill="#c0392b" opacity="0.85"/><text x="40" y="318" font-size="11.5" fill="#a8b6c4" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">因为</text><text x="78" y="318" font-size="12.5" fill="#6b7c8d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">肽基转移酶（rRNA 本身）把 P 位肽链转到 A 位</text><text x="40" y="354" font-size="11.5" fill="#c0392b" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">所以</text><text x="78" y="354" font-size="14.5" fill="#c0392b" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">肽链延长一个氨基酸，仍挂在 A 位 tRNA 上</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.665;0.6656;0.83;0.8306;1" dur="11.0s" repeatCount="indefinite"/><rect x="22" y="293" width="3" height="90" fill="#c1440e" opacity="0.85"/><text x="40" y="318" font-size="11.5" fill="#a8b6c4" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">因为</text><text x="78" y="318" font-size="12.5" fill="#6b7c8d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">核糖体沿 mRNA 前移一个密码子（耗 1 GTP）</text><text x="40" y="354" font-size="11.5" fill="#c1440e" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">所以</text><text x="78" y="354" font-size="14.5" fill="#c1440e" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">A 位清空，准备下一个氨酰-tRNA</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.83;0.8306;1" dur="11.0s" repeatCount="indefinite"/><rect x="22" y="293" width="3" height="90" fill="#2f8f57" opacity="0.85"/><text x="40" y="318" font-size="11.5" fill="#a8b6c4" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">因为</text><text x="78" y="318" font-size="12.5" fill="#6b7c8d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">终止密码子被释放因子识别，无对应 tRNA</text><text x="40" y="354" font-size="11.5" fill="#2f8f57" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">所以</text><text x="78" y="354" font-size="14.5" fill="#2f8f57" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">肽链从 P 位水解释放，核糖体解离</text></g><text x="22" y="408" font-size="11.5" fill="#a8b6c4" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">密码子的四条特性</text><text x="22" y="428" font-size="12.5" font-weight="700" fill="#2c5f9e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">三联体</text><text x="84" y="428" font-size="12.5" fill="#6b7c8d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">3 个碱基编 1 个氨基酸</text><text x="22" y="450" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">连续性</text><text x="84" y="450" font-size="12.5" fill="#6b7c8d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">无间隔读取，插入即移码</text><text x="22" y="472" font-size="12.5" font-weight="700" fill="#a8791a" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">简并性</text><text x="84" y="472" font-size="12.5" fill="#6b7c8d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">一个氨基酸可有多个密码子</text><text x="22" y="494" font-size="12.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">通用性</text><text x="84" y="494" font-size="12.5" fill="#6b7c8d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">生物界基本通用</text></svg>