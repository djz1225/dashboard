<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 500" role="img" aria-labelledby="ft fd" style="background:#ffffff"><title id="ft">DNA 复制的半不连续</title><desc id="fd">DNA 聚合酶只能沿 5′→3′ 方向延伸，因此以复制叉移动方向为参照，一条链可连续合成（前导链），另一条只能分段合成冈崎片段（随从链）。</desc><text x="210.0" y="28" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="0.55s" fill="freeze" calcMode="spline" keySplines="0.23 1 0.32 1"/>复制叉：一条连续、一条分段<tspan x="210.0" y="48" text-anchor="middle" font-size="11" fill="#64748b" font-weight="400">聚合酶只能 5′→3′，所以随从链成冈崎片段</tspan></text><path d="M40,116 H380" stroke="#0f766e" stroke-width="3"/><path d="M40,236 H380" stroke="#2c5f9e" stroke-width="3"/><text x="34" y="108" font-size="11" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">模板 3′ → 5′</text><text x="34" y="252" font-size="11" fill="#2c5f9e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">模板 5′ → 3′</text><path d="M48,116 V236" stroke="#64748b" stroke-width="1.4" stroke-dasharray="4 3"/><g><path d="M60,116 V236" stroke="#c0392b" stroke-width="2.4" stroke-dasharray="5 4"/><animateTransform attributeName="transform" type="translate" values="0,0;300,0" keyTimes="0;1" dur="10.0s" repeatCount="indefinite" calcMode="linear"/></g><g><path d="M62,132 H372" stroke="#2f8f57" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="316" stroke-dashoffset="316"><animate attributeName="stroke-dashoffset" values="316;0" keyTimes="0;1" dur="10.0s" repeatCount="indefinite" calcMode="linear"/></path></g><text x="374" y="136" text-anchor="end" font-size="11" fill="#2f8f57" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">前导链（连续）</text><g opacity="0"><path d="M62,220 H148" stroke="#a8791a" stroke-width="3.4" stroke-linecap="round"/><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.3333;0.3339;1" dur="10.0s" repeatCount="indefinite"/></g><g opacity="0"><path d="M158,220 H244" stroke="#a8791a" stroke-width="3.4" stroke-linecap="round"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3333;0.3339;0.6667;0.6673;1" dur="10.0s" repeatCount="indefinite"/></g><g opacity="0"><path d="M254,220 H340" stroke="#a8791a" stroke-width="3.4" stroke-linecap="round"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.6667;0.6673;1" dur="10.0s" repeatCount="indefinite"/></g><text x="374" y="216" text-anchor="end" font-size="11" fill="#a8791a" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">随从链（冈崎片段）</text><text x="34" y="278" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">两条新链都按 5′→3′ 合成，只是相对复制叉方向相反</text><text x="34" y="298" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">引物是 RNA（引物酶不需引物即可起始）；连接酶封闭缺口</text><text font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><tspan x="210.0" y="336" text-anchor="middle" opacity="0" fill="#0f766e" font-size="12" font-weight="700">① 解旋酶打开双链<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.26;0.2606;1" dur="10.0s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="336" text-anchor="middle" opacity="0" fill="#2f8f57" font-size="12" font-weight="700">② 前导链连续延伸<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.26;0.2606;0.5;0.5006;1" dur="10.0s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="336" text-anchor="middle" opacity="0" fill="#a8791a" font-size="12" font-weight="700">③ 随从链分段合成<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.5006;0.74;0.7406;1" dur="10.0s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="336" text-anchor="middle" opacity="0" fill="#c0392b" font-size="12" font-weight="700">④ 切引物、连接成链<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.74;0.7406;1" dur="10.0s" repeatCount="indefinite"/></tspan></text><path d="M34,356 H386" stroke="#e2e8f0" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.35"/><path d="M125.5,351 L125.5,361 M210.0,351 L210.0,361 M294.5,351 L294.5,361" stroke="#e2e8f0" stroke-width="1.1" fill="none"/><circle cy="356" r="5.4" fill="#1e293b" stroke="#ffffff" stroke-width="2"><animateTransform attributeName="transform" type="translate" values="34.0,0;39.9,0;45.7,0;51.6,0;57.5,0;63.3,0;69.2,0;75.1,0;80.9,0;86.8,0;92.7,0;98.5,0;104.4,0;110.3,0;116.1,0;122.0,0;127.9,0;133.7,0;139.6,0;145.5,0;151.3,0;157.2,0;163.1,0;168.9,0;174.8,0;180.7,0;186.5,0;192.4,0;198.3,0;204.1,0;210.0,0;215.9,0;221.7,0;227.6,0;233.5,0;239.3,0;245.2,0;251.1,0;256.9,0;262.8,0;268.7,0;274.5,0;280.4,0;286.3,0;292.1,0;298.0,0;303.9,0;309.7,0;315.6,0;321.5,0;327.3,0;333.2,0;339.1,0;344.9,0;350.8,0;356.7,0;362.5,0;368.4,0;374.3,0;380.1,0;386.0,0" keyTimes="0;0.0167;0.0333;0.05;0.0667;0.0833;0.1;0.1167;0.1333;0.15;0.1667;0.1833;0.2;0.2167;0.2333;0.25;0.2667;0.2833;0.3;0.3167;0.3333;0.35;0.3667;0.3833;0.4;0.4167;0.4333;0.45;0.4667;0.4833;0.5;0.5167;0.5333;0.55;0.5667;0.5833;0.6;0.6167;0.6333;0.65;0.6667;0.6833;0.7;0.7167;0.7333;0.75;0.7667;0.7833;0.8;0.8167;0.8333;0.85;0.8667;0.8833;0.9;0.9167;0.9333;0.95;0.9667;0.9833;1" dur="10.0s" repeatCount="indefinite" calcMode="linear"/></circle><text x="210" y="380" text-anchor="middle" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">原核片段 1000~2000 nt；真核 100~200 nt</text></svg>