<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 556" role="img" aria-labelledby="ft fd" style="background:#ffffff"><title id="ft">血红素合成：两头在线粒体，中间在胞质</title><desc id="fd">血红素合成以琥珀酰CoA 与甘氨酸为原料，起始与终末步骤在线粒体、中间步骤在胞质，因此反应两头跨膜。ALA 合酶是限速酶，需磷酸吡哆醛（维生素 B₆）作辅酶，并受血红素与葡萄糖的负反馈抑制。两个 ALA 缩合成卟胆原，四个卟胆原聚合成卟啉环，再由铁螯合酶把 Fe²⁺ 嵌入原卟啉 Ⅸ 生成血红素 —— 缺铁时这一步受阻，可致铁粒幼细胞性贫血。血红素与珠蛋白链结合成血红蛋白，两者必须匹配否则无效造血。血红素分解为胆绿素再变为未结合胆红素，后者脂溶性、不能经尿排出，需在肝内转化。</desc><text x="22" y="28" font-size="17.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">血红素合成：两头在线粒体，中间在胞质</text><text x="22" y="46" font-size="11.5" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">ALA 合酶限速（需 B₆）；缺铁则螯合失败</text><rect x="22" y="60" width="436" height="176" rx="10" fill="#f8fbfd" stroke="#dfe8f1" stroke-width="1"/><rect x="26" y="92" width="112" height="46" rx="7" fill="#dbe7f5" opacity="0.45"/><text x="32" y="108" font-size="11.5" fill="#2c5f9e" font-weight="700" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">线粒体</text><rect x="26" y="140" width="112" height="46" rx="7" fill="#ccfbf1" opacity="0.45"/><text x="32" y="156" font-size="11.5" fill="#0f766e" font-weight="700" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">胞质</text><rect x="26" y="188" width="112" height="34" rx="7" fill="#dbe7f5" opacity="0.45"/><text x="32" y="204" font-size="11.5" fill="#2c5f9e" font-weight="700" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">线粒体</text><rect x="140" y="90" width="300" height="20" rx="5" fill="#0f766e" opacity="0.13"/><text x="146" y="104" font-size="11.5" fill="#0f766e" font-weight="700" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">琥珀酰CoA + 甘氨酸</text><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.15;0.1506;1" dur="11.4s" repeatCount="indefinite"/><rect x="140" y="90" width="300" height="20" rx="5" fill="none" stroke="#0f766e" stroke-width="1.8"/></g><rect x="140" y="114" width="300" height="20" rx="5" fill="#c1440e" opacity="0.13"/><text x="146" y="128" font-size="11.5" fill="#c1440e" font-weight="700" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">ALA（限速，需 B₆）</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.15;0.1506;0.31;0.3106;1" dur="11.4s" repeatCount="indefinite"/><rect x="140" y="114" width="300" height="20" rx="5" fill="none" stroke="#c1440e" stroke-width="1.8"/></g><rect x="140" y="138" width="300" height="20" rx="5" fill="#2c5f9e" opacity="0.13"/><text x="146" y="152" font-size="11.5" fill="#2c5f9e" font-weight="700" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">卟胆原 → 卟啉环</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.31;0.3106;0.47;0.4706;1" dur="11.4s" repeatCount="indefinite"/><rect x="140" y="138" width="300" height="20" rx="5" fill="none" stroke="#2c5f9e" stroke-width="1.8"/></g><rect x="140" y="162" width="300" height="20" rx="5" fill="#c1440e" opacity="0.13"/><text x="146" y="176" font-size="11.5" fill="#c1440e" font-weight="700" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">螯合 Fe²⁺ → 血红素</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.47;0.4706;0.635;0.6356;1" dur="11.4s" repeatCount="indefinite"/><rect x="140" y="162" width="300" height="20" rx="5" fill="none" stroke="#c1440e" stroke-width="1.8"/></g><rect x="140" y="186" width="300" height="20" rx="5" fill="#c0392b" opacity="0.13"/><text x="146" y="200" font-size="11.5" fill="#c0392b" font-weight="700" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">血红素 + 珠蛋白</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.635;0.6356;0.815;0.8156;1" dur="11.4s" repeatCount="indefinite"/><rect x="140" y="186" width="300" height="20" rx="5" fill="none" stroke="#c0392b" stroke-width="1.8"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.15;0.1506;1" dur="11.4s" repeatCount="indefinite"/><path d="M124,104 H136" stroke="#2c5f9e" stroke-width="1.8"/><path d="M124,156 H136" stroke="#0f766e" stroke-width="1.8"/><path d="M124,200 H136" stroke="#2c5f9e" stroke-width="1.8"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.15;0.1506;1" dur="11.4s" repeatCount="indefinite"/><text x="140" y="220" font-size="11.5" fill="#6b7c8d" font-weight="400" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">起始与终末在线粒体，中间在胞质</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.47;0.4706;0.635;0.6356;1" dur="11.4s" repeatCount="indefinite"/><text x="444" y="178" font-size="11.5" fill="#c1440e" font-weight="700" text-anchor="end" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">缺铁 → 铁粒幼贫</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.815;0.8156;1" dur="11.4s" repeatCount="indefinite"/><rect x="26" y="236" width="428" height="26" rx="7" fill="#2f8f57" opacity="0.14"/><text x="34" y="253" font-size="11.5" fill="#2f8f57" font-weight="700" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">分解：血红素 → 胆绿素 → 胆红素（未结合，脂溶性）</text></g><rect x="22" y="258" width="436" height="3" rx="1.5" fill="#e8eff6"/><path d="M22,259.5 H458" stroke="#0f766e" stroke-width="3" stroke-linecap="round" opacity="0.42" stroke-dasharray="436" stroke-dashoffset="436"><animate attributeName="stroke-dashoffset" values="436;0" keyTimes="0;1" dur="11.4s" repeatCount="indefinite"/></path><circle cx="56.7" cy="259.5" r="4" fill="#ffffff" stroke="#cfdce8" stroke-width="1.5"/><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.15;0.1506;1" dur="11.4s" repeatCount="indefinite"/><circle cx="56.7" cy="259.5" r="5.5" fill="#0f766e"/></g><g opacity="1"><animate attributeName="opacity" values="0.0;0.0;1.0;1.0" keyTimes="0;0.15;0.1506;1" dur="11.4s" repeatCount="indefinite"/><text x="56.7" y="280" text-anchor="middle" font-size="11.5" fill="#b6c4d2" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">原料与定位</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.15;0.1506;1" dur="11.4s" repeatCount="indefinite"/><text x="56.7" y="280" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">原料与定位</text></g><circle cx="130.0" cy="259.5" r="4" fill="#ffffff" stroke="#cfdce8" stroke-width="1.5"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.15;0.1506;0.31;0.3106;1" dur="11.4s" repeatCount="indefinite"/><circle cx="130.0" cy="259.5" r="5.5" fill="#c1440e"/></g><g opacity="1"><animate attributeName="opacity" values="1.0;1.0;0.0;0.0;1.0;1.0" keyTimes="0;0.15;0.1506;0.31;0.3106;1" dur="11.4s" repeatCount="indefinite"/><text x="130.0" y="280" text-anchor="middle" font-size="11.5" fill="#b6c4d2" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">ALA 生成</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.15;0.1506;0.31;0.3106;1" dur="11.4s" repeatCount="indefinite"/><text x="130.0" y="280" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c1440e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">ALA 生成</text></g><circle cx="203.3" cy="259.5" r="4" fill="#ffffff" stroke="#cfdce8" stroke-width="1.5"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.31;0.3106;0.47;0.4706;1" dur="11.4s" repeatCount="indefinite"/><circle cx="203.3" cy="259.5" r="5.5" fill="#2c5f9e"/></g><g opacity="1"><animate attributeName="opacity" values="1.0;1.0;0.0;0.0;1.0;1.0" keyTimes="0;0.31;0.3106;0.47;0.4706;1" dur="11.4s" repeatCount="indefinite"/><text x="203.3" y="280" text-anchor="middle" font-size="11.5" fill="#b6c4d2" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">卟胆原 → 卟啉环</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.31;0.3106;0.47;0.4706;1" dur="11.4s" repeatCount="indefinite"/><text x="203.3" y="280" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2c5f9e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">卟胆原 → 卟啉环</text></g><circle cx="276.7" cy="259.5" r="4" fill="#ffffff" stroke="#cfdce8" stroke-width="1.5"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.47;0.4706;0.635;0.6356;1" dur="11.4s" repeatCount="indefinite"/><circle cx="276.7" cy="259.5" r="5.5" fill="#c1440e"/></g><g opacity="1"><animate attributeName="opacity" values="1.0;1.0;0.0;0.0;1.0;1.0" keyTimes="0;0.47;0.4706;0.635;0.6356;1" dur="11.4s" repeatCount="indefinite"/><text x="276.7" y="280" text-anchor="middle" font-size="11.5" fill="#b6c4d2" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">螯合铁</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.47;0.4706;0.635;0.6356;1" dur="11.4s" repeatCount="indefinite"/><text x="276.7" y="280" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c1440e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">螯合铁</text></g><circle cx="350.0" cy="259.5" r="4" fill="#ffffff" stroke="#cfdce8" stroke-width="1.5"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.635;0.6356;0.815;0.8156;1" dur="11.4s" repeatCount="indefinite"/><circle cx="350.0" cy="259.5" r="5.5" fill="#c0392b"/></g><g opacity="1"><animate attributeName="opacity" values="1.0;1.0;0.0;0.0;1.0;1.0" keyTimes="0;0.635;0.6356;0.815;0.8156;1" dur="11.4s" repeatCount="indefinite"/><text x="350.0" y="280" text-anchor="middle" font-size="11.5" fill="#b6c4d2" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">与珠蛋白结合</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.635;0.6356;0.815;0.8156;1" dur="11.4s" repeatCount="indefinite"/><text x="350.0" y="280" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c0392b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">与珠蛋白结合</text></g><circle cx="423.3" cy="259.5" r="4" fill="#ffffff" stroke="#cfdce8" stroke-width="1.5"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.815;0.8156;1" dur="11.4s" repeatCount="indefinite"/><circle cx="423.3" cy="259.5" r="5.5" fill="#2f8f57"/></g><g opacity="1"><animate attributeName="opacity" values="1.0;1.0;0.0;0.0" keyTimes="0;0.815;0.8156;1" dur="11.4s" repeatCount="indefinite"/><text x="423.3" y="280" text-anchor="middle" font-size="11.5" fill="#b6c4d2" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">血红素分解</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.815;0.8156;1" dur="11.4s" repeatCount="indefinite"/><text x="423.3" y="280" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">血红素分解</text></g><rect x="22" y="292" width="436" height="92" rx="10" fill="#ffffff" stroke="#e3ebf3" stroke-width="1"/><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.15;0.1506;1" dur="11.4s" repeatCount="indefinite"/><rect x="22" y="293" width="3" height="90" fill="#0f766e" opacity="0.85"/><text x="40" y="318" font-size="11.5" fill="#a8b6c4" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">因为</text><text x="78" y="318" font-size="12.5" fill="#6b7c8d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">琥珀酰CoA + 甘氨酸在线粒体起步，中间步骤在胞质</text><text x="40" y="354" font-size="11.5" fill="#0f766e" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">所以</text><text x="78" y="354" font-size="14.5" fill="#0f766e" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">起始与终末在线粒体、中间在胞质 —— 两头跨膜</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.15;0.1506;0.31;0.3106;1" dur="11.4s" repeatCount="indefinite"/><rect x="22" y="293" width="3" height="90" fill="#c1440e" opacity="0.85"/><text x="40" y="318" font-size="11.5" fill="#a8b6c4" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">因为</text><text x="78" y="318" font-size="12.5" fill="#6b7c8d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">ALA 合酶催化，需磷酸吡哆醛（维生素 B₆）作辅酶</text><text x="40" y="354" font-size="11.5" fill="#c1440e" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">所以</text><text x="78" y="354" font-size="14.5" fill="#c1440e" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">限速步骤；受血红素与葡萄糖负反馈抑制</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.31;0.3106;0.47;0.4706;1" dur="11.4s" repeatCount="indefinite"/><rect x="22" y="293" width="3" height="90" fill="#2c5f9e" opacity="0.85"/><text x="40" y="318" font-size="11.5" fill="#a8b6c4" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">因为</text><text x="78" y="318" font-size="12.5" fill="#6b7c8d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">两个 ALA 缩合成卟胆原，四个卟胆原聚成卟啉环</text><text x="40" y="354" font-size="11.5" fill="#2c5f9e" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">所以</text><text x="78" y="354" font-size="14.5" fill="#2c5f9e" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">这一步构建出四个吡咯环的核心骨架</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.47;0.4706;0.635;0.6356;1" dur="11.4s" repeatCount="indefinite"/><rect x="22" y="293" width="3" height="90" fill="#c1440e" opacity="0.85"/><text x="40" y="318" font-size="11.5" fill="#a8b6c4" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">因为</text><text x="78" y="318" font-size="12.5" fill="#6b7c8d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">铁螯合酶把 Fe²⁺ 嵌入原卟啉 Ⅸ 生成血红素</text><text x="40" y="354" font-size="11.5" fill="#c1440e" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">所以</text><text x="78" y="354" font-size="14.5" fill="#c1440e" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">缺铁时这一步做不成 → 铁粒幼细胞性贫血</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.635;0.6356;0.815;0.8156;1" dur="11.4s" repeatCount="indefinite"/><rect x="22" y="293" width="3" height="90" fill="#c0392b" opacity="0.85"/><text x="40" y="318" font-size="11.5" fill="#a8b6c4" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">因为</text><text x="78" y="318" font-size="12.5" fill="#6b7c8d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">4 个血红素 + 4 条珠蛋白链 → 血红蛋白</text><text x="40" y="354" font-size="11.5" fill="#c0392b" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">所以</text><text x="78" y="354" font-size="14.5" fill="#c0392b" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">血红素的合成与珠蛋白必须匹配，否则无效造血</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.815;0.8156;1" dur="11.4s" repeatCount="indefinite"/><rect x="22" y="293" width="3" height="90" fill="#2f8f57" opacity="0.85"/><text x="40" y="318" font-size="11.5" fill="#a8b6c4" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">因为</text><text x="78" y="318" font-size="12.5" fill="#6b7c8d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">血红素 → 胆绿素 → 胆红素（未结合型）</text><text x="40" y="354" font-size="11.5" fill="#2f8f57" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">所以</text><text x="78" y="354" font-size="14.5" fill="#2f8f57" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">未结合胆红素脂溶性、不能经尿排，需肝转化</text></g><text x="22" y="403" font-size="11.5" fill="#a8b6c4" font-weight="700" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">一个限速酶，一个关键元素</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.15;0.1506;0.31;0.3106;1" dur="11.4s" repeatCount="indefinite"/><rect x="22" y="413" width="3" height="15" rx="1.5" fill="#c1440e"/><text x="34" y="424" font-size="12.5" fill="#c1440e" font-weight="700" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">限速</text><text x="104" y="424" font-size="12" fill="#6b7c8d" font-weight="400" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">ALA 合酶，需维生素 B₆</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.15;0.1506;0.31;0.3106;1" dur="11.4s" repeatCount="indefinite"/><rect x="22" y="436" width="3" height="15" rx="1.5" fill="#0f766e"/><text x="34" y="447" font-size="12.5" fill="#0f766e" font-weight="700" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">负反馈</text><text x="104" y="447" font-size="12" fill="#6b7c8d" font-weight="400" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">血红素与葡萄糖抑制 ALA 合酶</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.47;0.4706;0.635;0.6356;1" dur="11.4s" repeatCount="indefinite"/><rect x="22" y="459" width="3" height="15" rx="1.5" fill="#c1440e"/><text x="34" y="470" font-size="12.5" fill="#c1440e" font-weight="700" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">缺铁</text><text x="104" y="470" font-size="12" fill="#6b7c8d" font-weight="400" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">螯合失败 → 铁粒幼细胞性贫血</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.815;0.8156;1" dur="11.4s" repeatCount="indefinite"/><rect x="22" y="482" width="3" height="15" rx="1.5" fill="#2f8f57"/><text x="34" y="493" font-size="12.5" fill="#2f8f57" font-weight="700" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">分解</text><text x="104" y="493" font-size="12" fill="#6b7c8d" font-weight="400" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">未结合胆红素不能经尿排</text></g><rect x="22" y="508" width="436" height="33" rx="8" fill="#f0fdfa"/><text x="34" y="528" font-size="12" fill="#1e293b" font-weight="700" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">血红素合成受血红素自身反馈抑制，缺铁或缺 B₆ 都会卡在不同步骤</text></svg>