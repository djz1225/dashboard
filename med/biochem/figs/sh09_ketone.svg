<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 500" role="img" aria-labelledby="ft fd" style="background:#ffffff"><title id="ft">酮体的生成与利用</title><desc id="fd">肝以乙酰CoA 为原料生成酮体，但缺乏琥珀酰CoA 转硫酶无法利用；酮体经血液运至脑、心、骨骼肌氧化供能，长期饥饿时可占脑供能的 60~70%。</desc><text x="210.0" y="28" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="0.55s" fill="freeze" calcMode="spline" keySplines="0.23 1 0.32 1"/>酮体：肝造不用，肝外用<tspan x="210.0" y="48" text-anchor="middle" font-size="11" fill="#64748b" font-weight="400">肝缺琥珀酰CoA 转硫酶，所以只能生产不能消费</tspan></text><rect x="34" y="96" width="352" height="86" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.6"/><text x="44" y="116" font-size="12" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">肝：生成（2 乙酰CoA → 酮体）</text><rect x="48" y="128" width="76" height="26" rx="4" fill="#ffffff" stroke="#0f766e" stroke-width="1.1"/><text x="86" y="145" text-anchor="middle" font-size="11" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">乙酰乙酰CoA</text><rect x="134" y="128" width="76" height="26" rx="4" fill="#ffffff" stroke="#0f766e" stroke-width="1.1"/><text x="172" y="145" text-anchor="middle" font-size="11" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">HMG-CoA</text><rect x="220" y="128" width="76" height="26" rx="4" fill="#ffffff" stroke="#0f766e" stroke-width="1.1"/><text x="258" y="145" text-anchor="middle" font-size="11" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">乙酰乙酸</text><rect x="306" y="128" width="76" height="26" rx="4" fill="#ffffff" stroke="#0f766e" stroke-width="1.1"/><text x="344" y="145" text-anchor="middle" font-size="11" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">β-羟丁酸</text><path d="M210,182 V216" stroke="#2c5f9e" stroke-width="2.4" stroke-dasharray="5 3"/><polygon points="210,222 206,214 214,214" fill="#2c5f9e"/><text x="220" y="204" font-size="11" fill="#2c5f9e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">血液运输</text><rect x="34" y="226" width="352" height="86" rx="8" fill="#dcfce7" stroke="#2f8f57" stroke-width="1.6"/><text x="44" y="246" font-size="12" fill="#2f8f57" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">肝外（脑/心/肌）：利用</text><rect x="48" y="258" width="76" height="26" rx="4" fill="#ffffff" stroke="#2f8f57" stroke-width="1.1"/><text x="86" y="275" text-anchor="middle" font-size="11" fill="#2f8f57" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">β-羟丁酸</text><rect x="134" y="258" width="76" height="26" rx="4" fill="#ffffff" stroke="#2f8f57" stroke-width="1.1"/><text x="172" y="275" text-anchor="middle" font-size="11" fill="#2f8f57" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">乙酰乙酸</text><rect x="220" y="258" width="76" height="26" rx="4" fill="#ffffff" stroke="#2f8f57" stroke-width="1.1"/><text x="258" y="275" text-anchor="middle" font-size="11" fill="#2f8f57" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">乙酰乙酰CoA</text><rect x="306" y="258" width="76" height="26" rx="4" fill="#ffffff" stroke="#2f8f57" stroke-width="1.1"/><text x="344" y="275" text-anchor="middle" font-size="11" fill="#2f8f57" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">2 乙酰CoA</text><g opacity="0"><circle cx="300" cy="256" r="13" fill="#ffffff" stroke="#c1440e" stroke-width="2.2"/><path d="M294,250 L306,262 M306,250 L294,262" stroke="#c1440e" stroke-width="2.4" stroke-linecap="round"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5;0.62;1" dur="9.0s" repeatCount="indefinite"/></g><text x="210" y="330" text-anchor="middle" font-size="11" fill="#c1440e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">肝缺琥珀酰CoA 转硫酶 → 酮体进得去、用不了</text><text font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><tspan x="210.0" y="356" text-anchor="middle" opacity="0" fill="#a8791a" font-size="12" font-weight="700">① 脂肪酸大量动员<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.3;0.3006;1" dur="9.0s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="356" text-anchor="middle" opacity="0" fill="#0f766e" font-size="12" font-weight="700">② 肝内生成酮体<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3;0.3006;0.52;0.5206;1" dur="9.0s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="356" text-anchor="middle" opacity="0" fill="#2c5f9e" font-size="12" font-weight="700">③ 运输到肝外<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.52;0.5206;0.78;0.7806;1" dur="9.0s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="356" text-anchor="middle" opacity="0" fill="#2f8f57" font-size="12" font-weight="700">④ 肝外氧化供能<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.78;0.7806;1" dur="9.0s" repeatCount="indefinite"/></tspan></text><path d="M34,374 H386" stroke="#e2e8f0" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.35"/><path d="M139.6,369 L139.6,379 M217.0,369 L217.0,379 M308.6,369 L308.6,379" stroke="#e2e8f0" stroke-width="1.1" fill="none"/><circle cy="374" r="5.4" fill="#1e293b" stroke="#ffffff" stroke-width="2"><animateTransform attributeName="transform" type="translate" values="34.0,0;39.9,0;45.7,0;51.6,0;57.5,0;63.3,0;69.2,0;75.1,0;80.9,0;86.8,0;92.7,0;98.5,0;104.4,0;110.3,0;116.1,0;122.0,0;127.9,0;133.7,0;139.6,0;145.5,0;151.3,0;157.2,0;163.1,0;168.9,0;174.8,0;180.7,0;186.5,0;192.4,0;198.3,0;204.1,0;210.0,0;215.9,0;221.7,0;227.6,0;233.5,0;239.3,0;245.2,0;251.1,0;256.9,0;262.8,0;268.7,0;274.5,0;280.4,0;286.3,0;292.1,0;298.0,0;303.9,0;309.7,0;315.6,0;321.5,0;327.3,0;333.2,0;339.1,0;344.9,0;350.8,0;356.7,0;362.5,0;368.4,0;374.3,0;380.1,0;386.0,0" keyTimes="0;0.0167;0.0333;0.05;0.0667;0.0833;0.1;0.1167;0.1333;0.15;0.1667;0.1833;0.2;0.2167;0.2333;0.25;0.2667;0.2833;0.3;0.3167;0.3333;0.35;0.3667;0.3833;0.4;0.4167;0.4333;0.45;0.4667;0.4833;0.5;0.5167;0.5333;0.55;0.5667;0.5833;0.6;0.6167;0.6333;0.65;0.6667;0.6833;0.7;0.7167;0.7333;0.75;0.7667;0.7833;0.8;0.8167;0.8333;0.85;0.8667;0.8833;0.9;0.9167;0.9333;0.95;0.9667;0.9833;1" dur="9.0s" repeatCount="indefinite" calcMode="linear"/></circle><text x="210" y="398" text-anchor="middle" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">长期饥饿时脑可利用酮体达 60~70%</text></svg>