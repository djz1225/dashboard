<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 500" role="img" aria-labelledby="ft fd" style="background:#ffffff"><title id="ft">尿素循环五步</title><desc id="fd">氨与二氧化碳在 CPS-Ⅰ 催化下合成氨甲酰磷酸，与鸟氨酸结合成瓜氨酸出线粒体，再接上第二个氮（天冬氨酸），最终水解释放尿素并使鸟氨酸再生。</desc><text x="210.0" y="28" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="0.55s" fill="freeze" calcMode="spline" keySplines="0.23 1 0.32 1"/>尿素循环：五步、两个氮、四个高能键<tspan x="210.0" y="48" text-anchor="middle" font-size="11" fill="#64748b" font-weight="400">起始在线粒体，其余在胞质；CPS-Ⅰ 需 AGA 激活</tspan></text><rect x="30" y="96" width="360" height="92" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/><text x="40" y="112" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">线粒体基质</text><rect x="30" y="196" width="360" height="150" rx="8" fill="#fdfefe" stroke="#e2e8f0" stroke-width="1.2"/><text x="40" y="212" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">胞质</text><rect x="50" y="120.5" width="300" height="35" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.4"/><text x="200" y="135.5" text-anchor="middle" font-size="11" fill="#c0392b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">① NH₃+CO₂+2ATP</text><text x="200" y="150.5" text-anchor="middle" font-size="11" fill="#c0392b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">→ 氨甲酰磷酸</text><rect x="50" y="166.0" width="300" height="20" rx="6" fill="#ffffff" stroke="#a8791a" stroke-width="1.4"/><text x="200" y="181.0" text-anchor="middle" font-size="11" fill="#a8791a" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">② +鸟氨酸 → 瓜氨酸</text><rect x="50" y="220.5" width="300" height="35" rx="6" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="200" y="235.5" text-anchor="middle" font-size="11" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">③ +天冬氨酸</text><text x="200" y="250.5" text-anchor="middle" font-size="11" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">→ 精氨酸代琥珀酸</text><rect x="50" y="274.0" width="300" height="20" rx="6" fill="#ffffff" stroke="#2f8f57" stroke-width="1.4"/><text x="200" y="289.0" text-anchor="middle" font-size="11" fill="#2f8f57" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">④ → 精氨酸 + 延胡索酸</text><rect x="50" y="316.0" width="300" height="20" rx="6" fill="#ffffff" stroke="#c1440e" stroke-width="1.4"/><text x="200" y="331.0" text-anchor="middle" font-size="11" fill="#c1440e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">⑤ → 尿素 + 鸟氨酸</text><path d="M50,326 H50 V138 H50" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="4 3"/><path d="M362,326 Q378,238 362,176" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="4 3" opacity="0.7"/><text x="56" y="236" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">鸟氨酸回流</text><text font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><tspan x="210.0" y="366" text-anchor="middle" opacity="0" fill="#c0392b" font-size="11.5" font-weight="700">① CPS-Ⅰ 缩合（限速）<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.22;0.2206;1" dur="11.0s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="366" text-anchor="middle" opacity="0" fill="#a8791a" font-size="11.5" font-weight="700">② 与鸟氨酸成瓜氨酸<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.22;0.2206;0.4;0.4006;1" dur="11.0s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="366" text-anchor="middle" opacity="0" fill="#0f766e" font-size="11.5" font-weight="700">③ 出线粒体，接天冬氨酸<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4;0.4006;0.62;0.6206;1" dur="11.0s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="366" text-anchor="middle" opacity="0" fill="#2f8f57" font-size="11.5" font-weight="700">④ 裂解释放精氨酸<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.62;0.6206;0.81;0.8106;1" dur="11.0s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="366" text-anchor="middle" opacity="0" fill="#c1440e" font-size="11.5" font-weight="700">⑤ 精氨酸酶水解出尿素<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.81;0.8106;1" dur="11.0s" repeatCount="indefinite"/></tspan></text><path d="M34,384 H386" stroke="#e2e8f0" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.35"/><path d="M111.4,379 L111.4,389 M174.8,379 L174.8,389 M252.2,379 L252.2,389 M319.1,379 L319.1,389" stroke="#e2e8f0" stroke-width="1.1" fill="none"/><circle cy="384" r="5.4" fill="#1e293b" stroke="#ffffff" stroke-width="2"><animateTransform attributeName="transform" type="translate" values="34.0,0;39.9,0;45.7,0;51.6,0;57.5,0;63.3,0;69.2,0;75.1,0;80.9,0;86.8,0;92.7,0;98.5,0;104.4,0;110.3,0;116.1,0;122.0,0;127.9,0;133.7,0;139.6,0;145.5,0;151.3,0;157.2,0;163.1,0;168.9,0;174.8,0;180.7,0;186.5,0;192.4,0;198.3,0;204.1,0;210.0,0;215.9,0;221.7,0;227.6,0;233.5,0;239.3,0;245.2,0;251.1,0;256.9,0;262.8,0;268.7,0;274.5,0;280.4,0;286.3,0;292.1,0;298.0,0;303.9,0;309.7,0;315.6,0;321.5,0;327.3,0;333.2,0;339.1,0;344.9,0;350.8,0;356.7,0;362.5,0;368.4,0;374.3,0;380.1,0;386.0,0" keyTimes="0;0.0167;0.0333;0.05;0.0667;0.0833;0.1;0.1167;0.1333;0.15;0.1667;0.1833;0.2;0.2167;0.2333;0.25;0.2667;0.2833;0.3;0.3167;0.3333;0.35;0.3667;0.3833;0.4;0.4167;0.4333;0.45;0.4667;0.4833;0.5;0.5167;0.5333;0.55;0.5667;0.5833;0.6;0.6167;0.6333;0.65;0.6667;0.6833;0.7;0.7167;0.7333;0.75;0.7667;0.7833;0.8;0.8167;0.8333;0.85;0.8667;0.8833;0.9;0.9167;0.9333;0.95;0.9667;0.9833;1" dur="11.0s" repeatCount="indefinite" calcMode="linear"/></circle></svg>