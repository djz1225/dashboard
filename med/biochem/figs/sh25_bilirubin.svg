<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 500" role="img" aria-labelledby="ft fd" style="background:#ffffff"><title id="ft">胆红素的生成、转运与排泄</title><desc id="fd">血红蛋白降解生成未结合胆红素，与白蛋白结合运至肝，在肝内与葡萄糖醛酸结合成水溶性结合胆红素后排入胆汁。未结合型脂溶性高，过量时可透过血脑屏障致核黄疸。</desc><text x="210.0" y="28" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="0.55s" fill="freeze" calcMode="spline" keySplines="0.23 1 0.32 1"/>胆红素：两种形式，两条路<tspan x="210.0" y="48" text-anchor="middle" font-size="11" fill="#64748b" font-weight="400">未结合脂溶不入尿；结合水溶可入尿</tspan></text><rect x="60" y="100" width="240" height="22" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.4"/><text x="180" y="116" text-anchor="middle" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">衰老红细胞</text><path d="M180,122 V146" stroke="#e2e8f0" stroke-width="1.4"/><rect x="60" y="146" width="240" height="22" rx="6" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="180" y="162" text-anchor="middle" font-size="11" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">血红蛋白</text><path d="M180,168 V192" stroke="#e2e8f0" stroke-width="1.4"/><rect x="60" y="192" width="240" height="36" rx="6" fill="#ffffff" stroke="#a8791a" stroke-width="1.4"/><text x="180" y="208" text-anchor="middle" font-size="11" fill="#a8791a" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">未结合胆红素</text><text x="180" y="222" text-anchor="middle" font-size="11" fill="#a8791a" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">＋白蛋白运输</text><path d="M180,228 V238" stroke="#e2e8f0" stroke-width="1.4"/><rect x="60" y="238" width="240" height="22" rx="6" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="180" y="254" text-anchor="middle" font-size="11" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">肝摄取（Z 蛋白）</text><path d="M180,260 V284" stroke="#e2e8f0" stroke-width="1.4"/><rect x="60" y="284" width="240" height="36" rx="6" fill="#ffffff" stroke="#2f8f57" stroke-width="1.4"/><text x="180" y="300" text-anchor="middle" font-size="11" fill="#2f8f57" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">结合胆红素</text><text x="180" y="314" text-anchor="middle" font-size="11" fill="#2f8f57" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">（葡萄糖醛酸）</text><rect x="14" y="326" width="92" height="26" rx="5" fill="#a8791a" opacity="0.18" stroke="#a8791a" stroke-width="1.2"/><text x="60" y="344" text-anchor="middle" font-size="11" fill="#a8791a" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">入血</text><rect x="124" y="326" width="92" height="26" rx="5" fill="#2f8f57" opacity="0.18" stroke="#2f8f57" stroke-width="1.2"/><text x="170" y="344" text-anchor="middle" font-size="11" fill="#2f8f57" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">入尿（仅结合型）</text><rect x="254" y="326" width="92" height="26" rx="5" fill="#0f766e" opacity="0.18" stroke="#0f766e" stroke-width="1.2"/><text x="300" y="344" text-anchor="middle" font-size="11" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">入肠→粪</text><g opacity="0"><text x="210" y="380" text-anchor="middle" font-size="11" fill="#c1440e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">未结合型过量 → 过血脑屏障 → 核黄疸</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.50;0.64;1" dur="10.0s" repeatCount="indefinite"/></g><text font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><tspan x="210.0" y="400" text-anchor="middle" opacity="0" fill="#64748b" font-size="11" font-weight="700">① 血红素降解<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.24;0.2406;1" dur="10.0s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="400" text-anchor="middle" opacity="0" fill="#a8791a" font-size="11" font-weight="700">② 未结合胆红素转运<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.24;0.2406;0.46;0.4606;1" dur="10.0s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="400" text-anchor="middle" opacity="0" fill="#2f8f57" font-size="11" font-weight="700">③ 肝内结合<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.46;0.4606;0.66;0.6606;1" dur="10.0s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="400" text-anchor="middle" opacity="0" fill="#0f766e" font-size="11" font-weight="700">④ 排入胆汁/尿<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.66;0.6606;0.84;0.8406;1" dur="10.0s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="400" text-anchor="middle" opacity="0" fill="#c1440e" font-size="11" font-weight="700">⑤ 过量致核黄疸<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.84;0.8406;1" dur="10.0s" repeatCount="indefinite"/></tspan></text><path d="M34,418 H386" stroke="#e2e8f0" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.35"/><path d="M118.5,413 L118.5,423 M195.9,413 L195.9,423 M266.3,413 L266.3,423 M329.7,413 L329.7,423" stroke="#e2e8f0" stroke-width="1.1" fill="none"/><circle cy="418" r="5.4" fill="#1e293b" stroke="#ffffff" stroke-width="2"><animateTransform attributeName="transform" type="translate" values="34.0,0;39.9,0;45.7,0;51.6,0;57.5,0;63.3,0;69.2,0;75.1,0;80.9,0;86.8,0;92.7,0;98.5,0;104.4,0;110.3,0;116.1,0;122.0,0;127.9,0;133.7,0;139.6,0;145.5,0;151.3,0;157.2,0;163.1,0;168.9,0;174.8,0;180.7,0;186.5,0;192.4,0;198.3,0;204.1,0;210.0,0;215.9,0;221.7,0;227.6,0;233.5,0;239.3,0;245.2,0;251.1,0;256.9,0;262.8,0;268.7,0;274.5,0;280.4,0;286.3,0;292.1,0;298.0,0;303.9,0;309.7,0;315.6,0;321.5,0;327.3,0;333.2,0;339.1,0;344.9,0;350.8,0;356.7,0;362.5,0;368.4,0;374.3,0;380.1,0;386.0,0" keyTimes="0;0.0167;0.0333;0.05;0.0667;0.0833;0.1;0.1167;0.1333;0.15;0.1667;0.1833;0.2;0.2167;0.2333;0.25;0.2667;0.2833;0.3;0.3167;0.3333;0.35;0.3667;0.3833;0.4;0.4167;0.4333;0.45;0.4667;0.4833;0.5;0.5167;0.5333;0.55;0.5667;0.5833;0.6;0.6167;0.6333;0.65;0.6667;0.6833;0.7;0.7167;0.7333;0.75;0.7667;0.7833;0.8;0.8167;0.8333;0.85;0.8667;0.8833;0.9;0.9167;0.9333;0.95;0.9667;0.9833;1" dur="10.0s" repeatCount="indefinite" calcMode="linear"/></circle></svg>