<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 500" role="img" aria-labelledby="ft fd" style="background:#ffffff"><title id="ft">G6PD 缺乏致溶血的链条</title><desc id="fd">G6PD 缺乏时 NADPH 生成不足，谷胱甘肽无法还原，红细胞在氧化性诱因下血红蛋白与膜脂被氧化，形成 Heinz 小体并溶血。Coombs 试验阴性是与免疫性溶血的关键鉴别。</desc><text x="210.0" y="28" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="0.55s" fill="freeze" calcMode="spline" keySplines="0.23 1 0.32 1"/>G6PD 缺乏：NADPH 断供的连锁反应<tspan x="210.0" y="48" text-anchor="middle" font-size="11" fill="#64748b" font-weight="400">蚕豆 → 氧化应激 → GSH 耗竭 → 溶血</tspan></text><rect x="46" y="102" width="300" height="34" rx="7" fill="#fde8dd" stroke="#c1440e" stroke-width="1.4"/><text x="196" y="124" text-anchor="middle" font-size="11.5" fill="#c1440e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">G6PD 活性降低</text><path d="M196,136 V148" stroke="#e2e8f0" stroke-width="1.6"/><polygon points="196,148 193,142 199,142" fill="#e2e8f0"/><rect x="46" y="148" width="300" height="34" rx="7" fill="#fde8dd" stroke="#c1440e" stroke-width="1.4"/><text x="196" y="170" text-anchor="middle" font-size="11.5" fill="#c1440e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">NADPH 生成不足</text><path d="M196,182 V194" stroke="#e2e8f0" stroke-width="1.6"/><polygon points="196,194 193,188 199,188" fill="#e2e8f0"/><rect x="46" y="194" width="300" height="34" rx="7" fill="#fef3c7" stroke="#a8791a" stroke-width="1.4"/><text x="196" y="216" text-anchor="middle" font-size="11.5" fill="#a8791a" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">谷胱甘肽（GSH）无法再生</text><path d="M196,228 V240" stroke="#e2e8f0" stroke-width="1.6"/><polygon points="196,240 193,234 199,234" fill="#e2e8f0"/><rect x="46" y="240" width="300" height="34" rx="7" fill="#fbe3e0" stroke="#c0392b" stroke-width="1.4"/><text x="196" y="262" text-anchor="middle" font-size="11.5" fill="#c0392b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">血红蛋白与膜脂被氧化</text><path d="M196,274 V286" stroke="#e2e8f0" stroke-width="1.6"/><polygon points="196,286 193,280 199,280" fill="#e2e8f0"/><rect x="46" y="286" width="300" height="34" rx="7" fill="#fde8dd" stroke="#c1440e" stroke-width="1.4"/><text x="196" y="308" text-anchor="middle" font-size="11.5" fill="#c1440e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">Heinz 小体 + 膜脆性↑ → 溶血</text><rect x="356" y="102" width="30" height="126" rx="5" fill="#fbe3e0" stroke="#c0392b" stroke-width="1"/><text x="371" y="150" text-anchor="middle" font-size="11" fill="#c0392b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700" transform="rotate(-90 371 150)">蚕豆 / 伯氨喹 / 磺胺</text><rect x="34" y="336" width="352" height="42" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.3"/><text x="44" y="354" font-size="11" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">关键鉴别：Coombs 试验阴性</text><text x="44" y="370" font-size="11" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">与自身免疫性溶血最关键的区别点</text><text font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><tspan x="210.0" y="392" text-anchor="middle" opacity="0" fill="#c1440e" font-size="11" font-weight="700">① G6PD 缺乏<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.22;0.2206;1" dur="9.5s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="392" text-anchor="middle" opacity="0" fill="#c1440e" font-size="11" font-weight="700">② NADPH↓<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.22;0.2206;0.42;0.4206;1" dur="9.5s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="392" text-anchor="middle" opacity="0" fill="#a8791a" font-size="11" font-weight="700">③ GSH 耗竭<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.42;0.4206;0.62;0.6206;1" dur="9.5s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="392" text-anchor="middle" opacity="0" fill="#c0392b" font-size="11" font-weight="700">④ 氧化损伤<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.62;0.6206;0.82;0.8206;1" dur="9.5s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="392" text-anchor="middle" opacity="0" fill="#c1440e" font-size="11" font-weight="700">⑤ 急性溶血<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.82;0.8206;1" dur="9.5s" repeatCount="indefinite"/></tspan></text><path d="M34,410 H386" stroke="#e2e8f0" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.35"/><path d="M111.4,405 L111.4,415 M181.8,405 L181.8,415 M252.2,405 L252.2,415 M322.6,405 L322.6,415" stroke="#e2e8f0" stroke-width="1.1" fill="none"/><circle cy="410" r="5.4" fill="#1e293b" stroke="#ffffff" stroke-width="2"><animateTransform attributeName="transform" type="translate" values="34.0,0;39.9,0;45.7,0;51.6,0;57.5,0;63.3,0;69.2,0;75.1,0;80.9,0;86.8,0;92.7,0;98.5,0;104.4,0;110.3,0;116.1,0;122.0,0;127.9,0;133.7,0;139.6,0;145.5,0;151.3,0;157.2,0;163.1,0;168.9,0;174.8,0;180.7,0;186.5,0;192.4,0;198.3,0;204.1,0;210.0,0;215.9,0;221.7,0;227.6,0;233.5,0;239.3,0;245.2,0;251.1,0;256.9,0;262.8,0;268.7,0;274.5,0;280.4,0;286.3,0;292.1,0;298.0,0;303.9,0;309.7,0;315.6,0;321.5,0;327.3,0;333.2,0;339.1,0;344.9,0;350.8,0;356.7,0;362.5,0;368.4,0;374.3,0;380.1,0;386.0,0" keyTimes="0;0.0167;0.0333;0.05;0.0667;0.0833;0.1;0.1167;0.1333;0.15;0.1667;0.1833;0.2;0.2167;0.2333;0.25;0.2667;0.2833;0.3;0.3167;0.3333;0.35;0.3667;0.3833;0.4;0.4167;0.4333;0.45;0.4667;0.4833;0.5;0.5167;0.5333;0.55;0.5667;0.5833;0.6;0.6167;0.6333;0.65;0.6667;0.6833;0.7;0.7167;0.7333;0.75;0.7667;0.7833;0.8;0.8167;0.8333;0.85;0.8667;0.8833;0.9;0.9167;0.9333;0.95;0.9667;0.9833;1" dur="9.5s" repeatCount="indefinite" calcMode="linear"/></circle></svg>