<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 500" role="img" aria-labelledby="ft fd" style="background:#ffffff"><title id="ft">嘌呤分解与尿酸生成</title><desc id="fd">嘌呤核苷酸逐步降解为次黄嘌呤与鸟嘌呤，再经黄嘌呤氧化酶氧化为黄嘌呤、最终生成尿酸。人类缺乏尿酸氧化酶，尿酸为终产物，过高即结晶析出致痛风。</desc><text x="210.0" y="28" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="0.55s" fill="freeze" calcMode="spline" keySplines="0.23 1 0.32 1"/>嘌呤分解：终点是尿酸<tspan x="210.0" y="48" text-anchor="middle" font-size="11" fill="#64748b" font-weight="400">人缺尿酸氧化酶，所以停在尿酸；别嘌醇在此阻断</tspan></text><rect x="60" y="110" width="200" height="32" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.4"/><text x="160" y="131" text-anchor="middle" font-size="11.5" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">AMP / GMP</text><path d="M160,142 V154" stroke="#e2e8f0" stroke-width="1.8"/><polygon points="160,154 157,148 163,148" fill="#e2e8f0"/><rect x="60" y="154" width="200" height="32" rx="6" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="160" y="175" text-anchor="middle" font-size="11.5" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">次黄嘌呤 / 鸟嘌呤</text><path d="M160,186 V198" stroke="#e2e8f0" stroke-width="1.8"/><polygon points="160,198 157,192 163,192" fill="#e2e8f0"/><rect x="60" y="198" width="200" height="32" rx="6" fill="#ffffff" stroke="#a8791a" stroke-width="1.4"/><text x="160" y="219" text-anchor="middle" font-size="11.5" fill="#a8791a" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">黄嘌呤</text><path d="M160,230 V242" stroke="#e2e8f0" stroke-width="1.8"/><polygon points="160,242 157,236 163,236" fill="#e2e8f0"/><rect x="60" y="242" width="200" height="32" rx="6" fill="#ffffff" stroke="#c1440e" stroke-width="1.4"/><text x="160" y="263" text-anchor="middle" font-size="11.5" fill="#c1440e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">尿酸</text><text x="270" y="164" font-size="11" fill="#a8791a" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">黄嘌呤氧化酶</text><text x="270" y="208" font-size="11" fill="#a8791a" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">黄嘌呤氧化酶</text><g opacity="0"><circle cx="230" cy="208" r="11" fill="#ffffff" stroke="#c1440e" stroke-width="2"/><path d="M225,203 L235,213 M235,203 L225,213" stroke="#c1440e" stroke-width="2.2" stroke-linecap="round"/><text x="230" y="234" text-anchor="middle" font-size="11" fill="#c1440e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">别嘌醇</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.55;0.68;1" dur="9.0s" repeatCount="indefinite"/></g><g opacity="0.9"><path d="M310,150 l10,-6 l10,6 l-10,6 z" fill="#c1440e" opacity="0.5"/><path d="M310,172 l10,-6 l10,6 l-10,6 z" fill="#c1440e" opacity="0.5"/><path d="M310,194 l10,-6 l10,6 l-10,6 z" fill="#c1440e" opacity="0.5"/><path d="M310,216 l10,-6 l10,6 l-10,6 z" fill="#c1440e" opacity="0.5"/><path d="M310,238 l10,-6 l10,6 l-10,6 z" fill="#c1440e" opacity="0.5"/></g><text x="332" y="280" text-anchor="middle" font-size="11" fill="#c1440e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">结晶沉积</text><text font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><tspan x="210.0" y="316" text-anchor="middle" opacity="0" fill="#64748b" font-size="12" font-weight="700">① 核苷酸降解<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.25;0.2506;1" dur="9.0s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="316" text-anchor="middle" opacity="0" fill="#0f766e" font-size="12" font-weight="700">② 生成次黄嘌呤<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.2506;0.5;0.5006;1" dur="9.0s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="316" text-anchor="middle" opacity="0" fill="#a8791a" font-size="12" font-weight="700">③ 氧化为黄嘌呤<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.5006;0.75;0.7506;1" dur="9.0s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="316" text-anchor="middle" opacity="0" fill="#c1440e" font-size="12" font-weight="700">④ 生成尿酸<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.75;0.7506;1" dur="9.0s" repeatCount="indefinite"/></tspan></text><path d="M34,334 H386" stroke="#e2e8f0" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.35"/><path d="M122.0,329 L122.0,339 M210.0,329 L210.0,339 M298.0,329 L298.0,339" stroke="#e2e8f0" stroke-width="1.1" fill="none"/><circle cy="334" r="5.4" fill="#1e293b" stroke="#ffffff" stroke-width="2"><animateTransform attributeName="transform" type="translate" values="34.0,0;39.9,0;45.7,0;51.6,0;57.5,0;63.3,0;69.2,0;75.1,0;80.9,0;86.8,0;92.7,0;98.5,0;104.4,0;110.3,0;116.1,0;122.0,0;127.9,0;133.7,0;139.6,0;145.5,0;151.3,0;157.2,0;163.1,0;168.9,0;174.8,0;180.7,0;186.5,0;192.4,0;198.3,0;204.1,0;210.0,0;215.9,0;221.7,0;227.6,0;233.5,0;239.3,0;245.2,0;251.1,0;256.9,0;262.8,0;268.7,0;274.5,0;280.4,0;286.3,0;292.1,0;298.0,0;303.9,0;309.7,0;315.6,0;321.5,0;327.3,0;333.2,0;339.1,0;344.9,0;350.8,0;356.7,0;362.5,0;368.4,0;374.3,0;380.1,0;386.0,0" keyTimes="0;0.0167;0.0333;0.05;0.0667;0.0833;0.1;0.1167;0.1333;0.15;0.1667;0.1833;0.2;0.2167;0.2333;0.25;0.2667;0.2833;0.3;0.3167;0.3333;0.35;0.3667;0.3833;0.4;0.4167;0.4333;0.45;0.4667;0.4833;0.5;0.5167;0.5333;0.55;0.5667;0.5833;0.6;0.6167;0.6333;0.65;0.6667;0.6833;0.7;0.7167;0.7333;0.75;0.7667;0.7833;0.8;0.8167;0.8333;0.85;0.8667;0.8833;0.9;0.9167;0.9333;0.95;0.9667;0.9833;1" dur="9.0s" repeatCount="indefinite" calcMode="linear"/></circle><text x="210" y="358" text-anchor="middle" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">其他哺乳动物有尿酸氧化酶，可继续分解为尿囊素</text></svg>