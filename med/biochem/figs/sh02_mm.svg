<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 500" role="img" aria-labelledby="ft fd" style="background:#ffffff"><title id="ft">米氏方程与饱和曲线</title><desc id="fd">底物浓度很低时速度与浓度成正比；达到 Km 时速度为最大速度的一半；底物过量时酶被全部占据，速度趋于 Vmax 不再增加。</desc><text x="210.0" y="28" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="0.55s" fill="freeze" calcMode="spline" keySplines="0.23 1 0.32 1"/>米氏曲线：为什么会饱和<tspan x="210.0" y="48" text-anchor="middle" font-size="11" fill="#64748b" font-weight="400">酶的数量有限，底物再多也只能排队</tspan></text><rect x="44" y="86" width="266" height="180" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.1" rx="6"/><path d="M52,92 V240 H302" fill="none" stroke="#64748b" stroke-width="1.2"/><text x="302" y="255" text-anchor="end" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">[S]</text><text x="46" y="102" text-anchor="end" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">v</text><path d="M52,113.2 H302" stroke="#2f8f57" stroke-width="1" stroke-dasharray="4 3" opacity="0.7"/><text x="298" y="108.2" text-anchor="end" font-size="11" fill="#2f8f57" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">Vmax</text><path d="M52,176.6 H81.8" stroke="#b45309" stroke-width="1" stroke-dasharray="3 2"/><path d="M81.8,176.6 V240" stroke="#b45309" stroke-width="1" stroke-dasharray="3 2"/><path d="M58.0,240.0 L64.0,214.6 L69.9,197.7 L75.8,185.7 L81.8,176.6 L87.8,169.6 L93.7,163.9 L99.7,159.3 L105.6,155.5 L111.5,152.2 L117.5,149.4 L123.5,147.0 L129.4,144.9 L135.3,143.0 L141.3,141.4 L147.2,139.9 L153.2,138.6 L159.2,137.4 L165.1,136.3 L171.1,135.3 L177.0,134.3 L182.9,133.5 L188.9,132.7 L194.8,132.0 L200.8,131.3 L206.8,130.7 L212.7,130.1 L218.7,129.6 L224.6,129.1 L230.6,128.6 L236.5,128.1 L242.4,127.7 L