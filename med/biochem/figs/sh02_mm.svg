oft YaHei',sans-serif">有抑制</text><text x="34" y="292" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">酶的「座位」有限：底物越多，空位越少，加速就越不明显</text><text x="34" y="312" font-size="11" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">[S]=Km 时 v=Vmax/2；所以 Km 越小，越低的底物浓度就能跑满</text><text font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><tspan x="210.0" y="352" text-anchor="middle" opacity="0" fill="#0f766e" font-size="12" font-weight="700">① 底物少：[S] ≪ Km<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.3;0.3006;1" dur="9.0s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="352" text-anchor="middle" opacity="0" fill="#b45309" font-size="12" font-weight="700">② [S] = Km<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3;0.3006;0.54;0.5406;1" dur="9.0s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="352" text-anchor="middle" opacity="0" fill="#2f8f57" font-size="12" font-weight="700">③ 底物过量：[S] ≫ Km<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.54;0.5406;1" dur="9.0s" repeatCount="indefinite"/></tspan></text><path d="M34,372 H386" stroke="#e2e8f0" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.35"/><path d="M139.6,367 L139.6,377 M224.1,367 L224.1,377" stroke="#e2e8f0" stroke-width="1.1" fill="none"/><circle cy="372" r="5.4" fill="#1e293b" stroke="#ffffff" stroke-width="2"><animateTransform attributeName="transform" type="translate" values="34.0,0;39.9,0;45.7,0;51.6,0;57.5,0;63.3,0;69.2,0;75.1,0;80.9,0;86.8,0;92.7,0;98.5,0;104.4,0;110.3,0;116.1,0;122.0,0;127.9,0;133.7,0;139.6,0;145.5,0;151.3,0;157.2,0;163.1,0;168.9,0;174.8,0;180.7,0;186.5,0;192.4,0;198.3,0;204.1,0;210.0,0;215.9,0;221.7,0;227.6,0;233.5,0;239.3,0;245.2,0;251.1,0;256.9,0;262.8,0;268.7,0;274.5,0;280.4,0;286.3,0;292.1,0;298.0,0;303.9,0;309.7,0;315.6,0;321.5,0;327.3,0;333.2,0;339.1,0;344.9,0;350.8,0;356.7,0;362.5,0;368.4,0;374.3,0;380.1,0;38