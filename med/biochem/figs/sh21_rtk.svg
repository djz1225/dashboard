<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 500" role="img" aria-labelledby="ft fd" style="background:#ffffff"><title id="ft">受体酪氨酸激酶的两条主路</title><desc id="fd">配体结合使 RTK 二聚化并自身磷酸化，磷酸酪氨酸位点招募接头蛋白，分别启动 Ras-MAPK（促增殖）与 PI3K-Akt（抑凋亡、促存活）两条通路。</desc><text x="210.0" y="28" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="0.55s" fill="freeze" calcMode="spline" keySplines="0.23 1 0.32 1"/>RTK：一条受体，两条主路<tspan x="210.0" y="48" text-anchor="middle" font-size="11" fill="#64748b" font-weight="400">Ras-MAPK 管增殖，PI3K-Akt 管存活</tspan></text><rect x="34" y="150" width="352" height="12" rx="3" fill="#e2e8f0" opacity="0.55"/><rect x="186" y="128" width="48" height="46" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.8"/><text x="210" y="156" text-anchor="middle" font-size="11" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">RTK</text><circle cx="210" cy="108" r="9" fill="#2c5f9e"/><text x="210" y="94" text-anchor="middle" font-size="11" fill="#2c5f9e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">配体</text><path d="M210,117 V128" stroke="#2c5f9e" stroke-width="1.8"/><circle cx="196" cy="176" r="5" fill="#c0392b" opacity="0"><animate attributeName="opacity" values="0;1;1;0.4" keyTimes="0;0.16;0.5;1" dur="10.0s" repeatCount="indefinite"/></circle><circle cx="224" cy="176" r="5" fill="#c0392b" opacity="0"><animate attributeName="opacity" values="0;1;1;0.4" keyTimes="0;0.16;0.5;1" dur="10.0s" repeatCount="indefinite"/></circle><text x="252" y="180" font-size="11" fill="#c0392b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">自身磷酸化（pY）</text><rect x="54" y="188" width="112" height="26" rx="5" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="110" y="206" text-anchor="middle" font-size="11" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">Grb2-SOS</text><rect x="54" y="224" width="112" height="26" rx="5" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="110" y="242" text-anchor="middle" font-size="11" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">Ras-GTP</text><rect x="54" y="260" width="112" height="26" rx="5" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="110" y="278" text-anchor="middle" font-size="11" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">Raf→MEK→ERK</text><text x="110" y="308" text-anchor="middle" font-size="11" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">→ 促增殖转录</text><rect x="254" y="188" width="112" height="26" rx="5" fill="#dcfce7" stroke="#2f8f57" stroke-width="1.2"/><text x="310" y="206" text-anchor="middle" font-size="11" fill="#2f8f57" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">PI3K</text><rect x="254" y="224" width="112" height="26" rx="5" fill="#dcfce7" stroke="#2f8f57" stroke-width="1.2"/><text x="310" y="242" text-anchor="middle" font-size="11" fill="#2f8f57" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">PIP₃ → Akt</text><text x="310" y="274" text-anchor="middle" font-size="11" fill="#2f8f57" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">→ 抑凋亡、促存活</text><path d="M190,178 Q150,190 110,188" fill="none" stroke="#0f766e" stroke-width="1.6"/><path d="M230,178 Q270,190 310,188" fill="none" stroke="#2f8f57" stroke-width="1.6"/><circle r="5" fill="#0f766e"><animateTransform attributeName="transform" type="translate" values="190.0,178.0;187.3,178.3;184.7,178.7;182.0,179.0;179.3,179.3;176.7,179.7;174.0,180.0;171.3,180.3;168.7,180.7;166.0,181.0;163.3,181.3;160.7,181.7;158.0,182.0;155.3,182.3;152.7,182.7;150.0,183.0;147.3,183.3;144.7,183.7;142.0,184.