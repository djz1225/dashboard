<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 500" role="img" aria-labelledby="ft fd" style="background:#ffffff"><title id="ft">端粒与端粒酶</title><desc id="fd">线性 DNA 复制时末端引物去除后无法补齐，端粒逐代缩短；端粒酶以自身 RNA 为模板延长 3′ 端，是逆转录酶，在生殖细胞、干细胞与多数肿瘤中高表达。</desc><text x="210.0" y="28" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="0.55s" fill="freeze" calcMode="spline" keySplines="0.23 1 0.32 1"/>端粒：每复制一次就短一点<tspan x="210.0" y="48" text-anchor="middle" font-size="11" fill="#64748b" font-weight="400">端粒酶自带 RNA 模板，是逆转录酶</tspan></text><rect x="60" y="108" width="300" height="14" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><rect x="300" y="108" width="60" height="14" rx="7" fill="#c1440e" opacity="0.85"/><text x="34" y="119" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">第1代</text><rect x="60" y="142" width="260" height="14" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><rect x="272" y="142" width="48" height="14" rx="7" fill="#c1440e" opacity="0.85"/><text x="34" y="153" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">第2代</text><rect x="60" y="176" width="220" height="14" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><rect x="244" y="176" width="36" height="14" rx="7" fill="#c1440e" opacity="0.85"/><text x="34" y="187" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">第3代</text><rect x="60" y="210" width="180" height="14" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><rect x="216" y="210" width="24" height="14" rx="7" fill="#c1440e" opacity="0.85"/><text x="34" y="221" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">第4代</text><text x="386" y="100" text-anchor="end" font-size="11" fill="#c1440e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">端粒（红色）逐代缩短 50~200 bp</text><rect x="34" y="250" width="352" height="66" rx="7" fill="#dcfce7" stroke="#2f8f57" stroke-width="1.4"/><text x="44" y="268" font-size="11.5" fill="#2f8f57" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">端粒酶（生殖细胞/干细胞/肿瘤）</text><text x="44" y="286" font-size="11" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">自带 RNA 模板 → 延长 3′ 端 → 普通机制补齐另一链</text><text x="44" y="304" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">本质是逆转录酶；无 3′→5′ 校正 → 错误率高</text><circle r="5" fill="#2f8f57"><animateTransform attributeName="transform" type="translate" values="360,258;120,258" keyTimes="0;1" dur="9.0s" repeatCount="indefinite" calcMode="linear"/></circle><text font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><tspan x="210.0" y="336" text-anchor="middle" opacity="0" fill="#c1440e" font-size="12" font-weight="700">① 末端复制问题<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.3;0.3006;1" dur="9.0s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="336" text-anchor="middle" opacity="0" fill="#c1440e" font-size="12" font-weight="700">② 每代缩短<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3;0.3006;0.54;0.5406;1" dur="9.0s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="336" text-anchor="middle" opacity="0" fill="#2f8f57" font-size="12" font-weight="700">③ 端粒酶延长<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.54;0.5406;0.78;0.7806;1" dur="9.0s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="336" text-anchor="middle" opacity="0" fill="#c0392b" font-size="12" font-weight="700">④ 肿瘤重新激活<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.78;0.7806;1" dur="9.0s" repeatCount="indefinite"/></tspan></text><path d="M34,354 H386" stroke="#e2e8f0" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.35"/><path d="M139.6,349 L139.6,359 M224.1,349 L224.1,359 M308.6,349 L308.6,359" stroke="#e2e8f0" stroke-width="1.1" fill="none"/><circle cy="354" r="5.4" fill="#1e293b" stroke="#ffffff" stroke-width="2"><animateTransform attributeName="transform" type="translate" values="34.0,0;39.9,0;45.7,0;51.6,0;57.5,0;63.3,0;69.2,0;75.1,0;80.9,0;86.8,0;92.7,0;98.5,0;104.4,0;110.3,0;116.1,0;122.0,0;127.9,0;133.7,0;139.6,0;145.5,0;151.3,0;157.2,0;163.1,0;168.9,0;174.8,0;180.7,0;186.5,0;192.4,0;198.3,0;204.1,0;210.0,0;215.9,0;221.7,0;227.6,0;233.5,0;239.3,0;245.2,0;251.1,0;256.9,0;262.8,0;268.7,0;274.5,0;280.4,0;286.3,0;292.1,0;298.0,0;303.9,0;309.7,0;315.6,0;321.5,0;327.3,0;333.2,0;339.1,0;344.9,0;350.8,0;356.7,0;362.5,0;368.4,0;374.3,0;380.1,0;386.0,0" keyTimes="0;0.0167;0.0333;0.05;0.0667;0.0833;0.1;0.1167;0.1333;0.15;0.1667;0.1833;0.2;0.2167;0.2333;0.25;0.2667;0.2833;0.3;0.3167;0.3333;0.35;0.3667;0.3833;0.4;0.4167;0.4333;0.45;0.4667;0.4833;0.5;0.5167;0.5333;0.55;0.5667;0.5833;0.6;0.6167;0.6333;0.65;0.6667;0.6833;0.7;0.7167;0.7333;0.75;0.7667;0.7833;0.8;0.8167;0.8333;0.85;0.8667;0.8833;0.9;0.9167;0.9333;0.95;0.9667;0.9833;1" dur="9.0s" repeatCount="indefinite" calcMode="linear"/></circle></svg>