<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 500" role="img" aria-labelledby="ft fd" style="background:#ffffff"><title id="ft">蛋白质变性与盐析的区别</title><desc id="fd">加热、强酸碱、重金属破坏空间构象，一级结构不变但活性丧失且不可逆；高浓度中性盐只使蛋白沉淀，构象与活性保持，稀释可复溶。</desc><text x="210.0" y="28" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="0.55s" fill="freeze" calcMode="spline" keySplines="0.23 1 0.32 1"/>变性 与 盐析：一个毁构象，一个只沉淀<tspan x="210.0" y="48" text-anchor="middle" font-size="11" fill="#64748b" font-weight="400">判断标准只有一条——空间构象有没有被破坏</tspan></text><text x="30" y="100" font-size="12" fill="#c1440e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">变性（不可逆）</text><circle cx="84" cy="160" r="30" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><circle cx="84" cy="160" r="12" fill="#b8ece2" stroke="#0f766e" stroke-width="1" stroke-dasharray="3 2"/><path d="M40,178 q12,-22 24,-4 q12,18 24,0 q12,-18 24,4 q12,20 24,-2" fill="none" stroke="#c1440e" stroke-width="2.8" stroke-linecap="round" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2;0.47;1" dur="8.5s" repeatCount="indefinite"/></path><circle cx="84" cy="160" r="30" fill="#ffffff" opacity="0"><animate attributeName="opacity" values="0;0;0.95;0.95" keyTimes="0;0.2;0.45999999999999996;1" dur="8.5s" repeatCount="indefinite"/></circle><path d="M232,134 q-9,14 0,22 q9,-8 0,-22" fill="#c1440e" opacity="0.85"/><path d="M250,128 q-9,14 0,22 q9,-8 0,-22" fill="#c1440e" opacity="0.6"/><text x="238" y="176" font-size="11" fill="#c1440e" text-anchor="middle" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">加热</text><text x="30" y="232" font-size="12" fill="#2f8f57" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">盐析（可逆）</text><path d="M30,254 H390" stroke="#e2e8f0" stroke-width="1"/><g opacity="0.95"><circle cx="74" cy="280" r="19" fill="#dcfce7" stroke="#2f8f57" stroke-width="1.8"/><circle cx="74" cy="280" r="7" fill="#c3f0d3" stroke="#2f8f57" stroke-width="0.9" stroke-dasharray="2 2"/><animateTransform attributeName="transform" type="translate" values="0,-26;0,-26;0,26;0,26" keyTimes="0;0.42;0.64;1" dur="8.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.23 1 0.32 1;0.45 0 0.55 1;0.23 1 0.32 1"/></g><g opacity="0.95"><circle cx="136" cy="280" r="19" fill="#dcfce7" stroke="#2f8f57" stroke-width="1.8"/><circle cx="136" cy="280" r="7" fill="#c3f0d3" stroke="#2f8f57" stroke-width="0.9" stroke-dasharray="2 2"/><animateTransform attributeName="transform" type="translate" values="0,-26;0,-26;0,26;0,26" keyTimes="0;0.42;0.64;1" dur="8.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.23 1 0.32 1;0.45 0 0.55 1;0.23 1 0.32 1"/></g><g opacity="0.95"><circle cx="198" cy="280" r="19" fill="#dcfce7" stroke="#2f8f57" stroke-width="1.8"/><circle cx="198" cy="280" r="7" fill="#c3f0d3" stroke="#2f8f57" stroke-width="0.9" stroke-dasharray="2 2"/><animateTransform attributeName="transform" type="translate" values="0,-26;0,-26;0,26;0,26" keyTimes="0;0.42;0.64;1" dur="8.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.23 1 0.32 1;0.45 0 0.55 1;0.23 1 0.32 1"/></g><g opacity="0.95"><circle cx="260" cy="280" r="19" fill="#dcfce7" stroke="#2f8f57" stroke-width="1.8"/><circle cx="260" cy="280" r="7" fill="#c3f0d3" stroke="#2f8f57" stroke-width="0.9" stroke-dasharray="2 2"/><animateTransform attributeName="transform" type="translate" values="0,-26;0,-26;0,26;0,26" keyTimes="0;0.42;0.64;1" dur="8.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.23 1 0.32 1;0.45 0 0.55 1;0.23 1 0.32 1"/></g><text x="30" y="334" font-size="11" fill="#2f8f57" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">加硫酸铵 → 沉淀，构象完好；稀释即复溶</text><text font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><tspan x="210.0" y="372" text-anchor="middle" opacity="0" fill="#0f766e" font-size="12.5" font-weight="700">① 天然构象<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.2;0.2006;1" dur="8.5s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="372" text-anchor="middle" opacity="0" fill="#c1440e" font-size="12.5" font-weight="700">② 加热 / 强酸碱 / 重金属<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2;0.2006;0.42;0.4206;1" dur="8.5s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="372" text-anchor="middle" opacity="0" fill="#c1440e" font-size="12.5" font-weight="700">③ 变性：空间构象瓦解<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.42;0.4206;0.72;0.7206;1" dur="8.5s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="372" text-anchor="middle" opacity="0" fill="#2f8f57" font-size="12.5" font-weight="700">对照：加硫酸铵只是盐析<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.72;0.7206;1" dur="8.5s" repeatCount="indefinite"/></tspan></text><path d="M34,390 H386" stroke="#e2e8f0" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.35"/><path d="M104.4,385 L104.4,395 M181.8,385 L181.8,395 M287.4,385 L287.4,395" stroke="#e2e8f0" stroke-width="1.1" fill="none"/><circle cy="390" r="5.4" fill="#1e293b" stroke="#ffffff" stroke-width="2"><animateTransform attributeName="transform" type="translate" values="34.0,0;39.9,0;45.7,0;51.6,0;57.5,0;63.3,0;69.2,0;75.1,0;80.9,0;86.8,0;92.7,0;98.5,0;104.4,0;110.3,0;116.1,0;122.0,0;127.9,0;133.7,0;139.6,0;145.5,0;151.3,0;157.2,0;163.1,0;168.9,0;174.8,0;180.7,0;186.5,0;192.4,0;198.3,0;204.1,0;210.0,0;215.9,0;221.7,0;227.6,0;233.5,0;239.3,0;245.2,0;251.1,0;256.9,0;262.8,0;268.7,0;274.5,0;280.4,0;286.3,0;292.1,0;298.0,0;303.9,0;309.7,0;315.6,0;321.5,0;327.3,0;333.2,0;339.1,0;344.9,0;350.8,0;356.7,0;362.5,0;368.4,0;374.3,0;380.1,0;386.0,0" keyTimes="0;0.0167;0.0333;0.05;0.0667;0.0833;0.1;0.1167;0.1333;0.15;0.1667;0.1833;0.2;0.2167;0.2333;0.25;0.2667;0.2833;0.3;0.3167;0.3333;0.35;0.3667;0.3833;0.4;0.4167;0.4333;0.45;0.4667;0.4833;0.5;0.5167;0.5333;0.55;0.5667;0.5833;0.6;0.6167;0.6333;0.65;0.6667;0.6833;0.7;0.7167;0.7333;0.75;0.7667;0.7833;0.8;0.8167;0.8333;0.85;0.8667;0.8833;0.9;0.9167;0.9333;0.95;0.9667;0.9833;1" dur="8.5s" repeatCount="indefinite" calcMode="linear"/></circle></svg>