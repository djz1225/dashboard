<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 500" role="img" aria-labelledby="ft fd" style="background:#ffffff"><title id="ft">DNA 变性与复性</title><desc id="fd">升温使氢键断裂、双链解开，260nm 紫外吸收升高（增色效应）；缓慢降温可恢复双螺旋（复性）。变性不断共价键，故可逆。</desc><text x="210.0" y="28" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="0.55s" fill="freeze" calcMode="spline" keySplines="0.23 1 0.32 1"/>DNA 变性：双链解开又合上<tspan x="210.0" y="48" text-anchor="middle" font-size="11" fill="#64748b" font-weight="400">升温断氢键 → 260 nm 吸收升高（增色效应）；降温可复性</tspan></text><path d="M150,108 V268" stroke="#0f766e" stroke-width="4" stroke-linecap="round"/><path d="M270,108 V268" stroke="#2c5f9e" stroke-width="4" stroke-linecap="round"/><g><path d="M150,128 H270" stroke="#64748b" stroke-width="1.6" stroke-dasharray="4 3"/><animate attributeName="opacity" values="1;1;0.06;0.06;1" keyTimes="0;0.30;0.42;0.72;1" dur="9.0s" repeatCount="indefinite"/></g><g><path d="M150,158 H270" stroke="#64748b" stroke-width="1.6" stroke-dasharray="4 3"/><animate attributeName="opacity" values="1;1;0.06;0.06;1" keyTimes="0;0.30;0.42;0.72;1" dur="9.0s" repeatCount="indefinite"/></g><g><path d="M150,188 H270" stroke="#64748b" stroke-width="1.6" stroke-dasharray="4 3"/><animate attributeName="opacity" values="1;1;0.06;0.06;1" keyTimes="0;0.30;0.42;0.72;1" dur="9.0s" repeatCount="indefinite"/></g><g><path d="M150,218 H270" stroke="#64748b" stroke-width="1.6" stroke-dasharray="4 3"/><animate attributeName="opacity" values="1;1;0.06;0.06;1" keyTimes="0;0.30;0.42;0.72;1" dur="9.0s" repeatCount="indefinite"/></g><g><path d="M150,248 H270" stroke="#64748b" stroke-width="1.6" stroke-dasharray="4 3"/><animate attributeName="opacity" values="1;1;0.06;0.06;1" keyTimes="0;0.30;0.42;0.72;1" dur="9.0s" repeatCount="indefinite"/></g><text x="210" y="96" text-anchor="middle" font-size="11.5" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">双链：氢键维持（A=T 两个、G≡C 三个）</text><g><path d="M150,108 V268" stroke="#0f766e" stroke-width="4" stroke-linecap="round" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.34;0.42;0.72;1" dur="9.0s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0,0;-26,0;-26,0;0,0" keyTimes="0;0.42;0.72;1" dur="9.0s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1"/></g><g><path d="M270,108 V268" stroke="#2c5f9e" stroke-width="4" stroke-linecap="round" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.34;0.42;0.72;1" dur="9.0s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0,0;26,0;26,0;0,0" keyTimes="0;0.42;0.72;1" dur="9.0s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1"/></g><text x="34" y="292" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">A260 吸收</text><rect x="34" y="300" width="352" height="13" rx="6.5" fill="#eef2f7"/><g transform="translate(34,306.5)"><rect x="0" y="-6.5" width="352" height="13" rx="6.5" fill="#0f766e" opacity="0.8"><animateTransform attributeName="transform" type="scale" additive="sum" values="1 1;1 1;1.38 1;1.38 1;1 1" keyTimes="0;0.34;0.46;0.72;1" dur="9.0s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1"/></rect></g><text x="386" y="292" text-anchor="end" font-size="11" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">升 25~40%</text><text x="210" y="336" text-anchor="middle" font-size="11.5" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">升温 → 氢键断裂 → 吸光升高 → 降温复性</text><text font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><tspan x="210.0" y="358" text-anchor="middle" opacity="0" fill="#0f766e" font-size="12" font-weight="700">① 天然双链<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.34;0.3406;1" dur="9.0s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="358" text-anchor="middle" opacity="0" fill="#c1440e" font-size="12" font-weight="700">② 升温变性<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.34;0.3406;0.6;0.6006;1" dur="9.0s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="358" text-anchor="middle" opacity="0" fill="#c1440e" font-size="12" font-weight="700">③ 单链状态<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6;0.6006;0.82;0.8206;1" dur="9.0s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="358" text-anchor="middle" opacity="0" fill="#2f8f57" font-size="12" font-weight="700">④ 降温复性<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.82;0.8206;1" dur="9.0s" repeatCount="indefinite"/></tspan></text><path d="M34,378 H386" stroke="#e2e8f0" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.35"/><path d="M153.7,373 L153.7,383 M245.2,373 L245.2,383 M322.6,373 L322.6,383" stroke="#e2e8f0" stroke-width="1.1" fill="none"/><circle cy="378" r="5.4" fill="#1e293b" stroke="#ffffff" stroke-width="2"><animateTransform attributeName="transform" type="translate" values="34.0,0;39.9,0;45.7,0;51.6,0;57.5,0;63.3,0;69.2,0;75.1,0;80.9,0;86.8,0;92.7,0;98.5,0;104.4,0;110.3,0;116.1,0;122.0,0;127.9,0;133.7,0;139.6,0;145.5,0;151.3,0;157.2,0;163.1,0;168.9,0;174.8,0;180.7,0;186.5,0;192.4,0;198.3,0;204.1,0;210.0,0;215.9,0;221.7,0;227.6,0;233.5,0;239.3,0;245.2,0;251.1,0;256.9,0;262.8,0;268.7,0;274.5,0;280.4,0;286.3,0;292.1,0;298.0,0;303.9,0;309.7,0;315.6,0;321.5,0;327.3,0;333.2,0;339.1,0;344.9,0;350.8,0;356.7,0;362.5,0;368.4,0;374.3,0;380.1,0;386.0,0" keyTimes="0;0.0167;0.0333;0.05;0.0667;0.0833;0.1;0.1167;0.1333;0.15;0.1667;0.1833;0.2;0.2167;0.2333;0.25;0.2667;0.2833;0.3;0.3167;0.3333;0.35;0.3667;0.3833;0.4;0.4167;0.4333;0.45;0.4667;0.4833;0.5;0.5167;0.5333;0.55;0.5667;0.5833;0.6;0.6167;0.6333;0.65;0.6667;0.6833;0.7;0.7167;0.7333;0.75;0.7667;0.7833;0.8;0.8167;0.8333;0.85;0.8667;0.8833;0.9;0.9167;0.9333;0.95;0.9667;0.9833;1" dur="9.0s" repeatCount="indefinite" calcMode="linear"/></circle><text x="210" y="400" text-anchor="middle" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">Tm = 一半解链时的温度；GC 越高 Tm 越高</text></svg>