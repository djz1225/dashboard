<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 500" role="img" aria-labelledby="ft fd" style="background:#ffffff"><title id="ft">三羧酸循环一轮的收支</title><desc id="fd">每轮三羧酸循环产生 3 个 NADH、1 个 FADH₂、1 个 GTP，按 2.5 与 1.5 折算合计 10 个 ATP；草酰乙酸在循环末再生。</desc><text x="210.0" y="28" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="0.55s" fill="freeze" calcMode="spline" keySplines="0.23 1 0.32 1"/>三羧酸循环：一轮的收支<tspan x="210.0" y="48" text-anchor="middle" font-size="11" fill="#64748b" font-weight="400">3 NADH + 1 FADH₂ + 1 GTP = 10 ATP</tspan></text><rect x="34" y="96" width="352" height="34" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.3"/><text x="210" y="118" text-anchor="middle" font-size="11.2" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">乙酰CoA + 草酰乙酸 → 柠檬酸</text><rect x="34" y="136" width="352" height="34" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.3"/><text x="210" y="158" text-anchor="middle" font-size="11.2" fill="#c0392b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">异柠檬酸 → α-酮戊二酸  ＋NADH</text><rect x="34" y="176" width="352" height="34" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.3"/><text x="210" y="198" text-anchor="middle" font-size="11.2" fill="#c0392b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">α-酮戊二酸 → 琥珀酰CoA  ＋NADH</text><rect x="34" y="216" width="352" height="34" rx="6" fill="#ffffff" stroke="#2f8f57" stroke-width="1.3"/><text x="210" y="238" text-anchor="middle" font-size="11.2" fill="#2f8f57" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">琥珀酰CoA → 琥珀酸  ＋GTP</text><rect x="34" y="256" width="352" height="34" rx="6" fill="#ffffff" stroke="#a8791a" stroke-width="1.3"/><text x="210" y="278" text-anchor="middle" font-size="11.2" fill="#a8791a" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">琥珀酸 → 延胡索酸  ＋FADH₂</text><rect x="34" y="296" width="352" height="34" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.3"/><text x="210" y="318" text-anchor="middle" font-size="11.2" fill="#c0392b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">苹果酸 → 草酰乙酸  ＋NADH</text><path d="M392,316 Q412,96 392,112" fill="none" stroke="#64748b" stroke-width="1.6" stroke-dasharray="4 3" opacity="0.8"/><text x="34" y="346" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">累计产量</text><rect x="34" y="354" width="264.0" height="15" rx="4" fill="#c0392b" opacity="0.82"/><text x="166.0" y="365" text-anchor="middle" font-size="11" fill="#ffffff" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">NADH ×3</text><rect x="301.0" y="354" width="88.0" height="15" rx="4" fill="#a8791a" opacity="0.82"/><text x="345.0" y="365" text-anchor="middle" font-size="11" fill="#ffffff" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">FADH₂ ×1</text><rect x="392.0" y="354" width="70.4" height="15" rx="4" fill="#2f8f57" opacity="0.82"/><text x="427.2" y="365" text-anchor="middle" font-size="11" fill="#ffffff" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">GTP ×1</text><text font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><tspan x="210.0" y="348" text-anchor="middle" opacity="0" fill="#64748b" font-size="11.5" font-weight="700">① 柠檬酸生成（限速：柠檬酸合酶）<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.17;0.1706;1" dur="11.0s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="348" text-anchor="middle" opacity="0" fill="#c0392b" font-size="11.5" font-weight="700">② 两次氧化脱羧产 NADH<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.17;0.1706;0.34;0.3406;1" dur="11.0s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="348" text-anchor="middle" opacity="0" fill="#2f8f57" font-size="11.5" font-weight="700">③ 底物水平磷酸化产 GTP<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.34;0.3406;0.5;0.5006;1" dur="11.0s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="348" text-anchor="middle" opacity="0" fill="#a8791a" font-size="11.5" font-weight="700">④ FADH₂ 来自琥珀酸脱氢酶<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.5006;0.67;0.6706;1" dur="11.0s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="348" text-anchor="middle" opacity="0" fill="#c0392b" font-size="11.5" font-weight="700">⑤ 草酰乙酸再生，循环闭合<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.67;0.6706;0.84;0.8406;1" dur="11.0s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="348" text-anchor="middle" opacity="0" fill="#0f766e" font-size="11.5" font-weight="700">⑥ 合计 10 ATP<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.84;0.8406;1" dur="11.0s" repeatCount="indefinite"/></tspan></text><path d="M34,370 H386" stroke="#e2e8f0" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.35"/><path d="M93.8,365 L93.8,375 M153.7,365 L153.7,375 M210.0,365 L210.0,375 M269.8,365 L269.8,375 M329.7,365 L329.7,375" stroke="#e2e8f0" stroke-width="1.1" fill="none"/><circle cy="370" r="5.4" fill="#1e293b" stroke="#ffffff" stroke-width="2"><animateTransform attributeName="transform" type="translate" values="34.0,0;39.9,0;45.7,0;51.6,0;57.5,0;63.3,0;69.2,0;75.1,0;80.9,0;86.8,0;92.7,0;98.5,0;104.4,0;110.3,0;116.1,0;122.0,0;127.9,0;133.7,0;139.6,0;145.5,0;151.3,0;157.2,0;163.1,0;168.9,0;174.8,0;180.7,0;186.5,0;192.4,0;198.3,0;204.1,0;210.0,0;215.9,0;221.7,0;227.6,0;233.5,0;239.3,0;245.2,0;251.1,0;256.9,0;262.8,0;268.7,0;274.5,0;280.4,0;286.3,0;292.1,0;298.0,0;303.9,0;309.7,0;315.6,0;321.5,0;327.3,0;333.2,0;339.1,0;344.9,0;350.8,0;356.7,0;362.5,0;368.4,0;374.3,0;380.1,0;386.0,0" keyTimes="0;0.0167;0.0333;0.05;0.0667;0.0833;0.1;0.1167;0.1333;0.15;0.1667;0.1833;0.2;0.2167;0.2333;0.25;0.2667;0.2833;0.3;0.3167;0.3333;0.35;0.3667;0.3833;0.4;0.4167;0.4333;0.45;0.4667;0.4833;0.5;0.5167;0.5333;0.55;0.5667;0.5833;0.6;0.6167;0.6333;0.65;0.6667;0.6833;0.7;0.7167;0.7333;0.75;0.7667;0.7833;0.8;0.8167;0.8333;0.85;0.8667;0.8833;0.9;0.9167;0.9333;0.95;0.9667;0.9833;1" dur="11.0s" repeatCount="indefinite" calcMode="linear"/></circle><text x="210" y="396" text-anchor="middle" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">限速酶：异柠檬酸脱氢酶（最重要）</text></svg>