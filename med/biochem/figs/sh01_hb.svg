<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 500" role="img" aria-labelledby="ft fd" style="background:#ffffff"><title id="ft">血红蛋白的正协同与玻尔效应</title><desc id="fd">第一个氧结合后引发 T 态向 R 态转变，其余亚基亲和力骤升，形成 S 形氧解离曲线；酸性、二氧化碳与高温使曲线右移。</desc><text x="210.0" y="28" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="0.55s" fill="freeze" calcMode="spline" keySplines="0.23 1 0.32 1"/>Hb 的正协同：越抓越容易抓<tspan x="210.0" y="48" text-anchor="middle" font-size="11" fill="#64748b" font-weight="400">S 形曲线 = 4 个亚基依次变构的结果</tspan></text><circle cx="132" cy="128" r="30" fill="#dbe7f5" stroke="#2c5f9e" stroke-width="2"/><circle cx="132" cy="128" r="30" fill="#fbe3e0" stroke="#c0392b" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.24;1" dur="9.0s" repeatCount="indefinite"/></circle><circle cx="132" cy="128" r="7" fill="#b45309" opacity="0.85"/><circle cx="212" cy="128" r="30" fill="#dbe7f5" stroke="#2c5f9e" stroke-width="2"/><circle cx="212" cy="128" r="30" fill="#fbe3e0" stroke="#c0392b" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.48;1" dur="9.0s" repeatCount="indefinite"/></circle><circle cx="212" cy="128" r="7" fill="#b45309" opacity="0.85"/><circle cx="132" cy="200" r="30" fill="#dbe7f5" stroke="#2c5f9e" stroke-width="2"/><circle cx="132" cy="200" r="30" fill="#fbe3e0" stroke="#c0392b" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.76;1" dur="9.0s" repeatCount="indefinite"/></circle><circle cx="132" cy="200" r="7" fill="#b45309" opacity="0.85"/><circle cx="212" cy="200" r="30" fill="#dbe7f5" stroke="#2c5f9e" stroke-width="2"/><circle cx="212" cy="200" r="30" fill="#fbe3e0" stroke="#c0392b" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0.92;0.92;1" keyTimes="0;1.0