" y="224" text-anchor="end" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">PO₂</text><text x="274" y="104" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">饱和度</text><text x="40" y="272" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">对 O₂ 的亲和力</text><rect x="40" y="280" width="340" height="13" rx="6.5" fill="#eef2f7"/><g transform="translate(40,286.5)"><rect x="0" y="-6.5" width="340" height="13" rx="6.5" fill="#c0392b" opacity="0.8"><animateTransform attributeName="transform" type="scale" additive="sum" values="0.12 1;0.12 1;0.38 1;0.72 1;1 1" keyTimes="0;0.0;0.24;0.48;1" dur="9.0s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1"/></rect></g><text x="380" y="272" text-anchor="end" font-size="11" fill="#c0392b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">T → R</text><text font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><tspan x="210.0" y="332" text-anchor="middle" opacity="0" fill="#2c5f9e" font-size="12.5" font-weight="700">① T 态，亲和力低<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.24;0.2406;1" dur="9.0s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="332" text-anchor="middle" opacity="0" fill="#0f766e" font-size="12.5" font-weight="700">② 第 1 个 O₂ 结合<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.24;0.2406;0.48;0.4806;1" dur="9.0s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="332" text-anchor="middle" opacity="0" fill="#c0392b" font-size="12.5" font-weight="700">③ T → R 转变<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.48;0.4806;0.76;0.7606;1" dur="9.0s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="332" text-anchor="middle" opacity="0" fill="#c0392b" font-size="12.5" font-weight="700">④ 全部饱和<animate