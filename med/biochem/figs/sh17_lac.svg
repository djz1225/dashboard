<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 500" role="img" aria-labelledby="ft fd" style="background:#ffffff"><title id="ft">乳糖操纵子的双重调控</title><desc id="fd">乳糖存在时阻遏蛋白从操纵基因脱落（负调控解除）；葡萄糖低时 cAMP 升高、CAP 结合启动子上游（正调控）。两者同时满足才高效转录。</desc><text x="210.0" y="28" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="0.55s" fill="freeze" calcMode="spline" keySplines="0.23 1 0.32 1"/>乳糖操纵子：两个开关同时看<tspan x="210.0" y="48" text-anchor="middle" font-size="11" fill="#64748b" font-weight="400">阻遏蛋白管能不能，CAP-cAMP 管多不多</tspan></text><rect x="60" y="116" width="34" height="30" rx="4" fill="#ffffff" stroke="#a8791a" stroke-width="1.4"/><text x="77.0" y="136" text-anchor="middle" font-size="11" fill="#a8791a" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">P</text><rect x="100" y="116" width="30" height="30" rx="4" fill="#ffffff" stroke="#c1440e" stroke-width="1.4"/><text x="115.0" y="136" text-anchor="middle" font-size="11" fill="#c1440e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">O</text><rect x="136" y="116" width="62" height="30" rx="4" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="167.0" y="136" text-anchor="middle" font-size="11" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">lacZ</text><rect x="204" y="116" width="130" height="30" rx="4" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="269.0" y="136" text-anchor="middle" font-size="11" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">lacY·lacA</text><g><rect x="96" y="90" width="38" height="20" rx="4" fill="#c1440e" opacity="0.85"/><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.28;0.40;0.72;1" dur="10.0s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0,0;0,0;0,-34;0,-34;0,0" keyTimes="0;0.28;0.40;0.72;1" dur="10.0s" repeatCount="indefinite"/></g><g><rect x="46" y="64" width="64" height="20" rx="4" fill="#0f766e" opacity="0.85"/><text x="78" y="78" text-anchor="middle" font-size="11" fill="#ffffff" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">CAP-cAMP</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.62;0.74;1" dur="10.0s" repeatCount="indefinite"/></g><g opacity="0"><path d="M150,162 H340" stroke="#2f8f57" stroke-width="4" stroke-linecap="round"/><text x="245" y="182" text-anchor="middle" font-size="11" fill="#2f8f57" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">lac mRNA（多顺反子）</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.62;0.74;1" dur="10.0s" repeatCount="indefinite"/></g><text x="42" y="212" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">条件 / 阻遏蛋白 / CAP / 转录</text><rect x="34" y="220" width="352" height="24" rx="4" fill="#ffffff" stroke="#a8791a" stroke-width="1.1"/><text x="42" y="236" font-size="11" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">葡萄糖高 / 乳糖有</text><text x="212" y="236" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">不结合</text><text x="288" y="236" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">不结合</text><text x="376" y="236" text-anchor="end" font-size="11" fill="#a8791a" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">低表达</text><rect x="34" y="250" width="352" height="24" rx="4" fill="#ffffff" stroke="#64748b" stroke-width="1.1"/><text x="42" y="266" font-size="11" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">葡萄糖低 / 乳糖无</text><text x="212" y="266" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">结合</text><text x="288" y="266" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">结合</text><text x="376" y="266" text-anchor="end" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">关闭</text><rect x="34" y="280" width="352" height="24" rx="4" fill="#ffffff" stroke="#2f8f57" stroke-width="1.1"/><text x="42" y="296" font-size="11" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">葡萄糖低 / 乳糖有</text><text x="212" y="296" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">不结合</text><text x="288" y="296" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">结合</text><text x="376" y="296" text-anchor="end" font-size="11" fill="#2f8f57" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">高表达</text><text font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><tspan x="210.0" y="348" text-anchor="middle" opacity="0" fill="#c1440e" font-size="11.5" font-weight="700">① 乳糖有 → 阻遏解除<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.28;0.2806;1" dur="10.0s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="348" text-anchor="middle" opacity="0" fill="#0f766e" font-size="11.5" font-weight="700">② 葡萄糖低 → cAMP↑<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.28;0.2806;0.5;0.5006;1" dur="10.0s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="348" text-anchor="middle" opacity="0" fill="#0f766e" font-size="11.5" font-weight="700">③ CAP 结合 → 正调控<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.5006;0.74;0.7406;1" dur="10.0s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="348" text-anchor="middle" opacity="0" fill="#2f8f57" font-size="11.5" font-weight="700">④ 高效转录 lacZYA<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.74;0.7406;1" dur="10.0s" repeatCount="indefinite"/></tspan></text><path d="M34,366 H386" stroke="#e2e8f0" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.35"/><path d="M132.6,361 L132.6,371 M210.0,361 L210.0,371 M294.5,361 L294.5,371" stroke="#e2e8f0" stroke-width="1.1" fill="none"/><circle cy="366" r="5.4" fill="#1e293b" stroke="#ffffff" stroke-width="2"><animateTransform attributeName="transform" type="translate" values="34.0,0;39.9,0;45.7,0;51.6,0;57.5,0;63.3,0;69.2,0;75.1,0;80.9,0;86.8,0;92.7,0;98.5,0;104.4,0;110.3,0;116.1,0;122.0,0;127.9,0;133.7,0;139.6,0;145.5,0;151.3,0;157.2,0;163.1,0;168.9,0;174.8,0;180.7,0;186.5,0;192.4,0;198.3,0;204.1,0;210.0,0;215.9,0;221.7,0;227.6,0;233.5,0;239.3,0;245.2,0;251.1,0;256.9,0;262.8,0;268.7,0;274.5,0;280.4,0;286.3,0;292.1,0;298.0,0;303.9,0;309.7,0;315.6,0;321.5,0;327.3,0;333.2,0;339.1,0;344.9,0;350.8,0;356.7,0;362.5,0;368.4,0;374.3,0;380.1,0;386.0,0" keyTimes="0;0.0167;0.0333;0.05;0.0667;0.0833;0.1;0.1167;0.1333;0.15;0.1667;0.1833;0.2;0.2167;0.2333;0.25;0.2667;0.2833;0.3;0.3167;0.3333;0.35;0.3667;0.3833;0.4;0.4167;0.4333;0.45;0.4667;0.4833;0.5;0.5167;0.5333;0.55;0.5667;0.5833;0.6;0.6167;0.6333;0.65;0.6667;0.6833;0.7;0.7167;0.7333;0.75;0.7667;0.7833;0.8;0.8167;0.8333;0.85;0.8667;0.8833;0.9;0.9167;0.9333;0.95;0.9667;0.9833;1" dur="10.0s" repeatCount="indefinite" calcMode="linear"/></circle></svg>