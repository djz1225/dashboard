<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 500" role="img" aria-labelledby="ft fd" style="background:#ffffff"><title id="ft">呼吸链：电子单向流动</title><desc id="fd">电子沿氧化还原电位递增的方向单向传递，最终把 O₂ 还原为水；三个复合体泵出质子建立梯度。复合体Ⅱ 不泵质子，故 FADH₂ 少产 ATP。</desc><text x="210.0" y="28" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="0.55s" fill="freeze" calcMode="spline" keySplines="0.23 1 0.32 1"/>呼吸链：电子单向流动<tspan x="210.0" y="48" text-anchor="middle" font-size="11" fill="#64748b" font-weight="400">NADH → Ⅰ → Q → Ⅲ → cyt c → Ⅳ → O₂</tspan></text><rect x="60" y="104" width="300" height="46" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.6"/><text x="210" y="132.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">复合体Ⅰ：接 NADH，泵 4 H⁺</text><rect x="60" y="158" width="300" height="46" rx="8" fill="#fef3c7" stroke="#a8791a" stroke-width="1.6"/><text x="210" y="186.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#a8791a" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">泛醌 Q：膜内流动载体</text><rect x="60" y="212" width="300" height="46" rx="8" fill="#fef3c7" stroke="#a8791a" stroke-width="1.6"/><text x="210" y="240.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#a8791a" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">复合体Ⅲ：Q 循环，泵 4 H⁺</text><rect x="60" y="266" width="300" height="46" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.6"/><text x="210" y="294.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">细胞色素 c：膜间隙侧传递</text><rect x="60" y="320" width="300" height="46" rx="8" fill="#fbe3e0" stroke="#c0392b" stroke-width="1.6"/><text x="210" y="348.