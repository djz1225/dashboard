<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 500" role="img" aria-labelledby="ft fd" style="background:#ffffff"><title id="ft">维生素 K 循环与 γ-羧化</title><desc id="fd">维生素 K 还原型作为辅因子，使凝血因子的谷氨酸残基 γ-羧化；自身氧化为环氧化物后必须被还原才能复用。华法林抑制此还原，故抗凝。</desc><text x="210.0" y="28" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="0.55s" fill="freeze" calcMode="spline" keySplines="0.23 1 0.32 1"/>维生素 K：γ-羧化的循环<tspan x="210.0" y="48" text-anchor="middle" font-size="11" fill="#64748b" font-weight="400">没有 K，凝血因子造得出但用不上；华法林在此阻断</tspan></text><circle cx="150" cy="140" r="44" fill="#ffffff" stroke="#0f766e" stroke-width="2.2"/><text x="150" y="136" text-anchor="middle" font-size="11" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">维生素 K</text><text x="150" y="151" text-anchor="middle" font-size="11" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">（还原型 KH₂）</text><circle cx="300" cy="200" r="44" fill="#ffffff" stroke="#c1440e" stroke-width="2.2"/><text x="300" y="196" text-anchor="middle" font-size="11" font-weight="700" fill="#c1440e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">维生素 K</text><text x="300" y="211" text-anchor="middle" font-size="11" font-weight="700" fill="#c1440e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">环氧化物</text><circle cx="150" cy="260" r="44" fill="#ffffff" stroke="#2f8f57" stroke-width="2.2"/><text x="150" y="256" text-anchor="middle" font-size="11" font-weight="700" fill="#2f8f57" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">谷氨酸 → γ-羧基谷氨酸</text><path d="M194,140 Q228,118 258,178" fill="none" stroke="#0f766e" stroke-width="2"/><path d="M296,244 Q250,272 196,262" fill="none" stroke="#c1440e" stroke-width="2"/><path d="M150,216 V184" fill="none" stroke="#2f8f57" stroke-width="2"/><circle r="6" fill="#c0392b"><animateTransform attributeName="transform" type="translate" values="194.0,140.0;199.9,136.2;205.9,132.3;211.8,128.4;217.8,124.6;223.8,120.8;229.5,121.0;234.8,131.5;240.0,142.0;245.2,152.5;250.5,163.0;255.8,173.5;261.8,184.6;268.4,196.2;275.1,207.7;281.8,219.2;288.4,230.8;295.1,242.4;289.1,248.2;281.1,253.1;273.0,258.0;264.9,262.9;256.9,267.8;248.7,271.8;239.2,270.0;229.8,268.2;220.3,266.5;210.8,264.8;201.4,263.0;192.5,258.6;184.5,250.5;176.5,242.5;168.4,234.4;160.4,226.4;152.3,218.3;150.0,212.0;150.0,206.4;150.0,200.8;150.0,195.2;150.0,189.6;150.0,184.0" keyTimes="0;0.025;0.05;0.075;0.1;0.125;0.15;0.175;0.2;0.225;0.25;0.275;0.3;0.325;0.35;0.375;0.4;0.425;0.45;0.475;0.5;0.525;0.55;0.575;0.6;0.625;0.65;0.675;0.7;0.725;0.75;0.775;0.8;0.825;0.85;0.875;0.9;0.925;0.95;0.975;1" dur="9.0s" repeatCount="indefinite" calcMode="linear"/></circle><g opacity="0"><circle cx="248" cy="271" r="11" fill="#ffffff" stroke="#c1440e" stroke-width="2"/><path d="M243,266 L253,276 M253,266 L243,276" stroke="#c1440e" stroke-width="2.2" stroke-linecap="round"/><text x="248" y="296" text-anchor="middle" font-size="11" fill="#c1440e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">华法林</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.45;0.6;1" dur="9.0s" repeatCount="indefinite"/></g><text x="34" y="330" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">γ-羧基谷氨酸（Gla）才能抓住 Ca²⁺、结合磷脂膜</text><text font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><tspan x="210.0" y="358" text-anchor="middle" opacity="0" fill="#0f766e" font-size="11.5" font-weight="700">① KH₂ 供能，谷氨酸 γ-羧化<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.3;0.3006;1" dur="9.0s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="358" text-anchor="middle" opacity="0" fill="#c1440e" font-size="11.5" font-weight="700">② 维生素 K 变环氧化物<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3;0.3006;0.54;0.5406;1" dur="9.0s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="358" text-anchor="middle" opacity="0" fill="#c1440e" font-size="11.5" font-weight="700">③ 环氧化物需还原才复用<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.54;0.5406;0.78;0.7806;1" dur="9.0s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="358" text-anchor="middle" opacity="0" fill="#c0392b" font-size="11.5" font-weight="700">④ 华法林阻断此还原<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.78;0.7806;1" dur="9.0s" repeatCount="indefinite"/></tspan></text><path d="M34,380 H386" stroke="#e2e8f0" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.35"/><path d="M139.6,375 L139.6,385 M224.1,375 L224.1,385 M308.6,375 L308.6,385" stroke="#e2e8f0" stroke-width="1.1" fill="none"/><circle cy="380" r="5.4" fill="#1e293b" stroke="#ffffff" stroke-width="2"><animateTransform attributeName="transform" type="translate" values="34.0,0;39.9,0;45.7,0;51.6,0;57.5,0;63.3,0;69.2,0;75.1,0;80.9,0;86.8,0;92.7,0;98.5,0;104.4,0;110.3,0;116.1,0;122.0,0;127.9,0;133.7,0;139.6,0;145.5,0;151.3,0;157.2,0;163.1,0;168.9,0;174.8,0;180.7,0;186.5,0;192.4,0;198.3,0;204.1,0;210.0,0;215.9,0;221.7,0;227.6,0;233.5,0;239.3,0;245.2,0;251.1,0;256.9,0;262.8,0;268.7,0;274.5,0;280.4,0;286.3,0;292.1,0;298.0,0;303.9,0;309.7,0;315.6,0;321.5,0;327.3,0;333.2,0;339.1,0;344.9,0;350.8,0;356.7,0;362.5,0;368.4,0;374.3,0;380.1,0;386.0,0" keyTimes="0;0.0167;0.0333;0.05;0.0667;0.0833;0.1;0.1167;0.1333;0.15;0.1667;0.1833;0.2;0.2167;0.2333;0.25;0.2667;0.2833;0.3;0.3167;0.3333;0.35;0.3667;0.3833;0.4;0.4167;0.4333;0.45;0.4667;0.4833;0.5;0.5167;0.5333;0.55;0.5667;0.5833;0.6;0.6167;0.6333;0.65;0.6667;0.6833;0.7;0.7167;0.7333;0.75;0.7667;0.7833;0.8;0.8167;0.8333;0.85;0.8667;0.8833;0.9;0.9167;0.9333;0.95;0.9667;0.9833;1" dur="9.0s" repeatCount="indefinite" calcMode="linear"/></circle></svg>