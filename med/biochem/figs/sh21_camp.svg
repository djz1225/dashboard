<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 500" role="img" aria-labelledby="ft fd" style="background:#ffffff"><title id="ft">cAMP 级联的放大</title><desc id="fd">一个激素分子结合受体后激活多个 G 蛋白，每个腺苷酸环化酶生成大量 cAMP，cAMP 激活 PKA 使众多底物磷酸化，逐级放大可达 10⁴~10⁶ 倍。</desc><text x="210.0" y="28" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="0.55s" fill="freeze" calcMode="spline" keySplines="0.23 1 0.32 1"/>cAMP 级联：一层催一层，放大万倍<tspan x="210.0" y="48" text-anchor="middle" font-size="11" fill="#64748b" font-weight="400">激素 → 受体 → Gs → AC → cAMP → PKA → 磷酸化酶</tspan></text><rect x="165.0" y="104" width="90.0" height="26" rx="6" fill="#2c5f9e" opacity="0.22" stroke="#2c5f9e" stroke-width="1.4"/><text x="210" y="122" text-anchor="middle" font-size="11" fill="#2c5f9e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">1 激素分子</text><path d="M210,130 V144" stroke="#e2e8f0" stroke-width="1.6"/><polygon points="210,144 207,138 213,138" fill="#e2e8f0"/><rect x="149.25" y="144" width="121.50000000000001" height="26" rx="6" fill="#0f766e" opacity="0.22" stroke="#0f766e" stroke-width="1.4"/><text x="210" y="162" text-anchor="middle" font-size="11" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">多个 G 蛋白</text><path d="M210,170 V184" stroke="#e2e8f0" stroke-width="1.6"/><polygon points="210,184 207,178 213,178" fill="#e2e8f0"/><rect x="131.25" y="184" width="157.5" height="26" rx="6" fill="#a8791a" opacity="0.22" stroke="#a8791a" stroke-width="1.4"/><text x="210" y="202" text-anchor="middle" font-size="11" fill="#a8791a" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">大量 cAMP</text><path d="M210,210 V224" stroke="#e2e8f0" stroke-width="1.6"/><polygon points="210,224 207,218 213,218" fill="#e2e8f0"/><rect x="110.99999999999999" y="224" width="198.00000000000003" height="26" rx="6" fill="#c0392b" opacity="0.22" stroke="#c0392b" stroke-width="1.4"/><text x="210" y="242" text-anchor="middle" font-size="11" fill="#c0392b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">更多 PKA 活性</text><path d="M210,250 V264" stroke="#e2e8f0" stroke-width="1.6"/><polygon points="210,264 207,258 213,258" fill="#e2e8f0"/><rect x="88.49999999999999" y="264" width="243.00000000000003" height="26" rx="6" fill="#c1440e" opacity="0.22" stroke="#c1440e" stroke-width="1.4"/><text x="210" y="282" text-anchor="middle" font-size="11" fill="#c1440e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">海量葡萄糖释放</text><path d="M330,116 V300" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="4 3"/><polygon points="330,306 327,298 333,298" fill="#c0392b"/><text x="336" y="212" font-size="11" fill="#c0392b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">放大</text><text x="336" y="228" font-size="11" fill="#c0392b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">10⁴~10⁶ 倍</text><rect x="34" y="312" width="352" height="38" rx="6" fill="#dbe7f5" stroke="#2c5f9e" stroke-width="1.3"/><text x="44" y="330" font-size="11" fill="#2c5f9e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">终止：磷酸二酯酶（PDE）把 cAMP 降解为 5′-AMP</text><text x="44" y="346" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">咖啡因/茶碱抑制 PDE → cAMP 蓄积（支气管舒张）</text><text font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><tspan x="210.0" y="366" text-anchor="middle" opacity="0" fill="#2c5f9e" font-size="11.5" font-weight="700">① 激素结合受体<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.24;0.2406;1" dur="10.0s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="366" text-anchor="middle" opacity="0" fill="#0f766e" font-size="11.5" font-weight="700">② Gs 激活腺苷酸环化酶<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.24;0.2406;0.44;0.4406;1" dur="10.0s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="366" text-anchor="middle" opacity="0" fill="#a8791a" font-size="11.5" font-weight="700">③ cAMP 大量生成<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.44;0.4406;0.64;0.6406;1" dur="10.0s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="366" text-anchor="middle" opacity="0" fill="#c0392b" font-size="11.5" font-weight="700">④ PKA 磷酸化底物<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.64;0.6406;0.82;0.8206;1" dur="10.0s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="366" text-anchor="middle" opacity="0" fill="#c1440e" font-size="11.5" font-weight="700">⑤ 效应放大<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.82;0.8206;1" dur="10.0s" repeatCount="indefinite"/></tspan></text><path d="M34,384 H386" stroke="#e2e8f0" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.35"/><path d="M118.5,379 L118.5,389 M188.9,379 L188.9,389 M259.3,379 L259.3,389 M322.6,379 L322.6,389" stroke="#e2e8f0" stroke-width="1.1" fill="none"/><circle cy="384" r="5.4" fill="#1e293b" stroke="#ffffff" stroke-width="2"><animateTransform attributeName="transform" type="translate" values="34.0,0;39.9,0;45.7,0;51.6,0;57.5,0;63.3,0;69.2,0;75.1,0;80.9,0;86.8,0;92.7,0;98.5,0;104.4,0;110.3,0;116.1,0;122.0,0;127.9,0;133.7,0;139.6,0;145.5,0;151.3,0;157.2,0;163.1,0;168.9,0;174.8,0;180.7,0;186.5,0;192.4,0;198.3,0;204.1,0;210.0,0;215.9,0;221.7,0;227.6,0;233.5,0;239.3,0;245.2,0;251.1,0;256.9,0;262.8,0;268.7,0;274.5,0;280.4,0;286.3,0;292.1,0;298.0,0;303.9,0;309.7,0;315.6,0;321.5,0;327.3,0;333.2,0;339.1,0;344.9,0;350.8,0;356.7,0;362.5,0;368.4,0;374.3,0;380.1,0;386.0,0" keyTimes="0;0.0167;0.0333;0.05;0.0667;0.0833;0.1;0.1167;0.1333;0.15;0.1667;0.1833;0.2;0.2167;0.2333;0.25;0.2667;0.2833;0.3;0.3167;0.3333;0.35;0.3667;0.3833;0.4;0.4167;0.4333;0.45;0.4667;0.4833;0.5;0.5167;0.5333;0.55;0.5667;0.5833;0.6;0.6167;0.6333;0.65;0.6667;0.6833;0.7;0.7167;0.7333;0.75;0.7667;0.7833;0.8;0.8167;0.8333;0.85;0.8667;0.8833;0.9;0.9167;0.9333;0.95;0.9667;0.9833;1" dur="10.0s" repeatCount="indefinite" calcMode="linear"/></circle></svg>