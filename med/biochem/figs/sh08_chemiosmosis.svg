<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 500" role="img" aria-labelledby="ft fd" style="background:#ffffff"><title id="ft">化学渗透与氧化磷酸化</title><desc id="fd">电子传递把质子泵到膜间隙形成电化学梯度，内膜不通透使梯度得以维持；质子只能经 ATP 合酶 F₀ 回流，驱动 F₁ 旋转催化 ADP 与 Pi 生成 ATP。</desc><text x="210.0" y="28" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="0.55s" fill="freeze" calcMode="spline" keySplines="0.23 1 0.32 1"/>化学渗透：质子梯度怎么变 ATP<tspan x="210.0" y="48" text-anchor="middle" font-size="11" fill="#64748b" font-weight="400">内膜不通 H⁺，只能经 ATP 合酶回流</tspan></text><rect x="30" y="150" width="360" height="34" rx="4" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.2"/><text x="380" y="146" text-anchor="end" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">内膜对 H⁺ 不通透</text><text x="34" y="140" font-size="11" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">膜间隙（H⁺ 高）</text><text x="34" y="204" font-size="11" fill="#2c5f9e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">基质（H⁺ 低）</text><rect x="70" y="150" width="34" height="34" rx="5" fill="#ffffff" stroke="#0f766e" stroke-width="1.8"/><text x="87" y="172" text-anchor="middle" font-size="12" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">Ⅰ</text><rect x="170" y="150" width="34" height="34" rx="5" fill="#ffffff" stroke="#a8791a" stroke-width="1.8"/><text x="187" y="172" text-anchor="middle" font-size="12" font-weight="700" fill="#a8791a" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">Ⅲ</text><rect x="270" y="150" width="34" height="34" rx="5" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/><text x="287" y="172" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">Ⅳ</text><circle r="5" fill="#0f766e" opacity="0.9"><animateTransform attributeName="transform" type="translate" values="87,200;87,200;87,118;87,118" keyTimes="0;0.10;0.44;1" dur="10.0s" repeatCount="indefinite" calcMode="spline" keySplines="0.23 1 0.32 1;0.45 0 0.55 1;0.23 1 0.32 1"/></circle><circle r="5" fill="#a8791a" opacity="0.9"><animateTransform attributeName="transform" type="translate" values="187,200;187,200;187,118;187,118" keyTimes="0;0.10;0.44;1" dur="10.0s" repeatCount="indefinite" calcMode="spline" keySplines="0.23 1 0.32 1;0.45 0 0.55 1;0.23 1 0.32 1"/></circle><circle r="5" fill="#c0392b" opacity="0.9"><animateTransform attributeName="transform" type="translate" values="287,200;287,200;287,118;287,118" keyTimes="0;0.10;0.44;1" dur="10.0s" repeatCount="indefinite" calcMode="spline" keySplines="0.23 1 0.32 1;0.45 0 0.55 1;0.23 1 0.32 1"/></circle><rect x="336" y="150" width="26" height="34" rx="4" fill="#dcfce7" stroke="#2f8f57" stroke-width="1.8"/><text x="349" y="172" text-anchor="middle" font-size="11" fill="#2f8f57" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">F₀F₁</text><circle r="5" fill="#2f8f57"><animateTransform attributeName="transform" type="translate" values="349,116;349,116;349,216;349,216" keyTimes="0;0.52;0.80;1" dur="10.0s" repeatCount="indefinite" calcMode="spline" keySplines="0.23 1 0.32 1;0.45 0 0.55 1;0.23 1 0.32 1"/></circle><text x="349" y="240" text-anchor="middle" font-size="11" fill="#2f8f57" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700" opacity="0">ATP<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.72;0.84;1" dur="10.0s" repeatCount="indefinite"/></text><text x="34" y="252" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">每 4 个 H⁺ 回流 → 合成 1 个 ATP（另需 1 个 H⁺ 转运 Pi）</text><g opacity="0"><circle cx="120" cy="164" r="7" fill="#c1440e" opacity="0.85"/><path d="M120,152 V176" stroke="#c1440e" stroke-width="1.6" stroke-dasharray="2 2"/><text x="120" y="196" text-anchor="middle" font-size="11" fill="#c1440e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">DNP 漏 H⁺</text><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.80;0.86;0.94;1" dur="10.0s" repeatCount="indefinite"/></g><text font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><tspan x="210.0" y="288" text-anchor="middle" opacity="0" fill="#0f766e" font-size="12" font-weight="700">① 电子传递泵出 H⁺<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.3;0.3006;1" dur="10.0s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="288" text-anchor="middle" opacity="0" fill="#a8791a" font-size="12" font-weight="700">② 内膜维持梯度<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3;0.3006;0.54;0.5406;1" dur="10.0s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="288" text-anchor="middle" opacity="0" fill="#2f8f57" font-size="12" font-weight="700">③ H⁺ 经 F₀ 回流<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.54;0.5406;0.8;0.8006;1" dur="10.0s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="288" text-anchor="middle" opacity="0" fill="#2f8f57" font-size="12" font-weight="700">④ F₁ 旋转催化 ATP<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.8;0.8006;1" dur="10.0s" repeatCount="indefinite"/></tspan></text><path d="M34,306 H386" stroke="#e2e8f0" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.35"/><path d="M139.6,301 L139.6,311 M224.1,301 L224.1,311 M315.6,301 L315.6,311" stroke="#e2e8f0" stroke-width="1.1" fill="none"/><circle cy="306" r="5.4" fill="#1e293b" stroke="#ffffff" stroke-width="2"><animateTransform attributeName="transform" type="translate" values="34.0,0;39.9,0;45.7,0;51.6,0;57.5,0;63.3,0;69.2,0;75.1,0;80.9,0;86.8,0;92.7,0;98.5,0;104.4,0;110.3,0;116.1,0;122.0,0;127.9,0;133.7,0;139.6,0;145.5,0;151.3,0;157.2,0;163.1,0;168.9,0;174.8,0;180.7,0;186.5,0;192.4,0;198.3,0;204.1,0;210.0,0;215.9,0;221.7,0;227.6,0;233.5,0;239.3,0;245.2,0;251.1,0;256.9,0;262.8,0;268.7,0;274.5,0;280.4,0;286.3,0;292.1,0;298.0,0;303.9,0;309.7,0;315.6,0;321.5,0;327.3,0;333.2,0;339.1,0;344.9,0;350.8,0;356.7,0;362.5,0;368.4,0;374.3,0;380.1,0;386.0,0" keyTimes="0;0.0167;0.0333;0.05;0.0667;0.0833;0.1;0.1167;0.1333;0.15;0.1667;0.1833;0.2;0.2167;0.2333;0.25;0.2667;0.2833;0.3;0.3167;0.3333;0.35;0.3667;0.3833;0.4;0.4167;0.4333;0.45;0.4667;0.4833;0.5;0.5167;0.5333;0.55;0.5667;0.5833;0.6;0.6167;0.6333;0.65;0.6667;0.6833;0.7;0.7167;0.7333;0.75;0.7667;0.7833;0.8;0.8167;0.8333;0.85;0.8667;0.8833;0.9;0.9167;0.9333;0.95;0.9667;0.9833;1" dur="10.0s" repeatCount="indefinite" calcMode="linear"/></circle><text x="210" y="334" text-anchor="middle" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">解偶联剂（DNP）带走 H⁺：电子照传、ATP 不产、产热</text></svg>