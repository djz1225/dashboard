<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 500" role="img" aria-labelledby="ft fd" style="background:#ffffff"><title id="ft">脂肪酸 β-氧化</title><desc id="fd">长链脂肪酸先在胞质活化并经肉碱穿梭进入线粒体，每轮 β-氧化脱氢、加水、再脱氢、硫解，砍下一个乙酰CoA。软脂酸经 7 轮净生成 106 个 ATP。</desc><text x="210.0" y="28" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="0.55s" fill="freeze" calcMode="spline" keySplines="0.23 1 0.32 1"/>β-氧化：每轮砍下两个碳<tspan x="210.0" y="48" text-anchor="middle" font-size="11" fill="#64748b" font-weight="400">脱氢-加水-再脱氢-硫解；软脂酸 7 轮净 106 ATP</tspan></text><path d="M46,108 H326" stroke="#e2e8f0" stroke-width="2"/><path d="M51,108 a9,9 0 1,0 18,0 a9,9 0 1,0 -18,0 M87,108 a9,9 0 1,0 18,0 a9,9 0 1,0 -18,0 M123,108 a9,9 0 1,0 18,0 a9,9 0 1,0 -18,0 M159,108 a9,9 0 1,0 18,0 a9,9 0 1,0 -18,0 M195,108 a9,9 0 1,0 18,0 a9,9 0 1,0 -18,0 M231,108 a9,9 0 1,0 18,0 a9,9 0 1,0 -18,0 M267,108 a9,9 0 1,0 18,0 a9,9 0 1,0 -18,0 M303,108 a9,9 0 1,0 18,0 a9,9 0 1,0 -18,0" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/><text x="210" y="86" text-anchor="middle" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">C16 软脂酸（8 个二碳单元）</text><g opacity="0"><circle cx="60" cy="108" r="9" fill="#c0392b" stroke="#c0392b" stroke-width="1.4"/><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.3333;0.3339;1" dur="11.0s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0,0;0,0;0,26;0,26" keyTimes="0;0;0.08;1" dur="11.0s" repeatCount="indefinite"/></g><g opacity="0"><circle cx="168" cy="108" r="9" fill="#c0392b" stroke="#c0392b" stroke-width="1.4"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3333;0.3339;0.6667;0.6673;1" dur="11.0s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0,0;0,0;0,26;0,26" keyTimes="0;0.3333;0.4133;1" dur="11.0s" repeatCount="indefinite"/></g><g opacity="0"><circle cx="276" cy="108" r="9" fill="#c0392b" stroke="#c0392b" stroke-width="1.4"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.6667;0.6673;1" dur="11.0s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0,0;0,0;0,26;0,26" keyTimes="0;0.6667;0.7467;1" dur="11.0s" repeatCount="indefinite"/></g><rect x="34" y="150" width="352" height="24" rx="5" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/><text x="210" y="166" text-anchor="middle" font-size="11" fill="#c0392b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">① 脱氢（FAD→FADH₂）</text><rect x="34" y="180" width="352" height="24" rx="5" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/><text x="210" y="196" text-anchor="middle" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">② 加水</text><rect x="34" y="210" width="352" height="24" rx="5" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/><text x="210" y="226" text-anchor="middle" font-size="11" fill="#c0392b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">③ 再脱氢（NAD⁺→NADH）</text><rect x="34" y="240" width="352" height="24" rx="5" fill="#ffffff" stroke="#2f8f57" stroke-width="1.2"/><text x="210" y="256" text-anchor="middle" font-size="11" fill="#2f8f57" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">④ 硫解（CoA）</text><text x="34" y="286" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">累计（软脂酸 16C）</text><rect x="34" y="294" width="352" height="22" rx="5" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.1"/><text x="44" y="309" font-size="11" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">乙酰CoA 8 个</text><text x="376" y="309" text-anchor="end" font-size="11" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">80 ATP</text><rect x="34" y="320" width="352" height="22" rx="5" fill="#fef3c7" stroke="#a8791a" stroke-width="1.1"/><text x="44" y="335" font-size="11" fill="#a8791a" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">FADH₂ 7 个</text><text x="376" y="335" text-anchor="end" font-size="11" fill="#a8791a" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">10.5 ATP</text><rect x="34" y="346" width="352" height="22" rx="5" fill="#fbe3e0" stroke="#c0392b" stroke-width="1.1"/><text x="44" y="361" font-size="11" fill="#c0392b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">NADH 7 个</text><text x="376" y="361" text-anchor="end" font-size="11" fill="#c0392b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">17.5 ATP</text><text font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><tspan x="210.0" y="372" text-anchor="middle" opacity="0" fill="#c0392b" font-size="11.5" font-weight="700">① 活化：耗 2 个高能键<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.28;0.2806;1" dur="11.0s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="372" text-anchor="middle" opacity="0" fill="#a8791a" font-size="11.5" font-weight="700">② 肉碱穿梭进线粒体<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.28;0.2806;0.52;0.5206;1" dur="11.0s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="372" text-anchor="middle" opacity="0" fill="#0f766e" font-size="11.5" font-weight="700">③ 7 轮 β-氧化<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.52;0.5206;0.76;0.7606;1" dur="11.0s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="372" text-anchor="middle" opacity="0" fill="#2f8f57" font-size="11.5" font-weight="700">④ 净 106 ATP<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.76;0.7606;1" dur="11.0s" repeatCount="indefinite"/></tspan></text><path d="M34,392 H386" stroke="#e2e8f0" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.35"/><path d="M132.6,387 L132.6,397 M217.0,387 L217.0,397 M301.5,387 L301.5,397" stroke="#e2e8f0" stroke-width="1.1" fill="none"/><circle cy="392" r="5.4" fill="#1e293b" stroke="#ffffff" stroke-width="2"><animateTransform attributeName="transform" type="translate" values="34.0,0;39.9,0;45.7,0;51.6,0;57.5,0;63.3,0;69.2,0;75.1,0;80.9,0;86.8,0;92.7,0;98.5,0;104.4,0;110.3,0;116.1,0;122.0,0;127.9,0;133.7,0;139.6,0;145.5,0;151.3,0;157.2,0;163.1,0;168.9,0;174.8,0;180.7,0;186.5,0;192.4,0;198.3,0;204.1,0;210.0,0;215.9,0;221.7,0;227.6,0;233.5,0;239.3,0;245.2,0;251.1,0;256.9,0;262.8,0;268.7,0;274.5,0;280.4,0;286.3,0;292.1,0;298.0,0;303.9,0;309.7,0;315.6,0;321.5,0;327.3,0;333.2,0;339.1,0;344.9,0;350.8,0;356.7,0;362.5,0;368.4,0;374.3,0;380.1,0;386.0,0" keyTimes="0;0.0167;0.0333;0.05;0.0667;0.0833;0.1;0.1167;0.1333;0.15;0.1667;0.1833;0.2;0.2167;0.2333;0.25;0.2667;0.2833;0.3;0.3167;0.3333;0.35;0.3667;0.3833;0.4;0.4167;0.4333;0.45;0.4667;0.4833;0.5;0.5167;0.5333;0.55;0.5667;0.5833;0.6;0.6167;0.6333;0.65;0.6667;0.6833;0.7;0.7167;0.7333;0.75;0.7667;0.7833;0.8;0.8167;0.8333;0.85;0.8667;0.8833;0.9;0.9167;0.9333;0.95;0.9667;0.9833;1" dur="11.0s" repeatCount="indefinite" calcMode="linear"/></circle></svg>