<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 500" role="img" aria-labelledby="ft fd" style="background:#ffffff"><title id="ft">进食—空腹—饥饿的代谢切换</title><desc id="fd">进食后以葡萄糖为主并储存；空腹早期依赖肝糖原，12 小时后转向糖异生；长期饥饿时脂肪动员与酮体生成成为主要供能方式。方向由胰岛素与胰高血糖素比值决定。</desc><text x="210.0" y="28" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="0.55s" fill="freeze" calcMode="spline" keySplines="0.23 1 0.32 1"/>进食—空腹—饥饿：燃料怎么换<tspan x="210.0" y="48" text-anchor="middle" font-size="11" fill="#64748b" font-weight="400">方向由胰岛素/胰高血糖素比值决定</tspan></text><rect x="34" y="120" width="62" height="140" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.1"/><rect x="37" y="146" width="56" height="114" rx="5" fill="#0f766e" opacity="0.78"/><text x="65.0" y="201.0" text-anchor="middle" font-size="11" fill="#ffffff" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">葡萄糖</text><text x="65.0" y="280" text-anchor="middle" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">进食后 0~4 h</text><rect x="104" y="120" width="62" height="140" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.1"/><rect x="107" y="176" width="56" height="84" rx="5" fill="#a8791a" opacity="0.78"/><text x="135.0" y="216.0" text-anchor="middle" font-size="11" fill="#ffffff" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">肝糖原</text><text x="135.0" y="280" text-anchor="middle" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">空腹 4~12 h</text><rect x="174" y="120" width="62" height="140" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.1"/><rect x="177" y="194" width="56" height="66" rx="5" fill="#c0392b" opacity="0.78"/><text x="205.0" y="225.0" text-anchor="middle" font-size="11" fill="#ffffff" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">糖异生</text><text x="205.0" y="280" text-anchor="middle" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">空腹 12~24 h</text><rect x="244" y="120" width="62" height="140" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.1"/><rect x="247" y="206" width="56" height="54" rx="5" fill="#2f8f57" opacity="0.78"/><text x="275.0" y="231.0" text-anchor="middle" font-size="11" fill="#ffffff" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">脂肪/酮体</text><text x="275.0" y="280" text-anchor="middle" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">饥饿 1~3 d</text><rect x="314" y="120" width="62" height="140" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.1"/><rect x="317" y="164" width="56" height="96" rx="5" fill="#c1440e" opacity="0.78"/><text x="345.0" y="210.0" text-anchor="middle" font-size="11" fill="#ffffff" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">酮体为主</text><text x="345.0" y="280" text-anchor="middle" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">饥饿 3 d 以上</text><rect x="32" y="118" width="66" height="144" rx="7" fill="none" stroke="#c0392b" stroke-width="2.8" opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.3333;0.3339;1" dur="11.0s" repeatCount="indefinite"/></rect><rect x="172" y="118" width="66" height="144" rx="7" fill="none" stroke="#c0392b" stroke-width="2.8" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3333;0.3339;0.6667;0.6673;1" dur="11.0s" repeatCount="indefinite"/></rect><rect x="312" y="118" width="66" height="144" rx="7" fill="none" stroke="#c0392b" stroke-width="2.8" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.6667;0.6673;1" dur="11.0s" repeatCount="indefinite"/></rect><text x="34" y="316" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">胰岛素 / 胰高血糖素比值</text><rect x="34" y="324" width="352" height="13" rx="6.5" fill="#eef2f7"/><g transform="translate(34,330.5)"><rect x="0" y="-6.5" width="352" height="13" rx="6.5" fill="#0f766e" opacity="0.8"><animateTransform attributeName="transform" type="scale" additive="sum" values="0.95 1;0.62 1;0.38 1;0.18 1;0.10 1" keyTimes="0;0.2;0.4;0.6;1" dur="11.0s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1"/></rect></g><text x="386" y="316" text-anchor="end" font-size="11" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">逐渐下降</text><text font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><tspan x="210.0" y="366" text-anchor="middle" opacity="0" fill="#0f766e" font-size="11.5" font-weight="700">① 进食：储存<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.2;0.2006;1" dur="11.0s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="366" text-anchor="middle" opacity="0" fill="#a8791a" font-size="11.5" font-weight="700">② 空腹早期：肝糖原<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2;0.2006;0.4;0.4006;1" dur="11.0s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="366" text-anchor="middle" opacity="0" fill="#c0392b" font-size="11.5" font-weight="700">③ 空腹后期：糖异生<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4;0.4006;0.6;0.6006;1" dur="11.0s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="366" text-anchor="middle" opacity="0" fill="#c1440e" font-size="11.5" font-weight="700">④ 饥饿：酮体<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.6;0.6006;1" dur="11.0s" repeatCount="indefinite"/></tspan></text><path d="M34,384 H386" stroke="#e2e8f0" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.35"/><path d="M104.4,379 L104.4,389 M174.8,379 L174.8,389 M245.2,379 L245.2,389" stroke="#e2e8f0" stroke-width="1.1" fill="none"/><circle cy="384" r="5.4" fill="#1e293b" stroke="#ffffff" stroke-width="2"><animateTransform attributeName="transform" type="translate" values="34.0,0;39.9,0;45.7,0;51.6,0;57.5,0;63.3,0;69.2,0;75.1,0;80.9,0;86.8,0;92.7,0;98.5,0;104.4,0;110.3,0;116.1,0;122.0,0;127.9,0;133.7,0;139.6,0;145.5,0;151.3,0;157.2,0;163.1,0;168.9,0;174.8,0;180.7,0;186.5,0;192.4,0;198.3,0;204.1,0;210.0,0;215.9,0;221.7,0;227.6,0;233.5,0;239.3,0;245.2,0;251.1,0;256.9,0;262.8,0;268.7,0;274.5,0;280.4,0;286.3,0;292.1,0;298.0,0;303.9,0;309.7,0;315.6,0;321.5,0;327.3,0;333.2,0;339.1,0;344.9,0;350.8,0;356.7,0;362.5,0;368.4,0;374.3,0;380.1,0;386.0,0" keyTimes="0;0.0167;0.0333;0.05;0.0667;0.0833;0.1;0.1167;0.1333;0.15;0.1667;0.1833;0.2;0.2167;0.2333;0.25;0.2667;0.2833;0.3;0.3167;0.3333;0.35;0.3667;0.3833;0.4;0.4167;0.4333;0.45;0.4667;0.4833;0.5;0.5167;0.5333;0.55;0.5667;0.5833;0.6;0.6167;0.6333;0.65;0.6667;0.6833;0.7;0.7167;0.7333;0.75;0.7667;0.7833;0.8;0.8167;0.8333;0.85;0.8667;0.8833;0.9;0.9167;0.9333;0.95;0.9667;0.9833;1" dur="11.0s" repeatCount="indefinite" calcMode="linear"/></circle></svg>