<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 500" role="img" aria-labelledby="ft fd" style="background:#ffffff"><title id="ft">核糖体三位点循环</title><desc id="fd">氨酰-tRNA 进入 A 位，肽酰转移酶（由 rRNA 催化）把肽链转到新氨基酸上，随后核糖体沿 mRNA 移位一格，空载 tRNA 从 E 位退出。</desc><text x="210.0" y="28" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="0.55s" fill="freeze" calcMode="spline" keySplines="0.23 1 0.32 1"/>核糖体三位点：A 进、P 成肽、E 出<tspan x="210.0" y="48" text-anchor="middle" font-size="11" fill="#64748b" font-weight="400">每延长一个氨基酸耗 4 个高能键</tspan></text><path d="M34,210 H386" stroke="#64748b" stroke-width="3"/><text x="34" y="228" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">mRNA 5′ → 3′（核糖体向右移动：E→P←A）</text><rect x="120" y="130" width="180" height="40" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.8"/><text x="210" y="154" text-anchor="middle" font-size="11.5" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">大亚基（50S/60S）</text><rect x="120" y="206" width="180" height="26" rx="8" fill="#dbe7f5" stroke="#2c5f9e" stroke-width="1.8"/><text x="210" y="224" text-anchor="middle" font-size="11" fill="#2c5f9e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">小亚基（30S/40S）</text><circle cx="150" cy="196" r="13" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="150" y="201" text-anchor="middle" font-size="11.5" font-weight="700" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">E</text><circle cx="210" cy="196" r="13" fill="#ffffff" stroke="#2f8f57" stroke-width="2"/><text x="210" y="201" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">P</text><circle cx="270" cy="196" r="13" fill="#ffffff" stroke="#c0392b" stroke-width="2"/><text x="270" y="201" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c0392b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">A</text><g><path d="M270,186 L270,158" stroke="#c0392b" stroke-width="2.4"/><animateTransform attributeName="transform" type="translate" values="0,0;0,0;-120,0;-120,0" keyTimes="0;0.42;0.86;1" dur="10.0s" repeatCount="indefinite" calcMode="spline" keySplines="0.23 1 0.32 1;0.45 0 0.55 1;0.45 0 0.55 1"/></g><text x="330" y="104" text-anchor="end" font-size="11" fill="#c0392b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">氨酰-tRNA 进 A 位</text><path d="M210,168 q14,-22 28,-6 q14,16 26,-4" fill="none" stroke="#2f8f57" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="90" stroke-dashoffset="90"><animate attributeName="stroke-dashoffset" values="90;0" keyTimes="0;1" dur="10.0s" repeatCount="indefinite"/></path><text x="66" y="112" text-anchor="start" font-size="11" fill="#2f8f57" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">新生肽链 N→C</text><rect x="34" y="250" width="352" height="24" rx="5" fill="#ffffff" stroke="#0f766e" stroke-width="1.1"/><text x="44" y="266" font-size="11" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">氨基酸活化</text><text x="376" y="266" text-anchor="end" font-size="11" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">2 个高能键</text><rect x="34" y="278" width="352" height="24" rx="5" fill="#ffffff" stroke="#c0392b" stroke-width="1.1"/><text x="44" y="294" font-size="11" fill="#c0392b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">进位（A 位）</text><text x="376" y="294" text-anchor="end" font-size="11" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">1 GTP</text><rect x="34" y="306" width="352" height="24" rx="5" fill="#ffffff" stroke="#a8791a" stroke-width="1.1"/><text x="44" y="322" font-size="11" fill="#a8791a" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">移位</text><text x="376" y="322" text-anchor="end" font-size="11" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">1 GTP</text><text x="210" y="348" text-anchor="middle" font-size="11" fill="#c1440e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">合计：每延长 1 个氨基酸耗 4 个高能键</text><text font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><tspan x="210.0" y="372" text-anchor="middle" opacity="0" fill="#c0392b" font-size="11.5" font-weight="700">① 进位（A 位）<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.26;0.2606;1" dur="10.0s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="372" text-anchor="middle" opacity="0" fill="#2f8f57" font-size="11.5" font-weight="700">② 成肽（P 位）<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.26;0.2606;0.5;0.5006;1" dur="10.0s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="372" text-anchor="middle" opacity="0" fill="#a8791a" font-size="11.5" font-weight="700">③ 移位（耗 GTP）<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.5006;0.74;0.7406;1" dur="10.0s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="372" text-anchor="middle" opacity="0" fill="#64748b" font-size="11.5" font-weight="700">④ 空 tRNA 从 E 位退出<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.74;0.7406;1" dur="10.0s" repeatCount="indefinite"/></tspan></text><path d="M34,390 H386" stroke="#e2e8f0" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.35"/><path d="M125.5,385 L125.5,395 M210.0,385 L210.0,395 M294.5,385 L294.5,395" stroke="#e2e8f0" stroke-width="1.1" fill="none"/><circle cy="390" r="5.4" fill="#1e293b" stroke="#ffffff" stroke-width="2"><animateTransform attributeName="transform" type="translate" values="34.0,0;39.9,0;45.7,0;51.6,0;57.5,0;63.3,0;69.2,0;75.1,0;80.9,0;86.8,0;92.7,0;98.5,0;104.4,0;110.3,0;116.1,0;122.0,0;127.9,0;133.7,0;139.6,0;145.5,0;151.3,0;157.2,0;163.1,0;168.9,0;174.8,0;180.7,0;186.5,0;192.4,0;198.3,0;204.1,0;210.0,0;215.9,0;221.7,0;227.6,0;233.5,0;239.3,0;245.2,0;251.1,0;256.9,0;262.8,0;268.7,0;274.5,0;280.4,0;286.3,0;292.1,0;298.0,0;303.9,0;309.7,0;315.6,0;321.5,0;327.3,0;333.2,0;339.1,0;344.9,0;350.8,0;356.7,0;362.5,0;368.4,0;374.3,0;380.1,0;386.0,0" keyTimes="0;0.0167;0.0333;0.05;0.0667;0.0833;0.1;0.1167;0.1333;0.15;0.1667;0.1833;0.2;0.2167;0.2333;0.25;0.2667;0.2833;0.3;0.3167;0.3333;0.35;0.3667;0.3833;0.4;0.4167;0.4333;0.45;0.4667;0.4833;0.5;0.5167;0.5333;0.55;0.5667;0.5833;0.6;0.6167;0.6333;0.65;0.6667;0.6833;0.7;0.7167;0.7333;0.75;0.7667;0.7833;0.8;0.8167;0.8333;0.85;0.8667;0.8833;0.9;0.9167;0.9333;0.95;0.9667;0.9833;1" dur="10.0s" repeatCount="indefinite" calcMode="linear"/></circle></svg>