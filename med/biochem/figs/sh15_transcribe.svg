<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 500" role="img" aria-labelledby="ft fd" style="background:#ffffff"><title id="ft">转录的起始与延伸</title><desc id="fd">RNA 聚合酶由 σ 因子识别启动子（-35 与 -10 区）后起始转录，局部解链形成开放复合物，按 5′→3′ 延伸新链；转录不需引物，只转录一条链。</desc><text x="210.0" y="28" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="0.55s" fill="freeze" calcMode="spline" keySplines="0.23 1 0.32 1"/>转录：只抄一条链，不需引物<tspan x="210.0" y="48" text-anchor="middle" font-size="11" fill="#64748b" font-weight="400">-35 TTGACA / -10 TATAAT；σ 因子负责识别</tspan></text><path d="M34,132 H386" stroke="#0f766e" stroke-width="3"/><path d="M34,176 H386" stroke="#2c5f9e" stroke-width="3"/><text x="386" y="124" text-anchor="end" font-size="11" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">模板链（被读）</text><text x="386" y="192" text-anchor="end" font-size="11" fill="#2c5f9e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">编码链（序列相同于 RNA）</text><rect x="70" y="124" width="34" height="60" rx="4" fill="#fef3c7" stroke="#a8791a" stroke-width="1.2"/><text x="87" y="116" text-anchor="middle" font-size="11" fill="#a8791a" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">-35</text><rect x="112" y="124" width="26" height="60" rx="4" fill="#fef3c7" stroke="#a8791a" stroke-width="1.2"/><text x="125" y="116" text-anchor="middle" font-size="11" fill="#a8791a" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">-10</text><g><rect x="-18" y="110" width="36" height="58" rx="8" fill="#2f8f57" opacity="0.3" stroke="#2f8f57" stroke-width="1.6"/><text x="0" y="162" text-anchor="middle" font-size="11" fill="#2f8f57" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">RNApol</text><animateTransform attributeName="transform" type="translate" values="140,0;360,0" keyTimes="0;1" dur="10.0s" repeatCount="indefinite" calcMode="linear"/></g><g><path d="M140,180 q0,26 8,40" fill="none" stroke="#2f8f57" stroke-width="2.6" stroke-linecap="round" opacity="0.9"/><animateTransform attributeName="transform" type="translate" values="0,0;220,0" keyTimes="0;1" dur="10.0s" repeatCount="indefinite" calcMode="linear"/></g><text x="34" y="230" font-size="11" fill="#2f8f57" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">新生 RNA 按 5′→3′ 延伸，与模板反向平行</text><rect x="34" y="248" width="352" height="26" rx="5" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.1"/><text x="44" y="265" font-size="11" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">引物</text><text x="92" y="265" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">复制需要 RNA 引物</text><text x="376" y="265" text-anchor="end" font-size="11" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">转录不需引物（可从头起始）</text><rect x="34" y="278" width="352" height="26" rx="5" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.1"/><text x="44" y="295" font-size="11" fill="#2c5f9e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">模板</text><text x="92" y="295" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">两条链都复制</text><text x="376" y="295" text-anchor="end" font-size="11" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">只转录一条（模板链）</text><rect x="34" y="308" width="352" height="26" rx="5" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.1"/><text x="44" y="325" font-size="11" fill="#c1440e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">保真</text><text x="92" y="325" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">极高（10⁻⁹）</text><text x="376" y="325" text-anchor="end" font-size="11" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">较低（约 10⁻⁵，无校正）</text><text font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><tspan x="210.0" y="348" text-anchor="middle" opacity="0" fill="#a8791a" font-size="11.5" font-weight="700">① σ 因子识别启动子<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.3;0.3006;1" dur="10.0s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="348" text-anchor="middle" opacity="0" fill="#0f766e" font-size="11.5" font-weight="700">② 局部解链成开放复合物<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3;0.3006;0.54;0.5406;1" dur="10.0s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="348" text-anchor="middle" opacity="0" fill="#2f8f57" font-size="11.5" font-weight="700">③ RNA 聚合酶延伸<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.54;0.5406;0.78;0.7806;1" dur="10.0s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="348" text-anchor="middle" opacity="0" fill="#c0392b" font-size="11.5" font-weight="700">④ 终止并释放 RNA<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.78;0.7806;1" dur="10.0s" repeatCount="indefinite"/></tspan></text><path d="M34,366 H386" stroke="#e2e8f0" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.35"/><path d="M139.6,361 L139.6,371 M224.1,361 L224.1,371 M308.6,361 L308.6,371" stroke="#e2e8f0" stroke-width="1.1" fill="none"/><circle cy="366" r="5.4" fill="#1e293b" stroke="#ffffff" stroke-width="2"><animateTransform attributeName="transform" type="translate" values="34.0,0;39.9,0;45.7,0;51.6,0;57.5,0;63.3,0;69.2,0;75.1,0;80.9,0;86.8,0;92.7,0;98.5,0;104.4,0;110.3,0;116.1,0;122.0,0;127.9,0;133.7,0;139.6,0;145.5,0;151.3,0;157.2,0;163.1,0;168.9,0;174.8,0;180.7,0;186.5,0;192.4,0;198.3,0;204.1,0;210.0,0;215.9,0;221.7,0;227.6,0;233.5,0;239.3,0;245.2,0;251.1,0;256.9,0;262.8,0;268.7,0;274.5,0;280.4,0;286.3,0;292.1,0;298.0,0;303.9,0;309.7,0;315.6,0;321.5,0;327.3,0;333.2,0;339.1,0;344.9,0;350.8,0;356.7,0;362.5,0;368.4,0;374.3,0;380.1,0;386.0,0" keyTimes="0;0.0167;0.0333;0.05;0.0667;0.0833;0.1;0.1167;0.1333;0.15;0.1667;0.1833;0.2;0.2167;0.2333;0.25;0.2667;0.2833;0.3;0.3167;0.3333;0.35;0.3667;0.3833;0.4;0.4167;0.4333;0.45;0.4667;0.4833;0.5;0.5167;0.5333;0.55;0.5667;0.5833;0.6;0.6167;0.6333;0.65;0.6667;0.6833;0.7;0.7167;0.7333;0.75;0.7667;0.7833;0.8;0.8167;0.8333;0.85;0.8667;0.8833;0.9;0.9167;0.9333;0.95;0.9667;0.9833;1" dur="10.0s" repeatCount="indefinite" calcMode="linear"/></circle></svg>