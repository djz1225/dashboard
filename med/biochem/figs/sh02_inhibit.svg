<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 500" role="img" aria-labelledby="ft fd" style="background:#ffffff"><title id="ft">三种可逆抑制的区别</title><desc id="fd">竞争性抑制剂占据活性中心，底物增多可将其挤走；非竞争性抑制剂结合在活性中心外，减少有效酶量；反竞争性抑制剂只结合酶-底物复合物。</desc><text x="210.0" y="28" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="0.55s" fill="freeze" calcMode="spline" keySplines="0.23 1 0.32 1"/>三种可逆抑制：看门口被谁占<tspan x="210.0" y="48" text-anchor="middle" font-size="11" fill="#64748b" font-weight="400">判断只看两件事——Vmax 变不变、Km 变不变</tspan></text><circle cx="74" cy="160" r="30" fill="#dbe7f5" stroke="#2c5f9e" stroke-width="2" opacity="0.9"/><path d="M63,142 q11,14 22,0" fill="#ffffff" stroke="#2c5f9e" stroke-width="1.6"/><text x="74" y="222" text-anchor="middle" font-size="11.5" fill="#2c5f9e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">竞争性</text><circle cx="210" cy="160" r="30" fill="#fde8dd" stroke="#c1440e" stroke-width="2" opacity="0.9"/><path d="M199,142 q11,14 22,0" fill="#ffffff" stroke="#c1440e" stroke-width="1.6"/><text x="210" y="222" text-anchor="middle" font-size="11.5" fill="#c1440e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">非竞争性</text><circle cx="346" cy="160" r="30" fill="#dcfce7" stroke="#2f8f57" stroke-width="2" opacity="0.9"/><path d="M335,142 q11,14 22,0" fill="#ffffff" stroke="#2f8f57" stroke-width="1.6"/><text x="346" y="222" text-anchor="middle" font-size="11.5" fill="#2f8f57" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">反竞争性</text><rect x="-7" y="-7" width="14" height="14" rx="2" fill="#2c5f9e"><animateTransform attributeName="transform" type="translate" values="74,136;74,142;74,142;110,122;110,122" keyTimes="0;0.14;0.30;0.44;1" dur="11.0s" repeatCount="indefinite" calcMode="spline" keySplines="0.23 1 0.32 1;0.23 1 0.32 1;0.45 0 0.55 1;0.23 1 0.32 1"/></rect><rect x="236" y="122" width="13" height="13" rx="2" fill="#c1440e"><animateTransform attributeName="transform" type="translate" values="0,0;0,0;0,0;0,0" keyTimes="0;0.3;0.8;1" dur="11.0s" repeatCount="indefinite"/></rect><rect x="-7" y="-7" width="14" height="14" rx="2" fill="#2f8f57" opacity="0"><animate attributeName="opacity" values="0;0;0.95;0.95" keyTimes="0;0.67;0.73;1" dur="11.0s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="368,122;368,122;368,122;368,122" keyTimes="0;0.5;0.9;1" dur="11.0s" repeatCount="indefinite"/></rect><circle r="9" fill="#0f766e"><animateTransform attributeName="transform" type="translate" values="144,128;74,148;74,148;74,148" keyTimes="0;0.3;0.55;1" dur="11.0s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.23 1 0.32 1;0.23 1 0.32 1"/></circle><circle r="9" fill="#0f766e" opacity="0.9"><animateTransform attributeName="transform" type="translate" values="280,128;210,148;210,148" keyTimes="0;0.36;1" dur="11.0s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.23 1 0.32 1"/></circle><circle r="9" fill="#0f766e" opacity="0.9"><animateTransform attributeName="transform" type="translate" values="416,128;346,148;346,148" keyTimes="0;0.40;1" dur="11.0s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.23 1 0.32 1"/></circle><text x="34" y="262" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">Vmax（最大速度）</text><rect x="34" y="268" width="352" height="12" rx="6" fill="#eef2f7"/><g transform="translate(34,274)"><rect x="0" y="-6" width="352" height="12" rx="6" fill="#0f766e" opacity="0.8"><animateTransform attributeName="transform" type="scale" additive="sum" values="1 1;1 1;0.55 1;0.45 1" keyTimes="0;0;0.34;1" dur="11.0s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1"/></rect></g><text x="34" y="304" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">Km（半速底物浓度，越大亲和力越低）</text><rect x="34" y="310" width="352" height="12" rx="6" fill="#eef2f7"/><g transform="translate(34,316)"><rect x="0" y="-6" width="352" height="12" rx="6" fill="#b45309" opacity="0.8"><animateTransform attributeName="transform" type="scale" additive="sum" values="0.5 1;0.9 1;0.5 1;0.28 1" keyTimes="0;0;0.34;1" dur="11.0s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1"/></rect></g><text font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><tspan x="210.0" y="352" text-anchor="middle" opacity="0" fill="#2c5f9e" font-size="12" font-weight="700">① 竞争性：抑制剂占门口<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.34;0.3406;1" dur="11.0s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="352" text-anchor="middle" opacity="0" fill="#c1440e" font-size="12" font-weight="700">② 非竞争性：抑制剂占别处<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.34;0.3406;0.67;0.6706;1" dur="11.0s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="352" text-anchor="middle" opacity="0" fill="#2f8f57" font-size="12" font-weight="700">③ 反竞争性：只认 ES<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.67;0.6706;1" dur="11.0s" repeatCount="indefinite"/></tspan></text><path d="M34,372 H386" stroke="#e2e8f0" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.35"/><path d="M153.7,367 L153.7,377 M269.8,367 L269.8,377" stroke="#e2e8f0" stroke-width="1.1" fill="none"/><circle cy="372" r="5.4" fill="#1e293b" stroke="#ffffff" stroke-width="2"><animateTransform attributeName="transform" type="translate" values="34.0,0;39.9,0;45.7,0;51.6,0;57.5,0;63.3,0;69.2,0;75.1,0;80.9,0;86.8,0;92.7,0;98.5,0;104.4,0;110.3,0;116.1,0;122.0,0;127.9,0;133.7,0;139.6,0;145.5,0;151.3,0;157.2,0;163.1,0;168.9,0;174.8,0;180.7,0;186.5,0;192.4,0;198.3,0;204.1,0;210.0,0;215.9,0;221.7,0;227.6,0;233.5,0;239.3,0;245.2,0;251.1,0;256.9,0;262.8,0;268.7,0;274.5,0;280.4,0;286.3,0;292.1,0;298.0,0;303.9,0;309.7,0;315.6,0;321.5,0;327.3,0;333.2,0;339.1,0;344.9,0;350.8,0;356.7,0;362.5,0;368.4,0;374.3,0;380.1,0;386.0,0" keyTimes="0;0.0167;0.0333;0.05;0.0667;0.0833;0.1;0.1167;0.1333;0.15;0.1667;0.1833;0.2;0.2167;0.2333;0.25;0.2667;0.2833;0.3;0.3167;0.3333;0.35;0.3667;0.3833;0.4;0.4167;0.4333;0.45;0.4667;0.4833;0.5;0.5167;0.5333;0.55;0.5667;0.5833;0.6;0.6167;0.6333;0.65;0.6667;0.6833;0.7;0.7167;0.7333;0.75;0.7667;0.7833;0.8;0.8167;0.8333;0.85;0.8667;0.8833;0.9;0.9167;0.9333;0.95;0.9667;0.9833;1" dur="11.0s" repeatCount="indefinite" calcMode="linear"/></circle></svg>