<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 556" role="img" aria-labelledby="ft fd" style="background:#ffffff"><title id="ft">中心法则：五条信息流</title><desc id="fd">中心法则：DNA 复制把信息传给子代，转录成 mRNA，翻译成蛋白质；逆转录与 RNA 复制是病毒补充的两条路径。蛋白质不能反向决定核酸序列，信息流单向。</desc><text x="22" y="28" font-size="17.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">中心法则：五条信息流</text><text x="22" y="46" font-size="11.5" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">DNA→DNA 复制、DNA→RNA 转录、RNA→蛋白翻译；病毒另有两条回流的</text><rect x="22" y="60" width="436" height="176" rx="10" fill="#f8fbfd" stroke="#dfe8f1" stroke-width="1"/><text x="37" y="81" font-size="11.5" fill="#8899aa" font-weight="700" letter-spacing="1" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">分子层面</text><rect x="56" y="132" width="84" height="46" rx="10" fill="#dbe7f5" stroke="#2c5f9e" stroke-width="1.8"/><text x="98" y="162" text-anchor="middle" font-size="14" font-weight="700" fill="#2c5f9e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">DNA</text><rect x="186" y="132" width="84" height="46" rx="10" fill="#f2ecfb" stroke="#7b4bb7" stroke-width="1.8"/><text x="228" y="162" text-anchor="middle" font-size="14" font-weight="700" fill="#7b4bb7" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">RNA</text><rect x="310" y="132" width="84" height="46" rx="10" fill="#fbe3e0" stroke="#c0392b" stroke-width="1.8"/><text x="352" y="162" text-anchor="middle" font-size="14" font-weight="700" fill="#c0392b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">蛋白质</text><defs><marker id="ah_2c5f9e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2c5f9e"/></marker><marker id="ah_7b4bb7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7b4bb7"/></marker><marker id="ah_c0392b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="ah_c1440e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c1440e"/></marker><marker id="ah_a8791a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a8791a"/></marker><marker id="ah_2f8f57" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f8f57"/></marker></defs><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.16;0.1606;0.325;0.3256;1" dur="11.0s" repeatCount="indefinite"/><path d="M142,156 L184,156" stroke="#7b4bb7" stroke-width="2.4" fill="none" marker-end="url(#ah_7b4bb7)"/><text x="163.0" y="144.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">转录</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.325;0.3256;0.495;0.4956;1" dur="11.0s" repeatCount="indefinite"/><path d="M272,156 L308,156" stroke="#c0392b" stroke-width="2.4" fill="none" marker-end="url(#ah_c0392b)"/><text x="290.0" y="144.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c0392b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">翻译</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.16;0.1606;1" dur="11.0s" repeatCount="indefinite"/><path d="M64,134 L64,178" stroke="#2c5f9e" stroke-width="2.4" fill="none" marker-end="url(#ah_2c5f9e)"/><text x="64.0" y="144.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2c5f9e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">复制</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.495;0.4956;0.665;0.6656;1" dur="11.0s" repeatCount="indefinite"/><path d="M206,192 Q163.0,166 120,192" stroke="#c1440e" stroke-width="2.4" fill="none" stroke-dasharray="5 3" marker-end="url(#ah_c1440e)"/><text x="163.0" y="162.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c1440e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">逆转录</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.665;0.6656;0.835;0.8356;1" dur="11.0s" repeatCount="indefinite"/><path d="M228,186 Q228.0,166 228,212" stroke="#a8791a" stroke-width="2.4" fill="none" marker-end="url(#ah_a8791a)"/><text x="228.0" y="175.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#a8791a" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">RNA 复制</text></g><rect x="22" y="258" width="436" height="3" rx="1.5" fill="#e8eff6"/><path d="M22,259.5 H458" stroke="#0f766e" stroke-width="3" stroke-linecap="round" opacity="0.42" stroke-dasharray="436" stroke-dashoffset="436"><animate attributeName="stroke-dashoffset" values="436;0" keyTimes="0;1" dur="11.0s" repeatCount="indefinite"/></path><circle cx="56.7" cy="259.5" r="4" fill="#ffffff" stroke="#cfdce8" stroke-width="1.5"/><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.16;0.1606;1" dur="11.0s" repeatCount="indefinite"/><circle cx="56.7" cy="259.5" r="5.5" fill="#2c5f9e"/></g><g opacity="1"><animate attributeName="opacity" values="0.0;0.0;1.0;1.0" keyTimes="0;0.16;0.1606;1" dur="11.0s" repeatCount="indefinite"/><text x="56.7" y="280" text-anchor="middle" font-size="11.5" fill="#b6c4d2" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">DNA 复制</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.16;0.1606;1" dur="11.0s" repeatCount="indefinite"/><text x="56.7" y="280" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2c5f9e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">DNA 复制</text></g><circle cx="130.0" cy="259.5" r="4" fill="#ffffff" stroke="#cfdce8" stroke-width="1.5"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.16;0.1606;0.325;0.3256;1" dur="11.0s" repeatCount="indefinite"/><circle cx="130.0" cy="259.5" r="5.5" fill="#7b4bb7"/></g><g opacity="1"><animate attributeName="opacity" values="1.0;1.0;0.0;0.0;1.0;1.0" keyTimes="0;0.16;0.1606;0.325;0.3256;1" dur="11.0s" repeatCount="indefinite"/><text x="130.0" y="280" text-anchor="middle" font-size="11.5" fill="#b6c4d2" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">转录</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.16;0.1606;0.325;0.3256;1" dur="11.0s" repeatCount="indefinite"/><text x="130.0" y="280" text-anchor="middle" font-size="11.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">转录</text></g><circle cx="203.3" cy="259.5" r="4" fill="#ffffff" stroke="#cfdce8" stroke-width="1.5"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.325;0.3256;0.495;0.4956;1" dur="11.0s" repeatCount="indefinite"/><circle cx="203.3" cy="259.5" r="5.5" fill="#c0392b"/></g><g opacity="1"><animate attributeName="opacity" values="1.0;1.0;0.0;0.0;1.0;1.0" keyTimes="0;0.325;0.3256;0.495;0.4956;1" dur="11.0s" repeatCount="indefinite"/><text x="203.3" y="280" text-anchor="middle" font-size="11.5" fill="#b6c4d2" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">翻译</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.325;0.3256;0.495;0.4956;1" dur="11.0s" repeatCount="indefinite"/><text x="203.3" y="280" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c0392b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">翻译</text></g><circle cx="276.7" cy="259.5" r="4" fill="#ffffff" stroke="#cfdce8" stroke-width="1.5"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.495;0.4956;0.665;0.6656;1" dur="11.0s" repeatCount="indefinite"/><circle cx="276.7" cy="259.5" r="5.5" fill="#c1440e"/></g><g opacity="1"><animate attributeName="opacity" values="1.0;1.0;0.0;0.0;1.0;1.0" keyTimes="0;0.495;0.4956;0.665;0.6656;1" dur="11.0s" repeatCount="indefinite"/><text x="276.7" y="280" text-anchor="middle" font-size="11.5" fill="#b6c4d2" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">逆转录</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.495;0.4956;0.665;0.6656;1" dur="11.0s" repeatCount="indefinite"/><text x="276.7" y="280" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c1440e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">逆转录</text></g><circle cx="350.0" cy="259.5" r="4" fill="#ffffff" stroke="#cfdce8" stroke-width="1.5"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.665;0.6656;0.835;0.8356;1" dur="11.0s" repeatCount="indefinite"/><circle cx="350.0" cy="259.5" r="5.5" fill="#a8791a"/></g><g opacity="1"><animate attributeName="opacity" values="1.0;1.0;0.0;0.0;1.0;1.0" keyTimes="0;0.665;0.6656;0.835;0.8356;1" dur="11.0s" repeatCount="indefinite"/><text x="350.0" y="280" text-anchor="middle" font-size="11.5" fill="#b6c4d2" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">RNA 复制</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.665;0.6656;0.835;0.8356;1" dur="11.0s" repeatCount="indefinite"/><text x="350.0" y="280" text-anchor="middle" font-size="11.5" font-weight="700" fill="#a8791a" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">RNA 复制</text></g><circle cx="423.3" cy="259.5" r="4" fill="#ffffff" stroke="#cfdce8" stroke-width="1.5"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.835;0.8356;1" dur="11.0s" repeatCount="indefinite"/><circle cx="423.3" cy="259.5" r="5.5" fill="#2f8f57"/></g><g opacity="1"><animate attributeName="opacity" values="1.0;1.0;0.0;0.0" keyTimes="0;0.835;0.8356;1" dur="11.0s" repeatCount="indefinite"/><text x="423.3" y="280" text-anchor="middle" font-size="11.5" fill="#b6c4d2" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">蛋白→核酸不可逆</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.835;0.8356;1" dur="11.0s" repeatCount="indefinite"/><text x="423.3" y="280" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">蛋白→核酸不可逆</text></g><rect x="22" y="292" width="436" height="92" rx="10" fill="#ffffff" stroke="#e3ebf3" stroke-width="1"/><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.16;0.1606;1" dur="11.0s" repeatCount="indefinite"/><rect x="22" y="293" width="3" height="90" fill="#2c5f9e" opacity="0.85"/><text x="40" y="318" font-size="11.5" fill="#a8b6c4" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">因为</text><text x="78" y="318" font-size="12.5" fill="#6b7c8d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">DNA 依赖 DNA 聚合酶，半保留复制</text><text x="40" y="354" font-size="11.5" fill="#2c5f9e" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">所以</text><text x="78" y="354" font-size="14.5" fill="#2c5f9e" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">遗传信息从 DNA 传到 DNA，传给子代</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.16;0.1606;0.325;0.3256;1" dur="11.0s" repeatCount="indefinite"/><rect x="22" y="293" width="3" height="90" fill="#7b4bb7" opacity="0.85"/><text x="40" y="318" font-size="11.5" fill="#a8b6c4" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">因为</text><text x="78" y="318" font-size="12.5" fill="#6b7c8d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">DNA 依赖 RNA 聚合酶，只抄一条链</text><text x="40" y="354" font-size="11.5" fill="#7b4bb7" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">所以</text><text x="78" y="354" font-size="14.5" fill="#7b4bb7" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">信息从 DNA 转到 mRNA</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.325;0.3256;0.495;0.4956;1" dur="11.0s" repeatCount="indefinite"/><rect x="22" y="293" width="3" height="90" fill="#c0392b" opacity="0.85"/><text x="40" y="318" font-size="11.5" fill="#a8b6c4" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">因为</text><text x="78" y="318" font-size="12.5" fill="#6b7c8d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">核糖体按密码子把 mRNA 读成肽链</text><text x="40" y="354" font-size="11.5" fill="#c0392b" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">所以</text><text x="78" y="354" font-size="14.5" fill="#c0392b" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">信息从 mRNA 转到蛋白质</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.495;0.4956;0.665;0.6656;1" dur="11.0s" repeatCount="indefinite"/><rect x="22" y="293" width="3" height="90" fill="#c1440e" opacity="0.85"/><text x="40" y="318" font-size="11.5" fill="#a8b6c4" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">因为</text><text x="78" y="318" font-size="12.5" fill="#6b7c8d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">逆转录酶以 RNA 为模板合成 cDNA</text><text x="40" y="354" font-size="11.5" fill="#c1440e" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">所以</text><text x="78" y="354" font-size="14.5" fill="#c1440e" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">信息从 RNA 回到 DNA（中心法则的补充）</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.665;0.6656;0.835;0.8356;1" dur="11.0s" repeatCount="indefinite"/><rect x="22" y="293" width="3" height="90" fill="#a8791a" opacity="0.85"/><text x="40" y="318" font-size="11.5" fill="#a8b6c4" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">因为</text><text x="78" y="318" font-size="12.5" fill="#6b7c8d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">RNA 依赖 RNA 聚合酶直接复制 RNA</text><text x="40" y="354" font-size="11.5" fill="#a8791a" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">所以</text><text x="78" y="354" font-size="14.5" fill="#a8791a" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">部分病毒可以，扩宽了中心法则</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.835;0.8356;1" dur="11.0s" repeatCount="indefinite"/><rect x="22" y="293" width="3" height="90" fill="#2f8f57" opacity="0.85"/><text x="40" y="318" font-size="11.5" fill="#a8b6c4" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">因为</text><text x="78" y="318" font-size="12.5" fill="#6b7c8d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">蛋白质不能反过来决定核酸序列</text><text x="40" y="354" font-size="11.5" fill="#2f8f57" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">所以</text><text x="78" y="354" font-size="14.5" fill="#2f8f57" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">信息只从核酸流向蛋白，单向</text></g><text x="22" y="404" font-size="11.5" fill="#a8b6c4" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">五条信息流（谁抄谁）</text><text x="22" y="424" font-size="12.5" font-weight="700" fill="#2c5f9e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">DNA → DNA</text><text x="118" y="424" font-size="12.5" fill="#6b7c8d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">复制</text><text x="22" y="444" font-size="12.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">DNA → RNA</text><text x="118" y="444" font-size="12.5" fill="#6b7c8d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">转录</text><text x="22" y="464" font-size="12.5" font-weight="700" fill="#c0392b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">RNA → 蛋白</text><text x="118" y="464" font-size="12.5" fill="#6b7c8d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">翻译</text><text x="22" y="484" font-size="12.5" font-weight="700" fill="#c1440e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">RNA → DNA</text><text x="118" y="484" font-size="12.5" fill="#6b7c8d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">逆转录（病毒）</text><text x="22" y="504" font-size="12.5" font-weight="700" fill="#a8791a" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">RNA → RNA</text><text x="118" y="504" font-size="12.5" fill="#6b7c8d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">RNA 复制（病毒）</text></svg>