<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 556" role="img" aria-labelledby="ft fd" style="background:#ffffff"><title id="ft">复制叉：一条连续，一条分段</title><desc id="fd">DNA 复制时解旋酶打开双链形成复制叉；引物酶合成 RNA 引物；前导链连续延伸，随从链反向分段合成冈崎片段，再切除引物、补齐并由连接酶封口，形成半不连续复制。</desc><text x="22" y="28" font-size="17.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">复制叉：一条连续，一条分段</text><text x="22" y="46" font-size="11.5" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">聚合酶只能 5′→3′ 延伸，两条模板方向相反 → 半不连续</text><rect x="22" y="60" width="436" height="176" rx="10" fill="#f8fbfd" stroke="#dfe8f1" stroke-width="1"/><text x="37" y="81" font-size="11.5" fill="#8899aa" font-weight="700" letter-spacing="1" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">分子层面</text><path d="M190,144 H444" stroke="#2c5f9e" stroke-width="4.5" stroke-linecap="round"/><path d="M190,160 H444" stroke="#2c5f9e" stroke-width="4.5" stroke-linecap="round" opacity="0.5"/><path d="M36,118 L190,144" stroke="#2c5f9e" stroke-width="4.5" stroke-linecap="round"/><path d="M36,186 L190,160" stroke="#2c5f9e" stroke-width="4.5" stroke-linecap="round" opacity="0.5"/><text x="36" y="104" font-size="11" fill="#2c5f9e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">模板 1（3′→5′）</text><text x="36" y="204" font-size="11" fill="#a8b6c4" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">模板 2（5′→3′）</text><circle cx="190" cy="152" r="13" fill="#fde8dd" stroke="#c1440e" stroke-width="1.8"/><text x="190" y="156" text-anchor="middle" font-size="11" font-weight="700" fill="#c1440e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">解</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.3306;0.5;0.5006;1" dur="11.0s" repeatCount="indefinite"/><path d="M52,125 L186,137" stroke="#2c5f9e" stroke-width="6.5" stroke-linecap="round" opacity="0.92"/><text x="212" y="122" font-size="11.5" fill="#2c5f9e" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">前导链 · 连续</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.5006;0.67;0.6706;1" dur="11.0s" repeatCount="indefinite"/><path d="M48,179 H72" stroke="#7b4bb7" stroke-width="6.5" stroke-linecap="round"/><path d="M84,179 H108" stroke="#7b4bb7" stroke-width="6.5" stroke-linecap="round"/><path d="M120,179 H144" stroke="#7b4bb7" stroke-width="6.5" stroke-linecap="round"/><path d="M156,179 H180" stroke="#7b4bb7" stroke-width="6.5" stroke-linecap="round"/><text x="80" y="224" font-size="11.5" fill="#7b4bb7" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">随从链 · 冈崎片段（反向分段）</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.165;0.1656;0.33;0.3306;1" dur="11.0s" repeatCount="indefinite"/><rect x="48" y="115" width="28" height="10" rx="3" fill="#0f766e"/><rect x="48" y="169" width="28" height="10" rx="3" fill="#0f766e" opacity="0.75"/><text x="148" y="136" font-size="11" fill="#0f766e" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">RNA 引物</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.67;0.6706;0.835;0.8356;1" dur="11.0s" repeatCount="indefinite"/><path d="M48,179 H186" stroke="#2f8f57" stroke-width="6.5" stroke-linecap="round"/><text x="200" y="206" font-size="11" fill="#2f8f57" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">连接酶封口</text></g><rect x="22" y="258" width="436" height="3" rx="1.5" fill="#e8eff6"/><path d="M22,259.5 H458" stroke="#0f766e" stroke-width="3" stroke-linecap="round" opacity="0.42" stroke-dasharray="436" stroke-dashoffset="436"><animate attributeName="stroke-dashoffset" values="436;0" keyTimes="0;1" dur="11.0s" repeatCount="indefinite"/></path><circle cx="56.7" cy="259.5" r="4" fill="#ffffff" stroke="#cfdce8" stroke-width="1.5"/><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.165;0.1656;1" dur="11.0s" repeatCount="indefinite"/><circle cx="56.7" cy="259.5" r="5.5" fill="#c1440e"/></g><g opacity="1"><animate attributeName="opacity" values="0.0;0.0;1.0;1.0" keyTimes="0;0.165;0.1656;1" dur="11.0s" repeatCount="indefinite"/><text x="56.7" y="280" text-anchor="middle" font-size="11.5" fill="#b6c4d2" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">解旋</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.165;0.1656;1" dur="11.0s" repeatCount="indefinite"/><text x="56.7" y="280" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c1440e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">解旋</text></g><circle cx="130.0" cy="259.5" r="4" fill="#ffffff" stroke="#cfdce8" stroke-width="1.5"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.165;0.1656;0.33;0.3306;1" dur="11.0s" repeatCount="indefinite"/><circle cx="130.0" cy="259.5" r="5.5" fill="#0f766e"/></g><g opacity="1"><animate attributeName="opacity" values="1.0;1.0;0.0;0.0;1.0;1.0" keyTimes="0;0.165;0.1656;0.33;0.3306;1" dur="11.0s" repeatCount="indefinite"/><text x="130.0" y="280" text-anchor="middle" font-size="11.5" fill="#b6c4d2" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">引物</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.165;0.1656;0.33;0.3306;1" dur="11.0s" repeatCount="indefinite"/><text x="130.0" y="280" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">引物</text></g><circle cx="203.3" cy="259.5" r="4" fill="#ffffff" stroke="#cfdce8" stroke-width="1.5"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.3306;0.5;0.5006;1" dur="11.0s" repeatCount="indefinite"/><circle cx="203.3" cy="259.5" r="5.5" fill="#2c5f9e"/></g><g opacity="1"><animate attributeName="opacity" values="1.0;1.0;0.0;0.0;1.0;1.0" keyTimes="0;0.33;0.3306;0.5;0.5006;1" dur="11.0s" repeatCount="indefinite"/><text x="203.3" y="280" text-anchor="middle" font-size="11.5" fill="#b6c4d2" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">前导链</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.3306;0.5;0.5006;1" dur="11.0s" repeatCount="indefinite"/><text x="203.3" y="280" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2c5f9e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">前导链</text></g><circle cx="276.7" cy="259.5" r="4" fill="#ffffff" stroke="#cfdce8" stroke-width="1.5"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.5006;0.67;0.6706;1" dur="11.0s" repeatCount="indefinite"/><circle cx="276.7" cy="259.5" r="5.5" fill="#7b4bb7"/></g><g opacity="1"><animate attributeName="opacity" values="1.0;1.0;0.0;0.0;1.0;1.0" keyTimes="0;0.5;0.5006;0.67;0.6706;1" dur="11.0s" repeatCount="indefinite"/><text x="276.7" y="280" text-anchor="middle" font-size="11.5" fill="#b6c4d2" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">随从链</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.5006;0.67;0.6706;1" dur="11.0s" repeatCount="indefinite"/><text x="276.7" y="280" text-anchor="middle" font-size="11.5" font-weight="700" fill="#7b4bb7" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">随从链</text></g><circle cx="350.0" cy="259.5" r="4" fill="#ffffff" stroke="#cfdce8" stroke-width="1.5"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.67;0.6706;0.835;0.8356;1" dur="11.0s" repeatCount="indefinite"/><circle cx="350.0" cy="259.5" r="5.5" fill="#c1440e"/></g><g opacity="1"><animate attributeName="opacity" values="1.0;1.0;0.0;0.0;1.0;1.0" keyTimes="0;0.67;0.6706;0.835;0.8356;1" dur="11.0s" repeatCount="indefinite"/><text x="350.0" y="280" text-anchor="middle" font-size="11.5" fill="#b6c4d2" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">切除连接</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.67;0.6706;0.835;0.8356;1" dur="11.0s" repeatCount="indefinite"/><text x="350.0" y="280" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c1440e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">切除连接</text></g><circle cx="423.3" cy="259.5" r="4" fill="#ffffff" stroke="#cfdce8" stroke-width="1.5"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.835;0.8356;1" dur="11.0s" repeatCount="indefinite"/><circle cx="423.3" cy="259.5" r="5.5" fill="#2f8f57"/></g><g opacity="1"><animate attributeName="opacity" values="1.0;1.0;0.0;0.0" keyTimes="0;0.835;0.8356;1" dur="11.0s" repeatCount="indefinite"/><text x="423.3" y="280" text-anchor="middle" font-size="11.5" fill="#b6c4d2" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">半不连续</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.835;0.8356;1" dur="11.0s" repeatCount="indefinite"/><text x="423.3" y="280" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">半不连续</text></g><rect x="22" y="292" width="436" height="92" rx="10" fill="#ffffff" stroke="#e3ebf3" stroke-width="1"/><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.165;0.1656;1" dur="11.0s" repeatCount="indefinite"/><rect x="22" y="293" width="3" height="90" fill="#c1440e" opacity="0.85"/><text x="40" y="318" font-size="11.5" fill="#a8b6c4" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">因为</text><text x="78" y="318" font-size="12.5" fill="#6b7c8d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">解旋酶打断碱基对间的氢键，双链被拉开</text><text x="40" y="354" font-size="11.5" fill="#c1440e" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">所以</text><text x="78" y="354" font-size="14.5" fill="#c1440e" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">形成 Y 形复制叉，两条模板暴露</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.165;0.1656;0.33;0.3306;1" dur="11.0s" repeatCount="indefinite"/><rect x="22" y="293" width="3" height="90" fill="#0f766e" opacity="0.85"/><text x="40" y="318" font-size="11.5" fill="#a8b6c4" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">因为</text><text x="78" y="318" font-size="12.5" fill="#6b7c8d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">引物酶先合成一段 RNA 引物（不需引物即可起始）</text><text x="40" y="354" font-size="11.5" fill="#0f766e" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">所以</text><text x="78" y="354" font-size="14.5" fill="#0f766e" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">DNA 聚合酶有了 3′-OH，才能开始延伸</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.3306;0.5;0.5006;1" dur="11.0s" repeatCount="indefinite"/><rect x="22" y="293" width="3" height="90" fill="#2c5f9e" opacity="0.85"/><text x="40" y="318" font-size="11.5" fill="#a8b6c4" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">因为</text><text x="78" y="318" font-size="12.5" fill="#6b7c8d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">沿解旋方向连续延伸，5′→3′ 一路到底</text><text x="40" y="354" font-size="11.5" fill="#2c5f9e" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">所以</text><text x="78" y="354" font-size="14.5" fill="#2c5f9e" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">一条链连续合成，无需拼补</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.5006;0.67;0.6706;1" dur="11.0s" repeatCount="indefinite"/><rect x="22" y="293" width="3" height="90" fill="#7b4bb7" opacity="0.85"/><text x="40" y="318" font-size="11.5" fill="#a8b6c4" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">因为</text><text x="78" y="318" font-size="12.5" fill="#6b7c8d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">模板方向相反，只能反向分段合成</text><text x="40" y="354" font-size="11.5" fill="#7b4bb7" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">所以</text><text x="78" y="354" font-size="14.5" fill="#7b4bb7" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">形成许多冈崎片段，再连成完整链</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.67;0.6706;0.835;0.8356;1" dur="11.0s" repeatCount="indefinite"/><rect x="22" y="293" width="3" height="90" fill="#c1440e" opacity="0.85"/><text x="40" y="318" font-size="11.5" fill="#a8b6c4" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">因为</text><text x="78" y="318" font-size="12.5" fill="#6b7c8d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">聚合酶Ⅰ 切掉 RNA 引物并补 DNA，连接酶封口</text><text x="40" y="354" font-size="11.5" fill="#c1440e" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">所以</text><text x="78" y="354" font-size="14.5" fill="#c1440e" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">片段连成长链，两条新链都完整</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.835;0.8356;1" dur="11.0s" repeatCount="indefinite"/><rect x="22" y="293" width="3" height="90" fill="#2f8f57" opacity="0.85"/><text x="40" y="318" font-size="11.5" fill="#a8b6c4" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">因为</text><text x="78" y="318" font-size="12.5" fill="#6b7c8d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">一条连续、一条分段 —— 这就是半不连续</text><text x="40" y="354" font-size="11.5" fill="#2f8f57" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">所以</text><text x="78" y="354" font-size="14.5" fill="#2f8f57" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">根源是聚合酶只能 5′→3′ 延伸</text></g><text x="22" y="408" font-size="11.5" fill="#a8b6c4" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">两条新链的合成方式</text><rect x="22" y="418" width="3" height="16" rx="1.5" fill="#2c5f9e"/><text x="34" y="430" font-size="13" font-weight="700" fill="#2c5f9e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">前导链</text><text x="104" y="430" font-size="12.5" fill="#6b7c8d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">连续延伸，5′→3′ 一路到底</text><rect x="22" y="444" width="3" height="16" rx="1.5" fill="#7b4bb7"/><text x="34" y="456" font-size="13" font-weight="700" fill="#7b4bb7" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">随从链</text><text x="104" y="456" font-size="12.5" fill="#6b7c8d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">冈崎片段，反向分段后由连接酶封口</text></svg>