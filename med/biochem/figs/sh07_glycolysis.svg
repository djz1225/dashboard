<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 500" role="img" aria-labelledby="ft fd" style="background:#ffffff"><title id="ft">糖酵解的两段式收支</title><desc id="fd">糖酵解在胞质进行，前段投资 2 个 ATP，后段回收 4 个 ATP 与 2 个 NADH；净得 2 个 ATP 与 2 分子丙酮酸。</desc><text x="210.0" y="28" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="0.55s" fill="freeze" calcMode="spline" keySplines="0.23 1 0.32 1"/>糖酵解：投资两笔，回收四笔<tspan x="210.0" y="48" text-anchor="middle" font-size="11" fill="#64748b" font-weight="400">净得 2 ATP + 2 NADH；三个不可逆反应是调控点</tspan></text><text x="34" y="92" font-size="11" fill="#c0392b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">投资 −2 ATP</text><rect x="34" y="100" width="150" height="22" rx="5" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/><text x="109" y="115" text-anchor="middle" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">葡萄糖</text><rect x="34" y="126" width="150" height="22" rx="5" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/><text x="109" y="141" text-anchor="middle" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">G-6-P</text><rect x="34" y="152" width="150" height="22" rx="5" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/><text x="109" y="167" text-anchor="middle" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">F-6-P</text><rect x="34" y="178" width="150" height="22" rx="5" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/><text x="109" y="193" text-anchor="middle" font-size="11" fill="#c0392b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">F-1,6-BP</text><text x="216" y="92" font-size="11" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">回收 +4 ATP + 2 NADH</text><rect x="216" y="100" width="170" height="22" rx="5" fill="#ffffff" stroke="#0f766e" stroke-width="1.2"/><text x="301" y="115" text-anchor="middle" font-size="11" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">2 × 3-磷酸甘油醛</text><rect x="216" y="126" width="170" height="22" rx="5" fill="#ffffff" stroke="#0f766e" stroke-width="1.2"/><text x="301" y="141" text-anchor="middle" font-size="11" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">1,3-BPG</text><rect x="216" y="152" width="170" height="22" rx="5" fill="#ffffff" stroke="#0f766e" stroke-width="1.2"/><text x="301" y="167" text-anchor="middle" font-size="11" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">3-PG</text><rect x="216" y="178" width="170" height="22" rx="5" fill="#ffffff" stroke="#0f766e" stroke-width="1.2"/><text x="301" y="193" text-anchor="middle" font-size="11" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">2-PG</text><rect x="216" y="204" width="170" height="22" rx="5" fill="#ffffff" stroke="#0f766e" stroke-width="1.2"/><text x="301" y="219" text-anchor="middle" font-size="11" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">PEP</text><rect x="216" y="230" width="170" height="22" rx="5" fill="#ffffff" stroke="#2f8f57" stroke-width="1.2"/><text x="301" y="245" text-anchor="middle" font-size="11" fill="#2f8f57" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">2 × 丙酮酸</text><rect x="30" y="98" width="158" height="26" rx="6" fill="none" stroke="#c0392b" stroke-width="2.6" opacity="0"><animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.08;0.16;1" dur="12.0s" repeatCount="indefinite"/></rect><rect x="30" y="150" width="158" height="26" rx="6" fill="none" stroke="#c0392b" stroke-width="2.6" opacity="0"><animate attribu