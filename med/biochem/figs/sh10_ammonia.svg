<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 500" role="img" aria-labelledby="ft fd" style="background:#ffffff"><title id="ft">血氨的来源与去路</title><desc id="fd">血氨主要来自氨基酸脱氨基与肠道细菌产氨；去路以肝合成尿素为主，其次为合成谷氨酰胺运输与肾排铵盐。肝功能衰竭时血氨升高可致肝性脑病。</desc><text x="210.0" y="28" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="0.55s" fill="freeze" calcMode="spline" keySplines="0.23 1 0.32 1"/>血氨：两来源三去路<tspan x="210.0" y="48" text-anchor="middle" font-size="11" fill="#64748b" font-weight="400">氨有毒，必减速清；合成尿素是主路</tspan></text><circle cx="210" cy="196" r="46" fill="#fef3c7" stroke="#a8791a" stroke-width="2.4"/><text x="210" y="192" text-anchor="middle" font-size="12" font-weight="700" fill="#a8791a" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">血氨</text><text x="210" y="210" text-anchor="middle" font-size="11" fill="#a8791a" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">NH₃ / NH₄⁺</text><rect x="4" y="104" width="112" height="32" rx="6" fill="#fbe3e0" stroke="#c0392b" stroke-width="1.3"/><text x="60" y="124" text-anchor="middle" font-size="11" fill="#c0392b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">氨基酸脱氨基</text><rect x="4" y="256" width="112" height="32" rx="6" fill="#fbe3e0" stroke="#c0392b" stroke-width="1.3"/><text x="60" y="276" text-anchor="middle" font-size="11" fill="#c0392b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">肠道细菌产氨</text><path d="M116,120 Q160,150 172,172" fill="none" stroke="#c0392b" stroke-width="1.8"/><polygon points="178,178 170,172 176,168" fill="#c0392b"/><path d="M116,272 Q160,242 172,220" fill="none" stroke="#c0392b" stroke-width="1.8"/><polygon points="178,214 170,220 176,224" fill="#c0392b"/><rect x="286" y="102" width="124" height="32" rx="6" fill="#ffffff" stroke="#2f8f57" stroke-width="1.3"/><text x="348" y="122" text-anchor="middle" font-size="11" fill="#2f8f57" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">① 合成尿素（主要）</text><path d="M256,172 Q290,172 286,118" fill="none" stroke="#2f8f57" stroke-width="1.6"/><rect x="286" y="180" width="124" height="32" rx="6" fill="#ffffff" stroke="#0f766e" stroke-width="1.3"/><text x="348" y="200" text-anchor="middle" font-size="11" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">② 合成谷氨酰胺</text><path d="M256,196 Q290,196 286,196" fill="none" stroke="#0f766e" stroke-width="1.6"/><rect x="286" y="258" width="124" height="32" rx="6" fill="#ffffff" stroke="#2f8f57" stroke-width="1.3"/><text x="348" y="278" text-anchor="middle" font-size="11" fill="#2f8f57" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">③ 肾排铵盐</text><path d="M256,220 Q290,220 286,274" fill="none" stroke="#2f8f57" stroke-width="1.6"/><text font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><tspan x="210.0" y="330" text-anchor="middle" opacity="0" fill="#c0392b" font-size="12" font-weight="700">① 氨生成<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.3;0.3006;1" dur="9.0s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="330" text-anchor="middle" opacity="0" fill="#a8791a" font-size="12" font-weight="700">② 入血成血氨池<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3;0.3006;0.55;0.5506;1" dur="9.0s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="330" text-anchor="middle" opacity="0" fill="#2f8f57" font-size="12" font-weight="700">③ 肝合成尿素<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.55;0.5506;0.8;0.8006;1" dur="9.0s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="330" text-anchor="middle" opacity="0" fill="#0f766e" font-size="12" font-weight="700">④ 肾排铵盐<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.8;0.8006;1" dur="9.0s" repeatCount="indefinite"/></tspan></text><path d="M34,348 H386" stroke="#e2e8f0" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.35"/><path d="M139.6,343 L139.6,353 M227.6,343 L227.6,353 M315.6,343 L315.6,353" stroke="#e2e8f0" stroke-width="1.1" fill="none"/><circle cy="348" r="5.4" fill="#1e293b" stroke="#ffffff" stroke-width="2"><animateTransform attributeName="transform" type="translate" values="34.0,0;39.9,0;45.7,0;51.6,0;57.5,0;63.3,0;69.2,0;75.1,0;80.9,0;86.8,0;92.7,0;98.5,0;104.4,0;110.3,0;116.1,0;122.0,0;127.9,0;133.7,0;139.6,0;145.5,0;151.3,0;157.2,0;163.1,0;168.9,0;174.8,0;180.7,0;186.5,0;192.4,0;198.3,0;204.1,0;210.0,0;215.9,0;221.7,0;227.6,0;233.5,0;239.3,0;245.2,0;251.1,0;256.9,0;262.8,0;268.7,0;274.5,0;280.4,0;286.3,0;292.1,0;298.0,0;303.9,0;309.7,0;315.6,0;321.5,0;327.3,0;333.2,0;339.1,0;344.9,0;350.8,0;356.7,0;362.5,0;368.4,0;374.3,0;380.1,0;386.0,0" keyTimes="0;0.0167;0.0333;0.05;0.0667;0.0833;0.1;0.1167;0.1333;0.15;0.1667;0.1833;0.2;0.2167;0.2333;0.25;0.2667;0.2833;0.3;0.3167;0.3333;0.35;0.3667;0.3833;0.4;0.4167;0.4333;0.45;0.4667;0.4833;0.5;0.5167;0.5333;0.55;0.5667;0.5833;0.6;0.6167;0.6333;0.65;0.6667;0.6833;0.7;0.7167;0.7333;0.75;0.7667;0.7833;0.8;0.8167;0.8333;0.85;0.8667;0.8833;0.9;0.9167;0.9333;0.95;0.9667;0.9833;1" dur="9.0s" repeatCount="indefinite" calcMode="linear"/></circle><text x="210" y="372" text-anchor="middle" font-size="11" fill="#c1440e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">肝衰或门体分流 → 氨入脑 → 肝性脑病</text></svg>