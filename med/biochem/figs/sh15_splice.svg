<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 500" role="img" aria-labelledby="ft fd" style="background:#ffffff"><title id="ft">RNA 剪接的两次酯交换</title><desc id="fd">剪接体识别 5′ 剪接位点与分支点后，经两次酯交换把内含子以套索形式切除、并把相邻外显子连接成成熟 mRNA。可变剪接使一个基因可产生多种 mRNA。</desc><text x="210.0" y="28" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="0.55s" fill="freeze" calcMode="spline" keySplines="0.23 1 0.32 1"/>剪接：两次酯交换，去掉内含子<tspan x="210.0" y="48" text-anchor="middle" font-size="11" fill="#64748b" font-weight="400">剪接体由 snRNP 组成；可变剪接让一个基因出多种蛋白</tspan></text><rect x="60" y="118" width="78" height="34" rx="5" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/><text x="99.0" y="140" text-anchor="middle" font-size="11" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">外显子 1</text><rect x="138" y="118" width="110" height="34" rx="5" fill="#fde8dd" stroke="#c1440e" stroke-width="1.5"/><text x="193.0" y="140" text-anchor="middle" font-size="11" fill="#c1440e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">内含子</text><rect x="248" y="118" width="78" height="34" rx="5" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/><text x="287.0" y="140" text-anchor="middle" font-size="11" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">外显子 2</text><text x="34" y="108" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">前体 mRNA</text><g opacity="0"><path d="M193,152 q-38,54 -6,62 q34,8 34,-30 q0,-32 -22,-32" fill="none" stroke="#c1440e" stroke-width="2.2" stroke-dasharray="4 3"/><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.30;0.44;0.72;1" dur="9.5s" repeatCount="indefinite"/></g><rect x="150" y="258" width="156" height="34" rx="5" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.8" opacity="0"><animate attributeName="opacity" values="0;0;0;1;1" keyTimes="0;0.60;0.72;0.84;1" dur="9.5s" repeatCount="indefinite"/></rect><text x="228" y="280" text-anchor="middle" font-size="11.5" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700" opacity="0">成熟 mRNA（外显子连接）<animate attributeName="opacity" values="0;0;0;1;1" keyTimes="0;0.60;0.72;0.84;1" dur="9.5s" repeatCount="indefinite"/></text><text x="34" y="280" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">↓ 剪接</text><rect x="34" y="308" width="352" height="46" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.1"/><text x="44" y="326" font-size="11" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">第一次酯交换：分支点 A 的 2′-OH 攻击 5′ 剪接位点</text><text x="44" y="344" font-size="11" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">第二次酯交换：5′ 外显子的 3′-OH 连上 3′ 剪接位点</text><text font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><tspan x="210.0" y="372" text-anchor="middle" opacity="0" fill="#a8791a" font-size="11.5" font-weight="700">① U1/U2 识别位点<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.26;0.2606;1" dur="9.5s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="372" text-anchor="middle" opacity="0" fill="#c1440e" font-size="11.5" font-weight="700">② 第一次酯交换成套索<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.26;0.2606;0.5;0.5006;1" dur="9.5s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="372" text-anchor="middle" opacity="0" fill="#0f766e" font-size="11.5" font-weight="700">③ 第二次酯交换接外显子<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.5006;0.74;0.7406;1" dur="9.5s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="372" text-anchor="middle" opacity="0" fill="#2f8f57" font-size="11.5" font-weight="700">④ 套索释放、mRNA 成熟<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.74;0.7406;1" dur="9.5s" repeatCount="indefinite"/></tspan></text><path d="M34,390 H386" stroke="#e2e8f0" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.35"/><path d="M125.5,385 L125.5,395 M210.0,385 L210.0,395 M294.5,385 L294.5,395" stroke="#e2e8f0" stroke-width="1.1" fill="none"/><circle cy="390" r="5.4" fill="#1e293b" stroke="#ffffff" stroke-width="2"><animateTransform attributeName="transform" type="translate" values="34.0,0;39.9,0;45.7,0;51.6,0;57.5,0;63.3,0;69.2,0;75.1,0;80.9,0;86.8,0;92.7,0;98.5,0;104.4,0;110.3,0;116.1,0;122.0,0;127.9,0;133.7,0;139.6,0;145.5,0;151.3,0;157.2,0;163.1,0;168.9,0;174.8,0;180.7,0;186.5,0;192.4,0;198.3,0;204.1,0;210.0,0;215.9,0;221.7,0;227.6,0;233.5,0;239.3,0;245.2,0;251.1,0;256.9,0;262.8,0;268.7,0;274.5,0;280.4,0;286.3,0;292.1,0;298.0,0;303.9,0;309.7,0;315.6,0;321.5,0;327.3,0;333.2,0;339.1,0;344.9,0;350.8,0;356.7,0;362.5,0;368.4,0;374.3,0;380.1,0;386.0,0" keyTimes="0;0.0167;0.0333;0.05;0.0667;0.0833;0.1;0.1167;0.1333;0.15;0.1667;0.1833;0.2;0.2167;0.2333;0.25;0.2667;0.2833;0.3;0.3167;0.3333;0.35;0.3667;0.3833;0.4;0.4167;0.4333;0.45;0.4667;0.4833;0.5;0.5167;0.5333;0.55;0.5667;0.5833;0.6;0.6167;0.6333;0.65;0.6667;0.6833;0.7;0.7167;0.7333;0.75;0.7667;0.7833;0.8;0.8167;0.8333;0.85;0.8667;0.8833;0.9;0.9167;0.9333;0.95;0.9667;0.9833;1" dur="9.5s" repeatCount="indefinite" calcMode="linear"/></circle></svg>