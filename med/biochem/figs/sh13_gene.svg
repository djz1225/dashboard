<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 500" role="img" aria-labelledby="ft fd" style="background:#ffffff"><title id="ft">断裂基因与剪接</title><desc id="fd">真核基因由外显子与内含子相间构成，转录后经剪接去除内含子、拼接外显子，才能形成成熟 mRNA。可变剪接使同一基因产生多种 mRNA。</desc><text x="210.0" y="28" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="0.55s" fill="freeze" calcMode="spline" keySplines="0.23 1 0.32 1"/>断裂基因：外显子要在剪接后拼接<tspan x="210.0" y="48" text-anchor="middle" font-size="11" fill="#64748b" font-weight="400">一级结构上不连续，成熟 mRNA 才连续</tspan></text><rect x="50" y="112" width="66" height="32" rx="5" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/><text x="83.0" y="133" text-anchor="middle" font-size="11" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">外显子1</text><rect x="122" y="112" width="84" height="32" rx="5" fill="#fde8dd" stroke="#c1440e" stroke-width="1.4"/><text x="164.0" y="133" text-anchor="middle" font-size="11" fill="#c1440e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">内含子1</text><rect x="212" y="112" width="66" height="32" rx="5" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/><text x="245.0" y="133" text-anchor="middle" font-size="11" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">外显子2</text><rect x="284" y="112" width="60" height="32" rx="5" fill="#fde8dd" stroke="#c1440e" stroke-width="1.4"/><text x="314.0" y="133" text-anchor="middle" font-size="11" fill="#c1440e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">内含子2</text><rect x="350" y="112" width="34" height="32" rx="5" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/><text x="367.0" y="133" text-anchor="middle" font-size="11" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">外显子3</text><text x="34" y="102" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">基因组 DNA（外显子与内含子相间）</text><rect x="122" y="112" width="84" height="32" rx="5" fill="#ffffff" opacity="0"><animate attributeName="opacity" values="0;0;0.95;0.95" keyTimes="0;0.34;0.48;1" dur="9.5s" repeatCount="indefinite"/></rect><rect x="284" y="112" width="60" height="32" rx="5" fill="#ffffff" opacity="0"><animate attributeName="opacity" values="0;0;0.95;0.95" keyTimes="0;0.34;0.48;1" dur="9.5s" repeatCount="indefinite"/></rect><g opacity="0"><rect x="50" y="214" width="66" height="32" rx="5" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.6"/><text x="83.0" y="235" text-anchor="middle" font-size="11" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">外显子1</text><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.3333;0.3339;1" dur="9.5s" repeatCount="indefinite"/></g><g opacity="0"><rect x="120" y="214" width="66" height="32" rx="5" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.6"/><text x="153.0" y="235" text-anchor="middle" font-size="11" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">外显子2</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3333;0.3339;0.6667;0.6673;1" dur="9.5s" repeatCount="indefinite"/></g><g opacity="0"><rect x="190" y="214" width="34" height="32" rx="5" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.6"/><text x="207.0" y="235" text-anchor="middle" font-size="11" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">外显子3</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.6667;0.6673;1" dur="9.5s" repeatCount="indefinite"/></g><text x="34" y="206" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">成熟 mRNA（外显子连续）</text><path d="M240,230 H360" stroke="#64748b" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/><text x="364" y="234" text-anchor="end" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">5′UTR/3′UTR 也属外显子</text><rect x="34" y="272" width="352" height="52" rx="7" fill="#fef3c7" stroke="#a8791a" stroke-width="1.3"/><text x="44" y="292" font-size="11.5" fill="#a8791a" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">可变剪接 → 一个基因多种 mRNA</text><text x="44" y="312" font-size="11" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">人类约 95% 的多外显子基因存在可变剪接 → 蛋白多样性</text><text font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><tspan x="210.0" y="344" text-anchor="middle" opacity="0" fill="#0f766e" font-size="11.5" font-weight="700">① 转录出前体 mRNA<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.28;0.2806;1" dur="9.5s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="344" text-anchor="middle" opacity="0" fill="#a8791a" font-size="11.5" font-weight="700">② 剪接体识别位点<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.28;0.2806;0.52;0.5206;1" dur="9.5s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="344" text-anchor="middle" opacity="0" fill="#c1440e" font-size="11.5" font-weight="700">③ 内含子成套索切除<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.52;0.5206;0.76;0.7606;1" dur="9.5s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="344" text-anchor="middle" opacity="0" fill="#0f766e" font-size="11.5" font-weight="700">④ 外显子拼接成熟<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.76;0.7606;1" dur="9.5s" repeatCount="indefinite"/></tspan></text><path d="M34,362 H386" stroke="#e2e8f0" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.35"/><path d="M132.6,357 L132.6,367 M217.0,357 L217.0,367 M301.5,357 L301.5,367" stroke="#e2e8f0" stroke-width="1.1" fill="none"/><circle cy="362" r="5.4" fill="#1e293b" stroke="#ffffff" stroke-width="2"><animateTransform attributeName="transform" type="translate" values="34.0,0;39.9,0;45.7,0;51.6,0;57.5,0;63.3,0;69.2,0;75.1,0;80.9,0;86.8,0;92.7,0;98.5,0;104.4,0;110.3,0;116.1,0;122.0,0;127.9,0;133.7,0;139.6,0;145.5,0;151.3,0;157.2,0;163.1,0;168.9,0;174.8,0;180.7,0;186.5,0;192.4,0;198.3,0;204.1,0;210.0,0;215.9,0;221.7,0;227.6,0;233.5,0;239.3,0;245.2,0;251.1,0;256.9,0;262.8,0;268.7,0;274.5,0;280.4,0;286.3,0;292.1,0;298.0,0;303.9,0;309.7,0;315.6,0;321.5,0;327.3,0;333.2,0;339.1,0;344.9,0;350.8,0;356.7,0;362.5,0;368.4,0;374.3,0;380.1,0;386.0,0" keyTimes="0;0.0167;0.0333;0.05;0.0667;0.0833;0.1;0.1167;0.1333;0.15;0.1667;0.1833;0.2;0.2167;0.2333;0.25;0.2667;0.2833;0.3;0.3167;0.3333;0.35;0.3667;0.3833;0.4;0.4167;0.4333;0.45;0.4667;0.4833;0.5;0.5167;0.5333;0.55;0.5667;0.5833;0.6;0.6167;0.6333;0.65;0.6667;0.6833;0.7;0.7167;0.7333;0.75;0.7667;0.7833;0.8;0.8167;0.8333;0.85;0.8667;0.8833;0.9;0.9167;0.9333;0.95;0.9667;0.9833;1" dur="9.5s" repeatCount="indefinite" calcMode="linear"/></circle></svg>