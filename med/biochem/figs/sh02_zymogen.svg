<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 500" role="img" aria-labelledby="ft fd" style="background:#ffffff"><title id="ft">酶原激活的机制</title><desc id="fd">酶原比活性酶多一段激活肽，掩蔽活性中心；肠激酶或酸将其有限水解去除后，活性中心暴露、酶被激活，已激活的酶再激活更多酶原。</desc><text x="210.0" y="28" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="0.55s" fill="freeze" calcMode="spline" keySplines="0.23 1 0.32 1"/>酶原激活：切一刀就开工<tspan x="210.0" y="48" text-anchor="middle" font-size="11" fill="#64748b" font-weight="400">本质是肽键有限水解，不可逆、一次性</tspan></text><path d="M46,160 H374" stroke="#e2e8f0" stroke-width="1.6"/><circle cx="60.0" cy="160" r="6.5" fill="#dbe3ec" stroke="#64748b" stroke-width="1"/><circle cx="97.5" cy="160" r="6.5" fill="#dbe3ec" stroke="#64748b" stroke-width="1"/><circle cx="135.0" cy="160" r="6.5" fill="#dbe3ec" stroke="#64748b" stroke-width="1"/><circle cx="172.5" cy="160" r="6.5" fill="#dbe3ec" stroke="#64748b" stroke-width="1"/><circle cx="210.0" cy="160" r="6.5" fill="#dbe3ec" stroke="#64748b" stroke-width="1"/><circle cx="247.5" cy="160" r="6.5" fill="#dbe3ec" stroke="#64748b" stroke-width="1"/><circle cx="285.0" cy="160" r="6.5" fill="#dbe3ec" stroke="#64748b" stroke-width="1"/><circle cx="322.5" cy="160" r="6.5" fill="#dbe3ec" stroke="#64748b" stroke-width="1"/><circle cx="360.0" cy="160" r="6.5" fill="#dbe3ec" stroke="#64748b" stroke-width="1"/><rect x="44" y="147" width="150" height="26" rx="8" fill="#fde8dd" stroke="#c1440e" stroke-width="1.6" opacity="0.95"><animate attributeName="opacity" values="0.95;0.95;0.12;0.12" keyTimes="0;0.22;0.51;1" dur="8.0s" repeatCount="indefinite"/></rect><text x="116" y="138" text-anchor="middle" font-size="11" fill="#c1440e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">N 端激活肽（示意）</text><g opacity="0"><text x="196" y="167" text-anchor="middle" font-size="17" fill="#c1440e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">✂</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.22;0.27;0.46;0.52;1" dur="8.0s" repeatCount="indefinite"/></g><g opacity="0.15"><path d="M282,152 q14,18 28,0" fill="#dcfce7" stroke="#2f8f57" stroke-width="2"/><circle cx="292" cy="154" r="5.5" fill="#2f8f57"/><circle cx="300" cy="154" r="5.5" fill="#2f8f57"/><text x="296" y="138" text-anchor="middle" font-size="11" fill="#2f8f57" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">活性中心</text><animate attributeName="opacity" values="0.15;0.15;0.15;1;1" keyTimes="0;0.22;0.26;0.46;1" dur="8.0s" repeatCount="indefinite"/></g><circle r="10" fill="#0f766e" opacity="0"><animate attributeName="opacity" values="0;0;0;1;1" keyTimes="0;0.46;0.49;0.58;1" dur="8.0s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="392,104;392,104;296,144;296,144" keyTimes="0;0.46;0.6;1" dur="8.0s" repeatCount="indefinite" calcMode="spline" keySplines="0.23 1 0.32 1;0.45 0 0.55 1;0.23 1 0.32 1"/></circle><text x="210" y="232" text-anchor="middle" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" opacity="0">一个胰蛋白酶 → 激活更多胰蛋白酶原<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.46;0.7;1" dur="8.0s" repeatCount="indefinite"/></text><text x="34" y="268" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">活化酶量</text><rect x="34" y="278" width="18" height="16" rx="4" fill="#2f8f57" opacity="0.35"/><rect x="84" y="278" width="34" height="16" rx="4" fill="#2f8f57" opacity="0.55"/><rect x="150" y="278" width="62" height="16" rx="4" fill="#2f8f57" opacity="0.75"/><rect x="230" y="278" width="100" height="16" rx="4" fill="#2f8f57" opacity="0.95"/><path d="M34,300 H386" stroke="#e2e8f0" stroke-width="1"/><text x="34" y="316" font-size="11" fill="#2f8f57" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">每一轮激活都让活性酶数量翻倍 —— 这就是「级联放大」</text><text font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><tspan x="210.0" y="352" text-anchor="middle" opacity="0" fill="#64748b" font-size="12" font-weight="700">① 酶原：多一段肽，活性中心被挡住<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.22;0.2206;1" dur="8.0s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="352" text-anchor="middle" opacity="0" fill="#c1440e" font-size="12" font-weight="700">② 肠激酶切掉 6 肽<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.22;0.2206;0.46;0.4606;1" dur="8.0s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="352" text-anchor="middle" opacity="0" fill="#2f8f57" font-size="12" font-weight="700">③ 活性中心暴露<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.46;0.4606;0.7;0.7006;1" dur="8.0s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="352" text-anchor="middle" opacity="0" fill="#0f766e" font-size="12" font-weight="700">④ 自身催化放大<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.7;0.7006;1" dur="8.0s" repeatCount="indefinite"/></tspan></text><path d="M34,372 H386" stroke="#e2e8f0" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.35"/><path d="M111.4,367 L111.4,377 M195.9,367 L195.9,377 M280.4,367 L280.4,377" stroke="#e2e8f0" stroke-width="1.1" fill="none"/><circle cy="372" r="5.4" fill="#1e293b" stroke="#ffffff" stroke-width="2"><animateTransform attributeName="transform" type="translate" values="34.0,0;39.9,0;45.7,0;51.6,0;57.5,0;63.3,0;69.2,0;75.1,0;80.9,0;86.8,0;92.7,0;98.5,0;104.4,0;110.3,0;116.1,0;122.0,0;127.9,0;133.7,0;139.6,0;145.5,0;151.3,0;157.2,0;163.1,0;168.9,0;174.8,0;180.7,0;186.5,0;192.4,0;198.3,0;204.1,0;210.0,0;215.9,0;221.7,0;227.6,0;233.5,0;239.3,0;245.2,0;251.1,0;256.9,0;262.8,0;268.7,0;274.5,0;280.4,0;286.3,0;292.1,0;298.0,0;303.9,0;309.7,0;315.6,0;321.5,0;327.3,0;333.2,0;339.1,0;344.9,0;350.8,0;356.7,0;362.5,0;368.4,0;374.3,0;380.1,0;386.0,0" keyTimes="0;0.0167;0.0333;0.05;0.0667;0.0833;0.1;0.1167;0.1333;0.15;0.1667;0.1833;0.2;0.2167;0.2333;0.25;0.2667;0.2833;0.3;0.3167;0.3333;0.35;0.3667;0.3833;0.4;0.4167;0.4333;0.45;0.4667;0.4833;0.5;0.5167;0.5333;0.55;0.5667;0.5833;0.6;0.6167;0.6333;0.65;0.6667;0.6833;0.7;0.7167;0.7333;0.75;0.7667;0.7833;0.8;0.8167;0.8333;0.85;0.8667;0.8833;0.9;0.9167;0.9333;0.95;0.9667;0.9833;1" dur="8.0s" repeatCount="indefinite" calcMode="linear"/></circle></svg>