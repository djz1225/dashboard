<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 500" role="img" aria-labelledby="ft fd" style="background:#ffffff"><title id="ft">蛋白质折叠的四级层次</title><desc id="fd">一条肽链先形成 α 螺旋，再靠疏水作用塌缩成三级结构，多条肽链以非共价键组装成四级结构。</desc><text x="210.0" y="28" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="0.55s" fill="freeze" calcMode="spline" keySplines="0.23 1 0.32 1"/>一条肽链怎样折成功能蛋白<tspan x="210.0" y="48" text-anchor="middle" font-size="11" fill="#64748b" font-weight="400">一级序列 → 二级 → 三级 → 四级；驱动力逐层不同</tspan></text><g opacity="1"><polyline points="40.0,158 64.2,178 88.4,158 112.6,178 136.8,158 161.0,178 185.2,158 209.4,178 233.6,158 257.8,178 282.0,158 306.2,178 330.4,158 354.6,178 378.8,158" fill="none" stroke="#64748b" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/><animate attributeName="opacity" values="1;1;1;0;0" keyTimes="0;0;0.22;0.265;1" dur="10.0s" repeatCount="indefinite"/></g><g opacity="0"><path d="M210.0,133.9 L217.7,134.3 L225.1,136.1 L231.4,139.3 L236.0,143.5 L238.4,148.5 L238.4,153.7 L235.8,158.9 L230.8,163.4 L223.8,166.8 L215.4,168.9 L206.2,169.4 L197.0,168.1 L188.7,165.2 L182.0,160.8 L177.6,155.4 L176.0,149.3 L177.4,143.0 L181.7,137.2 L188.6,132.4 L197.7,129.0 L208.1,127.4 L219.0,127.7 L229.3,130.1 L238.2,134.2 L244.9,139.9 L248.6,146.6 L249.0,153.8 L246.0,160.9 L239.6,167.1 L230.5,172.0 L219.3,175.1 L207.1,176.0 L194.8,174.6 L183.5,171.0 L174.4,165.5 L168.2,158.4 L165.5,150.5 L166.7,142.3 L171.8,134.6 L180.4,128.2 L191.8,123.5 L205.1,121.0 L219.1,121.1 L232.5,123.7 L244.3,128.7 L253.3,135.7 L258.6,144.1 L259.7,153.2 L256.5,162.2 L249.1,170.3 L238.0,176.8 L224.3,181.0 L209.1,182.5 L193.6,181.3 L179.3,177.2 L167.4,170.6 L159.1,162.1 L155.1,152.4 L155.9,142.3 L161.5,132.6 L171.5,124.4 L185.0,118.2 L201.0,114.8 L218.1,114.4 L234.7,117.1 L249.5,122.8 L261.0,131.0 L268.2,141.0 L