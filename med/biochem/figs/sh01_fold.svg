="322" text-anchor="middle" opacity="0" fill="#c0392b" font-size="12.5" font-weight="700">③ 三级：疏水作用塌缩出疏水核<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.48;0.4806;0.76;0.7606;1" dur="10.0s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="322" text-anchor="middle" opacity="0" fill="#a8791a" font-size="12.5" font-weight="700">④ 四级：亚基间全靠非共价键<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.76;0.7606;1" dur="10.0s" repeatCount="indefinite"/></tspan></text><path d="M34,342 H386" stroke="#e2e8f0" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.35"/><path d="M111.4,337 L111.4,347 M203.0,337 L203.0,347 M301.5,337 L301.5,347" stroke="#e2e8f0" stroke-width="1.1" fill="none"/><circle cy="342" r="5.4" fill="#1e293b" stroke="#ffffff" stroke-width="2"><animateTransform attributeName="transform" type="translate" values="34.0,0;39.9,0;45.7,0;51.6,0;57.5,0;63.3,0;69.2,0;75.1,0;80.9,0;86.8,0;92.7,0;98.5,0;104.4,0;110.3,0;116.1,0;122.0,0;127.9,0;133.7,0;139.6,0;145.5,0;151.3,0;157.2,0;163.1,0;168.9,0;174.8,0;180.7,0;186.5,0;192.4,0;198.3,0;204.1,0;210.0,0;215.9,0;221.7,0;227.6,0;233.5,0;239.3,0;245.2,0;251.1,0;256.9,0;262.8,0;268.7,0;274.5,0;280.4,0;286.3,0;292.1,0;298.0,0;303.9,0;309.7,0;315.6,0;321.5,0;327.3,0;333.2,0;339.1,0;344.9,0;350.8,0;356.7,0;362.5,0;368.4,0;374.3,0;380.1,0;386.0,0" keyTimes="0;0.0167;0.0333;0.05;0.0667;0.0833;0.1;0.1167;0.1333;0.15;0.1667;0.1833;0.2;0.2167;0.2333;0.25;0.2667;0.2833;0.3;0.3167;0.3333;0.35;0.3667;0.3833;0.4;0.4167;0.4333;0.45;0.4667;0.4833;0.5;0.5167;0.5333;0.55;0.5667;0.5833;0.6;0.6167;0.6333;0.65;0.6667;0.6833;0.7;0.7167;0.7333;0.75;0.7667;0.7833;0.8;0.8167;0.8333;0.85;0.8667;0.8833;0.9;0.9167;0.9333;0.95;0.9667;0.9833;1" dur="10.0s" repeatCount="indefinite" calcMode="linear"/></circle></svg>