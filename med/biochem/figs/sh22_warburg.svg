<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 500" role="img" aria-labelledby="ft fd" style="background:#ffffff"><title id="ft">Warburg 效应</title><desc id="fd">肿瘤细胞即使在有氧条件下也大量进行糖酵解。虽然每分子葡萄糖产 ATP 少，但通量大、可提供生物合成前体与 NADPH，并产生乳酸酸化微环境。</desc><text x="210.0" y="28" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="0.55s" fill="freeze" calcMode="spline" keySplines="0.23 1 0.32 1"/>Warburg 效应：有氧也糖酵解<tspan x="210.0" y="48" text-anchor="middle" font-size="11" fill="#64748b" font-weight="400">效率低但速度快、前体多、NADPH 足</tspan></text><text x="34" y="104" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">正常细胞（有氧）</text><rect x="34" y="112" width="352" height="20" rx="5" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><rect x="34" y="112" width="330" height="20" rx="5" fill="#0f766e" opacity="0.7"/><text x="200" y="126" text-anchor="middle" font-size="11" fill="#ffffff" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">有氧氧化：约 30 ATP/葡萄糖</text><text x="34" y="154" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">肿瘤细胞（有氧）</text><rect x="34" y="162" width="352" height="20" rx="5" fill="#fde8dd" stroke="#c1440e" stroke-width="1.2"/><rect x="34" y="162" width="46" height="20" rx="5" fill="#c1440e" opacity="0.75"/><text x="120" y="176" text-anchor="start" font-size="11" fill="#c1440e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">糖酵解：仅 2 ATP，但通量极大</text><rect x="34" y="200" width="352" height="38" rx="6" fill="#ffffff" stroke="#0f766e" stroke-width="1.3"/><text x="44" y="217" font-size="11.5" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">① 速度快</text><text x="44" y="232" font-size="11" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">单位时间 ATP 产量更高（通量大）</text><rect x="34" y="244" width="352" height="38" rx="6" fill="#ffffff" stroke="#a8791a" stroke-width="1.3"/><text x="44" y="261" font-size="11.5" fill="#a8791a" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">② 前体多</text><text x="44" y="276" font-size="11" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">糖酵解中间物转成核糖、氨基酸、脂肪酸</text><rect x="34" y="288" width="352" height="38" rx="6" fill="#ffffff" stroke="#2f8f57" stroke-width="1.3"/><text x="44" y="305" font-size="11.5" fill="#2f8f57" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">③ NADPH 足</text><text x="44" y="320" font-size="11" fill="#475569" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">PPP 支路供还原力，支持合成与抗氧化</text><text x="210" y="350" text-anchor="middle" font-size="11" fill="#c1440e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">副产物乳酸 → 酸化微环境 → 促侵袭、抑免疫</text><text font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><tspan x="210.0" y="372" text-anchor="middle" opacity="0" fill="#c1440e" font-size="11.5" font-weight="700">① 缺氧/HIF 驱动<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.26;0.2606;1" dur="9.5s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="372" text-anchor="middle" opacity="0" fill="#a8791a" font-size="11.5" font-weight="700">② 糖酵解酶上调<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.26;0.2606;0.52;0.5206;1" dur="9.5s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="372" text-anchor="middle" opacity="0" fill="#2f8f57" font-size="11.5" font-weight="700">③ NADPH 支路补偿<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.52;0.5206;0.76;0.7606;1" dur="9.5s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="372" text-anchor="middle" opacity="0" fill="#c1440e" font-size="11.5" font-weight="700">④ 乳酸外排<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.76;0.7606;1" dur="9.5s" repeatCount="indefinite"/></tspan></text><path d="M34,390 H386" stroke="#e2e8f0" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.35"/><path d="M125.5,385 L125.5,395 M217.0,385 L217.0,395 M301.5,385 L301.5,395" stroke="#e2e8f0" stroke-width="1.1" fill="none"/><circle cy="390" r="5.4" fill="#1e293b" stroke="#ffffff" stroke-width="2"><animateTransform attributeName="transform" type="translate" values="34.0,0;39.9,0;45.7,0;51.6,0;57.5,0;63.3,0;69.2,0;75.1,0;80.9,0;86.8,0;92.7,0;98.5,0;104.4,0;110.3,0;116.1,0;122.0,0;127.9,0;133.7,0;139.6,0;145.5,0;151.3,0;157.2,0;163.1,0;168.9,0;174.8,0;180.7,0;186.5,0;192.4,0;198.3,0;204.1,0;210.0,0;215.9,0;221.7,0;227.6,0;233.5,0;239.3,0;245.2,0;251.1,0;256.9,0;262.8,0;268.7,0;274.5,0;280.4,0;286.3,0;292.1,0;298.0,0;303.9,0;309.7,0;315.6,0;321.5,0;327.3,0;333.2,0;339.1,0;344.9,0;350.8,0;356.7,0;362.5,0;368.4,0;374.3,0;380.1,0;386.0,0" keyTimes="0;0.0167;0.0333;0.05;0.0667;0.0833;0.1;0.1167;0.1333;0.15;0.1667;0.1833;0.2;0.2167;0.2333;0.25;0.2667;0.2833;0.3;0.3167;0.3333;0.35;0.3667;0.3833;0.4;0.4167;0.4333;0.45;0.4667;0.4833;0.5;0.5167;0.5333;0.55;0.5667;0.5833;0.6;0.6167;0.6333;0.65;0.6667;0.6833;0.7;0.7167;0.7333;0.75;0.7667;0.7833;0.8;0.8167;0.8333;0.85;0.8667;0.8833;0.9;0.9167;0.9333;0.95;0.9667;0.9833;1" dur="9.5s" repeatCount="indefinite" calcMode="linear"/></circle></svg>