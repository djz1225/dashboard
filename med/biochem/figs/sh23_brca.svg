<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 500" role="img" aria-labelledby="ft fd" style="background:#ffffff"><title id="ft">PARP 抑制剂与 BRCA 的合成致死</title><desc id="fd">抑制 PARP 使单链断裂堆积并在复制时转为双链断裂。正常细胞可用同源重组修复，而 BRCA1/2 缺陷的肿瘤细胞丧失该能力，因而被选择性杀死。</desc><text x="210.0" y="28" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="0.55s" fill="freeze" calcMode="spline" keySplines="0.23 1 0.32 1"/>合成致死：两个都坏才死<tspan x="210.0" y="48" text-anchor="middle" font-size="11" fill="#64748b" font-weight="400">PARP 抑制剂只杀 BRCA 缺陷的肿瘤</tspan></text><rect x="34" y="100" width="168" height="196" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/><text x="118.0" y="120" text-anchor="middle" font-size="12" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">正常细胞</text><text x="118.0" y="138" text-anchor="middle" font-size="11" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">单链断裂</text><text x="118.0" y="154" text-anchor="middle" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">堆积</text><text x="118.0" y="188" text-anchor="middle" font-size="11" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">→ 变双链断裂</text><text x="118.0" y="204" text-anchor="middle" font-size="11" fill="#a8791a" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">发生</text><text x="118.0" y="238" text-anchor="middle" font-size="11" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">HR 修复</text><text x="118.0" y="254" text-anchor="middle" font-size="11" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">可修复</text><rect x="218" y="100" width="168" height="196" rx="8" fill="#fde8dd" stroke="#c1440e" stroke-width="1.5"/><text x="302.0" y="120" text-anchor="middle" font-size="12" fill="#c1440e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">BRCA 突变肿瘤</text><text x="302.0" y="138" text-anchor="middle" font-size="11" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">单链断裂</text><text x="302.0" y="154" text-anchor="middle" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">堆积</text><text x="302.0" y="188" text-anchor="middle" font-size="11" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">→ 变双链断裂</text><text x="302.0" y="204" text-anchor="middle" font-size="11" fill="#a8791a" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">发生</text><text x="302.0" y="238" text-anchor="middle" font-size="11" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">HR 修复</text><text x="302.0" y="254" text-anchor="middle" font-size="11" fill="#c1440e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">缺陷</text><text x="118" y="312" text-anchor="middle" font-size="11.5" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">→ 存活</text><text x="302" y="312" text-anchor="middle" font-size="11.5" fill="#c1440e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">→ 死亡</text><g opacity="0"><rect x="34" y="96" width="352" height="4" rx="2" fill="#c0392b"/><text x="210" y="330" text-anchor="middle" font-size="11" fill="#c0392b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">PARP 抑制剂：单链断裂不再被修</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.42;0.56;1" dur="10.0s" repeatCount="indefinite"/></g><text font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><tspan x="210.0" y="366" text-anchor="middle" opacity="0" fill="#c0392b" font-size="11.5" font-weight="700">① 抑 PARP：单链断裂堆积<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.26;0.2606;1" dur="10.0s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="366" text-anchor="middle" opacity="0" fill="#a8791a" font-size="11.5" font-weight="700">② 复制时变双链断裂<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.26;0.2606;0.5;0.5006;1" dur="10.0s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="366" text-anchor="middle" opacity="0" fill="#0f766e" font-size="11.5" font-weight="700">③ 正常细胞 HR 可修<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.5006;0.76;0.7606;1" dur="10.0s" repeatCount="indefinite"/></tspan><tspan x="210.0" y="366" text-anchor="middle" opacity="0" fill="#c1440e" font-size="11.5" font-weight="700">④ BRCA 缺陷者无法修<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.76;0.7606;1" dur="10.0s" repeatCount="indefinite"/></tspan></text><path d="M34,384 H386" stroke="#e2e8f0" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.35"/><path d="M125.5,379 L125.5,389 M210.0,379 L210.0,389 M301.5,379 L301.5,389" stroke="#e2e8f0" stroke-width="1.1" fill="none"/><circle cy="384" r="5.4" fill="#1e293b" stroke="#ffffff" stroke-width="2"><animateTransform attributeName="transform" type="translate" values="34.0,0;39.9,0;45.7,0;51.6,0;57.5,0;63.3,0;69.2,0;75.1,0;80.9,0;86.8,0;92.7,0;98.5,0;104.4,0;110.3,0;116.1,0;122.0,0;127.9,0;133.7,0;139.6,0;145.5,0;151.3,0;157.2,0;163.1,0;168.9,0;174.8,0;180.7,0;186.5,0;192.4,0;198.3,0;204.1,0;210.0,0;215.9,0;221.7,0;227.6,0;233.5,0;239.3,0;245.2,0;251.1,0;256.9,0;262.8,0;268.7,0;274.5,0;280.4,0;286.3,0;292.1,0;298.0,0;303.9,0;309.7,0;315.6,0;321.5,0;327.3,0;333.2,0;339.1,0;344.9,0;350.8,0;356.7,0;362.5,0;368.4,0;374.3,0;380.1,0;386.0,0" keyTimes="0;0.0167;0.0333;0.05;0.0667;0.0833;0.1;0.1167;0.1333;0.15;0.1667;0.1833;0.2;0.2167;0.2333;0.25;0.2667;0.2833;0.3;0.3167;0.3333;0.35;0.3667;0.3833;0.4;0.4167;0.4333;0.45;0.4667;0.4833;0.5;0.5167;0.5333;0.55;0.5667;0.5833;0.6;0.6167;0.6333;0.65;0.6667;0.6833;0.7;0.7167;0.7333;0.75;0.7667;0.7833;0.8;0.8167;0.8333;0.85;0.8667;0.8833;0.9;0.9167;0.9333;0.95;0.9667;0.9833;1" dur="10.0s" repeatCount="indefinite" calcMode="linear"/></circle></svg>