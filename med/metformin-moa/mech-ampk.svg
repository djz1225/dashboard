<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" role="img" aria-label="二甲双胍抑制线粒体复合物I，升高AMP/ATP激活AMPK"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F6C75"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A3382C"/></marker></defs><rect width="1000" height="660" fill="#FFFFFF"/><text x="48.0" y="42.0" text-anchor="start" font-size="11.5" fill="#4E5B64" font-weight="700">机制通路之一</text><text x="48.0" y="76.0" text-anchor="start" font-size="22" fill="#1B2A33" font-weight="700">① 分子起点：复合物 Ⅰ → AMPK</text><text x="48.0" y="106.0" text-anchor="start" font-size="13.5" fill="#37474F" font-weight="400">能量的「低电量警报」：ATP 下降、AMP 上升，AMPK 被磷酸化激活</text><rect x="100.0" y="132.0" width="710.0" height="96.0" rx="12" fill="#FFFFFF" stroke="#6B46C1" stroke-width="1.6"/><rect x="100.0" y="132.0" width="6.0" height="96.0" rx="3" fill="#6B46C1"/><text x="128.0" y="166.0" text-anchor="start" font-size="16" fill="#1B2A33" font-weight="700">二甲双胍</text><text x="128.0" y="192.0" text-anchor="start" font-size="12.5" fill="#6B46C1" font-weight="600">进入肝细胞，聚集于线粒体</text><text x="128.0" y="214.0" text-anchor="start" font-size="11.5" fill="#37474F" font-weight="400">亲水性小分子，经有机阳离子转运体（OCT1/2）进入细胞</text><line x1="455.0" y1="230.0" x2="455.0" y2="246.0" stroke="#6B46C1" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ah)"/><rect x="100.0" y="248.0" width="710.0" height="96.0" rx="12" fill="#FFFFFF" stroke="#A3382C" stroke-width="1.6"/><rect x="100.0" y="248.0" width="6.0" height="96.0" rx="3" fill="#A3382C"/><text x="128.0" y="282.0" text-anchor="start" font-size="16" fill="#1B2A33" font-weight="700">抑制线粒体复合物 Ⅰ</text><text x="128.0" y="308.0" text-anchor="start" font-size="12.5" fill="#A3382C" font-weight="600">呼吸链 NADH 脱氢酶被部分抑制</text><text x="128.0" y="330.0" text-anchor="start" font-size="11.5" fill="#37474F" font-weight="400">减少质子泵出 → 线粒体 ATP 合成下降（不是「解偶联」）</text><line x1="455.0" y1="346.0" x2="455.0" y2="355.0" stroke="#A3382C" stroke-width="2.6" stroke-linecap="round"/><line x1="463.0" y1="355.0" x2="447.0" y2="355.0" stroke="#A3382C" stroke-width="2.6" stroke-linecap="round"/><rect x="100.0" y="364.0" width="710.0" height="96.0" rx="12" fill="#FFFFFF" stroke="#8A5A12" stroke-width="1.6"/><rect x="100.0" y="364.0" width="6.0" height="96.0" rx="3" fill="#8A5A12"/><text x="128.0" y="398.0" text-anchor="start" font-size="16" fill="#1B2A33" font-weight="700">ATP↓　AMP↑</text><text x="128.0" y="424.0" text-anchor="start" font-size="12.5" fill="#8A5A12" font-weight="600">AMP/ATP 比值升高</text><text x="128.0" y="446.0" text-anchor="start" font-size="11.5" fill="#37474F" font-weight="400">这是细胞能量应激的信号；AMP 上升幅度虽小，但比值变化显著</text><line x1="455.0" y1="462.0" x2="455.0" y2="478.0" stroke="#8A5A12" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ah)"/><rect x="100.0" y="480.0" width="710.0" height="96.0" rx="12" fill="#FFFFFF" stroke="#6B46C1" stroke-width="2.2"/><rect x="100.0" y="480.0" width="6.0" height="96.0" rx="3" fill="#1C6B45"/><text x="128.0" y="514.0" text-anchor="start" font-size="16" fill="#1B2A33" font-weight="700">AMPK 磷酸化激活</text><text x="128.0" y="540.0" text-anchor="start" font-size="12.5" fill="#1C6B45" font-weight="600">LKB1 介导 Thr172 磷酸化</text><text x="128.0" y="562.0" text-anchor="start" font-size="11.5" fill="#37474F" font-weight="400">AMPK 是能量代谢的总开关：开启分解代谢、关闭合成代谢</text><rect x="904.0" y="132.0" width="88.0" height="444.0" rx="12" fill="#F7FAFC" stroke="#C7D2DC" stroke-width="1.2"/><text x="948.0" y="172.0" text-anchor="middle" font-size="11.5" fill="#4E5B64" font-weight="700">下游 ①</text><text x="948.0" y="214.0" text-anchor="middle" font-size="11.5" fill="#1C6B45" font-weight="700">糖异生↓</text><text x="948.0" y="256.0" text-anchor="middle" font-size="11.5" fill="#4E5B64" font-weight="700">下游 ②</text><text x="948.0" y="298.0" text-anchor="middle" font-size="11.5" fill="#1C6B45" font-weight="700">摄取↑</text><text x="948.0" y="340.0" text-anchor="middle" font-size="11.5" fill="#4E5B64" font-weight="700">下游 ③</text><text x="948.0" y="382.0" text-anchor="middle" font-size="11.5" fill="#1C6B45" font-weight="700">脂氧化↑</text><rect x="48.0" y="610.0" width="904.0" height="78.0" rx="10" fill="#F2FAF5" stroke="#1C6B45" stroke-width="1.4"/><text x="70.0" y="638.0" text-anchor="start" font-size="12.5" fill="#1C6B45" font-weight="700">AMPK 下游三条主线</text><text x="70.0" y="662.0" text-anchor="start" font-size="13.5" fill="#37474F" font-weight="400">① 抑制糖异生基因转录（PEPCK、G6Pase）　② 促进骨骼肌 GLUT4 转位、葡萄糖摄取↑　③ 促进脂肪酸氧化</text><text x="500.0" y="638.0" text-anchor="middle" font-size="11.5" fill="#4E5B64" font-weight="400">注意：二甲双胍并非 AMPK 直接激动剂；AMPK 依赖与非依赖（溶酶体途径）作用并存</text></svg>