<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" role="img" aria-label="二甲双胍抑制肝糖异生，减少肝葡萄糖输出"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F6C75"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A3382C"/></marker></defs><rect width="1000" height="720" fill="#FFFFFF"/><text x="48.0" y="42.0" text-anchor="start" font-size="11.5" fill="#4E5B64" font-weight="700">机制通路之二</text><text x="48.0" y="76.0" text-anchor="start" font-size="22" fill="#1B2A33" font-weight="700">② 肝脏：抑制糖异生</text><text x="48.0" y="106.0" text-anchor="start" font-size="13.5" fill="#37474F" font-weight="400">降糖的主力环节：肝葡萄糖输出占空腹血糖的 80% 以上</text><rect x="48.0" y="132.0" width="436.0" height="330.0" rx="12" fill="#FFFFFF" stroke="#A3382C" stroke-width="1.8"/><rect x="48.0" y="132.0" width="436.0" height="44.0" rx="12" fill="#A3382C"/><text x="266.0" y="161.0" text-anchor="middle" font-size="12.5" fill="#FFFFFF" font-weight="700">胰岛素抵抗（未干预）</text><circle cx="231.12" cy="292" r="70" fill="#F7E3D8" stroke="#8A4A32" stroke-width="2.4"/><ellipse cx="231.12" cy="292" rx="30" ry="24" fill="#EFE2F8" stroke="#6B46C1" stroke-width="1.8"/><text x="231.1" y="296.0" text-anchor="middle" font-size="11.5" fill="#6B46C1" font-weight="700">核</text><text x="231.1" y="250.0" text-anchor="middle" font-size="11.5" fill="#A3382C" font-weight="700">糖异生基因 ↑↑</text><text x="402.0" y="218.0" text-anchor="middle" font-size="12.5" fill="#37474F" font-weight="700">肝糖输出</text><rect x="386.0" y="238.0" width="32.0" height="150.0" rx="4" fill="#A3382C"/><line x1="378.0" y1="390" x2="426.0" y2="390" stroke="#37474F" stroke-width="1.6"/><text x="402.0" y="410.0" text-anchor="middle" font-size="16" fill="#A3382C" font-weight="700">↑</text><text x="266.0" y="406.0" text-anchor="middle" font-size="11.5" fill="#A3382C" font-weight="600">胰岛素信号受阻 → 糖异生基因↑ </text><text x="266.0" y="426.0" text-anchor="middle" font-size="11.5" fill="#A3382C" font-weight="600">→ 血糖升高</text><rect x="516.0" y="132.0" width="436.0" height="330.0" rx="12" fill="#FFFFFF" stroke="#1C6B45" stroke-width="1.8"/><rect x="516.0" y="132.0" width="436.0" height="44.0" rx="12" fill="#1C6B45"/><text x="734.0" y="161.0" text-anchor="middle" font-size="12.5" fill="#FFFFFF" font-weight="700">二甲双胍干预后</text><circle cx="699.12" cy="292" r="70" fill="#F7E3D8" stroke="#8A4A32" stroke-width="2.4"/><ellipse cx="699.12" cy="292" rx="30" ry="24" fill="#EFE2F8" stroke="#6B46C1" stroke-width="1.8"/><text x="699.1" y="296.0" text-anchor="middle" font-size="11.5" fill="#6B46C1" font-weight="700">核</text><text x="699.1" y="334.0" text-anchor="middle" font-size="11.5" fill="#1C6B45" font-weight="700">糖异生基因 ↓</text><text x="870.0" y="218.0" text-anchor="middle" font-size="12.5" fill="#37474F" font-weight="700">肝糖输出</text><rect x="854.0" y="292.0" width="32.0" height="96.0" rx="4" fill="#1C6B45"/><line x1="846.0" y1="390" x2="894.0" y2="390" stroke="#37474F" stroke-width="1.6"/><text x="870.0" y="410.0" text-anchor="middle" font-size="16" fill="#1C6B45" font-weight="700">↓</text><text x="734.0" y="406.0" text-anchor="middle" font-size="11.5" fill="#1C6B45" font-weight="600">AMPK 激活 → 糖异生基因↓ </text><text x="734.0" y="426.0" text-anchor="middle" font-size="11.5" fill="#1C6B45" font-weight="600">→ 肝糖输出↓ → 血糖↓</text><line x1="488.0" y1="287.0" x2="512.0" y2="287.0" stroke="#6B46C1" stroke-width="2.8" stroke-linecap="round" marker-end="url(#ah)"/><rect x="48.0" y="498.0" width="904.0" height="92.0" rx="10" fill="#F7FAFC" stroke="#C7D2DC" stroke-width="1.2"/><text x="70.0" y="526.0" text-anchor="start" font-size="12.5" fill="#1F5FA0" font-weight="700">临床效应（单药治疗的量级）</text><text x="70.0" y="552.0" text-anchor="start" font-size="13.5" fill="#37474F" font-weight="400">HbA1c 降幅 1.1–1.5%（中国人群约 1.8%）｜空腹血糖降 1.5–2.5 mmol/L｜体重轻度下降 1–2 kg</text><text x="70.0" y="576.0" text-anchor="start" font-size="11.5" fill="#8A5A12" font-weight="400">eGFR 30–45 减量慎用；eGFR &lt;30 禁用（乳酸酸中毒风险）</text><text x="500.0" y="698.0" text-anchor="middle" font-size="11.5" fill="#4E5B64" font-weight="400">肝糖输出占空腹血糖 80% 以上，是二甲双胍降糖的主要来源</text></svg>