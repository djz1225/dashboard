<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" role="img" aria-label="二甲双胍作用机制总览：三条通路与完整因果链"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F6C75"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A3382C"/></marker></defs><rect width="1000" height="760" fill="#FFFFFF"/><text x="48.0" y="42.0" text-anchor="start" font-size="11.5" fill="#4E5B64" font-weight="700">机制版 · 内分泌与代谢</text><text x="48.0" y="76.0" text-anchor="start" font-size="22" fill="#1B2A33" font-weight="700">二甲双胍 · 作用机制总览</text><text x="48.0" y="106.0" text-anchor="start" font-size="13.5" fill="#37474F" font-weight="400">一线降糖药：以 AMPK 依赖与非依赖两条路径，减少肝糖输出、改善外周摄取</text><rect x="44.0" y="132.0" width="288.0" height="150.0" rx="14" fill="#FFFFFF" stroke="#C7D2DC" stroke-width="1.6"/><rect x="44.0" y="132.0" width="6.0" height="150.0" rx="3" fill="#6B46C1"/><text x="66.0" y="168.0" text-anchor="start" font-size="19" fill="#6B46C1" font-weight="700">①</text><text x="96.0" y="166.0" text-anchor="start" font-size="16" fill="#1B2A33" font-weight="700">分子起点</text><text x="66.0" y="204.0" text-anchor="start" font-size="12.5" fill="#37474F" font-weight="400">抑制线粒体复合物 Ⅰ → ATP↓、</text><text x="66.0" y="224.0" text-anchor="start" font-size="12.5" fill="#37474F" font-weight="400">AMP↑ → AMPK 激活</text><rect x="356.0" y="132.0" width="288.0" height="150.0" rx="14" fill="#FFFFFF" stroke="#C7D2DC" stroke-width="1.6"/><rect x="356.0" y="132.0" width="6.0" height="150.0" rx="3" fill="#1F5FA0"/><text x="378.0" y="168.0" text-anchor="start" font-size="19" fill="#1F5FA0" font-weight="700">②</text><text x="408.0" y="166.0" text-anchor="start" font-size="16" fill="#1B2A33" font-weight="700">肝脏</text><text x="378.0" y="204.0" text-anchor="start" font-size="12.5" fill="#37474F" font-weight="400">抑制糖异生基因转录 → 肝葡萄糖输出↓</text><rect x="668.0" y="132.0" width="288.0" height="150.0" rx="14" fill="#FFFFFF" stroke="#C7D2DC" stroke-width="1.6"/><rect x="668.0" y="132.0" width="6.0" height="150.0" rx="3" fill="#1C6B45"/><text x="690.0" y="168.0" text-anchor="start" font-size="19" fill="#1C6B45" font-weight="700">③</text><text x="720.0" y="166.0" text-anchor="start" font-size="16" fill="#1B2A33" font-weight="700">外周与肠道</text><text x="690.0" y="204.0" text-anchor="start" font-size="12.5" fill="#37474F" font-weight="400">骨骼肌摄取↑；肠道 GLP-1 </text><text x="690.0" y="224.0" text-anchor="start" font-size="12.5" fill="#37474F" font-weight="400">分泌↑</text><text x="48.0" y="334.0" text-anchor="start" font-size="16" fill="#1B2A33" font-weight="700">完整因果链</text><rect x="48.0" y="350.0" width="106.0" height="52.0" rx="8" fill="#EDF4FA" stroke="#C7D2DC" stroke-width="1.2"/><text x="101.0" y="381.0" text-anchor="middle" font-size="11.5" fill="#1B2A33" font-weight="600">口服给药</text><polygon points="154.0,372 161.0,376 154.0,380" fill="#5F6C75"/><rect x="162.0" y="350.0" width="106.0" height="52.0" rx="8" fill="#EDF4FA" stroke="#C7D2DC" stroke-width="1.2"/><text x="215.0" y="381.0" text-anchor="middle" font-size="11.5" fill="#1B2A33" font-weight="600">抑制复合物 Ⅰ</text><polygon points="268.0,372 275.0,376 268.0,380" fill="#5F6C75"/><rect x="276.0" y="350.0" width="106.0" height="52.0" rx="8" fill="#EDF4FA" stroke="#C7D2DC" stroke-width="1.2"/><text x="329.0" y="381.0" text-anchor="middle" font-size="11.5" fill="#1B2A33" font-weight="600">ATP↓ / AMP↑</text><polygon points="382.0,372 389.0,376 382.0,380" fill="#5F6C75"/><rect x="390.0" y="350.0" width="106.0" height="52.0" rx="8" fill="#EFEAFB" stroke="#6B46C1" stroke-width="1.8"/><text x="443.0" y="381.0" text-anchor="middle" font-size="11.5" fill="#6B46C1" font-weight="700">AMPK 激活</text><polygon points="496.0,372 503.0,376 496.0,380" fill="#5F6C75"/><rect x="504.0" y="350.0" width="106.0" height="52.0" rx="8" fill="#EDF4FA" stroke="#C7D2DC" stroke-width="1.2"/><text x="557.0" y="381.0" text-anchor="middle" font-size="11.5" fill="#1B2A33" font-weight="600">糖异生↓ + 摄取↑</text><polygon points="610.0,372 617.0,376 610.0,380" fill="#5F6C75"/><rect x="618.0" y="350.0" width="106.0" height="52.0" rx="8" fill="#EDF4FA" stroke="#C7D2DC" stroke-width="1.2"/><text x="671.0" y="381.0" text-anchor="middle" font-size="11.5" fill="#1B2A33" font-weight="600">肝糖输出↓</text><polygon points="724.0,372 731.0,376 724.0,380" fill="#5F6C75"/><rect x="732.0" y="350.0" width="106.0" height="52.0" rx="8" fill="#EDF4FA" stroke="#C7D2DC" stroke-width="1.2"/><text x="785.0" y="381.0" text-anchor="middle" font-size="11.5" fill="#1B2A33" font-weight="600">空腹血糖↓</text><polygon points="838.0,372 845.0,376 838.0,380" fill="#5F6C75"/><rect x="846.0" y="350.0" width="106.0" height="52.0" rx="8" fill="#EDF4FA" stroke="#C7D2DC" stroke-width="1.2"/><text x="899.0" y="381.0" text-anchor="middle" font-size="11.5" fill="#1B2A33" font-weight="600">HbA1c↓</text><rect x="48.0" y="438.0" width="904.0" height="106.0" rx="10" fill="#FCF8EE" stroke="#8A5A12" stroke-width="1.4"/><text x="70.0" y="466.0" text-anchor="start" font-size="12.5" fill="#8A5A12" font-weight="700">三个必须区分的点</text><text x="70.0" y="492.0" text-anchor="start" font-size="13.5" fill="#37474F" font-weight="400">· 降糖主力是「肝糖输出↓」，不是促胰岛素分泌</text><text x="70.0" y="516.0" text-anchor="start" font-size="13.5" fill="#37474F" font-weight="400">· 单用不引起低血糖，也不增加体重</text><text x="70.0" y="540.0" text-anchor="start" font-size="13.5" fill="#37474F" font-weight="400">· 与磺脲/胰岛素联用时才需警惕低血糖</text><text x="500.0" y="736.0" text-anchor="middle" font-size="11.5" fill="#4E5B64" font-weight="400">常用起始 500 mg qd/bid，随餐服用以减少胃肠反应；eGFR&lt;30 禁用、30–45 减量慎用</text></svg>