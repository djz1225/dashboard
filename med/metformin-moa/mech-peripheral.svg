<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" role="img" aria-label="二甲双胍改善外周葡萄糖摄取与肠道GLP-1分泌"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F6C75"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A3382C"/></marker></defs><rect width="1000" height="660" fill="#FFFFFF"/><text x="48.0" y="42.0" text-anchor="start" font-size="11.5" fill="#4E5B64" font-weight="700">机制通路之三</text><text x="48.0" y="76.0" text-anchor="start" font-size="22" fill="#1B2A33" font-weight="700">③ 外周与肠道：摄取↑ 与 GLP-1↑</text><text x="48.0" y="106.0" text-anchor="start" font-size="13.5" fill="#37474F" font-weight="400">除肝脏外，骨骼肌摄取增加与肠道 GLP-1 分泌上调共同参与降糖</text><rect x="48.0" y="132.0" width="436.0" height="290.0" rx="12" fill="#FFFFFF" stroke="#1C6B45" stroke-width="1.8"/><rect x="48.0" y="132.0" width="436.0" height="44.0" rx="12" fill="#1C6B45"/><text x="266.0" y="161.0" text-anchor="middle" font-size="12.5" fill="#FFFFFF" font-weight="700">骨骼肌：GLUT4 转位↑</text><rect x="516.0" y="132.0" width="436.0" height="290.0" rx="12" fill="#FFFFFF" stroke="#1F5FA0" stroke-width="1.8"/><rect x="516.0" y="132.0" width="436.0" height="44.0" rx="12" fill="#1F5FA0"/><text x="734.0" y="161.0" text-anchor="middle" font-size="12.5" fill="#FFFFFF" font-weight="700">肠道：GLP-1 分泌↑</text><circle cx="206.0" cy="282" r="72" fill="#F7E3D8" stroke="#8A4A32" stroke-width="2.4"/><text x="206.0" y="287.0" text-anchor="middle" font-size="11.5" fill="#1B2A33" font-weight="700">肌细胞</text><rect x="158.0" y="324.0" width="16.0" height="16.0" rx="4" fill="#1C6B45"/><rect x="208.0" y="336.0" width="16.0" height="16.0" rx="4" fill="#1C6B45"/><rect x="120.0" y="268.0" width="16.0" height="16.0" rx="4" fill="#1C6B45"/><rect x="270.0" y="264.0" width="16.0" height="16.0" rx="4" fill="#1C6B45"/><text x="146.0" y="248.0" text-anchor="middle" font-size="11.5" fill="#1C6B45" font-weight="700">GLUT4 转位至膜</text><circle cx="304.0" cy="252" r="7" fill="#8A5A12" opacity="0.9"/><circle cx="304.0" cy="274" r="7" fill="#8A5A12" opacity="0.9"/><circle cx="304.0" cy="296" r="7" fill="#8A5A12" opacity="0.9"/><circle cx="304.0" cy="318" r="7" fill="#8A5A12" opacity="0.9"/><line x1="318.0" y1="272.0" x2="284.0" y2="272.0" stroke="#8A5A12" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ah)"/><text x="324.0" y="238.0" text-anchor="start" font-size="11.5" fill="#8A5A12" font-weight="600">葡萄糖</text><text x="266.0" y="376.0" text-anchor="middle" font-size="11.5" fill="#1C6B45" font-weight="600">AMPK 激活 → GLUT4 由胞内转位至</text><text x="266.0" y="395.0" text-anchor="middle" font-size="11.5" fill="#1C6B45" font-weight="600">细胞膜 → 胰岛素非依赖性葡萄糖摄取增加</text><path d="M566.0,262 Q636.0,236 706.0,262 T902.0,262" fill="none" stroke="#8A5A12" stroke-width="4"/><text x="734.0" y="220.0" text-anchor="middle" font-size="11.5" fill="#8A5A12" font-weight="600">肠腔（葡萄糖、胆汁酸）</text><ellipse cx="734.0" cy="330" rx="60" ry="42" fill="#EAF1FA" stroke="#1F5FA0" stroke-width="2.2"/><text x="734.0" y="335.0" text-anchor="middle" font-size="11.5" fill="#1F5FA0" font-weight="700">L 细胞</text><circle cx="710.0" cy="268" r="7.5" fill="#1F5FA0" opacity="0.9"/><circle cx="734.0" cy="262" r="7.5" fill="#1F5FA0" opacity="0.9"/><circle cx="758.0" cy="256" r="7.5" fill="#1F5FA0" opacity="0.9"/><line x1="734.0" y1="286.0" x2="734.0" y2="252.0" stroke="#1F5FA0" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ah)"/><text x="750.0" y="242.0" text-anchor="start" font-size="11.5" fill="#1F5FA0" font-weight="700">GLP-1 ↑</text><text x="734.0" y="376.0" text-anchor="middle" font-size="11.5" fill="#1F5FA0" font-weight="600">二甲双胍上调肠道 L 细胞 GLP-1 分泌</text><text x="734.0" y="395.0" text-anchor="middle" font-size="11.5" fill="#1F5FA0" font-weight="600"> → 促胰岛素分泌、抑制胰高血糖素</text><rect x="48.0" y="458.0" width="904.0" height="76.0" rx="10" fill="#FCF8EE" stroke="#8A5A12" stroke-width="1.4"/><text x="70.0" y="484.0" text-anchor="start" font-size="12.5" fill="#8A5A12" font-weight="700">为什么二甲双胍单用不低血糖</text><text x="70.0" y="508.0" text-anchor="start" font-size="13.5" fill="#37474F" font-weight="400">它不直接刺激胰岛素分泌，只在血糖偏高、需要外周摄取时发挥作用；血糖正常时效应自然减弱。</text><text x="500.0" y="638.0" text-anchor="middle" font-size="11.5" fill="#4E5B64" font-weight="400">外周摄取约占二甲双胍降糖作用的次要部分；肝糖输出下降是主力</text></svg>