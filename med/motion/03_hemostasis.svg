<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480" role="img" aria-labelledby="ft fd" style="background:#ffffff"><title id="ft">生理性止血三阶段</title><desc id="fd">血管受损后先痉挛收缩减少血流，血小板黏附聚集形成松软血栓，凝血级联把纤维蛋白原转为纤维蛋白网加固；血流粒子在第三阶段后不再外漏。</desc><text x="200.0" y="28" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="0.55s" fill="freeze" calcMode="spline" keySplines="0.23 1 0.32 1"/>生理性止血：三个阶段<tspan x="200.0" y="48" text-anchor="middle" font-size="11" fill="#64748b" font-weight="400">先缩、再堵、最后用纤维蛋白网加固</tspan></text><path d="M40,120 H360 M40,196 H360" stroke="#c0392b" stroke-width="3" fill="none"/><path d="M40,126 H360 M40,190 H360" stroke="#fbe3e0" stroke-width="10" fill="none" opacity="0.55"/><path d="M280,120 L292,158 L280,196" stroke="#ffffff" stroke-width="6" fill="none"/><g transform="translate(0,0)"><path d="M40,120 H360" stroke="#c0392b" stroke-width="6" stroke-linecap="round"/><animateTransform attributeName="transform" type="translate" values="0,0;0,18;0,18;0,18" keyTimes="0;0.26;0.9;1" dur="7.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1"/></g><circle r="4.5" fill="#2f8f57" opacity="0"><animateMotion dur="1.6s" begin="1.9s" repeatCount="indefinite" path="M80,158 L288,158"/><animate attributeName="opacity" values="0;.95;.95;0" keyTimes="0;.15;.8;1" dur="1.6s" begin="1.9s" repeatCount="indefinite"/></circle><circle r="4.5" fill="#2f8f57" opacity="0"><animateMotion dur="1.6s" begin="2.25s" repeatCount="indefinite" path="M80,158 L288,158"/><animate attributeName="opacity" values="0;.95;.95;0" keyTimes="0;.15;.8;1" dur="1.6s" begin="2.25s" repeatCount="indefinite"/></circle><circle r="4.5" fill="#2f8f57" opacity="0"><animateMotion dur="1.6s" begin="2.5999999999999996s" repeatCount="indefinite" path="M80,158 L288,158"/><animate attributeName="opacity" values="0;.95;.95;0" keyTimes="0;.15;.8;1" dur="1.6s" begin="2.5999999999999996s" repeatCount="indefinite"/></circle><path d="M282,150 l6,-12 l6,14 l6,-10 l6,12 M288,152 l4,14 l6,-8 l5,12 M280,162 l10,10 l8,-6 l7,10" stroke="#c1440e" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-dasharray="90" stroke-dashoffset="90"><animate attributeName="stroke-dashoffset" values="90;90;0;0" keyTimes="0;.6;.95;1" dur="7.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1"/></path><circle r="3.2" fill="#c0392b" opacity="0"><animateMotion dur="7.5s" repeatCount="indefinite" path="M60,158 L300,158 L320,210"/><animate attributeName="opacity" values="0;.9;.9;0;0" keyTimes="0;.08;.30;.40;1" dur="7.5s" repeatCount="indefinite"/></circle><path d="M276,146 a4.2,4.2 0 1,0 0.1,0 M284,154 a4.2,4.2 0 1,0 0.1,0 M270,160 a4.2,4.2 0 1,0 0.1,0 M292,146 a4.2,4.2 0 1,0 0.1,0" fill="#c0392b" opacity="0"><animate attributeName="opacity" values="0;0;0.9;0.9;0" keyTimes="0;0.55;0.72;0.96;1" dur="7.5s" repeatCount="indefinite"/></path><text font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><tspan x="40" y="112">血管壁（内皮受损）</tspan><tspan x="40" y="222">血流方向 →</tspan><tspan x="300" y="222" fill="#c1440e">破口 + 纤维蛋白网</tspan></text><text font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><tspan x="200.0" y="262" text-anchor="middle" opacity="0" fill="#c0392b" font-size="16" font-weight="700">① 血管收缩<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.26;0.2606;1" dur="7.5s" repeatCount="indefinite"/></tspan><tspan x="200.0" y="262" text-anchor="middle" opacity="0" fill="#2f8f57" font-size="16" font-weight="700">② 血小板栓<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.26;0.2606;0.6;0.6006;1" dur="7.5s" repeatCount="indefinite"/></tspan><tspan x="200.0" y="262" text-anchor="middle" opacity="0" fill="#c1440e" font-size="16" font-weight="700">③ 凝血块<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.6;0.6006;1" dur="7.5s" repeatCount="indefinite"/></tspan></text><text x="200.0" y="286" text-anchor="middle" font-size="11.5" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" opacity="0">内皮受损，局部痉挛减少血流<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.26;0.2606;1" dur="7.5s" repeatCount="indefinite"/></text><text x="200.0" y="286" text-anchor="middle" font-size="11.5" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" opacity="0">黏附→聚集→释放，形成松软血栓<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.26;0.2606;0.6;0.6006;1" dur="7.5s" repeatCount="indefinite"/></text><text x="200.0" y="286" text-anchor="middle" font-size="11.5" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" opacity="0">凝血级联把纤维蛋白原变成网<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.6;0.6006;1" dur="7.5s" repeatCount="indefinite"/></text><path d="M30,330 H370" stroke="#e2e8f0" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.35"/><path d="M118.4,325 L118.4,335 M234.0,325 L234.0,335" stroke="#e2e8f0" stroke-width="1.1" fill="none"/><circle cy="330" r="5.4" fill="#1e293b" stroke="#ffffff" stroke-width="2"><animateTransform attributeName="transform" type="translate" values="30.0,0;35.7,0;41.3,0;47.0,0;52.7,0;58.3,0;64.0,0;69.7,0;75.3,0;81.0,0;86.7,0;92.3,0;98.0,0;103.7,0;109.3,0;115.0,0;120.7,0;126.3,0;132.0,0;137.7,0;143.3,0;149.0,0;154.7,0;160.3,0;166.0,0;171.7,0;177.3,0;183.0,0;188.7,0;194.3,0;200.0,0;205.7,0;211.3,0;217.0,0;222.7,0;228.3,0;234.0,0;239.7,0;245.3,0;251.0,0;256.7,0;262.3,0;268.0,0;273.7,0;279.3,0;285.0,0;290.7,0;296.3,0;302.0,0;307.7,0;313.3,0;319.0,0;324.7,0;330.3,0;336.0,0;341.7,0;347.3,0;353.0,0;358.7,0;364.3,0;370.0,0" keyTimes="0;0.0167;0.0333;0.05;0.0667;0.0833;0.1;0.1167;0.1333;0.15;0.1667;0.1833;0.2;0.2167;0.2333;0.25;0.2667;0.2833;0.3;0.3167;0.3333;0.35;0.3667;0.3833;0.4;0.4167;0.4333;0.45;0.4667;0.4833;0.5;0.5167;0.5333;0.55;0.5667;0.5833;0.6;0.6167;0.6333;0.65;0.6667;0.6833;0.7;0.7167;0.7333;0.75;0.7667;0.7833;0.8;0.8167;0.8333;0.85;0.8667;0.8833;0.9;0.9167;0.9333;0.95;0.9667;0.9833;1" dur="7.5s" repeatCount="indefinite" calcMode="linear"/></circle><text x="200.0" y="360" text-anchor="middle" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><tspan fill="#c0392b">■</tspan> 动脉血　<tspan fill="#2f8f57">■</tspan> 血小板　<tspan fill="#c1440e">■</tspan> 纤维蛋白</text><text x="200.0" y="382" text-anchor="middle" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">凝血只是第三步；血小板栓先堵住，凝血块再加固</text></svg>