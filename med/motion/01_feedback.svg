<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" width="400" height="470" role="img" aria-labelledby="ft fd" style="background:#ffffff"><title id="ft">负反馈调节回路</title><desc id="fd">血压升高被感受器检出，经中枢比较后引起心率下降与血管舒张，血压回落到调定点；四条边依次亮起表示信号绕行一圈。</desc><text x="200.0" y="28" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="0.55s" fill="freeze" calcMode="spline" keySplines="0.23 1 0.32 1"/>负反馈：扰动被拉回<tspan x="200.0" y="48" text-anchor="middle" font-size="11" fill="#64748b" font-weight="400">回路四步；正反馈则把变化推向极端</tspan></text><rect x="150" y="76" width="100" height="40" rx="10" fill="#ffffff" stroke="#2c5f9e" stroke-width="2"/><text x="200" y="101" text-anchor="middle" font-size="12.5" fill="#2c5f9e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">感受器</text><rect x="268" y="170" width="100" height="40" rx="10" fill="#ffffff" stroke="#a8791a" stroke-width="2"/><text x="318" y="195" text-anchor="middle" font-size="12.5" fill="#a8791a" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">中枢</text><rect x="150" y="264" width="100" height="40" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="2"/><text x="200" y="289" text-anchor="middle" font-size="12.5" fill="#c0392b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">效应器</text><rect x="32" y="170" width="100" height="40" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="82" y="195" text-anchor="middle" font-size="12.5" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">调定点</text><path d="M250,96 H300 Q318,96 318,120 V170 M318,210 V260 Q318,284 294,284 H250 M150,284 H110 Q82,284 82,260 V210 M82,170 V120 Q82,96 104,96 H150" stroke="#e2e8f0" stroke-width="2" fill="none"/><circle r="4" fill="#c0392b" opacity="0.9"><animateMotion dur="7.0s" repeatCount="indefinite" path="M250,96 H300 Q318,96 318,120 V170 M318,210 V260 Q318,284 294,284 H250 M150,284 H110 Q82,284 82,260 V210 M82,170 V120 Q82,96 104,96 H150"/></circle><text x="60" y="330" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">血压</text><rect x="60" y="340" width="280" height="14" rx="7" fill="#eef2f7"/><g transform="translate(60,347)"><rect x="0" y="-7" width="280" height="14" rx="7" fill="#c0392b" opacity="0.75"><animateTransform attributeName="transform" type="scale" additive="sum" values="1 1;0.98 1;0.72 1;0.55 1;0.5 1" keyTimes="0;0.22;0.5;0.78;1" dur="7.0s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1"/></rect></g><text x="80" y="372" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">正常 120/80 mmHg　→　升高后被拉回</text><text font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><tspan x="200.0" y="408" text-anchor="middle" opacity="0" fill="#1e293b" font-size="15" font-weight="700">① 扰动：血压升高<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.22;0.2206;1" dur="7.0s" repeatCount="indefinite"/></tspan><tspan x="200.0" y="408" text-anchor="middle" opacity="0" fill="#1e293b" font-size="15" font-weight="700">② 传入延髓<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.22;0.2206;0.44;0.4406;1" dur="7.0s" repeatCount="indefinite"/></tspan><tspan x="200.0" y="408" text-anchor="middle" opacity="0" fill="#c0392b" font-size="15" font-weight="700">③ 传出：心迷走↑<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.44;0.4406;0.72;0.7206;1" dur="7.0s" repeatCount="indefinite"/></tspan><tspan x="200.0" y="408" text-anchor="middle" opacity="0" fill="#0f766e" font-size="15" font-weight="700">④ 血压回落<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.72;0.7206;1" dur="7.0s" repeatCount="indefinite"/></tspan></text><path d="M30,436 H370" stroke