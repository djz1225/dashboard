<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>医学动态图库</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#eef2f7;color:#17222b;line-height:1.6;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
.app{max-width:640px;margin:0 auto;padding:20px 14px 56px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:#5b6875;font-size:13px;margin-bottom:16px}
.card{background:#fff;border-radius:16px;border:1px solid #e3e9ef;padding:14px 12px 12px;
  margin-bottom:16px;box-shadow:0 2px 10px -6px rgba(23,34,43,.18)}
.head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.lab{font-size:11px;font-weight:700;letter-spacing:.08em;color:#0f766e;
  background:#ccfbf1;padding:3px 8px;border-radius:999px}
h2{font-size:16px;margin:0}
.stage{background:#fff;border-radius:12px;overflow:hidden}
.stage svg{display:block;width:100%;height:auto}
.one{font-size:13.5px;margin:10px 2px 0;color:#17222b;font-weight:600}
.note{font-size:12px;margin:4px 2px 0;color:#77848f}
.pause{margin-top:10px;display:flex;gap:8px}
button{flex:0 0 auto;height:36px;padding:0 16px;border-radius:10px;border:1px solid #d5dfe8;
  background:#f7fafc;color:#33465a;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer}
button:active{transform:scale(.97)}
@media (prefers-reduced-motion: reduce){
  .stage svg *{animation:none!important}
}
</style></head>

<script>
/* 只在交互页里给暂停能力；SMIL 本身不依赖脚本 */
document.querySelectorAll('.card').forEach(function(c){
  var svg=c.querySelector('svg'); if(!svg||!svg.pauseAnimations) return;
  var bar=document.createElement('div'); bar.className='pause';
  var b=document.createElement('button'); b.textContent='暂停';
  b.onclick=function(){
    if(svg.animationsPaused()){svg.unpauseAnimations();b.textContent='暂停';}
    else{svg.pauseAnimations();b.textContent='播放';}
  };
  bar.appendChild(b); c.appendChild(bar);
});
</script>
