<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" width="400" height="450" role="img" aria-labelledby="ft fd" style="background:#ffffff"><title id="ft">体温调节</title><desc id="fd">产热与散热如天平两端，由下丘脑调定点 37℃ 统一协调；发热是调定点上移的主动过程，中暑是散热失败的被动升温。</desc><text x="200.0" y="28" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="0.55s" fill="freeze" calcMode="spline" keySplines="0.23 1 0.32 1"/>体温调节：产热与散热的平衡<tspan x="200.0" y="48" text-anchor="middle" font-size="11" fill="#64748b" font-weight="400">调定点 37℃；偏离越大，纠正越强</tspan></text><path d="M200,140 V236" stroke="#e2e8f0" stroke-width="3"/><circle cx="200" cy="236" r="7" fill="#64748b"/><g transform="translate(200,140)"><path d="M-96,0 H96" stroke="#1e293b" stroke-width="3.4" stroke-linecap="round"/><animateTransform attributeName="transform" type="rotate" additive="sum" values="0;0;7;-5;0" keyTimes="0;0.30;0.55;0.80;1" dur="7.0s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1"/></g><path d="M104,146 V182 M296,146 V182" stroke="#e2e8f0" stroke-width="1.6"/><path d="M74,182 H134 A30,14 0 0 0 74,182" fill="#fde8dd" stroke="#c1440e" stroke-width="1.6"/><path d="M266,182 H326 A30,14 0 0 0 266,182" fill="#dbe7f5" stroke="#2c5f9e" stroke-width="1.6"/><text font-size="11.5" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><tspan x="104" y="176" text-anchor="middle" fill="#c1440e">产热</tspan><tspan x="296" y="176" text-anchor="middle" fill="#2c5f9e">散热</tspan><tspan x="104" y="214" text-anchor="middle" fill="#64748b">寒战·代谢↑</tspan><tspan x="296" y="214" text-anchor="middle" fill="#64748b">皮肤血流·出汗</tspan></text><rect x="150" y="254" width="100" height="36" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.8"/><text x="200" y="277" text-anchor="middle" font-size="12" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">下丘脑调定点 37℃</text><path d="M200,236 V254 M200,290 V306" stroke="#0f766e" stroke-width="1.8" fill="none" stroke-dasharray="5 4"/><path d="M254,323.1 H376" stroke="#e2e8f0" stroke-width="1.2" stroke-dasharray="4 4"/><path d="M254.0,323.1 L257.1,323.1 L260.1,323.1 L263.1,323.1 L266.2,323.1 L269.2,323.1 L272.3,323.1 L275.4,323.1 L278.4,311.4 L281.4,311.4 L284.5,311.4 L287.6,311.4 L290.6,311.4 L293.6,311.4 L296.7,311.4 L299.8,311.4 L302.8,311.4 L305.9,312.3 L308.9,316.8 L311.9,321.3 L315.0,325.9 L318.1,330.4 L321.1,334.9 L324.1,334.9 L327.2,334.9 L330.2,334.9 L333.3,334.9 L336.4,334.9 L339.4,334.9 L342.4,334.9 L345.5,334.9 L348.6,334.9 L351.6,334.9 L354.6,332.0 L357.7,329.0 L360.8,326.1 L363.8,323.1 L366.9,320.2 L369.9,317.2 L372.9,314.3 L376.0,311.4" fill="none" stroke="#c1440e" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="220" stroke-dashoffset="220"><animate attributeName="stroke-dashoffset" values="220;0" keyTimes="0;1" dur="7.0s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1"/></path><text x="254" y="350" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">体温在 37℃ 上下小幅波动（虚线为调定点）</text><text x="34" y="368" font-size="11" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="#1e293b">产热：安静靠内脏，运动靠骨骼肌，寒冷靠寒战</text><text x="34" y="388" font-size="11" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="#1e293b">散热：辐射·传导·对流·蒸发（环境≥体温时只剩蒸发）</text><text x="200.0" y="414" text-anchor="middle" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><tspan fill="#c1440e">■</tspan> 产热　<tspan fill="#2c5f9e">■</tspan> 散热　<tspan fill="#0f766e">■</tspan> 调定点</text><text x="200.0" y="436" text-anchor="middle" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">发热＝调定点上移（主动产热）；中暑＝散热失败（被动升温）</text></svg>