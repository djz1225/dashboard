<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 430" width="400" height="430" role="img" aria-labelledby="ft fd" style="background:#ffffff"><title id="ft">耳蜗的频率-位置编码</title><desc id="fd">基底膜从蜗底到蜗顶变宽变软，不同频率的行波在不同位置达到最大振幅：高频靠蜗底、低频靠蜗顶。</desc><text x="200.0" y="28" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="0.55s" fill="freeze" calcMode="spline" keySplines="0.23 1 0.32 1"/>耳蜗：把频率变成位置<tspan x="200.0" y="48" text-anchor="middle" font-size="11" fill="#64748b" font-weight="400">高频在基底、低频在蜗顶——行波理论</tspan></text><path d="M40,150 Q200,110 356,150 Q360,178 356,196 Q200,236 40,196 Z" fill="#fbe3e0" stroke="#c0392b" stroke-width="1.8"/><path d="M40,173 Q200,173 356,173" stroke="#0f766e" stroke-width="2.4" fill="none"/><path d="M80,173 V196" stroke="#c1440e" stroke-width="2" stroke-dasharray="4 3"/><text x="80" y="212" text-anchor="middle" font-size="11" fill="#c1440e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">20 kHz</text><path d="M200,173 V196" stroke="#b45309" stroke-width="2" stroke-dasharray="4 3"/><text x="200" y="212" text-anchor="middle" font-size="11" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">1 kHz</text><path d="M330,173 V196" stroke="#2c5f9e" stroke-width="2" stroke-dasharray="4 3"/><text x="330" y="212" text-anchor="middle" font-size="11" fill="#2c5f9e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">50 Hz</text><circle r="3.6" fill="#c1440e" opacity="0"><animateMotion dur="2.2s" repeatCount="indefinite" path="M48,173 L80,168 L80,173"/><animate attributeName="opacity" values="0;.95;.95;0;0" keyTimes="0;.15;.62;.78;1" dur="2.2s" repeatCount="indefinite" begin="0s"/></circle><circle r="3.6" fill="#b45309" opacity="0"><animateMotion dur="2.2s" repeatCount="indefinite" path="M48,173 L200,168 L200,173"/><animate attributeName="opacity" values="0;.95;.95;0;0" keyTimes="0;.15;.62;.78;1" dur="2.2s" repeatCount="indefinite" begin="0s"/></circle><circle r="3.6" fill="#2c5f9e" opacity="0"><animateMotion dur="2.2s" repeatCount="indefinite" path="M48,173 L330,168 L330,173"/><animate attributeName="opacity" values="0;.95;.95;0;0" keyTimes="0;.15;.62;.78;1" dur="2.2s" repeatCount="indefinite" begin="0s"/></circle><text font-size="11" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><tspan x="44" y="140" fill="#64748b">蜗底（窄、硬）</tspan><tspan x="352" y="140" text-anchor="end" fill="#64748b">蜗顶（宽、软）</tspan><tspan x="200" y="150" text-anchor="middle" fill="#0f766e">基底膜</tspan></text><text x="34" y="248" font-size="11" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="#1e293b">基底膜从蜗底到蜗顶逐渐变宽、变软 → 不同频率在不同位置共振最大</text><text x="34" y="268" font-size="11" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="#1e293b">高频（基底窄硬）→ 靠近蜗底；低频（蜗顶宽软）→ 靠近蜗顶</text><rect x="24" y="284" width="352" height="60" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/><text x="38" y="302" font-size="11.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">频率＝位置，强度＝放电频率与募集纤维数</text><text x="38" y="320" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">声音越响 → 行波振幅越大 → 该位置毛细胞放电越密</text><text x="38" y="336" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">中耳增压：鼓膜面积 / 卵圆窗面积 ≈ 17 倍，补偿液-气界面损失</text><text x="200.0" y="366" text-anchor="middle" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><tspan fill="#c1440e">■</tspan> 高频　<tspan fill="#b45309">■</tspan> 中频　<tspan fill="#2c5f9e">■</tspan> 低频</text><text x="200.0" y="390" text-anchor="middle" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">毛细胞纤毛向一个方向弯 → 去极化（机械门控阳离子通道）</text><text x="200.0" y="410" text-anchor="middle" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">向反方向弯 → 超极化；这就是听觉的换能第一步</text></svg>