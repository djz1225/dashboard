<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 460" width="400" height="460" role="img" aria-labelledby="ft fd" style="background:#ffffff"><title id="ft">三种调节方式</title><desc id="fd">神经调节经反射弧最快最准，体液调节经血液较慢较广，自身调节只在局部起效；下方三个点以不同速度沿时间轴推进。</desc><text x="200.0" y="28" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="0.55s" fill="freeze" calcMode="spline" keySplines="0.23 1 0.32 1"/>三种调节方式：快慢与范围<tspan x="200.0" y="48" text-anchor="middle" font-size="11" fill="#64748b" font-weight="400">同一件事——把偏离拉回，但走的路径不同</tspan></text><rect x="24" y="78" width="352" height="76" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/><rect x="24" y="78" width="6" height="76" rx="3" fill="#a8791a"/><text x="44" y="104" font-size="13.5" font-weight="700" fill="#a8791a" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">神经调节</text><text x="44" y="124" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">反射弧：感受器→传入→中枢→传出→效应器</text><text x="44" y="142" font-size="11" fill="#a8791a" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">快、准、短</text><g transform="translate(24,154)"><rect x="4" y="-3" width="300" height="4" rx="2" fill="#a8791a" opacity="0.55"><animateTransform attributeName="transform" type="scale" additive="sum" values="0.02 1;1 1" keyTimes="0;1" dur="0.6s" begin="0.0s" fill="freeze" calcMode="spline" keySplines="0.23 1 0.32 1"/></rect></g><rect x="24" y="166" width="352" height="76" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/><rect x="24" y="166" width="6" height="76" rx="3" fill="#c0392b"/><text x="44" y="192" font-size="13.5" font-weight="700" fill="#c0392b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">体液调节</text><text x="44" y="212" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">激素经血液运到全身靶细胞</text><text x="44" y="230" font-size="11" fill="#c0392b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">慢、广、久</text><g transform="translate(24,242)"><rect x="4" y="-3" width="220" height="4" rx="2" fill="#c0392b" opacity="0.55"><animateTransform attributeName="transform" type="scale" additive="sum" values="0.02 1;1 1" keyTimes="0;1" dur="0.6s" begin="0.15s" fill="freeze" calcMode="spline" keySplines="0.23 1 0.32 1"/></rect></g><rect x="24" y="254" width="352" height="76" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/><rect x="24" y="254" width="6" height="76" rx="3" fill="#0f766e"/><text x="44" y="280" font-size="13.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">自身调节</text><text x="44" y="300" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">局部代谢产物直接作用于本器官血管</text><text x="44" y="318" font-size="11" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">范围最小</text><g transform="translate(24,330)"><rect x="4" y="-3" width="120" height="4" rx="2" fill="#0f766e" opacity="0.55"><animateTransform attributeName="transform" type="scale" additive="sum" values="0.02 1;1 1" keyTimes="0;1" dur="0.6s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.23 1 0.32 1"/></rect></g><path d="M30,392 H370" stroke="#e2e8f0" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.35"/><circle r="5" fill="#a8791a" opacity="0.9"><animateMotion dur="8.0s" repeatCount="indefinite" path="M30,392 C 120,392 130,392 370,392" calcMode="linear"/></circle><circle r="5" fill="#c0392b" opacity="0.9"><animateMotion dur="8.0s" repeatCount="indefinite" begin="0s" path="M30,392 C 150,392 260,392 370,392"/></circle><text x="30" y="412" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">起效时间轴：神经最快，体液居中，自身调节只在本器官内</text><text x="200.0" y="440" text-anchor="middle" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><tspan fill="#a8791a">■</tspan> 神经　<tspan fill="#c0392b">■</tspan> 体液　<tspan fill="#0f766e">■</tspan> 自身</text></svg>