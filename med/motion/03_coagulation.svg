<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" width="400" height="470" role="img" aria-labelledby="ft fd" style="background:#ffffff"><title id="ft">凝血级联</title><desc id="fd">内源性与外源性两条路径分别在Ⅹ处汇合，进入共同途径；凝血酶进一步放大纤维蛋白生成。APTT 反映内源，PT 反映外源。</desc><text x="200.0" y="28" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="0.55s" fill="freeze" calcMode="spline" keySplines="0.23 1 0.32 1"/>凝血级联：两条启动路径，一个终点<tspan x="200.0" y="48" text-anchor="middle" font-size="11" fill="#64748b" font-weight="400">内源靠接触激活，外源靠组织因子</tspan></text><rect x="36" y="76" width="104" height="30" rx="8" fill="#2c5f9e" opacity="0.14" stroke="#2c5f9e" stroke-width="1.4"/><text x="88" y="96" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2c5f9e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">内源性</text><text x="88" y="126" text-anchor="middle" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">Ⅻ→Ⅺ→Ⅸ→Ⅷ</text><rect x="148" y="76" width="104" height="30" rx="8" fill="#c0392b" opacity="0.14" stroke="#c0392b" stroke-width="1.4"/><text x="200" y="96" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c0392b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">共同途径</text><text x="200" y="126" text-anchor="middle" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">Ⅹ→凝血酶</text><rect x="260" y="76" width="104" height="30" rx="8" fill="#c1440e" opacity="0.14" stroke="#c1440e" stroke-width="1.4"/><text x="312" y="96" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c1440e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">外源性</text><text x="312" y="126" text-anchor="middle" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">Ⅲ+Ⅶ</text><path d="M88,132 V168 Q88,186 110,196 L176,222 M312,132 V168 Q312,186 290,196 L224,222" stroke="#e2e8f0" stroke-width="2" fill="none"/><rect x="150" y="226" width="100" height="34" rx="9" fill="#fbe3e0" stroke="#c0392b" stroke-width="1.6"/><text x="200" y="248" text-anchor="middle" font-size="12" fill="#c0392b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">凝血酶原 → 凝血酶</text><path d="M200,260 V292" stroke="#c0392b" stroke-width="2" fill="none"/><rect x="140" y="292" width="120" height="34" rx="9" fill="#fde8dd" stroke="#c1440e" stroke-width="1.6"/><text x="200" y="314" text-anchor="middle" font-size="12" fill="#c1440e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">纤维蛋白原 → 纤维蛋白</text><circle r="3.6" fill="#c0392b" opacity="0"><animateMotion dur="2.2s" begin="0.0s" repeatCount="indefinite" path="M88,206 L196,240"/><animate attributeName="opacity" values="0;.95;.95;0;0" keyTimes="0;.1;.5;.7;1" dur="2.2s" begin="0.0s" repeatCount="indefinite"/></circle><circle r="3.6" fill="#c0392b" opacity="0"><animateMotion dur="2.2s" begin="1.1s" repeatCount="indefinite" path="M88,206 L196,240"/><animate attributeName="opacity" values="0;.95;.95;0;0" keyTimes="0;.1;.5;.7;1" dur="2.2s" begin="1.1s" repeatCount="indefinite"/></circle><circle r="3.6" fill="#c1440e" opacity="0"><animateMotion dur="2.2s" begin="1.1s" repeatCount="indefinite" path="M312,206 L204,240"/><animate attributeName="opacity" values="0;.95;.95;0;0" keyTimes="0;.1;.5;.7;1" dur="2.2s" begin="1.1s" repeatCount="indefinite"/></circle><text x="200" y="352" text-anchor="middle" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">级联＝逐级放大：1 个Ⅹa 激活大量凝血酶，凝血酶再放大纤维蛋白生成</text><text x="88" y="376" text-anchor="middle" font-size="11" fill="#2c5f9e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">APTT 反映内源</text><text x="312" y="376" text-anchor="middle" font-size="11" fill="#c1440e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">PT 反映外源</text><path d="M30,404 H370" stroke="#e2e8f0" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.35"/><circle cy="404" r="5.4" fill="#2c5f9e" stroke="#ffffff" stroke-width="2"><animateTransform attributeName="transform" type="translate" values="30.0,0;35.7,0;41.3,0;47.0,0;52.7,0;58.3,0;64.0,0;69.7,0;75.3,0;81.0,0;86.7,0;92.3,0;98.0,0;103.7,0;109.3,0;115.0,0;120.7,0;126.3,0;132.0,0;137.7,0;143.3,0;149.0,0;154.7,0;160.3,0;166.0,0;171.7,0;177.3,0;183.0,0;188.7,0;194.3,0;200.0,0;205.7,0;211.3,0;217.0,0;222.7,0;228.3,0;234.0,0;239.7,0;245.3,0;251.0,0;256.7,0;262.3,0;268.0,0;273.7,0;279.3,0;285.0,0;290.7,0;296.3,0;302.0,0;307.7,0;313.3,0;319.0,0;324.7,0;330.3,0;336.0,0;341.7,0;347.3,0;353.0,0;358.7,0;364.3,0;370.0,0" keyTimes="0;0.0167;0.0333;0.05;0.0667;0.0833;0.1;0.1167;0.1333;0.15;0.1667;0.1833;0.2;0.2167;0.2333;0.25;0.2667;0.2833;0.3;0.3167;0.3333;0.35;0.3667;0.3833;0.4;0.4167;0.4333;0.45;0.4667;0.4833;0.5;0.5167;0.5333;0.55;0.5667;0.5833;0.6;0.6167;0.6333;0.65;0.6667;0.6833;0.7;0.7167;0.7333;0.75;0.7667;0.7833;0.8;0.8167;0.8333;0.85;0.8667;0.8833;0.9;0.9167;0.9333;0.95;0.9667;0.9833;1" dur="7.5s" repeatCount="indefinite" calcMode="linear"/></circle><text x="30" y="424" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">内源启动较慢（数分钟），外源启动快（十几秒）——两条并行推进</text><text x="200.0" y="450" text-anchor="middle" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><tspan fill="#2c5f9e">■</tspan> 内源性　<tspan fill="#c1440e">■</tspan> 外源性　<tspan fill="#c0392b">■</tspan> 共同途径</text></svg>