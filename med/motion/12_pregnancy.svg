<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" width="400" height="450" role="img" aria-labelledby="ft fd" style="background:#ffffff"><title id="ft">妊娠维持的激素交接</title><desc id="fd">滋养细胞分泌 hCG 保住黄体维持孕激素；孕 8~10 周胎盘接手，hCG 回落而孕激素继续维持。</desc><text x="200.0" y="28" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="0.55s" fill="freeze" calcMode="spline" keySplines="0.23 1 0.32 1"/>妊娠的维持：hCG 先救黄体，胎盘后接班<tspan x="200.0" y="48" text-anchor="middle" font-size="11" fill="#64748b" font-weight="400">两条曲线在孕 8~10 周交叉，是接班的时刻</tspan></text><path d="M56,90 L56,300 L372,300" stroke="#e2e8f0" stroke-width="1.3" fill="none"/><path d="M56.0,289.8 L67.3,283.7 L78.6,264.6 L89.9,215.1 L101.1,142.5 L112.4,97.0 L123.7,122.2 L135.0,193.0 L146.3,252.7 L157.6,280.3 L168.9,283.7 L180.1,283.7 L191.4,283.7 L202.7,283.7 L214.0,283.7 L225.3,283.7 L236.6,283.7 L247.9,283.7 L259.1,283.7 L270.4,283.7 L281.7,283.7 L293.0,283.7 L304.3,283.7 L315.6,283.7 L326.9,283.7 L338.1,283.7 L349.4,283.7 L360.7,283.7 L372.0,283.7" fill="none" stroke="#c1440e" stroke-width="2.4"/><path d="M56.0,136.8 L67.3,136.8 L78.6,136.8 L89.9,136.8 L101.1,136.8 L112.4,136.8 L123.7,137.4 L135.0,142.9 L146.3,148.5 L157.6,154.0 L168.9,159.5 L180.1,165.1 L191.4,170.6 L202.7,176.1 L214.0,181.7 L225.3,187.2 L236.6,192.8 L247.9,198.3 L259.1,203.8 L270.4,208.2 L281.7,208.2 L293.0,208.2 L304.3,208.2 L315.6,208.2 L326.9,208.2 L338.1,208.2 L349.4,208.2 L360.7,208.2 L372.0,208.2" fill="none" stroke="#2f8f57" stroke-width="2.6" stroke-dasharray="7 5"/><path d="M114.2,90 V300" stroke="#64748b" stroke-width="1.4" stroke-dasharray="5 4" opacity="0.7"/><text font-size="11" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="#64748b"><tspan x="50" y="304" text-anchor="end">孕 2</tspan><tspan x="114.2" y="316" text-anchor="middle" fill="#64748b">孕 8~10 周（交接）</tspan><tspan x="372" y="316" text-anchor="end">40 周</tspan><tspan x="205.7" y="108.2" text-anchor="middle" fill="#c1440e">hCG</tspan><tspan x="272.2" y="140.9" text-anchor="middle" fill="#2f8f57">孕激素</tspan></text><circle cy="300" r="5.4" fill="#1e293b" stroke="#ffffff" stroke-width="2"><animateTransform attributeName="transform" type="translate" values="56.0,0;61.3,0;66.5,0;71.8,0;77.1,0;82.3,0;87.6,0;92.9,0;98.1,0;103.4,0;108.7,0;113.9,0;119.2,0;124.5,0;129.7,0;135.0,0;140.3,0;145.5,0;150.8,0;156.1,0;161.3,0;166.6,0;171.9,0;177.1,0;182.4,0;187.7,0;192.9,0;198.2,0;203.5,0;208.7,0;214.0,0;219.3,0;224.5,0;229.8,0;235.1,0;240.3,0;245.6,0;250.9,0;256.1,0;261.4,0;266.7,0;271.9,0;277.2,0;282.5,0;287.7,0;293.0,0;298.3,0;303.5,0;308.8,0;314.1,0;319.3,0;324.6,0;329.9,0;335.1,0;340.4,0;345.7,0;350.9,0;356.2,0;361.5,0;366.7,0;372.0,0" keyTimes="0;0.0167;0.0333;0.05;0.0667;0.0833;0.1;0.1167;0.1333;0.15;0.1667;0.1833;0.2;0.2167;0.2333;0.25;0.2667;0.2833;0.3;0.3167;0.3333;0.35;0.3667;0.3833;0.4;0.4167;0.4333;0.45;0.4667;0.4833;0.5;0.5167;0.5333;0.55;0.5667;0.5833;0.6;0.6167;0.6333;0.65;0.6667;0.6833;0.7;0.7167;0.7333;0.75;0.7667;0.7833;0.8;0.8167;0.8333;0.85;0.8667;0.8833;0.9;0.9167;0.9333;0.95;0.9667;0.9833;1" dur="8.0s" repeatCount="indefinite" calcMode="linear"/></circle><text x="34" y="330" font-size="11" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="#1e293b">① 受精后 6~7 天着床，滋养细胞分泌 hCG</text><text x="34" y="350" font-size="11" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="#1e293b">② hCG 结构与 LH 相似 → 保住黄体 → 孕激素不撤退、月经不来</text><text x="34" y="370" font-size="11" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="#1e293b">③ 孕 8~10 周胎盘接手分泌孕激素，hCG 回落（早孕反应随之减轻）</text><rect x="24" y="382" width="352" height="46" rx="9" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.3" opacity="0.75"/><text x="38" y="400" font-size="11" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">临床：hCG 是早孕诊断指标；宫外孕时升高幅度偏低且倍增不良</text><text x="38" y="418" font-size="11" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">分娩启动：子宫机械牵张 + 缩宫素 + 前列腺素 → 正反馈直至分娩</text><text x="200.0" y="442" text-anchor="middle" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><tspan fill="#c1440e">■</tspan> hCG　<tspan fill="#2f8f57">■</tspan> 孕激素</text></svg>