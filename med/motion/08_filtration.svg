<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 460" width="400" height="460" role="img" aria-labelledby="ft fd" style="background:#ffffff"><title id="ft">肾小球有效滤过压</title><desc id="fd">入球端有效滤过压约 10 mmHg 驱动滤过；血浆胶体渗透压沿毛细血管升高，滤过压递减至零达到滤过平衡。</desc><text x="200.0" y="28" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="0.55s" fill="freeze" calcMode="spline" keySplines="0.23 1 0.32 1"/>肾小球滤过：有效滤过压<tspan x="200.0" y="48" text-anchor="middle" font-size="11" fill="#64748b" font-weight="400">EFP = 肾小球毛细血管压 −（胶渗压 + 囊内压）</tspan></text><path d="M40,150 H110" stroke="#c0392b" stroke-width="7" stroke-linecap="round"/><circle cx="164" cy="150" r="52" fill="#fbe3e0" stroke="#c0392b" stroke-width="1.8"/><path d="M164,150 m-34,0 a34,26 0 1,0 68,0 a34,26 0 1,0 -68,0" fill="none" stroke="#c0392b" stroke-width="2.4"/><path d="M216,150 H320" stroke="#c0392b" stroke-width="5" stroke-linecap="round" opacity="0.85"/><path d="M164,92 a62,62 0 1,0 0.1,0" fill="none" stroke="#0f766e" stroke-width="1.8" stroke-dasharray="6 5" opacity="0.8"/><path d="M164,212 V300 Q164,320 186,320 H320" stroke="#0f766e" stroke-width="9" fill="none" stroke-linecap="round" opacity="0.55"/><circle r="3.4" fill="#c0392b" opacity="0"><animateMotion dur="2.1s" begin="0.0s" repeatCount="indefinite" path="M164,150 L164,236"/><animate attributeName="opacity" values="0;.95;.95;0;0" keyTimes="0;.1;.5;.72;1" dur="2.1s" begin="0.0s" repeatCount="indefinite"/></circle><circle r="3.4" fill="#c0392b" opacity="0"><animateMotion dur="2.1s" begin="0.7s" repeatCount="indefinite" path="M164,150 L164,236"/><animate attributeName="opacity" values="0;.95;.95;0;0" keyTimes="0;.1;.5;.72;1" dur="2.1s" begin="0.7s" repeatCount="indefinite"/></circle><circle r="3.4" fill="#c0392b" opacity="0"><animateMotion dur="2.1s" begin="1.4s" repeatCount="indefinite" path="M164,150 L164,236"/><animate attributeName="opacity" values="0;.95;.95;0;0" keyTimes="0;.1;.5;.72;1" dur="2.1s" begin="1.4s" repeatCount="indefinite"/></circle><text font-size="11" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><tspan x="40" y="140" fill="#c0392b">入球小动脉</tspan><tspan x="326" y="140" fill="#c0392b">出球小动脉</tspan><tspan x="164" y="82" text-anchor="middle" fill="#0f766e">肾小囊</tspan><tspan x="326" y="330" text-anchor="end" fill="#0f766e">肾小管</tspan></text><rect x="24" y="344" width="352" height="72" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/><text x="38" y="364" font-size="12" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">有效滤过压 = 45 − (25 + 10) = 10 mmHg</text><text x="38" y="384" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">推动滤过：肾小球毛细血管血压 45</text><text x="38" y="402" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">对抗滤过：血浆胶体渗透压 25 + 囊内压 10</text><text x="200.0" y="434" text-anchor="middle" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">沿毛细血管走行胶渗压升高，EFP 递减至 0 即达滤过平衡</text><text x="200.0" y="446" text-anchor="middle" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><tspan fill="#c0392b">■</tspan> 全血/滤液　<tspan fill="#0f766e">■</tspan> 肾小囊与肾小管</text></svg>