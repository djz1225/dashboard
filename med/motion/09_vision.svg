<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" width="400" height="440" role="img" aria-labelledby="ft fd" style="background:#ffffff"><title id="ft">眼的折光与感光</title><desc id="fd">平行光经角膜与晶状体两次折射聚焦于视网膜；视杆管暗视、视锥管明视与辨色；近视眼轴过长、远视眼轴过短。</desc><text x="200.0" y="28" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="0.55s" fill="freeze" calcMode="spline" keySplines="0.23 1 0.32 1"/>眼：折光与感光<tspan x="200.0" y="48" text-anchor="middle" font-size="11" fill="#64748b" font-weight="400">角膜+晶状体两次聚焦；视杆暗光、视锥辨色</tspan></text><circle cx="220" cy="190" r="96" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><path d="M124,190 q-22,-34 0,-64" fill="none" stroke="#c0392b" stroke-width="3.4"/><ellipse cx="150" cy="190" rx="12" ry="30" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><path d="M300,190 a96,96 0 0 1 -14,50" fill="none" stroke="#c1440e" stroke-width="5" opacity="0.8"/><path d="M28,162 L138,162 L300,190" stroke="#b45309" stroke-width="1.6" fill="none" opacity="0.85"/><path d="M28,190 L138,190 L300,190" stroke="#b45309" stroke-width="1.6" fill="none" opacity="0.85"/><path d="M28,218 L138,218 L300,190" stroke="#b45309" stroke-width="1.6" fill="none" opacity="0.85"/><circle r="4" fill="#b45309"><animateMotion dur="6.0s" repeatCount="indefinite" path="M28,190 L138,190 L300,190"/></circle><text font-size="11" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><tspan x="120" y="118" text-anchor="middle" fill="#c0392b">角膜（最强折光面）</tspan><tspan x="150" y="246" text-anchor="middle" fill="#0f766e">晶状体（可调）</tspan><tspan x="316" y="192" fill="#c1440e">视网膜</tspan><tspan x="30" y="150" fill="#b45309">平行光</tspan></text><text x="34" y="304" font-size="12" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">看近物：晶状体更凸（调节）；看远物：变扁</text><text x="34" y="326" font-size="11" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="#1e293b">近视：眼轴过长 → 像落在视网膜前 → 凹透镜矫正</text><text x="34" y="346" font-size="11" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="#1e293b">远视：眼轴过短 → 像落在视网膜后 → 凸透镜矫正</text><rect x="24" y="360" width="170" height="46" rx="9" fill="#dbe7f5" stroke="#2c5f9e" stroke-width="1.4"/><text x="36" y="378" font-size="11.5" font-weight="700" fill="#2c5f9e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">视杆细胞</text><text x="36" y="396" font-size="11" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">暗光、无视色、敏感度高</text><rect x="206" y="360" width="170" height="46" rx="9" fill="#fde8dd" stroke="#c1440e" stroke-width="1.4"/><text x="218" y="378" font-size="11.5" font-weight="700" fill="#c1440e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">视锥细胞</text><text x="218" y="396" font-size="11" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">明视、辨色、三种色素</text><text x="200.0" y="428" text-anchor="middle" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><tspan fill="#b45309">■</tspan> 光路　<tspan fill="#c0392b">■</tspan> 角膜　<tspan fill="#0f766e">■</tspan> 晶状体</text></svg>