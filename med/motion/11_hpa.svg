<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" width="400" height="470" role="img" aria-labelledby="ft fd" style="background:#ffffff"><title id="ft">下丘脑-垂体-靶腺轴</title><desc id="fd">三级激素逐级放大，靶腺激素经长负反馈抑制上游；长期外源激素会造成皮质萎缩。另两个轴结构同构。</desc><text x="200.0" y="28" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="0.55s" fill="freeze" calcMode="spline" keySplines="0.23 1 0.32 1"/>下丘脑-垂体-靶腺轴：三级 + 长负反馈<tspan x="200.0" y="48" text-anchor="middle" font-size="11" fill="#64748b" font-weight="400">越往下激素越多、作用越具体；负反馈收在上游</tspan></text><rect x="128" y="78" width="144" height="44" rx="11" fill="#ffffff" stroke="#0f766e" stroke-width="1.8"/><text x="200" y="105" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">下丘脑</text><text x="286" y="105" font-size="11" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">CRH</text><rect x="128" y="154" width="144" height="44" rx="11" fill="#ffffff" stroke="#2c5f9e" stroke-width="1.8"/><text x="200" y="181" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2c5f9e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">腺垂体</text><text x="286" y="181" font-size="11" fill="#2c5f9e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">ACTH</text><rect x="128" y="230" width="144" height="44" rx="11" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/><text x="200" y="257" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c0392b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">肾上腺皮质</text><text x="286" y="257" font-size="11" fill="#c0392b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">皮质醇</text><path d="M200,122 V154" stroke="#e2e8f0" stroke-width="2" fill="none"/><circle r="3.6" fill="#2c5f9e" opacity="0.9"><animateMotion dur="7.0s" repeatCount="indefinite" path="M200,122 V154"/></circle><path d="M200,198 V230" stroke="#e2e8f0" stroke-width="2" fill="none"/><circle r="3.6" fill="#2c5f9e" opacity="0.9"><animateMotion dur="7.0s" repeatCount="indefinite" path="M200,198 V230"/></circle><path d="M128,252 H72 Q52,252 52,222 V130 Q52,100 72,100 H128" stroke="#c1440e" stroke-width="2" fill="none" stroke-dasharray="7 5"/><circle r="3.6" fill="#c1440e" opacity="0.95"><animateMotion dur="7.0s" repeatCount="indefinite" path="M128,252 H72 Q52,252 52,222 V130 Q52,100 72,100 H128"/></circle><text x="52" y="176" font-size="11" fill="#c1440e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" transform="rotate(-90 52 176)">负反馈</text><rect x="126" y="292" width="148" height="34" rx="9" fill="#fbe3e0" stroke="#c0392b" stroke-width="1.4"/><text x="200" y="314" text-anchor="middle" font-size="11.5" fill="#c0392b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">皮质醇 → 全身靶细胞</text><text x="34" y="352" font-size="11" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="#1e293b">① 三级放大：CRH→ACTH→皮质醇，逐级放大信号</text><text x="34" y="372" font-size="11" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="#1e293b">② 长负反馈：皮质醇升高反过来抑制下丘脑与垂体</text><text x="34" y="392" font-size="11" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="#1e293b">③ 临床：长期用糖皮质激素 → 反馈抑制 → 肾上腺皮质萎缩，不可骤停</text><text x="34" y="416" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">皮质醇呈昼夜节律：晨 6~8 时最高，午夜最低</text><text x="200.0" y="442" text-anchor="middle" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><tspan fill="#2c5f9e">■</tspan> 促激素　<tspan fill="#c0392b">■</tspan> 靶腺激素　<tspan fill="#c1440e">■</tspan> 负反馈</text><text x="200.0" y="462" text-anchor="middle" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">下丘脑-垂体-甲状腺轴、性腺轴结构完全同构</text></svg>