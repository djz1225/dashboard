<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" role="img" aria-label="滑膜液的四环节闭环机制与滑膜炎时的同步恶化"><rect width="1000" height="720" fill="#FFFFFF"/><text x="48.0" y="42.0" text-anchor="start" font-size="11.5" fill="#4E5B64" font-weight="700">机制版</text><text x="48.0" y="76.0" text-anchor="start" font-size="22" fill="#1B2A33" font-weight="700">滑膜液闭环机制</text><text x="48.0" y="106.0" text-anchor="start" font-size="13.5" fill="#37474F" font-weight="400">分泌 → 泵送 → 营养 → 清除，四个环节互相依赖；滑膜炎时四个环节同时恶化</text><rect x="48.0" y="132.0" width="448.0" height="132.0" rx="12" fill="#FFFFFF" stroke="#1F5FA0" stroke-width="1.8"/><rect x="48.0" y="132.0" width="6.0" height="132.0" rx="3" fill="#1F5FA0"/><text x="72.0" y="166.0" text-anchor="start" font-size="16" fill="#1B2A33" font-weight="700">① 分泌</text><text x="72.0" y="192.0" text-anchor="start" font-size="12.5" fill="#1F5FA0" font-weight="600">血浆超滤 + B 型细胞分泌</text><text x="72.0" y="218.0" text-anchor="start" font-size="11.5" fill="#37474F" font-weight="400">毛细血管滤出基础液；滑膜 B 型细胞分泌 HA（黏弹性）与 PRG4（润滑）</text><text x="476.0" y="250.0" text-anchor="end" font-size="11.5" fill="#5F6C75" font-weight="400">关节液量 0.5–2 mL</text><rect x="520.0" y="132.0" width="448.0" height="132.0" rx="12" fill="#FFFFFF" stroke="#1F5FA0" stroke-width="1.8"/><rect x="520.0" y="132.0" width="6.0" height="132.0" rx="3" fill="#1F5FA0"/><text x="544.0" y="166.0" text-anchor="start" font-size="16" fill="#1B2A33" font-weight="700">② 泵送</text><text x="544.0" y="192.0" text-anchor="start" font-size="12.5" fill="#1F5FA0" font-weight="600">关节屈伸驱动分布</text><text x="544.0" y="218.0" text-anchor="start" font-size="11.5" fill="#37474F" font-weight="400">滑液没有「心脏」，靠关节活动产生的压力梯度被动流动；</text><text x="544.0" y="238.0" text-anchor="start" font-size="11.5" fill="#37474F" font-weight="400">制动会致滑液停滞</text><text x="948.0" y="250.0" text-anchor="end" font-size="11.5" fill="#5F6C75" font-weight="400">无主动泵，全靠活动</text><rect x="48.0" y="286.0" width="448.0" height="132.0" rx="12" fill="#FFFFFF" stroke="#1C6B45" stroke-width="1.8"/><rect x="48.0" y="286.0" width="6.0" height="132.0" rx="3" fill="#1C6B45"/><text x="72.0" y="320.0" text-anchor="start" font-size="16" fill="#1B2A33" font-weight="700">③ 营养</text><text x="72.0" y="346.0" text-anchor="start" font-size="12.5" fill="#1C6B45" font-weight="600">扩散供给无血管软骨</text><text x="72.0" y="372.0" text-anchor="start" font-size="11.5" fill="#37474F" font-weight="400">软骨无血管无神经，氧与营养全靠滑液扩散；挤压-回弹像海绵泵</text><text x="476.0" y="404.0" text-anchor="end" font-size="11.5" fill="#5F6C75" font-weight="400">软骨 100% 依赖滑液</text><rect x="520.0" y="286.0" width="448.0" height="132.0" rx="12" fill="#FFFFFF" stroke="#8A5A12" stroke-width="1.8"/><rect x="520.0" y="286.0" width="6.0" height="132.0" rx="3" fill="#8A5A12"/><text x="544.0" y="320.0" text-anchor="start" font-size="16" fill="#1B2A33" font-weight="700">④ 清除</text><text x="544.0" y="346.0" text-anchor="start" font-size="12.5" fill="#8A5A12" font-weight="600">淋巴与静脉回流</text><text x="544.0" y="372.0" text-anchor="start" font-size="11.5" fill="#37474F" font-weight="400">经滑膜淋巴管与静脉清除，维持量与成分稳态；回流受阻即开始积液</text><text x="948.0" y="404.0" text-anchor="end" font-size="11.5" fill="#5F6C75" font-weight="400">回流受阻 → 积液累积</text><text x="500.0" y="442.0" text-anchor="middle" font-size="12.5" fill="#1F5FA0" font-weight="700">①→②→③→④ 首尾相连：任一环节失效，闭环即转成「积液恶性循环」</text><text x="48.0" y="478.0" text-anchor="start" font-size="16" fill="#A3382C" font-weight="700">滑膜炎时：四个环节同步恶化</text><rect x="48.0" y="496.0" width="215.5" height="96.0" rx="10" fill="#FDF3F2" stroke="#A3382C" stroke-width="1.4"/><text x="155.8" y="524.0" text-anchor="middle" font-size="12.5" fill="#A3382C" font-weight="700">① 渗出↑</text><text x="155.8" y="546.0" text-anchor="middle" font-size="11.5" fill="#37474F" font-weight="400">血管扩张、通透性↑，</text><text x="155.8" y="562.0" text-anchor="middle" font-size="11.5" fill="#37474F" font-weight="400">血浆蛋白与液体外渗</text><rect x="277.5" y="496.0" width="215.5" height="96.0" rx="10" fill="#FDF3F2" stroke="#A3382C" stroke-width="1.4"/><text x="385.2" y="524.0" text-anchor="middle" font-size="12.5" fill="#A3382C" font-weight="700">② 泵送↓</text><text x="385.2" y="546.0" text-anchor="middle" font-size="11.5" fill="#37474F" font-weight="400">积液使腔内压↑，活动</text><text x="385.2" y="562.0" text-anchor="middle" font-size="11.5" fill="#37474F" font-weight="400">受限，泵送效率下降</text><rect x="507.0" y="496.0" width="215.5" height="96.0" rx="10" fill="#FDF3F2" stroke="#A3382C" stroke-width="1.4"/><text x="614.8" y="524.0" text-anchor="middle" font-size="12.5" fill="#A3382C" font-weight="700">③ 营养受损</text><text x="614.8" y="546.0" text-anchor="middle" font-size="11.5" fill="#37474F" font-weight="400">HA 被降解，黏弹性</text><text x="614.8" y="562.0" text-anchor="middle" font-size="11.5" fill="#37474F" font-weight="400">↓，软骨润滑与营养受</text><text x="614.8" y="578.0" text-anchor="middle" font-size="11.5" fill="#37474F" font-weight="400">损</text><rect x="736.5" y="496.0" width="215.5" height="96.0" rx="10" fill="#FDF3F2" stroke="#A3382C" stroke-width="1.4"/><text x="844.2" y="524.0" text-anchor="middle" font-size="12.5" fill="#A3382C" font-weight="700">④ 回流受阻</text><text x="844.2" y="546.0" text-anchor="middle" font-size="11.5" fill="#37474F" font-weight="400">淋巴/静脉回流淤滞，</text><text x="844.2" y="562.0" text-anchor="middle" font-size="11.5" fill="#37474F" font-weight="400">积液正反馈加重</text><text x="500.0" y="696.0" text-anchor="middle" font-size="11.5" fill="#4E5B64" font-weight="400">正常滑液量 0.5–2 mL｜浮髌试验阳性提示积液 ≥50 mL｜超声滑膜厚度正常 ≤2 mm、滑膜炎 ≥4 mm（OMERACT）</text></svg>