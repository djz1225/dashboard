<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 910" width="1000" height="910" role="img" aria-label="弥散性血管内凝血（DIC）的发病机制：凝血激活、微血栓形成与纤溶亢进"><rect width="1000" height="910" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F6C75"/></marker></defs><text x="48.0" y="42.0" text-anchor="start" font-size="11.5" fill="#4E5B64" font-weight="700">机制版 · 血液系统</text><text x="48.0" y="76.0" text-anchor="start" font-size="22" fill="#1B2A33" font-weight="700">弥散性血管内凝血（DIC）</text><text x="48.0" y="106.0" text-anchor="start" font-size="13.5" fill="#37474F" font-weight="400">凝血与纤溶同时失控：微血栓广泛形成，凝血因子与血小板被耗竭，继而出血</text><rect x="48.0" y="132.0" width="288.0" height="76.0" rx="10" fill="#FDF3F2" stroke="#A3382C" stroke-width="1.6"/><text x="192.0" y="164.0" text-anchor="middle" font-size="12.5" fill="#A3382C" font-weight="700">严重感染/脓毒症</text><text x="192.0" y="188.0" text-anchor="middle" font-size="11.5" fill="#37474F" font-weight="400">组织因子大量释放</text><rect x="356.0" y="132.0" width="288.0" height="76.0" rx="10" fill="#FDF3F2" stroke="#A3382C" stroke-width="1.6"/><text x="500.0" y="164.0" text-anchor="middle" font-size="12.5" fill="#A3382C" font-weight="700">产科急症</text><text x="500.0" y="188.0" text-anchor="middle" font-size="11.5" fill="#37474F" font-weight="400">羊水栓塞、胎盘早剥</text><rect x="664.0" y="132.0" width="288.0" height="76.0" rx="10" fill="#FDF3F2" stroke="#A3382C" stroke-width="1.6"/><text x="808.0" y="164.0" text-anchor="middle" font-size="12.5" fill="#A3382C" font-weight="700">恶性肿瘤/严重创伤</text><text x="808.0" y="188.0" text-anchor="middle" font-size="11.5" fill="#37474F" font-weight="400">组织因子入血</text><line x1="500.0" y1="212.0" x2="500.0" y2="248.0" stroke="#A3382C" stroke-width="2.6" stroke-linecap="round" marker-end="url(#ah)"/><text x="512.0" y="234.0" text-anchor="start" font-size="12.5" fill="#A3382C" font-weight="700">组织因子（TF）大量释放入血</text><rect x="150.0" y="264.0" width="700.0" height="80.0" rx="10" fill="#FFFFFF" stroke="#B03A2E" stroke-width="1.6"/><rect x="150.0" y="264.0" width="6.0" height="80.0" rx="3" fill="#B03A2E"/><text x="176.0" y="294.0" text-anchor="start" font-size="16" fill="#1B2A33" font-weight="700">凝血酶大量生成</text><text x="176.0" y="318.0" text-anchor="start" font-size="12.5" fill="#B03A2E" font-weight="600">FⅡa 生成远超生理需要</text><text x="176.0" y="339.0" text-anchor="start" font-size="11.5" fill="#37474F" font-weight="400">凝血酶是核心：既把纤维蛋白原变成纤维蛋白，又是最强的血小板激活剂</text><line x1="500.0" y1="346.0" x2="500.0" y2="355.0" stroke="#B03A2E" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ah)"/><rect x="150.0" y="356.0" width="700.0" height="80.0" rx="10" fill="#FFFFFF" stroke="#B03A2E" stroke-width="1.6"/><rect x="150.0" y="356.0" width="6.0" height="80.0" rx="3" fill="#B03A2E"/><text x="176.0" y="386.0" text-anchor="start" font-size="16" fill="#1B2A33" font-weight="700">① 微血栓广泛形成</text><text x="176.0" y="410.0" text-anchor="start" font-size="12.5" fill="#B03A2E" font-weight="600">纤维蛋白在微血管内沉积</text><text x="176.0" y="431.0" text-anchor="start" font-size="11.5" fill="#37474F" font-weight="400">沉积于肾、肺、脑、皮肤等微循环 → 器官缺血、微血管病性溶血性贫血</text><line x1="500.0" y1="438.0" x2="500.0" y2="447.0" stroke="#B03A2E" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ah)"/><rect x="150.0" y="448.0" width="700.0" height="80.0" rx="10" fill="#FFFFFF" stroke="#8A5A12" stroke-width="1.6"/><rect x="150.0" y="448.0" width="6.0" height="80.0" rx="3" fill="#8A5A12"/><text x="176.0" y="478.0" text-anchor="start" font-size="16" fill="#1B2A33" font-weight="700">② 凝血因子与血小板被耗竭</text><text x="176.0" y="502.0" text-anchor="start" font-size="12.5" fill="#8A5A12" font-weight="600">消耗性减少</text><text x="176.0" y="523.0" text-anchor="start" font-size="11.5" fill="#37474F" font-weight="400">因子Ⅰ/Ⅱ/Ⅴ/Ⅷ、血小板、抗凝血酶Ⅲ 被大量消耗 → 凝血时间延长</text><line x1="500.0" y1="530.0" x2="500.0" y2="539.0" stroke="#8A5A12" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ah)"/><rect x="150.0" y="540.0" width="700.0" height="80.0" rx="10" fill="#FFFFFF" stroke="#4A6FA5" stroke-width="1.6"/><rect x="150.0" y="540.0" width="6.0" height="80.0" rx="3" fill="#4A6FA5"/><text x="176.0" y="570.0" text-anchor="start" font-size="16" fill="#1B2A33" font-weight="700">③ 继发性纤溶亢进</text><text x="176.0" y="594.0" text-anchor="start" font-size="12.5" fill="#4A6FA5" font-weight="600">t-PA 释放，纤溶酶生成</text><text x="176.0" y="615.0" text-anchor="start" font-size="11.5" fill="#37474F" font-weight="400">纤溶酶降解纤维蛋白（原）→ FDP/D-二聚体升高，进一步抗凝与抗血小板</text><line x1="500.0" y1="622.0" x2="500.0" y2="631.0" stroke="#4A6FA5" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ah)"/><rect x="150.0" y="632.0" width="700.0" height="80.0" rx="10" fill="#FFFFFF" stroke="#A3382C" stroke-width="1.6"/><rect x="150.0" y="632.0" width="6.0" height="80.0" rx="3" fill="#A3382C"/><text x="176.0" y="662.0" text-anchor="start" font-size="16" fill="#1B2A33" font-weight="700">④ 出血与器官衰竭并存</text><text x="176.0" y="686.0" text-anchor="start" font-size="12.5" fill="#A3382C" font-weight="600">微血栓 + 出血的矛盾表现</text><text x="176.0" y="707.0" text-anchor="start" font-size="11.5" fill="#37474F" font-weight="400">临床上同时可见栓塞与出血，是 DIC 最特征也最危险之处</text><path d="M944,672 C978,612 978,364 944,304" fill="none" stroke="#A3382C" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#ah)"/><text x="978" y="488.0" text-anchor="middle" font-size="11.5" fill="#A3382C" font-weight="700" transform="rotate(90 978 488.0)">正反馈：缺血与炎症进一步激活凝血</text><rect x="48.0" y="806.0" width="904.0" height="76.0" rx="10" fill="#F7FAFC" stroke="#C7D2DC" stroke-width="1.2"/><text x="68.0" y="832.0" text-anchor="start" font-size="12.5" fill="#1F5FA0" font-weight="700">关键实验室指标（同时反映消耗与纤溶）</text><text x="68.0" y="856.0" text-anchor="start" font-size="13.5" fill="#37474F" font-weight="400">血小板↓　纤维蛋白原↓　PT/APTT 延长　D-二聚体↑↑　FDP↑　抗凝血酶Ⅲ↓　3P 试验阳性</text><text x="500.0" y="892.0" text-anchor="middle" font-size="11.5" fill="#4E5B64" font-weight="400">诊断需结合基础疾病 + 动态变化；单次指标正常不能排除 DIC。仅用于教学示意。</text></svg>