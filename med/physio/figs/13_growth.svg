<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" role="img" aria-labelledby="ft fd" style="background:#ffffff"><title id="ft">生长发育的两个突增期</title><desc id="fd">生长速度不是匀速：婴儿期与青春期各有一次突增；前者以营养与甲状腺激素为主，后者靠 GH 与性激素协同。</desc><text x="200.0" y="28" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="0.55s" fill="freeze" calcMode="spline" keySplines="0.23 1 0.32 1"/>生长速度：一生有两个突增期<tspan x="200.0" y="48" text-anchor="middle" font-size="11" fill="#64748b" font-weight="400">婴儿期与青春期；不是匀速直线</tspan></text><path d="M52,86 L52,316 L372,316" stroke="#e2e8f0" stroke-width="1.3" fill="none"/><path d="M52.0,103.2 L60.0,122.8 L68.0,142.4 L76.0,162.0 L84.0,181.6 L92.0,185.5 L100.0,189.4 L108.0,193.4 L116.0,197.3 L124.0,201.2 L132.0,205.1 L140.0,209.0 L148.0,213.0 L156.0,216.9 L164.0,220.8 L172.0,224.7 L180.0,228.6 L188.0,232.6 L196.0,236.5 L204.0,240.4 L212.0,244.3 L220.0,230.9 L228.0,217.4 L236.0,204.0 L244.0,190.6 L252.0,177.1 L260.0,163.7 L268.0,150.2 L276.0,136.8 L284.0,148.4 L292.0,159.9 L300.0,171.5 L308.0,183.1 L316.0,194.7 L324.0,206.2 L332.0,217.8 L340.0,229.4 L348.0,241.0 L356.0,252.5 L364.0,264.1 L372.0,275.7" fill="none" stroke="#c0392b" stroke-width="2.8" stroke-linecap="round" stroke-dasharray="520" stroke-dashoffset="520"><animate attributeName="stroke-dashoffset" values="520;0" keyTimes="0;1" dur="7.0s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1"/></path><circle r="4.6" fill="#ffffff" stroke="#c0392b" stroke-width="2.4"><animateTransform attributeName="transform" type="translate" values="52.0,103.2;60.0,122.8;68.0,142.4;76.0,162.0;84.0,181.6;92.0,185.5;100.0,189.4;108.0,193.4;116.0,197.3;124.0,201.2;132.0,205.1;140.0,209.0;148.0,213.0;156.0,216.9;164.0,220.8;172.0,224.7;180.0,228.6;188.0,232.6;196.0,236.5;204.0,240.4;212.0,244.3;220.0,230.9;228.0,217.4;236.0,204.0;244.0,190.6;252.0,177.1;260.0,163.7;268.0,150.2;276.0,136.8;284.0,148.4;292.0,159.9;300.0,171.5;308.0,183.1;316.0,194.7;324.0,206.2;332.0,217.8;340.0,229.4;348.0,241.0;356.0,252.5;364.0,264.1;372.0,275.7" keyTimes="0;0.025;0.05;0.075;0.1;0.125;0.15;0.175;0.2;0.225;0.25;0.275;0.3;0.325;0.35;0.375;0.4;0.425;0.45;0.475;0.5;0.525;0.55;0.575;0.6;0.625;0.65;0.675;0.7;0.725;0.75;0.775;0.8;0.825;0.85;0.875;0.9;0.925;0.95;0.975;1" dur="7.0s" repeatCount="indefinite" calcMode="linear"/></circle><text font-size="11" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="#64748b"><tspan x="46" y="320" text-anchor="end">0</tspan><tspan x="372.0" y="332" text-anchor="end">20 岁</tspan><tspan x="84.0" y="96.5" text-anchor="middle" fill="#c0392b">婴儿期突增</tspan><tspan x="244.0" y="123.4" text-anchor="middle" fill="#c0392b">青春期突增</tspan><tspan x="54" y="76">生长速度</tspan></text><text x="34" y="342" font-size="11" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="#1e293b">婴儿期：出生后第一年增长最快（约 25 cm），出生身长约 50 cm</text><text x="34" y="362" font-size="11" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="#1e293b">儿童期：平稳每年 5~7 cm；2 岁到青春期前约 5 cm/年</text><text x="34" y="382" font-size="11" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="#1e293b">青春期：GH + 性激素协同，突增约 25~30 cm，之后骨骺闭合停止长高</text><rect x="24" y="394" width="352" height="42" rx="9" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.3" opacity="0.75"/><text x="38" y="412" font-size="11" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">GH 管长个（经 IGF-1 作用于骨骺软骨）；甲状腺激素管成熟；性激素管突增与骨骺闭合</text><text x="38" y="430" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">幼年缺甲状腺激素 → 呆小症（身材矮 + 智力低下）；缺 GH → 侏儒但智力正常</text><text x="200.0" y="446" text-anchor="middle" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><tspan fill="#c0392b">■</tspan> 生长速度曲线</text></svg>