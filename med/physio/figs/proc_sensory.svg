<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 556" role="img" aria-labelledby="ft fd" style="background:#ffffff"><title id="ft">感受器：把世界翻译成电</title><desc id="fd">感受器先把各种形式的能量换能成电信号：刺激改变膜通透性产生离子流，形成分级的感受器电位，幅度随刺激强度增大并可叠加。强度信息编码在传入纤维的放电频率里而不是幅度里；部位信息由「哪条纤维在放电」决定，即标线原理；性质由专用通路决定。持续刺激下电位衰减即适应，快适应感受器报告变化（触觉），慢适应感受器报告持续状态（痛觉、肌梭）。</desc><text x="22" y="28" font-size="17.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">感受器：把世界翻译成电</text><text x="22" y="46" font-size="11.5" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">换能之后，强度看频率、部位看通道、性质看专线</text><rect x="22" y="60" width="436" height="176" rx="10" fill="#f8fbfd" stroke="#dfe8f1" stroke-width="1"/><rect x="38" y="102" width="104" height="48" rx="9" fill="#ffffff" stroke="#a8791a" stroke-width="1.4" opacity="0.85"/><text x="90" y="122" font-size="12.5" fill="#a8791a" font-weight="700" text-anchor="middle" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">刺激</text><text x="90" y="140" font-size="11.5" fill="#8899aa" font-weight="400" text-anchor="middle" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">光/声/压/化学</text><path d="M172,96 V156" stroke="#0f766e" stroke-width="7" opacity="0.22"/><path d="M172,96 V156" stroke="#0f766e" stroke-width="1.4"/><text x="172" y="172" font-size="11.5" fill="#0f766e" font-weight="700" text-anchor="middle" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">感受器膜</text><path d="M146,126 H168" stroke="#a8791a" stroke-width="2" opacity="0.4"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.15;0.1506;0.31;0.3106;1" dur="11.4s" repeatCount="indefinite"/><path d="M146,126 H168" stroke="#a8791a" stroke-width="2.6"/><path d="M168,126 l-7,-3.6 v7.2 z" fill="#a8791a"/><circle cx="184" cy="126" r="4.4" fill="#0f766e"/><text x="194" y="130" font-size="11.5" fill="#0f766e" font-weight="700" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">离子流</text></g><path d="M30,188 H270" stroke="#cbd8e4" stroke-width="1.2"/><text x="30" y="204" font-size="11.5" fill="#94a3b8" font-weight="400" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">弱刺激</text><text x="264" y="204" font-size="11.5" fill="#94a3b8" font-weight="400" text-anchor="end" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">强刺激</text><text x="30" y="154" font-size="11.5" fill="#c0392b" font-weight="700" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">① 幅度：感受器电位</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.31;0.3106;0.47;0.4706;1" dur="11.4s" repeatCount="indefinite"/><path d="M62,188 V176" stroke="#c0392b" stroke-width="3"/><path d="M118,188 V164" stroke="#c0392b" stroke-width="3"/><path d="M174,188 V152" stroke="#c0392b" stroke-width="3"/></g><text x="300" y="154" font-size="11.5" fill="#2c5f9e" font-weight="700" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">② 频率（强度）</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.47;0.4706;0.635;0.6356;1" dur="11.4s" repeatCount="indefinite"/><path d="M276,170 H296" stroke="#2c5f9e" stroke-width="1.8"/><path d="M296,170 l-7,-3.4 v6.8 z" fill="#2c5f9e"/><rect x="304" y="158" width="4" height="24" rx="2" fill="#2c5f9e"/><rect x="317" y="158" width="4" height="24" rx="2" fill="#2c5f9e"/><rect x="330" y="158" width="4" height="24" rx="2" fill="#2c5f9e"/><rect x="343" y="158" width="4" height="24" rx="2" fill="#2c5f9e"/><text x="304" y="204" font-size="11.5" fill="#2c5f9e" font-weight="700" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">刺激越强，频率越高</text></g><path d="M30,216 H450" stroke="#e3ebf3" stroke-width="1" stroke-dasharray="3 3"/><text x="30" y="232" font-size="11.5" fill="#2f8f57" font-weight="700" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">③ 部位：哪条纤维放电（标线原理）</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.635;0.6356;0.815;0.8156;1" dur="11.4s" repeatCount="indefinite"/><path d="M30,240 H450" stroke="#2f8f57" stroke-width="2" stroke-dasharray="6 4"/><text x="30" y="258" font-size="11.5" fill="#c1440e" font-weight="700" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">④ 适应：快适应报告变化，慢适应报告持续状态</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.815;0.8156;1" dur="11.4s" repeatCount="indefinite"/><text x="30" y="258" font-size="11.5" fill="#c1440e" font-weight="700" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">④ 适应：快适应报告变化，慢适应报告持续</text></g><rect x="22" y="258" width="436" height="3" rx="1.5" fill="#e8eff6"/><path d="M22,259.5 H458" stroke="#0f766e" stroke-width="3" stroke-linecap="round" opacity="0.42" stroke-dasharray="436" stroke-dashoffset="436"><animate attributeName="stroke-dashoffset" values="436;0" keyTimes="0;1" dur="11.4s" repeatCount="indefinite"/></path><circle cx="56.7" cy="259.5" r="4" fill="#ffffff" stroke="#cfdce8" stroke-width="1.5"/><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.15;0.1506;1" dur="11.4s" repeatCount="indefinite"/><circle cx="56.7" cy="259.5" r="5.5" fill="#a8791a"/></g><g opacity="1"><animate attributeName="opacity" values="0.0;0.0;1.0;1.0" keyTimes="0;0.15;0.1506;1" dur="11.4s" repeatCount="indefinite"/><text x="56.7" y="280" text-anchor="middle" font-size="11.5" fill="#b6c4d2" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">刺激</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.15;0.1506;1" dur="11.4s" repeatCount="indefinite"/><text x="56.7" y="280" text-anchor="middle" font-size="11.5" font-weight="700" fill="#a8791a" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">刺激</text></g><circle cx="130.0" cy="259.5" r="4" fill="#ffffff" stroke="#cfdce8" stroke-width="1.5"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.15;0.1506;0.31;0.3106;1" dur="11.4s" repeatCount="indefinite"/><circle cx="130.0" cy="259.5" r="5.5" fill="#0f766e"/></g><g opacity="1"><animate attributeName="opacity" values="1.0;1.0;0.0;0.0;1.0;1.0" keyTimes="0;0.15;0.1506;0.31;0.3106;1" dur="11.4s" repeatCount="indefinite"/><text x="130.0" y="280" text-anchor="middle" font-size="11.5" fill="#b6c4d2" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">换能</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.15;0.1506;0.31;0.3106;1" dur="11.4s" repeatCount="indefinite"/><text x="130.0" y="280" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">换能</text></g><circle cx="203.3" cy="259.5" r="4" fill="#ffffff" stroke="#cfdce8" stroke-width="1.5"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.31;0.3106;0.47;0.4706;1" dur="11.4s" repeatCount="indefinite"/><circle cx="203.3" cy="259.5" r="5.5" fill="#c0392b"/></g><g opacity="1"><animate attributeName="opacity" values="1.0;1.0;0.0;0.0;1.0;1.0" keyTimes="0;0.31;0.3106;0.47;0.4706;1" dur="11.4s" repeatCount="indefinite"/><text x="203.3" y="280" text-anchor="middle" font-size="11.5" fill="#b6c4d2" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">感受器电位</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.31;0.3106;0.47;0.4706;1" dur="11.4s" repeatCount="indefinite"/><text x="203.3" y="280" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c0392b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">感受器电位</text></g><circle cx="276.7" cy="259.5" r="4" fill="#ffffff" stroke="#cfdce8" stroke-width="1.5"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.47;0.4706;0.635;0.6356;1" dur="11.4s" repeatCount="indefinite"/><circle cx="276.7" cy="259.5" r="5.5" fill="#2c5f9e"/></g><g opacity="1"><animate attributeName="opacity" values="1.0;1.0;0.0;0.0;1.0;1.0" keyTimes="0;0.47;0.4706;0.635;0.6356;1" dur="11.4s" repeatCount="indefinite"/><text x="276.7" y="280" text-anchor="middle" font-size="11.5" fill="#b6c4d2" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">编码·幅度</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.47;0.4706;0.635;0.6356;1" dur="11.4s" repeatCount="indefinite"/><text x="276.7" y="280" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2c5f9e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">编码·幅度</text></g><circle cx="350.0" cy="259.5" r="4" fill="#ffffff" stroke="#cfdce8" stroke-width="1.5"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.635;0.6356;0.815;0.8156;1" dur="11.4s" repeatCount="indefinite"/><circle cx="350.0" cy="259.5" r="5.5" fill="#2f8f57"/></g><g opacity="1"><animate attributeName="opacity" values="1.0;1.0;0.0;0.0;1.0;1.0" keyTimes="0;0.635;0.6356;0.815;0.8156;1" dur="11.4s" repeatCount="indefinite"/><text x="350.0" y="280" text-anchor="middle" font-size="11.5" fill="#b6c4d2" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">编码·部位</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.635;0.6356;0.815;0.8156;1" dur="11.4s" repeatCount="indefinite"/><text x="350.0" y="280" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">编码·部位</text></g><circle cx="423.3" cy="259.5" r="4" fill="#ffffff" stroke="#cfdce8" stroke-width="1.5"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.815;0.8156;1" dur="11.4s" repeatCount="indefinite"/><circle cx="423.3" cy="259.5" r="5.5" fill="#c1440e"/></g><g opacity="1"><animate attributeName="opacity" values="1.0;1.0;0.0;0.0" keyTimes="0;0.815;0.8156;1" dur="11.4s" repeatCount="indefinite"/><text x="423.3" y="280" text-anchor="middle" font-size="11.5" fill="#b6c4d2" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">适应</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.815;0.8156;1" dur="11.4s" repeatCount="indefinite"/><text x="423.3" y="280" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c1440e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">适应</text></g><rect x="22" y="292" width="436" height="92" rx="10" fill="#ffffff" stroke="#e3ebf3" stroke-width="1"/><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.15;0.1506;1" dur="11.4s" repeatCount="indefinite"/><rect x="22" y="293" width="3" height="90" fill="#a8791a" opacity="0.85"/><text x="40" y="318" font-size="11.5" fill="#a8b6c4" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">因为</text><text x="78" y="318" font-size="12.5" fill="#6b7c8d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">外界能量（光、声、压力、化学物质）作用于感受器</text><text x="40" y="354" font-size="11.5" fill="#a8791a" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">所以</text><text x="78" y="354" font-size="14.5" fill="#a8791a" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">不同感受器只对特定形式的能量敏感（适宜刺激）</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.15;0.1506;0.31;0.3106;1" dur="11.4s" repeatCount="indefinite"/><rect x="22" y="293" width="3" height="90" fill="#0f766e" opacity="0.85"/><text x="40" y="318" font-size="11.5" fill="#a8b6c4" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">因为</text><text x="78" y="318" font-size="12.5" fill="#6b7c8d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">刺激使感受器膜通透性改变，产生离子流</text><text x="40" y="354" font-size="11.5" fill="#0f766e" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">所以</text><text x="78" y="354" font-size="14.5" fill="#0f766e" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">能量形式被统一翻译成电信号 —— 换能</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.31;0.3106;0.47;0.4706;1" dur="11.4s" repeatCount="indefinite"/><rect x="22" y="293" width="3" height="90" fill="#c0392b" opacity="0.85"/><text x="40" y="318" font-size="11.5" fill="#a8b6c4" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">因为</text><text x="78" y="318" font-size="12.5" fill="#6b7c8d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">离子流形成局部去极化，幅度随刺激强度增大</text><text x="40" y="354" font-size="11.5" fill="#c0392b" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">所以</text><text x="78" y="354" font-size="14.5" fill="#c0392b" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">这是分级电位，不是「全或无」，可以叠加</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.47;0.4706;0.635;0.6356;1" dur="11.4s" repeatCount="indefinite"/><rect x="22" y="293" width="3" height="90" fill="#2c5f9e" opacity="0.85"/><text x="40" y="318" font-size="11.5" fill="#a8b6c4" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">因为</text><text x="78" y="318" font-size="12.5" fill="#6b7c8d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">刺激越强，感受器电位越大，放电频率越高</text><text x="40" y="354" font-size="11.5" fill="#2c5f9e" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">所以</text><text x="78" y="354" font-size="14.5" fill="#2c5f9e" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">强度信息编在「频率」里，不是幅度里</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.635;0.6356;0.815;0.8156;1" dur="11.4s" repeatCount="indefinite"/><rect x="22" y="293" width="3" height="90" fill="#2f8f57" opacity="0.85"/><text x="40" y="318" font-size="11.5" fill="#a8b6c4" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">因为</text><text x="78" y="318" font-size="12.5" fill="#6b7c8d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">不同部位刺激激活不同传入纤维</text><text x="40" y="354" font-size="11.5" fill="#2f8f57" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">所以</text><text x="78" y="354" font-size="14.5" fill="#2f8f57" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">空间信息由「哪条线在放电」决定 —— 标线原理</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.815;0.8156;1" dur="11.4s" repeatCount="indefinite"/><rect x="22" y="293" width="3" height="90" fill="#c1440e" opacity="0.85"/><text x="40" y="318" font-size="11.5" fill="#a8b6c4" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">因为</text><text x="78" y="318" font-size="12.5" fill="#6b7c8d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">持续刺激下感受器电位逐渐衰减</text><text x="40" y="354" font-size="11.5" fill="#c1440e" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">所以</text><text x="78" y="354" font-size="14.5" fill="#c1440e" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">快适应（触觉）报告变化；慢适应（痛、肌梭）报告持续</text><text x="78" y="371.5" font-size="14.5" fill="#c1440e" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">状态</text></g><text x="22" y="403" font-size="11.5" fill="#a8b6c4" font-weight="700" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">换能 + 两种编码</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.15;0.1506;0.31;0.3106;1" dur="11.4s" repeatCount="indefinite"/><rect x="22" y="413" width="3" height="15" rx="1.5" fill="#0f766e"/><text x="34" y="424" font-size="12.5" fill="#0f766e" font-weight="700" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">换能</text><text x="104" y="424" font-size="12" fill="#6b7c8d" font-weight="400" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">各种能量 → 电信号</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.47;0.4706;0.635;0.6356;1" dur="11.4s" repeatCount="indefinite"/><rect x="22" y="436" width="3" height="15" rx="1.5" fill="#2c5f9e"/><text x="34" y="447" font-size="12.5" fill="#2c5f9e" font-weight="700" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">强度</text><text x="104" y="447" font-size="12" fill="#6b7c8d" font-weight="400" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">编在放电频率里</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.635;0.6356;0.815;0.8156;1" dur="11.4s" repeatCount="indefinite"/><rect x="22" y="459" width="3" height="15" rx="1.5" fill="#2f8f57"/><text x="34" y="470" font-size="12.5" fill="#2f8f57" font-weight="700" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">部位</text><text x="104" y="470" font-size="12" fill="#6b7c8d" font-weight="400" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">编在「哪条线」里（标线）</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.815;0.8156;1" dur="11.4s" repeatCount="indefinite"/><rect x="22" y="482" width="3" height="15" rx="1.5" fill="#c1440e"/><text x="34" y="493" font-size="12.5" fill="#c1440e" font-weight="700" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">适应</text><text x="104" y="493" font-size="12" fill="#6b7c8d" font-weight="400" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">快/慢决定报告什么</text></g><rect x="22" y="508" width="436" height="33" rx="8" fill="#f0fdfa"/><text x="34" y="528" font-size="12" fill="#1e293b" font-weight="700" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">感觉系统只传输四件事：性质、强度、部位、持续时间</text></svg>