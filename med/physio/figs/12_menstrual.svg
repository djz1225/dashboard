<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" role="img" aria-labelledby="ft fd" style="background:#ffffff"><title id="ft">月经周期四激素时序</title><desc id="fd">FSH 促卵泡发育，雌激素出现两个峰，LH 峰触发排卵；黄体期孕激素升高，撤退后月经来潮。</desc><text x="200.0" y="28" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="0.55s" fill="freeze" calcMode="spline" keySplines="0.23 1 0.32 1"/>月经周期：四个激素的时序<tspan x="200.0" y="48" text-anchor="middle" font-size="11" fill="#64748b" font-weight="400">雌激素两峰、孕激素一峰、LH 峰触发排卵</tspan></text><path d="M56,86 L56,300 L372,300" stroke="#e2e8f0" stroke-width="1.3" fill="none"/><path d="M56.0,183.5 L66.9,183.5 L77.7,183.5 L88.6,183.5 L99.5,183.5 L110.3,183.5 L121.2,183.5 L132.1,266.7 L142.9,266.7 L153.8,266.7 L164.7,264.5 L175.5,255.7 L186.4,238.5 L197.3,208.6 L208.1,220.4 L219.0,237.0 L229.9,244.3 L240.8,266.6 L251.6,266.7 L262.5,266.7 L273.4,266.7 L284.2,266.7 L295.1,266.7 L306.0,266.7 L316.8,266.7 L327.7,266.7 L338.6,266.7 L349.4,266.7 L360.3,266.7" fill="none" stroke="#2c5f9e" stroke-width="2.2"/><path d="M56.0,266.7 L66.9,266.7 L77.7,266.7 L88.6,266.7 L99.5,266.7 L110.3,266.7 L121.2,266.7 L132.1,266.7 L142.9,266.7 L153.8,266.7 L164.7,266.4 L175.5,260.0 L186.4,210.8 L197.3,109.1 L208.1,115.5 L219.0,217.3 L229.9,261.2 L240.8,266.5 L251.6,266.7 L262.5,266.7 L273.4,266.7 L284.2,266.7 L295.1,266.7 L306.0,266.7 L316.8,266.7 L327.7,266.7 L338.6,266.7 L349.4,266.7 L360.3,266.7" fill="none" stroke="#c1440e" stroke-width="2.4"/><path d="M56.0,279.2 L66.9,279.2 L77.7,279.2 L88.6,279.2 L99.5,279.2 L110.3,279.2 L121.2,279.2 L132.1,279.2 L142.9,279.2 L153.8,254.3 L164.7,214.8 L175.5,187.4 L186.4,194.5 L197.3,229.6 L208.1,265.4 L219.0,279.2 L229.9,279.2 L240.8,274.9 L251.6,256.0 L262.5,231.9 L273.4,208.8 L284.2,194.1 L295.1,193.5 L306.0,207.2 L316.8,230.0 L327.7,254.3 L338.6,274.1 L349.4,279.2 L360.3,279.2" f