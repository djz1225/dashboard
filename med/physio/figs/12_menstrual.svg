">卵泡期</tspan><tspan x="290.1" y="88" text-anchor="middle" fill="#2f8f57">黄体期</tspan><tspan x="58" y="74">激素水平</tspan></text><rect x="24" y="316" width="352" height="42" rx="9" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/><text x="38" y="334" font-size="11" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">卵泡期：FSH 促卵泡发育；雌激素先负反馈、后正反馈</text><text x="38" y="350" font-size="11" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">黄体期：孕激素升高使基础体温升高 0.3~0.5℃</text><text x="34" y="378" font-size="11" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="#1e293b">雌激素有两个峰：排卵前峰（先升高→正反馈触发 LH 峰）与黄体期峰（与孕激素同步）</text><text x="34" y="398" font-size="11" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="#1e293b">LH 峰触发排卵；LH 支持黄体早期发育，黄体萎缩后孕激素撤退 → 月经</text><text x="34" y="418" font-size="11" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="#1e293b">若受孕：hCG 替代 LH 保住黄体，孕激素维持不降，月经不来</text><text x="200.0" y="442" text-anchor="middle" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><tspan fill="#2c5f9e">■</tspan> FSH　<tspan fill="#c1440e">■</tspan> LH　<tspan fill="#c0392b">■</tspan> 雌激素　<tspan fill="#2f8f57">■</tspan> 孕激素</text><text x="200.0" y="462" text-anchor="middle" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">排卵前雌激素由负反馈转为正反馈，是内分泌里少见的正反馈</text></svg>