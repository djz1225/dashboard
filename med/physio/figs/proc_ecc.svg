<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 556" role="img" aria-labelledby="ft fd" style="background:#ffffff"><title id="ft">兴奋-收缩耦联：从电信号到机械收缩</title><desc id="fd">兴奋-收缩耦联把电信号变成机械收缩：动作电位沿肌膜传播，经 T 管传入细胞深部，使 T 管膜上的 L 型钙通道（DHPR）感受到电压变化；在骨骼肌它机械偶联激活肌质网 RyR，在心肌还需钙内流触发钙致钙释放，胞质 Ca²⁺ 从 10⁻⁷ 升到 10⁻⁵ mol/L。Ca²⁺ 与肌钙蛋白 C 结合使原肌球蛋白滚开、肌动蛋白位点暴露，横桥结合并摆动产生收缩。钙泵把 Ca²⁺ 泵回肌质网后胞质钙下降，肌肉舒张 —— 舒张过程同样消耗 ATP。</desc><text x="22" y="28" font-size="17.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">兴奋-收缩耦联：从电信号到机械收缩</text><text x="22" y="46" font-size="11.5" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">T 管深入 → 钙通道 → 钙致钙释放 → TnC → 横桥摆动</text><rect x="22" y="60" width="436" height="176" rx="10" fill="#f8fbfd" stroke="#dfe8f1" stroke-width="1"/><path d="M28,100 H452" stroke="#c0392b" stroke-width="3.4"/><text x="28" y="92" font-size="11.5" fill="#c0392b" font-weight="700" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">肌膜</text><path d="M201,100 V188 H227 V100" fill="none" stroke="#a8791a" stroke-width="2.6"/><text x="234" y="120" font-size="11.5" fill="#a8791a" font-weight="700" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">T 管</text><ellipse cx="214" cy="144" rx="52" ry="26" fill="none" stroke="#0f766e" stroke-width="1.8" opacity="0.55" stroke-dasharray="4 3"/><text x="160" y="178" font-size="11.5" fill="#0f766e" font-weight="700" text-anchor="end" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">肌质网</text><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.15;0.1506;1" dur="11.4s" repeatCount="indefinite"/><path d="M42,100 H174" stroke="#c0392b" stroke-width="3"/><path d="M174,100 l-9,-4.6 v9.2 z" fill="#c0392b"/><text x="42" y="118" font-size="11.5" fill="#c0392b" font-weight="700" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">动作电位</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.15;0.1506;0.31;0.3106;1" dur="11.4s" repeatCount="indefinite"/><path d="M214,108 V178" stroke="#a8791a" stroke-width="2.6"/><path d="M214,178 l-4,-9 h8 z" fill="#a8791a"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.31;0.3106;0.47;0.4706;1" dur="11.4s" repeatCount="indefinite"/><rect x="206" y="134" width="16" height="14" rx="3" fill="#0f766e" opacity="0.85"/><text x="240" y="146" font-size="11.5" fill="#0f766e" font-weight="700" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">DHPR（L 型钙通道）</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.47;0.4706;0.635;0.6356;1" dur="11.4s" repeatCount="indefinite"/><circle cx="180" cy="156" r="3.8" fill="#c1440e"/><circle cx="202" cy="156" r="3.8" fill="#c1440e"/><circle cx="224" cy="156" r="3.8" fill="#c1440e"/><circle cx="246" cy="156" r="3.8" fill="#c1440e"/><path d="M214,156 V168" stroke="#c1440e" stroke-width="2"/><text x="210" y="182" font-size="11.5" fill="#c1440e" font-weight="700" text-anchor="end" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">Ca²⁺ 释放</text></g><path d="M32,198 H448" stroke="#2c5f9e" stroke-width="6" stroke-linecap="round" opacity="0.28"/><path d="M32,216 H448" stroke="#c0392b" stroke-width="4" stroke-linecap="round" opacity="0.45"/><text x="32" y="188" font-size="11.5" fill="#2c5f9e" font-weight="700" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">粗肌丝</text><text x="32" y="234" font-size="11.5" fill="#c0392b" font-weight="700" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">细肌丝</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.635;0.6356;0.815;0.8156;1" dur="11.4s" repeatCount="indefinite"/><circle cx="150" cy="216" r="6" fill="#dcfce7" stroke="#2f8f57" stroke-width="1.6"/><text x="150" y="206" font-size="11.5" fill="#2f8f57" font-weight="700" text-anchor="middle" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">Ca²⁺-TnC</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.815;0.8156;1" dur="11.4s" repeatCount="indefinite"/><path d="M418,216 V156" stroke="#2c5f9e" stroke-width="2" stroke-dasharray="4 3"/><path d="M418,156 l-4,9 h8 z" fill="#2c5f9e"/><text x="412" y="210" font-size="11.5" fill="#2c5f9e" font-weight="700" text-anchor="end" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">钙泵回收 → 舒张</text></g><rect x="22" y="258" width="436" height="3" rx="1.5" fill="#e8eff6"/><path d="M22,259.5 H458" stroke="#0f766e" stroke-width="3" stroke-linecap="round" opacity="0.42" stroke-dasharray="436" stroke-dashoffset="436"><animate attributeName="stroke-dashoffset" values="436;0" keyTimes="0;1" dur="11.4s" repeatCount="indefinite"/></path><circle cx="56.7" cy="259.5" r="4" fill="#ffffff" stroke="#cfdce8" stroke-width="1.5"/><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.15;0.1506;1" dur="11.4s" repeatCount="indefinite"/><circle cx="56.7" cy="259.5" r="5.5" fill="#c0392b"/></g><g opacity="1"><animate attributeName="opacity" values="0.0;0.0;1.0;1.0" keyTimes="0;0.15;0.1506;1" dur="11.4s" repeatCount="indefinite"/><text x="56.7" y="280" text-anchor="middle" font-size="11.5" fill="#b6c4d2" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">动作电位</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.15;0.1506;1" dur="11.4s" repeatCount="indefinite"/><text x="56.7" y="280" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c0392b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">动作电位</text></g><circle cx="130.0" cy="259.5" r="4" fill="#ffffff" stroke="#cfdce8" stroke-width="1.5"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.15;0.1506;0.31;0.3106;1" dur="11.4s" repeatCount="indefinite"/><circle cx="130.0" cy="259.5" r="5.5" fill="#a8791a"/></g><g opacity="1"><animate attributeName="opacity" values="1.0;1.0;0.0;0.0;1.0;1.0" keyTimes="0;0.15;0.1506;0.31;0.3106;1" dur="11.4s" repeatCount="indefinite"/><text x="130.0" y="280" text-anchor="middle" font-size="11.5" fill="#b6c4d2" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">沿 T 管深入</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.15;0.1506;0.31;0.3106;1" dur="11.4s" repeatCount="indefinite"/><text x="130.0" y="280" text-anchor="middle" font-size="11.5" font-weight="700" fill="#a8791a" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">沿 T 管深入</text></g><circle cx="203.3" cy="259.5" r="4" fill="#ffffff" stroke="#cfdce8" stroke-width="1.5"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.31;0.3106;0.47;0.4706;1" dur="11.4s" repeatCount="indefinite"/><circle cx="203.3" cy="259.5" r="5.5" fill="#0f766e"/></g><g opacity="1"><animate attributeName="opacity" values="1.0;1.0;0.0;0.0;1.0;1.0" keyTimes="0;0.31;0.3106;0.47;0.4706;1" dur="11.4s" repeatCount="indefinite"/><text x="203.3" y="280" text-anchor="middle" font-size="11.5" fill="#b6c4d2" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">L 型钙通道</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.31;0.3106;0.47;0.4706;1" dur="11.4s" repeatCount="indefinite"/><text x="203.3" y="280" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">L 型钙通道</text></g><circle cx="276.7" cy="259.5" r="4" fill="#ffffff" stroke="#cfdce8" stroke-width="1.5"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.47;0.4706;0.635;0.6356;1" dur="11.4s" repeatCount="indefinite"/><circle cx="276.7" cy="259.5" r="5.5" fill="#c1440e"/></g><g opacity="1"><animate attributeName="opacity" values="1.0;1.0;0.0;0.0;1.0;1.0" keyTimes="0;0.47;0.4706;0.635;0.6356;1" dur="11.4s" repeatCount="indefinite"/><text x="276.7" y="280" text-anchor="middle" font-size="11.5" fill="#b6c4d2" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">钙致钙释放</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.47;0.4706;0.635;0.6356;1" dur="11.4s" repeatCount="indefinite"/><text x="276.7" y="280" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c1440e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">钙致钙释放</text></g><circle cx="350.0" cy="259.5" r="4" fill="#ffffff" stroke="#cfdce8" stroke-width="1.5"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.635;0.6356;0.815;0.8156;1" dur="11.4s" repeatCount="indefinite"/><circle cx="350.0" cy="259.5" r="5.5" fill="#2f8f57"/></g><g opacity="1"><animate attributeName="opacity" values="1.0;1.0;0.0;0.0;1.0;1.0" keyTimes="0;0.635;0.6356;0.815;0.8156;1" dur="11.4s" repeatCount="indefinite"/><text x="350.0" y="280" text-anchor="middle" font-size="11.5" fill="#b6c4d2" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">TnC 结合</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.635;0.6356;0.815;0.8156;1" dur="11.4s" repeatCount="indefinite"/><text x="350.0" y="280" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">TnC 结合</text></g><circle cx="423.3" cy="259.5" r="4" fill="#ffffff" stroke="#cfdce8" stroke-width="1.5"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.815;0.8156;1" dur="11.4s" repeatCount="indefinite"/><circle cx="423.3" cy="259.5" r="5.5" fill="#2c5f9e"/></g><g opacity="1"><animate attributeName="opacity" values="1.0;1.0;0.0;0.0" keyTimes="0;0.815;0.8156;1" dur="11.4s" repeatCount="indefinite"/><text x="423.3" y="280" text-anchor="middle" font-size="11.5" fill="#b6c4d2" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">收缩与舒张</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.815;0.8156;1" dur="11.4s" repeatCount="indefinite"/><text x="423.3" y="280" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2c5f9e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">收缩与舒张</text></g><rect x="22" y="292" width="436" height="92" rx="10" fill="#ffffff" stroke="#e3ebf3" stroke-width="1"/><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.15;0.1506;1" dur="11.4s" repeatCount="indefinite"/><rect x="22" y="293" width="3" height="90" fill="#c0392b" opacity="0.85"/><text x="40" y="318" font-size="11.5" fill="#a8b6c4" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">因为</text><text x="78" y="318" font-size="12.5" fill="#6b7c8d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">运动终板产生的动作电位沿肌膜传播</text><text x="40" y="354" font-size="11.5" fill="#c0392b" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">所以</text><text x="78" y="354" font-size="14.5" fill="#c0392b" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">为后面所有步骤提供起始信号</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.15;0.1506;0.31;0.3106;1" dur="11.4s" repeatCount="indefinite"/><rect x="22" y="293" width="3" height="90" fill="#a8791a" opacity="0.85"/><text x="40" y="318" font-size="11.5" fill="#a8b6c4" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">因为</text><text x="78" y="318" font-size="12.5" fill="#6b7c8d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">T 管是肌膜的凹陷，把兴奋传向细胞深部</text><text x="40" y="354" font-size="11.5" fill="#a8791a" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">所以</text><text x="78" y="354" font-size="14.5" fill="#a8791a" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">让深部的肌原纤维同时收到信号，收缩才能同步</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.31;0.3106;0.47;0.4706;1" dur="11.4s" repeatCount="indefinite"/><rect x="22" y="293" width="3" height="90" fill="#0f766e" opacity="0.85"/><text x="40" y="318" font-size="11.5" fill="#a8b6c4" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">因为</text><text x="78" y="318" font-size="12.5" fill="#6b7c8d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">T 管膜上的 DHPR 感受到电压变化</text><text x="40" y="354" font-size="11.5" fill="#0f766e" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">所以</text><text x="78" y="354" font-size="14.5" fill="#0f766e" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">在骨骼肌它机械偶联激活肌质网；在心肌它还需钙内流</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.47;0.4706;0.635;0.6356;1" dur="11.4s" repeatCount="indefinite"/><rect x="22" y="293" width="3" height="90" fill="#c1440e" opacity="0.85"/><text x="40" y="318" font-size="11.5" fill="#a8b6c4" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">因为</text><text x="78" y="318" font-size="12.5" fill="#6b7c8d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">肌质网 RyR 开放，Ca²⁺ 涌入胞质</text><text x="40" y="354" font-size="11.5" fill="#c1440e" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">所以</text><text x="78" y="354" font-size="14.5" fill="#c1440e" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">胞质 Ca²⁺ 从 10⁻⁷ 升到 10⁻⁵ mol/L，升高百倍</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.635;0.6356;0.815;0.8156;1" dur="11.4s" repeatCount="indefinite"/><rect x="22" y="293" width="3" height="90" fill="#2f8f57" opacity="0.85"/><text x="40" y="318" font-size="11.5" fill="#a8b6c4" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">因为</text><text x="78" y="318" font-size="12.5" fill="#6b7c8d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">Ca²⁺ 与肌钙蛋白 C 结合，原肌球蛋白滚开</text><text x="40" y="354" font-size="11.5" fill="#2f8f57" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">所以</text><text x="78" y="354" font-size="14.5" fill="#2f8f57" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">肌动蛋白位点暴露，横桥得以结合</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.815;0.8156;1" dur="11.4s" repeatCount="indefinite"/><rect x="22" y="293" width="3" height="90" fill="#2c5f9e" opacity="0.85"/><text x="40" y="318" font-size="11.5" fill="#a8b6c4" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">因为</text><text x="78" y="318" font-size="12.5" fill="#6b7c8d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">钙泵把 Ca²⁺ 泵回肌质网，胞质 Ca²⁺ 下降</text><text x="40" y="354" font-size="11.5" fill="#2c5f9e" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">所以</text><text x="78" y="354" font-size="14.5" fill="#2c5f9e" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">TnC 松开 → 位点被遮 → 舒张；舒张同样耗 ATP</text></g><text x="22" y="403" font-size="11.5" fill="#a8b6c4" font-weight="700" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">电信号如何变成机械收缩</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.15;0.1506;0.31;0.3106;1" dur="11.4s" repeatCount="indefinite"/><rect x="22" y="413" width="3" height="15" rx="1.5" fill="#a8791a"/><text x="34" y="424" font-size="12.5" fill="#a8791a" font-weight="700" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">T 管</text><text x="104" y="424" font-size="12" fill="#6b7c8d" font-weight="400" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">把兴奋传向细胞深部</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.31;0.3106;0.47;0.4706;1" dur="11.4s" repeatCount="indefinite"/><rect x="22" y="436" width="3" height="15" rx="1.5" fill="#0f766e"/><text x="34" y="447" font-size="12.5" fill="#0f766e" font-weight="700" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">钙通道</text><text x="104" y="447" font-size="12" fill="#6b7c8d" font-weight="400" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">DHPR 感受电压变化</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.47;0.4706;0.635;0.6356;1" dur="11.4s" repeatCount="indefinite"/><rect x="22" y="459" width="3" height="15" rx="1.5" fill="#c1440e"/><text x="34" y="470" font-size="12.5" fill="#c1440e" font-weight="700" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">钙释放</text><text x="104" y="470" font-size="12" fill="#6b7c8d" font-weight="400" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">胞质 Ca²⁺ 升高百倍</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.815;0.8156;1" dur="11.4s" repeatCount="indefinite"/><rect x="22" y="482" width="3" height="15" rx="1.5" fill="#2c5f9e"/><text x="34" y="493" font-size="12.5" fill="#2c5f9e" font-weight="700" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">舒张</text><text x="104" y="493" font-size="12" fill="#6b7c8d" font-weight="400" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">钙泵回收也耗 ATP</text></g><rect x="22" y="508" width="436" height="33" rx="8" fill="#f0fdfa"/><text x="34" y="528" font-size="12" fill="#1e293b" font-weight="700" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">收缩与舒张都耗 ATP；钙致钙释放是心肌与骨骼肌的共同核心</text></svg>