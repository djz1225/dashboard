<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 510" role="img" aria-labelledby="et ed" style="background:#ffffff"><title id="et">心肌兴奋-收缩耦联：从 T 管到肌丝滑行</title><desc id="ed">动作电位沿肌膜与 T 管内传，L 型钙通道开放使少量钙内流，触发肌浆网 RyR2 释放大量钙；钙结合肌钙蛋白使原肌球蛋白移位，横桥摆动拉动细肌丝向 M 线滑入，I 带变窄而 A 带不变；钙被 SERCA 回收后舒张。</desc><path d="M22,92 H378" stroke="#475569" stroke-width="4" stroke-linecap="round"/><path d="M170,92 V250" stroke="#475569" stroke-width="10" stroke-linecap="round" opacity="0.5"/><path d="M179,210 Q172,252 197,252 H230 Q255,252 248,210 V196 H179 Z" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.8"/><path d="M201,255 h20" stroke="#0f766e" stroke-width="6" stroke-linecap="round" opacity="0.85"/><path d="M178,315 H222 M178,345 H222" stroke="#b45309" stroke-width="7" stroke-linecap="round" opacity="0.9"/><g transform="translate(0,0)"><path d="M62,304 V356" stroke="#2c5f9e" stroke-width="5" stroke-linecap="round"/><path d="M62,323 H200 M62,337 H200" stroke="#2c5f9e" stroke-width="5" stroke-linecap="round" opacity="0.5"/><animateTransform attributeName="transform" type="translate" values="0.0,0;0.0,0;3.0,0;8.0,0;14.0,0;0.0,0;0.0,0" keyTimes="0;0.18;0.34;0.5;0.66;0.84;1" dur="8.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1"/></g><g transform="translate(0,0)"><path d="M338,304 V356" stroke="#2c5f9e" stroke-width="5" stroke-linecap="round"/><path d="M338,323 H200 M338,337 H200" stroke="#2c5f9e" stroke-width="5" stroke-linecap="round" opacity="0.5"/><animateTransform attributeName="transform" type="translate" values="0.0,0;0.0,0;-3.0,0;-8.0,0;-14.0,0;0.0,0;0.0,0" keyTimes="0;0.18;0.34;0.5;0.66;0.84;1" dur="8.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1"/></g><circle r="3.6" fill="#b45309" opacity="0"><animateMotion dur="8.5s" repeatCount="indefinite" path="M170,102 L170,238"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.18;0.1805;0.34;0.3405;1" dur="8.5s" repeatCount="indefinite"/></circle><circle r="3.6" fill="#b45309" opacity="0"><animateMotion dur="8.5s" repeatCount="indefinite" path="M211,246 L211,290"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.34;0.3405;0.5;0.5005;1" dur="8.5s" repeatCount="indefinite"/></circle><text font-size="11" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="#64748b"><tspan x="26" y="84">肌膜</tspan><tspan x="182" y="132">T 管（肌膜内陷，与细胞外相通）</tspan><tspan x="256" y="212" fill="#0f766e">肌浆网</tspan><tspan x="256" y="250" fill="#0f766e">RyR2 释放口（二联体）</tspan><tspan x="54" y="370" text-anchor="middle" fill="#2c5f9e">Z 线</tspan><tspan x="200" y="298" text-anchor="middle" fill="#b45309">粗肌丝（A 带长度不变）</tspan><tspan x="200" y="388" text-anchor="middle" fill="#2c5f9e">细肌丝长度不变只滑入（I 带变窄、A 带不变）；T 管与肌浆网相邻构成二联体</tspan></text><text font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><tspan x="200.0" y="410" text-anchor="middle" opacity="0" fill="#1e293b" font-size="15" font-weight="700">① 动作电位传到 T 管<tspan fill="#64748b" font-weight="400" font-size="11.5">　肌膜去极化沿 T 管内传</tspan><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.18;0.1805;1" dur="8.5s" repeatCount="indefinite"/></tspan><tspan x="200.0" y="410" text-anchor="middle" opacity="0" fill="#1e293b" font-size="15" font-weight="700">② L 型 Ca 通道开放<tspan fill="#64748b" font-weight="400" font-size="11.5">　少量 Ca2+ 由细胞外进入</tspan><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.18;0.1805;0.34;0.3405;1" dur="8.5s" repeatCount="indefinite"/></tspan><tspan x="200.0" y="410" text-anchor="middle" opacity="0" fill="#1e293b" font-size="15" font-weight="700">③ 触发肌浆网释放<tspan fill="#64748b" font-weight="400" font-size="11.5">　Ca2+ 激活 RyR2：钙致钙释放</tspan><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.34;0.3405;0.5;0.5005;1" dur="8.5s" repeatCount="indefinite"/></tspan><tspan x="200.0" y="410" text-anchor="middle" opacity="0" fill="#1e293b" font-size="15" font-weight="700">④ Ca2+ 结合肌钙蛋白<tspan fill="#64748b" font-weight="400" font-size="11.5">　原肌球蛋白移位，暴露结合位点</tspan><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.5005;0.66;0.6605;1" dur="8.5s" repeatCount="indefinite"/></tspan><tspan x="200.0" y="410" text-anchor="middle" opacity="0" fill="#1e293b" font-size="15" font-weight="700">⑤ 横桥摆动<tspan fill="#64748b" font-weight="400" font-size="11.5">　细肌丝向 M 线滑入，I 带变窄</tspan><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.66;0.6605;0.84;0.8405;1" dur="8.5s" repeatCount="indefinite"/></tspan><tspan x="200.0" y="410" text-anchor="middle" opacity="0" fill="#1e293b" font-size="15" font-weight="700">⑥ 舒张<tspan fill="#64748b" font-weight="400" font-size="11.5">　SERCA 回收 Ca2+，肌节回长</tspan><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.84;0.8405;1" dur="8.5s" repeatCount="indefinite"/></tspan></text><path d="M30,484 H370" stroke="#e2e8f0" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.35"/><circle cy="484" r="5" fill="#1e293b" stroke="#ffffff" stroke-width="2"><animateTransform attributeName="transform" type="translate" values="30,0;370,0" keyTimes="0;1" dur="8.5s" repeatCount="indefinite" calcMode="linear"/></circle><text x="200.0" y="28" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" opacity="0">心肌兴奋-收缩耦联<animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="0.55s" fill="freeze" calcMode="spline" keySplines="0.23 1 0.32 1"/><tspan x="200.0" y="50" text-anchor="middle" font-size="11" fill="#64748b" font-weight="400">钙致钙释放：一个 Ca2+ 进来，引出一大批 Ca2+</tspan></text></svg>