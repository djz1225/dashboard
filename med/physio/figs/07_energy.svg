<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 430" role="img" aria-labelledby="ft fd" style="background:#ffffff"><title id="ft">能量代谢的测定</title><desc id="fd">间接测热法通过 O2 消耗与 CO2 产量算呼吸商，再查表求得产热量；三大营养素每升氧的产热不同。</desc><text x="200.0" y="28" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="0.55s" fill="freeze" calcMode="spline" keySplines="0.23 1 0.32 1"/>能量代谢的测定：间接测热<tspan x="200.0" y="48" text-anchor="middle" font-size="11" fill="#64748b" font-weight="400">测 O2 消耗量与 CO2 产量，反推产热量</tspan></text><text x="34" y="86" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">每消耗 1 L O2 的产热量（kcal）：糖 5.0　脂肪 4.7　蛋白质 4.3</text><text x="34" y="114" font-size="12" fill="#c0392b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">糖</text><text x="86" y="114" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">RQ=1.00</text><g transform="translate(146,108)"><rect x="0" y="-7" width="220" height="14" rx="7" fill="#c0392b" opacity="0.75"><animateTransform attributeName="transform" type="scale" additive="sum" values="0.02 1;1 1" keyTimes="0;1" dur="0.55s" begin="0.0s" fill="freeze" calcMode="spline" keySplines="0.23 1 0.32 1"/></rect></g><text x="372" y="114" font-size="11" fill="#c0392b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">5.0</text><text x="34" y="156" font-size="12" fill="#c1440e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">脂肪</text><text x="86" y="156" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">RQ=0.71</text><g transform="translate(146,150)"><rect x="0" y="-7" width="207" height="14" rx="7" fill="#c1440e" opacity="0.75"><animateTransform attributeName="transform" type="scale" additive="sum" values="0.02 1;1 1" keyTimes="0;1" dur="0.55s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.23 1 0.32 1"/></rect></g><text x="359" y="156" font-size="11" fill="#c1440e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">4.7</text><text x="34" y="198" font-size="12" fill="#2f8f57" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">蛋白质</text><text x="86" y="198" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">RQ=0.80</text><g transform="translate(146,192)"><rect x="0" y="-7" width="189" height="14" rx="7" fill="#2f8f57" opacity="0.75"><animateTransform attributeName="transform" type="scale" additive="sum" values="0.02 1;1 1" keyTimes="0;1" dur="0.55s" begin="0.4s" fill="freeze" calcMode="spline" keySplines="0.23 1 0.32 1"/></rect></g><text x="341" y="198" font-size="11" fill="#2f8f57" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">4.3</text><text x="34" y="252" font-size="11" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="#1e293b">呼吸商 RQ = CO2 产量 / O2 消耗量。混合膳食约 0.85；纯糖 1.00；纯脂肪 0.71</text><text x="34" y="272" font-size="11" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="#1e293b">RQ &gt; 1 提示大量糖转化为脂肪；RQ 0.7~1.0 之间可用查表法算产热</text><rect x="24" y="288" width="352" height="72" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4" opacity="0.7"/><text x="38" y="308" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">测基础代谢率的四个苛刻条件</text><text x="38" y="326" font-size="11" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">① 清醒且极度安静　② 静卧、肌肉放松</text><text x="38" y="342" font-size="11" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">③ 禁食 12 h 以上　④ 室温 20~25℃</text><text x="200.0" y="384" text-anchor="middle" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><tspan fill="#c0392b">■</tspan> 糖　<tspan fill="#c1440e">■</tspan> 脂肪　<tspan fill="#2f8f57">■</tspan> 蛋白质</text><text x="200.0" y="408" text-anchor="middle" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">临床意义：甲亢 BMR 升高，甲减 BMR 降低（正常 ±15%）</text></svg>