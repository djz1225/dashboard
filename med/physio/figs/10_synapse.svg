<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" role="img" aria-labelledby="ft fd" style="background:#ffffff"><title id="ft">化学突触传递</title><desc id="fd">动作电位到末梢引起钙内流，小泡释放递质，递质结合后膜受体使离子通道开放，产生 EPSP 并叠加至阈电位。传递是单向的。</desc><text x="200.0" y="28" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="0.55s" fill="freeze" calcMode="spline" keySplines="0.23 1 0.32 1"/>化学突触传递<tspan x="200.0" y="48" text-anchor="middle" font-size="11" fill="#64748b" font-weight="400">电信号→化学信号→电信号，单向传递</tspan></text><path d="M120,84 Q92,84 92,116 V160 Q92,192 128,192 H240 Q276,192 276,160 V116 Q276,84 248,84 Z" fill="#fef3c7" stroke="#a8791a" stroke-width="1.8"/><path d="M80,208 H288" stroke="#2c5f9e" stroke-width="4" stroke-linecap="round"/><text font-size="11" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><tspan x="184" y="78" text-anchor="middle" fill="#a8791a">突触前终末</tspan><tspan x="184" y="226" text-anchor="middle" fill="#2c5f9e">突触后膜（受体）</tspan></text><circle cx="140" cy="126" r="13" fill="none" stroke="#a8791a" stroke-width="1.6"/><circle r="3" fill="#a8791a" opacity="0"><animateMotion dur="2.4s" begin="0.0s" repeatCount="indefinite" path="M140,140 L140,202"/><animate attributeName="opacity" values="0;.95;.95;0" keyTimes="0;.2;.75;1" dur="2.4s" begin="0.0s" repeatCount="indefinite"/></circle><circle cx="184" cy="126" r="13" fill="none" stroke="#a8791a" stroke-width="1.6"/><circle r="3" fill="#a8791a" opacity="0"><animateMotion dur="2.4s" begin="0.5s" repeatCount="indefinite" path="M184,140 L184,202"/><animate attributeName="opacity" values="0;.95;.95;0" keyTimes="0;.2;.75;1" dur="2.4s" begin="0.5s" repeatCount="indefinite"/></circle><circle cx="228" cy="126" r="13" fill="none" stroke="#a8791a" stroke-width="1.6"/><circle r="3" fill="#a8791a" opacity="0"><animateMotion dur="2.4s" begin="1.0s" repeatCount="indefinite" path="M228,140 L228,202"/><animate attributeName="opacity" values="0;.95;.95;0" keyTimes="0;.2;.75;1" dur="2.4s" begin="1.0s" repeatCount="indefinite"/></circle><text x="292" y="186" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">间隙约 20 nm</text><path d="M288,192 H340" stroke="#e2e8f0" stroke-width="1.4" stroke-dasharray="4 3"/><rect x="164" y="196" width="40" height="12" rx="4" fill="#dbe7f5" stroke="#2c5f9e" stroke-width="1.6"/><text x="184" y="244" text-anchor="middle" font-size="11" fill="#2c5f9e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">受体→离子通道开放→EPSP</text><path d="M44,366 H356" stroke="#e2e8f0" stroke-width="1.2" fill="none"/><path d="M44,320 H356" stroke="#c1440e" stroke-width="1.2" stroke-dasharray="5 4"/><path d="M44.0,366.0 L51.8,366.0 L59.6,366.0 L67.4,366.0 L75.2,366.0 L83.0,366.0 L90.8,366.0 L98.6,354.0 L106.4,344.5 L114.2,336.8 L122.0,330.8 L129.8,325.9 L137.6,322.0 L145.4,318.9 L153.2,316.4 L161.0,314.4 L168.8,312.9 L176.6,311.6 L184.4,310.6 L192.2,309.8 L200.0,309.1 L207.8,308.6 L215.6,308.2 L223.4,307.9 L231.2,307.6 L239.0,307.4 L246.8,307.3 L254.6,307.1 L262.4,307.0 L270.2,306.9 L278.0,306.9 L285.8,306.8 L293.6,306.8 L301.4,306.7 L309.2,306.7 L317.0,306.7 L324.8,306.7 L332.6,306.7 L340.4,306.6 L348.2,306.6 L356.0,306.6" fill="none" stroke="#2c5f9e" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="200" stroke-dashoffset="200"><animate attributeName="stroke-dashoffset" values="200;0" keyTimes="0;1" dur="6.0s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1"/></path><text x="44" y="382" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">EPSP 叠加到阈电位即触发动作电位；单次 EPSP 通常不足以达阈</text><text x="356" y="314" text-anchor="end" font-size="11" fill="#c1440e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">阈电位</text><text x="34" y="396" font-size="11" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="#1e293b">① 动作电位到末梢 → Ca2+ 内流　② 小泡与前膜融合、量子式释放递质</text><text x="34" y="414" font-size="11" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="#1e293b">③ 递质结合后膜受体 → 配体门控通道开　④ 产生 EPSP/IPSP，单向传递</text><text x="200.0" y="438" text-anchor="middle" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><tspan fill="#a8791a">■</tspan> 递质/小泡　<tspan fill="#2c5f9e">■</tspan> 后膜与电位</text></svg>