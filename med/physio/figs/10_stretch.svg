<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" role="img" aria-labelledby="ft fd" style="background:#ffffff"><title id="ft">牵张反射</title><desc id="fd">肌肉被动拉长使肌梭伸长，Ⅰa 类纤维放电经脊髓单突触兴奋 α 运动神经元，引起同一肌肉收缩。膝跳反射即此环路。</desc><text x="200.0" y="28" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="0.55s" fill="freeze" calcMode="spline" keySplines="0.23 1 0.32 1"/>牵张反射：肌梭-α 环路<tspan x="200.0" y="48" text-anchor="middle" font-size="11" fill="#64748b" font-weight="400">被动拉长 → 肌梭放电 → α 运动神经元 → 肌肉收缩</tspan></text><path d="M60,140 Q40,190 60,240 Q120,262 180,240 Q200,190 180,140 Q120,118 60,140 Z" fill="#fbe3e0" stroke="#c0392b" stroke-width="1.8"/><path d="M104,168 Q92,190 104,212 Q120,222 136,212 Q148,190 136,168 Q120,158 104,168 Z" fill="#fef3c7" stroke="#a8791a" stroke-width="1.6"/><path d="M120,166 Q180,120 240,120" stroke="#2c5f9e" stroke-width="2.4" fill="none"/><path d="M244,148 Q190,168 132,196" stroke="#c1440e" stroke-width="2.4" fill="none"/><rect x="244" y="96" width="112" height="72" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.8"/><text x="300" y="126" text-anchor="middle" font-size="11.5" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">脊髓</text><text x="300" y="146" text-anchor="middle" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">单突触反射</text><circle r="3.6" fill="#2c5f9e" opacity="0.95"><animateMotion dur="2.6s" repeatCount="indefinite" path="M120,166 Q180,120 240,120"/></circle><circle r="3.6" fill="#c1440e" opacity="0.95"><animateMotion dur="2.6s" begin="1.0s" repeatCount="indefinite" path="M244,148 Q190,168 132,196"/></circle><text font-size="11" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><tspan x="120" y="262" text-anchor="middle" fill="#c0392b">骨骼肌</tspan><tspan x="120" y="150" text-anchor="middle" fill="#a8791a">肌梭</tspan><tspan x="196" y="112" fill="#2c5f9e">Ⅰa 传入</tspan><tspan x="186" y="184" fill="#c1440e">α 传出</tspan></text><text x="200.0" y="288" text-anchor="middle" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><tspan fill="#2c5f9e">■</tspan> 感觉传入　<tspan fill="#c1440e">■</tspan> 运动传出　<tspan fill="#a8791a">■</tspan> 肌梭</text><text x="34" y="316" font-size="11" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="#1e293b">肌梭与梭外肌纤维「并联」：肌肉被拉长时肌梭随之伸长 → Ⅰa 类纤维放电增加</text><text x="34" y="336" font-size="11" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="#1e293b">反射效应：被拉长的肌肉自身收缩（同一块肌肉）→ 对抗牵拉，维持姿势</text><text x="34" y="356" font-size="11" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="#1e293b">临床：膝跳反射（L2~L4）；腱反射亢进提示上运动神经元损伤</text><rect x="24" y="370" width="352" height="40" rx="9" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/><text x="200" y="386" text-anchor="middle" font-size="11" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">肌梭 → Ⅰa 传入 → 脊髓（单突触）→ α 运动神经元 → 梭外肌</text><text x="200" y="402" text-anchor="middle" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">其中任何一环断掉，腱反射即消失</text><text x="200.0" y="430" text-anchor="middle" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">牵张反射是唯一有明确临床意义的脊髓反射</text></svg>