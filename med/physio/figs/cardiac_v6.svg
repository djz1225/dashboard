"/></tspan><tspan x="200.0" y="478" text-anchor="middle" opacity="0">快速充盈期<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.435;0.45;0.59;0.605;1" dur="6.0s" repeatCount="indefinite"/></tspan><tspan x="200.0" y="478" text-anchor="middle" opacity="0">减慢充盈期<animate attributeName="opacity" values="0;0;1;1;1;1" keyTimes="0;0.575;0.59;1;1;1" dur="6.0s" repeatCount="indefinite"/></tspan></text><text x="200.0" y="30" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" opacity="0">左心：心动周期<animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="0.55s" fill="freeze" calcMode="spline" keySplines="0.23 1 0.32 1"/></text></svg>