<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" role="img" aria-labelledby="ft fd" style="background:#ffffff"><title id="ft">血糖稳态</title><desc id="fd">胰岛素是唯一降糖激素，促摄取与合成；升糖激素有五种，以胰高血糖素与肾上腺素为主。两侧粒子表示激素流向血糖池。</desc><text x="200.0" y="28" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="0.55s" fill="freeze" calcMode="spline" keySplines="0.23 1 0.32 1"/>血糖稳态：一路降，五路升<tspan x="200.0" y="48" text-anchor="middle" font-size="11" fill="#64748b" font-weight="400">唯一降糖激素是胰岛素；升糖激素有五种</tspan></text><circle cx="200" cy="196" r="54" fill="#fbe3e0" stroke="#c0392b" stroke-width="2"/><text x="200" y="190" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c0392b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">血糖</text><text x="200" y="210" text-anchor="middle" font-size="11.5" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">3.9~6.1</text><text x="200" y="226" text-anchor="middle" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">mmol/L</text><path d="M146,196 H86" stroke="#0f766e" stroke-width="3" fill="none"/><rect x="24" y="176" width="62" height="40" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.6"/><text x="55" y="194" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">胰岛素</text><text x="55" y="210" text-anchor="middle" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">唯一降糖</text><circle r="4" fill="#0f766e"><animateMotion dur="7.0s" repeatCount="indefinite" path="M146,196 H86"/></circle><path d="M254,96 H300" stroke="#2f8f57" stroke-width="2.4" fill="none"/><text x="366" y="100" text-anchor="end" font-size="11" fill="#2f8f57" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">胰高血糖素</text><circle r="3.4" fill="#2f8f57" opacity="0.9"><animateMotion dur="7.0s" repeatCount="indefinite" path="M254,96 H300"/></circle><path d="M254,148 H300" stroke="#c1440e" stroke-width="2.4" fill="none"/><text x="366" y="152" text-anchor="end" font-size="11" fill="#c1440e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">肾上腺素</text><circle r="3.4" fill="#c1440e" opacity="0.9"><animateMotion dur="7.0s" repeatCount="indefinite" path="M254,148 H300"/></circle><path d="M254,200 H300" stroke="#a8791a" stroke-width="2.4" fill="none"/><text x="366" y="204" text-anchor="end" font-size="11" fill="#a8791a" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">糖皮质激素</text><circle r="3.4" fill="#a8791a" opacity="0.9"><animateMotion dur="7.0s" repeatCount="indefinite" path="M254,200 H300"/></circle><path d="M254,252 H300" stroke="#2c5f9e" stroke-width="2.4" fill="none"/><text x="366" y="256" text-anchor="end" font-size="11" fill="#2c5f9e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">生长激素</text><circle r="3.4" fill="#2c5f9e" opacity="0.9"><animateMotion dur="7.0s" repeatCount="indefinite" path="M254,252 H300"/></circle><path d="M254,304 H300" stroke="#b45309" stroke-width="2.4" fill="none"/><text x="366" y="308" text-anchor="end" font-size="11" fill="#b45309" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">甲状腺激素</text><circle r="3.4" fill="#b45309" opacity="0.9"><animateMotion dur="7.0s" repeatCount="indefinite" path="M254,304 H300"/></circle><text x="30" y="100" font-size="11" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">降糖</text><text x="330" y="76" text-anchor="end" font-size="11" fill="#c1440e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">升糖（五种）</text><text x="34" y="356" font-size="11" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="#1e293b">胰岛素：促葡萄糖摄取（GLUT4 转位）、促糖原合成、抑糖异生</text><text x="34" y="376" font-size="11" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="#1e293b">胰高血糖素：促肝糖原分解与糖异生（主要靶器官是肝）</text><text x="34" y="396" font-size="11" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="#1e293b">肾上腺素：应激时快速升糖；糖皮质激素：促糖异生、拮抗胰岛素</text><text x="34" y="416" font-size="11" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="#1e293b">生长激素、甲状腺激素：长期升高血糖，过量可致糖耐量异常</text><text x="200.0" y="440" text-anchor="middle" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><tspan fill="#0f766e">■</tspan> 降糖　<tspan fill="#c1440e">■</tspan> 快速升糖　<tspan fill="#2f8f57">■</tspan> 长效升糖</text><text x="200.0" y="462" text-anchor="middle" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">胰岛素缺乏：血糖↑、脂肪分解↑、酮体↑（糖尿病酮症）</text></svg>