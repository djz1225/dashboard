<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" role="img" aria-labelledby="ft fd" style="background:#ffffff"><title id="ft">衰老与储备下降</title><desc id="fd">三个年龄段的最大能力与静息功能对比：静息功能下降有限，但储备逐年减少，因此应激时容易失代偿。</desc><text x="200.0" y="28" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="0.55s" fill="freeze" calcMode="spline" keySplines="0.23 1 0.32 1"/>衰老：储备下降，不是功能消失<tspan x="200.0" y="48" text-anchor="middle" font-size="11" fill="#64748b" font-weight="400">静息功能尚可，最大能力逐年降低</tspan></text><path d="M56,268 H360" stroke="#e2e8f0" stroke-width="1.3" fill="none"/><g transform="translate(88,268)"><rect x="-26" y="-150" width="22" height="150" rx="5" fill="#c0392b" opacity="0.55"><animateTransform attributeName="transform" type="scale" additive="sum" values="1 0.02;1 1" keyTimes="0;1" dur="0.6s" begin="0.0s" fill="freeze" calcMode="spline" keySplines="0.23 1 0.32 1"/><animateTransform attributeName="transform" type="translate" additive="sum" values="0,150;0,0" keyTimes="0;1" dur="0.6s" begin="0.0s" fill="freeze" calcMode="spline" keySplines="0.23 1 0.32 1"/></rect><rect x="2" y="-82" width="22" height="82" rx="5" fill="#2c5f9e" opacity="0.7"><animateTransform attributeName="transform" type="scale" additive="sum" values="1 0.02;1 1" keyTimes="0;1" dur="0.6s" begin="0.1s" fill="freeze" calcMode="spline" keySplines="0.23 1 0.32 1"/><animateTransform attributeName="transform" type="translate" additive="sum" values="0,82;0,0" keyTimes="0;1" dur="0.6s" begin="0.1s" fill="freeze" calcMode="spline" keySplines="0.23 1 0.32 1"/></rect></g><text x="97" y="286" text-anchor="middle" font-size="11.5" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">青年</text><text x="97" y="302" text-anchor="middle" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">储备 44%</text><g transform="translate(196,268)"><rect x="-26" y="-111" width="22" height="111" rx="5" fill="#c0392b" opacity="0.55"><animateTransform attributeName="transform" type="scale" additive="sum" values="1 0.02;1 1" keyTimes="0;1" dur="0.6s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.23 1 0.32 1"/><animateTransform attributeName="transform" type="translate" additive="sum" values="0,111;0,0" keyTimes="0;1" dur="0.6s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.23 1 0.32 1"/></rect><rect x="2" y="-75" width="22" height="75" rx="5" fill="#2c5f9e" opacity="0.7"><animateTransform attributeName="transform" type="scale" additive="sum" values="1 0.02;1 1" keyTimes="0;1" dur="0.6s" begin="0.30000000000000004s" fill="freeze" calcMode="spline" keySplines="0.23 1 0.32 1"/><animateTransform attributeName="transform" type="translate" additive="sum" values="0,75;0,0" keyTimes="0;1" dur="0.6s" begin="0.30000000000000004s" fill="freeze" calcMode="spline" keySplines="0.23 1 0.32 1"/></rect></g><text x="205" y="286" text-anchor="middle" font-size="11.5" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">中年</text><text x="205" y="302" text-anchor="middle" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">储备 24%</text><g transform="translate(304,268)"><rect x="-26" y="-69" width="22" height="69" rx="5" fill="#c0392b" opacity="0.55"><animateTransform attributeName="transform" type="scale" additive="sum" values="1 0.02;1 1" keyTimes="0;1" dur="0.6s" begin="0.6000000000000001s" fill="freeze" calcMode="spline" keySplines="0.23 1 0.32 1"/><animateTransform attributeName="transform" type="translate" additive="sum" values="0,69;0,0" keyTimes="0;1" dur="0.6s" begin="0.6000000000000001s" fill="freeze" calcMode="spline" keySplines="0.23 1 0.32 1"/></rect><rect x="2" y="-60" width="22" height="60" rx="5" fill="#2c5f9e" opacity="0.7"><animateTransform attributeName="transform" type="scale" additive="sum" values="1 0.02;1 1" keyTimes="0;1" dur="0.6s" begin="0.7000000000000001s" fill="freeze" calcMode="spline" keySplines="0.23 1 0.32 1"/><animateTransform attributeName="transform" type="translate" additive="sum" values="0,60;0,0" keyTimes="0;1" dur="0.6s" begin="0.7000000000000001s" fill="freeze" calcMode="spline" keySplines="0.23 1 0.32 1"/></rect></g><text x="313" y="286" text-anchor="middle" font-size="11.5" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">老年</text><text x="313" y="302" text-anchor="middle" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">储备 6%</text><text font-size="11" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><tspan x="40" y="112" fill="#c0392b">最大能力</tspan><tspan x="40" y="130" fill="#2c5f9e">静息功能</tspan></text><text x="34" y="328" font-size="11" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="#1e293b">关键在于两条柱的差：静息功能下降不多，但可动用的储备越来越少</text><text x="34" y="348" font-size="11" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="#1e293b">所以老年人静息时指标正常，一遇应激（感染、手术、运动）就容易失代偿</text><rect x="24" y="360" width="352" height="46" rx="9" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.3" opacity="0.75"/><text x="38" y="378" font-size="11" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">肾：GFR 与肾血流量下降，浓缩稀释能力减弱</text><text x="38" y="396" font-size="11" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">心：最大心率与心输出量储备下降；肺：最大通气量下降</text><text x="200.0" y="424" text-anchor="middle" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">老年用药须减量：肝代谢与肾排泄都下降，首剂量要更小</text><text x="200.0" y="438" text-anchor="middle" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><tspan fill="#c0392b">■</tspan> 最大能力　<tspan fill="#2c5f9e">■</tspan> 静息功能</text></svg>