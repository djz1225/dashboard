<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" role="img" aria-labelledby="ft fd" style="background:#ffffff"><title id="ft">小肠吸收的两条路径</title><desc id="fd">绒毛内毛细血管接收葡萄糖与氨基酸经门静脉入肝；中央乳糜管接收脂肪经淋巴入血，绕过肝脏。</desc><text x="200.0" y="28" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="0.55s" fill="freeze" calcMode="spline" keySplines="0.23 1 0.32 1"/>小肠吸收：绒毛内的两条路<tspan x="200.0" y="48" text-anchor="middle" font-size="11" fill="#64748b" font-weight="400">葡萄糖、氨基酸入毛细血管；脂肪先入中央乳糜管</tspan></text><path d="M84,300 V190 Q110,158 136,190 V300 Z" fill="#fbe3e0" stroke="#c0392b" stroke-width="1.6"/><path d="M174,300 V190 Q200,158 226,190 V300 Z" fill="#fbe3e0" stroke="#c0392b" stroke-width="1.6"/><path d="M264,300 V190 Q290,158 316,190 V300 Z" fill="#fbe3e0" stroke="#c0392b" stroke-width="1.6"/><path d="M110,300 V206 M200,300 V206 M290,300 V206" stroke="#2f8f57" stroke-width="4" stroke-linecap="round" opacity="0.85"/><path d="M92,300 V226 M128,300 V226 M182,300 V226 M218,300 V226 M272,300 V226 M308,300 V226" stroke="#2c5f9e" stroke-width="2.6" stroke-linecap="round" opacity="0.7"/><path d="M40,300 H360" stroke="#c0392b" stroke-width="2" fill="none"/><rect x="40" y="300" width="320" height="34" fill="#fbe3e0" opacity="0.4"/><text x="200" y="322" text-anchor="middle" font-size="11" fill="#c0392b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">肠腔（葡萄糖、氨基酸、脂肪酸）</text><circle r="3.6" fill="#1d4ed8" opacity="0"><animateMotion dur="2.4s" begin="0.0s" repeatCount="indefinite" path="M110,304 L94,240"/><animate attributeName="opacity" values="0;.95;.95;0;0" keyTimes="0;.1;.5;.72;1" dur="2.4s" begin="0.0s" repeatCount="indefinite"/></circle><circle r="3.6" fill="#2f8f57" opacity="0"><animateMotion dur="2.4s" begin="0.45s" repeatCount="indefinite" path="M110,304 L110,212"/><animate attributeName="opacity" values="0;.95;.95;0;0" keyTimes="0;.1;.5;.72;1" dur="2.4s" begin="0.45s" repeatCount="indefinite"/></circle><circle r="3.6" fill="#1d4ed8" opacity="0"><animateMotion dur="2.4s" begin="0.9s" repeatCount="indefinite" path="M200,304 L184,240"/><animate attributeName="opacity" values="0;.95;.95;0;0" keyTimes="0;.1;.5;.72;1" dur="2.4s" begin="0.9s" repeatCount="indefinite"/></circle><circle r="3.6" fill="#2f8f57" opacity="0"><animateMotion dur="2.4s" begin="1.35s" repeatCount="indefinite" path="M200,304 L200,212"/><animate attributeName="opacity" values="0;.95;.95;0;0" keyTimes="0;.1;.5;.72;1" dur="2.4s" begin="1.35s" repeatCount="indefinite"/></circle><circle r="3.6" fill="#1d4ed8" opacity="0"><animateMotion dur="2.4s" begin="1.8s" repeatCount="indefinite" path="M290,304 L274,240"/><animate attributeName="opacity" values="0;.95;.95;0;0" keyTimes="0;.1;.5;.72;1" dur="2.4s" begin="1.8s" repeatCount="indefinite"/></circle><circle r="3.6" fill="#2f8f57" opacity="0"><animateMotion dur="2.4s" begin="2.25s" repeatCount="indefinite" path="M290,304 L290,212"/><animate attributeName="opacity" values="0;.95;.95;0;0" keyTimes="0;.1;.5;.72;1" dur="2.4s" begin="2.25s" repeatCount="indefinite"/></circle><text font-size="11" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="#64748b"><tspan x="110" y="178" text-anchor="middle">绒毛</tspan><tspan x="336" y="212" text-anchor="end" fill="#2f8f57">中央乳糜管（脂肪）</tspan><tspan x="336" y="240" text-anchor="end" fill="#2c5f9e">毛细血管（糖/氨基酸）</tspan><tspan x="40" y="356">吸收面积靠环状襞 + 绒毛 + 微绒毛三级放大，约 200 m²</tspan></text><text x="40" y="378" font-size="11" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="#1e293b">葡萄糖、氨基酸 → 毛细血管 → 门静脉 → 肝</text><text x="40" y="398" font-size="11" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="#1e293b">脂肪 → 乳糜管 → 淋巴 → 胸导管 → 静脉（绕过肝）</text><text x="200.0" y="424" text-anchor="middle" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><tspan fill="#2c5f9e">■</tspan> 门静脉途径　<tspan fill="#2f8f57">■</tspan> 淋巴途径</text></svg>