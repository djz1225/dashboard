t x="200.0" y="394" text-anchor="middle" font-size="11.5" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" opacity="0">迷走神经：视/嗅/咀嚼 → 胃酸分泌约 30%<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.4;0.4006;1" dur="7.0s" repeatCount="indefinite"/></text><text x="200.0" y="394" text-anchor="middle" font-size="11.5" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" opacity="0">食物扩张胃壁 + 蛋白刺激 G 细胞 → 约 60%<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4;0.4006;0.8;0.8006;1" dur="7.0s" repeatCount="indefinite"/></text><text x="200.0" y="394" text-anchor="middle" font-size="11.5" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" opacity="0">食糜入十二指肠 → 约 10%<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.8;0.8006;1" dur="7.0s" repeatCount="indefinite"/></text><path d="M30,420 H370" stroke="#e2e8f0" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.35"/><path d="M166.0,415 L166.0,425 M302.0,415 L302.0,425" stroke="#e2e8f0" stroke-width="1.1" fill="none"/><circle cy="420" r="5.4" fill="#1e293b" stroke="#ffffff" stroke-width="2"><animateTransform attributeName="transform" type="translate" values="30.0,0;35.7,0;41.3,0;47.0,0;52.7,0;58.3,0;64.0,0;69.7,0;75.3,0;81.0,0;86.7,0;92.3,0;98.0,0;103.7,0;109.3,0;115.0,0;120.7,0;126.3,0;132.0,0;137.7,0;143.3,0;149.0,0;154.7,0;160.3,0;166.0,0;171.7,0;177.3,0;183.0,0;188.7,0;194.3,0;200.0,0;205.7,0;211.3,0;217.0,0;222.7,0;228.3,0;234.0,0;239.7,0;245.3,0;251.0,0;256.7,0;262.3,0;268.0,0;273.7,0;279.3,0;285.0,0;290.7,0;296.3,0;302.0,0;307.7,0;313.3,0;319.0,0;324.7,0;330.3,0;336.0,0;341.7,0;347.3,0;353.0,0;358.7,0;364.3,0;370.0,0" keyTimes="0;0.0167;0.0333;0.05;0.0667;0.0833;0.1;0.1167;0.1333;0.15;0.1667;0.1833;0.2;0.2167;0.2333;0.25;0.2667;0.2833;0.3;0.3167;0.3333;0.35;0.3667;0.3833;0.4;0.4167;0.4333;0.45;0.4667;0.4833;0.5;0.5167;0.5333;0.55;0.5667;0.5833;0.6;0.6167;0.6333;0.65;0.