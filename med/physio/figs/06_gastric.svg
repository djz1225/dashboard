<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 460" role="img" aria-labelledby="ft fd" style="background:#ffffff"><title id="ft">胃液分泌三时相</title><desc id="fd">头期由视嗅咀嚼经迷走神经引起，分泌约占三成；胃期由食物扩张与蛋白刺激 G 细胞，约占六成；肠期由食糜入十二指肠引起，约占一成。</desc><text x="200.0" y="28" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="0.55s" fill="freeze" calcMode="spline" keySplines="0.23 1 0.32 1"/>胃液分泌的三时相<tspan x="200.0" y="48" text-anchor="middle" font-size="11" fill="#64748b" font-weight="400">头期最高（占三成）、胃期最多（占六成）、肠期最少</tspan></text><path d="M132,96 Q96,96 96,140 V236 Q96,300 156,300 Q206,300 206,252 V150 Q206,110 178,100" fill="#fbe3e0" stroke="#c0392b" stroke-width="2" opacity="0.7"/><text x="150" y="200" font-size="11.5" fill="#c0392b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">胃</text><path d="M60,104 L110,132" stroke="#e2e8f0" stroke-width="2" fill="none"/><circle r="3.8" fill="#a8791a" opacity="0.9"><animateMotion dur="7.0s" repeatCount="indefinite" path="M60,104 L110,132"/></circle><path d="M240,120 L206,160" stroke="#e2e8f0" stroke-width="2" fill="none"/><circle r="3.8" fill="#c0392b" opacity="0.9"><animateMotion dur="7.0s" repeatCount="indefinite" path="M240,120 L206,160"/></circle><path d="M180,320 L170,286" stroke="#e2e8f0" stroke-width="2" fill="none"/><circle r="3.8" fill="#2f8f57" opacity="0.9"><animateMotion dur="7.0s" repeatCount="indefinite" path="M180,320 L170,286"/></circle><text font-size="11" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="#64748b"><tspan x="58" y="96" text-anchor="start" fill="#a8791a">视、嗅、咀嚼</tspan><tspan x="244" y="114" fill="#c0392b">胃扩张 + 蛋白</tspan><tspan x="180" y="334" fill="#2f8f57">食糜入十二指肠</tspan></text><path d="M250,300 L372,300" stroke="#e2e8f0" stroke-width="1.2" fill="none"/><path d="M250.0,29