<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" role="img" aria-labelledby="ft fd" style="background:#ffffff"><title id="ft">肺通气：动力与阻力</title><desc id="fd">膈肌收缩下移使胸廓扩大、肺内压低于大气压，气体入肺；平静呼气靠肺弹性回缩被动完成。弹性阻力约占七成。</desc><text x="200.0" y="28" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="0.55s" fill="freeze" calcMode="spline" keySplines="0.23 1 0.32 1"/>肺通气：动力与阻力<tspan x="200.0" y="48" text-anchor="middle" font-size="11" fill="#64748b" font-weight="400">动力来自呼吸肌造成的压力差；阻力以弹性为主</tspan></text><path d="M96,86 Q60,86 60,140 V300 Q60,330 96,330 H304 Q340,330 340,300 V140 Q340,86 304,86 Z" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.6"/><ellipse cx="152" cy="188" rx="62" ry="76" fill="#fbe3e0" stroke="#c0392b" stroke-width="1.8" opacity="0.75"/><ellipse cx="248" cy="188" rx="62" ry="76" fill="#fbe3e0" stroke="#c0392b" stroke-width="1.8" opacity="0.75"/><path d="M152,264 V296 M248,264 V296" stroke="#c0392b" stroke-width="5" stroke-linecap="round"/><g transform="translate(0,0)"><path d="M70,318 Q200,282 330,318" stroke="#2f8f57" stroke-width="7" fill="none" stroke-linecap="round"/><animateTransform attributeName="transform" type="translate" values="0,0;0,14;0,0" keyTimes="0;0.45;1" dur="6.0s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/></g><path d="M200,86 V300" stroke="#e2e8f0" stroke-width="7" stroke-linecap="round" opacity="0.4"/><circle r="4" fill="#2c5f9e" opacity="0.9"><animateMotion dur="6.0s" repeatCount="indefinite" path="M200,96 V270" keyPoints="0;1;0" keyTimes="0;0.5;1" calcMode="linear"/></circle><text font-size="11" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="#64748b"><tspan x="66" y="80">胸廓</tspan><tspan x="152" y="120" text-anchor="middle" fill="#c0392b">肺</tspan><tspan x="336" y="316" text-anchor="end" fill="#2f8f57">膈肌（吸气下移）</tspan><tspan x="206" y="90" fill="#2c5f9e">气管</tspan></text><text x="34" y="352" font-size="11" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="#64748b">弹性阻力 70%（肺弹性纤维 + 表面张力）　非弹性阻力 30%（气道阻力为主）</text><text x="34" y="374" font-size="11" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="#1e293b">吸气主动：膈肌+肋间外肌收缩；平静呼气被动：靠弹性回缩</text><rect x="34" y="390" width="140" height="12" rx="6" fill="#e2e8f0" opacity="0.5"/><rect x="174" y="390" width="192" height="12" rx="6" fill="#0f766e" opacity="0.18"/><text x="34" y="416" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">肺内压 &lt; 大气压（吸气）</text><text x="366" y="416" font-size="11" fill="#64748b" text-anchor="end" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">＞ 大气压（呼气）</text><circle r="5" fill="#0f766e"><animateTransform attributeName="transform" type="translate" values="100,396;250,396;100,396" keyTimes="0;0.5;1" dur="6.0s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/></circle><text x="200.0" y="448" text-anchor="middle" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><tspan fill="#c0392b">■</tspan> 肺/含氧血　<tspan fill="#2f8f57">■</tspan> 膈肌　<tspan fill="#2c5f9e">■</tspan> 气流</text></svg>