>100</tspan><tspan x="356" y="350" text-anchor="end">PO2 (mmHg)</tspan><tspan x="56" y="86">饱和度 %</tspan><tspan x="66.1" y="121.3" text-anchor="start" fill="#c0392b">40 mmHg → 75%</tspan><tspan x="343.9" y="84.0" text-anchor="end" fill="#c0392b">100 mmHg → 98%</tspan><tspan x="352" y="312" text-anchor="end" fill="#2c5f9e">右移：pH↓ / CO2↑ / 温度↑</tspan></text><text x="34" y="360" font-size="11" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="#1e293b">上段平坦：肺内高 PO2 时饱和度稳定，耐受 PO2 下降</text><text x="34" y="380" font-size="11" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="#1e293b">中段陡峭：组织 PO2 稍降即大量释氧（PO2 降至 40 mmHg 时饱和度约 75%）</text><text x="34" y="400" font-size="11" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="#1e293b">下段：PO2 极低时进一步供氧（运动肌）</text><text x="200.0" y="424" text-anchor="middle" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><tspan fill="#c0392b">■</tspan> 标准曲线　<tspan fill="#2c5f9e">■</tspan> 右移曲线</text></svg>