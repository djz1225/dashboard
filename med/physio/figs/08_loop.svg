<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" role="img" aria-labelledby="ft fd" style="background:#ffffff"><title id="ft">髓袢逆流倍增</title><desc id="fd">降支只透水、升支只透盐，两个方向相反的流动使组织液渗透压从皮质 300 升至髓质 1200 mOsm/L，这是尿液浓缩的基础。</desc><text x="200.0" y="28" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="0.55s" fill="freeze" calcMode="spline" keySplines="0.23 1 0.32 1"/>髓袢逆流倍增：尿液为何能浓缩<tspan x="200.0" y="48" text-anchor="middle" font-size="11" fill="#64748b" font-weight="400">降支透水、升支透盐；U 形 + 反向流动是关键</tspan></text><path d="M150,96 V300 Q150,330 200,330 Q250,330 250,300 V96" stroke="#c0392b" stroke-width="14" fill="none" stroke-linecap="round" opacity="0.22"/><path d="M150,96 V300 Q150,330 200,330 Q250,330 250,300 V96" stroke="#c0392b" stroke-width="2.2" fill="none"/><circle r="3" fill="#2c5f9e" opacity="0"><animateMotion dur="2.4s" begin="0.0s" repeatCount="indefinite" path="M150,140 L108,140"/><animate attributeName="opacity" values="0;.9;.9;0" keyTimes="0;.15;.7;1" dur="2.4s" begin="0.0s" repeatCount="indefinite"/></circle><circle r="3" fill="#2c5f9e" opacity="0"><animateMotion dur="2.4s" begin="0.8s" repeatCount="indefinite" path="M150,190 L108,190"/><animate attributeName="opacity" values="0;.9;.9;0" keyTimes="0;.15;.7;1" dur="2.4s" begin="0.8s" repeatCount="indefinite"/></circle><circle r="3" fill="#2c5f9e" opacity="0"><animateMotion dur="2.4s" begin="1.6s" repeatCount="indefinite" path="M150,240 L108,240"/><animate attributeName="opacity" values="0;.9;.9;0" keyTimes="0;.15;.7;1" dur="2.4s" begin="1.6s" repeatCount="indefinite"/></circle><circle r="3" fill="#1d4ed8" opacity="0"><animateMotion dur="2.4s" begin="0.0s" repeatCount="indefinite" path="M250,180 L292,180"/><animate attributeName="opacity" values="0;.9;.9;0" keyTimes="0;.15;.7;1" dur="2.4s" begin="0.0s" repeatCount="indefinite"/></circle><circle r="3" fill="#1d4ed8" opacity="0"><animateMotion dur="2.4s" begin="1.0s" repeatCount="indefinite" path="M250,240 L292,240"/><animate attributeName="opacity" values="0;.9;.9;0" keyTimes="0;.15;.7;1" dur="2.4s" begin="1.0s" repeatCount="indefinite"/></circle><rect x="316" y="96" width="18" height="234" rx="9" fill="url(#grad)"/><defs><linearGradient id="grad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dbe7f5"/><stop offset="1" stop-color="#c0392b"/></linearGradient></defs><text x="344" y="104" font-size="11" fill="#2c5f9e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">皮质 300</text><text x="344" y="330" font-size="11" fill="#c1440e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">髓质 1200</text><text x="344" y="220" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">mOsm/L</text><text font-size="11" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><tspan x="144" y="88" text-anchor="end" fill="#c0392b">降支：只透水</tspan><tspan x="256" y="88" fill="#c0392b">升支：只透盐</tspan><tspan x="200" y="352" text-anchor="middle" fill="#64748b">髓袢底（U 形转弯）</tspan></text><text x="34" y="376" font-size="11" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="#1e293b">① 升支粗段主动泵出 NaCl（水不出）→ 组织液变浓</text><text x="34" y="396" font-size="11" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="#1e293b">② 降支对水通透 → 管内液越往下越浓</text><text x="34" y="416" font-size="11" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="#1e293b">③ 两个方向相反、管子成 U 形 → 浓度沿程倍增（逆流倍增）</text><text x="200.0" y="440" text-anchor="middle" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">直小血管同样呈 U 形逆流，把梯度带走而不冲淡</text><text x="200.0" y="458" text-anchor="middle" font-size="11" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><tspan fill="#2c5f9e">■</tspan> 水　<tspan fill="#1d4ed8">■</tspan> Na+/K+　<tspan fill="#c0392b">■</tspan> 髓袢</text></svg>