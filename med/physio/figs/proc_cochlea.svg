<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 556" role="img" aria-labelledby="ft fd" style="background:#ffffff"><title id="ft">耳蜗行波：位置就是频率</title><desc id="fd">声波经外耳道振动鼓膜，经听骨链放大后传到卵圆窗，在耳蜗淋巴中产生压力波推动基底膜形成行波。行波从蜗底向蜗顶传播，振幅先逐渐增大后在特定位置骤降 —— 该位置即这种频率的最大振幅点。由于基底膜从蜗底到蜗顶逐渐变宽变软，高频在蜗底共振、低频在蜗顶共振，耳蜗因此相当于用位置编码频率的硬件分析器。最大振幅处毛细胞纤毛弯曲、机械门控 K⁺ 通道开放，细胞去极化并释放递质到螺旋神经节，由听神经的纤维位置与放电频率双编码传出。</desc><text x="22" y="28" font-size="17.5" font-weight="700" fill="#1e293b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">耳蜗行波：位置就是频率</text><text x="22" y="46" font-size="11.5" fill="#64748b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">蜗底管高频、蜗顶管低频；各频率有各自的最大振幅点</text><rect x="22" y="60" width="436" height="176" rx="10" fill="#f8fbfd" stroke="#dfe8f1" stroke-width="1"/><path d="M52,139 Q245.0,132 438,124 L438,158 Q245.0,166 52,149 Z" fill="#0f766e" opacity="0.22"/><path d="M52,139 Q245.0,132 438,124" fill="none" stroke="#0f766e" stroke-width="2.4"/><path d="M52,149 Q245.0,166 438,158" fill="none" stroke="#0f766e" stroke-width="2.4"/><path d="M46,138 V150" stroke="#c0392b" stroke-width="1.6"/><path d="M444,124 V158" stroke="#2c5f9e" stroke-width="1.6"/><text x="52" y="124" font-size="11.5" fill="#c0392b" font-weight="700" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">蜗底（窄、硬→高频）</text><text x="438" y="124" font-size="11.5" fill="#2c5f9e" font-weight="700" text-anchor="end" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">蜗顶（宽、软）</text><text x="240.0" y="188" font-size="11.5" fill="#0f766e" font-weight="700" text-anchor="middle" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">基底膜</text><path d="M68.0,138.3782383419689 V125.37823834196891" stroke="#2f8f57" stroke-width="1.8" opacity="0.7"/><circle cx="68.0" cy="122.37823834196891" r="3" fill="#2f8f57" opacity="0.75"/><path d="M112.25,136.6586787564767 V123.65867875647669" stroke="#2f8f57" stroke-width="1.8" opacity="0.7"/><circle cx="112.25" cy="120.65867875647669" r="3" fill="#2f8f57" opacity="0.75"/><path d="M156.5,134.93911917098447 V121.93911917098447" stroke="#2f8f57" stroke-width="1.8" opacity="0.7"/><circle cx="156.5" cy="118.93911917098447" r="3" fill="#2f8f57" opacity="0.75"/><path d="M200.75,133.21955958549222 V120.21955958549222" stroke="#2f8f57" stroke-width="1.8" opacity="0.7"/><circle cx="200.75" cy="117.21955958549222" r="3" fill="#2f8f57" opacity="0.75"/><path d="M245.0,131.5 V118.5" stroke="#2f8f57" stroke-width="1.8" opacity="0.7"/><circle cx="245.0" cy="115.5" r="3" fill="#2f8f57" opacity="0.75"/><path d="M289.25,129.78044041450778 V116.78044041450778" stroke="#2f8f57" stroke-width="1.8" opacity="0.7"/><circle cx="289.25" cy="113.78044041450778" r="3" fill="#2f8f57" opacity="0.75"/><path d="M333.5,128.06088082901553 V115.06088082901553" stroke="#2f8f57" stroke-width="1.8" opacity="0.7"/><circle cx="333.5" cy="112.06088082901553" r="3" fill="#2f8f57" opacity="0.75"/><path d="M377.75,126.34132124352331 V113.34132124352331" stroke="#2f8f57" stroke-width="1.8" opacity="0.7"/><circle cx="377.75" cy="110.34132124352331" r="3" fill="#2f8f57" opacity="0.75"/><path d="M422.0,124.62176165803109 V111.62176165803109" stroke="#2f8f57" stroke-width="1.8" opacity="0.7"/><circle cx="422.0" cy="108.62176165803109" r="3" fill="#2f8f57" opacity="0.75"/><path d="M52,136 C82,130 120,112 144,86 C160,114 178,130 206,136" fill="none" stroke="#c0392b" stroke-width="1.5" opacity="0.28"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.15;0.1506;0.31;0.3106;1" dur="11.4s" repeatCount="indefinite"/><path d="M52,136 C82,130 120,112 144,86 C160,114 178,130 206,136" fill="none" stroke="#c0392b" stroke-width="2.6"/><circle cx="144" cy="86" r="3.6" fill="#c0392b"/><text x="144" y="78" font-size="11.5" fill="#c0392b" font-weight="700" text-anchor="middle" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">高频（蜗底峰）</text></g><path d="M52,136 C122,118 332,104 392,98 C408,112 422,126 438,130" fill="none" stroke="#2c5f9e" stroke-width="1.5" opacity="0.28" stroke-dasharray="6 4"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.31;0.3106;0.47;0.4706;1" dur="11.4s" repeatCount="indefinite"/><path d="M52,136 C122,118 332,104 392,98 C408,112 422,126 438,130" fill="none" stroke="#2c5f9e" stroke-width="2.6" stroke-dasharray="6 4"/><circle cx="392" cy="98" r="3.6" fill="#2c5f9e"/><text x="378" y="92" font-size="11.5" fill="#2c5f9e" font-weight="700" text-anchor="end" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">低频（蜗顶峰）</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.47;0.4706;0.635;0.6356;1" dur="11.4s" repeatCount="indefinite"/><text x="240.0" y="218" font-size="11.5" fill="#c1440e" font-weight="700" text-anchor="middle" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">各频率在各自位置振幅最大后骤降</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.635;0.6356;0.815;0.8156;1" dur="11.4s" repeatCount="indefinite"/><text x="68" y="202" font-size="11.5" fill="#2f8f57" font-weight="700" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">纤毛弯曲 → K⁺ 内流</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.815;0.8156;1" dur="11.4s" repeatCount="indefinite"/><path d="M148,158 V228" stroke="#a8791a" stroke-width="2"/><path d="M148,228 l-4,-9 h8 z" fill="#a8791a"/><text x="156" y="226" font-size="11.5" fill="#a8791a" font-weight="700" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">听神经：位置 + 放电频率双编码</text></g><text x="446" y="80" font-size="11.5" fill="#a8b6c4" font-weight="700" text-anchor="end" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">耳蜗行波</text><rect x="22" y="258" width="436" height="3" rx="1.5" fill="#e8eff6"/><path d="M22,259.5 H458" stroke="#0f766e" stroke-width="3" stroke-linecap="round" opacity="0.42" stroke-dasharray="436" stroke-dashoffset="436"><animate attributeName="stroke-dashoffset" values="436;0" keyTimes="0;1" dur="11.4s" repeatCount="indefinite"/></path><circle cx="56.7" cy="259.5" r="4" fill="#ffffff" stroke="#cfdce8" stroke-width="1.5"/><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.15;0.1506;1" dur="11.4s" repeatCount="indefinite"/><circle cx="56.7" cy="259.5" r="5.5" fill="#a8791a"/></g><g opacity="1"><animate attributeName="opacity" values="0.0;0.0;1.0;1.0" keyTimes="0;0.15;0.1506;1" dur="11.4s" repeatCount="indefinite"/><text x="56.7" y="280" text-anchor="middle" font-size="11.5" fill="#b6c4d2" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">声波传入</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.15;0.1506;1" dur="11.4s" repeatCount="indefinite"/><text x="56.7" y="280" text-anchor="middle" font-size="11.5" font-weight="700" fill="#a8791a" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">声波传入</text></g><circle cx="130.0" cy="259.5" r="4" fill="#ffffff" stroke="#cfdce8" stroke-width="1.5"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.15;0.1506;0.31;0.3106;1" dur="11.4s" repeatCount="indefinite"/><circle cx="130.0" cy="259.5" r="5.5" fill="#0f766e"/></g><g opacity="1"><animate attributeName="opacity" values="1.0;1.0;0.0;0.0;1.0;1.0" keyTimes="0;0.15;0.1506;0.31;0.3106;1" dur="11.4s" repeatCount="indefinite"/><text x="130.0" y="280" text-anchor="middle" font-size="11.5" fill="#b6c4d2" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">基底膜行波</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.15;0.1506;0.31;0.3106;1" dur="11.4s" repeatCount="indefinite"/><text x="130.0" y="280" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f766e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">基底膜行波</text></g><circle cx="203.3" cy="259.5" r="4" fill="#ffffff" stroke="#cfdce8" stroke-width="1.5"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.31;0.3106;0.47;0.4706;1" dur="11.4s" repeatCount="indefinite"/><circle cx="203.3" cy="259.5" r="5.5" fill="#c0392b"/></g><g opacity="1"><animate attributeName="opacity" values="1.0;1.0;0.0;0.0;1.0;1.0" keyTimes="0;0.31;0.3106;0.47;0.4706;1" dur="11.4s" repeatCount="indefinite"/><text x="203.3" y="280" text-anchor="middle" font-size="11.5" fill="#b6c4d2" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">频率-位置</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.31;0.3106;0.47;0.4706;1" dur="11.4s" repeatCount="indefinite"/><text x="203.3" y="280" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c0392b" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">频率-位置</text></g><circle cx="276.7" cy="259.5" r="4" fill="#ffffff" stroke="#cfdce8" stroke-width="1.5"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.47;0.4706;0.635;0.6356;1" dur="11.4s" repeatCount="indefinite"/><circle cx="276.7" cy="259.5" r="5.5" fill="#c1440e"/></g><g opacity="1"><animate attributeName="opacity" values="1.0;1.0;0.0;0.0;1.0;1.0" keyTimes="0;0.47;0.4706;0.635;0.6356;1" dur="11.4s" repeatCount="indefinite"/><text x="276.7" y="280" text-anchor="middle" font-size="11.5" fill="#b6c4d2" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">最大振幅点</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.47;0.4706;0.635;0.6356;1" dur="11.4s" repeatCount="indefinite"/><text x="276.7" y="280" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c1440e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">最大振幅点</text></g><circle cx="350.0" cy="259.5" r="4" fill="#ffffff" stroke="#cfdce8" stroke-width="1.5"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.635;0.6356;0.815;0.8156;1" dur="11.4s" repeatCount="indefinite"/><circle cx="350.0" cy="259.5" r="5.5" fill="#2f8f57"/></g><g opacity="1"><animate attributeName="opacity" values="1.0;1.0;0.0;0.0;1.0;1.0" keyTimes="0;0.635;0.6356;0.815;0.8156;1" dur="11.4s" repeatCount="indefinite"/><text x="350.0" y="280" text-anchor="middle" font-size="11.5" fill="#b6c4d2" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">毛细胞换能</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.635;0.6356;0.815;0.8156;1" dur="11.4s" repeatCount="indefinite"/><text x="350.0" y="280" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2f8f57" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">毛细胞换能</text></g><circle cx="423.3" cy="259.5" r="4" fill="#ffffff" stroke="#cfdce8" stroke-width="1.5"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.815;0.8156;1" dur="11.4s" repeatCount="indefinite"/><circle cx="423.3" cy="259.5" r="5.5" fill="#2c5f9e"/></g><g opacity="1"><animate attributeName="opacity" values="1.0;1.0;0.0;0.0" keyTimes="0;0.815;0.8156;1" dur="11.4s" repeatCount="indefinite"/><text x="423.3" y="280" text-anchor="middle" font-size="11.5" fill="#b6c4d2" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">听神经编码</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.815;0.8156;1" dur="11.4s" repeatCount="indefinite"/><text x="423.3" y="280" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2c5f9e" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">听神经编码</text></g><rect x="22" y="292" width="436" height="92" rx="10" fill="#ffffff" stroke="#e3ebf3" stroke-width="1"/><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.15;0.1506;1" dur="11.4s" repeatCount="indefinite"/><rect x="22" y="293" width="3" height="90" fill="#a8791a" opacity="0.85"/><text x="40" y="318" font-size="11.5" fill="#a8b6c4" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">因为</text><text x="78" y="318" font-size="12.5" fill="#6b7c8d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">声波经外耳道振动鼓膜，经听骨链传到卵圆窗</text><text x="40" y="354" font-size="11.5" fill="#a8791a" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">所以</text><text x="78" y="354" font-size="14.5" fill="#a8791a" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">听骨链有放大作用，弥补空气与淋巴的阻抗差</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.15;0.1506;0.31;0.3106;1" dur="11.4s" repeatCount="indefinite"/><rect x="22" y="293" width="3" height="90" fill="#0f766e" opacity="0.85"/><text x="40" y="318" font-size="11.5" fill="#a8b6c4" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">因为</text><text x="78" y="318" font-size="12.5" fill="#6b7c8d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">卵圆窗振动在淋巴中产生压力波，推动基底膜</text><text x="40" y="354" font-size="11.5" fill="#0f766e" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">所以</text><text x="78" y="354" font-size="14.5" fill="#0f766e" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">行波从蜗底向蜗顶传播，振幅逐渐增大后骤降</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.31;0.3106;0.47;0.4706;1" dur="11.4s" repeatCount="indefinite"/><rect x="22" y="293" width="3" height="90" fill="#c0392b" opacity="0.85"/><text x="40" y="318" font-size="11.5" fill="#a8b6c4" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">因为</text><text x="78" y="318" font-size="12.5" fill="#6b7c8d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">基底膜从蜗底到蜗顶逐渐变宽、变软</text><text x="40" y="354" font-size="11.5" fill="#c0392b" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">所以</text><text x="78" y="354" font-size="14.5" fill="#c0392b" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">高频在蜗底、低频在蜗顶达到最大振幅 —— 位置编码频</text><text x="78" y="371.5" font-size="14.5" fill="#c0392b" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">率</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.47;0.4706;0.635;0.6356;1" dur="11.4s" repeatCount="indefinite"/><rect x="22" y="293" width="3" height="90" fill="#c1440e" opacity="0.85"/><text x="40" y="318" font-size="11.5" fill="#a8b6c4" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">因为</text><text x="78" y="318" font-size="12.5" fill="#6b7c8d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">每种频率在特定位置振幅最大、随后迅速消失</text><text x="40" y="354" font-size="11.5" fill="#c1440e" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">所以</text><text x="78" y="354" font-size="14.5" fill="#c1440e" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">这是耳蜗的「频率分析器」功能，等于硬件做傅里叶变换</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.635;0.6356;0.815;0.8156;1" dur="11.4s" repeatCount="indefinite"/><rect x="22" y="293" width="3" height="90" fill="#2f8f57" opacity="0.85"/><text x="40" y="318" font-size="11.5" fill="#a8b6c4" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">因为</text><text x="78" y="318" font-size="12.5" fill="#6b7c8d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">基底膜振动使纤毛弯曲，机械门控 K⁺ 通道开放</text><text x="40" y="354" font-size="11.5" fill="#2f8f57" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">所以</text><text x="78" y="354" font-size="14.5" fill="#2f8f57" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">毛细胞去极化，释放递质到螺旋神经节</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.815;0.8156;1" dur="11.4s" repeatCount="indefinite"/><rect x="22" y="293" width="3" height="90" fill="#2c5f9e" opacity="0.85"/><text x="40" y="318" font-size="11.5" fill="#a8b6c4" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">因为</text><text x="78" y="318" font-size="12.5" fill="#6b7c8d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">不同纤维连到不同位置，各自只对特定频率最敏感</text><text x="40" y="354" font-size="11.5" fill="#2c5f9e" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">所以</text><text x="78" y="354" font-size="14.5" fill="#2c5f9e" font-weight="700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">位置编码音调，放电频率与纤维同步编码频率与强度</text></g><text x="22" y="403" font-size="11.5" fill="#a8b6c4" font-weight="700" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">位置编码频率</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.31;0.3106;0.47;0.4706;1" dur="11.4s" repeatCount="indefinite"/><rect x="22" y="413" width="3" height="15" rx="1.5" fill="#c0392b"/><text x="34" y="424" font-size="12.5" fill="#c0392b" font-weight="700" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">蜗底</text><text x="104" y="424" font-size="12" fill="#6b7c8d" font-weight="400" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">窄而硬 → 高频共振</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.31;0.3106;0.47;0.4706;1" dur="11.4s" repeatCount="indefinite"/><rect x="22" y="436" width="3" height="15" rx="1.5" fill="#2c5f9e"/><text x="34" y="447" font-size="12.5" fill="#2c5f9e" font-weight="700" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">蜗顶</text><text x="104" y="447" font-size="12" fill="#6b7c8d" font-weight="400" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">宽而软 → 低频共振</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.47;0.4706;0.635;0.6356;1" dur="11.4s" repeatCount="indefinite"/><rect x="22" y="459" width="3" height="15" rx="1.5" fill="#c1440e"/><text x="34" y="470" font-size="12.5" fill="#c1440e" font-weight="700" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">最大点</text><text x="104" y="470" font-size="12" fill="#6b7c8d" font-weight="400" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">频率分析的物理基础</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.635;0.6356;0.815;0.8156;1" dur="11.4s" repeatCount="indefinite"/><rect x="22" y="482" width="3" height="15" rx="1.5" fill="#2f8f57"/><text x="34" y="493" font-size="12.5" fill="#2f8f57" font-weight="700" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">换能</text><text x="104" y="493" font-size="12" fill="#6b7c8d" font-weight="400" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">纤毛弯曲 → K⁺ 内流</text></g><rect x="22" y="508" width="436" height="33" rx="8" fill="#f0fdfa"/><text x="34" y="528" font-size="12" fill="#1e293b" font-weight="700" text-anchor="start" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">耳蜗等于硬件做傅里叶变换：靠位置分析频率，不靠计算</text></svg>