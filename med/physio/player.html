</div><script>
(function(g){
  var SPEEDS=[0.5,1,1.5];
  function makeBar(svg){
    var wrap=document.createElement('div'); wrap.className='smctl';
    function btn(t,ti){var b=document.createElement('button');b.type='button';
      b.className='smbtn';b.textContent=t;if(ti)b.title=ti;return b;}
    var bPrev=btn('\u2039','上一相位'), bPlay=btn('\u23f8','暂停 / 继续'),
        bNext=btn('\u203a','下一相位'), bSpeed=btn('1\u00d7','切换速度'),
        bReset=btn('\u21ba','回到开头');
    var lab=document.createElement('span'); lab.className='smlab';

    var dur=0;
    svg.querySelectorAll('animate[dur]').forEach(function(a){
      var v=parseFloat(a.getAttribute('dur'))||0; if(v>dur) dur=v; });
    dur=dur||10;

    var marks=[];
    svg.querySelectorAll('animate[dur]').forEach(function(a){
      var v=parseFloat(a.getAttribute('dur'))||0;
      if(Math.abs(v-dur)>0.01) return;
      var kt=(a.getAttribute('keyTimes')||'').trim(); if(!kt) return;
      kt.split(';').forEach(function(x){var q=parseFloat(x);
        if(!isNaN(q)&&q>0.03&&q<0.97) marks.push(q); }); });
    marks.sort(function(a,b){return a-b});
    var groups=[];
    marks.forEach(function(m){
      if(groups.length && m-groups[groups.length-1].last<0.05){
        var q=groups[groups.length-1]; q.sum+=m; q.n+=1; q.last=m;
      } else groups.push({sum:m,n:1,last:m});
    });
    var uniq=[0];
    groups.forEach(function(q){var v=q.sum/q.n;
      if(v-uniq[uniq.length-1]>0.04) uniq.push(v);});
    if(uniq.length<2) uniq=[0,0.5,1];
    if(uniq[uniq.length-1]<0.96) uniq.push(1);
    uniq=uniq.map(function(v){return Math.round(v*1000)/1000});
    var nStep=Math.max(uniq.length-1,1);

    var t=0, playing=true, speed=1, last=0, raf=null;
    function manual(){try{if(!svg.animationsPaused())svg.pauseAnimations();}catch(e){}}
    function apply(){manual();try{svg.setCurrentTime(t%dur);}catch(e){}}
    function paint(){
      bPlay.textContent=playing?'\u23f8':'\u25b6';
      bPlay.classList.toggle('on',playing);
      bSpeed.textContent=speed+'\u00d7';
      var now=t/dur,k=0;
      for(var i=0;i<uniq.length-1;i++) if(now>=uniq[i]-1e-6) k=i;
      lab.textContent='\u7b2c '+(k+1)+' / '+nStep+' \u6b65';
    }
    function loop(now){
      if(!playing) return;
      if(!last) last=now;
      var dt=(now-last)/1000; last=now;
      t+=dt*speed; if(t>=dur) t-=dur;
      apply(); paint(); raf=requestAnimationFrame(loop);
    }
    function play(){playing=true;last=0;raf=requestAnimationFrame(loop);paint();}
    function pause(){playing=false;if(raf)cancelAnimationFrame(raf);raf=null;apply();paint();}
    bPlay.onclick=function(){playing?pause():play();};
    bSpeed.onclick=function(){var i=SPEEDS.indexOf(speed);
      speed=SPEEDS[(i+1)%SPEEDS.length]; last=0; paint();};
    function step(d){
      pause();
      var best=0,bd=1e9;
      for(var i=0;i<uniq.length;i++){var q=Math.abs(t/dur-uniq[i]);
        if(q<bd){bd=q;best=i;}}
      var ni=Math.max(0,Math.min(best+d,uniq.length-1));
      t=Math.min(uniq[ni]*dur+0.012,dur-0.002);
      apply(); paint();
    }
    bPrev.onclick=function(){step(-1);};
    bNext.onclick=function(){step(1);};
    bReset.onclick=function(){pause();t=0;apply();paint();};

    [bPrev,bPlay,bNext,bSpeed,bReset].forEach(function(b){wrap.appendChild(b);});
    wrap.appendChild(lab);

    manual(); apply(); paint();
    if('IntersectionObserver' in window){
      var io=new IntersectionObserver(function(es){
        es.forEach(function(e){ if(e.isIntersecting) play(); else pause(); });
      },{rootMargin:'120px'});
      io.observe(svg.closest('.stage')||svg);
    } else play();
    return wrap;
  }
  g.initSmilCtl=function(root){
    (root||document).querySelectorAll('.stage').forEach(function(st){
      if(st.dataset.ctl) return;
      var svg=st.querySelector('svg'); if(!svg||!svg.pauseAnimations) return;
      // 只有「有真实循环动画」的图才加控件：
      //   至少 2 个 animate，且最大 dur > 1s（排除只有一个标题淡入的静态图）
      var durs=[], mx=0;
      svg.querySelectorAll('animate[dur]').forEach(function(a){
        var v=parseFloat(a.getAttribute('dur'))||0; durs.push(v); if(v>mx) mx=v;});
      if(durs.length<2 || mx<=1) { st.dataset.ctl='1'; st.classList.add('static'); return; }
      st.dataset.ctl='1';
      st.appendChild(makeBar(svg));
    });
  };
  if(document.readyState==='loading')
    document.addEventListener('DOMContentLoaded',function(){g.initSmilCtl()});
  else g.initSmilCtl();
})(window);
</script><script>
const DATA = [{"cid":"01_feedback","t":"负反馈：扰动被拉回","d":"血压升高被感受器检出，经中枢比较后引起心率下降与血管舒张，血压回落到调定点；四条边依次亮起表示信号绕行一圈。","f":"01_feedback.svg","lv":0,"ln":"L0 基础：调节原理与膜电位"},{"cid":"01_regulation","t":"三种调节方式","d":"神经调节经反射弧最快最准，体液调节经血液较慢较广，自身调节只在局部起效；下方三个点以不同速度沿时间轴推进。","f":"01_regulation.svg","lv":0,"ln":"L0 基础：调节原理与膜电位"},{"cid":"membrane","t":"膜通道与离子流","d":"0 期 Na+ 通道开放致去极化，2 期 Ca2+ 内流形成平台，3 期 K+ 外流复极；静息由 Na-K 泵与 K+ 漏通道维持 -90 mV。动画为慢放，真实动作电位约 2","f":"membrane.svg","lv":0,"ln":"L0 基础：调节原理与膜电位"},{"cid":"ecc","t":"心肌兴奋-收缩耦联","d":"动作电位沿肌膜与 T 管内传，L 型钙通道开放使少量钙内流，触发肌浆网 RyR2 释放大量钙；钙结合肌钙蛋白使原肌球蛋白移位，横桥摆动拉动细肌丝向 M 线滑入，I 带变窄而 A","f":"ecc.svg","lv":1,"ln":"L1 细胞与血液"},{"cid":"03_hemostasis","t":"生理性止血三阶段","d":"血管受损后先痉挛收缩减少血流，血小板黏附聚集形成松软血栓，凝血级联把纤维蛋白原转为纤维蛋白网加固；血流粒子在第三阶段后不再外漏。","f":"03_hemostasis.svg","lv":1,"ln":"L1 细胞与血液"},{"cid":"03_coagulation","t":"凝血级联","d":"内源性与外源性两条路径分别在Ⅹ处汇合，进入共同途径；凝血酶进一步放大纤维蛋白生成。APTT 反映内源，PT 反映外源。","f":"03_coagulation.svg","lv":1,"ln":"L1 细胞与血液"},{"cid":"proc_coagulation","t":"凝血级联：两条路，一个汇合点","d":"凝血分内源与外源两条通路：内源由胶原接触激活Ⅻ，放大慢但量大；外源由组织因子Ⅲ与Ⅶa启动，数秒即起效。两条路在Ⅹ处汇合，共同激活凝血酶原成凝血酶，凝血酶再正反馈","f":"proc_coagulation.svg","lv":1,"ln":"L1 细胞与血液"},{"cid":"cardiac_v6","t":"左心 · 心动周期","d":"左心房为静脉血，经二尖瓣充盈左心室；左心室收缩使室内压超过主动脉压时主动脉瓣开放射血。图为慢放，真实一个心动周期约 0.8 秒，心率 75 次每分。","f":"cardiac_v6.svg","lv":2,"ln":"L2 循环与呼吸"},{"cid":"ap_smil","t":"心室肌动作电位","d":"0 期 Na+ 内流去极化，2 期 Ca2+ 内流形成平台，3 期 K+ 外流复极。动画慢放，真实动作电位约 200 毫秒。","f":"ap_smil.svg","lv":2,"ln":"L2 循环与呼吸"},{"cid":"proc_action_potential","t":"动作电位：五期一条曲线","d":"心室肌动作电位分五期：静息期靠K⁺外流维持−90mV；0期快钠通道开放、Na⁺内流形成去极化；1期Ito钾通道瞬时开放快速复极；2期L型钙内流与钾外流平衡形成平","f":"proc_action_potential.svg","lv":2,"ln":"L2 循环与呼吸"},{"cid":"proc_cardiac","t":"心动周期：一个环，四个期","d":"左心室心动周期可用压力-容积环表示：充盈期房室瓣开放、容积由55增至125mL；等容收缩期两瓣均关，容积不变而压力由12升到80mmHg；射血期主动脉瓣开放，容","f":"proc_cardiac.svg","lv":2,"ln":"L2 循环与呼吸"},{"cid":"05_ventilation","t":"肺通气：动力与阻力","d":"膈肌收缩下移使胸廓扩大、肺内压低于大气压，气体入肺；平静呼气靠肺弹性回缩被动完成。弹性阻力约占七成。","f":"05_ventilation.svg","lv":2,"ln":"L2 循环与呼吸"},{"cid":"05_odc","t":"氧解离曲线","d":"标准 S 形曲线与右移曲线对比；40 mmHg 时饱和度约 75%，100 mmHg 时约 98%，右移利于组织释氧。","f":"05_odc.svg","lv":2,"ln":"L2 循环与呼吸"},{"cid":"proc_ventilation","t":"肺通气：胸廓拉，肺跟着走","d":"肺通气的动力是肺内压与大气压之差，而肺内压的变化来自胸腔容积变化。吸气时膈肌收缩下移、肋间外肌上提肋骨，胸腔容积增大，胸膜腔内压降到−8cmH₂O，肺被牵拉扩张","f":"proc_ventilation.svg","lv":2,"ln":"L2 循环与呼吸"},{"cid":"proc_odc","t":"氧解离曲线：S 形三段各管一段","d":"Hb四个亚基依次结合氧、前一个结合促进后一个，正协同使曲线呈S形而非双曲线。上段PO₂60~100平坦，对应肺部携氧，PO₂小幅下降不影响饱和度；中段30~60","f":"proc_odc.svg","lv":2,"ln":"L2 循环与呼吸"},{"cid":"06_gastric","t":"胃液分泌三时相","d":"头期由视嗅咀嚼经迷走神经引起，分泌约占三成；胃期由食物扩张与蛋白刺激 G 细胞，约占六成；肠期由食糜入十二指肠引起，约占一成。","f":"06_gastric.svg","lv":3,"ln":"L3 代谢、消化与排泄"},{"cid":"06_absorption","t":"小肠吸收两条路","d":"绒毛内毛细血管接收葡萄糖与氨基酸经门静脉入肝；中央乳糜管接收脂肪经淋巴入血，绕过肝脏。","f":"06_absorption.svg","lv":3,"ln":"L3 代谢、消化与排泄"},{"cid":"proc_gastric","t":"胃液分泌：三时相，一台泵","d":"胃液分泌按刺激来源分三时相：头期由视嗅咀嚼经迷走引起，占30%；胃期由食物扩张与蛋白产物刺激，占60%，是分泌主力；肠期占10%。壁细胞上同时有乙酰胆碱M3、胃","f":"proc_gastric.svg","lv":3,"ln":"L3 代谢、消化与排泄"},{"cid":"proc_absorption","t":"小肠吸收：一堵墙，两条出口","d":"小肠吸收先靠刷状缘酶把大分子切成单体。葡萄糖经SGLT1与Na⁺同向转运入胞，属继发性主动转运；氨基酸也借Na⁺梯度入胞。这两类都进入毛细血管、经门静脉先到肝。","f":"proc_absorption.svg","lv":3,"ln":"L3 代谢、消化与排泄"},{"cid":"07_thermoreg","t":"体温调节","d":"产热与散热如天平两端，由下丘脑调定点 37℃ 统一协调；发热是调定点上移的主动过程，中暑是散热失败的被动升温。","f":"07_thermoreg.svg","lv":3,"ln":"L3 代谢、消化与排泄"},{"cid":"07_energy","t":"能量代谢测定","d":"间接测热法通过 O2 消耗与 CO2 产量算呼吸商，再查表求得产热量；三大营养素每升氧的产热不同。","f":"07_energy.svg","lv":3,"ln":"L3 代谢、消化与排泄"},{"cid":"proc_thermoreg","t":"体温调节：一块调定点，两条腿","d":"体温调节是负反馈：皮肤与内脏温度感受器把信息经脊髓丘脑束送到PO/AH，与调定点37℃比较；低于调定点则增加产热（寒战与非寒战产热）并减少散热（皮肤血管收缩、汗","f":"proc_thermoreg.svg","lv":3,"ln":"L3 代谢、消化与排泄"},{"cid":"08_filtration","t":"肾小球滤过","d":"入球端有效滤过压约 10 mmHg 驱动滤过；血浆胶体渗透压沿毛细血管升高，滤过压递减至零达到滤过平衡。","f":"08_filtration.svg","lv":3,"ln":"L3 代谢、消化与排泄"},{"cid":"08_loop","t":"髓袢逆流倍增","d":"降支只透水、升支只透盐，两个方向相反的流动使组织液渗透压从皮质 300 升至髓质 1200 mOsm/L，这是尿液浓缩的基础。","f":"08_loop.svg","lv":3,"ln":"L3 代谢、消化与排泄"},{"cid":"proc_filtration","t":"肾小球滤过：三层膜，一个净压力","d":"肾小球滤过靠两层机制：一是滤过膜的机械与电荷屏障，内皮窗孔挡血细胞、基膜挡带负电的大分子、足细胞裂孔膜做最后一道筛；二是有效滤过压，等于毛细血管压45减去胶体渗","f":"proc_filtration.svg","lv":3,"ln":"L3 代谢、消化与排泄"},{"cid":"proc_loop","t":"髓袢逆流倍增：300 变成 1200","d":"髓袢逆流倍增的前提是两支通透性相反：降支只透水，水被高渗间质吸出，管内液变浓；升支粗段主动泵出Na⁺-K⁺-2Cl⁻，只透盐不透水，使间质变浓而管内变稀。由于两","f":"proc_loop.svg","lv":3,"ln":"L3 代谢、消化与排泄"},{"cid":"09_vision","t":"眼的折光与感光","d":"平行光经角膜与晶状体两次折射聚焦于视网膜；视杆管暗视、视锥管明视与辨色；近视眼轴过长、远视眼轴过短。","f":"09_vision.svg","lv":4,"ln":"L4 神经与感官"},{"cid":"09_cochlea","t":"耳蜗频率-位置编码","d":"基底膜从蜗底到蜗顶变宽变软，不同频率的行波在不同位置达到最大振幅：高频靠蜗底、低频靠蜗顶。","f":"09_cochlea.svg","lv":4,"ln":"L4 神经与感官"},{"cid":"10_synapse","t":"化学突触传递","d":"动作电位到末梢引起钙内流，小泡释放递质，递质结合后膜受体使离子通道开放，产生 EPSP 并叠加至阈电位。传递是单向的。","f":"10_synapse.svg","lv":4,"ln":"L4 神经与感官"},{"cid":"10_stretch","t":"牵张反射","d":"肌肉被动拉长使肌梭伸长，Ⅰa 类纤维放电经脊髓单突触兴奋 α 运动神经元，引起同一肌肉收缩。膝跳反射即此环路。","f":"10_stretch.svg","lv":4,"ln":"L4 神经与感官"},{"cid":"proc_synapse","t":"突触传递：电 → 化学 → 电","d":"化学突触传递分六步：动作电位到达前末梢使其去极化，打开电压门控钙通道，Ca²⁺内流触发囊泡与前膜融合、递质量子式胞吐；递质扩散过20nm间隙结合后膜受体，配体门","f":"proc_synapse.svg","lv":4,"ln":"L4 神经与感官"},{"cid":"11_hpa","t":"下丘脑-垂体-靶腺轴","d":"三级激素逐级放大，靶腺激素经长负反馈抑制上游；长期外源激素会造成皮质萎缩。另两个轴结构同构。","f":"11_hpa.svg","lv":5,"ln":"L5 内分泌与生殖"},{"cid":"11_glucose","t":"血糖稳态","d":"胰岛素是唯一降糖激素，促摄取与合成；升糖激素有五种，以胰高血糖素与肾上腺素为主。两侧粒子表示激素流向血糖池。","f":"11_glucose.svg","lv":5,"ln":"L5 内分泌与生殖"},{"cid":"proc_hpa","t":"下丘脑-垂体-靶腺轴：三级 + 一个环","d":"下丘脑-垂体-靶腺轴分三级：下丘脑神经分泌细胞释放TRH、CRH、GnRH经垂体门脉到垂体前叶；垂体分泌TSH、ACTH、LH/FSH等促激素；促激素再刺激甲状","f":"proc_hpa.svg","lv":5,"ln":"L5 内分泌与生殖"},{"cid":"12_menstrual","t":"月经周期四激素时序","d":"FSH 促卵泡发育，雌激素出现两个峰，LH 峰触发排卵；黄体期孕激素升高，撤退后月经来潮。","f":"12_menstrual.svg","lv":5,"ln":"L5 内分泌与生殖"},{"cid":"12_pregnancy","t":"妊娠的激素交接","d":"滋养细胞分泌 hCG 保住黄体维持孕激素；孕 8~10 周胎盘接手，hCG 回落而孕激素继续维持。","f":"12_pregnancy.svg","lv":5,"ln":"L5 内分泌与生殖"},{"cid":"13_growth","t":"生长速度两个突增期","d":"生长速度不是匀速：婴儿期与青春期各有一次突增；前者以营养与甲状腺激素为主，后者靠 GH 与性激素协同。","f":"13_growth.svg","lv":6,"ln":"L6 整体与老化"},{"cid":"13_aging","t":"衰老：储备下降","d":"三个年龄段的最大能力与静息功能对比：静息功能下降有限，但储备逐年减少，因此应激时容易失代偿。","f":"13_aging.svg","lv":6,"ln":"L6 整体与老化"}];
(function(){
  const krow=document.getElementById('krow'), stages=document.getElementById('stages');
  let cur=null;
  DATA.forEach(function(d,i){
    const b=document.createElement('button');
    b.className='hbtn'+(i===0?' on':'');
    b.dataset.cid=d.cid;
    const nm=document.createElement('span');
    nm.textContent=d.t.split('：')[0];
    b.appendChild(nm);
    if(d.ln){
      const t=document.createElement('i');
      t.textContent=d.ln.split(' ')[0];
      t.title=d.ln;
      b.appendChild(t);
    }
    b.onclick=function(){ show(d.cid); };
    krow.appendChild(b);

    const st=document.createElement('div');
    st.className='stage'; st.id='st-'+d.cid;
    st.dataset.src=d.f;
    stages.appendChild(st);
  });
  const cache={};
  function show(cid){
    document.querySelectorAll('#krow .hbtn').forEach(function(x){
      var on=(x.dataset.cid===cid);
      x.classList.toggle('on', on);
      if(on && x.scrollIntoView)
        x.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
    });
    const rec0=DATA.find(function(y){return y.cid===cid;});
    const klab=document.getElementById('klab');
    if(klab) klab.innerHTML='知识点'+(rec0&&rec0.ln
      ? '<b style="color:#0f766e;font-weight:700;margin-left:6px">'+rec0.ln+'</b>' : '');
    document.querySelectorAll('.stage').forEach(x=>
      x.classList.toggle('on', x.id==='st-'+cid));
    const on=document.getElementById('st-'+cid);
    if(on) on.scrollIntoView({behavior:'smooth',block:'nearest'});
    history.replaceState(null,'','#c-'+cid);
    if(!on) return;
    if(on.dataset.ctl){ if(window.initSmilCtl) window.initSmilCtl(); return; }
    const rec=DATA.find(x=>x.cid===cid);
    if(!rec) return;
    on.innerHTML='<div class="desc" style="padding:24px 0">载入中…</div>';
    fetch('figs/'+rec.f).then(r=>r.text()).then(txt=>{
      on.innerHTML=txt+'<div class="desc">'+rec.d+'</div>';
      if(window.initSmilCtl) window.initSmilCtl();
    }).catch(()=>{
      on.innerHTML='<div class="desc">载入失败，请刷新重试</div>';
    });
  }
  // 初始：hash 指定 or 第一个
  const h=(location.hash||'').replace('#c-','');
  const target=DATA.find(x=>x.cid===h)||DATA[0];
  if(target) show(target.cid);
  window.addEventListener('hashchange',function(){
    const hh=(location.hash||'').replace('#c-','');
    if(hh) show(hh);
  });
})();
</script></body></html>
