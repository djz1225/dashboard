</div><script>
(function(g){
  var SPEEDS=[0.5,1,1.5];
  function makeBar(svg){
    var wrap=document.createElement('div'); wrap.className='smctl';
    function btn(t,ti){var b=document.createElement('button');b.type='button';
      b.className='smbtn';b.textContent=t;if(ti)b.title=ti;return b;}
    var bPrev=btn('\u2039','上一相位'), bPlay=btn('\u23f8','暂停 / 继续'),
        bNext=btn('\u203a','下一相位'), bSpeed=btn('1\u00d7','切换速度'),
        bReset=btn('\u21ba','回到开头');
    var lab=document.createElement('span'); lab.className='smlab';

    var dur=0;
    svg.querySelectorAll('animate[dur]').forEach(function(a){
      var v=parseFloat(a.getAttribute('dur'))||0; if(v>dur) dur=v; });
    dur=dur||10;

    var marks=[];
    svg.querySelectorAll('animate[dur]').forEach(function(a){
      var v=parseFloat(a.getAttribute('dur'))||0;
      if(Math.abs(v-dur)>0.01) return;
      var kt=(a.getAttribute('keyTimes')||'').trim(); if(!kt) return;
      kt.split(';').forEach(function(x){var q=parseFloat(x);
        if(!isNaN(q)&&q>0.03&&q<0.97) marks.push(q); }); });
    marks.sort(function(a,b){return a-b});
    var groups=[];
    marks.forEach(function(m){
      if(groups.length && m-groups[groups.length-1].last<0.05){
        var q=groups[groups.length-1]; q.sum+=m; q.n+=1; q.last=m;
      } else groups.push({sum:m,n:1,last:m});
    });
    var uniq=[0];
    groups.forEach(function(q){var v=q.sum/q.n;
      if(v-uniq[uniq.length-1]>0.04) uniq.push(v);});
    if(uniq.length<2) uniq=[0,0.5,1];
    if(uniq[uniq.length-1]<0.96) uniq.push(1);
    uniq=uniq.map(function(v){return Math.round(v*1000)/1000});
    var nStep=Math.max(uniq.length-1,1);

    var t=0, playing=true, speed=1, last=0, raf=null;
    function manual(){try{if(!svg.animationsPaused())svg.pauseAnimations();}catch(e){}}
    function apply(){manual();try{svg.setCurrentTime(t%dur);}catch(e){}}
    function paint(){
      bPlay.textContent=playing?'\u23f8':'\u25b6';
      bPlay.classList.toggle('on',playing);
      bSpeed.textContent=speed+'\u00d7';
      var now=t/dur,k=0;
      for(var i=0;i<uniq.length-1;i++) if(now>=uniq[i]-1e-6) k=i;
      lab.textContent='\u7b2c '+(k+1)+' / '+nStep+' \u6b65';
    }
    function loop(now){
      if(!playing) return;
      if(!last) last=now;
      var dt=(now-last)/1000; last=now;
      t+=dt*speed; if(t>=dur) t-=dur;
      apply(); paint(); raf=requestAnimationFrame(loop);
    }
    function play(){playing=true;last=0;raf=requestAnimationFrame(loop);paint();}
    function pause(){playing=false;if(raf)cancelAnimationFrame(raf);raf=null;apply();paint();}
    bPlay.onclick=function(){playing?pause():play();};
    bSpeed.onclick=function(){var i=SPEEDS.indexOf(speed);
      speed=SPEEDS[(i+1)%SPEEDS.length]; last=0; paint();};
    function step(d){
      pause();
      var best=0,bd=1e9;
      for(var i=0;i<uniq.length;i++){var q=Math.abs(t/dur-uniq[i]);
        if(q<bd){bd=q;best=i;}}
      var ni=Math.max(0,Math.min(best+d,uniq.length-1));
      t=Math.min(uniq[ni]*dur+0.012,dur-0.002);
      apply(); paint();
    }
    bPrev.onclick=function(){step(-1);};
    bNext.onclick=function(){step(1);};
    bReset.onclick=function(){pause();t=0;apply();paint();};

    [bPrev,bPlay,bNext,bSpeed,bReset].forEach(function(b){wrap.appendChild(b);});
    wrap.appendChild(lab);

    manual(); apply(); paint();
    if('IntersectionObserver' in window){
      var io=new IntersectionObserver(function(es){
        es.forEach(function(e){ if(e.isIntersecting) play(); else pause(); });
      },{rootMargin:'120px'});
      io.observe(svg.closest('.stage')||svg);
    } else play();
    return wrap;
  }
  g.initSmilCtl=function(root){
    (root||document).querySelectorAll('.stage').forEach(function(st){
      if(st.dataset.ctl) return;
      var svg=st.querySelector('svg'); if(!svg||!svg.pauseAnimations) return;
      // 只有「有真实循环动画」的图才加控件：
      //   至少 2 个 animate，且最大 dur > 1s（排除只有一个标题淡入的静态图）
      var durs=[], mx=0;
      svg.querySelectorAll('animate[dur]').forEach(function(a){
        var v=parseFloat(a.getAttribute('dur'))||0; durs.push(v); if(v>mx) mx=v;});
      if(durs.length<2 || mx<=1) { st.dataset.ctl='1'; st.classList.add('static'); return; }
      st.dataset.ctl='1';
      st.appendChild(makeBar(svg));
    });
  };
  if(document.readyState==='loading')
    document.addEventListener('DOMContentLoaded',function(){g.initSmilCtl()});
  else g.initSmilCtl();
})(window);
</script><script>
const DATA = window.__PLAYER_DATA = [{"cid":"01_feedback","t":"负反馈：扰动被拉回","d":"血压升高被感受器检出，经中枢比较后引起心率下降与血管舒张，血压回落到调定点；四条边依次亮起表示信号绕行一圈。","f":"01_feedback.svg","lv":0,"ln":"L0 基础：调节原理与膜电位"},{"cid":"01_regulation","t":"三种调节方式","d":"神经调节经反射弧最快最准，体液调节经血液较慢较广，自身调节只在局部起效；下方三个点以不同速度沿时间轴推进。","f":"01_regulation.svg","lv":0,"ln":"L0 基础：调节原理与膜电位"},{"cid":"proc_feedback","t":"负反馈：方向相反的自动纠正","d":"负反馈由四个环节构成：扰动使指标偏离设定值，感受器监测到偏离并转成信号，中枢把它与调定点比较、算出偏差方向，效应器再按指令做与偏离方向相反的调节。指标回落后偏差","f":"proc_feedback.svg","lv":0,"ln":"L0 基础：调节原理与膜电位"},{"cid":"membrane","t":"膜通道与离子流","d":"0 期 Na+ 通道开放致去极化，2 期 Ca2+ 内流形成平台，3 期 K+ 外流复极；静息由 Na-K 泵与 K+ 漏通道维持 -90 mV。动画为慢放，真实动作电位约 2","f":"membrane.svg","lv":0,"ln":"L0 基础：调节原理与膜电位"},{"cid":"ecc","t":"心肌兴奋-收缩耦联","d":"动作电位沿肌膜与 T 管内传，L 型钙通道开放使少量钙内流，触发肌浆网 RyR2 释放大量钙；钙结合肌钙蛋白使原肌球蛋白移位，横桥摆动拉动细肌丝向 M 线滑入，I 带变窄而 A","f":"ecc.svg","lv":1,"ln":"L1 细胞与血液"},{"cid":"proc_crossbridge","t":"横桥循环：上一膛、拉一把、松一次","d":"横桥循环分四步：肌球蛋白头部水解ATP后处于高位能状态；胞质Ca²⁺与肌钙蛋白C结合，原肌球蛋白滚开暴露肌动蛋白位点；头部与之结合形成横桥并释放Pi；ADP释放","f":"proc_crossbridge.svg","lv":1,"ln":"L1 细胞与血液"},{"cid":"proc_ecc","t":"兴奋-收缩耦联：从电信号到机械收缩","d":"兴奋-收缩耦联把电信号变成机械收缩：动作电位沿肌膜传播，经T管传入细胞深部，使T管膜上的L型钙通道（DHPR）感受到电压变化；在骨骼肌它机械偶联激活肌质网RyR","f":"proc_ecc.svg","lv":1,"ln":"L1 细胞与血液"},{"cid":"proc_signal","t":"信号转导：一套骨架，多条支路","d":"细胞信号转导有通用骨架：信号分子、受体、换能器与效应器四段。水溶性激素用膜受体、反应快；脂溶性激素用胞内受体、需改变基因表达，反应慢。膜受体中G蛋白偶联受体激活","f":"proc_signal.svg","lv":1,"ln":"L1 细胞与血液"},{"cid":"03_hemostasis","t":"生理性止血三阶段","d":"血管受损后先痉挛收缩减少血流，血小板黏附聚集形成松软血栓，凝血级联把纤维蛋白原转为纤维蛋白网加固；血流粒子在第三阶段后不再外漏。","f":"03_hemostasis.svg","lv":1,"ln":"L1 细胞与血液"},{"cid":"03_coagulation","t":"凝血级联","d":"内源性与外源性两条路径分别在Ⅹ处汇合，进入共同途径；凝血酶进一步放大纤维蛋白生成。APTT 反映内源，PT 反映外源。","f":"03_coagulation.svg","lv":1,"ln":"L1 细胞与血液"},{"cid":"proc_coagulation","t":"凝血级联：两条路，一个汇合点","d":"凝血分内源与外源两条通路：内源由胶原接触激活Ⅻ，放大慢但量大；外源由组织因子Ⅲ与Ⅶa启动，数秒即起效。两条路在Ⅹ处汇合，共同激活凝血酶原成凝血酶，凝血酶再正反馈","f":"proc_coagulation.svg","lv":1,"ln":"L1 细胞与血液"},{"cid":"proc_hemostasis","t":"止血三阶段：先堵、再固、后清","d":"止血分三个阶段：最先出现的是血管收缩，局部肌层反射性收缩并释放缩血管物质，数秒内减少血流；接着血小板经vWF黏附到暴露的胶原上并被激活，释放ADP与TXA₂招募","f":"proc_hemostasis.svg","lv":1,"ln":"L1 细胞与血液"},{"cid":"cardiac_v6","t":"左心 · 心动周期","d":"左心房为静脉血，经二尖瓣充盈左心室；左心室收缩使室内压超过主动脉压时主动脉瓣开放射血。图为慢放，真实一个心动周期约 0.8 秒，心率 75 次每分。","f":"cardiac_v6.svg","lv":2,"ln":"L2 循环与呼吸"},{"cid":"ap_smil","t":"心室肌动作电位","d":"0 期 Na+ 内流去极化，2 期 Ca2+ 内流形成平台，3 期 K+ 外流复极。动画慢放，真实动作电位约 200 毫秒。","f":"ap_smil.svg","lv":2,"ln":"L2 循环与呼吸"},{"cid":"proc_action_potential","t":"动作电位：五期一条曲线","d":"心室肌动作电位分五期：静息期靠K⁺外流维持−90mV；0期快钠通道开放、Na⁺内流形成去极化；1期Ito钾通道瞬时开放快速复极；2期L型钙内流与钾外流平衡形成平","f":"proc_action_potential.svg","lv":2,"ln":"L2 循环与呼吸"},{"cid":"proc_cardiac","t":"心动周期：一个环，四个期","d":"左心室心动周期可用压力-容积环表示：充盈期房室瓣开放、容积由55增至125mL；等容收缩期两瓣均关，容积不变而压力由12升到80mmHg；射血期主动脉瓣开放，容","f":"proc_cardiac.svg","lv":2,"ln":"L2 循环与呼吸"},{"cid":"proc_baroreflex","t":"压力感受器反射：被拉一下就降压","d":"动脉血压升高时，颈动脉窦与主动脉弓的血管壁被牵拉，传入放电频率增加，经窦神经（舌咽）与减压神经（迷走）进入延髓孤束核。孤束核兴奋迷走背核与疑核、抑制心交感，使心","f":"proc_baroreflex.svg","lv":2,"ln":"L2 循环与呼吸"},{"cid":"05_ventilation","t":"肺通气：动力与阻力","d":"膈肌收缩下移使胸廓扩大、肺内压低于大气压，气体入肺；平静呼气靠肺弹性回缩被动完成。弹性阻力约占七成。","f":"05_ventilation.svg","lv":2,"ln":"L2 循环与呼吸"},{"cid":"05_odc","t":"氧解离曲线","d":"标准 S 形曲线与右移曲线对比；40 mmHg 时饱和度约 75%，100 mmHg 时约 98%，右移利于组织释氧。","f":"05_odc.svg","lv":2,"ln":"L2 循环与呼吸"},{"cid":"proc_ventilation","t":"肺通气：胸廓拉，肺跟着走","d":"肺通气的动力是肺内压与大气压之差，而肺内压的变化来自胸腔容积变化。吸气时膈肌收缩下移、肋间外肌上提肋骨，胸腔容积增大，胸膜腔内压降到−8cmH₂O，肺被牵拉扩张","f":"proc_ventilation.svg","lv":2,"ln":"L2 循环与呼吸"},{"cid":"proc_odc","t":"氧解离曲线：S 形三段各管一段","d":"Hb四个亚基依次结合氧、前一个结合促进后一个，正协同使曲线呈S形而非双曲线。上段PO₂60~100平坦，对应肺部携氧，PO₂小幅下降不影响饱和度；中段30~60","f":"proc_odc.svg","lv":2,"ln":"L2 循环与呼吸"},{"cid":"proc_chemoreg","t":"呼吸的化学调节：CO₂ 是主信号","d":"呼吸的化学调节有三个信号：CO₂是最强且最日常的刺激，它透过血脑屏障生成H⁺，作用于延髓中枢感受器；H⁺本身难透屏障，主要刺激外周化学感受器；PO₂需降到80m","f":"proc_chemoreg.svg","lv":2,"ln":"L2 循环与呼吸"},{"cid":"06_gastric","t":"胃液分泌三时相","d":"头期由视嗅咀嚼经迷走神经引起，分泌约占三成；胃期由食物扩张与蛋白刺激 G 细胞，约占六成；肠期由食糜入十二指肠引起，约占一成。","f":"06_gastric.svg","lv":3,"ln":"L3 代谢、消化与排泄"},{"cid":"06_absorption","t":"小肠吸收两条路","d":"绒毛内毛细血管接收葡萄糖与氨基酸经门静脉入肝；中央乳糜管接收脂肪经淋巴入血，绕过肝脏。","f":"06_absorption.svg","lv":3,"ln":"L3 代谢、消化与排泄"},{"cid":"proc_gastric","t":"胃液分泌：三时相，一台泵","d":"胃液分泌按刺激来源分三时相：头期由视嗅咀嚼经迷走引起，占30%；胃期由食物扩张与蛋白产物刺激，占60%，是分泌主力；肠期占10%。壁细胞上同时有乙酰胆碱M3、胃","f":"proc_gastric.svg","lv":3,"ln":"L3 代谢、消化与排泄"},{"cid":"proc_absorption","t":"小肠吸收：一堵墙，两条出口","d":"小肠吸收先靠刷状缘酶把大分子切成单体。葡萄糖经SGLT1与Na⁺同向转运入胞，属继发性主动转运；氨基酸也借Na⁺梯度入胞。这两类都进入毛细血管、经门静脉先到肝。","f":"proc_absorption.svg","lv":3,"ln":"L3 代谢、消化与排泄"},{"cid":"proc_pancreas","t":"胰液分泌：两型细胞，两个信号","d":"胰液由两型细胞分工分泌：腺泡细胞分泌消化酶，受迷走神经、胃泌素与CCK调节；导管细胞分泌水和HCO₃⁻，主要受促胰液素调节。头期由迷走引起，量少酶多（约20%）","f":"proc_pancreas.svg","lv":3,"ln":"L3 代谢、消化与排泄"},{"cid":"proc_digest","t":"消化系统：三层调节叠加在一起","d":"消化系统受三层调节叠加控制：迷走神经（副交感）支配食管到横结肠，促进蠕动与分泌；壁内神经丛（肌间丛管运动、黏膜下丛管分泌）可脱离中枢独立完成局部反射；胃肠激素如","f":"proc_digest.svg","lv":3,"ln":"L3 代谢、消化与排泄"},{"cid":"07_thermoreg","t":"体温调节","d":"产热与散热如天平两端，由下丘脑调定点 37℃ 统一协调；发热是调定点上移的主动过程，中暑是散热失败的被动升温。","f":"07_thermoreg.svg","lv":3,"ln":"L3 代谢、消化与排泄"},{"cid":"07_energy","t":"能量代谢测定","d":"间接测热法通过 O2 消耗与 CO2 产量算呼吸商，再查表求得产热量；三大营养素每升氧的产热不同。","f":"07_energy.svg","lv":3,"ln":"L3 代谢、消化与排泄"},{"cid":"proc_thermoreg","t":"体温调节：一块调定点，两条腿","d":"体温调节是负反馈：皮肤与内脏温度感受器把信息经脊髓丘脑束送到PO/AH，与调定点37℃比较；低于调定点则增加产热（寒战与非寒战产热）并减少散热（皮肤血管收缩、汗","f":"proc_thermoreg.svg","lv":3,"ln":"L3 代谢、消化与排泄"},{"cid":"proc_energy","t":"能量代谢测定：两个数，一张表","d":"能量代谢测定有直接与间接两法：直接测热法把人放进测热室测散热量，最准确但设备昂贵、受试者无法日常活动；实际都用间接测热法，测耗O₂与产CO₂算出呼吸商RQ。RQ","f":"proc_energy.svg","lv":3,"ln":"L3 代谢、消化与排泄"},{"cid":"08_filtration","t":"肾小球滤过","d":"入球端有效滤过压约 10 mmHg 驱动滤过；血浆胶体渗透压沿毛细血管升高，滤过压递减至零达到滤过平衡。","f":"08_filtration.svg","lv":3,"ln":"L3 代谢、消化与排泄"},{"cid":"08_loop","t":"髓袢逆流倍增","d":"降支只透水、升支只透盐，两个方向相反的流动使组织液渗透压从皮质 300 升至髓质 1200 mOsm/L，这是尿液浓缩的基础。","f":"08_loop.svg","lv":3,"ln":"L3 代谢、消化与排泄"},{"cid":"proc_filtration","t":"肾小球滤过：三层膜，一个净压力","d":"肾小球滤过靠两层机制：一是滤过膜的机械与电荷屏障，内皮窗孔挡血细胞、基膜挡带负电的大分子、足细胞裂孔膜做最后一道筛；二是有效滤过压，等于毛细血管压45减去胶体渗","f":"proc_filtration.svg","lv":3,"ln":"L3 代谢、消化与排泄"},{"cid":"proc_loop","t":"髓袢逆流倍增：300 变成 1200","d":"髓袢逆流倍增的前提是两支通透性相反：降支只透水，水被高渗间质吸出，管内液变浓；升支粗段主动泵出Na⁺-K⁺-2Cl⁻，只透盐不透水，使间质变浓而管内变稀。由于两","f":"proc_loop.svg","lv":3,"ln":"L3 代谢、消化与排泄"},{"cid":"proc_reabsorb","t":"肾小管重吸收：67% 打底，2% 定调","d":"肾小管各段重吸收比例不同：近端小管重吸收约67%的Na⁺与水，是主力但比例恒定（球管平衡）；髓袢重吸收约20%并建立髓质渗透梯度；远曲小管约8%，受醛固酮调节；","f":"proc_reabsorb.svg","lv":3,"ln":"L3 代谢、消化与排泄"},{"cid":"proc_uradilution","t":"尿的浓缩：梯度 + ADH 两个条件","d":"尿浓缩需要两个条件：一是髓袢逆流倍增建立的髓质渗透梯度（不可调），二是ADH使集合管主细胞的AQP2水通道插入管腔膜（可调）。血浆渗透压升高约2%或血容量下降时","f":"proc_uradilution.svg","lv":3,"ln":"L3 代谢、消化与排泄"},{"cid":"09_vision","t":"眼的折光与感光","d":"平行光经角膜与晶状体两次折射聚焦于视网膜；视杆管暗视、视锥管明视与辨色；近视眼轴过长、远视眼轴过短。","f":"09_vision.svg","lv":4,"ln":"L4 神经与感官"},{"cid":"09_cochlea","t":"耳蜗频率-位置编码","d":"基底膜从蜗底到蜗顶变宽变软，不同频率的行波在不同位置达到最大振幅：高频靠蜗底、低频靠蜗顶。","f":"09_cochlea.svg","lv":4,"ln":"L4 神经与感官"},{"cid":"proc_sensory","t":"感受器：把世界翻译成电","d":"感受器先把各种形式的能量换能成电信号：刺激改变膜通透性产生离子流，形成分级的感受器电位，幅度随刺激强度增大并可叠加。强度信息编码在传入纤维的放电频率里而不是幅度","f":"proc_sensory.svg","lv":4,"ln":"L4 神经与感官"},{"cid":"proc_vision","t":"视觉换能：光让细胞超极化","d":"视觉换能先经折光系统：角膜提供约三分之二折光力，晶状体通过变凸补足，看近物时发生调节反射。视网膜上的光化学变化由光子使视紫红质中的11-顺视黄醛异构为全反式开始","f":"proc_vision.svg","lv":4,"ln":"L4 神经与感官"},{"cid":"proc_cochlea","t":"耳蜗行波：位置就是频率","d":"声波经外耳道振动鼓膜，经听骨链放大后传到卵圆窗，在耳蜗淋巴中产生压力波推动基底膜形成行波。行波从蜗底向蜗顶传播，振幅先逐渐增大后在特定位置骤降——该位置即这种频","f":"proc_cochlea.svg","lv":4,"ln":"L4 神经与感官"},{"cid":"10_synapse","t":"化学突触传递","d":"动作电位到末梢引起钙内流，小泡释放递质，递质结合后膜受体使离子通道开放，产生 EPSP 并叠加至阈电位。传递是单向的。","f":"10_synapse.svg","lv":4,"ln":"L4 神经与感官"},{"cid":"10_stretch","t":"牵张反射","d":"肌肉被动拉长使肌梭伸长，Ⅰa 类纤维放电经脊髓单突触兴奋 α 运动神经元，引起同一肌肉收缩。膝跳反射即此环路。","f":"10_stretch.svg","lv":4,"ln":"L4 神经与感官"},{"cid":"proc_synapse","t":"突触传递：电 → 化学 → 电","d":"化学突触传递分六步：动作电位到达前末梢使其去极化，打开电压门控钙通道，Ca²⁺内流触发囊泡与前膜融合、递质量子式胞吐；递质扩散过20nm间隙结合后膜受体，配体门","f":"proc_synapse.svg","lv":4,"ln":"L4 神经与感官"},{"cid":"proc_stretch","t":"牵张反射：被拉长就自己收紧","d":"牵张反射是人体最短的反射弧：肌肉被拉长时，与肌纤维平行排列的肌梭同步被牵拉，Ⅰa类纤维放电增加，经后根进入脊髓直接与α运动神经元形成单突触联系；α神经元经前根传","f":"proc_stretch.svg","lv":4,"ln":"L4 神经与感官"},{"cid":"11_hpa","t":"下丘脑-垂体-靶腺轴","d":"三级激素逐级放大，靶腺激素经长负反馈抑制上游；长期外源激素会造成皮质萎缩。另两个轴结构同构。","f":"11_hpa.svg","lv":5,"ln":"L5 内分泌与生殖"},{"cid":"11_glucose","t":"血糖稳态","d":"胰岛素是唯一降糖激素，促摄取与合成；升糖激素有五种，以胰高血糖素与肾上腺素为主。两侧粒子表示激素流向血糖池。","f":"11_glucose.svg","lv":5,"ln":"L5 内分泌与生殖"},{"cid":"proc_hpa","t":"下丘脑-垂体-靶腺轴：三级 + 一个环","d":"下丘脑-垂体-靶腺轴分三级：下丘脑神经分泌细胞释放TRH、CRH、GnRH经垂体门脉到垂体前叶；垂体分泌TSH、ACTH、LH/FSH等促激素；促激素再刺激甲状","f":"proc_hpa.svg","lv":5,"ln":"L5 内分泌与生殖"},{"cid":"proc_glucose","t":"血糖稳态：五比一的不对称","d":"血糖稳态由两条对抗通路维持：来源有食物吸收、肝糖原分解与糖异生三条，去路有氧化供能、合成糖原、转化为脂肪与氨基酸三条。降糖只有胰岛素一个激素，由胰岛B细胞在血糖","f":"proc_glucose.svg","lv":5,"ln":"L5 内分泌与生殖"},{"cid":"12_menstrual","t":"月经周期四激素时序","d":"FSH 促卵泡发育，雌激素出现两个峰，LH 峰触发排卵；黄体期孕激素升高，撤退后月经来潮。","f":"12_menstrual.svg","lv":5,"ln":"L5 内分泌与生殖"},{"cid":"12_pregnancy","t":"妊娠的激素交接","d":"滋养细胞分泌 hCG 保住黄体维持孕激素；孕 8~10 周胎盘接手，hCG 回落而孕激素继续维持。","f":"12_pregnancy.svg","lv":5,"ln":"L5 内分泌与生殖"},{"cid":"proc_menstrual","t":"月经周期：两峰一谷，一次正反馈","d":"月经周期由四条激素共同驱动：卵泡期FSH促卵泡发育、颗粒细胞分泌雌激素使内膜增厚；雌激素升至阈值以上并维持两天后，反馈由负转正，触发LH骤升；LH峰后24~36","f":"proc_menstrual.svg","lv":5,"ln":"L5 内分泌与生殖"},{"cid":"proc_pregnancy","t":"妊娠激素交接：hCG 交棒给胎盘","d":"妊娠早期靠hCG维持：胚泡着床后滋养细胞分泌hCG，其结构与LH相似，结合同一受体使黄体不萎缩、继续分泌孕激素。hCG在孕8~10周达峰后迅速下降，此时胎盘已形","f":"proc_pregnancy.svg","lv":5,"ln":"L5 内分泌与生殖"},{"cid":"13_growth","t":"生长速度两个突增期","d":"生长速度不是匀速：婴儿期与青春期各有一次突增；前者以营养与甲状腺激素为主，后者靠 GH 与性激素协同。","f":"13_growth.svg","lv":6,"ln":"L6 整体与老化"},{"cid":"13_aging","t":"衰老：储备下降","d":"三个年龄段的最大能力与静息功能对比：静息功能下降有限，但储备逐年减少，因此应激时容易失代偿。","f":"13_aging.svg","lv":6,"ln":"L6 整体与老化"},{"cid":"proc_growth","t":"生长激素轴：GH 是总开关，IGF-1 是执行者","d":"下丘脑以GHRH促、生长抑素抑的方式调节垂体GH分泌，GH呈脉冲式释放、夜间深睡眠期最大，所以单次随机抽血测GH意义很小。GH有两条作用路径：直接促脂肪分解、抗","f":"proc_growth.svg","lv":6,"ln":"L6 整体与老化"},{"cid":"proc_aging","t":"衰老：储备先耗尽，静息看不出","d":"衰老的核心不是器官「坏了」，而是储备先耗尽。储备指器官最大能力与静息需求之间的余量：静息需求低，剩余的那部分足以维持日常，所以老年人静息化验可以基本正常，容易误","f":"proc_aging.svg","lv":6,"ln":"L6 整体与老化"}];
(function(){
  const krow=document.getElementById('krow'), stages=document.getElementById('stages');
  let cur=null;
  DATA.forEach(function(d,i){
    const b=document.createElement('button');
    b.className='hbtn'+(i===0?' on':'');
    b.dataset.cid=d.cid;
    const nm=document.createElement('span');
    nm.textContent=d.t.split('：')[0];
    b.appendChild(nm);
    if(d.ln){
      const t=document.createElement('i');
      t.textContent=d.ln.split(' ')[0];
      t.title=d.ln;
      b.appendChild(t);
    }
    b.onclick=function(){ show(d.cid); };
    krow.appendChild(b);

    const st=document.createElement('div');
    st.className='stage'; st.id='st-'+d.cid;
    st.dataset.src=d.f;
    stages.appendChild(st);
  });
  const cache={};
  function show(cid){
    document.querySelectorAll('#krow .hbtn').forEach(function(x){
      var on=(x.dataset.cid===cid);
      x.classList.toggle('on', on);
      if(on && x.scrollIntoView)
        x.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
    });
    const rec0=DATA.find(function(y){return y.cid===cid;});
    const klab=document.getElementById('klab');
    if(klab) klab.innerHTML='知识点'+(rec0&&rec0.ln
      ? '<b style="color:#0f766e;font-weight:700;margin-left:6px">'+rec0.ln+'</b>' : '');
    document.querySelectorAll('.stage').forEach(x=>
      x.classList.toggle('on', x.id==='st-'+cid));
    const on=document.getElementById('st-'+cid);
    if(on) on.scrollIntoView({behavior:'smooth',block:'nearest'});
    history.replaceState(null,'','#c-'+cid);
    if(!on) return;
    if(on.dataset.ctl){ if(window.initSmilCtl) window.initSmilCtl(); return; }
    const rec=DATA.find(x=>x.cid===cid);
    if(!rec) return;
    on.innerHTML='<div class="desc" style="padding:24px 0">载入中…</div>';
    fetch('figs/'+rec.f).then(r=>r.text()).then(txt=>{
      on.innerHTML=txt+'<div class="desc">'+rec.d+'</div>';
      if(window.initSmilCtl) window.initSmilCtl();
    }).catch(()=>{
      on.innerHTML='<div class="desc">载入失败，请刷新重试</div>';
    });
  }
  // 初始：hash 指定 or 第一个
  const h=(location.hash||'').replace('#c-','');
  const target=DATA.find(x=>x.cid===h)||DATA[0];
  if(target) show(target.cid);
  window.addEventListener('hashchange',function(){
    const hh=(location.hash||'').replace('#c-','');
    if(hh) show(hh);
  });
  // 导出给连播脚本
  window.__playerShow = show;
})();
</script><script>// 连播控制：本层顺序连播 / 全学科跨层连播，带实时进度条
// 由 build3layer.py 在构建时读入并内联到 player.html（避免 f-string 大括号冲突）
(function () {
  var pbPlay = document.getElementById('pbPlay');
  var pbAll = document.getElementById('pbAll');
  var pbStop = document.getElementById('pbStop');
  var pbStat = document.getElementById('pbStat');
  var pbWrap = document.getElementById('pbBarWrap');
  var pbBar = document.getElementById('pbBar');
  if (!pbPlay || !window.__PLAYER_DATA) return;

  var DATA = window.__PLAYER_DATA;
  var queue = [], qi = 0, timer = null, playing = false, ticker = null;
  var expectCid = null;      // 连播自己切的目标，用于区分「手动切」
  var curDurMs = 0, t0 = 0;  // 当前张的预计时长与起始时刻
  var scopeName = '';        // 「本层」/「全部」用于提示文案

  function recOf(cid) {
    return DATA.find(function (x) { return x.cid === cid; });
  }
  function layerOf(cid) { var r = recOf(cid); return r ? r.lv : -1; }
  function titleOf(cid) { var r = recOf(cid); return r ? r.t : ''; }
  function layerNameOf(cid) {
    var r = recOf(cid);
    return r && r.ln ? r.ln.split(' ')[0] : '';
  }
  function setStat(t) { if (pbStat) pbStat.textContent = t; }

  function setBar(frac) {
    if (!pbBar) return;
    var p = Math.max(0, Math.min(1, frac)) * 100;
    pbBar.style.width = p.toFixed(1) + '%';
  }
  function showBar(on) {
    if (!pbWrap) return;
    pbWrap.classList.toggle('on', !!on);
    if (!on) setBar(0);
  }

  function stopPlay(msg) {
    playing = false; queue = []; qi = 0;
    if (timer) { clearTimeout(timer); timer = null; }
    if (ticker) { clearInterval(ticker); ticker = null; }
    showBar(false);
    if (pbPlay) {
      pbPlay.classList.remove('on');
      pbPlay.textContent = '\u25b6 \u8fde\u64ad\u672c\u5c42';
    }
    if (pbAll) {
      pbAll.classList.remove('on');
      pbAll.textContent = '\u25b6\u25b6 \u8fde\u64ad\u5168\u90e8';
    }
    if (pbStop) pbStop.disabled = true;
    if (msg) setStat(msg);
  }

  // 等 SVG 就绪 → 拿到这张的真实动画时长 → 起进度条 → 播完进下一张
  function waitThenNext() {
    if (!playing) return;
    var tries = 0;
    (function poll() {
      if (!playing) return;
      var st = document.querySelector('.stage.on');
      var svg = st && st.querySelector('svg');
      // SVG 还没 fetch 回来 → 每 300ms 再看，最多等 6 秒
      if (!svg) {
        if (++tries > 20) { nextInQueue(); return; }
        timer = setTimeout(poll, 300);
        return;
      }
      // 静态图（无播放控件）：1.2 秒后跳下一张
      if (!st.querySelector('.smctl')) {
        curDurMs = 1200;
        startTicker();
        return;
      }
      var dur = 0;
      svg.querySelectorAll('animate[dur]').forEach(function (a) {
        var v = parseFloat(a.getAttribute('dur')) || 0;
        if (v > dur) dur = v;
      });
      curDurMs = (dur || 10) * 1000;
      // 超过 15 秒的也只等 15 秒（个别长循环不必看全）
      curDurMs = Math.min(curDurMs, 15000) + 600;
      startTicker();
    })();
  }

  // 进度条：按 (已播张数 + 当前张进度) / 总张数 映射到 0~100%
  function startTicker() {
    if (ticker) clearInterval(ticker);
    t0 = Date.now();
    setBar((qi + 0) / queue.length);
    ticker = setInterval(function () {
      if (!playing) { clearInterval(ticker); ticker = null; return; }
      var f = Math.min(1, (Date.now() - t0) / (curDurMs || 1));
      setBar((qi + f) / queue.length);
      if (f >= 1) {
        clearInterval(ticker); ticker = null;
        nextInQueue();
      }
    }, 100);
  }

  function nextInQueue() {
    if (!playing) return;
    if (ticker) { clearInterval(ticker); ticker = null; }
    qi++;
    if (qi >= queue.length) {
      setBar(1);
      var n = queue.length;
      setTimeout(function () {
        stopPlay(scopeName + '\u5df2\u64ad\u5b8c\uff08\u5171 ' + n + ' \u5f20\uff09');
      }, 420);
      return;
    }
    var cid = queue[qi];
    expectCid = cid;
    if (window.__playerShow) window.__playerShow(cid);
    setStat('\u8fde\u64ad\u4e2d ' + (qi + 1) + '/' + queue.length +
            '\uff1a' + titleOf(cid));
    waitThenNext();
  }

  // 组织队列：范围 = 本层 / 全部；起点 = 当前图
  function startPlay(scope) {
    var cur = (location.hash || '').replace('#c-', '') ||
              (DATA[0] && DATA[0].cid);
    var lv = layerOf(cur);
    if (scope === 'layer') {
      queue = DATA.filter(function (x) { return x.lv === lv; })
                  .map(function (x) { return x.cid; });
      scopeName = '\u672c\u5c42';
    } else {
      queue = DATA.map(function (x) { return x.cid; });
      scopeName = '\u5168\u90e8';
    }
    if (!queue.length) queue = DATA.map(function (x) { return x.cid; });
    // 以当前图为起点重排（当前图算第 1 张）
    var startIdx = queue.indexOf(cur);
    if (startIdx > 0) queue = queue.slice(startIdx).concat(queue.slice(0, startIdx));
    qi = 0;
    playing = true;
    pbPlay.classList.toggle('on', scope === 'layer');
    pbAll.classList.toggle('on', scope !== 'layer');
    pbPlay.textContent = scope === 'layer' ? '\u23f9 \u8fde\u64ad\u4e2d'
                                           : '\u25b6 \u8fde\u64ad\u672c\u5c42';
    pbAll.textContent = scope !== 'layer' ? '\u23f9 \u8fde\u64ad\u4e2d'
                                          : '\u25b6\u25b6 \u8fde\u64ad\u5168\u90e8';
    if (pbStop) pbStop.disabled = false;
    showBar(true);
    expectCid = queue[qi];
    var ln = layerNameOf(queue[qi]);
    setStat('\u8fde\u64ad' + scopeName + ' ' + (qi + 1) + '/' + queue.length +
            (ln ? '\uff1a' + ln : '\uff1a') + ' \u00b7 ' + titleOf(queue[qi]));
    startWatch();
    waitThenNext();
  }

  pbPlay.onclick = function () {
    if (playing) { stopPlay('\u5df2\u505c\u6b62'); return; }
    startPlay('layer');
  };
  if (pbAll) {
    pbAll.onclick = function () {
      if (playing) { stopPlay('\u5df2\u505c\u6b62'); return; }
      startPlay('all');
    };
  }
  if (pbStop) pbStop.onclick = function () { stopPlay('\u5df2\u505c\u6b62'); };

  // 手动切图 → 终止连播（show 用 replaceState 不触发 hashchange，故用轮询比对）
  var watch = null;
  function startWatch() {
    if (watch) clearInterval(watch);
    watch = setInterval(function () {
      if (!playing) { clearInterval(watch); watch = null; return; }
      var cur = (location.hash || '').replace('#c-', '');
      if (expectCid && cur && cur !== expectCid) {
        stopPlay('\u5df2\u5207\u6362\uff0c\u8fde\u64ad\u7ed3\u675f');
      }
    }, 400);
  }
  window.addEventListener('hashchange', function () {
    if (playing) stopPlay('\u5df2\u5207\u6362\uff0c\u8fde\u64ad\u7ed3\u675f');
  });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden && playing) stopPlay('\u9875\u9762\u5df2\u5207\u51fa\uff0c\u8fde\u64ad\u6682\u505c');
  });
})();
</script></body></html>
