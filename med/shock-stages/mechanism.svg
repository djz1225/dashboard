<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" role="img" aria-label="外科休克的分期演进：代偿期、失代偿期与不可逆期"><rect width="1000" height="760" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F6C75"/></marker></defs><text x="48.0" y="42.0" text-anchor="start" font-size="11.5" fill="#4E5B64" font-weight="700">动态版 · 外科总论</text><text x="48.0" y="76.0" text-anchor="start" font-size="22" fill="#1B2A33" font-weight="700">外科休克 · 分期演进</text><text x="48.0" y="106.0" text-anchor="start" font-size="13.5" fill="#37474F" font-weight="400">同一病理过程的三段：代偿能撑住 → 代偿失效 → 微循环衰竭不可逆</text><rect x="48.0" y="132.0" width="286.7" height="372.0" rx="12" fill="#FFFFFF" stroke="#1C6B45" stroke-width="1.8"/><rect x="48.0" y="132.0" width="286.7" height="62.0" rx="12" fill="#1C6B45"/><text x="68.0" y="160.0" text-anchor="start" font-size="16" fill="#FFFFFF" font-weight="700">代偿期</text><text x="68.0" y="182.0" text-anchor="start" font-size="11.5" fill="#FFFFFF" font-weight="400">微循环缺血期</text><circle cx="72.0" cy="212" r="3.4" fill="#1C6B45"/><text x="84.0" y="216.0" text-anchor="start" font-size="11.5" fill="#37474F" font-weight="400">交感-肾上腺髓质兴奋</text><circle cx="72.0" cy="248" r="3.4" fill="#1C6B45"/><text x="84.0" y="252.0" text-anchor="start" font-size="11.5" fill="#37474F" font-weight="400">心率↑ 外周血管收缩</text><circle cx="72.0" cy="284" r="3.4" fill="#1C6B45"/><text x="84.0" y="288.0" text-anchor="start" font-size="11.5" fill="#37474F" font-weight="400">血压可正常或略降</text><circle cx="72.0" cy="320" r="3.4" fill="#1C6B45"/><text x="84.0" y="324.0" text-anchor="start" font-size="11.5" fill="#37474F" font-weight="400">意识清楚、皮肤苍白湿冷</text><circle cx="72.0" cy="356" r="3.4" fill="#1C6B45"/><text x="84.0" y="360.0" text-anchor="start" font-size="11.5" fill="#37474F" font-weight="400">尿量开始减少</text><rect x="60.0" y="422.0" width="262.7" height="68.0" rx="8" fill="#FDF8EE" stroke="#1C6B45" stroke-width="1.2"/><text x="72.0" y="448.0" text-anchor="start" font-size="11.5" fill="#1C6B45" font-weight="600">关键：血压正常≠没有休克，</text><text x="72.0" y="467.0" text-anchor="start" font-size="11.5" fill="#1C6B45" font-weight="600">此期最易漏诊</text><line x1="338.7" y1="310.0" x2="354.7" y2="310.0" stroke="#1C6B45" stroke-width="2.6" stroke-linecap="round" marker-end="url(#ah)"/><rect x="356.7" y="132.0" width="286.7" height="372.0" rx="12" fill="#FFFFFF" stroke="#8A5A12" stroke-width="1.8"/><rect x="356.7" y="132.0" width="286.7" height="62.0" rx="12" fill="#8A5A12"/><text x="376.7" y="160.0" text-anchor="start" font-size="16" fill="#FFFFFF" font-weight="700">失代偿期</text><text x="376.7" y="182.0" text-anchor="start" font-size="11.5" fill="#FFFFFF" font-weight="400">微循环淤血期</text><circle cx="380.6666666666667" cy="212" r="3.4" fill="#8A5A12"/><text x="392.7" y="216.0" text-anchor="start" font-size="11.5" fill="#37474F" font-weight="400">乳酸堆积、酸中毒</text><circle cx="380.6666666666667" cy="248" r="3.4" fill="#8A5A12"/><text x="392.7" y="252.0" text-anchor="start" font-size="11.5" fill="#37474F" font-weight="400">毛细血管前括约肌松弛</text><circle cx="380.6666666666667" cy="284" r="3.4" fill="#8A5A12"/><text x="392.7" y="288.0" text-anchor="start" font-size="11.5" fill="#37474F" font-weight="400">血液淤滞、有效循环量↓</text><circle cx="380.6666666666667" cy="320" r="3.4" fill="#8A5A12"/><text x="392.7" y="324.0" text-anchor="start" font-size="11.5" fill="#37474F" font-weight="400">血压下降、脉压变窄</text><circle cx="380.6666666666667" cy="356" r="3.4" fill="#8A5A12"/><text x="392.7" y="360.0" text-anchor="start" font-size="11.5" fill="#37474F" font-weight="400">意识淡漠、少尿无尿</text><rect x="368.7" y="422.0" width="262.7" height="68.0" rx="8" fill="#FDF8EE" stroke="#8A5A12" stroke-width="1.2"/><text x="380.7" y="448.0" text-anchor="start" font-size="11.5" fill="#8A5A12" font-weight="600">关键：出现酸中毒与血压下降，</text><text x="380.7" y="467.0" text-anchor="start" font-size="11.5" fill="#8A5A12" font-weight="600">需立即液体复苏</text><line x1="647.3" y1="310.0" x2="663.3" y2="310.0" stroke="#8A5A12" stroke-width="2.6" stroke-linecap="round" marker-end="url(#ah)"/><rect x="665.3" y="132.0" width="286.7" height="372.0" rx="12" fill="#FFFFFF" stroke="#A3382C" stroke-width="1.8"/><rect x="665.3" y="132.0" width="286.7" height="62.0" rx="12" fill="#A3382C"/><text x="685.3" y="160.0" text-anchor="start" font-size="16" fill="#FFFFFF" font-weight="700">不可逆期</text><text x="685.3" y="182.0" text-anchor="start" font-size="11.5" fill="#FFFFFF" font-weight="400">微循环衰竭/DIC期</text><circle cx="689.3333333333334" cy="212" r="3.4" fill="#A3382C"/><text x="701.3" y="216.0" text-anchor="start" font-size="11.5" fill="#37474F" font-weight="400">微血栓形成（可并发 D</text><text x="701.3" y="233.0" text-anchor="start" font-size="11.5" fill="#37474F" font-weight="400">IC）</text><circle cx="689.3333333333334" cy="265" r="3.4" fill="#A3382C"/><text x="701.3" y="269.0" text-anchor="start" font-size="11.5" fill="#37474F" font-weight="400">细胞膜与溶酶体破坏</text><circle cx="689.3333333333334" cy="301" r="3.4" fill="#A3382C"/><text x="701.3" y="305.0" text-anchor="start" font-size="11.5" fill="#37474F" font-weight="400">多器官功能障碍（MOD</text><text x="701.3" y="322.0" text-anchor="start" font-size="11.5" fill="#37474F" font-weight="400">S）</text><circle cx="689.3333333333334" cy="354" r="3.4" fill="#A3382C"/><text x="701.3" y="358.0" text-anchor="start" font-size="11.5" fill="#37474F" font-weight="400">顽固性低血压</text><circle cx="689.3333333333334" cy="390" r="3.4" fill="#A3382C"/><text x="701.3" y="394.0" text-anchor="start" font-size="11.5" fill="#37474F" font-weight="400">无尿、昏迷</text><rect x="677.3" y="422.0" width="262.7" height="68.0" rx="8" fill="#FDF3F2" stroke="#A3382C" stroke-width="1.2"/><text x="689.3" y="448.0" text-anchor="start" font-size="11.5" fill="#A3382C" font-weight="600">关键：此期治疗反应差，重点在预防</text><text x="689.3" y="467.0" text-anchor="start" font-size="11.5" fill="#A3382C" font-weight="600">前两期进展</text><text x="48.0" y="536.0" text-anchor="start" font-size="12.5" fill="#4E5B64" font-weight="700">演进方向（不可逆）</text><line x1="48" y1="558" x2="952" y2="558" stroke="#C7D2DC" stroke-width="6" stroke-linecap="round"/><circle cx="198.66666666666666" cy="558" r="9" fill="#1C6B45" stroke="#FFFFFF" stroke-width="2.4"/><text x="198.7" y="584.0" text-anchor="middle" font-size="11.5" fill="#1C6B45" font-weight="700">代偿期</text><circle cx="500.0" cy="558" r="9" fill="#8A5A12" stroke="#FFFFFF" stroke-width="2.4"/><text x="500.0" y="584.0" text-anchor="middle" font-size="11.5" fill="#8A5A12" font-weight="700">失代偿期</text><circle cx="801.3333333333334" cy="558" r="9" fill="#A3382C" stroke="#FFFFFF" stroke-width="2.4"/><text x="801.3" y="584.0" text-anchor="middle" font-size="11.5" fill="#A3382C" font-weight="700">不可逆期</text><text x="500.0" y="740.0" text-anchor="middle" font-size="11.5" fill="#4E5B64" font-weight="400">休克本质是有效组织灌注不足；血压是晚期指标，早期看意识、皮肤、尿量、乳酸。</text></svg>