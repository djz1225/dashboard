*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#eef2f7;color:#16202e;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}

.desc{font-size:12px;color:#8095a8;text-align:center;margin:7px 4px 8px;

.pstat{flex:1 1 auto;text-align:right;font-size:11.5px;color:#8ea0b2}
@keyframes ppulse{0%,100%{opacity:1}50%{opacity:.55}}
.pbtn.on .dot{display:inline-block;width:6px;height:6px;border-radius:50%;

.foot{text-align:center;font-size:11px;color:#b6c4d2;margin:22px 0 0;

.pghbtn{display:none!important}

(function(g){
  var SPEEDS=[0.5,1,1.5];
  function makeBar(svg){
    var wrap=document.createElement('div'); wrap.className='smctl';
    function btn(t,ti){var b=document.createElement('button');b.type='button';
      b.className='smbtn';b.textContent=t;if(ti)b.title=ti;return b;}
    var bPrev=btn('\u2039','上一相位'), bPlay=btn('\u23f8','暂停 / 继续'),
        bNext=btn('\u203a','下一相位'), bSpeed=btn('1\u00d7','切换速度'),
        bReset=btn('\u21ba','回到开头');
    var lab=document.createElement('span'); lab.className='smlab';

    var dur=0;
    svg.querySelectorAll('animate[dur]').forEach(function(a){
      var v=parseFloat(a.getAttribute('dur'))||0; if(v>dur) dur=v; });
    dur=dur||10;

    var marks=[];
    svg.querySelectorAll('animate[dur]').forEach(function(a){
      var v=parseFloat(a.getAttribute('dur'))||0;
      if(Math.abs(v-dur)>0.01) return;
      var kt=(a.getAttribute('keyTimes')||'').trim(); if(!kt) return;
      kt.split(';').forEach(function(x){var q=parseFloat(x);
        if(!isNaN(q)&&q>0.03&&q<0.97) marks.push(q); }); });
    marks.sort(function(a,b){return a-b});
    var groups=[];
    marks.forEach(function(m){
      if(groups.length && m-groups[groups.length-1].last<0.05){
        var q=groups[groups.length-1]; q.sum+=m; q.n+=1; q.last=m;
      } else groups.push({sum:m,n:1,last:m});
    });
    var uniq=[0];
    groups.forEach(function(q){var v=q.sum/q.n;
      if(v-uniq[uniq.length-1]>0.04) uniq.push(v);});
    if(uniq.length<2) uniq=[0,0.5,1];
    if(uniq[uniq.length-1]<0.96) uniq.push(1);
    uniq=uniq.map(function(v){return Math.round(v*1000)/1000});
    var nStep=Math.max(uniq.length-1,1);

    var t=0, playing=true, speed=1, last=0, raf=null;
    function manual(){try{if(!svg.animationsPaused())svg.pauseAnimations();}catch(e){}}
    function apply(){manual();try{svg.setCurrentTime(t%dur);}catch(e){}}
    function paint(){
      bPlay.textContent=playing?'\u23f8':'\u25b6';
      bPlay.classList.toggle('on',playing);
      bSpeed.textContent=speed+'\u00d7';
      var now=t/dur,k=0;
      for(var i=0;i<uniq.length-1;i++) if(now>=uniq[i]-1e-6) k=i;
      lab.textContent='\u7b2c '+(k+1)+' / '+nStep+' \u6b65';
    }
    function loop(now){
      if(!playing) return;
      if(!last) last=now;
      var dt=(now-last)/1000; last=now;
      t+=dt*speed; if(t>=dur) t-=dur;
      apply(); paint(); raf=requestAnimationFrame(loop);
    }
    function play(){playing=true;last=0;raf=requestAnimationFrame(loop);paint();}
    function pause(){playing=false;if(raf)cancelAnimationFrame(raf);raf=null;apply();paint();}
    bPlay.onclick=function(){playing?pause():play();};
    bSpeed.onclick=function(){var i=SPEEDS.indexOf(speed);
      speed=SPEEDS[(i+1)%SPEEDS.length]; last=0; paint();};
    function step(d){
      pause();
      var best=0,bd=1e9;
      for(var i=0;i<uniq.length;i++){var q=Math.abs(t/dur-uniq[i]);
        if(q<bd){bd=q;best=i;}}
      var ni=Math.max(0,Math.min(best+d,uniq.length-1));
      t=Math.min(uniq[ni]*dur+0.012,dur-0.002);
      apply(); paint();
    }
    bPrev.onclick=function(){step(-1);};
    bNext.onclick=function(){step(1);};
    bReset.onclick=function(){pause();t=0;apply();paint();};

    [bPrev,bPlay,bNext,bSpeed,bReset].forEach(function(b){wrap.appendChild(b);});
    wrap.appendChild(lab);

    manual(); apply(); paint();

      var io=new IntersectionObserver(function(es){
        es.forEach(function(e){ if(e.isIntersecting) play(); else pause(); });
      },{rootMargin:'120px'});
      io.observe(svg.closest('.stage')||svg);
    } else play();
    return wrap;
  }
  g.initSmilCtl=function(root){
    (root||document).querySelectorAll('.stage').forEach(function(st){
      if(st.dataset.ctl) return;
      var svg=st.querySelector('svg'); if(!svg||!svg.pauseAnimations) return;
      // 只有「有真实循环动画」的图才加控件：
      //   至少 2 个 animate，且最大 dur > 1s（排除只有一个标题淡入的静态图）
      var durs=[], mx=0;
      svg.querySelectorAll('animate[dur]').forEach(function(a){
        var v=parseFloat(a.getAttribute('dur'))||0; durs.push(v); if(v>mx) mx=v;});
      if(durs.length<2 || mx<=1) { st.dataset.ctl='1'; st.classList.add('static'); return; }
      st.dataset.ctl='1';
      st.appendChild(makeBar(svg));
    });
  };
  if(document.readyState==='loading')
    document.addEventListener('DOMContentLoaded',function(){g.initSmilCtl()});
  else g.initSmilCtl();

病理技术与实务17病理学病理"},{"c":"proc_qc_eqa","t":"质控与室间质评","d":"内部对照、外部盲评、Kappa 一致性","s":"patho","sn":"病理学","l":"L15 病理技术与实务","k":"质控与室间质评内部对照、外部盲评、Kappa一致性L15病理技术与实务17病理学病理"},{"c":"proc_mtb","t":"分子肿瘤委员会","d":"筛选→汇总→证据分级→多学科→推荐→再检","s":"patho","sn":"病理学","l":"L15 病理技术与实务","k":"分子肿瘤委员会筛选→汇总→证据分级→多学科→推荐→再检L15病理技术与实务19病理学病理免疫"},{"c":"proc_postmortem","t":"法医死亡时间推断","d":"尸冷/尸斑/尸僵/角膜/胃内容交叉印证","s":"patho","sn":"病理学","l":"L16 法医病理","k":"法医死亡时间推断尸冷/尸斑/尸僵/角膜/胃内容交叉印证L16法医病理20病理学病理"},{"c":"proc_injury_forensic","t":"损伤与死亡方式","d":"组织间桥辨钝锐；缢斜勒平；死亡方式四类","s":"patho","sn":"病理学","l":"L16 法医病理","k":"损伤与死亡方式组织间桥辨钝锐；缢斜勒平；死亡方式四类L16法医病理20病理学病理"}];</script><script>
(function(){
  var DATA = window.__IDX || [];
  var box = document.getElementById('sinput');
  var res = document.getElementById('sres');
  var stat = document.getElementById('sstat');
  var chips = Array.prototype.slice.call(document.querySelectorAll('.chip'));
  var sub = '';   // 学科过滤

  var SUBNAME = {'physio':'生理学','biochem':'生物化学','patho':'病理学'};
  var CLS = {'physio':'p','biochem':'b','patho':'k'};

  function esc(s){ return (s||'').replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  function words(q){
    return q.trim().toLowerCase().split(/\s+/).filter(function(x){return x;});
  }

  // 返回 {hit: 命中词数, sc: 分数}；命中 0 个词才剔除。
  // 全命中记为 tier 2，部分命中 tier 1 —— 排序时全命中永远在前。
  function score(it, ws){
    var t = it.t.toLowerCase(), d = (it.d||'').toLowerCase();
    var k = (it.k||'').toLowerCase(), s = 0, hit = 0;
    for (var i=0;i<ws.length;i++){
      var w = ws[i];
      var inT = t.indexOf(w) >= 0, inD = d.indexOf(w) >= 0;
      var inK = k.indexOf(w) >= 0;
      if (!inT && !inD && !inK) continue;
      hit++;
      if (inT) s += (t.indexOf(w) === 0 ? 60 : 40);
      if (inD) s += 18;
      if (inK) s += 6;
    }
    if (!hit) return {hit: 0, sc: -1};
    var tier = (hit === ws.length) ? 2 : 1;
    return {hit: hit, sc: tier * 1000 + s};
  }

  function hl(text, ws){
    var out = esc(text);
    for (var i=0;i<ws.length;i++){
      var w = ws[i]; if (!w) continue;
      var re = new RegExp('(' + w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
      out = out.replace(re, '<mark>$1</mark>');
    }
    return out;
  }

  function render(){
    var q = box.value;
    var ws = words(q);
    var pool = DATA.filter(function(it){ return !sub || it.s === sub; });

    var hit;
    if (!ws.length){
      // 空搜索：不用全景列表，提示用法
      res.innerHTML = '<div class="sempty">共 ' + DATA.length
        + ' 张图可检索。试试这些常用词：</div>'
        + '<div class="shint" id="hot">'
        + ['梗死','血栓','炎症','肿瘤','转移','反馈','凝血','肾小球',
           '重吸收','心','肺','肝','甲状腺','免疫','损伤','细胞']
            .map(function(w){ return '<span class="chip hot" data-w="' + w + '">'
                 + w + '</span>'; }).join('')
        + '</div>';
      stat.textContent = '输入关键词，或点上方学科筛选';
      Array.prototype.forEach.call(res.querySelectorAll('.chip.hot'),
        function(c){ c.addEventListener('click', function(){
          box.value = c.dataset.w; render(); }); });
      return;
    }
    hit = pool.map(function(it){ var r = score(it, ws);
                    return {it: it, sc: r.sc, hit: r.hit}; })
               .filter(function(x){ return x.sc >= 0; })
               .sort(function(a,b){ return b.sc - a.sc; });

    var full = hit.filter(function(x){ return x.hit === ws.length; }).length;
    var part = hit.length - full;
    stat.textContent = '找到 ' + hit.length + ' 张（'
      + (sub ? SUBNAME[sub] : '全部学科') + '）'
      + (part > 0 ? '｜其中 ' + full + ' 张全部命中，' + part + ' 张部分命中（排在后面）'
                  : '');

    if (!hit.length){
      res.innerHTML = '<div class="sempty">没有匹配的结果。<br>'
        + '试试更短的词，例如「梗死」「反馈」「凝血」；'
        + '或用两个词缩小范围，如「肾 重吸收」。</div>';
      return;
    }

    var html = '';
    hit.slice(0, 80).forEach(function(x){
      var it = x.it;
      html += '<a class="sr" href="' + it.s + '/player.html#c-' + it.c + '">'
        + '<div class="srh">'
        + '<span class="srt">' + hl(it.t, ws) + '</span>'
        + '<span class="sbadge ' + (CLS[it.s]||'') + '">' + esc(it.sn) + '</span>'
        + '</div>'
        + (it.d ? '<div class="srd">' + hl(it.d, ws) + '</div>' : '')
        + (it.l ? '<div class="srl">' + esc(it.l) + '</div>' : '')
        + '</a>';
    });
    if (hit.length > 80){
      html += '<div class="sstat">仅显示前 80 条，请再加一个关键词缩小范围</div>';
    }
    res.innerHTML = html;
  }

  chips.forEach(function(ch){
    ch.addEventListener('click', function(){
      var v = ch.dataset.sub || '';
      if (sub === v){ sub = ''; } else { sub = v; }
      chips.forEach(function(c){
        c.classList.toggle('on', (c.dataset.sub||'') === sub);
      });
      render();
    });
  });

  box.addEventListener('input', render);
  box.addEventListener('search', render);
  render();

  // 支持 URL 带 ?q=xxx 直接检索
  try {
    var u = new URLSearchParams(location.search);
    var q0 = u.get('q');
    if (q0){ box.value = q0; render(); }
  } catch(e){}
})();
</script></body></html>
