童诊断用检查提纲","Sehaffer 儿童用大体评定量表","Conners 儿童行为量表","Angold 儿童少年精神科评定量表"],"D",1,"lc","临床综合","评估注意缺陷多动障碍最常用的是Conners儿童行为量表（父母版、教师版），对多动、注意力不集中因子敏感，可用于筛查与疗效随访，故选D。Achenbach儿童行为量表为广谱行为筛查工具；SCAN、CIDI属结构式诊断访谈；大体评定量表评价总体功能水平；Angold量表并非ADHD专用，均非最常用。\n\n📚 出处：《精神病学》第8版·儿童少年期精神障碍（ADHD）"],["眼底荧光血管造影表现为背景荧光湮没，见于哪种疾病",["中心性浆液性视网膜脱离","原田病","Stargardt病","干性老年黄斑变性","视网膜色素变性"],"D",1,"lc","眼耳鼻喉口腔","眼底荧光血管造影的正常背景荧光由脉络膜毛细血管充盈构成。干性（萎缩型）老年性黄斑变性时黄斑区视网膜色素上皮与脉络膜毛细血管大片萎缩缺失，该处脉络膜荧光无从透见，原正常背景荧光被湮没（减弱或消失），故D正确。A中心性浆液性视网膜脱离为渗漏点强荧光；B原田病为多发性点状渗漏；C Stargardt病为黄斑透见荧光与牛眼状斑点；E视网膜色素变性以骨细胞样色素遮蔽荧光为主。\n\n📚 出处：《眼科学》第9版·眼底病·年龄相关性黄斑变性"],["女性，30 岁，右侧肢体乏力伴头痛和语言笨拙 6 个月。住院检查：眼底视乳头水肿，右上、下肢肌力 4 级，左下肢病理征(+)。CT 检查可见颅内一低密度病灶，周围无水肿，增强后不均匀强化。患者术后复查 CT，肿瘤缩小 65%。疗效评价为",["显效","有效","微效","无变化","以上都不是"],"B",1,"lc","神经与精神","神经系统肿瘤疗效评价以肿瘤体积变化为主：完全缓解为肿瘤完全消失；部分缓解（PR）为肿瘤最大垂直两径乘积或体积缩小≥50% 并维持 4 周以上；疾病稳定为缩小＜50% 或增大＜25%；疾病进展为增大≥25% 或出现新病灶。本例术后复查 CT 示肿瘤缩小 65%，达到 PR 标准，故评价为“有效”。“显效”多指缩小≥75% 或症状显著改善，微效为 25%～50%，无变化为未达上述标准。\n\n📚 出处：《外科学》第9版·颅内肿瘤·疗效评价"],["下列有关软组织中的声衰减量的描述，正确的是",["随软组织厚度而增加","由 TCG 曲线的范围决定","随着波长减小而增大","使用数字转换扫描器时无关紧要","与频率无关"],"A",1,"lc","眼耳鼻喉口腔","声衰减指声波在组织中传播时振幅随距离递减，衰减量等于衰减系数与传播距离（软组织厚度或深度）之乘积，故随软组织厚度增加而增大，A正确。B错：TCG（时间增益补偿）是为补偿深部衰减而设的接收电路增益，不决定衰减量；C表述的因果不当，衰减根本由频率与组织性质决定；D与是否数字化扫描无关；E“与频率无关”明显错误，频率越高衰减越大。\n\n📚 出处：《医学影像学》第8版·超声诊断·超声物理基础"],["肾脓肿的 CT 表现为",["圆形或卵圆形境界清楚的病灶，并见环状强化","肾周脂肪密度增高，筋膜增厚","增强扫描，肾实质内多个外形不规则境界不清楚的低密度区","肾盂可形成瘢痕，引起肾盂、肾盏变形","炎症广泛，向外扩散在肾周脂肪，腰大肌甚至扩散及肠袢，并可见肾盂结石"],"A",1,"lc","泌尿系统","肾脓肿为局限的化脓性坏死灶，CT呈圆形或卵圆形、边界较清楚的囊性低密度灶，增强扫描周边呈环状强化（脓肿壁），中央无强化。B为肾周炎表现，C为急性肾盂肾炎的多发不规则低密度区，D为慢性肾盂肾炎的肾盂肾盏变形，E为炎症广泛扩散伴结石。故答A。\n\n📚 出处：《医学影像学》第8版·泌尿系统（肾感染性病变）"],["骨折 X 线检查的重要意义是",["了解骨折的发生机制","明确骨折的诊断","判断骨折的预后","了解组织的损伤情况","了解骨质密度"],"B",1,"lc","运动与骨外科","X线检查是骨折诊断最基本、最重要的手段，可明确有无骨折、骨折部位、类型、移位方向与程度，并指导复位与固定，故其首要意义是明确诊断；同时可了解软组织与关节情况、判断治疗效果及愈合过程。它不能直接反映骨折发生机制、组织损伤细节与骨质密度（需CT、MRI、骨密度测定）。\n\n📚 出处：《外科学》第9版·骨折概论·骨折的影像学检查"],["危重新生儿的监护对象包括以下哪项",["HIE 患儿","需要呼吸支持的患儿","心肺疾病或呼吸不规则患儿","外科手术后患儿","接受部分胃肠外营养患儿"],"B",1,"lc","儿科","注意：本题题干为\"危重新生儿的监护对象包括以下哪项\"，五个选项（HIE、需呼吸支持、心肺疾病或呼吸不规则、外科术后、部分胃肠外营养）均属 NICU 监护对象，题干实应为\"以下哪项不包括\"或选项应含\"以上均是\"。按原库答案取 B。备考请直接记忆监护对象范围：①HIE 等中枢神经系统疾病；②需呼吸支持者；③心肺疾病或呼吸不规则；④外科术后；⑤接受部分或完全胃肠外营养者；⑥极低/超低出生体重儿；⑦严重感染、休克、多器官功能衰竭。\n\n📚 出处：《儿科学》第9版·新生儿重症监护（NICU）收治对象（本题选项设计缺陷）"],["一些内脏器官病变，引起邻近或远隔体表产生疼痛，称为",["躯体痛","内脏痛","反射痛","牵涉痛","神经痛"],"D",1,"lc","临床综合","内脏器官病变时，支配该脏器的交感、副交感传入纤维与被牵涉体表区域的躯体感觉纤维汇聚于同一脊髓节段后角，中枢误判疼痛来源，使疼痛出现在邻近或远隔体表（如心绞痛放射至左肩臂、胆囊炎致右肩痛），称牵涉痛，故选D。躯体痛源于皮肤肌肉、定位明确；内脏痛弥散、定位不清；反射痛与神经痛机制不同，均不符合题意。\n\n📚 出处：《生理学》第9版·神经系统的功能（内脏痛与牵涉痛）"],["有关隐睾的叙述，以下哪项是不正确的",["1 岁以内的隐睾仍有自行下降可能","腹膜后睾丸受体温的影响致使引起不育","临床常用绒毛膜促性腺激素(HCG)或 LHRH 治疗","隐睾发生睾丸癌的几率明显高于正常人","睾丸下降固定术应在 10 周岁左右进行"],"E",1,"lc","儿科","隐睾1岁以内仍有自行下降可能，可先观察（A对）；腹腔或腹股沟内睾丸处于高于阴囊的温度环境，影响生精功能可致不育（B对）；可用HCG或LHRH促睾丸下降（C对）；隐睾恶变率显著高于正常（D对）。睾丸下降固定术应在1岁左右、最迟不超过2岁完成，10岁手术已过晚，故E不正确，为答案。\n\n📚 出处：《外科学》第9版·隐睾"],["X 线信息影像转换成可见密度影像的介质，不含",["屏-片系统","影像增强系统","电影胶片","观片灯","荧光屏"],"D",1,"lc","医学影像与检验","X 线透过人体后形成携有信息的 X 线信息影像，需经转换介质变为可见的密度影像才能观察：屏-片系统（增感屏使胶片感光）、影像增强系统（增强电视透视）、荧光屏（透视直接观察）、电影胶片（间接摄影）均属转换或记录介质。观片灯只是阅片时提供背景照明，使胶片上已有的光学密度差转化为可辨的亮度差，不参与影像形成与转换，故选 D。\n\n📚 出处：《医学影像学》第8版·X 线成像基本原理"],["臀位阴道分娩时，在产程中处理正确的是",["鼓励产妇下床活动，加速产程","宫口开大 3cm 前给予肥皂水灌肠","一旦破膜应立即听取胎心","破膜后若发生脐带脱垂可行脐带还纳术","宫口开全后仍需继续堵外阴"],"C",1,"lc","妇产科","臀位分娩破膜后应立即听胎心并做阴道检查，以早期发现脐带脱垂（臀位发生率明显高于头位），故C正确。臀位应卧床、不宜下床活动（防破膜后脱垂）；不宜灌肠（可诱发宫缩与破膜）；脐带脱垂时脐带还纳术成功率低、已被废弃，应尽快娩出胎儿（宫口开全可臀助产，未开全宜剖宫产）；宫口开全后不再堵外阴，应做好臀助产准备。\n\n📚 出处：《妇产科学》第9版·臀先露"],["为了看清近距离目标，需",["增加角膜的曲率","增加角膜的曲率半径","增加晶状体的曲率","增加晶状体的曲率半径","增加角膜和晶状体的曲率及半径"],"C",1,"lc","临床综合","视近物时需增加眼的屈光力，主要靠睫状肌收缩、悬韧带松弛使晶状体变凸、曲率增加，同时伴瞳孔缩小与双眼会聚（近反射三联），故选C。角膜曲率由角膜形态决定，不受调节（A、B、E错）；晶状体曲率半径增大意味着屈光力减弱，与看近的需求相反（D错）。随年龄增长晶状体弹性下降即出现老视。\n\n📚 出处：《眼科学》第9版·眼的屈光与调节"],["Sezary 综合征 S 细胞为多少时有诊断意义",["＞1%","＞1%～5%","＞5%～10%","＞10%～15%","＞0.5%"],"D",1,"lc","基础与预防医学","Sézary 综合征为皮肤 T 细胞淋巴瘤的白血病期，外周血出现核染色质深染、呈脑回状的 Sézary 细胞。一般以外周血 Sézary 细胞＞10%～15%（或绝对值＞1000/μl）作为有诊断意义的标准，故选 D。A ＞1%、B 1%～5%、E ＞0.5% 可见于炎症性皮肤病，无特异性；C ＞5%～10% 亦不足以确诊，须结合皮损、淋巴结及 T 细胞受体基因重排判断。\n\n📚 出处：《内科学》第9版·淋巴瘤（皮肤 T 细胞淋巴瘤）"],["α粒子的实质是",["质子","中子","电子","氦核","氢核"],"D",1,"lc","临床综合","α粒子是放射性核素衰变时射出的氦原子核，由两个质子与两个中子组成，带2个正电荷，质量较大、电离密度高而射程短，故选D。质子、中子、电子、氢核均非α粒子的实质；β粒子为电子（或正电子），γ射线为光子，均与α射线性质不同。α射线外照射危害小，但内照射危害大。\n\n📚 出处：《核医学》第9版·核物理基础"],["鉴别单纯性甲状腺肿与桥本氏病的血清学指标是",["FT3 与 FT4","TSH","TsAb","TPOAb 与 TGAb","Tg"],"D",1,"lc","内分泌与代谢","桥本甲状腺炎以血清TPOAb、TGAb显著持续升高为特征，单纯性甲状腺肿两者多阴性或仅低滴度，故TPOAb与TGAb是最有鉴别价值的血清学指标，答D。FT3、FT4、TSH在单纯性甲状腺肿与桥本早期均可正常，鉴别价值有限；TsAb为Graves病致病抗体，不能区分这两种疾病；血清Tg在甲状腺肿、桥本及其他甲状腺病变均可升高，缺乏特异性。\n\n📚 出处：《内科学》第9版·自身免疫甲状腺炎·桥本甲状腺炎"],["临床深度烧伤是指",["偏深的深Ⅱ度和Ⅲ度","Ⅲ度","浅Ⅱ度和深Ⅱ度","典型的深Ⅱ度以上的烧伤","Ⅱ度和Ⅲ度"],"D",1,"lc","外科总论与麻醉","临床所称“深度烧伤”指典型深Ⅱ度及Ⅲ度烧伤，即需要早期切削痂、植皮等手术治疗才能愈合或减少瘢痕的深度损伤，故D正确。单纯Ⅲ度（B）只是其中一部分；Ⅱ度包含浅Ⅱ度，后者可自愈，不能统称深度烧伤（C、E错）；“偏深的深Ⅱ度”表述不完整（A错）。\n\n📚 出处：《外科学》第9版·烧伤"],["右心衰竭时肝脏可能发生",["槟榔肝","肝细胞空泡变性","肝出血性梗死","肝贫血性梗死","以上都不是"],"A",1,"lc","心血管系统","右心衰竭时体循环淤血、肝静脉回流受阻，肝小叶中央区淤血伴肝细胞脂肪变性，切面呈红（中央淤血）黄（周边脂肪变）相间的槟榔样花纹，称槟榔肝，为慢性肝淤血特征。肝细胞空泡变性见于中毒或代谢性肝损伤；肝有肝动脉与门静脉双重血供，出血性、贫血性梗死均极少见。故选A。\n\n📚 出处：《病理学》第9版·局部血液循环障碍·慢性肝淤血"],["ICD-10关于轻躁狂发作的诊断标准，对于症状持续时间的要求是",["至少2周","至少5天","至少4天","至少3天","至少1周"],"C",1,"lc","临床综合","ICD-10规定轻躁狂发作的症状持续时间至少4天，且社会功能损害轻、无幻觉妄想等精神病性症状，故选C。至少2周是抑郁发作的时限要求（躁狂发作ICD-10要求至少1周）；至少5天、3天、1周均非ICD-10轻躁狂的标准。不足4天的类似表现为环性心境障碍范畴。\n\n📚 出处：《精神病学》第8版·双相及相关障碍"],["下列何种因素引起的肝性脑病预后最好",["腹水感染","食管静脉曲张破裂出血","择期门体静脉分流手术后、肝功能较好、进食高蛋白饮食引起者","肝肾综合征","重症肝炎有腹水患者"],"C",1,"lc","消化系统","肝性脑病的预后取决于肝功能储备与诱因能否去除。择期门体分流术后、基础肝功能较好、由高蛋白饮食诱发者，诱因明确且易纠正（限蛋白、乳果糖、清洁灌肠常可迅速清醒），预后最好，故C正确。腹水感染、食管静脉曲张破裂出血本身加重肝损害并常诱发多脏器功能衰竭；肝肾综合征、重症肝炎伴腹水者肝功能储备极差，预后凶险。\n\n📚 出处：《内科学》第9版·肝性脑病·预后"],["机体及时发现与杀死癌变细胞的功能是",["免疫防御","免疫耐受","免疫监视","免疫稳定","免疫清除"],"C",1,"lc","基础与预防医学","免疫监视指免疫系统识别并清除突变或癌变细胞的功能，主要由 NK 细胞、CTL 和巨噬细胞执行，监视功能低下者肿瘤发生率升高，故 C 正确。A 免疫防御针对外源性病原体，功能过强致超敏反应、过低致反复感染；B 免疫耐受是对自身或特定抗原的不应答，耐受破坏可致自身免疫病；D 免疫稳定指清除衰老损伤细胞、维持内环境稳定；E 非标准功能分类名称。\n\n📚 出处：《医学免疫学》第7版·免疫学概论（免疫的功能）"],["左心血液的主要循环途径是",["血流从左心室到主动脉再到外周动脉、毛细血管网、静脉系统，最后经腔静脉回右心房","血液从右心房到左心房再到主动脉","血液从腔静脉到右心房再到右心室","血液从外周动脉到毛细血管，再经外周静脉回腔静脉","血液从肺动脉到肺静脉"],"A",1,"lc","心血管系统","体循环（左心）途径为：左心室收缩将血射入主动脉，经各级动脉、毛细血管网完成物质交换后汇集为小静脉、中静脉，经上腔静脉与下腔静脉回流至右心房。B、C、E的解剖顺序与循环路径描述错误，D仅描述了体循环的一部分。故选A。\n\n📚 出处：《生理学》第9版·血液循环·体循环与肺循环途径"],["高位先天性肛门畸形术后最常见的并发症为",["肛门狭窄","肛周脓肿","肛门失禁","直肠脱垂","直肠回缩"],"C",1,"lc","消化系统","高位先天性肛门直肠畸形的直肠盲端位于肛提肌以上，局部括约肌发育不良，手术需经腹-骶会阴入路将直肠拖出并穿过括约肌复合体，术后因括约肌发育差及术中损伤，肛门失禁最为常见，故C正确。肛门狭窄多见于低位畸形术后需反复扩肛者；肛周脓肿、直肠黏膜脱垂、直肠回缩发生率均较低。\n\n📚 出处：《小儿外科学》·先天性肛门直肠畸形"],["儿童视觉发育的关键期为",["0～1岁","0～2岁","0～3岁","0～6岁","0～12岁"],"C",1,"lc","儿科","儿童视觉发育的关键期为0～3岁，此期是视觉中枢和双眼视觉功能建立的可塑期，形觉剥夺（如先天性白内障、上睑下垂）、斜视或屈光参差若未及时纠正，易形成不可逆的弱视，故C正确。因此先天性白内障应在生后数月内尽早手术，斜视、屈光不正应及早矫正；0～6岁、0～12岁为视觉发育的敏感期延续阶段，但关键期以0～3岁为核心。\n\n📚 出处：《眼科学》第9版·儿童视觉发育与弱视"],["上、下呼吸道的分界是",["舌骨下缘","会厌下缘","甲状软骨下缘","环状软骨下缘","声门"],"D",1,"lc","呼吸系统","呼吸道以环状软骨下缘为界，环状软骨以上（鼻、咽、喉）属上呼吸道，以下（气管、支气管及肺）属下呼吸道。环状软骨为喉内唯一完整软骨环，其下缘恰为喉与气管的交界，故D正确。舌骨下缘、会厌下缘、甲状软骨下缘、声门均位于喉内，以此为界会把部分喉归入下呼吸道，不符合解剖定义。\n\n📚 出处：《系统解剖学》第9版·呼吸系统"],["以下哪项可确诊前置胎盘",["产后检查示胎膜破口距胎盘边缘 5cm","腹部正位片示子宫体部无胎盘影","窥器检查宫颈未见病变","B 型超声检查可见胎盘覆盖宫颈内口","阴道穹窿扪诊可发现宫颈口周围有软组织"],"D",1,"lc","妇产科","B型超声显示胎盘实质覆盖宫颈内口可直接确诊前置胎盘，并可分型（完全性、部分性、边缘性），是首选且安全的确诊手段，故D正确。产后检查胎膜破口距胎盘边缘<7cm只能回顾性提示；腹部平片已淘汰；窥器检查仅用于排除宫颈局部出血；阴道穹隆扪诊在胎盘附着处可触及海绵样组织，但有诱发大出血风险，不用于确诊。\n\n📚 出处：《妇产科学》第9版·前置胎盘"],["秋初时小儿腹泻多见的致病原因是",["受凉","过敏","胃肠功能紊乱","病毒感染","细菌感染"],"D",1,"lc","儿科","秋初（9～11月）小儿腹泻多由病毒感染引起，以轮状病毒最常见，表现为发热、呕吐、频繁水样或蛋花汤样便、无腥臭、常伴脱水及酸中毒，故D正确。受凉、过敏、胃肠功能紊乱属非感染因素，全年散发；细菌感染（大肠埃希菌、沙门菌、痢疾杆菌）多见于夏季，常伴黏液脓血便。“秋季腹泻”一词即指轮状病毒肠炎。\n\n📚 出处：《儿科学》第9版·小儿腹泻病"],["防止频谱多普勒信号混叠的方法，最正确的是",["采用高通滤波","采用低速标尺","采用高通滤波，低速标尺","采用高通滤波，高速标尺","采用低通滤波，高速标尺"],"D",1,"lc","临床综合","频谱多普勒出现混叠是因血流速度超过Nyquist极限（PRF/2）。消除或减轻混叠的措施包括提高PRF（采用高速标尺、减小深度、角度校正）与提高壁滤波（高通滤波）去除低速高幅信号、扩大可测速度范围，故D正确。低速标尺会降低Nyquist极限而加重混叠（B、C错）；低通滤波保留低速信号，无助消除混叠（E错）。必要时改用连续波多普勒或低频探头。\n\n📚 出处：《医学影像学》第8版·超声诊断（多普勒技术）"],["下述哪项对诊断妊娠甲亢无帮助",["血 FT3、FT4 升高","四肢近端肌肉消瘦","血总 T3、T4 升高","体重不随妊娠月数而增加","休息时脉率>100 次/分"],"C",1,"lc","妇产科","妊娠期雌激素刺激肝脏合成甲状腺素结合球蛋白（TBG）增多，血清总T3、T4随之升高，故总T3、T4升高在正常孕妇中亦可出现，对诊断妊娠甲亢无帮助。游离T3、T4不受TBG影响，升高方有意义；体重不随孕月增加、休息时脉率>100次/分、四肢近端肌肉消瘦（甲亢性肌病）均为甲亢的临床线索。\n\n📚 出处：《妇产科学》第9版·妊娠合并甲状腺疾病"],["有关正常超声心动图的描述，下列哪项不正确",["收缩期主动脉瓣开放呈六边形盒样曲线","舒张期主动脉瓣叶关闭呈一条居中的直线","主动脉短轴切面显示主动脉瓣关闭呈 Y 形","舒张期二尖瓣前叶曲线形成","A 两峰 正常青年人群二尖瓣口血流频谱 A 峰高于 E 峰"],"E",1,"lc","医学影像与检验","正常 M 型超声心动图上，收缩期主动脉瓣开放，右冠瓣与无冠瓣分开呈六边形盒样曲线，舒张期关闭呈居中的一条直线；主动脉短轴切面舒张期三瓣闭合呈 Y 字形；二尖瓣前叶舒张期呈双峰（E 峰为快速充盈、A 峰为心房收缩）。正常青年人舒张期快速充盈占优势，E 峰高于 A 峰；随年龄增长心肌弛缓减慢才出现 A 峰高于 E 峰，故 E 描述不正确。\n\n📚 出处：《超声医学》第6版·超声心动图"],["位于脊髓后索内侧传导下部躯干及下肢深感觉的是",["脊髓丘脑束","皮质脊髓束","楔束","薄束","内侧丘系"],"D",1,"lc","神经与精神","脊髓后索由内侧的薄束与外侧的楔束组成：薄束位于内侧，传导下半身（T5 以下，下胸、腰、骶段）的深感觉（位置觉、运动觉、振动觉）及精细触觉；楔束位于外侧，传导上半身（T4 以上）同类感觉。二者纤维排列均呈内—外分层（由内向外为颈、胸、腰、骶）。故位于后索内侧、传导下部躯干及下肢深感觉者为薄束。脊髓丘脑束传导痛温觉与粗略触觉，皮质脊髓束为运动传导束，内侧丘系位于延髓。\n\n📚 出处：《神经病学》第8版·神经系统的解剖、生理及病损的定位诊断·脊髓"],["骨肉瘤最主要 X 线征象为",["软组织肿胀","骨质破坏","瘤骨形成","骨膜反应","骨质增生"],"C",1,"lc","运动与骨外科","骨肉瘤源于成骨性间叶组织，其最具特征性的X线征象是肿瘤细胞形成的瘤骨（云絮状、象牙质样高密度影），是诊断的病理基础；同时可见骨质破坏、骨膜反应（Codman三角、日光放射状条纹）与软组织肿块。软组织肿胀、骨质破坏、骨膜反应在骨髓炎与其他恶性肿瘤中亦可见，特异性差；骨质增生多为修复性或退行性改变，故最主要征象为瘤骨形成。\n\n📚 出处：《外科学》第9版·骨肿瘤·骨肉瘤"],["许多种彩色血流显像仪均带伪彩功能，它的作用是",["增加彩色血流检出敏感度","增加彩色血流的信息量","增加对灰阶图像的视觉分辨能力","能进行定量测量","增加低速血流的显示能力"],"C",1,"lc","医学影像与检验","伪彩（彩色编码）功能是把黑白灰阶图像按亮度映射为不同颜色，利用人眼对色彩差异的分辨力远高于灰阶差异这一特点，增强对灰阶图像层次和边界细节的视觉分辨能力，属后处理显示手段，故选 C。它不改变血流信号的采集与计算，故不提高彩色血流检出敏感度（A）、不增加血流信息量（B）、不能定量测量（D）、也不能提高低速血流的显示能力（后者取决于壁滤波、PRF 和增益调节），E 亦不成立。\n\n📚 出处：《超声医学》第6版·超声图像显示与处理"],["获取胰腺长轴标准切面的最主要条件是",["常规空腹，查前服缓泻剂","探头横置于上腹正中且向左上倾斜，与水平线成 10°～30°角","常规采取仰卧位扫查","检查前一天晚仅吃少渣食物","查前饮水 500～1000ml"],"B",1,"lc","消化系统","显示胰腺长轴的标准切面要求：患者空腹以减少胃肠气体、仰卧位，探头横置于上腹正中剑突下，向左上倾斜10°～30°（与水平线成角），使声束与胰腺长轴垂直，即可连续显示胰头、颈、体、尾，故B正确。空腹、少渣饮食、饮水充盈胃及服缓泻剂属检查前准备，有助减少气体干扰，但不是获取长轴切面的最主要条件。\n\n📚 出处：《医学影像学》第9版·超声·胰腺检查"],["慢性化脓性中耳炎，鼓膜穿孔边缘有一部分已达鼓沟，该处无残余鼓膜，称为",["中央性穿孔","紧张部穿孔","边缘性穿孔","松弛部穿孔","以上都不是"],"C",1,"lc","眼耳鼻喉口腔","按穿孔与鼓沟的关系，鼓膜穿孔分中央性与边缘性。中央性穿孔四周均有残余鼓膜，多提示单纯型；穿孔边缘某部已达鼓沟、该处无残余鼓膜者为边缘性穿孔，提示纤维环破坏、病变累及上鼓室或听骨链，常见于骨疡型与胆脂瘤型中耳炎。D松弛部穿孔位置在松弛部，与“达鼓沟”含义不同；A、B仅描述范围与部位。\n\n📚 出处：《耳鼻咽喉头颈外科学》第9版·耳科学·中耳炎"],["有关人体组织、体液回声的描述，以下哪项不妥",["透明软骨发生钙化回声增强","凝血块自溶以后回声减低，甚至接近无回声","脓腔内混合低密度的气泡时回声增强","血管内发生血栓时回声增强","肿瘤中央发生组织坏死时回声一定会减低"],"D",1,"lc","眼耳鼻喉口腔","透明软骨钙化后声阻抗增大、回声增强，A妥；凝血块自溶、红细胞破坏后内部反射界面减少，回声减低甚至接近无回声，B妥；脓腔内混有低密度气泡时气液界面强烈反射，回声增强，C妥；肿瘤中央坏死液化多出现无回声区，E基本正确。D不妥：血栓回声随时间演变，新鲜血栓多呈低回声甚至无回声，仅机化、纤维化后才回声增强，笼统称“血栓时回声增强”不准确。\n\n📚 出处：《医学影像学》第8版·超声诊断·组织回声规律"],["下列哪项是正常产褥的表现",["产后第 1 天，宫底平脐","产褥早期白细胞即恢复正常","产后 10 天为血性恶露","产后 12 小时体温可超过 38℃","产后脉搏一般偏快"],"A",1,"lc","临床综合","正常产褥中胎盘娩出后宫底平脐，产后第1天略高或平脐，此后每日下降1～2cm，10～14天降入盆腔，故A正确。产褥早期白细胞可生理性升高至（10～20）×10^9/L，约1～2周恢复（B错）；血性恶露约持续3～4天，10天多为浆液性、白色恶露（C错）；产后24小时内体温可轻度升高但一般不超过38℃（D错）；产后脉搏多偏慢（60～70次/分）（E错）。\n\n📚 出处：《妇产科学》第9版·正常产褥"],["急性肾小球肾炎的电镜检查特点是",["肾小球系膜区可见大块状电子致密物沉积","肾小球上皮下可见驼峰状电子致密物沉积","肾小球基膜内可见驼峰状电子致密物沉积","肾小球系膜区及内皮下可见大块状电子致密物沉积","肾小球无电子致密物沉积"],"B",1,"lc","泌尿系统","急性链球菌感染后肾小球肾炎电镜下最特征的是基底膜外侧（上皮下）散在、孤立的“驼峰状”大块电子致密物沉积，免疫荧光为IgG和C3颗粒状沉积。系膜区大块沉积见于IgA肾病，基膜内沉积见于膜性肾病，内皮下大块沉积见于狼疮性肾炎、膜增生性肾炎。故答B。\n\n📚 出处：《病理学》第9版·毛细血管内增生性肾小球肾炎"],["关于 21-三体综合征，以下说法哪个最正确",["原因不明的先天性疾病","最常见的小儿染色体病","单基因病","多基因病","小儿染色体病中的常见者"],"B",1,"lc","临床综合","21-三体综合征是小儿最常见的染色体病（活婴发生率约1/600～1/800），以智力低下、特殊面容、通贯掌及多发畸形为特征，故选B。其病因明确，为21号染色体三体型、易位型或嵌合型，不属“原因不明”（A错）；属染色体病而非单基因病（C）、多基因病（D）；E表述笼统，不如B准确。\n\n📚 出处：《儿科学》第9版·21-三体综合征"],["男性，28 岁，鼻根部粉碎性骨折后半年形成鞍鼻畸形。患者要求改善外观，处理方法应选择",["闭合复位","鼻尖部飞鸟状切口复位","瘢痕部切开复位","暂不处理","瘢痕部切开剔除骨块行隆鼻术"],"E",1,"lc","运动与骨外科","鞍鼻畸形已6个月，属陈旧性鼻骨骨折并塌陷，骨痂已形成、瘢痕粘连，闭合复位（限于伤后2周内）无效；且患者以改善外观为目的，应在瘢痕部切开、剔除错位愈合的骨块与瘢痕组织，充分松解鼻背软组织后植入自体骨（肋、髂骨）或假体行隆鼻术，重建鼻背高度与外形。暂不处理不能满足其诉求。\n\n📚 出处：《耳鼻咽喉头颈外科学》第9版·鼻部疾病·鼻部整形与鞍鼻矫治"],["38 岁初孕妇，妊娠 2 个月，合并半拳大小的卵巢囊肿，何时可手术治疗",["足月时行剖宫产术时同时","人流后立即手术","立即手术同时作保胎治疗","1 个月后肿瘤不缩小或反增大，可行手术或保胎治疗","产后再考虑手术"],"D",1,"lc","妇产科","孕早期发现的卵巢囊肿，部分为妊娠黄体囊肿，多在孕14～16周后自然缩小消退。故可先观察1个月（或至孕中期），若囊肿不缩小或反而增大、或呈实性/有恶性征象，则行手术（孕中期16～20周手术最安全，同时保胎）。孕2个月即手术易诱发流产；“人流后立即手术”“足月剖宫产同时”“产后”均不符合时机。\n\n📚 出处：《妇产科学》第9版·妊娠合并卵巢肿瘤"],["下列哪项不是移植肾发生急性排异反应的表现",["肾体积迅速增大","肾彩色血流明显减少","肾内动脉阻力指数 RI≥0.85","肾体积迅速缩小","肾窦回声减低"],"D",1,"lc","泌尿系统","急性排斥反应时移植肾因间质水肿和炎症细胞浸润而迅速肿大，皮质回声增强、肾窦回声减低、皮髓质分界不清，彩色多普勒示血流减少、肾内动脉阻力指数RI≥0.85。肾体积迅速缩小见于慢性排斥反应（纤维化萎缩）或移植肾血管性坏死，故不是急性排斥表现。故答D。\n\n📚 出处：《超声医学》第6版·移植肾并发症"],["患者，女，25 岁。停经 50 天，感心慌、胸闷。在当地医院诊断为“先天性心脏病并早孕”，今特来我院咨询能否继续妊娠。查体：口唇、指甲轻度紫绀，血压正常；心脏听诊：心率 80 次/分，律齐，于胸骨左缘第 3～4 肋间可闻Ⅰ～Ⅱ级收缩期杂音；肺动脉瓣第二心音亢进，双肺正常。超声诊断：室间隔缺损伴肺动脉高压。下列治疗措施哪项是正确的",["在心内科和产科医生治疗下维持妊娠至足月","不宜继续妊娠，入院行人工流产术","入院先行心脏手术，如心功能改善则继续妊娠","等待至中期妊娠行引产术","严密监护心功能，出现心衰即刻终止妊娠"],"B",1,"lc","妇产科","室间隔缺损伴肺动脉高压（艾森曼格综合征倾向），已出现口唇、指甲紫绀（右向左分流）及肺动脉瓣第二音亢进，属妊娠禁忌证：妊娠期外周阻力下降使分流增加、缺氧加重，母体死亡率高（30%～50%），胎儿预后差。故不宜继续妊娠，应在心内科与产科评估下尽早入院行人工流产。\n\n📚 出处：《妇产科学》第9版·妊娠合并心脏病"],["在细菌感染引起的严重炎症时，可出现",["白细胞下降","“核左移”现象","局部血管收缩","血流减慢","红细胞增加"],"B",1,"lc","外科总论与麻醉","细菌感染引起严重炎症时，内毒素、IL-1、IL-6、G-CSF等刺激骨髓加速释放，外周血未成熟中性粒细胞比例增高、杆状核及更早期细胞增多，即“核左移”，常伴白细胞总数升高，提示急性严重感染，故B正确。严重感染也可表现为白细胞减少（提示预后差），但不能概括。炎症局部是血管扩张、血流加快（C、D错）；红细胞一般不增加。\n\n📚 出处：《病理学》第9版·炎症"],["少尿是指 24 小时尿量小于",["70ml","100ml","200ml","400ml","500ml"],"D",1,"lc","泌尿系统","成人24小时尿量少于400ml（或每小时少于17ml）为少尿，少于100ml为无尿，多于2500ml为多尿。70ml、100ml、200ml均低于少尿界限，500ml已不属于少尿。故答D。\n\n📚 出处：《内科学》第9版·急性肾损伤"],["为预防结石复发，下列哪项需酸化尿液",["草酸盐结石","尿酸铵结石和磷酸盐结石","尿酸结石","黄嘌呤结石","混合结石"],"B",1,"lc","泌尿系统","尿酸铵结石与磷酸盐结石（磷酸钙及磷酸镁铵等感染性结石）在碱性尿中易析出沉淀，预防复发需酸化尿液（口服氯化铵、蛋氨酸等）并控制感染、解除梗阻。尿酸结石与胱氨酸结石则相反，需碱化尿液（枸橼酸盐）以提高溶解度。故答B。\n\n📚 出处：《外科学》第9版·尿石症（结石预防）"],["关于毛周角化病，下述错误的是",["多见于儿童及青少年","好发于上臂外侧","冬重夏轻","自觉症状较重","一般无自觉症状"],"D",1,"lc","皮肤性病","毛周角化病多见于儿童及青少年（A对），好发于上臂外侧、股外侧及面颊，对称分布（B对），冬季干燥时加重、夏季减轻（C对）。患者一般无自觉症状，仅少数有轻度瘙痒，故D“自觉症状较重”与E互相矛盾，且与本病临床相符者为E，D表述错误。\n\n📚 出处：《皮肤性病学》第9版·毛周角化病"],["关于“鼻咽癌”的影像描述，下列哪项不正确",["鼻咽软组织弥漫性增厚","头颅正位、颅底位价值高","肿瘤内无钙化","颅底骨质破坏","鼻咽部软组织肿块影"],"B",1,"lc","眼耳鼻喉口腔","鼻咽癌的影像表现为鼻咽部软组织肿块或弥漫性增厚、咽隐窝变浅消失、咽旁间隙受累及颅底骨质破坏，肿瘤内一般无钙化，A、C、D、E均正确。B不正确：头颅正侧位及颅底位平片软组织分辨率低、骨质重叠，对鼻咽癌诊断价值有限，现已被CT、MRI取代，尤其MRI对黏膜、咽旁间隙及颅底早期受累显示最佳。\n\n📚 出处：《医学影像学》第8版·头颈部·鼻咽癌"],["乳腺癌的直接 X 线征象是",["乳头凹陷","肿块","血运增多","皮下脂肪层模糊","皮肤局限增厚和收缩"],"B",1,"lc","外科总论与麻醉","乳腺癌X线直接征象是直接显示癌灶本身：肿块影（多呈毛刺状、分叶状、密度不均，为最主要直接征象）和恶性钙化（成簇、细小、多形性），故B正确。乳头凹陷、皮肤局限增厚收缩、皮下脂肪层模糊、血运增多及导管增粗等由肿块引起的继发改变，属间接征象。直接征象诊断特异性高，间接征象提示价值大。\n\n📚 出处：《外科学》第9版·乳腺癌"],["患者，男，25 岁。KUB 示双侧肾盂各有一直径约 1.5cm 大小阴影，排泄性尿路造影示双肾中度积水，双侧输尿管通畅。一次体外碎石将双侧结石粉碎，术后当天出现血尿及碎石排出，第二天出现双肾绞痛、发热、无尿。考虑治疗有何不妥之处",["术前未行抗感染治疗","术前未能先行解决双肾积水","术前未做定位 X 线","双侧一次性碎石治疗","错误地选择了 ESWL"],"D",1,"lc","泌尿系统","双侧上尿路结石原则上不应同时行体外冲击波碎石：碎石后大量石屑同时下行可堵塞双侧输尿管，导致急性双侧梗阻、无尿及急性肾损伤（本例术后第2天双肾绞痛、发热、无尿即属此情况），且已有双肾中度积水。应分期先后处理，先解除梗阻明显侧并控制感染。故答D。\n\n📚 出处：《外科学》第9版·尿石症（体外冲击波碎石）"],["让患者把学会的或自行发现的新的认知策略作为操作的新的基础，这种失语症语言训练方法属于",["PACE 技术","传统刺激","阻断去除法","功能重组法","实用交流能力训练法"],"D",1,"lc","神经与精神","失语症训练方法包括：传统刺激法（Schuell 强听觉刺激促进语言反应）、阻断去除法（去除干扰因素使残存功能显现）、程序介绍法、脱抑制法等。功能重组法强调通过训练使患者把学会的或自行发现的新的认知策略作为操作的新基础，即利用残存能力建立新的功能性代偿通路（如以书写、手势、交流板替代口语）。PACE 属实用交流能力训练，与传统刺激法、阻断去除法各有侧重，故 D 正确。\n\n📚 出处：《康复医学》第6版·言语与吞咽障碍的康复·失语症的治疗"],["男，9 岁，因腰腹疼痛就诊。排尿可，有恶心、呕吐，经当地医院检查诊断为先天性肾盂输尿管交界处狭窄，右肾积水。查体：右腰腹肿块，有波动感，无压痛。尿常规化验正常。肾图示右肾呈梗阻曲线，功能中度受损，左肾正常。根据临床表现及检查应采取何种治疗措施",["肾部分切除","肾切除","肾造瘘","肾盂输尿管成形","无需治疗"],"D",1,"lc","泌尿系统","先天性肾盂输尿管连接处狭窄致右肾积水，肾图示梗阻曲线、功能中度受损而左肾正常，说明患肾仍有保留价值，治疗应切除狭窄段与多余肾盂后行离断式肾盂输尿管成形术，解除梗阻、挽救肾功能。肾部分切除或肾切除适用于功能严重丧失者，肾造瘘仅为临时引流。故答D。\n\n📚 出处：《外科学》第9版·肾积水（肾盂输尿管连接处梗阻）"],["下列哪一种吸入麻醉药的 MAC 值最大",["恩氟烷","异氟烷","地氟烷","七氟烷","氧化亚氮"],"E",1,"lc","外科总论与麻醉","MAC是衡量吸入麻醉药效价强度的指标，MAC越大作用越弱。氧化亚氮MAC高达105%，是常用吸入麻醉药中最高的，故E正确，也说明其不能单独用于麻醉维持。其后依次约为：地氟烷6%～7%、七氟烷约2%、恩氟烷约1.7%、异氟烷约1.15%、氟烷0.75%。MAC还受年龄、体温、电解质、妊娠及合并用药影响。\n\n📚 出处：《临床麻醉学》第4版·吸入麻醉"],["关于急性肾小管坏死，下述正确的是",["尿渗透压增高","尿钠排出增多","尿中尿素氮增多","肾前性比肾性的尿比重低","尿开始后，血中尿素氮即降低"],"B",1,"lc","泌尿系统","急性肾小管坏死时小管上皮坏死、重吸收钠功能受损，加之管型阻塞使小管内压升高，尿钠排出增多（常>40mmol/L），尿钠排泄分数>1%~2%，尿比重低而固定于1.010、尿渗透压降低。肾前性者尿钠低、比重高、尿渗透压高；少尿期血尿素氮不会随即下降。故答B。\n\n📚 出处：《内科学》第9版·急性肾损伤（肾前性与肾性鉴别）"],["用 EDTA-K 盐作抗凝剂将严重干扰测定结果的项目是",["NA+、CL-","K+、CA2+","NA+、CO2CP","CL-、CO2CP","以上都不是"],"B",1,"lc","临床综合","EDTA-K盐靠螯合钙离子抗凝，其钾盐使血钾明显升高；钙被螯合使血钙测定值降低，故主要干扰K+与Ca2+，选B。Na+、Cl-、CO2CP受EDTA影响较小，并非主要干扰项目（A、C、D错）。故血钾、血钙测定宜用肝素抗凝血浆或血清标本，采血顺序与抗凝剂选择直接影响结果可靠性。\n\n📚 出处：《临床检验基础》·血液标本采集与抗凝剂"],["以下哪一项检查最有助于鉴别垂体性 Cushing 病和异位 ACTH 综合征",["尿 17-羟测定","尿 17-酮测定","血浆 ACTH 测定","CRH 兴奋试验","ACTH 兴奋试验"],"D",1,"lc","内分泌与代谢","库欣病因垂体ACTH微腺瘤对CRH仍有反应，CRH兴奋后ACTH及皮质醇进一步升高；异位ACTH综合征肿瘤自主分泌，无反应，故CRH兴奋试验最有鉴别意义，答D。尿17-羟反映皮质醇代谢总量、尿17-酮主要反映雄激素代谢，两者在两种病变中均可升高；血浆ACTH在异位者升高更明显但互有重叠；ACTH兴奋试验用于评价肾上腺皮质储备功能，无病因鉴别价值。\n\n📚 出处：《内科学》第9版·库欣综合征·病因鉴别诊断"],["某青年在踢足球时扭伤右膝关节，疼痛、肿胀。经过休息后好转，能正常上班，但游泳时疼痛明显。3 个月后经常出现交锁、弹响，肌肉萎缩。可能的诊断是",["交叉韧带损伤","侧副韧带损伤","半月板损伤","盘状半月板","半月板囊肿"],"C",1,"lc","运动与骨外科","青年踢球扭伤膝关节，急性期疼痛肿胀，休息后缓解但活动时（尤其下蹲、游泳蹬水）疼痛，3个月后出现反复交锁与弹响并伴股四头肌萎缩，是半月板损伤的典型病程：破裂的半月板在关节间隙内滑动嵌顿产生交锁与弹响，McMurray试验多阳性。交叉韧带损伤以关节不稳、前抽屉或Lachman试验阳性为主，交锁少见；侧副韧带损伤为侧向应力痛与侧方不稳；盘状半月板多有长期弹响史；半月板囊肿可扪及局部囊性肿物。\n\n📚 出处：《外科学》第9版·运动系统慢性损伤与关节损伤·膝关节半月板损伤"],["下列哪项不是诊断猩红热的主要临床依据",["发热，咽峡炎","全身皮肤呈弥漫性充血性红色皮疹，疹退后有脱皮","杨梅舌","出疹时可于皮肤皱褶处见到帕氏线和口周苍白圈","常可发生变态反应性并发症"],"E",1,"lc","理化与中毒","猩红热的诊断依据为：发热、咽峡炎（A），全身弥漫性充血性红色皮疹且疹退后脱皮（B），杨梅舌（C），皮肤皱褶处帕氏线和口周苍白圈（D），加上咽拭子培养 A 组乙型溶血性链球菌阳性或抗链球菌溶血素 O 升高。E 变态反应性并发症（风湿热、急性肾小球肾炎）发生于病后 2～3 周，属病程后期的并发症而非早期诊断依据，故不是诊断猩红热的主要临床依据。\n\n📚 出处：《传染病学》第9版·猩红热"],["婴幼儿上颌骨骨髓炎最常见的致病菌是",["金黄色葡萄球菌","肺炎球菌","大肠杆菌","厌氧杆菌","流感杆菌"],"A",1,"lc","儿科","婴幼儿上颌骨骨髓炎最常见的致病菌为金黄色葡萄球菌，多继发于上呼吸道感染、鼻腔炎症或口腔黏膜损伤，表现为发热、眶周及面颊红肿、眼睑水肿、鼻腔流脓，可形成死骨和瘘管，故A正确。肺炎球菌、大肠埃希菌、厌氧杆菌、流感杆菌均可致病但比例较低。治疗应尽早足量静脉应用抗葡萄球菌抗生素，必要时引流。\n\n📚 出处：《耳鼻咽喉头颈外科学》第9版·婴幼儿上颌骨骨髓炎"],["治疗过敏性紫癜的关键是",["抗过敏治疗","免疫抑制治疗","对症治疗","消除致病因素","应用止血药物"],"D",1,"lc","血液系统","过敏性紫癜治疗的关键在于消除致病因素：查找并停用可疑致敏药物与食物、控制感染灶、驱除寄生虫、避免再次接触过敏原，去除病因后多数患者可自行缓解。抗过敏药、糖皮质激素、免疫抑制剂属对症治疗（激素主要用于腹痛、关节痛、肾型），止血药物对本病无效。\n\n📚 出处：《内科学》第9版·过敏性紫癜"],["心肌灌注显像时，混合性灌注缺损多提示",["梗阻性心肌病","心室室壁瘤","早期心肌缺血","心肌缺血与心肌梗死并存","扩张型心肌病"],"D",1,"lc","心血管系统","心肌灌注显像中可逆性缺损代表心肌缺血，固定缺损代表心肌梗死瘢痕；同一患者同时存在两种缺损即为混合性灌注缺损，提示缺血与梗死并存，常见于多支血管病变。梗阻性心肌病与扩张型心肌病多呈固定或弥漫性改变，室壁瘤为固定缺损伴形态异常，早期缺血为单纯可逆缺损。故选D。\n\n📚 出处：《核医学》第9版·心血管系统显像·心肌灌注显像的临床意义"],["尿道下裂发生于",["胚胎的 9～16 周","胚胎的 8～15 周","胚胎的 7～10 周","胚胎的 8～10 周","胚胎的 10～14 周"],"B",1,"lc","泌尿系统","胚胎第8~15周是尿道褶自后向前融合、形成尿道海绵体部的关键期，此期雄激素不足或雄激素受体异常即致融合中止，尿道口异位于阴茎腹侧形成尿道下裂。其余时间窗与尿道发育关键期不符。故答B。\n\n📚 出处：《外科学》第9版·泌尿男生殖系统畸形（尿道下裂）"],["子宫内膜异位症临床分期的依据是",["血清 CA125 测定","宫腔镜检查","彩色超声多普勒检查","典型病史及妇科检查","腹腔镜检查"],"E",1,"lc","妇产科","子宫内膜异位症的分期采用rAFS评分系统，需在腹腔镜或开腹直视下评估病灶部位、大小、深度、数目、粘连范围及直肠子宫陷凹封闭程度，据此分为Ⅰ～Ⅳ期，故分期依据是腹腔镜检查。血清CA125、彩色多普勒、病史与妇科检查只能提示诊断，无法客观分期；宫腔镜仅观察宫腔，对盆腔内异症无价值。\n\n📚 出处：《妇产科学》第9版·子宫内膜异位症"],["下列关于帕金森病的描述，不正确的是",["纹状体多巴胺-乙酰胆碱失衡与肌张力增高、动作减少等症状的产生密切相关","出现临床症状时纹状体多巴胺浓度一般降低 80%以上","多巴胺递质降低的程度与患者的症状严重度不相一致","多巴胺替代药物治疗的治疗原理是纠正递质失衡","抗胆碱药物治疗的治疗原理是纠正递质失衡"],"C",1,"lc","神经与精神","帕金森病的基本生化改变是黑质多巴胺能神经元变性、纹状体多巴胺减少，使多巴胺与乙酰胆碱平衡失调（多巴胺不足、ACh 相对亢进），导致肌张力增高与运动减少。临床症状一般要在纹状体多巴胺浓度降低 80% 以上才出现，故存在较长临床前期。多巴胺递质降低的程度与症状严重程度（UPDRS 评分、运动障碍进展）呈显著相关，故“不相一致”不正确。多巴胺替代治疗（左旋多巴）补充多巴胺、抗胆碱药抑制 ACh，均为纠正递质失衡。\n\n📚 出处：《神经病学》第8版·运动障碍性疾病·帕金森病"],["关于冠心病伴肝硬化上消化道出血的治疗，下列错误的是",["三腔管压迫","去甲肾上腺素胃管滴注","垂体后叶素静脉滴注","6-氨基己酸静脉滴注","冰盐水洗胃"],"C",1,"lc","心血管系统","垂体后叶素通过收缩内脏血管止血，但同时强烈收缩冠状动脉，可诱发心绞痛甚至心肌梗死，冠心病患者禁用，故C为错误的治疗措施。三腔二囊管压迫、去甲肾上腺素冰盐水胃管灌注、6-氨基己酸、冰盐水洗胃对冠脉影响小，可用于冠心病合并肝硬化上消化道出血。故选C。\n\n📚 出处：《内科学》第9版·肝硬化·食管胃底静脉曲张出血的治疗"],["关于小儿上呼吸道解剖特点，以下错误的是",["婴儿鼻腔血管丰富，炎症时可呼吸困难重","6 个月可患鼻窦炎","喉腔狭窄，炎症时气道梗阻严重","咽鼓管较宽、短，水平位，易患中耳炎","婴儿易患化脓性扁桃体炎"],"E",1,"lc","儿科","婴儿鼻腔短小、黏膜血管丰富，炎症时易充血肿胀致鼻塞呼吸困难（A对）；出生6个月后鼻窦逐渐发育，可患鼻窦炎（B对）；喉腔狭窄、软骨柔软、黏膜下组织疏松，炎症时易喉梗阻（C对）；咽鼓管短、宽、平直，鼻咽部炎症易波及中耳致中耳炎（D对）。婴儿扁桃体尚未充分发育，故少患化脓性扁桃体炎，E错误，为答案。\n\n📚 出处：《儿科学》第9版·小儿呼吸系统解剖特点"],["星形细胞瘤与脑梗死的鉴别，最有意义的是",["低密度","不增强","单脑叶分布","多脑叶分布","不按血管支配区分布"],"E",1,"lc","神经与精神","星形细胞瘤位于白质内，呈膨胀性生长，分布不受脑血管支配区限制，可跨越脑叶与血管分水岭，低密度范围与占位效应不相称，增强多不均匀，随访逐渐增大。脑梗死则严格按某一血管供应区分布，呈楔形、同时累及灰白质，急性期有脑回样强化。故“不按血管支配区分布”最具鉴别意义。低密度与不增强两者均可出现，单/多脑叶分布只是范围描述，不如血管区规律可靠。\n\n📚 出处：《医学影像学》第8版·中枢神经系统·颅内肿瘤"],["下列哪种情况一般可以不考虑安装人工心脏起搏器",["窦性停搏","第二度Ⅰ型房室传导阻滞","第二度Ⅱ型房室传导阻滞","第二度Ⅱ型窦房阻滞","第三度房室传导阻滞"],"B",1,"lc","心血管系统","第二度Ⅰ型（文氏型）房室传导阻滞多为迷走张力增高、药物或下壁心梗所致的一过性改变，无症状、无进展者可观察随访，一般不需起搏器。而有症状的窦性停搏、第二度Ⅱ型房室传导阻滞、第二度Ⅱ型窦房阻滞及第三度房室传导阻滞均有晕厥或猝死风险，属起搏器植入的Ⅰ类适应证。故选B。\n\n📚 出处：《内科学》第9版·心律失常·心脏起搏治疗适应证"],["关于胃炎的叙述，不正确的是",["糜烂性胃炎病理上可分为平坦型和隆起型两类型","慢性胃炎按 Schiadler 分为浅表性、萎缩性、肥厚性三种","糜烂性胃炎累及深度不超过黏膜肌层","慢性胃炎肥厚性多见","糜烂性胃炎多见于 30～60 岁男性，可有烧心、疼痛等症状"],"D",1,"lc","消化系统","按Schindler分类，慢性胃炎分浅表性、萎缩性和肥厚性三型，其中浅表性最多见、萎缩性次之、肥厚性（Menetrier病）罕见，故慢性胃炎肥厚性多见错误，选D。糜烂性胃炎分平坦型与隆起型，病变深度不超过黏膜肌层，多见于30～60岁男性，可有烧心、上腹痛，A、B、C、E均正确。\n\n📚 出处：《内科学》第9版·慢性胃炎"],["女性，30 岁，心悸、气短、下肢水肿 1 年。查体：呼吸困难，颈静脉怒张，心界向两侧扩大，有舒张期奔马律，3/6 级收缩期吹风样杂音，肝肋下 3cm。X 线：心影向两侧增大。经强心、利尿治疗 2 个月后，症状基本消失，心界明显缩小，心脏杂音较前减轻，奔马律消失。最可能的诊断是",["风湿性心脏病二尖瓣关闭不全","急性心肌炎","急性心包炎","肥厚型梗阻性心肌病","原发性扩张型心肌病"],"E",1,"lc","心血管系统","女性患者心界向两侧扩大、颈静脉怒张、肝大、下肢浮肿伴舒张期奔马律与心尖部收缩期杂音，强心利尿治疗2个月后症状消失、心界明显缩小、杂音减轻、奔马律消失，心腔大小可 。其中刺激后能否收缩最能反映肌纤维与神经肌肉接头的存活状态，最为可靠；颜色可受灯光、淤血、血液浸染干扰，张力受温度与肿胀影响，出血受血压与止血带影响，完整性只表明解剖连续而无功能意义。故最可靠指标为收缩。\n\n📚 出处：《外科学》第9版·创伤·软组织损伤的清创"],["下面哪种病毒不能引起手足口病",["小 RNA 病毒科","肠道病毒属的柯萨奇病毒","埃可病毒","痢疾杆菌","肠道病毒 71 型"],"D",1,"lc","儿科","手足口病病原为肠道病毒，属小RNA病毒科肠道病毒属，包括柯萨奇病毒A16、A5、A10型，肠道病毒71型（EV71）及埃可病毒等，故A、B、C、E均可致病。痢疾杆菌为革兰阴性杆菌，引起细菌性痢疾，表现为脓血便、里急后重，不是手足口病病原，故D为答案。EV71型易致中枢神经系统受累与重症。\n\n📚 出处：《儿科学》第9版·手足口病"],["输血后过敏反应的临床表现不包括",["发热、寒战","低血压、休克","荨麻疹、血管神经性水肿","血红蛋白尿、肾衰","皮肤潮红、瘙痒"],"D",1,"lc","血液系统","输血过敏反应由供者血浆蛋白与受者IgE结合或抗IgA抗体介导，表现为皮肤潮红、瘙痒、荨麻疹、血管神经性水肿，重者喉头水肿、支气管痉挛、低血压休克；发热寒战亦常伴同出现。血红蛋白尿、急性肾衰竭及DIC是急性溶血性输血反应的典型表现，不属于过敏反应。\n\n📚 出处：《外科学》第9版·输血"],["近年来，烧伤感染的主要病原微生物是",["革兰阴性杆菌","革兰阳性杆菌","真菌","病毒","以上均是"],"A",1,"lc","外科总论与麻醉","烧伤创面感染早期以革兰阳性球菌（金葡菌）为主；随着病程延长、大量使用抗生素和肠道细菌移位，革兰阴性杆菌（铜绿假单胞菌、鲍曼不动杆菌、肠杆菌科、嗜麦芽窄食单胞菌等）已成为近年烧伤感染的主要病原微生物，且多为多重耐药，故A正确。真菌感染多在长期广谱抗生素或免疫抑制后出现，比例上升但仍居次；病毒感染较少见。\n\n📚 出处：《外科学》第9版·烧伤"],["糖尿病引起的眼病，哪项最为严重",["视网膜病变","白内障","屈光不正","虹膜睫状体炎","眼外肌麻痹"],"A",1,"lc","泌尿系统","糖尿病视网膜病变是糖尿病最常见、最严重的眼部并发症，也是工作年龄人群致盲的首位原因，可经增殖期新生血管、玻璃体出血、牵拉性视网膜脱离致失明。白内障、屈光不正（晶状体渗透性改变）、虹膜睫状体炎、眼外肌麻痹虽也可发生，但致盲危险性明显低于视网膜病变。故答A。\n\n📚 出处：《内科学》第9版·糖尿病视网膜病变"],["中毒性菌痢的发病机理是",["感染了大量的痢疾杆菌","感染可超过 200 个有侵袭力的痢疾杆菌","患者对痢疾杆菌的内毒素敏感并产生强烈的过敏反应","患者以前没有接触过痢疾杆菌","痢疾杆菌造成严重的结肠粘膜溃疡"],"C",1,"lc","传染病","中毒型菌痢的发病机制是机体对痢疾杆菌内毒素产生强烈过敏反应：内毒素入血后激活交感-肾上腺髓质系统及炎症介质释放，引起全身微循环障碍（痉挛→淤血→衰竭）和脑微循环障碍，导致感染性休克、脑水肿和呼吸衰竭，而肠道病变轻微，故 C 正确。发病与感染菌量（A、B）无直接关系；D 未曾接触痢疾杆菌并非发病条件，反而特异性免疫缺乏多见于其他传染病；E 严重结肠溃疡是普通型菌痢的表现，非中毒型的发病机理。\n\n📚 出处：《传染病学》第9版·细菌性痢疾"],["下列哪项不是检查小脑功能的方法",["指鼻试验","快速轮替试验","反跳试验","病理反射","跟膝胫试验"],"D",1,"lc","神经与精神","小脑功能检查方法包括指鼻试验、指指试验、跟膝胫试验（协调与辨距）、快速轮替试验（共济运动）、反跳试验（拮抗肌及时抑制）、Romberg 试验、直线行走与步态观察、眼震、肌张力及构音检查。病理反射（Babinski 征、Chaddock 征、Hoffmann 征等）检查的是锥体束（上运动神经元）损害，反映皮质脊髓束功能，与小脑功能无关，故不属于小脑功能检查方法。\n\n📚 出处：《神经病学》第8版·神经系统的检查·共济运动检查"],["男性，51 岁，因患胃癌行胃大部切除。手术后 2 天起咳嗽，痰呈黄脓性，体温 39℃，稽留热型。X 线胸部摄片示右中肺野大片浸润阴影，并见空洞和液平面。痰培养多次为金黄色葡萄球菌。曾应用青霉素、苯唑西林、头孢呋辛、头孢噻肟、头孢他啶、阿米卡星等，病情不见改善。本例抗菌治疗应当调整为下列哪项比较适当",["红霉素联合氯霉素","头孢哌酮联合妥布霉素","万古霉素联合环丙沙星","氯唑西林联合庆大霉素","氨曲南联合甲硝唑"],"C",1,"lc","呼吸系统","术后肺炎、黄色脓痰、稽留热伴空洞液平面、痰多次培养为金葡菌，经青霉素、苯唑西林及多种头孢、氨基糖苷类治疗无效，提示为耐甲氧西林金葡菌（MRSA）感染。MRSA治疗首选糖肽类万古霉素（或去甲万古霉素、利奈唑胺），可联合环丙沙星等氟喹诺酮增强对胞内菌与生物膜的清除，故C适当。红霉素联合氯霉素、氨曲南联合甲硝唑对G⁺球菌无效；头孢哌酮＋妥布霉素、氯唑西林＋庆大霉素对MRSA均无效（β-内酰胺类对MRSA亲和力低）。\n\n📚 出处：《内科学》第9版·肺炎·葡萄球菌肺炎"],["自身免疫性肝炎的特征性病理学改变是",["小胆管增生","可见 Mallory 小体","界面性肝炎、浆细胞浸润、玫瑰花结","汇管区淋巴滤泡形成、胆管损伤、小叶内肝细胞脂肪变性","肝细胞内铁颗粒沉积"],"C",1,"lc","消化系统","自身免疫性肝炎的特征性组织学改变为界面性肝炎（碎屑样坏死）、汇管区及界面以浆细胞为主的淋巴浆细胞浸润、肝细胞玫瑰花结（花环样排列）形成，故C正确。小胆管增生见于胆汁淤积性肝病；Mallory小体多见于酒精性肝病；汇管区淋巴滤泡形成伴胆管损伤及小叶内脂肪变性是原发性胆汁性胆管炎的特点；肝内铁颗粒沉积见于血色病。\n\n📚 出处：《内科学》第9版·自身免疫性肝炎·病理"],["中心型肺癌病理分型按发病率由多到少排列，以下哪项正确",["大细胞癌，小细胞癌，鳞癌","鳞癌，大细胞癌，小细胞癌","小细胞癌，鳞癌，大细胞癌","鳞癌，小细胞癌，大细胞癌","小细胞癌，大细胞癌，鳞癌"],"D",1,"lc","呼吸系统","中心型肺癌多起源于段及段以上支气管，病理类型以鳞癌最多（约占中心型的多数），其次为小细胞癌，大细胞癌最少，故由多到少为鳞癌、小细胞癌、大细胞癌，即D。腺癌多位于肺外周，属周围型肺癌，不在中心型序列中。小细胞癌虽恶性程度最高但发病率低于鳞癌，故C、E排列顺序不当；A、B把大细胞癌置于首位或次位，均不符。\n\n📚 出处：《病理学》第9版·呼吸系统疾病·肺癌"],["关于谵妄，下列哪种说法不妥",["谵妄病人突然变得安静，说明病情一定好转","谵妄病人可出现片段妄想","谵妄病人常有定向障碍","谵妄病人可出现被害妄想","谵妄病人可发生冲动行为"],"A",1,"lc","神经与精神","谵妄是急性、可逆、波动性的器质性意识障碍：意识清晰度下降伴注意障碍，昼夜节律紊乱（夜间加重，日落综合征），定向力障碍，可出现生动错觉、幻觉（幻视多见）及片断不系统的被害妄想，情绪不稳、恐惧、兴奋躁动，可有冲动、伤人或自伤行为。其病程本身波动，患者由躁动转为安静可能是意识障碍加深、病情恶化（低氧、低血糖、脑疝、感染加重）的表现，须立即评估生命体征，绝不能据此认为“病情一定好转”。\n\n📚 出处：《精神病学》第8版·脑器质性精神障碍·谵妄"],["梅克尔憩室位于回肠末端，距回盲瓣处约",["0.5～1m","1～1.5m","1.5～2m","2.5～3m","3.5～4m"],"A",1,"lc","消化系统","梅克尔憩室是卵黄管（脐肠系膜管）退化不全形成的真性憩室，位于回肠末段对系膜缘，通常距回盲瓣约30～100cm（即0.5～1m），故A正确。憩室内常含异位胃黏膜或胰腺组织，是婴幼儿无痛性下消化道出血、肠套叠、憩室炎的常见原因，2岁以下小儿多见。\n\n📚 出处：《外科学》第9版·小肠疾病·梅克尔憩室"],["桡骨小头脱位常用处理方法是",["手法复位，三角巾悬吊","手法复位","切开复位","三角巾悬吊","切开复位，内固定"],"A",1,"lc","运动与骨外科","桡骨小头半脱位（牵拉肘）多见于5岁以下小儿，因桡骨头尚未发育、环状韧带松弛，上肢被纵向牵拉后桡骨头从环状韧带中滑出。治疗以手法复位为主：屈肘90°，一手拇指按压桡骨头向后内，同时将前臂充分旋后并伸直，闻及弹响即复位成功，随后用三角巾或颈腕吊带悬吊1～2天避免再次牵拉。无需切开复位，复位后长期固定反而增加复发风险。\n\n📚 出处：《外科学》第9版·关节脱位·桡骨小头半脱位"],["关于肝癌，下列哪项叙述是错误的",["肝肿大是最常见的体征","早期施行手术仍是最有效的疗法","多以肝区疼痛为首发症状","AFP 阴性可以除外原发性肝癌的诊断","AFP 定量大于 400ng/ml 并有影像学证据可以确诊"],"D",1,"lc","消化系统","AFP是原发性肝癌的重要标志物，但约30%～40%的患者AFP阴性（小肝癌、高分化或纤维板层型多见），故AFP阴性绝不能除外肝癌，诊断须结合超声、增强CT/MRI及活检，故选D（错误项）。肝大是最常见体征、肝区疼痛常为首发症状、早期手术切除仍是最有效疗法、AFP>400ng/ml并有影像学证据可临床确诊，A、B、C、E均正确。\n\n📚 出处：《内科学》第9版·原发性肝癌·诊断"],["确定消化性溃疡出血不合适的方法是",["查血常规","钡餐透视","便隐血试验","急诊胃镜检查","询问病史"],"B",1,"lc","消化系统","判断是否为溃疡出血主要靠病史（溃疡史、周期性与节律性疼痛）、便隐血试验及急诊胃镜（可明确部位、判定Forrest分级并同时止血）。查血常规虽不能定位，但能评估失血量与动态变化，属常规无害的评估手段。急性出血期行钡餐透视既难以显示出血灶，又可因按压与体位变动诱发再出血，故最不合适，应选B。原库答案A（查血常规）不确切，已更正为B。\n\n📚 出处：《内科学》第9版·上消化道出血·诊断"],["关于手术台上器械坠落，下列说法正确的是",["拾起再用","冲洗后再用","不能使用","可不用计数","可拿出手术间"],"C",1,"lc","外科总论与麻醉","无菌原则规定，手术台上的器械一旦坠落至手术台平面以下（非无菌区）即视为污染，不能拾起再用，也不可冲洗后使用，必须更换新器械，故C正确。坠落器械应单独放置、纳入器械清点交接，不得随意拿出手术间，以免与洁净器械混淆。器械清点是防止异物遗留体内的关键环节，不能省略。\n\n📚 出处：《外科学》第9版·无菌术"],["患者男，43岁，食欲减退、乏力1年余…HBsAg(+)。饮食方面应注意",["吃流食","高蛋白饮食","限制蛋白摄入量","少吃肉类，多吃蔬菜","注意休息，严禁饮酒"],"E",1,"lc","临床综合","慢性乙型肝炎患者饮食宜清淡易消化，应重视休息、避免劳累，必须严禁饮酒——酒精直接加重肝细胞损伤并促进肝纤维化，故E是最需强调的注意事项。有肝功能明显受损、肝性脑病倾向者应适当限制蛋白摄入，不能一概采用高蛋白饮食（B、C不恰当）；单纯改吃流食或只吃蔬菜不吃肉并无治疗意义（A、D）。\n\n📚 出处：《内科学》第9版·病毒性肝炎"],["以下哪种物质不影响甲状腺素的合成与释放",["甲状腺球蛋白","丙硫氧嘧啶","促甲状腺激素","二碘酪氨酸","C肽"],"E",1,"lc","内分泌与代谢","C肽与胰岛素以等摩尔比例由胰岛β细胞分泌，对甲状腺无作用，不影响甲状腺激素的合成与释放，答E。甲状腺球蛋白是激素合成的载体前体，其碘化与偶联是合成关键步骤；丙硫氧嘧啶抑制过氧化物酶，阻断碘有机化与偶联；TSH经cAMP促进腺体摄碘、合成与释放；二碘酪氨酸（MIT、DIT）是甲状腺激素合成的重要中间产物并参与底物调节。\n\n📚 出处：《生理学》第9版·甲状腺激素的合成与分泌调节"],["下列有关心理发育障碍的说法，正确的是",["一般起病于学龄期","多呈发作性病程","与中枢神经系统的生理成熟过程密切相关","早期药物治疗疗效显著","预后一般较好"],"C",1,"lc","神经与精神","心理发育障碍（广泛性及特定性发育障碍）起病于婴幼儿期及童年早期，多在 3 岁前，其发生与中枢神经系统的生理成熟过程密切相关——在脑发育关键期内出现异常，导致语言、社交、运动、认知等功能发育偏离或迟滞。病程多为持续性慢性经过而非发作性；治疗以教育训练、行为干预与家庭支持为主，药物仅处理共病症状，无显著特效药；多数预后不佳，需长期支持。\n\n📚 出处：《精神病学》第8版·心理发育障碍·概述"],["29岁初孕妇，妊娠32周，头痛5日就诊。查：血压160/110mmHg，脉搏94次/分，面色苍白，胎心144次/分，尿蛋白(+++)，水肿(++)。此患者的诊断为",["肾炎","子痫前期(轻度)","子痫前期(重度)","妊娠期高血压","以上都不对"],"C",1,"lc","妇产科","孕32周、血压160/110mmHg（达重度标准≥160/110mmHg）、尿蛋白+++、水肿++并有头痛，符合重度子痫前期诊断。诊断要点是血压与靶器官损害：血压≥160/110mmHg、蛋白尿≥2.0g/24h（或+++）、持续头痛或视觉障碍、肝肾功能异常、血小板减少、肺水肿等。肾炎多有既往肾病史与尿液异常形态；轻度子痫前期血压<160/110mmHg且无严重表现。\n\n📚 出处：《妊娠期高血压疾病诊治指南(2020)》"],["关于子宫脱垂的防治，下列不正确的是",["积极治疗慢性咳嗽、便秘","禁止参加体力劳动","避免或减少产伤","脱垂轻者可放置子宫托","伴阴道壁膨出者可手术治疗"],"B",1,"lc","妇产科","子宫脱垂的防治包括：避免与减少产伤（提高接产质量、及时缝合裂伤）、积极治疗慢性咳嗽与便秘等增加腹压的疾病、加强营养与盆底肌锻炼、轻者可用子宫托、伴阴道壁膨出或重度脱垂者可手术。但并非禁止体力劳动，适度活动与锻炼有益；应避免的是重体力 ],"B",1,"lc","妇产科","宫颈裂伤缝合时第一针应超过裂口顶端0.5cm，以保证结扎回缩的血管断端；最后一针应距宫颈外侧端（宫颈外缘）0.5cm，避免缝扎过紧造成宫颈口狭窄或影响日后分娩。故为0.5cm。\n\n📚 出处：《妇产科学》第9版·软产道裂伤"],["关于咽壁纤维层的描述，以下不正确的是",["主要由咽颅筋膜构成","介于粘膜和肌层之间","上薄下厚","两侧的纤维组织在后壁正中线上形成咽缝","上端接颅底"],"C",1,"lc","眼耳鼻喉口腔","咽壁由内向外为黏膜层、纤维层、肌层、外膜层。纤维层即咽颅筋膜，位于黏膜与肌层之间，上端附着颅底且最厚，向下逐渐变薄；两侧纤维组织在后壁正中线上汇合成咽缝，为咽缩肌附着处。A、B、D、E均正确，C称“上薄下厚”与解剖相反，故为不正确的描述。\n\n📚 出处：《耳鼻咽喉头颈外科学》第9版·咽科学·咽的应用解剖"],["关于再障的说法，下列哪项不正确",["铁剂、叶酸治疗无效","骨髓增生低下","浆细胞、单核及淋巴细胞等非造血细胞增多","巨核细胞数量减少","重型病例，贫血、感染、出血较轻"],"E",1,"lc","临床综合","再生障碍性贫血为正细胞正色素性贫血，铁剂、叶酸、维生素B12治疗无效（A对）；骨髓增生低下、造血细胞减少，巨核细胞减少或缺如，浆细胞、淋巴细胞、单核及网状细胞等非造血细胞比例相对增多（B、C、D对）。重型再障起病急、进展快，贫血进行性加重，常伴严重感染与内脏出血，故“贫血、感染、出血较轻”明显错误，E为答案。\n\n📚 出处：《内科学》第9版·再生障碍性贫血"],["35 岁初产妇，现孕 33 周。查：血压 130/80mmHg，发现尿蛋白微量，50g葡萄糖筛查 9.8mmol/L。假如孕妇已临产，首先应做哪项工作",["立即配血","停长效胰岛素","剖宫产","缩宫素点滴","人工破膜"],"B",1,"lc","妇产科","孕妇50g葡萄糖筛查9.8mmol/L（≥7.8mmol/L为异常）需进一步行OGTT明确糖尿病。临产后若正在使用长效胰岛素，因子宫收缩耗能增加、进食减少，低血糖风险高，且长效制剂难以调节，应首先停用长效胰岛素，改为短效胰岛素按血糖调整并监测血糖、尿酮体，同时配血备用。缩宫素、人工破膜、剖宫产须有产科指征。\n\n📚 出处：《妊娠合并糖尿病诊治指南(2014)》"],["新生儿臂丛神经麻痹，调制中频电疗开始治疗时机定为伤后",["1 周","2 周","3 周","4 周","5 周"],"B",1,"lc","儿科","新生儿臂丛神经麻痹伤后1周内局部水肿、渗出明显，过早电刺激可加重损伤；伤后2周水肿吸收、炎症消退，开始调制中频电疗可改善循环、松解粘连、促进神经再生与肌肉功能恢复，故B正确。同时应保持患肢功能位、被动活动关节以防挛缩，并辅以神经营养药物，多数轻症3～6个月内恢复。\n\n📚 出处：《临床诊疗指南·物理医学与康复分册》·臂丛神经损伤"],["关于子宫内膜异位症的表现，以下不正确的是",["月经异常","多有痛经，且呈进行性加重趋势","可有不孕","闭经","下腹或腰骶部疼痛"],"D",1,"lc","妇产科","子宫内膜异位症典型表现为继发性、进行性加重的痛经（约2/3患者）、下腹或腰骶部疼痛、性交痛、不孕（约40%）、月经异常（经量增多、经期延长、经前点滴出血），累及直肠膀胱者可有相应症状。但闭经不是其表现，内异症患者多月经量偏多，故D不正确。\n\n📚 出处：《妇产科学》第9版·子宫内膜异位症"],["关于站立前期先天性髋关节脱位的描述，哪项是不恰当的",["患者髋关节活动受限","患儿的会阴部增宽","肢体缩短","Ortolani 征阳性","Galeazzi 征阴性"],"E",1,"lc","运动与骨外科","站立前期（新生儿及婴儿期）发育性髋关节脱位：患髋外展活动受限，患侧肢体缩短，会阴部（双侧大腿内侧皮纹间距离）增宽，Ortolani试验（弹入征）及Barlow试验阳性。Galeazzi（Allis）征表现为患侧膝低于健侧，应为阳性，故“Galeazzi征阴性”描述不恰当。此期尚无骨性改变，及早发现可用Pavlik吊带治疗。\n\n📚 出处：《外科学》第9版·发育性髋关节脱位·临床表现与诊断"],["股动脉穿刺插管术后，通常穿刺点压迫多长时间后局部加压包扎",["3～5min","5～8min","6～10min","10～15min","15～20min"],"D",1,"lc","外科总论与麻醉","本题与lc160同题。股动脉穿刺拔管后须局部压迫10～15min，确认穿刺点无出血、远端动脉搏动良好后再加压包扎（沙袋或弹力绷带）并卧床制动，故D正确。压迫过短易形成血肿、假性动脉瘤或动静脉瘘；压迫过长则增加血栓风险。术后需监测足背动脉搏动、皮温、感觉与局部肿胀。\n\n📚 出处：《外科学》第9版·重症监测治疗与复苏"],["下列哪一项是慢性脓胸的特点",["胸水大量渗出","脓液稀薄，呈浆液性","脏、壁层胸膜纤维性增厚","纤维素膜在胸壁上附着不牢固，易脱落","患侧呼吸运动减弱，肋间隙饱满，叩诊呈浊音"],"C",1,"lc","呼吸系统","慢性脓胸的主要病理特点是脏、壁层胸膜因长期炎症沉积纤维素并机化，形成坚厚的纤维板，限制肺膨胀并使胸廓塌陷，故C为特征性表现。胸水大量渗出、脓液稀薄呈浆液性属急性脓胸早期表现；纤维素膜附着不牢固、易脱落亦为急性期特点（慢性期则机化牢固）；患侧肋间隙饱满见于急性脓胸，慢性脓胸因胸膜纤维收缩而肋间隙变窄、胸廓塌陷。\n\n📚 出处：《外科学》第9版·脓胸·慢性脓胸"],["肺动脉栓塞最具有特征意义的 CT 表现是",["局部肺透过度增高","肺的外围以胸膜为基底的楔状致密影","实变区内小透亮区","局限性肺血管稀少","增强扫描肺动脉主干或分支内充盈缺损"],"E",1,"lc","呼吸系统","CT肺动脉造影（CTPA）是诊断肺栓塞的首选影像方法，其特征性直接征象为增强后肺动脉主干或其分支内出现充盈缺损（部分呈轨道征、截断征），故E最具特征意义。局部肺透过度增高、以胸膜为基底的楔状致密影（Hampton驼峰）、局限性肺血管稀少（Westermark征）均为间接征象，敏感性低且不特异；实变内小透亮区与肺栓塞无特定关系。\n\n📚 出处：《内科学》第9版·肺血栓栓塞症·影像学检查"],["上颌窦穿刺冲洗一般在",["7岁后","8岁后","9岁后","2岁后","3岁后"],"B",1,"lc","眼耳鼻喉口腔","上颌窦穿刺冲洗经下鼻道外侧壁进针，须待窦腔发育成熟并取得患儿配合后才能施行。教材将“7岁以下窦腔尚未发育成熟、不能合作的儿童”列为禁忌证，故临床一般在7~8岁以后开展，幼儿多改用置换法或药物保守治疗。D、E年龄过小属禁忌，A、C无依据。本题按教材取8岁后。\n\n📚 出处：《耳鼻咽喉头颈外科学》第9版·鼻科学·鼻窦炎的诊断与治疗"],["下列哪项与二氧化碳潴留无明显关系",["搏动性头痛","白天嗜睡","贫血貌","心率加快","球结膜充血水肿"],"C",1,"lc","呼吸系统","CO2潴留使脑血管扩张、颅内压升高，出现搏动性头痛、球结膜充血水肿、白天嗜睡（肺性脑病早期）、心率加快与皮肤潮红多汗。贫血貌由血红蛋白降低所致，与CO2潴留无直接关系；实际上慢性缺氧可继发红细胞增多，故不出现贫血，C为答案。\n\n📚 出处：《内科学》第9版·呼吸衰竭·临床表现"],["最容易引起再生障碍性贫血的药物是",["氯霉素","磺胺嘧啶","环磷酰胺","保泰松","甲巯咪唑（他巴唑）"],"A",1,"lc","血液系统","氯霉素是药物性再生障碍性贫血最常见的原因：其硝基苯可抑制骨髓造血干细胞DNA合成，既引起剂量相关的可逆性骨髓抑制，也可引起与剂量无关的特异性体质反应型再障，发生率约1/2万～1/4万，病死率高。保泰松、甲巯咪唑、磺胺类及抗肿瘤药亦可致再障，但发生率相对较低。\n\n📚 出处：《内科学》第9版·再生障碍性贫血"],["Colles 骨折手法复位后应固定于",["掌屈尺偏位","背屈尺偏位","掌屈桡偏位","背屈桡偏位","极度旋后位"],"A",1,"lc","运动与骨外科","Colles骨折远端向背侧、桡侧移位并背倾，复位后应将腕关节固定于掌屈、尺偏位（并使前臂旋前），利用腕屈肌腱与桡侧软组织张力维持骨折端复位，同时纠正桡偏与背倾；石膏或小夹板固定4～6周。背屈位会加重远端背侧移位；桡偏位会加重桡偏畸形，均属禁忌；极度旋后位于Colles骨折不利（旋后位多用于Smith骨折的对应处理）。\n\n📚 出处：《外科学》第9版·上肢骨关节损伤·桡骨远端骨折"],["关于血胸的治疗，下列哪项是错误的",["不足 500ml 的血胸不需特殊处理","胸腔积血较多者应及早胸腔穿刺或闭式引流","胸腔穿刺抽血每次一般不超过 1000ml","凝固性血胸应在数日内剖胸清除积血和血块","机化性血胸一般应在伤后 3 个月以后行手术治疗"],"E",1,"lc","呼吸系统","机化性血胸宜在伤后2～3周内（多主张4～6周内）尽早手术剥除纤维板，以利肺膨胀、减少感染与胸廓塌陷；伤后3个月以后机化更重、胸膜增厚粘连，手术难度大、肺复张困难，故E错误。不足500ml的血胸可自行吸收，不需特殊处理（A对）；积血较多应及早穿刺或闭式引流（B对）；穿刺每次抽吸一般不超过1000ml以防复张性肺水肿（C对）；凝固性血胸应数日内剖胸清除积血与血块（D对）。\n\n📚 出处：《外科学》第9版·胸部损伤·血胸"],["下列临床表现哪项与良性葡萄胎不符",["腹痛","甲亢","妊高征","痰中带血","阴道流血"],"D",1,"lc","妇产科","良性葡萄胎的临床表现有停经后阴道流血（最常见）、子宫异常增大变软、腹痛（子宫快速膨胀或退缩时的钝痛）、妊娠期高血压疾病甚至子痫前期（多发生于孕20周前）、妊娠剧吐、约7%合并甲亢（hCG的TSH样作用）、卵巢黄素化囊肿。痰中带血提示肺转移，属侵蚀性葡萄胎或绒癌等恶性滋养细胞肿瘤的表现，与良性葡萄胎不符。\n\n📚 出处：《妇产科学》第9版·葡萄胎"],["以下哪项不是上肢运动功能检查项目",["拇、示、中指抓握、侧捏","拇指与其他各指的对捏","前臂的旋前旋后功能","运用上肢放置物体","两点分辨位置"],"E",1,"lc","运动与骨外科","上肢运动功能评定包括关节活动度、肌力、抓握与侧捏（拇、示、中指）、拇指与其他各指的对捏、前臂旋前旋后、以及在实际任务中运用上肢放置物体（如Carroll上肢功能试验、Jebsen手功能测试）。两点分辨觉属感觉功能（尤其手部感觉）检查，评价的是触觉空间辨别能力，不属于运动功能项目。\n\n📚 出处：《康复医学》第6版·上肢功能评定"],["5 岁患儿，晨起呕吐 3 次，后诉腹痛。就诊时面色苍白，呼吸促，唇微绀，萎靡，心音低钝，150 次/分，无杂音，呼吸音粗，腹略胀，神经系统检查阴性。初步诊断为",["急性肠胃炎，伴水电解质紊乱","休克早期","心衰早期","中毒性肺炎","暴发性心肌炎"],"E",1,"lc","儿科","5岁患儿以呕吐腹痛起病，随后出现面色苍白、萎靡、呼吸促、唇微绀、心音低钝、心率150次/分，无杂音而全身中毒症状重，符合暴发性心肌炎（多为柯萨奇病毒B组感染）的急性心功能不全表现，故E正确。急性胃肠炎无面色苍白、心音低钝与呼吸促；休克早期应有血压下降与末梢循环差；心衰早期多有肝大、水肿、肺啰音；中毒性肺炎以肺部体征和高热为主。应立即心电监护、查心肌酶与心电图。\n\n📚 出处：《儿科学》第9版·病毒性心肌炎"],["男性患者，30 岁，直接暴力致左桡骨小头骨折合并该部位桡神经损伤。应该出现下面哪种运动障碍",["不能伸肘关节、腕关节及掌指关节","不能背伸腕关节","能背伸腕关节，但不能背伸掌指关节","不能背伸末节指间关节","外展拇指功能丧失"],"C",1,"lc","神经与精神","桡神经在肘部分为浅支（感觉支）与深支（骨间后神经，纯运动支），深支经旋后肌（Frohse 弓）进入前臂后侧，支配指总伸肌、拇长伸肌、尺侧腕伸肌等。桡骨小头骨折易伤及深支，而由桡神经主干较早发出分支支配的肱桡肌、桡侧腕长伸肌功能保留，故腕关节仍能背伸（桡偏方向），但掌指关节及拇指不能背伸，表现为“伸指不能而伸腕存在”。若损伤在肘上（肱骨中下 1/3），则伸肘、伸腕、伸指均不能。\n\n📚 出处：《外科学》第9版·周围神经损伤·桡神经损伤"],["下列不作为考核甲亢疗效指标的是",["基础代谢率","休息时心率","T3、T4 水平","TSH 水平","甲状腺吸碘率"],"E",1,"lc","内分泌与代谢","甲状腺摄碘率受含碘食物、药物、造影剂干扰大，且抗甲状腺药治疗后其下降滞后于激素水平变化，甲亢治疗中可出现“吸碘率仍低而激素已正常”的分离，故不能作为考核疗效的指标，答E；它主要用于病因鉴别与131I治疗前评估。BMR、静息心率反映代谢状态，T3、T4反映激素水平是否达标，TSH是调整药量与停药判断的重要指标，均为常用疗效指标。\n\n📚 出处：《内科学》第9版·甲状腺功能亢进症·疗效判断与随访"],["抢救巴比妥类中毒所致呼吸衰竭的首要措施是",["呼吸兴奋剂的应用","洗胃","保持呼吸道通畅，人工辅助呼吸","激素的应用","利尿药物的应用"],"C",1,"lc","呼吸系统","巴比妥类中毒抑制呼吸中枢，抢救呼吸衰竭的首要措施是保持呼吸道通畅、清除口腔分泌物与误吸物，并给予人工辅助通气（面罩加压给氧或气管插管机械通气），保证通气与氧合。呼吸兴奋剂在气道不通畅或有明显中枢抑制时疗效有限且增加耗氧；洗胃为清除毒物的措施，需在气道保护下进行；激素、利尿剂均非纠正呼衰的首要手段。\n\n📚 出处：《内科学》第9版·急性中毒·巴比妥类药物中毒"],["关于“尿钠排泄分数(FENa)”，下列哪项描述正确",["FENa＝［(血清 Na/血清 Cr)/(尿 Na/尿 Cr)］%","FENa＝［(血清 Na/尿 Na)/(血清 Cr/尿 Cr)］%","FENa＝［(血清 Cr/尿 Cr)/(血清 Na/尿 Na)］%","FENa＝［(尿 Na/尿 Cr)/(血清 Na/血清 Cr)］%","FENa＝［(尿 Cr/尿 Na)/(血清 Cr/血清 Na)］%"],"D",1,"lc","泌尿系统","尿钠排泄分数FENa=(尿钠×血肌酐)/(血钠×尿肌酐)×100%，即[(尿Na/尿Cr)/(血Na/血Cr)]%，表示滤过的钠中被排出的比例。肾前性氮质血症FENa<1%，急性肾小管坏死FENa>2%，是鉴别肾前性与肾性急性肾损伤的重要指标。其余选项分子分母颠倒。故答D。\n\n📚 出处：《内科学》第9版·急性肾损伤"],["下列不能推算预产期的项目是",["早孕反应开始出现的时间","胎动开始时间","手测子宫底高度","尺测耻上子宫长度","腹围"],"E",1,"lc","临床综合","预产期推算主要依据末次月经，并可用早孕反应出现时间（约6周）、初觉胎动时间（约18～20周）、手测宫底高度及尺测耻上子宫长度核对或推算孕周，故A、B、C、D均可用。腹围受孕妇体型、肥胖、羊水量、多胎、胎位等影响，个体差异大且与孕周无稳定对应关系，不能用于推算预产期，故选E。\n\n📚 出处：《妇产科学》第9版·妊娠诊断"],["白塞病针刺实验阳性是指",["局部出现红斑呈直径＞1cm","局部出现结节","局部出现白疱疹＞1cm","有红丘疹或红丘疹伴有白疱疹","以上都不是"],"D",1,"lc","临床综合","白塞病针刺反应（同形反应）试验：以20号针头无菌条件下斜刺前臂皮肤，48小时后观察，局部出现红丘疹或红丘疹伴白疱疹（脓疱）者为阳性，故选D。仅有红斑直径>1cm（A）、结节（B）、白疱疹>1cm（C）均不符合判定标准。该试验特异性较高，且与疾病活动性相关，多见于病情活动期。\n\n📚 出处：《内科学》第9版·贝赫切特病"],["小儿肠套叠重要表现是",["铁锈样稀便","奶样脓便","果酱样血便","粘液样血便","点滴样血便"],"C",1,"lc","儿科","小儿肠套叠典型表现为阵发性哭闹、呕吐、果酱样黏液血便及腹部腊肠样包块（四大症状），其中果酱样血便最具特征性，故C正确。铁锈样稀便见于阿米巴痢疾或肠阿米巴病；奶样脓便提示细菌性痢疾或侵袭性肠炎；粘液样血便见于结肠炎、息肉；点滴样血便多见于肛裂或直肠息肉。X线空气或钡剂灌肠可见“杯口状”阴影。\n\n📚 出处：《儿科学》第9版·肠套叠"],["Coombs 试验直接法和间接法的主要区别是",["前者是检测完全抗体，后者是检测不完全抗体","前者是凝集反应，后者是沉淀反应","两者判断结果的方法不同","前者是检测 IgG 型抗体，后者是检测 IgM 型抗体","前者是检测在体内已致敏的红细胞上的不完全抗体，后者是检测游离在血清中的不完全抗体"],"E",1,"lc","临床综合","直接Coombs试验检测已吸附于患者红细胞表面的不完全抗体（IgG或补体），用于自身免疫性溶血、新生儿溶血病及药物性溶血的诊断；间接Coombs试验检测血清中游离的不完全抗体，用于交叉配血与抗体筛查，故E正确。两者均为凝集反应、检测对象同为不完全抗体，故A、B、D错误；观察结果的方法相同，C亦错。\n\n📚 出处：《内科学》第9版·自身免疫性溶血性贫血"],["插入电活动是指肌肉神经支配正常时，针插入或移动可诱发的电活动，此电位短于",["0.3s","0.4s","0.5s","0.6s","0.7s"],"A",1,"lc","神经与精神","插入电位是针电极插入或移动时机械刺激肌纤维膜引起的短暂电活动，正常肌肉表现为持续数百毫秒以内（短于 0.3 秒）的高频不规则棘波，随后迅速消失。若插入电位延长（超过 0.3 秒仍不消失或持续出现）提示肌膜兴奋性增高，见于肌强直或早期失神经；若减弱或消失，提示肌肉萎缩、纤维化或严重失神经后肌纤维被脂肪结缔组织替代。故以“短于 0.3 秒”为非异常的时间界限。\n\n📚 出处：《康复医学》第6版·神经电生理检查·肌电图"],["在临床诊疗或开展临床试验研究时，应首先坚持",["诚实原则","保守秘密原则","互相协作原则","公正原则","知情同意原则"],"E",1,"lc","临床综合","临床诊疗与临床试验研究首先应坚持知情同意原则：医师须向患者或其法定代理人说明病情、方案、预期获益与风险，取得自愿同意后方可实施，这是尊重患者自主权、保障受试者权益的核心，故选E。诚实、保密、协作、公正虽同为基本伦理原则，但在涉及人体诊疗与试验时均以知情同意为前提。\n\n📚 出处：《医学伦理学》·医学伦理原则（知情同意）"],["导致碳氧血红蛋白血症的毒物是",["有机磷","吗啡","乙醇","一氧化碳","安眠药"],"D",1,"lc","血液系统","一氧化碳与血红蛋白结合力为氧的210～250倍，形成碳氧血红蛋白使其丧失 科学》第9版·子宫肌瘤"],["47 岁女性，月经不规律伴经量增多 2 年。本次停经 3 个月后出血已 12天，量仍多，今以出血多伴头晕就诊。妇科检查：阴道内有多量鲜血和血块，宫颈光滑，宫体大小正常，附件无异常。首选的诊疗措施是",["止血药和抗生素静脉滴注","口服止血药","诊断性刮宫，支持疗法","大剂量雌激素止血并支持疗法","大剂量孕激素止血并支持疗法"],"C",1,"lc","妇产科","47岁、月经紊乱2年，停经3个月后出血12天且量多伴头晕（可能已有贫血），为围绝经期异常子宫出血。首选诊断性刮宫：既迅速止血，又可获得内膜病理以排除子宫内膜癌及癌前病变，同时给予补液、输血等支持治疗。止血药、抗生素无效；大剂量雌/孕激素止血在未除外内膜癌前不宜作为首选。\n\n📚 出处：《妇产科学》第9版·异常子宫出血"],["反复呕吐最可能继发的情况是",["低氯高钾碱中毒","低氯低钾碱中毒","低氯低钾酸中毒","高钾高钠碱中毒","高钾酸中毒"],"B",1,"lc","消化系统","反复呕吐丢失大量含HCl的胃液，导致血氯降低；胃液中钾随之丢失，加之血容量不足继发醛固酮增多使尿钾排出增多，形成低钾；低钾时细胞内H⁺外移、肾小管泌H⁺增加，碱中毒持续并难以纠正，故为低氯低钾性代谢性碱中毒，B正确。A、D、E的高钾或高钠不符合，C的酸中毒方向相反。\n\n📚 出处：《外科学》第9版·水电解质与酸碱平衡失调·代谢性碱中毒"],["髂骨骨内板切取较容易，切取髂骨骨外板后有时可导致术后臀区疼痛甚至跛行，其原因是",["腹股沟韧带附着点破坏","臀大肌附着破坏","腹膜损伤","极易发生血肿所致","皮肤神经损伤"],"B",1,"lc","运动与骨外科","髂骨外板（外面）为臀大肌、臀中肌及臀小肌的起始部，切取外板会破坏臀肌附着与骨膜，术后臀肌收缩牵拉、肌肉萎缩与瘢痕粘连，引起臀区疼痛、外展无力甚至跛行；髂骨内板（内面）为髂肌附着，且取骨后对负重与步态影响小，操作也较容易。腹股沟韧带附着于髂前上棘、腹膜位于内面，皮肤神经损伤与血肿并非该症状主因。\n\n📚 出处：《实用骨科学》第5版·骨移植·自体骨切取"],["关于免疫缺陷病的论述，下列哪项不正确",["是由于免疫细胞和免疫分子发生缺陷所致的一组临床综合征","抗感染能力低下","免疫监测功能异常","分为原发性和继发性免疫缺陷病两大类","可通过主动免疫来纠正"],"E",1,"lc","风湿免疫","免疫缺陷病是免疫细胞（T、B、吞噬细胞、补体）或免疫分子发育、分化缺陷所致的一组临床综合征（A），其共同特点是抗感染能力低下、易发生反复严重感染（B），免疫监视功能异常致肿瘤发生率升高（C），按病因分原发性和继发性两大类（D）。E 说可通过主动免疫纠正错误：主动免疫（接种疫苗）依赖机体自身正常的免疫应答能力，免疫缺陷者应答低下，且接种活疫苗可致严重感染，治疗主要靠免疫替代（丙种球蛋白、酶替代）、免疫重建（造血干细胞移植）和对症防治感染，故 E 不正确。\n\n📚 出处：《医学免疫学》第7版·免疫缺陷病"],["对于骨盆测量的描述，恰当的是",["髂棘间径是测量两侧髂嵴外缘的距离","髂棘间径是测量两侧髂前上棘内侧缘的距离","髂棘间径是测量两侧髂前上棘外缘的距离","髂棘间径是测量两侧髂嵴内缘的距离","髂棘间径是推测中骨盆横径的长度"],"C",1,"lc","妇产科","髂棘间径（IS）是测量两侧髂前上棘外缘的距离，正常23～26cm，间接反映骨盆入口横径；髂嵴间径（IC）才是两侧髂嵴外缘的距离（正常25～28cm）。故C正确。A、D混淆了髂嵴与髂棘；B方向错（应为外缘）；E错误：推测中骨盆横径的是坐骨棘间径。\n\n📚 出处：《妇产科学》第9版·女性生殖系统解剖"],["28岁孕妇，3年前孕20周时因胎儿多发畸形(唇腭裂、脊柱裂、先天性心脏病、单脐动脉)行中期引产，胎儿染色体检查提示为18-三体。现为孕17周，应选择下列哪种方法进行产前诊断",["绒毛活检行绒毛染色体核型分析","羊膜腔穿刺行羊水细胞染色体核型分析","脐带血穿刺行脐带血染色体核型分析","对夫妻双方行染色体核型分析","羊膜腔穿刺行羊水乙酰胆碱酯酶的测定"],"B",1,"lc","妇产科","孕17周（孕中期）是羊膜腔穿刺的最佳时机（16～22周），抽取羊水细胞培养行染色体核型分析，可诊断18-三体等染色体异常，安全性与成功率高。绒毛活检宜在10～13周，现已过时机且流产风险略高；脐血穿刺一般在20周后进行，风险较高；夫妻核型分析不能诊断本次胎儿；乙酰胆碱酯酶测定用于神经管缺陷。\n\n📚 出处：《妇产科学》第9版·产前诊断"],["患者女，36 岁，因烧伤致头顶部瘢痕性秃发 3 年。查体：头顶部瘢痕面积 10cm×8cm，无毛发生长，瘢痕较柔软，与基底颅骨间有一定滑动性。首选的手术方法为",["瘢痕切除，双巨大头皮瓣旋转修复","瘢痕分期切除","应用显微毛发移植方法种植","应用簇状毛发移植方法种植","应用组织扩张器扩张头皮，瘢痕切除后修复头皮缺损"],"E",1,"lc","神经与精神","头皮瘢痕性秃发面积 10cm×8cm（约 80cm²），超过可直接切除缝合或单次旋转皮瓣修复的限度（一般宽度 5cm 以内可直接缝合）。最佳方案是先在正常头皮下埋置皮肤软组织扩张器，定期注水扩张 2～3 个月获得额外头皮，二期切除瘢痕后以扩张皮瓣覆盖，可获得有毛发的头皮、外形好、瘢痕少。双巨大头皮瓣旋转创伤大、张力高；瘢痕分期切除仅适用于狭长条状瘢痕；毛发移植适用于小面积瘢痕或补充，80cm² 全部种植成活率低、密度不足。\n\n📚 出处：《外科学》第9版·皮肤软组织扩张术"],["COPD 导致的Ⅱ型呼吸衰竭，动脉血气分析示呼酸合并代碱。则血电解质检查一般有",["高血氯","低钙血症","高钠血症","低氯血症","高钙血症"],"D",1,"lc","呼吸系统","COPD所致Ⅱ型呼衰长期CO2潴留，肾代偿性排H⁺、重吸收HCO3⁻，HCO3⁻升高使血氯相应降低（低氯血症）；加之利尿剂（如呋塞米、氢氯噻嗪）排氯、呕吐或激素致氯丢失，血氯进一步下降。呼酸合并代碱时血HCO3⁻明显升高而Cl⁻降低，呈低氯性碱中毒，故D正确。高血氯见于代酸或过多输注生理盐水；血钠、血钙变化无规律性，与呼酸合并代碱无必然联系，故A、B、C、E均不选。\n\n📚 出处：《内科学》第9版·呼吸衰竭·酸碱失衡"],["关于子宫肌瘤的手术，以下哪项最不恰当",["黏膜下肌瘤可使用宫腔镜切除","希望保留生育功能的行肌瘤切除术","年龄 45 岁，肌瘤直径>5cm 行子宫加双侧附件切除","突出脱于阴道的肌瘤，可经阴道切除","肌瘤较大不需要保留生育功能的行子宫切除"],"C",1,"lc","妇产科","子宫肌瘤手术方式应结合年龄、生育要求、肌瘤部位与数目：黏膜下肌瘤可经宫腔镜切除；希望生育者行肌瘤切除术；脱出阴道内的黏膜下肌瘤可经阴道摘除；肌瘤大且不需生育者可子宫切除。年龄45岁、肌瘤>5cm即常规切除双侧附件则过于激进——卵巢有内分泌功能，除非绝经或卵巢有病变，否则应尽量保留，故C最不恰当。\n\n📚 出处：《妇产科学》第9版·子宫肌瘤"],["2 岁男孩，生后反复患肺炎、腹泻及革兰阴性菌败血症。其血清 IgG8g/L(800mg/dl)，IgA700mg/L(70mg/dl)，IgM60mg/L(6mg/dl)，外周血淋巴细胞数正常，骨髓找到浆细胞，细胞免疫功能测定均正常。最可能的诊断为",["先天性低丙种球蛋白血症","选择性 IgA 缺乏症","选择性 IgM 缺乏症","获得性免疫缺陷综合征","婴幼儿暂时性低丙种球蛋白血症"],"E",1,"lc","呼吸系统","2岁男童生后反复肺炎、腹泻及革兰阴性菌败血症，IgG、IgA、IgM总量均在正常甚至偏高范围，外周血淋巴细胞正常、骨髓见浆细胞、细胞免疫功能正常，符合婴幼儿暂时性低丙种球蛋白血症：婴儿自母体获得的IgG在3～6月龄后下降，自身合成IgG延迟至2～3岁方达正常，出现反复感染，多在2～4岁自行缓解，期间抗体反应可一过性减弱。先天性低丙种球蛋白血症见于男性患儿、各类Ig显著减低、B细胞缺如；选择性IgA缺乏仅IgA降低；选择性IgM缺乏时IgM极低；AIDS有细胞免疫缺陷与淋巴细胞减少。\n\n📚 出处：《儿科学》第9版·原发性免疫缺陷病·暂时性低丙种球蛋白血症"],["抑郁发作的核心症状是",["意志活动减退","躯体不适","思维迟缓","情感低落、意志活动减退、思维迟钝","情感低落、兴趣减退及快感丧失"],"E",1,"lc","神经与精神","按 ICD-10，抑郁发作的核心症状为三条：心境（情感）低落、兴趣与愉快感丧失（快感缺失）、精力下降易疲劳（活动减少）。附加症状包括注意力下降、自我评价降低、自罪观念、前途暗淡、自伤自杀观念与行为、睡眠障碍、食欲改变等。思维迟缓与意志活动减退属附加或伴随症状；把情感低落、思维迟缓、意志减退并列为“三低”是内源性抑郁的综合征描述而非核心症状标准；躯体不适更非核心。诊断还需病程≥2 周、社会功能受损并排除器质性与物质所致。\n\n📚 出处：《精神病学》第8版·心境障碍·抑郁发作的诊断标准"],["有关颅咽管瘤的叙述，下列哪项不正确",["多见于成人","大多位于鞍上","囊性变占多数","肿瘤常有钙化","治疗以手术为主"],"A",1,"lc","神经与精神","颅咽管瘤好发于儿童及青少年（高峰 5～14 岁），是儿童最常见的鞍区肿瘤，成人相对少见，故“多见于成人”不正确。约 70%～95% 位于鞍上；多为囊性或囊实性，囊液呈机油样含胆固醇结晶；约 70%～90% 可见蛋壳样或斑块状钙化，是儿童鞍上钙化最常见原因；治疗以手术切除为主，术后需长期随访内分泌功能与视野。\n\n📚 出处：《外科学》第9版·颅内肿瘤·颅咽管瘤"],["关于胸膜和胸膜腔的描述，以下错误的是",["壁胸膜可分为肋胸膜、膈胸膜、纵隔胸膜和胸膜顶","胸膜腔呈负压","左右两侧胸膜腔之间是相通的","肋膈隐窝是坐立位时胸膜腔最低点","脏胸膜除覆于肺表面外，并伸入肺裂内与肺实质紧密连接"],"C",1,"lc","呼吸系统","左右两侧胸膜腔互不相通，各自独立封闭，仅通过各自肺门与纵隔相邻，故C错误。壁胸膜按部位分为肋胸膜、膈胸膜、纵隔胸膜与胸膜顶（A对）；胸膜腔内为负压，随呼吸在-0.3～-0.8kPa间变化（B对）；坐立位时肋膈隐窝位置最低、容量最大，是胸腔积液最先积聚与穿刺抽液的部位（D对）；脏胸膜紧贴肺表面并深入斜裂、水平裂与肺实质紧密相连（E对）。\n\n📚 出处：《系统解剖学》第9版·呼吸系统·胸膜与胸膜腔"],["检查管型、细胞等有形成分最适宜的标本是",["空腹尿","餐后尿","随机尿","首次晨尿","3 小时尿"],"D",1,"lc","基础与预防医学","首次晨尿在膀胱内潴留 6～8 小时，尿液浓缩、偏酸，红细胞、白细胞、上皮细胞、管型、结晶等有形成分形态保存完整，且不受运动与饮食影响，是尿沉渣及管型检查最适宜的标本，故 D 正确。A 空腹尿非标准标本类型，仅强调未进食；B 餐后尿适用于尿糖、尿蛋白测定；C 随机尿用于急诊过筛；E 3 小时尿多用于细胞排出率（如 Addis 计数）等定量检查。\n\n📚 出处：《诊断学》第9版·尿液检查"],["下列何项不属于宫颈癌术后并发症",["心衰","感染","淋巴囊肿","尿潴留","输尿管瘘"],"A",1,"lc","妇产科","宫颈癌根治术（广泛性子宫切除+盆腔淋巴结清扫）常见并发症为：泌尿系统（尿潴留、输尿管阴道瘘、膀胱阴道瘘）、淋巴囊肿、感染、出血、深静脉血栓、肠梗阻等。心衰并非宫颈癌术后特异并发症，与手术直接相关性最小，故选A。\n\n📚 出处：《妇产科学》第9版·子宫颈癌"],["蕈样肉芽肿是一种",["异物肉芽肿","真菌性肉芽肿","低度恶性的组织细胞瘤","B 淋巴细胞淋巴瘤","T 淋巴细胞淋巴瘤"],"E",1,"lc","临床综合","蕈样肉芽肿是原发于皮肤的成熟T细胞淋巴瘤（CD4+亲表皮性T细胞），病程分斑片、斑块、肿瘤三期，进展缓慢，早期易误诊为湿疹、银屑病，故选E。其名称源于皮损呈蕈样斑块，并非组织学肉芽肿，故A、B错误；也不是低度恶性组织细胞瘤或B细胞淋巴瘤（C、D错）。确诊依靠皮肤病理与免疫表型、T细胞受体基因重排。\n\n📚 出处：《皮肤性病学》第9版·皮肤淋巴瘤（蕈样肉芽肿）"],["PCSA(patient controlled subcutaneous analgesia)适用于静脉穿刺困难的患者，以下哪种观点不正确",["药物在皮下可能有存留","生物利用度约为静脉给药的 60%","起效慢于静脉给药，镇痛效果与 PCIA 相似","如采用留置管应注意可能发生导管堵塞或感染","哌替啶具有组织刺激性不宜用于 PCSA"],"B",1,"lc","心血管系统","皮下自控镇痛（PCSA）的药物经皮下吸收较慢，起效迟于静脉给药，但吸收较完全，生物利用度可达80%以上（并非约60%），镇痛效果与PCIA相当；皮下可能存在药物存留，留置管可发生堵塞或感染；哌替啶有组织刺激性，不宜用于皮下给药。故不正确的观点为B。\n\n📚 出处：《疼痛诊疗学》第3版·术后镇痛·皮下自控镇痛"],["男性，22 岁，车祸致前臂掌侧近段皮肤缺损 3 小时。肌肉外露，创面约",["8cm×6cm，同时伴有血气胸。对前臂创面的处理，正确的是 只能用局部皮瓣修复","首选游离皮肤移植修复","只能用远位皮瓣修复","只能用游离植皮修复","首选用游离皮瓣修复"],"B",1,"lc","皮肤性病","前臂掌侧皮肤缺损伴肌肉外露，肌肉血运丰富，可生长肉芽并支持游离皮片成活，故首选游离皮肤移植（中厚或刃厚皮片）覆盖创面，手术简便、耗时短。患者同时存在血气胸，处于创伤危重状态，不耐受耗时长、创伤大的局部、远位或游离皮瓣手术。A、C、D“只能”表述绝对，E不符合全身条件，故B正确。\n\n📚 出处：《外科学》第9版·皮肤软组织缺损的修复"],["患者男，40 岁，农民。因门脉高压症，食管胃底静脉曲张破裂出血引起休克。下列关于全血的说法哪项不正确",["全血在 4℃保存一天后粒细胞和血小板功能不减低","第Ⅷ因子在全血 、人流、会阴侧切）引起内膜种植、人工流产时不要突然降低宫腔内负压。输卵管通液术、子宫输卵管造影等应在月经干净后3～7天进行，月经前操作易将内膜推向盆腔并增加感染风险，故E错误。\n\n📚 出处：《妇产科学》第9版·子宫内膜异位症"],["患者，男性，13 岁。食蚕豆后突然畏寒、发热、皮肤发黄。化验：血红蛋白 70g/L，网织红细胞 0.15，尿胆原阳性，胆红素阴性。对明确诊断最重要的检查是",["血总胆红素测定","酸化血清溶血试验","抗人球蛋白试验","骨髓检查","高铁血红蛋白还原试验"],"E",1,"lc","泌尿系统","食蚕豆后突发急性溶血、贫血、黄疸，网织红细胞明显升高、尿胆原阳性而尿胆红素阴性，符合葡萄糖-6-磷酸脱氢酶(G6PD)缺乏症。G6PD缺乏时高铁血红蛋白还原能力下降，高铁血红蛋白还原试验（或荧光斑点试验、G6PD活性测定）为确诊关键；酸化血清溶血试验查PNH，抗人球蛋白试验查自身免疫性溶血。故答E。\n\n📚 出处：《内科学》第9版·溶血性贫血（G6PD缺乏症）"],["治疗重症药疹应早期足量给予的药物是",["大量抗生素","抗过敏药物","糖皮质激素","钙剂","维生素针"],"C",1,"lc","临床综合","重症药疹（大疱性表皮松解坏死型、重症多形红斑型、剥脱性皮炎型等）属严重变态反应，治疗关键是及早、足量使用糖皮质激素以迅速控制炎症、减轻表皮坏死与内脏损害，必要时联合静脉丙种球蛋白或免疫抑制剂，故选C。抗生素仅在合并或高度怀疑感染时应用（A错）；抗过敏药、钙剂、维生素只能作为辅助，不能替代激素（B、D、E错）。\n\n📚 出处：《皮肤性病学》第9版·药疹"],["男性，16 岁。外伤后眼球摘除 1 年，伴有上睑瘢痕性睑外翻，需要整形修复外观。其整形修复术中不宜采取的是",["先行睑外翻矫正，恢复眼睑闭合功能","需行眶内容物填充","植入义眼台术后 1 周可配制临时义眼片","眶内缺损首选黏膜移植修复","义眼台材料常用硅凝胶"],"E",1,"lc","运动与骨外科","眼球摘除后眼窝凹陷整形的义眼台（眶内植入物）常用材料为羟基磷灰石、多孔聚乙烯（Medpor）等，其特点是多孔、可血管化、组织相容性好、不易排出与感染；硅凝胶（硅橡胶）组织相容性差、易发生排异与脱出、不能血管化，已不作为义眼台常用材料，故为不宜采取项。其余各项正确：应先行睑外翻矫正恢复眼睑闭合、需行眶内容物填充、植入义眼台术后约1周可试戴临时义眼片、眶内黏膜缺损可选黏膜移植修复。\n\n📚 出处：《眼科学》第9版·眼窝畸形·义眼台植入"],["关于手外伤的术后处理，下述不正确的是",["抬高患肢防止肿胀","注射破伤风抗毒血清","将桡茎突部的敷料剪开","术后用石膏托将手固定于伸直位","包扎时用纱布隔开手指同时露出指尖"],"D",1,"lc","外科总论与麻醉","手外伤术后应将手固定于功能位：腕背伸20°～30°、掌指关节屈曲45°～70°、近指间关节屈曲45°、拇指外展对掌，而非伸直位；伸直位固定会造成关节僵硬、肌腱粘连和功能丧失，故D不正确。抬高患肢消肿（A对）、注射破伤风抗毒素（B对）、剪开桡骨茎突处敷料防压迫（C对）、手指分开并露出指端观察血运（E对）均正确。\n\n📚 出处：《外科学》第9版·手外伤"],["侧腭突来自于",["中鼻突","侧鼻突","上颌突","球状图","联合突"],"C",1,"lc","临床综合","胚胎期腭由三个突起发育融合而成：中鼻突形成鼻中隔及上颌前部，两侧上颌突的腭突（侧腭突）向中线生长并融合形成腭的大部（继发腭），故C正确。侧鼻突形成鼻侧部与鼻翼；球状突来自中鼻突，形成上唇人中及前颌部分；联合突参与下颌与舌的发育。侧腭突未能与鼻中隔融合即形成腭裂。\n\n📚 出处：《口腔颌面外科学》第8版·口腔颌面部发育"],["患者女，50 岁，进行性吞咽困难 2 个月。诊为食管癌，入院行食管癌根治术，切开见肿块突出于腔内。试问食管癌大体临床分型应除外以下哪项",["巨食管","髓质型","缩窄型","蕈伞型","溃疡型"],"A",1,"lc","消化系统","食管癌的大体（肉眼）分型为髓质型、蕈伞型、溃疡型、缩窄型四型，早期另分隐伏型、糜烂型、斑块型、乳头型，故B、C、D、E均在分型之内。巨食管是贲门失弛缓症长期梗阻致食管极度扩张的表现，属另一种疾病，不是食管癌的大体类型，故选A。\n\n📚 出处：《外科学》第9版·食管疾病·食管癌病理分型"],["慢性宫颈炎出现腰骶部疼痛是由于",["宫颈腺体囊肿","宫颈息肉","宫颈肥大","炎症扩散到盆腔","宫颈外翻"],"D",1,"lc","妇产科","慢性宫颈炎本身多无症状，但当炎症沿子宫骶韧带、宫旁组织扩散至盆腔结缔组织时，可出现腰骶部疼痛、下腹坠痛及痛经，且常在劳累、性交或月经前后加重。宫颈腺囊肿、息肉、肥大、柱状上皮异位本身均不引起腰骶痛，故答案为炎症扩散到盆腔。\n\n📚 出处：《妇产科学》第9版·子宫颈炎症"],["要素饮食，1ml 溶液中含有热量",["3.25kJ","4.18kJ","2.75kJ","6.25kJ","5.36kJ"],"B",1,"lc","理化与中毒","要素饮食是以氨基酸或短肽、单糖或双糖、脂肪酸、维生素、无机盐和微量元素配成的无渣肠内营养制剂，可经口或管饲，无需消化即可吸收，适用于胃肠功能部分受损者。其标准能量密度为 4.18kJ/ml（即 1kcal/ml），与整蛋白配方相近，用量按 25～30kcal/(kg·d) 计算。3.25kJ、2.75kJ、5.36kJ、6.25kJ 均非其标准能量密度，故选 B。\n\n📚 出处：《外科学》第9版·外科营养支持"],["最适合行输卵管结扎术的时间是",["月经干净后3～7天","月经干净后2周","哺乳期","分娩后56天","人工流产后42天"],"A",1,"lc","妇产科","输卵管结扎术的最佳时机为月经干净后3～7天（此期无排卵可能、内膜薄、出血少）；也可在人工流产或剖宫取胎的同时、正常分娩后24小时内、哺乳期（排除妊娠后）施行。分娩后56天、人流后42天、月经干净2周均非推荐时机。\n\n📚 出处：《妇产科学》第9版·避孕节育"],["双胎妊娠胎盘检查发现两个羊膜囊的中隔为 2 层羊膜，受精卵的分裂发生于",["囊胚期","桑椹期前","羊膜囊形成后","原始胚盘形成后","受精后 13 天以上"],"A",1,"lc","妇产科","双胎的绒毛膜性由受精卵分裂时间决定：分裂发生于桑葚期前（受精后72小时内）形成双绒毛膜双羊膜囊（双绒双羊）；发生于囊胚期（受精后4～8日，即内细胞团与滋养细胞分化后、羊膜囊形成前）形成单绒毛膜双羊膜囊（单绒双羊），胎盘间中隔仅两层羊膜；发生于羊膜囊形成后（受精后9～13日）为单绒单羊；13日以上为联体双胎。故本题对应囊胚期。\n\n📚 出处：《妇产科学》第9版·多胎妊娠"],["男性，32 岁，诊断为风湿性心脏病二尖瓣关闭不全 5 年。心脏听诊不可能出现下列哪项体征",["心尖部第 1 心音亢进","心尖部闻及第 3 心音","心尖部短促的舒张中期杂音","心尖部收缩期杂音向胸骨左缘及心底部传导","心尖部收缩期杂音向左腋下传导"],"A",1,"lc","心血管系统","二尖瓣关闭不全时收缩期血液反流入左房，左房压迅速上升且瓣叶对合不良，第一心音减弱（而非亢进）；大量反流可产生第三心音，舒张期经二尖瓣血流量增多可产生短促舒张中期杂音，收缩期杂音向左腋下及左肩胛下区传导。故不可能出现的体征是心尖部第一心音亢进，选A。\n\n📚 出处：《内科学》第9版·心脏瓣膜病·二尖瓣关闭不全"],["男孩，11 个月，发热 5 天，咳嗽 2 天，稀便 1～2 次。左下肢不会活动半天，诊断为脊髓灰质炎。有关脊髓灰质炎瘫痪的恢复，以下哪项是错误的",["瘫痪恢复早晚与神经病变程度有关","病后 1～2 个月内恢复最快","2～3 个月无进步者往往发生肌肉萎缩","1～2 年内仍不恢复者为后遗症","面、腭、咽、肠及膀胱的瘫痪最难恢复"],"E",1,"lc","神经与精神","脊髓灰质炎瘫痪的恢复规律：热退后瘫痪停止进展，病后 1～2 个月内恢复最快，恢复早晚与神经病变程度有关；2～3 个月无进步者常发生肌肉萎缩；1～2 年内仍不恢复者为后遗症。该病主要累及脊髓前角运动神经元，面、腭、咽、肠及膀胱的瘫痪相对少见且多能较快恢复，而肢体（尤其下肢）近端大肌群瘫痪恢复最差，故“面、腭、咽、肠及膀胱的瘫痪最难恢复”错误，为本题所选。\n\n📚 出处：《儿科学》第9版·神经系统疾病·脊髓灰质炎"],["关于急性 ITP，下列哪项说法是正确的",["多见于女性","多见于成人","骨髓巨核细胞以幼稚型为主","大多数患者可迁延不愈转为慢性型","血小板寿命正常"],"C",1,"lc","临床综合","急性免疫性血小板减少症（急性ITP）多见于儿童，起病急、多为自限性，约80%在6个月内缓解，故A、B、D与急性型不符。骨髓象示巨核细胞数正常或增多，以幼稚型（未成熟）巨核细胞为主，产板型巨核细胞减少，故C正确。血小板寿命明显缩短至数小时至数天，而非正常，故E错误。治疗首选糖皮质激素，危重者用IVIG。\n\n📚 出处：《内科学》第9版·免疫性血小板减少症"],["发现风疹患儿应隔离到出疹后几天",["3 天","5 天","7 天","9 天","14 天"],"B",1,"lc","儿科","风疹患儿自出疹前7天至出疹后5天均有传染性，故应隔离至 （组织液蛋白含量低、受重力影响）的特点。故选A。\n\n📚 出处：《诊断学》第9版·水肿·局部性水肿的特点"],["目前临床最常用的维持性腹膜透析方式是",["间歇性腹膜透析(IPD)","急性腹膜透析(APD)","持续非卧床腹膜透析(CAPD)","持续循环腹膜透析(CCPD)","夜间腹膜透析(NPD)"],"C",1,"lc","泌尿系统","持续非卧床腹膜透析(CAPD)每日手工换液4次、白天留腹、操作简单、无需机器，患者可居家自行完成并保持正常生活与工作，是目前应用最广的维持性腹膜透析方式。间歇性腹膜透析已基本淘汰，APD、CCPD、NPD需自动循环机、费用高、推广受限。故答C。\n\n📚 出处：《内科学》第9版·腹膜透析"],["下列哪种情况属于医院感染",["烧伤创面培养出金黄色葡萄球菌","经产道感染的乙型肝炎","红霉素静脉滴注后发生静脉炎","羊肠线吸收不佳的炎症反应","入院后 5 天发生的甲型肝炎"],"B",1,"lc","外科总论与麻醉","医院感染指住院48小时后发生的感染，包括住院期间获得、出院后发病及分娩过程中经产道获得的感染。新生儿经产道感染乙型肝炎属在医院内经产道获得的感染，故B属医院感染。烧伤创面培养出金葡菌可能仅为定植而无感染表现（A不选）；红霉素静滴后静脉炎属药物理化刺激（C不选）；羊肠线吸收不良为异物反应（D不选）；甲肝潜伏期约30天，入院5天发病属院外感染（E不选）。\n\n📚 出处：《流行病学》第8版·医院感染"],["52 岁妇女，已绝经 1 年。近半年出现阵发性发热、多汗、腰酸背痛、疲劳乏力，有时有血性白带或少量阴道流血。根据病史，下列哪项不正确",["围绝经期综合征","宫颈癌","卵巢肿瘤","老年性阴道炎","排卵性功血"],"E",1,"lc","妇产科","52岁绝经1年，出现阵发性潮热多汗、腰背酸痛、乏力（绝经综合征典型表现），同时有血性白带或少量阴道流血，须排除宫颈癌、子宫内膜癌、卵巢肿瘤及老年性阴道炎（黏膜萎缩、点状出血可致血性分泌物）。排卵性功血须有排卵、有周期性月经，绝经后妇女卵巢功能衰竭不会发生，故E不正确。\n\n📚 出处：《妇产科学》第9版·绝经综合征"],["下列哪项不属于麻醉性镇痛药",["可待因","二氢埃托啡","布洛芬","哌替啶","吗啡"],"C",1,"lc","外科总论与麻醉","本题与lc150同题。麻醉性镇痛药通过激动阿片受体产生镇痛，代表药是吗啡、哌替啶、可待因、芬太尼和二氢埃托啡，均有呼吸抑制、成瘾和便秘等阿片类不良反应，属麻醉药品管理。布洛芬为非甾体抗炎药，抑制环氧化酶减少前列腺素合成，只具解热、抗炎和中等镇痛作用，无阿片受体作用，不列入麻醉性镇痛药，故C正确。\n\n📚 出处：《药理学》第9版·镇痛药"],["男性，70 岁，慢性咳嗽、咳痰 14 年。多为白黏痰，每年发作 3 个月左右，近半年来出现上二、三层楼气短，为明确诊断而就诊。查外周血白细胞为 7.5×109/L，分叶 72％，淋巴 26％，嗜酸 2％，尿常规正常。下列检查中不应作为常规检查的是",["肺功能","血气分析","胸部 CT","心电图","胸部 X 线片"],"C",1,"lc","泌尿系统","患者慢性咳嗽、咳痰每年3个月、连续14年，近半年活动后气短，符合慢性阻塞性肺疾病，其诊断与评估需肺功能（确诊气流受限）、血气分析（判断低氧及高碳酸血症）、胸部X线（除外其他疾病）及心电图（除外心血管疾病所致气短）。胸部CT不属于常规检查，仅在需鉴别、评估肺大疱或考虑手术时选用。故答C。\n\n📚 出处：《内科学》第9版·慢性阻塞性肺疾病"],["意识丧失，无疼痛刺激，腱反射消失，瞳孔光反射消失提示",["嗜睡","昏睡","浅昏迷","中昏迷","深昏迷"],"E",1,"lc","神经与精神","深昏迷是最严重的意识障碍：意识完全丧失，对任何刺激（包括强疼痛刺激）均无反应，无自发动作与语言，各种生理反射（角膜反射、瞳孔对光反射、吞咽反射、腱反射）均消失，肌张力低下，可有去大脑强直或全身松弛，伴呼吸不规则、血压下降、尿便失禁或潴留及病理征。嗜睡可唤醒并能正确回答；昏睡需强刺激方能唤醒且答非所问；浅昏迷对疼痛有回避反应、生理反射存在；中昏迷对疼痛无反应、腱反射减弱但瞳孔对光反射可迟钝存在。\n\n📚 出处：《神经病学》第8版·意识障碍·昏迷的分级"],["有关淋菌性尿道炎的致病菌淋球菌的生物学特性，下述错误的是",["为革兰阴性的奈瑟双球菌，形态类似脑膜炎双球菌","有特殊的排他性，涂片中很少能找到其他细菌","主要由被污染的生活用品接触传播","通过菌毛黏附于宿主的黏膜上皮引起感染，人是唯一天然宿主，有易感性","在 35～37℃条件下，pH7.2～7.6 时生长迅速"],"C",1,"lc","泌尿系统","淋病奈瑟菌为革兰阴性双球菌，形态似脑膜炎球菌，主要经性接触（黏膜直接接触）传播，通过菌毛黏附尿道上皮而感染；人是唯一天然宿主，该菌对干燥、寒冷及消毒剂抵抗力弱，经生活用品间接接触传播极少见。培养需35~37℃、pH7.2~7.6、5%CO2环境。故C错误，答C。\n\n📚 出处：《皮肤性病学》第9版·淋病"],["有关食管癌的描述，下列哪项是正确的",["上段食管癌多见","溃疡型食管癌可引起早期梗阻","血行转移多见","中段食管癌的切除率不高","食管镜对中、晚期病例确诊率可达 100%"],"E",1,"lc","消化系统","中晚期食管癌经食管镜可直接观察病灶并取活检，确诊率可达100%，故E正确。我国食管癌以中段最多见（约50%），上段少见（A错）；溃疡型管壁尚有一定扩张度，梗阻出现较晚，缩窄型才早期梗阻（B错）；食管癌以淋巴转移为主，血行转移少见（C错）；中段食管癌切除率可达80%～90%，并不低（D错）。\n\n📚 出处：《外科学》第9版·食管疾病·食管癌"],["男，42 岁，右上腹痛伴发热 3 个月。查体：蜘蛛痣，肝肋下 4cm，质硬，脾肋下 2cm。白细胞 4.8×109/L，中性粒细胞 0.6，ALT60U/L，AKP241U/L。最可能的诊断是",["慢性胆囊炎","肝脓肿","肝囊肿伴感染","慢性活动性肝炎","肝硬化合并肝癌"],"E",1,"lc","消化系统","患者有蜘蛛痣、肝大质硬、脾大等肝硬化门脉高压体征，近3个月右上腹痛伴发热，ALP明显升高而ALT仅轻度升高，提示在肝硬化基础上发生肝占位（肿瘤坏死或合并感染致发热，ALP升高反映肝内占位压迫胆管），故E最可能。慢性胆囊炎无蜘蛛痣及肝脾大；肝脓肿多有高热寒战、白细胞显著升高；肝囊肿伴感染少见；慢性活动性肝炎不能解释质硬肝大伴占位效应。\n\n📚 出处：《内科学》第9版·原发性肝癌·临床表现"],["关于多囊卵巢综合征的临床表现，下列哪项是错误的",["月经失调","双侧卵巢略小于正常","不孕","黑棘皮症","肥胖"],"B",1,"lc","妇产科","PCOS的卵巢改变为体积增大（>10ml）、包膜增厚回声增强，包膜下多个小卵泡（≥12个，直径2～9mm）呈“项链征”，间质增多，故“双侧卵巢略小于正常”错误。临床表现还包括月经稀发或闭经、不孕、肥胖（约50%）、黑棘皮症与多毛痤疮等高雄激素表现。\n\n📚 出处：《妇产科学》第9版·多囊卵巢综合征"],["有关小儿呼吸道症状，下述哪一项是错误的",["一般上感者为干咳","急性喉炎者为犬吠样咳嗽","支气管炎者咳嗽有痰","肺炎支原体肺炎一般不咳嗽","新生儿肺炎常表现为呻吟、吐沫"],"D",1,"lc","儿科","上感初期多为干咳（A对）；急性喉炎因声门下水肿出现犬吠样咳嗽（B对）；支气管炎气道分泌物增多，咳嗽有痰（C对）；新生儿肺炎因咳嗽反射弱，常不咳而表现为呻吟、口吐白沫、气促及发绀（E对）。肺炎支原体肺炎以阵发性剧烈干咳为突出表现，故“一般不咳嗽”错误，D为答案。\n\n📚 出处：《儿科学》第9版·小儿呼吸系统疾病"],["有关骨软骨瘤的病变特点，下述错误的是",["是最常见的骨肿瘤","多发生于 30 岁以后","常发生于股骨、胫骨的干骺端","镜下由纤维层、软骨帽及骨小梁三层结构组成","需与骨巨细胞瘤鉴别"],"B",1,"lc","运动与骨外科","骨软骨瘤是最常见的良性骨肿瘤，好发于青少年（多在20岁前发现，随骨骺闭合而停止生长），故“多发生于30岁以后”错误。多见于股骨、胫骨、肱骨干骺端，背离关节生长；镜下由表层纤维组织、其下软骨帽及中央骨小梁三层结构构成；X线上需与骨巨细胞瘤（骨骺端偏心皂泡状破坏，无软骨帽）等鉴别。\n\n📚 出处：《外科学》第9版·骨肿瘤·骨软骨瘤"],["心理治疗的作用方式不包括",["支持与安慰","学习与教育","暗示","压抑","分析与自我探索"],"D",1,"lc","心血管系统","心理治疗的作用方式包括支持与安慰（支持性心理治疗）、学习与教育（认知矫正、心理健康教育）、暗示（暗示疗法、催眠）、分析与自我探索（精神分析、内省）以及行为训练等。“压抑”属心理防御机制，是不成熟的应对方式，长期使用有害，不能作为治疗手段。故选D。\n\n📚 出处：《精神病学》第8版·心理治疗·心理治疗的作用方式"],["重金属中毒时应该用哪种解毒剂",["依地酸二钠钙","二巯丁二钠","二巯丙醇","二巯基丙璜酸钠","二乙烯三胺三五乙酸"],"B",1,"lc","理化与中毒","二巯丁二钠（Na-DMS）为二巯基络合剂，含两个活性巯基，可与铅、汞、砷、锑、铜、锌等金属形成稳定环 ,1,"lc","外科总论与麻醉","重睑形成依赖皮肤与睑板或提上睑肌腱膜形成牢固粘连。术中如不剪开眶隔、不去除疝出的眶隔脂肪，脂肪下移堆积于重睑线上方，术后即出现上睑臃肿、厚重、“肉泡眼”，重睑不自然，故B正确。重睑线消失、变浅、不流畅或中断，多因缝线固定不牢、粘连范围不足或重睑设计不当所致，与是否剪开眶隔关系较小。\n\n📚 出处：《外科学》第9版·眼睑整形"],["上消化道的概念是指",["食管","胃","胆道","空肠","食管、胃、十二指肠、空肠上段和胆道"],"E",1,"lc","消化系统","上消化道指屈氏（Treitz）韧带以上的消化道，包括食管、胃、十二指肠、空肠上段及胆道（含胰管），故E正确。A、B、C、D均只涵盖其中一部分；空肠以下（回肠、结肠、直肠）属下消化道，其出血多表现为暗红色血便或便血。\n\n📚 出处：《外科学》第9版·上消化道大出血·解剖范围"],["脑梗死好发于",["大脑前动脉供血区","大脑中动脉供血区","大脑后动脉供血区","椎动脉供血区","基底动脉供血区"],"B",1,"lc","神经与精神","脑梗死最好发于大脑中动脉供血区，约占全部脑梗死的 70% 左右：大脑中动脉是颈内动脉的直接延续，管径粗、血流剪切力大，其分叉部（豆纹动脉起始处）是动脉粥样硬化斑块与栓子最易停留的部位，梗死时表现为对侧偏瘫、偏身感觉障碍、同向性偏盲及优势半球失语。大脑前动脉（约 5%）、大脑后动脉及椎-基底动脉系统供血区梗死相对少见。\n\n📚 出处：《神经病学》第8版·脑血管疾病·脑梗死"],["明确出血部位的大咯血患者应采取哪种体位",["头低脚高仰卧位","头高脚低俯卧位","头低脚高俯卧，并采取患侧卧位","头高脚低仰卧位","自由体位"],"C",1,"lc","呼吸系统","已明确出血部位的大咯血患者，应取头低脚高俯卧、患侧在上的体位：既利用重力促进气道内血液排出、防止误吸与窒息，又使健侧肺处于低位以保证通气／血流比与氧合。头低脚高仰卧不能使患侧在上、引流效果差；头高脚低体位不利于血液流出；自由体位不能保护健侧肺，故C最恰当。\n\n📚 出处：《内科学》第9版·咯血·治疗"],["进行性脊肌萎缩的首发症状最常见为",["一手或双手小肌肉萎缩、无力","下肢肌肉萎缩、无力","肌张力降低","腱反射亢进","大小便失禁"],"A",1,"lc","运动与骨外科","进行性脊肌萎缩（属运动神经元病）多起病于中年男性，最早、最常见的症状是手部小肌肉（骨间肌、鱼际肌、蚓状肌）萎缩与无力，出现爪形手、握力下降，可见肌束颤动，萎缩由上肢远端向上肢近端及延髓、下肢发展。下肢起病者少见（多见于肌萎缩侧索硬化下肢型）；肌张力降低与腱反射减弱随病情进展出现，但非首发；大小便失禁提示括约肌受累，运动神经元病一般无此表现。\n\n📚 出处：《神经病学》第8版·运动神经元病·进行性脊肌萎缩"],["左室后壁在 M 型超声上的表现是",["左室后壁与室间隔呈同向运动","左室后壁运动幅度大于室间隔","舒张期左室后壁向前运动，室间隔向后运动","左室后壁因受膈肌影响，运动幅度小于室间隔","左室后壁舒张期与二尖瓣前叶呈同向运动"],"B",1,"lc","医学影像与检验","M 型超声上，收缩期室间隔向后（向左室腔内）运动、左室后壁向前运动，舒张期二者方向相反，呈反向运动，故 A、C 描述的运动方向错误。正常左室后壁心肌较厚、收缩幅度大，其运动幅度约为 8～15mm，大于室间隔的 3～8mm，故 B 正确；D 称因膈肌影响后壁幅度小于室间隔与实测不符，原库答案有误；E 舒张期后壁向后运动，与二尖瓣前叶开放的前向运动（E 峰）方向相反。\n\n📚 出处：《超声医学》第6版·M 型超声心动图"],["下列哪一项是中晚期食管癌的最典型临床症状",["进行性吞咽困难","持续性胸背部疼痛","胸骨后烧灼样疼痛","顽固性逆呃","声音嘶哑"],"A",1,"lc","消化系统","中晚期食管癌最典型、最常见的症状是进行性吞咽困难：先是固体食物咽下梗噎，继而半流质、流质亦困难，最终连水与唾液也难以咽下，故A正确。持续性胸背痛提示肿瘤外侵纵隔、主动脉或椎旁；胸骨后烧灼样痛多为早期症状或反流所致；顽固性呃逆提示膈肌受侵；声音嘶哑为喉返神经受侵犯的表现，均属并发症或晚期征象。\n\n📚 出处：《外科学》第9版·食管疾病·食管癌临床表现"],["女性，35 岁，半年前弯腰提物时突然腰痛，并向左侧臀部放射。查体：腰椎凸向左侧，腰活动困难，左侧腰骶部压痛，直腿抬高 30°阳性。X 线片示腰椎向左侧弯曲。可诊断为",["棘间韧带损伤","急性腰肌损伤","腰椎类风湿关节炎","腰椎间盘突出","腰椎管狭窄"],"D",1,"lc","运动 let state = load();
function load(){
  try{const s=JSON.parse(localStorage.getItem(LS)); if(s&&s.v===2){ if(!s.know)s.know={}; if(s.memHideKnown===undefined)s.memHideKnown=false; if(!s.memPos)s.memPos={}; return s; }}catch(e){}
  return {v:2, stats:{total:0,right:0,days:{}}, wrong:[], pos:0, date:today(), exams:[], know:{}, memHideKnown:false};
}
function save(){try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function todayStat(){return state.stats.days[today()]||{n:0,r:0}}
function bumpProgress(){
  const n=todayStat().n;
  document.getElementById('todayBadge').textContent='今日 '+n+'/'+DAILY_GOAL;
  const tot=DATA.length, overall=state.stats.total/tot*100, todayPct=Math.min(100,n/DAILY_GOAL*100);
  document.getElementById('pbar').style.width=Math.min(100,overall*.5+todayPct*.5)+'%';
  document.getElementById('pgLeft').textContent='今日 '+n+'/'+DAILY_GOAL+' 题 '+(n>=DAILY_GOAL?'✅已达标':'');
  document.getElementById('pgRight').textContent='总进度 '+Math.round(overall)+'%';
  if(n>=DAILY_GOAL)document.getElementById('pbar').style.width='100%';
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function keyOf(q){return btoa(unescape(encodeURIComponent(q[0]+q[1].join('|')+q[2]))).slice(0,40)}
function tagOf(q){return q[5]||''}
/* 解析块：q[6] 存「解析正文 + 📚出处」，有解析才渲染，默认折叠 */
function explOf(q){return (q&&q[6])?String(q[6]):''}
/* 解剖示意图：按题号取内联 SVG */
function anatOf(qi){
  if(typeof ANAT==='undefined'||!ANAT)return null;
  return ANAT[qi]||ANAT[String(qi)]||null;
}
function anatHtml(qi){
  const a=anatOf(qi); if(!a)return '';
  return `<div class="anat">
    <div class="anat-h" onclick="this.parentNode.classList.toggle('open')">
      <span class="ico">🖼</span><span class="t">解剖示意图</span><span class="ar">▾</span>
    </div>
    <div class="anat-b"><div class="anat-svg" onclick="zoomAnat(${qi})">${a.svg||''}</div>
      <div class="anat-zoom">🔍 点击图片可全屏放大</div>
      <div class="anat-cap">${esc(a.alt||'')}</div></div>
  </div>`;
}
function explHtml(q,expand){
  const t=explOf(q); if(!t)return '';
  const sp=t.split('\n\n📚 出处：');
  const body=esc(sp[0]).replace(/\n/g,'<br>');
  const src=sp[1]?esc(sp[1]):'';
  return `<div class="expl${expand?' open':''}">
    <div class="expl-h" onclick="this.parentNode.classList.toggle('open')">
      <span class="ico">💡</span><span class="t">解析与出处</span><span class="ar">▾</span>
    </div>
    <div class="expl-b"><div class="expl-txt">${body}</div>${src?`<div class="expl-src">📚 ${src}</div>`:''}</div>
  </div>`;
}

let view='home';
function nav(v){view=v;render()}
let cur=0, answered=false, sel=null, fScope='all', fTag='', mode='seq';

/* ============ 练习 ============ */
function pool(scope,tag){
  const out=[];
  DATA.forEach((q,i)=>{ if(scope==='all'||q[4]===scope){ if(!tag||q[5]===tag) out.push(i);} });
  return out;
}
function nextQuestion(){
  const p=pool(fScope,fTag);
  if(!p.length){ cur=-1; return; }
  if(mode==='random'){ cur=p[Math.floor(Math.random()*p.length)]; }
  else { state.pos=(state.pos||0)+1; cur=p[(state.pos-1)%p.length]; }
  answered=false; sel=null;
}
function curPool(){return pool(fScope,fTag)}
function renderPractice(){
  if(wrongQueue&&wrongQueue.length){ cur=wrongQueue[0]; }
  else if(cur<0||(fScope!=='all'&&DATA[cur][4]!==fScope)||(fTag&&tagOf(DATA[cur])!==fTag)) nextQuestion();
  if(cur<0){ document.getElementById('main').innerHTML='<div class="empty">该科目暂无题目</div>'; renderToolbar(); return; }
  const q=DATA[cur]; const stem=q[0],opts=q[1],ans=q[2],ok=q[3];
  const isRw=q[4]==='rw';
  const isWrong=state.wrong.some(w=>w.i===cur);
  let optsHtml='';
  if(ok&&opts.length>=2){
    opts.forEach((o,idx)=>{const L=String.fromCharCode(65+idx);
      optsHtml+=`<div class="opt" data-l="${L}" onclick="choose(this,'${L}')"><span class="k">${L}</span><span class="v">${esc(o)}</span></div>`;});
  }
  const fb=!ok?`<div class="fallback">⚠️ 本题选项在源文档中格式不完整，已保留原文与答案，请对照记忆：<br><br><b>参考答案：${ans}</b></div>`:'';
  document.getElementById('main').innerHTML=`
  <div class="card">
    <div class="qmeta">
      <span class="tag ${isRw?'':'lc'}">${isRw?'人文医学':'临床业务'}</span>
      <span class="tag sp">${esc(tagOf(q))}</span>
      <span>第 ${cur+1} / ${DATA.length} ${isWrong?'· <span class="crown">错题</span>':''}</span>
    </div>
    <div class="stem">${esc(stem)}</div>
    <div class="opts" id="opts">${optsHtml}</div>
    ${fb}
    ${anatHtml(cur)}
    ${explHtml(q,false)}
    <div class="ansbox" id="ansbox"></div>
  </div>
  <div class="hint">点击选项作答 · 答错自动进错题本</div>
  <div class="swipe-hint">← 左右滑动可切换上/下一题 →</div>`;
  if(answered&&ok){
    const box=document.getElementById('ansbox'); const right=sel===ans;
    document.querySelectorAll('.opt').forEach(el=>{const L=el.dataset.l;el.classList.add('dis');if(L===ans)el.classList.add('ok');if(L===sel&&sel!==ans)el.classList.add('bad');});
    box.className='ansbox show '+(right?'right':'wrong');
    box.innerHTML=`<div class="t">${right?'✅ 回答正确':'❌ 回答错误'}</div><div>正确答案：<b>${ans}</b>${(!right&&sel)?'　你的选择：'+sel:''}</div>`;
  }
  renderToolbar();
}
function choose(el,L){
  if(answered)return;
  const q=DATA[cur],ans=q[2];
  answered=true; sel=L;
  state.stats.total++;
  const d=state.stats.days[today()]||(state.stats.days[today()]={n:0,r:0}); d.n++;
  const right=L===ans;
  if(right){state.stats.right++;d.r++;}
  else{
    if(!state.wrong.some(w=>w.i===cur)) state.wrong.unshift({i:cur,t:q[0].slice(0,70),a:ans,my:L,src:q[4],sp:q[5],ts:Date.now()});
    if(state.wrong.length>600)state.wrong.pop();
  }
  save();
  document.querySelectorAll('.opt').forEach(x=>{x.classList.add('dis');if(x.dataset.l===ans)x.classList.add('ok');if(x.dataset.l===L&&L!==ans)x.classList.add('bad');});
  const box=document.getElementById('ansbox');
  box.className='ansbox show '+(right?'right':'wrong');
  box.innerHTML=`<div class="t">${right?'✅ 回答正确':'❌ 回答错误'}</div><div>正确答案：<b>${ans}</b>${(!right)?'　你的选择：'+L:''}</div>`;
  const ex=document.querySelector('.expl'); if(ex)ex.classList.add('open');
  bumpProgress(); renderToolbar();
}
function renderToolbar(){
  document.getElementById('toolbar').innerHTML=`<button class="btn gray small" onclick="doPrev()">← 上一题</button>
    <button class="btn pri" onclick="doNext()">${answered?'下一题 ▶':'跳过'}</button>
    <button class="btn gray small" onclick="nav('home')">首页</button>`;
}
function doNext(){answered=false;sel=null;nextQuestion();renderPractice();}
function doPrev(){
  if(wrongQueue&&wrongQueue.length){
    let i=wrongQueue.indexOf(cur); i=(i-1+wrongQueue.length)%wrongQueue.length; cur=wrongQueue[i];
    answered=false;sel=null; renderPractice(); return;
  }
  const p=pool(fScope,fTag); if(!p.length) return;
  let idx=p.indexOf(cur); if(idx<0) idx=0;
  idx=(idx-1+p.length)%p.length; cur=p[idx];
  if(mode!=='random'){ state.pos=idx+1; save(); }
  answered=false;sel=null; renderPractice();
}

/* ============ 左右滑动切题（全局手势） ============ */
let swipeBound=false;
function bindSwipe(){
  const el=document.getElementById('main');
  if(!el||swipeBound) return; swipeBound=true;
  let sx=0, sy=0, active=false;
  el.addEventListener('touchstart',e=>{
    if(e.touches.length!==1){active=false;return;}
    // 起点落在输入框、按钮、可横向滚动区时不触发滑动
    const t=e.target;
    if(t&&(t.closest('input,textarea,button,.btn,.sheet,.chips-wrap,.mem-nav'))){active=false;return;}
    sx=e.touches[0].clientX; sy=e.touches[0].clientY; active=true;
  },{passive:true});
  el.addEventListener('touchmove',e=>{
    if(!active)return;
    // 触摸落在输入框/可滚动答题卡时不拦截
  },{passive:true});
  el.addEventListener('touchend',e=>{
    if(!active) return; active=false;
    const t=e.changedTouches[0]; const dx=t.clientX-sx, dy=t.clientY-sy;
    if(Math.abs(dx)<55) return;                    // 水平位移阈值
    if(Math.abs(dx) < Math.abs(dy)*1.4) return;    // 偏离竖直方向则视为滚动
    if(dx<0) swipeNext(); else swipePrev();
  },{passive:true});
}
function flashMain(dir){
  const m=document.getElementById('main'); if(!m)return;
  m.classList.remove('slide-left','slide-right');
  void m.offsetWidth;
  m.classList.add(dir==='next'?'slide-left':'slide-right');
  setTimeout(()=>m.classList.remove('slide-left','slide-right'),220);
}
function swipeNext(){
  if(view==='practice'){ flashMain('next'); doNext(); }
  else if(view==='memorize'){ flashMain('next'); memNext(); }
  else if(view==='exam'){ flashMain('next'); examNext(); }
}
function swipePrev(){
  if(view==='practice'){ flashMain('prev'); doPrev(); }
  else if(view==='memorize'){ flashMain('prev'); memPrev(); }
  else if(view==='exam'){ flashMain('prev'); examPrev(); }
}

/* 解剖图全屏放大 */
function zoomAnat(qi){
  const a=anatOf(qi); if(!a)return;
  let z=document.getElementById('anatZoom');
  if(!z){
    z=document.createElement('div'); z.id='anatZoom'; z.className='anim-zoom';
    z.onclick=()=>z.classList.remove('on');
    document.body.appendChild(z);
  }
  z.innerHTML=`<div class="az-inner">${a.svg||''}<div class="az-cap">${esc(a.alt||'')}</div>
    <div class="az-tip">点击任意处关闭</div></div>`;
  z.classList.add('on');
  // 双向缩放
  const svg=z.querySelector('svg');
  if(svg){svg.style.width='96vw';svg.style.maxWidth='96vw';svg.style.height='auto';svg.style.background='#fff';svg.style.borderRadius='10px';}
}

    <button class="btn gray small" onclick="nav('stats')">统计</button>`;
}
function setScope(v){fScope=v;fTag='';state.pos=0;save();render()}
function setTag(v){fTag=v;state.pos=0;save();render()}
function setMode(v){mode=v;save();render()}

/* ============ 背题模式 ============ */
let mem={idx:0, revealed:true, list:null, onlyUn:false};
function memScopeKey(){ return (fScope||'all')+'::'+(fTag||'')+'::'+(mem.onlyUn?'un':'')+'::'+(state.memHideKnown?'h':'a'); }
function memList(){
  const pl=pool(fScope,fTag);
  const knows=state.know||{};
  let arr;
  if(mem.onlyUn){ arr = pl.filter(i=>knows[i]==='un'); }
  else if(state.memHideKnown){ arr = pl.filter(i=>knows[i]!=='know'); }
  else { arr = pl; }
  return arr;
}
// 保存/读取背题断点（按 范围+科目+筛选模式 分别记忆）
function saveMemPos(){
  if(!mem.list||!mem.list.length)return;
  state.memPos=state.memPos||{};
  const qi=mem.list[mem.idx];
  state.memPos[memScopeKey()]={qi:qi, idx:mem.idx, ts:Date.now()};
  save();
}
function getMemPos(){ return (state.memPos||{})[memScopeKey()]||null; }
// 从断点恢复：仅当断点题目仍在当前列表中才恢复，否则从头开始
function restoreMemPos(){
  const p=getMemPos(); if(!p||!mem.list||!mem.list.length)return false;
  const at=mem.list.indexOf(p.qi);
  if(at>=0){ mem.idx=at; return true; }
  mem.idx=0; return false;
}
function startMemorize(){
  mem={idx:0,revealed:true,list:null,onlyUn:false,resumed:false};
  mem.list=memList();
  if(!mem.list.length) mem.list=pool(fScope,fTag);
  const ok=restoreMemPos();
  if(ok && mem.idx>0){ mem.resumed=true; mem.resumeAt=mem.idx; }
  nav('memorize');
}
function startMemorizeUn(){
  const unCount=(pool(fScope,fTag)).filter(i=>(state.know||{})[i]==='un').length;
  if(!unCount){ alert('当前范围还没有标记「不熟」的题。\n先进入背题模式，把不熟的题标出来吧。'); return; }
  mem={idx:0,revealed:true,list:null,onlyUn:true,resumed:false}; nav('memorize');
}
function memEnsure(){
  if(!mem.list){ mem.list=memList(); restoreMemPos(); }
  if(mem.idx>=mem.list.length) mem.idx=Math.max(0,mem.list.length-1);
}
function memMark(type){
  memEnsure(); if(!mem.list.length)return;
  const qi=mem.list[mem.idx]; state.know=state.know||{};
  if(state.know[qi]===type) delete state.know[qi]; else state.know[qi]=type;
  save();
  if(mem.onlyUn && state.know[qi]!=='un'){ // 在"只看不熟"下标记为已掌握/取消 → 从队列移除
    mem.list.splice(mem.idx,1);
    if(mem.idx>=mem.list.length) mem.idx=Math.max(0,mem.list.length-1);
    if(!mem.list.length){ renderMemorize(); return; }
  }
  saveMemPos();
  renderMemorize();
}
function memJump(){ memEnsure();
  const el=document.getElementById('memJump');
  let v=parseInt(el.value,10); if(isNaN(v))return;
  v=Math.max(1,Math.min(mem.list.length,v)); mem.idx=v-1; mem.resumed=false; saveMemPos(); renderMemorize();
}
function memPrev(){ memEnsure(); if(mem.idx>0){mem.idx--;mem.resumed=false;saveMemPos();renderMemorize();} }
function memNext(){
  memEnsure(); if(!mem.list.length)return;
  if(mem.idx<mem.list.length-1){mem.idx++;mem.resumed=false;saveMemPos();renderMemorize();}
  else{ const b=document.getElementById('memEndTip'); if(b){b.textContent='🎉 已到最后一题';setTimeout(()=>b.textContent='',1500);} }
}
// 跳回"上次背到的题"
function memGotoLast(){ memEnsure(); const p=getMemPos(); if(!p){alert('暂无上次记录');return;}
  let at=mem.list.indexOf(p.qi); if(at<0)at=Math.min(p.idx,mem.list.length-1);
  mem.idx=at; mem.resumed=false; renderMemorize();
}
function memRestart(){ memEnsure(); mem.idx=0; saveMemPos(); mem.resumed=false; renderMemorize(); }
function toggleKnowFilter(){
  state.memHideKnown=!state.memHideKnown; save(); mem.list=null; mem.idx=0; restoreMemPos(); renderMemorize();
}
function toggleOnlyUn(){ mem.onlyUn=!mem.onlyUn; mem.list=null; mem.idx=0; renderMemorize(); }
function renderMemorize(){
  memEnsure();
  const c=document.getElementById('main');
  const knows=state.know||{};
  if(!mem.list.length){
    const unCnt=(pool(fScope,fTag)).filter(i=>knows[i]==='un').length;
    const msg = mem.onlyUn
      ? (unCnt? '当前筛选下没有更多「不熟」的题了':'当前范围还没有标记「不熟」的题')

      ${mem.onlyUn?'<br><br><span style="color:#0f766e;font-weight:600" onclick="mem.onlyUn=false;mem.list=null;mem.idx=0;renderMemorize()">← 返回全部背题</span>':''}</div>`;
    document.getElementById('toolbar').innerHTML=`<button class="btn gray small" onclick="nav('home')">首页</button>
      <button class="btn pri" onclick="startPractice()">正常刷题 ▶</button>`;

  }
  const qi=mem.list[mem.idx]; const q=DATA[qi];

  const mark=knows[qi];
  const allKnow=Object.values(knows).filter(v=>v==='know').length;
  const allUn=Object.values(knows).filter(v=>v==='un').length;
  let optsHtml='';
  if(ok&&opts.length>=2){
    opts.forEach((o,idx)=>{const L=String.fromCharCode(65+idx);
      optsHtml+=`<div class="mem-opt ${L===ans?'correct':''}"><span class="k">${L}</span><span class="v">${esc(o)}</span></div>`;});
  }else{
    optsHtml=`<div class="fallback">（本题选项源文档格式不完整，仅显示答案）</div>`;
  }
  const hideCls = mem.revealed?'':'mem-hide';
  const lastPos=getMemPos();
  const plan=memPlan();
  const planBar = `
  <div class="planbar">

    <div class="pb-desc">${plan.days<=0?'考试已开始，稳住心态，刷错题即可':'按此节奏可在考前过完「'+esc(plan.scopeName)+'」全部 '+plan.tot+' 题</div>'}
    <div class="pb-meta">${esc(plan.scopeName)}：已背 ${plan.done} · 剩余 ${plan.left}</div>

  const resumeBar = mem.resumed? `

      <span onclick="memGotoLast()">回到上次</span>
      <span onclick="memRestart()">从头开始</span>
      <span class="x" onclick="mem.resumed=false;renderMemorize()">知道了</span>
    </div>
  </div>`:'';
  c.innerHTML=`
  ${resumeBar}
  ${planBar}
  <div class="mem-stats">
    <div class="it"><b>${allKnow}</b><span>已掌握</span></div>

  </div>
  <div class="mem-nav">
    <div class="jump">跳到 <input id="memJump" type="number" min="1" max="${mem.list.length}" value="${mem.idx+1}" onkeydown="if(event.key==='Enter')memJump()"> / ${mem.list.length} <span style="color:#0f766e;font-weight:600;cursor:pointer" onclick="memJump()">前往</span></div>
    <div style="display:flex;gap:6px">
      <div class="chip ${mem.onlyUn?'on':''}" style="margin:0;padding:6px 11px;font-size:12px" onclick="toggleOnlyUn()">只看不熟</div>
      <div class="chip ${(state.memHideKnown&&!mem.onlyUn)?'on':''}" style="margin:0;padding:6px 11px;font-size:12px" onclick="toggleKnowFilter()">隐藏已掌握</div>
    </div>
  </div>
  <div style="display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#94a3b8;margin:-4px 6px 10px 6px">
    <span>${lastPos?('上次背到：第 '+(mem.list.indexOf(lastPos.qi)+1>0?mem.list.indexOf(lastPos.qi)+1:lastPos.idx+1)+' 题'):''}</span>
    <span style="color:#7c3aed;font-weight:600;cursor:pointer" onclick="memGotoLast()">↩ 回到上次题</span>

    <div class="mem-mark">

/* ============ 模拟考试 ============ */
let exam=null, examTimer=null;
function startExam(){
  const idx=[...Array(DATA.length).keys()];
  // Fisher-Yates
  for(let i=idx.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]];}
  const list=idx.slice(0,100);
  exam={list, idx:0, ans:{}, start:Date.now(), dur:60*60, ts:null};
  if(examTimer)clearInterval(examTimer);
  examTimer=setInterval(()=>{ if(!exam)return; exam.ts++; const left=exam.dur-exam.ts;
    const el=document.getElementById('exTimer'); if(el){ el.textContent=fmtTime(left); el.classList.toggle('warn',left<=300); }
    if(left<=0){ clearInterval(examTimer); submitExam(true); }
  },1000);
  nav('exam');
}
function fmtTime(s){s=Math.max(0,s);const m=Math.floor(s/60),x=s%60;return String(m).padStart(2,'0')+':'+String(x).padStart(2,'0')}
function examPick(L){ if(!exam)return; exam.ans[exam.idx]=L; renderExam(); }
function examGoto(i){ if(!exam)return; exam.idx=i; renderExam(); }
function examNext(){ if(!exam)return; if(exam.idx<exam.list.length-1){exam.idx++;renderExam();} }
function examPrev(){ if(!exam)return; if(exam.idx>0){exam.idx--;renderExam();} }
function renderExam(){
  if(!exam){nav('home');return;}
  const qn=exam.list[exam.idx], q=DATA[qn];
  const stem=q[0],opts=q[1],ans=q[2],ok=q[3]; const chosen=exam.ans[exam.idx];
  let optsHtml='';
  if(ok&&opts.length>=2){
    opts.forEach((o,idx)=>{const L=String.fromCharCode(65+idx);
      optsHtml+=`<div class="opt ${chosen===L?'sel':''}" onclick="examPick('${L}')"><span class="k">${L}</span><span class="v">${esc(o)}</span></div>`;});
  }else{
    optsHtml=`<div class="fallback">本题为文本题，考试中请凭记忆作答，交卷后显示答案。</div>`;
  }
  const doneCnt=Object.keys(exam.ans).length;
  const left=exam.dur-(exam.ts||0);
  document.getElementById('main').innerHTML=`
  <div class="card">
    <div class="qmeta">
      <span class="tag ${q[4]==='rw'?'':'lc'}">${q[4]==='rw'?'人文医学':'临床业务'}</span>
      <span class="tag sp">${esc(q[5])}</span>
      <span class="timer" id="exTimer">${fmtTime(left)}</span>
    </div>
    <div class="stem">${esc(stem)}</div>
    <div class="opts">${optsHtml}</div>
  </div>
  <div class="card">
    <div style="display:flex;justify-content:space-between;font-size:13px;color:#64748b;margin-bottom:8px">
      <span>答题卡（已答 ${doneCnt}/100）</span><span>第 ${exam.idx+1} 题</span>
    </div>
    <div class="sheet">${exam.list.map((_,i)=>`<div class="s ${exam.ans[i]?'done':''} ${i===exam.idx?'cur':''}" onclick="examGoto(${i})">${i+1}</div>`).join('')}</div>
  </div>`;
  document.getElementById('toolbar').innerHTML=`<button class="btn gray small" onclick="examPrev()">上一题</button>
    <button class="btn pri" onclick="${exam.idx<exam.list.length-1?'examNext()':'submitExam(false)'}">${exam.idx<exam.list.length-1?'下一题 ▶':'交卷'}</button>
    <button class="btn gray small" onclick="submitExam(false)">交卷</button>`;
}
function submitExam(auto){
  if(!exam)return;
  const un=100-Object.keys(exam.ans).length;
  if(!auto && un>0){ if(!confirm(`还有 ${un} 题未作答，确定交卷？`))return; }
  if(!auto && un===0){ if(!confirm('确定交卷并查看成绩？'))return; }
  if(examTimer)clearInterval(examTimer);
  let right=0;
  exam.list.forEach((qn,i)=>{
    const q=DATA[qn], ans=q[2], my=exam.ans[i];
    if(my===ans)right++;
    else if(my){ // 只把作答错的入错题本
      if(!state.wrong.some(w=>w.i===qn)) state.wrong.unshift({i:qn,t:q[0].slice(0,70),a:ans,my:my,src:q[4],sp:q[5],ts:Date.now()});
    }
  });
  if(state.wrong.length>600)state.wrong=state.wrong.slice(0,600);
  const used=exam.ts||0;
  state.stats.total+=exam.list.length;
  state.stats.right+=right;
  const d=state.stats.days[today()]||(state.stats.days[today()]={n:0,r:0}); d.n+=exam.list.length; d.r+=right;
  const rec={ts:Date.now(), score:right, total:exam.list.length, used:used, pass:right>=60};
  state.exams=state.exams||[]; state.exams.unshift(rec); if(state.exams.length>30)state.exams.pop();
  save();
  exam.rec=rec; exam.right=right; exam.used=used; exam.finished=true;
  bumpProgress();
  nav('examResult');
}
function renderExamResult(){
  if(!exam||!exam.finished){nav('home');return;}
  const r=exam.rec; const pct=Math.round(r.score/r.total*100);
  const wrongList=exam.list.map((qn,i)=>({qn,i,my:exam.ans[i]})).filter(x=>DATA[x.qn][2]!==x.my);
  document.getElementById('main').innerHTML=`
  <div class="card result-ring">
    <div class="score ${r.pass?'pass':'fail'}">${r.score}<span style="font-size:22px">/100</span></div>
    <div style="margin-top:8px;font-size:15px">
      <span class="${r.pass?'pass':'fail'}" style="font-weight:700">${r.pass?'✅ 合格':'❌ 未达60分'}</span>
      ｜ 正确率 ${pct}% ｜ 用时 ${fmtTime(r.used)}
    </div>
  </div>
  <div class="sect" style="margin-top:0">错题复盘（${wrongList.length} 题）</div>
  <div class="card"><div class="rlist">${wrongList.length?wrongList.map(x=>{
    const q=DATA[x.qn];
    return `<div class="ri"><div class="q">${esc(q[0].slice(0,90))}</div>
      <div class="a">你选 <i>${x.my||'未答'}</i> · 正确 <b>${q[2]}</b> · ${esc(q[5])}</div></div>`;
  }).join(''):'<div class="empty" style="padding:30px">🎉 全部答对！</div>'}</div></div>`;
  document.getElementById('toolbar').innerHTML=`<button class="btn gray small" onclick="nav('home')">首页</button>
    <button class="btn pri" onclick="startExam()">再考一次 ▶</button>
    <button class="btn gray small" onclick="nav('wrong')">错题本</button>`;
}

function setWrongFilter(f){wrongFilter=f;renderWrong()}
let wrongQueue=null;
function reviewWrong(idx){const w=state.wrong[idx];cur=w.i;answered=false;sel=null;wrongQueue=null;nav('practice');}

/* ============ 统计 ============ */
function trendChart(exams){
  const arr=exams.slice().reverse(); // 时间正序
  if(arr.length<1) return '<div class="empty" style="padding:24px">做 1 次以上模考后显示趋势</div>';
  const W=520,H=220,PL=38,PR=14,PT=18,PB=30;
  const iw=W-PL-PR, ih=H-PT-PB;
  const n=arr.length;
  const X=i=> n===1? PL+iw/2 : PL+iw*i/(n-1);
  const Y=v=> PT+ih*(1-Math.min(100,v)/100);
  let path='',area='',dots='',labels='';
  arr.forEach((e,i)=>{
    const x=X(i), y=Y(e.score);
    path+=(i===0?'M':'L')+x.toFixed(1)+' '+y.toFixed(1)+' ';
    dots+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${e.pass?'#16a34a':'#dc2626'}"/>`;
    labels+=`<text x="${x.toFixed(1)}" y="${H-9}" font-size="10" fill="#94a3b8" text-anchor="middle">${i+1}</text>`;
  });
  area=`M${X(0).toFixed(1)} ${Y(100).toFixed(1)} `+arr.map((e,i)=>`L${X(i).toFixed(1)} ${Y(e.score).toFixed(1)}`).join(' ')+` L${X(n-1).toFixed(1)} ${Y(100).toFixed(1)} Z`;
  // 网格线 + 刻度
  let grid='';
  [0,25,50,75,100].forEach(v=>{
    const y=Y(v);
    grid+=`<line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}" stroke="#eef2f6" stroke-width="1"/>`;
    grid+=`<text x="${PL-7}" y="${y+3.5}" font-size="10" fill="#94a3b8" text-anchor="end">${v}</text>`;
  });
  const gy=Y(60);
  const passLine=`<line x1="${PL}" y1="${gy}" x2="${W-PR}" y2="${gy}" stroke="#f59e0b" stroke-width="1.3" stroke-dasharray="5 4"/><text x="${W-PR}" y="${gy-4}" font-size="10" fill="#f59e0b" text-anchor="end">合格线60</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">
    ${grid}
    <path d="${area}" fill="rgba(20,184,166,.14)"/>

function renderStats(){
  const days=Object.keys(state.stats.days).sort();
  const rate=state.stats.total?Math.round(state.stats.right/state.stats.total*100):0;
  let hist='';
  days.slice(-14).forEach(d=>{const s=state.stats.days[d];const pct=Math.min(100,100*s.n/DAILY_GOAL);
    hist+=`<div style="display:flex;align-items:center;gap:10px;margin:7px 0;font-size:12.5px">
      <span style="flex:0 0 74px;color:#64748b">${d.slice(5)}</span>
      <span style="flex:1;background:#eef2f6;border-radius:6px;height:16px;overflow:hidden"><i style="display:block;height:100%;width:${pct}%;background:${s.n>=DAILY_GOAL?'#16a34a':'#14b8a6'}"></i></span>
      <span style="flex:0 0 54px;text-align:right;color:#475569">${s.n}题${s.n>=DAILY_GOAL?' ✅':''}</span></div>`;});
  const exams=(state.exams||[]).slice(0,10);
  const trend=trendChart(state.exams||[]);
  const knows=state.know||{};
  const mKnow=Object.values(knows).filter(v=>v==='know').length;
  const mUn=Object.values(knows).filter(v=>v==='un').length;
  const mMarked=mKnow+mUn, mTotal=DATA.length, mOpen=Math.max(0,mTotal-mMarked);
  const pKnow=Math.round(mKnow/mTotal*100), pUn=Math.round(mUn/mTotal*100), pOpen=Math.max(0,100-pKnow-pUn);
  // 按科目掌握情况（Top 弱项：不熟最多）
  const spStat={};
  Object.keys(knows).forEach(i=>{const q=DATA[i]; if(!q)return; const s=q[5]||'其他';
    (spStat[s]=spStat[s]||{k:0,u:0}); (knows[i]==='know'?spStat[s].k++:spStat[s].u++);});
  const weakList=Object.keys(spStat).map(s=>({s,...spStat[s]})).filter(x=>x.u>0).sort((a,b)=>b.u-a.u).slice(0,8);
  const weakHtml=weakList.length?weakList.map(x=>{
    const tot=x.k+x.u; const pctK=Math.round(x.k/tot*100);
    return `<div style="display:flex;align-items:center;gap:10px;margin:9px 0;font-size:12.5px">
      <span style="flex:0 0 92px;color:#334155;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x.s)}</span>
      <span style="flex:1;background:#eef2f6;border-radius:6px;height:16px;overflow:hidden;display:flex">
        <i style="width:${pctK}%;background:#16a34a;height:100%"></i><i style="width:${100-pctK}%;background:#f87171;height:100%"></i></span>
      <span style="flex:0 0 76px;text-align:right;color:#475569">熟${x.k} 不熟${x.u}</span></div>`;
  }).join(''):'<div class="empty" style="padding:20px">还没有背题标记，去「背题模式」标记已掌握/不熟</div>'
  let examHtml=exams.length?exams.map(e=>{
    const dt=new Date(e.ts); const ds=(dt.getMonth()+1)+'/'+dt.getDate()+' '+String(dt.getHours()).padStart(2,'0')+':'+String(dt.getMinutes()).padStart(2,'0');
    return `<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #eef2f6;font-size:14px">
      <span style="color:#64748b">${ds}</span>
      <span><b class="${e.pass?'pass':'fail'}">${e.score}/100</b> · ${fmtTime(e.used)}</span></div>`;
  }).join(''):'<div class="empty" style="padding:24px">还没有模考记录，去试试「模拟考试」</div>';
  document.getElementById('main').innerHTML=`
  <div class="grid2">
    <div class="stat"><div class="n">${state.stats.total}</div><div class="l">累计答题</div></div>
    <div class="stat"><div class="n">${rate}%</div><div class="l">总正确率</div></div>
    <div class="stat"><div class="n">${days.length}</div><div class="l">刷题天数</div></div>
    <div class="stat"><div class="n">${state.wrong.length}</div><div class="l">错题数</div></div>
  </div>
  <div class="sect">背题掌握度（共 ${mTotal} 题）</div>
  <div class="card" style="padding:14px 16px">
    <div style="display:flex;height:20px;border-radius:8px;overflow:hidden;background:#eef2f6">
      <i style="width:${pKnow}%;background:#16a34a"></i><i style="width:${pUn}%;background:#f87171"></i>
    </div>
    <div style="display:flex;justify-content:space-between;font-size:12px;color:#64748b;margin-top:8px">
      <span><b style="color:#16a34a">● 已掌握 ${mKnow}</b>（${pKnow}%）</span>
      <span><b style="color:#dc2626">● 不熟 ${mUn}</b>（${pUn}%）</span>
      <span>○ 未标记 ${mOpen}（${pOpen}%）</span>
    </div>
    ${mUn>0?`<div style="margin-top:12px"><div class="chip" style="margin:0;padding:9px 14px;font-size:13px;border-color:#dc2626;color:#b91c1c;display:inline-block" onclick="startMemorizeUn()">🔥 专攻不熟的 ${mUn} 题 →</div></div>`:''}
  </div>
  <div class="sect">薄弱科目（不熟数排序）</div>
  <div class="card" style="padding:12px 16px">${weakHtml}</div>
  <div class="sect">模拟考试成绩趋势</div>
  <div class="card" style="padding:12px 8px">${trend}</div>
  <div class="sect">近 14 天打卡</div>
  <div class="card" style="padding:14px">${hist||'<div class="empty" style="padding:20px">暂无记录</div>'}</div>
  <div class="sect">模拟考试成绩记录</div>
  <div class="card" style="padding:12px 16px">${examHtml}</div>
  <div class="quote">坚持每日 200 题，考前从容不慌。</div>`;
  document.getElementById('toolbar').innerHTML=`<button class="btn gray small" onclick="nav('home')">首页</button>
    <button class="btn pri" onclick="startPractice()">继续刷题 ▶</button>
    <button class="btn gray small" onclick="nav('share')">分享</button>`;
}

/* 背题智能规划：按补考倒计时推荐每日背题数 */
const EXAM_DATE='2026-10-22'; // 线上测评开始日（2026-10-22 至 10-30）
function daysToExam(){
  const now=new Date(); now.setHours(0,0,0,0);
  const ex=new Date(EXAM_DATE+'T00:00:00'); ex.setHours(0,0,0,0);
  return Math.max(0, Math.ceil((ex-now)/86400000));
}
function memPlan(){
  // 当前范围剩余未背题数（以断点之后计算：总数-已完成）
  const pl=pool(fScope,fTag); const tot=pl.length;
  const p=(state.memPos||{})[memScopeKey()];
  let done=0; if(p){ const at=pl.indexOf(p.qi); done= at>=0? at+1 : 0; }
  const left=Math.max(0, tot-done);
  const days=daysToExam();
  const safeDays=Math.max(1, days-1); // 考前一天留作复习
  const perDay=Math.ceil(left/safeDays);
  return {tot,done,left,days,perDay,scopeName: fTag? fTag : (fScope==='rw'?'人文医学':fScope==='lc'?'临床业务':'全部题库')};
}
