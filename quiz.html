<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="湖南定考刷题">
<meta name="theme-color" content="#0f766e">
<title>湖南医师定考 · 刷题</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#f4f6f8;--card:#fff;--pri:#0f766e;--pri-l:#14b8a6;--ok:#16a34a;--bad:#dc2626;--txt:#1e293b;--sub:#64748b;--line:#e2e8f0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);font-size:16px;line-height:1.6;overscroll-behavior:none}
#app{max-width:720px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--pri),var(--pri-l));color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;box-shadow:0 2px 10px rgba(15,118,110,.25)}
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hd h1{font-size:17px;font-weight:700;letter-spacing:.5px}
.hd .sub{font-size:11px;opacity:.85;margin-top:2px}
.badge{font-size:11.5px;background:rgba(255,255,255,.22);padding:3px 9px;border-radius:20px;white-space:nowrap;font-weight:600}
.progbar{height:7px;background:rgba(255,255,255,.28);border-radius:6px;margin-top:10px;overflow:hidden}
.progbar i{display:block;height:100%;background:#fff;border-radius:6px;width:0;transition:width .35s}
.pgtxt{font-size:11px;margin-top:5px;opacity:.95;display:flex;justify-content:space-between}
main{flex:1;padding:14px 14px 96px}
.card{background:var(--card);border-radius:16px;padding:18px 16px;box-shadow:0 2px 12px rgba(15,23,42,.06);margin-bottom:14px}
.qmeta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--sub);margin-bottom:10px;gap:8px}
.tag{background:#ecfdf5;color:var(--pri);padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.tag.lc{background:#eff6ff;color:#2563eb}
.tag.sp{background:#f5f3ff;color:#7c3aed}
.stem{font-size:17px;font-weight:600;line-height:1.75;margin-bottom:16px;white-space:pre-wrap}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:11px;align-items:flex-start;padding:13px 14px;border:1.6px solid var(--line);border-radius:12px;cursor:pointer;transition:.15s;background:#fbfcfd;font-size:15.5px;line-height:1.6}
.opt:active{transform:scale(.99)}
.opt .k{flex:0 0 25px;height:25px;border-radius:50%;background:#eef2f6;color:var(--sub);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;transition:.15s}
.opt .v{flex:1;white-space:pre-wrap;padding-top:1px}
.opt.sel{border-color:var(--pri);background:#f0fdfa}
.opt.ok{border-color:var(--ok);background:#f0fdf4}
.opt.ok .k{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:#fef2f2}
.opt.bad .k{background:var(--bad);color:#fff}
.opt.dis{pointer-events:none;opacity:.72}
.opt.dis.ok,.opt.dis.bad{opacity:1}
.ansbox{margin-top:16px;padding:13px 15px;border-radius:12px;font-size:15px;display:none}
.ansbox.show{display:block;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ansbox.right{background:#f0fdf4;border:1px solid #bbf7d0}
.ansbox.wrong{background:#fef2f2;border:1px solid #fecaca}
.ansbox .t{font-weight:700;margin-bottom:4px}
.ansbox.right .t{color:var(--ok)}
.ansbox.wrong .t{color:var(--bad)}
.fallback{margin-top:14px;padding:13px 15px;background:#fffbeb;border:1px dashed #fcd34d;border-radius:12px;font-size:15px;white-space:pre-wrap;line-height:1.8}
/* 解析与出处 */
.expl{margin-top:12px;border:1px solid #dbeafe;border-radius:12px;background:#f8fbff;overflow:hidden}
.expl-h{display:flex;align-items:center;gap:7px;padding:11px 14px;cursor:pointer;font-size:14px;font-weight:600;color:#1d4ed8;user-select:none}
.expl-h .ico{font-size:15px}
.expl-h .ar{margin-left:auto;transition:transform .2s;font-size:12px;color:#93b4f0}
.expl.open .expl-h .ar{transform:rotate(180deg)}
.expl-b{display:none;padding:0 14px 13px 14px}
.expl.open .expl-b{display:block}
.expl-txt{font-size:14.5px;line-height:1.85;color:#334155}
.expl-src{margin-top:10px;padding-top:9px;border-top:1px dashed #cfe0fb;font-size:13px;line-height:1.7;color:#64748b}
/* 解剖示意图 */
.anat{margin-top:12px;border:1px solid #fed7aa;border-radius:12px;background:#fffbf5;overflow:hidden}
.anat-h{display:flex;align-items:center;gap:7px;padding:11px 14px;cursor:pointer;font-size:14px;font-weight:600;color:#c2410c;user-select:none}
.anat-h .ico{font-size:15px}
.anat-h .ar{margin-left:auto;transition:transform .2s;font-size:12px;color:#fdba74}
.anat.open .anat-h .ar{transform:rotate(180deg)}
.anat-b{display:none;padding:0 10px 12px 10px}
.anat.open .anat-b{display:block}
.anat-svg{background:#fff;border-radius:10px;padding:6px;overflow-x:auto}
.anat-svg svg{display:block;width:100%;height:auto;max-width:100%}
.anat-cap{text-align:center;font-size:12.5px;color:#9a6b4b;margin-top:8px;line-height:1.5}
.anat-zoom{text-align:center;font-size:11.5px;color:#c2410c;margin-top:5px;opacity:.75}
.anat-svg{cursor:zoom-in}
/* 全屏放大层 */
.anim-zoom{position:fixed;inset:0;background:rgba(15,23,42,.94);z-index:9999;display:none;align-items:center;justify-content:center;padding:10px;overflow:auto}
.anim-zoom.on{display:flex}
.az-inner{width:100%;max-width:780px;text-align:center}
.az-cap{color:#e2e8f0;font-size:13px;margin-top:12px;line-height:1.6}
.az-tip{color:#94a3b8;font-size:12px;margin-top:8px}

.toolbar{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px 14px calc(env(safe-area-inset-bottom) + 10px);display:flex;gap:10px;max-width:720px;margin:0 auto}
.btn{flex:1;border:none;border-radius:12px;padding:14px;font-size:16px;font-weight:600;cursor:pointer;transition:.15s;font-family:inherit}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(135deg,var(--pri),var(--pri-l));color:#fff;box-shadow:0 4px 14px rgba(15,118,110,.3)}
.btn.gray{background:#eef2f6;color:var(--txt)}
.btn.small{flex:0 0 auto;padding:14px 18px}
.btn:disabled{opacity:.5}
.range{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chip{padding:9px 15px;border-radius:22px;background:#fff;border:1.5px solid var(--line);font-size:13.5px;cursor:pointer;font-weight:500;white-space:nowrap}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.chips-wrap{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;max-height:168px;overflow-y:auto}
.wrongitem{padding:14px;background:#fff;border-radius:14px;margin-bottom:10px;box-shadow:0 2px 10px rgba(15,23,42,.05);cursor:pointer}
.wrongitem .s{font-size:15px;font-weight:600;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wrongitem .m{font-size:12px;color:var(--sub);margin-top:7px}
.empty{text-align:center;color:var(--sub);padding:60px 20px;font-size:15px}
.empty .ico{font-size:44px;margin-bottom:12px}
.hint{font-size:12.5px;color:var(--sub);text-align:center;margin-top:14px;line-height:1.7}
.done-card{background:linear-gradient(135deg,#ecfdf5,#f0fdfa);border:1px solid #a7f3d0;border-radius:16px;padding:20px;text-align:center}
.done-card .big{font-size:34px;font-weight:800;color:var(--pri)}
.done-card .txt{font-size:14px;color:#0f766e;margin-top:6px}
.stat{background:#fff;border-radius:14px;padding:16px;text-align:center;box-shadow:0 2px 10px rgba(15,23,42,.05)}
.stat .n{font-size:28px;font-weight:800;color:var(--pri);line-height:1.2}
.stat .l{font-size:12px;color:var(--sub);margin-top:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sect{font-size:13px;color:var(--sub);font-weight:600;margin:18px 4px 8px}
.quote{font-size:13.5px;color:var(--sub);text-align:center;margin:16px 0 4px;line-height:1.8}
.footnote{font-size:11.5px;color:#94a3b8;text-align:center;padding:16px 20px;line-height:1.8}
.crown{display:inline-block;background:#fef3c7;color:#b45309;font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600}
#mirrorWarn{display:none;background:#fef2f2;border-bottom:1px solid #fecaca;color:#991b1b;font-size:12.5px;line-height:1.6;padding:calc(env(safe-area-inset-top) + 8px) 14px 8px;text-align:center}
#mirrorWarn.on{display:block}
#mirrorWarn b{color:#dc2626}
#mirrorWarn .u{display:block;margin-top:4px;color:#b91c1c;word-break:break-all;font-size:11.5px}
.verstamp{display:inline-block;background:#f1f5f9;color:#64748b;font-size:10.5px;padding:2px 8px;border-radius:10px}
/* 考试 */
.examcard{background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;border-radius:16px;padding:20px;box-shadow:0 6px 20px rgba(37,99,235,.28);cursor:pointer;position:relative;overflow:hidden}
/* 速记卡 */
.cardrow{background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff;border-radius:16px;padding:20px;box-shadow:0 6px 20px rgba(15,118,110,.28);cursor:pointer;position:relative;overflow:hidden}
.cardrow:active{transform:scale(.99)}
.cardrow h3{font-size:19px;font-weight:800;margin-bottom:6px}
.cardrow p{font-size:13px;opacity:.92;line-height:1.7}
.cardrow .go{display:inline-block;margin-top:14px;background:#fff;color:#0f766e;font-weight:700;font-size:14px;padding:9px 20px;border-radius:22px}
.card-row{display:flex;align-items:center;gap:12px;background:#fff;border-radius:12px;padding:13px 15px;margin-bottom:9px;border-left:5px solid #0f766e;box-shadow:0 1px 4px rgba(15,23,42,.07);cursor:pointer}
.card-row:active{transform:scale(.995);background:#f8fafc}
.cr-l{flex:1;min-width:0}
.cr-t{font-size:15px;font-weight:700;color:#1e293b;line-height:1.4}
.cr-s{font-size:12px;color:#94a3b8;margin-top:4px;display:flex;align-items:center;gap:6px}
.lv{color:#fff;font-size:11px;padding:2px 7px;border-radius:9px;font-weight:600}
.cr-a{font-size:22px;font-weight:700;line-height:1}
.cv-head{background:#fff;border:2px solid #0f766e;border-radius:14px;padding:16px;margin-bottom:14px;text-align:center}
.cv-lv{display:inline-block;color:#fff;font-size:12px;padding:3px 11px;border-radius:11px;font-weight:700;margin-bottom:8px}
.cv-title{font-size:19px;font-weight:800;color:#1e293b;line-height:1.4}
.cv-q{background:#fef9c3;border-left:5px solid #eab308;padding:11px 14px;border-radius:0 8px 8px 0;font-weight:700;color:#854d0e;font-size:14.5px;line-height:1.6;margin:12px 0}
.cv-sub{font-size:15.5px;font-weight:800;margin:16px 0 8px;padding-left:2px}
.cv-tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px;box-shadow:0 1px 4px rgba(15,23,42,.08)}
.cv-t{width:100%;border-collapse:collapse;font-size:13.5px;background:#fff;min-width:100%}
.cv-t th{color:#fff;padding:8px 9px;text-align:left;font-weight:700;font-size:13px;white-space:nowrap}
.cv-t td{padding:8px 9px;border-bottom:1px solid #e6edf2;color:#334155;line-height:1.5;vertical-align:top}
.cv-t tr:nth-child(even) td{background:#f8fafc}
.cv-l{margin:6px 0 0 0;padding-left:20px}
.cv-l li{font-size:14.5px;line-height:1.75;color:#334155;margin:5px 0}
.examcard:active{transform:scale(.99)}
.examcard h3{font-size:19px;font-weight:800;margin-bottom:6px}
.examcard p{font-size:13px;opacity:.9;line-height:1.7}
.examcard .go{display:inline-block;margin-top:14px;background:#fff;color:#1e3a8a;font-weight:700;font-size:14px;padding:9px 20px;border-radius:22px}
.memcard{background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff;border-radius:16px;padding:20px;box-shadow:0 6px 20px rgba(124,58,237,.28);cursor:pointer;position:relative;overflow:hidden}
.memcard:active{transform:scale(.99)}
.memcard h3{font-size:19px;font-weight:800;margin-bottom:6px}
.memcard p{font-size:13px;opacity:.92;line-height:1.7}
.memcard .go{display:inline-block;margin-top:14px;background:#fff;color:#7c3aed;font-weight:700;font-size:14px;padding:9px 20px;border-radius:22px}
.memprog{margin-top:12px;background:rgba(255,255,255,.18);border-radius:10px;padding:9px 12px}
.memprog.noprog{font-size:12px;color:#f3e8ff;text-align:center;padding:9px 12px;background:rgba(255,255,255,.14)}
.memprog .mp-top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:6px}
.memprog .mp-top b{color:#fff;font-size:14px}
.memprog .mp-bar{height:7px;background:rgba(255,255,255,.3);border-radius:6px;overflow:hidden}
.memprog .mp-bar i{display:block;height:100%;background:#fff;border-radius:6px}
.mp-plan{margin-top:8px;font-size:12px;color:#f3e8ff;background:rgba(255,255,255,.16);border-radius:8px;padding:6px 10px;text-align:center}
/* 背题模式 */
.mem-opt{display:flex;gap:11px;align-items:flex-start;padding:12px 14px;border:1.6px solid var(--line);border-radius:12px;background:#fbfcfd;font-size:15.5px;line-height:1.6}
.mem-opt.correct{border-color:#16a34a;background:#f0fdf4}
.mem-opt .k{flex:0 0 25px;height:25px;border-radius:50%;background:#eef2f6;color:var(--sub);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.mem-opt.correct .k{background:#16a34a;color:#fff}
.mem-opt .v{flex:1;padding-top:1px}
.mem-ans{margin-top:14px;padding:12px 15px;border-radius:12px;background:#f0fdf4;border:1px solid #bbf7d0;font-size:15px}
.mem-ans .lb{font-weight:700;color:#16a34a}
.mem-nav{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border-radius:14px;padding:10px 14px;box-shadow:0 2px 10px rgba(15,23,42,.05);margin-bottom:12px;font-size:13px;color:var(--sub)}
.mem-nav .jump{display:flex;align-items:center;gap:6px}
.mem-nav input{width:56px;border:1.5px solid var(--line);border-radius:8px;padding:6px 8px;font-size:14px;text-align:center;font-family:inherit}
.mem-mark{display:flex;gap:10px;margin-top:14px}
.mem-mark .b{flex:1;padding:12px;border-radius:12px;font-size:15px;font-weight:600;text-align:center;cursor:pointer;border:1.6px solid var(--line);background:#fff;transition:.15s}
.mem-mark .b:active{transform:scale(.98)}
.mem-mark .b.know.on{background:#dcfce7;border-color:#16a34a;color:#15803d}
.mem-mark .b.un.on{background:#fee2e2;border-color:#dc2626;color:#b91c1c}
.mem-hide .opts,.mem-hide .mem-ans{filter:blur(9px);pointer-events:none;user-select:none}
.reveal{text-align:center;font-size:14px;color:#7c3aed;font-weight:600;margin-top:12px;cursor:pointer;border:1.5px dashed #c4b5fd;border-radius:12px;padding:11px}
.mem-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.mem-stats .it{background:#fff;border-radius:12px;padding:12px 8px;text-align:center;box-shadow:0 2px 10px rgba(15,23,42,.05)}
.mem-stats .it b{display:block;font-size:22px;font-weight:800;color:#7c3aed;line-height:1.2}
.mem-stats .it span{font-size:11.5px;color:var(--sub)}
.resumebar{background:linear-gradient(135deg,#f5f3ff,#ede9fe);border:1px solid #ddd6fe;border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:13.5px;color:#5b21b6}
.resumebar .tx{font-weight:600}
.resumebar .tx b{color:#7c3aed}
.resumebar .acts{display:flex;gap:14px;margin-top:8px;flex-wrap:wrap}
.resumebar .acts span{color:#7c3aed;font-weight:600;cursor:pointer;border-bottom:1px dashed #a78bfa}
.resumebar .acts span.x{color:#94a3b8;border-bottom:none;font-weight:500}
.planbar{background:linear-gradient(135deg,#ecfeff,#f0fdfa);border:1px solid #a5f3ed;border-radius:14px;padding:13px 16px;margin-bottom:12px}
.planbar .pb-h{font-size:13px;color:#0e7490}
.planbar .pb-h b{color:#0891b2;font-size:15px}
.planbar .pb-big{font-size:30px;font-weight:800;color:#0f766e;line-height:1.15;margin:2px 0}
.planbar .pb-big span{font-size:14px;font-weight:600;color:#14b8a6;margin-left:4px}
.planbar .pb-desc{font-size:12px;color:#0e7490;line-height:1.6}
.planbar .pb-meta{font-size:11.5px;color:#5eafb8;margin-top:5px}
.timer{background:rgba(255,255,255,.25);padding:4px 12px;border-radius:20px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.5px}
.timer.warn{background:#fecaca;color:#991b1b}
.sheet{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:12px}
.sheet .s{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:8px;background:#eef2f6;font-size:13px;font-weight:600;color:var(--sub);cursor:pointer;border:1.5px solid transparent}
.sheet .s.done{background:#d1fae5;color:#065f46}
.sheet .s.cur{border-color:var(--pri);color:var(--pri);background:#f0fdfa}
.result-ring{text-align:center;padding:10px 0}
.result-ring .score{font-size:56px;font-weight:800;line-height:1}
.pass{color:#16a34a}.fail{color:#dc2626}
.rlist{margin-top:6px}
.rlist .ri{padding:12px 0;border-bottom:1px solid #eef2f6;font-size:14.5px}
.rlist .ri:last-child{border-bottom:none}
.rlist .ri .q{font-weight:600;line-height:1.6}
.rlist .ri .a{font-size:13px;margin-top:5px;color:var(--sub)}
.rlist .ri .a b{color:#16a34a}
.rlist .ri .a i{color:#dc2626;font-style:normal}
::-webkit-scrollbar{width:0}
@keyframes slideL{from{opacity:.25;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes slideR{from{opacity:.25;transform:translateX(-26px)}to{opacity:1;transform:none}}
#main.slide-left{animation:slideL .22s ease}
#main.slide-right{animation:slideR .22s ease}
.swipe-hint{font-size:12px;color:#94a3b8;text-align:center;margin-top:10px}
.swipe-hint b{color:#0f766e}
</style>
</head>
<body>
<div id="mirrorWarn"></div>
<div id="app">
  <header>
    <div class="hd">
      <div>
        <h1 id="hdTitle">湖南医师定考</h1>
        <div class="sub" id="hdSub">2023—2025 周期 · 补考冲刺</div>
      </div>
      <div class="badge" id="todayBadge">今日 0/200</div>
    </div>
    <div class="progbar"><i id="pbar"></i></div>
    <div class="pgtxt"><span id="pgLeft">每日目标 200 题</span><span id="pgRight">0%</span></div>
  </header>
  <main id="main"></main>
  <div class="toolbar" id="toolbar"></div>
</div>
<script>

禁区，C未婚男女生育不符合我国规定，E控制人口数量是计划生育政策目标而非该技术目的。\n\n📚 出处：《医学伦理学》第5版·生殖伦理"],["关于医学伦理学基本原则的说法，以下正确的是",["四个基本原则中不伤害原则是最重要的","在实际应用中，这四个原则只有在不冲突的情况下才有效","四个基本原则中有利原则是最重要的","这四个原则中公正原则是最不重要的","这四个原则之间存在冲突的情况，需要具体判断"],"E",1,"rw","医学伦理","尊重、不伤害、有利、公正四原则无绝对的主次之分，在不同情境中权重不同；当原则之间发生冲突（如尊重自主与不伤害、有利与公正）时，须结合具体情况进行权衡并使所选行为符合最小损害和社会公益，故E正确。A、C、D武断排序，B\"只有不冲突时才有效\"与临床实际相悖。\n\n📚 出处：《医学伦理学》第5版·医学伦理原则"],["当妊娠危及胎儿母亲的生命时，可允许行人工流产或引产。这符合",["行善原则","公正原则","不伤害原则","尊重原则","自主原则"],"C",1,"rw","人文综合","不伤害原则要求避免给患者造成可预见的、不必要的伤害；当继续妊娠将危及母亲生命时，两种选择都有损害，此时选择对母亲损害更小者（终止妊娠），符合\"两害相权取其轻\"的不伤害要求。A行善（有利）、B公正、D尊重、E自主均不能解释这种\"为避免更大伤害而采取的干预\"的伦理依据。\n\n📚 出处：《医学伦理学》第5版·医学伦理原则"],["医学伦理学是研究什么的一门学科",["行为方式","医学道德","法律规范","科研方法","医疗行为"],"B",1,"rw","医学伦理","医学伦理学是研究医学道德的科学，研究医学领域中的道德意识、道德关系、道德活动及其规律，并形成规范体系指导实践。A行为方式过于宽泛，C法律规范属法学，D科研方法属方法学，E医疗行为只是其考察对象之一，均未准确界定学科性质。\n\n📚 出处：《医学伦理学》第5版·绪论"],["以下哪项不属于生殖技术的伦理问题",["谁应该是孩子的父母","影响后代的健康成长","导致人类伦理关系的混乱","影响人类基因的纯洁性","商品化问题"],"D",1,"rw","医学伦理","生殖技术引发的伦理问题集中在：亲子关系与父母身份的认定、代孕与供精供卵对后代成长的影响、血缘关系交叉导致的伦理关系混乱、配子与胚胎的商品化等。D\"影响人类基因的纯洁性\"是基因工程与优生学讨论中带有种族主义色彩的伪命题，不属生殖技术的伦理问题。\n\n📚 出处：《医学伦理学》第5版·生殖伦理"],["避免高科技在医学中应用出现负效应的主要办法是",["结合患者的经济条件","掌握高科技使用的范围","加强高科技在医学中使用的伦理学教育","关心病人，减少不必要检查","注意生态环境的保护"],"C",1,"rw","人文综合","高科技在医学中应用的负效应（过度检查、技术至上、忽视人文关怀、费用攀升）主要源于使用者的价值取向，故根本办法是加强医学伦理教育，使技术应用始终受伦理规范约束。A经济条件、B掌握使用范围只是技术层面的限制，D减少检查属具体措施，E生态保护与本问题无直接关系。\n\n📚 出处：《医学伦理学》第5版·医学技术伦理"],["医生将一个坏消息告知患者并达成治疗共识后，一般在结束此次谈话前留联系方式给患者，表明医生",["态度好","希望与患者建立治疗同盟","不怕患者的麻烦","医疗技术很高","担心患者想找自己时找不到"],"B",1,"rw","医学伦理","告知坏消息并达成治疗共识后留下联系方式，表明医生愿意继续为患者提供支持、随时答疑，是把医患关系从一次性告知转为持续合作，即建立治疗同盟。A态度好流于表面，C不怕麻烦只是消极表述，D与技术水平无关，E仅着眼于联系方式的功能细节，未点明关系实质。\n\n📚 出处：《医患沟通学》·坏消息告知"],["以下哪项可称为“棘手病人”",["喜欢挑战医生的病人","文化程度低下的病人","人际关系有障碍的病人","想知道更多的病人","希望同医生展开讨论的人"],"C",1,"rw","人文综合","\"棘手病人\"通常指人际关系困难、难以建立信任与合作的患者，如多疑、敌意、过度要求或人际冲突明显者。A喜欢挑战医生、D想了解更多、E希望与医生讨论，往往是积极参与型患者，若引导得当可成为合作者；B文化程度低只影响沟通方式，可通过通俗解释解决，不构成棘手本质。\n\n📚 出处：《医患沟通学》·特殊患者沟通"],["开放式提问可让回答者自由发挥，适用于答案较多、较复杂的问题。以下哪项属于开放式提问",["早晨醒来时会有头痛吗","跟我谈谈你的头痛吧","昨天你头痛了吗","哪些情况会使你的头痛加重或减轻","你的头痛是在左侧还是在右侧"],"B",1,"rw","医患沟通","开放式提问不限定答案范围，鼓励自由叙述，\"跟我谈谈你的头痛吧\"是典型的开放式引导。A\"早晨醒来时会有头痛吗\"、C\"昨天你头痛了吗\"、E\"左侧还是右侧\"都是限定答案的封闭式提问；D虽为开放句式但已限定\"加重或减轻\"的具体维度，属有限开放式，不如B常用。\n\n📚 出处：《医患沟通学》·提问技巧"],["医患关系中的“医”是指",["医师和护士","医疗机构及其管理人员","医技人员","医院后勤人员","以上全部"],"E",1,"rw","医学伦理","医患关系中的\"医方\"是广义概念，包括医疗机构及其医务人员（医师、护士、医技人员）以及管理人员、后勤保障人员等，凡以机构名义参与诊疗服务者均属医方，其行为后果由医疗机构承担。A、B、C、D各只涵盖一部分，故E最准确。\n\n📚 出处：《医学伦理学》第5版·医患关系"],["以下哪种能力不属于医患沟通能力模型",["谈判与化解冲突的能力","主动倾听能力","口头表达能力","组织管理能力","职业化态度与服务能力"],"D",1,"rw","医患沟通","医患沟通能力模型包括主动倾听、口头表达与非语言表达、共情与情感回应、谈判与化解冲突、职业化态度与服务能力等核心要素。组织管理能力属医院管理岗位的能力要求，不属医患沟通能力结构，故选D。\n\n📚 出处：《医患沟通学》·概论"],["以下哪项是构成医患交往障碍患者方面的因素",["医生对患者的关注不够","医务人员对患者的偏见","医生对个人功利的过分追求","患者对医务人员过高的期望值","医务人员的医德医风问题"],"D",1,"rw","医患沟通","医患交往障碍的原因分医方与患方两方面。医方因素包括对患者关注不足、存在偏见、追求个人功利、医德医风问题、沟通技巧欠缺等；患方因素包括对医务人员期望值过高、对医学的误解、情绪状态、经济与文化背景差异等。A、B、C、E均属医方因素，只有D属患方因素，故选D。\n\n📚 出处：《医患沟通学》·沟通障碍"],["医生和患者交谈时，医生的哪种目光是适当的",["目光长久直视患者","不时的注意患者面部和全身","回避患者视线，仅瞬间目光接触","避免目光接触","注视患者脸部以外的地方"],"B",1,"rw","医患沟通","交谈时目光应自然、适时地接触，兼顾患者面部与全身的观察，既表达关注又能获取非语言信息，避免长时间直盯造成压迫或完全回避显得冷漠。A长久直视易使患者紧张，C仅瞬间接触、D完全避免接触、E注视别处均传递回避或不在意，不利建立信任。\n\n📚 出处：《医患沟通学》·非语言沟通"],["针对患者治疗期间可能出现的紧急情况，需要进行的沟通是",["无法预测和事先沟通","安排对患者的定期随访","提供紧急情况时获得医疗救助的途径","告诉患者要坚强和乐观面对","交代患者家属细心照料和督促治疗"],"C",1,"rw","医患沟通","对治疗期间可能出现的紧急情况，沟通的重点是告知患者及家属识别警示症状的方法和获得紧急医疗救助的途径（急救电话、就近急诊、随访联系方式、绿色通道），并写入出院或告知书。A\"无法预测\"放弃准备，B定期随访不能应急，D、E属心理鼓励和家属照料，均非应急沟通的核心内容。\n\n📚 出处：《医患沟通学》·特殊情境沟通"],["医患关系是一种",["互利关系","义务关系","信托关系","权利关系","共勉关系"],"C",1,"rw","医学伦理","医患关系本质上是以信任为基础的信托关系：患者基于信任将健康与生命托付给医方，医方以忠实、勤勉、保密和最佳利益为义务回应这种托付，法律上也属委托合同性质的医疗服务关系。A互利带有交易色彩，B义务关系不能说明信任内核，D权利关系片面，E共勉关系不是规范表述。\n\n📚 出处：《医学伦理学》第5版·医患关系"],["导致临床医疗事故与差错的许多原因中，最应引起重视的是",["医务人员的经验不足","医务人员的责任心不强","医院设备力量不够先进","医务人员的技术水平差","医院管理能力不强"],"B",1,"rw","卫生法律法规","医疗事故与差错绝大多数源于违反规章制度、查对不严、观察不细、交接不清等责任心问题，而非设备或技术水平的绝对不足。技术可以通过培训和设备投入改善，责任心须靠制度约束与医德教育强化，故最应引起重视的是责任心不强。A、D属能力技术层面，C、E属条件和管理层面，均非最主要原因。\n\n📚 出处：《医疗事故处理条例》·医疗事故的预防"],["医师的义务和权利不包括",["履行自己的义务","保证病人平等医疗权","保证病人身心健康","保证治疗效果","保证病人医疗权的实现"],"D",1,"rw","卫生法律法规","医师的义务是依法履行诊疗职责、尊重和保障患者平等医疗权及知情同意权、保护隐私、遵守规范、宣传卫生知识等；权利是可以出具医学证明、获得报酬、参加学术团体、接受继续教育等。而治疗结果受患者体质、病情和医学局限影响，医师只能尽到应有的注意义务，法律上不承担\"保证治疗效果\"的义务，故选D。\n\n📚 出处：《执业医师法》·执业规则"],["市场经济条件下的医德建设，重点是纠正和防止",["稀有卫生资源分配不公的现象","追求个人正当利益的现象","忽视卫生事业的福利性","强调医务人员的社会价值","片面追求经济效益的行为"],"E",1,"rw","医学伦理","市场经济条件下医德建设的重点是纠正和防止片面追求经济效益的行为，如过度检查、开大处方、分解收费、以经济指标考核医务人员，防止医疗服务的公益性被逐利动机侵蚀。A资源分配不公属制度层面，B追求正当利益本身并不被否定，C忽视福利性与D强调社会价值均非当前重点。\n\n📚 出处：《医学伦理学》第5版·医德建设"],["医疗机构应当按照国务院卫生主管部门制定的医疗技术临床应用管理规定，开展以下哪项服务，保障临床应用安全，降低医疗风险",["与其技术能力相适应的医疗技术","医疗新技术","技术水平绝对成熟的","大众认可的的医疗技术","医院特色技术"],"A",1,"rw","卫生法律法规","《医疗纠纷预防和处理条例》要求医疗机构应当按照国务院卫生主管部门制定的医疗技术临床应用管理规定，开展与其技术能力相适应的医疗技术，保障临床应用安全，降低医疗风险；开展限制类技术须备案，禁止类技术不得开展。B新技术须经评估审批，C\"绝对成熟\"表述绝对化，D大众认可、E特色技术均非法律标准。\n\n📚 出处：《医疗纠纷预防和处理条例》·医疗纠纷的预防"],["关于医德良心，下述提法中错误的是",["医德良心是对道德情感的深化","医德良心是对道德责任的自觉认识","医德良心是一种自我评价能力","医德良心是一种强烈的道德责任感","医德良心因其不可见而很难确定其对行为的作用"],"E",1,"rw","医学伦理","医德良心是道德情感的深化，是对道德责任的自觉认识和强烈的道德责任感，也是一种自我评价能力。它虽不可见，却通过行为选择、内心自责与满足感实际发挥作用，可以确定其对行为的影响，故E错误。A、B、C、D均为对医德良心的正确描述。\n\n📚 出处：《医学伦理学》第5版·医学道德范畴"],["我国广大卫生医务人员在工作岗位上应坚持放在第一位的是",["医疗服务的经济效益","经济效益与社会效益","人民群众健康和生命安全","社区卫生预防","社区卫生服务"],"C",1,"rw","人文综合","我国卫生工作的根本宗旨是全心全意为人民健康服务，医务人员在岗位上必须把人民群众的健康和生命安全放在第一位，当经济利益与患者安全发生冲突时以生命安全优先。A、B以经济效益为先违背公益性质，D、E社区卫生预防与服务是工作内容之一，不能作为\"第一位\"的表述。\n\n📚 出处：《医学伦理学》第5版·医德原则"],["在公正的内容原则中，进行公正分配的根据不包括",["根据个人能力","根据对社会的贡献","根据个人的地位","根据科研价值","根据个人需要"],"C",1,"rw","医学伦理","公正分配稀缺卫生资源可依据个人需要、能力和努力程度、对社会贡献、科研价值与效用等因素，而个人的社会地位、权力和财富不应成为分配依据。故\"根据个人的地位\"被排除在公正分配根据之外，选C。本题与rw24重复，答案一致。\n\n📚 出处：《医学伦理学》第5版·医学伦理原则"],["赵某 6 岁的孙子因发热、头痛、咽喉疼痛、咳嗽、痰粘、鼻塞、黄涕等症状到一家医院就诊。医生除查体外，开出的检查单包括拍胸片、三大常规、脑电图等常规检查，还要求做了头颅 CT、核磁共振、胸腹部彩超、艾滋病、梅毒、类风湿等 53 项检查。赵某出于对医生的信任，便顺其自然。可通过两天的检查，花去近五千多元费用，结论是一般的风热感冒。至此，赵某觉得自己遭遇了媒体曝光的“过度检查”，遂要求医院赔偿。该医生的医疗行为是",["赵某和其孙子当时未有异议，该医生的医疗行为无不当之处","属于过度医疗","多做一些检查，是为病人好，该医生的医疗行为无可厚非","医生和医院的行为均无不妥","属于正常医疗"],"B",1,"rw","卫生法律法规","对风热感冒患儿开具头颅CT、核磁共振、胸腹彩超、艾滋病梅毒类风湿等53项检查，与病情明显不相称，违反辅助检查的适应证要求和\"必要、适宜、经济\"原则，属典型的过度医疗，依《基本医疗卫生与健康促进法》不得实施不必要的检查。A、C、D、E以\"无异议\"\"为病人好\"为由为其开脱，均不能成立。\n\n📚 出处：《基本医疗卫生与健康促进法》·医疗卫生机构"],["孙某开办了一家个体诊所，为附近的居民进行诊治，后来他因某事而被判处了有期徒刑。人们猜测出几种可能的原因，其中哪种可以得到卫生法律理论的支持",["孙某逾期不校验《医疗机构执业许可证》，仍从事诊疗活动","孙某开办的诊所并未取得《医疗机构执业许可证》，经其诊治的患者中有多人出现严重不良反应","孙某将自己的《医疗机构执业许可证》借给朋友王某使用，王某以此许可证开办个体诊所","孙某应患者的要求，给其开具虚假医疗证明","孙某雇佣了不懂医术的赵某帮助其治疗病人"],"B",1,"rw","卫生法律法规","未取得《医疗机构执业许可证》而开办诊所行医，属非法行医；非法行医情节严重（如被卫生行政部门处罚两次后仍不改、造成就诊人严重损害等）的构成非法行医罪，应被判处有期徒刑。A逾期不校验、C出借许可证、D出具虚假证明、E雇用非卫生技术人员，依法多为责令改正、罚款、吊销执照等行政处罚，一般不足以判处有期徒刑。\n\n📚 出处：《执业医师法》·法律责任"],["一位 30 多岁的男性，因情绪低落，兴趣丧失，对自己的身体健康过分关心而来到心理门诊求医。如果需给他作临床评定，应考虑首选的量表是",["大体退化量表","MMPI","Hamilton 焦虑量表","Hamilton 抑郁量表","H.R 神经心理成套测验"],"D",1,"rw","医学心理","患者以情绪低落、兴趣丧失、过分关注身体健康为主要表现，提示抑郁，宜首选汉密尔顿抑郁量表（HAMD）作临床评定，由医生半结构化访谈评分，适用于严重程度评估与疗效观察。B MMPI耗时长、非首选；C汉密尔顿焦虑量表针对焦虑；A、E与本例症状不匹配。\n\n📚 出处：《医学心理学》·心理测验"],["病人因交通事故受伤住院，住院期间入睡困难，总是做噩梦，而且患者述说脑中总是闪现对面车辆撞过来的那一幕。这种现象称为",["创伤性应激","创伤后应激障碍","医院焦虑障碍","创伤恐怖症","医院恐怖障碍"],"A",1,"rw","人文综合","交通事故后于住院期间出现入睡困难、反复噩梦、脑中反复闪现撞车场景，核心是创伤事件的侵入性再体验。关键在病程：DSM-5 规定急性应激障碍（ASD）于创伤后 3 天至 1 个月内起病、症状持续 2 天至 4 周；而创伤后应激障碍（PTSD）要求症状持续超过 1 个月。本例症状发生在住院期间，通常不足 1 个月，应归入急性应激障碍，对应选项\"创伤性应激\"（A）。若症状持续超过 1 个月并伴持续回避、警觉性增高、负性认知与情绪改变，才诊断 PTSD（B）。C、E 强调对医院环境的焦虑与恐惧，D 为特定恐怖症，均不能解释创伤场景的反复闪回。\n\n📚 出处：《精神病学》第8版·应激相关障碍·急性应激障碍与创伤后应激障碍的鉴别"],["一位 4 岁病儿患急性菌痢住进医院，经治疗已好转，行将出院。其父母觉得小儿虚弱，要求输血，碍于情面，医生同意了，可护士为了快点交班，提议给予静脉推注输血。当时病儿哭闹，医护齐动手给他输血过程中，病儿突发心跳骤停死亡。此案例中医护人员的伦理过错是",["无知无原则，违背了人道主义原则","无知无原则，违背了有利患者的原则","曲解家属自主权，违反操作规程，违背了有利患者的原则","曲解家属自主权，违反操作规程，违背了不伤害患者的原则","曲解家属自主权，违反操作规程，违背了人道主义原则"],"D",1,"rw","医学伦理","医护的过错有三层：一是曲解家属自主权，家属仅有\"要求输血\"的意愿，输血须有医学指征并经医师独立判断，不能碍于情面应允；二是违反操作规程，采用静脉推注输血并强行按压哭闹患儿；三是明知无指征输血并违规操作，将患儿置于可预见的风险中并致死，违背不伤害原则。A、B未点出曲解自主权与违规，C\"有利\"不如\"不伤害\"贴切，E人道主义过于笼统。\n\n📚 出处：《医学伦理学》第5版·临床诊疗伦理"],["一对未婚夫妇来到某妇幼保健院做婚检。检查结果发现男方患有梅毒，男方担心女友离开自己，要求医生为自己保密，女方则要求医师告知其男友的真实情况。从医学伦理学的角度分析，最合理的是",["医师应该为男士保密","医师应该告知女士真实情况，但对外保密","医师应该说服男士，将实情告知女友，但若男士坚决反对，则应尊重其意见","该女士无权向医师提出知晓其男友实情的要求","请示领导再作决定"],"B",1,"rw","医学伦理","梅毒为乙类传染病，涉及婚检相对方的重大健康利益和知情权。医师应为患者保密，但当保密将给对方造成明显损害时构成例外，应告知女方真实情况并劝导男方接受治疗，同时避免向无关第三人扩散，做到\"告知必要对象 发展医学科学而造福人类，任何背离这一目的的研究都不具伦理正当性。B服务于战争与时局、C满足个人兴趣、D、E服务于机构或单位需要，都是把人当作手段的工具化目的，违反医学目的原则。\n\n📚 出处：《医学伦理学》第5版·人体试验伦理"],["关于人体试验的第一个伦理学文献是",["《赫尔辛基宣言》","《纽伦堡法典》","《日内瓦宣言》","《东京宣言》","《夏威夷宣言》"],"B",1,"rw","医学伦理","1947年纽伦堡审判后制定的《纽伦堡法典》是第一个关于人体试验的国际伦理文献，确立受试者自愿同意为绝对前提，并提出试验须有科学依据、先经动物实验、避免不必要痛苦、可由受试者随时中止等原则。《赫尔辛基宣言》（1964）是其后由世界医学会制定、影响最大的文献；《日内瓦宣言》《东京宣言》《夏威夷宣言》分别涉及医师誓词、酷刑与精神病学伦理。\n\n📚 出处：《医学伦理学》第5版·人体试验伦理"],["下列哪一项说法是错误的",["行善原则与人体试验是相矛盾的","行善原则是指为了病人的利益应施加的好处","行善原则要求医务人员不伤害病人，而且要促进他们的健康和幸福","行善原则比不伤害原则更加广泛","行善原则与人体试验是不矛盾的"],"A",1,"rw","人文综合","行善原则指医务人员以病人利益为出发点、为其施加好处，既要求不做有害之事，又要主动促进病人的健康与幸福，因而其内涵比不伤害原则更广，B、C、D表述均成立。它与人体试验并不对立：试验若能改进诊疗与预防措施、增进人类健康，其指向本身即是行善，只是须以伦理审查、知情同意、风险最小化和受试者权益优先为条件，故E成立。A把二者截然对立，实质是把试验中的风险绝对化，无视行善原则恰是规范人体试验、使其服务于受试者与人类利益的基本依据，因此错误。\n\n📚 出处：《医学伦理学》第5版·医学伦理学基本原则（行善原则与不伤害原则）"],["医学伦理学的核心问题是",["医务人员之间的关系","医务人员与患者的关系","医务人员与社会之间的关系","医务人员与科学发展之间的关系","医务人员与患者家属的关系"],"B",1,"rw","医学伦理","医患关系是医学伦理学的核心与基本问题。医疗服务以患者为对象，医患关系贯穿诊疗全过程，医际关系、医社关系乃至医患家属关系都以它为基础并围绕它展开。医务人员之间、与社会、与科学发展之间的关系虽也属研究内容，但非核心；与患者家属的关系只是医患关系的延伸，不能替代医患关系本身。\n\n📚 出处：《医学伦理学》第5版·医患关系"],["在下列各项中，违背卫生部颁布的人类辅助生殖技术伦理原则的是使用",["捐赠的精子","亲属代孕","卵胞浆内单精子注射","捐赠的卵子","植入前胚胎遗传学诊断"],"B",1,"rw","医学伦理","卫生部《人类辅助生殖技术管理办法》及配套伦理原则明确禁止任何形式的代孕，包括亲属间代孕、借腹生子，因其把子宫和婴儿工具化，易造成亲子关系与法律身份混乱。供精、供卵、卵胞浆内单精子注射、植入前胚胎遗传学诊断在严格适应证、知情同意与伦理监督下均属可开展技术，故A、C、D、E不构成违规。\n\n📚 出处：《人类辅助生殖技术管理办法》·伦理原则"],["关于临床决策的认识，下列正确的是",["医学伦理学是正确决策的保证","临床决策是单纯的技术决策","临床决策是单纯的伦理决策","临床决策有时是技术的，有时是伦理的","技术决策和伦理决策在临床决策中很难达到统一"],"A",1,"rw","人文综合","临床决策是技术决策与伦理决策在同一过程中的统一，而非“有时技术、有时伦理”。伦理原则和规范为方案选择提供价值依据与底线约束，能防止只顾技术可行而忽视患者利益，因此是正确决策的保证。B、C把决策片面化，D割裂了技术与伦理的双重属性，E否认二者可以统一，均错。\n\n📚 出处：《医学伦理学》第5版·临床诊疗伦理"],["在通常情况下，手术治疗前最重要的伦理原则是",["安慰家属","检查周全","减轻病人的疑虑","知情同意","确定手术方式"],"D",1,"rw","医学伦理","手术具有创伤性和不确定性，术前必须告知术式、风险、替代方案与预后，取得患者或其法定代理人自愿、明确的同意并签署同意书，这是尊重自主原则在临床的直接落实，也是免责的前提。安慰家属、检查周全、减轻疑虑、确定术式都是术前准备的具体环节或结果，无法替代知情同意这一伦理前提。\n\n📚 出处：《医学伦理学》第5版·知情同意"],["以下哪项不属于人体试验",["强迫试验","动物试验","志愿试验","自我试验","天然试验"],"B",1,"rw","医学伦理","人体试验以人为受试对象，志愿试验、自我试验、天然试验（自然条件下的人群观察）均属此列；强 代诊断、病因和治疗","请患者和家属选择治疗方法"],"C",1,"rw","人文综合","解释病情前应先评估患者已知多少、想知道多少，即“先问后讲”：了解其原有认知与期望，才能纠正误解、确定信息深度和用语方式，避免过度告知或告知不足。直接讲预后、先介绍检查程序、直接交代诊断治疗、让患者自己选方案，都跳过了评估环节。\n\n📚 出处：《医患沟通学》·解释病情的步骤"],["下列医患关系中，属于技术关系的是",["医务人员对患者良好的服务态度","医务人员对患者高度的责任心","医务人员对患者的同情和尊重","医务人员以精湛医术为患者服务","医务人员对患者良好的服务态度和高度的责任心"],"D",1,"rw","医学伦理","医患关系包含技术关系与非技术关系两层。技术关系指诊疗活动中以医学知识和技能为内容的服务关系，如以精湛医术实施诊治；服务态度、责任心、同情尊重属于非技术关系中的伦理与情感层面，虽重要但不属于技术关系本身，故A、B、C、E不对。\n\n📚 出处：《医学伦理学》第5版·医患关系"],["对急危患者，医师应当采取的措施是",["一般措施","相应措施","紧急措施","强制措施","报请上级决定采取何种措施"],"C",1,"rw","人文综合","《医师法》执业规则规定，对急危患者，医师应当采取紧急措施进行诊治，不得拒绝急救处置。抢救急危患者具有时间紧迫性，医师须立即施救并同时履行告知、记录义务；一般措施、报请上级决定都会延误抢救，强制措施针对的是不配合隔离治疗等法定情形，与本题无关。\n\n📚 出处：《医师法》·执业规则"],["对化解医患冲突不利的是",["控制好自己的情绪","为对方消气","温和的语气","探究式的问话","立刻指出对方的问题"],"E",1,"rw","医患沟通","化解冲突需要先处理情绪再处理问题：控制自身情绪、让对方宣泄消气、语气温和、用探究式提问了解诉求，均有助于降温和澄清。立刻指出对方的问题等于当面评判指责，会使对方感到被攻击，情绪升级，沟通中断，故最不利于冲突化解。\n\n📚 出处：《医患沟通学》·医患冲突的化解"],["决定输血治疗前，经治医师应向患者或家属说明输血可能引起的不良反应和可能传播扩散的疾病，并且要征得谁的同意",["护士长","主治医师","输血科","患者或家属","其他医生"],"D",1,"rw","人文综合","输血治疗属于有风险的特殊治疗，决定前经治医师应向患者或家属说明输血目的、可能发生的不良反应（如过敏、发热、溶血）和经血传播疾病的风险，并签署输血治疗知情同意书，取得患者或家属同意。护士长、输血科、其他医生均无权代替患者作出同意表示。\n\n📚 出处：《临床输血技术规范》·输血知情同意"],["关于医德情感，以下正确的说法是",["它与医德义务无关","它以医务人员个人的需要为前提","它应能满足病人的一切需要","它是医务人员的盲目冲动","它是医务人员内心体验的自然流露"],"E",1,"rw","医学伦理","医德情感是医务人员基于医德认识，在医疗实践中对患者和诊疗行为产生的内心体验的自然流露，具有职业性和稳定性，并以履行医德义务为前提。它不以个人需要为前提，不是盲目冲动，也不可能满足患者的一切需要，更不能与医德义务相脱离，故A、B、C、D均错。\n\n📚 出处：《医学伦理学》第5版·医学道德范畴"],["医学科研道德是医学科研工作的灵魂，关于它的意义，下列哪项是错误的",["是促进医学科学发展的动力","能保证医学科学研究的正确方向","是创造优良科研环境的重要保证","是推进医学研究成果向产业化发展的重要条件","是取得科研成功的重要前提"],"D",1,"rw","医学伦理","医学科研道德的意义在于提供动力、保证方向、营造良好科研环境、为取得成果提供前提。而“推进研究成果向产业化发展”属于科技政策与产业转化问题，取决于市场、资金与制度，并非科研道德的功能，故为错误项。\n\n📚 出处：《医学伦理学》第5版·医学科研伦理"],["对人体试验中受试者必须知情同意的理解，以下正确的是",["受试者只要签订了知情同意书，就意味着对他完成了知情同意过程","试验中一旦发生对受试者的伤害，知情同意书可以免除试验主持者的责任","知情同意是一个过程，受试者随时有权利了解试验的进程，随时可以退出试验","受试者一旦签订知情同意书，就有义务配合试验主持者完成试验，中途不能退出","可由受试者家属、监护人或代理人代替行使知情同意权"],"C",1,"rw","医学伦理","知情同意是持续的过程而非一次性签字：受试者有权随时了解试验进展、有权随时退出且不影响其应得医疗，签字不能免除研究者的责任。A把过程等同于签字，B错误认为同意书可免责，D否认随时退出权，E错误地把代理人同意当作一般规则（仅无行为能力时适用）。\n\n📚 出处：《医学伦理学》第5版·人体试验伦理"],["最早的医学后果论可以追溯到哪位学者的医学伦理思想，他提出的“有利于病人”、“不伤害病人”原则，具有医学道德终极目的意义，成为医学行为和医学道德规范的出发点",["康德","边沁","亚当·斯密","希波克拉底","穆勒"],"D",1,"rw","医学伦理","希波克拉底的《希波克拉底誓言》提出“为病家谋利益”“不伤害”，把有利于病人、不伤害病人作为医学行为的出发点，被视为医学后果论（功利论）的最早思想渊源。康德属义务论，边沁、穆勒是功利主义系统化者，亚当·斯密为经济学家，年代与内涵均不符。\n\n📚 出处：《医学伦理学》第5版·医学伦理思想的历史演进"],["某县医院妇产科医师欲开展结扎手术业务…该有关单位是指",["地方医师协会","地方卫生行政部门","卫生部","地方医学会","所在医疗保健机构"],"B",1,"rw","人文综合","结扎手术（输卵管结扎、输精管结扎）属母婴保健专项技术，从事该技术须经卫生行政部门许可并按批准的范围内开展。故拟开展此项业务的医师及机构应报请所在地卫生行政部门审批，而非医师协会、医学会、卫生部或本单位自行决定。\n\n📚 出处：《母婴保健法》·专项技术许可"],["“献血大王”刘某，在过去的 7 年间，献血总量已达 5600ml。快满 50",["周岁的刘某告诉记者，如果身体一直保持健康状态，他满 55 周岁以前，还可争取无偿献血 7 次","8 次","9 次","10 次","11 次"],"D",1,"rw","卫生法律法规","《献血法》规定献血年龄为18~55周岁，两次采集全血间隔不少于6个月，每次200~400ml。刘某快满50周岁至55周岁前共约5年，按每6个月一次计可再献血10次。献血量5600ml虽已较多，但不影响按间隔期计算次数，故为10次。\n\n📚 出处：《献血法》·献血者的条件与献血间隔"],["某儿童 8 岁，在智力测验中得分为 100，则其智商(IQ)为",["超常","优秀","平常","低下","智力缺陷"],"C",1,"rw","医学心理","智商按离差智商或比率智商评定，IQ=100恰为人群均值，属平常（中常）水平（约90~109）。超常一般IQ≥130，优秀约120~129，低下约70~89（边缘），智力缺陷IQ<70。故该儿童智力属平常，不能诊断为低下或缺陷，也谈不上超常。\n\n📚 出处：《医学心理学》·心理评估与智力测验"],["患者，男性，25 岁。5 年来一直以购买收藏女性的高跟鞋而感到满足，而且晚上要抱着高跟鞋睡觉，在心理咨询门诊诊断为“恋物癖”。对此类患者的治疗方法最好选择",["人本主义","厌恶治疗","自由联想","系统脱敏","梦的分析"],"B",1,"rw","医学心理","恋物癖属性偏好障碍，核心是异常性兴奋的条件化联结，行为治疗中的厌恶疗法通过把异常刺激与不愉快体验反复配对，削弱其性兴奋反应，疗效较确切。人本主义、自由联想、梦的分析属动力取向或人本取向，不针对症状性行为；系统脱敏用于焦虑恐惧的逐级暴露，不对症。\n\n📚 出处：《医学心理学》·心理治疗"],["肖XX，28岁，因不规则发热2月余，巩膜发黄40多天入院。患者提及7～13岁时有反复发作的上腹部绞痛史，并再三问会否是癌。入院初步诊断：胆道感染并发细菌性脓疡。住院后作十二指肠引流，并进行多项检查，超声波示：肝区有较密的密集微波，SGPT210。剖腹检查：为晚期肝癌，已有腹腔转移，肠系膜根部结节，活检为转移性腺癌(剖腹前患者要求如实了解病情，以作好准备)。诊断结果告知家属和单位领导后，他们都要求积极抢救，对患者进行保密。面对此案例，医务人员从伦理学角度分析，应如何选择行为",["满足家属和单位领导要求，积极抢救治疗","考虑医学道德的要求，不惜一切代价地积极治疗","尊重患者权利，如实告诉病情","为避免使患者精神崩溃，做好保密工作","尊重患者权利，在治疗同时可适当告诉病情"],"E",1,"rw","医学伦理","患者术前已明确要求如实了解病情，其知情权与自主权应受尊重；但晚期肝癌预后差，直接全盘告知可能造成强烈心理冲击，故应在积极治疗的同时，按患者承受能力分阶段、有保留地适当告知，既尊重权利又体现保护性医疗，是最佳选择。A、D只尊重家属意见而牺牲患者权利，C过于生硬，B回避了告知义务。\n\n📚 出处：《医学伦理学》第5版·知情同意与保护性医疗"],["刘某，男，肝癌晚期患者。虽处于极度痛苦之中，但自认为所患疾病是肝硬化，有望治疗。因此，每当有不适时，都希望医护人员能用药物帮助其缓解疼痛，但医护人员的回避态度令病人十分失望。一次，病人 ["知觉的多维性","知觉的整体性","知觉的恒常性","知觉的理解性","知觉的选择性"],"D",1,"rw","人文综合","知觉的理解性指人以已有知识经验为基础，用概念和词语去解释、标记所感知的事物，使其获得意义。多维性、整体性（把对象作为整体把握）、恒常性（条件变化时知觉保持稳定）、选择性（有选择地反映对象）均不涉及经验的参与和概念的赋予。\n\n📚 出处：《医学心理学》·认知过程"],["心理治疗成功的关键是",["患者的主动求医","医生的医术","良好的医患关系","家属的配合","以上均是"],"E",1,"rw","医学心理","心理治疗成效受多因素影响：患者主动求医意味着有改变动机，医生的专业能力决定技术实施质量，家属配合影响治疗环境与依从，而良好医患关系是治疗得以进行的基础和载体，诸因素共同起作用，故“以上均是”成立。若为单选，教材通常把良好医患关系视为关键因素。⚠️原库答案存疑\n\n📚 出处：《医学心理学》·心理治疗"],["医生根据病人的体温、血压、心电图等检查资料确诊病患，这属于下列哪种思维特性",["间接性","概括性","预见性","抽象性","概括性和预见性"],"A",1,"rw","医学心理","思维的间接性指人借助已有知识经验和一定媒介，对未直接感知或无法直接感知的事物作出推断。医生凭体温、血压、心电图等间接资料推断疾病，正是间接性的体现。概括性指从同类事物中抽取共同本质特征，预见性是对结果的预判，抽象性是概括的手段，均不切合本例。\n\n📚 出处：《医学心理学》·认知过程"],["个性心理特征是个体身上表现出来的本质的、稳定的心理特征，主要包括",["感觉、知觉和记忆","知、情、意过程","需要、动机和世界观","能力、气质和性格","感觉、知觉、记忆和知、情、意过程"],"D",1,"rw","医学心理","个性心理特征是个体身上经常表现出来的本质、稳定的心理特征，包括能力、气质和性格。感觉、知觉、记忆以及知、情、意属心理过程，需要、动机和世界观属个性倾向性，二者均不能与个性心理特征混同，故A、B、C、E错误。\n\n📚 出处：《医学心理学》·人格"],["由病人的家长、家属或他人作出求医的决定属于",["主动求医型","强制求医型","被动求医型","本人不愿求医","以上都不是"],"C",1,"rw","人文综合","求医行为分为主动、被动和强制三型：主动求医是本人自觉有不适而主动就诊；被动求医是本人无求医意愿，由家属、家长或他人代为作出决定并送诊（多见于儿童、意识障碍或缺乏自知力者）；强制求医是在法律或强制措施下被迫就医。故本例属被动求医型。\n\n📚 出处：《医学心理学》·求医行为"],["通常，为处于急性情绪危象甚至精神崩溃或企图自杀的人提供的心理咨询形式为",["门诊心理咨询","信函心理咨询","电话心理咨询","专题心理咨询","网上心理咨询"],"C",1,"rw","医学心理","电话心理咨询具有即时性、匿名性和可及性，最适合处于急性情绪危机、有自伤自杀风险者在第一时间获得干预与转介，危机热线即属此形式。门诊咨询需预约到场、信函与网上咨询有延迟、专题咨询面向特定群体开展宣教，均不适于危机的即时处置。\n\n📚 出处：《医学心理学》·心理咨询"],["应激的概念最早是由下列哪位学者提出的",["塞里","华生","艾利斯","巴甫洛夫","南丁格尔"],"A",1,"rw","医学心理","应激（stress）概念最早由加拿大生理学家塞里（Selye）提出，并提出一般适应综合征的三阶段（警戒期、抵抗期、衰竭期）。华生是行为主义创始人，艾利斯提出合理情绪疗法，巴甫洛夫建立经典条件反射学说，南丁格尔是护理学奠基人，均与应激概念无关。\n\n📚 出处：《医学心理学》·心理应激"],["有严重缺陷的新生儿，其生死决定由谁作出最合适",["医生","父母与医生共同商量决定","有严重缺陷新生儿的父母","法官","以上都不对"],"B",1,"rw","人文综合","严重缺陷新生儿的生死处置涉及患儿利益、家庭承受能力与医学判断，任何一方单独决定都难免片面：医生掌握医学预后但不承担抚养责任，父母有监护权但可能受情绪与信息不足影响，法官不宜介入具体医疗判断。故由父母与医生共同商量决定最合适，兼具医学依据与监护权基础。\n\n📚 出处：《医学伦理学》第5版·生命伦理"],["社会主义市场经济条件下加强医学伦理教育的必要性主要取决于",["公正分配医药卫生资源的要求","实现医疗活动道德价值的要求","协调医际关系的要求","合理解决卫生劳务分配问题的要求","正确处理市场经济对医学服务正、负双重效应的要求"],"E",1,"rw","医学伦理","市场经济对医疗服务具有正负 病人理解无误","对病人的不良情绪立即批评","不打断病人的思路","不强迫病人回答有关隐私问题","必须防止暗示性套问"],"B",1,"rw","医患沟通","问诊应使患者理解无误、不随意打断其思路、不强求回答隐私问题、避免暗示性套问，以获取真实信息。对患者的不良情绪立即批评，会使患者感到被否定而隐瞒信息、中断沟通，既违背尊重原则也不利于诊断，故为错误做法。\n\n📚 出处：《医患沟通学》·问诊技巧"],["医患交流时下面哪项是不正确的",["医生要主动使用肢体语言，使患者感到医生对他们的关心与重视","看病人时，完全可以不用注意病人的身体姿势","通过观察患者的表情了解患者的心理感觉","医务人员应读懂患者身体姿势的含义","医务人员应表示谦恭有礼"],"B",1,"rw","医患沟通","非言语信息是医患沟通的重要渠道：医生主动使用肢体语言表达关心，通过表情判断患者心理感受，读懂其身体姿势含义，并保持谦恭有礼，都是必要技巧。认为“看病人时完全可以不注意病人的身体姿势”忽视了非言语线索，会漏掉焦虑、疼痛等重要信息，故不正确。\n\n📚 出处：《医患沟通学》·非语言沟通"],["关于医患沟通的说法，下列哪项是正确的",["沟通能力由性格决定","随着工作经验的积累，沟通能力也会不断提高","医生很忙，没有时间进行沟通","沟通能力是可以通过学习获得的","医患沟通是单向性的"],"D",1,"rw","医患沟通","沟通能力是一种可以后天习得的职业技能，可通过训练（倾听、提问、告知、共情）和工作实践不断提高，而非由性格固定决定。认为“能力由性格决定”“医生忙没时间沟通”“沟通是单向的”都否定其可训练性与互动性；仅靠经验积累而不刻意学习，提升也有限，故B不如D准确。\n\n📚 出处：《医患沟通学》·沟通能力的培养"],["与患者的非语言沟通技巧中，最直接也最常用的是",["目光凝视","面部表情","身体姿势及直接的身体接触","肢体动作","与患者之间的空间距离与位置"],"B",1,"rw","医患沟通","面部表情是最直接、最常用也最易被察觉的非言语沟通方式，能迅速传递关注、理解与情绪状态。目光凝视使用不当易造成压迫感，身体姿势与接触受文化与性别限制，肢体动作信息量较小，空间距离主要用于表达关系亲疏，均不如面部表情常用、直接。\n\n📚 出处：《医患沟通学》·非语言沟通"],["关于患者参与医疗决策的积极意义，以下说法错误的是",["提高患者依从性","激发患者的自主意识","体现以患者为中心","引起患者的逆反","提高患者满意度"],"D",1,"rw","人文综合","患者参与医疗决策有助于提高依从性、激发自主意识、体现以患者为中心并提升满意度，是共同参与型医患关系的要求。引起患者逆反并非其固有结果，恰恰相反，被排除在决策之外更易引发抵触，故D为错误说法。\n\n📚 出处：《医患沟通学》·共同参与型医患关系"],["询问胃溃疡患者对疾病的认识，下列问句中比较有效的是",["“您得了胃溃疡，您已经清楚了吧？”","“您能说说对胃溃疡的了解吗？”","“胃溃疡是一种常见病，您不陌生吧？”","“您身边有人得胃溃疡吗？”","“您是否能接受服用胃溃疡的药物？”"],"B",1,"rw","人文综合","“您能说说对胃溃疡的了解吗”是开放式提问，不限定答案，可让患者自由讲述其认知与误解，便于针对性解释。A、C属封闭式或暗示性提问，易诱导附和；D只问身边是否有人患病，不能反映本人认知；E询问用药接受度，与了解疾病认知无关。\n\n📚 出处：《医患沟通学》·开放式与封闭式提问"],["属于语言的情感性的是哪项",["言语要清晰、语速适中","语言内容严谨，符合伦理道德原则","语言简洁、通俗、易懂","言语中充满同情心和真诚","言语要清晰、语速适中和语言简洁、通俗、易懂"],"D",1,"rw","医患沟通","语言的情感性指言语中体现的情感态度，如同情、真诚与关切，直接影响患者信任。A强调语音清晰、语速适中，C强调通俗易懂，属语言的规范性与通俗性；B强调内容严谨、合乎伦理，属思想性；E是A、C的合并，均不体现情感性。\n\n📚 出处：《医患沟通学》·语言沟通技巧"],["关于审慎，下述说法中错误的是",["审慎是一种道德品质","审慎是一种处世态度","审慎是一种智慧表现","审慎与个人性格有关，是与生俱来的","审慎是以知识技能和冷静客观分析甚至丰富的经验为基础的"],"D",1,"rw","医学伦理","审慎是一种道德品质和处世态度，是智慧的表现，以知识技能、冷静客观的分析和丰富经验为基础，靠后天学习与实践养成并在职业活动中不断强化。认为审慎与性格有关、与生俱来，否认了其可获得性与可培养性，故为错误说法。\n\n📚 出处：《医学伦理学》第5版·医学道德范畴"],["关于医德评价，以下说法错误的是",["医德评价的主体有两种：他人和自己","进行医德评价的标准依据每个人不同而不同","医德评价是医德原则和规范转化为医务人员行为的中介和桥梁","进行医德评价不能只看行为的客观效果","医德评价的方式有社会舆论、内心信念和传统习俗"],"B",1,"rw","医学伦理","医德评价的主体有他人评价和自我评价；评价依据一定社会、一定医学职业公认的道德原则和规范，标准具有客观统一性，不因人而异，故B错误。医德评价是医德原则规范转化为行为的中介和桥梁，须把动机与效果、目的与手段结合起来，不能只看客观效果；其方式为社会舆论、内心信念和传统习俗，A、C、D、E均正确。\n\n📚 出处：《医学伦理学》第5版·医德评价"],["医德与医术的关系是",["医术是最重要的，有了精湛医术必然有高尚医德","医德是最重要的，有了高尚医德必然有精湛医术","医德与医术密不可分，医学道德以医学技术为依托，医学技术以医学道德为指导","医德与医术没有关系，医德高尚的不一定是医术精湛的","医德与医术没有关系，医术精湛的不一定是医德高尚的"],"C",1,"rw","医学伦理","医德与医术密不可分：医学道德以医学技术为依托，离开技术无从实现善；医学技术以医学道德为指导，避免被误用和滥用。A、B把二者割裂并相互推出，逻辑上不成立（有术未必有德，有德未必有术）；D、E否认二者的内在联系，也不正确。\n\n📚 出处：《医学伦理学》第5版·医德与医术"],["关于来访者中心疗法，下列错误的是",["医生在治疗中具有权威性作用","注意调动患者心理上的积极因素","适用于感受到有压力的患者","医生是患者的朋友，必要时加以引导","患者要受到充分理解"],"A",1,"rw","人文综合","来访者中心疗法由罗杰斯创立，反对治疗者的权威与指导，强调无条件积极关注、真诚一致和共情理解，激发来访者自我实现的潜能，适用于存在压力、适应困难的来访者，治疗者更像平等的伙伴。故“医生在治疗中具有权威性作用”与该疗法理念相悖，为错误项。\n\n📚 出处：《医学心理学》·心理治疗"],["门诊医生治疗患者，在使用左氧氟沙星静脉滴注过程中出现了皮疹，应该如何处理",["停止输液，让患者回家休息","立刻停止输液，让患者就地休息观察，将该不良反应上报","调低滴速，继续静滴","加入地塞米松继续静滴","以上都不是"],"B",1,"rw","人文综合","静脉滴注左氧氟沙星出现皮疹属药物不良反应，应立即停止输液，可就地休息观察生命体征并给予相应处理，同时按规定填写并上报药品不良反应报告。让患者回家休息可能延误过敏性休克的识别；调低滴速继续用药或加地塞米松继续用药，都可能因再次接触致敏药物而加重反应。\n\n📚 出处：《药品管理法》·药品不良反应监测"],["关于保密的说法，下列错误的是",["对他人和社会有害的医疗秘密不属于保密的范围","要求医务人员不有意探听病人的隐私","只有在病人提出保密要求的情况下，医师应为患者的病史等保密","它是医学伦理学中最有生命力的医德范畴","它是医学伦理学中最古老的医德范畴"],"C",1,"rw","医学伦理","保密是医学伦理中最古老且最有生命力的医德范畴，医师对在诊疗中获知的隐私和秘密应主动保密，不以患者提出要求为前提，也不得有意探听与诊疗无关的隐私；但对他人和社会有危害的信息（如传染病、伤害倾向）不属保密范围。故C错误。\n\n📚 出处：《医学伦理学》第5版·保密与例外"],["按诊疗同意制度，无法取得患者意见又无家属或者关系人在场，或者遇到其他特殊情况时，处理措施是",["可以由经治医生决定施行","可以由经治医生与其他医生商量后决定施行","经治医师提出处置方案后，由无利害关系的人二人以上在场见证情况下施行","经治医师提出处置方案，取得医疗机构负责人批准后实施","经治医师决定，其他医护人员在场见证情况下施行"],"D",1,"rw","人文综合","《医疗机构管理条例》规定，医疗机构施行手术、特殊检查或特殊治疗，无法取得患者意见又无家属或关系人在场，或遇其他特殊情况时，经治医师应提出医疗处置方案，取得医疗机构负责人或被授权负责人员的批准后实施。A、B、E由经治医师自行决定缺乏程序保障，C的见证要求与法定程序不符。\n\n📚 出处：《医疗机构管理条例》·执业规则"],["以下哪项不属于医师在执业活动中履行的义务",["保护患者隐私","遵守职业道德","开展健康教育","参与民主管理","提高专业技术"],"D",1,"rw","卫生法律法规","《医师法》规定医师义务包括遵守法律法规和执业规范、遵守职业道德、保护患者隐私和个人信息、提高专业技术水平、开展健康教育与健康科普、履行防病治病和救死扶伤职责等。“参与民主管理”属职工参与单位民主管理的权利，不属于医师执业义务，故为应选项。\n\n📚 出处：《医师法》·执业规则"],["某患皮肤病的病人，怕影响容貌，求助于医院，经医院诊治康复后出院。在治疗过程中，医院进行了全程跟踪记录，并拍摄下相关照片，然而病人并不知情。一段时间后，其主管医师写了一篇相关方面的文章，文章中使用了病人的照片，并将此文发表在某医学杂志上，之后被病人家属无意间发现。关于该医院及医生的行为，以下说法哪项是正确的",["使用病人照片是医生个人行为，与医院无关，医院无过错","医生使用病人的照片无商业目的，合情合法，医生无过错","医生有权无条件使用病人照片","未经病人同意擅自使用其照片，医院与医生侵犯了病人的隐私权","医生有权无条件使用病人照片和医生使用病人的照片无商业目的，合情合法，医生无过错"],"D",1,"rw","医学心理","患者照片属可识别个人身份的个人信息与隐私，未经其同意不得擅自收集、使用和公开，即使无商业目的、即使用于学术发表亦然。医院在诊疗中拍摄记录应告知并取得同意，医师擅自使用发表使医院与医师共同构成对患者隐私权（及肖像权）的侵害，故A、B、C、E均错。\n\n📚 出处：《民法典》·人格权编隐私权与个人信息保护"],["某厂医院医生甲从 2018 年 10 月起，离开医院岗位为工厂从事推销。若",["甲至 2020 年 9 月 30 日仍不回岗位，其所在医院向准予甲注册的卫生健康主管部门报告的期限是 7 日内","10 日内","15 日内","30 日内","60 日内"],"D",1,"rw","人文综合","《医师法》规定，医师中止执业活动满二年的，其所在医疗卫生机构应当在三十日内报告准予注册的卫生健康主管部门，办理注销注册。甲自2018年10月离岗，至2020年9月30日已满二年，医院应在该期限届满后30日内报告，故为30日内，7日、10日、15日、60日均不合法定期间。\n\n📚 出处：《医师法》·执业注册"],["某冠心病患者想接受冠脉搭桥治疗，但又担心术中出现意外。这属于",["双趋冲突","双避冲突","趋避冲突","双重趋避冲突","多重趋避冲突"],"C",1,"rw","人文综合","趋避冲突指同一目标同时具有吸引和排斥两种作用引起的动机冲突。冠脉搭桥既能治病（趋）又可能术中意外（避），是同一目标的利弊并存，故属趋避冲突。双趋是两利择一，双避是两害择一，双重或多重趋避涉及多个目标各有得失，均不符合本例。\n\n📚 出处：《医学心理学》·动机冲突"],["患者，女，18 岁。主诉自初中毕业后，越来越不能与陌生人接触，近 1年来发展为见到熟人也害怕与之说话，且一说话就脸红。对于该患者心理治疗首选的方法为",["生物反馈","系统脱敏","自由联想","眠治疗","人本主义"],"B",1,"rw","医学心理","患者表现以社交场合显著持久的恐惧、回避及脸红等植物神经反应，符合社交恐惧症，行为治疗中的系统脱敏（渐进式放松下逐级暴露于恐惧情境）为首选。生物反馈用于紧张焦虑的生理调节，自由联想用于精神分析，催眠治疗与来访者中心疗法均非针对恐惧回避的首选。\n\n📚 出处：《医学心理学》·心理治疗"],["对有限器官供体的分配存在尖锐伦理问题，下列哪一点是绝大多数国家明确反对的",["供体应根据什么原则分配","谁应优先得到器官","由谁做出裁决","根据什么原则裁决","器官商品化（买卖）"],"E",1,"rw","医学伦理","器官来源不足导致分配原则、优先对象、裁定主体等争论，各国做法不同，可讨论亦可有差异；而器官商品化（买卖人体器官）被绝大多数国家明确反对并立法禁止，因其把人及人体部分工具化，诱发剥削、 trafficking 与医疗不公。我国《人体器官移植条例》亦明确禁止买卖。\n\n📚 出处：《人体器官移植条例》·器官移植伦理"],["某老年患者身患肺癌，生命垂危，家属明确要求不惜一切代价抢救，医生应选择",["有限度地治疗与抢救","说服家属彻底放弃治疗与抢救","实施积极安乐死","尊重家属意见，不惜一切代价进行抢救","必要时实施安乐死"],"D",1,"rw","人文综合","对临终患者，家属明确要求不惜一切代价抢救时，医生应在充分告知病情与预后、说明抢救可能带来的痛苦与无效性的基础上，尊重家属的知情选择意愿并积极救治，不能单方放弃或实施安乐死。A单方限疗、B劝其放弃、C、E涉及安乐死，均超越医师权限且违背现行法律与伦理。\n\n📚 出处：《医学伦理学》第5版·临终关怀与放弃治疗"],["一位病人来到门诊，医生说：“坐吧。”之后就一边问病人哪里不舒服，一边在写病历、开药。没等病人诉说完自己的不 癖","恋物癖","性功能障碍"],"B",1,"rw","人文综合","性别认同障碍指对自身生理性别持续强烈的不认同与痛苦，渴望成为异性，属性身份认同问题。性变态（性偏好障碍）指向异常对象或方式获得性满足，异装癖以穿戴异性服饰获得性兴奋，恋物癖以物品为性对象，性功能障碍指性反应的生理环节障碍，均与本例核心不符。\n\n📚 出处：《精神病学》·性身份障碍"],["心理评估的基本方法是",["会谈法","观察法","调查法","心理测验法","作品分析法"],"B",1,"rw","医学心理","观察法是最基本、最常用的心理评估方法，通过对行为、表情、言语、仪表及交往方式的直接观察获取资料，其他方法常以其为基础。会谈法、调查法、心理测验法、作品分析法都是重要方法，但都以观察所获得的行为资料为起点，故基本方法选观察法。\n\n📚 出处：《医学心理学》·心理评估"],["在巴甫洛夫的经典条件反射实验中，狗得到食物后的唾液分泌属于",["经典条件反射","操作性条件反射","非条件反射","有条件反射","反射"],"C",1,"rw","人文综合","狗吃到食物后分泌唾液是无须学习、由食物（无条件刺激）直接引起的先天反射，属非条件反射。铃声引起唾液分泌才是经典条件反射（B为操作性条件反射，以行为后果强化为特征，D、E为笼统表述），本题问的是“得到食物后”的分泌，故为非条件反射。\n\n📚 出处：《医学心理学》·行为主义理论"],["一位来访者单位的同事，要求了解当事人心理治疗的情况。心理治疗师婉言谢绝，这是因为",["出于对来访者的尊重","保持客观中立的立场","不认识来访者的同事","心理治疗的关系限定原则","心理治疗的保密原则"],"E",1,"rw","医学心理","为来访者保密是心理治疗的基本伦理要求，非经本人同意不得向包括同事、单位在内的第三方透露其接受治疗的事实与内容，故治疗师谢绝是履行保密原则。尊重来访者、保持客观中立、关系限定虽也是原则，但本例直接指向的是信息不得泄露，故为保密原则。\n\n📚 出处：《医学心理学》·心理咨询与治疗的伦理原则"],["心理评估的常用方法不包括",["调查法","观察法","个案法","测验法","访谈法"],"C",1,"rw","医学心理","心理评估常用方法包括观察法、会谈（访谈）法、调查法、心理测验法和作品分析法等。个案法属心理学研究方法（对单一对象的深入追踪研究），不是心理评估的常用技术，故为不包括项。\n\n📚 出处：《医学心理学》·心理评估"],["医学模式转变在医学伦理方面的重要性是",["促进了医学思维方式的变革","提高了社会防治疾病的地位","实现了在更高层次上对人的健康的全面关怀","加速了祖国医学的整理和提高","促进了医师知识结构的现代化"],"C",1,"rw","医学伦理","医学模式由生物医学模式转向生物-心理-社会医学模式，在伦理上的重要意义在于把人视为整体的人，不只关注躯体病变，而兼顾心理与社会因素，实现了在更高层次上对人的健康的全面关怀。思维方式变革、社会防治地位提高、知识结构现代化等属认识论或专业层面的影响，不是其伦理意义。\n\n📚 出处：《医学伦理学》第5版·医学模式与医学道德"],["人类辅助生殖技术的目的是",["商业化","演进性优生","有利于未婚男女生儿育女","使不育夫妇妊娠","控制人口数量"],"D",1,"rw","人文综合","人类辅助生殖技术的直接目的是使不育夫妇实现生育，弥补其生育功能缺陷，故须以医学指征为前提。商业化违背严防商业化原则，演进性优生（选择性改良遗传素质）不属其目的，为未婚男女生育提供便利违背保护后代与计划生育、婚姻家庭原则，控制人口数量是计划生育政策目标而非该技术目的。\n\n📚 出处：《人类辅助生殖技术管理办法》·伦理原则"],["关于医学伦理学基本原则的说法，以下正确的是",["四个基本原则中不伤害原则是最重要的","在实际应用中，这四个原则只有在不冲突的情况下才有效","四个基本原则中有利原则是最重要的","这四个原则中公正原则是最不重要的","这四个原则之间存在冲突的情况，需要具体判断"],"E",1,"rw","医学伦理","尊重、不伤害、有利、公正四项基本原则无绝对的高低主次之分，在不同情境中可能相互冲突（如尊重患者拒绝与有利原则的冲突），需结合具体情形权衡判断，故E正确。A、C、D人为设定原则等级，B否认冲突时仍需依原则作出取舍，均不正确。\n\n📚 出处：《医学伦理学》第5版·医学伦理学的基本原则"],["医学伦理学的核心问题是",["医务人员之间的关系","医务人员与患者的关系","医务人员与社会之间的关系","医务人员与科学发展之间的关系","医务人员与患者家属的关系"],"B",1,"rw","医学伦理","医学伦理学的核心问题是医患关系：医疗活动以患者为服务对象，医患关系贯穿诊疗全过程，医际关系、医社关系都以其为基础。医务人员之间、与社会、与科学发展之间的关系均为重要内容但非核心，医患家属关系只是医患关系的延伸，故核心是医务人员与患者的关系。\n\n📚 出处：《医学伦理学》第5版·医患关系"],["关于医学伦理学的任务，以下错误的是",["反映社会对医学的需求","为医学的发展导向","为符合道德的医学行为辩护","努力解决医学活动中产生的伦理问题","满足患者的所有要求和利益"],"E",1,"rw","医学伦理","医学伦理学的任务是反映社会对医学的需求、为医学发展导向、为符合道德的医学行为作伦理辩护、研究并解决医学实践中的伦理难题。但它不无条件满足患者的一切要求：要求有合理与不合理之分，对违背医学指征、损害他人或社会利益的要求应予拒绝，故E错误。\n\n📚 出处：《医学伦理学》第5版·绪论"],["医学模式转变对医学伦理学产生的影响是",["医学更加专业化","医疗技术复杂化","研究的范围和深度扩大","医患关系复杂化","医学更加专业化和医疗技术复杂化"],"C",1,"rw","医学伦理","生物-心理-社会医学模式把健康与疾病置于心理、社会、环境的大背景中考察，提出大量新的伦理课题（如卫生资源分配、健康教育责任、生命质量、环境与健康），使医学伦理学研究的范围和深度显著扩大。医学更专业化、技术复杂化、医患关系复杂化是医学自身变化，不是对伦理学的直接影响。\n\n📚 出处：《医学伦理学》第5版·医学模式与医学道德"],["关于实施人类辅助生殖技术的伦理原则，以下不恰当的是",["知情同意的原则","控制商品化的原则","互盲和保密的原则","维护社会公益的原则","自愿的原则"],"B",1,"rw","医学伦理","人类辅助生殖技术的伦理原则包括有利于患者、知情同意、保护后代、维护社会公益、互盲与保密、严防商业化、伦理监督等。官方用语是“严防商业化（禁止商业化）”，对配子、胚胎买卖须彻底禁止，而非“控制商品化”，故B表述不恰当；A、C、D、E均为正规原则。\n\n📚 出处：《人类辅助生殖技术管理办法》·伦理原则"],["在公正的内容原则中，进行公正分配的根据不包括",["根据个人能力","根据对社会的贡献","根据个人的地位","根据科研价值","根据个人需要"],"C",1,"rw","医学伦理","公正分配的依据应是与需要和贡献相关的合理因素，如个人的需要程度、能力、对社会的贡献、科研价值等。以个人的地位、身份、权势、财富作为分配依据属于特权和不公平，违背公正原则，故不包括“根据个人的地位”。\n\n📚 出处：《医学伦理学》第5版·公正原则"],["解释病情时，对于较多的信息可以采用的方法是",["分成几条分别解释","尽量多的使用专业术语","语速快一些，节省时间","要求患者回家自己查找","不解释，要求患者依从"],"A",1,"rw","人文综合","面对较多信息，应把内容归纳为几条分别解释，逐条说明并在每条后确认患者理解，必要时重复或书面补充，这符合患者注意与记忆容量有限的特点。使用大量术语、加快语速、让患者自回家查找、只要求依从而不解释，都会造成理解偏差和依从性下降。\n\n📚 出处：《医患沟通学》·解释病情与知情告知"],["医生将一个坏消息告知患者并达成治疗共识后，一般在结束此次谈话前留联系方式给患者，表明医生",["态度好","希望与患者建立治疗同盟","不怕患者的麻烦","医疗技术很高","担心患者想找自己时找不到"],"B",1,"rw","医学伦理","告知坏消息后留下联系方式，实质是向患者传递“我会持续对你负责、随时可以找到我”的信号，有助于形成医患共同面对疾病的治疗同盟，增强安全感与依从性。这并非单纯的态度好、不怕麻烦或技术体现，也不只是担心患者找不到自己，其核心是建立信任与合作关系。\n\n📚 出处：《医患沟通学》·告知坏消息（SPIKES）"],["在医生不打断的情况下，多数患者叙述完病史大约需要几分钟",["半分钟","1分钟","1分钟半","2分钟","3分钟"],"D",1,"rw","人文综合","研究表明，若医生不打断，多数患者完整叙述病史约需2分钟（1.5~2分钟），而临床医生常在患者开口十几秒内即打断。让患者先自由陈述既能获得真实主诉和关键线索，也传递尊重，因此应克制过早提问和封闭式引导。\n\n📚 出处：《医患沟通学》·病史采集中的倾听"],["遇到难缠患者时，下列哪项措施欠妥",["对于表现极端焦虑或富有侵犯性的患者，应考虑是否需要心理治疗及药物缓解","在应付难缠患者时，医生应该坚守住底线，不能无原则让步","医生感到一个人难解决时，应寻求同事或医院的帮助","为了不影响医院整体工作，准备与患者及家属协商私下解决，答应对方要求","热情服务，详细查体，委婉地给予合理建议"],"D",1,"rw","人文综合","处理难缠患者应评估其焦虑、攻击性并考虑心理或药物干预，坚守职业底线不作无原则让步，必要时寻求同事和医院支持，同时热情服务、细致查体、委婉建议。为不影响工作而私下协商、答应对方要求，属于越过制度与法律底线的息事宁人，可能损害医院和其他患者利益，最为欠妥。\n\n📚 出处：《医患沟通学》·难缠患者的沟通"],["在接待患者初次就诊时，医生赢得患者及家属信任的关键是",["具备高超的医疗技术","承诺以低廉的医疗费用给患者做诊断治疗","打扮得体，仪表端庄，言谈从容不迫","表达尊重、真诚、关爱及同情、理解","以敷衍的态度给患者做诊断治疗"],"D",1,"rw","人文综合","初次就诊时医疗技术尚未显现，患者和家属的信任主要来自医生的态度：尊重、真诚、关爱与同情理解直接形成情感信任，是后续依从的基础。A是长期信任的条件但首次接触难以验证，B属不当承诺甚至误导，C只是外在形象，E违背职业要求。\n\n📚 出处：《医患沟通学》·建立信任关系"],["如果因为医生的错误发生医患纠纷，一些保险公司向医生推荐的道歉方法不包括",["以积极的方式来对待病人的投诉","承认对病人造成的影响","真诚地向病人道歉","不倾听病人的诉说","给予病人适当的经济赔偿"],"D",1,"rw","医患沟通","推荐的道歉做法包括积极回应投诉、承认对患者造成的实际影响、真诚致歉、在合理范围内给予经济补偿，并认真倾听患者诉说以弄清事实和情绪。不倾听患者诉说使道歉流于形式，患者感到被敷衍，反而激化矛盾，故不属于推荐的道歉方法。\n\n📚 出处：《医患沟通学》·医患冲突的化解"],["医患关系中的“医”是指",["医师和护士","医疗机构及其管理人员","医技人员","医院后勤人员","以上全部"],"E",1,"rw","医学伦理","医患关系中的“医”是广义的医方，指以医疗机构为整体的一方，包括医师、护士、医技人员，也包括管理人员和后勤保障人员，因为他们共同参与医疗服务过程并对患者产生影响。故仅指医师护士、管理人员、医技人员或后勤人员都不完整，应选“以上全部”。\n\n📚 出处：《医学伦理学》第5版·医患关系"],["关于协商治疗方案的步骤，以下不恰当的是",["提供备选治疗方案","提出医生推荐的方案","了解患者倾向的治疗方案","替代患者做出治疗决策","协商双方都认可的治疗方案"],"D",1,"rw","人文综合","协商治疗方案应提供备选方案、提出医生推荐的方案并说明理由、了解患者的倾向与顾虑、通过讨论形成双方都认可的方案，体现共同参与。替代患者作出治疗决策剥夺了患者自主权，违背知情同意与尊重原则，是错误做法。\n\n📚 出处：《医患沟通学》·协商治疗方案"],["对医务人员的职业情绪要求主要是",["悲喜有节制","永远快乐","积极而稳定","心境平和","爱憎分明"],"C",1,"rw","医学心理","医务人员面对病痛、死亡与各种情绪刺激，职业情绪要求是积极而稳定：既保持热情、同情与助人意愿，又能在紧急和冲突情境中保持情绪平稳，避免大起大落影响判断。永远快乐不现实，悲喜有节制、心境平和偏消极被动，爱憎分明易致情感偏颇，均不如“积极而稳定”准确。\n\n📚 出处：《医学心理学》·医务人员的心理素质"],["反映医患之间权利关系的正确观点是",["强调维护医生的权利","强调维护医院院长的权利","强调维护护士的权利","强调维护患者的权利","强调维护家属的权利"],"D",1,"rw","医患沟通","现代医患关系是权利义务关系，患者处于相对弱势和信息不利地位，故应强调维护患者的权利，包括知情同意权、隐私权、选择权、监督权和获得赔偿权等。只强调医生、院长、护士或家属的权利，都会使权利结构失衡，不符合以患者为中心的原则。\n\n📚 出处：《医学伦理学》第5版·患者的权利"],["关于医院的业绩观，下列正确的是",["保障医疗安全，提高服务水平","经济效益至上","医院规模越大越好","社会效益是政府负责的事","保障医务人员安全，提升医院业绩"],"A",1,"rw","人文综合","正确的医院业绩观以医疗质量和患者安全为核心，通过保障医疗安全、提高服务水平获得社会效益，并在此基础上实现良性运营。经济效益至上、规模越大越好、把社会效益推给政府、只保障医务人员安全而忽视患者，均背离公立医院的公益性和以患者为中心的要求。\n\n📚 出处：《医学伦理学》第5版·医院管理伦理"],["下列哪项是医师在执业活动中应享有的权利",["宣传普及卫生保健知识","尊重患者隐私权","参加专业培训，接受继续医学教育","努力钻研业务，及时更新知识","爱岗敬业，努力工作"],"C",1,"rw","卫生法律法规","《医师法》规定医师享有的权利包括在注册范围内进行医学诊查、开具处方、选择合理方案，获得与本人执业活动相当的医疗设备条件，参加专业培训、接受继续医学教育，从事医学研究、学术交流，参与专业团体，获取报酬与福利，对机构管理提出意见建议等。A、B、D、E均属医师义务。\n\n📚 出处：《医师法》·执业规则"],["尊重病人自主权或决定，在病人坚持己见时，可能要求医生",["放弃自己的责任","听命于病人","无须具体分析","必要时限制病人自主性","放弃自己的责任和听命于病人"],"D",1,"rw","医学伦理","尊重患者自主权并不等于医生放弃专业责任或一味听命于患者。当患者的选择明显违背医学指征、损害自身根本利益或他人及社会利益（如拒绝隔离治疗、要求实施无指征手术）时，医生应说明、劝导，必要时依法限制其自主性，如强制隔离治疗、紧急救治。A、B、C、E均不正确。\n\n📚 出处：《医学伦理学》第5版·尊重原则"],["对医务人员进行道德评价的依据是",["动机与手段的统一","动机与效果的统一","手段与效果的统一","目的与效果的统一","动机与目的的统一"],"B",1,"rw","医学伦理","评价医务人员的道德行为，须把动机与效果统一起来考察：既看其主观动机是否出于患者利益，也看行为的客观效果，避免动机论（只看动机）和效果论（只看结果）的片面性。手段与效果、目的与效果、动机与目的、动机与手段的组合都不能完整概括医德评价的客观依据。\n\n📚 出处：《医学伦理学》第5版·医德评价"],["世界医学教育联合会《福冈宣言》中指出：所有医生必须学会交流和处理人际关系的技能。缺少以下哪一项，应视为与技术不过关一样，是无能力的表现",["同理心","专业知识","医德高尚","实践技能","技术精湛"],"A",1,"rw","医患沟通","世界医学教育联合会《福冈宣言》指出，所有医生都必须学会交流和处理人际关系的技能，缺少同理心（共情）应视为与技术不过关一样，是无能力的表现。专业知识、实践技能、技术精湛属技术层面，医德高尚属品德层面，都不能与“交流与处理人际关系技能”的缺失相对应。\n\n📚 出处：《医患沟通学》·医患沟通的意义"],["中国古代医德的思想不包括",["探索研究，大胆创新的敬业精神","不畏权势，忠于医业的献身精神","一心救治，不畏艰苦的服务态度","不图名利，清廉正直的道德品质","仁爱救人，赤诚济世的事业准则"],"A",1,"rw","医学伦理","中国古代医德思想主要包括仁爱救人、赤诚济世的事业准则，一心救治、不畏艰苦的服务态度，不图名利、清廉正直的道德品质，不畏权势、忠于医业的献身精神。“探索研究、大胆创新”是近代科学精神与实验医学的要求，古代医德文献中并未作为核心内容，故为不包括项。\n\n📚 出处：《医学伦理学》第5版·中国医学道德的历史发展"],["患者男，85 岁，因肝癌于 09 年 4 月 4 日至 4 月 9 日到某医院住院治疗。",["但其主管医师杨某执业证注册时间是 09 年 10 月 26 日，杨医师当时是试用期医学毕业生，在入院记录、最后诊断和医患沟通记录等病历资料上都是他单独签名。该医师的行为属于 行为违法","行为合法","行为合理","无过错","有过错"],"A",1,"rw","人文综合","该医师执业证书注册时间为2009年10月26日，诊疗行为发生于2009年4月，其间其身份为试用期医学毕业生，尚未取得执业医师资格，却单独在入院记录、最后诊断、医患沟通记录等病历资料上签名，属非医师行医，违反《医师法》关于未取得执业证书不得从事医师执业活动的规定，故为违法行为。\n\n📚 出处：《医师法》·考试和注册"],["某地级市医院于 2001 年 10 月对患者李某行胃大部切除，胃空肠吻合术。 手术操作无误，术后恢复良好。第 5 天李某感到张口、下咽困难，第 6 天出 现角弓反张、抽搐，诊断为破伤风。经医院抢救无效，于 10 月 11 日死亡。 患者家属找到市卫生行政部门申诉，经市医学会 10 月 31 日鉴定，不属于医疗事故，并在当日将通知书交予家属。家属对此有异议，家属可以向市卫生行政部门申请再鉴定的有效期限是",["11 月 5 日前","11 月 7 日前","11 月 10 日前","11 月 15 日前","11 月 30 日前"],"D",1,"rw","卫生法律法规","《医疗事故处理条例》规定，当事人对首次医疗事故技术鉴定结论不服的，可自收到鉴定结论之日起15日内向医疗机构所在地卫生行政部门提出再次鉴定的申请 ,"精神分析式家庭治疗","系统式家庭治疗","精神分析式家庭治疗和系统式家庭治疗"],"A",1,"rw","人文综合","策略式家庭治疗以解决当前呈现的具体家庭问题、打破维持症状的互动循环为直接工作目标，通过指令、作业改变行为序列。结构式以调整家庭结构边界为主，精神分析式关注代际潜意识传递，系统式强调家庭系统与反馈模式，其目标表述不如策略式那样直指“解决家庭问题”。\n\n📚 出处：《医学心理学》·家庭治疗"],["用红笔划出书中的重点是利用了知觉的什么特性",["整体性","选择性","理解性","恒常性","理解性和恒常性"],"B",1,"rw","医学心理","用红笔划出书中重点，是把某些内容作为知觉对象突出出来而把其余作为背景，属知觉的选择性。整体性指把对象作为整体把握，理解性指以经验赋予意义，恒常性指条件变化时知觉保持稳定，均不能解释通过标记方式突出对象这一现象。\n\n📚 出处：《医学心理学》·认知过程"],["把自己的愿望与动机归于他人，断言他人有此动机或愿望。这是心理防御机制中的",["压抑","投射","否认","固着","焦虑"],"B",1,"rw","医学心理","投射指把自身不被接受的愿望、动机、态度或冲动归于他人，断言他人有此动机或愿望，从而减轻内心焦虑，如“以小人之心度君子之腹”。压抑是把冲突内容逐出意识，否认是拒绝承认现实，固着是停滞在某一发展阶段，焦虑是情绪状态而非防御机制。\n\n📚 出处：《医学心理学》·精神分析理论"],["关于人体试验的第一个伦理学文献是",["《赫尔辛基宣言》","《纽伦堡法典》","《日内瓦宣言》","《东京宣言》","《夏威夷宣言》"],"B",1,"rw","医学伦理","《纽伦堡法典》是1947年对纳粹人体试验战犯审判后形成的第一个关于人体试验的伦理文献，确立受试者自愿同意、试验须有社会价值、须先经动物实验、避免不必要痛苦等原则。《赫尔辛基宣言》1964年发表，是在其基础上由世界医学协会制定的更系统文件；《日内瓦宣言》《东京宣言》《夏威夷宣言》分别属医德、酷刑、精神病学伦理文件。\n\n📚 出处：《医学伦理学》第5版·人体试验伦理"],["当妊娠危及胎儿母亲的生命时，可允许行人工流产或引产。这符合",["行善原则","公正原则","不伤害原则","尊重原则","自主原则"],"C",1,"rw","人文综合","妊娠危及母亲生命时实施人工流产或引产，是在母婴利益的尖锐冲突中作“两害相权取其轻”的选择：终止妊娠虽使胎儿受损，但避免了母亲死亡这一更大伤害，符合不伤害原则的权衡要求。行善、公正、尊重、自主原则不能解释此种取舍的依据。\n\n📚 出处：《医学伦理学》第5版·不伤害原则"],["在医学上能够做到的",["就是伦理学上应该做的","在伦理学上不一定是应该做的","在伦理学上是不应该做的","在伦理学上是缺乏根据的","都是经过伦理学检验的"],"B",1,"rw","人文综合","“医学上能够做到的”是技术可行性判断，“伦理学上应该做的”是价值判断，二者并非同一：技术上可行（如克隆人、非医疗目的性别选择、安乐死）在伦理上未必应当。故能力不等于正当，必须经伦理审视与规范约束，A、C、D、E的绝对化表述均不成立。\n\n📚 出处：《医学伦理学》第5版·医学技术与伦理"],["安乐死的分类中，医务人员采取某种措施加速病人死亡称为",["自愿安乐死","非自愿安乐死","消极安乐死","主动安乐死","被动安乐死"],"D",1,"rw","医学伦理","主动安乐死（积极安乐死）指医务人员采取给药等积极措施加速患者死亡；消极（被动）安乐死指放弃或撤除维持生命的治疗而让患者自然死亡。自愿与非自愿是按患者是否提出请求划分，与“采取措施加速死亡”这一行为方式不对应，故为主动安乐死。\n\n📚 出处：《医学伦理学》第5版·安乐死"],["知情同意伦理原则的含义是",["让病人了解有关医疗信息","让病人自主选择医疗方案","病人无条件服从医务人员提出的医疗方案","病人在知情基础上对医疗方案做出自主选择","让病人了解疾病转归"],"D",1,"rw","医学伦理","知情同意包含两个要件：知情（医师以患者能理解的方式告知病情、方案、风险与替代方案）和同意（患者在理解基础上自愿作出选择）。A、B、E只强调告知或选择的单一方面，C要求无条件服从，彻底否定自主权，均非该原则的完整含义。\n\n📚 出处：《医学伦理学》第5版·知情同意"],["避免高科技在医学中应用出现负效应的主要办法是",["结合患者的经济条件","掌握高科技使用的范围","加强高科技在医学中使用的伦理学教育","关心病人，减少不必要检查","注意生态环境的保护"],"C",1,"rw","人文综合","高科技在医学中的负效应（过度检查、技术至上、费用攀升、忽视人文）主要不是靠限制技术或经济条件解决，而应通过加强医学伦理教育，使技术应用接受伦理规范和价值目标的约束，从而避免滥用。掌握使用范围只是被动限制，结合经济条件、减少检查、保护生态都只涉及个别侧面。\n\n📚 出处：《医学伦理学》第5版·医学高技术应用中的伦理"],["下述哪类患者对治疗措施有自主选择权",["年龄在 10 周岁以下的患者","意识清醒的成年人","处于昏迷状态的患者","发作期的精神病患者","老年性痴呆患者"],"B",1,"rw","医学伦理","具备自主选择能力者才享有对治疗措施的自主选择权：意识清醒、能理解信息并作出理性判断的成年人具备完全自主能力。10周岁以下儿童、昏迷患者、发作期精神病患者和老年性痴呆患者均缺乏或丧失意思表示能力，应由其监护人、法定代理人或依法定程序代为行使同意权。\n\n📚 出处：《医学伦理学》第5版·尊重原则"],["目前，我国禁止的生殖技术是",["人工授精","同源人工授精","异源人工授精","无性生殖","体外受精"],"D",1,"rw","人文综合","无性生殖（克隆人）因冲击人的独特性和尊严、亲子与身份关系混乱，被我国明确禁止，也是国际上广泛禁止的技术。人工授精（同源、异源）和体外受精在符合指征、经批准并履行知情同意的条件下允许开展，故属允许而非禁止的技术。\n\n📚 出处：《人类辅助生殖技术管理办法》·伦理原则"],["提高病人依从性的方法不包括",["及时纠正病人的不良行为","纠正病人对检查和治疗措施的错误认识","建立融洽的医患关系","提高病人对医嘱的理解和记忆程度","教会病人自我监测"],"A",1,"rw","人文综合","提高依从性应从认知、关系与技能入手：纠正患者对检查治疗措施的错误认识，建立融洽医患关系以增强信任，提高其对医嘱的理解与记忆（用简单语言、书面提示），教会自我监测以增强自我管理。而“及时纠正病人的不良行为”带有强制指责意味，易引起抵触，不属于提高依从性的方法。\n\n📚 出处：《医学心理学》·遵医行为"],["以下哪项可称为“棘手病人”",["喜欢挑战医生的病人","文化程度低下的病人","人际关系有障碍的病人","想知道更多的病人","希望同医生展开讨论的人"],"C",1,"rw","人文综合","“棘手病人”通常指难以建立有效沟通与治疗关系的患者，如人际关系有障碍、多疑敌对、反复投诉、依从性极差者。喜欢挑战医生、想知道更多、希望与医生讨论，属积极参与型患者，可通过充分沟通与共享决策加以引导；文化程度低可通过通俗表达解决，均不构成棘手。\n\n📚 出处：《医患沟通学》·难缠患者的沟通"],["以下哪种能力不属于医患沟通能力模型",["谈判与化解冲突的能力","主动倾听能力","口头表达能力","组织管理能力","职业化态度与服务能力"],"D",1,"rw","医患沟通","医患沟通能力模型主要包括职业化态度与服务能力、主动倾听能力、口头与非口头表达能力、共情与信息告知能力、谈判与化解冲突能力等。“组织管理能力”属医院管理与领导力范畴，不属于医患沟通能力模型的构成要素，故为应选项。\n\n📚 出处：《医患沟通学》·沟通能力模型"],["开放式提问可让回答者自由发挥，适用于答案较多、较复杂的问题。以下哪项属于开放式提问",["早晨醒来时会有头痛吗","跟我谈谈你的头痛吧","昨天你头痛了吗","哪些情况会使你的头痛加重或减轻","你的头痛是在左侧还是在右侧"],"B",1,"rw","医患沟通","“跟我谈谈你的头痛吧”不限定回答范围，让患者自由叙述，属开放式提问。“早晨醒来会有头痛吗”“昨天头痛了吗”“左侧还是右侧”均为封闭式提问，答案只能是是/否或二选一；“哪些情况会加重或减轻”虽较开放，但已限定在诱因这一具体维度，不如B宽泛。\n\n📚 出处：《医患沟通学》·开放式与封闭式提问"],["了解患者对疾病的理解，有助于",["显示医生的权威","知道患者有多无知","让患者进行自我疾病教育","对患者的思想进行研究","解释病情更有针对性"],"E",1,"rw","人文综合","了解患者对疾病的理解，可以掌握其已知信息、误解与关注点，从而使解释更有针对性：纠正错误认知、用其能理解的语言说明、回应其最担忧的问题，提高沟通效率与依从性。A、B、D的动机不正，C的“自我疾病教育”不是了解患者认知的直接目的。\n\n📚 出处：《医患沟通学》·解释病情"],["医患关系的重要性不包括",["提高病人依从性","有利于医患关系模式转变为共同参与型","造就良好的心理气氛","提高病人的社交能力","本身就是一种治疗手段"],"D",1,"rw","医学伦理","良好医患关系可提高依从性、营造良好心理气氛、本身即具有治疗作用（安慰剂与信任效应），并有助于医患关系向共同参与型转变。但“提高病人的社交能力”属社会技能训练目标，不是医疗关系的目的和功能，故为不包括项。\n\n📚 出处：《医学伦理学》第5版·医患关系"],["针对患者治疗期间可能出现的紧急情况，需要进行的沟通是",["无法预测和事先沟通","安排对患者的定期随访","提供紧急情况时获得医疗救助的途径","告诉患者要坚强和乐观面对","交代患者家属细心照料和督促治疗"],"C",1,"rw","医患沟通","对治疗期间可能出现的紧急情况，事前应向患者及家属说明可能的表现、应对方法与就医渠道，提供紧急情况下获得医疗救助的途径（联系方式、急诊通道、就近就医原则），这是安全告知义务的延伸。紧急情况并非完全不可预测，也不能只靠“坚强乐观”或家属照料替代就医途径告知。\n\n📚 出处：《医患沟通学》·安全告知与随访沟通"],["如果患者对你的医疗行为某一方面表示不满，抱怨不已，你首先应",["沉默不吭声，任患者抱怨，不发表观点不表示看法","立即解释这是科主任决定的，你只是执行，不是你的过错","主动倾听，对他的感受表示理解同情，然后一起分析原因，试图解释","反问患者：“不是事先已征得你的同意了吗？”","据理力争，解释自己的做法"],"C",1,"rw","医学心理","面对患者抱怨，应先处理情绪再处理事情：主动倾听、表示理解与同情，使患者感到被重视，然后共同分析原因、作出解释，必要时道歉与补救。沉默回避、把责任推给科主任或制度、反问指责、据理力争都会加剧对立，使沟通陷入僵局。\n\n📚 出处：《医患沟通学》·医患冲突的化解"],["在下列医务人员的行为中，不符合有利原则的是",["与解除病人的疾苦有关","可能解除病人的疾苦","使病人受益且产生的副作用很小","使病人受益，但却给别人造成了较大的伤害","在人体试验中，可能使受试者暂不得益，但却使社会、后代受益很大"],"D",1,"rw","医学伦理","有利原则要求医务人员的行动以患者利益为目的，使患者受益且伤害尽可能小：与解除疾苦有关、可能解除疾苦、受益而副作用很小、试验中受试者暂不受益但社会后代受益很大，均可获得伦理辩护。使患者受益却给他人造成较大伤害，突破了不伤害他人与社会公益的底线，不符合有利原则。\n\n📚 出处：《医学伦理学》第5版·有利原则"],["医师在执业活动中的义务不包括",["遵守技术操作规范","保护患者隐私","提高专业技术水平","宣传推广与岗位相适应的健康科普知识","无条件加班"],"E",1,"rw","卫生法律法规","《医师法》规定的医师义务包括遵守法律法规与技术操作规范、遵守职业道德、保护患者隐私和个人信息、提高专业技术水平、宣传推广健康科普知识、履行防病治病与救死扶伤职责等。加班须依劳动法律法规和单位制度安排，“无条件加班”不是法定义务，故为应选项。\n\n📚 出处：《医师法》·执业规则"],["不属于我国社会主义医德基本原则内容的一项是",["实行社会主义、人道主义","防病治病","中西医并重","救死扶伤","全心全意为人民身心健康服务"],"C",1,"rw","医学伦理","我国社会主义医德基本原则的内容是：防病治病、救死扶伤、实行社会主义人道主义、全心全意为人民身心健康服务。“中西医并重”是卫生工作方针的内容，不属于医德基本原则，故为应选项；A、B、D、E均在其内。\n\n📚 出处：《医学伦理学》第5版·医学道德的基本原则"],["医务人员称呼病人的姓名，而避免叫床号，这是为了满足病人的",["被认识接纳的需要","被关心尊重的需要","获取信息的需要","安全的需要","疗效需要"],"B",1,"rw","人文综合","称呼姓名而非床号，是把患者作为有身份的个体对待，使其感到被尊重、被关心，维护其人格尊严，属被关心尊重需要的满足。被认识接纳的需要指被记住和认同，获取信息、安全、疗效需要与本例的称呼方式无直接对应关系。\n\n📚 出处：《医学心理学》·病人心理需要"],["以下不属于医德关系的是",["医患关系","医学科研中的道德观念","医社关系","患者之间的关系","医医关系"],"D",1,"rw","医学伦理","医德关系指医疗活动中涉及道德评价的关系，包括医患关系、医际（医医）关系、医社关系，以及医学科研等活动中的道德关系。患者与患者之间的关系不属医疗职业活动中的伦理关系，也不由医务人员承担道德义务，故不属于医德关系。\n\n📚 出处：《医学伦理学》第5版·医患关系"],["在问诊过程中，以下哪项做法是错误的",["使病人理解无误","对病人的不良情绪立即批评","不打断病人的思路","不强迫病人回答有关隐私问题","必须防止暗示性套问"],"B",1,"rw","医患沟通","问诊中应使患者理解无误、不随意打断其思路、不强求其回答隐私问题、避免暗示性套问，以获取真实可靠的信息。对患者的不良情绪立即批评，会使患者感到被否定而隐讳或沉默，既违背尊重原则又影响诊断，属明显错误做法。\n\n📚 出处：《医患沟通学》·问诊技巧"],["我国医德思想的核心是",["精益求精","至意深心","仁爱精神","尊师重道","诚信待人"],"C",1,"rw","医学伦理","我国医德思想以儒家“仁”为核心，形成仁爱救人、赤诚济世的仁爱精神，把“医乃仁术”作为医学的根本价值定位。精益求精是医术与职业态度的要求，至意深心出自《大医精诚》对诊疗态度的描述，尊师重道、诚信待人是道德规范的具体条目，均不构成核心。\n\n📚 出处：《医学伦理学》第5版·中国医学道德的历史发展"],["医务人员在申报或实施科研项目中，如有抄袭、编造或篡改科研数据和图表，是违反了哪项行为规范",["不利用执业之便谋取不正当利益","廉洁自律、恪守医德","忠诚职业，尽职尽责","互相尊重，和谐共事","诚实守信，抵制学术不端行为"],"E",1,"rw","医学心理","《医疗机构从业人员行为规范》把“诚实守信、抵制学术不端行为”单列为一条，明确禁止抄袭、篡改、编造科研数据和图表、代写代发论文等行为，故E对应题干所述行为。A针对的是利用执业之便谋取不正当利益（如收回扣）；B廉洁自律强调不受财物；C忠诚职业讲尽职尽责；D互相尊重、和谐共事规范医际关系。四者虽属医务人员行为规范内容，但与科研数据造假无直接对应关系。\n\n📚 出处：《医疗机构从业人员行为规范》·科研行为规范"],["患者陈某，男，64 岁。因用铁丝掏咽部致铁丝勾住会厌部急诊入院。入院经医师检查后，向患者大哥告知病情重，手术难度大，风险高，花费大。家属商议后，因经济困难，放弃治疗出院，因患者是五保户，只能任其生死。下列做法符合医疗机构从业人员行为规范的是",["因家属无力支付医疗费用，给予办理出院手续","批评家属的选择，要求其赶快借钱缴费，待其缴足费用后再决定手术","对于危重患者，应当立即抢救。对限于设备或者技术条件不能诊治的病人，应当及时转诊。","为防范医疗纠纷，减少不必要的麻烦，建议家属回当地医院治疗","发动募捐，尽量筹措医疗费用"],"C",1,"rw","卫生法律法规","《医疗机构管理条例》要求医疗机构对危重患者应当立即抢救；对限于设备或者技术条件不能诊治的病人，应当及时转诊。患者会厌被铁丝勾住属急危重症，经济困难不能成为放弃抢救的理由，故C正确，也符合救死扶伤、以病人利益为重的伦理要求。A以无力支付为由办出院，属推诿；B以缴费为条件才手术，把金钱置于生命之上；D以防范纠纷为由让患者转回当地，实为转嫁风险；E募捐值得同情但不是医疗机构的法定行为选择，均不妥。\n\n📚 出处：《医疗机构管理条例》·医疗机构执业规则"],["某七旬女性患者从楼上摔下，送至某市某医院。夜间多次出现病情变化，家属报告值班医生后，医生没有到床边检查病人情况，也没有报告二线医师，就开医嘱。次日病人死亡，医患双方发生争议。下列说法正确的是",["医院不需要承担任何责任","值班医生没有认真履行医生职责，责任心不强","医院有一定过错，但不需要承担责任","值班医生缺乏有效沟通技能","家属应主动找医生来检查"],"B",1,"rw","医患沟通","患者夜间多次病情变化，值班医生接到报告后既不到床旁检查，也不请示二线医师，直接开医嘱，属未尽注意义务和诊疗义务，是责任心不强的失职表现，因此B正确。A“不需要承担任何责任”忽视了医疗机构的过错；C“有过错却不需担责”自相矛盾，民事上仍可能构成医疗损害；D把问题归结为沟通技巧，掩盖了核心的诊疗义务违反；E把注意义务转嫁给家属，与医务人员的职业责任相悖。\n\n📚 出处：《民法典》·医疗损害责任"],["某人因工作压力大，多年来经常反复出现心烦、心跳过速、胸部不适、出汗。经心电图、血压、血脂、心脏多普勒检查均正常。该患者的反应有可能为",["躯体疾病","心身障碍","心理症状","神经衰弱","精神疾病"],"B",1,"rw","人文综合","患者主诉心烦、心跳加快、胸闷、出汗，反复多年，而心电图、血压、血脂、心脏多普勒等客观检查均正常，说明其躯体症状与心理社会应激（工作压力）密切相关，属心理社会因素引起的躯体功能障碍，即心身障碍。A躯体疾病需有器质性病变证据，本例已排除；C心理症状强调的是主观心理体验，不能解释心悸出汗等躯体反应；D神经衰弱是以精神易兴奋伴脑力易疲乏为特征的神经症，本例以心血管系统反应为主；E精神疾病多指重性精神病。\n\n📚 出处：《医学心理学》·心身疾病"],["一位 20 岁的女青年因丧失兴趣，情绪低落，想哭泣，感到前途无望，有自杀的想法，伴有睡眠障碍，并对自己身体过分关心而来心理门诊求医。如果需给她做人格测验，应首先考虑选用的量表是",["MMPI","16-PF","EPQ","洛夏测验","16-PF 和 EPQ"],"A",1,"rw","医学心理","患者抑郁、兴趣丧失、有自杀观念伴疑病倾向，症状丰富且需与其他精神障碍鉴别，人格测验应首选MMPI（明尼苏达多项人格调查表）。MMPI含多个临床量表（抑郁、疑病、癔症等）和效度量表，适用于临床诊断与鉴别，正可满足本例需要。B 16-PF和C EPQ主要测正常人格特质，鉴别精神症状的能力有限；D洛夏测验属投射测验，实施解释耗时且标准化程度低，不作首选；E两者合用并不能弥补其临床诊断功能不足。\n\n📚 出处：《医学心理学》·心理测验"],["李某，男，40 岁。患晚期胃癌住院治疗，医生认为积极的手术比保守的化疗、放疗效果好，因此建议病人及家属配合医生进行手术，但病人不愿为家庭带来经济负担，坚决反对手术。此时医生的行为选择是",["完全遵从病人的意见，不做劝说","医生行使干涉权，强行手术","让家属作出处理决定","为病人提供充分信息，并尊重病人的自主选择","由医生、病人、家属三方共同讨论决定是否手术"],"D",1,"rw","医学心理","手术的最终决定权在患者本人，但知情同意要求医务人员先提供充分、真实、可理解的信息，再由患者自主判断，故D正确。A完全遵从却放弃劝说，属未尽说明义务；B以干涉权强行手术，干涉权只适用于患者决定明显危害社会或他人、或危重抢救无同意能力等特殊情形，本例不适用；C把决定权交给家属，忽视了患者本人的自主权；E三方共同讨论可作为沟通形式，但最终决定应由患者作出，且不能以集体意见替代本人同意。\n\n📚 出处：《医学伦理学》第5版·知情同意"],["肖XX，28岁，因不规则发热2月余，巩膜发黄40多天入院…剖腹检查：为晚期肝癌，已有腹腔转移。此时应如何处置",["满足家属和单位领导要求，积极抢救治疗","考虑医学道德的要求，不惜一切代价地积极治疗","尊重患者权利，如实告诉病情","为避免使患者精神崩溃，做好保密工作","尊重患者权利，在治疗同时可适当告诉病情"],"E",1,"rw","人文综合","晚期肝癌已有转移，根治无望，患者享有知情权，但如实告知时应顾及心理承受能力，在告知的同时给予支持、保留希望并继续对症支持治疗，故E最恰当。A、B强调不惜一切代价积极治疗，忽视疗效与患者利益，也不尊重知情权；C“如实告诉”不讲方式，可能造成不必要的精神打击；D一律保密则剥夺了患者对自身病情的知情权和后续安排权。\n\n📚 出处：《医学伦理学》第5版·保密与知情"],["患者陶女士，38 岁。1 年前发现“宫颈癌”，手术后恢复很好，但 1 年后腹部增强 CT 却发现肝脏有一约 4cm×6cm 大小的实性占位病灶，医生考虑肝癌可能性大。现在王医生将此消息告知了陶女士，当陶女士听说情况后，面部表情很呆滞，既没有哭泣，也没有悲伤。您认为王医生现在最佳的做法是",["立即对陶女士表示深切的同情","告知陶女士此时即便肝脏发现占位病变也不能代表就是肝癌","马上鼓励陶女士接受事实并努力战胜疾病","保持安静，暂停一切对话，用肢体语言表示关切和安慰","告知陶女士，检查报告也可能有误，这种情况在医疗中也时常发生"],"D",1,"rw","医学伦理","陶女士获知可能的肝癌诊断后表情呆滞、既无哭泣也无悲伤，属告知坏消息后的“休克—否认”期反应，此时最需要的是沉默陪伴，用肢体语言（如递纸巾、轻握手臂）表达关切，给其消化信息的时间，故D最佳。A过早表达深切同情可能引出未准备好的情绪；B“不能代表就是肝癌”、E“检查可能有误”都是虚假安抚，损害信任；C马上鼓励其战胜疾病，跳过了悲伤过程，属过早干预。\n\n📚 出处：《医患沟通学》·告知坏消息（SPIKES）"],["患者，女性，45 岁。在初次心理治疗中，衣着整洁，年貌相当，言语清晰。但语速较快、逻辑欠清晰，倾诉欲特别强，说话滔滔不绝，不带丝毫停顿。为了节省时间，尽快了解患者的主要问题，医生应对这位患者",["解释其多话原因","训斥其说话无主题","使用封闭式提问","诊断为躁狂症","继续认真地倾听"],"C",1,"rw","医学心理","患者语速快、逻辑欠清、滔滔不绝，如继续开放式倾听会耗费大量时间且难以获得关键信息，此时应改用封闭式提问，用“是不是”“有没有”限定回答范围，快速聚焦主要问题，故C正确。A解释多话原因偏离诊疗目标；B训斥会伤害医患关系；D仅凭多话不能诊断躁狂症，躁狂还需情感高涨、活动增多等；E继续认真倾听虽体现尊重，但与“尽快了解主要问题”的要求相反。\n\n📚 出处：《医患沟通学》·提问技巧"],["依法取得医师资格的人员可以向所在地县级以上人民政府卫生健康主管部门",["登记备案","申请登记","申请行医","申请注册","申请备案"],"D",1,"rw","人文综合","《执业医师法》规定，取得医师资格的，可以向所在地县级以上人民政府卫生健康主管部门申请注册，经注册取得医师执业证书后方可执业，故D正确。A、B、E的“登记”“备案”都不是取得执业资格的法定程序；C“申请行医”不是法律概念，行医须以注册取得执业证书为前提；未注册而行医属非医师行医，应承担法律责任。\n\n📚 出处：《执业医师法》·执业注册"],["执业医师的合法处方权",["大学毕业后即取得","实习一年后即取得","医师资格考试合格后取得","在经注册的执业地点取得","到任何聘用单位就有处方权"],"D",1,"rw","卫生法律法规","处方权不是随毕业、实习或考试合格自动取得，而是在取得执业医师资格并注册后，于经注册的执业地点获得，故D正确。A大学毕业后尚未取得资格，更无处方权；B实习一年只是报考条件之一；C考试合格仅取得资格，未经注册仍不能执业；E到任何聘用单位即有处方权，违反执业地点限制，跨地点执业须先办理变更注册。\n\n📚 出处：《处方管理办法》·处方权"],["根据《麻醉药品和精神药品管理条例》规定，下列哪一部门应当对执业医师开具麻醉药品和精神药品处方的情况进行监督检查",["县级以上人民政府","县级以上人民政府疾病控制部门","县级以上人民政府卫生主管部门","县级以上人民政府药品监督管理部门","市级以上人民政府卫生主管部门"],"C",1,"rw","卫生法律法规","《麻醉药品和精神药品管理条例》确立分段监管体制：药品监督管理部门负责麻醉药品和精神药品的生产、经营、使用环节的质量与流向监管，而医疗机构内医师开具麻醉药品、精神药品处方的情况，由县级以上人民政府卫生主管部门监督检查，故C正确。A“县级以上人民政府”不是具体实施主体；B疾控部门负责疾病预防控制，无此职权；D药监部门监管的是药品本身而非医师处方行为；E级别限定为市级以上，与条例规定的县级以上不符。\n\n📚 出处：《麻醉药品和精神药品管理条例》·监督管理"],["注销注册、收回医师执业证书的情形不包括",["死亡","受刑事处罚","初次参加医师考核不合格","中止医师执业活动满 2 年","受吊销医师执业证书行政处罚"],"C",1,"rw","卫生法律法规","《执业医师法》规定，医师死亡或者被宣告失踪、受刑事处罚、受吊销医师执业证书行政处罚、中止医师执业活动满二年以及考核不合格经再次考核仍不合格等情形，由原注册部门注销注册、收回执业证书。初次考核不合格者，法律给予接受培训和继续医学教育后再次考核的机会，并不直接注销注册，故C为“不包括”项。A、B、D、E均属法定注销情形。\n\n📚 出处：《执业医师法》·执业注册的注销"],["医疗机构施行特殊治疗时",["可以由经治医生决定施行","可以由本科在科主任主持下讨论决定施行","由医院决定施行","可以征求患者意见","必须征得患者同意"],"E",1,"rw","卫生法律法规","《医疗机构管理条例》规定，医疗机构施行手术、特殊检查或者特殊治疗时，必须征得患者同意，并应当取得其家属或者关系人同意并签字；无法取得患者意见时，应当取得家属或者关系人同意并签字，故E正确。A经治医师自行决定、B科内讨论决定、C医院决定，都绕开了患者的知情同意权；D“可以征求患者意见”把必须履行的义务降为可选项，弱化了知情同意。\n\n📚 出处：《医疗机构管理条例》·医疗机构执业规则"],["依照我国《人体器官捐献和移植条例》，可以为其直系血亲捐献肾脏的是",["27 周岁的未婚男性","35 周岁的严重智力低下患者","17 周岁的健康中学生","五代以内旁系血亲","22 周岁的精神病患者"],"A",1,"rw","卫生法律法规","《人体器官捐献和移植条例》要求活体器官捐献人年满十八周岁、具有完全民事行为能力、自愿无偿，且受者限于捐献人的配偶、直系血亲或者三代以内旁系血亲。A为27周岁健康未婚男性，属成年人且具备完全民事行为能力，可以捐献。B严重智力低下、E精神病患者不具完全民事行为能力；C 17周岁为未成年人；D五代以内旁系血亲超出三代以内的范围，均不符合条件。\n\n📚 出处：《人体器官捐献和移植条例》·器官捐献"],["有关母婴保健医学技术鉴定的说法，以下哪项是错的",["公民和医疗保健机构均可以申请母婴保健医学技术鉴定","母婴保健医学技术鉴定结果不具备法律效力","对产前诊断结果有异议也可以申请鉴定","县以上地方政府可以设立母婴保健医学技术鉴定组织","应当慎重作出医学技术鉴定结论"],"B",1,"rw","卫生法律法规","母婴保健医学技术鉴定是对婚前医学检查、遗传病诊断、产前诊断等结果有异议时组织的技术鉴定，鉴定结论是卫生行政部门处理争议的依据，具有法律效力，故B所述“不具备法律效力”错误，为本题答案。A公民和医疗保健机构均可提出申请；C对产前诊断结果有异议可以申请鉴定；D县级以上地方人民政府可设立母婴保健医学技术鉴定组织；E鉴定应慎重作出结论，均正确。\n\n📚 出处：《母婴保健法》·母婴保健医学技术鉴定"],["未经医师(士)亲自诊查患者或亲自接产，医疗机构不得出具某些证明文件，但可以出具",["疾病诊断书","健康证明书","死产报告书","死亡证明书","医疗纠纷分析书面证言"],"E",1,"rw","卫生法律法规","《医疗机构管理条例》规定，未经医师（士）亲自诊查患者，医疗机构不得出具疾病诊断书、健康证明书或者死亡证明书等证明文件；未经医师（士）、助产人员亲自接产，不得出具出生证明书或者死产报告书。据此A、B、C、D均须亲自诊查或接产方能出具。医疗纠纷分析书面证言属于对诊疗过程的事后陈述性材料，不属于上述须亲自诊查方可出具的证明文件，故E为可出具项。\n\n📚 出处：《医疗机构管理条例》·医疗机构执业规则"],["医疗事故技术鉴定，可以收取鉴定费用。下列有关医疗损害鉴定费的收取方法，说法正确的是",["鉴定费由医方支付","鉴定费预先向医患双方收取，最终按照责任比例承担","鉴定费由患方承担","经鉴定，属于医疗事故的，鉴定费用由医疗机构支付","经鉴定，不属于医疗事故的，鉴定费用由提出医疗事故处理申请的一方支付"],"B",1,"rw","卫生法律法规","按《医疗事故处理条例》，经鉴定属于医疗事故的，鉴定费由医疗机构支付；不属于医疗事故的，鉴定费由提出医疗事故处理申请的一方支付，故D、E才是条例确立的规则，B所称“预先向医患双方收取、按责任比例承担”更接近诉讼中鉴定费的实务做法，与条例表述不一致。本题按条例判断应指向D（或E），原库选B理由不足。⚠️原库答案存疑\n\n📚 出处：《医疗事故处理条例》·医疗事故的技术鉴定"],["危重病人病情稳定后不愿意离开监护室，是何种心理防御的具体表现",["转移","退化","反向","否认","逆反"],"B",1,"rw","医学心理","危重患者经抢救病情稳定后仍不愿离开监护室，表现为依赖性增强、要求被照顾、放弃自主决策，属心理防御机制中的退化（退行），即退回到幼稚、依赖的行为方式以减轻面对疾病和独立生活的焦虑，故B正确。A转移是把情绪指向替代对象；C反向是以相反态度表现真实冲动；D否认是不承认已发生的事实，本例已承认病情只是不愿离开；E逆反是对抗权威的对抗行为，均不符。\n\n📚 出处：《医学心理学》·精神分析·防御机制"],["首先使用心理测验概念的人是",["卡特尔","比奈","韦克斯勒","高尔顿","韦克斯勒和高尔顿"],"A",1,"rw","医学心理","1890年卡特尔（J.M.Cattell）在论文中首次使用“心理测验”（mental test）这一术语，用以指称一套标准化测量程序，故A正确。B比奈与西蒙编制了世界上第一个智力量表，贡献在智力测验的编制；C韦克斯勒编制了韦氏成人、儿童智力量表，采用离差智商；D高尔顿在个体差异与统计方法上有开创性工作，但未提出心理测验概念；E把两人并列作为概念提出者不成立。\n\n📚 出处：《医学心理学》·心理测验"],["Friedman 等通过研究发现 A 型行为冠心病发病率是 B 型行为的",["2.37 倍","5.37 倍","23.7 倍","53.7 倍","537 倍"],"A",1,"rw","医学心理","Friedman与Rosenman对A型行为（争强好胜、时间紧迫感、敌意易怒）与B型行为（从容、节奏平缓）人群作前瞻性比较，发现A型行为者冠心病发病率约为B型者的2.37倍，故A正确。其余数值5.37、23.7、53.7、537倍均被夸大，不符合原研究结论。此项研究是行为因素与冠心病关系的重要证据，也奠定了A型行为作为冠心病危险因素的认识。\n\n📚 出处：《医学心理学》·心身疾病·A型行为"],["心理过程包括",["动机、兴趣、世界观","认知、人格、行为","认知、情绪、意志","气质、性格、能力","自我认识、自我体验、自我调控"],"C",1,"rw","医学心理","心理学把心理现象分为心理过程和个性（人格）两大类，心理过程包括认知过程（感觉、知觉、记忆、思维、想象）、情绪情感过程和意志过程，故C正确。A动机、兴趣、世界观属个性倾向性；B认知、人格、行为不构成同一层次的三分结构；D气质、性格、能力属个性心理特征；E自我认识、自我体验、自我调控是自我意识的三个方面，均不属于心理过程。\n\n📚 出处：《医学心理学》·心理学基础·心理现象"],["医学心理学的研究任务是",["心理行为因素对健康影响的机制","心理行为因素在疾病发生、发展、转归的全过程中的影响规律","通过心理行为调整及干预，达到预防疾病、治疗疾病和促进疾病康复的作用与机制","研究心理评估、心理咨询、心理治疗的理论和方法","以上均正确"],"E",1,"rw","医学心理","医学心理学的研究任务包括：阐明心理社会因素对健康和疾病影响的作用机制，揭示心理行为因素在疾病发生、发展、转归全过程中的规律，研究通过心理行为调整与干预实现疾病预防、治疗和康复的作用与机制，以及研究心理评估、心理咨询与心理治疗的理论和方法。A、B、C、D分别覆盖上述任务的一个方面，均正确，故E正确。\n\n📚 出处：《医学心理学》·绪论·研究任务"],["马斯洛提出的是",["自我实现心理学","自我心理学","人格自我心理学","自我个体心理学","人格自我心理学和自我个体心理学"],"A",1,"rw","人文综合","马斯洛提出的是自我实现心理学（人本主义心理学），以需要层次论和自我实现为核心，强调人的潜能与价值，故A正确。B自我心理学一般指哈特曼等自我心理学派的取向；C、D“人格自我心理学”“自我个体心理学”均非心理学的规范流派名称；E把两个不规范名称并列作为马斯洛的学说，同样不成立。\n\n📚 出处：《医学心理学》·心理学流派·人本主义"],["交感神经的激活，会引起一系列内脏生理变化，但不包括",["心率、心肌收缩力和心输出量增加，血压升高","分解代谢加速，汗腺分泌增多","血液重新分配，皮肤和内脏血流量减少，心、脑和肌肉获得充足的血液","瞳孔缩小","促进肾小管的重吸收，使逼尿肌舒张和括约肌收缩"],"D",1,"rw","人文综合","交感神经系统激活时，心率、心肌收缩力和心输出量增加、血压升高，分解代谢加速、汗腺分泌增多，血液重新分配使皮肤内脏血流减少而心脑骨骼肌供血充足，瞳孔扩大、逼尿肌舒张而括约肌收缩。D“瞳孔缩小”与之相反，瞳孔缩小是副交感兴奋的表现，故为本题答案。E所述逼尿肌舒张、括约肌收缩也属交感效应，符合生理事实。\n\n📚 出处：《医学心理学》·应激的生理机制"],["某些疾病其发病、发展、转归与治疗都与心理社会因素密切相关，这一组疾病称为",["精神疾病","躯体疾病","社会疾病","心身疾病","老年疾病"],"D",1,"rw","医学心理","心身疾病（心理生理疾患）是指以心理社会因素为重要发病原因，且具有器质性病理改变或明确的躯体症状的一组躯体疾病，如原发性高血压、冠心病、消化性溃疡、支气管哮喘等，其发病、发展、转归与治疗均与心理社会因素密切相关，故D正确。A精神疾病以精神活动异常为主要表现；B躯体疾病范围过宽，不强调心理社会因素；C社会疾病不是规范术语；E老年疾病是按年龄划分的范畴。\n\n📚 出处：《医学心理学》·心身疾病"],["以下哪项不属于医学心理学分支",["健康心理学","神经心理学","临床心理学","社会心理学","护理心理学"],"D",1,"rw","医学心理","医学心理学的分支一般包括临床心理学、健康心理学、神经心理学、护理心理学、变态心理学、心理卫生（心理健康）等，它们都以医学情境中的心理学问题为对象。社会心理学研究社会情境中个体的社会行为与社会互动，属普通心理学分支，不是医学心理学的分支，故D为答案。A、B、C、E均属医学心理学分支领域。\n\n📚 出处：《医学心理学》·绪论·学科分支"],["医学伦理原则不含",["不伤害","公正","尊重","胆识","有利"],"D",1,"rw","医学伦理","医学伦理基本原则包括尊重（尊重自主、知情同意、保密）、不伤害、有利（行善）和公正四项，部分教材表述为尊重、不伤害、有利、公正。“胆识”属医务人员个人素质要求，不属于医学伦理原则，故D为答案。A不伤害、B公正、C尊重、E有利（行善）均在原则之列。\n\n📚 出处：《医学伦理学》第5版·医学伦理基本原则"],["以下哪项是医学伦理学的特征之一",["灵活性","集体性","继承性","组织性","非规范性"],"C",1,"rw","医学伦理","医学伦理学具有实践性、继承性、时代性（发展性）和规范性等特征，其中继承性表现为历代医德成果被世代相传并不断丰富，如“医乃仁术”“大医精诚”至今仍被承继，故C正确。A灵活性、E非规范性与之相悖，医学伦理本身即以规范性和原则性为特征；B集体性、D组织性不是医学伦理学的学科特征。\n\n📚 出处：《医学伦理学》·绪论·学科特征"],["在通常情况下，手术治疗前最重要的伦理原则是",["安慰家属","检查周全","减轻病人的疑虑","知情同意","确定手术方式"],"D",1,"rw","医学伦理","手术具有创伤性和不可逆性，术前最重要的伦理原则是知情同意：医师须向患者说明诊断、术式、风险、替代方案及预后，取得其自愿、明确的同意，故D正确。A安慰家属只是沟通环节；B检查周全是技术准备；C减轻疑虑属心理支持；E确定手术方式是技术决策内容。这四项均不能替代患者本人对创伤性治疗的自主授权。\n\n📚 出处：《医学伦理学》第5版·知情同意"],["在我国开展人类辅助生殖技术，下列各项中符合卫生部制定的伦理原则的是",["一名供精者给 5 名以上的妇女受孕","给单身妇女实施人工授精","不得实施非医学需要的性别选择","对供精者实施商品化","由医务人员做主对剩余的胚胎进行处理"],"C",1,"rw","医学伦理","人类辅助生殖技术的伦理原则要求：不得实施非医学需要的性别选择，故C正确。A一名供精者的精子使5名以上妇女受孕违反供精者精子使用人数上限（为控制近亲婚配风险，一名供精者的精子最多使5名妇女受孕）；B单身妇女人工授精在我国被禁止；D精子、卵子商品化违背无偿捐献原则；E剩余胚胎的处理须经供受双方知情同意并签署书面意见，不能由医务人员单方作主。\n\n📚 出处：《医学伦理学》第5版·人类辅助生殖技术伦理"],["人体试验的目的应该是",["通过促进医学科学的发展而改善人类环境、造福人类","服务于战争与时局","满足个人的研究兴趣","服务于所在医院的需要","服务于研究所发展的需要"],"A",1,"rw","医学伦理","人体试验的根本目的在于通过促进医学科学发展，掌握人体生理病理规律、改进诊治与预防方法，最终改善人类健康、造福人类，故A正确。B服务于战争与时局，属二战中日本、德国人体实验的暴行，被《纽伦堡法典》明确否定；C满足个人研究兴趣、D服务于所在医院需要、E服务于研究所发展需要，都是把个人或单位利益置于受试者利益之上，违背受试者利益优先原则。\n\n📚 出处：《医学伦理学》第5版·人体试验伦理"],["医学伦理学是研究什么的一门学科",["行为方式","医学道德","法律规范","科研方法","医疗行为"],"B",1,"rw","医学伦理","医学伦理学是研究医学道德现象及其发展规律的科学，是伦理学与医学相结合的交叉学科，其对象是医疗实践中的道德关系、道德意识和道德规范，故B正确。A行为方式过于宽泛且不含价值判断；C法律规范属法学研究范围；D科研方法属方法学；E医疗行为是研究对象之一的载体，不能等同于医学道德这一核心。\n\n📚 出处：《医学伦理学》·绪论·研究对象"],["能全面反映伦理学概念的是",["研究职业道德现象的科学","研究社会现象和理论的科学","研究社会公共道德的科学","研究道德现象的科学","研究家庭道德的科学"],"D",1,"rw","医学伦理","伦理学是关于道德的科学，研究道德的起源、本质、发展规律及其社会作用，故D“研究道德现象的科学”最能全面反映伦理学概念。A研究职业道德现象只是伦理学的一部分（职业道德仅为其分支）；B研究社会现象和理论过于宽泛，且未指出道德这一核心；C仅限社会公共道德、E仅限家庭道德，都是以偏概全。\n\n📚 出处：《医学伦理学》·绪论·道德与伦理学"],["在下列各项中，违背卫生部颁布的人类辅助生殖技术伦理原则的是使用",["捐赠的精子","亲属代孕","卵胞浆内单精子注射","捐赠的卵子","植入前胚胎遗传学诊断"],"B",1,"rw","医学伦理","我国原卫生部关于人类辅助生殖技术与人类精子库的伦理原则明确规定：医务人员不得实施代孕技术，其中也包括亲属间代孕，故B属违背伦理原则的做法。A捐赠精子、D捐赠卵子在不违反匿名、无偿和数量限制前提下是允许的；C卵胞浆内单精子注射是针对男性因素不育的常规技术；E植入前胚胎遗传学诊断用于避免遗传病患儿出生，均属允许范围。\n\n📚 出处：《医学伦理学》第5版·人类辅助生殖技术伦理"],["以下哪项是构成医患交往障碍患者方面的因素",["医生对患者的关注不够","医务人员对患者的偏见","医生对个人功利的过分追求","患者对医务人员过高的期望值","医务人员的医德医风问题"],"D",1,"rw","医患沟通","医患交往障碍的因素分为医方与患方两方面。患方因素包括对医务人员期望值过高、对医疗风险缺乏认识、不良情绪与不信任、文化程度与语言差异等，故D正确。A医生对患者关注不够、B医务人员对患者的偏见、C医生对个人功利的过分追求、E医务人员的医德医风问题，都属医方（医务人员）方面的因素，与题干限定的“患者方面”不符。\n\n📚 出处：《医患沟通学》·沟通障碍"],["解释病情过程中，患者的哪种肢体语言提示我们继续讲述",["频频看表","前倾注视","皱眉叹气","低头玩手机","注视无关的人"],"B",1,"rw","医患沟通","身体前倾、目光注视医生、点头等是典型的积极倾听信号，表示患者有兴趣、愿意继续听下去，故B正确。A频频看表反映不耐烦或时间焦虑；C皱眉叹气反映困惑、不满或怀疑；D低头玩手机表明注意力转移；E注视无关的人说明注意力不在谈话内容上。后四种都提示应暂停、调整表达方式或询问患者疑问。\n\n📚 出处：《医患沟通学》·非言语沟通"],["在医患沟通过程中如果要用医学术语，尽量避免采用哪种方法",["用图片解释说明","用模型解释说明","口头解释说明","用录像形象化解释说明","仍用专业术语解释，以显示自己的权威"],"E",1,"rw","医患沟通","使用医学术语时应借助图片、模型、录像等形象化手段或通俗化口头解释帮助患者理解，唯独不能“仍用专业术语解释以显示权威”，因为这会使患者听不懂、无法有效知情，也违背以患者为中心的沟通原则，故E为应避免的做法。A、B、D属可视化解释，C口头通俗解释是基本方式，均有助理解。\n\n📚 出处：《医患沟通学》·语言沟通"],["医生和患者交谈时，医生的哪种目光是适当的",["目光长久直视患者","不时的注意患者面部和全身","回避患者视线，仅瞬间目光接触","避免目光接触","注视患者脸部以外的地方"],"B",1,"rw","医患沟通","交谈时恰当的目光是自然、柔和地不时关注患者面部与全身，既表示倾听与尊重，又能观察其表情变化，故B正确。A长时间直视会给患者压迫感和被审视感；C仅瞬间接触、回避视线，显得不自信或冷漠，患者可能理解为不关心、有所隐瞒；D完全避免目光接触会削弱信任；E注视脸部以外地方易被误解为心不在焉。\n\n📚 出处：《医患沟通学》·非言语沟通·目光"],["就康复训练问题与术后的患者进行沟通，以下哪种做法可以调动患者的参与",["安慰患者什么都不用去想","请护士把患者的生活照顾好","确保患者理解康复训练对他的帮助","护士记录并向医生报告患者的康复训练情况","告诉患者康复训练是一项艰难的任务"],"C",1,"rw","医患沟通","要让术后患者主动参与康复训练，关键是使其理解康复训练对自身功能恢复的具体益处，形成内在动机，故C正确。A“什么都不用想”削弱其主体性；B由护士包办生活照料，强化依赖，与康复训练要求的主动参与相反；D由护士记录报告，患者仍处被动地位；E强调训练艰难，会加重畏难情绪，降低参与意愿。\n\n📚 出处：《医患沟通学》·遵医行为与健康指导"],["面对一个愤怒的患者，医生得让这个生气的人知道，你听到、看到并理解他的感受。这样做的目的是什么",["表达同情心","表达责任心","表达同理心","表达怜悯之心","表达爱心"],"C",1,"rw","人文综合","让愤怒的患者确信“你听到、看到并理解他的感受”，是把对方的情绪准确辨识并反馈回去，即表达同理心（共情），故C正确。A同情心是对他人处境的怜悯式情感，着眼点在“我为你难过”；B责任心指向职责担当；D怜悯之心带有居高临下的意味，易激惹愤怒患者；E爱心过于笼统。共情要求先接纳情绪、不加评判，再谈问题解决。\n\n📚 出处：《医患沟通学》·共情"],["医生将一个坏消息告知患者并达成治疗共识后，一般在结束此次谈话前留联系方式给患者，表明医生",["态度好","希望与患者建立治疗同盟","不怕患者的麻烦","医疗技术很高","担心患者想找自己时找不到"],"B",1,"rw","医学伦理","告知坏消息并达成治疗共识后留下联系方式，是向患者传递“我会与你一起面对、你可以随时找到我”的信号，目的是建立并巩固治疗同盟，故B正确。A态度好只是表象评价；C“不怕麻烦”是患者视角的推测；D医疗技术高低与留电话无关；E“担心找不到”只停留在联络便利层面，未触及同盟关系的建立这一核心目的。\n\n📚 出处：《医患沟通学》·告知坏消息（SPIKES·策略与总结）"],["提高病人依从性的方法不包括",["及时纠正病人的不良行为","纠正病人对检查和治疗措施的错误认识","建立融洽的医患关系","提高病人对医嘱的理解和记忆程度","教会病人自我监测"],"A",1,"rw","人文综合","提高依从性的措施包括纠正患者对检查治疗措施的错误认识、建立融洽合作的医患关系、提高对医嘱的理解和记忆（如简化方案、书面提示）、教会自我监测、争取家庭支持等。A“及时纠正病人的不良行为”以纠正行为为目标，带有强制和评判色彩，若缺乏沟通易引起对抗，且不属于依从性干预的常规方法，故为“不包括”项。B、C、D、E均为有效方法。\n\n📚 出处：《医学心理学》·遵医行为"],["医疗单位必须作为目标管理的重要内容，衡量和评价一个单位工作的好坏的重要标准是",["医疗技术水平","管理经营水平","医院经济效益","成本核算","医德医风建设"],"E",1,"rw","人文综合","医德医风建设是医疗机构管理的重要组成部分，原卫生部明确要求把医德医风建设纳入目标管理，作为衡量和评价单位工作好坏的重要标准，并与考核、评优挂钩，故E正确。A医疗技术水平、B管理经营水平、D成本核算都是业务与经营指标；C医院经济效益更不宜作为评价工作好坏的首要标准。四者不能替代医德医风这一体现办院方向的标准。\n\n📚 出处：《医学伦理学》·医德评价与医德建设"],["对尊重病人自主权的正确理解是",["此准则适用于所有患者","此准则适用于病人的所有自我决定","医生的任何干预都是不道德的","病人有权根据自身状况作出理性决定","一切后果患者自负，医生不需承担任何责任"],"D",1,"rw","医学伦理","尊重自主权的实质是承认有决定能力的患者有权在获得充分信息后，根据自身状况作出理性决定并得到尊重，故D正确。A错误，自主权只适用于具备决定能力的患者，婴幼儿、昏迷、发作期精神病患者不适用；B错误，患者的自我决定须以不伤害他人和社会、符合法律为前提；C错误，医师的合理干预（如劝阻、教育）并不一概不道德；E错误，尊重自主不等于免除医师的注意义务和责任。\n\n📚 出处：《医学伦理学》第5版·尊重原则"],["若你所在科室首次开展某种手术，作为负责医生在告知方面应当",["可以不经患者，告知近亲属就行","告之其配偶即可","必须主动告知患者本人","如果患者不主动问，医生是可以不告知的","在收费方面与其他手术没有区别"],"C",1,"rw","医学伦理","首次开展的新手术属新技术、高风险项目，患者本人的知情同意不可替代，医师必须主动告知患者本人该手术的新开展性质、技术成熟度、风险与替代方案，而不能等患者询问，故C正确。A仅告知近亲属不合法，除患者无同意能力等法定情形外，须取得患者本人同意；B告知配偶即可，同样排除了患者本人；D“不问就不告知”违反主动告知义务；E是否新开展与收费是两个问题，不能以收费相同替代告知。\n\n📚 出处：《医学伦理学》第5版·知情同意"],["社会主义的医德关系应是",["谋生协作型","赐舍恩惠型","友好合作型","排斥对立型","志同对立型"],"C",1,"rw","医学伦理","社会主义医德关系以生产资料公有制和同志式的人际关系为基础，医患之间是目标一致、平等互助的友好合作关系，故C正确。A谋生协作型把医疗局限为谋生手段，降低其崇高性；B赐舍恩惠型把医疗服务视为施舍，颠倒了医患平等地位；D排斥对立型与E志同对立型都预设了根本利益冲突，与社会主义医德关系性质相悖。\n\n📚 出处：《医学伦理学》·医德关系"],["关于医务人员的同情感，以下错误的是",["它是医务人员发自内心的情感","它是促使医务人员为患者服务的原始动力","它是医德情感内容中低层次的情感","它是责任感的基础","它比责任感具有较大的稳定性"],"E",1,"rw","人文综合","同情感是医务人员发自内心、对患者痛苦产生共鸣的情感，是促使其为患者服务的原始动力，也是责任感的基础；在医德情感层次中，它属较低层次（高于它的还有责任感和事业感）。其稳定性弱于责任感，故E“比责任感具有较大的稳定性”错误，为本题答案。A、B、C、D均符合同情感的性质与地位。\n\n📚 出处：《医学伦理学》·医德情感"],["医务工作者崇高的职业道德境界",["只体现在认识疾病的活动中","只体现在治疗疾病的活动中","只体现在认识疾病、治疗疾病的活动中","只体现在家庭生活中","与医学研究无关"],"C",1,"rw","医学伦理","医务工作者的职业道德境界须通过具体的医学实践活动体现，而认识疾病（诊断）与治疗疾病是医学实践的两大基本环节，崇高的职业道德境界必然贯穿于诊断与治疗的全过程，故C正确。A、B各执一端，把医德境界限定于诊断或治疗的单一环节；D家庭生活属私人领域，不能作为职业境界的体现场所；E医学研究同样是医学实践的重要方面，说“与医学研究无关”也不成立。\n\n📚 出处：《医学伦理学》·医德境界"],["现代医学模式是指",["生物-心理-社会医学模式","生物医学模式","高新技术医学模式","整体医学模式","分子医学模式"],"A",1,"rw","人文综合","1977年恩格尔提出生物-心理-社会医学模式，主张把疾病与健康看作生物、心理、社会因素共同作用的结果，取代单纯的生物医学模式，故A正确。B生物医学模式正是被取代的传统模式；C高新技术医学模式、E分子医学模式只强调技术或分子层次的进展，不能涵盖心理社会维度；D整体医学模式表述不规范，不属于公认的现代医学模式名称。\n\n📚 了患儿的生命权和医师的紧急救治义务。\n\n📚 出处：《医学伦理学》第5版·有利与不伤害原则"],["一对未婚夫妇来到某妇幼保健院做婚检。检查结果发现男方患有梅毒，男方担心女友离开自己，要求医生为自己保密，女方则要求医师告知其男友的真实情况。从医学伦理学的角度分析，最合理的是",["医师应该为男士保密","医师应该告知女士真实情况，但对外保密","医师应该说服男士，将实情告知女友，但若男士坚决反对，则应尊重其意见","该女士无权向医师提出知晓其男友实情的要求","请示领导再作决定"],"B",1,"rw","医学伦理","婚检发现男方梅毒，梅毒属《传染病防治法》规定需报告的乙类传染病，且女方作为密切接触者面临明确的健康风险，医师保密义务存在例外：应告知女方真实情况以保护其健康和知情权，但不得向社会扩散，故B正确。A绝对保密使女方失去防护与知情机会；C把告知与否完全交由男方决定，风险仍落在女方身上；D否认女方的知情权；E请示领导并非处理此类冲突的必要程序。\n\n📚 出处：《医学伦理学》第5版·保密及例外"],["一位女医生声调柔和，目光亲切，讲话面带微笑。她在下列哪方面做得好",["言语沟通","非言语沟通","言语沟通和非言语沟通","目光沟通","肢体动作沟通"],"B",1,"rw","医患沟通","声调、目光、表情、体态、距离等均属非语言沟通，女医生的柔和声调、亲切目光和微笑都是非语言信号，故B正确。A言语沟通指语言内容本身（用词、语义），题干未涉及；C把两者并列，与题干信息不符；D目光沟通、E肢体动作沟通虽属非语言沟通的具体形式，但仅涵盖其中一项，不能概括声调与微笑，故过于片面。\n\n📚 出处：《医患沟通学》·非言语沟通"],["某知名医院被病人投诉于媒体，说医师对病人不负责、十分冷漠。院方在处理此问题的过程中发现，病人的投诉中反复强调：“在整个接诊的过程中，医生都没有抬头看过我一眼，居然把处方开出来了。”院方查看病历，发现医师记录了病人的主诉要点，用药非常对症，从疾病诊断到处方都是正确的。下列答案中哪种说法是正确的",["缺乏医患沟通","医生没有义务与病人进行交流","不看病人一眼又不影响诊疗","病人的要求过分","病人多、时间少"],"A",1,"rw","卫生法律法规","医师诊断与用药正确，但接诊全程未抬头看患者一眼，切断了目光、表情、体态等非语言交流，患者因而感到冷漠、不被尊重，投诉的实质是缺乏医患沟通，故A正确。B称医师无交流义务，与《执业医师法》规定的关心、爱护、尊重患者义务相悖；C只看病不看人已影响患者体验与信任，不能说无影响；D把责任归于患者要求过分；E患者多、时间少是客观困难，不能成为免除沟通义务的理由。\n\n📚 出处：《医患沟通学》·非言语沟通"],["医疗机构执业登记的主要事项不包括",["名称、地址、主要负责人","所有制形式","诊疗科目、床位","注册资金","国外合作情况"],"E",1,"rw","卫生法律法规","《医疗机构管理条例》规定，医疗机构执业登记的主要事项包括名称、地址、主要负责人，所有制形式，诊疗科目、床位，注册资金等，故A、B、C、D均属登记事项。“国外合作情况”不属于执业登记的法定事项，故E为答案。需注意中外合资、合作医疗机构另有专项设置审批规定，但不作为执业登记的通用登记事项。\n\n📚 出处：《医疗机构管理条例》·执业登记"],["关于发生医疗事故的医疗单位应负的法律责任，以下错误的是",["应确定为医疗事故","医疗单位根据事故等级、情节轻重和病员情况给予一次性经济补偿","病员的所有医疗费用由医疗单位支付","补偿费标准由省、自治区、直辖市人民政府规定","由卫生行政部门根据医疗事故等级和情节，给予警告"],"C",1,"rw","卫生法律法规","发生医疗事故后，医疗机构应承担相应法律责任：确认事故等级，按等级、情节和患者情况给予一次性经济补偿，补偿标准由省级人民政府规定，卫生行政部门可给予警告等行政处罚。但并非患者的“所有”医疗费用都由医疗单位支付，原发病治疗费用等仍应由患者承担，故C错误，为本题答案。A、B、D、E均符合《医疗事故处理条例》的规定。\n\n📚 出处：《医疗事故处理条例》·医疗事故的赔偿与处理"],["医患双方在医疗纠纷处理中，造成人身、财产或者其他损害的；构成违反治安管理行为的；构成犯罪的，依法应承担的责任或给予的处罚是",["民事责任、治安管理处罚、刑事责任","治安管理处罚、民事责任、刑事责任","刑事责任、治安管理处罚、民事责任","民事责任、刑事责任、治安管理处罚","治安管理处罚、刑事责任、民事责任"],"A",1,"rw","卫生法律法规","《医疗纠纷预防和处理条例》规定，医患双方在医疗纠纷处理中造成人身、财产或者
