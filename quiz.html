],"C",1,"lc","基础与预防医学","细胞和组织的适应性反应包括萎缩（实质细胞体积缩小）、肥大（细胞体积增大）、增生（细胞数目增多）、化生（一种分化成熟组织转变为另一种分化成熟组织），故 A、B、D、E 均属适应。再生是损伤后由邻近存活细胞增殖修复缺损的过程，属修复（Repair）范畴，与适应反应不同，故 C 为答案。\n\n📚 出处：《病理学》第9版·细胞和组织的适应与损伤"],["关于 EGF，叙述错误的是",["表皮生长因子，是一种多肽类物质","可以促进表皮和上皮细胞的生长","EGF 受体是一种典型的受体型 PTK","与恶性肿瘤发生有关","可诱导细胞发生凋亡"],"E",1,"lc","临床综合","表皮生长因子是多肽类生长因子，与受体（受体型酪氨酸蛋白激酶）结合后促进表皮及上皮细胞增殖分化、加速创面愈合，其过度表达或受体突变与多种恶性肿瘤发生有关，故A、B、C、D正确。EGF促进细胞增殖、抑制凋亡，而非诱导凋亡，故E错误。\n\n📚 出处：《病理学》第9版·细胞和组织的适应与损伤（生长因子）"],["脑性瘫痪的言语治疗不包括",["进食训练","构音障碍训练","语言发育迟缓训练","日常生活交流能力训练","引导式教育"],"E",1,"lc","神经与精神","脑性瘫痪的言语治疗包括构音障碍训练（呼吸控制、发声、共鸣、构音器官运动）、语言发育迟缓训练、进食与口腔功能训练（咀嚼、吞咽、流涎控制）、日常生活交流能力训练及替代沟通系统（AAC）。引导式教育（Peto 法）以节律性意向、习作与小组活动为核心，是综合性的神经康复教育体系，属教育康复整体方法而非言语治疗的具体技术，故不包括 E。\n\n📚 出处：《康复医学》第6版·儿童康复·脑性瘫痪的康复"],["下列肿瘤中对 FDC 摄取较低的是",["B 细胞淋巴瘤","结肠低分化腺癌","胃印戒细胞癌","乳腺浸润性导管癌","低分化型肝细胞癌"],"C",1,"lc","基础与预防医学","18F-FDG 的摄取取决于肿瘤细胞葡萄糖转运体、己糖激酶活性及细胞密度。胃印戒细胞癌由富含黏液的印戒细胞弥漫浸润生长，细胞密度低、间质黏液多、代谢活性弱，FDG 摄取常较低，故 C 为答案。A B 细胞淋巴瘤增殖快、转运体表达高，摄取明显增高；B 结肠低分化腺癌细胞密集、代谢旺盛；D 乳腺浸润性导管癌摄取中等偏高；E 低分化肝细胞癌摄取亦高。\n\n📚 出处：《核医学》·PET/CT 肿瘤显像"],["轻度有机磷杀虫药中毒瞳孔变化情况是",["瞳孔缩小","瞳孔扩大","两侧瞳孔大小不等","瞳孔形状不规则","乳白色"],"A",1,"lc","理化与中毒","瞳孔缩小是有机磷农药中毒最早、最典型的体征，因虹膜括约肌由副交感神经支配，ACh 蓄积使括约肌持续收缩、瞳孔缩小。轻度中毒即以毒蕈碱样表现为主，瞳孔缩小已经出现；重度时瞳孔可呈针尖样并伴大汗、流涎、肺水肿。瞳孔扩大见于阿托品过量或阿托品化；两侧瞳孔不等大提示脑疝；乳白色混浊见于白内障等，故为 A。\n\n📚 出处：《内科学》第9版·有机磷杀虫药中毒"],["阴道大出血，休克，疑为前置胎盘。以下哪一项检查最合适",["肛诊","阴道检查","窥器检查","超声波胎盘定位","CT"],"D",1,"lc","妇产科","晚孕期无痛性阴道大出血疑前置胎盘时，绝对禁止肛诊与阴道检查（可触及胎盘附着面引起致命性大出血），窥器检查亦可诱发。首选的定位诊断是无创的超声胎盘定位，可明确胎盘与宫颈内口的关系并鉴别胎盘早剥，指导分娩方式。CT有辐射且无必要。\n\n📚 出处：《妇产科学》第9版·前置胎盘"],["抗休克治疗的根本措施是",["积极处理原发病","纠正酸中毒","补充血容量","应用血管扩张剂，改善微循环","抗凝治疗解除微细血栓"],"A",1,"lc","外科总论与麻醉","抗休克的根本措施是去除病因：止血、清除或引流感染灶、解除心脏压塞、恢复有效心泵功能等原发病处理，故A正确。补充血容量是纠正血流动力学紊乱的首要环节，但属于对症支持；纠酸、血管扩张剂、抗凝治疗都是纠治休克中下游病理生理改变的辅助手段，单纯处理这些环节常使休克难以逆转。\n\n📚 出处：《外科学》第9版·外科休克"],["1 岁患儿，重度营养不良，突然发生面色灰白，神志不清，脉搏减慢，呼吸暂停等。应先考虑",["心力衰竭","低血钠症","低血糖症","低血钙症","继发感染"],"C",1,"lc","儿科","重度营养不良患儿因糖原储备少、糖异生能力差，在感染或饥饿应激下极易发生自发性低血糖，表现为面色苍白、神志不清、脉率减慢、呼吸暂停，甚至猝死，故C正确。低血钠、低血钙多表现为惊厥、抽搐而无脉率减慢；心力衰竭多有呼吸困难、肝大、水肿；继发感染多伴发热。急救应即刻静注葡萄糖，并注意缓慢纠正。\n\n📚 出处：《儿科学》第9版·蛋白质-能量营养不良"],["男性，30 岁，工作中被高压电击伤头部，致颅骨及头皮 5cm×5cm 大小缺损。皮肤缺损即时修复的最佳方法是",["游离组织移植","植皮","异体头皮移植","局部头皮皮瓣转移","头皮组织扩张术"],"D",1,"lc","神经与精神","电击伤致头皮及颅骨 5cm×5cm 缺损，需即时覆盖创面以保护脑组织、防止颅内感染。头皮血运丰富，局部皮瓣（旋转、推进或双蒂皮瓣）可即刻提供带血运的全层皮肤覆盖，是首选。游离组织移植需显微血管吻合，而电击伤后受区血管内膜损伤，风险大；只植皮缺乏颅骨保护、不能覆盖骨缺损；异体头皮来源困难且有排异；组织扩张术需数周至数月，不能满足“即时修复”要求。\n\n📚 出处：《外科学》第9版·烧伤·电烧伤"],["厌恶疗法的原理是",["心理防御机制","交互抑制","人本主义","自我强化","条件反射"],"E",1,"lc","临床综合","厌恶疗法以经典条件反射为原理，将引起厌恶的刺激（电刺激、催吐药）与不良行为反复结合，使不良行为与厌恶体验建立条件联系，从而逐渐消退该行为，故E正确。交互抑制是系统脱敏的原理（B），心理防御机制、人本主义、自我强化均与厌恶疗法的原理无关。\n\n📚 出处：《精神病学》第8版·心理治疗（行为治疗）"],["下列哪项可推测为泪膜不稳定",["BUT＜30 秒","BUT＜20 秒","BUT＜10 秒","BUT＜10 分钟","BUT＜5 分钟"],"C",1,"lc","临床综合","泪膜破裂时间（BUT）正常为10～45秒，＜10秒提示泪膜不稳定，是干眼诊断的重要依据。备选中＜20秒、＜30秒仍可能在正常范围下限附近，＜10分钟、＜5分钟显然过长，均不符合诊断界值，故正确判断为BUT＜10秒。\n\n📚 出处：《眼科学》第9版·眼表疾病（干眼的检查）"],["关于肥厚性心肌病在门控心血池显像上的表现，下述不正确的是",["室壁活动增强","EF 值增高","左室腔变大","相位图色阶分布不均匀","TPFR 增大"],"C",1,"lc","心血管系统","肥厚型心肌病以室间隔非对称性增厚、左室腔缩小、收缩功能增强为特征，门控心血池显像表现为室壁活动增强、EF增高、舒张功能受损致TPFR（高峰充盈时间）延长、相位图色阶分布不均。左室腔变大是扩张型心肌病的特点，与本病相反。故选C。\n\n📚 出处：《核医学》第9版·心血管系统显像·心肌病的核素显像"],["被甲类传染病病原体污染的污水、污物、粪便，有关单位必须按照下列哪项规定进行处理",["在卫生防疫机构的指导监督下进行严密消毒后处理","由卫生防疫机构进行消毒后处理","在卫生防疫机构的指导下进行消毒后处理","在卫生防疫机构的指导监督下进行消毒后处理","由卫生防疫机构进行严密消毒后处理"],"A",1,"lc","传染病","《传染病防治法》规定，对被甲类传染病病原体污染的污水、污物、粪便，有关单位必须按照规定，在卫生防疫机构（现为疾病预防控制机构）的指导监督下进行严密消毒后处理，强调两点：一是由产生污染的单位负责实施处理而非由防疫机构包办，二是必须“严密消毒”且全程接受指导监督，故 A 最完整。B、E 将处理主体错误地归于防疫机构；C、D 分别缺少“严密”和“监督”，消毒强度与责任约束不足。\n\n📚 出处：《传染病学》第9版·传染病的预防"],["决定肾结核的治疗方法，除全身情况外主要依靠",["膀胱刺激症状的程度","血尿程度","尿中是否找到结核杆菌","膀胱镜检查所见","静脉尿路造影或逆行肾盂造影所见"],"E",1,"lc","呼吸系统","肾结核治疗方式的选择主要依据静脉尿路造影（或逆行肾盂造影）所示的病变范围与对侧肾功能：患肾无功能或破坏严重而对侧肾功能良好者行患肾切除；双侧病变或早期破坏者以药物治疗为主，必要时行保留肾组织的手术。膀胱刺激症状、血尿程度只反映膀胱受累与病情活动，不能定位定量；尿中找到结核杆菌仅证实诊断；膀胱镜所见主要用于评估膀胱挛缩，均不能决定术式。\n\n📚 出处：《外科学》第9版·泌尿系统结核·肾结核"],["下列病变符合亚急性重型肝炎特点的是",["肝细胞广泛变性及点状坏死","肝细胞弥漫性大片坏死，再生不明显","肝细胞弥漫性大片坏死伴肝细胞结节状再生","肝细胞碎片状坏死伴结缔组织增生及肝细胞再生","肝细胞异型增生"],"C",1,"lc","消化系统","亚急性重型肝炎的病理特点是肝细胞大片状坏死（亚大块坏死，范围较急性重型小）并伴明显肝细胞结节状再生和结缔组织增生，故C正确。A为普通型急性病毒性肝炎的表现；B为急性重型肝炎（大片坏死、再生不明显）；D为慢性肝炎（碎片状坏死伴纤维增生）；E为肝细胞异型增生，属癌前改变。\n\n📚 出处：《病理学》第9版·病毒性肝炎"],["关于原发性肝癌的 CT 表现，下述错误的是",["平扫肿块内可有高密度影","平扫肿块内可有更低密度区","强化类型为肝动脉供血型","肝门可变形移位","增强扫描为“快进慢出”型"],"E",1,"lc","消化系统","原发性肝癌以肝动脉供血为主，增强CT典型表现为动脉期明显强化、门静脉期及延迟期造影剂迅速退出呈低密度，即快进快出，故快进慢出错误，选E。A、B正确：肿块内可因出血、钙化呈高密度，也可因坏死液化呈更低密度；C正确，其强化类型为肝动脉供血型；D正确，肝门可受压变形移位。\n\n📚 出处：《医学影像学》第9版·肝疾病·原发性肝癌"],["在心肺后期复苏中，以下哪项处理不适宜",["利用器械或呼吸器进行人工呼吸","因胸内心脏挤压远比胸外心脏挤压更有效，故宜使用胸内心脏挤压","肾上腺素是心脏复苏时最常用、效果最好的药物","利多卡因是治疗室性早搏或阵发性室性心动过速的药物","如出现心室纤颤，宜进行电除颤治疗"],"B",1,"lc","呼吸系统","后期复苏（高级生命支持）阶段应以胸外心脏按压为基础，胸内心脏挤压创伤大、需开胸条件，仅在开胸手术中或胸外按压无效（如心脏压塞、张力性气胸、胸廓畸形）等特殊情况下使用，不能因“更有效”而常规选用，故B不适宜。器械或呼吸器人工呼吸、肾上腺素为复苏首选药、利多卡因用于室性早搏与室速、室颤宜电除颤，均为后期复苏的标准措施。\n\n📚 出处：《外科学》第9版·重症监测治疗与复苏·心肺复苏"],["睡眠低通气是指",["口鼻气流较正常下降 50%，并伴血氧饱和度下降＞4%","口鼻气流较正常下降 50%，并伴血氧饱和度下降＞5%","口鼻气流较正常下降 60%，并伴血氧饱和度下降＞4%","口鼻气流较正常下降 40%，并伴血氧饱和度下降＞4%","以上都不是"],"A",1,"lc","呼吸系统","按睡眠呼吸监测判读标准，睡眠低通气指睡眠中口鼻气流较基础水平下降≥50%持续10秒以上，并伴血氧饱和度较基础值下降≥4%，故A正确。下降50%伴SpO2下降>5%、下降60%伴下降>4%、下降40%伴下降>4%等组合均不符合通用判定标准（呼吸暂停则要求气流下降≥90%）。睡眠低通气是睡眠呼吸暂停低通气综合征诊断与病情分级的重要依据。\n\n📚 出处：《阻塞性睡眠呼吸暂停低通气综合征诊治指南（2011年修订版）》·监测与诊断标准"],["关于呼吸衰竭的发病机制，不正确的是",["弥散障碍","肺泡通气与血流比例失调","酸碱失衡","肺泡通气不足","氧耗量增加"],"C",1,"lc","呼吸系统","呼吸衰竭的发病机制包括肺通气不足（肺泡通气量下降致PaCO2升高）、弥散障碍（间质水肿、纤维化使弥散距离增加）、通气血流比例失调（最重要，见于COPD、肺炎、肺不张）与肺内分流，此外氧耗量增加可加重低氧。酸碱失衡是呼吸衰竭的结果而非发病机制，故C为答案。\n\n📚 出处：《病理生理学》第9版·呼吸衰竭·发病机制"],["经阴道B超，胎儿胎心搏动应出现在妊娠",["4～5周","5～6周","6～8周","9～11周","11～12周"],"C",1,"lc","妇产科","经阴道超声（TVS）分辨率高，停经5周宫腔内可见圆形妊娠囊，停经6周可见胚芽及原始心管搏动，即胎心搏动出现在妊娠6～8周（经腹超声因受腹壁与膀胱影响，显示时间更晚，约7～8周）。胎心搏动是确诊宫内活胎最可靠的指标，4～5周仅见妊娠囊，9～12周已进入胎儿期。故答案为6～8周。\n\n📚 出处：《妇产科学》第9版·妊娠诊断"],["下列检查中，最适合眼眶骨折的检查是",["X 线","B 超","A 超","CT","MRI"],"D",1,"lc","运动与骨外科","眼眶爆裂性骨折的骨性结构（眶内壁、眶底、眶缘）细薄，CT（尤其骨窗、冠状位及三维重建）可直接显示骨折线、骨壁移位、眶内容物疝入上颌窦或筛窦及眼外肌嵌顿，是首选检查。X线平片重叠多、对眶底显示差；A超、B超对骨不敏感；MRI显示骨皮质不如CT，且金属异物时受限，仅在评估软组织、视神经损伤时补充。\n\n📚 出处：《眼科学》第9版·眼眶病·眼眶骨折"],["30岁经产妇，妊娠32周产前检查，B超示胎儿发育未见异常，腹部触诊宫底部触及圆而硬有浮球感的胎儿部分，血压正常。孕39周，产妇要求剖宫产，正确的处理是",["建议孕妇经阴道分娩","结合孕妇情况及复诊产前检查结果选择分娩方式","应用缩宫素引产","建议孕妇试产，必要时剖宫产","择期剖宫产"],"B",1,"lc","妇产科","孕32周触及宫底圆而硬、有 结肠炎","细菌性心内膜炎","胃十二指肠溃疡穿孔","胆道感染"],"E",1,"lc","消化系统","胆道感染（急性化脓性胆管炎、胆管结石合并感染）是我国细菌性肝脓肿最常见的病因，细菌沿胆管上行入肝形成脓肿，故E正确。坏疽性阑尾炎、溃疡性结肠炎可经门静脉途径致病，但比例较低；细菌性心内膜炎经肝动脉播散罕见；胃十二指肠溃疡穿孔主要表现为弥漫性腹膜炎。致病菌以大肠埃希菌、肺炎克雷伯菌多见。\n\n📚 出处：《外科学》第9版·肝疾病·肝脓肿"],["普鲁卡因局部浸润麻醉的一次最大剂量为",["0.1g","0.25g","0.5g","1.0g","2.0g"],"D",1,"lc","外科总论与麻醉","普鲁卡因属酯类短效局麻药，穿透力弱，主要用于局部浸润麻醉（0.25%～0.5%）与蛛网膜下腔阻滞。浸润麻醉成人一次极量为1.0g，故D正确。超过极量可出现头晕、耳鸣、烦躁、惊厥等中枢毒性及心肌抑制；酯类局麻药过敏率相对高，用前宜做皮试，加入适量肾上腺素可延缓吸收、延长作用时间。\n\n📚 出处：《临床麻醉学》第4版·局部麻醉"],["关于子宫内膜异位症，下列描述错误的是",["多见于生育年龄妇女，以 30～40 岁居多","发病与卵巢的周期性变化有关","子宫内膜出现和生长在子宫肌层","具有类似恶性肿瘤的远处转移和种植能力","一般极少发生恶变"],"C",1,"lc","妇产科","子宫内膜异位症指具有生长功能的子宫内膜组织（腺体与间质）出现在子宫体以外的部位，如卵巢、宫骶韧带、盆腔腹膜等；若内膜侵入子宫肌层则称子宫腺肌病，二者为不同疾病，故C描述错误。本病多见于30～40岁生育年龄妇女，其发生发展依赖卵巢激素的周期性变化，具有类似恶性肿瘤的种植、侵袭与远处转移能力，但恶变率极低（<1%）。\n\n📚 出处：《妇产科学》第9版·子宫内膜异位症"],["急性一氧化碳中毒抢救重点在于",["脱离 CO 环境","吸氧","纠正缺氧和防治脑水肿","控制脑水肿","早期应用脑细胞代谢药"],"C",1,"lc","理化与中毒","急性 CO 中毒的核心病理是 CO 与 Hb 结合形成 COHb 使氧输送障碍、并抑制细胞色素氧化酶，造成全身缺氧，而脑和心肌最敏感，缺氧性脑水肿是致残致死的主要原因。因此抢救重点是尽快纠正缺氧（高浓度氧、高压氧）并积极防治脑水肿（脱水、糖皮质激素、亚低温、促醒），即 C。脱离 CO 环境（A）和吸氧（B）是纠正缺氧的前提和手段，控制脑水肿（D）、脑细胞代谢药（E）只是其中一环，均不全面。\n\n📚 出处：《内科学》第9版·一氧化碳中毒"],["对溃疡性结肠炎最有价值的诊断方法是",["临床表现","大便常规","X线钡剂灌肠","血清α球蛋白测定","结肠镜检查"],"E",1,"lc","消化系统","结肠镜能直视黏膜，观察血管纹理消失、弥漫性充血水肿、糜烂及浅表溃疡、连续性分布等特征，并可取活检获得组织学诊断，是溃疡性结肠炎最有价值的诊断方法，故E正确。临床表现与大便常规均无特异性；X线钡剂灌肠只能显示间接征象，且在重度活动期有诱发中毒性巨结肠的风险；血清α球蛋白与该病无明确关系。\n\n📚 出处：《内科学》第9版·溃疡性结肠炎·诊断"],["关于肺心病急性加重期的治疗，下列哪项不适宜",["持续低流量吸氧","保持呼吸道通畅","及时控制呼吸道感染","早期足量应用利尿剂","应用支气管扩张剂"],"D",1,"lc","心血管系统","肺心病急性加重期利尿剂应遵循“小量、缓慢、间歇、短程、保钾与排钾联合”的原则。快速大量利尿可致低钾低氯性碱中毒（抑制呼吸中枢、加重CO2潴留）、痰液粘稠难以排出、血容量不足使心排量下降甚至休克。持续低流量吸氧、保持气道通畅、积极控制感染与支气管扩张剂均为正确措施。故不适宜者为D。\n\n📚 出处：《内科学》第9版·慢性肺源性心脏病·急性加重期的治疗"],["女性，28 岁，妊娠 5 个月合并甲状腺功能亢进。甲状腺较大，有轻度压迫症状。根据患者情况，宜采取的治疗方法是",["终止妊娠后手术治疗","甲状腺次全切除术","抗甲状腺药物治疗","终止妊娠后服抗甲状腺药物","放射性碘治疗"],"B",1,"lc","妇产科","妊娠合并甲亢首选抗甲状腺药物（孕早期首选丙硫氧嘧啶，孕中晚期可用甲巯咪唑），妊娠中期（4～6个月）是甲状腺手术的相对安全窗口；本例孕5个月、甲状腺较大伴压迫症状，药物控制不佳或不能耐受者宜行甲状腺次全切除术。放射性碘在孕期绝对禁用（破坏胎儿甲状腺）；不应因甲亢终止妊娠，除非病情危重。\n\n📚 出处：《妇产科学》第9版·妊娠合并甲状腺疾病"],["关于急性炎症性脱髓鞘性多发性神经病的病因描述，不正确的是",["确切病因未明","与细菌感染有关","可发生于感染性疾病、疫苗接种后","某些自身免疫性疾病可合并本病","可能与病毒感染有关"],"B",1,"lc","神经与精神","AIDP（吉兰-巴雷综合征）确切病因未明，目前认为是感染后诱发的自身免疫反应，通过分子模拟产生抗神经节苷脂抗体（GM1、GQ1b 等），攻击施万细胞膜或轴索。故可发生于感染性疾病、疫苗接种后，也可合并于系统性红斑狼疮等自身免疫病。教科书以病毒感染（巨细胞病毒、EB 病毒等）为常见前驱感染，而“与细菌感染有关”的笼统表述不确切——空肠弯曲菌虽为细菌，但其作用仍通过感染后免疫机制，故该项为错误描述。\n\n📚 出处：《神经病学》第8版·周围神经疾病·吉兰-巴雷综合征"],["感冒后一侧上颌磨牙疼痛，前额部头痛下午较重，同侧面颊部亦感疼痛近 3 天。考虑",["急性额窦炎","急性筛窦炎","急性蝶窦炎","急性上颌窦炎","以上都不是"],"D",1,"lc","神经与精神","急性鼻窦炎的定位依靠疼痛部位与时间规律：上颌窦炎为同侧面颊部及上列磨牙疼痛压痛、前额痛，晨起轻、午后重（窦口位置高、引流差、炎症蓄积）；额窦炎为前额周期性痛，晨起加重、午后减轻；筛窦炎为内眦及鼻根深部痛；蝶窦炎为颅底、球后或枕部痛。本例感冒后上颌磨牙痛、面颊痛、前额痛且午后加重，符合急性上颌窦炎，尚需与牙源性感染鉴别。\n\n📚 出处：《耳鼻咽喉头颈外科学》第9版·鼻及鼻窦炎症·急性鼻窦炎"],["请选出目前已在临床应用的卡马西平药物不良反应相关基因标记",["HLA-B*5801","HLA-B*5701","HLA-B*1502","HLA-B27","HLA-B*3303"],"C",1,"lc","基础与预防医学","卡马西平可诱发 Stevens-Johnson 综合征及中毒性表皮坏死松解症，其易感性与 HLA-B*1502 强相关，亚裔人群用药前推荐筛查该等位基因，故 C 正确。A HLA-B*5801 与别嘌醇致重症药疹相关；B HLA-B*5701 与阿巴卡韦超敏反应相关；D HLA-B27 与强直性脊柱炎等脊柱关节病相关；E HLA-B*3303 见于部分药物超敏反应的报道，不是卡马西平的公认标记。\n\n📚 出处：《医学遗传学》第7版·药物基因组学"],["患者，女性，23岁，既往有头部外伤史…每月发作1～2次。首选的治疗方法是",["避免诱因，继续观察","发作时口服抗癫痫药，不发作不吃药","发作时肌注地西泮","手术治疗","按抗癫痫药应用原则口服抗癫痫药"],"E",1,"lc","临床综合","有头部外伤史的反复发作性异常，属继发性癫痫，且每月发作1～2次，应查明病因后按抗癫痫药应用原则规律长期口服（单药、足量、足疗程，不随意停药减量），故E正确。发作稀少不等于无需治疗；只在发作时口服或肌注地西泮不能预防再发；致痫灶未明确时不宜手术。\n\n📚 出处：《神经病学》第8版·癫痫（治疗原则）"],["分离外周血单个核细胞常用的分层液是",["Percoll 分层液","Ficoll 分层液","(NH4)2SO4","NaCl","CaCO3"],"B",1,"lc","基础与预防医学","Ficoll 分层液为聚蔗糖与泛影葡胺的混合液，密度约 1.077，密度梯度离心后单个核细胞（淋巴细胞、单核细胞）比重小于分层液而悬浮于液面，红细胞、粒细胞沉于管底，是分离外周血单个核细胞的经典方法，故 B 正确。A Percoll 多用于分离细胞亚群或细胞器；C 硫酸铵为盐析试剂，用于蛋白沉淀；D NaCl 为等渗液，不能形成密度梯度；E CaCO3 不溶，无分层作用。\n\n📚 出处：《医学免疫学》第7版·免疫学技术（免疫细胞分离）"],["女性，21 岁，支气管哮喘发作 2 小时。查体：神志清，明显呼吸困难伴双肺广泛哮鸣音。血白细胞 8.0×109/L，中性粒细胞 0.82。最常见的动脉血气改变是",["代谢性酸中毒","呼吸性酸中毒","代谢性碱中毒","PaO2 降低，PaCO2 正常或降低","PaO2 明显降低，PaCO2 明显升高"],"D",1,"lc","呼吸系统","哮喘急性发作早期因气道痉挛与气道高反应，患者过度通气，PaO2轻中度降低而PaCO2正常或降低（呼吸性碱中毒），故D最常见。若出现PaCO2升高（E）则提示呼吸肌疲劳、气流严重受限，属病情危重、可能危及生命的信号；患者神志清、哮鸣音广泛，尚无CO2潴留证据。代酸、代碱、呼吸性酸中毒在本阶段均非典型改变；白细胞与中性粒细胞偏高与急性发作、应激或感染有关，不决定血气类型。\n\n📚 出处：《内科学》第9版·支气管哮喘·急性发作"],["27岁初产妇…不正确的处理方法是",["取宫腔分泌物作细菌培养","B型超声检查","静脉滴 织与不成熟编织骨替代正常骨组织的病变，少数（约 1%～2%，多骨型、McCune-Albright 综合征或放疗后者更高）可恶变为骨肉瘤、纤维肉瘤或软骨肉瘤，故 E 为易恶变者。A 牙骨质化纤维瘤、B 纤维骨瘤、C 骨化纤维瘤、D 牙骨质母细胞瘤均为良性牙源性或骨源性病变，生长缓慢、边界清楚，恶变罕见。\n\n📚 出处：《病理学》第9版·骨与关节疾病"],["女，48 岁。半年以来自觉乏力，上腹不适，隐痛，食欲减退，间断出现黑便，无呕血，体重下降约 8kg。既往无胃病史。查体：上腹部轻压痛，肝脾未触及，移动性浊音(-)。大便潜血(+)。首先考虑的诊断是",["慢性萎缩性胃炎","食管静脉曲张破裂出血","胃癌伴出血","应激性溃疡出血","消化性溃疡出血"],"C",1,"lc","消化系统","中年女性，半年上腹不适、隐痛、食欲减退、体重下降8kg、间断黑便、大便潜血阳性且既往无胃病史，报警症状齐全，属进行性消耗性疾病，首先考虑胃癌伴出血，故C正确。慢性萎缩性胃炎多无进行性消瘦与持续潜血阳性；食管静脉曲张破裂须有肝病史且以大量呕血为主；应激性溃疡有明确应激诱因、起病急；消化性溃疡疼痛有周期性与规律性。\n\n📚 出处：《内科学》第9版·胃癌·临床表现"],["咽后脓肿多局限于一侧是因为",["咽后脓肿多较小","咽壁的纤维组织在后壁正中上形成咽缝","咽后隙在中线处被咽缝分隔为左右两部分","咽后脓肿形成的脓腔较局限","以上均不是"],"C",1,"lc","眼耳鼻喉口腔","咽后隙上达颅底、下通纵隔，两侧来的筋膜在后壁正中汇合成咽缝，将间隙分为左右两半，两半间无交通，故咽后脓肿脓液被中线隔限制，多局限于一侧，表现为单侧咽后壁隆起、咽痛、吞咽及呼吸困难、头偏向患侧。A、D为脓腔大小的现象描述，B未指出分隔作用，E错误。\n\n📚 出处：《耳鼻咽喉头颈外科学》第9版·咽科学·咽的应用解剖"],["关于母体产褥期血容量的变化，以下哪一项是错误的",["产后 3 日内血容量增加 15%～25%","产后过多的组织间液回吸收使血容量增加","产后 24 小时内心脏负担加重，易引起心力衰竭","产后由于子宫收缩，胎盘循环不复存在，使大量血液进入体循环，使血容量增加","产后 8 周内血容量恢复至未孕状态"],"E",1,"lc","血液系统","产后胎盘循环消失、子宫收缩使血液回流入体循环，加之后过多的组织间液回吸收，产后3日内血容量增加15%～25%，产后24小时内心脏负荷最重，心脏病患者易发心衰。血容量多于产后2～3周恢复至未孕水平，最迟不超过6周，故8周的说法错误。\n\n📚 出处：《妇产科学》第9版·产褥期母体变化"],["不全流产",["易引起 DIC","易引起失血性休克","易引起宫腔粘连","易引起人流综合征","易引起子宫穿孔"],"B",1,"lc","临床综合","不全流产时部分妊娠物残留宫腔，子宫收缩不良、宫颈口开放，阴道流血持续且量大，可致贫血甚至失血性休克，故B正确。易引起DIC的是稽留流产（A）；宫腔粘连见于人流术后创伤与感染（C）；人流综合征由术中机械刺激引起（D）；子宫穿孔是手术操作并发症（E）。\n\n📚 出处：《妇产科学》第9版·自然流产"],["治疗面神经膝状神经节近端肿瘤，切除术后宜选用",["神经移植术","血管神经吻合肌瓣移植术","颞肌瓣转移术","自体阔筋膜悬吊术","面神经减压术"],"A",1,"lc","神经与精神","面神经膝状神经节近端（迷路段、内听道段、桥小脑角段）肿瘤切除后神经缺损过长，断端无法直接缝合，须在两端之间桥接。最常用的是自体神经移植术（取耳大神经、腓肠神经、股外侧皮神经），可修复数厘米缺损。血管神经吻合肌瓣移植、颞肌瓣转移、阔筋膜悬吊属动力性或静力性面瘫整复术，用于神经已无法修复的晚期面瘫；面神经减压术适用于面神经管内压迫（Bell 麻痹、骨折压迫），不适用肿瘤切除后缺损。\n\n📚 出处：《耳鼻咽喉头颈外科学》第9版·面神经疾病·面神经修复"],["一心房颤动病人，突觉呼吸困难、咳嗽、胸痛。X 线检查示右肺下三角形浸润阴影，心脏听诊闻及三尖瓣区舒张期奔马律。其来源为",["左房奔马律","右房奔马律","左室奔马律","右室奔马律","重叠奔马律"],"D",1,"lc","心血管系统","房颤患者突发呼吸困难、胸痛、咳嗽，X线示右肺下三角形浸润影（Hampton驼峰，提示肺梗死），提示肺栓塞引起急性右心负荷增加与右室扩大、右心衰；右室奔马律于三尖瓣区（胸骨左下缘）最响、吸气增强。左室奔马律在心尖部，左房奔马律少见，重叠奔马律见于心动过速伴左、右心衰。故为右室奔马律，选D。\n\n📚 出处：《诊断学》第9版·心脏检查·额外心音（奔马律）"],["关于心境稳定剂丙戊酸盐的临床应用，不正确的是",["对躁狂症的疗效与锂盐相当","对混合型躁狂和快速循环型情感障碍有效，对锂盐无效者可能有效","常见不良反应为胃肠刺激症状及镇静、共济失调、震颤等，孕妇慎用","剂量范围 800～1800mg/d","常用的有丙戊酸钠和丙戊酸镁"],"C",1,"lc","心血管系统","丙戊酸盐对躁狂发作疗效与锂盐相当，对混合型、快速循环型及锂盐无效者常有效，剂量800～1800mg/d，常见胃肠刺激、镇静、震颤、共济失调、体重增加与肝损害。其有明确致畸性（神经管闭合不全、脊柱裂），妊娠期应禁用或严格避免，而非仅“孕妇慎用”，故C表述不准确。故选C。\n\n📚 出处：《精神病学》第8版·心境障碍·心境稳定剂"],["口腔黏膜病最常见的临床表现为",["角化异常","溃疡","疱疹","结节","坏死"],"B",1,"lc","眼耳鼻喉口腔","口腔黏膜病损包括斑、疱、溃疡、糜烂、结节、萎缩、角化异常等，其中溃疡最为常见，见于复发性阿弗他溃疡、创伤性溃疡、扁平苔藓糜烂型、白塞病及多种系统性疾病的口腔表现，故B正确。A角化异常见于白斑、扁平苔藓；C疱疹见于单纯疱疹、带状疱疹；D结节见于肿瘤或纤维瘤；E坏死见于坏死性龈口炎、化疗后黏膜炎。\n\n📚 出处：《口腔黏膜病学》第5版·口腔黏膜病的基本病损"],["有关痉挛性大脑性瘫痪，下列哪项畸形最少见",["足内翻","跟腱挛缩","膝屈曲挛缩","髋屈曲挛缩","髋外展挛缩"],"E",1,"lc","神经与精神","痉挛型脑瘫因锥体束损害致肌张力增高，下肢以大腿内收肌群痉挛最常见，典型表现为双下肢交叉、剪刀步态，髋关节内收内旋挛缩；同时常见踝跖屈（尖足）、跟腱挛缩、足内翻、膝屈曲挛缩及髋屈曲挛缩。因内收肌痉挛，髋关节呈内收位，外展反而受限，“髋外展挛缩”极少见，故为最少见畸形。此类患儿后期发生的髋关节半脱位或脱位正是内收肌痉挛所致。\n\n📚 出处：《外科学》第9版·脑性瘫痪·临床分型与畸形"],["患者，女，48 岁。近 2 年来月经前后无定期，现出血 14 天未净，妇科检查无明显异常。拟诊为围绝经期功能失调性子宫出血，其治疗目的与青春期功能失调性子宫出血不同的是",["改善全身情况","止血","恢复排卵功能","调整月经周期","减少月经量"],"C",1,"lc","妇产科","青春期功血的治疗目标是止血、调整周期并恢复排卵、建立规律月经以恢复生育功能；围绝经期功血因卵巢功能衰退不可逆，治疗目的是止血、调整周期、减少经量、防止内膜过度增生恶变，不要求恢复排卵。故二者治疗目的不同的是“恢复排卵功能”，选C。\n\n📚 出处：《妇产科学》第9版·异常子宫出血"],["急性硬脑膜外血肿的典型意识改变是",["持续昏迷状态","伤后昏迷→清醒→再昏迷","伤后无昏迷","昏迷时浅时深","伤后昏迷，清醒后不再昏迷"],"B",1,"lc","神经与精神","急性硬脑膜外血肿多因颞部骨折撕破脑膜中动脉，血液积聚于颅骨与硬脑膜之间压迫脑组织。典型意识演变为中间清醒期：原发损伤致短暂昏迷（脑震荡）→血肿尚未形成、颅压尚未明显升高时意识恢复→随血肿增大、颅压升高及小脑幕切迹疝形成而再次昏迷并进行性加重，伴同侧瞳孔散大、对侧锥体束征。持续昏迷多见于脑干损伤、广泛脑挫裂伤或合并硬膜下血肿；昏迷时浅时深提示脑干损伤。\n\n📚 出处：《外科学》第9版·颅脑损伤·硬脑膜外血肿"],["孕妇在怀孕前几个月禁止 X 线照射",["1～2 个月以内","3 个月以内","4 个月以内","5 个月以内","6 个月以内"],"B",1,"lc","妇产科","受精后3～8周（自末次月经计约停经5～10周，即妊娠前3个月）是胚胎细胞高度分化、器官原基形成的关键期，对电离辐射最为敏感，照射可致流产、胎儿畸形（尤其中枢神经系统）或生长受限。故妊娠前3个月内应禁止X线照射；临床确需检查时须严格盆腔防护、缩短曝光时间并权衡利弊，妊娠中晚期相对安全。故答案为3个月以内。\n\n📚 出处：《妇产科学》第9版·孕期保健"],["下述哪个症状不是原发性干燥综合征的临床表现",["腮腺肿大","猖獗龋","下肢过敏性紫癜样皮疹","致残性关节脊柱炎","低血钾性软瘫"],"D",1,"lc","风湿免疫","原发性干燥综合征以外分泌腺体淋巴细胞浸润为特征：腮腺、下颌下腺反复肿大（A），唾液减少致牙齿广泛快速龋坏即猖獗龋（B），肾小管酸中毒引起低血钾性软瘫（E），并可有高球蛋白血症性紫癜样皮疹，尤其下肢（C），均为常见表现。D 致残性关节脊柱炎（破坏性关节炎、脊柱强直）是强直性脊柱炎等脊柱关节病的特征，干燥综合征关节受累多为非破坏性、一过性关节痛，不引起关节畸形和脊柱强直。\n\n📚 出处：《风湿 脱屑；多形红斑是急性免疫反应性红斑，均不以同形反应为特点。\n\n📚 出处：《皮肤性病学》第9版·扁平苔藓"],["关于凝血功能的监测指标，以下正确的是",["ACT 缩短可见于纤溶早期","APTT 延长可见于高凝早期","血小板计数降低少见于消耗性凝血病","D-二聚体升高可确诊 DIC","FDP 值增加提示凝血增强和纤维蛋白生成增加"],"E",1,"lc","血液系统","FDP是纤溶酶降解纤维蛋白（原）的产物，其增加提示凝血激活、纤维蛋白生成增多并继发纤溶亢进，故E正确。高凝早期ACT、APTT表现为缩短而非延长，纤溶早期ACT多延长；消耗性凝血病（DIC）血小板常进行性下降；D-二聚体敏感性高但特异性差，仅提示纤溶激活，不能确诊DIC。\n\n📚 出处：《内科学》第9版·弥散性血管内凝血"],["有关影响肿瘤对化疗敏感性的因素，下列不正确的是",["肿瘤的病理类型及分化程度","肿瘤大小及浸润范围","药物类型及选择","给药方案及给药途经","患者的性别及年龄"],"E",1,"lc","基础与预防医学","影响化疗敏感性的因素来自肿瘤与用药两方面：病理类型及分化程度决定增殖活性（A）；肿瘤大小及浸润范围影响药物渗透与血供（B）；药物种类须与周期特异性匹配（C）；给药方案与途径决定剂量强度和暴露时间（D）。患者性别、年龄并非公认的独立影响因素，只有部分激素依赖性肿瘤与绝经状态有关，故 E 为不正确答案。\n\n📚 出处：《病理学》第9版·肿瘤"],["尿失禁的类型不包括",["真性尿失禁","压力性尿失禁","假性尿失禁","充盈性尿失禁","急迫性尿失禁"],"C",1,"lc","泌尿系统","尿失禁按机制分为四型：①真性尿失禁（尿道括约肌损伤或神经功能障碍，膀胱空虚仍持续漏尿）；②压力性尿失禁（腹压骤增如咳嗽、喷嚏、大笑时漏尿，见于经产妇、盆底松弛）；③急迫性尿失禁（尿急后不由自主漏尿，见于膀胱过度活动症、感染）；④充盈性尿失禁（又称假性尿失禁，膀胱过度充盈后尿液溢出，见于前列腺增生、神经源性膀胱）。本题设\"假性尿失禁\"与\"充盈性尿失禁\"两个选项，实为同一类型的两种叫法。按命题意图取 C（\"假性尿失禁\"作为独立类型不属于分型），但须知道假性＝充盈性。\n\n📚 出处：《外科学》第9版·尿失禁的分类（本题选项设置存在概念重叠）"],["癫痫在局部脑血流断层显像(rCBF)中的特征性表现为",["存在大小脑失联络现象","大脑皮质不同部位存在 rCBF 低灌注区","大脑皮质不同部位存在 rCBF 高灌注区","发作间期病灶区放射性减低，发作期病灶区放射性增高","发作间期病灶区的放射性增高，发作期病灶区放射性降低"],"D",1,"lc","神经与精神","癫痫发作是神经元异常高频同步放电，局部代谢与血流需求骤增，故发作期病灶区呈高灌注、放射性摄取增高；发作间期因神经元损伤、皮层抑制及代谢降低，病灶区呈低灌注、放射性减低。这一“发作期高、间期低”的反差是 SPECT 定位致痫灶的依据，须与脑电图、MRI 互相印证。B、C 只描述单一状态，E 方向相反，A、D 不是 rCBF 对癫痫的特征描述。\n\n📚 出处：《神经病学》第8版·癫痫·辅助检查"],["下列哪种元素是谷胱甘肽过氧化物酶的重要组成成分",["钴","硅","镍","硒","铜"],"D",1,"lc","基础与预防医学","谷胱甘肽过氧化物酶以硒代半胱氨酸为活性中心，硒是其必需组成成分，可催化还原型谷胱甘肽清除过氧化氢和脂质过氧化物，保护细胞膜免受氧化损伤，故 D 正确。A 钴是维生素 B12 的组分；B 硅参与骨基质与胶原形成；C 镍的生理功能尚不明确；E 铜是铜蓝蛋白、Cu/Zn-SOD、细胞色素氧化酶的组分，均非该酶成分。\n\n📚 出处：《营养与食品卫生学》第8版·矿物质（硒）"],["水痘皮疹的特点是",["疱疹透亮，周围焮红","疱疹混浊，周围焮红","疱疹愈后留有瘢痕","丘疹，疱疹，皮疹同时并见","疱疹易破"],"D",1,"lc","儿科","水痘皮疹分批出现，斑丘疹、疱疹、结痂同时并存于同一部位，是本病最有诊断价值的特点，故D正确。疱疹初为清亮露珠状、周围红晕，可转混浊，故A、B只描述某阶段；水痘疱疹位置浅表，脱痂后一般不留瘢痕（C错）；疱疹壁薄易破（E）虽可见但特异性差，不如“分批同现”具鉴别意义。\n\n📚 出处：《儿科学》第9版·水痘"],["PET 探测射线依据的是",["电离作用","荧光现象","感光效应","康普顿散射","光电效应"],"B",1,"lc","临床综合","PET探测的是正电子与电子湮灭产生的两个方向相反的511keV光子，闪烁晶体（BGO、LSO等）吸收光子后发出荧光，经光电倍增管转为电信号成像，故依据是荧光现象，选B。电离作用主要用于电离室、剂量仪测量；感光效应是X线胶片的成像原理；康普顿散射和光电效应描述光子与物质相互作用的机制，用于解释γ相机探测效率与图像衰减校正，而非PET的探测原理。\n\n📚 出处：《核医学》第9版·核医学仪器"],["关于全身性感染相关性器官功能衰竭评分(SOFA)，认识错误的是",["强调早期动态监测","包括 6 个器官，每项 0～4 分","每日记录最高评分","目前研究认为最高评分和评分差值对评价病情更有意义","也被称为序贯器官功能衰竭评分"],"C",1,"lc","外科总论与麻醉","SOFA（序贯器官功能衰竭评分）评价呼吸（PaO2/FiO2）、凝血（血小板）、肝（胆红素）、循环（MAP或血管活性药）、中枢（GCS）、肾（肌酐或尿量）6个系统，每项0～4分（B、E对）；强调早期、动态监测（A对）；除最高分外，评分变化值（ΔSOFA）对评价治疗反应和预后更有意义（D对）。C所称“每日记录最高评分”不规范：应记录每日24小时内最差分值并纵向比较，故C为认识错误。\n\n📚 出处：《重症医学》·脓毒症与多器官功能障碍"],["患者，女性，24 岁。婚后 2 次自然流产，均为停经 40～50 天。早期流产最常见的病因是",["父母血型不合","黄体功能不全","染色体异常","急性传染病","宫颈裂伤"],"C",1,"lc","临床综合","妊娠12周前的早期流产最常见原因是胚胎染色体异常（多为数目异常如三体、单体、多倍体），占50%以上，故C正确。黄体功能不全是母体因素中的次要原因；父母血型不合多引起中晚期流产、死胎或新生儿溶血；急性传染病属少见诱因；宫颈裂伤（宫颈功能不全）导致的中晚期流产多在妊娠中晚期发生。本例两次均停经40～50天流产，符合染色体异常反复早期流产的特点，应查夫妻染色体。\n\n📚 出处：《妇产科学》第9版·流产"],["心脏后负荷过重不包括",["高血压","主动脉瓣狭窄","甲状腺功能亢进症","肺动脉高压","肺动脉瓣狭窄"],"C",1,"lc","心血管系统","后负荷为心室射血的阻力负荷：高血压与主动脉瓣狭窄加重左室后负荷，肺动脉高压与肺动脉瓣狭窄加重右室后负荷。甲状腺功能亢进属高动力循环状态，甲状腺激素使代谢率与心率增加、回心血量增多，主要加重容量（前负荷）并使心肌氧耗上升，不属后负荷过重。故选C。\n\n📚 出处：《病理生理学》第9版·心功能不全·心力衰竭的病因"],["胚胎的器官发育在妊娠多少周时已经完成",["4 周","6 周","8 周","20 周","24 周"],"C",1,"lc","妇产科","受精后8周内为胚胎期，各器官原基依次形成并完成大体分化；至妊娠8周末，胚胎已具人形、各器官系统原基均已建立，此后进入胎儿期以生长发育为主。故器官发育在妊娠8周时已完成，选C。\n\n📚 出处：《妇产科学》第9版·胚胎及胎儿发育"],["正常小儿脑脊液的细胞数一般不超过",["5.0×106/L","1.0×106/L","10×106/L","15×106/L","20×106/L"],"C",1,"lc","儿科","正常小儿脑脊液外观清亮，白细胞数0～10×10⁶/L，以淋巴细胞为主；蛋白0.2～0.4g/L，糖2.8～4.5mmol/L，氯化物117～127mmol/L，故C正确。若白细胞超过10×10⁶/L需考虑感染；化脓性脑膜炎白细胞常达数百至数千（中性为主）、糖显著降低、蛋白明显升高，结核性者呈淋巴细胞为主伴糖氯双低。\n\n📚 出处：《儿科学》第9版·小儿脑脊液特点"],["脊髓压迫症的最常见病因为",["脊椎疾病","脊髓髓内肿瘤","椎管内脊髓外肿瘤","急性脊髓炎","脊髓空洞症"],"C",1,"lc","神经与精神","脊髓压迫症常见病因按解剖层次分：肿瘤最常见（约占 1/3 以上），其中以椎管内髓外硬膜内肿瘤（神经鞘瘤、脊膜瘤）最多；其次为脊椎疾病（外伤、结核、转移瘤、椎间盘突出、骨质增生）；再次为炎症、先天畸形等。故最常见的是椎管内脊髓外肿瘤。急性脊髓炎属脊髓实质炎性脱髓鞘（非压迫性脊髓病），髓内肿瘤以髓内症状为主，脊髓空洞症亦非最常见压迫病因。\n\n📚 出处：《神经病学》第8版·脊髓疾病·脊髓压迫症"],["关于激肽释放酶，下述正确的是",["可溶解血管弹性纤维引起出血和血栓形成","参与胰腺及周围脂肪坏死和液化","使血管舒张和通透性增加，引起胰周水肿和休克","具有细胞毒副作用，引起胰腺坏死及溶血","激活胰蛋白酶原，对食物进行消化"],"C",1,"lc","基础与预防医学","胰腺炎时激肽释放酶激活激肽系统生成缓激肽，使血管扩张、通透性增加，引起胰周水肿、大量液体外渗及有效 石；碳酸氢钠用于碱化尿液（尿酸/胱氨酸结石），亦非针对草酸钙；口服氧化镁增加尿中草酸溶解度的说法不成立。故错误的为 D。\n\n📚 出处：《外科学》第9版·尿石症·预防"],["伤寒病的临床主要表现应除外",["持续高热","外周血白细胞增多","皮肤玫瑰疹","肝、脾肿大","相对缓脉"],"B",1,"lc","传染病","伤寒的临床特征是持续高热、相对缓脉、皮肤玫瑰疹、肝脾肿大和表情淡漠等中毒症状，实验室检查突出表现为白细胞总数减少（3～5）×10⁹/L、中性粒细胞减少、嗜酸性粒细胞减少或消失，嗜酸性粒细胞计数可作病情与疗效判断参考。外周血白细胞增多与伤寒不符（与化脓性感染特点相混），故选 B；其余 A、C、D、E 均为伤寒典型表现。\n\n📚 出处：《传染病学》第9版·伤寒"],["喉上动脉、喉上静脉进入喉内时穿过",["甲状舌骨膜","方形膜","三角膜","环甲膜","弹性膜"],"A",1,"lc","眼耳鼻喉口腔","喉上动脉发自甲状腺上动脉，与伴行的喉上静脉一起穿过甲状舌骨膜进入喉内，分布于室带、声带以上区域的黏膜，喉上神经内支亦经此膜穿入，故甲状舌骨膜是重要的解剖标志与手术入路。B方形膜、C三角膜、E弹性膜均为喉内纤维膜；D环甲膜穿行的是环甲动脉，位置在声门下。\n\n📚 出处：《耳鼻咽喉头颈外科学》第9版·喉科学·喉的应用解剖"],["小儿急性喉炎的特征性症状是",["畏寒、发热","呼吸困难","声嘶","喉痛","犬吠样咳嗽"],"E",1,"lc","儿科","小儿急性喉炎由病毒或细菌感染引起，因小儿喉腔狭窄、声门下组织疏松易水肿，典型表现为“空空”样犬吠样咳嗽，伴声嘶、吸气性喉鸣及吸气性呼吸困难，重者出现三凹征和发绀，故E正确。发热畏寒为一般感染中毒症状，无特异性；呼吸困难、声嘶、喉痛可见于多种喉部疾病，不如犬吠样咳嗽具有特征性。\n\n📚 出处：《儿科学》第9版·急性喉炎"],["温度对荧光分析影响的正确描述是",["溶液温度降低，荧光效率增加，荧光强度增加","溶液温度升高，荧光效率不变，荧光强度不变","溶液温度降低，荧光效率不变，荧光强度不变","溶液温度升高，自熄灭现象减少","溶液温度升高，荧光效率增加，荧光强度增加"],"A",1,"lc","理化与中毒","荧光强度与荧光效率正相关，而温度升高会加剧分子碰撞与内转换、系间跨越，使无辐射去激发增多、自熄灭增强，荧光效率和强度下降；温度降低则荧光效率提高、强度增强，故 A 正确。B、C 认为温度变化对荧光效率无影响，E 认为温度升高荧光增强，均与事实相反；D 认为升温自熄灭减少同样错误。测荧光时通常需控制温度恒定以保证结果稳定。\n\n📚 出处：《临床生物化学检验》第5版·光谱分析技术"],["预防或避免呼吸机相关肺炎应特别注意哪项",["防止呕吐物吸入","把病人安置于隔离病室","预防性应用高效、广谱抗生素","静脉应用高剂量丙种球蛋白","避免使用 H2 受体阻滞剂，防止胃液 pH 值升高"],"A",1,"lc","呼吸系统","呼吸机相关肺炎最主要的发病机制是口咽部定植菌与胃内容物微量误吸，故预防核心是防止误吸：床头抬高30°～45°、及时清除声门下与气囊上分泌物、避免使用镇静剂过深、尽早肠内营养并监测胃残余量、尽量缩短机械通气时间。隔离病室对呼吸道病毒等交叉感染有一定价值但非最关键；预防性广谱抗生素反而诱导耐药、增加VAP风险；静脉丙种球蛋白无预防证据；H2受体阻滞剂升高胃液pH确可增加VAP，属值得注意的措施之一，但仍以A为最关键。\n\n📚 出处：《医院获得性肺炎诊断和治疗指南》·呼吸机相关肺炎的预防"],["以下各项为提示右束支阻滞合并右心室肥大的标准，其中不正确的是",["V1 导联 R’波 1.5mV","额面 QRS 心电轴≥+90°","V5、V6 导联 R/≤1","V5、V6 导联的 S 波深度 0.5mV","应结合临床资料诊断"],"B",1,"lc","心血管系统","完全性右束支阻滞合并右室肥厚的参考标准为：V1导联R′≥1.5mV、V5V6导联R/S≤1、V5V6导联S波深度≥0.5mV、额面心电轴明显右偏（多数教材要求≥+110°），并须结合临床（肺心病、先心病、右室负荷）综合判断，因RBBB本身即可致电轴右偏与V1高R′。故“≥+90°”标准过宽、特异性不足，为不正确项；E强调结合临床是正确的。故选B。\n\n📚 出处：《诊断学》第9版·心电图·束支传导阻滞合并心室肥大"],["胰腺癌的外照射治疗结果，以下哪项不正确",["以远处转移失败为主","以局部失败为主","远处转移＋局部失败","远处转移＋局部失败＋疼痛","中位生存期 11.8 个月"],"D",1,"lc","消化系统","胰腺 畸形，故不属于子宫畸形。\n\n📚 出处：《妇产科学》第9版·女性生殖器官发育异常"],["关于精神分裂症偏执型的特征，以下哪项不正确",["起病年龄较晚，常在 40 岁左右","以妄想为主要表现","缓慢发病者多","幻觉少见","及时治疗效果较好"],"D",1,"lc","神经与精神","精神分裂症偏执型（妄想型）特点：起病年龄较晚、多在青壮年后期，起病多缓慢隐袭，以关系妄想、被害妄想、夸大妄想等较系统的妄想为核心，并常伴与妄想内容相关的幻觉（尤以幻听多见），情感与行为相对保留，人格衰退出现较晚较轻，治疗效果与预后在各型中相对较好。故“幻觉少见”不正确；幻觉少见且衰退早者为单纯型与青春型。\n\n📚 出处：《精神病学》第8版·精神分裂症·临床类型"],["男性，11 岁，右肱骨中段斜形骨折后，曾行手法复位及小夹板外固定。下列并发症中哪项最易发生",["神经损伤及肱动脉损伤","骨折延迟愈合","桡神经损伤及前臂缺血性肌挛缩","肱骨远侧端缺血性骨坏死","骨质疏松症"],"C",1,"lc","运动与骨外科","肱骨中段斜形骨折位于桡神经沟处，骨折时桡神经最易受损，出现垂腕、伸指伸拇障碍及虎口区感觉减退；同时小夹板固定于上臂过紧或前臂肿胀可致前臂骨筋膜室压力升高，引起缺血性肌挛缩（Volkmann）。两者均为该骨折的典型并发症，故C最易发生。肱动脉损伤在髁上骨折更多见；肱骨远端有丰富血供，缺血性骨坏死罕见；骨质疏松与本病无关。\n\n📚 出处：《外科学》第9版·上肢骨关节损伤·肱骨干骨折"],["关于 MRU，下述哪项是错误的",["无需造影剂和插管而显示肾盏、肾盂、输尿管的形态和结构","是了解上尿路梗阻的无创检查","可以显示含尿液的尿路结构，其图像如同排泄性尿路造影","有起搏器或金属支架的病人可检查","新型多排螺旋 CT 尿路成像(CTU)可与其媲美"],"D",1,"lc","临床综合","MRU利用重T2加权使静止或缓慢流动的尿液呈高信号，无需造影剂与插管即可显示肾盏、肾盂、输尿管，图像类似排泄性尿路造影，是评价上尿路梗阻的无创手段，与多排螺旋CTU互为补充，故A、B、C、E均正确。MRU属磁共振检查，体内有心脏起搏器、铁磁性金属支架者因强磁场与射频致热属禁忌，故D的说法错误，为答案。\n\n📚 出处：《医学影像学》第8版·泌尿系统影像诊断"],["患者，男，20 岁。跌伤后枕部着地，伤后有意识障碍约一刻钟，清醒后出现头昏并呕吐多次，有逆行性遗忘。应诊断为",["脑震荡","脑挫伤","原发性脑干损伤","硬膜外血肿","继发性脑干损伤"],"A",1,"lc","神经与精神","脑震荡是轻型弥漫性轴索及脑干功能短暂障碍：伤后立即出现短暂意识丧失（数秒至数分钟，一般不超过 30 分钟）、近事遗忘（逆行性及顺行性遗忘），可有头痛、头晕、恶心呕吐、乏力、失眠等自主神经症状，神经系统检查无阳性体征，腰穿脑脊液正常，CT 无异常。本例意识障碍约 15 分钟、清醒后头昏呕吐并有逆行性遗忘，符合脑震荡。脑挫伤意识障碍长且多有局灶体征与 CT 异常；原发性脑干损伤为持续深昏迷伴去脑强直；硬膜外血肿有中间清醒期后再昏迷。\n\n📚 出处：《外科学》第9版·颅脑损伤·脑震荡"],["新生儿易患呼吸道、胃肠道感染是因为",["IgE 含量最少","IgA 合成不足","IgG 半衰期短","IgD 未发育成熟","IgM 不能通过胎盘"],"B",1,"lc","儿科","分泌型IgA是呼吸道、消化道黏膜局部免疫的主要抗体，新生儿及婴儿黏膜IgA合成不足、且母体IgA不能通过胎盘，故易患呼吸道及胃肠道感染，B正确。IgE与I型超敏反应相关；IgG可通过胎盘提供被动免疫，其半衰期并不短（约21天）；IgD功能尚不明确；IgM不能通过胎盘故新生儿易患革兰阴性菌败血症，但与黏膜感染关系不如IgA直接。\n\n📚 出处：《儿科学》第9版·小儿免疫特点"],["Mustarde 四瓣法主要用于",["内眦赘皮矫正","虎口蹼状瘢痕挛缩矫正","腋窝蹼状瘢痕挛缩矫正","趾蹼蹼状瘢痕挛缩矫正","面部直线瘢痕矫正"],"A",1,"lc","临床综合","Mustardé四瓣法由四个三角皮瓣交错换位，能显著延长局部纵轴、松解垂直于睑缘的蹼状挛缩，主要用于内眦赘皮矫正（尤其伴内眦间距增宽者），使内眦角充分显露，故选A。虎口、腋窝、趾蹼的蹼状瘢痕多采用Z成形或五瓣术；面部直线瘢痕以Z、W改形为主，四瓣法不适用。术后需防止皮瓣尖端坏死与瘢痕挛缩。\n\n📚 出处：《外科学》第9版·整形外科与组织移植"],["银屑病皮损不好发于",["颜面","头皮","四肢伸侧","肘膝伸侧","腰骶部"],"A",1,"lc","皮肤性病","银屑病好发于受 /分（120～160 次/分）正常；C 脊髓末端约平第 3、4 腰椎下缘，故腰穿取第 4～5 腰椎间隙；E 生后 10 日内血钾偏高、尿量少，一般不需补钾，正确。\n\n📚 出处：《儿科学》第9版·新生儿总论"],["28 岁初产妇，破膜后宫缩过强，不久突然出现烦躁不安、呛咳、呼吸困难、发绀，并出现休克。此时抢救原则不包括",["加压给氧，准备气管插管","静注地塞米松 40mg","静脉补充血容量","静注阿托品 1mg","子宫切除术"],"E",1,"lc","呼吸系统","破膜后宫缩过强、突发烦躁、呛咳、呼吸困难、发绀伴休克，为羊水栓塞的典型表现，抢救原则包括加压给氧并准备气管插管、大剂量糖皮质激素（地塞米松40mg静注）抗过敏抗休克、补充血容量与血管活性药物、解痉（阿托品、氨茶碱）、纠正凝血功能障碍。子宫切除术不是抢救措施，仅在无法控制的产后出血等特定情况下考虑，故E属“不包括”。\n\n📚 出处：《妇产科学》第9版·分娩期并发症·羊水栓塞"],["下列与平衡功能无关的是",["躯体感觉系统","自主神经系统","肌力","肌张力","前庭系统"],"B",1,"lc","临床综合","平衡的维持依赖感觉输入（躯体感觉、视觉、前庭）、中枢整合与运动输出（肌力、肌张力、关节活动度、协调性），故A、C、D、E均与平衡有关。自主神经系统主要调节内脏、血管与腺体活动，不直接参与姿势控制与平衡调节，故选B。老年平衡障碍评估常从感觉、运动、中枢三方面查找原因。\n\n📚 出处：《康复医学》第6版·平衡与协调功能评定"],["慢性脓胸的治疗原则是",["应用广谱抗生素","胸膜腔闭式引流","消除致病原因和脓腔","胸膜纤维板剥除手术","彻底排净脓液，使肺早日复张"],"C",1,"lc","呼吸系统","慢性脓胸的治疗原则是消除病因与脓腔：处理支气管胸膜瘘、异物、结核病灶等原发病因，同时经手术（胸膜纤维板剥脱、胸廓成形、肌瓣填塞等）消灭残腔，使肺复张，故C最全面。应用广谱抗生素只是辅助；闭式引流多用于急性脓胸；胸膜纤维板剥除术只是消除脓腔的具体术式之一；彻底排脓使肺复张属急性脓胸的处理原则。\n\n📚 出处：《外科学》第9版·脓胸·慢性脓胸"],["过渡乳是指",["产后 10 个月以后的乳汁","产后 6～10 天以内的乳汁","产后 4 天以内的乳汁","产后 11 天～9 个月的乳汁","产后 11 个月以后的乳汁"],"B",1,"lc","临床综合","按分泌时间划分：产后4～5日内为初乳，6～10天为过渡乳，11天至9个月为成熟乳，10个月以后为晚乳，故选B。C指初乳，D指成熟乳，A、E的时间界定错误。过渡乳是初乳向成熟乳的过渡阶段，脂肪含量逐渐增高，蛋白质与免疫球蛋白相对下降，乳量明显增多。\n\n📚 出处：《儿科学》第9版·婴儿喂养"],["女患者，57 岁，阴道排液及腹痛 2 月余。妇检：子宫触诊不满意，盆腔内可触及巨大包块，偏左侧，界不清。B 超：子宫后方囊实性包块。送检左侧附件，大体可见：灰粉结节状肿物，大小 7.8cm×6cm×5cm，切面囊实性，囊直径 1.4～4.5cm，内容灰红糟脆物，一侧附少许管样组织，长 0.8cm，直径 0.6cm，与实性区关系紧密。此例应诊断为",["内胚窦瘤","黄体瘤","脂质细胞瘤","透明细胞癌","卵黄囊瘤"],"D",1,"lc","妇产科","57岁、阴道排液伴腹痛、盆腔巨大囊实性包块（囊内含灰红糟脆物），需考虑卵巢上皮性恶性肿瘤。透明细胞癌多为单侧、囊实性，囊内含黏液或透明液体，实性区质脆，镜下见透明细胞（鞋钉样细胞）与管囊状结构，常伴子宫内膜异位症背景，符合本例形态。卵黄囊瘤（内胚窦瘤）多见于年轻女性、血AFP显著升高；黄体瘤、脂质细胞瘤多为实性良性或低度恶性。\n\n📚 出处：《病理学》第9版·女性生殖系统疾病"],["有关血管性痴呆（VD）的治疗，以下哪项不对",["对 VD 危险因素的预防和治疗可减少 VD 的发病率","目前还没有治疗 VD 的特效药物","既往有 TIA 或非出血性疾病致卒中史者，可使用小剂量阿司匹林","抗精神病药物的使用一般不应少于 1 年","首先要控制血压和其他危险因素"],"D",1,"lc","神经与精神","血管性痴呆（VD）治疗原则：首先控制血压及糖尿病、高脂血症、房颤、吸烟等危险因素，预防卒中发生与复发；抗血小板治疗，既往有 TIA 或缺血性卒中史者可长期服小剂量阿司匹林；改善脑循环与代谢、认知训练；目前尚无逆转 VD 的特效药，胆碱酯酶抑制剂等主要借鉴 AD 证据。而抗精神病药仅在伴明显精神行为症状时短期、小剂量、个体化使用，症状缓解后逐步减量停药，绝不应“常规使用不少于 1 年”，否则增加锥体外系反应、脑血管事件与死亡率。\n\n📚 出处：《精神病学》第8版·脑器质性精神障碍·血管性痴呆"],["门静脉高压症时受影响最早的侧支血管为",["脐静脉","胃冠状静脉","直肠上静脉","腹膜后静脉","腹壁上静脉"],"B",1,"lc","消化系统","门脉高压时，胃冠状静脉（胃左静脉）经胃底食管下段静脉丛与奇静脉相通，该交通支距门脉主干最近、位置表浅，故最先、最重受累，形成食管胃底静脉曲张，破裂可致致命性大出血，因此最有临床意义，选B。脐静脉、直肠上静脉（痔）、前腹壁静脉（脐周静脉曲张）、腹膜后静脉均受累较晚或出血风险较低。\n\n📚 出处：《外科学》第9版·门静脉高压症·侧支循环"],["诊断缺铁性贫血第二阶段的特征性指标是",["血清铁蛋白降低","红细胞游离原卟啉增高","血清铁减少","血清总铁结合力增高","以上都不是"],"B",1,"lc","血液系统","缺铁第二期（红细胞生成缺铁期）的特点：贮存铁耗竭、血清铁蛋白显著降低、骨髓铁消失，血清铁下降而总铁结合力升高，红细胞形态尚正常；因铁供应不足，原卟啉无法与铁结合成血红素，红细胞游离原卟啉（FEP）升高，为该期特征性指标。小细胞低色素与红细胞减少属第三期改变。\n\n📚 出处：《内科学》第9版·缺铁性贫血"],["一个 60kg 体重的成人，二度烧伤总面积为 60%，伤后第一个 8 小时所需晶、胶体量是",["2000ml","2700ml","3000ml","3400ml","5400ml"],"B",1,"lc","外科总论与麻醉","按国内通用公式，第一个24小时晶、胶体液量＝Ⅱ、Ⅲ度烧伤面积×体重×1.5ml＝60×60×1.5＝5400ml，另加基础水分2000ml；前8小时输入晶胶体总量的一半，即5400÷2＝2700ml，故B正确。E的5400ml是全天晶胶体总量，C、D、A均与公式计算结果不符。\n\n📚 出处：《外科学》第9版·烧伤"],["下列哪种情况为使用洋地黄的禁忌证",["扩张型心肌病","肥厚梗阻型心肌病","缺血性心肌病","急性心肌炎","风湿性心脏病"],"B",1,"lc","心血管系统","肥厚型梗阻性心肌病患者洋地黄增强心肌收缩力，使收缩期流出道压差增大、梗阻与二尖瓣前叶SAM现象加重，血流动力学恶化，属禁忌（合并房颤时应用β受体阻滞剂或维拉帕米控制心率）。扩张型心肌病、缺血性心肌病及风心病伴快速房颤心衰均为洋地黄适应证；急性心肌炎对洋地黄敏感应减量慎用而非绝对禁忌。故选B。\n\n📚 出处：《内科学》第9版·心肌病·肥厚型心肌病"],["下列哪项是颅裂手术的最关键步骤",["皮肤切口设计","颅骨缺损修补","严密修补硬脑膜","修复膨出处外观","还纳膨出部脑组织"],"C",1,"lc","神经与精神","颅裂（脑膜膨出、脑膜脑膨出）手术的关键是重建硬脑膜的完整性：术中游离囊颈、还纳或切除膨出的脑组织与脑膜，严密缝合修补硬脑膜，形成牢固的脑脊液屏障，防止术后脑脊液漏、颅内感染及假性囊肿复发。皮肤切口设计、颅骨缺损修补（婴幼儿可留待后期）、外观修复与还纳脑组织均属手术内容，但都以硬脑膜严密修补为前提，修补不严则手术失败。\n\n📚 出处：《外科学》第9版·颅裂与脊柱裂·颅裂"],["法洛四联症血流动力学改变及分流量大小，主要取决于",["主动脉骑跨程度","室间隔缺损的大小","右心室肥厚程度","肺动脉狭窄程度","室间隔缺损的部位"],"D",1,"lc","儿科","法洛四联症的血流动力学改变及右向左分流量大小主要取决于肺动脉狭窄的程度：狭窄越重，右心室流出阻力越大，右室压越高，右向左分流越多，青紫越明显；狭窄轻者则分流少、青紫轻，甚至呈左向右分流。故D正确。主动脉骑跨程度、室缺大小和部位、右心室肥厚程度虽参与，但非决定分流量大小的主要因素。\n\n📚 出处：《儿科学》第9版·法洛四联症"],["下列哪项与血性白带无关",["宫颈癌","安放宫内节育器","子宫内膜癌","宫颈息肉","卵巢癌"],"E",1,"lc","血液系统","血性白带需考虑生殖道出血性疾病：宫颈癌（接触性出血最常见）、子宫内膜癌、宫颈息肉、重度宫颈炎、子宫黏膜下肌瘤、宫内节育器刺激等。卵巢癌位于盆腔，主要表现为腹胀、腹部包块、腹水及胃肠道症状，一般不出现血性白带。故与血性白带无关者为卵巢癌。\n\n📚 出处：《妇产科学》第9版·子宫颈肿瘤"],["下列哪项不是产褥期中暑的处理原则",["应用清热解毒药物","补充水分及氯化钠","及时纠正酸中毒和休克","迅速降温","立即改变高温和不通气环境"],"A",1,"lc","理化与中毒","产褥期中暑的处理原则是：立即将产妇移至通风阴凉处、解开衣物、迅速改变高温不通风环境（E），迅速物理降温（D，冰袋、温水擦浴、风扇，必要时药物降温），补充水分及氯化钠纠正脱水（B），及时纠正酸中毒和休克，防治脑水肿、心衰等并发症（C）。应用清热解毒药物属中医辨证用药，不是教材所列的处理原则，急性期更强调物理降温与液体复苏，故不属处理原则的是 A。\n\n📚 出处：《妇产科学》第9版·产褥期疾病"],["关于新生儿神经系统反射，下列哪项不正确",["觅食反射","吸吮反射","克氏征阳性","拥抱反射","腹壁反射稳定"],"E",1,"lc","儿科","新生儿已具备觅食反射、吸吮反射、拥抱反射、握持反射，且因锥体束未髓鞘化，克氏征、巴氏征可呈阳性，故A、B、C、D均属新生儿期正常神经反射表现。腹壁反射需锥体束及脊髓反射弧成熟，在新生儿期不稳定或引不出，1岁左右才逐渐稳定，故E不正确，为答案。\n\n📚 出处：《儿科学》第9版·新生儿神经系统特点"],["动脉导管未闭的左向右分流，超声表现的特征是",["主动脉向降主动脉的收缩期分流","降主动脉向肺动脉的收缩期分流","主动脉向肺动脉的双期分流，舒张期明显小于收缩期","降主动脉向肺动脉的双期分流","肺动脉向降主动脉的舒张期分流"],"D",1,"lc","医学影像与检验","动脉导管位于降主动脉与左肺动脉根部之间。由于主动脉收缩压与舒张压均高于肺动脉，导管内血流在整个心动周期持续自左向右分流，故呈连续性（双期）分流，且收缩期压差大、流速高，舒张期压差减小、流速降低，多普勒显示为双期双向湍流的连续频谱，峰值在收缩期。分流方向是主动脉（降主动脉）向肺动脉，故 D 正确。A 只提收缩期、C 称舒张期明显小于收缩期且方向表述含混、E 方向相反、B 时期描述不全。\n\n📚 出处：《超声医学》第6版·先天性心脏病"],["慢性肾衰竭水负荷过多所致的心衰，最有效的治疗措施是",["大剂量速尿","饱和量洋地黄药物","低盐饮食和控制水分","血液透析","立即给予硝普钠"],"D",1,"lc","心血管系统","慢性肾衰竭心衰的核心机制是水钠潴留、容量负荷过重，且洋地黄在肾功能不全时排泄减慢、易蓄积中毒且疗效差，袢利尿剂常因残余肾功能差而抵抗。血液透析（单纯超滤）可迅速清除水钠与尿毒症毒素、纠正酸中毒与电解质紊乱，是此类心衰最有效的治疗。故选D。\n\n📚 出处：《内科学》第9版·慢性肾衰竭·血液净化治疗"],["Ⅰ级脑膜瘤不包括",["乳头型","内皮型","纤维型","砂粒型","微囊型"],"A",1,"lc","神经与精神","按 WHO 中枢神经系统肿瘤分类，脑膜瘤分三级：Ⅰ级（良性）包括脑膜内皮型（合体细胞型）、纤维型（成纤维细胞型）、过渡型（混合型）、砂粒型、血管瘤型、微囊型、分泌型、化生型；Ⅱ级（非典型）包括非典型脑膜瘤、透明细胞型、脊索样型；Ⅲ级（间变性）包括间变性（恶性）脑膜瘤与乳头型脑膜瘤。乳头型因复发率与死亡率高属Ⅲ级，故不属于Ⅰ级脑膜瘤。\n\n📚 出处：《病理学》第9版·神经系统疾病·中枢神经系统肿瘤"],["下列哪项不能用妊娠时心血管系统变化解释",["心尖及肺动脉瓣区可闻及柔和收缩期吹风性杂音","心浊音界稍向左扩大","下肢浮肿，卧床休息后不消退","心率稍增快而有心悸感","上楼时呼吸增快，气促"],"C",1,"lc","妇产科","妊娠期血容量增加、心脏移位及激素作用，可出现心率增快（10～15次/分）、心浊音界稍向左扩大、心尖及肺动脉瓣区Ⅰ～Ⅱ级柔和收缩期杂音、上楼气促等生理性改变。而下肢水肿若为妊娠生理性，多经卧床休息后消退；休息后不消退、尤伴气促者提示心功能不全或低蛋白、静脉受压等病理情况，不能用正常心血管变化解释，故选C。\n\n📚 出处：《妇产科学》第9版·妊娠合并心脏病"],["手术后硬脊膜外腔给药适用于胸、腹部及下肢手术后疼痛的控制，以下说法错误的是",["不影响神智和病情观察，镇痛完善，可做到对运动和其他感觉功能影响较小","手术后 T3～T5 硬膜外腔镇痛，可改善冠状动脉血流量/率，有利于纠正心肌缺血","腹部手术后硬膜外腔镇痛可改善肠道血流，但可麻痹肠道不利肠功能恢复","术后下肢硬膜外腔镇痛，深静脉血栓的发生率较低","在下腹部和下肢手术，硬膜外腔镇痛几乎可以完全阻断手术创伤引起的强烈应激反应"],"C",1,"lc","外科总论与麻醉","硬膜外术后镇痛不影响意识、便于病情观察，镇痛完善而对运动与本体感觉影响小（A对）；胸部T3～T5阻滞可扩张冠状动脉、改善心肌供血（B对）；腹部手术后硬膜外镇痛通过阻断交感、改善肠壁血流并抑制应激反应，可缩短肠麻痹、促进肠功能恢复，而非“麻痹肠道”（C错）；下肢镇痛可降低深静脉血栓发生率（D对）；亦可有效抑制手术应激（E对）。\n\n📚 出处：《临床麻醉学》第4版·术后镇痛"],["伸直型肱骨髁上骨折常见的并发症是",["骨折局部感染","血管神经损伤","肱骨下端缺血性坏死","脂肪栓塞","肱二头肌断裂"],"B",1,"lc","运动与骨外科","伸直型肱骨髁上骨折的远端向后上方移位，骨折近端向前下可刺伤或压迫肱动脉与正中神经（亦可伤及桡神经），是血管神经损伤发生率最高的肘部骨折，并因此继发前臂骨筋膜室高压与缺血性肌挛缩、肘内翻畸形。开放性骨折合并感染、脂肪栓塞、肱二头肌断裂均少见；肱骨下端血供丰富，缺血性骨坏死罕见（多见于肱骨外科颈骨折合并肱骨头坏死）。\n\n📚 出处：《外科学》第9版·上肢骨关节损伤·肱骨髁上骨折"],["正常情况下，SaO2 与 PaO2 存在相关性，如 SaO2＜90%时，PaO2 常低于多少",["80mmHg","70mmHg","60mmHg","50mmHg","40mmHg"],"C",1,"lc","临床综合","氧解离曲线呈S形，PaO2 60mmHg时SaO2约90%，为曲线陡段的起点，故SaO2<90%提示PaO2已低于60mmHg，选C。PaO2 70～80mmHg时SaO2约94%～96%，尚未低于90%；PaO2 50mmHg、40mmHg时SaO2分别约85%、75%以下。临床以PaO2<60mmHg作为呼吸衰竭的诊断界值，正基于此曲线特点。\n\n📚 出处：《生理学》第9版·呼吸（氧的运输）"],["CT 机的存储器不包括",["硬磁盘","磁带","软盘","光盘","阵列处理器"],"E",1,"lc","神经与精神","CT 机存储器用于存放原始数据、重建图像与病历资料，包括硬磁盘、软盘、磁带、光盘及磁光盘等。阵列处理器是完成大量重复性运算（如卷积反投影重建）的并行高速运算部件，属运算部件而非存储介质，故不属于存储器。\n\n📚 出处：《医学影像学》第8版·X线计算机体层成像·CT基本结构"],["眼睑缺损不超过眼睑全长的多少时可直接缝合而不发生变形和功能障碍",["1/2","1/3","1/4","1/5","1/6"],"C",1,"lc","外科总论与麻醉","本题与lc220同题。眼睑缺损在睑全长1/4以内时创缘对合张力小，可直接缝合而不发生睑裂变形和闭合功能障碍，故C正确。超过1/4（1/3、1/2）直接缝合张力过大，将导致睑缘切迹、睑裂缩小、睑外翻或闭合不全、角膜暴露，须采用滑行皮瓣、睑板替代或游离植皮修复。\n\n📚 出处：《眼科学》第9版·眼睑病"],["可呈“哑铃状”生长的纵隔肿瘤是",["胸腺瘤","气管囊肿","心包囊肿","神经源肿瘤","淋巴瘤"],"D",1,"lc","基础与预防医学","神经源性肿瘤多起源于脊神经根或交感神经链，位于后纵隔脊柱旁沟，部分肿瘤经椎间孔同时向椎管内外生长，形成两端大、中间细的哑铃状（沙漏状），故 D 正确。A 胸腺瘤位于前纵隔；B 气管囊肿、C 心包囊肿位于中纵隔，呈囊性球形，随体位或呼吸变形；E 淋巴瘤多位于前、中纵隔，呈分叶状巨大团块，均不呈哑铃状生长。\n\n📚 出处：《外科学》第9版·纵隔肿瘤"],["关于腘窝瘢痕挛缩畸形采用瘢痕切除游离植皮法治疗，下述错误的是",["瘢痕切除后，充分松解创缘四周粘连，深部瘢痕也应完全切除，直到出现脂肪颗粒或深筋膜","切除瘢痕时，应注意不可伤及腓总神经及腘窝内的血管与神经","腘窝上下应为横行切口，两侧可作成锯齿形的辅助切口，并应超过正侧线","创面可用中厚游离植皮修复","植皮后下肢须用石膏托固定，3 个月后开始下床活动"],"E",1,"lc","运动与骨外科","腘窝瘢痕挛缩切除游离植皮后，下肢须用石膏托制动于伸直位以利皮片成活，一般固定2～3周、皮片成活稳定后开始逐步下床活动并配合功能锻炼；“3个月后开始下床活动”期过长，将造成关节僵硬、肌肉萎缩，是错误的。其余各项均正确：须彻底切除深部瘢痕至正常脂肪或深筋膜、避免损伤腓总神经与腘窝血管神经、切口横行为主并加锯齿状辅助切口且超过正侧线以防直线挛缩。\n\n📚 出处：《外科学》第9版·瘢痕挛缩畸形·腘窝瘢痕挛缩"],["关于气管内插管，下列叙述错误的是",["对冠状动脉硬化病人、瓣膜疾病或颅内压增高病人，宜预先用药物处理以减轻置喉镜时的反应","置入喉镜行气管内插管或套囊充气时可能并发一过性的高血压","插管反应对正常循环功能的病人影响轻微，不应为减轻此反应而加深麻醉","为减轻插管时的应激反应，在插管前可静注利多卡因或扩血管药","用直喉镜片插管比弯喉镜片引起的插管应激反应轻"],"E",1,"lc","呼吸系统","直喉镜片需将会厌直接挑起才能显露声门，机械刺激强、迷走与交感反射更明显，插管时血压心率升高的应激反应比弯喉镜片更重，故E错误。对冠心病、瓣膜病、颅内压增高者应预先给芬太尼、利多卡因或血管扩张药以减轻置镜反应（A、D对）；插管与套囊充气确可引起一过性血压升高与心率增快（B对）；对循环功能正常者此类反应影响轻微，无需为此一味加深麻醉（C对）。\n\n📚 出处：《临床麻醉学》·气道管理·气管内插管"],["法洛四联症的血流动力学改变主要是",["左心室收缩期负荷过重","右心室收缩期负荷过重","左心室舒张期负荷过重","右心室舒张期负荷过重","肺动脉负荷过重"],"B",1,"lc","儿科","法洛四联症中肺动脉狭窄使右心室射血阻力增大，右心室压力负荷（收缩期负荷）明显增加，导致右心室肥厚，故B正确。左心室收缩期负荷过重见于主动脉瓣狭窄、高血压；左心室舒张期负荷过重见于室缺、动脉导管未闭、二尖瓣反流；右心室舒张期负荷过重见于房缺、三尖瓣反流。法洛四联症肺血减少，右室容量负荷并不增加。\n\n📚 出处：《儿科学》第9版·法洛四联症"],["患者，男性，28 岁。脾切除术后第 10 日，高热，左上腹疼痛，3 日后出现胸痛。胸片示左侧膈肌抬高，胸穿抽出黄色混浊液体，血培养(-)。发生左侧胸腔积液的原因是",["反应性积液","手术时损伤膈肌污染胸腔引起脓胸","膈下感染经膈肌淋巴管致脓胸","细菌经血运到左胸腔引起脓胸","细菌经血运到左肺，形成肺脓肿破溃形成脓胸"],"C",1,"lc","呼吸系统","脾切除术后第10日高热、左上腹痛，3日后胸痛、左侧膈肌抬高、胸穿抽出黄色混浊脓液而血培养阴性，提示膈下已形成脓肿，脓液经淋巴管引流（或直接穿破膈肌）进入胸膜腔形成脓胸，故选C。若为术中损伤膈肌污染胸腔，症状应在术后早期即出现，不会延迟至第10日；反应性胸腔积液为漏出液、清亮而非黄色混浊脓液；血行播散致脓胸者血培养多为阳性，且多无明确膈下感染来源；血行入肺形成肺脓肿再破溃者胸片应见肺内空洞或实变，而非单纯胸腔积液。原库答案B证据不足，应改为C。\n\n📚 出处：《外科学》第9版·脓胸·急性脓胸"],["矫正马蹄内翻足，用连续石膏矫形法常能获得成功，但应先矫正下列哪种畸形",["跟腱挛缩","后足内翻","踝关节跖展","胫骨内旋","前足内收"],"E",1,"lc","儿科","Ponseti连续石膏矫形按“先柔软后僵硬”的顺序：先矫正高弓，再矫正前足内收，然后矫正后足内翻，最后才处理踝关节跖屈（跟腱挛缩），故应首先矫正前足内收，选E。跟腱挛缩常在系列石膏后期经皮跟腱切断解决；后足内翻前足内收之后矫正；胫骨内旋多随足部矫正而改善。\n\n📚 出处：《外科学》第9版·先天性马蹄内翻足"],["斑贴试验的实质是",["Ⅰ型变态反应","刺激过敏反应","Ⅳ型变态反应","细胞毒反应","Ⅲ型变态反应"],"C",1,"lc","皮肤性病","斑贴试验是检测接触性皮炎的经典方法，其实质为Ⅳ型（迟发型）变态反应：变应原贴敷皮肤后经朗格汉斯细胞摄取提呈给已致敏的T淋巴细胞，48～72小时后局部出现红斑、丘疹、水疱，属T细胞介导的细胞免疫。Ⅰ型为IgE介导的速发型（荨麻疹、过敏性休克），Ⅱ型为细胞毒反应，Ⅲ型为免疫复合物型，机制均与斑贴试验不同。\n\n📚 出处：《皮肤性病学》第9版·变应原检测"],["有关支气管扩张的临床表现，下述错误的是",["咯血可以是惟一的主诉","臭味脓痰","反复发热","慢性间歇性咳嗽","大咯血比较常见"],"E",1,"lc","呼吸系统","支气管扩张的典型表现是慢性咳嗽、咳大量脓痰（厌氧菌感染时痰臭）、反复咯血与反复肺部感染发热；“干性支气管扩张”以咯血为唯一主诉，故A、B、C、D均正确。支扩咯血多为痰中带血或中少量，大咯血虽可发生但不常见（不足10%），故E“大咯血比较常见”错误，为本题答案。\n\n📚 出处：《内科学》第9版·支气管扩张症"],["属于常染色体显性遗传的肿瘤综合征是",["Bloom综合征","着色性干皮病","Fanconi贫血","神经纤维瘤病Ⅰ型","毛细血管扩张性共济失调症"],"D",1,"lc","基础与预防医学","神经纤维瘤病Ⅰ型为常染色体显性遗传的肿瘤综合征，NF1 基因（17q11.2）杂合失活后易发生神经纤维瘤、视神经胶质瘤等，故 D 正确。A Bloom 综合征、C Fanconi 贫血、E 毛细血管扩张性共济失调症均为常染色体隐性遗传的染色体不稳定综合征；B 着色性干皮病为常染色体隐性遗传的 DNA 修复缺陷病，易患皮肤癌但不属显性遗传。\n\n📚 出处：《医学遗传学》第7版·肿瘤遗传"],["关于金黄色葡萄球菌的描述，下列正确的是",["革兰染色阴性","能产生凝固酶","不发酵甘露醇","培养需要特殊培养基","血液为主要带菌部位"],"B",1,"lc","临床综合","金黄色葡萄球菌为革兰阳性球菌，故A错；能产生血 囊癌","大肠癌","肝癌"],"C",1,"lc","基础与预防医学","亚硝胺类化合物是强化学致癌物，其前体（硝酸盐、亚硝酸盐与二级胺）可在胃内合成，与食管癌、胃癌、肝癌及大肠癌的发生关系较为明确，而胆囊癌与之关系不密切，其发生主要与胆囊结石、慢性胆囊炎长期刺激及胆汁淤积有关，故 C 为答案。A、B、D、E 均有较明确的亚硝胺相关流行病学与实验证据。\n\n📚 出处：《病理学》第9版·肿瘤的病因学（化学致癌因素）"],["有关类风湿关节炎和强直性脊柱炎的区别，下列哪项是正确的",["在我国，类风湿关节炎患病率远大于强直性脊柱炎","强直性脊柱炎是中心型类风湿关节炎","强直性脊柱炎和类风湿关节炎男女患病比例相似","强直性脊柱炎和类风湿关节炎基本病理改变均为滑膜炎症","类风湿关节炎和强直性脊柱炎均为全身性疾病"],"E",1,"lc","运动与骨外科","类风湿关节炎与强直性脊柱炎均属系统性自身免疫性炎症疾病，可累及关节外多个系统（RA可有肺间质病变、血管炎、结节；AS可有虹膜炎、主动脉根部病变、骨质疏松），故二者均为全身性疾病，此说法正确。AS并非“中心型类风湿关节炎”，而是独立疾病；AS基本病理为附着点炎（肌腱韧带骨附着处炎症）继发骨化，RA为滑膜炎；AS男性明显多于女性（约2～3∶1），RA女性多见；我国二者患病率相近（约0.3%），RA并不“远大于”AS。\n\n📚 出处：《内科学》第9版·强直性脊柱炎·与类风湿关节炎的鉴别"],["皮肤猪囊虫病确诊靠",["CT","B 超","活检","血常规","MRI"],"C",1,"lc","皮肤性病","皮肤猪囊虫病由猪肉绦虫囊尾蚴寄生于皮下组织、肌肉引起，表现为皮下结节。确诊依靠取结节活检：病理见囊腔内囊尾蚴头节、石灰小体及周围纤维组织增生、嗜酸性粒细胞浸润。CT、MRI（A、E）有助于发现脑与肌肉病变但特异性不足；B超（B）仅显示囊性结构；血常规（D）无特异性，仅嗜酸性粒细胞可轻度升高。\n\n📚 出处：《皮肤性病学》第9版·皮肤猪囊虫病"],["下列关于腺性唇炎的说法，错误的是",["是一种主要累及唇部小涎腺的炎症性疾病","可能与日光照射、吸烟、感染、过敏有关","主要表现为唇部黏膜增厚、外翻并伴有唇部黏液腺体增生","肿大的腺体多出现脓性分泌物","组织病理表现为非特异性腺体增生、肿大、导管扩大与炎性细胞浸润"],"D",1,"lc","临床综合","腺性唇炎是主要累及唇部小涎腺的炎症性疾病，可能与日光、吸烟、感染、过敏等有关；病理示腺体增生肿大、导管扩张与炎性细胞浸润；临床见唇黏膜增厚外翻、唇红缘散在针头大小红点（腺管开口），挤压时溢出透明黏液，仅在继发感染时才呈脓性，故“多出现脓性分泌物”错误，选D。A、B、C、E与教材描述一致。\n\n📚 出处：《口腔颌面外科学》第8版·唇炎"],["肺灌注显像时不正确的说法是",["吸氧，最好吸至静脉注射显像剂完毕","常规采取直立体位注射","注射时要尽量避免回血","显像剂含蛋白颗粒 20 万～70 万个","注射前摇匀显像剂"],"B",1,"lc","呼吸系统","肺灌注显像用99mTc-MAA颗粒，常规取仰卧位注射，使血流分布均匀、颗粒在重力依赖区分布较为一致，便于定量比较；坐位或直立位注射会使颗粒集中于肺底部、上肺几乎无分布，反而影响判读，故B错误。注射时嘱患者深呼吸并吸氧至注射完毕可减少肺血管收缩造成的假性缺损（A对）；应避免回血以防颗粒在注射器内聚集形成“热栓”（C对）；每次注射颗粒数20万～70万个（D对）；注射前需摇匀以防颗粒聚集成团（E对）。\n\n📚 出处：《核医学》·呼吸系统·肺灌注显像"],["男性，30 岁，临床表现为反复发作性肉眼血尿，在劳累及感染后加重。发作时伴有肌肉痛，无高血压及肾功能减退。可考虑的诊断是",["急性肾小球肾炎","慢性肾小球肾炎","肾病综合征","尿路感染","隐匿性肾炎"],"E",1,"lc","心血管系统","患者反复发作性肉眼血尿，劳累与感染后加重，发作时伴肌肉痛（符合IgA肾病/运动后血尿特点），无高血压、无水肿、无肾功能减退，属无症状性血尿，即隐匿性肾炎。急性与慢性肾炎伴蛋白尿、高血压或肾功能损害，肾病综合征有大量蛋白尿与低白蛋白血症，尿路感染有尿路刺激征与白细胞尿。故选E。\n\n📚 出处：《内科学》第9版·隐匿性肾小球肾炎·临床表现"],["治疗破伤风的中心环节是",["处理伤口","大量破伤风抗毒素的应用","控制痉挛","纠正水、电解质紊乱","预防并发症"],"C",1,"lc","心血管系统","破伤风患者主要死因为持续肌肉痉挛所致的喉痉挛、呼吸肌强直与呼吸衰竭，故治疗的中心环节是控制与解除肌肉痉挛（地西泮、咪达唑仑为主，必要时肌松剂加机械通气）。彻底清创（3%过氧化氢冲洗）、TAT中和游离毒素（对已结合毒素无效）、纠正水电解质紊乱与防治并发症均为重要但非中心的环节。故选C。\n\n📚 出处：《外科学》第9版·外科感染·破伤风"],["新生儿溶血病换血治疗，应如何办理实施手续",["分管医生申请，由医生和护士共同完成","分管医生申请，上级医师批准，患儿监护人同意并签字，由医院输血科和血站工作人员共同实施","医生向输血科申请，下医嘱由护士完成","医生写输血申请后，由病人家属同意后直接联系治疗","分管医生申请，由输血科独立完成"],"B",1,"lc","儿科","换血疗法属有创、高风险输血治疗，须履行完整程序：分管医生提出申请→上级医师核准→向患儿监护人充分告知风险并取得书面知情同意→由医院输血科与血站协同配血、实施。任一环节缺失均属违规。A缺上级核准与知情同意；C、E绕过监护人知情同意；D由家属直接联系治疗更是违规。\n\n📚 出处：《儿科学》第9版·新生儿溶血病·换血疗法；《临床输血技术规范》"],["去甲肾上腺素用于治疗",["支气管哮喘","神经性休克早期","高血压病","肾功能衰竭","皮肤黏膜过敏性疾病"],"B",1,"lc","泌尿系统","去甲肾上腺素主要激动α受体，强烈收缩血管、升高外周阻力与血压，适用于神经源性休克早期恢复血管张力，也用于其他类型休克升压。其收缩支气管、升血糖、减少肾血流的作用会加重哮喘、高血压与肾衰竭，也不能治疗皮肤黏膜过敏性疾病。故答B。\n\n📚 出处：《药理学》第9版·肾上腺素受体激动药"],["急性心梗早期(24 小时内)死亡的主要原因是",["心源性休克","心律失常","心脏破裂","乳头肌断裂","心衰"],"B",1,"lc","心血管系统","急性心肌梗死发病24小时内死亡的主要原因是心律失常，尤其原发性室颤，占早期死亡的一半以上，故CCU心电监护与床旁除颤是降低早期病死率的关键。心源性休克、心力衰竭多见于大面积梗死早期至数日；心脏破裂、乳头肌断裂多在发病3～7天至2周内发生。故选B。\n\n📚 出处：《内科学》第9版·冠心病·急性心肌梗死的并发症与预后"],["以下哪项是风湿热心脏炎的特点",["年龄越小者，预后越好","小儿心脏炎的发病率为 20%～40%","可同时侵犯心肌、心内膜及心包膜","以心包炎病变者为多见","心内膜炎一次受累则可造成瓣膜变形"],"C",1,"lc","心血管系统","风湿热心脏炎可同时累及心肌、心内膜（瓣膜炎）与心包膜，称“全心炎”，以心肌与心内膜受累为主。年龄越小（尤其5～15岁）心脏受累越重、预后越差；小儿心脏炎发生率高达40%～80%，远高于20%～40%；心包炎相对少见且多为渗出性；心内膜炎需反复发作才形成慢性瓣膜变形。故选C。\n\n📚 出处：《内科学》第9版·风湿热·心脏炎"],["6 岁小儿，眼睑浮肿，尿少，血尿 3 天。查：血压 20/12kPa(150/100mmHg)，尿蛋白(+)，RBC(+++)，血浆蛋白 62g/L(6.2g/dl)。下列哪项处理不正确",["卧床休息","口服强的松治疗","限制钠盐的摄入","用利尿剂","用降血压药物"],"B",1,"lc","儿科","患儿有前驱感染史、血尿、浮肿、高血压及尿蛋白(+)，诊断急性肾小球肾炎，治疗以卧床休息、限盐、利尿、降压及对症为主，糖皮质激素无指征，故B处理不正确，为答案。急性肾炎一般不使用激素，仅在呈肾病综合征表现或病理为新月体肾炎时考虑；A卧床休息、C限钠、D利尿剂、E降压药均属正确措施。\n\n📚 出处：《儿科学》第9版·急性肾小球肾炎"],["痉挛性偏瘫步态亦称",["跨阈步态","醉汉步态","慌张步态","画圈样步态","剪刀样步态"],"D",1,"lc","临床综合","痉挛性偏瘫源于一侧皮质脊髓束受损，患侧下肢伸肌张力增高呈伸直内旋位，行走时需向外划弧摆动方能迈步，即画圈样（偏瘫）步态，故选D。跨阈步态见于腓总神经麻痹的足下垂；醉汉步态见于小脑及前庭病变；慌张步态见于帕金森病；剪刀样步态见于双侧痉挛性截瘫（如脑性瘫痪），均与偏瘫痉挛模式不符。\n\n📚 出处：《神经病学》第8版·运动系统检查（步态异常）"],["运动训练的益处如下所述，但不包括",["最大摄氧量增高","运动时心率下降","劳动能力提高","最高心率增高","高密度胆固醇(HDL)增高"],"D",1,"lc","临床综合","有氧运动训练可使最大摄氧量升高、亚极量负荷时心率下降、劳动能力与耐力提高、高密度脂蛋白胆固醇升高，故A、B、C、E均属训练益处。运动训练不提高最高（最大）心率，最大心率主要由年龄决定并随增龄下降，训练只使同等负荷下心率降低，故D不属于益处，为答案。\n\n📚 出处：《康复医学》第6版·运动疗法（有氧训练）"],["最适合哺乳期妇女的避孕措施是",["紧急避孕药","短效口服避孕药","长效口服避孕药","安全期避孕","阴茎套避孕"],"E",1,"lc","妇产科","哺乳期不宜使用含雌激素的复方避孕药（可抑制泌乳、影响乳量并使婴儿摄入激素），紧急避孕药、长效口服避孕药同样不宜；安全期避孕可靠性差（哺乳期月经未复潮排卵难预测）。阴茎套避孕不影响乳汁分泌与婴儿，还能预防性传播疾病，是哺乳期最适宜的避孕方法。\n\n📚 出处：《妇产科学》第9版·避孕"],["关于咽后脓肿引起的呼吸困难，下述正确的是",["是吸气性呼吸困难，吸气期延长，吸气运动增强，呼吸频率基本不变或减慢","是呼气性呼吸困难，呼气期延长，呼气运动增强，吸气运动略增强","是混合性呼吸困难，呼气与吸气均增强","肺部检查见有充气过度的体征","以上都不对"],"A",1,"lc","呼吸系统","咽后脓肿使喉上方气道受压，形成阻塞性（吸气性）呼吸困难：吸气期延长、吸气肌过度做功，出现三凹征，呼吸频率多基本不变或反射性减慢，故A正确。呼气性呼吸困难见于支气管哮喘等下气道阻塞；混合性见广泛肺实质病变；肺充气过度体征属小气道阻塞表现，均与本例不符。\n\n📚 出处：《耳鼻咽喉头颈外科学》第9版·咽·咽后脓肿"],["女，25 岁。2 年以来和丈夫吵架或遇到不高兴的事后，即出现四肢强直和抽搐样表现。发作时能听清楚家人的呼唤但不予回答。无唇舌咬伤和大小便失禁，瞳孔无散大，对光反射存在。该患者最可能的诊断是",["癫痫","创伤后应激障碍","癔症","神经衰弱","适应性障碍"],"C",1,"lc","神经与精神","青年女性在情绪刺激后发作性四肢强直抽搐，发作时意识并非真正丧失（能听见呼唤但不回答），无摔伤、无唇舌咬伤与尿便失禁，瞳孔不散大且对光反射存在，符合分离（转换）障碍中的癔症性抽搐（心因性非癫痫性发作）。癫痫发作多有意识完全丧失、瞳孔散大、对光反射迟钝，常见舌咬伤与尿失禁，发作后意识模糊并可外伤，脑电图可记录到痫样放电。PTSD 有明确创伤事件及闪回、回避、警觉增高；神经衰弱与适应性障碍不以发作性抽搐为特点。\n\n📚 出处：《精神病学》第8版·分离（转换）障碍·临床表现"],["造成大腿假肢呈划弧步态的原因是",["假肢太长","假肢太短","接受腔太松","膝关节不稳定性","髋外展肌过强"],"A",1,"lc","运动与骨外科","大腿假肢呈划弧步态（摆动期患肢外展绕圈前行）多因假肢过长：摆动时足尖拖地，患者只能靠骨盆上提、躯干向健侧倾斜并外展髋关节绕过地面，久之形成代偿性划弧。假肢过短则表现为健侧下肢屈膝、躯干倾斜的“踏步步态”；接受腔过松可致活塞样上下移动；膝关节不稳引起打软腿或跪倒；髋外展肌过强并非常见原因。\n\n📚 出处：《康复医学》第6版·假肢·截肢者步态分析"],["女，26 岁，因停经 42 天，尿 HCG(+)，要求做人工流产。术前妇科检查：宫体后倾后屈，妊娠 6 周大小，软，附件(-)。术中测宫腔深 10cm，吸出组织 20g，未见绒毛，出血少，术毕宫腔深 9.5cm。诊断明确后最合适的处理是",["再次吸宫","再次吸宫及抗生素预防感染","宫缩剂","抗生素抗炎","后穹隆穿刺"],"B",1,"lc","妇产科","孕6周大小、宫腔深10cm、吸出20g组织但无绒毛、出血少，提示漏吸或合并异位妊娠可能。处理应立即再次吸宫清除宫内组织（同时在消毒条件下仔细探查宫腔形态），并预防性应用抗生素；术后监测血HCG下降与超声，必要时腹腔镜除外异位妊娠。仅给宫缩剂或抗炎不能去除病灶。\n\n📚 出处：《妇产科学》第9版·人工流产术并发症"],["在输卵管结扎术后，发生盆腔瘀血综合征是因为",["结扎了卵巢血管","结扎时损伤了子宫动脉而影响血液循环","手术损伤或术后粘连影响盆腔血液回流","手术时伤及了伴随的淋巴管，使淋巴液回流受阻","手术时误扎了圆韧带"],"C",1,"lc","妇产科","盆腔瘀血综合征源于盆腔静脉扩张淤血、回流受阻。输卵管结扎术中的组织创伤、术后粘连可压迫或改变盆腔静脉回流路径，导致慢性盆腔静脉淤血，出现下腹坠痛、腰骶痛、性交痛与月经量多。结扎不涉及卵巢血管、子宫动脉、淋巴管与圆韧带，故A、B、D、E均非机制。\n\n📚 出处：《妇产科学》第9版·盆腔淤血综合征"],["关于意识蒙胧状态的说法，以下哪项不正确",["意识范围狭窄","意识清晰度的下降","可有欣快、焦虑等情绪症状","可有片断幻觉、妄想及冲动行为","注意力一般不受影响"],"E",1,"lc","神经与精神","意识朦胧（朦胧状态）属意识范围缩窄的意识障碍：意识清晰度下降、意识范围狭窄，只对狭窄范围内的 后的责任由法院决定","精神障碍患者犯法后有部分法律责任"],"C",1,"lc","神经与精神","《精神卫生法》规定，精神障碍的司法鉴定由具备资质的鉴定机构与鉴定人依法定程序进行，鉴定意见作为证据提交，据此判断行为人是否具有刑事责任能力、民事行为能力及是否承担法律责任。故“一概无责任”“一概无刑事责任”“部分责任”等表述均错误；而忽略鉴定作为专业依据亦不全面。按题库表述选 C（由司法精神病学鉴定机构作专业认定）。⚠️严格从程序法看，最终认定权在法院，本题表述存在争议，请以教材及考点表述为准。\n\n📚 出处：《精神病学》第8版·精神障碍与法律问题·司法精神病学鉴定"],["AOPP 的发病机制是",["导致机体缺氧","使腺体过度分泌","与细胞色素氧化酶结合","与ChE结合形成磷酰化胆碱酯酶","导致中毒性肝炎"],"D",1,"lc","理化与中毒","有机磷杀虫药中毒的机制是抑制胆碱酯酶：有机磷分子的磷酰基与 ChE 活性中心的丝氨酸羟基结合，生成磷酰化胆碱酯酶，酶失去水解 ACh 的能力，ACh 在胆碱能神经末梢突触间隙和神经肌肉接头蓄积，引起毒蕈碱样、烟碱样及中枢神经症状，故 D 正确。C 与细胞色素氧化酶结合为氰化物中毒机制；A 导致缺氧见于 CO、亚硝酸盐中毒；B 是 ACh 蓄积的结果而非机制；E 中毒性肝炎为继发损害。\n\n📚 出处：《内科学》第9版·有机磷杀虫药中毒"],["感染性角膜溃疡一旦穿孔或即将穿孔，其最好的治疗方法是",["烧灼溃疡面","包扎患眼","药物保守治疗","治疗性角膜移植术","眼球摘除术"],"D",1,"lc","外科总论与麻醉","感染性角膜溃疡一旦穿孔或濒临穿孔，药物无法封闭缺损，房水外渗将致前房消失、眼内感染和眼球丧失，此时应行治疗性角膜移植（穿透性角膜移植），既可清除感染坏死组织又能重建眼球壁、保存眼球，故D最佳。烧灼溃疡面、单纯包扎、继续保守治疗都不能阻止穿孔；眼球摘除仅在眼球已无法保留时考虑。\n\n📚 出处：《眼科学》第9版·角膜病"],["引起 Coats 病最终失明的主要原因是",["视网膜脱离","视网膜胆固醇结晶","静脉扩张","并发性白内障","以上都不对"],"A",1,"lc","眼耳鼻喉口腔","Coats病视网膜血管大量渗漏，渗出液积聚于视网膜下形成渗出性视网膜脱离，长期脱离使光感受器不可逆变性，是最终失明的主要原因，故A正确。B视网膜胆固醇结晶是渗出物的影像表现；C静脉扩张属血管改变本身；D并发性白内障多继发于长期脱离或反复手术，为次要原因；晚期还可继发新生血管性青光眼、眼球萎缩。\n\n📚 出处：《眼科学》第9版·视网膜病·视网膜血管病"],["婴儿腹泻在脱水性质不明时，第一天静脉补液可选用",["1/2 张含钠液","1/3 张含钠液","1/4 张含钠液","2/3 张含钠液","2:1 等张含钠液"],"A",1,"lc","儿科","婴儿腹泻脱水性质不明时按等渗性脱水处理，第1天补液选用1/2张含钠液（如2:3:1液），故A正确。1/3张、1/4张适用于高渗性脱水或生理维持补充；2/3张（4:3:2液）适用于低渗性脱水；2:1等张液用于重度脱水伴休克时快速扩容（20ml/kg）。确定性质后应据血钠调整张力。\n\n📚 出处：《儿科学》第9版·小儿腹泻病液体疗法"],["免疫是指",["机体识别排除抗原性异物的功能","机体抗感染的功能","机体清除自身衰老、死亡红细胞的功能","机体对病原微生物的防御能力","机体识别排除自身突变细胞的功能"],"A",1,"lc","风湿免疫","免疫的本质是机体识别“自己”与“非己”，对自身成分形成耐受、对非己抗原性异物产生排除效应，并借此维持内环境稳定。完整表述包括免疫防御、免疫自稳、免疫监视三方面，A 概括了识别与排除抗原性异物这一核心。B、D 仅涉及免疫防御（抗感染）；C 是免疫自稳的例证；E 是免疫监视的例证，三者都只描述了免疫功能的一个侧面，不能作为免疫的定义。\n\n📚 出处：《医学免疫学》第7版·免疫学概论"],["伤口开放时，哪种检查应为禁忌",["视力检查","裂隙灯检查","超声波检查","X 线检查","CT 检查"],"C",1,"lc","临床综合","眼球穿通伤、伤口开放时禁忌超声波检查：接触式探头需压迫眼球，可使眼内容物脱出、加重感染并造成眼内结构进一步损伤，故选C。视力检查、裂隙灯检查可在不压迫眼球前提下完成；X线、CT有助于定位不透X线异物、了解眶骨与眼球完整性，属必要检查。开放伤应先包扎防护、避免加压。\n\n📚 出处：《眼科学》第9版·眼外伤"],["与类风湿关节炎相关的重要因素是",["微生物感染","IgG发生变性","隐蔽抗原释放","T细胞异常活化","异嗜性抗原存在"],"B",1,"lc","运动与骨外科","类风湿关节炎的核心免疫异常是机体对自身变性IgG产生抗体（即类风湿因子），IgG构象改变后其Fc段成为抗原，与RF结合形成免疫复合物沉积于滑膜与血管壁，激活补体引起炎症。微生物感染仅为可能的诱发因素；隐蔽抗原释放为自身免疫性甲状腺炎等机制；T细胞异常活化在RA中确实存在，但教材所强调的关键环节是IgG变性成为自身抗原；异嗜性抗原与风湿热等有关。\n\n📚 出处：《内科学》第9版·类风湿关节炎·发病机制"],["角膜结核的临床表现中最常见的是",["角膜基质炎","结核性角膜溃疡","浅层点状角膜炎","边缘性角膜炎","泡性角膜炎"],"A",1,"lc","呼吸系统","角膜结核最常见的临床类型是角膜基质炎：结核变态反应或血行感染累及角膜基质，表现为基质层弥漫性浸润水肿、外观呈毛玻璃样、可伴新生血管长入，病程迁延并易复发，为结核性角膜病变的代表。结核性角膜溃疡、浅层点状角膜炎、边缘性角膜炎、泡性角膜炎均可见于结核，但发生率明显低于基质炎，其中泡性角膜炎属结核蛋白变态反应，多见于儿童。\n\n📚 出处：《眼科学》第9版·眼的感染性疾病·角膜结核"],["为判断胎儿肾成熟度，应测孕妇的",["血中甲胎蛋白值","尿中雌三醇值","尿中孕二醇值","羊水中肌酐值","羊水中人胎盘生乳素值"],"D",1,"lc","妇产科","羊水中肌酐来源于胎儿肌肉代谢并经胎尿排出，其浓度随胎儿肾脏成熟而升高：≥176.8μmol/L（2mg/dl）提示胎儿肾脏成熟。甲胎蛋白反映神经管与消化道畸形；尿雌三醇、孕二醇、羊水人胎盘生乳素反映胎盘功能或胎儿-胎盘单位状况，不用于判断肾成熟度。\n\n📚 出处：《妇产科学》第9版·胎儿成熟度检查"],["蟾皮病是由于缺乏",["维生素A","维生素B","维生素C","维生素D","维生素E"],"A",1,"lc","临床综合","蟾皮病是维生素A缺乏的皮肤表现，以毛囊角化性丘疹（状如蟾蜍皮）、皮肤干燥粗糙、伴夜盲与眼干为特征，故选A。维生素B缺乏致口角炎、舌炎、癞皮病；维生素C缺乏致坏血病（毛囊周围出血、牙龈肿胀出血）；维生素D缺乏致佝偻病；维生素E缺乏罕见，可致溶血与神经系统症状，均不出现蟾皮样皮损。\n\n📚 出处：《皮肤性病学》第9版·维生素缺乏性皮肤病"],["急性膀胱炎的治疗，应首选的抗生素是",["氧氟沙星","利福平","头孢拉定","青霉素 V 钾","红霉素"],"A",1,"lc","泌尿系统","急性单纯性膀胱炎致病菌多为大肠埃希菌，经验治疗应选口服方便、尿中浓度高、覆盖革兰阴性杆菌的药物。氧氟沙星属氟喹诺酮类，尿药浓度高、抗菌谱覆盖肠杆菌科，为选项中最合适者。利福平、青霉素V钾、红霉素对革兰阴性杆菌作用差，头孢拉定口服后尿中浓度不及喹诺酮。故答A。\n\n📚 出处：《内科学》第9版·尿路感染（抗感染治疗）"],["下列疾病可有血清淀粉酶升高，但除外",["球后穿透性溃疡","急性腹膜炎","胆囊炎","胃角溃疡","肠梗阻"],"D",1,"lc","基础与预防医学","血清淀粉酶主要来自胰腺和唾液腺。球后穿透性溃疡（A）可穿透至胰腺使胰酶入血；急性腹膜炎（B）经腹膜吸收胰酶；胆囊炎（C）因胆石梗阻、胰胆反流致胰酶外溢；肠梗阻（E）肠腔内压升高也致淀粉酶升高。单纯胃角溃疡局限于黏膜及黏膜下层，不累及胰腺，一般不引起血清淀粉酶升高，故 D 为答案。\n\n📚 出处：《诊断学》第9版·实验室检查（淀粉酶）"],["关于氨基酰-tRNA 合成酶的特点，正确的是",["化的反应需要 GTP 供能","可以水解酯键校正氨基酸和 tRNA 之间的错配","只对氨基酸有绝对专一性","只对 tRNA 有绝对专一性","总共有 20 种酶分别化 20 种氨基酸和对应的 tRNA 的连接"],"B",1,"lc","基础与预防医学","氨基酰-tRNA 合成酶催化氨基酸与相应 tRNA 3′端腺苷酸核糖羟基形成酯键，并具校对功能：误接的氨基酸可通过水解酯键被清除，故 B 正确。A 该反应由 ATP 供能，生成氨基酰-AMP 中间体，并非 GTP；C、D 该酶对氨基酸和 tRNA 均有高度专一性（双重专一性）；E 一种酶可识别同工 tRNA，故酶种类多于 20 种，线粒体内另有独立系统。\n\n📚 出处：《生物化学与分子生物学》第9版·蛋白质的生物合成"],["24 岁女性，G2P0，第 24 孕周时超声检查提示：胎盘位于子宫前壁下段，部分覆盖宫颈内口，产科检查正常。该病例应诊断为",["正常胎盘位置","部分性前置胎盘","中央性前置胎盘","边缘性前置胎盘","目前不做前置胎盘诊断"],"E",1,"lc","妇产科", "B",1,"lc","心血管系统","室间隔缺损的典型杂音位于胸骨左缘第3～4肋间，为粗糙、响亮的全收缩期杂音，常伴收缩期震颤，P2随肺高压程度增强。房间隔缺损为第2～3肋间收缩期杂音伴P2固定分裂，动脉导管未闭为第2肋间连续性机器样杂音。本例已属肺高压但尚无右向左分流，故安静时不应有发绀。故选B。\n\n📚 出处：《内科学》第9版·先天性心血管病·室间隔缺损"],["毛发红糠疹应与下列哪种疾病鉴别",["花斑癣","一期梅毒疹","银屑病","毛细血管扩张症","神经性皮炎"],"C",1,"lc","皮肤性病","毛发红糠疹表现为毛囊性角化丘疹、橙红色鳞屑性斑块，好发于头皮、四肢伸侧，可伴掌跖角化，临床与银屑病高度相似，故必须与银屑病鉴别：银屑病鳞屑厚而呈银白色、Auspitz征阳性、甲板顶针状凹陷；毛发红糠疹鳞屑细薄、毛囊性丘疹突出、无点状出血。花斑癣、一期梅毒疹、毛细血管扩张症、神经性皮炎形态与之不同，不作重点鉴别。\n\n📚 出处：《皮肤性病学》第9版·毛发红糠疹"],["Codman 三角多见于",["脂肪肉瘤","骨肉瘤","皮质旁肉瘤","骨髓瘤","骨巨细胞瘤"],"B",1,"lc","临床综合","Codman三角是骨肉瘤生长迅速、掀起并刺激骨膜，在肿瘤上下端形成的三角形骨膜新生骨，常伴日光放射状骨针，为恶性骨肿瘤的典型X线征象，故选B。脂肪肉瘤位于软组织；皮质旁骨肉瘤位于骨表面，一般无Codman三角；骨髓瘤以穿凿样溶骨破坏为特点；骨巨细胞瘤呈偏心性溶骨、皂泡样改变，均不形成Codman三角。\n\n📚 出处：《外科学》第9版·骨肿瘤"],["患者，女性，40 岁。有发热、全身关节酸痛、紫癜样皮疹 1 年，既往有反复支气管哮喘、过敏性鼻炎发作史 2 年。血常规检查：WBC10.1×109/L，中性粒细胞 68%，嗜酸性粒细胞 16%。IgE 升高，p-ANCA 阳性。该患者最可能的诊断是",["Wegener 肉芽肿","过敏性紫癜","变应性肉芽肿性血管炎(Chung-Strauss 综合征)","支气管哮喘","结节性多动脉炎"],"C",1,"lc","呼吸系统","患者有哮喘样发作与过敏性鼻炎史，伴发热、关节痛、紫癜样皮疹，嗜酸性粒细胞达16%、IgE升高、p-ANCA阳性，符合变应性肉芽肿性血管炎（Churg-Strauss综合征，现称嗜酸性肉芽肿性多血管炎）的典型三联征：哮喘／过敏性鼻炎、嗜酸性粒细胞增多、系统性血管炎（皮疹、关节肌肉痛、多神经炎）。Wegener肉芽肿为c-ANCA阳性、上呼吸道肉芽肿与肾小球肾炎为主，嗜酸性粒细胞不高；过敏性紫癜正常血小板、无哮喘与嗜酸细胞增高；结节性多动脉炎常HBV相关、p-ANCA阴性、缺哮喘与嗜酸细胞增多；单纯支气管哮喘不能解释皮疹、关节痛与p-ANCA阳性。\n\n📚 出处：《内科学》第9版·血管炎·嗜酸性肉芽肿性多血管炎"],["腹部 X 线平片见右上腹部有一不透 X 线的圆形阴影，可用哪种较简单的方法来区别为胆囊结石还是肾结石",["腹部正位片","腹部侧位片","排泄性尿路造影","逆行性肾盂造影","肾穿刺造影"],"B",1,"lc","消化系统","右上腹不透X线圆形阴影需鉴别胆囊结石与右肾结石。腹部侧位片上，胆囊位于腹腔前部、肠道前方，结石影居脊柱前方；肾为腹膜后器官，肾结石影与脊柱重叠或位于其后，故侧位片即可简单区分，选B。正位片二者可重叠无法区分；排泄性尿路造影、逆行肾盂造影、肾穿刺造影均较复杂且有创，不作首选鉴别手段。\n\n📚 出处：《医学影像学》第9版·胆道疾病·胆石症"],["下列哪项是异位妊娠破裂时最主要的症状",["急性贫血","不规则阴道出血","晕厥与休克","停经史和早孕反应","突感一侧下腹撕裂样剧痛"],"E",1,"lc","妇产科","输卵管妊娠破裂时最主要的症状是突发一侧下腹撕裂样剧痛，系胚胎侵蚀穿透管壁、血液流入腹腔刺激腹膜所致，随后因内出血出现晕厥与休克。停经史、不规则阴道流血为一般表现，急性贫血是内出血的结果，休克是失血严重时的表现，均非最主要症状。\n\n📚 出处：《妇产科学》第9版·异位妊娠"],["子痫前期重度病人，血压 204/110mmHg，首选的降压药是",["利血平","复方降压片","甲基多巴","复方卡托普利","肼屈嗪"],"E",1,"lc","妇产科","子痫前期重度血压204/110mmHg时需静脉降压，首选肼屈嗪（5～10mg缓慢静注，可重复）或拉贝洛尔、硝苯地平；肼屈嗪直接松弛血管平滑肌、降压迅速且不影响子宫胎盘血流，为指南推荐。利血平可致新生儿鼻塞、嗜睡、血小板减少，孕期慎用；复方降压片、卡托普利（ACEI类致畸、胎儿肾损害）孕期禁用；甲基多巴为口服慢效药，不作急性期首选。\n\n📚 出处：《妊娠期高血压疾病诊治指南(2020)》"],["螺旋 CT 与传统 CT 的本质区别在于",["加快扫描速度","改变机架内重复旋转运动","获得的是三维检查信息","提高患者检查的效率","克服呼吸运动差异使检查层面的丢失"],"C",1,"lc","神经与精神","螺旋 CT 与传统（序列）CT 的本质区别在扫描方式：滑环技术使 X 线管与探测器连续旋转，同时检查床匀速进动，扫描轨迹呈螺旋状，采集到覆盖一定范围的连续容积数据（三维信息），可任意层面、任意间隔重建及三维重建。加快扫描速度、提高检查效率、克服呼吸运动导致的层面遗漏都是容积扫描带来的结果而非本质；机架内旋转方式的改变只是技术手段。故本质区别在于获得的是三维（容积）检查信息。\n\n📚 出处：《医学影像学》第8版·X线计算机体层成像·螺旋CT"],["下列哪种情况禁用腰麻",["高血压性心脏病","严重休克","有普鲁卡因过敏史","血红蛋白 80g/L 以下","小儿麻痹症后遗症下肢跛行者"],"B",1,"lc","临床综合","腰麻（蛛网膜下腔阻滞）使交感神经阻滞、血管扩张、回心血量减少，血压可骤降；严重休克患者已存在有效循环血量不足，麻醉后循环崩溃风险极大，属绝对禁忌，故选B。高血压性心脏病需慎用但可调整阻滞平面与容量；普鲁卡因过敏者可改用其他局麻药；血红蛋白80g/L以下者宜先纠正贫血而非绝对禁忌；小儿麻痹后遗症下肢跛行可选健侧卧位穿刺，不属禁忌。\n\n📚 出处：《临床麻醉学》第4版·椎管内麻醉"],["腰椎间盘脱出引起坐骨神经痛的急性期治疗首选",["大量维生素 B1、B12 肌注","试用一个疗程激素疗法","早期康复训练","手术治疗","卧硬板床及使用止痛剂"],"E",1,"lc","神经与精神","腰椎间盘突出症引起坐骨神经痛的急性期以非手术治疗为主：严格卧床（硬板床）休息 3～4 周，配合非甾体消炎镇痛药、肌肉松弛剂、脱水剂及神经营养药，多数可缓解，故为首选。维生素 B1、B12 属辅助用药；激素短程冲击仅在症状严重时酌情使用，不作常规首选；早期以制动为主，康复训练在急性期后开始；手术仅适用于正规保守治疗 6～12 周无效、马尾综合征、进行性肌力下降或括约肌功能障碍者。\n\n📚 出处：《外科学》第9版·腰腿痛·腰椎间盘突出症的治疗"],["先天愚型的临床表现应除外下列哪项",["智力低下","体格发育正常","特殊面容","特殊皮纹","抵抗力低下"],"B",1,"lc","临床综合","21-三体综合征（先天愚型）表现为智力低下、特殊面容（眼距宽、外眦上斜、鼻梁低平、舌常伸出口外）、通贯掌等特殊皮纹、肌张力低下、免疫功能差易感染，常合并先天性心脏病，故A、C、D、E均符合。患儿身长、体重均低于同龄儿，体格发育落后，故“体格发育正常”应除外，选B。\n\n📚 出处：《儿科学》第9版·21-三体综合征"],["11 岁女孩，半天来突发右上腹钻顶样剧烈绞痛，伴恶心、呕吐，间歇期完全缓解。查体：腹软，无局限压痛。最可能的诊断是",["急性胃炎","急性胆囊炎","胆道蛔虫症","急性肝脓肿","急性胰腺炎"],"C",1,"lc","儿科","突发右上腹钻顶样剧烈绞痛、伴恶心呕吐而间歇期完全缓解、腹部体征轻微（“症状重、体征轻”分离现象），是胆道蛔虫症的典型表现，故C正确。急性胆囊炎有持续右上腹痛、Murphy征阳性及发热；急性胃炎多有饮食诱因、上腹压痛；肝脓肿有高热、肝大压痛；急性胰腺炎疼痛持续并向腰背放射、血淀粉酶升高。\n\n📚 出处：《外科学》第9版·胆道蛔虫病"],["3岁患儿，曾多次患肺炎，平时无发绀。查体：心前区隆起，心尖搏动弥散，胸骨左缘第2肋间可闻及Ⅲ级粗糙的连续性机器样杂音，向颈部传导，有震颤，有水冲脉。如此患儿心尖部出现舒张期隆隆样杂音，提示",["心功能不全","肺动脉高压","左心室扩大","二尖瓣相对性狭窄","主动脉瓣关闭不全"],"D",1,"lc","儿科","胸骨左缘第2肋间连续性机器样杂音＋水冲脉＋震颤，为动脉导管未闭（PDA）典型体征。PDA时大量左向右分流→左心房、左心室容量负荷显著增加→左心室扩大→二尖瓣环扩张，形成相对性二尖瓣狭窄，故心尖部出现舒张期隆隆样杂音（Carey-Coombs杂音）。此为功能性杂音，非器质性二尖瓣病变。\n\n📚 出处：《儿科学》第9版·先天性心脏病·动脉导管未闭"],["以下哪项关于镜面反射的叙述是正确的",["当界面大于波长时发生","当界面小于波长时发生","由于界面小于 3mm 而发生","与入射角无关","以上都不是"],"A",1,"lc","神经与精神","超声成像中，界面尺寸大于波长时声波在界面发生镜面反射，反射角等于入射角；界面小于波长时则发生散射，能量向各方向辐射，故 A 对 B 错。3mm 是区分大、小界面的经验界限，但以“由于界面小于 3mm 而发生”表述因果不准确。镜面反射强度与入射角密切相关，垂直入射回声最强、角度越大回声越弱，故 D 错误。E 不成立。\n\n📚 出处：《医学影像学》第8版·超声成像·超声的物理特性"],["男，60 岁，冠心病史 10 年，突发胸痛伴呼吸困难 10 小时入院。查体： BP89/50mmHg，面色苍白，大汗，双肺底大量水泡音，心率 120/分，心音低钝。考虑心梗合并左心衰，最不合适的检查方法为",["心电图","床旁心脏超声","床旁胸片","心脏CT","血气分析"],"D",1,"lc","心血管系统","该患者急性心梗合并左心衰、血压89/50mmHg，血流动力学不稳定。心电图、床旁心脏超声（评估室壁运动、EF、乳头肌断裂等机械并发症）、床旁胸片与血气分析均可床旁完成且直接指导治疗；心脏CT（冠脉CTA）需搬动患者、控制心率、屏气并注射造影剂，且不能改变急诊再灌注决策，风险大于收益，为最不合适的检查。故选D。\n\n📚 出处：《急性ST段抬高型心肌梗死诊断和治疗指南(2019)》·急性期检查"],["以下均是心肌梗死的临床表现，但除外",["心电图进行性改变","血清心肌坏死标记物增高","胸骨后剧烈疼痛","心悸","发热、恶心、呕吐、上腹胀痛"],"D",1,"lc","心血管系统","急性心梗的典型表现包括持久的胸骨后剧烈疼痛、发热与胃肠道症状（恶心呕吐、上腹胀痛）、心律失常、低血压与休克、心力衰竭，老年及糖尿病者可为无痛性。诊断依据是心电图进行性演变（ST-T动态改变+病理性Q波）与血清心肌坏死标记物（肌钙蛋白、CK-MB、肌红蛋白）升高。心悸为一般非特异性症状，不列为心梗的临床表现。故选D。\n\n📚 出处：《内科学》第9版·冠心病·急性心肌梗死的临床表现"],["关于卵巢浆液性囊腺瘤的描述，以下错误的是",["囊壁薄，呈单房或多房","属于卵巢上皮性肿瘤","多为双侧发生","肿瘤直径一般为 5～10cm","可分为单纯性和乳头状两种"],"C",1,"lc","妇产科","卵巢浆液性囊腺瘤属卵巢上皮性肿瘤，囊壁薄、单房或少数多房，直径多为5～10cm，可分单纯性与乳头状两类；多为单侧（约85%），仅少数双侧。故“多为双侧发生”错误，双侧多见于浆液性囊腺癌与交界性肿瘤。\n\n📚 出处：《病理学》第9版·女性生殖系统疾病"],["男性，34 岁。烧伤面积为 60%，体重为 50kg。根据国内常用标准补液公式，伤后第 2 个 24 小时的补液总量应为",["0ml","6000ml","4250ml","5000ml","4500ml"],"C",1,"lc","儿科","按国内通用烧伤补液公式，第1个24小时补液量为每1%烧伤面积每公斤体重补充胶体和电解质共1.5ml（另加基础水分2000ml），第2个24小时胶体和电解质减半（0.75ml/%/kg），基础水分仍2000ml。本例60%×50kg×0.75＝2250ml，加2000ml＝4250ml，故C正确。A、B、D、E计算不符公式。\n\n📚 出处：《外科学》第9版·烧伤补液治疗"],["以产妇分娩后出现情绪低落，精神抑郁为主要症状的病证，称为",["产后郁冒","产后抑郁综合征","产后抑郁性精神病","产后抑郁","以上都不是"],"D",1,"lc","妇产科","产妇分娩后出现情绪低落、精神抑郁、悲伤哭泣、失眠、兴趣减退等为主要表现的一组症候，称产后抑郁（产褥期精神障碍之常见类型），多在产后2周内起病。产后郁冒为中医病名（产后失血复感寒邪而见头眩目瞀、郁闷不舒），产后抑郁性精神病则指病情严重达精神病程度、出现幻觉妄想者。\n\n📚 出处：《妇产科学》第9版·产褥期精神障碍"],["突然发现甲状腺单个结节，胀痛并迅速增大，既往未注意有无结节，应首先考虑诊断为",["甲状腺腺癌","甲状腺腺瘤","结节性甲状腺肿","甲状腺炎","甲状腺囊性腺瘤囊内出血"],"E",1,"lc","内分泌与代谢","原有甲状腺结节短期内突然增大并伴胀痛，最常见于甲状腺腺瘤（尤其囊性腺瘤）囊内出血，囊内张力骤升导致疼痛，故答E。甲状腺腺瘤本身与结节性甲状腺肿均生长缓慢、一般不痛；甲状腺腺癌多表现质硬、固定、无痛性结节，可伴声嘶，短期内急剧增大伴痛少见；亚急性甲状腺炎虽有疼痛，但常伴发热、上感史、ESR增快，且压痛弥漫、可放射至耳后。\n\n📚 出处：《外科学》第9版·甲状腺结节·诊断与鉴别诊断"],["慢性骨髓炎患者，红细胞为小细胞性，血清铁 6.23μmol/L，总铁结合力为 42.32μmol/L，骨髓细胞外铁(++)。诊断为",["缺 "容量支持通气"],"A",1,"lc","呼吸系统","控制通气（CV）时呼吸机完全替代患者自主呼吸，其通气频率、潮气量或气道压力、吸／呼比、吸气流速等参数全部按预设值给予，患者不参与触发，故A正确。辅助通气由患者吸气触发、机器按预设送气；同步间歇指令通气（SIMV）为自主呼吸与指令通气交替；压力支持通气与容量支持通气均为患者自主触发、机器支持的形式，均保留自主呼吸成分。\n\n📚 出处：《内科学》第9版·呼吸衰竭·机械通气"],["下列哪项不是体循环淤血的症状或体征",["双下肢水肿","食欲减退","肝大","呼吸困难","无尿"],"D",1,"lc","心血管系统","右心衰体循环淤血表现为颈静脉怒张、肝大压痛、下肢水肿、腹水及胃肠道淤血所致食欲减退、腹胀；呼吸困难是左心衰肺淤血的表现，不属体循环淤血。无尿提示心排量下降、肾灌注不足，也非淤血本身，但相比之下“呼吸困难”是最明确不属于体循环淤血的项目。故选D。\n\n📚 出处：《内科学》第9版·心力衰竭·慢性心力衰竭的临床表现"],["患者男，30岁，因淋巴结肿大入院治疗…确诊为急性白血病，拟行造血干细胞移植。脐血造血干细胞移植后，受者中性粒细胞恢复的时间是",["2～14天","2～24天","4～30天","8～32天","8～54天"],"B",1,"lc","血液系统","脐血中造血干/祖细胞数量少且多为早期亚群，移植后植入较骨髓及外周血干细胞慢：中性粒细胞恢复（ANC≥0.5×10⁹/L）多在移植后2～24天（中位约3～4周），血小板恢复更迟，常需2～3个月。故受者中性粒细胞恢复时间为2～24天。\n\n📚 出处：《临床输血学检验》第5版·造血干细胞移植"],["判断肾小球滤过功能，以下哪种实验室检查最常用",["菊粉清除率","肌酐清除率","尿比重","尿浓缩稀释试验","尿渗透压"],"B",1,"lc","泌尿系统","评估肾小球滤过功能的实验室指标中，肌酐清除率（Ccr）最常用：由血肌酐与尿肌酐、尿量计算，接近真实 GFR（较单纯血肌酐敏感），且无需外源性物质，可在各级医院开展。\n菊粉清除率是测定 GFR 的金标准，但需持续静脉输注菊粉并多次采血留尿，操作繁琐、临床不常用（故不选A）。尿比重、尿浓缩稀释试验、尿渗透压反映的是肾小管浓缩稀释功能，不是肾小球滤过功能。故为 B。\n\n📚 出处：《内科学》第9版·肾脏功能检查·肾小球滤过功能（肌酐清除率）"],["硬脑膜外血肿最常发生于",["颞区","顶区","额区","枕区","矢状窦附近"],"A",1,"lc","神经与精神","硬脑膜外血肿绝大多数由骨折撕破脑膜中动脉或其分支所致，而脑膜中动脉经棘孔入颅后沿颞骨内面的脑膜中动脉沟走行，故血肿最常位于颞区（颞部、颞顶区，约占 70%～80%），其次为额顶区，临床上常伴跨越脑膜中动脉沟的颞骨线形骨折。顶区、额区、枕区及矢状窦附近血肿多与相应静脉窦或局部骨折相关，相对少见。\n\n📚 出处：《外科学》第9版·颅脑损伤·硬脑膜外血肿"],["亚硝酸盐、硫代硫酸钠疗法或大剂量亚甲蓝，用于哪项抢救",["氰化物中毒","亚硝酸盐中毒","有机磷中毒","酒精中毒","重金属中毒"],"A",1,"lc","内分泌与代谢","氰离子与细胞色素氧化酶结合抑制细胞呼吸。亚硝酸盐（或亚硝酸异戊酯）使血红蛋白氧化为高铁血红蛋白，与氰离子结合成氰化高铁血红蛋白而解毒；硫代硫酸钠在硫氰酸酶作用下提供硫，生成低毒硫氰酸盐经肾排出；大剂量亚甲蓝亦有生成高铁血红蛋白的作用，故本疗法用于氰化物中毒，答A。亚硝酸盐中毒需用小剂量亚甲蓝还原高铁血红蛋白；有机磷中毒用阿托品加胆碱酯酶复能剂；酒精中毒用纳洛酮；重金属中毒用巯基络合剂或依地酸钙钠。\n\n📚 出处：《内科学》第9版·急性中毒·氰化物中毒解救"],["多发性肌炎的病理学改变不包括",["肌肉炎性细胞浸润","肌细胞再生","肌纤维变性、坏死","胶原结缔组织增生","肌纤维表达 MHC-Ⅰ类分子减少"],"E",1,"lc","基础与预防医学","多发性肌炎时损伤的肌纤维异常（而非减少）表达 MHC-Ⅰ 类分子，向 CD8+ T 细胞呈递自身抗原，是免疫病理的核心环节，故 E 描述错误、为答案。A 肌内膜及血管周围可见 T 细胞、巨噬细胞浸润；B 肌纤维坏死可见嗜碱性再生肌纤维；C 肌纤维变性、坏死为本病基本病变；D 间质胶原结缔组织增生可致肌肉纤维化与萎缩。\n\n📚 出处：《内科学》第9版·风湿性疾病（多发性肌炎与皮肌炎）"],["心室颤动首次除颤用",["50～100J","100～200J","200～300J","300～400J","400～450J"],"C",1,"lc","心血管系统","室颤除颤能量按 妇产科学》第9版·妊娠期高血压疾病"],["微量肾上腺素与局麻药配伍目的是",["防止过敏性休克","中枢镇静作用","局部血管收缩，促进止血","延长局麻药作用时间及防止吸收中毒","防止出现低血压"],"D",1,"lc","泌尿系统","局麻药液中加入微量肾上腺素（约1:20万）使局部血管收缩、减慢局麻药吸收，既延长麻醉作用时间，又降低血中局麻药浓度、减少吸收中毒，同时减少术野渗血。防止过敏、中枢镇静、防止低血压均非配伍目的。故答D。\n\n📚 出处：《药理学》第9版·局部麻醉药"],["防治急性呼吸窘迫综合征(ARDS)的一项必要措施是",["临床判断急性肺损伤(ALI)的轻重","血气分析","胸片","胸部 CT","呼吸困难时呼吸高浓度氧"],"A",1,"lc","儿科","ARDS的防治前提是对急性肺损伤（ALI）进行临床轻重判断和早期识别，据此决定是否及何时实施机械通气、选择通气策略和转诊时机，故A为必要措施。血气分析、胸片、胸部CT均属诊断与病情评估手段，而非“防治措施”；呼吸困难时吸入高浓度氧反而可能加重肺损伤和氧中毒，且不能防止ARDS进展。\n\n📚 出处：《内科学》第9版·急性呼吸窘迫综合征"],["女，21 岁，3 天来左膝关节肿胀，自幼于外伤后易出血不止。查：皮肤黏膜未见出血及紫癜，出血时间：1min，凝血时间：35min，凝血酶原时间正常。疾病分类应为",["纤维蛋白生成障碍","凝血酶生成障碍","血小板异常","凝血活酶生成障碍","血管壁功能异常"],"D",1,"lc","血液系统","患者自幼外伤后出血不止，提示遗传性凝血因子缺乏；BT 1分钟正常、无皮肤黏膜紫癜，提示血小板与血管因素正常；凝血时间35分钟显著延长而PT正常，说明外源性与共同途径正常，缺陷位于内源性凝血活酶生成阶段（因子Ⅷ、Ⅸ、Ⅺ、Ⅻ），符合血友病A/B。故选凝血活酶生成障碍。\n\n📚 出处：《诊断学》第9版·出血与凝血检查"],["男性，15 岁，全身高度浮肿。化验：尿蛋白(＋＋＋＋)，管型少许，血浆白蛋白 15g/L，血胆固醇 10mmol/L。用强地松 60mg/d，治疗 1 周病情无好转，此时应采用下列哪项措施",["停用强地松","使用地塞米松","继续用强地松原剂量","加用 ACTH","加用环磷酰胺"],"C",1,"lc","泌尿系统","肾病综合征激素治疗的核心原则：足量、足疗程、缓慢减量、长期维持。儿童初治首选泼尼松 2mg/kg/d（或60mg/m²/d），最大不超过 60mg/d，分次口服。判断激素敏感需观察 4～8 周（多数在 2～4 周内尿蛋白转阴），仅治疗 1 周即判定无效而过早换药或加用免疫抑制剂是原则性错误。本例用药 1 周、剂量已足（60mg/d），正确处理是继续原剂量观察（C）。激素疗程不足时停用会导致复发；过早加环磷酰胺增加不良反应。故为 C。\n\n📚 出处：《儿科学》第9版·肾病综合征·糖皮质激素治疗（足量足疗程）"],["鼓室肌收缩对耳蜗有保护作用，下述哪项有误",["可起到20dB的声保护作用","发生于声强大于85dB时","肌反射有潜伏期","对高频的保护作用优于低频","强声刺激时镫骨肌和鼓膜张肌均收缩"],"D",1,"lc","眼耳鼻喉口腔","强声（约85dB以上）刺激时，鼓膜张肌与镫骨肌几乎同时反射性收缩，使鼓膜紧张、听骨链僵硬度增加，声导抗加大，可衰减约20dB声能；肌反射存在数十毫秒潜伏期，对突发脉冲声保护有限；其对低频声的衰减作用明显，对高频保护较差。A、B、C、E均正确，D把低频与高频的保护效果颠倒了。\n\n📚 出处：《耳鼻咽喉头颈外科学》第9版·耳科学·听觉生理"],["下列哪项不是生理性黄疸的特征",["生后一周至数周出现黄疸","黄疸 10～14 天后消退","一般情况尚可，食欲良好","二便正常","无其他临床症状"],"A",1,"lc","消化系统","生理性黄疸的时相特点为生后2～3天出现、4～6天达高峰，足月儿10～14天消退，早产儿可延至3～4周；其一般情况良好、食欲好、二便正常、无其他伴随症状，故B、C、D、E均为其特征。生后一周至数周才出现黄疸不符合生理性黄疸规律，提示母乳性黄疸、感染或胆道闭锁等病理性因素，故选A。\n\n📚 出处：《儿科学》第9版·新生儿黄疸"],["4岁男孩，体格矮小、肥胖，多次发生晨起低血糖惊厥…拟诊为肝糖原累积症，下列哪项可以确诊",["X线见骨质疏松及骨骺出现延迟","空腹血糖为2.2mmol/L","皮下注射1/1000肾上腺素后血糖升高甚微","乳酸性酸中毒","肝活组织检查肝细胞内葡萄糖-6-磷酸酶活性显著降低，糖原显著增高"],"E",1,"lc","儿科","肝糖原累积症（Ⅰ型，v 底而颅顶发育完全"],"D",1,"lc","神经与精神","无脑儿是最常见的严重神经管缺陷之一：前神经孔未闭合致颅盖骨（颅顶）缺失，大脑半球及其覆盖的脑膜、头皮缺如，暴露的残余脑组织呈血管瘤样外观，而颅底骨骼发育基本完整、面部形态正常，常伴羊水过多与羊水 AFP 升高，多在宫内或生后不久死亡。故“无颅顶而颅底发育完全”最准确。B、E 的骨骼发育描述与本病相反，A 笼统且忽略颅底完整，C 属智力障碍描述。\n\n📚 出处：《妇产科学》第9版·胎儿异常·神经管缺陷"],["在海平面条件下，诊断成人呼吸衰竭的根据之一是 PaO2 值",["＜5.3kPa","＜6.67kPa","＜8.0kPa","＜9.3kPa","＜10.66kPa"],"C",1,"lc","呼吸系统","在海平面、静息状态、呼吸空气条件下，PaO2<60mmHg（约8.0kPa）伴或不伴PaCO2>50mmHg（6.67kPa）即诊断呼吸衰竭，故C正确。A、B两项数值偏低，会漏诊相当部分患者；D、E则明显过高，接近正常值下限，不能作为诊断界值。需注意氧疗下应结合PaO2/FiO2与临床判断。\n\n📚 出处：《内科学》第9版·呼吸衰竭·定义与诊断"],["关于大疱性红斑狼疮，下述错误的是",["为急性皮肤红斑狼疮的一种新亚型","皮损好发于曝光部位","组织病理是表皮下水疱","免疫电镜示免疫球蛋白沉积在透明板","患者对氨苯砜治疗非常敏感"],"D",1,"lc","皮肤性病","大疱性红斑狼疮为急性皮肤型红斑狼疮的一种亚型（A对），皮损好发于曝光部位（B对），组织病理为表皮下水疱、真皮浅层中性粒细胞浸润（C对），多数患者对氨苯砜治疗反应良好（E对）。免疫电镜显示免疫复合物沉积于基底膜带致密板下区，与获得性大疱性表皮松解症一致；沉积于透明板者是疱性类天疱疮，故D错误。\n\n📚 出处：《皮肤性病学》第9版·红斑狼疮"],["3 日龄新生儿血电解质的特点，下列哪项除外",["血钾偏高","血钠偏高","血氯偏高","血磷偏高","血清乳酸值偏高"],"B",1,"lc","儿科","新生儿生后数日因排钠增多、摄入不足、肾小管保钠能力差，血钠偏低，同时血钾、血氯、血磷及乳酸值均偏高（与红细胞代谢旺盛、摄食少、肾功能未成熟有关），故A、C、D、E符合3日龄特点。血钠偏高不符合新生儿早期生理改变，故B为答案（应除外者）。\n\n📚 出处：《实用新生儿学》第5版·新生儿水电解质代谢"],["关于轮状病毒肠炎的特点，下述不正确的是",["夏季多见","多见于 6～24 个月","大便呈蛋花汤样","常出现脱水","常伴有发热"],"A",1,"lc","消化系统","轮状病毒肠炎是婴幼儿秋冬季腹泻的主要病原，以10～12月为发病高峰，故夏季多见错误，选A。该病多见于6～24个月婴幼儿（B正确），大便呈蛋花汤样、无腥臭、无黏液脓血（C正确），常伴发热及上呼吸道症状（E正确），因大量水样便及呕吐易出现脱水、代谢性酸中毒（D正确）。\n\n📚 出处：《儿科学》第9版·小儿腹泻病·轮状病毒肠炎"],["滤过紫外灯(Wood 灯)检查时黄癣菌呈",["暗绿色","亮绿色","粉红色","红色","黑褐色"],"A",1,"lc","临床综合","Wood灯下不同致病真菌荧光不同：黄癣（许兰毛癣菌）呈暗绿色荧光，白癣（小孢子菌）呈亮绿色荧光，黑点癣（紫色毛癣菌、断发毛癣菌）无荧光，故选A；B为白癣表现；C、D、E与头癣致病菌的荧光特点不符。Wood灯检查简便无创，是头癣初筛、疗效与判愈观察的常用方法。\n\n📚 出处：《皮肤性病学》第9版·头癣"],["中、晚期食管癌分型中同时向腔内外侵犯的病理类型是",["缩窄型","蕈伞型","髓质型","溃疡型","溃疡型＋髓质型"],"C",1,"lc","消化系统","中晚期食管癌分为髓质型、蕈伞型、溃疡型与缩窄型。髓质型癌组织在管壁内浸润生长并累及全周，同时向腔内外扩展，使管壁明显增厚、管腔狭窄，故C正确。蕈伞型主要向腔内呈蘑菇状突出；溃疡型形成深在溃疡；缩窄型以环形纤维化致管腔狭窄为主，向腔内突出不明显。\n\n📚 出处：《病理学》第9版·食管癌"],["男性，30 岁，半天前在农田劳动中突然剧烈头痛，恶心。体检：体温 37℃，颈部抵抗，克氏征阳性，无偏瘫。头颅 CT 示血管畸形，心电图示心肌缺血。首要的措施是",["绝对卧床","止血剂","脑代谢活化剂","抗生素","改善心肌缺血"],"A",1,"lc","心血管系统","青年男性活动中突发剧烈头痛、恶心、颈抵抗、克氏征阳性，CT提示脑血管畸形，考虑畸形血管破裂致蛛网膜下腔出血（心电图心肌缺血为交感兴奋、儿茶酚胺骤升的继发改变）。首要处理为绝对卧床、避免用力排便与搬动、镇静止痛、控制血压，防止再出血与脑血管痉挛；止血剂、脑代谢活化剂、抗生素及单纯改善心肌缺血均非首要。故选A。\n\n📚 出处：《神经病学》第8版·脑血管疾病·蛛网膜下腔出血"],["诊断先天性胆总管囊肿首选的方法是",["X 线腹部平片","X 线钡餐","经皮肝穿胆道造影(PTC)","B 超","CT"],"D",1,"lc","消化系统","先天性胆总管囊肿首选B超：无创、经济、可重复，可显示胆总管囊性扩张的部位、大小、范围，以及有无合并结石、肝内胆管扩张，故D正确。腹部平片仅见软组织影；钡餐只见十二指肠受压推移；PTC有创、有胆漏与感染风险；CT多用于术前评估、了解与周围血管关系及除外肿瘤。\n\n📚 出处：《外科学》第9版·胆道疾病·先天性胆管扩张症"],["以下对正常子宫声像图的描述，错误的是",["宫颈回声较宫体稍减弱，且致密","横断面子宫体呈椭圆形","宫腔呈线状高回声","子宫体呈均匀的中等强度回声","纵断面子宫呈倒置梨形"],"A",1,"lc","妇产科","正常子宫声像图：纵断面呈倒置梨形，横断面宫体呈椭圆形，肌层为均匀中等强度回声，宫腔呈线状高回声（内膜线）。宫颈回声应较宫体稍强且致密（因纤维组织多），而非“稍减弱”，故A描述错误。\n\n📚 出处：《超声医学》第6版·女性生殖系统"],["男性，11岁，发热、胸痛、咳嗽约2周，近5天有呼吸困难。查：体温39℃，脉搏120次/分，呼吸30次/分。胸片见第7后肋高度有液平面，胸穿抽出稀薄脓液。治疗方法主要是",["周身支持治疗","胸腔闭式引流","胸腔穿刺抽脓","抗生素治疗","开胸手术"],"B",1,"lc","呼吸系统","儿童急性脓胸已形成液平面（脓气胸/包裹性积脓）、胸穿为稀薄脓液，首选胸腔闭式引流：可持续排出脓液与气体、促使肺复张、避免反复穿刺的痛苦与感染风险。单纯穿刺抽脓仅适用于脓液少、可一次抽净者；开胸手术用于慢性脓胸或引流无效。抗生素与支持治疗为必需的基础措施，但不是\"主要\"治疗手段。\n\n📚 出处：《外科学》第9版·脓胸·急性脓胸的治疗"],["脑疝的最有效脱水药是",["甘露醇","速尿","糖皮质激素","山梨醇","固利压"],"A",1,"lc","儿科","脑疝是颅内压增高的危急并发症，最有效、最常用的脱水降颅压药物是20%甘露醇，通过提高血浆渗透压使脑组织水分向血管内转移并产生渗透性利尿，快速缩小脑体积，常用1～2g/kg于30分钟内静滴，故A正确。速尿作用较弱，可与甘露醇联用；糖皮质激素起效慢，主要用于脑肿瘤周围水肿；山梨醇作用不及甘露醇；甘油果糖（固利压）作用缓和，不用于急救。\n\n📚 出处：《外科学》第9版·颅内压增高与脑疝"],["患者，女，38岁。无诱因出现持续性阴道流血2个月…诊刮病理：见滋养细胞增生活跃，未见绒毛结构。最可能的诊断是",["绒癌","不全流产","侵蚀性葡萄胎","滋养细胞内膜炎","重复性葡萄胎"],"A",1,"lc","妇产科","持续阴道流血2个月，诊刮病理见滋养细胞增生活跃、无绒毛结构，是绒毛膜癌（绒癌）的关键病理特征：肿瘤由分化不良的滋养细胞组成，无绒毛、无间质血管，靠血行播散。侵蚀性葡萄胎必见绒毛结构（水泡状组织）；不全流产见绒毛与蜕膜、无滋养细胞异常增生；滋养细胞内膜炎伴炎性细胞与退变绒毛。\n\n📚 出处：《妇产科学》第9版·妊娠滋养细胞肿瘤"],["下列哪种不是产褥期抑郁症使用药物",["舍曲林","阿米替林","氟西汀","阿托品","帕罗西汀"],"D",1,"lc","神经与精神","产褥期（围产期）抑郁症以抗抑郁药为主：SSRIs（舍曲林、氟西汀、帕罗西汀、艾司西酞普兰）为一线，乳汁分泌量低、安全性较好，其中舍曲林哺乳期资料最充分；三环类阿米替林镇静作用较强，哺乳期相对安全，可用于重症；严重者短期联合电休克。阿托品为 M 胆碱受体拮抗剂，用于内脏绞痛、术前给药及有机磷中毒，无抗抑郁作用，且可抑制泌乳、影响婴儿，故不属于产褥期抑郁症用药。\n\n📚 出处：《妇产科学》第9版·产褥期精神障碍·产后抑郁症"],["急性心肌梗死的并发症不包括",["乳头肌功能失调或断裂","心脏破裂","心室壁瘤","梗死后心绞痛","心肌梗死后综合征"],"D",1,"lc","心血管系统","急性心梗并发症包括乳头肌功能失调或断裂、心脏破裂（游离壁、室间隔、乳头肌）、栓塞、心室壁瘤、心肌梗死后综合征（Dressler综合征）。梗死后心绞痛指心梗后24小时至1个月内再次出现的心绞痛，属梗死延展或再缺血的临床表现与预警信号，不列为并发症。故选D。\n\n📚 出处：《内科学》第9版·冠心病·急性心肌梗死的并发症"],["下述不属于经皮内镜下胃造口术操作的是",["向胃腔内充气， 水肿及低蛋白血症","明显水肿及大量蛋白尿","大量蛋白尿及低蛋白血症"],"E",1,"lc","儿科","肾病综合征的诊断必备条件为大量蛋白尿（尿蛋白+++～++++，24小时定量≥50mg/kg）和低白蛋白血症（血浆白蛋白＜25g/L），故E正确。明显水肿和高脂血症为常伴表现，属次要条件；单纯大量蛋白尿+高脂血症或水肿+低蛋白血症均不能确诊。具备必备条件再根据有无血尿、高血压、氮质血症及低补体血症区分单纯型与肾炎型。\n\n📚 出处：《儿科学》第9版·肾病综合征"],["男，30 岁，不慎电击伤右手腕部。查体见右腕屈侧 5.0cm×5.0cm 大小创面，屈指浅肌腱外露。该创面应如何修复",["刃厚皮片移植修复","全厚皮片移植修复","中厚皮片移植修复","皮瓣移植修复","超薄皮片移植修复"],"D",1,"lc","运动与骨外科","腕掌侧电击伤创面5cm×5cm，屈指浅肌腱裸露，失去腱周与血供的肌腱表面无法使游离皮片成活，且日后需肌腱滑动，故须用带血供的皮瓣覆盖（如带蒂轴型皮瓣、游离皮瓣或前臂逆行皮瓣）。刃厚、中厚、全厚及超薄皮片均为游离皮片，无独立血供，在裸露肌腱上不能成活或形成粘连。\n\n📚 出处：《外科学》第9版·手外伤·创面覆盖与皮瓣应用"],["关于蜈蚣螫伤的急诊处理，下列错误的是",["近心端绑扎","弱碱性溶液冲洗伤口","碘伏消毒","取出毒钩","对症治疗"],"C",1,"lc","临床综合","蜈蚣螫伤后应取出毒钩，用弱碱性溶液（肥皂水、3%氨水、5%碳酸氢钠）冲洗以中和酸性毒液，局部冷敷，剧痛者行局麻封闭，并予抗过敏、对症处理；碘伏消毒创面属常规伤口处理，故B、C、D、E均为正确措施。近心端绑扎是毒蛇咬伤防止毒素回流的措施，蜈蚣螫伤一般不主张绑扎（可加重局部缺血），A更可能是错误项。⚠️原库答案存疑：原答C，但碘伏消毒本身并非禁忌。\n\n📚 出处：《急诊与灾难医学》第3版·急性中毒（毒虫螫伤）"],["视网膜的光感受器与下列哪项电生理检查相对应",["EOG","ERG 的 a 波","ERG 的 b 波","ERG 的 Ops 波","图形 ERG"],"B",1,"lc","眼耳鼻喉口腔","视网膜电流图（ERG）的a波起源于光感受器（视锥、视杆细胞）内段的电位变化，反映感光细胞层功能，故B正确；b波主要来源于Müller细胞及双极细胞层，反映内层视网膜；Ops波为振荡电位，来自无长突细胞等内层神经元；EOG反映视网膜色素上皮与光感受器复合体功能；图形ERG主要反映神经节细胞功能。\n\n📚 出处：《眼科学》第9版·眼的检查·视觉电生理"],["关于神经系统症状的说法，以下正确的是",["许多神经系统症状可以由其他系统疾病引起","神经系统的疾病不会以其他系统或器官的症状作为主诉","昏迷基本上都是中枢神经系统疾病引起的","抽搐肯定是神经系统疾病引起的","患者出现烦躁不安等精神症状通常是由于合并了神经系统疾病"],"A",1,"lc","神经与精神","神经系统症状与全身各系统疾病密切相关：低血糖、肝性脑病、尿毒症、肺性脑病、电解质紊乱、高血压脑病、感染中毒性脑病、系统性红斑狼疮、维生素 B12 缺乏及副肿瘤综合征等均可致意识障碍、抽搐、精神症状或肢体无力，故 A 正确。B 错误——脑肿瘤可仅以精神行为异常或“抑郁”就诊；C 错误——昏迷常由代谢性、中毒性、感染性等非中枢疾病引起；D 错误——抽搐可见于低钙、低血糖、高热、癔症；E 错误——烦躁多源于疼痛、缺氧、环境陌生、睡眠剥夺或药物。\n\n📚 出处：《神经病学》第8版·绪论·神经系统疾病的症状学特点"],["以下哪项不符合自身免疫性溶血性贫血的临床表现",["急性起病，多见于成年女性","头昏、虚弱伴发热","可有寒战、高热、腰背痛、呕吐、腹泻","可伴血小板减少","肝脾大"],"A",1,"lc","血液系统","温抗体型AIHA虽多见于成年女性，但起病多缓慢（数周至数月），表现为逐渐加重的乏力、头晕、黄疸与脾大；急性起病、进展迅速者多见于儿童及年轻患者，常继发于病毒感染。故急性起病并多见于成年女性的描述不符合。B、C为急性溶血发作表现；合并免疫性血小板减少（Evans综合征）时可伴血小板减少；肝脾大常见。\n\n📚 出处：《内科学》第9版·自身免疫性溶血性贫血"],["男，57 岁，体重 76kg，身高 160cm。因多饮、多尿确诊为 2 型糖尿病。经饮食治疗和运动锻炼，2 个月后空腹血糖为 8.9mmol/L，餐后 2 小时血糖 13.1mmol/L。进一步治疗应选择",["加磺脲类降血糖药物","加双胍类降血糖药物","加胰岛素治疗","加口服降血糖药和胰岛素","维持原饮食治疗和运动"],"B",1,"lc","泌尿系统","该患者为 2 型糖尿病，经饮食运动 2 个月后空腹血糖 8.9mmol/L（>7.0）、餐后2h 13.1mmol/L（>11.1），仍未达标，应启动药物治疗。首选二甲双胍（若无禁忌），因其不增加体重、不引起低血糖、有明确心血管获益且价格低廉，为 2 型糖尿病一线用药。若单药 3 个月不达标，再联合磺脲类、α-糖苷酶抑制剂、DPP-4i、SGLT2i 或 GLP-1RA。故本题选二甲双胍（首用）。\n\n📚 出处：《中国2型糖尿病防治指南(2020)》《内科学》第9版·糖尿病·降糖药物选择"],["下列哪一项不是抗合成酶综合征表现",["间质性肺炎","发热","技工手","Raynauds 现象","精神症状"],"E",1,"lc","基础与预防医学","抗合成酶综合征是特发性炎性肌病的亚型，以抗氨基酰-tRNA 合成酶抗体（如 Jo-1）阳性为特征，表现为对称性近端肌无力、间质性肺病（A）、技工手（C，手指侧面角化皲裂）、雷诺现象（D）、非侵蚀性关节炎及发热（B）。精神症状（E）不属于该综合征表现，为本题答案，其更多见于系统性红斑狼疮等弥漫性结缔组织病。\n\n📚 出处：《内科学》第9版·风湿性疾病（炎性肌病）"],["关于螺旋 CT 扫描优点，下述哪项不对",["缩短扫描时间","明显提高空间分辨率","减少病人接受 X 线剂量","容积扫描","减少图像的运动伪影"],"B",1,"lc","神经与精神","螺旋 CT 采用滑环技术，扫描时检查床连续匀速移动、X 线管连续旋转，获得连续容积数据，故扫描时间缩短、运动伪影减少、可任意层面重建，并因效率提高降低受照剂量。但空间分辨率主要取决于探测器孔径与重建矩阵，螺旋扫描因层厚插值反而使 Z 轴分辨率略降，其真正进步是时间分辨率与纵向（各向同性）分辨率，故“明显提高空间分辨率”不正确。\n\n📚 出处：《医学影像学》第8版·X线计算机体层成像·CT的特殊扫描技术"],["外阴肿瘤中最常见的病理类型是",["恶性黑色素瘤","基底细胞癌","鳞状细胞癌","汗腺癌","前庭大腺癌"],"C",1,"lc","妇产科","外阴恶性肿瘤以鳞状细胞癌最常见（占80%～90%），多发生于绝经后妇女，常位于大阴唇，其次为恶性黑色素瘤、基底细胞癌、前庭大腺癌、汗腺癌等。故最常见病理类型为鳞状细胞癌。\n\n📚 出处：《妇产科学》第9版·外阴恶性肿瘤"],["有关耳硬化的叙述，以下不正确的是",["病因尚未明确","又称耳硬化症，是骨迷路因局灶性吸收并被富含血管和细胞的海绵状新骨","所代替，继而形成骨质硬化病灶 临床耳硬化发病率白种人比黄种人和黑种人要高","发病率女性约为男性的 2.5 倍","早期以药物治疗为主，中、晚期以手术治疗为主"],"E",1,"lc","眼耳鼻喉口腔","耳硬化是骨迷路局灶性骨质吸收、被富含血管与细胞的海绵状新骨替代、继而骨化的原发性骨迷路疾病；病因未明，与遗传及内分泌相关；白种人发病率最高，女性约为男性2~2.5倍，妊娠可加重，A、B、C、D均正确。E错：本病以手术（镫骨足板开窗、人工镫骨植入）为主要治疗，药物无肯定疗效，仅氟化钠可试用于延缓进展，故“早期药物治疗为主”不正确。\n\n📚 出处：《耳鼻咽喉头颈外科学》第9版·耳科学·耳硬化症"],["关于阴道炎，下述哪项是正确的",["妊娠后不易发生滴虫性阴道炎","滴虫性阴道炎夫妻间不会相互传染","绝经后雌激素水平降低易引起萎缩性阴道炎","滴虫性阴道炎用灭滴灵治疗，足量用药，一次就可彻底治愈","孕妇合并霉菌性阴道炎时为避免影响胎儿，不用药物治疗"],"C",1,"lc","妇产科","绝经后卵巢功能衰退、雌激素水平降低，阴道黏膜变薄、糖原减少、pH升高，局部抵抗力下降，易发生萎缩性（老年性）阴道炎，故C正确。妊娠期因雌激素升高、阴道糖原增多，反而更易患假丝酵母菌阴道炎（A错）；滴虫性阴道炎可经性接触传播，夫妻需同时治疗（B错）；甲硝唑需规范足量足疗程并治疗配偶，一次用药不能保证根治（D错）；孕期仍需治疗，可选克霉唑局部用药（E错）。\n\n📚 出处：《妇产科学》第9版·阴道炎症"],["男性，59 岁，确诊肺结核并住院治疗 1 个月，既往无高血压冠心病史。上厕所解大便后出现胸闷、气憋、口唇和指甲发绀、面色苍白、大汗淋漓。还应排除的疾病有",["低血糖反应","误吸","药物反应","肺动脉栓塞症","急性胰腺炎"],"D",1,"lc","心血管系统","肺结核患者长期卧床，排便时Valsalva动作使静脉回流骤变，突发胸闷、气憋、口唇指甲发绀、面色苍白、大汗淋漓，应首先排除急性肺动脉栓塞（可致急性右心衰与严重低氧血症）。低血糖、误吸、药物反应、急性胰腺炎均不能解释突发发绀、大汗与胸憋的临床图景。故选D。\n\n📚 出处：《内科学》第9版·肺血栓栓塞症·临床表现"],["患者，女性，28 岁。感冒发热后 1 周出现肢体麻木，行走无力，3 日后出现视物模糊、肢体无力加重就诊。查体：神志清，言语流利，左眼内收欠充分，双眼向右水平眼震，右侧肢体肌力 4 级，右病理征阳性，右半身痛觉略减退。患者经治疗后恢复基本正常，2 个月后又发眩晕、复视，脑 MRI 发现左侧脑室旁和脑桥基底部偏右侧各见一类圆形的 T1 低信号、T2 高信号病灶， BAEP 脑干段受累，CSFOB/IgG(+)。则临床诊断是",["临床确诊 MS","实验室检查支持确诊 MS","临床可能 MS","实验室检查支持可能 MS","以上都不是"],"A",1,"lc","神经与精神","按 Poser 标准，临床确诊 MS 需 2 次以上发作（每次持续 24 小时以上、间隔 1 个月以上）并有 2 个以上不同部位的病变证据。本例第 1 次发作有左眼内收欠充分伴右眼水平眼震（核间性眼肌麻痹，提示脑干/内侧纵束）、右侧肢体无力与病理征及偏身痛觉减退；2 个月后第 2 次发作（眩晕、复视）；MRI 见左侧脑室旁与脑桥各一病灶，符合时间多发与空间多发，CSF OB/IgG 阳性与 BAEP 异常为支持证据，故可临床确诊 MS。实验室检查只是支持，其他选项均要求证据不足。\n\n📚 出处：《神经病学》第8版·中枢神经系统脱髓鞘疾病·多发性硬化的诊断标准"],["尿道下裂的主要原因是",["父亲酗酒过度","孕期母亲接触农药","孕期母亲接触 X 线","孕期母亲吸烟过多","胎儿期睾酮缺乏或作用不足"],"E",1,"lc","泌尿系统","尿道下裂源于胚胎期尿道褶融合不全，根本机制是胎儿睾酮合成不足或靶组织对雄激素反应低下（如17β-羟类固醇脱氢酶缺乏、5α-还原酶缺乏、雄激素受体异常）。A~D所述父亲酗酒、孕期接触农药或X线、母亲吸烟仅为可疑环境危险因素，不能视为主要原因。故答E。\n\n📚 出处：《外科学》第9版·泌尿男生殖系统畸形（尿道下裂）"],["肾病综合征患者应用强的松治疗 5 周后，尿蛋白定量由 3.8g/24h 减少至 2.6g/24h，但仍有双下肢水肿。应当进行下述哪项治疗",["继续强的松治疗","换用地塞米松","将强的松减量，加强利尿","加用消炎痛","加用环磷酰胺"],"A",1,"lc","泌尿系统","肾病综合征激素治疗原则是足量、足疗程：起始泼尼松1mg/(kg·d)（常40~60mg/d）连用8~12周，达缓解后缓慢减量、长期维持。本例用药5周尿蛋白由3.8g降至2.6g，说明部分有效但未完全缓解，应继续原剂量足量治疗，不能过早减量、换用地塞米松或加用细胞毒药物。故答A。\n\n📚 出处：《内科学》第9版·肾病综合征（糖皮质激素治疗）"],["早期先兆流产最先出现的症状是",["停经","子宫停止增大","妊娠试验由阳性转为阴性","阵发性腹痛","少量阴道流血"],"E",1,"lc","妇产科","早期先兆流产最先出现的症状是少量阴道流血（常为暗红色或血性白带），随后可伴轻微下腹坠痛或腰酸；妇科检查宫颈口未开、胎膜未破、子宫大小与孕周相符、妊娠试验阳性。子宫停止增大、妊娠试验转阴、阵发性腹痛均提示已进展为难免或稽留流产。\n\n📚 出处：《妇产科学》第9版·流产"],["意志行为不具有的特征是",["自觉地确定目的","与克服困难相联系","以随意动作为基础","是绝对自由的","与情绪相互渗透"],"D",1,"lc","临床综合","意志行为具有四个特征：自觉地确定目的、与克服困难相联系、以随意运动为基础、与认知和情绪情感相互渗透，故A、B、C、E均属其特征。意志受客观规律与主客观条件制约，不存在“绝对自由”，把意志理解为绝对自由属唯意志论观点，故D不属于其特征，为答案。\n\n📚 出处：《医学心理学》·心理过程（意志）"],["癫痫发作的分类是根据",["脑电图特点","临床表现","病因及发病机制","影响因素","临床表现和脑电图特点"],"E",1,"lc","神经与精神","癫痫发作的现代分类（ILAE 1981/2017）依据临床表现与脑电图特点：临床表现包括发作起始表现、意识有无受损、运动/感觉/自主神经/精神症状；脑电图包括放电起源、是否双侧同步对称及波形频率。二者结合才能确定发作类型。病因与发病机制用于癫痫及癫痫综合征的病因分类（遗传性、结构性、代谢性、免疫性、感染性、病因不明）；影响因素（年龄、睡眠、月经、诱因）不能作为分类依据；单凭脑电图亦不足。\n\n📚 出处：《神经病学》第8版·癫痫·发作分类"],["一位中年妇女，甲状腺大部切除术后有怕冷、少汗、疲乏无力、精神不振。医生怀疑她有继发性甲状腺功能减退，予以 BMR、T3、T4、PBI 和 TSH 等检查。下列哪项符合继发性甲状腺功能减退",["BMR、T3、T4 和 PBI 均降低，TSH 升高","BMR、T3、T4、PBI 及 TSH 均降低","BMR、T3、T4 均降低，PBI 和 TSH 均升高","BMR、T3、T4 均降低，PBI 升高，TSH 降低","BMR、T3、T4 均升高，PBI 和 TSH 降低"],"B",1,"lc","内分泌与代谢","继发性（中枢性）甲减源于垂体或下丘脑病变，TSH分泌不足，因此TSH降低，同时T3、T4、PBI、BMR均降低，答B。原发性甲减为甲状腺本身破坏，甲状腺激素降低而负反馈使TSH升高，对应A。单纯激素降低而TSH升高提示原发性；“PBI升高、TSH降低”或各指标普遍升高均与甲减不符，故C、D、E错误。\n\n📚 出处：《内科学》第9版·甲状腺功能减退症·实验室检查与鉴别"],["男，9 个月，化脓性脑膜炎患者。经抗感染治疗，体温平稳 6 天后复升，患儿呕吐明显，前囟饱满，头围增大，头颅透光实验阳性。此时最可能发生的并发症是",["败血症","硬膜下积液","脑室管膜炎","脑积水","以上都不是"],"B",1,"lc","儿科","化脓性脑膜炎治疗中体温平稳后再次升高，伴呕吐、前囟饱满、头围增大及头颅透光试验阳性（提示积液透光），为硬膜下积液（硬膜下积液多见于1岁以下流感嗜血杆菌或肺炎链球菌脑膜炎），故B正确。脑室管膜炎多见于治疗延误的婴儿，表现为持续高热、前囟饱满但透光试验阴性；脑积水为晚期并发症、头围进行性增大但透光试验阴性；败血症无头围增大表现。\n\n📚 出处：《儿科学》第9版·化脓性脑膜炎"],["小口畸形指口裂比正常者小，造成其畸形的主要原因是",["烧伤后引起","先天发育畸形","创伤、感染所致","先天性与后天性两种因素引起","肿瘤切除手术后所致"],"D",1,"lc","临床综合","小口畸形指口裂小于正常、单侧或双侧口角位置异常。其病因既有先天性因素（第一鳃弓发育异常、面裂畸形），也有后天性因素（烧伤后瘢痕挛缩、创伤、感染、肿瘤切除后修复不当），故D概括最全面。A、B、C、E各只述及一种病因，均不完整。治疗以口角开大成形术为主，术后应防止瘢痕再次挛缩。\n\n📚 出处：《口腔颌面外科学》第8版·口腔颌面部后天畸形（小口畸形）"],["下列哪项不符合颈内系统 TIA",["眼动脉交叉瘫","对侧轻偏瘫","失语","Horner 征交叉瘫","跌倒发作"],"E",1,"lc","临床综合","颈内动脉系统TIA表现为大脑半球或眼部的短暂缺血：一过性单眼黑矇、眼动脉交叉瘫（A）、对侧轻偏瘫或偏身感觉障碍（B）、优势半球受累时失语（C）、Horner征交叉瘫（D）均符合。跌倒发作由脑干网状结构缺血所致，是椎-基底动脉系统TIA的特征，故E不符合颈内系统TIA，为答案。\n\n📚 出处：《神经病学》第8版·短暂性脑缺血发作"],["哪种病原体感染脓液呈黄色、稠厚、不臭",["金黄色葡萄球菌","链球菌","大肠埃希菌","厌氧菌","衣原体"],"A",1,"lc","外科总论与麻醉","金黄色葡萄球菌感染脓液呈黄色、稠厚、无臭味，且易形成局限性脓肿、易产生耐药，是最具特征性的化脓性感染，故A正确。溶血性链球菌脓液稀薄、量大、淡红色；大肠埃希菌脓液稠厚、有粪臭；厌氧菌（脆弱拟杆菌等）脓液恶臭、有气泡；衣原体为细胞内寄生，不引起典型化脓性病灶。\n\n📚 出处：《外科学》第9版·外科感染"],["对小儿营养不良最具诊断价值的病史是",["家族史","过敏史","喂养史","预防接种史","传染病接触史"],"C",1,"lc","儿科","营养不良多由长期能量与蛋白质摄入不足或消化吸收障碍所致，因此详细询问喂养史（哺乳方式、乳量、辅食添加时间与种类、断奶情况、饮食习惯）是最具诊断价值的病史，故C正确。家族史、过敏史、预防接种史、传染病接触史可提示某些病因或伴随疾病，但对营养不良本身的诊断价值有限。结合体重下降、皮下脂肪减少及体重低下可确诊并分度。\n\n📚 出处：《儿科学》第9版·蛋白质-能量营养不良"],["颈部及上胸段食管癌如手术无法切除，多采用的治疗方法是",["手术切除","放射疗法","术前放疗加手术切除","手术治疗加术后放疗","联合化学药物疗法"],"B",1,"lc","消化系统","颈段及上胸段食管癌紧邻气管、喉返神经与大血管，手术常需颈胸联合甚至喉切除，切除率低、创伤大、并发症多；而该部位多为鳞癌，对放射线较敏感，放疗（三维适形、调强）可作根治或姑息手段，故不能切除者首选放射治疗，选B。单纯化疗疗效有限，同步放化疗用于局部晚期病例。\n\n📚 出处：《外科学》第9版·食管疾病·食管癌"],["下列哪项不是正常妊娠期常见症状",["高血压","水肿","贫血","便秘","恶心"],"A",1,"lc","妇产科","正常妊娠可出现恶心呕吐、便秘（孕激素使胃肠蠕动减弱）、踝部及下肢水肿（静脉压增高、水钠潴留）、生理性血液稀释导致的贫血倾向等。血压不应升高，孕期血压≥140/90mmHg属妊娠期高血压疾病，为病理表现，故选A。\n\n📚 出处：《妇产科学》第9版·妊娠生理"],["放射性核素标记化合物可与组织中特定的分子结构特异性结合而成像，以下不属于这类显像技术的是",["放射免疫显像","放射受体显像","灌注显像","反义显像","基因显像"],"C",1,"lc","医学影像与检验","以放射性标记化合物与组织特定分子结构（抗原、受体、核酸序列、基因表达产物）特异性结合为基础的显像称分子显像或靶向显像，包括放射免疫显像（抗原-抗体）、放射受体显像（受体-配体）、反义显像（反义寡核苷酸与 mRNA 互补）和基因显像（报告基因），其共同特点是有明确的靶分子。灌注显像反映的是血流灌注和毛细血管通透性，属血流灌注而非分子特异结合，故选 C。\n\n📚 出处：《核医学》第9版·分子核医学"],["不符合脑性瘫痪临床表现的是",["痉挛性瘫痪","共济失调","可伴智力低下","进行性运动倒退","可伴癫痫"],"D",1,"lc","神经与精神","脑性瘫痪是发育中胎儿或婴幼儿脑的非进行性损伤所致的运动与姿势发育障碍综合征。临床类型包括痉挛型（最常见，锥体束受损，肌张力增高、腱反射亢进、病理征阳性）、不随意运动型（手足徐动、肌张力障碍）、共济失调型及混合型，常合并智力低下、癫痫、语言与视觉障碍、行为异常。关键在于病变静止、非进行性，症状可随发育与康复训练改善；一旦出现进行性运动倒退，应警惕神经遗传代谢病、脑白质营养不良或颅内占位，需重新评估。\n\n📚 出处：《儿科学》第9版·神经系统疾病·脑性瘫痪"],["下列为猩红热病原和流行病学特点，但应除外哪项",["由 B 组溶血性链球菌所引起","主要通过呼吸道传播","经皮肤伤口可致猩红热","人一生中可得一次以上猩红热","由母体获得的抗体至 1 岁消失"],"A",1,"lc","基础与预防医学","猩红热由 A 组（而非 B 组）β 溶血性链球菌引起，故 A 为错误项即答案，其致病与该菌产生的红疹毒素（致热外毒素）有关。B 主要经呼吸道飞沫传播；C 病原菌经皮肤伤口侵入可致外科型猩红热；D 红疹毒素型别多，感染后仅对同型有持久免疫，故一生可多次患病；E 母体抗体经胎盘传递，生后 6 个月至 1 岁消失，故 1 岁内少见发病。\n\n📚 出处：《传染病学》第9版·猩红热"],["新生儿常见的特殊生理状态，以下哪项不符合",["生理性黄疸","假月经","新生儿粟粒疹","新生儿湿肺","乳腺肿大"],"D",1,"lc","儿科","新生儿特殊生理状态包括生理性黄疸、生理性贫血、假月经、乳腺肿大、新生儿粟粒疹、“马牙”及螳螂嘴、生理性体重下降等，故A、B、C、E均属此类。新生儿湿肺（新生儿暂时性呼吸增快）是肺液吸收延迟所致的病理状态，表现为呼吸急促、发绀及X线改变，需处理，不属于生理状态，故D为答案。\n\n📚 出处：《儿科学》第9版·新生儿特殊生理状态"],["支配阑尾的神经是交感神经腹腔丛和",["内脏小神经","第 10 胸神经","第 12 胸神经","内腔大神经","第 1 腰神经"],"A",1,"lc","消化系统","阑尾的神经来自交感神经腹腔丛及内脏小神经（起自T10～T11），传入纤维随内脏小神经经腹腔丛进入脊髓T10～T11节段，故早期阑尾炎疼痛常位于脐周或上腹部（牵涉痛），炎症波及壁层腹膜后才局限于右下腹。内脏大神经（T5～T9）、第12胸神经、第1腰神经均非阑尾的支配神经。\n\n📚 出处：《外科学》第9版·阑尾疾病·解剖生理"],["可疑弥漫性肺病变，下列最适合的扫描方法是",["常规平扫 CT","HRCT 扫描","增强 CT 扫描","动态 CT 扫描","螺旋 CT 及三维重建"],"B",1,"lc","呼吸系统","高分辨CT（HRCT）采用薄层（1～1.5mm）、小视野、高空间频率重建算法，能清晰显示次级肺小叶结构、小叶间隔、小叶内间质及磨玻璃、网格、蜂窝等征象，是评估弥漫性肺间质病变分布与类型的首选方法，故B正确。常规平扫CT层厚较厚，容易受部分容积效应影响；增强CT用于观察血管与强化；动态CT用于观察血流动力学；螺旋CT三维重建主要用于气道与血管的立体显示，均非弥漫性肺病变的最佳选择。\n\n📚 出处：《医学影像学》第8版·呼吸系统·弥漫性肺疾病"],["以下哪种情况最符合典型劳力性心绞痛发作",["劳力后心前区持续憋闷 3 小时缓解","情绪激动后心前区隐痛 1 天后好转","骑车上坡时感胸骨后压迫感，放射至咽部，休息数分钟后完全缓解","休息中前胸、后背酸痛，每次数分钟","左乳房下阵发性针刺样疼痛，每次持续 1～2 秒"],"C",1,"lc","心血管系统","典型劳力性心绞痛特点：劳力或情绪激动时出现胸骨后压榨性闷痛或压迫感，可放射至咽部、左肩及左臂，持续数分钟（一般3～5分钟，不超过15分钟），休息或含服硝酸甘油后数分钟缓解。持续3小时、1天、仅1～2秒的针刺样痛、静息时酸痛均不符合。故选C。\n\n📚 出处：《内科学》第9版·冠心病·慢性冠脉综合征（稳定型心绞痛）"],["所谓鼻肺反射，是指引起肺的哪种改变",["支气管收缩","肺通气量增加","喷嚏","肺顺应性增加","肺顺应性降低"],"A",1,"lc","呼吸系统","鼻肺反射是指鼻黏膜（尤其后下鼻甲）受刺激后，经三叉神经传入、迷走神经传出，反射性引起支气管平滑肌收缩、气道阻力增加，是鼻部病变与支气管哮喘、慢性咳嗽相关联的机制之一，故A正确。该反射不引起肺通气量增加或肺顺应性增加，反可致顺应性下降；喷嚏属鼻部保护性反射，与鼻肺反射不同。\n\n📚 出处：《耳鼻咽喉头颈外科学》第9版·鼻·鼻的生理功能"],["X 线胸片示有空洞形成，同侧或对侧肺野有斑片状或索条状阴影，常见于",["急性肺脓肿","肺结核","肺囊肿","肺癌","脓胸"],"B",1,"lc","呼吸系统","空洞伴同侧或对侧肺野斑片状、索条状阴影（多位于上叶尖后段或下叶背段）为继发型肺结核的典型X线表现：空洞为干酪样坏死物排出后形成，斑片影为渗出性病灶，索条影为纤维化修复，多种性质病灶共存是结核的特征。急性肺脓肿空洞多伴大片实变、液平面，且常单发位于下叶；肺囊肿为薄壁、无周围渗出；肺癌空洞多为厚壁偏心、内缘不规则，周围为肿块而非索条；脓胸表现为胸腔积液，无肺内空洞。\n\n📚 出处：《内科学》第9版·肺结核·影像学表现"],["脑膜瘤血管造影的特征表现是",["肿瘤染色","静脉早显","颈外动脉供血","肿瘤血管栏栅状排列","血管弧形包绕移位"],"C",1,"lc","神经与精神","脑膜瘤为脑外肿瘤，绝大多数由颈外动脉的脑膜中动脉及颈内动脉脑膜支供血。脑血管造影见颈外动脉分支增粗迂曲，呈“日光放射状”向肿瘤供血，是最具定性价值的表现，并可见持久肿瘤染色、引流静脉早显、邻近血管受压弧形移位。但肿瘤染色、静脉早显在胶质母细胞瘤、动静脉畸形中也可见，血管弧形包绕移位仅反映占位效应，特异性不足，故特征性表现为颈外动脉供血。\n\n📚 出处：《外科学》第9版·颅内肿瘤·脑膜瘤"],["煤炭工人，由于塌方被煤块砸伤右小腿，伤后 31 小时入院。检查：右小腿胫骨骨折端外露。应采取的治疗方式为",["采用Ⅴ型针进行内固定","采用外固定支架固定","为预防感染，骨折内固定后，伤口留待二期缝合","清创后一期关闭伤口","采用钢板内固定，并一期关闭伤口"],"B",1,"lc","运动与骨外科","开放性骨折伤后6～8小时内清创多可一期闭合；本例伤后已31小时、创缘污染重、组织挫灭明显，属感染高危创面，原则上清创后不置内固定、不一期关闭伤口，而应采用外固定支架固定骨折（避免内置物成为感染灶），伤口敞开引流、放置敷料，二期视情况处理。钢板、Ⅴ型针等内固定及一期关闭伤口均会显著增加深部感染与骨髓炎风险。\n\n📚 出处：《外科学》第9版·骨折概论·开放性骨折的处理"],["直流电检查时其极性规律",["阳通＞阴通＞阳断＞阴断","阴通＞阳通＞阴断＞阳断","阴通＞阳通＞阳断＞阴断","阳通＞阴通＞阴断＞阳断","阳断＞阴断＞阳通＞阴通"],"C",1,"lc","理化与中毒","直流电作用于人体时，通断瞬间组织内离子浓度骤变，刺激感受器和神经肌肉，其强度规律为：通电刺激强于断电刺激，阴极通电（阴通）刺激最强，其次为阳极通电（阳通）、阳极断电（阳断），阴极断电（阴断）最弱，即阴通＞阳通＞阳断＞阴断，故选 C。该规律是电诊断和直流电药物导入选择极性的依据（阴极下组织兴奋性升高、蛋白易于聚集），A、B、D、E 的排列均不符合。\n\n📚 出处：《康复医学》第6版·直流电疗法"],["不能经气管给药的药物是",["肾上腺素","阿托品","异丙肾上腺素","去甲肾上腺素","利多卡因"],"D",1,"lc","呼吸系统","经气管内给药（复苏时经气管导管注入）适用于肾上腺素、阿托品、利多卡因、异丙肾上腺素等脂溶性较高、易经支气管黏膜吸收的药物。去甲肾上腺素为强烈α受体激动剂，经气管吸收后引起肺血管强烈收缩、肺内分流增加与局部黏膜坏死，且可致严重高血压，故不宜经气管给药，为答案D。\n\n📚 出处：《药理学》第9版·肾上腺素受体激动药"],["患儿男，2 岁，出生时即尿道口异常。查体见：龟头扁平，尿道外口位于阴茎腹侧中段，阴茎向腹侧弯曲，阴囊正常。诊断为尿道下裂，此病例属于尿道下裂的哪一类型",["阴囊型","会阴型","阴茎型","阴茎头型","阴茎阴囊型"],"C",1,"lc","儿科","尿道下裂按尿道外口位置分型：阴茎头型、阴茎型、阴囊型、会阴型。本例尿道外口位于阴茎腹侧中段、阴茎向腹侧弯曲、阴囊正常，属阴茎型，故C正确。阴囊型者尿道口位于阴囊部并常伴阴囊分裂；会阴型者尿道口位于会阴部、阴囊分裂如阴唇状；阴茎头型者尿道口位于冠状沟腹侧、阴茎弯曲轻。\n\n📚 出处：《外科学》第9版·尿道下裂"],["引起上消化道大出血最常见的原因是",["胃癌","胃十二指肠溃疡","门静脉高压症","出血性胃炎","肝肿瘤"],"B",1,"lc","消化系统","上消化道大出血的病因中胃十二指肠溃疡占40%～50%，居首位，故B正确。门静脉高压症食管胃底静脉曲张破裂约占20%～25%，居第二位；急性糜烂出血性胃炎（应激性溃疡）、胃癌、食管贲门黏膜撕裂（Mallory-Weiss综合征）、胆道出血等相对少见；肝肿瘤破裂多表现为腹腔内出血，较少以呕血为主。\n\n📚 出处：《外科学》第9版·上消化道大出血·病因"],["关于“肠结核”的影像表现，下述错误的是",["增生型肠结核出现充盈缺损","跳跃征","溃疡型龛影检出率高","增生型肠结核肠管出现短缩、变窄","内瘘"],"C",1,"lc","呼吸系统","肠结核影像因类型不同：溃疡型以肠管痉挛激惹、钡剂排空过快形成跳跃征为主要表现，因溃疡表浅、沿肠壁环形分布，龛影检出率低且难以显示，故C错误。增生型以肉芽组织增生为主，向腔内突出形成充盈缺损，并引起肠管缩短、变窄、僵硬（A、D对）；病变穿透肠壁与邻近肠管粘连可形成内瘘（E对）。本题为反向选择。\n\n📚 出处：《医学影像学》第8版·胃肠道·肠结核"],["宫内节育器失败表现为",["带器妊娠","节育器嵌顿","带器继发感染","不规则阴道流血","节育器异位"],"A",1,"lc","临床综合","宫内节育器失败指避孕失败，主要表现为带器妊娠（含宫内妊娠与异位妊娠），多因节育器位置下移、部分脱落、型号不符或超期使用所致，故选A。节育器嵌顿、异位、带器继发感染、不规则阴道流血属IUD的并发症与副反应，不称为“失败”，故B、C、D、E归类错误。\n\n📚 出处：《妇产科学》第9版·宫内节育器避孕"],["室间隔缺损的先天性心脏病，其主要杂音是",["第 2 肋间Ⅱ级柔和的收缩期杂音","第 4 肋间Ⅱ级柔和的舒张期杂音","第 2 肋间Ⅱ级柔和的舒张期杂音","第 4 肋间Ⅳ级粗糙的收缩期杂音","第 4 肋间Ⅳ级粗糙的舒张期杂音"],"D",1,"lc","心血管系统","室间隔缺损的主要杂音位于胸骨左缘第3～4肋间，为Ⅳ级粗糙响亮的全收缩期杂音，常伴收缩期震颤并向心前区传导。第2肋间Ⅱ级柔和收缩期杂音见于房间隔缺损，第2肋间连续性杂音见于动脉导管未闭；舒张期杂音提示合并主动脉瓣关闭不全或肺高压后Graham-Steell杂音。故选D。\n\n📚 出处：《诊断学》第9版·心脏检查·先天性心脏病杂音特点"],["男，5 岁，跌倒时左手掌着地。查体：肘关节半屈状，肘部明显肿胀及压痛，皮下有瘀斑，向外突出畸形，肘后三角存在。该患儿最有可能的诊断是",["伸直型肱骨髁上骨折","屈曲型肱骨髁上骨折","肘关节脱位","桡骨小头半脱位","尺骨鹰嘴骨折"],"A",1,"lc","儿科","5岁儿童手掌着地跌倒，肘半屈位、肘部肿胀压痛及瘀斑、向后突出畸形，但肘后三角关系正常，提示伸直型肱骨髁上骨折（骨折在关节囊外，故肘后三角不变），故A正确。屈曲型为肘后着地、移位方向相反；肘关节脱位时肘后三角关系失常（三角破坏）；桡骨小头半脱位多见于5岁以下牵拉后，表现为前臂旋前、不敢活动，无肘部严重肿胀畸形；尺骨鹰嘴骨折可触及骨折端及骨擦感。\n\n📚 出处：《外科学》第9版·肱骨髁上骨折"],["患者男，72 岁，间断全程无痛肉眼血尿 2 月。B 超示双肾、输尿管未见积水，膀胱左侧壁 2.2cm×1.0cm 等回声肿物，突向膀胱腔。患者复查膀胱镜的时间应是",["两周","一个月","两个月","三个月","六个月"],"D",1,"lc","泌尿系统","非肌层浸润性膀胱癌经尿道电切术后复发率高，规范随访要求术后3个月首次复查膀胱镜（此时最易发现早期复发），之后按危险分层每3~6个月复查，2年后延长至每6~12个月。本例超声见2.2cm×1.0cm表浅肿物、无肾积水，符合电切术后随访安排。故答D。\n\n📚 出处：《外科学》第9版·膀胱癌（术后随访）"],["患者，女，28 岁，哺乳期闭经。体检：宫颈着色，子宫如孕 3 个月大小，质软，双附件正常。做钳刮术，术中夹出黄色脂肪样组织，患者感到有剧烈牵拉性疼痛，伴恶心、呕吐。该患者的诊断是",["人流综合征","子宫穿孔","葡萄胎","宫外孕","吸宫不全"],"B",1,"lc","妇产科","钳刮术中夹出黄色脂肪样组织（大网膜或肠管脂肪）、患者出现剧烈牵拉性疼痛伴恶心呕吐，是人流术中子宫穿孔并夹伤腹腔脏器的典型表现；哺乳期子宫软、壁薄，加之孕3个月大，穿孔风险高。应立即停止手术，用宫缩剂与抗生素，观察生命体征，必要时腹腔镜探查修补。人流综合征为迷走反射（心动过缓、血压下降、冷汗），无脂肪组织夹出。\n\n📚 出处：《妇产科学》第9版·人工流产术并发症"],["慢性肾功能不全高血压应减量的药物是",["利血平","卡托普利","速尿","哌唑嗪","美多心安"],"B",1,"lc","心血管系统","卡托普利主要经肾排泄，慢性肾功能不全时清除减慢、血药浓度升高，易致高血钾、低血压与肾功能进一步恶化，故须减量并密切监测血肌酐与血钾。速尿在肾功能不全时常需加大剂量；利血平、哌唑嗪与美托洛尔主要经肝代谢，一般无需按肾功能减量。故选B。\n\n📚 出处：《药理学》第9版·抗高血压药·ACEI在肾功能不全时的应用"],["静脉注射腺苷治疗阵发性室上性心动过速时，以下何种情况禁用",["低钾血症","病窦综合征","心力衰竭","冠心病心绞痛","高血压"],"B",1,"lc","心血管系统","腺苷（或ATP）快速静脉注射通过激活A1受体短暂抑制窦房结与房室结传导而终止室上速，半衰期约10秒。因其显著抑制窦房结与房室传导，病窦综合征、二度以上房室传导阻滞者禁用，支气管哮喘亦属禁忌；低钾、心力衰竭、冠心病、高血压并非禁忌。故选B。\n\n📚 出处：《药理学》第9版·抗心律失常药·腺苷"],["下列说法哪项不正确",["8F-FDG 的吸收与血糖水平有关","8F-FDG 能够在己糖激酶作用下转化为 6-磷酸-18F-FDG","18F-FDG 与葡萄糖具有完全相同的性质","18F-FDG 可在炎症部位浓聚","18F-FDG 可由肾脏排泄"],"C",1,"lc","临床综合","18F-FDG是葡萄糖的结构类似物，其摄取受血糖水平影响（高血糖竞争性抑制摄取），进入细胞后在己糖激酶作用下生成6-磷酸-18F-FDG，因不能继续代谢而滞留于细胞内，可经肾脏排泄，炎症部位巨噬细胞等亦可浓聚，故A、B、D、E均正确。但18F-FDG为2位脱氧葡萄糖，不能参与糖酵解后续反应，与葡萄糖性质并不完全相同，C为错误项。\n\n📚 出处：《核医学》第9版·PET显像原理与药物"],["下列哪项不是动脉粥样硬化的危险因素",["高胆固醇血症","高血压","吸烟","饮酒","肥胖"],"D",1,"lc","心血管系统","动脉粥样硬化公认危险因素包括高胆固醇（尤其LDL-C升高）、高血压、吸烟、糖尿病、肥胖、缺乏体力活动、年龄与性别、早发心血管病家族史。少量饮酒未被列为独立危险因素（长期大量饮酒可致高血压和甘油三酯升高，但有害饮酒属生活方式问题而非经典危险因素）。故选D。\n\n📚 出处：《内科学》第9版·动脉粥样硬化·危险因素"],["出现大批伤员时，对昏迷而有呼吸的患者，保持通气应采用的体位是",["仰卧位","俯卧位","头低脚高位","侧卧位","头高脚低位"],"D",1,"lc","呼吸系统","批量伤员中昏迷但仍有呼吸者，最大危险是舌根后坠与呕吐物、血液误吸导致气道梗阻，故应取侧卧位（复苏体位）：重力使舌体与口腔分泌物向外流出，保持气道通畅，同时便于观察与随时清除分泌物。仰卧位易舌后坠及误吸；俯卧位影响呼吸与观察且不便于处理；头低脚高位可增加颅内压与反流；头高脚低位不能解除气道梗阻。\n\n📚 出处：《外科学》第9版·创伤·现场急救与转运"],["休克时皮质激素的应用原则是",["休克愈重，剂量越小","休克愈重，剂量越大","休克愈重，剂量应分次给予","休克愈重，剂量应保持在中等范围","不宜应用"],"B",1,"lc","外科总论与麻醉","糖皮质激素用于严重休克（感染性休克、过敏性休克）及常规治疗无效者，遵循“早期、大剂量、短程（1～3天）”原则，病情越重剂量越大，如氢化可的松每日数百毫克至1g或地塞米松大剂量冲击，故B正确。其机制为抑制炎症介质瀑布、稳定溶酶体膜、改善微循环与心肌收缩力。剂量过小无效，长期使用反增加感染扩散与应激性溃疡风险。\n\n📚 出处：《外科学》第9版·外科休克"],["下列病原物与输血感染疾病不相关的是",["梅毒螺旋体","疟原虫","弓形体","HTV","血吸虫"],"E",1,"lc","血液系统","可经输血传播的病原体包括乙型与丙型肝炎病毒、HIV、梅毒螺旋体、疟原虫、弓形虫、巨细胞病毒、EB病毒及HTLV等，均为献血者筛查或询问的重点。血吸虫经皮肤接触疫水、尾蚴钻入而感染，不通过血液输入传播，故与输血感染无关。\n\n📚 出处：《外科学》第9版·输血"],["假设某种肿瘤细胞的 SF2 为 0.5，不考虑修复因素，经过 3 次 2Gy 照射治疗后，存活细胞比例为",["1/16","1/2","1/8","1/4","1/32"],"C",1,"lc","基础与预防医学","SF2 为分次剂量 2Gy 时的细胞存活分数，本题为 0.5。在不考虑修复因素的条件下，各分次照射的存活分数直接相乘：3 次 2Gy 后总存活分数=0.5³=1/8≈0.125，故 C 正确。D 1/4=0.5² 对应 2 次照射；A 1/16=0.5⁴ 对应 4 次；E 1/32 对应 5 次；B 1/2 仅为单次照射，选项均与题意不符。\n\n📚 出处：《肿瘤放射治疗学》·放射生物学中的细胞存活曲线"],["关于消化道重复畸形的治疗，下列哪一项是正确的",["胃的囊肿型重复畸形不需手术切除","十二指肠重复畸形不能采用开窗术","小肠重复畸形一经确诊均应手术治疗","肠的囊肿型及短段肠管型重复畸形也要切除全结肠","重复畸形肠段的粘膜内有时有迷生的胃粘膜及胰腺组织，不必处理"],"C",1,"lc","消化系统","小肠重复畸形可致肠梗阻、肠扭转、出血、穿孔并有恶变可能，一经确诊即应手术治疗，故C正确。胃囊肿型重复畸形反复出血或压迫幽门时亦需切除（A错）；十二指肠重复畸形与十二指肠共壁供血，采用开窗引流而非切除（B错）；肠囊肿型及短段肠管型只需切除重复肠段或开窗，无需切除全结肠（D错）；迷生胃黏膜、胰腺组织必须切除，否则出血穿孔难免（E错）。\n\n📚 出处：《外科学》第9版·小肠疾病·消化道重复畸形"],["患儿，10 个月，发热 2 天，抽搐 1 次，急诊入院。询问病史：其母患浸润性肺结核。查体：心肺正常，前囟饱满，颈软，肝、脾轻度肿大。脑脊液外观清，白细胞数 100×106/L，N30%，L70%，糖 1.1mmol/L，氯化物 101mmol/L。首先考虑",["高热惊厥","中毒性脑病","结核性脑膜炎","化脓性脑膜炎","病毒性脑膜炎"],"C",1,"lc","儿科","10个月患儿，有明确结核密切接触史（母亲浸润性肺结核），前囟饱满、肝脾轻大，脑脊液外观清、白细胞100×10⁶/L以淋巴为主、糖降低（1.1mmol/L）、氯化物降低（101mmol/L）、蛋白升高，符合结核性脑膜炎，故C正确。高热惊厥脑脊液正常；中毒性脑病脑脊液仅压力升高；化脓性脑膜炎外观混浊、中性粒细胞为主、糖显著降低；病毒性脑膜炎糖氯多正常。\n\n📚 出处：《儿科学》第9版·结核性脑膜炎"],["重症胰腺炎外科手术治疗的原则是",["彻底清除炎性组织","在保护机体功能的基础上，有效引流和排除毒素","促进毒素释放","促进炎性介质吸收","彻底止血"],"B",1,"lc","消化系统","重症急性胰腺炎手术的目的不是彻底清除炎性（坏死）组织（A），而是清除含胰酶与炎性介质的毒性渗出、充分引流，阻断全身炎症反应与继发感染的恶性循环，同时最大限度保护脏器功能，故B正确。C、D（促进毒素释放、促进炎性介质吸收）与治疗方向相反；彻底止血只是术中处理措施之一，不是手术原则。\n\n📚 出处：《外科学》第9版·胰腺疾病·重症急性胰腺炎外科治疗"],["下列何项是女性青春期开始的重要标志",["第 1 次来月经","第二性征开始出现","出现周期性排卵","卵泡开始发育","体格发育第二高峰出现"],"A",1,"lc","临床综合","月经初潮是女性青春期开始的重要标志，提示下丘脑-垂体-卵巢轴功能初步建立、子宫内膜对性激素产生周期性反应，故选A。第二性征出现（乳房发育）是青春期发动的早期表现，但教材以初潮作为“青春期开始”的标志；规律性排卵多在初潮后1～2年才建立；卵泡发育始于胎儿期；身长突增（第二生长高峰）为生长加速的表现，不作为标志。\n\n📚 出处：《妇产科学》第9版·女性生殖系统生理（青春期）"],["哪种眼部体征俗称“猫眼”",["白瞳症","夜间视力敏锐","横椭圆形瞳孔","竖椭圆形瞳孔","三角形瞳孔"],"A",1,"lc","眼耳鼻喉口腔","白瞳症指瞳孔区呈黄白色反光并伴视力丧失，因视网膜母细胞瘤、Coats病、先天性白内障、永存原始玻璃体增生症等使晶状体后或视网膜出现黄白色肿物或渗出所致，俗称“猫眼”，故A正确。B夜间视力敏锐与体征无关；C横椭圆形瞳孔见于先天性虹膜缺损等；D竖椭圆形、E三角形瞳
