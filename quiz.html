<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="湖南定考刷题">
<meta name="theme-color" content="#0f766e">
<title>湖南医师定考 · 刷题</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#f4f6f8;--card:#fff;--pri:#0f766e;--pri-l:#14b8a6;--ok:#16a34a;--bad:#dc2626;--txt:#1e293b;--sub:#64748b;--line:#e2e8f0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);font-size:16px;line-height:1.6;overscroll-behavior:none}
#app{max-width:720px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--pri),var(--pri-l));color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;box-shadow:0 2px 10px rgba(15,118,110,.25)}
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hd h1{font-size:17px;font-weight:700;letter-spacing:.5px}
.hd .sub{font-size:11px;opacity:.85;margin-top:2px}
.badge{font-size:11.5px;background:rgba(255,255,255,.22);padding:3px 9px;border-radius:20px;white-space:nowrap;font-weight:600}
.progbar{height:7px;background:rgba(255,255,255,.28);border-radius:6px;margin-top:10px;overflow:hidden}
.progbar i{display:block;height:100%;background:#fff;border-radius:6px;width:0;transition:width .35s}
.pgtxt{font-size:11px;margin-top:5px;opacity:.95;display:flex;justify-content:space-between}
main{flex:1;padding:14px 14px 96px}
.card{background:var(--card);border-radius:16px;padding:18px 16px;box-shadow:0 2px 12px rgba(15,23,42,.06);margin-bottom:14px}
.qmeta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--sub);margin-bottom:10px;gap:8px}
.tag{background:#ecfdf5;color:var(--pri);padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.tag.lc{background:#eff6ff;color:#2563eb}
.tag.sp{background:#f5f3ff;color:#7c3aed}
.stem{font-size:17px;font-weight:600;line-height:1.75;margin-bottom:16px;white-space:pre-wrap}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:11px;align-items:flex-start;padding:13px 14px;border:1.6px solid var(--line);border-radius:12px;cursor:pointer;transition:.15s;background:#fbfcfd;font-size:15.5px;line-height:1.6}
.opt:active{transform:scale(.99)}
.opt .k{flex:0 0 25px;height:25px;border-radius:50%;background:#eef2f6;color:var(--sub);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;transition:.15s}
.opt .v{flex:1;white-space:pre-wrap;padding-top:1px}
.opt.sel{border-color:var(--pri);background:#f0fdfa}
.opt.ok{border-color:var(--ok);background:#f0fdf4}
.opt.ok .k{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:#fef2f2}
.opt.bad .k{background:var(--bad);color:#fff}
.opt.dis{pointer-events:none;opacity:.72}
.opt.dis.ok,.opt.dis.bad{opacity:1}
.ansbox{margin-top:16px;padding:13px 15px;border-radius:12px;font-size:15px;display:none}
.ansbox.show{display:block;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ansbox.right{background:#f0fdf4;border:1px solid #bbf7d0}
.ansbox.wrong{background:#fef2f2;border:1px solid #fecaca}
.ansbox .t{font-weight:700;margin-bottom:4px}
.ansbox.right .t{color:var(--ok)}
.ansbox.wrong .t{color:var(--bad)}
.fallback{margin-top:14px;padding:13px 15px;background:#fffbeb;border:1px dashed #fcd34d;border-radius:12px;font-size:15px;white-space:pre-wrap;line-height:1.8}
.toolbar{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px 14px calc(env(safe-area-inset-bottom) + 10px);display:flex;gap:10px;max-width:720px;margin:0 auto}
.btn{flex:1;border:none;border-radius:12px;padding:14px;font-size:16px;font-weight:600;cursor:pointer;transition:.15s;font-family:inherit}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(135deg,var(--pri),var(--pri-l));color:#fff;box-shadow:0 4px 14px rgba(15,118,110,.3)}
.btn.gray{background:#eef2f6;color:var(--txt)}
.btn.small{flex:0 0 auto;padding:14px 18px}
.btn:disabled{opacity:.5}
.range{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chip{padding:9px 15px;border-radius:22px;background:#fff;border:1.5px solid var(--line);font-size:13.5px;cursor:pointer;font-weight:500;white-space:nowrap}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.chips-wrap{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;max-height:168px;overflow-y:auto}
.wrongitem{padding:14px;background:#fff;border-radius:14px;margin-bottom:10px;box-shadow:0 2px 10px rgba(15,23,42,.05);cursor:pointer}
.wrongitem .s{font-size:15px;font-weight:600;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wrongitem .m{font-size:12px;color:var(--sub);margin-top:7px}
.empty{text-align:center;color:var(--sub);padding:60px 20px;font-size:15px}
.empty .ico{font-size:44px;margin-bottom:12px}
.hint{font-size:12.5px;color:var(--sub);text-align:center;margin-top:14px;line-height:1.7}
.done-card{background:linear-gradient(135deg,#ecfdf5,#f0fdfa);border:1px solid #a7f3d0;border-radius:16px;padding:20px;text-align:center}
.done-card .big{font-size:34px;font-weight:800;color:var(--pri)}
.done-card .txt{font-size:14px;color:#0f766e;margin-top:6px}
.stat{background:#fff;border-radius:14px;padding:16px;text-align:center;box-shadow:0 2px 10px rgba(15,23,42,.05)}
.stat .n{font-size:28px;font-weight:800;color:var(--pri);line-height:1.2}
.stat .l{font-size:12px;color:var(--sub);margin-top:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sect{font-size:13px;color:var(--sub);font-weight:600;margin:18px 4px 8px}
.quote{font-size:13.5px;color:var(--sub);text-align:center;margin:16px 0 4px;line-height:1.8}
.footnote{font-size:11.5px;color:#94a3b8;text-align:center;padding:16px 20px;line-height:1.8}
.crown{display:inline-block;background:#fef3c7;color:#b45309;font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600}
/* 考试 */
.examcard{background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;border-radius:16px;padding:20px;box-shadow:0 6px 20px rgba(37,99,235,.28);cursor:pointer;position:relative;overflow:hidden}
.examcard:active{transform:scale(.99)}
.examcard h3{font-size:19px;font-weight:800;margin-bottom:6px}
.examcard p{font-size:13px;opacity:.9;line-height:1.7}
.examcard .go{display:inline-block;margin-top:14px;background:#fff;color:#1e3a8a;font-weight:700;font-size:14px;padding:9px 20px;border-radius:22px}
.timer{background:rgba(255,255,255,.25);padding:4px 12px;border-radius:20px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.5px}
.timer.warn{background:#fecaca;color:#991b1b}
.sheet{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:12px}
.sheet .s{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:8px;background:#eef2f6;font-size:13px;font-weight:600;color:var(--sub);cursor:pointer;border:1.5px solid transparent}
.sheet .s.done{background:#d1fae5;color:#065f46}
.sheet .s.cur{border-color:var(--pri);color:var(--pri);background:#f0fdfa}
.result-ring{text-align:center;padding:10px 0}
.result-ring .score{font-size:56px;font-weight:800;line-height:1}
.pass{color:#16a34a}.fail{color:#dc2626}
.rlist{margin-top:6px}
.rlist .ri{padding:12px 0;border-bottom:1px solid #eef2f6;font-size:14.5px}
.rlist .ri:last-child{border-bottom:none}
.rlist .ri .q{font-weight:600;line-height:1.6}
.rlist .ri .a{font-size:13px;margin-top:5px;color:var(--sub)}
.rlist .ri .a b{color:#16a34a}
.rlist .ri .a i{color:#dc2626;font-style:normal}
::-webkit-scrollbar{width:0}
</style>
</head>

    <div class="hd">

function load(){

  return {v:2, stats:{total:0,right:0,days:{}}, wrong:[], pos:0, date:today(), exams:[]};
}
function save(){try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function todayStat(){return state.stats.days[today()]||{n:0,r:0}}
function bumpProgress(){
  const n=todayStat().n;
  document.getElementById('todayBadge').textContent='今日 '+n+'/'+DAILY_GOAL;
  const tot=DATA.length, overall=state.stats.total/tot*100, todayPct=Math.min(100,n/DAILY_GOAL*100);
  document.getElementById('pbar').style.width=Math.min(100,overall*.5+todayPct*.5)+'%';
  document.getElementById('pgLeft').textContent='今日 '+n+'/'+DAILY_GOAL+' 题 '+(n>=DAILY_GOAL?'✅已达标':'');
  document.getElementById('pgRight').textContent='总进度 '+Math.round(overall)+'%';
  if(n>=DAILY_GOAL)document.getElementById('pbar').style.width='100%';
}

function keyOf(q){return btoa(unescape(encodeURIComponent(q[0]+q[1].join('|')+q[2]))).slice(0,40)}
function tagOf(q){return q[5]||''}

function pool(scope,tag){
  const out=[];
  DATA.forEach((q,i)=>{ if(scope==='all'||q[4]===scope){ if(!tag||q[5]===tag) out.push(i);} });
  return out;
}
function nextQuestion(){

  if(!p.length){ cur=-1; return; }

}
function curPool(){return pool(fScope,fTag)}
function renderPractice(){
  if(wrongQueue&&wrongQueue.length){ cur=wrongQueue[0]; }
  else if(cur<0||(fScope!=='all'&&DATA[cur][4]!==fScope)||(fTag&&tagOf(DATA[cur])!==fTag)) nextQuestion();
  if(cur<0){ document.getElementById('main').innerHTML='<div class="empty">该科目暂无题目</div>'; renderToolbar(); return; }
  const q=DATA[cur]; const stem=q[0],opts=q[1],ans=q[2],ok=q[3];
  const isRw=q[4]==='rw';
  const isWrong=state.wrong.some(w=>w.i===cur);
  let optsHtml='';
  if(ok&&opts.length>=2){
    opts.forEach((o,idx)=>{const L=String.fromCharCode(65+idx);
      optsHtml+=`<div class="opt" data-l="${L}" onclick="choose(this,'${L}')"><span class="k">${L}</span><span class="v">${esc(o)}</span></div>`;});
  }
  const fb=!ok?`<div class="fallback">⚠️ 本题选项在源文档中格式不完整，已保留原文与答案，请对照记忆：<br><br><b>参考答案：${ans}</b></div>`:'';
  document.getElementById('main').innerHTML=`
  <div class="card">
    <div class="qmeta">
      <span class="tag ${isRw?'':'lc'}">${isRw?'人文医学':'临床业务'}</span>
      <span class="tag sp">${esc(tagOf(q))}</span>
      <span>第 ${cur+1} / ${DATA.length} ${isWrong?'· <span class="crown">错题</span>':''}</span>
    </div>
    <div class="stem">${esc(stem)}</div>
    <div class="opts" id="opts">${optsHtml}</div>
    ${fb}
    <div class="ansbox" id="ansbox"></div>
  </div>
  <div class="hint">点击选项作答 · 答错自动进错题本</div>`;
  if(answered&&ok){
    const box=document.getElementById('ansbox'); const right=sel===ans;
    document.querySelectorAll('.opt').forEach(el=>{const L=el.dataset.l;el.classList.add('dis');if(L===ans)el.classList.add('ok');if(L===sel&&sel!==ans)el.classList.add('bad');});
    box.className='ansbox show '+(right?'right':'wrong');
    box.innerHTML=`<div class="t">${right?'✅ 回答正确':'❌ 回答错误'}</div><div>正确答案：<b>${ans}</b>${(!right&&sel)?'　你的选择：'+sel:''}</div>`;
  }
  renderToolbar();
}
function choose(el,L){
  if(answered)return;
  const q=DATA[cur],ans=q[2];
  answered=true; sel=L;
  state.stats.total++;
  const d=state.stats.days[today()]||(state.stats.days[today()]={n:0,r:0}); d.n++;
  const right=L===ans;
  if(right){state.stats.right++;d.r++;}
  else{
    if(!state.wrong.some(w=>w.i===cur)) state.wrong.unshift({i:cur,t:q[0].slice(0,70),a:ans,my:L,src:q[4],sp:q[5],ts:Date.now()});
    if(state.wrong.length>600)state.wrong.pop();
  }
  save();
  document.querySelectorAll('.opt').forEach(x=>{x.classList.add('dis');if(x.dataset.l===ans)x.classList.add('ok');if(x.dataset.l===L&&L!==ans)x.classList.add('bad');});
  const box=document.getElementById('ansbox');
  box.className='ansbox show '+(right?'right':'wrong');
  box.innerHTML=`<div class="t">${right?'✅ 回答正确':'❌ 回答错误'}</div><div>正确答案：<b>${ans}</b>${(!right)?'　你的选择：'+L:''}</div>`;
  bumpProgress(); renderToolbar();
}
function renderToolbar(){
  document.getElementById('toolbar').innerHTML=`<button class="btn gray small" onclick="nav('wrong')">错题本</button>
    <button class="btn pri" onclick="doNext()">${answered?'下一题 ▶':'跳过'}</button>
    <button class="btn gray small" onclick="nav('home')">首页</button>`;
}
function doNext(){answered=false;sel=null;nextQuestion();renderPractice();}

/* ============ 首页 ============ */
function renderHome(){
  const ts=todayStat(), n=ts.n;
  const days=Object.keys(state.stats.days).length;
  const rate=state.stats.total?Math.round(state.stats.right/state.stats.total*100):0;
  // 科目列表
  const lcSp=[...new Set(DATA.filter(q=>q[4]==='lc').map(q=>q[5]))];
  const rwSp=[...new Set(DATA.filter(q=>q[4]==='rw').map(q=>q[5]))];
  let tagChips='';
  if(fScope==='lc') tagChips=`<div class="chip ${fTag===''?'on':''}" onclick="setTag('')">全部科目</div>`+lcSp.map(t=>`<div class="chip ${fTag===t?'on':''}" onclick="setTag('${t}')">${t}</div>`).join('');
  else if(fScope==='rw') tagChips=`<div class="chip ${fTag===''?'on':''}" onclick="setTag('')">全部科目</div>`+rwSp.map(t=>`<div class="chip ${fTag===t?'on':''}" onclick="setTag('${t}')">${t}</div>`).join('');
  const poolN=curPool().length;
  document.getElementById('main').innerHTML=`
  <div class="done-card">
    <div class="big">${n} <span style="font-size:16px;color:#0f766e">/ ${DAILY_GOAL} 题</span></div>
    <div class="txt">${n>=DAILY_GOAL?'🎉 今日目标已达成！':`今日还需完成 ${DAILY_GOAL-n} 题`}</div>
    <div class="progbar" style="background:#a7f3d0;margin-top:14px"><i style="width:${Math.min(100,100*n/DAILY_GOAL)}%;background:#0f766e"></i></div>
  </div>

  <div class="examcard" onclick="startExam()" style="margin-top:14px">
    <h3>📝 模拟考试</h3>
    <p>随机 100 题 · 限时 60 分钟 · 交卷自动评分</p>
    <span class="go">开始模考 ▶</span>
  </div>

  <div class="grid2" style="margin-top:14px">
    <div class="stat"><div class="n">${state.stats.total}</div><div class="l">累计答题</div></div>
    <div class="stat"><div class="n">${rate}%</div><div class="l">总正确率</div></div>
    <div class="stat"><div class="n">${days}</div><div class="l">刷题天数</div></div>
    <div class="stat"><div class="n">${state.wrong.length}</div><div class="l">错题数</div></div>
  </div>

  <div class="sect">题库范围（共 ${DATA.length} 题）</div>
  <div class="range">
    <div class="chip ${fScope==='all'?'on':''}" onclick="setScope('all')">全部</div>
    <div class="chip ${fScope==='rw'?'on':''}" onclick="setScope('rw')">人文医学 500</div>
    <div class="chip ${fScope==='lc'?'on':''}" onclick="setScope('lc')">临床业务 1800</div>
  </div>
  ${tagChips?`<div class="sect">按科目分组</div><div class="chips-wrap">${tagChips}</div>`:''}
  <div class="sect">出题模式</div>
  <div class="range">
    <div class="chip ${mode==='seq'?'on':''}" onclick="setMode('seq')">顺序刷题</div>
    <div class="chip ${mode==='random'?'on':''}" onclick="setMode('random')">随机抽题</div>
  </div>
  <div class="quote">当前范围共 ${poolN} 题 · 「${['博观而约取，厚积而薄发。','今日事今日毕，两百题起。','千里之行，始于足下。','锲而不舍，金石可镂。','熟能生巧，勤能补拙。'][new Date().getDate()%5]}」</div>
  <div class="footnote">数据保存在本机浏览器 · 清缓存会丢失 · 建议每日刷满 200 题</div>`;
  document.getElementById('toolbar').innerHTML=`<button class="btn gray small" onclick="nav('wrong')">错题本</button>
    <button class="btn pri" onclick="startPractice()">开始刷题 ▶</button>
    <button class="btn gray small" onclick="nav('stats')">统计</button>`;
}
function setScope(v){fScope=v;fTag='';state.pos=0;save();render()}
function setTag(v){fTag=v;state.pos=0;save();render()}
function setMode(v){mode=v;save();render()}
function startPractice(){nextQuestion();nav('practice')}

/* ============ 模拟考试 ============ */
let exam=null, examTimer=null;
function startExam(){
  const idx=[...Array(DATA.length).keys()];
  // Fisher-Yates
  for(let i=idx.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]];}
  const list=idx.slice(0,100);
  exam={list, idx:0, ans:{}, start:Date.now(), dur:60*60, ts:null};
  if(examTimer)clearInterval(examTimer);
  examTimer=setInterval(()=>{ if(!exam)return; exam.ts++; const left=exam.dur-exam.ts;
    const el=document.getElementById('exTimer'); if(el){ el.textContent=fmtTime(left); el.classList.toggle('warn',left<=300); }
    if(left<=0){ clearInterval(examTimer); submitExam(true); }
  },1000);
  nav('exam');
}
function fmtTime(s){s=Math.max(0,s);const m=Math.floor(s/60),x=s%60;return String(m).padStart(2,'0')+':'+String(x).padStart(2,'0')}
function examPick(L){ if(!exam)return; exam.ans[exam.idx]=L; renderExam(); }
function examGoto(i){ if(!exam)return; exam.idx=i; renderExam(); }
function examNext(){ if(!exam)return; if(exam.idx<exam.list.length-1){exam.idx++;renderExam();} }
function examPrev(){ if(!exam)return; if(exam.idx>0){exam.idx--;renderExam();} }
function renderExam(){
  if(!exam){nav('home');return;}
  const qn=exam.list[exam.idx], q=DATA[qn];
  const stem=q[0],opts=q[1],ans=q[2],ok=q[3]; const chosen=exam.ans[exam.idx];
  let optsHtml='';
  if(ok&&opts.length>=2){
    opts.forEach((o,idx)=>{const L=String.fromCharCode(65+idx);
      optsHtml+=`<div class="opt ${chosen===L?'sel':''}" onclick="examPick('${L}')"><span class="k">${L}</span><span class="v">${esc(o)}</span></div>`;});
  }else{
    optsHtml=`<div class="fallback">本题为文本题，考试中请凭记忆作答，交卷后显示答案。</div>`;
  }
  const doneCnt=Object.keys(exam.ans).length;
  const left=exam.dur-(exam.ts||0);
  document.getElementById('main').innerHTML=`
  <div class="card">
    <div class="qmeta">
      <span class="tag ${q[4]==='rw'?'':'lc'}">${q[4]==='rw'?'人文医学':'临床业务'}</span>
      <span class="tag sp">${esc(q[5])}</span>
      <span class="timer" id="exTimer">${fmtTime(left)}</span>
    </div>
    <div class="stem">${esc(stem)}</div>
    <div class="opts">${optsHtml}</div>
  </div>
  <div class="card">
    <div style="display:flex;justify-content:space-between;font-size:13px;color:#64748b;margin-bottom:8px">
      <span>答题卡（已答 ${doneCnt}/100）</span><span>第 ${exam.idx+1} 题</span>
    </div>
    <div class="sheet">${exam.list.map((_,i)=>`<div class="s ${exam.ans[i]?'done':''} ${i===exam.idx?'cur':''}" onclick="examGoto(${i})">${i+1}</div>`).join('')}</div>
  </div>`;
  document.getElementById('toolbar').innerHTML=`<button class="btn gray small" onclick="examPrev()">上一题</button>
    <button class="btn pri" onclick="${exam.idx<exam.list.length-1?'examNext()':'submitExam(false)'}">${exam.idx<exam.list.length-1?'下一题 ▶':'交卷'}</button>
    <button class="btn gray small" onclick="submitExam(false)">交卷</button>`;
}
function submitExam(auto){
  if(!exam)return;
  const un=100-Object.keys(exam.ans).length;
  if(!auto && un>0){ if(!confirm(`还有 ${un} 题未作答，确定交卷？`))return; }
  if(!auto && un===0){ if(!confirm('确定交卷并查看成绩？'))return; }
  if(examTimer)clearInterval(examTimer);
  let right=0;
  exam.list.forEach((qn,i)=>{
    const q=DATA[qn], ans=q[2], my=exam.ans[i];
    if(my===ans)right++;
    else if(my){ // 只把作答错的入错题本
      if(!state.wrong.some(w=>w.i===qn)) state.wrong.unshift({i:qn,t:q[0].slice(0,70),a:ans,my:my,src:q[4],sp:q[5],ts:Date.now()});
    }
  });
  if(state.wrong.length>600)state.wrong=state.wrong.slice(0,600);
  const used=exam.ts||0;
  state.stats.total+=exam.list.length;
  state.stats.right+=right;
  const d=state.stats.days[today()]||(state.stats.days[today()]={n:0,r:0}); d.n+=exam.list.length; d.r+=right;
  const rec={ts:Date.now(), score:right, total:exam.list.length, used:used, pass:right>=60};
  state.exams=state.exams||[]; state.exams.unshift(rec); if(state.exams.length>30)state.exams.pop();
  save();
  exam.rec=rec; exam.right=right; exam.used=used; exam.finished=true;
  bumpProgress();
  nav('examResult');
}
function renderExamResult(){
  if(!exam||!exam.finished){nav('home');return;}
  const r=exam.rec; const pct=Math.round(r.score/r.total*100);
  const wrongList=exam.list.map((qn,i)=>({qn,i,my:exam.ans[i]})).filter(x=>DATA[x.qn][2]!==x.my);
  document.getElementById('main').innerHTML=`
  <div class="card result-ring">
    <div class="score ${r.pass?'pass':'fail'}">${r.score}<span style="font-size:22px">/100</span></div>
    <div style="margin-top:8px;font-size:15px">
      <span class="${r.pass?'pass':'fail'}" style="font-weight:700">${r.pass?'✅ 合格':'❌ 未达60分'}</span>
      ｜ 正确率 ${pct}% ｜ 用时 ${fmtTime(r.used)}
    </div>
  </div>
  <div class="sect" style="margin-top:0">错题复盘（${wrongList.length} 题）</div>
  <div class="card"><div class="rlist">${wrongList.length?wrongList.map(x=>{
    const q=DATA[x.qn];
    return `<div class="ri"><div class="q">${esc(q[0].slice(0,90))}</div>
      <div class="a">你选 <i>${x.my||'未答'}</i> · 正确 <b>${q[2]}</b> · ${esc(q[5])}</div></div>`;
  }).join(''):'<div class="empty" style="padding:30px">🎉 全部答对！</div>'}</div></div>`;
  document.getElementById('toolbar').innerHTML=`<button class="btn gray small" onclick="nav('home')">首页</button>
    <button class="btn pri" onclick="startExam()">再考一次 ▶</button>
    <button class="btn gray small" onclick="nav('wrong')">错题本</button>`;
}

/* ============ 错题本 ============ */
function renderWrong(){
  const c=document.getElementById('main');
  if(!state.wrong.length){
    c.innerHTML=`<div class="empty"><div class="ico">📌</div>还没有错题<br>去刷题或模考吧，答错的题会自动收录</div>`;
  }else{
    c.innerHTML=`<div class="sect" style="margin-top:0">错题本 · ${state.wrong.length} 题（点击查看）</div>`+
      state.wrong.map((w,idx)=>`<div class="wrongitem" onclick="reviewWrong(${idx})">
        <div class="s">${esc(w.t)}</div>
        <div class="m">${w.sp||''} · 你选 ${w.my||'未答'} · 正确 ${w.a}</div></div>`).join('');
  }
  document.getElementById('toolbar').innerHTML=`<button class="btn gray small" onclick="nav('home')">首页</button>
    <button class="btn pri" onclick="practiceWrong()">刷错题 ▶</button>
    <button class="btn gray small" onclick="clearWrong()">清空</button>`;
}
let wrongQueue=null;
function reviewWrong(idx){const w=state.wrong[idx];cur=w.i;answered=false;sel=null;wrongQueue=null;nav('practice');}
function practiceWrong(){if(!state.wrong.length)return;wrongQueue=state.wrong.map(w=>w.i);cur=wrongQueue[0];answered=false;sel=null;nav('practice');}
function clearWrong(){if(confirm('确定清空全部错题记录？')){state.wrong=[];save();render()}}

/* ============ 统计 ============ */
function renderStats(){
  const days=Object.keys(state.stats.days).sort();
  const rate=state.stats.total?Math.round(state.stats.right/state.stats.total*100):0;
  let hist='';
  days.slice(-14).forEach(d=>{const s=state.stats.days[d];const pct=Math.min(100,100*s.n/DAILY_GOAL);
    hist+=`<div style="display:flex;align-items:center;gap:10px;margin:7px 0;font-size:12.5px">
      <span style="flex:0 0 74px;color:#64748b">${d.slice(5)}</span>
      <span style="flex:1;background:#eef2f6;border-radius:6px;height:16px;overflow:hidden"><i style="display:block;height:100%;width:${pct}%;background:${s.n>=DAILY_GOAL?'#16a34a':'#14b8a6'}"></i></span>
      <span style="flex:0 0 54px;text-align:right;color:#475569">${s.n}题${s.n>=DAILY_GOAL?' ✅':''}</span></div>`;});
  const exams=(state.exams||[]).slice(0,10);
  let examHtml=exams.length?exams.map(e=>{
    const dt=new Date(e.ts); const ds=(dt.getMonth()+1)+'/'+dt.getDate()+' '+String(dt.getHours()).padStart(2,'0')+':'+String(dt.getMinutes()).padStart(2,'0');
    return `<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #eef2f6;font-size:14px">
      <span style="color:#64748b">${ds}</span>
      <span><b class="${e.pass?'pass':'fail'}">${e.score}/100</b> · ${fmtTime(e.used)}</span></div>`;
  }).join(''):'<div class="empty" style="padding:24px">还没有模考记录，去试试「模拟考试」</div>';
  document.getElementById('main').innerHTML=`
  <div class="grid2">
    <div class="stat"><div class="n">${state.stats.total}</div><div class="l">累计答题</div></div>
    <div class="stat"><div class="n">${rate}%</div><div class="l">总正确率</div></div>
    <div class="stat"><div class="n">${days.length}</div><div class="l">刷题天数</div></div>
    <div class="stat"><div class="n">${state.wrong.length}</div><div class="l">错题数</div></div>
  </div>
  <div class="sect">近 14 天打卡</div>
  <div class="card" style="padding:14px">${hist||'<div class="empty" style="padding:20px">暂无记录</div>'}</div>
  <div class="sect">模拟考试成绩</div>
  <div class="card" style="padding:12px 16px">${examHtml}</div>
  <div class="quote">坚持每日 200 题，考前从容不慌。</div>`;
  document.getElementById('toolbar').innerHTML=`<button class="btn gray small" onclick="nav('home')">首页</button>
    <button class="btn pri" onclick="startPractice()">继续刷题 ▶</button>
    <button class="btn gray small" onclick="nav('wrong')">错题本</button>`;
}

function render(){
  const isExamView=(view==='exam'||view==='examResult');
  document.querySelector('header').style.display=isExamView?'none':'';
  if(view==='home')renderHome();
  else if(view==='practice')renderPractice();
  else if(view==='exam')renderExam();
  else if(view==='examResult')renderExamResult();
  else if(view==='wrong')renderWrong();
  else if(view==='stats')renderStats();
  bumpProgress();
}
window.addEventListener('beforeunload',e=>{ if(exam&&!exam.finished){ e.preventDefault(); e.returnValue=''; } });
render();
</script>
</body>
</html>
