健主要有",["确立生存意义","加强人际交往","保持乐观情绪","修养个性","以上都包括"],"E",1,"rw","医学心理","老年人心理卫生保健的内容包括：确立生存意义、保持乐观情绪、加强人际交往、修养个性、适当用脑与活动、正确对待疾病与衰老、做好退休与丧偶的心理调适等，A、B、C、D均在其列，故E正确。只强调其中某项而否定其他，会遗漏老年期心理保健的多个维度，因此单选其他各项都不全面。\n\n📚 出处：《医学心理学》·心理卫生·老年期"],["心身疾病是",["心理社会因素引起的躯体疾病","心理社会因素引起的精神疾病","心理社会因素引起的神经症","心理社会因素引起的生理反应","心理社会因素引起的器官系统功能性反应"],"A",1,"rw","医学心理","心身疾病是心理社会因素在发病中起重要作用的躯体疾病，须有明确的躯体症状或器质性病理改变，故A正确。B精神疾病以精神活动异常为主要表现；C神经症属精神障碍，虽与心理因素相关但归入精神疾病范畴；D生理反应是应激时的即时反应，尚未构成疾病；E器官系统功能性反应只是心身疾病的部分表现或前驱状态，不足以涵盖其器质性改变。\n\n📚 出处：《医学心理学》·心身疾病"],["Lazarus 将个体对生活事件的认知评价过程分为初级评价和次级评价。初级评价阶段回答的问题是",["“什么样的选择最可行？”","“我可以用哪些策略来减轻压力？”","“这件事对我意味着什么？”","“有效吗？”","“什么样的选择最可行和有效吗？”"],"C",1,"rw","医学心理","Lazarus的认知评价理论把评价分为初级评价与次级评价：初级评价回答“这件事对我意味着什么”，判断事件与自身利害的关系（无关、良性、应激性）；次级评价回答“我可以用哪些策略应对”“什么样的选择最可行、有效”，即评估自身应对资源。故初级评价对应C。A、B、D、E均属次级评价的内容。\n\n📚 出处：《医学心理学》·应激与应对"],["关于心理评估，下述错误的是",["心理评估主要用于了解成人个体的心理特征","心理评估是心理干预的重要前提和依据","心理评估可对心理干预的效果做出判定","心理评估有助于维护和促进正常人群的心理健康","心理评估有助于医护人员把握和了解患者患病前和发病过程中存在的心理问题或心理障碍"],"A",1,"rw","医学心理","心理评估的对象不限于成人，还包括儿童、青少年、老年人以及有心理行为问题的各类人群和健康人群，故A“主要用于了解成人个体的心理特征”表述错误，为本题答案。B心理评估是心理干预的前提和依据；C可用于评定干预效果；D有助于维护和促进正常人群心理健康；E有助于医护人员把握患者病前及病程中的心理问题，均正确。\n\n📚 出处：《医学心理学》·心理评估"],["对心理超负荷的应对不常用",["量力而行","淡泊名利","学会放松","保持乐观","投射防御"],"E",1,"rw","医学心理","对心理超负荷（长期应激）的常用应对方式包括量力而行、淡泊名利、学会放松、保持乐观、合理安排时间、寻求社会支持等。E投射防御属精神分析的病理性防御机制，即把自身不可接受的冲动归咎于他人，它只是暂时缓解焦虑，长期使用会损害人际关系与自我认识，并非积极的应对策略，故为本题答案。\n\n📚 出处：《医学心理学》·应激与应对"],["关于医学心理学的表述，下列不正确的是",["是一门交叉学科","只是医学的分支学科","以维护和促进人类整体健康为目的","以人作为主要研究和服务对象","研究医学领域中的心理学问题"],"B",1,"rw","医学心理","医学心理学是医学与心理学交叉形成的一门交叉（边缘）学科，以人（患者与健康人群）为主要研究和服务对象，研究医学领域中的心理学问题，以维护和促进人类整体健康为目的，故A、C、D、E均正确。B“只是医学的分支学科”否定了其心理学的学科来源和交叉学科性质，表述不正确，为本题答案。\n\n📚 出处：《医学心理学》·绪论·学科性质"],["“一种心理测量的工具”称为",["心理评估","心理鉴定","心理测验","心理观察","心理调查"],"C",1,"rw","医学心理","心理测验是依据心理学原理，使用标准化工具对人的心理特征或状态进行量化测量的方法，因此“一种心理测量的工具”即指心理测验，故C正确。A心理评估是运用观察、访谈、测验等多种手段对心理状态作出综合判断的过程，范围大于测验；B心理鉴定属法律精神病学中的专门程序；D心理观察、E心理调查是收集资料的具体方法，均不是“测量工具”本身。\n\n📚 出处：《医学心理学》·心理测验"],["以下哪项不是心身疾病的治疗原则",["药物缓解症状","自我心理调节","矫正不良习惯","不间断发泄","心理护理"],"D",1,"rw","医学心理","心身疾病的治疗原则是心身并重：药物缓解躯体症状，配合自我心理调节、心理护理、矫正不良生活习惯（吸烟、酗酒、过食）、行为治疗与放松训练等。D“不间断发泄”既非治疗原则，长期宣泄还可能强化敌意与应激反应，损害社会功能，故为本题答案。A、B、C、E均为心身疾病综合干预的常规内容。\n\n📚 出处：《医学心理学》·心身疾病·治疗原则"],["获得更多真正而持久的快乐的有效策略中不包括",["喝酒","与家人保持频繁来往","接触大自然","做自己胜任的工作","参与团体决策"],"A",1,"rw","人文综合","研究发现，与家人朋友保持频繁来往、接触大自然、从事自己胜任并喜爱的工作、参与团体活动与决策、规律运动与充足睡眠等能带来持久而真实的快乐。A喝酒只是短暂的物质性欣快，长期饮酒反而导致情绪低落、睡眠障碍与依赖，不属有效策略，故为本题答案。B、C、D、E均属社会支持、沉浸体验与自主性满足等积极策略。\n\n📚 出处：《医学心理学》·积极心理学与健康促进"],["人体试验的目的应该是",["通过促进医学科学的发展而改善人类环境、造福人类","服务于战争与时局","满足个人的研究兴趣","服务于所在医院的需要","服务于研究所发展的需要"],"A",1,"rw","医学伦理","人体试验的目的必须是通过促进医学科学发展来改善人类健康、造福人类，这是《赫尔辛基宣言》和我国涉及人的生物医学研究伦理规范确立的基本前提，故A正确。B服务于战争与时局是纳粹人体实验的暴行，被《纽伦堡法典》否定；C满足个人研究兴趣、D服务所在医院需要、E服务研究所发展需要，都是把个人或机构利益置于受试者利益之上，违背受试者权益优先原则。\n\n📚 出处：《医学伦理学》第5版·人体试验伦理"],["在医学上能够做到的",["就是伦理学上应该做的","在伦理学上不一定是应该做的","在伦理学上是不应该做的","在伦理学上是缺乏根据的","都是经过伦理学检验的"],"B",1,"rw","人文综合","“能做的”是技术可能性，“该做的”是伦理正当性判断，二者不能等同：技术上可行的事（如克隆人、非医学需要的性别选择、晚期患者的过度抢救）在伦理上未必应当做，还需经受有利、不伤害、尊重、公正的检验，故B正确。A把技术能力直接等同于伦理正当；C一概否定，忽视了技术应用可以符合伦理；D说缺乏伦理根据，也不成立；E假定一切技术应用都已通过伦理检验，与实际不符。\n\n📚 出处：《医学伦理学》·绪论·技术与伦理"],["当妊娠危及胎儿母亲的生命时，可允许行人工流产或引产。这符合",["行善原则","公正原则","不伤害原则","尊重原则","自主原则"],"C",1,"rw","人文综合","当妊娠危及母亲生命时行人工流产或引产，是在母胎利益冲突中为避免对母亲造成更大伤害而采取的不得已措施，符合不伤害原则中“两害相权取其轻”的要求，故C正确。A行善原则强调促进患者利益，此处核心是为避免伤害；B公正原则涉及资源与负担的公平分配；D尊重原则强调自主决定；E自主原则要求尊重患者意愿，本例中孕妇本人的意愿仍是前提，但题干所问的是允许该操作所依据的原则，故指向不伤害。\n\n📚 出处：《医学伦理学》第5版·不伤害原则"],["人类辅助生殖技术的目的是",["商业化","演进性优生","有利于未婚男女生儿育女","使不育夫妇妊娠","控制人口数量"],"D",1,"rw","人文综合","人类辅助生殖技术的根本目的是使不育夫妇获得妊娠、生育自己的后代，故D正确。A商业化被伦理原则明确禁止，配子、胚胎不得买卖；B演进性优生（如选择性改良人类遗传素质）超出辅助生殖技术的医学目的，属被禁止的优生学应用；C为未婚男女生儿育女不符合我国现行管理规定；E控制人口数量是计划生育政策的目标，不是辅助生殖技术的目的。\n\n📚 出处：《医学伦理学》第5版·人类辅助生殖技术伦理"],["能全面反映伦理学概念的是",["研究职业道德现象的科学","研究社会现象和理论的科学","研究社会公共道德的科学","研究道德现象的科学","研究家庭道德的科学"],"D",1,"rw","医学伦理","伦理学是关于道德的科学，研究道德现象的产生、本质、发展规律及其社会作用，故D最能全面反映伦理学的概念。A仅指职业道德现象，是伦理学的一个分支领域；B研究社会现象和理论过于宽泛，未指明道德这一特定对象；C社会公共道德、E家庭道德都只是道德的一个领域，以偏概全，不能涵盖职业道德、婚姻家庭道德等全部道德现象。\n\n📚 出处：《医学伦理学》·绪论·道德与伦理学"],["下述哪类患者对治疗措施有自主选择权",["年龄在 10 周岁以下的患者","意识清醒的成年人","处于昏迷状态的患者","发作期的精神病患者","老年性痴呆患者"],"B",1,"rw","医学伦理","对治疗措施享有自主选择权的前提是具有同意的能力，即能理解信息、进行理性判断并自由表达意愿。意识清醒的成年人具备这一能力，故B正确。A 10周岁以下儿童无同意能力，须由监护人代理；C昏迷患者暂时丧失同意能力，由家属或授权代理人代为决定；D发作期精神病患者辨认与控制能力受损；E老年性痴呆患者认知功能下降，其同意能力须经评估，通常也需监护人参与。\n\n📚 出处：《医学伦理学》第5版·知情同意能力"],["关于临床决策的认识，下列正确的是",["医学伦理学是正确决策的保证","临床决策是单纯的技术决策","临床决策是单纯的伦理决策","临床决策有时是技术的，有时是伦理的","技术决策和伦理决策在临床决策中很难达到统一"],"A",1,"rw","人文综合","临床决策既是技术决策，也是伦理决策，二者在具体决策中相互渗透、应达到统一：技术方案的选择离不开有利、不伤害、尊重、公正的权衡，伦理判断也须以医学科学事实为基础。医学伦理学为决策提供价值依据和程序保障，故A“是正确决策的保证”成立。B、C各执一端，把决策简化为单纯技术或单纯伦理；D割裂了二者的统一性；E“很难达到统一”与实际要求和可能性相反。\n\n📚 出处：《医学伦理学》·临床诊疗伦理"],["安乐死的分类中，医务人员采取某种措施加速病人死亡称为",["自愿安乐死","非自愿安乐死","消极安乐死","主动安乐死","被动安乐死"],"D",1,"rw","医学伦理","按实施方式，安乐死分为主动（积极）安乐死与被动（消极）安乐死：主动安乐死指医务人员采取给药等措施主动加速患者死亡；被动安乐死指停止或撤除维持生命的治疗，任其自然死亡。题干所述“采取某种措施加速病人死亡”正指主动安乐死，故D正确。A自愿、B非自愿是按患者意愿划分的类型；C消极、E被动均指不作为方式，与题干不符。\n\n📚 出处：《医学伦理学》第5版·生命终结伦理"],["医患关系中的“医”是指",["医师和护士","医疗机构及其管理人员","医技人员","医院后勤人员","以上全部"],"E",1,"rw","医学伦理","医患关系中的“医”不限于医师个人，而是以医疗机构为载体的群体，包括医师、护士、医技人员以及医疗机构及其管理人员、后勤保障人员等，他们都以不同方式参与对患者的服务，故E正确。A仅列医师护士、B仅列机构与管理人员、C仅列医技人员、D仅列后勤人员，都只覆盖其中一部分，缩小了“医”方主体的范围。\n\n📚 出处：《医学伦理学》第5版·医患关系"],["开放式提问可让回答者自由发挥，适用于答案较多、较复杂的问题。以下哪项属于开放式提问",["早晨醒来时会有头痛吗","跟我谈谈你的头痛吧","昨天你头痛了吗","哪些情况会使你的头痛加重或减轻","你的头痛是在左侧还是在右侧"],"B",1,"rw","医患沟通","开放式提问不给固定答案，鼓励对方自由叙述和展开，“跟我谈谈你的头痛吧”即属此类，故B正确。A“早晨醒来时会有头痛吗”、C“昨天你头痛了吗”只能答是或否，属封闭式提问；E“左侧还是右侧”限定二选一，也是封闭式；D“哪些情况会使头痛加重或减轻”虽非是非问，但明确限定了回答的具体维度，指向性较强，不如B那样让患者自由发挥，故不作首选。\n\n📚 出处：《医患沟通学》·提问技巧"],["关于患者参与医疗决策的积极意义，以下说法错误的是",["提高患者依从性","激发患者的自主意识","体现以患者为中心","引起患者的逆反","提高患者满意度"],"D",1,"rw","人文综合","患者参与医疗决策有助于提高依从性、激发自主意识、体现以患者为中心、提高满意度与信任度，故A、B、C、E均属积极意义。D“引起患者的逆反”与上述结论相反：参与决策正是通过尊重患者意愿来减少被动服从带来的抵触，只有形式化、走过场的“假参与”才可能引发不满，故D为错误项。\n\n📚 出处：《医患沟通学》·共同参与型医患关系"],["关于医患沟通的说法，下列哪项是正确的",["沟通能力由性格决定","随着工作经验的积累，沟通能力也会不断提高","医生很忙，没有时间进行沟通","沟通能力是可以通过学习获得的","医患沟通是单向性的"],"D",1,"rw","医患沟通","沟通能力是一种可以通过学习、训练和实践不断提高的技能，故D正确。A“由性格决定”把沟通能力归为不可改变的特质，忽视了后天习得性；B工作年限的积累不必然带来沟通能力提升，缺乏反思与训练可能只是重复固有模式；C工作繁忙是客观现实，但不能成为不沟通的理由，沟通可融入接诊流程；E医患沟通是双向互动的信息交流过程，而非单向告知。\n\n📚 出处：《医患沟通学》·沟通能力的培养"],["面对一个愤怒的患者，医生得让这个生气的人知道，你听到、看到并理解他的感受。这样做的目的是什么",["表达同情心","表达责任心","表达同理心","表达怜悯之心","表达爱心"],"C",1,"rw","人文综合","准确捕捉并反馈患者的情绪——“我知道你现在很生气，你听到、看到并理解他的感受”，这是同理心（共情）的表达，故C正确。A同情心侧重对他人不幸的怜悯，容易使愤怒者感到被居高临下地对待；B责任心指对职责的担当；D怜悯之心带有施舍意味，可能激化对抗；E爱心过于笼统。共情要求先接纳情绪、不加评判，再共同商讨解决办法。\n\n📚 出处：《医患沟通学》·共情"],["医患交流时下面哪项是不正确的",["医生要主动使用肢体语言，使患者感到医生对他们的关心与重视","看病人时，完全可以不用注意病人的身体姿势","通过观察患者的表情了解患者的心理感觉","医务人员应读懂患者身体姿势的含义","医务人员应表示谦恭有礼"],"B",1,"rw","医患沟通","医患交流中观察患者的姿势、表情、体态是获取信息、判断其情绪与耐受度的重要途径，说“完全可以不用注意病人的身体姿势”明显错误，故B为本题答案。A主动使用肢体语言传递关心与重视；C通过表情了解患者心理感受；D读懂身体姿势的含义；E表示谦恭有礼，都是应当遵循的非语言沟通要求，均正确。\n\n📚 出处：《医患沟通学》·非言语沟通"],["在接待患者初次就诊时，医生赢得患者及家属信任的关键是",["具备高超的医疗技术","承诺以低廉的医疗费用给患者做诊断治疗","打扮得体，仪表端庄，言谈从容不迫","表达尊重、真诚、关爱及同情、理解","以敷衍的态度给患者做诊断治疗"],"D",1,"rw","人文综合","初次就诊时，患者对医师的信任首先建立在其态度和情感体验上：表达尊重、真诚、关爱以及同情与理解，能让患者感到被接纳和重视，这是赢得信任的关键，故D正确。A高超技术是长期信任的基础，但初次接触时患者尚无法评判；B承诺低廉费用既不可靠也易引发误解；C仪表端庄有助于良好第一印象，但只是外在条件；E敷衍态度直接损害信任。\n\n📚 出处：《医患沟通学》·建立信任"],["医患关系的重要性不包括",["提高病人依从性","有利于医患关系模式转变为共同参与型","造就良好的心理气氛","提高病人的社交能力","本身就是一种治疗手段"],"D",1,"rw","医学伦理","良好医患关系的重要性体现在：提高患者依从性、营造良好心理气氛、本身即具治疗作用（良好的医患关系能增强疗效、减轻焦虑），并有利于医患关系模式由主动-被动型向共同参与型转变，故A、B、C、E均属其重要性。D“提高病人的社交能力”不是医患关系的目的和功能，故为本题答案。\n\n📚 出处：《医学伦理学》第5版·医患关系"],["医生诊断治疗越来越依赖于检查、化验所得的指标和数据，医生和病人的直接交流也因此减少。反映出医患关系出现",["民主化趋势","物化趋势","法制化趋势","分化趋势","商品化趋势"],"B",1,"rw","医学伦理","诊疗愈益依赖检查、化验数据和仪器结果，医患之间的直接交流减少，医患关系由此出现“物化”趋势——人与人的关系被简化为人与物（技术、设备、数据）的关系，患者被当作“病例”而非完整的人，故B正确。A民主化趋势指患者权利意识和参与度提高；C法制化趋势指依法调整医患关系；D分化趋势、E商品化趋势均与题干描述的“重技术、轻交流”现象不对应。\n\n📚 出处：《医学伦理学》第5版·医患关系·发展趋势"],["医师应当具备的基本素质不包括",["良好的职业道德","熟练的医疗技术水平","发扬人道主义精神","履行防病治病、救死扶伤、保护人民健康的神圣职责","任劳任怨，不计报酬"],"E",1,"rw","人文综合","医师应具备的基本素质包括良好的职业道德、熟练的医疗技术水平、发扬人道主义精神、履行防病治病救死扶伤保护人民健康的神圣职责，以及良好的心理与沟通能力等，故A、B、C、D均属基本素质。E“任劳任怨、不计报酬”把奉献精神绝对化，忽视医师依法取得报酬的正当权利，不是对医师基本素质的规范要求，故为本题答案。\n\n📚 出处：《执业医师法》·医师的素质与义务"],["医生在从医生涯中，持续感到职业压力与疲累。以下哪一项不是有效的舒缓压力的方法",["经常锻炼","保证充足睡眠","加倍努力追求业务精益求精","经常与朋友及家人分享感受","合理安排工作时间"],"C",1,"rw","人文综合","缓解职业压力的有效方法包括规律锻炼、保证充足睡眠、与朋友家人分享感受获得社会支持、合理安排工作时间与任务优先级、学习放松技术等。C“加倍努力追求业务精益求精”会进一步延长工作时间、提高自我要求，反而加重负荷，属压力源强化而非缓解手段，故为本题答案。A、B、D、E均属积极有效的压力管理方式。\n\n📚 出处：《医学心理学》·应激与应对·职业压力"],["下列各项中能反映医学本质特征的是",["人才","技术","设备","管理","道德"],"E",1,"rw","人文综合","医学的本质特征在于其道德性：“医乃仁术”，医学以救死扶伤、维护人的生命与健康为目的，技术、设备、人才、管理都是实现这一目的的手段，唯道德体现医学的目的与本质，故E正确。A人才、B技术、C设备、D管理是医学发展的条件和保障，可以衡量水平高低，却不构成医学区别于其他行业的本质特征。\n\n📚 出处：《医学伦理学》·绪论·医学的本质"],["对医师的业务水平、工作成绩和职业道德状况，依法享有定期考核权的单位是",["县级以上人民政府","县级以上人民政府卫生行政部门","县级以上人民政府卫生行政部门委托的机构或组织","医师所在地的医学会","医师所在地的医师学会"],"C",1,"rw","医学伦理","《执业医师法》规定，县级以上人民政府卫生行政部门委托的机构或者组织，按照医师执业标准，对医师的业务水平、工作成绩和职业道德状况进行定期考核，故C正确。A县级以上人民政府是行政机关，不直接实施考核；B卫生行政部门是委托主体而非具体考核实施者；D医学会主要承担医疗事故技术鉴定等职能；E医师学会（协会）属行业团体，非本条规定的考核主体。\n\n📚 出处：《执业医师法》·考核"],["下列哪项不属于保密原则对医务人员提出的要求",["保守在治疗中知晓的患者隐私","从诊断疾病的需要来询问病史，不有意探听患者的隐私","为患有霍乱的患者保密","保守可能会给患者带来沉重精神负担的疾病预后","保守对患者精神可能带来挫伤的肿瘤或其它危害患者生命的病情"],"C",1,"rw","医学伦理","保密原则的例外包括：法律规定的传染病报告、涉及他人或社会重大利益的情形、患者同意告知等。霍乱属甲类传染病，医疗机构和医师有法定的报告义务，不得为其“保密”，故C不属保密原则的要求，为本题答案。A保守诊疗中知悉的隐私、B按诊断需要询问而不有意探听隐私、D对可能造成沉重精神负担的预后保密、E对可能挫伤患者的肿瘤等病情保密，均是保密原则的具体要求。\n\n📚 出处：《医学伦理学》第5版·保密及例外"],["对医师的业务水平、工作成绩和职业道德状况，依法享有定期考核权的是哪个主体",["县级以上人民政府卫生健康主管部门","受县级以上人民政府卫生健康主管部门或其委托的医疗卫生机构、行业组织","医师所在地的医学会或者医师协会","医师所工作的医疗、预防、保健机构","市级以上人民政府卫生健康主管部门"],"B",1,"rw","医学伦理","《执业医师法》规定，受县级以上人民政府卫生健康主管部门（卫生行政部门）委托的医疗卫生机构或者行业组织，对医师的业务水平、工作成绩和职业道德状况进行定期考核，故B正确。A卫生行政部门本身是委托主体，不直接实施考核；C医学会或医师协会需经委托方可承担，不能直接作为法定考核主体；D医师所在医疗机构在受委托时才承担考核工作，个人所在单位本身不当然享有考核权；E级别限定为市级以上，与法定的县级以上不符。\n\n📚 出处：《执业医师法》·考核"],["医疗机构施行手术、特殊检查或特殊治疗时，如果无法取得患者意见又无家属或关系人在场，应该",["经治医师提出医疗处置方案，在取得县级以上卫生行政部门批准后实施","经治医师提出医疗处置方案，在取得医疗机构负责人或者被授权负责人员的批准后实施","经治医师提出医疗处置方案，在取得群众认可后实施","经治医师提出医疗处置方案，在取得第三者证实有效后实施","经治医师根据医疗处置方案，在取得同行讨论批准后实施"],"B",1,"rw","卫生法律法规","《医疗机构管理条例》规定，医疗机构施行手术、特殊检查或者特殊治疗，无法取得患者意见又无家属或者关系人在场，或者遇到其他特殊情况时，经治医师应当提出医疗处置方案，在取得医疗机构负责人或者被授权负责人员的批准后实施，故B正确。A报卫生行政部门批准不是法定程序；C取得群众认可、D第三者证实、E同行讨论批准均非法定替代程序，不能保障紧急情况下的及时救治与责任归属。\n\n📚 出处：《医疗机构管理条例》·医疗机构执业规则"],["甲、乙共同出资经营药店，不慎购进一批假药…其中，构成卫生行政法律关系消灭的原因是",["购进假药","顾客要求赔偿","顾客告到卫生行政部门","乙的撤出","药店终止经营"],"E",1,"rw","卫生法律法规","卫生行政法律关系的产生、变更和消灭以法律事实为依据。药店终止经营意味着该主体资格的消灭，从而使卫生行政法律关系（如监管关系）归于消灭，故E正确。A购进假药是违法事实，引起的是处罚关系的产生；B顾客要求赔偿、C顾客告到卫生行政部门引起的是民事赔偿或行政处理程序的启动，属关系的产生或变更；D乙的撤出属合伙内部关系变化，不必然导致卫生行政法律关系消灭。\n\n📚 出处：《卫生法学》·卫生法律关系"],["刘医生因工作需要，从县中医院调到县人民医院工作，他应当",["向原单位申请变更","不需要办任何手续","向上级卫生行政部门办理变更注册手续","到准予他注册的卫生卫生健康主管部门办理变更注册手续","向县卫生局申请变更"],"D",1,"rw","人文综合","《执业医师法》规定，医师变更执业地点、执业类别、执业范围等注册内容的，应当到准予其注册的卫生健康主管部门办理变更注册手续，故D正确。A仅向原单位申请变更不产生法律效力；B不办手续即在新单位执业属违法；C“上级卫生行政部门”不一定是原注册机关，变更须在原注册机关办理；E县卫生局若正是原注册机关则可，但笼统表述不如D准确，且新单位在县人民医院仍需依法办理变更注册。\n\n📚 出处：《执业医师法》·变更注册"],["如果一个人说他看到了观音菩萨向他走来，并对他说将对他施法。那么，根据以下哪个原则可以判断其精神活动不正常",["主观世界与客观世界的统一性原则","人格的相对稳定性原则","心理活动的内在协调性原则","社会适应的原则","人格的相对稳定性原则和社会适应的原则"],"A",1,"rw","人文综合","精神活动正常与否的判定原则有三：主观世界与客观世界的统一性、心理活动的内在协调性、人格的相对稳定性。患者称看到观音菩萨走来并对其施法，属客观现实中不存在的知觉体验（幻视），主观体验与客观现实不符，违反主客观世界统一性原则，故A正确。B、E涉及人格稳定性，本例未涉及人格改变；C内在协调性指认知、情绪、意志之间是否协调一致，本例主要表现为幻觉；D社会适应原则不是判定精神活动正常性的三大原则之一。\n\n📚 出处：《医学心理学》·变态心理学·正常与异常的判断"],["病人因交通事故受伤住院，住院期间入睡困难，总是做噩梦，而且患者述说脑中总是闪现对面车辆撞过来的那一幕。这种现象称为",["创伤性应激","创伤后应激障碍","医院焦虑障碍","创伤恐怖症","医院恐怖障碍"],"A",1,"rw","人文综合","交通事故后于住院期间出现入睡困难、反复噩梦、脑中反复闪现撞车场景，核心是创伤事件的侵入性再体验。关键在病程：DSM-5 规定急性应激障碍（ASD）于创伤后 3 天至 1 个月内起病、症状持续 2 天至 4 周；而创伤后应激障碍（PTSD）要求症状持续超过 1 个月。本例症状发生在住院期间，通常不足 1 个月，应归入急性应激障碍，对应选项\"创伤性应激\"（A）。若症状持续超过 1 个月并伴持续回避、警觉性增高、负性认知与情绪改变，才诊断 PTSD（B）。C、E 强调对医院环境的焦虑与恐惧，D 为特定恐怖症，均不能解释创伤场景的反复闪回。\n\n📚 出处：《精神病学》第8版·应激相关障碍·急性应激障碍与创伤后应激障碍的鉴别"],["对有限器官供体的分配存在尖锐伦理问题，下列哪一点是绝大多数国家明确反对的",["供体应根据什么原则分配","谁应优先得到器官","由谁做出裁决","根据什么原则裁决","器官商品化（买卖）"],"E",1,"rw","医学伦理","器官来源短缺使分配原则、优先顺序、裁决主体等问题存在伦理争议，但多数国家立场一致地明确反对人体器官商品化（买卖），因为器官买卖把人当作手段、损害人的尊严，并会诱发对穷人的剥削和器官非法交易。我国《人体器官捐献和移植条例》亦明确器官捐献必须自愿、无偿，禁止买卖，故E正确。A、B、C、D属分配正义中的具体争议点，各国做法不同，并非一致反对的对象。\n\n📚 出处：《医学伦理学》第5版·器官移植伦理"],["某老年患者身患肺癌，生命垂危，家属明确要求不惜一切代价抢救，医生应选择",["有限度地治疗与抢救","说服家属彻底放弃治疗与抢救","实施积极安乐死","尊重家属意见，不惜一切代价进行抢救","必要时实施安乐死"],"D",1,"rw","人文综合","患者本人意愿不明、家属明确要求不惜一切代价抢救，此时医师应在尊重家属意见的基础上积极救治，同时做好症状控制与沟通，故按题库答案为D。但从伦理与法律看，过度治疗可能违背不伤害与有利原则，应以患者本人预嘱和最佳利益为准，并在沟通中说明预后、引导家属理性决策；A“有限度治疗”须以患者本人或合法代理人的意见为依据，不能由医师单方限缩。\n\n📚 出处：《医学伦理学》第5版·临终关怀与生命终末期决策"],["一位牙疼得很厉害的病人，怀着惴惴不安的心情来看医生，他担心他的牙齿保不住了，要拔掉，以前有好几个牙齿都是因为看得晚了而被拔掉了。以下是他跟医生的对话：病人：“医生，我牙痛了 5 天了，痛得要命啊，是不是又要拔掉啊？我这满嘴里没有几个好牙了，真倒霉！”医生：“你张开嘴，我检查一下。你嘴里还是好牙多，不要这么悲观！这个牙虽然烂到牙神经了，但是牙根还好，也不松动，经过治疗是可以保住的，不用拔掉。以后要尽量早点来看牙。”病人：“哦，可以保住，太好了，我就担心要拔掉，不用拔掉我就不担心了，医生，你给我治疗吧。”在以上沟通过程中，医生很好地应用了以下哪项沟通技能",["建立伙伴关系","预先准备","表达同理心","鼓励和肯定","非语言性沟通"],"D",1,"rw","医患沟通","医生在告知牙可保住的同时，用“你嘴里还是好牙多”“不用这么悲观”“经过治疗是可以保住的”等语言肯定患者的担忧、给予积极反馈，并鼓励其今后早就诊，属鼓励和肯定的沟通技能，故D正确。A建立伙伴关系强调共同制定方案、患者参与决策；B预先准备指谈话前了解病历资料；C表达同理心侧重对“怕拔牙”这一情绪的辨识与反馈；E非语言沟通指目光、表情、体态等，均非本例的主要技巧。\n\n📚 出处：《医患沟通学》·沟通技能·鼓励与肯定"],["一位病人来到门诊，医生说：“坐吧。”之后就一边问病人哪里不舒服，一边在写病历、开药。没等病人诉说完自己的不适，这位医生就把病历写好，把处方开出来了。在这个过程中，这位医生明显违背了建立和谐医患关系的哪一项原则",["预先准备","有效的非语言性交流","表达同理心","肯定和鼓励","建立伙伴关系"],"B",1,"rw","卫生法律法规","医师一边问诊一边写病历、开处方，全程不看患者，切断了目光交流、体态回应等非语言沟通渠道，患者难以感到被倾听和尊重，违背的是有效非语言性交流的原则，故B正确。A预先准备指谈话前掌握资料；C表达同理心指辨识并反馈患者情绪；D肯定和鼓励指给对方积极反馈；E建立伙伴关系指共同商定诊疗方案，均不是本例最主要违背的原则。\n\n📚 出处：《医患沟通学》·非言语沟通"],["关于医生的特殊干涉权，不适用的范围有",["患者要求了解自己疾病的真情，但当了解后不利于诊断治疗时","对精神病患者、意志丧失和自杀未遂等患者拒绝治疗时","患者要求了解自己疾病的真情但有可能产生不良影响时","人体试验，为保守试验机密时","人体试验性治疗时，虽然患者已知情同意，但对一些高危的试验时"],"D",1,"rw","人文综合","医师的特殊干涉权（父权式干预）适用于：患者要求了解病情真相但告知将不利于诊治时（A、C），精神病患者、意识丧失者、自杀未遂者拒绝治疗时（B），以及某些高危人体试验中虽已知情同意仍需限制的情形（E）。但以“保守试验机密”为由行使干涉权则不成立，D为应选答案。人体试验必须履行充分的知情告知，受试者的知情权与自愿退出权不因“试验机密”而受限。\n\n📚 出处：《医学伦理学》第5版·医师的特殊干涉权"],["中止医师执业活动二年以上，申请重新执业，应当由法定机构考核合格并履行何种程序",["重新登记","重新备案","重新注册","重新变更","无需其他程序"],"C",1,"rw","卫生法律法规","《执业医师法》规定，中止医师执业活动二年以上的，申请重新执业时，应当先接受培训并经考核合格，再依照规定重新注册，取得执业证书后方可执业，故C正确。A重新登记、B重新备案、D重新变更均非取得执业资格的法定程序；E无需其他程序，则使中止执业二年以上者不经培训考核即可执业，与法律规定的再注册要求相悖。\n\n📚 出处：《执业医师法》·执业注册"],["医学技术鉴定实行回避制度，下列哪一类关系可不回避",["父母","岳父母","兄妹","同学","姐弟"],"D",1,"rw","卫生法律法规","医学技术鉴定（含母婴保健医学技术鉴定、医疗事故技术鉴定）实行回避制度，鉴定人员与当事人有近亲属关系（父母、配偶、子女、兄弟姐妹、岳父母等）、有利害关系或其他可能影响公正鉴定的关系时应当回避。同学关系不属法定近亲属或利害关系，一般不构成回避事由，故D为“可不回避”项。A父母、B岳父母、C兄妹、E姐弟均属近亲属，须回避。\n\n📚 出处：《医疗事故处理条例》·医疗事故技术鉴定"],["发生医疗纠纷，医疗机构应当告知患者或者其近亲属的事项中下列不包括",["解决医疗纠纷的合法途径","有关病历资料、现场实物封存和启封的规定","知名律师的联系方式","有关病历资料复制的规定","有关病历资料查阅的规定"],"C",1,"rw","卫生法律法规","《医疗纠纷预防和处理条例》规定，发生医疗纠纷，医疗机构应当告知患者或其近亲属：解决医疗纠纷的合法途径，有关病历资料查阅、复制的规定，有关病历资料、现场实物封存和启封的规定等，故A、B、D、E均属应 疗事故。\n\n📚 出处：《医疗事故处理条例》·医疗事故的构成"],["个体自我意识发展的开始时期是",["婴儿期","幼儿期","学龄期","青春期","成人期"],"B",1,"rw","医学心理","自我意识的发展始于幼儿期：2～3岁儿童开始把自己当作主体来认识，出现“我”的表述，掌握代词“我”，自我评价开始萌芽，故B正确。A婴儿期心理发展以感知觉、动作和依恋为主，尚无明确的自我意识；C学龄期是自我评价与社会比较迅速发展的阶段，已属自我意识发展而非开始；D青春期是自我意识第二次飞跃（自我同一性探索）；E成人期自我意识已趋成熟稳定。\n\n📚 出处：《医学心理学》·心理发展·自我意识"],["医学心理学是",["研究心理变量与健康和疾病变量之间的关系","由德国人洛采首次提出","是应用心理学分支","促进医学模式向生物-心理-社会模式的转变","以上都正确"],"E",1,"rw","医学心理","医学心理学研究心理变量与健康和疾病变量之间的关系，由德国人洛采（Lotze）于19世纪中叶首次提出“医学心理学”一词，属应用心理学分支，并在推动医学模式由生物医学模式向生物-心理-社会模式转变中发挥重要作用，故A、B、C、D均正确，答案为E。只承认其中一项而否定其他，都会遗漏医学心理学的学科属性、历史来源和学科功能。\n\n📚 出处：《医学心理学》·绪论·学科概况"],["以下哪项不是生物-心理-社会医学模式的描述",["人体是非机器的，医疗也是非修理机器，医疗是医患互动的过程","医疗过程中考虑人的心理和社会因素对疾病诊断和治疗的影响","生物-心理-社会医学模式是医学模式发展的必然","现代医学就是把病人看作是有问题的机器，进行物理的修理","生物-心理-社会医学模式是一种系统论和整体观的医学模式"],"D",1,"rw","医学心理","生物-心理-社会医学模式把人看作生物、心理、社会属性的统一整体，医疗是医患互动的过程而非“修理机器”，诊治中须考虑心理社会因素的影响，它是系统论和整体观指导下的医学模式，也是医学模式发展的必然，故A、B、C、E均正确。D“把病人看作有问题的机器，进行物理的修理”正是被取代的生物医学模式的机械论观点，故D为错误描述、本题答案。\n\n📚 出处：《医学心理学》·医学模式"],["下面哪一心理学流派用条件反射来解释知识、技能及行为习惯的获得",["生物心理学","行为主义","认知心理学","人本主义","精神动力学"],"B",1,"rw","医学心理","行为主义以刺激-反应（S-R）为基本框架，用经典条件反射（巴甫洛夫）和操作条件反射（斯金纳）解释知识、技能、行为习惯乃至异常行为的获得与消退，故B正确。A生物心理学侧重心理活动的生理机制；C认知心理学以信息加工（注意、记忆、思维、决策）为对象；D人本主义强调人的潜能与自我实现；E精神动力学以潜意识冲突和早期经验解释行为。四者均不以条件反射作为知识与习惯获得的主要解释机制。\n\n📚 出处：《医学心理学》·心理学流派·行为主义"],["个体在觉察到威胁或挑战后，会产生一系列的生理和心理反应，这些反应称为",["心理冲突","心理应激","心理挫折","情绪","认知"],"B",1,"rw","医学心理","个体觉察到威胁或挑战后产生的一系列生理、心理和行为反应，总称为心理应激（应激反应），包括交感-肾上腺髓质和HPA轴激活的生理反应、认知评价与情绪反应以及应对行为，故B正确。A心理冲突指两个以上动机相互矛盾时的内心状态；C心理挫折指目标受阻后的失意体验；D情绪是应激反应中的成分之一，不能概括全部；E认知是应激的中介过程，同样只是其中一环。\n\n📚 出处：《医学心理学》·应激"],["当病后患者产生愤怒时，通常伴随的疾病归因方式为",["自己犯了错误","命运安排的","与生活习惯有关","别人的错误","自然灾难所致"],"D",1,"rw","人文综合","病后愤怒常源于“外归因—他责”的认知方式：患者把患病原因归结为别人的错误（如他人传染、医疗事故、家属疏忽、单位未保障），因而产生指向他人或医务人员的愤怒与攻击，故D正确。A自责内归因多导致内疚、抑郁；B归因于命运安排（宿命）多表现为无奈、被动接受；C归因于生活习惯也偏向自责；E归因于自然灾难属不可控的外部非人格因素，易产生恐惧、无助而非愤怒。\n\n📚 出处：《医学心理学》·病人角色与病人心理"],["关于心理量表使用的基本原则，以下叙述错误的是",["与测试对象建立和谐的关系","遵守心理测量的道德","选择标准化量表","控制测量结果","注意工具和测量结果保密"],"D",1,"rw","医学心理","使用心理量表应遵循：与受测者建立和谐关系、遵守心理测量的职业道德、选择信效度良好的标准化量表、注意工具和结果的保密、由受训人员实施并合理解释结果。D“控制测量结果”不是使用原则——测验结果应客观呈现、如实解释，人为控制或操纵结果违背测量的科学性与伦理要求，故D为错误项。A、B、C、E均为基本原则。\n\n📚 出处：《医学心理学》·心理测验·使用原则"],["一种比较持久、微弱、具有渲染性的情绪状态是",["心境","激情","心情","热情","应激"],"A",1,"rw","医学心理","心境是一种比较持久、微弱、具有渲染性的情绪状态，能使人的一切活动都染上相应情绪色彩，故A正确。B激情是短促、强烈、爆发性的情绪状态，伴明显生理变化和外部表现；C心情为日常用语，非规范的情绪分类概念；D热情是较强烈的肯定性情感倾向，不强调“微弱、渲染性”；E应激是面临威胁时高度紧张的情绪状态。\n\n📚 出处：《医学心理学》·情绪与情感"],["心理咨询和治疗的原则不包括以下哪项",["保密性原则","自愿性原则","对当事人负责","时间与感情限定","教育性原则"],"E",1,"rw","医学心理","心理咨询与治疗的基本原则包括保密性原则、自愿性原则、对来访者负责（维护其权益）、时间与感情限定原则、转介原则、价值中立原则等。“教育性原则”一般属教育教学或思想教育领域的原则，不是心理咨询与治疗的专门原则，把咨询等同于教育会破坏平等、非指导性的关系，故E为本题答案。A、B、C、D均属公认原则。\n\n📚 出处：《医学心理学》·心理咨询与心理治疗"],["目前我国医学伦理学主要的研究方向是",["公民道德问题","临床医学问题","公共道德的学说和体系","生命科学的发展","医学实践中的道德问题"],"E",1,"rw","医学伦理","医学伦理学以医学实践中的道德问题为主要研究方向，包括临床诊疗、医患关系、生命伦理（辅助生殖、器官移植、安乐死、人体试验）、卫生资源分配与卫生政策伦理等，故E正确。A公民道德问题属一般伦理学与社会公德研究；B临床医学问题属临床医学各学科的研究对象；C公共道德的学说和体系属伦理学理论；D生命科学的发展是医学伦理学的背景与研究对象之一，但不能涵盖临床与卫生政策层面的道德问题。\n\n📚 出处：《医学伦理学》·绪论·研究方向"],["在下列各项中，违背卫生部颁布的人类辅助生殖技术伦理原则的是使用",["捐赠的精子","亲属代孕","卵胞浆内单精子注射","捐赠的卵子","植入前胚胎遗传学诊断"],"B",1,"rw","医学伦理","我国人类辅助生殖技术与人类精子库伦理原则明确禁止实施代孕技术，包括亲属间代孕，故B属违背伦理原则的做法。A捐赠精子、D捐赠卵子须符合自愿、无偿、匿名和数量限制等要求，符合伦理；C卵胞浆内单精子注射是治疗严重男性因素不育的常规技术；E植入前胚胎遗传学诊断用于避免严重遗传病患儿出生，属允许的医学目的，均不违背伦理原则。\n\n📚 出处：《医学伦理学》第5版·人类辅助生殖技术伦理"],["以下哪项是医学伦理学的特征之一",["灵活性","集体性","继承性","组织性","非规范性"],"C",1,"rw","医学伦理","医学伦理学具有实践性、继承性、时代性（发展性）与规范性等特征。继承性表现为历代医德思想被世代传承并不断充实，如“医乃仁术”“大医精诚”至今仍是医德的重要渊源，故C正确。A灵活性、E非规范性与其规范学科的性质相反；B集体性、D组织性不是医学伦理学的学科特征，属组织管理范畴的表述。\n\n📚 出处：《医学伦理学》·绪论·学科特征"],["有严重缺陷的新生儿，其生死决定由谁作出最合适",["医生","父母与医生共同商量决定","有严重缺陷新生儿的父母","法官","以上都不对"],"B",1,"rw","人文综合","有严重缺陷新生儿的生死处置涉及患儿最佳利益、家庭负担与社会支持，任何一方单方决定都不妥当：由父母与医生共同商量决定，既尊重父母的监护权和家庭实际，又保证医学判断的专业性，并可经伦理委员会咨询，故B最合适。A由医生单方决定剥夺了父母的监护权；C完全交由父母决定，缺乏医学专业判断和对患儿利益的保障；D由法官裁决不符合我国实际，司法介入通常是事后的；E一概否定前述途径，不成立。\n\n📚 出处：《医学伦理学》第5版·生命伦理·严重缺陷新生儿"],["下列哪一项说法是错误的",["行善原则与人体试验是相矛盾的","行善原则是指为了病人的利益应施加的好处","行善原则要求医务人员不伤害病人，而且要促进他们的健康和幸福","行善原则比不伤害原则更加广泛","行善原则与人体试验是不矛盾的"],"A",1,"rw","人文综合","本题要求选出错误说法：行善原则要求医务人员以患者利益为目的施以好处、不伤害患者并促进其健康与幸福，它比不伤害原则内涵更广（既要求避免伤害，又要求积极促进利益）；行善原则与人体试验并不矛盾，规范的试验通过促进医学发展最终造福人类，正是在更大范围上践行有利原则，故B、C、D、E均正确。A称二者“相矛盾”，是对有利原则的误解，为本题答案。\n\n📚 出处：《医学伦理学》第5版·有利原则"],["医学伦理学是研究什么的一门学科",["行为方式","医学道德","法律规范","科研方法","医疗行为"],"B",1,"rw","医学伦理","医学伦理学是研究医学道德现象及其发展规律的科学，是伦理学与医学交叉形成的学科，研究对象是医疗实践中的道德关系、道德意识与道德规范，故B正确。A行为方式范围宽泛且不涉及善恶价值判断；C法律规范属法学研究对象，法律与道德虽相关但不同；D科研方法是方法学内容；E医疗行为只是道德问题发生的载体，不能等同于医学道德这一核心对象。\n\n📚 出处：《医学伦理学》·绪论·研究对象"],["以下符合临终关怀伦理原则的做法是",["想方设法延长病人的生命，以使其获得更长的寿命","研制更加安全可靠的药物，帮助病人安详辞世","由于临终病人生命质量通常都比较低，没有幸福可言，应及早放弃治疗","努力减轻临终病人的身体疼痛和心理不适，提高其生命质量","以上都不是"],"D",1,"rw","医学伦理","临终关怀的伦理原则是尊重生命尊严、不以延长生命为目标而以减轻痛苦、提高临终阶段生命质量为宗旨，给予生理、心理、精神与社会支持，使患者安详离世并支持家属，故D正确。A以延长寿命为目标，属过度治疗，违背临终关怀宗旨；B“研制药物帮助安详辞世”若指向致死性用药，则涉及安乐死的伦理争议；C以生命质量低为由放弃治疗，属消极对待；E一概否定，不成立。\n\n📚 出处：《医学伦理学》第5版·临终关怀"],["以下哪项不属于生殖技术的伦理问题",["谁应该是孩子的父母","影响后代的健康成长","导致人类伦理关系的混乱","影响人类基因的纯洁性","商品化问题"],"D",1,"rw","医学伦理","生殖技术的伦理问题主要有：配子、胚胎和孩子父母身份的确定（谁应该是孩子的父母）、对后代健康成长的影响、代孕等导致伦理关系混乱、配子与胚胎商品化、单身与同性伴侣的生育权、剩余胚胎的处置等，故A、B、C、E均属其伦理问题。D“影响人类基因的纯洁性”带有伪科学色彩，不是规范的伦理问题提法：生殖技术关注的是遗传安全与后代利益，而非所谓基因“纯洁性”。\n\n📚 出处：《医学伦理学》第5版·生殖伦理"],["在问诊过程中，以下哪项做法是错误的",["使病人理解无误","对病人的不良情绪立即批评","不打断病人的思路","不强迫病人回答有关隐私问题","必须防止暗示性套问"],"B",1,"rw","医患沟通","问诊时应使患者理解无误、不打断其思路、不强迫回答隐私问题、防止暗示性套问，并在患者情绪激动时给予接纳与疏导。B“对病人的不良情绪立即批评”错误：批评会阻断信息表达、损害信任，正确做法是先接纳情绪、表达共情，再引导其陈述，故B为错误项。A、C、D、E均为问诊中应遵循的做法。\n\n📚 出处：《医患沟通学》·问诊技巧"],["在医生不打断的情况下，多数患者叙述完病史大约需要几分钟",["半分钟","1分钟","1分钟半","2分钟","3分钟"],"D",1,"rw","人文综合","研究发现，若医师不打断，患者叙述完自己的病史和就诊原因平均约需1.5～2分钟，多数患者能在2分钟左右完成主诉陈述；而临床上医师常在患者开口十几秒后即打断，导致重要信息遗漏。故本题选D（2分钟）最接近研究结论。A半分钟、B 1分钟过短，C 1分半略偏短，E 3分钟偏长，均不如D符合观察结果。\n\n📚 出处：《医患沟通学》·问诊中的倾听"],["在医患沟通过程中如果要用医学术语，尽量避免采用哪种方法",["用图片解释说明","用模型解释说明","口头解释说明","用录像形象化解释说明","仍用专业术语解释，以显示自己的权威"],"E",1,"rw","医患沟通","使用医学术语时应配合图片、模型、录像等可视化手段或通俗化口头解释，帮助患者真正理解；唯一应避免的是“仍用专业术语解释以显示自己的权威”，这会使患者听不懂、无法有效知情，也背离以患者为中心的沟通理念，故E为答案。A、B、D属形象化解释手段，C口头解释是最基本的沟通方式，均有助于理解。\n\n📚 出处：《医患沟通学》·语言沟通"],["关于协商治疗方案的步骤，以下不恰当的是",["提供备选治疗方案","提出医生推荐的方案","了解患者倾向的治疗方案","替代患者做出治疗决策","协商双方都认可的治疗方案"],"D",1,"rw","人文综合","协商治疗方案的一般步骤是：提供备选方案并说明各自利弊、提出医师推荐的方案及理由、了解患者的倾向与顾虑、双方协商形成都认可的方案，最终由患者在知情基础上作出决定。D“替代患者作出治疗决策”剥夺了患者的自主决定权，即使出于善意也不恰当，故为本题答案。A、B、C、E均为协商的恰当步骤。\n\n📚 出处：《医患沟通学》·共同决策"],["与患者的非语言沟通技巧中，最直接也最常用的是",["目光凝视","面部表情","身体姿势及直接的身体接触","肢体动作","与患者之间的空间距离与位置"],"B",1,"rw","医患沟通","面部表情是非语言沟通中最直接、最常用也最富表现力的方式，能迅速传递喜怒哀乐、关心与理解，且不易完全掩饰，故B正确。A目光凝视属目光接触，作用重要但方式单一，长时间凝视还可能造成压迫感；C身体姿势与直接身体接触、D肢体动作需结合情境理解，且身体接触须注意性别与文化界限；E空间距离与位置主要影响亲密感和安全感，均不如面部表情直接、常用。\n\n📚 出处：《医患沟通学》·非言语沟通"],["就康复训练问题与术后的患者进行沟通，以下哪种做法可以调动患者的参与",["安慰患者什么都不用去想","请护士把患者的生活照顾好","确保患者理解康复训练对他的帮助","护士记录并向医生报告患者的康复训练情况","告诉患者康复训练是一项艰难的任务"],"C",1,"rw","医患沟通","调动术后患者参与康复训练的关键，是使其理解康复训练对自身功能恢复的具体帮助，形成内在动机与配合意愿，故C正确。A“什么都不用想”削弱其主体性；B由护士包办生活照料会强化依赖，与康复训练要求的主动参与相反；D由护士记录报告，患者仍处于被动地位；E强调训练艰难会加重畏难情绪，降低参与意愿。\n\n📚 出处：《医患沟通学》·遵医行为与康复指导"],["遇到难缠患者时，下列哪项措施欠妥",["对于表现极端焦虑或富有侵犯性的患者，应考虑是否需要心理治疗及药物缓解","在应付难缠患者时，医生应该坚守住底线，不能无原则让步","医生感到一个人难解决时，应寻求同事或医院的帮助","为了不影响医院整体工作，准备与患者及家属协商私下解决，答应对方要求","热情服务，详细查体，委婉地给予合理建议"],"D",1,"rw","人文综合","遇到难缠患者时，应评估其焦虑、攻击性并考虑心理干预或药物辅助（A），坚守原则底线、不作无原则让步（B），必要时寻求同事和医院支持（C），同时热情服务、详细查体、委婉建议（E），均属恰当措施。D为避免影响整体工作而与患者私下协商、答应其要求，属无原则妥协，可能损害患者利益、破坏制度并留下隐患，故为欠妥措施。\n\n📚 出处：《医患沟通学》·特殊患者沟通"],["以下哪项可称为“棘手病人”",["喜欢挑战医生的病人","文化程度低下的病人","人际关系有障碍的病人","想知道更多的病人","希望同医生展开讨论的人"],"C",1,"rw","人文综合","“棘手病人”通常指因人格特点、情绪状态或人际交往方式而使医患沟通困难的患者，如人际关系有障碍、多疑敏感、依从性差、反复投诉者，故C正确。A喜欢挑战医生的病人多表现为质疑与求证，可通过充分说明化解；B文化程度低可通过通俗解释改善；D想知道更多的病人是积极参与者，应予鼓励；E希望与医生展开讨论的人属共同参与型患者，均不属于典型的“棘手”范畴。\n\n📚 出处：《医患沟通学》·特殊患者沟通"],["在研究中，利益冲突可能会带来的危害是",["危害研究者-受试者之间的信托关系","危害医学这门作为“仁术”的专业","对受试者、研究者、研究机构和社会都有害","危害医患关系","危害病人或受试者"],"E",1,"rw","人文综合","研究中的利益冲突（如研究者与医药企业存在经济联系）会使研究者的判断偏离受试者利益，其最直接、最核心的危害是损害受试者（病人）的健康与权益，故E为最佳答案。A危害研究者与受试者之间的信托关系是机制层面的表现；B危害医学作为“仁术”的专业形象、D危害医患关系是延伸的社会后果；C“对各方都有害”表述过于笼统，未指出首要受损对象。\n\n📚 出处：《医学伦理学》第5版·科研伦理·利益冲突"],["关于提高遵医率的方法，下列哪项不合理",["建立融洽、合作的医患关系","强制患者执行","纠正患者不合理或错误的观念和认识","医护人员对患者耐心的解释和说明","采用必要的心理行为干预措施"],"B",1,"rw","人文综合","提高遵医率的合理方法包括建立融洽合作的医患关系、纠正患者不合理或错误的观念认识、耐心解释说明诊疗方案、采用必要的心理行为干预（如提醒、随访、简化用药），故A、C、D、E均合理。B“强制患者执行”违背自愿与尊重原则，可能激化对抗、降低依从，且除法律规定的强制医疗情形外无强制依据，故为不合理的方法。\n\n📚 出处：《医学心理学》·遵医行为"],["在诊疗活动中，医患双方应当",["相互戒备，时刻留存证据","持对立态度","互相尊重，维护自身权益时遵守有关法律、法规","有一方占绝对优势地位","一切以自身权益为首、为重"],"C",1,"rw","医患沟通","《医疗纠纷预防和处理条例》规定，医患双方应当相互尊重，维护自身权益时应当遵守有关法律、法规的规定，依法理性表达诉求，故C正确。A相互戒备、时刻留证会使医患关系陷入对立，不利于诊疗；B持对立态度违背医患共同对抗疾病的宗旨；D一方占绝对优势违背医患平等的法律地位；E一切以自身权益为首、为重，忽视了对方合法权益与患者利益优先的伦理要求。\n\n📚 出处：《医疗纠纷预防和处理条例》·医疗纠纷的预防"],["以一句话概括医生职业化精神及医德核心，下列哪项正确",["不惜一切代价给予病人正确、及时、有效的诊断治疗","以病人的利益为重，病人的利益高于一切","以尽可能最小的费用为病人达到最有效的治疗效果","医疗行为最重要是对得起自己的良心","医师必须努力学习，不断更新医学知识"],"B",1,"rw","医学伦理","医生职业精神与医德的核心是以病人利益为重、病人利益高于一切，这是“医乃仁术”和患者利益优先原则的集中表述，故B正确。A“不惜一切代价”可能导致过度医疗，忽视成本效益与不伤害；C强调以最小费用取得最有效效果，属合理用药与费用控制的原则，是具体要求而非核心；D“对得起自己的良心”停留在主观层面，缺乏客观的患者利益标准；E努力学习更新知识属业务要求，是核心的支撑条件。\n\n📚 出处：《医学伦理学》·医师职业精神"],["避免高科技在医学中应用出现负效应的主要办法是",["结合患者的经济条件","掌握高科技使用的范围","加强高科技在医学中使用的伦理学教育","关心病人，减少不必要检查","注意生态环境的保护"],"C",1,"rw","人文综合","高科技在医学中应用可能带来过度检查、费用攀升、医患关系物化、责任模糊等负效应，避免这些负效应的主要办法是加强高科技应用中的医学伦理学教育，使医务人员树立有利、不伤害、尊重、公正的价值尺度，从而把握技术使用的目的与边界，故C正确。A结合经济条件、D减少不必要检查只是具体措施，不能解决价值取向问题；B掌握使用范围若无伦理标准便失去依据；E生态环境保护与技术应用的伦理负效应无直接关联。\n\n📚 出处：《医学伦理学》·医学高技术应用伦理"],["在下列各项中，对病人不会造成伤害的是",["医务人员的知识缺乏","医务人员的行为疏忽和粗枝大叶","医务人员强迫病人接受检查和治疗","医务人员为治疗疾病适当地限制或约束病人的自由","医务人员的技能低下"],"D",1,"rw","人文综合","不伤害原则允许在有利于患者治疗的前提下施加可预见的、不可避免的轻微伤害或限制，为治疗疾病而适当限制或约束患者自由（如术后制动、传染病隔离、防跌倒约束）正属此类正当限制，故D对患者不构成伦理意义上的伤害。A知识缺乏、B行为疏忽和粗枝大叶、E技能低下均可导致本可避免的伤害，属技术性伤害；C强迫患者接受检查和治疗侵犯其自主权，属伦理与法律上的伤害。\n\n📚 出处：《医学伦理学》第5版·不伤害原则"],["关于医德良心的作用，下列正确的是",["行为中的评价","行为后的评价","行为前的监督","行为后的监督","行为中的选择"],"B",1,"rw","医学伦理","医德良心是医务人员在履行道德义务过程中形成的自我评价能力，其突出作用是对行为后果进行自我审视与评价，即行为后的评价（对合乎医德者感到欣慰，对违背者感到内疚自责），故B正确。A行为中的评价、C行为前的监督、E行为中的选择更接近医德理智、医德意志与义务感的作用；D行为后的监督表述不如“评价”准确，良心的功能核心是内在的道德审判与自我评价。\n\n📚 出处：《医学伦理学》·医德范畴·良心"],["《卫生部关于加强卫生行业作风建设的意见》中明确行业作风建设中通过综合治理，重点解决的是",["医疗卫生质量问题","医疗卫生服务问题","医疗卫生行业形象问题","损害人民群众切身利益的突出问题","卫生事业发展中面临的问题"],"D",1,"rw","人文综合","《卫生部关于加强卫生行业作风建设的意见》提出，通过综合治理，重点解决损害人民群众切身利益的突出问题，如收受红包回扣、开单提成、过度检查、乱收费等，故D正确。A医疗卫生质量问题、B服务问题属医疗业务管理范畴；C行业形象是作风建设的成效之一，是结果而非重点解决的对象；E事业发展中面临的问题过于宏观，未体现行风建设以群众利益为指向的要求。\n\n📚 出处：《卫生部关于加强卫生行业作风建设的意见》·行业作风建设"],["某男，54 岁，诊断为帕金森病。门诊医师告知需要抽血化验，即通知研究生(有执业资质)带去抽血。研究生因操作不熟练，神情慌张，家属不同意继续抽血，并严厉质问，研究生才告知该检查是进行临床研究的，但护士忙，只能自行抽血。下列说法正确的是",["进行临床试验研究，医务人员必须履行知情告知义务","抽血只能由护士进行，研究生不具有资质","研究生有知情告知责任，但门诊医师无知情告知责任","研究生无知情告知责任，但门诊医师有知情告知责任","应由护士行知情告知，研究生不具有资质"],"A",1,"rw","卫生法律法规","该抽血实际用于临床研究，属涉及人的生物医学研究，医务人员必须向受试者履行知情告知义务，说明研究目的、程序、风险与自愿退出权并取得同意，故A正确。B“抽血只能由护士进行”不成立，具备执业资质并经受训练的医师、研究生均可依规采血；C、D试图在门诊医师与研究生之间划分告知责任，实际上开展研究的医疗机构及其研究者均负有告知义务，不能相互推诿；E把告知主体限定为护士，同样错误。\n\n📚 出处：《医学伦理学》第5版·人体试验的知情同意"],["区医院的眼科医生因过失致一患者左眼失明，患者诉至区卫生局，区卫生局对此进行调查处理。下列构成横向卫生法律关系内容的是",["眼科医生接受处分的义务","区医院接受处罚的义务","区医院的医疗服务义务","患者要求区卫生局处理的权利","区卫生局处罚的权利"],"C",1,"rw","卫生法律法规","卫生法律关系按主体地位分为纵向（管理、监督）与横向（平等主体间的服务）关系。区医院与患者之间因医疗服务形成的权利义务属横向关系，故C“区医院的医疗服务义务”是横向卫生法律关系的内容。A医生接受处分的义务、B医院接受处罚的义务、D患者要求卫生局处理的权利、E卫生局处罚的权利，都发生在卫生行政部门与医疗机构或医务人员之间，属纵向（行政）法律关系内容。\n\n📚 出处：《卫生法学》·卫生法律关系"],["某儿童 8 岁，在智力测验中得分为 100，则其智商(IQ)为",["超常","优秀","平常","低下","智力缺陷"],"C",1,"rw","医学心理","采用离差智商时，智商以100为平均数、15为标准差，IQ 100恰位于平均水平的中心点，属平常（中等）智力，故C正确。通常按智商分级：130以上为超常（极优秀），120～129为优秀，110～119为中上，90～109为平常，80～89为中下，70～79为边界，70以下考虑智力低下或智力缺陷。A超常、B优秀、D低下、E智力缺陷均需偏离均值达到相应程度，与IQ 100不符。\n\n📚 出处：《医学心理学》·心理测验·智力测验"],["患者在第一次完成症状自评量表时没有注意到说明中“最近一周”的时间限定，经过医务人员的解释后患者重新填写了该量表，最可能的结果是",["第一次的结果与第二次相同","第一次的分数高于第二次","第二次的分数高于第一次","第一次符合“轻度”，第二次符合“中度”","无法预测"],"B",1,"rw","医学心理","症状自评量表（如SCL-90）要求评定“最近一周”的实际感觉。患者第一次未注意时间限定，把长期存在的症状一并按较重程度报告，分数因而偏高；经解释后按最近一周重新评定，症状范围收窄、程度取值更谨慎，故第二次分数通常低于第一次，即B正确。A忽略了两者评定时间窗不同；C方向相反；D缺乏依据，不能断定程度必然升级；E并非“无法预测”，时间限定对分数的影响方向是可预期的。\n\n📚 出处：《医学心理学》·心理评估·症状自评量表"],["德国一位女牙医助理马里翁在一次车祸中受重伤，送到医院后被判定为脑死亡。后来的全面检查表明：当时该“患者”腹中 4 个月的胎儿完全正常，如果“患者”凭借现代医术使植物人状态长期维持下去，就可以保证胎儿发育成熟，直至出生；如果让“患者”体面地死去，就必须撤掉生命维持系统。这个难题，要求医学服务",["认真解决医学上能不能做与伦理上应不应做的矛盾","认真解决临床诊断技术的问题","认真解决临床治疗技术的问题","认真解决服务态度的问题","认真解决医药卫生资源宏观分配的矛盾"],"A",1,"rw","人文综合","脑死亡孕妇能否靠生命维持系统长期维持以保全胎儿，反映的是“医学上能不能做”与“伦理上应不应做”之间的冲突：技术上可维持植物状态直至胎儿成熟，但涉及脑死亡判定标准、孕妇身体尊严、胎儿利益与医疗资源等伦理权衡，故A正确。B诊断技术、C治疗技术不是本例的核心难题；D服务态度与本例无关；E医药卫生资源宏观分配虽为伦理问题，但不是本例的焦点所在。\n\n📚 出处：《医学伦理学》第5版·生命伦理·脑死亡"],["刘某，男，肝癌晚期患者。虽处于极度痛苦之中，但自认为所患疾病是肝硬化，有望治疗。因此，每当有不适时，都希望医护人员能用药物帮助其缓解疼痛，但医护人员的回避态度令病人十分失望。一次，病人疼痛再次发作，要求止痛，又遭到医护人员的拒绝，理由是已按医嘱用药。面对类似病人，在医学道德上最佳的选择是",["一定时候征得家属同意后告诉病人实情，尽量满足病人要求，减轻痛苦","满足病人的部分要求，减轻痛苦","实情交代，告知病人无法治疗","继续隐瞒病情，被动治疗","回避患者，减少矛盾"],"A",1,"rw","医学伦理","患者误以为自己所患为肝硬化而抱有希望，极度疼痛却得不到有效缓解，医护回避更增加其失望。此时最佳选择是在适当时机征得家属同意后告知实情，同时充分满足其止痛等对症需求，既尊重知情权、又体现有利与不伤害，故A正确。B只满足部分要求、回避病情告知，患者仍在误解中做安排；C一次性实情交代“无法治疗”而不给支持，过于生硬；D继续隐瞒并被动治疗，忽视疼痛控制；E回避患者会加重其被抛弃感。\n\n📚 出处：《医学伦理学》第5版·保密与知情·癌症病情告知"],["患者尚 XX，女，因患“肝癌”于 2 年前做肝移植手术。术后 2 年复查中发现骨转移，医生现在要将此消息告知患者及其家属，以下谈话中你认为哪种开场语言最合适",["“尚女士，您好，今天我想让您明白您已经发生了肝癌的骨转移，我们很有可能要进一步做化疗。”","“尚女士，您好，全身骨扫描发现一些异常的骨密度增高信号，我们虽然不能肯定是不是癌症的转移，但您需要做好充分的准备。”","“尚女士，您好，您对您的病情的关心令我很赞赏，您能及时的来做复查也表明了您对自己身体的关心，但可能今天有些检查情况不像我们开始预期的那么好。”","“尚女士，您好，我仔细看了您的骨扫描结果，应该很像 2 年前的肝癌发生了转移，所以我要求您配合进一步的治疗。”","“尚女士，您好，我们都知道肝癌并不是做一次肝移植就能根治的，有时候癌症要发生转移，这也是医生最无能为力的地方。”"],"C",1,"rw","医学伦理","告知坏消息的开场应先建立信任、给予预警，再逐步引出不良信息，给患者心理准备的时间。C先肯定患者对自身健康的关心，再用“可能今天有些检查情况不像我们开始预期的那么好”作预警式铺垫，语气委婉而不失真实，最符合SPIKES的设定与预警步骤，故C正确。A直接抛出“已经发生骨转移”过于突兀；B以“不能肯定是不是转移”制造虚假希望；D“很像转移，所以我要求你配合”带有命令意味；E强调医生无能为力，易使患者陷入绝望。\n\n📚 出处：《医患沟通学》·告知坏消息（SPIKES）"],["一位患者去看消化科医生，在病史采集快要结束的时候，医生和患者有如下的对话。医生：“请你看一下我理解得正确吗？——您以前有点消化不良，但最近几周新增了一些问题，觉得前胸有一种尖锐的疼痛感，有嗳气和酸味。它让您无法睡觉，饮酒后更加严重，您怀疑是否要归咎于止痛药。对吗？”患者：“对，是这样的。”请问这位医生采用了病史采集的哪项技能",["询问就诊原因","问明患者的全部意向","核对病史内容","澄清患者的主诉","辅助病人讲述"],"C",1,"rw","人文综合","医生在病史采集结束前把自己理解到的信息（既往消化不良、近几周新增胸痛、嗳气反酸、夜间加重、饮酒后加重、怀疑止痛药）完整复述并请患者确认，属核对病史内容（信息复核）技能，故C正确。A询问就诊原因在问诊开头进行；B问明患者的全部意向指了解其就诊期望与担忧；D澄清主诉指对含义不明的表述进一步追问；E辅助病人讲述指用引导语帮助其继续叙述，均与“复述并请对方确认”的操作不符。\n\n📚 出处：《医患沟通学》·病史采集技能"],["下述哪项不符合颈内动脉系统缺血发作症状",["一过性失明","发作性偏瘫","猝倒发作","偏盲","失语"],"C",1,"lc","心血管系统","颈内动脉系统缺血表现为大脑半球（多为大脑中动脉区）和眼动脉受累：一过性单眼黑矇、对侧偏瘫或偏身感觉障碍、偏盲、失语（优势半球）。猝倒发作（drop attack）为无意识丧失的突发跌倒，由脑干网状结构、前庭核缺血引起，属椎-基底动脉系统症状，故C不符合。A为眼动脉缺血、B、D、E均为颈内动脉系统典型表现。\n\n📚 出处：《神经病学》第8版·脑血管疾病·短暂性脑缺血发作"],["关于“肠结核”的影像表现，下述错误的是",["增生型肠结核出现充盈缺损","跳跃征","溃疡型龛影检出率高","增生型肠结核肠管出现短缩、变窄","内瘘"],"C",1,"lc","呼吸系统","肠结核影像表现因类型而异：溃疡型以肠管痉挛、激惹为主，钡剂通过病变段时排空快，近、远端肠管充盈而病变段不充盈，即跳跃征；因溃疡表浅并沿肠壁环形分布，龛影检出率低、多不明显，故“溃疡型龛影检出率高”为错误表述。增生型以肉芽组织与纤维化为主，向腔内突出形成充盈缺损，并致肠管短缩、变窄与僵硬；病变穿透肠壁与邻近肠管或器官粘连可形成内瘘。跳跃征、充盈缺损、肠管短缩变窄、内瘘均属实。本题为反向选择。\n\n📚 出处：《医学影像学》第8版·胃肠道·肠结核"],["急性心肌梗死最常见的心律失常是",["预激综合征","心房颤动","房室传导阻滞","室性期前收缩及室性心动过速","非阵发性交界性心动过速"],"D",1,"lc","心血管系统","急性心梗后心律失常发生率75%～95%，以室性心律失常最多见，室性期前收缩（Lown高级别者）与室速最常见，且是发病24小时内猝死的主要原因，故监护与除颤最关键。房颤多见于老年、左心衰或心房梗死；房室传导阻滞多见于下壁心梗（右冠供血房室结）；预激综合征为先天旁路，非心梗所致。\n\n📚 出处：《内科学》第9版·冠心病·急性ST段抬高型心肌梗死"],["以下哪一种疾病不会有血小板减少",["特发性血小板减少性紫癜","过敏性紫癜","感染性紫癜","急性再生障碍性贫血","播散性红斑狼疮"],"B",1,"lc","血液系统","过敏性紫癜的本质是免疫复合物沉积于小血管壁，使血管壁通透性增高、脆性增加，属血管壁异常性出血，血小板计数正常（束臂试验可阳性）。ITP为血小板免疫性破坏而减少；感染性紫癜多经DIC、骨髓抑制使血小板下降；急性再障三系减少；SLE常有免疫性血小板减少。故无血小板减少者为过敏性紫癜。\n\n📚 出处：《内科学》第9版·过敏性紫癜"],["下列结果说明主动脉瓣关闭不全系风湿性的是",["主动脉瓣短缩、增厚、粘连伴狭窄","主动脉瓣环扩张","主动脉瓣呈二叶瓣","主动脉瓣增厚钙化","主动脉瓣根部扩张"],"A",1,"lc","心血管系统","风湿性主动脉瓣病变从瓣膜交界与瓣叶起病，形成交界粘连融合、瓣叶增厚短缩，故主闭几乎总伴狭窄（联合瓣膜病变）并可伴交界粘连，据此可判定为风湿性。瓣环扩张与主动脉根部扩张（马凡、夹层、老年）、二叶主动脉瓣（先天性）、瓣膜增厚钙化（老年退行性）病理基础不同，均不提示风湿。故选A。\n\n📚 出处：《内科学》第9版·心脏瓣膜病·主动脉瓣关闭不全"],["治疗过敏性紫癜的关键是",["抗过敏治疗","免疫抑制治疗","对症治疗","消除致病因素","应用止血药物"],"D",1,"lc","血液系统","过敏性紫癜是血管变态反应性疾病，治疗首要环节是寻找并消除致病因素：停用可疑药物与食物、积极控制感染、驱虫、避免再次接触过敏原，去除病因后多数可自限。抗组胺药、糖皮质激素、免疫抑制剂均属对症或二线措施（激素仅用于腹痛、关节痛、肾病综合征型），止血药无效。\n\n📚 出处：《内科学》第9版·过敏性紫癜"],["在治疗肺炎球菌肺炎使用青霉素时，错误的方法是",["一般患者每次肌注 80 万单位，每 8 小时 1 次肌注","每日剂量 800 万单位，加在 500 毫升输液中缓慢静滴","病情稍重者，宜用青霉素 G240 万～480 万 U/d，分 3 次静脉滴注","静脉滴药时每次用量应在 1 小时内滴完","对青霉素过敏者不可使用此药"],"B",1,"lc","呼吸系统","青霉素G为时间依赖性杀菌药，需小剂量、分次、短时（每次0.5～1小时内）滴入以维持有效血药浓度。将每日800万U一次性加入500ml液体中缓慢静滴，输液时间过长，药物室温下降解失效、达不到有效峰浓度，还增加容量负荷与局部刺激，故B为错误方法。A（80万U每8小时肌注）、C（重症240万～480万U/d分次静滴）均为分级用药的常规方案；D强调单次剂量应在1小时内滴完，符合给药原则；E青霉素过敏者禁用，正确。\n\n📚 出处：《内科学》第9版·肺炎·肺炎链球菌肺炎"],["关于缺铁性贫血的发病过程，以下正确的是",["血清铁降低→红细胞减少→小细胞低色素→骨髓铁减少","骨髓铁减少→血清铁降低→红细胞减少→小细胞低色素","血清铁降低→骨髓铁减少→小细胞低色素→红细胞减少","骨髓铁减少→血清铁降低→小细胞低色素→红细胞减少","红细胞减少→小细胞低色素→血清铁降低→骨髓铁减少"],"B",1,"lc","血液系统","缺铁按三阶段演进：贮存铁减少期（铁蛋白降低，骨髓铁减少，血清铁尚正常）→红细胞生成缺铁期（血清铁降低、总铁结合力升高、游离原卟啉升高）→缺铁性贫血期（红细胞减少、小细胞低色素）。故顺序为骨髓铁减少→血清铁降低→红细胞减少→小细胞低色素。小细胞低色素源于血红蛋白合成不足，出现在红细胞减少之后而非之前。\n\n📚 出处：《内科学》第9版·缺铁性贫血"],["皮质醇增多症时下列哪项不正确",["抑制脂肪合成","抑制蛋白质合成","嗜酸性粒细胞绝对值增高","血浆肾素水平增高","抑制垂体促性腺激素"],"C",1,"lc","内分泌与代谢","皮质醇增多症时糖皮质激素使骨髓释放减少、嗜酸性粒细胞绝对值降低（<0.05×10⁹/L有辅助诊断价值），故C“嗜酸性粒细胞绝对值增高”与病理生理方向相反，为应选项。皮质醇抑制外周蛋白质合成（B成立）、抑制外周脂肪合成而促躯干脂肪沉积形成向心性肥胖（A成立）、反馈抑制垂体促性腺激素致月经紊乱与性功能减退（E成立）；血容量扩张通常使肾素活性降低，D表述亦欠严谨，但本题特异性改变取C。\n\n📚 出处：《内科学》第9版·库欣综合征·临床表现与实验室检查"],["以下哪一项检查最有助于鉴别垂体性 Cushing 病和异位 ACTH 综合征",["尿 17-羟测定","尿 17-酮测定","血浆 ACTH 测定","CRH 兴奋试验","ACTH 兴奋试验"],"D",1,"lc","内分泌与代谢","垂体性库欣病为垂体ACTH微腺瘤，仍部分保留对CRH的反应，CRH兴奋后ACTH、皮质醇进一步升高；异位ACTH综合征的肿瘤自主分泌ACTH，不受CRH调控，故CRH兴奋试验最有鉴别价值，答D。尿17-羟反映皮质醇代谢产物总量、尿17-酮主要反映雄激素代谢，二者在两类病变均可升高，无鉴别意义；血浆ACTH在异位者多显著升高但与部分库欣病重叠；ACTH兴奋试验用于判断肾上腺皮质储备，不作二者鉴别。\n\n📚 出处：《内科学》第9版·库欣综合征·病因鉴别诊断"],["下列表述中正确的是",["胃上皮性肿瘤包括腺瘤、乳头状瘤、脉管性肿瘤等","胃间叶性肿瘤包括平滑肌瘤、脂肪瘤、神经纤维瘤、脉管性肿瘤、纤维瘤、类癌等","胃腺瘤通常可分为管状腺瘤、管状绒毛状和绒毛状腺瘤，其中以管状绒毛状腺瘤最为常见","胃息肉患者均需内镜下治疗","胃山田Ⅰ型息肉即广基息肉"],"E",1,"lc","临床综合","胃上皮性肿瘤只指源于黏膜上皮者，腺瘤、乳头状瘤属之，脉管性肿瘤来自间叶，故A错；类癌源于神经内分泌细胞，仍属上皮性，列入间叶性肿瘤不妥，B错；胃腺瘤以管状腺瘤最常见，不是管状绒毛状，C错；小而无症状的增生性息肉可定期随访，并非一律内镜切除，D错。山田分型按隆起起始部形态划分，Ⅰ型基底宽大平滑、无明显蒂部，即广基息肉，E正确。\n\n📚 出处：《外科学》第9版·胃十二指肠疾病（胃息肉与胃良性肿瘤）"],["急性气管-支气管炎的血象为",["白细胞计数多升高","白细胞总数多正常","中性粒细胞常升高","淋巴细胞常升高","多出现类白血病反应"],"B",1,"lc","呼吸系统","急性气管-支气管炎多由病毒（腺病毒、流感病毒、呼吸道合胞病毒等）感染引起，外周血白细胞总数与中性粒细胞分类多在正常范围，故白细胞总数多正常为最佳答案。合并细菌感染时可轻度升高，但非“多升高”；淋巴细胞升高多见于百日咳、结核等，非本病特征；类白血病反应见于重症感染、中毒、大量出血等，本病极少出现。\n\n📚 出处：《内科学》第9版·急性气管-支气管炎"],["尿道下裂的主要原因是",["父亲酗酒过度","孕期母亲接触农药","孕期母亲接触 X 线","孕期母亲吸烟过多","胎儿期睾酮缺乏或作用不足"],"E",1,"lc","泌尿系统","尿道下裂是尿道腹侧壁发育不全、尿道口异位，本质是胚胎期雄激素不足。尿道褶自后向前融合依赖胎儿睾酮及局部雄激素受体作用，睾酮合成障碍（如5α-还原酶缺乏、雄激素不敏感）或作用不足时融合中止，尿道口停留在阴茎腹侧。A~D所举孕期饮酒、农药、X线、吸烟均属可疑环境危险因素，缺乏确切病因学证据。故答E。\n\n📚 出处：《外科学》第9版·泌尿男生殖系统畸形（尿道下裂）"],["颅底骨折的诊断主要依靠",["颅底 X 线平片","脑电图检查","耳、鼻、喉科检查","临床表现","头部外伤史"],"D",1,"lc","神经与精神","颅底骨折多为线形骨折，颅底骨结构重叠、高低不平，X 线平片检出率低，危重患者又难以配合特殊体位，故不能作为诊断依据。脑电图反映脑功能，与骨折无关；耳鼻喉科检查仅为辅助；单纯外伤史只能提示可能性。真正的诊断依据是骨折部位与鼻旁窦或中耳相通、邻近脑神经损伤的表现：颅前窝骨折见“熊猫眼”征与脑脊液鼻漏；颅中窝骨折见脑脊液耳漏及面、听神经损伤；颅后窝骨折见 Battle 征及后组脑神经损伤。故主要依靠临床表现。\n\n📚 出处：《外科学》第9版·颅脑损伤·颅底骨折"],["低位室间隔缺损位于",["室间隔肌部","室间隔膜部、室上嵴上方","室上嵴下方","肺动脉瓣下","主动脉瓣下"],"A",1,"lc","心血管系统","室间隔缺损按位置分高位与低位：高位（膜部、室上嵴上方干下型）靠近主动脉瓣与肺动脉瓣；低位缺损位于室间隔肌部（流入部/肌部），远离半月瓣。故低位VSD位于室间隔肌部。B为高位膜部，C为膜周部，D、E为与半月瓣毗邻的高位类型，均不符合“低位”的含义。\n\n📚 出处：《外科学》第9版·先天性心脏病·室间隔缺损"],["上、下呼吸道的分界是",["鼻、口","咽","支气管","肺泡","喉、气管"],"E",1,"lc","呼吸系统","呼吸道以环状软骨下缘为界：其上方鼻、鼻窦、咽、喉属上呼吸道，下方气管、支气管及肺属下呼吸道。“喉、气管”所指即喉与气管之间的这一分界层面（环状软骨下缘），故为正确项。鼻口、咽均位于喉之上，以其为界会把喉排除在上呼吸道之外；支气管、肺泡则远在气管之下，不能作为上下呼吸道分界。\n\n📚 出处：《系统解剖学》第9版·呼吸系统"],["造成髌骨横骨折的原因可能是",["间接暴力","肌肉拉力","积累劳损","直接暴力","骨骼疾病"],"A",1,"lc","运动与骨外科","髌骨横形骨折多由间接暴力造成：跌倒时膝半屈位、股四头肌骤然猛烈收缩，牵拉力经髌骨传导并集中于骨的中部，超过其抗张强度即横行断裂，断端常分离，故答案为间接暴力（其具体作用力即股四头肌牵拉）。直接暴力如撞击、跪跌多致粉碎性（星状）骨折，且常伴膝前皮肤挫伤或开放伤口；积累劳损只引起应力性骨折；骨骼疾病所致为病理性骨折；单列“肌肉拉力”仅描述动力来源、未涵盖跌倒这一外力机制，表述不完整，故最佳答案为间接暴力。\n\n📚 出处：《外科学》第9版·下肢骨关节损伤·髌骨骨折"],["肱骨中下 1/3 骨折并发桡神经损伤会出现下列哪种手部畸形",["垂腕","猿手畸形","爪形手","银叉畸形","杵状指"],"A",1,"lc","神经与精神","桡神经在肱骨中下 1/3 的桡神经沟内紧贴骨面下行，该处骨折最易被骨折端挫伤或卡压。桡神经支配肱三头肌、肱桡肌及全部前臂伸肌群，损伤后伸腕、伸指、伸拇均不能，出现典型“垂腕”，并伴第 1、2 掌骨间背侧（虎口区）感觉减退。猿手见于正中神经损伤（大鱼际肌萎缩）；爪形手见于尺神经损伤（骨间肌、蚓状肌萎缩）；银叉畸形是 Colles 骨折的腕部外形；杵状指见于慢性缺氧性疾病。\n\n📚 出处：《外科学》第9版·周围神经损伤·桡神经损伤"],["右下肢被机动车压伤，具备下列哪项可诊断为骨折",["局部高度肿胀","压痛明显","下肢不能自主活动","反常活动","明显跛行"],"D",1,"lc","运动与骨外科","骨折特有体征为畸形、反常活动（假关节活动）、骨擦音或骨擦感，三者具其一即可确诊。患肢被机动车压伤后出现反常活动，说明骨连续性中断，可直接诊断骨折。局部高度肿胀、明显压痛、不能自主活动、跛行均属一般损伤表现，严重软组织挫伤、关节扭伤甚至单纯血肿也可出现，无特异性；确诊仍需X线。\n\n📚 出处：《外科学》第9版·骨折概论·骨折的临床表现与诊断"],["关于甲亢术前的药物准备，下列正确的是",["普萘洛尔不能与碘剂合用","硫脲类药物和碘剂不能合并应用","服用硫脲类药物控制甲亢症状后再进行手术","使用碘剂 2～3 周后，甲亢症状基本控制便可进行手术","服用普萘洛尔时应每 8 小时给药一次，术后应继续服用 2～3 周"],"D",1,"lc","内分泌与代谢","规范术前准备为：硫脲类药物控制甲亢症状后改用或加用复方碘溶液2周左右，使腺体缩小变硬、血供减少，甲亢症状基本控制即可手术，碘剂一般不超过3周，故D正确。单用硫脲类不能减轻腺体充血，症状控制后仍需碘剂准备，C表述不完整；硫脲类与碘剂联用是常规方案，B错；普萘洛尔可与碘剂合用，且应每6小时给药、术后继续服4～7天，A、E错。\n\n📚 出处：《外科学》第9版·甲状腺功能亢进的外科治疗·术前准备"],["逆行尿路造影的禁忌证是",["下尿路感染","尿频","膀胱结石","膀胱肿瘤","血尿"],"A",1,"lc","泌尿系统","逆行肾盂造影需经膀胱镜向输尿管口插管注入造影剂，下尿路感染时插管可将细菌推入肾盂，诱发医源性肾盂肾炎甚至菌血症，属禁忌；尿道狭窄、膀胱挛缩不能插管亦为禁忌。尿频、血尿、膀胱结石、膀胱肿瘤本身不是插管禁忌，血尿反而常为造影指征。故答A。\n\n📚 出处：《外科学》第9版·泌尿系统疾病的诊断方法"],["脑脓肿的典型 CT 表现为",["高密度圆形占位病变","伴有大面积脑水肿的低密度占位病变，可环形强化","仅为大面积脑水肿","脑实质内不规则低密度占位病变，明显均匀强化","中线移位，脑室受压"],"B",1,"lc","神经与精神","脑脓肿 CT 表现与分期有关：急性化脓性脑炎期为边界不清低密度区、无强化；包膜形成期（典型期）为低密度脓腔加周围较大范围血管源性水肿，增强呈完整、壁薄光滑、厚度均匀的环形强化。故 B 正确。A 称“高密度”错误，脓液为低密度；C 漏掉占位效应与环形强化；D“明显均匀强化”是实质性肿瘤（淋巴瘤、脑膜瘤）特点；E 中线移位、脑室受压是任何占位的间接征象，缺乏特异性。\n\n📚 出处：《外科学》第9版·颅内和椎管内感染·脑脓肿"],["以下对侧柱的描述，正确的是",["位于腰 1 至腰 5 脊髓侧角","是交感神经节前神经元胞体所在的部位","是副交感神经节后神经元胞体所在的部位","仅见于胸脊髓节段","传导内脏感觉"],"B",1,"lc","临床综合","侧柱即脊髓中间带外侧核，位于T1～L3节段侧角内，是交感神经节前神经元胞体聚集处，发出的节前纤维经前根至椎旁或椎前神经节换元，故B正确。A把范围写成腰1～腰5，超出实际节段；C混淆节前与节后，副交感节后神经元胞体位于器官旁或器官壁内神经节；D漏掉下胸段与上腰段；E内脏感觉经后角及中间带内侧核中继，不由侧角传导。\n\n📚 出处：《系统解剖学》第9版·中枢神经系统（脊髓内部结构）"],["有关不协调性宫缩乏力，下述不正确的是",["可以给予哌替啶肌内注射","产妇持续腹痛、拒按呼叫","多由于宫缩剂使用不当引起","子宫收缩极性倒置，底部强、下段弱","宫缩间歇期时子宫肌肉不能完全放松，压力处于高张状态"],"D",1,"lc","妇产科","不协调性宫缩乏力的本质是极性倒置：兴奋起搏点不在宫底，自下段向上传导，因此表现为下段强、宫底弱，且宫缩间歇期子宫肌不能完全放松而处于高张状态，产妇持续腹痛、拒按、呼叫不安，多因缩宫素使用不当或精神过度紧张引起。处理以哌替啶100mg肌注使产妇休息、恢复极性为主，必要时再加强宫缩。D项写“底部强、下段弱”，那正是协调性宫缩的特点，故为错误项。\n\n📚 出处：《妇产科学》第9版·异常分娩"],["有关胎膜早破的期待治疗，下述不正确的是",["卧床休息，密切观察体温、脉搏","定期肛诊或阴道检查，了解羊水及产程情况","应用宫缩抑制剂","小于 35 孕周者，胎儿肺未成熟者，给予地塞米松治疗","预防性应用抗生素"],"B",1,"lc","妇产科","胎膜早破期待治疗的要点是：绝对卧床（抬高臀部）、保持外阴清洁、动态监测体温、脉搏、胎心、宫缩及羊水性状；孕周小者给地塞米松促胎肺成熟，预防性应用抗生素，必要时用宫缩抑制剂。关键在于禁止不必要的肛诊和阴道检查——手指可将阴道内菌群带入宫腔，增加宫内感染和早产风险，只在临产或确有指征收缩时于消毒下检查。故B项“定期肛诊或阴道检查”错误。\n\n📚 出处：《妇产科学》第9版·胎膜早破"],["孕妇在怀孕前几个月禁止 X 线照射",["1～2 个月以内","3 个月以内","4 个月以内","5 个月以内","6 个月以内"],"B",1,"lc","妇产科","受精后3～8周（即停经5～10周）是胚胎器官分化形成的关键期，对电离辐射最敏感，可致流产、畸形或生长受限。故妊娠前3个月（12周内）应避免X线照射，必要检查须严格防护并权衡利弊，孕中晚期相对安全。答案取“3个月以内”。\n\n📚 出处：《妇产科学》第9版·妊娠生理与孕期保健"],["下列哪组方法诊断妊娠最可靠且简单",["停经史，内诊子宫增大，B 超见宫内胎囊胎芽、胎心，尿 HCG(＋)","早孕反应，内诊子宫增大，附件囊性小包块，尿 HCG(＋)","停经史，早孕反应，内诊子宫增大，尿 HCG(＋)","停经史，内诊子宫增大，B 超见宫内光团","停经史，胎动感，腹部渐膨隆"],"A",1,"lc","妇产科","诊断妊娠最可靠的是“看到胚胎本身”：B超见宫内妊娠囊、胎芽及原始心管搏动，加尿HCG阳性，既有病原学又有影像证据，且简便无创。C、E仅凭症状与子宫增大属临床推测；B的“附件囊性小包块”多指黄体囊肿，无法确定宫内妊娠；D“宫内光团”不能区分妊娠囊与假孕囊、积血，证据强度不足。\n\n📚 出处：《妇产科学》第9版·妊娠诊断"],["关于子宫内膜的病理变化，下列说法错误的是",["增生期子宫内膜是月经周期中的增生期的正常变化","无排卵型功血也可出现增生期子宫内膜","子宫内膜腺瘤型增生过长是一种癌前病变","子宫内膜腺囊型增生过长是无排卵性功血的表现","萎缩型子宫内膜是无排卵性功血的主要表现"],"E",1,"lc","妇产科","无排卵性功血因长期单一雌激素刺激，内膜呈持续增生状态，病理多为增生期子宫内膜、腺囊型或腺瘤型增生过长，仅少数长期低雌激素者呈萎缩型，故E“萎缩型为主要表现”错误。A正确，增生期子宫内膜属正常周期所见，也可出现在无排卵周期；C正确，腺瘤型增生过长属癌前病变；D正确，腺囊型增生过长为无排卵功血典型形态。\n\n📚 出处：《妇产科学》第9版·异常子宫出血"],["产后乳汁分泌的基础是",["避免精神刺激","吸吮动作反射引起的脑垂体后叶释放乳素","哺乳时的吸吮刺激","垂体乳素","产妇营养、睡眠、情绪"],"D",1,"lc","妇产科","乳汁分泌的基础是垂体前叶分泌的催乳素（PRL）。妊娠期雌激素、孕激素使乳腺发育但抑制泌乳，分娩后雌孕激素骤降，PRL得以发挥泌乳作用；吸吮刺激经神经反射抑制下丘脑多巴胺分泌，促使PRL脉冲式释放，是维持泌乳的必要条件。B错在“垂体后叶释放催乳素”——后叶释放的是缩宫素；营养、睡眠、情绪、避免精神刺激都是影响因素，不能作为基础。\n\n📚 出处：《妇产科学》第9版·正常产褥"],["下列哪项不是雌激素替代疗法的绝对禁忌证",["严重肝病","乳腺癌","脑血栓","冠心病","有不规则出血者"],"D",1,"lc","妇产科","性激素替代治疗（HRT）的绝对禁忌证包括：已知或可疑乳腺癌等雌激素依赖性肿瘤、不明原因阴道流血、活动性血栓栓塞性疾病（含脑血栓）、严重肝肾功能不全、妊娠、子宫内膜癌等。冠心病不属于绝对禁忌，属需个体化评估的相对禁忌/慎用情形（宜经皮制剂、注意血栓风险）。故“冠心病”为本题答案。\n\n📚 出处：《妇产科学》第9版·绝经综合征"],["首次产前检查的内容不包括",["常规胸片检查","常规妇科检查","心肺检查","测量基础血压","血、尿常规检查"],"A",1,"lc","妇产科","首次产前检查应详问病史，测量基础血压、体重、身高，全身查体（心肺听诊、甲状腺、乳房），常规妇科检查，化验血尿常规、血型、肝肾功能、空腹血糖、传染病筛查，必要时超声核对孕周。常规胸片不属于产前检查常规项目，仅在疑结核、心肺疾病时按指征进行，孕期应尽量减少放射线暴露，故A为不包括项。\n\n📚 出处：《妇产科学》第9版·孕期保健"],["在输卵管结扎术后，发生盆腔瘀血综合征是因为",["结扎了卵巢血管","结扎时损伤了子宫动脉而影响血液循环","手术损伤或术后粘连影响盆腔血液回流","手术时伤及了伴随的淋巴管，使淋巴液回流受阻","手术时误扎了圆韧带"],"C",1,"lc","妇产科","盆腔瘀血综合征的核心机制是盆腔静脉回流受阻、静脉淤血曲张。输卵管结扎术中的组织损伤、术后粘连可压迫或牵拉盆腔静脉丛，使卵巢静脉、子宫静脉回流障碍，出现慢性下腹坠痛、腰骶痛、性交痛、月经量多。结扎输卵管不影响卵巢血管，也不涉及子宫动脉、淋巴管及圆韧带，故A、B、D、E均非其成因。\n\n📚 出处：《妇产科学》第9版·盆腔淤血综合征"],["下列哪项是异位妊娠最具特异性的 B 超特征",["盆腔积血","子宫旁见液性暗区","宫腔外见胎心搏动","宫腔外见胚囊样结构","卵巢下方见液性暗区"],"C",1,"lc","妇产科","异位妊娠最具特异性的超声征象是宫腔外探及胎心搏动（原始心管搏动），可确定宫外活胎。宫外见胚囊样结构特异性略差，需与黄体囊肿、假孕囊鉴别；盆腔积血、子宫旁或卵巢周围液性暗区仅提示出血，盆腔炎、黄体破裂等也可出现，无定位价值。故最特异者为C。\n\n📚 出处：《妇产科学》第9版·异位妊娠"],["有关先天性肾上腺皮质增生症的实验室检查，下列不正确的是",["皮质醇和 ACTH 浓度常在正常范围内","11β-羟化酶缺乏症患儿，尿液 17-羟类固醇水平有增高","21-羟化酶缺乏症患儿，尿液 17-酮类固醇水平有增高","17α-羟化酶缺乏症患儿，血浆和尿中脱氧皮质酮明显增高","失盐型 21-羟化酶缺乏症患儿，血脱氧皮质酮明显增高"],"E",1,"lc","泌尿系统","21-羟化酶缺乏是最常见类型，该酶阻断使孕酮、17-羟孕酮堆积，而脱氧皮质酮(DOC)、皮质酮、醛固酮合成受阻，失盐型者血DOC与醛固酮均降低，故E描述错误。C该型尿17-酮类固醇升高、B在11β-羟化酶缺乏时17-羟类固醇升高、D在17α-羟化酶缺乏时DOC明显升高，均符合酶阻断后代谢流向。故答E。\n\n📚 出处：《儿科学》第9版·先天性肾上腺皮质增生症"],["下列哪种不是马蹄内翻足的畸形因素",["膝关节内翻","胫骨内旋","后足内翻","前足内收","踝关节跖屈"],"A",1,"lc","儿科","先天性马蹄内翻足由四个基本畸形构成：前足内收、后足内翻、踝关节跖屈（马蹄）和胫骨内旋，四者叠加形成典型足内翻下垂外观，故B、C、D、E均属其畸形要素。膝关节内翻与本病无关，膝关节并非畸形发生部位，检查时应重点评估足踝局部畸形与胫骨扭转，而非膝关节轴线。因此A为答案。\n\n📚 出处：《外科学》第9版·先天性马蹄内翻足"],["一足月新生儿，静脉血红细胞压积 75％，生后 12h 发生呼吸暂停。引起呼吸暂停的原因最可能是",["核黄疸","脑血栓形成","低血糖","肺动脉高压","低钙血症"],"B",1,"lc","儿科","足月新生儿静脉血红细胞压积达 75%（正常 45%～65%），属重度红细胞增多症，血液黏滞度显著升高，易在脑静脉窦及肾静脉形成血栓。生后 12h 出现呼吸暂停，最可能是脑血栓形成所致中枢性呼吸调节障碍（B）。核黄疸需有重度高胆红素血症基础；低血糖、低钙血症所致呼吸暂停多在生后早期且伴相应血糖/血钙证据；肺动脉高压多见于持续胎儿循环，与本例红细胞压积升高无直接因果。\n\n📚 出处：《儿科学》第9版·新生儿红细胞增多症-高黏滞度综合征"],["下列关于小儿肿瘤和成人肿瘤异同的说法，哪项不正确",["成人恶性肿瘤以腺癌为最常见，儿童以胚胎性肿瘤及肉瘤为主","成人以脏器为主，儿童以软组织、骶尾部、腹膜后间隙多见","成人和小儿肿瘤如有包膜，均为恶性","小儿肿瘤具有肿瘤和畸形双重特性","成人肿瘤，细胞的不完全分化和细胞核有丝分裂象一般象征恶性"],"C",1,"lc","儿科","良性肿瘤大多有完整包膜，恶性肿瘤反而常无包膜、呈浸润性生长，故“有包膜即为恶性”说法错误，C为答案。儿童恶性肿瘤以胚胎性肿瘤（肾母细胞瘤、神经母细胞瘤、肝母细胞瘤）及肉瘤为主，成人以腺癌多见（A对）；儿童好发于软组织、骶尾部及腹膜后间隙（B对）；儿童肿瘤常合并先天畸形，具肿瘤与畸形双重特性（D对）；成人细胞分化差、核分裂象多提示恶性（E对）。\n\n📚 出处：《外科学》第9版·小儿肿瘤"],["关于消化道重复畸形的治疗，下列哪一项是正确的",["胃的囊肿型重复畸形不需手术切除","十二指肠重复畸形不能采用开窗术","小肠重复畸形一经确诊均应手术治疗","肠的囊肿型及短段肠管型重复畸形也要切除全结肠","重复畸形肠段的粘膜内有时有迷生的胃粘膜及胰腺组织，不必处理"],"C",1,"lc","消化系统","小肠重复畸形可并发出血、肠梗阻、穿孔、肠扭转甚至恶变，一经确诊即应手术，故C正确。胃囊肿型重复畸形若反复出血或压迫幽门同样需切除（A错）；十二指肠重复畸形与十二指肠共用血供，宜行开窗（囊肿-肠管吻合）内引流而不宜切除（B错）；肠囊肿型或短段肠管型只需切除重复肠段或开窗，不必切除全结肠（D错）；迷生的胃黏膜、胰腺组织正是出血和穿孔的根源，必须一并切除（E错）。\n\n📚 出处：《外科学》第9版·小肠疾病·消化道重复畸形"],["水痘皮疹的特点是",["疱疹透亮，周围焮红","疱疹混浊，周围焮红","疱疹愈后留有瘢痕","丘疹，疱疹，皮疹同时并见","疱疹易破"],"D",1,"lc","儿科","水痘皮疹分批出现，由斑丘疹迅速变为疱疹、再结痂，同一部位可见丘疹、疱疹、结痂同时存在，即所谓“四世同堂”，为本病最具特征性表现，故选D。疱疹初起清亮如露珠、周围有红晕，其后可变混浊，故A、B仅描述某一阶段，不能概括特点；水痘疱疹浅表，脱痂后一般不留瘢痕，C错；疱疹壁薄易破虽常见，但特异性不如分批同现。\n\n📚 出处：《儿科学》第9版·水痘"],["免疫是指",["机体识别排除抗原性异物的功能","机体抗感染的功能","机体清除自身衰老、死亡红细胞的功能","机体对病原微生物的防御能力","机体识别排除自身突变细胞的功能"],"A",1,"lc","风湿免疫","免疫是机体识别和排除抗原性异物、维持自身生理平衡与稳定的功能，包括免疫防御（抗感染）、免疫自稳（清除衰老死亡细胞）和免疫监视（清除突变细胞）三方面，A 是对免疫功能最完整准确的概括。B 抗感染仅属免疫防御，是免疫功能的一部分；D 对病原微生物的防御能力同样只是防御功能；C 清除自身衰老死亡红细胞属免疫自稳的举例；E 清除自身突变细胞属免疫监视的举例，均以偏概全。\n\n📚 出处：《医学免疫学》第7版·免疫学概论"],["有关影响肿瘤对化疗敏感性的因素，下列不正确的是",["肿瘤的病理类型及分化程度","肿瘤大小及浸润范围","药物类型及选择","给药方案及给药途经","患者的性别及年龄"],"E",1,"lc","基础与预防医学","化疗敏感性取决于肿瘤自身增殖动力学及药物与肿瘤的相互作用，与患者性别、年龄无独立关系。A 病理类型及分化程度决定生长分数与倍增时间，分化越低、增殖越快者越敏感；B 肿瘤大小及浸润范围影响药物能否渗透至全部瘤细胞，体积大、血供差者敏感性下降；C 药物类型须与肿瘤细胞周期特异性匹配；D 给药方案（剂量强度、间隔）与途径直接决定瘤内药物浓度及暴露时间。E 非公认影响因素，故为不正确答案。\n\n📚 出处：《病理学》第9版·肿瘤"],["造成先天性甲状腺功能低下的最主要原因是",["碘缺乏","甲状腺或靶器官反应性低下","甲状腺合成过程中酶的缺乏","甲状腺不发育或发育不全","促甲状腺激素缺乏"],"D",1,"lc","内分泌与代谢","先天性甲状腺功能减退症最常见的原因是甲状腺发育异常，包括甲状腺不发育、发育不全或异位，占全部病例的大多数，故答D。碘缺乏所致者见于地方性克汀病，属环境因素而非先天发育缺陷；甲状腺激素合成过程中酶（过氧化物酶、脱碘酶等）缺陷为少见遗传病因；靶器官反应性低下（甲状腺激素抵抗）更罕见；TSH缺乏属继发性甲减，由下丘脑-垂体病变引起，均非最主要原因。\n\n📚 出处：《内科学》第9版·甲状腺功能减退症·病因"],["佝偻病后遗症期的主要表现是",["血磷下降，血钙正常","睡眠不安及多汗","X 线长骨骼端呈毛刷状改变","骨骼畸形","肌肉韧带松弛"],"D",1,"lc","儿科","佝偻病后遗症期多见于2岁以后，经治疗或自然恢复后临床症状消失，血钙、血磷及碱性磷酸酶均恢复正常，X线骨骼病变亦消退，仅遗留不同程度的骨骼畸形，如鸡胸、漏斗胸、O型或X型腿、脊柱后凸等，故D正确。血磷下降、睡眠不安多汗（A、B）为活动期（初期）表现；X线干骺端毛刷状、杯口状改变见于激期（C）；肌肉韧带松弛亦属活动期肌张力低下表现（E）。\n\n📚 出处：《儿科学》第9版·维生素D缺乏性佝偻病"],["甲状旁腺癌诊断的确切指标是",["肿瘤体积大","肿瘤质地较硬","肿瘤细胞异型性明显","肿瘤组织间有宽大胶原纤维束","肿瘤有浸润和转移"],"E",1,"lc","内分泌与代谢","甲状旁腺癌与甲状旁腺腺瘤的鉴别核心是生物学行为：出现包膜及周围组织（肌肉、神经、甲状腺）浸润或远处转移（肺、骨）即为癌的确切证据，故E是唯一可确诊的指标。肿瘤体积大、质地硬、细胞异型性明显、间质内有宽大胶原纤维束（纤维带），在部分甲状旁腺腺瘤特别是非典型腺瘤中也可出现，只能提示恶性可能；临床若见血钙、PTH显著升高伴骨受累亦提示癌，但形态学确诊仍靠浸润转移。\n\n📚 出处：《病理学》第9版·内分泌系统疾病·甲状旁腺肿瘤"],["伤寒病的临床主要表现应除外",["持续高热","外周血白细胞增多","皮肤玫瑰疹","肝、脾肿大","相对缓脉"],"B",1,"lc","传染病","伤寒由伤寒沙门菌经消化道感染引起，典型表现包括持续高热（多为稽留热，A）、皮肤玫瑰疹（C）、肝脾肿大（D）、相对缓脉（E），以及表情淡漠、食欲减退、腹胀等中毒症状。实验室特点是外周血白细胞减少、中性粒细胞减少、嗜酸性粒细胞消失，与化脓性细菌感染的白细胞增高相反，故“外周血白细胞增多”不属于伤寒表现，选 B。\n\n📚 出处：《传染病学》第9版·伤寒"],["临床上常见的子宫颈糜烂为",["宫颈鳞状上皮因炎症或损伤而坏死、脱落，形成表浅的缺损","宫颈鳞状上皮假上皮瘤样增生","宫颈黏膜腺体和间质纤维结缔组织呈局限性增生","宫颈黏膜的腺腔被黏液或化生的鳞状上皮堵塞使黏液潴留，腺体扩大","子宫颈管内柱状上皮外移取代受损伤的宫颈阴道部的鳞状上皮"],"E",1,"lc","妇产科","临床所称的宫颈“糜烂”实为宫颈管内柱状上皮在雌激素作用下向外移位于宫颈阴道部，取代该处受损伤的鳞状上皮，因柱状上皮薄、间质血管透见而呈红色细颗粒状，称宫颈柱状上皮异位，并非真性溃疡坏死。A描述的是真性糜烂（炎症坏死缺损）；B为鳞状上皮假上皮瘤样增生；C为宫颈肥大（纤维结缔组织增生）；D为宫颈腺囊肿。\n\n📚 出处：《妇产科学》第9版·子宫颈炎症"],["反映红细胞体积大小异质性的参数是",["MCV","MCHC","RDW","MCH","HCT"],"C",1,"lc","血液系统","RDW为红细胞分布宽度，是血细胞分析仪测得的红细胞体积变异系数（CV），正常约11.5%～14.5%，专门反映红细胞体积大小的异质性（大小是否均一）。MCV是平均红细胞体积、MCH为平均血红蛋白量、MCHC为平均血红蛋白浓度、HCT为血细胞比容，均为均值指标，不能反映体积离散程度。\n\n📚 出处：《诊断学》第9版·血液一般检查"],["肝硬化患者血清免疫学检查，发现免疫球蛋白的 IgM 显著增加，血清抗线粒体抗体强阳性(1:128)。最可能的诊断是",["肝炎后肝硬化","原发性胆汁性肝硬化","酒精性肝硬化","血吸虫性肝硬化","血色病所致肝硬化"],"B",1,"lc","消化系统","IgM显著升高伴抗线粒体抗体（AMA）强阳性（≥1∶40即有诊断意义，本例达1∶128）是原发性胆汁性胆管炎（旧称原发性胆汁性肝硬化）的特征性免疫学改变，故B正确。肝炎后肝硬化以IgG升高为主、自身抗体多阴性或低滴度；酒精性肝硬化常IgA升高；血吸虫性肝硬化以门脉周围纤维化为特点；血色病以铁代谢指标异常（铁蛋白、转铁蛋白饱和度升高）为特点，AMA均阴性。\n\n📚 出处：《内科学》第9版·自身免疫性肝病·原发性胆汁性胆管炎"],["下列哪项不属于纤溶酶的生理作用",["裂解纤维蛋白原","裂解纤维蛋白","水解多种凝血因子","灭活蛋白 C","水解补体"],"D",1,"lc","血液系统","纤溶酶是丝氨酸蛋白酶，底物广泛：降解纤维蛋白原与纤维蛋白（生成FDP、D-二聚体），水解凝血因子Ⅱ、Ⅴ、Ⅷ、Ⅸ、Ⅹ、Ⅺ等多种凝血因子，还可水解补体C3、C5并激活补体系统。灭活活化蛋白C的是蛋白C抑制物与α1-抗胰蛋白酶，并非纤溶酶，故D不属于其生理作用。\n\n📚 出处：《病理生理学》第9版·凝血与抗凝血平衡紊乱"],["椎管内应用氯胺酮的常用剂量为",["0.5mg/kg，一般不超过 1.0mg/kg","1～2mg/kg","0.1～0.2mg/kg","10mg/kg","7mg/kg"],"A",1,"lc","外科总论与麻醉","氯胺酮用于椎管内（多为硬膜外腔）辅助镇痛时，用量远小于静脉麻醉量，常用0.5mg/kg，单次总量一般不超过1.0mg/kg，故A正确。剂量过大易出现拟精神症状、血压升高、肌张力增高和呼吸抑制。B的1～2mg/kg是静脉麻醉给药量；C的0.1～0.2mg/kg低于椎管内镇痛所需；D、E的7～10mg/kg已属中毒剂量，可致抽搐、呼吸停止。\n\n📚 出处：《临床麻醉学》第4版·椎管内麻醉"],["下列哪种情况下不能使吸入麻醉药的 MAC 增加",["高热","慢性酗酒","高钠血症","长期使用三环类抗抑郁药","低钾血症"],"E",1,"lc","外科总论与麻醉","使MAC升高的因素有：体温升高（高热）、高钠血症、慢性酗酒（中枢耐受）、长期使用三环类抗抑郁药等使中枢儿茶酚胺增高的药物，以及青年。低钾血症不属于升高MAC的因素，慢性低钾反而使MAC下降，故“不能使MAC增加”的是E。A、B、C、D均可使MAC升高，是常见考点。\n\n📚 出处：《临床麻醉学》第4版·吸入麻醉"],["关于维库溴铵，以下说法正确的是",["为短效肌松药","能引起较明显的组胺释放","有抗迷走神经作用","可经 Hofmann 消除","对心血管影响小"],"E",1,"lc","外科总论与麻醉","维库溴铵是氨基甾类中效非去极化肌松药：起效与维持时间居中，非短效（A错）；几乎不释放组胺（B错）；无抗迷走神经作用，不引起心率增快（C错）；主要经肝代谢、肾排泄，不发生Hofmann消除，后者是阿曲库铵、顺阿曲库铵的特点（D错）；对心血管影响小、无蓄积，适用于心血管功能差或休克病人，故E正确。\n\n📚 出处：《临床麻醉学》第4版·肌肉松弛药"],["儿童最常见的肝脏肿瘤是",["肝胚细胞瘤","转移性疾病","多囊肝","肝脏纤维化","肝脓肿"],"A",1,"lc","儿科","儿童肝脏原发恶性肿瘤以肝母细胞瘤（肝胚细胞瘤）最常见，多发生于3岁以下婴幼儿，表现为肝大、腹部包块，血清甲胎蛋白明显升高，可伴性早熟；肝细胞癌在儿童少见且多见于年长儿。转移性疾病、多囊肝、肝纤维化、肝脓肿均非儿童肝脏最常见的肿瘤性病变，故A正确。\n\n📚 出处：《外科学》第9版·小儿肝脏肿瘤"],["关于肾自截，以下说法错误的是",["结核性脓肾","全肾钙化","肾功能完全丧失","肾动脉栓塞","肾盂肾盏纤维化闭塞"],"D",1,"lc","泌尿系统","肾自截是肾结核晚期：结核性脓肾使肾盂、肾盏及输尿管纤维化闭塞，干酪样物与钙盐沉积致全肾钙化，肾实质破坏殆尽、功能完全丧失，患肾呈“自截”状态。其血管改变为结核性动脉内膜炎所致渐进性狭窄，而非肾动脉栓塞（后者为急性肾梗死）。故“肾动脉栓塞”说法错误，答D。\n\n📚 出处：《外科学》第9版·泌尿男生殖系统结核"],["以下哪项关于镜面反射的叙述是正确的",["当界面大于波长时发生","当界面小于波长时发生","由于界面小于 3mm 而发生","与入射角无关","以上都不是"],"A",1,"lc","神经与精神","超声成像中，当声束遇到的界面尺寸大于波长时，声波在界面上发生镜面反射，反射角等于入射角，服从几何光学规律；界面小于波长时则发生散射，能量向各方向辐射，故 A 对 B 错。3mm 只是区分“大界面/小界面”的经验界限，以“由于界面小于 3mm 而发生”表述因果不准确。镜面反射强度与入射角密切相关，垂直入射回声最强、角度越大回声越弱，故 D 明显错误。E 不成立。\n\n📚 出处：《医学影像学》第8版·超声成像·超声的物理特性"],["骨转移在骨显像中出现哪种放射性分布，更适宜核素治疗",["放射性减低区","放射性缺损区","放射性增高区","放射性分布正常区","放射性低密度区"],"C",1,"lc","运动与骨外科","核素治疗（如锶-89、钐-153、镭-223）依赖病灶对放射性药物的选择性摄取与滞留，其前提是病灶局部成骨代谢活跃、呈放射性浓聚（热区）。放射性减低区、缺损区提示溶骨为主或血供差，药物无从聚集，疗效差；分布正常区并非病灶。故骨显像见多发浓聚灶者更适宜核素内照射治疗。\n\n📚 出处：《核医学》第9版·骨显像与骨转移瘤的核素治疗"],["安静时脑耗氧量占全身耗氧量的",["5%","10%","15%","20%","30%"],"D",1,"lc","神经与精神","脑重仅占体重的 2%，但安静时脑耗氧量约占全身总耗氧量的 20%（约 50ml/min），脑血流量约占心输出量的 15%，葡萄糖消耗约占全身 25%。这种“高代谢、高灌注、低储备”的特点决定了脑对缺血缺氧极敏感：血流完全中断 5～10 秒即意识丧失，中断 5 分钟以上皮层神经元发生不可逆损害。5%、10%、15% 均低估，30% 为高估。\n\n📚 出处：《神经病学》第8版·神经系统的解剖、生理及病损的定位诊断"],["γ衰变时",["子核的质量数和原子序数均不变，仅能量状态有改变","子核的质量数改变，而原子序数不变","子核的质量数不变，而原子序数改变","子核的质量数和原子序数均改变","子核的质量数、原子序数及能量状态均不变"],"A",1,"lc","医学影像与检验","γ 衰变是激发态原子核通过发射光子回到低能态或基态的过程，只是核内能量状态改变，质子数和中子数都不变，故子核的质量数与原子序数均不变，仅能量状态不同，A 正确。β⁻ 衰变中子转质子使原子序数加 1、质量数不变；β⁺ 衰变与电子俘获使原子序数减 1；α 衰变质量数减 4、原子序数减 2，故 B、C、D 均描述的是 α 或 β 衰变。E 否认能量状态改变，与 γ 衰变定义矛盾。\n\n📚 出处：《核医学》第9版·放射性衰变"],["关于螺旋 CT 扫描优点，下述哪项不对",["缩短扫描时间","明显提高空间分辨率","减少病人接受 X 线剂量","容积扫描","减少图像的运动伪影"],"B",1,"lc","神经与精神","螺旋 CT 采用滑环技术，扫描时检查床连续匀速移动、X 线管连续旋转，获得连续容积数据，故扫描时间明显缩短（A 对）、运动伪影减少（E 对）、可任意层面重建（D 对），并因效率提高而降低受照剂量（C 对）。但空间分辨率主要取决于探测器孔径与重建矩阵，螺旋扫描因层厚插值反而使 Z 轴分辨率略降；其真正进步是时间分辨率与纵向分辨率（各向同性）。故“明显提高空间分辨率”不正确。\n\n📚 出处：《医学影像学》第8版·X线计算机体层成像·CT的特殊扫描技术"],["软 X 线摄影所用管电压是",["25kV 以下","30kV 以下","35kV 以下","40kV 以下","45kV 以下"],"D",1,"lc","医学影像与检验","X 线按线质分为软 X 线与硬 X 线，管电压越低光子平均能量越低、穿透力越弱、组织对比越好。软 X 线摄影指管电压在 40kV 以下的摄影，主要用于乳腺、咽喉、软组织，钼靶乳腺摄影常用 25～35kV，故为 D。25kV 以下、30kV 以下、35kV 以下范围过窄，不能概括全部软组织摄影；45kV 以下已进入硬 X 线范围，穿透力增强、对比下降，不符合软 X 线定义。\n\n📚 出处：《医学影像学》第8版·X 线成像基本原理"],["下列卵巢癌 MRI 描述中，错误的是",["卵巢癌囊性部分的壁常厚薄不均，可见结节状或菜花状突起","盆腔内软组织肿块，与子宫分界不清","肿瘤内部有坏死或出血时，病灶信号可不均匀","实性肿瘤于 T1WI 呈略低信号，T2WI 呈高信号影","增强扫描时，肿瘤无明显强化"],"E",1,"lc","妇产科","卵巢癌多为血供丰富的实性或囊实性肿块，MRI增强扫描时肿瘤实质、囊壁及壁结节均呈明显强化，且强化不均匀，这正是恶性与良性囊肿的重要鉴别点，故E错误。其余描述正确：囊壁厚薄不均、有结节或菜花状突起；与子宫分界不清提示浸润；坏死出血使信号不均；实性部分T1WI略低、T2WI高信号。\n\n📚 出处：《超声医学》第6版·女性生殖系统"],["CT 成像是利用了 X 线的什么特性",["衰减","生物","荧光","电离","感光"],"A",1,"lc","神经与精神","CT 成像的物理基础是 X 线的衰减：X 线穿过人体后因组织密度、原子序数、厚度不同而发生不同程度的吸收与散射，探测器测得透射线强度并经模/数转换得投影数据，由计算机用滤波反投影或迭代算法重建出反映线性衰减系数（CT 值）分布的断层图像。故 A 正确。电离主要与放射治疗及剂量测量相关，荧光用于 X 线透视荧光屏，感光用于传统胶片成像，均不是 CT 的成像依据。\n\n📚 出处：《医学影像学》第8版·X线计算机体层成像·CT成像基本原理"],["脑膜瘤血管造影的特征表现是",["肿瘤染色","静脉早显","颈外动脉供血","肿瘤血管栏栅状排列","血管弧形包绕移位"],"C",1,"lc","神经与精神","脑膜瘤为脑外肿瘤，绝大多数由颈外动脉的脑膜中动脉及颈内动脉脑膜支供血。脑血管造影见颈外动脉分支增粗、迂曲，呈“日光放射状”向肿瘤供血，是最具定性价值的表现，并可见持久肿瘤染色、引流静脉早显、邻近血管受压呈弧形移位。但肿瘤染色、静脉早显在胶质母细胞瘤、动静脉畸形中也可出现，血管弧形包绕移位仅反映占位效应，特异性不足。故选颈外动脉供血。\n\n📚 出处：《外科学》第9版·颅内肿瘤·脑膜瘤"],["肾积水声像图特点是",["暗区分布于肾下极","暗区为圆形","暗区分布于肾实质","肾肿大，向外凸出","暗区分布于肾窦"],"E",1,"lc","泌尿系统","肾积水的声像图特征：肾窦（肾中央集合系统）分离，出现无回声暗区，其分布沿肾窦向外周呈花瓣状/放射状（\"车辐征\"）扩张；轻度仅肾盂分离，中度肾盏也扩张，重度则肾实质变薄、肾体积增大。故\"暗区分布于肾窦\"最符合（E）。\nA\"分布于肾下极\"错（肾积水是中央集合系统扩张，非局限下极）；B\"暗区为圆形\"过于简单，囊肿才是典型圆形；C\"分布于肾实质\"错（肾实质内无回声区提示囊肿）；D\"肾肿大向外凸出\"是重度积水的继发表现，非特征性分布描述。\n\n📚 出处：《超声医学》第6版·泌尿系统·肾积水的超声表现"],["下列哪项不是昏迷程度的分级",["嗜睡","昏睡","晕厥","浅昏迷","深昏迷"],"C",1,"lc","神经与精神","意识障碍由轻到重依次为嗜睡、意识模糊、昏睡、昏迷，昏迷又分浅昏迷、中昏迷、深昏迷，故 A、B、D、E 均属意识（昏迷）程度分级范畴。晕厥是一过性全脑低灌注所致的短暂意识丧失，数秒至数分钟完全恢复，属“发作性意识丧失”，其分类（血管迷走性、心源性、脑源性等）与昏迷深浅分级无关，故不属于昏迷分级。\n\n📚 出处：《神经病学》第8版·意识障碍·意识障碍的分类"],["下列哪项不是体循环淤血的症状或体征",["双下肢水肿","食欲减退","肝大","呼吸困难","无尿"],"D",1,"lc","心血管系统","体循环（右心）淤血表现为颈静脉怒张、肝大压痛、下肢水肿、腹水、胃肠道及肝淤血致食欲减退腹胀，故A、B、C属之。呼吸困难是肺循环淤血（左心衰）的表现，不属体循环淤血；无尿反映心排量下降、肾灌注不足，也不是淤血本身。最不符合的典型项为呼吸困难，选D。\n\n📚 出处：《内科学》第9版·心力衰竭·慢性心力衰竭"],["下列心律失常都应给予相应处理，除了",["发作性室上性心动过速","室性心动过速","心房颤动伴快速心室率","第一度与第二度Ⅰ型房室传导阻滞","第三度房室传导阻滞"],"D",1,"lc","心血管系统","第一度与第二度Ⅰ型房室传导阻滞多为迷走张力增高、药物或下壁心梗所致的一过性改变，无症状者去除诱因、观察随访即可，无需药物或起搏干预；而阵发性室上速、室速、房颤伴快速心室率均可致血流动力学障碍，三度房室传导阻滞有晕厥（阿斯综合征）风险，均需积极处理（药物、电复律或起搏）。故选D。\n\n📚 出处：《内科学》第9版·心律失常·房室传导阻滞"],["关于冠心病伴肝硬化上消化道出血的治疗，下列错误的是",["三腔管压迫","去甲肾上腺素胃管滴注","垂体后叶素静脉滴注","6-氨基己酸静脉滴注","冰盐水洗胃"],"C",1,"lc","心血管系统","垂体后叶素含加压素，强烈收缩内脏及冠状动脉血管，可诱发冠脉痉挛、心肌缺血甚至心梗，冠心病患者禁用或属相对禁忌，故C是错误的治疗。三腔管压迫止血、去甲肾上腺素冰盐水胃管灌注、6-氨基己酸、冰盐水洗胃均为肝硬化上消化道出血的常规手段，对冠心病影响较小。\n\n📚 出处：《内科学》第9版·肝硬化·上消化道出血的治疗"],["导致碳氧血红蛋白血症的毒物是",["有机磷","吗啡","乙醇","一氧化碳","安眠药"],"D",1,"lc","血液系统","一氧化碳与血红蛋白的亲和力约为氧的210～250倍，迅速形成碳氧血红蛋白（HbCO），使其失去携氧能力，并阻碍氧合血红蛋白解离、抑制细胞色素氧化酶，造成组织双重缺氧。有机磷抑制胆碱酯酶；吗啡、安眠药抑制呼吸中枢；乙醇为中枢抑制剂，均不形成HbCO。故选一氧化碳。\n\n📚 出处：《内科学》第9版·急性一氧化碳中毒"],["下列各项组合中，能准确判断酸中毒严重程度和代偿情况的是",["动脉血和尿的 pH 值","动脉血 pH 值和 HCO3","动脉血和静脉血 pH 值","动脉血和静脉血 PaCO2","静脉血和尿的 pH 值"],"B",1,"lc","理化与中毒","判断酸中毒的严重程度主要看 HCO3- 下降的幅度，判断代偿是否充分则要看 PaCO2 是否按预计代偿公式相应下降（或升高），因此必须同时测定动脉血 pH 与 HCO3- 并结合 PaCO2 才能评价，故 B 正确。尿 pH 只反映肾小管酸化能力，受饮食、泌尿系感染和利尿剂影响，不能定量反映酸碱失衡（A、E 错）；静脉血 pH 与动脉血存在组织代谢差，不能替代动脉血气（C、D 错）。\n\n📚 出处：《内科学》第9版·酸碱平衡失调"],["关于磁疗，以下叙述不正确的是",["磁疗除装有心脏起搏者外尚无绝对禁忌证","年老体弱患者及幼儿患者宜从小剂量开始","根据磁片的表面磁场强度与人体对磁场强度的总接受量均可分为 3 级","按人体对磁场强度的总接受量，磁场强度在 2000GS(0.2T)以上就称为强磁场量","磁疗疗程的长短根据病情与治疗方法决定"],"D",1,"lc","理化与中毒","磁疗剂量有两个分级依据：按磁片表面磁场强度分低、中、高三档，按人体对磁场强度的总接受量也分三档。按总接受量分级时强磁场的界限高于 2000GS(0.2T)，题干的界值错误，且把两个分级体系混为一谈，故 D 不正确。装有心脏起搏器者是磁疗的绝对禁忌，其余多为相对禁忌，A 正确；老弱、幼儿宜从小剂量开始，B 正确；两个依据均分 3 级，C 正确；疗程由病情和治疗方法决定，E 正确。\n\n📚 出处：《康复医学》第6版·磁疗法"],["关于慢性阻塞性肺疾病全身训练，说法错误的是",["下肢训练可明显增加患者的活动耐量","下肢训练通常采用有氧训练方法","下肢训练不应包括力量训练","上肢训练可做手摇车训练和提重物训练等","上肢训练以运动时出现轻度气急、气促为宜"],"C",1,"lc","呼吸系统","肺康复中下肢训练是COPD运动训练的核心，采用步行、蹬车等有氧训练可显著提高活动耐量与运动耐力；同时必须结合抗阻／力量训练以改善肌力与去脂体重，故“下肢训练不应包括力量训练”说法错误。上肢训练常采用手摇车、提重物、弹力带等；强度以运动时出现轻度气急、气促为宜，避免明显呼吸困难与血氧下降。本题为反向选择。\n\n📚 出处：《内科学》第9版·慢性阻塞性肺疾病·康复治疗"],["下列与平衡功能无关的是",["躯体感觉系统","自主神经系统","肌力","肌张力","前庭系统"],"B",1,"lc","临床综合","维持平衡依赖前庭系统、视觉和躯体本体感觉三种传入信息的整合，再由肌力、肌张力与协调运动完成姿势调整，故A、C、D、E均相关。自主神经系统主要调节内脏活动、血管舒缩和腺体分泌，不参与姿势与平衡的控制环路，因此与平衡功能无关。\n\n📚 出处：《康复医学》第6版·平衡与协调功能评定"],["食管壁包括",["粘膜层、粘膜下层、肌层、浆膜层","粘膜层、粘膜下层、肌层、固有层","粘膜层、粘膜下层、肌层、外膜层","粘膜层、粘膜肌层、肌层、浆膜层","粘膜层、粘膜肌层、肌层、纤维层"],"C",1,"lc","消化系统","食管壁自内向外为黏膜层、黏膜下层、肌层和外膜层四层，故C正确。食管绝大部分位于后纵隔，表面仅覆疏松结缔组织构成的外膜，没有浆膜层，因此A、D所列浆膜层错误；固有层是黏膜层的组成部分（内有淋巴小结和食管腺导管），不能与黏膜层并列，B错；纤维层不是规范名称，E错。\n\n📚 出处：《系统解剖学》第9版·消化管·食管"],["咽后脓肿多局限于一侧是因为",["咽后脓肿多较小","咽壁的纤维组织在后壁正中上形成咽缝","咽后隙在中线处被咽缝分隔为左右两部分","咽后脓肿形成的脓腔较局限","以上均不是"],"C",1,"lc","眼耳鼻喉口腔","咽后隙位于椎前筋膜与颊咽筋膜之间，上起颅底、下通纵隔，其在中线处被两侧来的筋膜（咽缝）分隔为左右两个互不相通的间隙，故化脓后脓液受中线纤维隔限制，多局限于一侧。B只说纤维组织在后壁正中形成咽缝，未点明“分隔咽后隙”这一关键机制，是最易误选的干扰项；A、D只是对脓腔大小的现象描述，属结果而非原因；E显然错误。\n\n📚 出处：《耳鼻咽喉头颈外科学》第9版·咽科学·咽的应用解剖"],["上、下呼吸道的分界是",["舌骨下缘","会厌下缘","甲状软骨下缘","环状软骨下缘","声门"],"D",1,"lc","呼吸系统","上、下呼吸道以环状软骨下缘为界：环状软骨以上（鼻、鼻窦、咽、喉）为上呼吸道，环状软骨以下（气管、支气管）为下呼吸道。环状软骨是喉部唯一完整的软骨环，其下缘即喉与气管的交界，故为正确答案。舌骨下缘、会厌下缘、甲状软骨下缘均位于喉内，声门亦为喉腔结构，若以此为界会把部分喉归入下呼吸道，不符合解剖学定义。\n\n📚 出处：《系统解剖学》第9版·呼吸系统"],["Gullstrand 简易模型眼的特点是",["将角膜和房水分别简化为单一球面","将角膜和晶状体分别简化为单一球面","将晶状体和玻璃体分别简化为单一球面","将所有光学界面简化为单一球面","将所有屈光介质简化为单一球面"],"B",1,"lc","眼耳鼻喉口腔","Gullstrand精细模型眼有多个折射面，计算繁琐，其“简易模型眼”只保留两个折射面，即将角膜（连同前房）和晶状体各简化为单一球面，用简化参数推算成像，故B正确。A错在把房水单独列为一个球面界面；C错在把玻璃体当球面界面；D、E把全部界面或屈光介质合并为一个球面，是极端错误理解。\n\n📚 出处：《眼科学》第9版·眼科学基础·眼的生理生化"],["滤过手术失败最常见、最主要的原因是",["合并有全身疾患","患者房角完全关闭所致","结膜下组织纤维化及滤过泡瘢痕形成","未及时应用药物","术前眼压过高"],"C",1,"lc","外科总论与麻醉","青光眼滤过手术成功的标志是形成功能良好的滤过泡。术后结膜下成纤维细胞增殖、胶原沉积，导致结膜下组织纤维化和滤过泡瘢痕化，使滤过通道闭塞，这是滤过手术失败最常见、最主要的原因，故C正确。全身疾病、术前高眼压、房角关闭程度、未及时用药只影响手术条件与眼压控制水平，不是滤过失败的直接主因。\n\n📚 出处：《眼科学》第9版·青光眼"],["关于 Coats 病的描述，正确的是",["常累及双眼","具有遗传性","自然病程预后好","与系统性血管异常无关","常在成年期发病"],"D",1,"lc","眼耳鼻喉口腔","Coats病是特发性视网膜毛细血管扩张症，表现为视网膜血管异常扩张、大片硬性渗出与胆固醇结晶，属眼局部血管异常，不伴全身系统性血管病变，故D正确。A错：绝大多数单眼发病；B错：多为散发，无确切遗传性；C错：自然病程预后差；E错：好发于男性儿童，多见于10岁前。\n\n📚 出处：《眼科学》第9版·视网膜病·视网膜血管病"],["毛周角化症与小棘苔藓的不同之处是",["毛囊性丘疹","无自觉症状或瘙痒","分布对称","毛囊口有角栓，内含卷曲的毛发","预后好"],"D",1,"lc","皮肤性病","毛周角化病与小棘苔藓同属毛囊性角化性皮肤病，二者均有毛囊性丘疹（A）、分布对称（C）、无自觉症状或仅轻微瘙痒（B）、预后良好（E），这些共同点不能用于鉴别。真正的区别在角栓形态：毛周角化病毛囊口有角质栓塞，其中常含卷曲变形的毳毛；小棘苔藓的丘疹顶端为细丝状坚硬角质小棘，毛囊内无卷曲毛发。故D为鉴别要点。\n\n📚 出处：《皮肤性病学》第9版·毛周角化病"],["下列不符合单基因病特点的是",["符合孟德尔遗传规律","有常染色体显性遗传、常染色体隐性遗传和性连锁遗传三种方式","遗传病的特征不一定是特异性的","多个基因作用引起的疾病","单一基因作用引起的疾病"],"D",1,"lc","基础与预防医学","单基因病由一对等位基因突变引起，遵循孟德尔规律，按遗传方式分为常染色体显性、常染色体隐性、X 连锁显性、X 连锁隐性（及 Y 连锁）遗传（A、B、E 正确）。C 遗传病表型常受外显率、表现度影响，表现并不总是特异的，说法成立。D 多个基因共同作用、呈数量性状遗传的是多基因病（如高血压、糖尿病），不属单基因病特点，故 D 为答案。\n\n📚 出处：《医学遗传学》第7版·单基因遗传病"],["家族性良性慢性天疱疮的病理特点是",["海绵形成","空泡变性","棘层松解","角化不全","颗粒层消失"],"C",1,"lc","皮肤性病","家族性良性慢性天疱疮（Hailey-Hailey病）为ATP2C1基因突变所致，病理本质是表皮基底层上方广泛的棘层松解：棘细胞间连接丧失而呈部分松解，形成“倒塌的砖墙”样外观，基底层仍附着于基底膜呈“墓碑”样排列。海绵形成（A）见于湿疹皮炎；空泡变性（B）见于扁平苔藓、红斑狼疮；角化不全（D）与颗粒层消失（E）见于银屑病等，均非本病特征。\n\n📚 出处：《皮肤性病学》第9版·天疱疮"],["关于思维贫乏，以下说法正确的是",["是急性精神分裂症的常见症状","是慢性精神分裂症的常见症状","是抑郁症的常见症状","是躁狂症的常见症状","是焦虑症的常见症状"],"B",1,"lc","神经与精神","思维贫乏指联想数量减少、概念与词汇贫乏，言语内容空洞单调、回答简单，是精神分裂症阴性（缺损）症状的核心表现之一，多见于慢性期或以阴性症状为主的病例，常与情感淡漠、意志减退并存。急性期以阳性症状（幻觉、妄想、思维破裂）为主，思维贫乏不突出。抑郁症为思维迟缓（思路变慢而非内容枯竭），随心境改善而恢复；躁狂症为思维奔逸；焦虑症为思虑纠缠而无贫乏。\n\n📚 出处：《精神病学》第8版·精神分裂症·临床表现"],["有关情感障碍生化研究的描述，正确的是",["具有自杀倾向的抑郁症患者脑脊液中 5-羟吲哚乙酸(5-HIAA)含量增高","抑郁症患者脑脊液和血浆中γ-氨基丁酸(GABA)含量升高","β2 受体功能下调与临床抗抑郁药的作用有密切关系","SSRIs(选择性 5-羟色胺再摄取抑制剂)类药物主要促进去甲肾上腺素(NE)和 5-羟色胺(5-HT)的再摄取","利血平使 5-HT 耗竭可以治疗抑郁症"],"C",1,"lc","神经与精神","受体假说认为：抗抑郁药长期治疗可使突触后 β 肾上腺素受体及 5-HT2 受体数量减少、功能下调，这一“受体下调”的时程与临床起效滞后 2～4 周相吻合，是抑郁的生化机制之一，故 C 正确。有自杀倾向者脑脊液 5-HIAA 降低而非增高；抑郁患者 GABA 降低而非升高；SSRIs 是抑制而非促进 5-HT 再摄取，且主要作用于 5-HT 而非 NE；利血平耗竭单胺类递质，是诱发抑郁的药理学模型，不能治疗抑郁。\n\n📚 出处：《精神病学》第8版·心境障碍·神经生化研究"],["慢性焦虑状态即广泛性焦虑症，一般没有下列哪项症状",["震颤","气透不过来，濒死感","出汗、面色苍白","心跳加快，尿频、尿急","胸部紧压感"],"B",1,"lc","神经与精神","广泛性焦虑障碍以持续、泛化、无明确对象与固定内容的担忧为核心，伴运动性不安（震颤、坐立不安）和自主神经功能亢进：心悸、出汗、面色苍白、胸闷胸部紧压感、气促、尿频尿急、口干、头晕，故 A、C、D、E 均可见。而“气透不过来伴濒死感、失控感”是惊恐发作（急性焦虑发作）的典型特征，起病突然、数分钟达高峰、多在 20 分钟内缓解，不属于慢性广泛性焦虑的常见表现。\n\n📚 出处：《精神病学》第8版·焦虑障碍·广泛性焦虑障碍"],["男，58 岁，上腹痛 1 个月，既往有胃溃疡病史 20 年。胃镜见胃角 2.0cm×2.0cm溃疡。给予质子泵抑制药治疗 8 周，症状缓解。复查胃镜：胃角 1.2cm×1.2cm溃疡。治疗失败最可能的原因是",["特殊溃疡","溃疡癌变","非消化性溃疡","药物疗程不足","药物选择错误"],"B",1,"lc","消化系统","老年男性、20年胃溃疡史，胃角（胃癌好发部位）2.0cm溃疡经规范PPI治疗8周仅缩小至1.2cm而不愈合，属难治性溃疡，首位必须排除癌变，B正确。恶性溃疡可部分缩小形成假性愈合，不能因缩小而放松随访，应重复胃镜并多点深取材活检。特殊溃疡（巨大溃疡、Zollinger-Ellison综合征）与非消化性溃疡不能完整解释本例；8周已是胃溃疡标准疗程，D、E不成立。\n\n📚 出处：《内科学》第9版·消化性溃疡·良恶性溃疡鉴别"],["男性，18 岁学生，不出门怕见人，不去上课，纠缠父母出钱给自己做美容手术半年。原因是半年来反复照镜子发现自己的鼻子比以前变大了，难看了。说班上的同学都讥笑他，出门就感觉别人在说他，别人的眼光看他时很特别，能使他头痛。父母不愿出钱就说父母不关心他，父母不是亲生的，曾说要去做亲子鉴定。判断一种抗精神病药是否有效至少要足量使用的时间是",["4 周","5 周","6 周","7 周","8 周"],"C",1,"lc","神经与精神","患者有躯体变形妄想、关系妄想、被害及非血统妄想，行为怪异、社会功能明显受损，应考虑精神分裂症。抗精神病药疗效判定有明确时限：急性期以治疗剂量足量用药 4～6 周为一疗程，若 6～8 周仍无任何改善方可判为无效并换药；阳性症状多在 2 周内起效，阴性症状与功能改善更慢。故判断“是否有效”至少需足量使用 6 周，过早减量或换药是临床常见错误。\n\n📚 出处：《精神病学》第8版·精神分裂症·药物治疗"],["男性，35 岁，腹痛 2 天伴呕吐、腹胀。查：血清淀粉酶 750Somogyi 单位，血压 80/50mmHg，脉搏 120 次/分。最恰当的诊断为",["急性肠梗阻伴休克","急性出血坏死型胰腺炎并休克","急性心肌梗死","急性胃炎","幽门不全梗阻"],"B",1,"lc","心血管系统","中年男性，持续腹痛伴呕吐腹胀，血清淀粉酶750 Somogyi单位（>500即有诊断意义），并出现血压80/50mmHg的休克，符合急性出血坏死型（重症）胰腺炎并发休克。肠梗阻淀粉酶一般不显著升高且以腹胀、肠鸣改变为主；急性心梗疼痛位于胸骨后、淀粉酶不高；急性胃炎与幽门梗阻均不引起休克。\n\n📚 出处：《外科学》第9版·胰腺疾病·急性胰腺炎"],["患者，女性，23 岁，既往有头部外伤史。近 2～3 年经常在白天一般日常活动中突然大叫一声，意识丧失，跌倒在地，四肢强直，眼球上翻，口吐白沫，有时带血沫。查体：面色青紫，瞳孔散大，对光反射消失，有尿失禁，先强直后阵挛，然后逐渐停止，意识恢复。每次发作持续 3～5 分钟，每月发作 1～2 次。今日发作 1 次来诊，神经系统检查未见阳性体征，头面颈部可见烫伤瘢痕。首选的治疗方法是",["避免诱因，继续观察","发作时口服抗癫痫药，不发作不吃药","发作时肌注地西泮","手术治疗","按抗癫痫药应用原则口服抗癫痫药"],"E",1,"lc","泌尿系统","患者反复发作性意识丧失、四肢强直阵挛、尿失禁、发作后意识恢复，每月1~2次，属继发性全面强直-阵挛发作，已达需长期规范治疗的标准。抗癫痫用药须遵循单药、足量、长期规律口服、缓慢减停的原则；不能发作时吃药、不发作停药，也不能仅肌注地西泮临时处理；无明确致痫灶不首选手术。故答E。\n\n📚 出处：《神经病学》第8版·癫痫"],["男性，57 岁，无痛性间歇性肉眼血尿 2 个月。查体：一般情况良好，腹部未扪及肿块，双肾区无叩击痛。直肠指检：前列腺增大，光滑，无结节。B 超检查：双肾未见异常，膀胱内有一 2cm×2.5cm 实质占位。对明确诊断最有帮助的检查是",["CT 检查","尿细胞学检查","尿流式细胞学检查","膀胱镜检查＋活检","膀胱造影"],"D",1,"lc","消化系统","无痛性间歇性肉眼血尿＋B超发现膀胱内2cm×2.5cm实质占位，高度提示膀胱癌，确诊必须靠膀胱镜直视观察并取活检行病理检查，故D最有帮助。CT与膀胱造影只能显示充盈缺损、判断有无肌层浸润；尿细胞学与尿流式细胞学敏感性偏低，阳性不能定位、阴性不能排除。\n\n📚 出处：《外科学》第9版·泌尿系统肿瘤·膀胱癌"],["成年伤员，其两下肢被热水烫伤后出现水疱，渗出较多，剧痛。伤后 1 小时就诊，创面处理应选择",["清创后行包扎疗法","清创后行暴露疗法","早期切痂植皮","早期削痂植皮","自然脱痂等待肉芽创面形成后，游离植皮"],"A",1,"lc","运动与骨外科","双下肢热水烫伤后起水疱、渗出多、剧痛，为浅二度至深二度烧伤；伤后仅1小时，创面污染轻，四肢部位便于包扎，应清创后行包扎疗法，以利引流、保护创面并减少感染。暴露疗法多用于头面、会阴及大面积烧伤或不合作者；切痂、削痂植皮适用于三度及深二度创面，需待休克期度过、界限清楚后施行；自然脱痂等待肉芽创面已成落后方法。\n\n📚 出处：《外科学》第9版·烧伤·烧伤创面的处理"],["男性，22 岁，车祸致前臂掌侧近段皮肤缺损3 小时。肌肉外露，创面约8cm×6cm，同时伴有血气胸。对前臂创面的处理，正确的是",["只能用局部皮瓣修复","首选游离皮肤移植修复","只能用远位皮瓣修复","只能用游离植皮修复","首选用游离皮瓣修复"],"B",1,"lc","呼吸系统","前臂掌侧创面虽见肌肉外露，但肌床血运丰富，可接受中厚或全厚皮片移植而存活；且患者同时存在血气胸，需尽快完成创面处理以转入胸腔处置，因此首选操作简便、耗时短的游离皮肤移植。选项中“只能用”“只能用游离植皮”一类绝对化表述排除了其他合理选择；游离皮瓣需显微血管吻合、手术时间长、对全身条件要求高，合并血气胸的急诊患者并非首选；局部的局部皮瓣或远位皮瓣同样不作为此时首选。\n\n📚 出处：《外科学》第9版·整形外科·皮肤移植"],["患者女，38 岁，右侧血性乳头溢液。查体：右侧乳晕区 1 点钟位近乳头处可触及小肿物，约黄豆大小，伴压痛，质中，界限不清，压迫时可见乳头溢出血性液体。最可能的诊断是",["乳腺导管内增生","乳腺导管内乳头状瘤","乳腺囊性增生症","Paget 病","乳腺脓肿"],"B",1,"lc","妇产科","乳晕区近乳头处小肿物，压迫时出现单孔血性溢液，是乳腺导管内乳头状瘤的典型表现，瘤体多位于乳晕下大导管内，质软、易出血。Paget病表现为乳头乳晕湿疹样糜烂、结痂；囊性增生症多为双侧、周期性胀痛、多孔浆液性或乳汁样溢液；导管内增生、脓肿均无血性溢液伴可触及小结节的特点。\n\n📚 出处：《外科学》第9版·乳房疾病"],["23 岁女性，G1P0，妊娠 33 周，产前经过顺利。因夫妻同房后腹痛半天，阴道少量流血来院。检查：贫血貌，血压 106/70mmHg，心率 110 次/分，子宫较孕月大，宫高 32cm，子宫张力大，并有轻压痛，胎位胎心不清。Hb70g/L，红细胞压积 28%。此患者最佳处理方法是",["人工破膜","阴道触诊","剖宫产","期待疗法","吸氧，输新鲜血液"],"C",1,"lc","妇产科","同房（机械性刺激）后突发腹痛、少量阴道流血，子宫较孕月增大、张力高并轻压痛、胎位胎心不清，伴贫血（Hb70g/L、心率110次/分），符合胎盘早剥（可能已发生子宫胎盘卒中及胎儿窘迫）。孕33周但母体病情重、胎儿窘迫，应在纠正休克、备血同时尽快剖宫产终止妊娠。期待疗法、人工破膜均延误抢救；阴道触诊可加重出血。\n\n📚 出处：《妇产科学》第9版·胎盘早剥"],["初产妇，26 岁，妊娠 38 周。日常体力劳动时自觉疲劳、心悸、气短。检查：血压 120/80mmHg，脉搏 90 次/分，呼吸 18 次/分。叩诊心浊音界稍向左扩大，心尖部闻及Ⅱ级柔和吹风样收缩期杂音，右肺部闻及湿啰音，咳嗽后消失，踝部轻度水肿。本例最可能的诊断是",["正常妊娠改变","风湿性心脏病合并妊娠","心脏病合并妊娠，性质待查","妊娠期高血压心脏病","围生期心肌病"],"A",1,"lc","妇产科","妊娠期血容量增加40%～45%、心搏出量增多、心率增快10～15次/分，膈肌上抬使心脏向左上移位，故心浊音界稍扩大；约半数孕妇可闻及心尖区及肺动脉瓣区Ⅰ～Ⅱ级柔和吹风样收缩期杂音，属生理性；踝部轻度水肿、肺底湿啰音咳嗽后消失亦为妊娠常见改变。题干无Ⅲ级以上杂音、无舒张期杂音、无心脏扩大依据，故首选“正常妊娠改变”。\n\n📚 出处：《妇产科学》第9版·妊娠合并心脏病"],["15 岁女孩，剖腹手术中快速冰冻病理切片回报：左卵巢颗粒细胞瘤低度恶性。肉眼所见：右卵巢略大，左卵巢未见异常，探查盆腹腔未见其他异常。应行何手术",["左附件切除","双附件切除","子宫全切＋左附件切除","子宫次全切＋左附件切除","左附件切除＋放疗"],"A",1,"lc","妇产科","卵巢颗粒细胞瘤属低度恶性性索间质肿瘤。年轻/幼女患者、单侧肿瘤、包膜完整、对侧卵巢外观正常者，行患侧附件切除即可保留生育功能；Ⅰ期患者术后无需常规放疗或化疗。本例15岁、病变局限于左卵巢，应行左附件切除（A）。原库答案E（左附件切除＋放疗）不成立：颗粒细胞瘤对放疗不敏感，且对青少年行放疗将摧毁生育功能与骨髓储备。\n\n📚 出处：《妇产科学》第9版·卵巢肿瘤·卵巢性索间质肿瘤（颗粒细胞瘤治疗原则）"],["女，32 岁，已婚未孕。妇科检查发现子宫增大如孕 12 周，B 超提示子宫前壁壁间单发肌瘤 8cm×7cm×7cm，双附件未发现异常。最佳治疗方法是",["GnRH-a 治疗","全子宫切除术","次全子宫切除术","子宫肌瘤切除术","严密随访观察"],"D",1,"lc","妇产科","32岁已婚未孕、单发壁间肌瘤8cm已达手术指征，且有生育要求，故行子宫肌瘤切除术（可经腹或腹腔镜），既解除症状又保留生育功能。GnRH-a仅作为术前缩小肌瘤、纠正贫血的辅助用药，停药后肌瘤复发；全子宫或次全子宫切除使患者丧失生育能力，不宜作为首选；8cm肌瘤伴不孕不宜仅随访。\n\n📚 出处：《妇产科学》第9版·子宫肌瘤"],["10 个月男孩，面色苍黄，毛发稀疏，易怒少哭。查体：体温正常，神清，不会扶站，四肢抖动，踝阵挛，巴氏征(+)。该患婴的诊断可能是",["先天愚型","多动症","病毒性脑膜炎","癫痫小发作","巨幼细胞性贫血"],"E",1,"lc","儿科","患儿10个月，面色苍黄、毛发稀疏、易怒少哭，伴运动发育倒退（不会扶站）、四肢抖动、踝阵挛及巴氏征阳性，符合维生素B12缺乏所致巨幼细胞性贫血并神经系统受累的典型表现，故E正确。先天愚型有特殊面容、通贯手及肌张力低下，无贫血及踝阵挛；病毒性脑膜炎有发热及脑膜刺激征；癫痫小发作无进行性贫血与精神运动倒退；多动症见于学龄期儿童。\n\n📚 出处：《儿科学》第9版·营养性巨幼细胞贫血"],["男，8 岁，查体发现阴囊囊性肿块，站立时肿块明显增大，透光试验阳性，卧位时肿块缩小或消失，睾丸不能触及。最可能的诊断是",["睾丸鞘膜积液","精索鞘膜积液","交通性鞘膜积液","睾丸炎","完全性腹股沟斜疝"],"C",1,"lc","儿科","肿块站立时增大、卧位时缩小或消失，提示鞘膜腔与腹腔相通，为交通性鞘膜积液，故选C。积液遮盖睾丸故触不到睾丸。睾丸鞘膜积液（A）卧位不消失、睾丸亦触不清；精索鞘膜积液（B）位于腹股沟管或睾丸上方、与腹腔不通；睾丸炎有红肿热痛；完全性腹股沟斜疝内容物多为肠管，透光试验阴性，可闻及肠鸣音，故均可排除。\n\n📚 出处：《外科学》第9版·鞘膜积液"],["患者，男性，15 岁。持续性镜下血尿 4 年余，尿相差镜检示为肾小球性血尿，无其他症状，未进一步诊治。3 个月前开始出现听力障碍，且进行性加重。首先考虑的诊断是",["隐匿性肾炎","慢性肾小球肾炎","Alport 综合征","Fabry 病","IgA 肾病"],"C",1,"lc","泌尿系统","青少年男性、持续性镜下血尿（肾小球性）多年 + 进行性听力障碍，是 Alport 综合征的经典三联征之二（血尿/肾功能减退 + 感音神经性耳聋 + 眼部异常如圆锥形晶状体、黄斑周围点状视网膜病变）。本病为Ⅳ型胶原 α3/α4/α5 链基因突变所致的遗传性基底膜病变，多呈 X 连锁显性遗传。隐匿性肾炎无耳聋；IgA 肾病以上呼吸道感染后发作性肉眼血尿为特点，不伴耳聋；Fabry 病为溶酶体蓄积病，伴手足烧灼样疼痛、血管角质瘤、角膜涡状混浊，无进行性耳聋。故为 C。\n\n📚 出处：《内科学》第9版·遗传性肾脏病·Alport综合征"],["由核黄疸造成的脑性瘫痪常表现为",["痉挛型","手足徐动型","共济失调型","震颤型","弛缓型"],"B",1,"lc","消化系统","核黄疸即新生儿高未结合胆红素脑病，游离胆红素选择性沉积于基底节（苍白球、丘脑底核）和锥体外系，故典型表现为手足徐动型脑性瘫痪，B正确。痉挛型多见于早产儿脑室周围白质软化（缺氧缺血性脑病）；共济失调型与小脑损伤相关；震颤型、弛缓型少见，均非核黄疸的特征性表现。\n\n📚 出处：《儿科学》第9版·新生儿黄疸·胆红素脑病"],["以下哪项不属于上下尿路感染的鉴别",["性别","全身症状","尿渗透压","血清中抗“O”抗体","尿沉渣中抗体包裹细菌"],"A",1,"lc","泌尿系统","上、下尿路感染的鉴别要点：①全身症状（上尿路感染有寒战高热、腰痛、肾区叩痛；下尿路以膀胱刺激征为主）；②尿渗透压（上尿路感染因肾浓缩功能受损，尿渗透压降低；下尿路正常）；③尿沉渣抗体包裹细菌（ACB）（上尿路阳性，下尿路阴性）；④血清抗\"O\"抗体（部分上尿路感染，尤其肾盂肾炎可升高）。而性别与感染部位无关——男女均可发生上或下尿路感染（女性发病率高是因解剖因素，但一旦发生，部位与性别无对应关系）。故不属于鉴别项的是 A。\n\n📚 出处：《内科学》第9版·尿路感染·定位诊断"],["肢端肥大症筛选和疾病活动性的指标是",["IGF-1↑","SS↑","GnRH↑","GHRH↑","GH↑"],"A",1,"lc","内分泌与代谢","血GH呈脉冲式分泌，受睡眠、应激、进餐影响，随机GH不能稳定反映分泌总量，故不宜作筛选指标；IGF-1由GH刺激肝脏生成、半衰期长、日内水平稳定，与24小时GH整合分泌量相关，是肢端肥大症筛选和判断疾病活动性（疗效监测）的首选指标，答A。确诊需做口服葡萄糖GH抑制试验（GH不能抑制至<1μg/L）。SS、GnRH为下丘脑激素，无此用途；GHRH升高仅见于极少数异位GHRH瘤，非常规指标。\n\n📚 出处：《内科学》第9版·肢端肥大症·实验室检查"],["门静脉高压症时受影响最早的侧支血管为",["脐静脉","胃冠状静脉","直肠上静脉","腹膜后静脉","腹壁上静脉"],"B",1,"lc","消化系统","门静脉与腔静脉之间有胃底食管下段、直肠下段肛管、前腹壁、腹膜后四组交通支。门脉压升高时血流最早经胃冠状静脉（胃左静脉）逆流入食管下段静脉丛，形成食管胃底静脉曲张，破裂时出血凶险，故B为受累最早、临床意义最大的侧支。脐静脉出生后已闭锁，仅在门脉压很高时才重新开放（海蛇头）；直肠上静脉、腹膜后静脉受累较晚。\n\n📚 出处：《外科学》第9版·门静脉高压症·侧支循环"],["甲状旁腺素的作用为抑制",["溶骨","肾小管磷再吸收","cAMP 活性","1,25-(OH)2 维生素 D3 合成","肠钙吸收"],"B",1,"lc","内分泌与代谢","PTH作用于肾近曲小管，抑制钠-磷协同转运体而减少磷的重吸收，使尿磷排出增多、血磷降低，故答B。PTH通过作用于成骨/破骨细胞耦联促进骨吸收（溶骨）而升高血钙，A方向相反；PTH与肾小管受体结合后经腺苷酸环化酶使cAMP生成增多，C相反；PTH激活肾脏1α-羟化酶，促进25-(OH)D₃生成活性1,25-(OH)₂D₃，从而促进肠钙吸收，D、E亦为“促进”而非“抑制”。\n\n📚 出处：《生理学》第9版·甲状旁腺激素的生理作用"],["胰腺癌首选的筛查方法是",["X 线钡餐造影","CT","B 超","肿瘤标记物检测","选择性动脉造影"],"C",1,"lc","消化系统","B超无创、经济、可重复，能显示胰管扩张及直径1～2cm以上的低回声占位，是胰腺癌首选的筛查与随访方法，发现异常再行增强CT/MRI或EUS-FNA确诊，故C正确。X线钡餐只显示间接压迫征象，敏感性低；CT主要用于确诊与分期，不作初筛；CA19-9特异性不足，不宜单独筛查；选择性动脉造影有创，已基本淘汰。\n\n📚 出处：《外科学》第9版·胰腺疾病·胰腺癌"],["关于肺嗜酸性粒细胞增多症(PIE)，下列不正确的叙述是",["咳嗽、发热","胸闷、气急","肺部阴影呈游走性","往往对糖皮质激素治疗反应不好","组织或循环中嗜酸性粒细胞增高"],"D",1,"lc","呼吸系统","肺嗜酸性粒细胞增多症（PIE）是以嗜酸性粒细胞在肺组织与循环中增多为特征的一组疾病，临床见咳嗽、发热、胸闷、气急，影像上肺部浸润影常呈一过性、游走性，血或组织嗜酸性粒细胞增高。该病对糖皮质激素反应良好，用药后症状与影像多在数日内明显改善，故“往往对糖皮质激素治疗反应不好”不正确，为本题答案。\n\n📚 出处：《内科学》第9版·肺嗜酸性粒细胞增多症"],["小脑病变主要表现为",["肌张力增高","腱反射亢进","共济失调","静止性震颤","四肢瘫痪"],"C",1,"lc","神经与精神","小脑的主要功能是维持平衡、调节肌张力、协调随意运动。小脑蚓部或半球病变表现为共济失调：指鼻试验、跟膝胫试验不准，快速轮替笨拙，醉汉步态，构音障碍，并有意向性震颤、辨距不良、肌张力减低、腱反射减弱。而肌张力增高、腱反射亢进是锥体束受损表现，静止性震颤属锥体外系（帕金森病）表现，四肢瘫提示颈髓横贯性损害，均不符合小脑病变。\n\n📚 出处：《神经病学》第8版·小脑疾病·临床表现"],["对判断慢性粒细胞白血病预后最有价值的是",["Plt 计数","WBC 计数","Ph 染色体测定","中性粒细胞碱性磷酸酶积分","外周血幼粒细胞计数"],"C",1,"lc","血液系统","Ph染色体即t(9;22)(q34;q11)形成的BCR-ABL融合基因，是CML的分子标志，也是预后判断的核心：初诊Ph阳性者病程向加速期、急变期进展时常出现附加染色体异常（+8、i(17q)、双Ph等）；伊马替尼治疗后BCR-ABL转录本水平决定疗效与生存。血小板、白细胞计数及NAP积分只反映疾病负荷，与预后价值有限。\n\n📚 出处：《内科学》第9版·慢性髓系白血病"],["下列因素中，提示类风湿关节炎预后较差的是",["病程长","HLA-DR3 阳性","抗核抗体阳性","类风湿因子持续低滴度阳性","多发类风湿结节"],"E",1,"lc","运动与骨外科","类风湿结节属关节外表现，多发生于RF阳性、病情活动者，提示系统性炎症负荷重、关节破坏进展快、预后差。HLA-DR3与SLE、干燥综合征等相关，RA易感基因为HLA-DR4；抗核抗体非RA特异性指标；RF持续低滴度相对高滴度者预后较好；病程长短本身不是独立预后指标。\n\n📚 出处：《内科学》第9版·类风湿关节炎·病情评估与预后"],["应用洋地黄时出现下列哪项心电图表现，除停用洋地黄外还需立即给予其他处理",["多源性室性过早搏动","窦性心动过缓，心率 55 次/分","第二度房室传导阻滞","第一度房室传导阻滞","偶发室性过早搏动"],"A",1,"lc","心血管系统","洋地黄中毒最常见为室性心律失常，多源性室早、双向性室速、室速提示严重中毒，须立即停药并补钾（血钾不低时）、给予苯妥英钠或利多卡因，必要时电复律。窦性心动过缓（55次/分）、偶发室早、第一度房室阻滞以减量或停药观察为主；第二度房室阻滞亦以停药为主且多可恢复。故需立即加用其他处理者为A。\n\n📚 出处：《内科学》第9版·心力衰竭·洋地黄中毒"],["维持性血液透析的肾性贫血患者在使用足够剂量的红细胞生成素后，血色素仍然得不到改善。不可能有效的处理措施是",["补充叶酸","静脉补铁","控制感染","间断给予血液透析滤过治疗","改为腹膜透析治疗"],"E",1,"lc","泌尿系统","维持性血透患者肾性贫血对足量 EPO 反应不佳（EPO 抵抗）的常见原因及对策：①缺铁（最常见）→ 静脉补铁；②叶酸/维生素B₁₂缺乏 → 补充叶酸；③感染或炎症状态（炎症因子抑制红细胞生成并干扰铁利用）→ 控制感染；④尿毒症毒素蓄积、透析不充分 → 改为血液透析滤过（HDF）清除中大分子毒素；⑤继发性甲旁亢、铝中毒、ACEI/ARB 过量 → 相应处理。\n改为腹膜透析并不能提高 EPO 疗效——腹透与血透的贫血纠正效果相当，且腹透液丢失蛋白反而可能加重贫血。故\"不可能有效\"为 E。\n\n📚 出处：《内科学》第9版·慢性肾脏病·肾性贫血的治疗（EPO抵抗原因）"],["有关包扎疗法，下述错误的是",["清创后内层敷料为 1～2 层凡士林油纱贴于创面","四肢关节包扎应固定在中立位","外层用无菌脱脂纱布或棉垫包扎","厚度以渗出物不渗湿外层敷料为度","包扎应从远端开始"],"B",1,"lc","外科总论与麻醉","包扎疗法要求：清创后内层用1～2层凡士林油纱贴敷创面（A对），外层用无菌脱脂纱布或棉垫（C对），厚度以渗出物不渗湿外层敷料为度（D对），自远端向近端包扎以利静脉回流（E对）。四肢关节必须固定在功能位而非中立位，中立位固定会造成关节僵直和功能障碍，故B错误。颈、腋下、会阴等部位一般不宜包扎。\n\n📚 出处：《外科学》第9版·烧
