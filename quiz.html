处：《皮肤性病学》第9版·单纯疱疹"],["显微镜镜头的数值孔径的标准简写是",["NA","NF","ND","AN","FN"],"A",1,"lc","眼耳鼻喉口腔","数值孔径（numerical aperture）的国际标准简写为NA，定义为NA＝n·sinθ（n为介质折射率，θ为孔径半角），NA越大分辨力越高、数值孔径与镜口角及介质相关。NF常指中性滤光片（neutral filter），ND为中性密度滤光片，AN、FN均非标准缩写，属拼写倒置的干扰项。\n\n📚 出处：《临床检验基础》第5版·显微镜检查"],["血氧容量正常、动脉血氧分压和血氧含量正常，静脉血氧分压与血氧含量高于正常。见于",["心力衰竭","呼吸衰竭","失血性休克","氰化物中毒","CO 中毒"],"D",1,"lc","心血管系统","氰化物与细胞色素氧化酶的三价铁结合，阻断电子传递，组织不能摄取和利用氧，故动脉血氧分压、血氧含量正常而静脉血氧分压与氧含量升高、动静脉氧差缩小（“静脉血动脉化”）。心力衰竭、呼吸衰竭、失血性休克因组织缺氧、氧摄取增加使静脉氧含量降低；CO中毒使血氧容量下降。故选D。\n\n📚 出处：《病理生理学》第9版·缺氧·血液性缺氧与组织性缺氧"],["恶性黑色素瘤免疫组织化学染色可呈阳性的是",["CK","HMB-45","EMA","LCA","CD117"],"B",1,"lc","皮肤性病","恶性黑素瘤起源于黑素细胞，HMB-45为黑素小体相关糖蛋白，对黑素细胞相对特异，故瘤细胞呈阳性；S-100、Melan-A亦常阳性，可作辅助。CK为角蛋白、EMA为上皮膜抗原，阳性见于鳞状细胞癌、Paget病等上皮性肿瘤；LCA为白细胞共同抗原，见于淋巴瘤；CD117多见于胃肠道间质瘤及肥大细胞增生症。故只有B成立。\n\n📚 出处：《皮肤性病学》第9版·黑素瘤"],["滑膜液和血浆相比，下列哪项指标偏低",["总蛋白","白蛋白","α1-球蛋白","β-球蛋白","尿酸"],"A",1,"lc","血液系统","滑膜液是血浆经滑膜毛细血管的超滤液，因毛细血管对大分子蛋白通透性有限，总蛋白含量明显低于血浆（约为血浆的1/3），且以白蛋白为主。葡萄糖、尿酸、电解质与血浆接近；白蛋白虽绝对值降低但比例升高，α1、β球蛋白比例相对变化不大。故与血浆相比明显偏低者为总蛋白。\n\n📚 出处：《诊断学》第9版·关节腔积液检查"],["以下哪项是血清 IgG 增高的疾病",["轻链病","肾病综合征","病毒感染","使用免疫抑制剂","慢性感染"],"E",1,"lc","血液系统","慢性感染、慢性肝病、自身免疫病等致多克隆免疫球蛋白合成增加，以IgG升高为主。轻链病时正常免疫球蛋白受抑而降低；肾病综合征因大量蛋白自尿中丢失，IgG显著降低；使用免疫抑制剂抑制抗体生成使Ig降低；病毒感染多为短暂轻度变化。故血清IgG增高见于慢性感染。\n\n📚 出处：《诊断学》第9版·免疫球蛋白测定"],["按贫血的 MCV/RDW 分类法，缺铁性贫血属于",["小细胞均一性贫血","小细胞不均一性贫血","正常细胞均一性贫血","大细胞均一性贫血","大细胞不均一性贫血"],"B",1,"lc","血液系统","按MCV/RDW分类：缺铁性贫血MCV<80fl（小细胞）、RDW升高（红细胞大小不均），属小细胞不均一性贫血，此点可与RDW多正常的地中海贫血相鉴别。MCV正常+RDW正常为正常细胞均一性贫血；大细胞不均一性贫血见于巨幼细胞贫血、MDS；小细胞均一性见于部分慢性病贫血。\n\n📚 出处：《内科学》第9版·贫血概述"],["连续用药后突然停药可引起戒断综合征，称为",["耐受性","药物滥用","吸毒","精神依赖性","躯体依赖性"],"E",1,"lc","临床综合","躯体依赖性指反复用药后机体已适应药物的存在，一旦突然停药即出现流涕、出汗、震颤、烦躁甚至惊厥等戒断症状，继续用药可缓解，故为躯体依赖性。耐受性是同剂量效应减弱；药物滥用与吸毒指非医疗目的使用；精神依赖性表现为强烈渴求与强迫性用药，停药不出现躯体戒断症状。\n\n📚 出处：《药理学》第9版·药物依赖性与药物滥用"],["下列哪项不属于麻醉性镇痛药",["可待因","二氢埃托啡","布洛芬","哌替啶","吗啡"],"C",1,"lc","外科总论与麻醉","麻醉性镇痛药指激动阿片受体产生镇痛的药物，包括吗啡、哌替啶、可待因、芬太尼、二氢埃托啡等。布洛芬属非甾体抗炎药，通过抑制环氧化酶减少前列腺素合成，仅有解热、抗炎和中等强度镇痛作用，无阿片受体激动作用，不抑制呼吸、无成瘾性，不列入麻醉药品管理，故C正确。\n\n📚 出处：《药理学》第9版·镇痛药"],["关于赫-白反射(Hering-Breuer reflex)的描述，错误的是",["肺泡吸气膨胀时，可引起吸气终止","肺泡呼气回缩后，可引起吸气","感受器位于支气管和细支气管的平滑肌层中","赫-白反射的传入神经为肋间神经","赫-白反射的中枢在延髓"],"D",1,"lc","神经与精神","Hering-Breuer 反射即肺牵张反射：肺充气时气道平滑肌内牵张感受器兴奋，经迷走神经传入延髓呼吸中枢，抑制吸气、引起呼气（A 对）；肺回缩时放电减少，解除抑制而引发吸气（B 对）；感受器位于支气管、细支气管平滑肌层（C 对）；中枢在延髓（E 对）。其传入神经为迷走神经而非肋间神经，故 D 错误。切断双侧迷走神经后呼吸变深变慢，正是该反射消失的表现。\n\n📚 出处：《生理学》第9版·呼吸·呼吸运动的调节"],["大量心包积液出现心脏摆动征时，心包积液量至少是",["50～100ml","100～300ml","500～1000ml","2000ml","4000ml"],"C",1,"lc","心血管系统","心包积液量在500～1000ml以上时，心脏悬浮于积液之中，立位或透视下心影随体位与搏动出现明显摆动，即“心脏摆动征”，是大量心包积液的重要X线征象。少量积液（100～300ml）心影形态基本正常，不出现摆动；2000ml以上者往往已伴严重压塞，摆动征反而不典型。故选C。\n\n📚 出处：《诊断学》第9版·心包积液·X线检查"],["下列哪项不是移植肾发生急性排异反应的表现",["肾体积迅速增大","肾彩色血流明显减少","肾内动脉阻力指数 RI≥0.85","肾体积迅速缩小","肾窦回声减低"],"D",1,"lc","泌尿系统","急性排斥反应为细胞免疫介导的间质炎症与血管炎，超声见移植肾体积迅速增大、皮髓质分界模糊、肾窦回声减低，彩色多普勒示血流明显减少、肾内动脉阻力指数RI≥0.85。肾体积迅速缩小见于慢性排斥反应（纤维化萎缩）及移植肾缺血坏死，不是急性排斥的表现。故答D。\n\n📚 出处：《超声医学》第6版·移植肾超声检查"],["胚胎的器官发育在妊娠多少周时已经完成",["4 周","6 周","8 周","20 周","24 周"],"C",1,"lc","妇产科","受精后前8周为胚胎期，此期细胞高度分化、各器官原基相继形成；至妊娠8周末（胚胎期末），各器官系统的大体形态已基本分化完成，此后进入胎儿期，以器官继续发育成熟和体重、身长增长为主。故答案为8周。\n\n📚 出处：《妇产科学》第9版·胚胎及胎儿发育"],["癫痫在局部脑血流断层显像(rCBF)中的特征性表现为",["存在大小脑失联络现象","大脑皮质不同部位存在 rCBF 低灌注区","大脑皮质不同部位存在 rCBF 高灌注区","发作间期病灶区放射性减低，发作期病灶区放射性增高","发作间期病灶区的放射性增高，发作期病灶区放射性降低"],"D",1,"lc","神经与精神","癫痫发作是神经元异常高频同步放电，局部代谢与血流需求骤增，故发作期（ictal）病灶区呈高灌注、放射性摄取增高；发作间期（interictal）因神经元损伤、皮层抑制及代谢降低，病灶区呈低灌注、放射性减低。这一“发作期高、间期低”的反差正是 SPECT 定位致痫灶的依据，须与脑电图、MRI 互相印证。B、C 只描述单一状态；E 方向正好相反；A、D 不是 rCBF 对癫痫的特征描述。\n\n📚 出处：《神经病学》第8版·癫痫·辅助检查"],["心肌灌注显像时，混合性灌注缺损多提示",["梗阻性心肌病","心室室壁瘤","早期心肌缺血","心肌缺血与心肌梗死并存","扩张型心肌病"],"D",1,"lc","心血管系统","心肌灌注显像中，负荷或静息影像出现的可逆性缺损提示心肌缺血，固定不变缺损提示心肌梗死；同一心脏既有可逆缺损又有固定缺损，称混合性灌注缺损，提示缺血与梗死并存，多见于多支病变。梗阻性心肌病、室壁瘤、扩张型心肌病多表现为固定缺损或形态改变；早期缺血为单纯可逆缺损。故选D。\n\n📚 出处：《核医学》第9版·心血管系统显像·心肌灌注显像"],["某机场通过安检发现有两名乘客携带有放射性物质，后经证实均为体内植入的用于肿瘤治疗的碘-125 粒子。请问机场相关安检人员所受的辐射属于",["职业照射","医疗照射","公共照射","天然本底照射","以上均不是"],"A",1,"lc","理化与中毒","按受照目的，照射分为职业照射、医疗照射和公众照射。安检人员是在执行安检值勤这一本职工作过程中受到来自旅客体内碘-125 粒子的照射，属因职业活动而受到的照射，故归为职业照射。医疗照射指受检者、患者本人为诊断治疗目的所受的照射（本例中是旅客受照）；公众照射指非职业、非医疗的公众成员所受的照射；天然本底照射来自宇宙射线和土壤岩石中的天然核素，与本例无关。\n\n📚 出处：《核医学》第9版·辐射防护"],["CT 机的存储器不包括",["硬磁盘","磁带","软盘","光盘","阵列处理器"],"E",1,"lc","神经与精神","CT 机的存储器用于存放原始数据、重建图像与病历资料，属内存/外存装置，包括硬磁盘、软盘、磁带、光盘及磁光盘等，A、B、C、D 均属存储器。阵列处理器是专门完成大量重复性运算（如卷积反投影重建）的并行高速运算部件，属运算部件而非存储介质，故不属于存储器。\n\n📚 出处：《医学影像学》第8版·X线计算机体层成像·CT基本结构"],["以下哪种临床表现属于血管内对比剂毒副反应中的物理-化学反应",["血管神经性水肿","呼吸困难","恶心、呕吐","荨麻疹","血压骤降"],"C",1,"lc","心血管系统","对比剂不良反应分两类：一是特异质（过敏）反应，与剂量无关，表现为荨麻疹、血管神经性水肿、支气管痉挛致呼吸困难、血压骤降甚至休克；二是物理-化学反应，与剂量、渗透压、黏度、注射速度有关，表现为恶心呕吐、面部潮红、发热、局部疼痛与血管外渗。故选C。\n\n📚 出处：《医学影像学》第8版·对比剂·造影剂不良反应"],["股动脉穿刺插管术后，通常穿刺点压迫多长时间后局部加压包扎",["3～5min","5～8min","6～10min","10～15min","15～20min"],"D",1,"lc","外科总论与麻醉","股动脉穿刺拔管后须持续指压穿刺点10～15min，确认局部无出血、远端搏动良好后再用沙袋或弹力绷带加压包扎，并卧床制动。压迫时间过短（3～8min）易出现血肿、假性动脉瘤或动静脉瘘；过长则增加血栓风险。术后应观察足背动脉搏动、皮温及局部肿胀情况，故D正确。\n\n📚 出处：《外科学》第9版·重症监测治疗与复苏"],["小儿腺样体(咽扁桃体)厚度何时与成年人相同",["出生时","1 岁左右","5 岁左右","10 岁左右","15 岁左右"],"E",1,"lc","儿科","腺样体（咽扁桃体）出生后即存在，2～6岁增生旺盛，6～7岁达到最大，10岁以后逐渐萎缩，至青春期前后（约15岁）其厚度与成人相近，故选E。婴幼儿腺样体肥大是小儿打鼾、张口呼吸、分泌性中耳炎及颌面发育异常的常见原因；出生时、1岁、5岁、10岁时腺样体均处于增生阶段，厚度超过成人。\n\n📚 出处：《耳鼻咽喉头颈外科学》第9版·腺样体肥大"],["星形细胞瘤与脑梗死的鉴别，最有意义的是",["低密度","不增强","单脑叶分布","多脑叶分布","不按血管支配区分布"],"E",1,"lc","神经与精神","星形细胞瘤位于白质内，呈膨胀性生长，分布不受脑血管支配区限制，可跨越脑叶与血管分水岭，低密度范围与占位效应不相称，增强多呈不均匀强化，随访逐渐增大。脑梗死则严格按某一血管供血区分布，呈楔形、同时累及灰白质，急性期有脑回样强化。故“不按血管支配区分布”最具鉴别意义。低密度与不增强两者均可出现；单/多脑叶分布只是范围描述，不如血管区规律可靠。\n\n📚 出处：《医学影像学》第8版·中枢神经系统·颅内肿瘤"],["心肌梗死急性期典型的心电图表现是",["T 波高耸，无 ST 段抬高和坏死性 Q 波出现","T 波高耸，随即出现 ST 段抬高，无坏死性 Q 波出现","ST 段弓背向上抬高，出现坏死性 Q 波，伴 T 波倒置","抬高的 ST 段回到等电位线，T 波倒置变深，存在坏死性 Q 波","ST-T 多数基本恢复正常，存在坏死性 Q 波"],"C",1,"lc","心血管系统","心梗心电图分四期：超急性期T波高耸无Q波；急性期ST段弓背向上抬高、与T波融合成单向曲线，并出现病理性Q波、T波开始倒置；亚急性期ST段回落至等电位线、T波深倒置、Q波存在；陈旧期ST-T多恢复、遗留Q波。故急性期典型为C，A、B属超急性期，D属亚急性期，E属陈旧期。\n\n📚 出处：《诊断学》第9版·心电图·心肌梗死"],["休克出现弥漫性血管内凝血的征象时应行下列哪项治疗",["鱼精蛋白","肝素","维生素 K","激素","止血敏"],"B",1,"lc","血液系统","休克并DIC的早期为高凝期，微血栓形成为主要矛盾，此时在治疗休克、去除诱因、补充凝血因子与血小板的基础上应尽早用肝素抗凝，阻断凝血酶生成、减少因子消耗。鱼精蛋白仅拮抗肝素过量；维生素K用于依赖维生素K因子缺乏；激素与止血敏对DIC无效，消耗性低凝期盲目止血反加重血栓。\n\n📚 出处：《内科学》第9版·弥散性血管内凝血"],["大脑灌注压(CPP)依赖于",["平均动脉压","颅内压","平均动脉压和颅内压","脑血流量","不确定"],"C",1,"lc","神经与精神","脑灌注压 CPP＝平均动脉压 MAP－颅内压 ICP，是驱动脑血流的压力差，正常约 70～100mmHg。MAP 取决于收缩压与舒张压，ICP 取决于颅内容物（脑组织、脑脊液、血液及占位）容积，故 CPP 同时依赖平均动脉压和颅内压。脑血流量 CBF＝CPP/CVR，是由 CPP 决定的因变量，D 颠倒因果。临床上颅高压时须维持 MAP 以保证 CPP≥60mmHg，这正是降压不可过度的原因。\n\n📚 出处：《外科学》第9版·颅内压增高·脑血流量的调节"],["下列主要用于指导 ARDS 机械通气参数设置的呼吸环是",["流速-容积环","动态压力-容积环","静态压力-容积环","流速-时间环","压力-时间环"],"C",1,"lc","儿科","静态压力-容积环需在短暂阻断气流、吸气末屏气条件下描记，可真实反映肺顺应性，并显示低位拐点（LIP）与高位拐点（UIP），据此设定PEEP和潮气量，避免肺泡反复萎陷和高容积伤，是ARDS机械通气参数设置的主要依据，故选C。动态压力-容积环受气道阻力影响，不能真实反映顺应性；流速-容积环主要用于判断气道阻塞与气流受限；流速-时间环、压力-时间环对参数设定帮助有限。\n\n📚 出处：《儿科学》第9版·急性呼吸窘迫综合征与机械通气"],["AOPP 的发病机制是",["导致机体缺氧","使腺体过度分泌","与细胞色素氧化酶结合","与 ChE 结合形成磷酰化胆碱酯酶","导致中毒性肝炎"],"D",1,"lc","理化与中毒","AOPP 的本质是抑制胆碱酯酶：有机磷的磷酰基与 ChE 活性中心丝氨酸羟基共价结合，形成磷酰化胆碱酯酶使酶失活，ACh 不能被水解而在突触和神经肌肉接头大量蓄积，产生毒蕈碱样、烟碱样和中枢神经症状，故 D 正确。与细胞色素氧化酶结合是氰化物中毒机制（C 错）；导致机体缺氧是 CO、亚硝酸盐、硫化氢等的作用（A 错）；腺体过度分泌只是 ACh 蓄积后的表现而非机制（B 错）；中毒性肝炎属继发损害（E 错）。\n\n📚 出处：《内科学》第9版·有机磷杀虫药中毒"],["有关血管紧张素Ⅱ抑制剂的叙述，下列错误的是",["慢性肾衰竭患者无肾性高血压时无需使用血管紧张素Ⅱ抑制剂","血管紧张素Ⅱ抑制剂扩张出球小动脉的作用强于扩张入球小动脉的作用","血管紧张素Ⅱ抑制剂可以减少患者蛋白尿","血管紧张素Ⅱ抑制剂可抑制肾小球的硬化","血管紧张素Ⅱ抑制剂可抑制肾组织细胞炎症反应"],"A",1,"lc","心血管系统","ACEI/ARB的肾脏保护作用独立于降压：通过扩张出球小动脉强于入球小动脉（B对），降低肾小球内压、减少蛋白尿（C对）、抑制系膜增生与肾小球硬化（D对）、抑制炎症与纤维化（E对）。因此慢性肾衰竭尤其伴蛋白尿者，即使无肾性高血压也应在监测血肌酐、血钾下使用，而非“无需使用”。故错误的是A。\n\n📚 出处：《内科学》第9版·慢性肾衰竭·高血压与肾保护治疗"],["国人最常见的咯血原因为",["风湿性二尖瓣狭窄","肺栓塞","肺结核","肺脓肿","慢性肺心病"],"C",1,"lc","呼吸系统","我国咯血病因统计中肺结核居首位，机制包括结核性支气管扩张、空洞壁Rasmussen动脉瘤破裂、病灶侵蚀血管及钙化淋巴结压迫侵蚀气道。支气管扩张、肺癌亦为常见原因但居其次；风湿性二尖瓣狭窄所致咯血在风心病减少后已明显少见；肺栓塞、肺脓肿、慢性肺心病均非最常见病因。\n\n📚 出处：《内科学》第9版·咯血"],["关于日常生活活动能力评定注意事项的描述，不恰当的是",["评定前应与患者交谈，以取得患者的理解与合作","评定前还必须对患者的基本情况有所了解","应考虑到患者生活的社会环境、反应性、依赖性","重复进行评定时可在不同条件或环境下进行","在分析评定结果时应考虑有关的影响因素"],"D",1,"lc","神经与精神","日常生活活动能力（ADL）评定的注意事项包括：评定前与患者交谈取得配合（A 对）；事先了解病情、认知与肢体功能等基本情况（B 对）；考虑其家庭社会环境、反应性与依赖程度（C 对）；分析结果时考虑年龄、性别、文化背景、疼痛、情绪等影响因素（E 对）。为保证结果可比，重复评定必须在相同条件、相同环境、相同时间、同一评测者下进行，否则前后无可比性，故 D 不恰当。\n\n📚 出处：《康复医学》第6版·日常生活活动能力评定"],["腰椎牵引时应注意避免",["臂丛神经损伤","坐骨神经损伤","尺神经损伤","腓神经损伤","桡神经损伤"],"A",1,"lc","运动与骨外科","腰椎牵引的固定带需束于下胸廓及骨盆，若胸带位置过高、上缘抵于腋窝，牵引时持续压迫腋窝可致臂丛神经牵拉与压迫损伤，出现上肢麻木、无力，故为须避免的并发症。坐骨神经、尺神经、桡神经、腓神经均远离胸带固定区或位于下肢，与腰椎牵引操作无直接关系。\n\n📚 出处：《实用骨科学》第5版·腰椎间盘突出症·牵引治疗"],["在进行记忆障碍训练的过程中包括很多方法，其中不确切的是",["背诵法","分解-联合法","首词记忆法","记忆技巧法","联想法"],"C",1,"lc","神经与精神","记忆障碍康复训练的常用方法有：背诵法（反复复述巩固）、分解-联合法（把长信息分解成组块再组合）、记忆技巧法（利用韵律、故事、心象等编码策略）、联想法（把新信息与已知事物建立联系），以及环境代偿（记事本、提示卡、闹钟）。“首词记忆法”是借助首字母或首词缩略语辅助提取的特定技巧，多见于外语学习或固定清单记忆，并非记忆障碍康复中公认的常规方法，故不确切。\n\n📚 出处：《康复医学》第6版·认知障碍的康复"],["下列对慢性扁桃体炎病因的描述，哪项是错误的",["多由急性扁桃体炎反复发作所致","因扁桃体隐窝引流不畅，窝内细菌、病毒滋生感染所致","因扁桃体增生肥大所致","葡萄球菌及链球菌感染所致","可继发于白喉等其他感染"],"C",1,"lc","眼耳鼻喉口腔","慢性扁桃体炎多由急性扁桃体炎反复发作演变而来；因隐窝引流不畅、窝内细菌与病毒滋生感染而致；致病菌以乙型溶血性链球菌、葡萄球菌为主；也可继发于白喉、猩红热等传染病，故A、B、D、E均正确。C把“扁桃体增生肥大”当作病因，实则肥大是长期炎症刺激的结果（增生型表现），属病理形态改变，因果倒置。\n\n📚 出处：《耳鼻咽喉头颈外科学》第9版·咽科学·咽的炎性疾病"],["慢性化脓性中耳炎，鼓膜穿孔边缘有一部分已达鼓沟，该处无残余鼓膜，称为",["中央性穿孔","紧张部穿孔","边缘性穿孔","松弛部穿孔","以上都不是"],"C",1,"lc","眼耳鼻喉口腔","慢性化脓性中耳炎按穿孔与鼓沟的关系分中央性与边缘性。中央性穿孔四周均有残余鼓膜；穿孔边缘某部已达鼓沟、该处无残余鼓膜者称边缘性穿孔，提示紧张部周边纤维环被破坏，常伴听骨链或上鼓室病变，多见于骨疡型、胆脂瘤型。D松弛部穿孔位于上鼓室，并非“达鼓沟”；A、B只描述穿孔大小或部位，未反映与鼓沟的关系；E明显不符。\n\n📚 出处：《耳鼻咽喉头颈外科学》第9版·耳科学·中耳炎"],["关于咽后脓肿引起的呼吸困难，下述正确的是",["是吸气性呼吸困难，吸气期延长，吸气运动增强，呼吸频率基本不变或减慢","是呼气性呼吸困难，呼气期延长，呼气运动增强，吸气运动略增强","是混合性呼吸困难，呼气与吸气均增强","肺部检查见有充气过度的体征","以上都不对"],"A",1,"lc","呼吸系统","咽后脓肿位于喉上方，属气道外压性狭窄，引起阻塞性（吸气性）呼吸困难：吸气时胸腔负压增大，出现胸骨上窝、锁骨上窝及肋间隙凹陷（三凹征），吸气期延长、吸气肌做功增强，而呼吸频率基本不变或反射性减慢，故A正确。呼气性呼吸困难见于下呼吸道阻塞（哮喘、COPD）；混合性见于广泛肺实质病变；肺充气过度体征属下气道阻塞表现，与上气道外压性狭窄不符。\n\n📚 出处：《耳鼻咽喉头颈外科学》第9版·咽后脓肿"],["原发性青光眼可能是",["多因素遗传病","先天性疾病","家族性疾病","单基因遗传病","线粒体遗传病"],"A",1,"lc","眼耳鼻喉口腔","原发性青光眼（开角型与闭角型）属复杂疾病，由MYOC、OPTN等易感基因与年龄、屈光状态、家族史等环境及遗传因素共同作用，符合多因素（多基因）遗传病特征，故A正确。B错：为后天获得性疾病，与先天性青光眼不同；C错：临床常见家族聚集，但“家族性”并非遗传方式；D、E错：不符合单基因或线粒体遗传规律。\n\n📚 出处：《眼科学》第9版·青光眼·概述"],["关于急性闭角型青光眼的治疗，下述不正确的是",["手术是基本的治疗原则","口服乙酰唑胺","口服苏打片","口服维生素 B、维生素 C","1％阿托品点眼"],"E",1,"lc","眼耳鼻喉口腔","急性闭角型青光眼发作期以迅速降眼压为原则：1%~2%毛果芸香碱缩瞳开放房角，β受体阻滞剂等降眼压药点眼，口服乙酰唑胺抑制房水生成，静滴20%甘露醇，口服苏打片碱化血液并改善房水排出，辅以维生素B、C神经营养；眼压控制后行激光周边虹膜打孔或小梁切除术，手术是基本治疗原则，故A、B、C、D均正确。E的1%阿托品为散瞳剂，会加重瞳孔阻滞、使眼压进一步升高，属禁忌。\n\n📚 出处：《眼科学》第9版·青光眼·原发性闭角型青光眼"],["正常人臂-视网膜循环时间大约为",["5～10s","7～12s","11～16s","15～20s","10～15s"],"B",1,"lc","眼耳鼻喉口腔","眼底荧光素血管造影时，荧光素钠自肘静脉注入后首次在视网膜动脉显影所需时间称臂-视网膜循环时间，正常约7~12秒，可反映视网膜血流灌注及全身循环状态。该时间延长见于颈动脉狭窄、心功能不全、视网膜中央动脉阻塞等。A、C、D、E的时段均与教材正常值不符，属数值干扰项。\n\n📚 出处：《眼科学》第9版·眼的检查·眼底荧光血管造影"],["不符合寻常型银屑病的临床表现是",["银白色鳞屑","束状发","甲板顶针状凹陷","消退期常见 Koebner 现象","多数患者病情冬重夏轻"],"D",1,"lc","皮肤性病","寻常型银屑病典型皮损为覆银白色鳞屑的红斑（A符合）、头皮损害使毛发呈束状（B符合）、甲板顶针状凹陷（C符合），病情多数冬重夏轻（E符合），以上均属本病表现。Koebner现象即同形反应，发生在疾病进行期，正常皮肤受外伤或搔抓后于损伤处出现新皮损；消退期炎症已控制，一般不出现同形反应，故D“消退期常见”表述错误。\n\n📚 出处：《皮肤性病学》第9版·银屑病"],["外界温度高于皮温时，机体散热的途径主要是",["辐射","传导","对流","出汗","以上都是"],"D",1,"lc","理化与中毒","机体散热依靠辐射、传导、对流和蒸发四种方式。环境温度低于皮肤温度时，以辐射、传导、对流散热为主；当环境温度接近或高于皮温时，辐射、传导、对流不仅不能散热，反而使机体从环境得热，此时唯一有效的散热途径是汗液蒸发（出汗），故为 D。辐射、传导、对流在高温环境下已失效，A、B、C 及 E 均不符合。\n\n📚 出处：《职业卫生与职业医学》第8版·高温作业与中暑"],["皮肤表面散在触点以感受触觉，其中触点最丰富的区域是",["头皮","指端腹面","腹壁","大腿外侧","前臂外侧"],"B",1,"lc","皮肤性病","触觉由真皮乳头内的触觉小体（Meissner小体）感受，其分布密度决定触觉敏感度：指端腹面单位面积内触点数最多，故触觉最敏锐，利于精细辨别。头皮、腹壁、大腿外侧、前臂外侧的触点密度依次明显低于指端，触觉辨别能力也相应较弱。故触点最丰富区域为指端腹面。\n\n📚 出处：《皮肤性病学》第9版·皮肤的解剖与生理"],["关于转换与分离障碍的叙述，不正确的是",["转换与分离障碍又称歇斯底里","一般有相应的器质性病变基础","近年来把转换与分离障碍划出神经症的意见已占大多数","一般认为转换与分离障碍的预后较好","起病常与心理应激有关"],"B",1,"lc","神经与精神","转换与分离障碍（癔症）以解离症状（对自我身份、过去经历整合能力部分或全部丧失）和转换症状（精神冲突转化为躯体症状）为特征，本质是“无器质性基础”的功能性障碍，各种检查均不能发现与症状相符的器质性病变，故 B 错误。该病起病常与心理应激、暗示及自我暗示有关（E 对），预后一般较好（D 对），且近年来将其从神经症中划出单列已占多数意见（C 对）。\n\n📚 出处：《精神病学》第8版·分离（转换）障碍"],["持续的回避表现不包括",["反复去想创伤性经历","避免参加引起痛苦回忆的活动","不愿与人交往","兴趣爱好范围变窄","选择性遗忘"],"A",1,"lc","临床综合","创伤后应激障碍的回避与麻木症状包括回避引起痛苦回忆的地点与活动（B）、疏远他人不愿交往（C）、兴趣范围变窄（D）、对创伤细节选择性遗忘（E）。A反复回想创伤性经历属于再体验（侵入性）症状，与回避方向相反，故不属于持续的回避表现。\n\n📚 出处：《精神病学》第8版·应激相关障碍（创伤后应激障碍）"],["三环抗抑郁药(TCAs)最常见的不良反应是",["锥体外系不良反应","过敏反应","心律及心电图变化","粒细胞减少","抗胆碱能不良反应"],"E",1,"lc","神经与精神","三环类抗抑郁药（TCAs）通过阻断 M 胆碱受体、α1 受体、H1 受体产生不良反应。最常见的为抗胆碱能反应：口干、视物模糊、便秘、尿潴留、心动过速、出汗减少。其次为中枢镇静、体位性低血压、体重增加及性功能障碍。心脏毒性（传导阻滞、QT 延长、心律失常）是 TCAs 过量致死的主要原因，虽严重但非“最常见”。锥体外系反应主要见于抗精神病药，粒细胞减少以氯氮平、卡马西平为代表，过敏反应少见。\n\n📚 出处：《精神病学》第8版·心境障碍·药物治疗"],["患者，女性，30 岁。近 3 个月来出现低热、消瘦、多关节疼痛。查体可见双下肢轻度可凹性水肿。尿常规检查：尿蛋白(++)，红细胞 10～20 个/HP。p-ANCA阳性，余自身抗体均阴性。肾穿刺病理显示：微小动脉有坏死性炎症性改变，无免疫复合物沉着。肾血管造影未发现血管狭窄。该患者最可能的诊断为",["结节性多动脉炎","Wegener 肉芽肿","系统性红斑狼疮","显微镜下型多血管炎","干燥综合征"],"D",1,"lc","泌尿系统","女性、低热消瘦、多关节痛、肾脏受累（蛋白尿+血尿）、p-ANCA 阳性、肾穿刺示微小动脉坏死性炎症而无免疫复合物沉着——这是显微镜下型多血管炎（MPA）的典型组合。\n鉴别：①结节性多动脉炎为中等动脉受累，ANCA 多为阴性，血管造影可见微动脉瘤；本题造影无血管狭窄，可排除。②Wegener 肉芽肿（GPA）为 c-ANCA 阳性，伴上、下呼吸道肉芽肿性病变，本例无呼吸道症状。③狼疮为 ANA、抗 dsDNA 阳性，肾活检应见\"满堂亮\"免疫复合物沉积，本例无免疫复合物，可排除。④干燥综合征应有口眼干、抗 SSA/SSB 阳性。故为 MPA（D）。\n\n📚 出处：《内科学》第9版·ANCA相关性血管炎·显微镜下型多血管炎"],["患者，男，38 岁。上腹疼痛 6 年，餐前痛。近日疼痛加重，呈持续性，向腰背部放射，伴反酸，有时低热。钡剂造影：十二指肠球部变形。血白细胞 11×109/L，中性粒细胞 0.78。诊断首先考虑为",["慢性胃炎","胃溃疡","胃癌","十二指肠穿透性溃疡","胆囊炎"],"D",1,"lc","消化系统","青年男性、6年周期性餐前（饥饿）痛提示十二指肠溃疡，钡餐见球部变形支持该诊断；近期疼痛转为持续性并向腰背部放射，说明溃疡由球部后壁穿透入胰腺被膜，伴低热、白细胞及中性粒细胞升高，符合穿透性溃疡，故D正确。慢性胃炎无此节律且不向背部放射；胃溃疡多为餐后痛；胃癌病程短、进行性消瘦；胆囊炎为右上腹痛、Murphy征阳性。\n\n📚 出处：《外科学》第9版·消化性溃疡·特殊类型溃疡"],["男性，18 岁，反复发作性气喘，诊断为过敏性哮喘。为了明确致喘的过敏原，以下哪项检查最有意义",["特异性支气管激发试验","过敏原皮肤试验","血清特异性 IgE 测定","血嗜酸性细胞计数","支气管舒张试验"],"A",1,"lc","呼吸系统","过敏原皮肤试验与血清特异性IgE只反映机体对某过敏原已致敏，阳性并不等于该过敏原能诱发支气管收缩；特异性（过敏原）支气管激发试验通过定量吸入可疑过敏原并监测FEV1下降，可直接证实致喘的因果关系，因而是确定致喘过敏原最有价值的检查。血嗜酸性粒细胞计数仅提示变态反应体质；支气管舒张试验用于判断气流受限的可逆性，与过敏原鉴定无关。⚠️原库答案存疑：临床实践中多先以皮肤试验联合特异性IgE筛查，特异性激发试验因风险与设备要求多用于科研。\n\n📚 出处：《支气管哮喘防治指南（2020年版）》·哮喘的辅助检查"],["男性，16 岁，全身水肿，尿少，尿蛋白(＋＋＋＋)。用糖皮质激素治疗过程中，突发右下肢不对称性肿胀伴胀痛，最可能的原因是",["高尿酸血症——痛风","动脉栓塞","右下肢静脉血栓形成","右下肢静脉炎","肾性骨病"],"C",1,"lc","泌尿系统","青少年大量蛋白尿伴水肿提示肾病综合征，抗凝血酶Ⅲ等从尿中丢失、肝代偿合成纤维蛋白原增加及激素治疗使血液呈高凝状态，易并发静脉血栓；突发单侧下肢不对称肿胀伴胀痛是深静脉血栓的典型表现。动脉栓塞以苍白、发凉、剧痛、无脉为主；痛风、静脉炎、肾性骨病均不能解释此表现。故答C。\n\n📚 出处：《内科学》第9版·肾病综合征（血栓栓塞并发症）"],["患者女性，38 岁，无痛性血尿 2 天。尿常规检查：高倍镜下见红细胞满视野。用止血药治疗后尿色转清。B 超检查：膀胱内有一 2.5cm×3cm 占位性病变。膀胱肿瘤不可能的临床表现是",["血尿多为无痛性全程肉眼血尿","血尿程度和肿瘤恶性程度一致","血尿一般呈间歇性发作","可有尿频、尿痛、排尿困难","盆腔广泛浸润可出现下肢水肿"],"B",1,"lc","泌尿系统","膀胱癌最典型的表现是间歇性、无痛性、全程肉眼血尿，可自行停止或减轻，易造成\"已痊愈\"的错觉而延误诊治。关键点：血尿的程度（量、持续时间）与肿瘤的大小、数目、恶性程度并不成正比。有的小肿瘤出血很多，有的晚期大肿瘤反而出血不多。故\"血尿程度和肿瘤恶性程度一致\"是不可能的临床表现（B）。此外肿瘤坏死、溃疡或合并感染时可出现尿频、尿痛、排尿困难；盆腔广泛浸润或转移可致下肢淋巴/静脉回流受阻而水肿。\n\n📚 出处：《外科学》第9版·膀胱肿瘤·临床表现"],["还在，男性，38 岁。不慎从楼梯上跌落，出现吸气时左前胸向内凹陷，呼气时向外凸出的现象。其首要处理是",["吸氧","应用强心剂","胸壁加压包扎","应用抗生素和祛痰药","输液、输血"],"C",1,"lc","呼吸系统","患者吸气时左前胸内陷、呼气时外凸，为多根多处肋骨骨折形成连枷胸（浮动胸壁）的典型反常呼吸。急救关键是用厚敷料、沙袋加压包扎固定浮动胸壁，纠正反常呼吸、减少纵隔摆动与缺氧，故为首要处理。单纯吸氧不能纠正胸壁矛盾运动；强心剂、抗生素与祛痰药、输液输血均为后续支持或针对并发症的措施，不是即刻首要处理。\n\n📚 出处：《外科学》第9版·胸部损伤·肋骨骨折"],["患者，男，60 岁。突发头痛、恶心、呕吐 2 周，伴左侧肢体活动欠灵活。无发热，无抽搐。患者 1 年前行右肺上叶恶性肿瘤切除术。根据此病史首先考虑哪种疾病",["缺血性脑血管病","肺癌脑转移","高血压危象","慢性硬膜下血肿","胶质细胞瘤"],"B",1,"lc","呼吸系统","肺癌（尤其小细胞癌与腺癌）易发生脑转移。患者右肺上叶恶性肿瘤术后1年，出现逐渐加重的头痛、恶心呕吐伴对侧（左侧）肢体活动不灵，符合颅内占位进行性增大的病程，故首先考虑肺癌脑转移。缺血性脑血管病起病急骤、症状数分钟至数小时达高峰，与本例2周渐进不符；高血压危象需有明确高血压病史及血压骤升；慢性硬膜下血肿多有近期头部外伤史；胶质瘤为原发颅内肿瘤，在已有肺癌病史者可能性小。\n\n📚 出处：《外科学》第9版·肺部肿瘤·肺癌"],["患者，男性，主诉头痛伴恶心呕吐 2 个月。入院检查：左侧两点辨别觉、实体觉和对侧肢体的位置觉障碍。外院头颅 CT 示左侧大脑半球肿瘤。根据以上检查，肿瘤最可能位于半球的哪个部位",["额叶","颞叶","顶叶","枕叶","岛叶"],"C",1,"lc","神经与精神","两点辨别觉、实体觉（闭目触摸辨认物体）与位置觉均属皮质复合感觉，其通路为后索—内侧丘系—丘脑—中央后回，须顶叶皮质综合方能完成，故皮质感觉障碍提示顶叶（中央后回及其联络区）病变，顶叶还可见结构性失用、Gerstmann 综合征、对侧忽视。额叶以精神行为异常、运动性失语、强握反射为主；颞叶以上象限盲、幻嗅、记忆障碍为主；枕叶为对侧同向性偏盲。\n\n📚 出处：《神经病学》第8版·神经系统的解剖、生理及病损的定位诊断·顶叶"],["女，26 岁，因停经 42 天，尿 HCG(+)，要求做人工流产。术前妇科检查：宫体后倾后屈，妊娠 6 周大小，软，附件(-)。术中测宫腔深 10cm，吸出组织 20g，未见绒毛，出血少，术毕宫腔深 9.5cm。诊断明确后最合适的处理是",["再次吸宫","再次吸宫及抗生素预防感染","宫缩剂","抗生素抗炎","后穹隆穿刺"],"B",1,"lc","妇产科","术前孕6周大小、宫腔10cm偏深，吸出20g组织却未见绒毛、出血少，提示可能漏吸（如极度前倾前屈或双角子宫宫角妊娠）或合并宫外孕。最合适的处理是再次吸宫以清除宫内妊娠物，并预防性应用抗生素防止感染，术后随诊血HCG与超声，若仍未见宫内妊娠需警惕异位妊娠。单用宫缩剂或仅抗炎不能解决问题。\n\n📚 出处：《妇产科学》第9版·人工流产术并发症"],["56岁妇女，绝经5年。阴道镜下宫颈活检未见异常，宫颈光滑，子宫稍大，2次宫颈刮片均查到腺癌细胞。为明确诊断应选择",["再次行宫颈刮片查癌细胞","行刮宫活组织检查","再次行阴道镜下宫颈活检","行分段刮宫活组织检查","行宫颈椎切活组织检查"],"D",1,"lc","妇产科","绝经后妇女宫颈光滑、阴道镜下活检未见异常，两次宫颈刮片却查到腺癌细胞，提示癌细胞来源于宫腔内膜而非宫颈表面，加之子宫稍大，应高度怀疑子宫内膜癌。确诊需分段刮宫活组织检查（分别取宫颈管与宫腔内膜送病理）。再次刮片、再次阴道镜活检、宫颈锥切均针对宫颈，方向错误。\n\n📚 出处：《妇产科学》第9版·子宫内膜癌"],["女，58 岁，绝经 8 年，发现阴道内脱出肿物 3 个月，休息后可消失。妇科检查：平卧位屏气向下用力时，宫颈脱出阴道口外，宫体仍在阴道内。该患者子宫脱垂的临床分度是",["Ⅲ度","Ⅱ度重","Ⅰ度轻","Ⅱ度轻型","Ⅰ度重型"],"D",1,"lc","妇产科","子宫脱垂以屏气用力时宫颈外口与处女膜缘的关系分度：Ⅰ度轻型为宫颈外口距处女膜缘<4cm未达处女膜缘，重型为宫颈已达处女膜缘、阴道口可见；Ⅱ度轻型为宫颈脱出阴道口外而宫体仍在阴道内，重型为部分宫体脱出；Ⅲ度为宫颈与宫体全部脱出。本例宫颈脱出阴道口外、宫体仍在阴道内，属Ⅱ度轻型。\n\n📚 出处：《妇产科学》第9版·子宫脱垂"],["患者，女，35 岁。继发闭经 1 年，雌激素试验(＋)，FSH、LH 值均＞5U/L，多次重复垂体兴奋试验无反应。闭经的原因在",["丘脑下部","卵巢","垂体前叶","子宫","垂体后叶"],"C",1,"lc","妇产科","雌激素试验（孕激素撤退后无出血，加用雌、孕激素后出血）阳性，说明子宫内膜正常、卵巢能对外源激素反应，病变在更上游的垂体或下丘脑；FSH、LH>5U/L说明下丘脑GnRH分泌并非完全缺如；垂体兴奋试验（GnRH刺激后LH不升高）多次无反应，说明垂体前叶对GnRH无反应，病变定位于垂体前叶。\n\n📚 出处：《妇产科学》第9版·闭经"],["7 岁女孩，不发绀，胸骨左缘第 2 肋间听到Ⅱ级收缩期杂音，肺动脉瓣区第二心音减弱。心正位片示右心室增大，心电图示右室肥厚伴劳损。应诊断为",["室间隔缺损","房间隔缺损","动脉导管未闭","法洛四联症","肺动脉瓣狭窄"],"E",1,"lc","心血管系统","患儿不发绀，胸骨左缘第2肋间收缩期喷射性杂音、肺动脉瓣区第二心音减弱（肺动脉压力不高而右室射血受阻）、右室增大及右室肥厚伴劳损，符合肺动脉瓣狭窄。ASD、VSD、PDA因肺血增多P2均亢进，法洛四联症有中心性发绀及杵状指。故选E。\n\n📚 出处：《内科学》第9版·先天性心血管病·肺动脉瓣狭窄"],["女孩，7 岁，腹痛 4 天，伴恶心、呕吐，体温 38.5℃。于 1 天前开始腹泻，每天 4～6 次，粘液便。粪化验 WBC2～3 个/HP。引起腹泻的原因最不可能为",["急性肠炎","溃疡病急性穿孔","阑尾穿孔腹膜炎","阑尾脓肿","卵巢肿瘤"],"B",1,"lc","消化系统","本例以发热、腹痛、呕吐、黏液便为主要表现，应考虑肠道或盆腔炎症：急性肠炎可有黏液便；阑尾穿孔形成腹膜炎或阑尾脓肿（盆腔脓肿）刺激直肠可引起腹泻、里急后重；卵巢肿瘤作为盆腔占位亦可刺激直肠致排便次数增多。溃疡病急性穿孔表现为突发剧烈腹痛、板状腹、膈下游离气体，7岁儿童罕见，且不以腹泻为表现，故最不可能，选B。\n\n📚 出处：《外科学》第9版·阑尾疾病·阑尾周围脓肿"],["男，6 岁，因发热、畏寒 1 周来急诊。查体：精神、面色差，皮肤有少量瘀点，无黄染及发绀，胸骨左缘第 3～4 肋间有全收缩期杂音，伴震颤，肝肋下 2cm，脾肋下 1cm。Hb100g/L，WBC18×109/L，N80％，L20％。诊断考虑为",["房间隔缺损伴肠伤寒","室间隔缺损伴败血症","动脉导管未闭伴感染性心内膜炎","房间隔缺损伴充血性心力衰竭","室间隔缺损伴感染性心内膜炎"],"E",1,"lc","消化系统","胸骨左缘第3～4肋间全收缩期杂音伴震颤是室间隔缺损（膜部）的典型体征；发热畏寒1周、精神面色差、皮肤瘀点、肝脾肿大，白细胞18×10⁹/L、中性粒80%，提示在室缺基础上并发感染性心内膜炎（赘生物栓塞致皮肤瘀点），故E正确。房间隔缺损为肺动脉瓣区收缩期吹风样杂音、无震颤；动脉导管未闭为连续性机器样杂音；C、D心脏体征与本例不符。\n\n📚 出处：《儿科学》第9版·先天性心脏病·室间隔缺损"],["引起慢性呼衰的最常见疾病是",["脊柱侧凸","肺结核","急性支气管炎","慢性阻塞性肺部疾病","呼吸道感染"],"D",1,"lc","呼吸系统","慢性呼吸衰竭多继发于慢性气道与肺疾病，其中慢性阻塞性肺疾病约占80%以上，因持续气流受限、肺泡通气不足与通气血流比例失调导致慢性缺氧伴二氧化碳潴留。脊柱侧凸等胸廓畸形仅占少数；肺结核为少见病因；急性支气管炎与呼吸道感染多作为慢性呼衰急性加重的诱因，本身不致慢性呼衰。\n\n📚 出处：《内科学》第9版·呼吸衰竭"],["衡量肥胖程度采用",["体重指数","身高指数","血压指数","饮食因素","环境因素"],"A",1,"lc","内分泌与代谢","体重指数（BMI）=体重(kg)/身高(m)²，兼顾身高与体重，与体脂含量及肥胖相关并发症相关性好，是国内外通行的衡量肥胖程度的指标（我国≥24为超重、≥28为肥胖），答A。身高指数、血压指数并非肥胖的评价方法；饮食因素与环境因素只是肥胖发生的影响因素，不能用于衡量肥胖程度，故B、C、D、E均错。\n\n📚 出处：《内科学》第9版·肥胖症·诊断标准"],["关于类风湿因子的叙述，错误的是",["RF 属于自身抗体","RF 的数量常与 RA 的严重程度成正比","类风湿因子分 IgM-RF、IgG-RF 和 IgA-RF","临床常规检测的是 IgM-RF","所有 RA 患者 RF 均阳性"],"E",1,"lc","风湿免疫","类风湿因子是针对变性 IgG 的 Fc 段产生的自身抗体，属抗球蛋白抗体（A 对），按重链不同分为 IgM-RF、IgG-RF、IgA-RF（C 对），临床常规用乳胶凝集法或免疫比浊法检测的是 IgM-RF（D 对）。RF 滴度与疾病活动度、关节破坏程度大致相关（B 对）。但 RF 并非 RA 特异，阳性率约 70%～80%，约 20%～30% 患者血清 RF 阴性（称血清阴性 RA），故 E 说所有患者 RF 均阳性是错误的。\n\n📚 出处：《风湿免疫学》第3版·类风湿关节炎"],["调节呼吸运动最重要的理化因素是",["O2","CO2","H﹢","Na﹢","K﹢"],"B",1,"lc","呼吸系统","CO2是调节呼吸运动最重要、最经常起作用的化学刺激：它易透过血脑屏障，通过刺激延髓中枢化学感受器及外周化学感受器反射性兴奋呼吸中枢，动脉血PCO2仅升高数mmHg即明显增加通气量。低O2主要经颈动脉体、主动脉体兴奋呼吸，作用弱于CO2，且严重缺氧反而直接抑制呼吸中枢；H+不易透过血脑屏障，作用有限；Na+、K+不参与呼吸的化学调节。\n\n📚 出处：《生理学》第9版·呼吸·呼吸运动的调节"],["肾炎性肾病与单纯性肾病的区别是",["水肿明显","胆固醇增高","血浆白蛋白降低明显","有血尿、高血压","大量蛋白尿"],"D",1,"lc","泌尿系统","肾病综合征分单纯型与肾炎型，鉴别点就在于是否有\"肾炎样\"表现。肾炎性肾病诊断标准（4项中具备1项即可）：①明显血尿（离心尿 RBC≥10个/HP，2周内3次以上）；②高血压持续或反复出现（学龄儿童＞130/90mmHg）；③氮质血症（BUN＞10.7mmol/L）；④血清补体 C3 反复降低。\n而水肿、高胆固醇血症、低白蛋白血症、大量蛋白尿这四项是两型共有的肾病综合征诊断条件，不能用于区分。故本题应选 D（有血尿、高血压）。原库答案 B（胆固醇增高）不成立。\n\n📚 出处：《儿科学》第9版·肾病综合征·单纯型与肾炎型的鉴别"],["符合阵发性睡眠性血红蛋白尿实验室检查的是",["血片见大量靶形细胞","酸溶血试验最具诊断价值","糖溶解试验特异性最高","骨髓均为增生活跃或明显活跃","网织红细胞减少"],"B",1,"lc","泌尿系统","阵发性睡眠性血红蛋白尿（PNH）是获得性红细胞膜 GPI 锚连蛋白缺陷病，导致补体调节蛋白（CD55、CD59）缺失，红细胞对补体异常敏感而溶血。实验室检查：\n①酸溶血试验（Ham 试验）：将红细胞置于酸化血清中孵育，PNH 红细胞对补体敏感而溶血，特异性高、最具诊断价值（B 正确）。②蔗糖溶血试验：敏感性高但特异性差，用作筛查（故 C\"特异性最高\"错）。③流式细胞术检测 CD55/CD59 表达缺失为现今确诊金标准。④血片应见破碎红细胞而非大量靶形细胞（靶形见于地贫、肝病、脾切除后）。⑤骨髓可增生减低（部分转为再障），非\"均为增生活跃\"。⑥网织红细胞升高（溶血代偿），非减少。故为 B。\n\n📚 出处：《内科学》第9版·阵发性睡眠性血红蛋白尿·实验室检查"],["明确诊断类风湿关节炎后，新近出现类风湿结节，临床意义是",["类风湿关节炎已诊断明确","进一步证实诊断正确","需要除外其他疾病，如系统性红斑狼疮","说明类风湿关节炎病情活动","需活检才能确定"],"D",1,"lc","运动与骨外科","类风湿结节是RA的关节外表现，与高滴度RF、抗CCP阳性、ESR及CRP升高并存，反映系统性炎症活跃和病情活动，也提示预后较差、关节破坏进展快。诊断已明确时，结节的出现并不用于“证实诊断”或需除外SLE，更不必活检即可判定性质（仅不典型时活检）；其核心临床意义在于提示病情活动、需加强治疗。\n\n📚 出处：《内科学》第9版·类风湿关节炎·关节外表现"],["抗甲状腺药物使甲亢症状消失，基础代谢率基本正常，一般需",["1～2 周","2～4 周","4～8 周","6～8 周","8～10 周"],"C",1,"lc","内分泌与代谢","抗甲状腺药物抑制过氧化物酶介导的碘有机化与偶联，对已合成并储存于滤泡腔的甲状腺激素无效，需待储存激素耗竭后才显效，故临床症状消失、基础代谢率基本降至正常一般需4～8周（多在4～6周起明显改善），答C。1～2周、2～4周激素水平下降有限，多数患者仍有明显高代谢症状；8～10周以上多为重症患者或已进入减量维持阶段，不是“症状基本控制”的通常时间。\n\n📚 出处：《内科学》第9版·甲状腺功能亢进症·抗甲状腺药物治疗"],["下列与胃癌最密切的疾病是",["胃憩室","肥厚性高分泌性胃炎","慢性浅表性胃炎","复合性溃疡","萎缩性胃炎"],"E",1,"lc","消化系统","慢性萎缩性胃炎伴肠上皮化生及异型增生属胃癌前病变，尤其合并幽门螺杆菌感染时胃癌发生率显著升高，故E与胃癌关系最密切。胃憩室、慢性浅表性胃炎、复合性溃疡与胃癌关系不明确；肥厚性高分泌性胃炎（Menetrier病）以蛋白丢失性胃病为主，癌变风险相对低。\n\n📚 出处：《内科学》第9版·慢性胃炎·胃癌前状态"],["下列有关高渗性非酮症性糖尿病昏迷的说法，正确的是",["多见于 1 型糖尿病","一定有重症糖尿病病史","常有明显酸中毒","治疗必须用低渗盐水","多见于老年轻型糖尿病"],"E",1,"lc","泌尿系统","高渗高血糖综合征多见于老年人、2型糖尿病，常为轻型甚至既往未诊断糖尿病；因尚存胰岛素分泌可抑制脂肪分解，酮症与酸中毒轻微或缺失，而以严重高血糖、高血浆渗透压及重度脱水为特征。故A、B、C均不符；治疗首选等渗盐水补液，仅在血钠与血浆渗透压极高时才谨慎用低渗液，D亦错。故答E。\n\n📚 出处：《内科学》第9版·糖尿病急性并发症"],["心脏后负荷过重不包括",["高血压","主动脉瓣狭窄","甲状腺功能亢进症","肺动脉高压","肺动脉瓣狭窄"],"C",1,"lc","心血管系统","后负荷是心室射血时面临的前向阻力：高血压增加左室后负荷，主动脉瓣狭窄增加左室后负荷，肺动脉高压与肺动脉瓣狭窄增加右室后负荷。甲状腺功能亢进为高动力循环状态，代谢增高使回心血量增加、心率加快，主要增加容量（前负荷），并使心肌氧耗增加，不属于后负荷过重。故选C。\n\n📚 出处：《病理生理学》第9版·心功能不全·心力衰竭的病因与诱因"],["脊髓亚急性联合变性的主要部位在",["脊髓前索和侧索","脊髓前索和后索","脊髓后索和侧索","脊髓前角和侧索","脊髓前角和后索"],"C",1,"lc","神经与精神","脊髓亚急性联合变性由维生素 B12 缺乏引起，主要累及脊髓后索（薄束、楔束）与侧索（皮质脊髓侧束），故称“联合”变性。表现为后索受损的深感觉障碍及感觉性共济失调（Romberg 征阳性、踩棉花感），侧索受损的痉挛性截瘫（肌张力增高、腱反射亢进、病理征阳性），可伴周围神经病与大细胞性贫血。前索（脊髓丘脑前束）与前角（下运动神经元）一般不首先受累。\n\n📚 出处：《神经病学》第8版·脊髓疾病·脊髓亚急性联合变性"],["判断肌肉活力的标准中最可靠的是",["颜色","张力","收缩","出血","完整性"],"C",1,"lc","运动与骨外科","判断肌肉活力的经典标准为颜色鲜红、张力正常、刺激后收缩、切缘出血活跃（“4C”），其中以刺激后能否收缩最为可靠，反映肌纤维及神经肌肉接头功能存活。颜色可因缺血、淤血、灯光、血液浸染而失真；张力受温度与肿胀影响；出血受止血带与血压影响；完整性只说明解剖连续，不能反映血运，故均不如收缩可靠。\n\n📚 出处：《外科学》第9版·创伤·软组织损伤的处理"],["颊部的血液供应十分丰富，主要来源于",["眶上动脉","上唇动脉","下唇动脉","颌外动脉、面横动脉、眶下动脉","面动脉"],"D",1,"lc","血液系统","颊部血供为多源吻合：颌外（面）动脉及其分支、上颌动脉发出的面横动脉与眶下动脉、颊动脉等共同供应，且与对侧及邻近区域有丰富吻合，故颊黏膜、颊肌血运极佳，创口愈合快、抗感染力强。眶上动脉、上唇动脉、下唇动脉只供应邻近局部，不能概括颊部血供。\n\n📚 出处：《口腔颌面外科学》第8版·口腔颌面部解剖生理"],["关于植皮治疗小腿慢性溃疡，不正确的措施是",["彻底清除局部坏死组织","肉芽创面上中厚皮片移植","石膏托功能位固定","深溃疡选用肌瓣移植","局部应用抗生素"],"B",1,"lc","外科总论与麻醉","小腿慢性溃疡植皮成败取决于彻底清除坏死组织（A对）、控制感染与静脉高压，使创面床血运良好、无水肿。肉芽创面只能用刃厚（薄）皮片，中厚皮片代谢需求高、抗感染能力差，在肉芽创面上不易成活，故B是不正确的措施。深溃疡露出肌腱、骨面时宜用肌瓣或皮瓣覆盖（D对），术后石膏托固定于功能位（C对）。\n\n📚 出处：《外科学》第9版·皮肤移植"],["尿道下裂发生于",["胚胎的 9～16 周","胚胎的 8～15 周","胚胎的 7～10 周","胚胎的 8～10 周","胚胎的 10～14 周"],"B",1,"lc","泌尿系统","尿道褶自后向前融合形成尿道海绵体部，该过程在胚胎第8~15周完成，此期雄激素不足或受体异常即致融合中止、尿道口异位于腹侧，形成尿道下裂。9~16周、7~10周、8~10周、10~14周与尿道融合的关键时间窗不符。故答B。\n\n📚 出处：《外科学》第9版·泌尿男生殖系统畸形（尿道下裂）"],["关于烧伤创面的处理，以下哪项不妥",["Ⅰ°烧伤一般无需特殊处理","小面积浅Ⅱ°烧伤用包扎疗法时应经常换药","深度烧伤在清创后可外涂抗生素","近年对深度烧伤多采用早期切痂或削痂，并立即植皮","大张异体皮开洞嵌植小块自体皮，可用于自体皮源严重不足者"],"B",1,"lc","外科总论与麻醉","Ⅰ度烧伤一般无需特殊处理（A对）；深度烧伤清创后可外用抗菌药物，近年主张早期切痂或削痂后立即植皮（C、D对）；自体皮源严重不足时可用大张异体皮开洞嵌植小块自体皮（E对）。小面积浅Ⅱ度用包扎疗法时首次换药宜在伤后1周左右，不应经常换药，频繁换药会撕脱新生上皮、增加感染和疼痛，故B不妥。\n\n📚 出处：《外科学》第9版·烧伤"],["关于肾和输尿管结石，下列哪项描述不正确",["肾盂和肾盏结石可无明显症状，仅表现为活动后镜下血尿","结石越大肾绞痛越严重","结石阻塞于输尿管是引起肾绞痛的原因","肾绞痛发作可放射至同侧外阴部","多数病人肾绞痛伴有肉眼血尿或镜下血尿"],"B",1,"lc","泌尿系统","与 lc1300 同一考点：肾绞痛的严重程度与结石大小不成正比，而取决于结石是否造成急性梗阻。小结石在输尿管内移动、刺激管壁痉挛，疼痛更剧；大的肾盂结石或鹿角形结石可长期无症状。故\"结石越大肾绞痛越严重\"不正确（B）。其余描述均正确：肾盂肾盏结石可无症状或仅活动后镜下血尿；输尿管梗阻是绞痛原因；疼痛放射至同侧外阴部；多数病人绞痛发作时伴肉眼/镜下血尿。\n\n📚 出处：《外科学》第9版·尿石症·临床表现"],["有关颅咽管瘤的叙述，下列哪项不正确",["多见于成人","大多位于鞍上","囊性变占多数","肿瘤常有钙化","治疗以手术为主"],"A",1,"lc","神经与精神","颅咽管瘤是胚胎残余组织来源的良性肿瘤，其特点：好发于儿童及青少年（高峰 5～14 岁），是儿童最常见的鞍区肿瘤，成人相对少见，故“多见于成人”不正确。约 70%～95% 位于鞍上；多为囊性或囊实性，囊液呈机油样含胆固醇结晶；约 70%～90% 可见蛋壳样或斑块状钙化，是儿童鞍上钙化最常见原因；治疗以手术切除为主，术后需长期随访内分泌功能。\n\n📚 出处：《外科学》第9版·颅内肿瘤·颅咽管瘤"],["关于瘢痕性幽门梗阻，下述哪项是错误的",["十二指肠溃疡易引起","可同时有痉挛性和水肿因素存在","常发生低氯、低钾性碱中毒","呕吐物含有胆汁","钡餐检查 4 小时后仍可有钡剂存留"],"D",1,"lc","运动与骨外科","瘢痕性幽门梗阻的梗阻部位在幽门，胃内容物不能通过而反流呕吐，故呕吐物为宿食、不含胆汁；若呕吐物含胆汁，提示梗阻位于十二指肠乳头以下。十二指肠球部溃疡最易引起幽门梗阻；梗阻常由瘢痕挛缩叠加痉挛、水肿构成；长期呕吐丢失胃酸与钾，出现低氯、低钾性碱中毒；钡餐4小时后胃内仍有钡剂存留提示排空障碍。\n\n📚 出处：《外科学》第9版·胃十二指肠疾病·瘢痕性幽门梗阻"],["眼睑缺损不超过眼睑全长的多少时可直接缝合而不发生变形和功能障碍",["1/2","1/3","1/4","1/5","1/6"],"C",1,"lc","外科总论与麻醉","眼睑缺损不超过睑全长1/4时，创缘张力小，可直接拉拢缝合而不造成睑裂变形、睑外翻或闭合不全，故C正确。超过1/4（1/3、1/2）直接缝合会产生明显张力，引起睑缘切迹、睑裂缩小、上下睑闭合不全和角膜暴露，须用滑行皮瓣、睑板替代物或游离植皮修复。\n\n📚 出处：《眼科学》第9版·眼睑病"],["下列情况不需行脾切除术的是",["游走脾","脾囊肿","脾肿瘤","脾梗死","脾脓肿"],"D",1,"lc","消化系统","脾梗死多由栓塞（心内膜炎、房颤）或血液病所致，范围局限，可自行机化形成瘢痕，一般无脾功能亢进、破裂或继发感染的风险，以治疗原发病为主，不需切脾，故D正确。游走脾有脾蒂扭转风险；脾囊肿（尤其寄生虫性或巨大囊肿）、脾肿瘤（良恶性）、脾脓肿（易破裂致败血症）均为脾切除指征。\n\n📚 出处：《外科学》第9版·脾疾病·脾切除适应证"],["癫痫的临床诊断大多数情况下需依据",["目睹其发作","脑电图改变","有无家族史","确切的病史","头部 CT 扫描"],"D",1,"lc","神经与精神","癫痫诊断以病史为核心：需详细追问前兆、发作形式、持续时间、意识状态、伴随症状、发作后状态、诱因与频率，最好由目击者或家属补充并借助手机视频；患者发作时多有意识丧失，本人描述常不可靠。脑电图是重要辅助，但常规头皮脑电图发作间期仅 30%～50% 可记录到痫样放电，且痫样放电亦可见于非癫痫人群，不能单独确诊。目睹发作属偶然，家族史仅供病因参考，CT/MRI 用于查找病因与病灶。\n\n📚 出处：《神经病学》第8版·癫痫·诊断"],["下列哪项与血性白带无关",["宫颈癌","安放宫内节育器","子宫内膜癌","宫颈息肉","卵巢癌"],"E",1,"lc","血液系统","血性白带指白带中混有血液，常见于宫颈癌、子宫内膜癌、宫颈息肉、宫颈炎、子宫黏膜下肌瘤及宫内节育器机械刺激等。卵巢癌位于盆腔深部，早期多无症状，典型表现为腹胀、腹水、腹部包块及消化道症状，一般不引起血性白带。故选卵巢癌。\n\n📚 出处：《妇产科学》第9版·子宫颈肿瘤"],["下列哪 流产"],["下列哪项是葡萄胎排出后随访时不必要的",["至少避孕 1 年","定期做胸部 X 线摄片","定期做 HCG 定量测定","定期做妇科检查","定期做阴道细胞学检查"],"E",1,"lc","妇产科","葡萄胎排出后应定期随访：血HCG定量测定（最重要的监测指标，随访至少1年）、妇科检查、超声、定期胸部X线摄片以发现肺转移，并严格避孕1年（宜用阴茎套或口服避孕药）。阴道细胞学检查用于宫颈癌筛查，与滋养细胞肿瘤的随访内容无关，故E不必要。\n\n📚 出处：《妇产科学》第9版·妊娠滋养细胞疾病"],["诊断先天性胆总管囊肿首选的方法是",["X 线腹部平片","X 线钡餐","经皮肝穿胆道造影(PTC)","B 超","CT"],"D",1,"lc","消化系统","B超无创、经济、可重复，能清晰显示胆总管囊性扩张的部位、范围、大小及是否合并结石、肝内胆管扩张，是先天性胆总管囊肿首选的诊断方法（产前即可发现），故D正确。腹部平片仅见软组织影；钡餐只见十二指肠受压移位；PTC有创且有胆漏、感染风险；CT多用于术前评估和排除肿瘤。\n\n📚 出处：《外科学》第9版·胆道疾病·先天性胆管扩张症"],["关于佝偻病性手足搐搦症钙剂疗法，下述哪项是错误的",["10%葡萄糖酸钙 5～10ml","用生理盐水或葡萄糖稀释","缓慢静脉注射","重症者每日注射 2～3 次","连用 5 天后停用"],"E",1,"lc","儿科","维生素D缺乏性手足搐搦症惊厥发作时，钙剂疗法为10%葡萄糖酸钙5～10ml，用等量葡萄糖液或生理盐水稀释后缓慢静脉注射（10分钟以上），重症可每日注射2～3次（A、B、C、D均正确）。抽搐控制后应改为口服钙剂维持，并同时补充维生素D，而非“连用5天后停用”，故E错误，为答案。静注过快可致心率减慢甚至心脏骤停，须监测心率。\n\n📚 出处：《儿科学》第9版·维生素D缺乏性手足搐搦症"],["以下关于腹泻的说法，不正确的是",["轻型腹泻无脱水及中毒症状","中型腹泻有轻度至中度脱水及中毒症状","重度腹泻有明显中毒症状","轻型腹泻大便次数略为增多","中型腹泻大便每天 15 次以内"],"E",1,"lc","消化系统","小儿腹泻按病情分型：轻型每日大便数次至10次以内、无脱水及中毒症状；中型有轻至中度脱水及轻度中毒症状，大便多在10～20次/日；重型有明显中毒症状、重度脱水，大便可达20次/日以上。故A、B、C、D表述正确。中型腹泻大便次数可超过15次，E以15次为界划分中型与重型是错的，故选E。\n\n📚 出处：《儿科学》第9版·小儿腹泻病·临床分型"],["全身型幼年类风湿性关节炎的皮疹是",["环形红斑","蝶形红斑","结节红斑","盘状红斑","充血性斑丘疹"],"E",1,"lc","运动与骨外科","全身型幼年特发性关节炎以弛张高热、随体温升降而现隐退的一过性充血性斑丘疹为特征，皮疹多见于躯干及四肢近端，热退疹消。环形红斑见于风湿热，蝶形红斑见于系统性红斑狼疮，结节红斑多为链球菌感染或结节病表现，盘状红斑见于盘状狼疮。故本型皮疹应选充血性斑丘疹。\n\n📚 出处：《儿科学》第9版·幼年特发性关节炎·全身型"],["关于原发性肾病综合征的饮食治疗，以下正确的是",["水肿阶段给予低盐饮食","严格限制水的入量以免加重水肿","低蛋白饮食以免加重蛋白尿","低热卡饮食以免出现脂肪肝","低钙饮食以免出现肾结石"],"A",1,"lc","泌尿系统","原发性肾病综合征的饮食原则：水肿期低盐（<3g/d，严重水肿时限水）、正常量优质蛋白（1.0g/kg/d，纠正负氮平衡而不加重蛋白尿）、足够热量（30～35kcal/kg/d）、低脂、补充维生素D与钙。故 A 正确。\nB 错误：除非严重低钠血症或高度水肿，一般不需严格限水，过度限水反致血容量不足、加重肾灌注不良。C 错误：低蛋白饮食会加重负氮平衡与营养不良，不利于纠正低白蛋白血症。D 错误：应给予足够热量而非低热卡。E 错误：肾病综合征常伴低钙，应补钙而非低钙。\n\n📚 出处：《内科学》第9版·肾病综合征·一般治疗（饮食）"],["先天性巨结肠术前洗肠准备以多长时间为宜",["1 周","2 周","3 周","4 周","5 周"],"C",1,"lc","消化系统","先天性巨结肠根治术前需行结肠灌洗以清除积粪、减轻肠管扩张与肠壁炎症，一般以2～3周为宜，故选C（3周）。准备时间过短（1周）肠道清洁不彻底、肠管扩张水肿未消退，术后易发生小肠结肠炎和吻合口漏；准备过长则加重患儿营养消耗、延长住院时间，并无额外收益。灌洗期间需注意等渗盐水用量、避免水中毒。\n\n📚 出处：《小儿外科学》·先天性巨结肠·术前准备"],["下列哪项不是新生儿溶血病的临床表现",["发热","黄疸","贫血","肝脾大","胆红素脑病"],"A",1,"lc","儿科","新生儿溶血病由母婴血型不合引起，三大典型表现为黄疸、贫血和肝脾大，重者发生胆红素脑病、胎儿水肿，故B、C、D、E均属其临床表现。发热不是本病固有表现，若出现多提示继发感染或输血、换血反应，故A为答案。Rh溶血病症状重、出现早；ABO溶血病症状相对轻，黄疸为主要表现。\n\n📚 出处：《儿科学》第9版·新生儿溶血病"],["3 个月以内的婴幼儿先天性马蹄内翻足，首选的治疗方法是",["支具固定","三关节固定术","反复手法矫正","保守治疗失败行手术治疗","每 10 天一次注射治疗"],"C",1,"lc","儿科","3个月以内的先天性马蹄内翻足首选非手术的反复手法矫正（配合Ponseti系列石膏），利用婴儿期韧带、关节囊松弛可塑性强的特点逐级矫正畸形，故C正确。支具固定用于矫正后维持，不能替代手法矫正；三关节固定术需待骨骼发育基本成熟（10岁以上）方可施行；每10天一次注射治疗无此疗法；手术仅用于保守治疗失败者。\n\n📚 出处：《外科学》第9版·先天性马蹄内翻足"],["中毒性菌痢的发病机理是",["感染了大量的痢疾杆菌","感染可超过 200 个有侵袭力的痢疾杆菌","患者对痢疾杆菌的内毒素敏感并产生强烈的过敏反应","患者以前没有接触过痢疾杆菌","痢疾杆菌造成严重的结肠粘膜溃疡"],"C",1,"lc","传染病","中毒型菌痢多见于 2～7 岁儿童，其发生不取决于感染菌量多少或侵袭力强弱，而取决于机体对痢疾杆菌内毒素的敏感性：内毒素入血后激发强烈的过敏反应，使儿茶酚胺等血管活性物质大量释放，引起急性微循环障碍，出现感染性休克和/或中毒性脑病，而结肠病变往往轻微。故 C 正确。A、B 强调菌量为普通菌痢的发病条件；D 与发病无关；E 描述的是普通型菌痢的结肠溃疡病变。\n\n📚 出处：《传染病学》第9版·细菌性痢疾"],["新生儿甲状腺功能减低症筛查的最佳时间是",["生后即查血","生后 2～3 天","生后 1 周左右","生后 1 个月左右","生后 3 个月左右"],"B",1,"lc","儿科","新生儿先天性甲状腺功能减低症筛查应在生后2～3天（充分哺乳48～72小时后）采集足跟血测定TSH，此时可避开出生时生理性TSH升高的干扰，又能早期发现病例。生后即查血易受母体激素和分娩应激影响、假阳性高；生后1周、1个月、3个月才开始筛查均延误诊断，可造成不可逆的智力与体格发育损害，故B正确。\n\n📚 出处：《儿科学》第9版·先天性甲状腺功能减低症"],["下列哪项不是甲状腺髓样癌的特点",["起源于 C 细胞的恶性肿瘤","能分泌降钙素","部分为家族性常染色体显性遗传","免疫组织化学染色常显示 Calcitonin 阴性","间质内有淀粉样物质沉积"],"D",1,"lc","内分泌与代谢","甲状腺髓样癌起源于滤泡旁C细胞，特征性分泌降钙素，故免疫组化Calcitonin应为阳性；约20%～25%为家族性（MEN-2A、MEN-2B及家族性髓样癌），呈常染色体显性遗传；间质内常见淀粉样物质沉积，降钙素与CEA免疫组化阳性是病理诊断依据。因此D“常显示Calcitonin阴性”与本病特点相反，为应选项，其余四项均符合髓样癌特点。\n\n📚 出处：《病理学》第9版·甲状腺肿瘤·甲状腺髓样癌"],["关于甲状腺乳头状癌，下列叙述不正确的是",["为甲状腺癌最常见的类型","青少年女性多见","本癌发现时约 50%已有颈淋巴结转移，因此预后很差","生长较慢，恶性程度较低","有时原发灶很小，临床上首先发现转移病灶"],"C",1,"lc","内分泌与代谢","乳头状癌发现时约50%已有颈淋巴结转移，但淋巴道转移对预后影响远小于远处血行转移，该癌生长缓慢、分化好、恶性程度低，规范手术加131I及TSH抑制治疗后10年生存率可达90%以上，故C“因此预后很差”不正确，为应选项。A、B、D、E均正确：乳头状癌占甲状腺癌80%以上、多见于中青年女性、原发灶可很小而以颈部淋巴结肿大为首发表现。\n\n📚 出处：《外科学》第9版·甲状腺癌·病理类型与预后"],["含牙囊肿的病理特点是",["囊肿内含牙","牙冠位于囊腔，囊壁附着于牙颈部","囊壁内炎症细胞","X 光照片见透光区中含牙","衬里上皮厚"],"B",1,"lc","眼耳鼻喉口腔","含牙囊肿（滤泡囊肿）来源于缩余釉上皮，其病理学标志是囊壁附着于牙颈部（釉牙骨质界），牙冠位于囊腔内、牙根留在囊外，故B正确。A只说“囊内含牙”，过于笼统，不能作为病理诊断标准；C囊壁炎症细胞浸润见于炎性囊肿；D为X线表现而非病理特点；E衬里上皮为薄层无角化复层鳞状上皮，多有黏液化生，并非增厚。\n\n📚 出处：《口腔组织病理学》第8版·牙源性肿瘤与囊肿"],["温度对荧光分析影响的正确描述是",["溶液温度降低，荧光效率增加，荧光强度增加","溶液温度升高，荧光效率不变，荧光强度不变","溶液温度降低，荧光效率不变，荧光强度不变","溶液温度升高，自熄灭现象减少","溶液温度升高，荧光效率增加，荧光强度增加"],"A",1,"lc","理化与中毒","荧光是分子吸收光能后由第一激发单线态返回基态发出的光。温度升高使分子运动加剧、碰撞频率增加，无辐射去激发的内转换与系间跨越增多（自熄灭增强），荧光效率与荧光强度随之下降；温度降低则荧光效率升高、强度增强，故 A 正确，B、C、E 描述的温度效应方向错误。D 称温度升高自熄灭减少，与实际相反。\n\n📚 出处：《临床生物化学检验》第5版·光谱分析技术"],["关于金黄色葡萄球菌的描述，下列正确的是",["革兰染色阴性","能产生凝固酶","不发酵甘露醇","培养需要特殊培养基","血液为主要带菌部位"],"B",1,"lc","临床综合","金黄色葡萄球菌为革兰阳性球菌，呈葡萄串状排列，A错；能产生血浆凝固酶，是判断其致病力的重要指标，B正确；可发酵甘露醇，C错；在普通培养基上生长良好，不需特殊培养基，D错；主要寄居于鼻前庭和皮肤，血液并非主要带菌部位，菌血症只是感染扩散的结果，E错。\n\n📚 出处：《外科学》第9版·外科感染（常见化脓性致病菌）"],["下列关于血小板的描述，正确的是",["血小板膜上无 HLA 抗原","血小板膜上 HLA 抗原大部分吸附于血小板表面","血小板上 HLA 抗原是血小板膜的一个组成部分","血小板不能检出红细胞 A 抗原和 B 抗原","血小板本身无特异抗原"],"B",1,"lc","血液系统","血小板膜上有HLA-Ⅰ类抗原，其中一部分为膜固有成分，但大部分是从血浆中吸附到血小板表面的HLA抗原，反复输注血小板易被受者HLA抗体识别而致输注无效。血小板还可检出ABO血型A、B抗原，并具有血小板特异性抗原（HPA系统）。故A、C、D、E均错。\n\n📚 出处：《临床输血学检验》第5版·血小板血型系统"],["呼吸衰竭伴有严重低氧血症时可能发生的酸碱平衡紊乱是",["代谢性酸中毒","呼吸性酸中毒","代谢性碱中毒","呼吸性碱中毒","混合性酸碱紊乱"],"E",1,"lc","呼吸系统","严重低氧血症时组织缺氧、无氧酵解增加致乳酸堆积，形成代谢性酸中毒；缺氧刺激过度通气使PaCO2下降，可形成呼吸性碱中毒，若合并呼吸肌疲劳或CO2潴留则转为呼吸性酸中毒，故临床常见复合型（混合性）酸碱失衡。单用代酸、呼酸、代碱或呼碱之一难以概括严重低氧血症时双重紊乱并存的特点。\n\n📚 出处：《内科学》第9版·呼吸衰竭·酸碱平衡紊乱"],["下列关于芬太尼静脉麻醉时对呼吸系统的影响，哪项不正确",["注射速度过快，可以引起呛咳反应","芬太尼可使呼吸频率减慢，但对潮气量无影响","大剂量使用芬太尼可出现延迟性呼吸抑制","芬太尼引起的肌肉僵硬可严重妨碍通气","在苏醒过程中会出现呼吸遗忘"],"B",1,"lc","外科总论与麻醉","芬太尼静注过快可兴奋气道引起呛咳、肌僵（A、D对）；大剂量或反复给药可因外周室再分布出现延迟性呼吸抑制（C对）；苏醒期呼吸中枢对CO2敏感性尚未恢复，可出现呼吸遗忘（E对）。芬太尼既减慢呼吸频率，也降低潮气量，使PaCO2升高，故B“对潮气量无影响”是不正确的描述。\n\n📚 出处：《临床麻醉学》第4版·静脉麻醉药"],["常用的 PCA 分类不包括",["静脉 PCA(PCIA)","硬膜外 PCA(PCEA)","胃肠道 PCA","皮下 PCA(PCSA)","胸膜腔和神经丛 PCA"],"C",1,"lc","临床综合","PCA即患者自控镇痛，给药途径包括静脉（PCIA）、硬膜外（PCEA）、皮下（PCSA）、外周神经丛阻滞及胸膜腔给药等，均借助可控输注泵实现按需镇痛。胃肠道给药吸收慢、起效与剂量不可控，无法实现自控，因此不列为PCA分类之一。\n\n📚 出处：《临床麻醉学》第4版·术后镇痛"],["人体体液和组织中，哪一种最易引起声衰减",["胆汁、尿液","皮下脂肪","肝、脾","肌肉","肌腱"],"E",1,"lc","眼耳鼻喉口腔","声衰减由组织对声能的吸收与界面散射共同决定。含水量高的液体（胆汁、尿液）几乎不衰减；皮下脂肪衰减最低；肝脾居中；肌肉高于肝脾；肌腱因胶原纤维致密、排列规则，衰减系数最大，骨骼、钙化组织亦高。故“最易引起声衰减”选E。A、B、C、D依此序列衰减递增，均为干扰项。\n\n📚 出处：《医学影像学》第8版·超声诊断·超声物理基础"],["二尖瓣血流频谱呈舒张早期单峰型频谱，提示",["二尖瓣狭窄合并关闭不全","二尖瓣狭窄合并肺动脉高压","二尖瓣狭窄合并房间隔缺损","二尖瓣狭窄合并右心功能不全","二尖瓣狭窄合并心房纤颤"],"E",1,"lc","心血管系统","正常二尖瓣血流频谱为舒张早期E峰与舒张晚期（心房收缩）A峰双峰。二尖瓣狭窄时A峰本就依赖心房有效收缩，一旦合并心房颤动，心房丧失有效收缩、A峰消失，只剩舒张早期充盈的E峰，故呈单峰型频谱。合并关闭不全、肺动脉高压、房缺或右心功能不全都不会使A峰消失。故选E。\n\n📚 出处：《超声医学》第6版·心脏瓣膜病·二尖瓣狭窄"],["关于胎儿头臀长(CRL)的叙述，以下不正确的是",["测量 CRL，适用于 7～12 孕周","孕 8 周以前，所测头臀长实际是颈臀长","测量 CRL 的标准切面为胎体最长、最直的正中冠状切面","测量 CRL 时，不能包括胎儿肢体或卵黄囊","胚胎的颅顶部至臀部外缘的距离即为 CRL"],"C",1,"lc","妇产科","头臀长（CRL）测量适用于孕7～13周，取胎体最长、最直的正中矢状切面（不是冠状切面），从颅顶部测至臀部外缘，测量时须避开胎儿肢体与卵黄囊，以免高估孕周。孕8周以前胚胎尚无明显肢体屈曲，所测实为颈臀长。故C所述切面错误。\n\n📚 出处：《超声医学》第6版·产科超声"],["放射性核素显像的缺点是",["有创性检查","辐射损伤大","过敏反应","不符合生理要求","图像分辨率有限"],"E",1,"lc","医学影像与检验","放射性核素显像以放射性药物参与体内生理代谢过程为基础，属功能性显像，灵敏度高、可定量，但受探头灵敏度和光子统计限制，空间分辨率明显低于 CT、MRI 和超声（一般 8～15mm），病灶过小易漏诊，故其缺点是图像分辨率有限（E）。该检查静脉给药基本无创（A 错）；所用放射性药物剂量小、半衰期短，辐射剂量低于多数 CT 检查（B 错）；放射性药物极少引起过敏（C 错）；显像正是反映生理生化过程，符合生理要求（D 错）。\n\n📚 出处：《核医学》第9版·放射性核素显像"],["假设某种肿瘤细胞的 SF2 为 0.5，不考虑修复因素，经过 3 次 2Gy 照射治疗后，存活细胞比例为",["1/16","1/2","1/8","1/4","1/32"],"C",1,"lc","基础与预防医学","SF2 指单次 2Gy 照射后的细胞存活分数。本题 SF2=0.5，且不考虑修复（无亚致死损伤修复造成的肩区上移），各次照射的杀伤效应可相乘：3 次 2Gy 总存活分数=0.5×0.5×0.5=0.125=1/8，故 C 正确。B 1/2 为 1 次照射、D 1/4 为 2 次、A 1/16 为 4 次、E 1/32 为 5 次照射的结果，均与 3 次照射不符。\n\n📚 出处：《肿瘤放射治疗学》·放射生物学中的细胞存活曲线"],["目前关于门控心肌断层显像的采集，常用的采集矩阵为",["32×32","64×64","128×128","256×256","512×512"],"B",1,"lc","心血管系统","门控心肌断层显像需在一次采集内获得多帧不同时相图像，为兼顾计数统计与空间分辨率，常规采用64×64采集矩阵；32×32像素过粗、图像失真，128×128多用于非门控心肌灌注或大矩阵高分辨采集。故选B。\n\n📚 出处：《核医学》第9版·心血管系统显像·门控心肌断层采集"],["下列哪项当行阴茎癌姑息放射治疗",["肿瘤直径＜2cm","无腹股沟淋巴结转移","外生，表浅型","肿瘤直径＞2cm，有卫星结节","术后残余病灶"],"D",1,"lc","临床综合","阴茎癌放疗选择取决于病变范围：直径＜2cm、外生表浅、无腹股沟淋巴结转移者可行根治性放疗，A、B、C属根治指征；术后残余或复发灶可补充照射。而直径＞2cm并伴卫星结节者属晚期，手术难获根治，宜行姑息放疗以缓解疼痛、控制局部病灶，故选D。\n\n📚 出处：《外科学》第9版·泌尿男生殖系统肿瘤（阴茎癌）"],["照射 75Gy 不发生严重并发症的组织是",["肾上腺","皮肤","子宫","甲状腺","肺"],"C",1,"lc","临床综合","正常组织放射耐受量差异显著：睾丸卵巢最低，肺TD5/5约30～35Gy，皮肤约55Gy，甲状腺、肾上腺约45～60Gy，照射75Gy多出现严重并发症。子宫对射线相对不敏感，耐受量在100Gy以上，宫颈癌放疗外照射加腔内照射总量常超过75Gy而不发生严重并发症，故选C。\n\n📚 出处：《核医学》第9版·放射性核素治疗（正常组织辐射耐受）"],["软组织肉瘤术前放射治疗照射淋巴结区的指征是",["常规放射治疗淋巴结区","肿瘤接近淋巴结区(相距＜10cm)","肿瘤接近淋巴结区(相距＜15cm)","分化好的肉瘤","脂肪肉瘤"],"B",1,"lc","外科总论与麻醉","软组织肉瘤以血行转移为主，区域淋巴结转移率低，术前放疗一般不做淋巴结区的预防性照射；只有肿瘤解剖位置接近区域淋巴结区（相距＜10cm）时，才需将淋巴结引流区纳入照射野，故B正确。A“常规照射淋巴结区”不符合其生物学行为；分化好的肉瘤（D）与脂肪肉瘤（E）放疗敏感性低，也不是加照淋巴结区的指征。\n\n📚 出处：《外科学》第9版·肿瘤"],["下列关于硝酸甘油的不良反应，叙述不正确的是",["直立性低血压","连续用药易产生耐受性","支气管哮喘","心动过速","头痛"],"C",1,"lc","临床综合","硝酸甘油扩张容量血管和动脉，常见搏动性头痛、面部潮红、直立性低血压、反射性心动过速，连续用药易产生耐受性，大剂量久用可致高铁血红蛋白血症。它不引起支气管收缩，哮喘并非其不良反应，诱发哮喘的是β受体阻滞剂，故C叙述不正确。\n\n📚 出处：《药理学》第9版·抗心绞痛药"],["关于窦性心动过缓的描述，不正确的是",["可出现在甲状腺功能减退的患者","常见于夜间睡眠时","可伴窦性心律不齐","P 波常见切迹","心率＜60 次/分"],"D",1,"lc","心血管系统","窦性心动过缓指窦性心律、心率<60次/分，常见于睡眠、运动员、甲状腺功能减退、颅内压增高及应用β受体阻滞剂等；常伴呼吸性窦性心律不齐。其P波形态与正常窦性P波一致，无切迹；P波增宽有切迹（二尖瓣型P波）是左心房增大的表现。故不正确的是D。\n\n📚 出处：《诊断学》第9版·心电图·窦性心律失常"],["能选择性地抑制虫体肌肉内的琥珀酸脱氢酶，影响虫体肌肉的无氧代谢，使虫体麻痹的抗肠线虫药是",["噻苯达唑","左旋嘧唑","甲苯达唑","氟苯咪唑","阿苯达唑"],"B",1,"lc","消化系统","左旋咪唑能选择性抑制虫体肌肉内琥珀酸脱氢酶，阻断延胡索酸还原为琥珀酸的无氧代谢，使虫体肌肉麻痹、随肠蠕动排出，故B正确（题干左旋嘧唑为左旋咪唑的笔误）。噻苯达唑、甲苯达唑、氟苯咪唑、阿苯达唑主要抑制微管蛋白聚合、阻断虫体葡萄糖摄取，机制与题干描述不同。\n\n📚 出处：《药理学》第9版·抗肠蠕虫药"],["治疗与抢救休克首要的中心环节为",["应用血管活性药物","应用纠酸药物","消除病因，补充血容量","应用肾上腺皮质激素","应用肝素防止 DIC"],"C",1,"lc","外科总论与麻醉","休克是有效循环血量不足引起组织灌注与氧供障碍的综合征，治疗必须同时抓住两个不可替代的中心环节：尽快消除病因（止血、清除或引流感染灶、解除心脏压塞等）和迅速补充血容量以恢复有效循环量，故C正确。血管活性药、纠酸药、糖皮质激素、肝素均为辅助或针对性措施，不能取代扩容与病因处理，单独依赖还会掩盖病情。\n\n📚 出处：《外科学》第9版·外科休克"],["对心跳呼吸骤停的初期复苏措施中不包括",["解除舌后坠","清除分泌物或呕吐物","口对口人工呼吸","心脏按压","留置导尿"],"E",1,"lc","心血管系统","初期复苏（基础生命支持）按ABC顺序进行：开放气道（解除舌后坠）、清除口咽分泌物与呕吐物保持气道通畅、口对口或简易呼吸器人工通气、胸外心脏按压。留置导尿属复苏成功后（后续生命支持与监护）的处理措施，不是初期复苏内容。故选E。\n\n📚 出处：《外科学》第9版·心肺脑复苏·初期复苏"],["休克治疗过程中，最重要的观察指标是",["血压","脉搏","呼吸","神志","尿量"],"E",1,"lc","外科总论与麻醉","尿量直接反映肾灌注，进而反映全身有效循环血量与组织灌注，是最实用、最敏感的床边指标：成人应维持≥30ml/h，低于此值提示血容量不足或肾灌注不良，扩容有效时尿量最先回升，故E正确。血压受代偿机制和血管活性药影响，可正常而组织仍低灌注；脉搏、呼吸、神志的变化较晚或缺乏特异性。\n\n📚 出处：《外科学》第9版·外科休克"],["正常体温时，一旦心脏停搏，脑组织储备的糖原和 ATP 逐渐耗尽的时间是",["15～20 分钟","2～4 分钟","10～15 分钟","4～6 分钟","5～10 分钟"],"D",1,"lc","心血管系统","常温下脑对缺氧耐受极差：循环停止后氧储备约10秒耗尽，脑内葡萄糖与糖原2～4分钟耗尽，ATP约4～6分钟耗竭，此后出现不可逆脑损伤。这4～6分钟即心肺复苏“黄金时间”的理论依据，故要求4分钟内开始有效复苏。故选D。\n\n📚 出处：《外科学》第9版·心肺脑复苏·脑缺血耐受"],["心室颤动首次除颤用",["50～100J","100 鼻喉口腔","鼻咽部淋巴管丰富，主要引流至咽后淋巴结与颈深上淋巴结，原发灶隐蔽、早期症状轻微，故颈淋巴结肿大常为首发症状，约60%的患者以此就诊，多位于Ⅱ区、单侧、质硬、逐渐增大且固定。临床遇成人单侧无痛性颈部淋巴结肿大，伴回吸涕血、耳闷或分泌性中耳炎者应详查鼻咽部。A、B、D、E数值与教材不符。\n\n📚 出处：《耳鼻咽喉头颈外科学》第9版·咽科学·鼻咽肿瘤"],["Coats 病好发于",["男性儿童","女性儿童","男性成人","女性成人","老年人"],"A",1,"lc","眼耳鼻喉口腔","Coats病多在10岁前发病，以男性儿童最为多见，绝大多数为单眼受累，故A正确。B不符合性别分布；C、D成人少见；E老年人不会发病。临床上应与视网膜母细胞瘤（白瞳症、钙化）、早产儿视网膜病变、家族性渗出性玻璃体视网膜病变相鉴别。\n\n📚 出处：《眼科学》第9版·视网膜病·视网膜血管病"],["我国儿童盲的主要病因是",["营养性","感染性","先天性或遗传性","外伤性","其他"],"C",1,"lc","儿科","我国儿童盲的病因谱已随经济发展明显改变，目前以先天性及遗传性眼病为主，如先天性白内障、先天性青光眼、先天性视网膜营养不良、早产儿视网膜病变及先天性眼畸形，故C正确。营养性（维生素A缺乏所致角膜软化）、感染性（沙眼、麻疹并发角膜炎）所致儿童盲现已大幅减少，外伤性居次要地位。\n\n📚 出处：《眼科学》第9版·儿童盲与低视力"],["引起眼球内陷的情况主要是",["眶内血管扩张","眶内寄生虫","近视","眼眶肿瘤","眶脂肪吸收"],"E",1,"lc","眼耳鼻喉口腔","眼球位置取决于眶腔容积与眶内容物（脂肪、肌肉、血管）体积的平衡。眶脂肪吸收或萎缩（老年、消瘦、外伤后脂肪坏死、眶内手术后）使眶内容物减少，导致眼球内陷，故E正确。A眶内血管扩张、B眶内寄生虫、D眼眶肿瘤均使眶内容物增加而表现为眼球突出；C近视眼轴增长不引起内陷。\n\n📚 出处：《眼科学》第9版·眼眶病·概述"],["蕈样肉芽肿是一种",["异物肉芽肿","真菌性肉芽肿","低度恶性的组织细胞瘤","B 淋巴细胞淋巴瘤","T 淋巴细胞淋巴瘤"],"E",1,"lc","临床综合","蕈样肉芽肿是原发于皮肤的T细胞淋巴瘤，皮损由斑片、浸润性斑块进展为肿瘤，病理见亲表皮性异型淋巴细胞及Pautrier微脓肿。它不是异物性或真菌性肉芽肿（A、B错），也不是组织细胞瘤或B细胞淋巴瘤（C、D错），故选E。\n\n📚 出处：《皮肤性病学》第9版·皮肤淋巴瘤（蕈样肉芽肿）"],["药疹最严重的类型是",["荨麻疹型","猩红热型","剥脱性皮炎型","固定性皮炎","大疱性表皮松解坏死型"],"E",1,"lc","临床综合","大疱性表皮松解坏死型药疹起病急骤，在红斑基础上出现大面积松弛性大疱与表皮坏死剥脱，尼氏征阳性，伴高热、黏膜糜烂及肝肾功能损害、电解质紊乱，病死率高，为药疹中最严重类型。猩红热型、荨麻疹型、固定性药疹病情轻；剥脱性皮炎型较重，但预后仍优于本型。\n\n📚 出处：《皮肤性病学》第9版·药疹"],["关于花斑癣，下列说法不正确的是",["是一种浅表真菌病","一般以儿童多见","皮疹无炎性反应，偶有轻度瘙痒感","由糠秕马拉色菌感染表皮角质层引起","病因是卵圆形糠秕孢子菌"],"B",1,"lc","皮肤性病","花斑癣（花斑糠疹）由糠秕马拉色菌（旧称卵圆形糠秕孢子菌）侵犯表皮角质层所致，属浅表真菌病（A、D、E正确）；皮损为色素沉着或减退斑，覆细薄糠状鳞屑，无明显炎症反应，偶有轻度瘙痒（C正确）。该病在皮脂分泌旺盛的青春期后发病，以青壮年男性多见，儿童少见，故B“以儿童多见”不正确。\n\n📚 出处：《皮肤性病学》第9版·花斑癣"],["下列哪种说法是正确的",["部分或全部不能再现以往的经验称为记忆错误","由于再现的失真而引起的记忆障碍称为遗忘","病人以想象的、未曾亲身经历过的事件来填补亲身经历的记忆称为错构","将过去经历过的事物在具体时间、具体人物或地点上搞错了，称为错构","病人把从未见过的人当作熟人或朋友认识称为虚构"],"D",1,"lc","临床综合","错构属记忆质变，指将过去经历的真实事件在时间、地点、人物关系上错误组合，故D正确。A所述为遗忘；B把再现失真归于遗忘，实为记忆错误；以想象、未曾经历的事件填补记忆空白是虚构，C错；把从未见过的人当作熟人属错认（旧事如新类），E错。\n\n📚 出处：《精神病学》第8版·精神障碍的症状学（记忆障碍）"],["吩噻嗪类药物所致锥体外系反应症状不包括",["急性肌张力障碍","静坐不能","帕金森氏综合征","体位性低血压","迟发性运动障碍"],"D",1,"lc","神经与精神","吩噻嗪类（氯丙嗪、奋乃静等）阻断黑质-纹状体 D2 受体，引起锥体外系反应，共四种：①急性肌张力障碍（用药数日内，眼上翻、斜颈、角弓反张）；②药源性帕金森综合征（震颤、肌强直、运动减少）；③静坐不能；④迟发性运动障碍（长期用药后口-舌-颊三联征）。体位性低血压由阻断外周 α1 受体所致，属心血管不良反应，不属于锥体外系反应。\n\n📚 出处：《精神病学》第8版·精神药物的不良反应"],["慢性脑病综合征的临床特征为",["情感障碍","记忆障碍","行为障碍","感知障碍","全面性智能障碍"],"E",1,"lc","神经与精神","慢性脑病综合征指脑器质性病变所致的慢性进行性全面智能损害，核心是全面性智能障碍：记忆、计算、理解、判断、抽象概括能力及人格全面衰退，常伴情感淡漠或幼稚、行为改变，最终影响社会功能，常见于阿尔茨海默病、血管性痴呆。记忆障碍虽常为首发和突出表现，但单纯的情感、行为、感知或记忆障碍可见于多种功能性精神障碍，不足以概括本综合征的本质。\n\n📚 出处：《精神病学》第8版·脑器质性精神障碍·痴呆"],["女性，20 岁，反复牙龈出血及月经增多 1 年半。查体：轻度贫血貌，肝、脾未触及。实验室检查：Hb80g/L，白细胞正常，血小板 30×109/L，出血时间延长，凝血时间正常；骨髓增生明显活跃，红系占 30%，巨核细胞明显增多，骨髓内、外铁均减少。其诊断是",["慢性 ITP","慢性再障","缺铁性贫血","慢性 ITP 并缺铁性贫血","溶血性贫血"],"D",1,"lc","妇产科","血小板30×10^9/L、出血时间延长而凝血时间正常、骨髓巨核细胞增多伴成熟障碍、红系代偿增生，符合慢性ITP；同时长期月经过多导致失铁，出现Hb80g/L、骨髓内外铁均减少，故合并缺铁性贫血。再障应全血细胞减少、骨髓增生低下；单纯缺铁性贫血血小板正常；溶贫应有网织红细胞增高、胆红素升高等。\n\n📚 出处：《内科学》第9版·血小板减少性紫癜"],["男性，30 岁，半天前在农田劳动中突然剧烈头痛，恶心。体检：体温 37℃，颈部抵抗，克氏征阳性，无偏瘫。头颅 CT 示血管畸形，心电图示心肌缺血。首要的措施是",["绝对卧床","止血剂","脑代谢活化剂","抗生素","改善心肌缺血"],"A",1,"lc","心血管系统","青年男性劳动中突发剧烈头痛、呕吐、颈部抵抗、克氏征阳性，CT示脑血管畸形，为血管畸形破裂所致蛛网膜下腔出血（心电图心肌缺血为儿茶酚胺风暴所致）。首要措施是绝对卧床、保持安静、避免用力搬动与情绪激动、镇静止痛通便，以防再出血；止血剂、脑代谢活化剂、抗生素均非首要，改善心肌缺血应随颅内病变处理。故选A。\n\n📚 出处：《神经病学》第8版·脑血管疾病·蛛网膜下腔出血"],["男，50 岁，肥胖，2 型糖尿病 5 年。口服二甲双胍 250mg，3 次/日，5 个月前因外伤发生左足溃疡至今未愈。化验：空腹血糖 7.2mmol/L，三餐后血糖分别为 9.2mmol/L，8.7mmol/L，8.6mmol/L。控制糖尿病的最佳治疗方案应选择",["增加二甲双胍剂量","加用胰岛素制剂","加用磺脲类口服降糖药","加用α-葡萄糖苷酶抑制剂","加用噻唑烷二酮类药"],"B",1,"lc","泌尿系统","患者已发生糖尿病足溃疡且5个月未愈，血糖控制不佳（空腹7.2mmol/L、餐后近9mmol/L），此时需迅速可靠地控糖以利创面愈合，胰岛素剂量可调、无剂量上限、不受肝肾功能和感染影响，是首选。二甲双胍已近足量；磺脲类低血糖风险大；α-糖苷酶抑制剂降糖弱；噻唑烷二酮类起效慢且有水钠潴留。故答B。\n\n📚 出处：《内科学》第9版·糖尿病（胰岛素治疗适应证）"],["男性，30 岁，确诊为急性早幼粒细胞白血病(M3)，化疗时突发 DIC。下列检查结果不符合的是",["血小板数明显减少","血浆 D-二聚体水平升高","纤维蛋白原浓度降低","血纤维蛋白肽(FPA)水平下降","3P 试验(+)"],"D",1,"lc","血液系统","DIC时凝血酶大量生成，裂解纤维蛋白原α链、β链释放纤维蛋白肽A（FPA）与FPB，故FPA应升高而不是下降。同时可见血小板消耗性减少、纤维蛋白原降低、D-二聚体与FDP升高、3P试验阳性。M3早幼粒细胞颗粒富含组织因子样促凝物质，化疗杀灭细胞最易诱发DIC，故FPA下降不符合。\n\n📚 出处：《内科学》第9版·弥散性血管内凝血"],["男性，30 岁，工作时不慎造成右手背的热压伤(三度烧伤)，伤及皮下筋膜、肌腱及骨、关节，并伴有严重的继发畸形瘢痕贴在骨及损伤肌腱表面，几乎没有滑动，掌指关节过伸，呈半脱位或全脱位，侧副韧带严重挛缩，手指过伸，几乎没有被动活动，手掌的横弓及纵弓消失，拇指呈严重内收畸形。此种爪形手的瘢痕彻底切除、挛缩松解后的创面修复，最好采用",["刃厚皮片","中厚皮片","全厚皮片","皮瓣","肌皮瓣"],"D",1,"lc","运动与骨外科","手背深度烧伤后瘢痕彻底切除、挛缩松解，必然造成肌腱、骨与关节裸露且需恢复滑动面，此时必须用带血液供应的皮瓣覆盖；游离皮片（刃厚、中厚、全厚）无自身血供，在无血运的骨与肌腱上难以成活，且皮片挛缩会再次形成畸形。肌皮瓣虽血供好，但过于臃肿，不利于手背精细滑动与外形，故手背首选筋膜皮瓣或带蒂/游离皮瓣。\n\n📚 出处：《外科学》第9版·手外伤·手部创面的覆盖"],["成年男性右侧膝关节以下烧伤，其烧伤面积占人体体表面积的百分比为",["5%","6%","8%","10%","13%"],"D",1,"lc","运动与骨外科","按中国新九分法，双下肢连同臀部共占46%，其中臀部5%、双大腿21%、双小腿13%、双足7%，故单侧下肢为23%，单侧小腿6.5%、单侧足3.5%。膝关节以下即小腿加足，合计约10%。故选10%。注意女性臀足比例与儿童头大下肢小需按年龄修正。\n\n📚 出处：《外科学》第9版·烧伤·烧伤面积估算"],["男，29 岁，因右眶区包块 29 年入院。患者自出生时，其家人即发现其右眶区有一蚕豆大小的包块，包块随着年纪的增长而逐渐增长。入院查体见包块面积约 10cm×10cm，明显突出皮肤表面，表面有多处暗红色斑块，温度高于周围正常的皮肤，可扪及持续的震颤及血管搏动。为指导治疗，首选下列哪项检查",["颅脑 CT","DSA","核素扫描","X 线","彩色多普勒超声检查"],"B",1,"lc","皮肤性病","患者自出生即有眶周包块并随年龄增长，表面暗红斑、局部温度升高、可扪及震颤与血管搏动，符合先天性动静脉畸形（蔓状血管瘤）的血流动力学特征。手术或介入治疗前必须明确供血动脉、引流静脉及有无动静脉瘘，数字减影血管造影（DSA）是显示血管构筑的金标准，故为首选。CT、X线、核素扫描、彩色多普勒只能提示病变范围和血流，不能精确显示血管解剖。\n\n📚 出处：《外科学》第9版·血管瘤与血管畸形"],["男性，23 岁，2 个月前诊断为右上肺结核，给予抗结核治疗。1 周前右前胸壁出现一包块，有波动感，局部皮温不高。实验室检查：ESR18mm/h。正确的处理是",["穿刺以明确诊断","切开引流","胸壁结核病灶清除","脓腔灌洗","增加抗结核药剂量"],"C",1,"lc","呼吸系统","胸壁出现波动性包块、局部皮温不高、ESR仅轻度增快，为结核性寒性脓肿（胸壁结核）表现。胸壁结核的治疗原则是在规范抗结核基础上行病灶清除术，彻底清除脓腔、干酪样坏死物、受累肋骨与窦道，故为首选处理。单纯穿刺可致窦道形成且不能清除病灶；切开引流易形成经久不愈的结核性窦道，属禁忌；脓腔灌洗仅为辅助措施；单靠增加抗结核药量无法清除已形成的脓肿与死骨。\n\n📚 出处：《外科学》第9版·胸壁结核"],["女性，40 岁，近 1 个月发现外阴部色素减退，已行外阴活检。下列哪种病变是外阴癌的癌前病变",["外阴增生型营养不良","外阴硬化苔藓型营养不良","外阴混合型营养不良","外阴白化病","外阴增生型或混合型营养不良伴上皮不典型增生"],"E",1,"lc","妇产科","外阴癌的癌前病变是外阴上皮内瘤变（VIN），即外阴增生型或混合型营养不良伴上皮不典型增生，可进展为鳞癌。单纯增生型营养不良无细胞异型，属良性；硬化苔藓型恶变率低；混合型无增生亦不致。外阴白化病为色素代谢异常，与癌变无关。\n\n📚 出处：《妇产科学》第9版·外阴上皮内瘤变"],["女，24 岁，已婚，来门诊检查，主诉停经 77 天。下列哪项检查不恰当",["基础体温","腹部 X 线摄片","妊娠试验","黄体酮试验","B 超检查"],"B",1,"lc","临床综合","停经77天须尽快确认妊娠及胚胎状况：基础体温持续高温提示妊娠，妊娠试验查hCG，黄体酮试验可判断是否妊娠，B超能确定宫内孕、胎心及孕周，均有价值。早孕期胚胎对射线敏感，腹部X线摄片既不能提高诊断率又有致畸风险，属不恰当检查。\n\n📚 出处：《妇产科学》第9版·妊娠诊断"],["48 岁女性，外阴奇痒 8 年。长期应用皮炎平治疗，起初效果较好，后疗效减弱，现时常烦躁，难以入睡。妇科检查：阴蒂处皮肤色素略减退并萎缩，可见多角性略高扁平丘疹，大小阴唇形态尚正常，阴道通畅，分泌物外观正常，宫颈光滑，子宫后位，正常大，双附件(-)。患者外阴活检提示 VINⅢ，下一步如何治疗",["观察等待其自然消退","冷冻或激光治疗","扩大的局部病灶切除术(距病灶边缘 1cm)","单纯外阴切除术"," ","泌尿系统","尿路感染的诊断以病原学为金标准：清洁中段尿（或导尿）定量培养细菌数 ≥10⁵/ml（即 ≥100 000 CFU/ml）最具诊断意义。\nA（尿频尿急尿痛）为膀胱刺激症状，特异性低，尿道综合征、阴道炎、间质性膀胱炎均可有；B（畏寒发热头痛）为全身症状，无定位价值；D（尿白细胞>5/HP）提示脓尿，仅说明存在炎症，不能区分感染部位、更不能确定病原；E（血白细胞升高）非特异。故为 C。补充：有尿路症状时，中段尿培养 ≥10²～10³/ml 亦有诊断价值（IDSA 标准）。\n\n📚 出处：《内科学》第9版·尿路感染·实验室检查（尿细菌学）"],["关于卵黄囊瘤的说法，错误的是",["又称内胚窦瘤","多发生于儿童和青年","婴幼儿生殖细胞肿瘤中最常见类型","低度恶性","S-D 小体形成"],"D",1,"lc","临床综合","卵黄囊瘤又称内胚窦瘤，多见于儿童和青少年，是婴幼儿最常见的生殖细胞肿瘤，镜下可见特征性Schiller-Duval小体，故A、B、C、E均正确。该瘤生长迅速、早期即转移，属高度恶性肿瘤，预后差，故“低度恶性”说法错误，选D。\n\n📚 出处：《病理学》第9版·生殖系统疾病（卵巢生殖细胞肿瘤）"],["下列各项组合中，能准确判断酸中毒严重程度和代偿情况的是",["动脉血和尿的 pH 值","动脉血 pH 值和 HCO3","动脉血和静脉血 pH 值","动脉血和静脉血 PaCO2","静脉血和尿的 pH 值"],"B",1,"lc","理化与中毒","酸中毒严重程度看 HCO3- 降低的程度，代偿情况看 PaCO2 是否降到预计代偿范围，故需同时依据动脉血 pH 值和 HCO3-（并计算预计 PaCO2），B 正确。尿 pH 受饮食、泌尿系感染、利尿剂影响，只能粗略反映肾小管排酸能力，不能定量评价失衡（A、E 错）；静脉血 pH、PaCO2 与动脉血有组织代谢差异，不能替代动脉血气（C、D 错）。\n\n📚 出处：《内科学》第9版·酸碱平衡失调"],["女性病人，41 岁，3 周来阴道排出物有恶臭。体检示宫颈外口有 3cm 大小包块，Pap 涂片提示鳞状细胞癌，梅毒血清学检查为阳性，血糖为 157mg/dl。病人以前为职业性工作者，对于患者的宫颈癌，下列哪种危险因素最有可能",["人类乳头状瘤病毒感染","型糖尿病","重度吸烟","盆腔炎症","有患癌后化疗史"],"A",1,"lc","妇产科","宫颈鳞状细胞癌的发生与高危型人乳头状瘤病毒（HPV16、18型等）持续感染密切相关，是最主要、最确切的危险因素，几乎见于全部宫颈鳞癌。糖尿病、重度吸烟、盆腔炎症、既往化疗史可起协同或免疫抑制作用的次要因素；梅毒血清学阳性提示性传播疾病史，间接反映HPV暴露风险，但本身非致癌因素。\n\n📚 出处：《妇产科学》第9版·子宫颈癌"],["关于小儿体表面积的估计，下列不恰当的是",["小儿头颈部体表面积为：9＋(12－年龄)%","中国九分法不适用于小儿","小儿体表面积的特点是头大下肢小","小儿双下肢体表面积为：46－(12－年龄)%","小儿躯干(含会阴)体表面积为 27%"],"B",1,"lc","儿科","中国九分法经年龄修正后完全适用于小儿，故“不适用于小儿”错误，B为答案。小儿体表特点是头大、下肢短小：头颈部为9＋(12－年龄)%，双下肢为46－(12－年龄)%，躯干含会阴27%，双上肢18%。这一估算用于判断烧伤面积、指导补液，A、C、D、E表述均正确。\n\n📚 出处：《外科学》第9版·小儿烧伤面积估计"],["起搏器治疗的术后并发症不包括",["囊袋血肿","阈值升高","感染","起搏器综合征","锁骨下动静脉瘘"],"E",1,"lc","外科总论与麻醉","起搏器植入术后常见并发症包括囊袋血肿、囊袋与导线感染、起搏阈值升高（微脱位、纤维化）、电极移位或心肌穿孔、起搏器综合征（VVI起搏时房室不同步致头晕、低血压）、静脉血栓等，故A、B、C、D均属术后并发症。锁骨下动静脉瘘属经锁骨下静脉穿刺建立入路时的穿刺并发症，而非起搏治疗本身的术后并发症，故E符合题意。\n\n📚 出处：《内科学》第9版·心律失常"],["已婚女性，26岁，平素月经规律。现停经2个月，恶心、呕吐1周，昨日突然出现心悸、气短。检查：体质瘦小，口唇发绀，杵状指，心率120次/分，心前区可以闻及粗糙的双期杂音。盆腔超声检查结果提示为早孕。进一步的处理是",["立即终止妊娠","如心力衰竭得以控制可以继续妊娠","控制心力衰竭后剖宫取胎","控制心力衰竭后行人工流产","边控制心衰，边行吸宫术"],"D",1,"lc","妇产科","口唇发绀、杵状指、胸骨左缘粗糙双期杂音及心前区杂音，提示发绀型复杂先天性 不到），胎心多消失，宫口回缩。手先露需子宫完全破裂且为横位才可能；宫颈裂伤出血为鲜红且先露仍可触及。\n\n📚 出处：《妇产科学》第9版·子宫破裂"],["引起眼球内陷的情况主要是",["眶内血管扩张","眶内寄生虫","近视","眼眶肿瘤","眶脂肪吸收"],"E",1,"lc","眼耳鼻喉口腔","眼球突出或内陷由眶内容物与眶容积的相对关系决定。老年、消瘦、外伤后脂肪坏死或眶内手术后眶脂肪吸收，眶内容减少，眼球后移而内陷，故E正确。眶内血管扩张、眶内寄生虫、眼眶肿瘤均增加眶内容物或占有空间，引起眼球突出而非内陷；近视以眼轴延长为主，不表现为内陷。\n\n📚 出处：《眼科学》第9版·眼眶病·概述"],["以下除哪一项外，均可为肝脏脂肪浸润的表现",["肝大","局灶性高回声肿块","血管结构减少","肝脏后方透声减少","肝脏前方回声增强"],"B",1,"lc","消化系统","肝脂肪浸润（脂肪肝）的超声表现为肝大、肝前表面回声增强（明亮肝）、深部回声衰减致后方透声减少、肝内血管结构显示不清，故A、C、D、E均可出现。局灶性高回声肿块见于肝血管瘤、肝癌等局灶性占位，脂肪浸润多呈弥漫或片状分布而不形成肿块，故选B。\n\n📚 出处：《医学影像学》第9版·肝疾病·脂肪肝"],["下列哪种药物可阻滞甲状腺球蛋白分解从而抑制甲状腺素的释放",["丙基硫氧嘧啶","普萘洛尔","他巴唑","利血平","碘剂"],"E",1,"lc","内分泌与代谢","碘剂（复方碘溶液）中的碘可抑制甲状腺球蛋白水解释放T4、T3，同时抑制碘的有机化与激素合成，使腺体缩小变硬、血供减少，起效快而短暂，用于术前准备及甲状腺危象，答E。丙基硫氧嘧啶、他巴唑抑制过氧化物酶，作用于激素合成环节；普萘洛尔阻断β受体并抑制外周T4向T3转化；利血平耗竭神经末梢儿茶酚胺，均不通过阻滞甲状腺球蛋白分解起效。\n\n📚 出处：《药理学》第9版·甲状腺激素及抗甲状腺药"],["早期食管癌的 X 线表现不包括",["食管下端呈光滑的鸟嘴状狭窄","局限性黏膜皱襞增粗和断裂","局限性管壁僵硬","局限、小的充盈缺损","小龛影"],"A",1,"lc","消化系统","早期食管癌的X线表现为局限性黏膜皱襞增粗、断裂、迂曲，局限性管壁僵硬，小的充盈缺损（斑块型）及小龛影（糜烂型），故B、C、D、E均可见。食管下端呈光滑的鸟嘴状狭窄是贲门失弛缓症的典型表现，反映食管下括约肌不能松弛，与黏膜病变无关，不属早期食管癌的征象，选A。\n\n📚 出处：《医学影像学》第9版·食管疾病·食管癌"],["遗忘综合征是",["一种选择性或局限性认知功能障碍","一种广泛性认知功能障碍","一种半侧脑认知功能障碍","一种严重思维障碍","由于酒精中毒引起"],"A",1,"lc","临床综合","遗忘综合征（Korsakoff综合征）以近事记忆显著受损、虚构与定向障碍为特征，而语言、计算、理解等智能相对保留，属选择性、局限性的认知功能障碍。广泛性认知障碍见于痴呆；酒精中毒是其常见病因之一，思维障碍则是伴随表现，均不能用来定义该综合征。\n\n📚 出处：《精神病学》第8版·脑器质性精神障碍（遗忘综合征）"],["男性，28 岁，近 1 个月因劳累出现乏力、盗汗、纳差，无咳嗽、发热等。今天突然大咯血来急诊就诊。禁忌进行的检查是",["外周血象","心电图","胸部平片","支气管碘油造影","胸部 CT"],"D",1,"lc","呼吸系统","大咯血期间不宜行支气管碘油造影：碘油充盈气道可加重窒息风险，且咯血时气道内血液与碘油混杂使充盈缺损判断失真，检查需搬动、耗时，故属禁忌。外周血象、心电图、胸部平片均为无创、床旁可完成的基本检查；胸部CT（尤其平扫）可显示空洞、支气管扩张与出血侧别，此时可以施行。待咯血停止、病情稳定后再考虑支气管造影或支气管动脉造影。\n\n📚 出处：《内科学》第9版·咯血"],["结核结节最为重要的细胞成分是",["朗汉斯巨细胞","淋巴细胞","成纤维细胞","上皮样细胞","浆细胞"],"D",1,"lc","呼吸系统","结核结节由上皮样细胞（类上皮细胞）、朗汉斯巨细胞、淋巴细胞与成纤维细胞构成，其中心与主体是上皮样细胞——由巨噬细胞吞噬结核分枝杆菌后转化而来，是构成肉芽肿、限制细菌播散的功能细胞，故为最重要的细胞成分。朗汉斯巨细胞由多个上皮样细胞融合形成，属辅助成分；淋巴细胞位于结节外周；成纤维细胞与浆细胞只见于结节周边或纤维化阶段。\n\n📚 出处：《病理学》第9版·结核病·基本病理变化"],["急性上呼吸道感染常见的病原体是",["细菌","病毒","支原体","衣原体","真菌"],"B",1,"lc","外科总论与麻醉","急性上呼吸道感染70%～80%由病毒引起，常见鼻病毒、冠状病毒、腺病毒、流感及副流感病毒、呼吸道合胞病毒；细菌（溶血性链球菌、流感嗜血杆菌等）多在病毒感染后继发。支原体、衣原体可引起咽炎或肺炎，但所占比例低，真菌极少见。故常见病原体为病毒B，这也解释了其自限性及抗生素无效的特点。\n\n📚 出处：《内科学》第9版·急性上呼吸道感染"],["关于肺错构瘤的 CT 表现，下述错误的是",["肿块呈圆形，常位于胸膜下","肿块边缘可见浅分叶","肿块内可测到脂肪密度","局部血管可被挤压推移","CT 显示病变内钙化不如平片"],"E",1,"lc","呼吸系统","CT的空间与密度分辨率远高于平片，对错构瘤内“爆米花样”钙化及脂肪密度的检出明显优于平片，故“CT显示病变内钙化不如平片”错误，为本题答案。错构瘤典型CT表现为肺外周、胸膜下圆形或类圆形结节，边缘光整或浅分叶（A、B对），约半数可测到脂肪密度（CT值-40～-120HU），为本病特征性表现（C对），病灶膨胀性生长可推移挤压邻近血管但无侵犯（D对）。\n\n📚 出处：《医学影像学》第8版·呼吸系统·肺良性肿瘤"],["子宫肌瘤合并妊娠发生红色变性表现为",["腹部包块","月经量增多，周期缩短，经期延长","尿频、排尿障碍等压迫症状","阴道分泌物增多伴不规则阴道出血","腹痛、发热"],"E",1,"lc","妇产科","子宫肌瘤红色变性多发生于妊娠期或产褥期，因肌瘤生长快、血供不足，内部血管退行性变、血栓形成与溶血，表现为剧烈腹痛、发热（多38℃左右）、局部压痛、白细胞升高，肌瘤迅速增大。一般采取保守治疗：卧床、补液、镇痛、抗感染，多可缓解。A、C为肌瘤增大后的压迫或包块表现，B为黏膜下/壁间肌瘤的月经改变。\n\n📚 出处：《妇产科学》第9版·子宫肌瘤"],["枕骨大孔疝的常见病因是",["大脑半球占位性病变","小脑半球占位性病变","交通性脑积水","腹压增高","脑囊虫病"],"B",1,"lc","消化系统","枕骨大孔疝是小脑扁桃体经枕骨大孔疝入椎管。后颅窝（小脑半球）占位病变使后颅窝压力骤升，最易推动小脑扁桃体下疝，故B最常见（小脑肿瘤、脓肿、后颅窝血肿均可）。大脑半球占位先形成小脑幕切迹疝；交通性脑积水多为慢性颅内压增高；单纯腹压增高与脑囊虫病不直接引起枕骨大孔疝。\n\n📚 出处：《外科学》第9版·颅内压增高与脑疝"],["与 MRI 相比，下述哪项是 CT 的优势",["直接多轴面成像","化学成像，信息量大","密度分辨率高","空间分辨率高","无碘过敏危险"],"D",1,"lc","神经与精神","CT 的优势在于空间分辨率高（可达 0.5mm 左右），对骨质结构与钙化显示清晰，扫描快、费用低，适合急危重及有金属植入物者，故 D 正确。直接多轴面成像、化学成像（MRS）信息量大、软组织密度分辨率高均为 MRI 优势；而“无碘过敏危险”也属 MRI——CT 增强需碘对比剂有过敏风险，MRI 用钆对比剂无碘过敏问题。故 A、B、C、E 均为 MRI 优势。\n\n📚 出处：《医学影像学》第8版·绪论·各种影像技术的比较"],["软组织肉瘤术前放射治疗照射淋巴结区的指征是",["常规放射治疗淋巴结区","肿瘤接近淋巴结区(相距＜10cm)","肿瘤接近淋巴结区(相距＜15cm)","分化好的肉瘤","脂肪肉瘤"],"B",1,"lc","外科总论与麻醉","本题与lc260同题。肉瘤以血行转移为主要途径，淋巴结转移少见，故术前放疗不作淋巴结区常规预防照射；仅当肿瘤与区域淋巴结区相距＜10cm、存在直接蔓延风险时，才把淋巴结引流区包含在照射野内，故选B。分化好的肉瘤（D）与脂肪肉瘤（E）本身放疗抗拒，不构成加照淋巴结区的理由。\n\n📚 出处：《外科学》第9版·肿瘤"],["颅内压升高时，下列脑神经最容易受损的是",["展神经","面神经","位听神经","舌咽神经","三叉神经"],"A",1,"lc","神经与精神","颅内压增高时展神经最易受损。展神经自桥延沟发出后在颅底行程最长、最游离，跨越岩骨尖及蝶岩韧带下方，经海绵窦、眶上裂入眶；颅压升高致脑干下移牵拉该神经，或受小脑前下动脉、岩骨尖压迫而麻痹，出现外直肌瘫痪、眼球外展受限与复视，因常无定位价值而被称为“假定位体征”。面、位听、三叉、舌咽神经颅底行程相对固定，受压机会小。\n\n📚 出处：《外科学》第9版·颅内压增高·临床表现"],["新生儿溶血病，当胆红素超过 342μmol/L 时应首选",["光照疗法","换血疗法","宫内输血","药物疗法","液体疗法"],"B",1,"lc","儿科","足月新生儿血清胆红素超过342μmol/L（20mg/dl）或已出现早期胆红素脑病表现时，为换血疗法的指征，应首选换血 球肾炎因免疫复合物激活补体，早期血清C3降低，多于起病后6～8周内恢复正常。若超过8周C3仍持续低下，应警惕膜增生性肾小球肾炎、狼疮性肾炎等其他病因，需肾活检鉴别。故选B。\n\n📚 出处：《内科学》第9版·急性肾小球肾炎·实验室检查"],["在脑复苏中，下列哪项措施是不正确的",["脱水疗法","低温","高压氧疗法","胃肠内营养","皮质类固醇应用"],"D",1,"lc","神经与精神","脑复苏措施包括：维持有效脑灌注、防治低血压；脱水疗法（甘露醇）与适度过度通气减轻脑水肿；亚低温（32～34℃）脑保护；高压氧改善氧供；糖皮质激素稳定细胞膜；钙拮抗剂、巴比妥类、自由基清除剂等。脑复苏早期要求限制液体入量、保持轻度脱水，且循环骤停后肠道缺血缺氧、屏障受损，早期胃肠内营养易致腹胀、呕吐误吸甚至肠坏死，一般先静脉营养，待循环呼吸稳定、肠鸣音恢复后再过渡到肠内营养。\n\n📚 出处：《外科学》第9版·心肺脑复苏·脑复苏"],["关于腹裂的叙述，错误的是",["常位于脐的左侧","常位于脐的右侧","腹腔大小正常","脱出物中肝脏罕见","无外膜肠管裸露"],"A",1,"lc","消化系统","腹裂为腹壁全层缺损、肠管裸露脱出且无囊膜覆盖（E正确）；缺损多位于脐旁右侧，故常位于脐左侧的说法错误，选A。腹裂患儿腹腔容积基本正常（C正确），脱出物以小肠为主、肝脏罕见（D正确）。脐膨出则位于脐部、有囊膜包裹、腹腔容积小、常含肝脏，二者可资鉴别。\n\n📚 出处：《小儿外科学》·腹壁畸形·腹裂"],["关于引起胰腺炎的病因，下列各项中错误的是",["胆石症","乳头旁憩室炎","十二指肠球溃疡","暴饮暴食","饮酒"],"C",1,"lc","消化系统","急性胰腺炎常见病因为胆道疾病（胆石嵌顿于壶腹部）、酒精、暴饮暴食、高脂血症、乳头旁憩室炎、ERCP术后、药物及外伤等，故A、B、D、E均可为病因。十二指肠球部溃疡位于幽门远端，不引起壶腹部梗阻或乳头损伤，与胰腺炎无明确因果关系，故选C。\n\n📚 出处：《外科学》第9版·胰腺疾病·急性胰腺炎病因"],["子宫肌瘤主要好发于",["子宫黏膜下","子宫体肌层内","子宫体浆膜下","子宫颈","子宫阔韧带"],"B",1,"lc","妇产科","子宫肌瘤由子宫肌层平滑肌细胞增生形成，初始均位于肌壁内，故壁间（肌壁间）肌瘤最多见，约占60%～70%；随生长方向不同可发展为黏膜下（约10%～15%）或浆膜下（约20%）。宫颈肌瘤与阔韧带肌瘤均少见。\n\n📚 出处：《妇产科学》第9版·子宫肌瘤"],["关于异氟烷对循环系统的影响，下列叙述正确的是",["增加心肌对儿茶酚胺的敏感性","降低心肌氧耗，减少冠脉血流量","增加每搏量","扩张外周血管","减慢心率"],"D",1,"lc","心血管系统","异氟烷降低外周血管阻力、扩张外周血管，血压下降而心排血量维持较好，是其循环影响的核心特点。它不增加心肌对儿茶酚胺敏感性（氟烷才增加，故A错）；冠脉血流不减甚至增加（B错）；每搏量略降（C错）；对心率影响小、可轻度增快（E错）。故选D。\n\n📚 出处：《麻醉学》第4版·吸入麻醉药·异氟烷"],["下列哪项不是甲状腺髓样癌的特点",["起源于 C 细胞的恶性肿瘤","能分泌降钙素","部分为家族性常染色体显性遗传","免疫组织化学染色常显示 Calcitonin 阴性","间质内有淀粉样物质沉积"],"D",1,"lc","内分泌与代谢","甲状腺髓样癌源于滤泡旁C细胞，能分泌降钙素，血清降钙素是诊断与随访的特异性标志物，肿瘤组织免疫组化Calcitonin、CEA呈阳性；家族性病例（MEN-2A/2B、家族性髓样癌）为常染色体显性遗传（RET基因突变）；间质内淀粉样物质沉积是其组织学特点。因此D“常显示Calcitonin阴性”与事实相反，为所选，其余四项均属髓样癌特点。\n\n📚 出处：《病理学》第9版·甲状腺肿瘤·甲状腺髓样癌"],["Somogyi 现象是指",["夜间血糖正常，凌晨血糖增高","服药后血糖未控制","低血糖后反应性高血糖","药物性低血糖昏迷","空腹血糖大于餐后 2 小时血糖"],"C",1,"lc","临床综合","Somogyi现象指糖尿病患者夜间发生低血糖后，反跳性引起儿茶酚胺、胰高血糖素、皮质醇、生长激素等升糖激素分泌增加，使清晨空腹血糖明显升高。与黎明现象（夜间血糖不低、清晨升高，即A）机制不同，处理上应减少晚餐前胰岛素剂量而非加量，故选C。\n\n📚 出处：《内科学》第9版·糖尿病（低血糖与降糖方案调整）"],["玻璃体积血的病因不包括下列哪项",["视网膜中央动脉阻塞","视网膜中央静脉阻塞","糖尿病","玻璃体后脱离","视网膜血管炎"], 穿刺在骨膜下或骨髓腔内抽到脓液","X线检查示有虫蛀样骨质破坏及骨膜增生"],"D",1,"lc","血液系统","急性血源性骨髓炎起病2周内X线多无异常，全身中毒症状、干骺端深压痛、白细胞及中性粒细胞升高均缺乏特异性。局部分层穿刺（骨膜下→骨皮质→骨髓腔）抽得脓液或涂片见脓细胞即可早期确诊，并可做细菌培养与药敏以指导抗生素选择，是早期诊断最有价值的方法。\n\n📚 出处：《外科学》第9版·急性血源性骨髓炎"],["尿高渗培养是为了检查",["厌氧菌","支原体","原浆型菌株","耐药菌","进一步证明尿无菌"],"C",1,"lc","泌尿系统","尿高渗培养用于检出原浆型菌株（L 型细菌）。细菌在抗生素、抗体、溶菌酶等作用下细胞壁合成受抑，可转变为缺壁的 L 型（原浆型），在普通培养基及常规尿培养中不能生长，导致尿培养\"阴性\"而感染迁延不愈、反复发作。高渗培养基（含高浓度蔗糖/NaCl）可维持其渗透压平衡，使其生长并被检出。故为 C。厌氧菌需厌氧培养；支原体需专用液体/固体培养基；耐药菌用常规培养＋药敏即可；\"进一步证明尿无菌\"不是高渗培养的目的。\n\n📚 出处：《内科学》第9版·尿路感染·特殊培养（L型细菌/高渗培养）"],["关于游离胸腔积液，以下描述不正确的是",["少量胸腔积液积聚于胸腔最底部","患者取仰卧位，探头应与床面垂直扫查","须与腹水、膈下积液及膈胸膜增厚相鉴别","大量胸腔积液时，肺组织受压上移","患者取坐位，从肩胛线或腋后线肋间扫查"],"B",1,"lc","呼吸系统","游离胸腔积液因重力作用积聚于胸腔最低位，故扫查应取坐位或半坐位，经肩胛线、腋后线肋间（E对）或腋中线自上而下观察，少量积液最早见于肋膈角（A对）；大量积液时肺组织被压缩上移（D对）；还需与腹水、膈下积液、膈胸膜增厚鉴别（C对）。仰卧位时液体分散于背部胸腔，探头与床面垂直扫查无法显示积液深部与范围，故B错误，为本题答案。\n\n📚 出处：《医学影像学》第8版·呼吸系统·胸腔积液"],["发育性髋关节脱位的发生率，下列哪项是错误的",["臀位产发病率较高","女性多于男性","右侧多于左侧","剖腹产婴儿发病几率高","北方发病率高于南方"],"C",1,"lc","运动与骨外科","发育性髋关节脱位以左侧多见，双侧次之，单纯右侧最少，故“右侧多于左侧”是错误的。女性发病率约为男性4～6倍；臀位产使髋关节处于过度屈曲外展及受机械牵拉状态，发病率明显增高，剖腹产多见于臀位或难产者，故婴儿发病几率亦高；我国北方寒冷地区因襁褓捆缚习惯发病率高于南方。\n\n📚 出处：《外科学》第9版·发育性髋关节脱位·流行病学"],["下列对氯胺酮麻醉的叙述哪项是错误的",["意识模糊","痛觉消失","肌肉松弛","呼吸道通畅","苏醒慢"],"C",1,"lc","外科总论与麻醉","氯胺酮为N-甲基-D-天冬氨酸受体拮抗剂，产生“分离麻醉”：意识模糊但可睁眼、流泪（A对）；痛觉明显消失、体表镇痛完善（B对）；呼吸道反射保留、呼吸道通畅（D对）；苏醒慢，可伴幻觉、躁动（E对）。氯胺酮不产生肌松弛，反而使肌张力增高、甚至肌僵，故C错误描述。需肌松的手术须复合肌松药或镇静药。\n\n📚 出处：《临床麻醉学》第4版·静脉麻醉药"],["对精子肉芽肿的镜下描述错误的是",["早期以中性粒细胞渗出为主","是精子溢出后引起的化脓性炎症","组织细胞和上皮样细胞围绕精子形成肉芽肿性炎","巨噬细胞的胞质内可见金黄色色素","晚期发生纤维化"],"B",1,"lc","临床综合","精子肉芽肿是精子经生殖道破损处溢出后引起的异物性肉芽肿性炎：早期以中性粒细胞渗出为主，随后组织细胞、上皮样细胞及多核巨细胞围绕精子形成肉芽肿，巨噬细胞胞质内可见金黄色色素，晚期纤维化。其本质并非化脓性炎症，故B描述错误。\n\n📚 出处：《病理学》第9版·炎症（肉芽肿性炎）"],["关于头颅血肿，下述错误的是",["顶部多见","常为一侧性","超越骨缝","小的血肿不需治疗","可伴高胆红素血症"],"C",1,"lc","神经与精神","新生儿头颅血肿是胎头娩出时骨膜下血管破裂，血液积聚于颅骨与骨膜之间。特点：多见于顶部、常为单侧；因骨缝处骨膜附着紧密，血肿不超越骨缝（“超越骨缝”者为帽状腱膜下血肿或产瘤/头皮水肿）；小血肿可自行吸收，无需处理；巨大血肿因红细胞破坏可致高胆红素血症与贫血。故“超越骨缝”是错误的。\n\n📚 出处：《儿科学》第9版·新生儿疾病·产伤"],["葡萄糖在有氧条件下彻底氧化成水和二氧化碳的过程称为",["酵解","氧化","分解","合成","有氧氧化"],"E",1,"lc","呼吸系统","葡萄糖在有氧条件下经糖酵解、丙酮酸氧化脱羧、三羧 寒战、高热，体温最高达",["39℃，伴有腰痛、尿频、尿急、尿痛。查体：肾区叩击痛(+)。患者诊断为妊娠合并急性肾盂肾炎，对妊娠的不良影响不包括","流产 增加胎儿神经管畸形发生率","胎儿无脑儿发生率明显增加","胎儿脐疝发生率增加","3%可能发生中毒性休克"],"D",1,"lc","妇产科","妊娠合并急性肾盂肾炎的高热（>38.5℃）可致流产、早产、胎死宫内；孕早期高热与胎儿神经管闭合障碍相关，无脑儿等中枢神经系统畸形发生率增加；严重者约3%可发展成败血症、中毒性休克。胎儿脐疝属腹壁发育缺陷，与宫内感染、高热无明确因果关系，故不包括D。\n\n📚 出处：《妇产科学》第9版·妊娠合并泌尿系统疾病"],["符合巨幼细胞贫血实验室检查的是",["MCV＞100fl，MCHC＜32%","重者全血细胞减少","网织红细胞减少","血片中见红细胞中心淡染呈靶形","中性粒细胞分叶少"],"B",1,"lc","血液系统","巨幼细胞贫血为大细胞性贫血：MCV>100fl、MCH增高，MCHC多正常（32%～36%），故A的MCHC<32%错误；血片见红细胞大小不均、大卵圆形红细胞、中性粒细胞分叶过多（核右移），靶形红细胞见于地中海贫血；网织红细胞可正常或轻度降低。叶酸/B12缺乏影响DNA合成，三系均受累，重者全血细胞减少，故B正确。\n\n📚 出处：《内科学》第9版·巨幼细胞贫血"],["非少尿型急性肾功能衰竭患者日尿量大于 600～800ml，尿素氮每日升高量为",["3mmol/L","3.5mmol/L","4mmol/L","4.5mmol/L","5mmol/L"],"B",1,"lc","泌尿系统","急性肾衰竭分少尿型与非少尿型。非少尿型指尿量持续在 600～800ml/d 以上（甚至更多），但因肾浓缩功能障碍，仍不能有效排出代谢废物。其特点是：病情相对轻、BUN 每日升高幅度小，一般 BUN 每日上升 ＜3.5mmol/L（少尿型可达 7～10mmol/L 以上），血肌酐上升也较缓。故本题取 B（3.5mmol/L）。记忆抓手：非少尿型 = 尿量尚可 + BUN 涨得慢（<3.5）。\n\n📚 出处：《内科学》第9版·急性肾损伤·非少尿型ATN的特点"],["引起儿童打鼾的最常见疾病是",["鼻息肉","鼻咽纤维血管瘤","慢性鼻炎","扁桃体、腺样体肥大","鼻中隔偏曲"],"D",1,"lc","儿科","儿童打鼾最常见的原因是扁桃体和腺样体肥大，肥大的淋巴组织使鼻咽及口咽气道狭窄，睡眠时气流通过受阻产生鼾声，可伴睡眠呼吸暂停、张口呼吸、分泌性中耳炎及腺样体面容，故D正确。鼻息肉多见于年长儿伴囊性纤维化或变应性因素；鼻咽纤维血管瘤好发于青春期男性，以反复鼻出血为特点；慢性鼻炎、鼻中隔偏曲在小儿相对少见。\n\n📚 出处：《耳鼻咽喉头颈外科学》第9版·儿童阻塞性睡眠呼吸暂停"],["采取血清学检查方法诊断的真菌感染是",["白假丝酵母菌","荚膜组织胞质菌","申克孢子丝菌","新生隐球菌","曲霉"],"B",1,"lc","外科总论与麻醉","荚膜组织胞浆菌病可经血清学诊断：补体结合试验、免疫扩散试验检测特异性抗体，急性期与恢复期双份血清抗体滴度呈4倍升高有诊断价值，故B正确。白假丝酵母菌、申克孢子菌、新生隐球菌、曲霉病的诊断主要依靠直接镜检、真菌培养、组织病理或抗原检测（如隐球菌荚膜抗原），血清抗体检测敏感性、特异性均不足。\n\n📚 出处：《医学微生物学》第9版·深部真菌"],["下列肺鳞状细胞癌的临床特点，不正确的是",["在各种类型的肺癌中最为常见，约占 50%","患病年龄大多在 50 岁以上，男性占多数","大多起源于较大的支气管，常为中央型肺癌","生长较缓慢，病程较长，首先经淋巴转移，血行转移较晚","对放疗和化疗不敏感"],"E",1,"lc","呼吸系统","鳞状细胞癌对放射治疗较敏感，是肺癌中对放疗效果较好的类型（小细胞癌最敏感、腺癌最差），故“对放疗和化疗不敏感”错误。其余描述符合鳞癌传统特点：多见于50岁以上男性吸烟者（B），多起源于段以上较大支气管呈中央型（C），生长相对缓慢、以淋巴道转移为主、血行转移较晚（D）。A项“约占50%、最为常见”为旧版教材统计口径，近年来腺癌已跃居首位，但本题错误项仍应选E。\n\n📚 出处：《病理学》第9版·呼吸系统疾病·肺癌"],["有关自动视野计检查分类的叙述，不正确的是",["包括阈上值检查、阈值检查和快速阈值检查三类","阈上值检查为视野的定性检查","阈值检查为视野的定性检查","阈值检查所需的时间最长","快速阈值检查通过智能趋势分析从而缩短了检测时间"],"C",1,"lc","眼耳鼻喉口腔","自动视野计检查分三类：阈上值检查为定性筛查，快速判断有无视野缺损；阈值检查测各点光阈值，属定量检查，耗时最长；快速阈值检查（SITA）通过智能趋势分析缩短检测时间。A、B、D、E均正确；C把阈值检查说成“定性检查”，与定量性质相反，且定性检查实为阈上值检查。\n\n📚 出处：《眼科学》第9版·眼的检查·视野检查"],["沉积在骨骼中铅的存在形式是",["磷酸氢铅","甘油磷酸铅","氧化铅","四氧化三铅","磷酸铅"],"E",1,"lc","运动与骨外科","铅进入血液后先以磷酸氢铅形式存在，随后逐渐沉积于骨骼，与骨内羟基磷灰石结合形成难溶的磷酸铅（Pb3(PO4)2），长期蓄积；在感染、酸中毒、饮酒、缺钙等使骨内环境改变时，可动员释放入血引起中毒症状复发。氧化铅、四氧化三铅为工业原料，甘油磷酸铅不属体内沉积形式。\n\n📚 出处：《职业卫生与职业医学》第8版·铅中毒"],["对于“胡桃夹”综合征有确诊意义的检查是",["MRA","MRU","IVU","SPECT","KUB"],"A",1,"lc","临床综合","胡桃夹综合征是左肾静脉在腹主动脉与肠系膜上动脉之间受压所致，诊断需直接显示血管解剖与受压部位。MRA（或CTA）能清晰显示左肾静脉受压狭窄及近端扩张，具确诊价值；MRU、IVU、KUB主要显示尿路形态，SPECT反映肾功能，均不能显示血管受压，故选A。\n\n📚 出处：《医学影像学》第8版·泌尿系统（血管成像）"],["新生儿寒冷损伤综合征绝大部分发生于",["生后18天","生后10天","生后15天","生后1周","生后20天"],"D",1,"lc","儿科","新生儿寒冷损伤综合征（硬肿症）绝大多数发生于生后1周内，尤以早产儿、低出生体重儿及寒冷季节、喂养不足、合并感染的新生儿多见，故D正确。其机制包括体温调节中枢不成熟、棕色脂肪储备少、体表面积相对大、皮下脂肪中饱和脂肪酸比例高而熔点高易凝固，表现为低体温、皮肤硬肿，重者可伴多器官损害。\n\n📚 出处：《儿科学》第9版·新生儿寒冷损伤综合征"],["有关小儿前囟检查的意义，下述错误的是",["前囟过小见于小头畸形","前囟过大见于佝偻病","前囟饱满见于脑膜炎","前囟凹陷见于脱水者","前囟早闭见于克汀病"],"E",1,"lc","儿科","前囟早闭见于小头畸形（A对）；前囟过大或闭合延迟见于佝偻病、克汀病（先天性甲低）、脑积水及营养不良（B对）；前囟饱满、张力增高提示颅内压增高，如脑膜炎、脑炎、脑积水（C对）；前囟凹陷见于脱水、重度营养不良（D对）。克汀病表现为前囟闭合延迟而非早闭，故E错误，为答案。\n\n📚 出处：《儿科学》第9版·体格生长发育"],["具有 HIV 感染特异性的体征是",["毛细血管扩张征","淡紫色或棕色斑","口腔毛状黏膜白斑","玫瑰疹样皮疹","脂溢性皮炎"],"C",1,"lc","外科总论与麻醉","口腔毛状黏膜白斑见于约1/4的HIV感染者，位于舌侧缘，呈白色、不能擦去的皱褶状斑块，由EB病毒引起，出现时常提示CD4⁺T细胞明显下降、已进入AIDS期，是HIV感染最具相对特异性的体征，故C正确。玫瑰疹样皮疹见于急性感染期但缺乏特异性；淡紫色或棕色斑（Kaposi肉瘤）亦见于其他免疫抑制状态。\n\n📚 出处：《传染病学》第9版·艾滋病"],["婴儿和小儿心输出量增加的主要机制是通过",["增加心率","增加心室舒张末容量","减慢心率","增加呼吸频率","增加心室收缩力"],"A",1,"lc","儿科","婴幼儿心肌纤维细、收缩力弱，心室顺应性较低，Frank-Starling机制储备有限，心输出量的增加主要依靠加快心率来实现，故A正确。因此新生儿及婴儿在发热、贫血、失血等需增加心输出量时心率明显增快，心率过快又可缩短舒张充盈期而影响冠脉灌注；减慢心率、增加呼吸频率并不增加心输出量，增加心室舒张末容量和收缩力为成人主要调节方式。\n\n📚 出处：《儿科学》第9版·小儿循环系统解剖生理特点"],["关于念珠菌阴道炎的治疗，下列错误的是",["积极治疗糖尿病","咪康唑栓剂放置阴道","1%龙胆紫液涂擦阴道","克霉唑栓剂放置阴道","口服氟康唑"],"C",1,"lc","妇产科","念珠菌性阴道炎治疗以局部抗真菌药为主（克霉唑、咪康唑、制霉菌素栓剂或霜剂），反复发作或重症可口服氟康唑/伊曲康唑，并积极治疗糖尿病、停用广谱抗生素与雌激素。1%龙胆紫虽曾用于局部涂抹，但现已淘汰：刺激性大、易致外阴灼痛与溃疡，且可经黏膜吸收、疗效不确切，故为错误项。\n\n📚 出处：《妇产科学》第9版·外阴阴道假丝酵母菌病"],["在成人，喉的位置相当于颈椎平面",["2～4","3～5","4～6","5～7","6～8"],"B",1,"lc","运动与骨外科","成人喉位于颈前正中，上界为会厌上缘，平对第3颈椎；下界为环状软骨下缘，平对第5颈椎（成年男性可低至第6颈椎），故成人喉大致相当于第3～5颈椎平面。儿童喉位置较高，平对第2～4颈椎，随年龄增长逐渐下降。\n\n📚 出处：《耳鼻咽喉头颈外科学》第9版·喉的解剖"],["有关肾性脑病的发病机制假说，以下哪项不对",["毒素积蓄","脑代谢障碍","电解质代谢障碍","神经递质代谢障碍","慢性应激"],"E",1,"lc","泌尿系统","尿毒症脑病目前认为与毒素（尿素、胍类、甲状旁腺素、中分子物质）蓄积、脑能量代谢障碍、电解质与酸碱失衡、神经递质（GABA、多巴胺等）代谢紊乱及血脑屏障通透性增高等有关。慢性应激属心理社会因素，不属其发病机制假说。故答E。\n\n📚 出处：《内科学》第9版·慢性肾脏病（尿毒症神经系统表现）"],["幕上血肿，一般血肿量超过多少即可产生症状，需手术处理",["5ml","30ml","20ml","10ml","8ml"],"B",1,"lc","外科总论与麻醉","幕上血肿是否手术取决于占位效应，但一般认为血肿量超过30ml即可压迫脑组织、引起颅内压增高和局灶体征，需手术清除，故B正确。幕下（后颅窝）容积小、代偿差，血肿超过10ml即应积极手术，不能套用幕上标准。A、E数值过小，C、D不能作为统一的手术阈值。\n\n📚 出处：《外科学》第9版·颅脑损伤"],["下面有关 Addsion 病的说法，错误的是",["肾上腺皮质功能亢进所致","慎用抗精神病药，易诱发低血压性虚脱","临床可表现为乏力、淡漠、嗜睡、精神失常等","少数病例可以智力障碍为主要表现","幻觉或妄想状态，多呈周期性出现"],"A",1,"lc","临床综合","Addison病为原发性慢性肾上腺皮质功能减退，因双侧肾上腺皮质破坏致皮质醇、醛固酮分泌不足，故A“功能亢进”错误。患者常乏力、淡漠、嗜睡、低血压，精神症状可为早期或突出表现，少数以智力障碍为主，幻觉妄想状态可呈周期性；抗精神病药易诱发低血压虚脱，应慎用。\n\n📚 出处：《精神病学》第8版·躯体疾病所致精神障碍（肾上腺皮质功能减退）"],["Bishop 宫颈成熟度评分的标准不包括",["宫口开大","先露高低","骨盆情况","宫颈硬度","宫口位置"],"C",1,"lc","妇产科","Bishop评分由5项构成：宫口开大程度（0～3分）、宫颈管消退长度（0～3分）、先露高低（胎头位置，0～3分）、宫颈硬度、宫口位置（各0～2分），满分13分，≥7分提示宫颈成熟、引产成功率高。骨盆情况不属于宫颈成熟度评价内容，故选C。\n\n📚 出处：《妇产科学》第9版·引产与催产"],["Ramsay-Hunt 综合征的相关疾病是",["单纯疱疹","带状疱疹","妊娠疱疹","天疱疮","类天疱疮"],"B",1,"lc","临床综合","Ramsay-Hunt综合征即耳带状疱疹，由水痘-带状疱疹病毒侵犯面神经膝状神经节引起，表现耳部疱疹、耳痛及同侧周围性面瘫，可伴听力下降与眩晕，故与带状疱疹相关。单纯疱疹由HSV引起，妊娠疱疹、天疱疮、类天疱疮均属自身免疫性大疱病，与本病无关。\n\n📚 出处：《皮肤性病学》第9版·带状疱疹"],["引起白癣的真菌多为",["许兰毛癣菌","断发毛癣菌","石膏样小孢子菌","犬小孢子菌","羊小孢子菌"],"D",1,"lc","临床综合","白癣由小孢子菌属所致，我国以犬小孢子菌最多见（其次为铁锈色小孢子菌），表现灰白色鳞屑性斑、病发距头皮2～4mm处折断、镜检见发外孢子。许兰毛癣菌、断发毛癣菌多致黑癣，石膏样小孢子菌、羊小孢子菌多引起脓癣，故答案为D。\n\n📚 出处：《皮肤性病学》第9版·浅部真菌病（头癣）"],["对于脑血栓形成的患者，下列哪种情况不适合溶栓治疗",["发病3小时内","头颅CT证实无出血灶","病人无出血体质","出凝血时间正常","头颅CT出现低密度灶"],"E",1,"lc","心血管系统","溶栓（静脉rt-PA）的目的是挽救缺血半暗带，时间窗为发病3小时内（严格筛选可至4.5小时）。头颅CT已出现低密度灶提示脑组织坏死、梗死完成，此时溶栓不能恢复已死组织，反而增加出血转化与再灌注损伤风险，属禁忌。发病3小时内、CT无出血、无出血倾向、凝血正常均为溶栓适应证条件。故选E。\n\n📚 出处：《神经病学》第8版·脑血管疾病·脑血栓形成的溶栓治疗"],["关于铁吸收的叙述，以下错误的是",["高铁化合物比亚铁易吸收","维生素 C 可增强铁的吸收","植物纤维和鞣酸盐之类的食物可干扰铁的吸收","小肠内 pH 值为酸性或中性时铁的吸收可加强","其他微量元素如铜可帮助铁吸收"],"A",1,"lc","临床综合","食物中铁多为三价高铁，须在胃酸作用下还原为亚铁方能吸收，故亚铁比高铁易吸收，A“高铁易吸收”错误。维生素C可还原并络合铁而促进吸收；植物纤维、鞣酸干扰吸收；小肠酸性或中性环境有利吸收；铜蓝蛋白参与铁的氧化与转运，铜可帮助铁吸收。\n\n📚 出处：《生理学》第9版·消化和吸收（铁的吸收）"],["影响抑郁复发的因素有以下几点，但需除外",["社会适应不良","抑郁发作时的严重程度","心理、生理应激","维持治疗的药物剂量或时间不足","有心境障碍的家族史"],"B",1,"lc","神经与精神","抑郁复发的影响因素主要有：维持治疗时间或剂量不足、过早停药；既往发作次数多（≥3 次风险明显升高）；社会支持差、社会适应不良；生活事件与持续的心理社会应激；心境障碍家族史等遗传负荷；起病年龄早、共病焦虑或物质滥用、残留症状。而单次发作时的病情严重程度主要影响急性期治疗策略与是否需联合物理治疗，并非复发的独立预测因素，故需除外。\n\n📚 出处：《精神病学》第8版·心境障碍·抑郁障碍的治疗"],["静脉注射肝脾胶体显像剂后，放射性分布为",["肝脏 50%、脾脏 30%、骨髓 20%","肝脏 70%、脾脏 20%、骨髓 10%","肝脏 85%、脾脏 10%、骨髓 5%","肝脏 60%、脾脏 30%、骨髓 10%","肝脏 95%、脾脏 3%、骨髓 1%"],"C",1,"lc","消化系统","静脉注射99mTc-植酸钠等肝脾胶体显像剂后，颗粒被单核-巨噬细胞系统吞噬，正常分布为肝脏约85%、脾脏约10%、骨髓约5%，故C正确。肝硬化门脉高压、脾功能亢进时脾摄取比例上升、骨髓摄取增加，称胶体转移；肝功能严重受损时骨髓显影明显。A、B、D、E比例均与实测不符。\n\n📚 出处：《核医学》第9版·肝脾胶体显像"],["放射性核素显像的缺点是",["有创性检查","辐射损伤大","过敏反应","不符合生理要求","图像分辨率有限"],"E",1,"lc","医学影像与检验","核素显像反映的是脏器血流、代谢、受体和排泄等生理过程，是功能显像，优势在于灵敏度高、能早期发现功能异常，但受准直器、探头和有限计数统计的限制，图像空间分辨率有限，难以清晰显示细微解剖结构，这既是其主要缺点，也需与 CT/MRI 解剖图像融合弥补。A 有创、B 辐射损伤大、C 过敏反应、D 不符合生理要求均与核素显像的实际特点不符，故选 E。\n\n📚 出处：《核医学》第9版·放射性核素显像"],["患者，25 岁，搬重物后腰痛。检查发现腰部活动明显受限，右侧骶棘肌痉挛伴压痛，右直腿抬高 45°时诉腰痛，加强试验(-)，感觉肌力反射均正常。诊断应最先考虑",["腰椎间盘突出症","腰扭伤","髋关节扭伤","梨状肌综合征","第三腰椎横突综合征"],"B",1,"lc","神经与精神","患者搬重物后急性起病，腰痛伴腰部活动明显受限、骶棘肌痉挛压痛，直腿抬高 45° 时诉腰痛但加强试验阴性，感觉、肌力、反射均正常，缺乏神经根受压的客观体征——直腿抬高时仅为腰痛（非放射至小腿的根性痛）且加强试验阴性，提示腰部肌肉筋膜损伤而非神经根刺激，故首先考虑急性腰扭伤。腰椎间盘突出症应有下肢放射痛、加强试验阳性及神经根支配区感觉/肌力/反射改变；梨状肌综合征疼痛在臀部并向大腿后侧放射；第三腰椎横突综合征以 L3 横突尖明显压痛为特点。\n\n📚 出处：《外科学》第9版·腰腿痛·急性腰扭伤"],["下列关于康复医疗共性原则的说法，不正确的是",["主动参与是改善心理功能的主动措施","治疗的难易程度、强度、总量应该逐步增加","循序渐进是建立安全性最重要的措施之一","许多康复治疗需要长期进行，甚至持续终身","取得运动疗法效果的关键是全面锻炼"],"E",1,"lc","神经与精神","康复医疗的共性原则包括个体化（因人而异）、循序渐进、主动参与、全面锻炼、持之以恒、注意安全。主动参与使患者由被动接受转为主动训练，是改善心理功能的主动措施；治疗强度、难度与总量应逐步增加；循序渐进是保证安全、防止过用综合征的最重要措施之一；许多康复治疗需长期坚持甚至终身。而取得运动疗法效果的关键不在“全面锻炼”，而在准确的功能评定与个体化运动处方（强度、时间、频度）。\n\n📚 出处：《康复医学》第6版·康复治疗·康复治疗的原则"],["关于急性泪腺炎的治疗，表述不当的是",["全身使用抗生素","全身使用抗病毒药物","局部热敷","放射治疗","手术切除泪腺"],"E",1,"lc","临床综合","急性泪腺炎以控制感染为主：全身应用抗生素，病毒所致者可用抗病毒药，局部热敷理疗促炎症消散，脓肿形成后切开引流，对放射敏感的炎性假瘤可辅以放疗。急性炎症期手术切除泪腺既破坏泪液分泌功能，又可使感染扩散，故属不当措施。\n\n📚 出处：《眼科学》第9版·眼眶病（泪腺炎症）"],["X 线中不被显示的结石是",["碳酸钙结石","草酸钙结石","尿酸结石","磷酸钙结石","磷酸镁铵结石"],"C",1,"lc","医学影像与检验","泌尿系结石能否被 X 线显示取决于含钙量和原子序数。草酸钙、磷酸钙、碳酸钙结石含钙量高，密度高，平片显影良好；磷酸镁铵结石（感染性结石）也含钙，多可显影。尿酸结石（约占 5%～10%）为有机化合物，不含钙、原子序数低，与周围软组织密度相近，属阴性结石，平片不显示，需靠 CT（CT 值低）、超声或造影诊断，故选 C。\n\n📚 出处：《医学影像学》第8版·泌尿系统结石"],["血标本采集法主要有",["肘静脉采血法、指尖采血法、耳垂采血法","颈外静脉采血法、肘静脉采血法、手背静脉采血法","静脉采血法、毛细血管采血法、动脉采血法","指尖采血法、耳垂采血法、足跟采血法","肘静脉采血法、股静脉采血法、大隐静脉采血法"],"C",1,"lc","血液系统","按采集血管类型，血标本采集法分三类：静脉采血法（肘静脉等，最常用，用于生化、免疫、血培养、血型鉴定）、毛细血管采血法（指尖、耳垂、足跟，用于血细胞计数）、动脉采血法（桡动脉、股动脉，用于血气分析）。A、B、D、E只是罗列具体部位或混入静脉部位，未按方法分类。\n\n📚 出处：《诊断学》第9版·血液标本采集与处理"],["输血病人血样除检查 ABO 血型正反定型外，RH(D)血型是否要检查",["常规检查","无须检查","必要时检查","常规检查，急症抢救除外","以上都不对"],"A",1,"lc","血液系统","按《临床输血技术规范》及输血相容性检测要求，输血前受血者血样应常规做ABO正反定型与RhD血型鉴定，RhD属强制常规项目；RhD阴性者还需做弱D鉴定、不规则抗体筛查，并应输注RhD阴性血。故即使急症抢救，也应先定血型（含RhD）再发血，不能以急症为由免除。\n\n📚 出处：《临床输血技术规范》·输血前检查"],["血氧容量正常、动脉血氧分压和血氧含量正常，静脉血氧分压与血氧含量高于正常。见于",["心力衰竭","呼吸衰竭","失血性休克","氰化物中毒","CO 中毒"],"D",1,"lc","心血管系统","氰化物抑制细胞色素氧化酶，阻断氧化磷酸化，组织不能利用氧，故静脉血氧分压与氧含量反高于正常（静脉血动脉化），而血氧容量、动脉血氧分压及含量均正常。心力衰竭、呼吸衰竭、失血性休克因组织缺氧、氧摄取率增高使静脉氧含量降低；CO中毒使血氧容量下降。故选D。\n\n📚 出处：《病理生理学》第9版·缺氧·组织性缺氧"],["猜疑和过于敏感主要见于",["强迫型人格障碍","偏执型人格障碍","分裂样人格障碍","循环型人格障碍","冲动型人格障碍"],"B",1,"lc","临床综合","偏执型人格障碍以猜疑、过分敏感、固执、记恨、自我评价过高为特征，常将他人无意的言行视为敌意或贬低，故猜疑与敏感主要见于本型。强迫型人格表现为刻板、求全责备；分裂样人格为孤僻、情感冷淡；循环型为情绪高涨与低落交替；冲动型为情绪不稳、行为暴发。\n\n📚 出处：《精神病学》第8版·人格障碍"],["传染性单核细胞增生症的淋巴结病变，感染的病原微生物是",["大肠杆菌","金黄色葡萄球菌","溶血性链球菌","变形杆菌","EB 病毒"],"E",1,"lc","外科总论与麻醉","传染性单核细胞增多症由EB病毒经唾液传播，主要侵犯B淋巴细胞和口咽淋巴组织，表现为发热、咽痛、颈部淋巴结肿大及肝脾大，外周血异型淋巴细胞增多、嗜异性凝集试验阳性，故E正确。大肠埃希菌、金黄色葡萄球菌、溶血性链球菌、变形杆菌引起的是化脓性淋巴结炎，脓液与血象特点不同，可与本病鉴别。\n\n📚 出处：《传染病学》第9版·传染性单核细胞增多症"],["使吸入麻醉药 MAC 增大的因素有",["体温降低","低钠血症","老年人","使中枢神经系统儿茶酚胺贮存降低的药物","长期嗜酒"],"E",1,"lc","外科总论与麻醉","使吸入麻醉药MAC增大的因素：体温升高、高钠血症、慢性酗酒（交叉耐受）、长期使用三环类抗抑郁药以及可卡因、苯丙胺等使中枢儿茶酚胺增高的药物、青年。故长期嗜酒者E正确。低温、低钠血症、老年、妊娠、低血压、贫血、阿片类和局麻药则使MAC降低；使中枢儿茶酚胺贮存降低的药物（D）也会降低MAC。\n\n📚 出处：《临床麻醉学》第4版·吸入麻醉"],["舍格伦综合征与腺体内其他慢性炎症的区别主要在于",["小叶腺泡全部消失，小叶轮廓保留","腺小叶内缺乏纤维组织修复","腺泡萎缩消失，为增生纤维组织代替","腺导管上皮增生，可形成鳞状化生","小叶内导管增生，导管上皮增生，形成上皮岛"],"B",1,"lc","临床综合","舍格伦综合征的病理特征是腺小叶轮廓保留而腺泡萎缩消失、淋巴细胞浸润并形成上皮岛，同时小叶内缺乏纤维组织修复与脂肪替代；而腺体内其他慢性炎症（如慢性化脓性涎腺炎）以纤维组织增生修复、小叶结构破坏为特点。故两者的区别关键在于有无纤维组织修复。\n\n📚 出处：《口腔颌面外科学》第8版·涎腺疾病（舍格伦综合征）"],["患儿，6 岁，昨日开始发热，咽痛，腹痛。口服速效感冒胶囊，热退，今晨又发热。体检：颜面潮红，口周苍白圈，咽部充血，双扁桃腺肿大，躯干皮肤见红色细小丘疹，压之退色，心肺正常。诊断最可能为",["麻疹","风疹","药疹","猩红热","肠道病毒感染"],"D",1,"lc","儿科","患儿发热、咽痛、扁桃体肿大伴颜面潮红、口周苍白圈及躯干弥漫性红色细小丘疹、压之退色，符合猩红热典型表现（A组β溶血性链球菌感染），故D正确。麻疹有卡他症状、柯氏斑且皮疹自耳后发际开始；风疹全身症状轻、耳后淋巴结肿大、皮疹消退快；药疹有明确服药史、多形性分布；肠道病毒感染多表现为疱疹性咽峡炎、手足口病。\n\n📚 出处：《儿科学》第9版·猩红热"],["原始骨痂形成一般需要",["1 周～2 周","2～3 周","4～8 周","9～10 周","11～12 周"],"C",1,"lc","运动与骨外科","骨折愈合的二期过程分为血肿炎症机化期（约2周）、原始骨痂形成期、骨板形成塑形期。原始骨痂由膜内成骨（内、外骨痂）与软骨内成骨（桥梁骨痂）构成，使骨折端初步连接、能抵抗肌肉收缩与剪力，一般需4～8周；超过此时限仍无骨痂提示延迟愈合，需查找固定不牢、血供差、感染等原因。\n\n📚 出处：《外科学》第9版·骨折概论·骨折愈合过程"],["眼眶壁较厚的是",["内侧壁","下壁","外侧壁","上壁","中壁"],"C",1,"lc","眼耳鼻喉口腔","眼眶由七块骨构成四壁：内侧壁最薄，筛骨纸板仅0.2~0.4mm，易被鼻窦病变、外伤累及；上壁（额骨眶板）与下壁（上颌骨眶面）亦较薄；外侧壁由颧骨眶面与蝶骨大翼构成，骨质最厚、最坚固，眶深也最大。故壁较厚者为外侧壁。A、B、D均属薄弱壁，E非解剖分壁。\n\n📚 出处：《眼科学》第9版·眼科学基础·眼的组织与解剖"],["用社会心理学方法解释健康相关行为的重要理论模式是",["知信行模式","理论健康模式","健康信念模式","健康行为模式","健康态度模式"],"C",1,"lc","心血管系统","健康信念模式由Hochbaum、Rosenstock等提出，是运用社会心理学方法解释健康相关行为的经典理论，核心变量包括感知疾病易感性与严重性、感知行为利益与障碍、自我效能及行动线索，被广泛用于健康教育与行为干预。知信行模式是知识—信念—行为的递进链条，行为治疗、认知疗法属治疗方法而非解释行为的理论模式。故选C。\n\n📚 出处：《健康教育学》第3版·健康相关行为理论·健康信念模式"],["中央型腰椎间盘突出症与马尾神经瘤最有意义的鉴别点是",["马鞍区麻痹","膀胱、肛门括约肌障碍","腰穿脑脊液改变","X线检查","脊髓造影检查"],"E",1,"lc","神经与精神","中央型腰椎间盘突出症与马尾神经瘤均可有腰痛、双下肢无力、马鞍区感觉障碍及括约肌功能障碍，X 线平片只能间接提示椎间隙改变；脑脊液检查在马尾肿瘤可有蛋白-细胞分离，但腰突受压也可致蛋白轻度升高，特异性不足。脊髓造影（或 MRI、CTM）可直接显示：腰突为与椎间隙相连、边缘光滑的充盈缺损，随体位变化；马尾肿瘤为髓外硬膜内杯口状或截断状充盈缺损，位置不受椎间隙限制，故最有鉴别意义。\n\n📚 出处：《外科学》第9版·腰腿痛·腰椎间盘突出症的鉴别诊断"],["关于高铁血红素白蛋白(MH-bAIb)，下述哪项是错误的",["高铁血红素白蛋白是高铁血红素与白蛋白的结合产物","最后由脾摄取","是血管内溶血严重的指标","在 Hp 消失后出现","在血红素结合蛋白消失后出现"],"B",1,"lc","血液系统","血管内溶血时游离血红蛋白先与结合珠蛋白结合，运至肝被肝细胞清除；结合珠蛋白耗竭后，游离血红素与白蛋白结合成高铁血红素白蛋白，故其出现提示结合珠蛋白已消失、溶血严重，是血管内溶血的重要指标；血红素结合蛋白耗竭后也可出现。该复合物最终由肝细胞摄取降解，而非脾，故B错误。\n\n📚 出处：《内科学》第9版·溶血性贫血"],["男性，35 岁，腹痛 2 天伴呕吐、腹胀。查：血清淀粉酶 750Somogyi 单位，血压 80/50mmHg，脉搏 120 次/分。最恰当的诊断为",["急性肠梗阻伴休克","急性出血坏死型胰腺炎并休克","急性 版·心肌的生物电现象·心脏的传导系统"],["闭角型青光眼的手术机制是",["减少房水产生","解除瞳孔阻滞","解除房角粘连","将房水引流到眼外","防止房角粘连"],"B",1,"lc","外科总论与麻醉","原发性闭角型青光眼的发病核心是瞳孔阻滞：晶状体相对过大、与虹膜接触面广，后房压高于前房使周边虹膜前膨、房角关闭。因此其手术（周边虹膜切除术、激光虹膜周切术）的机制是建立前后房交通、解除瞳孔阻滞，故B正确。减少房水生成（药物）、将房水引流至眼外（小梁切除术）属于其他降眼压机制，解除房角粘连需房角分离术。\n\n📚 出处：《眼科学》第9版·青光眼"],["以下哪项不属于胎盘早期剥离的症状",["阴道出血","耻骨联合上闻及吹风样杂音","腹痛","贫血","子宫胎盘卒中"],"B",1,"lc","妇产科","胎盘早剥典型表现是突发持续性腹痛、阴道流血（可为隐性）、子宫张力增高压痛、贫血与休克程度常与显性出血量不符，重者出现子宫胎盘卒中、DIC、胎心异常。耻骨联合上方吹风样杂音为子宫血管杂音（胎盘杂音），属正常妊娠体征，与早剥无关，故选B。\n\n📚 出处：《妇产科学》第9版·胎盘早剥"],["扫描电镜下细胞表面微结构以皱膜型为主，该特征与下列哪项疾病相符",["急性淋巴细胞白血病","急性粒细胞白血病","急性单核细胞白血病","多毛细胞白血病","急性巨核细胞白血病"],"C",1,"lc","医学影像与检验","扫描电镜下白血病细胞表面微结构具有系别特征：急性单核细胞白血病细胞表面以皱膜型（波浪状皱褶膜）为主，并可有伪足，与其强黏附、吞噬功能相关；急性粒细胞白血病细胞以嵴样或微绒毛样突起为主；急性淋巴细胞白血病细胞表面相对光滑、微绒毛少而短；多毛细胞白血病可见细长毛发状突起。故皱膜型对应急性单核细胞白血病，选 C，其余各型与皱膜型不符。\n\n📚 出处：《临床检验基础》第5版·血细胞形态学检查"],["治疗慢性反复发作的支气管哮喘，下列哪项措施不常规使用",["避免接触过敏原","脱敏治疗","糖皮质激素气雾剂吸入","注射长效糖皮质激素","色甘酸钠吸入"],"D",1,"lc","呼吸系统","慢性持续期哮喘以长期抗炎、控制症状为目标，首选吸入型糖皮质激素或吸入激素／长效β2受体激动剂联合制剂，可局部起效而全身副作用小；避免接触过敏原（A）、特异性免疫（脱敏）治疗（B）、色甘酸钠等肥大细胞膜稳定剂（E）均属常规长期管理措施。长效或全身用糖皮质激素注射（D）不良反应大（骨质疏松、库欣样改变、下丘脑-垂体-肾上腺轴抑制），且不能替代吸入治疗，故不作为常规使用，为答案。\n\n📚 出处：《支气管哮喘防治指南（2020年版）》·长期治疗方案"],["成年伤员，其两下肢被热水烫伤后出现水疱，渗出较多，剧痛。伤后 1小时就诊，创面处理应选择",["清创后行包扎疗法","清创后行暴露疗法","早期切痂植皮","早期削痂植皮","自然脱痂等待肉芽创面形成后，游离植皮"],"A",1,"lc","运动与骨外科","双下肢热水烫伤、起水疱、渗出多、剧痛，符合浅二度为主的烧伤；伤后1小时、污染轻、部位在四肢，宜清创后行包扎疗法，便于引流、保护创面、减少感染并利于转运。暴露疗法适用于头面、会阴或大面积烧伤；切痂、削痂植皮针对三度及深二度创面且需待时机；自然脱痂植皮为过时方法。\n\n📚 出处：《外科学》第9版·烧伤·创面处理"],["对接种卡介苗的认识哪项是错误的",["卡介苗是活的无毒力牛型结核杆菌疫苗","接种后使人体产生特异性免疫力","接种卡介苗能预防结核菌感染","接种卡介苗可减轻感染后的病情","初生儿应适时接种"],"C",1,"lc","临床综合","卡介苗是无毒力的活菌苗（牛型结核分枝杆菌减毒株），接种后使机体产生特异性细胞免疫，可降低儿童粟粒性结核与结核性脑膜炎的发生、减轻感染后病情，新生儿应适时接种，故A、B、D、E正确。但它不能阻止结核菌侵入与感染发生，其作用是限制感染后播散，故C错误。\n\n📚 出处：《传染病学》第9版·结核病（预防）"],["关于骨折复位标准，下列说法错误的是",["骨折部位的旋转移位、分离移位必须完全矫正","缩短移位在成人下肢骨折不超过 2cm","儿童若无骨骺损伤，下肢缩短在 2cm 以内","成角移位：下肢骨折轻微的向前或向后成角，日后可自行矫正","长骨干横形骨折，骨折端对位至少达 1/3 左右，干骺端骨折至少应对位 3/4左右"],"B",1,"lc","运动与骨外科","复位标准要求：旋转、分离移位必须完全矫正；成人下肢骨折缩短不超过1cm，上肢不超过2cm；儿童无骨骺损伤时下肢缩短2cm以内、轻度成角可自行矫正；长骨干横形骨折端对位至少1/3，干骺端至少3/4。故B项“成 ",["谐振学说","声电波学说","皮层干扰学说","场力学说","超导电性学说"],"C",1,"lc","临床综合","毫米波的生物学作用机制主要有谐振（谐振吸收）学说、声电波学说、场力学说和超导电性学说，分别从细胞膜受体振动、声电振荡、场力作用和超导结构解释其非热效应。皮层干扰学说并不属于公认的毫米波作用机制，与其他选项不属同一体系，故C不正确。\n\n📚 出处：《康复医学》第6版·物理治疗（毫米波疗法）"],["关于泪腺多形性腺癌的叙述，以下错误的是",["多见于中青年","可由泪腺多形性腺瘤转化而来","眼球突向外上方","肿物质地坚硬，可有压痛","CT"],"C",1,"lc","临床综合","泪腺位于眶外上方的泪腺窝内，肿物生长必然将眼球推向内下方，故眼球突出方向应为内下方而非外上方，C错误。多形性腺癌多见于中青年，可由多形性腺瘤恶变而来，肿块质硬、可有压痛，CT示泪腺增大、边缘不规则并可有骨质破坏，A、B、D、E均符合。\n\n📚 出处：《眼科学》第9版·眼眶病（泪腺肿瘤）"],["新生儿的正常髋臼角为",["30°～40°","23°～28°","20°～25°","小于 20°","大于 40°"],"A",1,"lc","儿科","新生儿髋臼角（髋臼指数）正常约30°～40°，随年龄增长逐渐减小，1岁约25°，10岁左右降至20°以下，故A正确。髋臼角增大提示髋臼发育浅、对股骨头覆盖不足，是发育性髋关节发育不良（DDH）的重要影像学指标，需结合Graf超声分型或骨盆正位片随访；B、C、D为年长儿或成人正常值，E提示明显发育不良。\n\n📚 出处：《外科学》第9版·发育性髋关节发育不良"],["6 岁女孩，外伤致伸直型肱骨髁上骨折，手法复位石膏外固定后 5 小时后出现手麻，主动活动障碍，手发凉。此时的治疗应采取",["观察 1 天，视情况采用相应措施","立即拆除石膏，改用骨牵引治疗","应用血管扩张剂","手术探查，手术治疗","臂丛麻醉"],"B",1,"lc","运动与骨外科","伸直型肱骨髁上骨折复位石膏固定后5小时即出现手麻、主动活动障碍、手发凉，提示肱动脉受压、前臂骨筋膜室压力增高，为缺血性肌挛缩（Volkmann）前兆，应立即拆除石膏解除外固定压迫，改用骨牵引维持复位，同时观察末梢循环与感觉运动。观察1天或仅用血管扩张剂会延误致残；手术探查适用于血管断裂、开放性骨折或闭合复位失败者，本例首选解除压迫。\n\n📚 出处：《外科学》第9版·上肢骨关节损伤·肱骨髁上骨折"],["如果要在黏膜、皮肤紫外线照射后获得同样效应，则黏液的剂量比皮肤",["相差无几","大一倍","大两倍","大三倍","皮肤量的 1/2"],"B",1,"lc","皮肤性病","紫外线红斑效应取决于组织对紫外线的吸收与反应性。黏膜表面湿润、血供丰富、上皮层虽薄但代谢与修复活跃，对紫外线的敏感性低于角化的皮肤，因此要在黏膜获得与皮肤相同的红斑效应，所需剂量须加大，约为皮肤的一倍，故B成立。A“相差无几”低估差异，E反而减少剂量，C、D则夸大了相差倍数。\n\n📚 出处：《皮肤性病学》第9版·紫外线的生物学效应"],["确诊风湿热的主要表现不是",["心脏炎","关节酸痛","舞蹈病","环形红斑","皮下结节"],"B",1,"lc","风湿免疫","风湿热的主要表现按 Jones 标准为五项：心脏炎、多发性游走性关节炎、舞蹈病、环形红斑、皮下结节。B 关节酸痛只是非特异性前驱症状，不属主要表现；必须是活动性、多发性、游走性的大关节炎才计数，单纯关节酸痛不能作为诊断依据。心脏炎（A）、舞蹈病（C）、环形红斑（D）、皮下结节（E）均为公认主要表现，故不属主要表现的是 B。\n\n📚 出处：《内科学》第9版·风湿热"],["位于视交叉部位的肿瘤所致的常见视野改变为",["右侧偏盲","双颞侧偏盲","双鼻侧偏盲","一眼全盲，另一眼颞侧偏盲","双眼颞侧 1/4 偏盲"],"B",1,"lc","眼耳鼻喉口腔","视交叉处来自鼻侧的视网膜神经纤维交叉到对侧，来自颞侧的纤维不交叉。视交叉中部受压（垂体瘤、颅咽管瘤）时双鼻侧纤维同时受损，出现双颞侧偏盲，故B正确。A单侧偏盲提示视交叉以后的视束、视放射或枕叶病变；C双鼻侧偏盲多见于双侧颈内动脉硬化压迫视交叉外侧；D为视神经与视交叉同时受累；E为不完全受损的早期表现。\n\n📚 出处：《眼科学》第9版·神经眼科学·视路病变"],["关于肾自截，以下说法错误的是",["结核性脓肾","全肾钙化","肾功能完全丧失","肾动脉栓塞","肾盂肾盏纤维化闭塞"],"D",1,"lc","泌尿系统","肾自截为肾结核晚期表现：结核性脓肾致肾盂肾盏及输尿管纤维化闭塞、干酪样坏死物钙化，全肾钙化  出处：《外科学》第9版·颈椎病·神经根型颈椎病"],["关于前列腺癌穿刺活检的指征，以下不正确的是",["直肠指诊发现结节","B 超发现前列腺低回声结节","MRI 发现异常信号","PSA＞10ng/ml，任何 f-PSA/t-PSA 均应行穿刺活检","PSA4～10ng/ml，均可不进行穿刺活检"],"E",1,"lc","泌尿系统","前列腺穿刺活检指征：①直肠指诊发现质硬结节；②经直肠超声见低回声结节；③MRI（尤其多参数MRI）发现可疑病灶（PI-RADS≥3）；④PSA＞10ng/ml 无论 f/t 比值高低均应穿刺；⑤PSA 4～10ng/ml（灰区）则需结合 f-PSA/t-PSA 比值（<0.16 提示癌）、PSAD、影像学等综合判断，并非\"均可不穿刺\"——若比值低或影像可疑仍应穿刺。\n故\"PSA4～10 均可不进行穿刺活检\"不正确（E）。\n\n📚 出处：《中国泌尿外科和男科疾病诊断治疗指南(2019)》《前列腺癌诊断治疗指南》"],["关于卵巢粘液性囊腺瘤的声像图特点，下述哪一项错误",["囊腔内较多分隔","肿瘤体积增大","无回声区内有细小点状回声","囊内无分隔","少数有乳头生长"],"D",1,"lc","妇产科","卵巢黏液性囊腺瘤体积常较大、呈多房，囊内有较多分隔，分隔较薄，囊液黏稠含黏液蛋白而出现细小点状回声，少数囊壁或隔上可有乳头生长。故“囊内无分隔”与黏液性囊腺瘤的多房分隔特征相反，为错误项。\n\n📚 出处：《超声医学》第6版·女性生殖系统"],["肿瘤经照射后一段时间，细胞的乏氧水平可低于照射前，是因为发生了",["再群体化","放射损伤修复","乏氧细胞再氧合","细胞周期再分布","以上均不对"],"C",1,"lc","基础与预防医学","照射后氧合好的细胞先被杀灭，瘤体缩小、血供改善、组织间压力下降，原位于乏氧区的细胞重新获得氧供，即乏氧细胞再氧合，使残余细胞乏氧比例低于照射前，故 C 正确。A 再群体化指存活细胞增殖致瘤体再长大，不改变氧合状态；B 放射损伤修复指亚致死、潜在致死损伤被修复，影响存活分数而非氧张力；D 细胞周期再分布指细胞同步化于放射敏感时相，与乏氧无直接关系。\n\n📚 出处：《肿瘤放射治疗学》·放射生物学中的“4R”"],["Th2 细胞不能分泌的细胞因子是",["IL-4","IL-5","IFN-γ","IL-6","IL-10"],"C",1,"lc","基础与预防医学","Th2 细胞主要分泌 IL-4、IL-5、IL-6、IL-10、IL-13，促进 B 细胞增殖分化、IgE 类别转换并拮抗 Th1 反应，故 A、B、D、E 均为其产物。IFN-γ 是 Th1 细胞的标志性细胞因子（NK、CTL 亦可产生），主要激活巨噬细胞、促进 IgG 类别转换并抑制 Th2 增殖，Th2 不能分泌，故选 C。\n\n📚 出处：《医学免疫学》第7版·T 淋巴细胞介导的细胞免疫"],["关于女性生殖器官的叙述，以下错误的是",["卵子经输卵管运行","子宫能产生月经","胎儿在子宫内孕育","子宫腔容量为 5ml","卵巢只产生卵子"],"E",1,"lc","基础与预防医学","E 错误：卵巢除产生、排出卵子外，还分泌雌激素、孕激素及少量雄激素，参与月经周期和第二性征的维持。A 卵子排出后由输卵管伞拾取、在壶腹部受精并向子宫运行，正确；B 子宫内膜在卵巢激素周期性作用下增生、分泌、脱落形成月经，正确；C 受精卵在子宫腔内着床并孕育胎儿，正确；D 非孕子宫腔容量约 5ml，正确。\n\n📚 出处：《系统解剖学》第9版·女性生殖系统"],["肝硬化患者血清免疫学检查，发现免疫球蛋白的 IgM 显著增加，血清抗线粒体抗体强阳性(1:128)。最可能的诊断是",["肝炎后肝硬化","原发性胆汁性肝硬化","酒精性肝硬化","血吸虫性肝硬化","血色病所致肝硬化"],"B",1,"lc","消化系统","抗线粒体抗体强阳性（1∶128）伴IgM显著升高，是原发性胆汁性胆管炎的特异性免疫学标志，该病中年女性多见，以乏力、瘙痒、ALP及GGT显著升高为特点，故B正确。肝炎后肝硬化以IgG升高为主；酒精性肝硬化多IgA升高；血吸虫性肝硬化、血色病性肝硬化均无AMA阳性。\n\n📚 出处：《内科学》第9版·自身免疫性肝病·原发性胆汁性胆管炎"],["男，58岁，上腹痛1个月，既往有胃溃疡病史20年。胃镜见胃角2.0cm×2.0cm溃疡。给予质子泵抑制药治疗8周，症状缓解。复查胃镜：胃角1.2cm×1.2cm溃疡。治疗失败最可能的原因是",["特殊溃疡","溃疡癌变","非消化性溃疡","药物疗程不足","药物选择错误"],"B",1,"lc","消化系统", ～10cm"],"D",1,"lc","妇产科","妊娠期子宫肌细胞肥大、伸长，肌壁厚度在早中期增加，但至妊娠晚期随子宫容积急剧增大，肌壁反而逐渐变薄，足月时约0.5～1cm，故D所称“逐渐增厚直至足月”错误。其余正确：早期子宫增大以前后径最明显（使子宫由梨形变球形）、子宫峡部极软（Hegar征）、孕晚期约80%子宫右旋、足月下段可伸长至7～10cm。\n\n📚 出处：《妇产科学》第9版·妊娠生理"],["男性，3岁，身高65cm。平日安静少动，腹胀，经常便秘。体检：智力低下，舌厚而大，皮肤粗糙。腕骨骨化中心一个，T4下降，TSH上升。首选治疗为",["生长激素","甲状腺素片连服1年","维生素D＋钙片","甲状腺素片，服至青春期","甲状腺素片，终身服药"],"E",1,"lc","消化系统","患儿身材矮小、智力低下、舌厚大、皮肤粗糙、便秘腹胀、骨龄明显落后，T4降低而TSH升高，为先天性甲状腺功能减退症（呆小症）。甲状腺激素对脑及骨骼发育至关重要，替代治疗须尽早、足量并终身服用，擅自停药将导致生长停滞与智能损害，故E正确。生长激素、维生素D加钙均非针对病因；仅服1年或服至青春期都会复发并遗留智力障碍。\n\n📚 出处：《儿科学》第9版·先天性甲状腺功能减退症"],["下列哪项不是三度房室传导阻滞的心电图特点",["P 波与 QRS 波互不相关","R-R 间距相等","P-P 间距相等","心室率快于心房率","心室率常为 30～50 次/分"],"D",1,"lc","心血管系统","三度（完全性）房室传导阻滞时心房、心室各自独立激动：P波与QRS波互不相关，P-P间距规则、R-R间距规则，且心房率快于心室率（R-R>P-P），心室率常30～50次/分（逸搏点越低越慢）。故“心室率快于心房率”与本病根本矛盾，为错误项，选D。\n\n📚 出处：《诊断学》第9版·心电图·房室传导阻滞"],["CT 检查见胆囊缩小、变形，壁不均匀增厚，对比增强有强化，胆囊壁内有多发的小点状高密度影。首先应考虑为",["慢性胆囊炎","急性胆囊炎","胆囊结石","胆囊腺肌瘤病","胆囊癌"],"D",1,"lc","消化系统","胆囊缩小、壁不均匀增厚、增强扫描有强化，且壁内见多发小点状高密度影，为壁内罗-阿氏窦（Rokitansky-Aschoff窦）扩张并含小结石或钙化的表现，是胆囊腺肌瘤病的典型CT征象，故D正确。慢性胆囊炎壁增厚较均匀、无壁内点状高密度；急性胆囊炎胆囊增大、壁水肿伴周围渗出；胆囊癌为软组织肿块伴壁破坏浸润；胆囊结石位于腔内。\n\n📚 出处：《医学影像学》第9版·胆道疾病·胆囊腺肌症"],["骨样骨瘤的病变特点应除外",["好发于下肢骨、脊椎骨","患骨疼痛明显","肿瘤多位于骨皮质，直径常＞2cm","X线检查可见放射状透光性瘤巢","瘤巢由纤细的致密骨样组织小梁构成"],"C",1,"lc","运动与骨外科","骨样骨瘤的瘤巢由纤细的致密骨样组织小梁与血管性结缔组织构成，直径多在1.5cm以内（常小于1cm），故“直径常＞2cm”不符合。好发于股骨、胫骨等下肢长骨及脊椎骨；典型症状为夜间剧痛、服水杨酸类药物可缓解，局部压痛明显；X线示皮质内透光瘤巢，周围大片致密硬化骨包绕。\n\n📚 出处：《外科学》第9版·骨肿瘤·骨样骨瘤"],["腓神经瘫痪所用踝足矫形器应是",["帮助跖屈","帮助背伸","锁定于中立位","金属直立支架","内侧 T 形带"],"B",1,"lc","神经与精神","腓总神经损伤或瘫痪时胫前肌、趾长伸肌、腓骨长短肌失神经支配，出现足下垂内翻（跖屈位），行走需高抬腿呈跨阈步态，易绊倒。踝足矫形器（AFO）的作用是辅助踝背伸、把踝关节控制于功能位，防止足下垂与尖足畸形，改善步态与稳定性，故应“帮助背伸”。若帮助跖屈或锁定中立位，则摆动期无法保证足尖离地；金属直立支架、内侧 T 形带属具体结构设计细节，不是主要功能定位。\n\n📚 出处：《康复医学》第6版·康复工程·矫形器"],["肾病综合征有以下特点，除了",["水肿程度与低蛋白血症程度一致","水钠潴留不依赖 RAAS 变化","常存在高凝状态","不会出现急性肾衰竭","可造成维生素 D 缺乏"],"D",1,"lc","泌尿系统","肾病综合征的特点包括：水肿（与低蛋白血症程度大致平行）、水钠潴留（既有 RAAS 激活，也有原发性水钠潴留，故\"不依赖RAAS\"成立）、高凝状态（抗凝因子从尿中丢失、肝脏合成纤维蛋白原增加、血小板聚集增强，易血栓）、可因维生素D结合蛋白丢失而致维生素D缺乏、低钙。\n而\"不会出现急性肾衰竭\"是错误的——肾病综合征可因严重血容量不足、肾间质水肿、大量蛋白管型堵塞肾小管、或合并感染/药物（NSAIDs "错。故为 B。\n\n📚 出处：《内科学》第9版·急性肾损伤·水电解质紊乱"],["关于缺铁性贫血的发病过程，以下正确的是",["血清铁降低→红细胞减少→小细胞低色素→骨髓铁减少","骨髓铁减少→血清铁降低→红细胞减少→小细胞低色素","血清铁降低→骨髓铁减少→小细胞低色素→红细胞减少","骨髓铁减少→血清铁降低→小细胞低色素→红细胞减少","红细胞减少→小细胞低色素→血清铁降低→骨髓铁减少"],"B",1,"lc","血液系统","缺铁是渐进过程：先贮存铁耗竭使骨髓铁减少、铁蛋白降低，继而血清铁下降、总铁结合力升高（红细胞生成缺铁期），进一步血红蛋白合成不足致红细胞生成减少，最后才出现红细胞体积缩小、中心淡染的小细胞低色素形态。故正确顺序为骨髓铁减少→血清铁降低→红细胞减少→小细胞低色素。\n\n📚 出处：《内科学》第9版·缺铁性贫血"],["烧伤后防止应激性溃疡的核心措施是",["使用制酸剂抑制胃酸分泌","营养支持","改善胃肠道组织灌流","抑制胃蛋白酶活性","加强黏膜保护"],"E",1,"lc","外科总论与麻醉","烧伤后应激性溃疡（Curling溃疡）的病理基础是胃黏膜缺血、屏障受损与H⁺反向弥散，因此防治的核心是加强黏膜保护：维持黏膜血流、应用前列腺素及硫铝糖等黏膜保护剂，必要时联合抑酸药维持胃内pH＞4，故E正确。单纯制酸（A）、抑制胃蛋白酶（D）只是辅助；营养支持（B）与改善灌注（C）虽重要，但保护屏障才针对核心环节。\n\n📚 出处：《外科学》第9版·烧伤"],["患儿男，6 岁，生后即发现右耳畸形。查体：右耳垂可见，其余耳廓部分明显小于健侧，不规则，内有少量软骨，耳轮、对耳轮、耳甲腔等结构不存在。在现有的条件下，手术时形成新的外耳支架的最可行、最安全可靠的处理方法是",["塑形，形成新的完整的支架","将卷曲的软骨打开，与另取并雕刻的肋软骨进行拼接形成新的支架","将耳软骨取出，利用组织工程学方法在体外形成支架并适时植入体内","将原有耳软骨全部剔除弃用，另取肋软骨雕刻形成支架","将原有耳软骨全部剔除弃用，以人工组织代用品作为外耳支架"],"B",1,"lc","儿科","小耳畸形残存耳软骨量少、形态不规则、结构缺失，单独塑形难以获得足够支撑；而全部弃用又浪费了自体组织并增加肋软骨取材量。将卷曲残存的耳软骨解剖展开后，与另取并雕刻的自体肋软骨拼接成新支架，既利用了原有组织又保证支撑强度，是最可行、最安全可靠的方法，故B正确。组织工程支架及人工代用品存在吸收、排异、外露风险。\n\n📚 出处：《整形外科学》·先天性小耳畸形耳郭再造"],["抗低血容量休克治疗时，指导补液量和速度最有意义的参考指标是",["心率","尿量","血压","肘静脉压","中心静脉压"],"E",1,"lc","儿科","中心静脉压反映右心前负荷，可判断血容量是否充足、右心功能及输液速度是否恰当，指导抗低血容量休克的补液量和速度，故E最有意义。血压下降在急性失血早期可因代偿而维持，不够敏感；心率受疼痛、情绪影响；尿量提示肾灌注，需时较长；肘静脉压受静脉瓣与体位影响，不能反映中心静脉压。\n\n📚 出处：《外科学》第9版·低血容量性休克"],["癫痫全身性发作，不包括",["失神发作","肌阵挛发作","失张力发作","强直性发作","杰克逊发作"],"E",1,"lc","神经与精神","ILAE 发作分类中，全面性（全身性）发作起源于双侧网络，包括失神发作、肌阵挛发作、阵挛发作、强直发作、强直-阵挛发作、失张力发作及痉挛发作，脑电图多为双侧同步对称的全面性放电。杰克逊发作属局灶性发作中的单纯部分性运动性发作，由一侧运动区异常放电按皮层代表区顺序扩散，意识保留，故不属全身性发作。\n\n📚 出处：《神经病学》第8版·癫痫·发作类型"],["下列哪项不符合小儿原发综合征的临床表现",["胸片示“双极影”","结核菌素试验强阳性","低热、盗汗","胸片上肺叶有空洞形成","食欲减退、消瘦"],"D",1,"lc","儿科","小儿原发综合征由原发病灶、淋巴管炎和肿大淋巴结构成，X线呈“哑铃状”或“双极影”，伴低热、盗汗、食欲减退、消瘦及结核菌素试验强阳性，故A、B、C、E符合。原发型肺结核很少形成空洞，空洞主要见于继发型肺结核（浸润型）及干酪性肺炎，故D不符合，为答案。若出现空洞提示病变进展或已属继发型。\n\n📚 出处：《儿科学》第9版·原发型肺结核"],["下列哪项不是羊水栓塞的病理生理变化",["肺动脉高压及呼吸循环功能障碍","过敏性休克","弥漫性血管内凝血","全身小动脉痉挛","肾衰"],"D",1,"lc","妇产科","羊水栓塞的病理生理三个阶段：①肺动脉高压、肺水肿与呼吸循环衰竭（羊水有形成分栓塞肺血管、 《内科学》第9版·慢性胃炎·胃癌前状态"],["48 岁女性，外阴奇痒 8 年。长期应用皮炎平治疗，起初效果较好，后疗效减弱，现时常烦躁，难以入睡。妇科检查：阴蒂处皮肤色素略减退并萎缩，可见多角性略高扁平丘疹，大小阴唇形态尚正常，阴道通畅，分泌物外观正常，宫颈光滑，子宫后位，正常大，双附件(-)。患者外阴活检提示 VINⅢ，下一步如何治疗",["观察等待其自然消退","冷冻或激光治疗","扩大的局部病灶切除术(距病灶边缘 1cm)","单纯外阴切除术","术中送快速病理，如为浸润癌则行外阴皮肤切除术＋双侧腹股沟淋巴结清扫"],"C",1,"lc","妇产科","VINⅢ为高级别癌前病变，有进展为浸润癌的风险，标准治疗为扩大局部病灶切除，切缘距病灶1cm左右，兼可获完整病理以排除浸润癌。观察等待仅适于年轻、妊娠期低级别病变；冷冻、激光破坏性治疗无法评估切缘与浸润；单纯外阴切除损伤过大。E为术中冰冻证实浸润癌后改行的术式。\n\n📚 出处：《妇产科学》第9版·外阴上皮内瘤变"],["关于亚急性甲状腺炎的说法，以下正确的是",["与细菌感染有关","老年人多见","又称肉芽肿性甲状腺炎","男性多于女性","不会出现甲状腺功能异常"],"C",1,"lc","内分泌与代谢","亚急性甲状腺炎病理上为滤泡破坏、肉芽组织与多核巨细胞增生形成肉芽肿，故又称肉芽肿性甲状腺炎（de Quervain甲状腺炎），答C。其病因为病毒感染后免疫反应，并非细菌感染；好发于20～50岁女性，女性明显多于男性；病程典型分三期，滤泡破坏释出储存激素时出现一过性甲亢，继而可短暂甲减后恢复，故“不会出现甲状腺功能异常”错误。\n\n📚 出处：《内科学》第9版·亚急性甲状腺炎"],["眼眶炎性假瘤与 Graves 眼病均可能出现",["眼球突出","眼肌麻痹","球结膜水肿","视神经受累","以上均可"],"E",1,"lc","眼耳鼻喉口腔","两者同属眼眶非特异性炎症或自身免疫性病变，均可出现眼球突出、眼外肌受累致眼球运动障碍与复视、球结膜充血水肿，眶尖受压时可累及视神经使视力下降，故E正确。鉴别要点：Graves眼病多双眼受累、伴甲状腺功能异常，影像示肌腹增粗而肌腱不受累；炎性假瘤多为单眼、疼痛显著、对激素敏感，影像示肌腱亦增粗。A~D仅各述其中一个共同表现。\n\n📚 出处：《眼科学》第9版·眼眶病·眼眶炎症"],["调节呼吸运动最重要的理化因素是",["O2","CO2","H﹢","Na﹢","K﹢"],"B",1,"lc","呼吸系统","CO2是调节呼吸最重要、最经常起作用的化学刺激，既透过血脑屏障兴奋延髓中枢化学感受器（占主要作用，约80%），又刺激外周化学感受器，PaCO2小幅升高即可显著增加通气。低氧仅通过颈动脉体、主动脉体起效，作用较弱，且重度低氧直接抑制呼吸中枢；H⁺透过血脑屏障能力差，作用受限；Na⁺、K⁺不参与呼吸调节。\n\n📚 出处：《生理学》第9版·呼吸·呼吸运动的化学调节"],["23 岁女性，G1P0，妊娠 33 周，产前经过顺利。因夫妻同房后腹痛半天，阴道少量流血来院。检查：贫血貌，血压 106/70mmHg，心率 110 次/分，子宫较孕月大，宫高 32cm，子宫张力大，并有轻压痛，胎位胎心不清。Hb70g/L，红细胞压积 28%。此患者最佳处理方法是",["人工破膜","阴道触诊","剖宫产","期待疗法","吸氧，输新鲜血液"],"C",1,"lc","妇产科","孕33周同房后突发腹痛伴少量阴道流血，子宫较孕月大、张力高、压痛、胎位胎心不清，伴贫血与心率增快，符合胎盘早剥（性交后血管破裂可诱发）。母体出现休克倾向、胎儿窘迫，应及时剖宫产终止妊娠，同时输血、纠正休克。期待疗法与人工破膜均延误救治；阴道触诊可能加重出血并延误手术。\n\n📚 出处：《妇产科学》第9版·胎盘早剥"],["关于膀胱癌的 CT 表现，错误的是",["突入膀胱腔内的结节肿物","肿瘤可以是单发，也可以是多发","肿瘤可以是带蒂生长","肿瘤累及黏膜下层和肌层，表现为膀胱壁增厚","可区分肿瘤限于黏膜内或侵入黏膜下层"],"E",1,"lc","泌尿系统","CT可显示突入膀胱腔的结节或肿块、单发或多发、带蒂或广基，肿瘤浸润黏膜下层和肌层表现为膀胱壁局限性增厚。但CT软组织分辨率有限，不能分辨肿瘤仅局限于黏膜（Ta/原位癌）还是已侵及黏膜下层（T1），该层次判断须靠膀胱镜加活检病理。A~D均正确。故答E。\n\n📚 出处：《医学影像学》第8版·泌尿系统疾病（膀胱肿瘤）"],["患者，女性，30 岁。产后 28 天，阴道突然大量出血，色红，有血块，伴有头晕、心慌。妇科检查：子宫大而软，宫口松弛，鲜血自宫腔流出，可见残留的胎盘组织。应诊断为",[ 止骨破坏需与DMARD联用（D），判定疗效至少需2周（E）。\n\n📚 出处：《药理学》第9版·解热镇痛抗炎药"],["皮肤纤维瘤的主要临床特点为",["好发于躯干","皮疹为棕红、黄褐至黑褐色的圆形、卵圆形坚实丘疹","皮疹易于破溃","泛发性皮肤纤维瘤好发于儿童","皮损多伴有轻度疼痛或瘙痒"],"B",1,"lc","皮肤性病","皮肤纤维瘤为成纤维细胞增生的良性肿瘤，好发于小腿及四肢而不是躯干（A错）；典型皮损为棕红、黄褐至黑褐色圆形或卵圆形坚实丘疹、结节，表面光滑，捏起两侧呈“酒窝征”，即B所述；皮损一般不破溃（C错）；患者多无自觉症状或仅偶有轻微痒痛，而非“多伴有”明显痒痛（E错）；泛发型罕见，与年龄无关（D错）。\n\n📚 出处：《皮肤性病学》第9版·皮肤纤维瘤"],["女，45岁，不规则阴道流血2个月，性交后出血。宫颈锥切标本显微镜下可见低分化鳞状细胞癌，间质浸润深度2mm，宽度6mm。正确的分期为",["ⅠA2期","ⅠB1期","ⅠB2期","ⅡA期","ⅠA1期"],"E",1,"lc","妇产科","宫颈癌分期：间质浸润深度≤3mm、水平扩散≤7mm为ⅠA1；深度3～5mm、宽度≤7mm为ⅠA2；肉眼可见病灶或镜下>ⅠA2为ⅠB。本例浸润深度2mm、宽度6mm，属微小浸润癌ⅠA1期。ⅠB1为间质浸润≥5mm且病灶≤4cm，ⅡA为侵及阴道上2/3无宫旁浸润。\n\n📚 出处：《妇产科学》第9版·子宫颈癌"],["能选择性地抑制虫体肌肉内的琥珀酸脱氢酶，影响虫体肌肉的无氧代谢，使虫体麻痹的抗肠线虫药是",["噻苯达唑","左旋嘧唑","甲苯达唑","氟苯咪唑","阿苯达唑"],"B",1,"lc","消化系统","左旋咪唑的作用机制是选择性抑制虫体肌肉内的琥珀酸脱氢酶，阻断延胡索酸还原为琥珀酸的无氧代谢，使虫体肌肉麻痹并随粪便排出，故B正确（选项中左旋嘧唑即左旋咪唑）。噻苯达唑、甲苯达唑、氟苯咪唑、阿苯达唑均以抑制微管蛋白聚合、阻断葡萄糖摄取为主要机制，与本描述不符。\n\n📚 出处：《药理学》第9版·抗肠蠕虫药"],["以下疾病中，与日光照射相关的是",["老年疣","老年角化病","角化棘皮瘤","鲍温病","色素痣"],"B",1,"lc","临床综合","日光性角化病（老年角化病）由长期紫外线照射引起，属癌前病变，好发于面、手背等曝光部位，表现为覆黏着性鳞屑的红斑。老年疣与老化、遗传有关；鲍温病与砷、HPV等有关；角化棘皮瘤虽也与日晒相关，但更强调其临床形态与自愈倾向；色素痣为黑素细胞良性增生，故选B。\n\n📚 出处：《皮肤性病学》第9版·皮肤肿瘤（日光性角化病）"],["关于肘关节脱位，下列哪项是错误的",["被动活动时肘不能伸直","肘后三角的关系仍正常","可因过度肿胀延误处理而发生前臂缺血性挛缩","可合并骨折","复位后需固定 2～3 周"],"B",1,"lc","运动与骨外科","肘关节后脱位时尺骨鹰嘴向后移位，肱骨内、外上髁与尺骨鹰嘴三点关系破坏，肘后三角失去正常等腰三角形形态（Hüter三角改变），此点是与肱骨髁上骨折鉴别的重要体征，故“肘后三角关系仍正常”错误。脱位后因疼痛与肌肉痉挛肘不能被动伸直；严重肿胀处理不及时可致前臂缺血性肌挛缩；常合并内上髁、冠状突或桡骨小头骨折；复位后屈肘90°固定2～3周。\n\n📚 出处：《外科学》第9版·关节脱位·肘关节脱位"],["眶下神经阻滞的适应证是",["牙周炎所致的上牙疼痛","鼻窦炎所致的上颌部疼痛","三叉神经第二支疼痛和其他情况引起的下眼睑、鼻旁、上唇、上颌中切牙","和尖牙等部位的疼痛 三叉神经眼支(第一支)疼痛","三叉神经下颌支(第三支)疼痛"],"C",1,"lc","神经与精神","眶下神经为三叉神经第二支（上颌神经）的终末支，经眶下孔出眶，支配下眼睑、鼻侧及鼻旁、上唇、上颌中切牙与尖牙及前磨牙区域的皮肤与黏膜感觉。故眶下神经阻滞适用于三叉神经第二支疼痛及上述部位的无痛治疗。牙周炎所致上牙痛、鼻窦炎所致上颌部疼痛属原发病症状，须治疗原发病；眼支疼痛应行眶上神经阻滞；下颌支疼痛应行下牙槽神经或颏神经阻滞。\n\n📚 出处：《口腔颌面外科学》第8版·口腔颌面部神经疾患·三叉神经痛"],["正常情况下，外周血中Hb主要为",["还原Hb","高铁Hb","硫化Hb","碳氧Hb","氧合Hb"],"E",1,"lc","血液系统","正常成人外周血血红蛋白绝大部分（约95%以上）与氧结合为氧合血红蛋白（HbO₂），仅少量为还原血红蛋白；高铁血红蛋白<2%、碳氧血红蛋白<2%（吸烟者略高）、硫化血红蛋白仅微量。故外周血Hb主要为氧合血红蛋白。\n\n📚 出处：《生理学》第9版·血液的组成与理化特性"],["下述甲状腺疾病中哪一种必须手术",["结节性甲状腺肿继发甲亢","妊娠早期甲状腺肿","青春期甲状腺肿","轻度原发性甲状腺功能亢进","青少年甲亢"],"A",1,"lc","内分泌与代谢","结节性甲状腺肿继发甲亢（毒性多结节性甲状腺肿）结节多发、摄碘率不一、药物治疗易复发，且可能掩盖合并的恶性结节、常有压迫症状，故为明确手术适应证，答A。青春期甲状腺肿和妊娠早期甲状腺肿系生理需碘增加所致，以观察、补碘为主；轻度原发性甲亢首选抗甲状腺药物或131I；青少年甲亢不首选手术和131I，以免复发与甲减。\n\n📚 出处：《外科学》第9版·甲状腺疾病·手术治疗适应证"],["右手环指远端缺损骨外露，下列哪种方法不适宜采用",["缩短指骨，缝合皮肤","中厚皮片植皮","带蒂皮瓣移植","推进皮瓣移植","鱼际皮瓣转位"],"B",1,"lc","运动与骨外科","环指远端缺损伴骨外露时，骨面失去血供，游离皮片（中厚皮片）无独立血供、不能成活，且无耐磨性，故不适宜。可行指骨缩短后直接缝合皮肤、带蒂皮瓣或邻指（鱼际）皮瓣转位、推进皮瓣覆盖，既保留长度又提供耐磨、有感觉的软组织垫。故选不宜者应为中厚皮片植皮。\n\n📚 出处：《外科学》第9版·手外伤·指端缺损的处理"],["关于 SLE 的治疗，下列哪项表述不正确",["关节痛，可用双氯酚酸钠","氯喹对光过敏有效","氯喹对关节炎无效","关节炎，强的松有效","CTX 对肾炎有效"],"C",1,"lc","临床综合","氯喹与羟氯喹可抗光过敏、改善皮疹及光敏性皮损，对SLE的轻型关节炎同样有效，故C“对关节炎无效”表述不正确。关节痛可用双氯芬酸等非甾体抗炎药（A），强的松对关节炎及全身活动性病变有效（D），环磷酰胺冲击对狼疮肾炎有效（E）。\n\n📚 出处：《内科学》第9版·系统性红斑狼疮（治疗）"],["患者，女，45 岁。上肢被开水烫伤，皮肤见多数较大水疱。其烧伤累及皮肤的深度为",["皮肤全层","真皮浅层","真皮深层","皮肤及皮下组织","以上都不对"],"B",1,"lc","外科总论与麻醉","开水烫伤后出现多数较大、饱满水疱，疱壁薄、基底红润、疼痛剧烈，是浅Ⅱ度烧伤的典型表现，其损伤深度为表皮全层及真皮乳头层（真皮浅层），故B正确。深Ⅱ度（真皮深层）水疱小而扁、基底红白相间、痛觉迟钝；Ⅲ度（皮肤全层）创面焦痂或蜡白、无痛觉；累及皮下组织属Ⅲ度以上损伤。\n\n📚 出处：《外科学》第9版·烧伤"],["下列哪项措施最适用于缓解期慢支的治疗",["口服抗生素预防感染","氧疗改善机体缺氧状态","增强体质、免疫治疗和呼吸体操","解痉、平喘的药物","祛痰、止咳的药物"],"C",1,"lc","临床综合","慢性支气管炎缓解期以增强体质、提高抗病能力为主：戒烟、耐寒锻炼、免疫调节剂和呼吸体操改善呼吸功能，故C最适用。缓解期无细菌感染证据，长期口服抗生素预防感染无益且促耐药（A）；无低氧血症者不需氧疗（B）；解痉平喘、祛痰止咳仅用于急性加重期对症（D、E）。\n\n📚 出处：《内科学》第9版·慢性阻塞性肺疾病（稳定期管理）"],["男性患者，35 岁，以囊性颅咽管瘤入院。临床检查发现其下丘脑受损症状明显，病人意识朦胧，腰穿压力不高。此时最适宜的治疗方式为",["开颅手术，尽可能全切肿瘤","经蝶窦入路，放出囊液，并部分切除囊壁","立体定向抽出囊液，并注入放射性同位素进行内照射","局部放疗外照射","保守治疗，对症处理"],"C",1,"lc","神经与精神","患者囊性颅咽管瘤、下丘脑受损症状明显、意识朦胧而腰穿压力不高，主要矛盾是囊液压迫下丘脑而非急性颅高压。开颅全切创伤大、下丘脑损伤风险极高；经蝶入路在鞍上扩展明显时显露困难。最适宜的是立体定向穿刺抽出囊液迅速减压、缓解下丘脑症状，并注入放射性同位素（32P、90Y 等）行囊内照射，破坏囊壁分泌细胞使囊腔缩小，创伤小、可重复，适用于高龄或不能耐受开颅者。局部放疗对囊性病变起效慢，单纯保守治疗不能解除压迫。\n\n📚 出处：《外科学》第9版·颅内肿瘤·颅咽管瘤"],["照射 75Gy 不发生严重并发症的组织是",["肾上腺","皮肤","子宫","甲状腺","肺"],"C",1,"lc","临床综合","各组织放射敏感性差异显著：肺TD5/5约30～35Gy，皮肤约55Gy，甲状腺与肾上腺约45～60Gy，照射75Gy均可造成严重放射性损伤；子宫对射线不敏感，耐受量在100Gy以上，宫颈癌根治性放疗总剂量常超过75Gy而不发生严重并发症，故选C。\n\n📚 出处：《核医学》第9版·放射性核素治疗（正常组织辐射耐受）"],["女性，66 岁，糖尿病病史 10 余年。长期口服降糖药治疗，血糖控制差。查体：身高 158cm，体重 76kg。给予人胰岛素(总量 60U/d)治疗 2 周后，血糖仍为 11.3～18.6mmol/L。目前首先考虑患者存在",["胰岛素抵抗","胰岛素抗药性","胰岛素过敏","胰岛素过量","黎明现象"],"A",1,"lc","泌尿系统","该患者肥胖（BMI≈30.4）、糖尿病 10 余年、长期口服药血糖控制差，改用人胰岛素总量 60U/d（≈0.8U/kg）治疗 2 周后血糖仍高达 11.3～18.6mmol/L。此剂量已属充分，仍无效提示胰岛素抵抗（A）：肥胖导致内脏脂肪堆积、游离脂肪酸升高、脂肪因子分泌异常，使外周组织对胰岛素敏感性显著下降。鉴别：胰岛素抗药性指每日胰岛素用量 >200U（部分标准>2U/kg）仍不能控制血糖，多与胰岛素抗体产生有关，本例仅 60U，远未达标准；胰岛素过敏表现为注射部位红肿瘙痒或全身荨麻疹；胰岛素过量应出现低血糖；黎明现象为夜间血糖正常而清晨高血糖，与本例全天血糖均高不符。故为 A。\n\n📚 出处：《内科学》第9版·糖尿病·胰岛素抵抗与胰岛素抗药性"],["肛提肌位于骨盆底的",["内层","中层","外层","浅层","深层"],"A",1,"lc","妇产科","盆底由三层肌肉构成：外层为会阴浅横肌、球海绵体肌、坐骨海绵体肌及肛门外括约肌；中层为泌尿生殖膈（会阴深横肌、尿道阴道括约肌）；内层为盆膈，由肛提肌及其筋膜组成，是支撑盆腔脏器最主要的结构。故肛提肌位于骨盆底内层（深层）。\n\n📚 出处：《妇产科学》第9版·女性生殖系统解剖"],["肾损伤施行手术时，以下哪一种说法是错误的",["一般经腰切口进入后腹膜间隙，便于发现肾脏的破口","一般经腹切口先进入腹腔，便于探查腹腔其他器官","先阻断肾蒂便于检查肾脏的损伤情况","术前应了解对侧肾功能","合并肝、脾损伤一般应先处理妥善后，再处理肾损伤"],"A",1,"lc","泌尿系统","肾损伤手术入路的原则：首选经腹切口（尤其合并腹腔脏器伤、疑有腹膜后大血肿或需探查对侧肾时），便于同时探查肝、脾、肠等腹腔器官并及时处理；经腰切口仅适用于明确的单纯肾损伤且无腹腔合并伤者。故\"一般经腰切口进入后腹膜间隙\"是错误的（A）。\n其余正确：先阻断肾蒂可控制出血、便于清晰检查损伤；术前必须了解对侧肾功能（避免切除孤立肾）；合并肝脾损伤时应先处理肝脾（出血更凶险、危及生命更快）再处理肾。\n\n📚 出处：《外科学》第9版·肾损伤·手术治疗"],["诊断手足癣需要与哪种皮肤病鉴别",["手足多形性红斑","发生在手足的湿疹","手足银屑病","发生在手足自体敏感性皮炎","先天性角化病"],"B",1,"lc","皮肤性病","手足癣与发生在手足的湿疹外观极为相似，均可见红斑、脱屑、水疱、角化增厚，故临床必须把湿疹列为首要鉴别对象：手足癣多单侧起病、境界清楚有活动边缘、真菌镜检阳性；湿疹多对称、边界不清、真菌阴性。多形性红斑以靶形损害为主，银屑病有银白色鳞屑及Auspitz征，自体敏感性皮炎有原发灶可寻，先天性角化病自幼发病，形态均不同。\n\n📚 出处：《皮肤性病学》第9版·手足癣"],["下列哪项是急性白血病诊断的主要依据",["发热、贫血、出血","白细胞计数＞50×109/L","骨髓增生极度活跃","胸骨压痛(+)","骨髓中原始细胞明显增高"],"E",1,"lc","血液系统","急性白血病的确诊依据是骨髓象：骨髓增生明显至极度活跃，原始细胞比例增高（WHO标准AML原始细胞≥20%，ALL原始+幼稚淋巴细胞≥20%），伴红系、巨核系受抑。发热、贫血、出血、白细胞>50×10⁹/L、胸骨压痛、骨髓增生极度活跃亦可见于类白血病反应或其他血液病，均不能作为诊断依据。\n\n📚 出处：《内科学》第9版·急性白血病"],["骨折的最严重并发症是",["神经损伤","畸形愈合形成肘内翻畸形","缺血性肌挛缩","骨化性肌炎","创伤性关节炎"],"C",1,"lc","运动与骨外科","缺血性肌挛缩（Volkmann挛缩）由骨筋膜室高压致肌肉神经缺血坏死，一经发生即遗留爪形手、前臂与手功能永久残废，且不可逆，是骨折最严重的并发症之一。神经损伤多可部分恢复；肘内翻、创伤性关节炎、骨化性肌炎影响功能但可矫治。本题各选项中，以缺血性肌挛缩后果最重，重者并可致截肢。\n\n📚 出处：《外科学》第9版·骨折概论·骨折的并发症"],["下列哪项是食管静脉曲张与食管癌的主要鉴别点",["膜规整","溃疡","壁柔软","隆起","梗阻"],"C",1,"lc","消化系统","鉴别食管静脉曲张与食管癌的关键在于管壁的柔软度：静脉曲张为黏膜下曲张静脉，管壁柔软、可随蠕动及充气扩张，形态可变；食管癌为浸润性生长的肿瘤，管壁僵硬、蠕动消失、不能扩张。二者都可
